tails": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cSystem File Checker\u201d by executing the command \u201csfc /scannow\u201d in an elevated command prompt to automatically find and repair system files."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.215966761243254, "y": 0.12546706674629526, "z": 0.9683059295492203, "word": "Disabling: System Restore, Windows RE", "pos_group": "other", "row_number": 669, "definition": "A process where the system-wide capability to revert the operating system to a previous state using snapshots (restore points) is deactivated to free up disk space or secure the system state.", "details": [{"label": "TROUBLESHOOTING", "value": "Search for \u201cCreate a restore point\u201d in the taskbar, select the system drive, click \u201cConfigure\u201d, and select \u201cDisable system protection\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.19140274236446322, "y": 0.10361556954960674, "z": 0.9760270508353105, "word": "Documentation: Rollback plans", "pos_group": "other", "row_number": 757, "definition": "A set of instructions for returning a system to its previous stable state if a new change or update fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the rollback steps documented in the original change request; revert to the last known good configuration or backup."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2264326368725358, "y": 0.10249305904921147, "z": 0.9686193441211494, "word": "Enabling System Restore, Windows RE", "pos_group": "other", "row_number": 840, "definition": "System Restore is a feature that allows a user to revert the computer's state (including system files, installed apps, and registry) to a previous point in time, accessed via the Windows Recovery Environment (Windows RE).", "details": [{"label": "TROUBLESHOOTING", "value": "Boot the computer into Windows RE (often by holding Shift during a restart or interrupting the boot process), navigate to Troubleshoot > Advanced Options > System Restore, and select a functional restore point from the provided list to revert changes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.19936605039633687, "y": 0.12867261395507223, "z": 0.9714404440660963, "word": "End-of-life/end-of-support, OS", "pos_group": "other", "row_number": 851, "definition": "The date after which an operating system developer no longer provides security patches, technical support, or updates, leaving the OS vulnerable to new exploits.", "details": [{"label": "TROUBLESHOOTING", "value": "Plan for a migration to a supported version of the operating system. If migration is impossible, isolate the machine from the network (air-gap) to mitigate exposure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.20252011803385023, "y": 0.08937143388903154, "z": 0.9751914420236542, "word": "Files: SFC", "pos_group": "other", "row_number": 956, "definition": "System File Checker (SFC) is a built-in Windows command-line utility that scans all protected operating system files for corruption and replaces damaged elements with verified cached copies from the local driver store folder.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch an elevated command terminal window session with administrative rights, and execute the immediate scan command instruction \u201csfc /scannow\u201d to trace, analyze, and repair broken system components."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.22729817248776693, "y": 0.12126604621999658, "z": 0.9662453553926617, "word": "Flashing the BIOS", "pos_group": "other", "row_number": 989, "definition": "The process of overwriting the motherboard\u2019s firmware (BIOS/UEFI) with a newer version to add support for new hardware, fix bugs, or improve system security.", "details": [{"label": "TROUBLESHOOTING", "value": "Download the correct firmware file from the motherboard manufacturer\u2019s website, place it on a FAT32-formatted USB drive, and use the \u201cBIOS Flash\u201d tool within the UEFI settings; never turn off the computer during the update, as this will brick the board."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.18579380012355828, "y": 0.1149982672400316, "z": 0.9758360837596843, "word": "Go back to the previous version, Windows RE", "pos_group": "other", "row_number": 1000, "definition": "A recovery utility within the Windows Recovery Environment (Windows RE) that allows users to roll back to a prior build of the operating system if a major update results in critical system instability.", "details": [{"label": "TROUBLESHOOTING", "value": "Force the system to boot into \u201cWindows RE\u201d (e.g., by interrupting boot three times), select \u201cTroubleshoot > Advanced options\u201d, and click \u201cGo back to the previous version\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2225676449952079, "y": 0.09013418856852026, "z": 0.9707417120183832, "word": "Hard drives: Replacing", "pos_group": "other", "row_number": 1039, "definition": "The physical process of removing a faulty or obsolete storage device and installing a new unit.", "details": [{"label": "TROUBLESHOOTING", "value": "Back up all data, shut down the system, remove the chassis side panel, disconnect power and data cables, unscrew the drive from its mounting bay, insert the new drive, reconnect all cables, and install the operating system/restore data."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21097558716961348, "y": 0.13483293360000384, "z": 0.9681473966474599, "word": "Image recovery, Windows RE", "pos_group": "other", "row_number": 1102, "definition": "The use of Windows RE (Windows Recovery Environment) to restore a system to a previously captured state or a factory default image following a catastrophic system failure or data corruption.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot into Windows RE by interrupting the startup process three times, select \u201cTroubleshoot > Advanced Options\u201d, and use \u201cSystem Image Recovery\u201d to point the system to the backup location of the image file."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.1893085670093609, "y": 0.09329749291488662, "z": 0.9774752397235742, "word": "Missing/corrupt system files, troubleshooting", "pos_group": "other", "row_number": 1456, "definition": "The process of repairing system files that have been deleted, damaged, or modified, which can lead to system instability or failure to boot.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the System File Checker tool by executing the command \u201csfc /scannow\u201d in an elevated command prompt; if that fails, use the DISM tool with the command \u201cdism /online /cleanup-image /restorehealth\u201d to download fresh system files from Windows Update."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.23458303665738728, "y": 0.10886439519736435, "z": 0.9659810258855558, "word": "Mobile devices: Resetting", "pos_group": "other", "row_number": 1469, "definition": "Returning a mobile device to its original factory state, wiping all user data and applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Back up all essential data first; go to Settings > Reset; confirm the action; once finished, the device will prompt for initial setup."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.18882394325319285, "y": 0.12928214147294256, "z": 0.973463736535925, "word": "Planning: Backout plans", "pos_group": "other", "row_number": 1833, "definition": "A recovery plan that outlines steps to revert a system to its previous working state if a major change or installation fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Before making a change, create a system image or restore point; if the update fails, restore from that image or roll back the update via the OS recovery tools."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21029575626112817, "y": 0.08187205355062108, "z": 0.9742036038457076, "word": "Previous version (Windows RE), go back to", "pos_group": "other", ettings from a smartphone or tablet to return the OS (Operating System) to its original factory state, often used to resolve deep system bugs or for device decommissioning.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the device 'Settings' menu, select 'General' or 'System', choose 'Reset' or 'Erase all content and settings', and follow the prompts to perform a factory data reset."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.17874877867265834, "y": 0.12369107702580219, "z": 0.9760888236155715, "word": "Resetting: Motherboards", "pos_group": "other", "row_number": 2150, "definition": "The physical or software-based restoration of BIOS/UEFI (Unified Extensible Firmware Interface) settings to the factory-default parameters by clearing the CMOS (Complementary Metal-Oxide-Semiconductor) memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Shut down the computer, locate the CMOS battery (usually a CR2032 button cell) on the motherboard, remove it for 30 seconds, or use the 'Clear CMOS' jumper pins (refer to the motherboard manual for the exact pin location), then reinstall the battery or reset the jumper."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2217262497468114, "y": 0.07914441098915752, "z": 0.9718917801804858, "word": "Restores: OS installations", "pos_group": "other", "row_number": 2168, "definition": "The process of reinstalling the operating system to resolve critical errors or corruption that cannot be fixed by standard software repairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot from installation media (USB/DVD), choose the install/repair option, and perform an OS reinstallation. Always ensure data is backed up before proceeding with an OS installation or reinstallation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2189012236431203, "y": 0.1419217388979187, "z": 0.9653706409021023, "word": "Restores: System Restore, Windows RE", "pos_group": "other", "row_number": 2169, "definition": "A Windows featu
