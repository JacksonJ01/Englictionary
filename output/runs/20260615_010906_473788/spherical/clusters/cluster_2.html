": "other", "row_number": 1972, "definition": "Dynamic named values (such as \u201cPATH\u201d or \u201cHOME\u201d) that can affect the way running processes behave on a computer, often used to configure global system or user settings for scripts and applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cenv\u201d or \u201cprintenv\u201d command in Linux/macOS or \u201cset\u201d in Windows Command Prompt to view variables; update via System Properties in Windows or the profile configuration files (e.g., \u201c.bashrc\u201d) in Linux."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.302445077147582, "y": 0.43080572740897133, "z": 0.8502549032736126, "word": "Programs and Features, Control Panel", "pos_group": "other", "row_number": 1982, "definition": "A Windows utility used to manage installed applications, allowing users to uninstall, change, or repair programs.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cControl Panel > Programs and Features\u201d, select the problematic program from the list, and click \u201cUninstall\u201d or \u201cChange/Repair\u201d to resolve missing or damaged files."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2743869780465738, "y": 0.48973226992557406, "z": 0.8275711993973773, "word": "Ps command", "pos_group": "other", "row_number": 2010, "definition": "A command-line utility (process status) used in Unix-like operating systems to display information about currently running processes, such as Process ID (PID) and CPU usage.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute 'ps aux' to see a comprehensive list of all running processes; use the information to identify hung applications, then use the 'kill' command followed by the PID to terminate them."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.33607121230574244, "y": 0.4570819530802591, "z": 0.8234878435214963, "word": "Quitting applications, Force Quit (macOS (OS X))", "pos_group": "other", "row_number": 2061, "def 24100182890346, "z": 0.8421864500702848, "word": "Resource Monitor", "pos_group": "other", "row_number": 2155, "definition": "An advanced Windows system tool that provides a real-time, granular view of hardware and software resource utilization, including CPU (Central Processing Unit), memory, disk I/O (Input/Output), and network activity.", "details": [{"label": "TROUBLESHOOTING", "value": "Press 'Windows + R', type 'resmon', and press 'Enter' to launch the monitor; navigate through the CPU, Memory, Disk, and Network tabs to identify which process is currently exerting high load and terminate it if necessary."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.26320133571260756, "y": 0.47560156305196416, "z": 0.8393617873727799, "word": "RMM (Remote Monitoring and Management)", "pos_group": "other", "row_number": 2184, "definition": "An enterprise IT (Information Technology) management software platform that deploys low-overhead agent programs on remote computers, providing administrators with a dashboard to monitor hardware metrics, run automation scripts, deploy patches, and provide remote helpdesk support.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the affected client workstation locally or via command-line, invoke the Services administrative applet by running \u201cservices.msc\u201d, find the specified background service entry associated with the corporate RMM platform, verify its startup parameter is configured to 'Automatic', click \u201cRestart\u201d on the service item, and monitor the network logs to ensure outbound traffic is successfully transiting TLS (Transport Layer Security) port 443."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.33254805404543164, "y": 0.47633295888953464, "z": 0.8139525195158116, "word": "Services", "pos_group": "other", "row_number": 2334, "definition": "Background processes in an OS (Operating System) that provide specific functionality, such as network connectivity, printing, or security, without a user interface.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cServices\u201d management console by executing the command \u201cservices.msc\u201d, locate the problematic service, check its status, and click \u201cStart\u201d or \u201cRestart\u201d if it has stopped."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.28932963493897734, "y": 0.43111691394758095, "z": 0.8546499686154515, "word": "Services tab, Task Manager", "pos_group": "other", "row_number": 2335, "definition": "A section in the Windows Task Manager that provides a list of all currently running services, allowing users to start, stop, or view the status of background processes.", "details": [{"label": "TROUBLESHOOTING", "value": "Press \u201cCtrl + Shift + Esc\u201d to open Task Manager, navigate to the \u201cServices\u201d tab, look for the service status, right-click the service, and select \u201cStart\u201d or \u201cStop\u201d to troubleshoot the behavior."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2829221717429391, "y": 0.49770415276635566, "z": 0.8199058610934447, "word": "Shutdown command: Linux", "pos_group": "other", "row_number": 2374, "definition": "A terminal CLI interface administration command executed within the Linux shell environment to schedule system power state adjustments, reboot the environment kernel, or bring the machine safely to a halt.", "details": [{"label": "TROUBLESHOOTING", "value": "Precede the script command parameters with administrative escalation modifiers by typing the command string \u201csudo shutdown -h now\u201d to immediately power down the machine safely, or type \u201csudo shutdown -r +15 \"System maintenance rebooting in 15 minutes\"\u201d to orchestrate a controlled automated system restart."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3365387768124745, "y": 0.44462789042850925, "z": 0.8300889655661355, "word": "Shutdown command: Windows 10", "pos_group": "other", "row_number": 2375, "definition": "An operating system shell utility interface command that gives administrators the power to shut down, cycle, or hibernate local or remote Windows 10 endpoints from a centralized command prompt panel.", "details": [{"label": "TROUBLESHOOTING", "value": "Open an administrative console command framework box and execute the instruction \u201cshutdown /r /t 60 /f\u201d; this specific parameter arrangement initiates a forced automated system restart loop, establishes a localized delay countdown threshold timer of 60 seconds, and forces all hanging background applications to terminate instantly."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.26321232470381506, "y": 0.4557361819838306, "z": 0.850308064500634, "word": "Sleep: Power & Sleep section, Settings", "pos_group": "other", "row_number": 2382, "definition": "The unified operating system configuration window in Windows that allows administrators to define exact runtime threshold timelines before the monitor blanks out or the entire system cuts off volatile operational components to reduce power draw.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows configurations app by selecting \u201cSettings > System > Power & sleep\u201d, navigate to the drop-down selectors for screen power and sleep state thresholds, set the inactivity limits to conservative metrics (such as \u201c10 minutes\u201d for screen power and \u201c30 minutes\u201d for full system sleep), and apply configurations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3177130252698247, "y": 0.4932760505414686, "z": 0.8097760008398039, "word": "Software: Desktop management software", "pos_group": "other", "row_number": 2430, "definition": "Centralized tools used by IT administrators to monitor, update, and manage the health and configuration of multiple networked desktop computers (e.g., Microsoft Endpoint Configuration Manager).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the connectivity between the management server and the client machine,
