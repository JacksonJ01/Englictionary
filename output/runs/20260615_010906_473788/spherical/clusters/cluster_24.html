<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 24, "radius": 285.0, "nodes": [{"x": 0.7226876922340031, "y": -0.5655192748756714, "z": 0.3973794776250851, "word": "AC adapters, troubleshooting", "pos_group": "other", "row_number": 28, "definition": "The external power bricks responsible for converting alternating current (AC) high-voltage wall power into lower direct current (DC) power that a portable device or laptop can safely use to run and charge.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the physical cabling for frayed wires or deep cuts; use a digital multimeter to test the DC barrel connector tip for appropriate voltage output against the printed specs on the brick label; swap with a known-good adapter matching identical voltage and equal/higher amperage specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7297698438432209, "y": -0.5594153905670228, "z": 0.39305266290127877, "word": "Air filtration", "pos_group": "other", "row_number": 101, "definition": "The environmental control practice of using physical air filters (such as HEPA (High-Efficiency Particulate Air) filters) and positive pressure ventilation inside server rooms and data centers to remove dust, lint, and airborne particles that can clog cooling systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish a preventative maintenance schedule to inspect and replace HVAC (Heating, Ventilation, and Air Conditioning) pre-filters and server rack air filtration units quarterly; use low-pressure compressed air and anti-static vacuums to clean dust accumulations out of clogged server chassis enclosures."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7218334017182567, "y": -0.560759938172275, "z": 0.40559195246562274, "word": "Antistatic mats", "pos_group": "other", "row_number": 118, "definition": "A rubberized workspace surface designed to safely conduct static electricity down to a building's ground source. Placing computer components on this surface prevents high-voltage static charges from accumulating and discharging through delicate semiconductors.", "details": [{"label": "TROUBLESHOOTING", "value": "Lay out the antistatic workspace surface on the repair bench; attach the ground wire clip firmly to a verified physical grounding point (like a clean metal chassis or outlet ground plug screw); place all components on the mat surface during servicing."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7238021112522395, "y": -0.5694882658387556, "z": 0.3896070056079171, "word": "Antistatic wrist straps", "pos_group": "other", "row_number": 119, "definition": "An adjustable fabric bracelet with woven conductive fibers connected to a flexible grounding wire and an alligator clip. It continuously discharges any electrical charge from a technician's body safely to the ground before it can shock delicate computer parts.", "details": [{"label": "TROUBLESHOOTING", "value": "Wrap the fabric bracelet firmly around your bare wrist; attach the heavy alligator clip end onto a clean, unpainted metallic surface of the grounded computer case structure; keep the strap attached for the entire duration of internal component adjustments."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7317309052231797, "y": -0.5523972971158593, "z": 0.3992832434254648, "word": "Batteries, troubleshooting", "pos_group": "other", "row_number": 220, "definition": "The diagnostics and evaluation of a mobile device's chemical power cell component to determine its structural degradation level, lifecycle status, and physical stability.", "details": [{"label": "TROUBLESHOOTING", "value": "Immediately turn off and isolate the mobile device if you notice a physically swollen casing, as compromised battery packets pose an inflation and thermal fire risk; use a safe plastic spudger tool to unscrew the casing and lift out the old cell block, then install a certified OEM (Original Equipment Manufacturer) replacement battery unit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7159453143918857, "y": -0.5694476969401245, "z": 0.40392032289783575, "word": "Blackouts", "pos_group": "other", "row_number": 248, "definition": "A complete and sudden loss of electrical power grid delivery to a facility or localized equipment setup.", "details": [{"label": "TROUBLESHOOTING", "value": "Install an inline UPS (Uninterruptible Power Supply) system between the wall outlet and critical equipment to provide sufficient battery runtime to execute orderly operating system shutdowns."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7317908520612472, "y": -0.5627202045241915, "z": 0.38448422628207507, "word": "Brownouts", "pos_group": "other", "row_number": 269, "definition": "Temporary reductions in electrical power grid delivery voltages that can cause erratic behavior in electronic components without fully shutting them off.", "details": [{"label": "TROUBLESHOOTING", "value": "Place specialized line-interactive power regulation equipment or full uninterruptible backup units between facility outlets and sensitive production hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7251302008392916, "y": -0.553231867998666, "z": 0.41002523344481545, "word": "CPU (Central Processing Units): Cooling", "pos_group": "other", "row_number": 565, "definition": "Active or passive thermal management required to prevent CPU overheating.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean dust from the heat sink, ensure the fan header is connected, and verify thermal paste coverage between the CPU and heat sink."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.717297452002023, "y": -0.5759665498159627, "z": 0.3921057240649535, "word": "CPU (Central Processing Units): ESD", "pos_group": "other", "row_number": 566, "definition": "A sudden flow of electricity between two electrically charged objects, which can permanently damage sensitive CPU pins or internal circuits.", "details": [{"label": "TROUBLESHOOTING", "value": "Wear an ESD strap or touch the metal case of the computer before handling the CPU to prevent static damage; there is no fix for a CPU damaged by ESD."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7370838386609272, "y": -0.5510761992922666, "z": 0.39118082437469026, "word": "DC jacks, troubleshooting", "pos_group": "other", "row_number": 608, "definition": "The port on a laptop where the power adapter connects; it is a common point of failure for power issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the jack for physical damage or loose connections; if faulty, this often requires soldering or replacing the power board component."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7150031866991559, "y": -0.564357049085724, "z": 0.4126397510629648, "word": "Destruction/disposal: Environmental controls", "pos_group": "other", "row_number": 629, "definition": "Ensuring that chemicals, batteries, and hardware are disposed of according to local environmental regulations (like \u201cWEEE\u201d (Waste Electrical and Electronic Equipment) directives).", "details": [{"label": "TROUBLESHOOTING", "value": "Use certified e-waste recycling centers and follow manufacturer guidelines for battery disposal."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7272672489771886, "y": -0.5712860726073411, "z": 0.3804136850982517, "word": "Disposal/Destruction: Environmental controls", "pos_group": "other", "row_number": 697, "definition": "Protocols for the safe disposal of electronic equipment containing hazardous materials (e.g., lead, mercury in backlights, lithium batteries) according to local/regional regulations.", "details": [{"label": "TROUBLESHOOTING", "value": "Contact local electronic waste (e-waste) recycling centers and follow hazardous material handling documentation (MSDS - Material Safety Data Sheet) to ensure components are disposed of according to EPA (Environmental Protection Agency) guidelines."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7325113745329015, "y": -0.5460196050430538, "z": 0.40655833171704514, "word": "Electrical safety", "pos_group": "other", "row_number": 813, "definition": "The strict adherence to engineering procedures and equipment configurations designed to isolate technicians and computational hardware from hazardous electrical currents and high-voltage discharges.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that all workspace outlets are verified using a dedicated three-prong circuit testing device, mandate that components under repair are fully disconnected from Alternating Current (AC) power grids, and ensure team members never wear static-grounding bands when interacting with high-voltage storage devices."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7110792471484729, "y": -0.5772627446606895, "z": 0.4014150319825712, "word": "Electrical safety: CRT monitors", "pos_group": "other", "row_number": 814, "definition": "Special safety protocols mandated when handling legacy Cathode Ray Tube (CRT) visual displays, which contain massive high-capacity internal capacitors capable of retaining lethal levels of high-voltage electrical energy long after being disconnected from power sources.", "details": [{"label": "TROUBLESHOOTING", "value": "Strictly enforce a zero-disassembly maintenance policy for standard field engineers regarding CRT enclosures, or use a certified high-voltage probe device securely bonded to a chassis ground connection to systematically drain residual charges away from the internal anode button prior to disposal."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7381909836195499, "y": -0.5566811972349466, "z": 0.38102508624481374, "word": "Electrical safety: ESD prevention", "pos_group": "other", "row_number": 815, "definition": "The continuous application of specialized physical grounding tools and administrative techniques to stop Electrostatic Discharge (ESD) from delivering silent, destructive high-voltage static shocks into exposed electronic circuits.", "details": [{"label": "TROUBLESHOOTING", "value": "Attach an anti-static wrist strap connecting link directly to the unpainted metallic surface of a grounded server chassis, deploy anti-static desk mats, and always retain all internal expansion cards inside sealed static-shielding bags until the physical installation phase begins."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7197658620194668, "y": -0.5545183884844211, "z": 0.4176678832565588, "word": "Electrical safety: Fire safety", "pos_group": "other", "row_number": 816, "definition": "The deployment of specific fire suppression equipment and operational strategies optimized to extinguish active electrical blazes within IT server infrastructures without escalating physical safety risks.", "details": [{"label": "TROUBLESHOOTING", "value": "Immediately disconnect the primary electrical power source via an Emergency Power Off (EPO) mechanism, activate a specialized Class C rated carbon dioxide or clean-agent fire extinguisher cylinder to suppress the blaze, and avoid using standard water-based fire systems that carry high electrical conductivity risks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7188135667424979, "y": -0.5797852613641151, "z": 0.3836093155436571, "word": "Electrical safety: Laser printers", "pos_group": "other", "row_number": 817, "definition": "Standard protective operational procedures designed to shield users and technicians from severe thermal burns and high-voltage electrical currents produced inside a laser print engine.", "details": [{"label": "TROUBLESHOOTING", "value": "Power down the printing unit completely, disconnect the main AC electrical line, wait a minimum of thirty minutes for the high-temperature fuser component assembly to cool down to safe ambient operational margins, and never touch the highly charged corona wire components with bare hands."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7398355817930095, "y": -0.543632172920782, "z": 0.39636772381013613, "word": "Electrical safety: PSU", "pos_group": "other", "row_number": 819, "definition": "The engineering guidelines prohibiting technicians from opening or servicing the internal components of a computer Power Supply Unit (PSU) due to the presence of large internal capacitors that store hazardous electrical charges.", "details": [{"label": "TROUBLESHOOTING", "value": "Treat the internal circuitry of a computer power supply casing as a completely non-serviceable assembly; if a power unit fails basic verification tests using a dedicated digital PSU tester, replace the entire physical unit module."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7088925729997444, "y": -0.5716790281478151, "z": 0.4131033874489193, "word": "Electrical safety: UPS", "pos_group": "other", "row_number": 820, "definition": "Protective guidelines optimized for deploying and managing Uninterruptible Power Supply (UPS) battery systems, which contain severe chemical corrosion risks, high weight loads, and dangerous stored electrical potential.", "details": [{"label": "TROUBLESHOOTING", "value": "Use proper ergonomics when lifting the heavy physical chassis unit, disconnect all attached systems, remove the interior lead-acid battery packs using insulated hand tools, and route the old cells to an approved hazardous recycling facility."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7335226167180586, "y": -0.5673606724872184, "z": 0.3742277890242032, "word": "EMI (Electromagnetic Interference)", "pos_group": "other", "row_number": 834, "definition": "An undesirable disturbance generated by an external source that affects an electrical circuit by electromagnetic induction, electrostatic coupling, or conduction, frequently causing signal degradation or data corruption.", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize shielded cabling, maintain adequate distance from heavy electrical equipment, and ensure all network hardware is properly grounded to drain away potential electromagnetic noise."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7288220949268942, "y": -0.5442993543507729, "z": 0.4153992859884388, "word": "Environmental controls: Air filtration", "pos_group": "other", "row_number": 858, "definition": "The mechanical process of capturing and removing particulate matter (like dust, smoke, or pollen) from the atmosphere of a server room or data center to prevent internal component contamination.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace clogged air filters on intake vents, clean server racks with an anti-static vacuum, and install air quality sensors to monitor particulate levels."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7099909997004605, "y": -0.5836640836055894, "z": 0.3940165197719357, "word": "Environmental controls: HEPA filters", "pos_group": "other", "row_number": 860, "definition": "High-Efficiency Particulate Air (HEPA) filters are a type of mechanical air filter designed to trap 99.97% of particles that are 0.3 micrometers in diameter, essential for high-precision server environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the manufacturer\u2019s documentation for the specific Change Interval, execute the command \"replace filter\" if the system provides a digital status prompt, and document the change in the facility maintenance log."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7433094362540608, "y": -0.5483878254414712, "z": 0.38309512511025895, "word": "Environmental controls: HVAC", "pos_group": "other", "row_number": 861, "definition": "Heating, Ventilation, and Air Conditioning (HVAC) systems are integrated facility units designed to regulate the ambient temperature, airflow, and humidity levels within a technical operating environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Check HVAC thermostat settings, inspect supply and return vents for obstructions, and ensure that the system is set to \"cool\" or \"dehumidify\" as required for the specific density of the IT equipment."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.712725653696928, "y": -0.5603611357889384, "z": 0.42192124864673214, "word": "Environmental controls: Power", "pos_group": "other", "row_number": 863, "definition": "The management of electrical input stability using tools like Uninterruptible Power Supplies (UPS) and Surge Protectors to ensure hardware remains powered safely during utility fluctuations.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect sensitive IT hardware to an online UPS, test battery runtime status, and use a multimeter to check that the wall outlet provides the correct voltage (e.g., 120V or 240V)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7239649850761046, "y": -0.5791332086376968, "z": 0.37480585245799136, "word": "Environmental controls: Recycling", "pos_group": "other", "row_number": 864, "definition": "The process of collecting and reprocessing electronic components and materials into raw resources, reducing the environmental impact of decommissioned IT equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Categorize waste into plastics, metals, and circuit boards; verify that the recycling partner is certified (e.g., R2 or e-Stewards certified) to handle toxic materials like lead or cadmium."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7388894780505597, "y": -0.538359028437969, "z": 0.4052306697740158, "word": "Environmental controls: Temperature/humidity controls", "pos_group": "other", "row_number": 865, "definition": "Specific climate management settings required to prevent the buildup of static electricity (caused by low humidity) or condensation (caused by high humidity) and to keep electronics within thermal limits.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the HVAC dehumidifier/humidifier settings, deploy hygrometer sensors in the server room, and maintain the environment within the manufacturer\u2019s recommended \u201cASHRAE\u201d (American Society of Heating, Refrigerating and Air-Conditioning Engineers) guidelines."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7047011155186014, "y": -0.5801188554775173, "z": 0.4084831101848573, "word": "Equipment grounding", "pos_group": "other", "row_number": 866, "definition": "The physical connection of a component's metal chassis to the earth through a grounding wire, ensuring that excess electrical current is safely diverted instead of passing through sensitive components or human beings.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the integrity of the ground pin on the power cable, test the outlet with a \"circuit tester\" for a solid ground connection, and ensure all rack-mounted servers are bonded to the facility\u2019s common grounding bus."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7405355234252626, "y": -0.55969404182916, "z": 0.37195391930481214, "word": "ESD (Electrostatic Discharge)", "pos_group": "other", "row_number": 872, "definition": "A sudden flow of electricity between two electrically charged objects caused by contact, an electrical short, or dielectric breakdown; it can destroy sensitive micro-circuits.", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize an anti-static wrist strap, keep components in anti-static bags, and maintain consistent grounding protocols before touching any internal electronic parts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.722150144560644, "y": -0.5470038023523659, "z": 0.4234217860751791, "word": "ESD: CPU installation", "pos_group": "other", "row_number": 873, "definition": "The specific procedure of safely handling the Central Processing Unit (CPU) during installation to ensure that the delicate pins or contacts are not damaged by an electrostatic shock.", "details": [{"label": "TROUBLESHOOTING", "value": "Discharge static by touching the metal chassis, pick up the CPU only by its edges (avoiding pins), and verify the \"socket alignment\" before lowering the chip to prevent bent pins or short circuits."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7125678482369441, "y": -0.5871870615683333, "z": 0.3840031463226798, "word": "ESD: Motherboards", "pos_group": "other", "row_number": 875, "definition": "The extreme sensitivity of the motherboard's traces, integrated circuits, and chipsets to electrostatic discharges.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the board for physical signs of damage (burnt traces), ensure all \u201cstandoffs\u201d are installed correctly to prevent shorting the board to the case, and use an ESD mat during all installation procedures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7459310384891181, "y": -0.5400116736594891, "z": 0.3898387847944627, "word": "ESD: Preventive measures", "pos_group": "other", "row_number": 876, "definition": "The systematic application of tools (wrist straps, anti-static mats) and behaviors (touching the chassis) to keep the technician and the hardware at the same electrical potential.", "details": [{"label": "TROUBLESHOOTING", "value": "Consistently use an ESD strap connected to a verified ground, increase the room's humidity (if below 40%), and store all spare parts in \u201canti-static\u201d (shielded) bags."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7057769143555945, "y": -0.5691622260712978, "z": 0.4218214166875133, "word": "Fans, CPU cooling", "pos_group": "other", "row_number": 914, "definition": "Electromechanical devices mounted on the CPU heat sink that exhaust heat to keep the processor within safe operating temperature limits.", "details": [{"label": "TROUBLESHOOTING", "value": "Visually inspect for dust accumulation, ensure the fan header is correctly connected to the \u201cCPU_FAN\u201d header on the motherboard, and apply new thermal paste between the processor and the heat sink."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7314481570133334, "y": -0.574170723964148, "z": 0.3678472146751746, "word": "Filtering: Air filtration, environmental controls", "pos_group": "other", "row_number": 964, "definition": "The utilization of specialized air handling units and physical particulate screens to regulate the intake and output of air within data centers or server rooms to prevent hardware damage from dust, pollutants, and humidity.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect intake and exhaust filters for heavy dust accumulation, clean or replace filters according to the maintenance schedule, and verify that the HVAC (Heating, Ventilation, and Air Conditioning) system is maintaining the recommended ambient temperature and humidity levels."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7343867662634999, "y": -0.5365618065095499, "z": 0.4156651360557533, "word": "Filtering: HEPA filters", "pos_group": "other", "row_number": 966, "definition": "High-Efficiency Particulate Air (HEPA) filters are specialized air filters capable of trapping at least 99.97% of particles that are 0.3 microns in diameter, often used in professional data center air handling systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a digital manometer to measure the pressure drop across the filter media, replace the HEPA filter if it exceeds the manufacturer\u2019s specified resistance threshold, and ensure the seal between the filter frame and the housing is airtight."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7034855577407414, "y": -0.587668527182134, "z": 0.399692096756715, "word": "Fire safety, electrical", "pos_group": "other", "row_number": 973, "definition": "The protocols and equipment, such as CO2 (Carbon Dioxide) or Halon-alternative fire extinguishers, required to suppress fires involving electrical equipment without damaging the hardware or causing electrical shorts.", "details": [{"label": "TROUBLESHOOTING", "value": "Immediately cut power to the affected equipment at the main breaker, use a Class C fire extinguisher (specifically rated for electrical fires), and contact emergency services; do not use water-based extinguishers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.746657431380254, "y": -0.5498930374516323, "z": 0.3743264985635653, "word": "Grounding equipment", "pos_group": "other", "row_number": 1010, "definition": "The process of creating a safe physical electrical path to the earth to prevent the accumulation of electrostatic charge or to protect equipment from voltage surges.", "details": [{"label": "TROUBLESHOOTING", "value": "Always wear an ESD wrist strap connected to a grounded surface, use anti-static mats when handling sensitive electronics, and ensure that all power outlets are properly grounded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7138381917980275, "y": -0.5537765045612534, "z": 0.4286800892582283, "word": "Hard reset (30-second trick)", "pos_group": "other", "row_number": 1044, "definition": "A troubleshooting technique that discharges residual electricity from hardware components, forcing a complete power cycle of a device or motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Turn off the device, unplug the power source, remove the battery (if applicable), press and hold the power button for at least 30 seconds, reconnect the power, and attempt to turn the system on again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7184799334582586, "y": -0.5867768622872597, "z": 0.37346954240223496, "word": "Heat sinks", "pos_group": "other", "row_number": 1057, "definition": "A passive thermal management component\u2014typically made of aluminum or copper\u2014designed to increase the surface area of a heat-generating component, such as a CPU (Central Processing Unit) or GPU (Graphics Processing Unit), to dissipate heat efficiently into the surrounding air.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean dust buildup from the cooling fins using compressed air, re-apply thermal paste between the CPU and heat sink, and ensure the heat sink is mounted securely and making full contact with the integrated heat spreader."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7452187329407685, "y": -0.5334323524065095, "z": 0.40012368772694895, "word": "Heavy objects, lifting", "pos_group": "other", "row_number": 1059, "definition": "Proper physical safety protocol for lifting heavy equipment, such as servers or UPS (Uninterruptible Power Supply) units, to prevent musculoskeletal injuries.", "details": [{"label": "TROUBLESHOOTING", "value": "Always lift with your legs, keeping the back straight and the object close to your body; if an object is too heavy for one person, seek assistance or use a mechanical lifting aid (like a dolly or server lift) to move the item."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.700461915084229, "y": -0.5792221466811994, "z": 0.4169590031532566, "word": "Hot components, safety", "pos_group": "other", "row_number": 1076, "definition": "The protocol for handling components that generate significant heat (e.g., CPUs, server chassis components) to avoid thermal burns and protect sensitive hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "Allow the system to cool down after shutdown for at least 15\u201320 minutes before touching internal components; if hardware must be handled while warm, use insulated gloves or handles."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7398364114285932, "y": -0.5655277092733237, "z": 0.3644454614459181, "word": "Humidity/temperature controls", "pos_group": "other", "row_number": 1084, "definition": "Environmental settings managed in server rooms or data centers to ensure hardware operates within manufacturer-specified parameters (e.g., preventing condensation or overheating).", "details": [{"label": "TROUBLESHOOTING", "value": "Use environmental monitoring sensors to track data, adjust HVAC (Heating, Ventilation, Air Conditioning) systems accordingly, and ensure fans/ventilation are clear of obstructions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7268931183017421, "y": -0.538995252825108, "z": 0.4255708072666256, "word": "IP (Ingress Protection) ratings", "pos_group": "other", "row_number": 1172, "definition": "An international standard (IEC 60529) that classifies the degree of protection provided by electrical enclosures against the intrusion of solid objects (dust) and liquids (water).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the device\u2019s IP rating documentation to determine its limits; if a device exceeds its specified rating, perform a physical inspection for corrosion and clean with appropriate electronics-safe solvents."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7058262583048924, "y": -0.5925997851710096, "z": 0.3881169768286213, "word": "Keyboards: ESD", "pos_group": "other", "row_number": 1208, "definition": "Electrostatic Discharge (ESD)\u2014the sudden flow of electricity between two electrically charged objects\u2014which can damage the sensitive internal circuitry of a keyboard during maintenance or installation.", "details": [{"label": "TROUBLESHOOTING", "value": "Always wear an ESD wrist strap and work on an anti-static mat when disassembling keyboards or internal laptop components to prevent static build-up."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7504768254549805, "y": -0.5397478406341314, "z": 0.3813879953352062, "word": "Lifting heavy objects", "pos_group": "other", "row_number": 1250, "definition": "The physical ergonomics and material safety mechanics mandated when lifting dense, heavy enterprise computer hardware components (such as large multi-battery UPS\u2014Uninterruptible Power Supply units or multi-node server chassis rails) to prevent physical workplace injury.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement corporate safety guidelines requiring the use of hydraulic server lift machinery tools for equipment exceeding fifty pounds, require two-person lift configurations for heavy desktop components, and emphasize proper lifting ergonomics (bending at the knees and maintaining a straight back spine position)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.705386224175776, "y": -0.5636980022441984, "z": 0.4297381028125635, "word": "Mobile devices: Disassembling", "pos_group": "other", "row_number": 1462, "definition": "The physical process of opening a mobile device chassis to repair or replace internal components like the battery, screen, or charging port.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the manufacturer\u2019s service manual for the specific model; utilize specialized tools (spudgers, precision screwdrivers, suction cups); track all screws; use caution with batteries to prevent puncturing them."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7269195415411503, "y": -0.5820111599570711, "z": 0.36448729718747175, "word": "Physical safety", "pos_group": "other", "row_number": 1800, "definition": "The set of best practices and procedures designed to prevent injury to personnel and damage to hardware during the maintenance, installation, or transport of computing equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Always disconnect power sources before opening cases, use ESD (Electrostatic Discharge) straps to protect components, clear workspaces of trip hazards, and follow proper lifting techniques (using legs, not the back) when handling heavy server or printer chassis."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.740873191301027, "y": -0.5301851632753606, "z": 0.41232342530362137, "word": "Physical safety: Cable management", "pos_group": "other", "row_number": 1801, "definition": "The organized arrangement of electrical and data cabling to prevent safety hazards such as tripping, cable damage, or airflow restriction in server racks.", "details": [{"label": "TROUBLESHOOTING", "value": "Use cable ties, raceways, or Velcro straps to bundle and route cables neatly along walls or through cable management arms, ensuring no cables block walkways or fan intakes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6980250213482864, "y": -0.5886962720254582, "z": 0.4076736058111342, "word": "Physical safety: Hot components", "pos_group": "other", "row_number": 1803, "definition": "High-temperature hardware elements, such as CPUs (Central Processing Units), GPU (Graphics Processing Unit) heat sinks, or laser printer fuser units, that pose a burn risk.", "details": [{"label": "TROUBLESHOOTING", "value": "Allow devices (especially printers) to cool down for at least 15-30 minutes after operation before performing maintenance; wear heat-resistant gloves if handling components immediately after power-down."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7475906776013955, "y": -0.5543995643580686, "z": 0.3657175164017578, "word": "Physical safety: Lifting heavy objects", "pos_group": "other", "row_number": 1804, "definition": "Proper physical techniques for moving heavy hardware (like servers or UPS - Uninterruptible Power Supply units) to prevent musculoskeletal injuries.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a team lift for items over 50 pounds, keep the back straight, bend at the knees, hold the weight close to the body, and do not twist the torso while lifting."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7174429827888599, "y": -0.5457303855604909, "z": 0.4329594816181091, "word": "Physical safety: Safety equipment", "pos_group": "other", "row_number": 1805, "definition": "Protective gear and tools required to perform maintenance safely, including ESD mats, fire extinguishers (Class C for electrical fires), and eye protection.", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly inspect fire extinguishers for valid tags, ensure ESD mats are grounded properly, and verify that all technicians have access to and are trained in the use of necessary PPE (Personal Protective Equipment)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7117279470209202, "y": -0.5936162392355364, "z": 0.37558366570611745, "word": "Power: AC adapters, troubleshooting", "pos_group": "other", "row_number": 1867, "definition": "The external electrical component that steps down high-voltage Alternating Current (AC) from a wall socket to the low-voltage Direct Current (DC) required by portable hardware like laptops.", "details": [{"label": "TROUBLESHOOTING", "value": "Test the DC barrel connector tip output using a digital multimeter set to VDC mode to verify it matches the rated voltage stamped on the adapter casing; check the cord for fraying and replace the unit if the brick exhibits physical swelling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7509549378088353, "y": -0.5311051750155437, "z": 0.3924206600731379, "word": "Power: Blackouts", "pos_group": "other", "row_number": 1869, "definition": "A catastrophic total loss of public utility electrical infrastructure power across an area or building facility.", "details": [{"label": "TROUBLESHOOTING", "value": "Integrate a dedicated online or line-interactive UPS (Uninterruptible Power Supply) into corporate server frames, adjust the server configurations to run clean automated shutdown sequences via USB/Network signaling cables when power failure thresholds are breached, and check the main facility circuit breakers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6983268263204441, "y": -0.5753292125471411, "z": 0.4258355795739748, "word": "Power: Brownouts", "pos_group": "other", "row_number": 1870, "definition": "A prolonged drop in incoming utility AC voltage levels below standard operational baselines, causing electronics to draw excess current to compensate.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect critical structural systems through a line-interactive UPS system that integrates an automatic voltage regulation (AVR) transformer, allowing the backup unit to boost sagging voltage phases without draining internal standby batteries."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7366549709735621, "y": -0.5731762592488433, "z": 0.35889891275043306, "word": "Power: Sags", "pos_group": "other", "row_number": 1878, "definition": "A brief, transient drop in standard alternating current utility line voltage levels that generally resolves within a few milliseconds, often caused by heavy machinery cycling on nearby.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate precision workstation lines from high-draw facility infrastructure units like HVAC (Heating, Ventilation, and Air Conditioning) compressors, and bridge hardware systems onto a standby or line-interactive UPS to cover transient voltage drops."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7331872464949156, "y": -0.531284191883489, "z": 0.4244685724902515, "word": "Power: Surge protectors/suppressors", "pos_group": "other", "row_number": 1881, "definition": "An electrical appliance engineered to shield sensitive system components from dangerous transient voltage spikes by safely redirecting excess electrical surges to ground using metal oxide varistors (MOVs).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical indicator LEDs on the surge protector chassis to confirm the status of the surge protection circuitry; if the \"Protected\" status indicator light is dark, replace the unit immediately, as the internal MOVs have absorbed their maximum joule rating and can no longer absorb surges."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6992639319485017, "y": -0.5957956552543012, "z": 0.3950411252718117, "word": "Power: Surges", "pos_group": "other", "row_number": 1882, "definition": "A sudden, sharp spike in incoming utility AC voltage that far exceeds the normal household or business operating thresholds, often driven by lightning impacts or power distribution changes.", "details": [{"label": "TROUBLESHOOTING", "value": "Route all utility lines passing into critical hardware frames through a surge suppressor module rated with a high joule dissipation value, and implement dedicated point-of-entry surge grounding arrestors across the main distribution electrical panel."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7532355782435779, "y": -0.5424234578053362, "z": 0.3720389174408583, "word": "Power: Troubleshooting", "pos_group": "other", "row_number": 1883, "definition": "The diagnostic process of investigating, isolating, and resolving problems related to electrical energy delivery across computing electronics.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm that the system power cord is firmly seated into a functional AC wall outlet, verify that the power supply's physical master switch is turned to the \"I\" (On) position, and test the internal electrical outputs with a power supply tester to ensure they match baseline voltage specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7074254653040365, "y": -0.5561303930292909, "z": 0.4361974289108703, "word": "Power: UPS (Uninterruptible Power Supply)", "pos_group": "other", "row_number": 1884, "definition": "An advanced power protection unit housing internal battery storage cells and automated switching networks that delivers instantaneous backup electrical energy to connected systems when incoming utility power fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the vendor's local management dashboard interface via a connected data line to look up the integrated battery health statistics, execute a manual battery calibration self-test routine, and swap out the aging lead-acid or lithium battery blocks if the system indicates a \"Replace Battery\" condition."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7206078908438208, "y": -0.590022881505055, "z": 0.3641390763899038, "word": "Preventive measures: ESD (Electrostatic Discharge)", "pos_group": "other", "row_number": 1915, "definition": "The process of preventing sudden, high-voltage static electricity discharge from damaging delicate electronic components, such as CPUs or RAM modules.", "details": [{"label": "TROUBLESHOOTING", "value": "Always use an anti-static wrist strap connected to a grounded surface, use anti-static bags to store components, and maintain proper humidity levels in the work environment to reduce static buildup."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.747564575341661, "y": -0.5256340128089779, "z": 0.40602474096115526, "word": "Quick deaths, PSU (Power Supply Unit), troubleshooting", "pos_group": "other", "row_number": 2060, "definition": "A critical electrical failure state where a power supply unit instantly and permanently stops converting AC (Alternating Current) voltage into direct low-voltage DC (Direct Current) lines, completely rendering a computer non-functional without any preliminary warnings or graceful component shutdowns.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the main wall outlet is active by plugging in a known functional appliance, ensure the physical toggle switch located on the back of the PSU (Power Supply Unit) enclosure is turned to the on (\u201cI\u201d) position, pull the internal 24-pin main ATX (Advanced Technology eXtended) power lead from the motherboard socket, use a dedicated hardware \u201cPSU Tester\u201d or bridge the green pin to a black ground wire using a paperclip to test for automated fan spin, and replace the dead unit with an appropriate wattage-rated component if it fails to activate."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6940262401083382, "y": -0.58689037263525, "z": 0.4169979239146648, "word": "Recycling, environmental controls", "pos_group": "other", "row_number": 2111, "definition": "The mandatory operational procedure of safely sorting, handling, and dropping off end-of-life technological hardware components to specialized recycling entities in compliance with regulations.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish compliance guidelines; store exhausted batteries in non-conductive safety bins, aggregate monitors for toxic lead removal, and ship to certified processors while cross-referencing SDS sheets."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7461872756458658, "y": -0.5612400362634271, "z": 0.3580700648744989, "word": "Replacing: Inverters", "pos_group": "other", "row_number": 2140, "definition": "The hardware maintenance task of swapping out a failed DC-to-AC power inverter circuit board in an older laptop screen.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect power, open bezel, locate the inverter circuit board, disconnect input and output lines, unscrew, swap for an identical module, and reattach."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7230154357889179, "y": -0.5370778667840814, "z": 0.43450666809799554, "word": "Resetting: Hard reset (30-second trick)", "pos_group": "other", "row_number": 2148, "definition": "A power-cycle procedure where all power sources (including internal batteries) are disconnected and the power button is held for 30 seconds to drain residual charge from capacitors on the motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the AC power cable, remove the internal battery (if accessible), hold the power button down for 30 seconds to discharge the system, reconnect the power sources, and attempt to turn the device back on."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7044139626560278, "y": -0.5990320504323243, "z": 0.38073819321165775, "word": "Safety procedures: Electrical safety", "pos_group": "other", "row_number": 2203, "definition": "A set of essential precautions designed to protect technicians and equipment from hazards associated with high-voltage electricity, such as preventing electric shock, arc flashes, and equipment damage.", "details": [{"label": "TROUBLESHOOTING", "value": "Always unplug the power cable from the wall outlet before opening the computer chassis, avoid working with water nearby, and ensure that all electrical outlets are properly grounded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7555641867767702, "y": -0.5314591962500625, "z": 0.3829802636972244, "word": "Safety procedures: ESD prevention", "pos_group": "other", "row_number": 2204, "definition": "Techniques used to prevent the uncontrolled flow of static electricity from a person to sensitive electronic components, which can cause latent or immediate hardware failure.", "details": [{"label": "TROUBLESHOOTING", "value": "Wear an ESD (Electrostatic Discharge) wrist strap attached to a verified ground point, work on an anti-static mat, and keep delicate components inside anti-static bags when they are not actively being installed."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.698396356216739, "y": -0.5689278383610497, "z": 0.4342391557206754, "word": "Safety procedures: Fire safety", "pos_group": "other", "row_number": 2205, "definition": "Protocols and equipment required to detect, contain, and extinguish fires in a technical environment, specifically focusing on the use of correct fire extinguisher classes for electrical equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Never use water on an electrical fire; ensure a Class C or CO2 (Carbon Dioxide) fire extinguisher is readily accessible, and if the fire is uncontrollable, follow the building's emergency evacuation plan immediately."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7313677569294742, "y": -0.5818343176591914, "z": 0.3557668209909586, "word": "Safety procedures: Grounding equipment", "pos_group": "other", "row_number": 2206, "definition": "The practice of connecting equipment chassis or electrical systems to an earth ground to provide a safe path for fault current, which prevents chassis from becoming energized and protects against surges.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a multimeter to check for continuity between the equipment chassis and the wall outlet's ground pin; if not grounded, ensure the power cord is three-pronged and the wall outlet is wired correctly by a licensed electrician."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7403742489113625, "y": -0.524585591012004, "
