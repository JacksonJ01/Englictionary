ite data to a standard 700MB (Megabyte) optical disc.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the optical lens with a specialized disc cleaning kit; verify that the SATA or IDE power and data cables are securely connected; ensure the device driver is installed in the OS."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13004403054289362, "y": -0.8057577285118707, "z": 0.57779151349215, "word": "Connectivity: IDE cabling", "pos_group": "other", "row_number": 481, "definition": "A legacy standard for connecting storage devices (hard drives, optical drives) to the motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the IDE cable is oriented correctly (pin 1 alignment), set the master/slave jumpers correctly on the drive, and test with a different cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15487009701179702, "y": -0.7980204977235974, "z": 0.5823903658754482, "word": "Connectivity: SATA", "pos_group": "other", "row_number": 497, "definition": "A standard interface for connecting storage devices (SSDs and HDDs) to the motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Swap the SATA cable, try a different SATA port on the motherboard, and ensure the power connector is also attached to the drive."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14076227298058339, "y": -0.8143208170318325, "z": 0.5630875504341653, "word": "Drives: Internal drives, OS installations", "pos_group": "other", "row_number": 782, "definition": "High-speed primary storage hardware devices installed inside a computer chassis (via SATA or Non-Volatile Memory Express (NVMe) M.2 interfaces) dedicated to hosting the core operational files of an operating system.", "details": [{"label": "TROUBLESHOOTING", "value": "Shut down the system completely, verify internal SATA/NVMe data and power connections, or use the OS installer interface options to load appropriate storage controller drivers from an auxiliary flash drive."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1338776778636033, "y": -0.7973792013020132, "z": 0.5884413111779395, "word": "DVD (Digital Versatile Disc) drives", "pos_group": "other", "row_number": 802, "definition": "An optical storage drive device that uses a red laser beam to read digital data encoded on high-capacity Digital Versatile Discs (DVDs).", "details": [{"label": "TROUBLESHOOTING", "value": "Straighten a standard metal paperclip and gently push it into the emergency manual pinhole release socket on the front bezel face to pop the tray open, clean the laser lens using a specialized air bulb, and verify the internal SATA bus data link."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16105107206405003, "y": -0.8052499796696089, "z": 0.5706443922699275, "word": "eSATA (external Serial Advanced Technology Attachment) devices", "pos_group": "other", "row_number": 871, "definition": "An extension of the SATA interface that allows for the external connection of high-speed storage devices, supporting the same speeds as internal SATA connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive is powered independently (eSATA does not always carry power), verify that the eSATA cable is firmly seated, and check the BIOS/UEFI to ensure \u201cAHCI\u201d (Advanced Host Controller Interface) mode is enabled for the port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12627487695396683, "y": -0.8120792613066219, "z": 0.569720921860828, "word": "Expansion cards: eSATA devices", "pos_group": "other", "row_number": 897, "definition": "Expansion cards that provide external Serial Advanced Technology Attachment (eSATA) ports, allowing for the connection of high-speed external hard drives that offer the same data transfer speeds as internal SATA drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the external drive is powered (as eSATA does not provide power), ensure the cable is firmly connected, and enter the BIOS (Basic Input/Output System) or UEFI (Unified Extensible Firmware Interface) to verify that the AHCI (Advanced Host Controller Interface) mode is enabled for the port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15000169934633834, "y": -0.7925863726913741, "z": 0.591021431098011, "word": "Expansion cards: USB 3.2 expansion cards", "pos_group": "other", "row_number": 901, "definition": "Cards that provide additional high-speed Universal Serial Bus (USB) 3.2 ports to a system, useful for upgrading older computers that lack high-speed connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the card has a dedicated power connection from the power supply (if required), update the motherboard chipset drivers, and verify the card is installed in a PCIe slot with sufficient bandwidth (e.g., PCIe 3.0 x4)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15171194493564066, "y": -0.8151562418390988, "z": 0.5590203816987369, "word": "Fault tolerance: RAID", "pos_group": "other", "row_number": 916, "definition": "Redundant Array of Independent Disks (RAID) is a data storage technology that combines multiple physical disk drives into one or more logical units for data redundancy and performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the failed drive in the RAID controller interface, replace the drive with one of equal or greater capacity, and initiate the \u201cRebuild\u201d process to restore data redundancy."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12306824512938655, "y": -0.8016612823791542, "z": 0.5849729868763027, "word": "Hard drives: RAID", "pos_group": "other", "row_number": 1038, "definition": "Redundant Array of Independent Disks (RAID) is a technology that uses multiple hard drives in combination to provide data redundancy, improve performance, or both (e.g., RAID 0, 1, 5, 10).", "details": [{"label": "TROUBLESHOOTING", "value": "Access the RAID controller\u2019s BIOS (Basic Input/Output System) or software management console, identify the failed drive, replace it with an identical component, and initiate a \"rebuild\" of the array."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16519556047367676, "y": -0.7977915495235373, "z": 0.5798612509114753, "word": "Hard drives: SATA drives", "pos_group": "other", "row_number": 1041, "definition": "A storage interface (Serial Advanced Technology Attachment) used to connect hard drives and optical drives to the motherboard, supporting data transfer rates up to 6 Gigabits per second (Gbps) for SATA III.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the SATA data cable with a known-good one, try a different SATA port on the motherboard, and ensure the power supply is delivering stable voltage to the drive connector."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13161776461743335, "y": -0.8182366034544757, "z": 0.5596120306108447, "word": "IDE (Integrated Drive Electronics) cabling", "pos_group": "other", "row_number": 1096, "definition": "A legacy interface standard (also known as PATA\u2014Parallel Advanced Technology Attachment) used to connect storage devices like hard drives and optical drives to the motherboard using wide, 40-pin ribbon cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the IDE cable is securely connected to both the drive and the motherboard, verify the \u201cMaster/Slave\u201d jumper settings on the back of the drive are correct, and replace the ribbon cable with a known-good one."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13763365720592746, "y": -0.7911106820418563, "z": 0.5959873028541716, "word": "Memory: NVMe (Non-Volatile Memory Express)", "pos_group": "other", "row_number": 1439, "definition": "A communication interface and driver protocol specifically designed for SSDs that connects directly to the system via the PCIe bus, allowing for significantly higher speeds and lower latency compared to traditional SATA drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NVMe drive is correctly seated in the M.2 slot on the motherboard; verify that the BIOS/UEFI settings are configured for NVMe mode rather than legacy SATA/AHCI mode; update motherboard firmware to ensure NVMe compatibility; and confirm that the OS has the necessary NVMe drivers installed."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16435474764654073, "y": -0.8105277477066483, "z": 0.5621674902763674, "word": "Networks: IDE cabling", "pos_group": "other", "row_number": 1594, "definition": "Integrated Drive Electronics (IDE) is an older standard for connecting storage devices (like hard drives and CD-ROM drives) to the motherboard via parallel ATA (Advanced Technology Attachment) cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the jumper settings on the drive are correctly set to Master/Slave/Cable Select, confirm the ribbon cable is not damaged (pinched or torn), and verify the drive is firmly connected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.11730546027740409, "y": -0.8098214028516019, "z": 0.5748293002905907, "word": "Networks: SATA cabling", "pos_group": "other", "row_number": 1621, "definition": "Serial Advanced Technology Attachment (SATA) cabling is used to connect modern hard drives, SSDs (Solid State Drives), and optical drives to the motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Reseat both ends of the SATA cable; swap the cable with a known-good one; try a different SATA port on the motherboard to rule out a faulty controller."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1603723025673051, "y": -0.7902403173837109, "z": 0.5914397394076194, "word": "Networks: SCSI cabling", "pos_group": "other", "row_number": 1623, "definition": "Small Computer System Interface (SCSI) is a set of standards for physically connecting and transferring data between computers and peripheral devices, often used in enterprise servers for high-speed storage.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure correct termination at both ends of the SCSI chain (if using older parallel SCSI); verify that the device ID is unique; check all cables for damage and ensure they are firmly connected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14483158927253514, "y": -0.820605926892113, "z": 0.552837881750453, "word": "NVMe (Non-Volatile Memory express)", "pos_group": "other", "row_number": 1674, "definition": "A high-performance interface protocol designed specifically for SSDs to communicate via the PCI Express bus, resulting in significantly faster transfer speeds than legacy SATA-based storage.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the BIOS is updated to support NVMe; check that the drive is fully seated in the M.2 slot; verify the drive is formatted correctly for the OS."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12294432437182204, "y": -0.7952325006381522, "z": 0.593708651641146, "word": "Optical drives", "pos_group": "other", "row_number": 1694, "definition": "Hardware devices that use lasers to read from or write to CDs, DVDs, or Blu-ray discs.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the emergency eject pinhole to open the drive; clean the laser lens with compressed air; update the \u201cfirmware\u201d for the drive; check cables connecting the drive to the motherboard."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17235469121160957, "y": -0.8016028301781674, "z": 0.5724742466414561, "word": "Partitioning: Dynamic drives", "pos_group": "other", "row_number": 1731, "definition": "A Windows-specific storage type that allows for advanced features like spanned volumes, striped volumes, and RAID (Redundant Array of Independent Disks) 5, offering more flexibility than basic disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \"Disk Management\" to import the foreign disk; ensure the OS is installed on a basic disk (standard requirement); backup all data before attempting to convert a basic disk to a dynamic disk as this can cause data loss."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.12070292160071121, "y": -0.8185394534672931, "z": 0.5616261815785637, "word": "RAID: Striping", "pos_group": "other", "row_number": 2065, "definition": "A RAID configuration that spreads data across multiple disks in an array, increasing performance by allowing simultaneous reading and writing, but providing no redundancy if a single drive fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Since striping does not offer redundancy, you must restore the data from a verified off-site or cloud backup; ensure the replacement drives are of identical capacity and speed before recreating the array."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14688218915143963, "y": -0.7862722654153218, "z": 0.6001679324561904, "word": "RAID: Mirror", "pos_group": "other", "row_number": 2066, "definition": "A RAID configuration that duplicates identical data across two or more disks, ensuring that the system continues to operate even if one drive fails, at the cost of having half (or less) of the total raw disk capacity available.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the faulty drive; the RAID controller will automatically (or with manual intervention) synchronize the data from the healthy 'mirror' drive to the new drive to restore the redundancy."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1613754405783468, "y": -0.8171423238868304, "z": 0.5533862933710727, "word": "RAID: Parity", "pos_group": "other", "row_number": 2067, "definition": "A checksum-based method of providing data redundancy in RAID configurations (like RAID 5 or 6), where calculated bits are spread across drives, allowing the system to reconstruct missing data if a single drive fails without needing a full mirror.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the failed drive using the controller\u2019s diagnostic logs, remove it, and insert a new drive to allow the controller to recalculate the missing data using the existing parity information."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1122542441647781, "y": -0.8042544672596211, "z": 0.5835869571537198, "word": "RAID: RAID 0", "pos_group": "other", "row_number": 2068, "definition": "A configuration that implements 'striping' across disks to improve performance by spreading data access, but it provides no fault tolerance; if one disk fails, all data is lost.", "details": [{"label": "TROUBLESHOOTING", "value": "RAID 0 is not fault-tolerant; you must rely on existing backups and re-initialize the array after replacing the failed physical hardware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17104457616799176, "y": -0.791452396749337, "z": 0.5868107502792042, "word": "RAID: RAID 1", "pos_group": "other", "row_number": 2069, "definition": "A configuration that implements 'mirroring' across two disks, providing high redundancy; if one disk fails, the data remains intact on the remaining operational disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the faulty drive and allow the array to rebuild the mirror from the surviving operational disk."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13371892504250074, "y": -0.824029962009902, "z": 0.550539617825491, "word": "RAID: RAID 4", "pos_group": "other", "row_number": 2070, "definition": "A configuration that uses disk striping with a dedicated parity drive to hold checksum information, though it is rarely used in modern systems because the dedicated parity drive can become a performance bottleneck.", "details": [{"label": "TROUBLESHOOTING", "value": "Troubleshoot via the RAID management interface; if the parity drive is failing, replace it and initiate a rebuild."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12876240547476459, "y": -0.7883274054868931, "z": 0.6016312364685332, "word": "RAID: RAID 5", "pos_group": "other", "row_number": 2071, "definition": "A configuration that uses block-level striping with distributed parity, requiring at least three disks; it offers a balance of performance and redundancy, allowing the array to survive the failure of one disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the single failed drive immediately; once the new drive is inserted, the controller will rebuild the missing data using parity from the surviving drives."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17487431889228755, "y": -0.8080977825101339, "z": 0.5624917301562423, "word": "RAID: RAID 6", "pos_group": "other", "row_number": 2072, "definition": "An extension of RAID 5 that uses 'double distributed parity,' requiring at least four disks; it provides higher fault tolerance than RAID 5 by allowing the array to survive the simultaneous failure of two disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the two failed drives one at a time, allowing the array to rebuild data before replacing the second drive, if supported by the controller."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.11082259384200695, "y": -0.8153380121307152, "z": 0.5682801058183047, "word": "RAID: RAID 10 (1 + 0)", "pos_group": "other", "row_number": 2073, "definition": "A nested RAID configuration that combines mirroring (RAID 1) and striping (RAID 0) across at least four disks, providing the high speed of striping and the high redundancy of mirroring.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the failed physical drive; the controller will rebuild the mirror for that specific set of the stripe."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.159167363989773, "y": -0.7839858865098214, "z": 0.6000265660735001, "word": "RAID: Hardware based", "pos_group": "other", "row_number": 2074, "definition": "A RAID implementation where a dedicated physical controller card handles all parity calculations and disk management, offloading the processing burden from the computer's CPU.", "details": [{"label": "TROUBLESHOOTIN
