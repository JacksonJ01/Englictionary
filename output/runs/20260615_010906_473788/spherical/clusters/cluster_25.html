t Privilege (giving users only the access needed for their job), mandating complex unique passwords, requiring multi-factor authentication (MFA), renaming default administrator names, and immediately disabling stale or terminated employee profiles.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a thorough user access review across the local system or directory environment; strip standard users out of elevated privilege groups; configure explicit password expiration and complexity constraints using administrative templates or Group Policy."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.09360317671846669, "y": 0.9955326186188004, "z": -0.0123794415950648, "word": "Accounts: User accounts", "pos_group": "other", "row_number": 58, "definition": "Standard local or domain identity containers assigned to individuals on a computer system. Standard user accounts run programs with restricted security privileges to protect core OS operating stability and safeguard system-wide directories from accidental modification.", "details": [{"label": "TROUBLESHOOTING", "value": "Educate users to operate within their designated profile directories (such as Documents or Desktop); use explicit permissions mapping or folder redirection configurations if a specific standard user requires routine access to a shared data partition."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07908033336864799, "y": 0.9963264739007318, "z": -0.03286119716075657, "word": "Active Directory: Group policies", "pos_group": "other", "row_number": 71, "definition": "A feature of Microsoft Active Directory environments that allows administrators to centrally configure and enforce OS settings, security restrictions, desktop configurations, and software installation behaviors for users and computer objects across an entire domain via Group Policy Objects (GPOs).", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \"gpupdate /force\" from the Command Prompt on the client computer ss every device on the network."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07068129170876288, "y": 0.9968327145471698, "z": -0.03645125801534726, "word": "Administrators, Run as", "pos_group": "other", "row_number": 96, "definition": "A specialized Windows context menu option that launches an application with elevated administrative privileges. It gives the application a full administrative access token, bypassing any standard user restrictions for that execution session.", "details": [{"label": "TROUBLESHOOTING", "value": "Right-click the program shortcut icon or the Command Prompt executable, select Run as administrator from the context menu, and click \"Yes\" on the User Account Control (UAC) safety pop-up window to launch the elevated program version."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07998092144416966, "y": 0.996794002664905, "z": 0.0021836795137266515, "word": "Applications: User permissions", "pos_group": "other", "row_number": 148, "definition": "Access control configurations that define what folders, files, registry sections, and system hardware features (like the camera or microphone) a running application can interact with based on the permissions of the logged-in user.", "details": [{"label": "TROUBLESHOOTING", "value": "Right-click the application shortcut icon and select \"Run as administrator\" to grant it elevated privileges for that session; open the folder's properties sheet, navigate to the Security tab, and adjust the NT File System (NTFS) access control list or permissions to grant the user profile explicit Read and Write access."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.09973745965247546, "y": 0.994442496126592, "z": -0.03371292095894148, "word": "Authentication: User accounts", "pos_group": "other", "row_number": 194, "definition": "Digital identity profiles managed inside an operating system or directory service database that hold configuration files, security group memberships, and login credentials for an i
