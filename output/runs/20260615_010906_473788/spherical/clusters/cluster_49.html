<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 49, "radius": 285.0, "nodes": [{"x": 0.19698068123478918, "y": 0.21949271152936578, "z": -0.955521617131588, "word": "ACK packets, three-way handshakes", "pos_group": "other", "row_number": 59, "definition": "Acknowledgment packets. The final data packet sent during the standard TCP (Transmission Control Protocol) connection establishment phase. The client sends a Synchronize Packet (SYN packet), the server responds with a Synchronize-Acknowledgment Packet (SYN-ACK), and the client returns an Acknowledgment Packet (ACK packet) to confirm a reliable connection has been successfully established.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect firewall filtering rules to ensure stateful packet inspection is not dropping legitimate incoming TCP ACK frames; check for asymmetric routing loops where outbound and inbound traffic are traversing different physical or logical paths."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.18692343514528198, "y": 0.21422846625624992, "z": -0.9587313459144758, "word": "SYN packet (Synchronize Packet)", "pos_group": "other", "row_number": 61, "definition": "The initial data packet sent by a client host to a server to initiate a TCP (Transmission Control Protocol) three-way handshake, used to establish a reliable, connection-oriented communication channel by synchronizing sequence numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "- Analyze Traffic with Wireshark: Capture packets on the network interface to verify if outbound SYN packets are actually being generated and transmitted.\n- Inspect Firewall and ACL (Allow Client List) Rules: Check local, network, and cloud firewalls to ensure that the required inbound/outbound (Transmission Control Protocol) TCP port is open and not dropping traffic.\n- Verify Service Status: Check the target server to confirm that the listening application or service is active and bound to the correct port.\n- Mitigate SYN Flood Attacks: Enable TCP SYN cookies on the server operating system or implement rate-limiting on network firewalls to protect against Denial of Service (DoS) attacks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.19289379095355033, "y": 0.22949678815262384, "z": -0.9540037786294129, "word": "SYN-ACK (Synchronize-Acknowledgment Packet)", "pos_group": "other", "row_number": 62, "definition": "The second packet in the TCP (Transmission Control Protocol) three-way handshake, sent by a server back to a client host to acknowledge the receipt of the initial SYN packet and synchronize its own sequence numbers for bidirectional communication.", "details": [{"label": "TROUBLESHOOTING", "value": "- Trace the Handshake Sequence: Use network sniffing tools (e.g., \"tcpdump\" or Wireshark) to verify if the server is generating the SYN-ACK packet and if it reaches the client.\n- Fix Asymmetric Routing: Check router and gateway configurations to ensure that the return path from the server back to the client is not taking a different, blocked route.\n- Adjust MTU Settings: Reduce the Maximum Transmission Unit (MTU) size on the network interfaces if large packets containing handshake headers are being silently dropped by intermediate routers.\n- Clear TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" and \"netsh winsock reset\" in an elevated Windows Command Prompt to clear local network corruption preventing proper handshake negotiation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2001414525247985, "y": 0.21004020101505883, "z": -0.9569882512020812, "word": "ACK packet (Acknowledgment Packet)", "pos_group": "other", "row_number": 63, "definition": "The final packet in the TCP (Transmission Control Protocol) three-way handshake\u2014and the baseline packet used during an active session\u2014sent to confirm the successful receipt of data or to complete the connection setup before data transmission begins.", "details": [{"label": "TROUBLESHOOTING", "value": "- Verify Three-Way Handshake Completion: Run a packet capture in Wireshark and filter for \"tcp.flags.ack == 1\" to verify if the client's final ACK packet is reaching the server interface.\n- Check Stateful Firewall Tables: Inspect intermediate firewalls to ensure they aren't prematurely dropping the ACK packet due to exhausted state table limits or overly aggressive timeout rules.\n- Disable TCP Offloading: Open Device Manager, navigate to your Network Adapter properties, click the Advanced tab, and temporarily disable Large Send Offload (LSO) and TCP Checksum Offload to resolve hardware-level packet formatting bugs.\n- Isolate Bad Network Hardware: Run a continuous ping test (\"ping -t\") alongside your data transfer to pinpoint faulty switches, damaged cables, or failing access points that are causing packet corruption and dropping small ACK frames."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.17899899690859566, "y": 0.22182299354283555, "z": -0.9585165197540476, "word": "Browsers: Secure connections", "pos_group": "other", "row_number": 284, "definition": "Encryption links established over HTTPS (Hypertext Transfer Protocol Secure) using SSL/TLS (Secure Sockets Layer/Transport Layer Security) protocols to encrypt communications between a browser and a web server.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the workstation system clock to ensure the current date and time are accurate, check that the domain name matches the certificate name, or clear the system's SSL state cache."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2047278478414567, "y": 0.2274711725592582, "z": -0.9520206793829228, "word": "Certificate Manager", "pos_group": "other", "row_number": 337, "definition": "A Windows utility used to manage user, computer, and service certificates for SSL/TLS (Secure Sockets Layer/Transport Layer Security) encryption and secure communications.", "details": [{"label": "TROUBLESHOOTING", "value": "Use 'certmgr.msc' to verify that the root CA (Certificate Authority) certificate is listed in the 'Trusted Root Certification Authorities' folder; delete or renew expired certificates."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.18890570159064665, "y": 0.20381360174600452, "z": -0.9606116029123667, "word": "Connection-oriented sessions, TCP", "pos_group": "other", "row_number": 464, "definition": "A communication process where a reliable connection is established before data is exchanged, using a three-way handshake (SYN, SYN-ACK, ACK).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both the sender and receiver are reachable, check for firewall rules blocking the specific port, and verify that the path between them is not experiencing high packet loss."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.18368639843739082, "y": 0.2349092665059193, "z": -0.9545035062998727, "word": "Encryption protocols", "pos_group": "other", "row_number": 845, "definition": "Standardized sets of rules and algorithms, such as Advanced Encryption Standard (AES) or Temporal Key Integrity Protocol (TKIP), used to ensure the secure transmission and storage of data across networks or devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Update client and server software to support modern, secure protocols, and ensure that devices are not forcing the use of deprecated/vulnerable protocols like TKIP or WEP (Wired Equivalent Privacy)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.21020516444040663, "y": 0.21309810850432967, "z": -0.9541503995673107, "word": "Encryption protocols: TKIP", "pos_group": "other", "row_number": 847, "definition": "Temporal Key Integrity Protocol (TKIP) was a stop-gap security protocol for WEP; it is now considered obsolete and insecure.", "details": [{"label": "TROUBLESHOOTING", "value": "Disable TKIP on all wireless access points and client devices, and migrate to WPA2-AES or WPA3."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.1745608592629195, "y": 0.21197539516434744, "z": -0.9615585984526945, "word": "Files: FTP", "pos_group": "other", "row_number": 943, "definition": "File Transfer Protocol (FTP) is a legacy network protocol based on a client-server architecture model that utilizes separate control and data connections across ports \u201c20\u201d and \u201c21\u201d to transmit unencrypted raw data files.", "details": [{"label": "TROUBLESHOOTING", "value": "Terminate standard insecure connections, update active endpoints to enforce Secure File Transfer Protocol (SFTP) over Port \u201c22\u201d, or File Transfer Protocol Secure (FTPS) over Port \u201c990\u201d, and adjust network firewalls to allow matching secure state connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2003667084634938, "y": 0.23810129213547004, "z": -0.9503478083433058, "word": "Flow control", "pos_group": "other", "row_number": 990, "definition": "A mechanism used in data transmission to manage the rate of data flow between two devices to prevent the sender from overwhelming the receiver\u2019s buffer.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the flow control setting (e.g., \u201cXON/XOFF\u201d or \u201cHardware Flow Control\u201d) matches on both the sending and receiving devices, or check the switch configuration to ensure buffer management is optimized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.1998135261217615, "y": 0.19887467313621243, "z": -0.9594391169656117, "word": "High latency, troubleshooting", "pos_group": "other", "row_number": 1064, "definition": "Addressing the delay between a command being sent over a network and the response being received, often causing \u201clag\u201d in real-time applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cping -t [destination IP]\u201d to check for packet loss and jitter, check for background network usage (e.g., large downloads), and verify physical network cable integrity or switch port performance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.17237690613507367, "y": 0.23070440276171358, "z": -0.9576333749288718, "word": "HTTP (Hypertext Transfer Protocol)", "pos_group": "other", "row_number": 1080, "definition": "An application-layer protocol used for transmitting hypermedia documents, such as HTML (HyperText Markup Language), over the web; it is the foundation of data communication for the World Wide Web.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the web server is running, check the network connection, and ensure that the URL is typed correctly; if testing locally, use a browser tool to inspect the server response headers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21510668537022826, "y": 0.2244464974533588, "z": -0.9504487801506996, "word": "HTTPS (HTTP Secure)", "pos_group": "other", "row_number": 1081, "definition": "An extension of HTTP that uses TLS (Transport Layer Security) or the older SSL (Secure Sockets Layer) to encrypt the communication channel between a web browser and a server.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the date and time on the local computer (as this affects certificate validation), check if the website\u2019s SSL certificate has expired, and ensure the certificate is issued by a trusted CA (Certificate Authority)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.17929807009821674, "y": 0.19962876398838403, "z": -0.9633278562605386, "word": "Jitter, troubleshooting", "pos_group": "other", "row_number": 1201, "definition": "The variation in the latency (delay) of packets arriving at their destination over a network, often causing inconsistent timing in real-time communication services like VoIP (Voice over IP) or video conferencing.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for network congestion by running a \u201cping\u201d test to measure packet consistency, implement QoS (Quality of Service) on the router to prioritize real-time traffic, upgrade from a congested Wi-Fi connection to a wired Ethernet connection, and verify that the ISP (Internet Service Provider) bandwidth meets the application's requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.18806949748832186, "y": 0.24423744534343098, "z": -0.9513032820329196, "word": "Latency: Troubleshooting", "pos_group": "other", "row_number": 1232, "definition": "The technical diagnostic sequence employed to trace and isolate transmission delays affecting data packet round-trip times between an executing source node and its target network destination address.", "details": [{"label": "TROUBLESHOOTING", "value": "Access an elevated interface shell environment and run the command \"pathping 8.8.8.8\" or \"tracert 8.8.8.8\" to locate the precise network hop point along the routing line where packet transit time experiences anomalies, and check for interface queue errors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21297243587957398, "y": 0.2027810823735329, "z": -0.9557837486518271, "word": "LDAP (Lightweight Directory Access Protocol)", "pos_group": "other", "row_number": 1234, "definition": "An open, cross-platform network protocol running over TCP/IP (Transmission Control Protocol/Internet Protocol) ports 389 and 636 (for encrypted LDAPS) used to query, manage, and authenticate user accounts, computer assets, and permissions within a centralized directory services database (such as Active Directory).", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the target directory server is reachable using the testing command tool \"ping\", use port-scanning tools to verify that firewall access control lists permit communication over port \"389\" or port \"636\", and check the structural string parameters of the user's distinguished name configuration fields."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.16575013282149545, "y": 0.21831503796284163, "z": -0.9616992449144064, "word": "Managing: flow control, TCP", "pos_group": "other", "row_number": 1419, "definition": "An integrated layer-4 transmission control protocol (TCP) connection management technique that controls data flow velocity between sending and receiving nodes, ensuring a fast sender doesn't overwhelm a slower receiver's memory buffer.", "details": [{"label": "TROUBLESHOOTING", "value": "Capture network streams using a protocol analyzer like Wireshark, check the sliding window size value parameters within the TCP header files, check for network interface card (NIC) buffer overruns, and update network card driver stacks to enable hardware-offloaded flow-control configurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21100377707352444, "y": 0.23869029138569606, "z": -0.947894693971286, "word": "Networks: Jitter, troubleshooting", "pos_group": "other", "row_number": 1596, "definition": "The variation in the delay of received packets; high jitter causes voice/video calls to sound garbled or pixelated.", "details": [{"label": "TROUBLESHOOTING", "value": "Prioritize real-time traffic using QoS (Quality of Service) on the network router, reduce the number of active high-bandwidth background downloads, and inspect the link for congestion or failing hardware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.1923273817592435, "y": 0.1913709109091174, "z": -0.9624901831621189, "word": "Networks: Latency, troubleshooting", "pos_group": "other", "row_number": 1598, "definition": "The time it takes for a data packet to travel from the source to the destination; high latency results in a \"laggy\" user experience.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cping\u201d or \u201cpathping\u201d to find which hop has the high response time, reduce network congestion by restricting background bandwidth-heavy applications, and ensure the hardware (cables/switches) is running at the correct speed (e.g., 1 Gbps vs 100 Mbps)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.17287642511262852, "y": 0.24149117484839747, "z": -0.9548799684309114, "word": "POP3 (Post Office Protocol 3)", "pos_group": "other", "row_number": 1853, "definition": "An application layer internet protocol running over TCP (Transmission Control Protocol) port 110 that allows mail clients to download messages from a remote mail server onto a local drive, typically erasing them from the server cache afterward.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the incoming server field parameters match the provider configuration exactly, verify that TCP port 110 is open through the local client firewall, or switch configurations to port 995 if the mail vendor mandates POP3S (POP3 Secure) encrypted over SSL/TLS (Secure Sockets Layer / Transport Layer Security)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.22189656037618952, "y": 0.21546570150827038, "z": -0.9509660603653345, "word": "Protocols: FTP (File Transfer Protocol)", "pos_group": "other", "row_number": 1990, "definition": "A standard network protocol used for the transfer of computer files between a client and a server on a computer network.", "details": [{"label": "TROUBLESHOOTING", "value": "Check that the FTP port (standard is 21) is open on the firewall; verify if the transfer mode (Active vs. Passive) matches the server requirements; confirm credentials are correct."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.16827449441571418, "y": 0.20217470696608925, "z": -0.9647844745808838, "word": "Protocols: HTTP (HyperText Transfer Protocol)", "pos_group": "other", "row_number": 1991, "definition": "The foundational protocol of the World Wide Web, used for transmitting hypermedia documents like HTML.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the web server service is running, check if the website is accessible via a different device to rule out local network issues, and clear the browser cache."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.19782940916842848, "y": 0.24943924298669742, "z": -0.9479681370838863, "word": "Protocols: HTTPS (HyperText Transfer Protocol Secure)", "pos_group": "other", "row_number": 1992, "definition": "An extension of HTTP that uses TLS (Transport Layer Security) for secure communication over a computer network, providing encryption and authentication.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the system date and time (incorrect time causes certificate errors), view the certificate details to check for expiration, and ensure the server certificate is trusted by the client."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.20929011256149682, "y": 0.19209111661000486, "z": -0.9588006318852306, "word": "Protocols: Port listings", "pos_group": "other", "row_number": 1996, "definition": "The documented reference of standard communication ports (0\u201365535) and their associated services (e.g., Port 80 for HTTP, Port 22 for SSH).", "details": [{"label": "TROUBLESHOOTING", "value": "Consult official IANA (Internet Assigned Numbers Authority) documentation for standard port numbers, and use the \u201cnetstat -a\u201d command to see which ports are currently listening on the local machine."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.16121054709822732, "y": 0.22912880155055232, "z": -0.9599537237827134, "word": "Protocols: TCP (Transmission Control Protocol)", "pos_group": "other", "row_number": 2003, "definition": "A connection-oriented protocol that ensures the reliable delivery of data packets by using acknowledgments and retransmissions.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network diagnostic tools like \u201cnetstat\u201d to check for active connections, or \u201cWireshark\u201d to analyze packet retransmissions, which often indicate network congestion or packet loss."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.22158611908860695, "y": 0.23309091123296394, "z": -0.9468728631277994, "word": "Protocols: Telnet", "pos_group": "other", "row_number": 2004, "definition": "An older network protocol used to provide a bidirectional interactive text-oriented communication facility using a virtual terminal connection (unencrypted).", "details": [{"label": "TROUBLESHOOTING", "value": "Telnet is widely deprecated; verify that the telnet client/server is enabled in \u201cWindows Features\u201d if required for legacy device configuration, but transition to SSH whenever possible."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.18079109779160193, "y": 0.1886295802201745, "z": -0.9652634150454829, "word": "Protocols: UDP (User Datagram Protocol)", "pos_group": "other", "row_number": 2005, "definition": "A connectionless protocol that sends data packets without requiring a connection handshake or acknowledgment of receipt, making it faster but less reliable than TCP.", "details": [{"label": "TROUBLESHOOTING", "value": "Since UDP does not have error recovery, ensure the network infrastructure is not experiencing heavy load, and check for QoS (Quality of Service) settings on routers to prioritize UDP traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.179396228948082, "y": 0.2512808286089739, "z": -0.9511440154954426, "word": "Remote access: SSH", "pos_group": "other", "row_number": 2126, "definition": "A command-line remote terminal communication protocol that encrypts all management traffic, keystrokes, and parameter text over an untrusted network link.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the target host is active via 'ping', ensure the SSH daemon configuration allows requests from your subnet, and verify firewall access lists allow inbound port 22."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.22375326433259274, "y": 0.20330276414892628, "z": -0.9532064114292953, "word": "Secure sites", "pos_group": "other", "row_number": 2250, "definition": "Websites that use HTTPS (Hypertext Transfer Protocol Secure) to encrypt communication between the browser and the web server, ensuring data privacy and integrity.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the system clock is set to the correct date and time, as an incorrect clock invalidates SSL/TLS (Secure Sockets Layer/Transport Layer Security)
