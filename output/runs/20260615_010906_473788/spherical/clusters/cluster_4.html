sical laminated cards near the hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.846226261645676, "y": 0.0004639816677682277, "z": 0.5328235156430278, "word": "Communications: Proper techniques/professionalism", "pos_group": "other", "row_number": 416, "definition": "Adhering to standards of conduct, such as active listening, clarity, and empathy, when performing technical support.", "details": [{"label": "TROUBLESHOOTING", "value": "Use clear language, avoid technical jargon, document all communications, and follow professional technician behavior."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.839824874498867, "y": 0.020394897851362347, "z": 0.5424741729470579, "word": "CompTIA A+ certification exams: Cheat sheets", "pos_group": "other", "row_number": 430, "definition": "Summarized study aids containing key facts, acronyms, and procedures used for exam review.", "details": [{"label": "TROUBLESHOOTING", "value": "Create your own personalized study summaries; note that using actual cheat sheets during the official exam is a violation of testing policy."}, {"label": "CORE", "value": "CORE 1 & 2"}]}, {"x": 0.8370553836225666, "y": -0.004822723179773748, "z": 0.5470969074027099, "word": "CompTIA A+ certification exams: Exam preparation", "pos_group": "other", "row_number": 431, "definition": "The structured study process to master the domains covered in the A+ curriculum.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify your weakest domain, allocate more study time to it, and utilize hands-on practice (e.g., virtual machines or spare hardware)."}, {"label": "CORE", "value": "CORE 1 & 2"}]}, {"x": 0.8493507598535139, "y": 0.011640978686853279, "z": 0.5277004589267199, "word": "CompTIA A+ certification exams: Post exam/furthering education", "pos_group": "other", "row_number": 432, "definition": "Career development steps taken after earning the A+ certification, such as pursuing Network+ or Security+.", "details": [{"label": "TROUBLESHOOTING", : "other", "row_number": 1802, "definition": "The practice of designing the workstation and adjusting equipment to fit the user, reducing physical stress, strain, and long-term injury risks (such as RSI - Repetitive Strain Injury).", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the chair height so feet are flat on the floor, position the monitor at eye level, use a keyboard tray, and ensure the mouse is positioned to allow a neutral wrist posture."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8568831568455761, "y": 0.020142154691336966, "z": 0.5151170246834692, "word": "Planning: Action plans, CompTIA troubleshooting process", "pos_group": "other", "row_number": 1832, "definition": "A formal step in the troubleshooting process where a technician documents the steps to resolve a problem after testing a theory.", "details": [{"label": "TROUBLESHOOTING", "value": "Draft an action plan that includes the proposed fix, potential impact to the user, and a fallback plan in case the fix fails."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8238800428873774, "y": 0.018501269704178376, "z": 0.5664621593286053, "word": "Preparing for exams", "pos_group": "other", "row_number": 1909, "definition": "The systematic methodology used to study for professional certifications like CompTIA A+ by using official study guides, practice tests, and hands-on laboratory experiences.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a study schedule, focus on weak areas identified by practice tests, use virtual labs (like Hyper-V or VirtualBox) to simulate hands-on hardware and software scenarios, and utilize official CompTIA exam objectives as a checklist."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8494937004689599, "y": -0.022219913534797527, "z": 0.5271306558207928, "word": "Preparing for exams: Cheat sheets", "pos_group": "other", "row_number": 1910, "definition": "Condensed, one-page reference documents containing critical information such as port n ethodology\u2014to maintain hardware and software to prevent future issues from occurring.", "details": [{"label": "TROUBLESHOOTING", "value": "Once a problem is resolved, ensure you fully document the findings, perform preventative maintenance (like cleaning dust or updating drivers), and educate the user to prevent the same error from happening again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8285994952452463, "y": 0.03568383250630283, "z": 0.5587034460042152, "word": "Probable cause, theories of", "pos_group": "other", "row_number": 1960, "definition": "An initial assessment during the CompTIA troubleshooting process where the technician predicts the likely cause of a problem based on symptoms.", "details": [{"label": "TROUBLESHOOTING", "value": "Gather as much information as possible from the user, avoid making assumptions, and use a systematic process to test each theory starting from the simplest and most likely causes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8393922710979441, "y": -0.02878026762790211, "z": 0.5427635870397917, "word": "Problems, CompTIA troubleshooting process: Identifying problems", "pos_group": "other", "row_number": 1962, "definition": "The first step in the troubleshooting process where the technician gathers information, identifies symptoms, and questions the user to define the exact issue.", "details": [{"label": "TROUBLESHOOTING", "value": "Ask open-ended questions, identify changes made to the system recently, use diagnostic software, and review logs before attempting any physical repair."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8550889025536071, "y": 0.03263746238945675, "z": 0.5174531522548148, "word": "Problems, CompTIA troubleshooting process: Resolving problems", "pos_group": "other", "row_number": 1963, "definition": "The final stages of the troubleshooting process where a technician implements a fix, verifies it works, and documents the solution for future reference.", "details": [{"label": "TROUBL
