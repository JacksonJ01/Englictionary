el control, true blacks, and no backlight.", "details": [{"label": "TROUBLESHOOTING", "value": "Avoid static images to prevent burn-in. If burn-in occurs, some modern OLEDs have a \u201cPixel Refresh\u201d utility in the display settings to help mitigate image retention."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3883037250157472, "y": -0.8849984373064609, "z": -0.2569007261648299, "word": "Displays: Refresh rates", "pos_group": "other", "row_number": 691, "definition": "The frequency (measured in Hz - Hertz) at which the display updates the image on the screen per second.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to \u201cDisplay settings > Advanced display settings\u201d and ensure the refresh rate is set to the monitor's rated capability."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38260046841158596, "y": -0.8988173761885411, "z": -0.21387895135515678, "word": "Displays: TN displays", "pos_group": "other", "row_number": 692, "definition": "A fast, cost-effective LCD panel technology known for high refresh rates and low latency, but with poor color accuracy and narrow viewing angles.", "details": [{"label": "TROUBLESHOOTING", "value": "This is a limitation of the technology; ensure the monitor is positioned directly at eye level to mitigate viewing angle issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3577914409656706, "y": -0.8986373674148381, "z": -0.25384279910495466, "word": "Displays: Troubleshooting", "pos_group": "other", "row_number": 694, "definition": "The systematic process of identifying, analyzing, and solving issues with display output, including video signal, power, and panel health.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the \"Troubleshooting Methodology\": Check cables (swap them), verify power, perform a monitor self-test, test on a different computer, check resolution settings, and update graphics drivers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4015630000834496, "y": -0.884 w_number": 733, "definition": "The number of pixels displayed on a screen, expressed as horizontal width by vertical height (e.g., 1920x1080).", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDisplay settings\u201d, locate \u201cDisplay resolution\u201d, and always set it to the \u201cRecommended\u201d (native) setting for that specific monitor to ensure maximum clarity and sharpness."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.35026481850474117, "y": -0.9049643375026667, "z": -0.241565942893861, "word": "Electrical safety: LCD monitors", "pos_group": "other", "row_number": 818, "definition": "Safety configurations and precautions optimized for handling Liquid Crystal Display (LCD) screens, focusing primarily on avoiding the internal high-voltage inverter blocks that power legacy cold-cathode fluorescent backlights.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the incoming Low-Voltage Differential Signaling (LVDS) or power inputs, confirm the internal power transformer adapter brick is detached, and check that the internal power control daughterboards do not exhibit signs of physical swelling or component degradation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3983811155032508, "y": -0.88124186574571, "z": -0.25437228793130223, "word": "Electroluminescence", "pos_group": "other", "row_number": 821, "definition": "An optical and electrical phenomenon wherein a specialized material emits light in direct response to the passage of an electrical current or a strong electromagnetic field, serving as the core operational foundation for Organic Light-Emitting Diode (OLED) display technologies.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the video driver data interface cable link for signal attenuation, adjust overall brightness levels inside the operating system to clear mild persistent image retention artifacts, and replace the display panel assembly if individual pixel matrices suffer from permanent emitter burnout."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3738958025268418, "y": -0.9036642052645507, "z": -0.20878920704001247, "word": "External laptop monitor, troubleshooting", "pos_group": "other", "row_number": 908, "definition": "The process of resolving connectivity and display issues between a laptop and an external visual display device (like a monitor or projector).", "details": [{"label": "TROUBLESHOOTING", "value": "Check all cable connections, use the \u201cWindows + P\u201d shortcut to toggle the project mode (e.g., Extend or Duplicate), and update the laptop\u2019s video drivers via the manufacturer's website."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.360506000448818, "y": -0.8945942447890651, "z": -0.26407680858166854, "word": "GPU (Graphics Processing Unit)", "pos_group": "other", "row_number": 1006, "definition": "A specialized electronic circuit designed to rapidly manipulate and alter memory to accelerate the creation of images in a frame buffer intended for output to a display device.", "details": [{"label": "TROUBLESHOOTING", "value": "Reseat the graphics card in the PCIe (Peripheral Component Interconnect Express) slot, update the display drivers, ensure adequate power supply cabling, and monitor temperatures using software utilities."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4061632231577057, "y": -0.8848082132506428, "z": -0.22835468446771257, "word": "Inverters", "pos_group": "other", "row_number": 1168, "definition": "An electrical component found in older laptop LCD (Liquid Crystal Display) screens that converts low-voltage DC (Direct Current) power from the system board into the higher-voltage AC (Alternating Current) power required to drive CCFL (Cold Cathode Fluorescent Lamp) backlights.", "details": [{"label": "TROUBLESHOOTING", "value": "If the screen backlight fails, replace the small inverter board located behind the LCD bezel; however, note that modern LED (Light Emitting Diode) displays do not use inverters, s
