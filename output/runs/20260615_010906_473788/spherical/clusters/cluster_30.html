he command prompt as an \u201cAdministrator\u201d, and execute diagnostic utilities like \u201cchkdsk\u201d (Check Disk) or management commands to repair or modify storage structures."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5285186734654401, "y": -0.3672478223829898, "z": 0.7653737967511584, "word": "File system commands: Defrag command", "pos_group": "other", "row_number": 927, "definition": "The \u201cdefrag\u201d command optimizes a mechanical hard drive by rearranging fragmented data into contiguous blocks, improving read/write speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \u201cdefrag [drive_letter]: /O\u201d to optimize the drive. Note: Do not run this on SSDs (Solid-State Drives), as it causes unnecessary wear."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5565458722563061, "y": -0.40221865634271226, "z": 0.726964128801642, "word": "File system commands: Diskpart command", "pos_group": "other", "row_number": 928, "definition": "A powerful command-line tool used for disk, partition, and volume management tasks in Windows.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the command \u201cdiskpart\u201d, use \u201clist disk\u201d to identify the target disk, \u201cselect disk [number]\u201d to target it, and \u201cclean\u201d to erase it\u2014ensure you have backed up all data before executing this command."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5072471255353211, "y": -0.4044883104712186, "z": 0.7609793429051102, "word": "File system commands: Format command", "pos_group": "other", "row_number": 929, "definition": "The \u201cformat\u201d command initializes a volume with a specific file system (like NTFS\u2014New Technology File System or exFAT\u2014Extended File Allocation Table), erasing all data on the volume.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the command \u201cformat [drive_letter]: /fs:ntfs\u201d to format the drive with the NTFS file system. Warning: This will delete all files on the drive."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5521297311335661, "y": -0.36502258959871603, "z": 0.7496074099693941, "word": "File systems: Linux", "pos_group": "other", "row_number": 931, "definition": "File system structures used by Linux-based operating systems, such as ext4 (Fourth Extended Filesystem) or XFS.", "details": [{"label": "TROUBLESHOOTING", "value": "Use commands like \u201cfsck\u201d (File System Consistency Check) to repair the file system or install third-party drivers to allow Windows to read Linux partitions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5357089112943856, "y": -0.4217186908565661, "z": 0.7315526694244293, "word": "File systems: macOS (OS X)", "pos_group": "other", "row_number": 932, "definition": "The file system used by Apple operating systems, currently APFS (Apple File System).", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cDisk Utility\u201d on macOS to repair the file system or reformat the drive to a cross-compatible format like exFAT if it needs to be used on both Windows and macOS."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5140580972597257, "y": -0.3775028571540538, "z": 0.7702180635912379, "word": "GPT (GUID Partition Table)", "pos_group": "other", "row_number": 1005, "definition": "A standard for the layout of partition tables on a physical storage device, using Globally Unique Identifiers (GUIDs) to support larger volumes and more partitions than the legacy MBR (Master Boot Record).", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cDisk Management\u201d tool or the \u201cdiskpart\u201d utility to convert the drive to GPT; note that this process will erase all existing data, so ensure a backup is performed first."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5632831862612063, "y": -0.3852990673096181, "z": 0.7309286427591692, "word": "Hard drives: Formatting", "pos_group": "other", "row_number": 1029, "definition": "The initialization process of a storage device or partition to prepare it for use with a specific file system (such as NTFS\u2014New Technology File System or exFAT\u2014Extended File Allocation Table), which organizes the disk structure.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDisk Management\u201d (\u201cdiskmgmt.msc\u201d), right-click the unallocated or corrupted volume, select \u201cFormat\u201d, choose the desired file system and allocation unit size, and click \u201cPerform a quick format\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5119248238635755, "y": -0.4190514093781864, "z": 0.7498859186639009, "word": "Hard drives: Initializing", "pos_group": "other", "row_number": 1031, "definition": "The process of preparing a new or unformatted disk so the operating system can recognize it and use it to store data, typically involving the selection of a partition style like MBR (Master Boot Record) or GPT (GUID Partition Table).", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDisk Management\u201d, locate the drive labeled \u201cNot Initialized\u201d, right-click the disk area, select \u201cInitialize Disk\u201d, choose the partition style (GPT is recommended for modern systems), and then create a partition."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5380926360941309, "y": -0.3605968045918065, "z": 0.7618571122588852, "word": "Hard drives: Mounting drives", "pos_group": "other", "row_number": 1034, "definition": "A process where an operating system makes a storage device or partition available for access by the user within the file system hierarchy.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive is formatted correctly, use the \u201cDisk Management\u201d tool to assign a drive letter, or\u2014if mounting a virtual disk\u2014right-click the file and select \u201cMount\u201d to create a temporary logical drive."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5516703183786996, "y": -0.41325427950957727, "z": 0.7244865494175613, "word": "Initializing drives", "pos_group": "other", "row_number": 1128, "definition": "The administrative and logical process of preparing a new or unformatted non-volatile physical storage drive so that the operating system (OS) can recognize its geometry, assign a partition style, and track its data sectors.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows Run dialog, execute the command \u201cdiskmgmt.msc\u201d to launch the Disk Management console, locate the storage drive marked as \u201cUnknown / Not Initialized\u201d, right-click the drive disk number cell block, select \u201cInitialize Disk\u201d, choose the \u201cGPT\u201d (GUID Partition Table) partition style for modern systems, and click \u201cOK\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5045380558480211, "y": -0.39454175394810215, "z": 0.7679701521495835, "word": "Linux: Df command", "pos_group": "other", "row_number": 1270, "definition": "The disk free (df) command is a system diagnostics utility used to display a summary table of the total, allocated, and remaining storage capacity across all mounted storage file systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the checking command appending the human-readable parameter flag as \"df -h\" to view storage allocations in gigabytes and megabytes, locate the specific partition showing 100% disk usage, and purge old temporary files."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5609490720697662, "y": -0.3684953967145754, "z": 0.7413145628842294, "word": "Linux: File systems", "pos_group": "other", "row_number": 1276, "definition": "The structured logical architecture patterns (such as ext4\u2014Fourth Extended Filesystem, XFS, or Btrfs) that specify how raw binary blocks of data are partitioned, cataloged, stored, named, and retrieved across physical storage devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Unmount the degraded mass storage drive partition mount line and execute the system repair utility command \"sudo fsck /dev/sdb1\" to check block allocation link anomalies and rebuild directory mapping tables."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5250073694591874, "y": -0.42650432722383586, "z": 0.7365197355623864, "word": "Linux: GPT", "pos_group": "other", "row_number": 1279, "definition": "The GUID Partition Table (GPT) is a modern partitioning architecture standard that replaces the legacy Master Boot Record (MBR) partition format, supporting up to 128 primary partitions per storage device and disk storage allocations exceeding 2 Terabytes (TB).", "details": [{"label": "TROUBLESHOOTING", "value": "Run the interactive command-line partition utility \"sudo parted /dev/sda\", execute the internal labeling declaration \"mklabel gpt\" to wipe legacy structures, and establish modern partition sets."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5208602415447866, "y": -0.3666013099202624, "z": 0.7709138008510773, "word": "Linux: Partitioning", "pos_group": "other", "row_number": 1288, "definition": "The structural logical division of a physical storage drive into independent storage segments, enabling a clean separation between the operating system kernel, user files, and swap memory cache areas.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the system partition manager configuration console via the command \"sudo fdisk /dev/sda\" or use graphical tools to create independent mounts for \"/\", \"/home\", and \"swap\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.563783112175245, "y": -0.3965810535517173, "z": 0.7244805521128949, "word": "Logical drives", "pos_group": "other", "row_number": 1319, "definition": "An independent partition volume space mapped within an extended partition layout on a basic disk, functioning as a distinct drive letter allocation (e.g., drive \u201cD:\u201d or drive \u201cE:\u201d) inside file management utilities.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the administrative Disk Management console interface by entering the command \"diskmgmt.msc\" inside a Run dialog prompt, locate the extended partition block boundary, right-click unallocated space, select \"New Logical Drive\", follow the setup steps, assign an unallocated drive letter string, and format the space with the NTFS (New Technology File System) file system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5039925598426682, "y": -0.41310491845221353, "z": 0.7585089491718766, "word": "macOS (OS X): Disk Utility", "pos_group": "other", "row_number": 1358, "definition": "A built-in macOS storage management utility used to partition, format, verify, repair, and manage internal and external storage drives, volumes, and disk images.", "details": [{"label": "TROUBLESHOOTING", "value": "Open Finder, navigate to \u201cApplications > Utilities\u201d, and execute \u201cDisk Utility\u201d. Select the malfunctioning volume from the left-hand sidebar, click the \u201cFirst Aid\u201d button on the top menu bar, and click \u201cRun\u201d to scan and automatically fix catalog file corruption and invalid block allocations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5492292195216351, "y": -0.3578129581667712, "z": 0.7551934529586443, "word": "macOS (OS X): file systems", "pos_group": "other", "row_number": 1362, "definition": "The background structural standard used by macOS\u2014such as APFS (Apple File System) for modern solid-state drives or HFS+ (Hierarchical File System Plus) for older mechanical drives\u2014to organize, store, index, and retrieve data files.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot into macOS Recovery using \u201cCommand (\u2318) + R\u201d, open \u201cDisk Utility\u201d, click on the top-level system drive container, and run \u201cFirst Aid\u201d to fix corrupted directory structures, catalog trees, and B-tree file attributes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5428546869402451, "y": -0.42331878275029045, "z": 0.725334403594522, "word": "Managing: Disk Management", "pos_group": "other", "row_number": 1416, "definition": "A native, graphical system configuration framework utility in Microsoft Windows used to format, partition, initialize, shrink, expand, and assign drive letters to local physical storage drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Run command terminal by pressing \u201cWindows Key + R\u201d, enter the initialization command \u201cdiskmgmt.msc\u201d, right-click the target drive marked with a black unallocated banner string, select \u201cNew Simple Volume\u201d, complete the partitioning allocation wizard options, assign a file system structure format like NTFS (New Technology File System), and allocate an available volume letter designation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5061359286307956, "y": -0.38214432381199637, "z": 0.7731701866518872, "word": "Mounting drives", "pos_group": "other", "row_number": 1475, "definition": "The administrative process in an operating system (OS) of attaching a formatted disk partition or external storage volume to a specific directory path (known as a mount point) within an established file system, rather than assigning it a traditional drive letter.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows Run dialog box by pressing the shortcut key combination \u201cWindows Key + R\u201d, execute the command \u201cdiskmgmt.msc\u201d to initialize Disk Management, right-click the target volume, select \u201cChange Drive Letter and Paths\u201d, click the \u201cAdd\u201d button, select the radio toggle button labeled \u201cMount in the following empty NTFS (New Technology File System) folder\u201d, browse to and select a pre-created empty folder directory on an active host volume, and click \u201cOK\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5673139090017222, "y": -0.37660746282712293, "z": 0.7323399126062317, "word": "Moving: files", "pos_group": "other", "row_number": 1476, "definition": "The operational file system instruction that changes the logical directory assignment of a file, transferring the directory entry from a source path to a destination path; this moves the data without duplicating the physical bits when executed within the same volume partition.", "details": [{"label": "TROUBLESHOOTING", "value": "To safely relocate a file across directories via the command-line interface (CLI), launch an elevated Command Prompt window and execute the instruction \u201cmove \"C:\\SourceDirectory\\document.txt\" \"C:\\DestinationDirectory\"\u201d. If cross-volume file transfer attributes are required, ensure the user account maintains explicit write and delete authorizations on the source file system node by inspecting security properties folders."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5136229392819723, "y": -0.42683787708597554, "z": 0.7443123691892302, "word": "MS OS (Microsoft Operating System): Disk Management", "pos_group": "other", "row_number": 1481, "definition": "A native Windows system layout configuration framework tool used to execute partition modifications, initialize brand new storage media drives, create or extend volume profiles, assign drive mappings, change file system formats, and manage dynamic arrays.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the primary volume configuration panel by executing the terminal system command \u201cdiskmgmt.msc\u201d, right-click a newly mapped disk block and choose \u201cInitialize Disk\u201d using the GPT (GUID Partition Table) partition style format layout. Right-click the unallocated storage block space, select \u201cNew Simple Volume\u201d, and follow the wizard instructions to format the drive block using the NTFS standard."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5311600382791293, "y": -0.357661776274081, "z": 0.7680801179094425, "word": "Optimizing drives", "pos_group": "other", "row_number": 1695, "definition": "A maintenance task for HDDs to rearrange fragmented data to improve access times, or for SSDs (Solid State Drives) to send a TRIM command to manage data blocks.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDefragment and Optimize Drives\u201d; select the target drive and click \u201cOptimize\u201d; ensure the OS is correctly identifying the drive type (do not defrag an SSD)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5597521175620085, "y": -0.4094306115339023, "z": 0.7204471814254132, "word": "OS (Operating Systems): Partitioning drives", "pos_group": "other", "row_number": 1712, "definition": "The process of dividing a physical hard drive into separate logical volumes, which can be formatted and treated as individual drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cDisk Management\u201d tool in Windows; delete unwanted volumes and create new simple volumes; ensure the partition scheme matches the firmware (GPT for UEFI (Unified Extensible Firmware Interface), MBR for legacy BIOS)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4992896538467061, "y": -0.40283720954505714, "z": 0.7670932304274285, "word": "Partitioning", "pos_group": "other", "row_number": 1728, "definition": "The process of dividing a physical hard drive into separate logical storage sections, which the OS treats as individual units.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \"Disk Management\"; initialize the disk; create new volumes; assign drive letters; ensure the partition style (MBR or GPT) is compatible with the system firmware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.560124154411585, "y": -0.3598939571808015, "z": 0.7461482903749429, "word": "Partitioning: Basic drives", "pos_group": "other", "row_number": 1730, "definition": "A storage disk format that uses primary partitions, extended partitions, and logical drives to organize data; it is the traditional partitioning method for Windows.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \"Disk Management\" to re-partition or convert to a dynamic drive if required; verify that the partition scheme matches the firmware requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.531136794116335, "y": -0.4304907175217951, "z": 0.7297749297306616, "word": "Partitioning: Extended partitions", "pos_group": "other", "row_number": 1732, "definition": "A container partition on a basic MBR (Master Boot Record) drive that can hold multiple logical drives, bypassing the limit of four primary partitions.", "details": [{"label": "TROUBLESHOOTING", "value": "Delete unnecessary logical drives inside the partition before resizing or deleting the extended partition container itself using \"Disk Management\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5123079366877454, "y": -0.36914635638735716, "z": 0.77541701398195, "word": "Partitioning: GPT (GUID Partition Table)", "pos_group": "other", "row_number": 1733, "definition": "A modern partition scheme that is part of the UEFI standard, supporting drives larger than 2 TB (Terabyte) and an unlimited number of partitions (limited by the OS).", "details": [{"label": "TROUBLESHOOTING", "value": "Convert the disk from MBR to GPT using \"Disk Management\" or the \"diskpart\" command \"convert gpt\" (requires deleting all data); ensure the system is booting in \"UEFI mode\" rather than \"Legacy BIOS\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5697886996379744, "y": -0.3885387025657242, "z": 0.7241398444868297, "word": "Partitioning: Linux", "pos_group": "other", "row_number": 1734, "definition": "The method of organizing storage on Linux-based OS; it uses distinct partition types (like EXT4 - Fourth Extended Filesystem) and swap space.", "details": [{"label": "TROUBLESHOOTING", "value": "Use tools like \"fdisk\", \"gparted\", or \"lsblk\" to verify partition tables; ensure the correct file system (like \"xfs\" or \"ext4\") is used; check \"/etc/fstab\" for correct mount points."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5034174747378278, "y": -0.4220821704155713, "z": 0.7539346706087136, "word": "Partitioning: Logical drives", "pos_group": "other", "row_number": 1735, "definition": "Individual drives created within an extended partition on a basic MBR disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the extended partition has sufficient free space; verify the disk management console shows the partition as healthy and active."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5436337178943498, "y": -0.35245155548006446, "z": 0.7617350469868441, "word": "Partitioning: MBR (Master Boot Record)", "pos_group": "other", "row_number": 1736, "definition": "An older, traditional partition scheme that stores partition information at the very beginning of the drive; it is limited to 2 TB drives and four primary partitions.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \"Disk Management\" or \"diskpart\" to reformat as GPT if the firmware supports UEFI; verify boot mode settings in the BIOS."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5512880017782572, "y": -0.42186388685675735, "z": 0.7198002501121025, "word": "Partitioning: Primary partitions", "pos_group": "other", "row_number": 1737, "definition": "A section of a hard drive that can hold an OS and boot files; an MBR drive can have up to four primary partitions.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the current partition count in \"Disk Management\"; delete or combine existing partitions to reclaim space; if at the four-partition limit, convert to an extended partition."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.49899860248919503, "y": -0.3894203029021718, "z": 0.7741784176799371, "word": "Partitioning: Volumes versus", "pos_group": "other", "row_number": 1739, "definition": "In Windows, the terms \"partition\" and \"volume\" are often used interchangeably, but a volu
