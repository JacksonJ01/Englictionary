<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 13, "radius": 285.0, "nodes": [{"x": 0.39660721167307217, "y": -0.09365932832450413, "z": -0.9131980343094883, "word": "2.4 GHz channels", "pos_group": "other", "row_number": 1, "definition": "A frequency band used by wireless networks (802.11 standards). It offers a long range and better propagation through solid walls but is highly congested. In the US, it consists of 11 channels, but only channels 1, 6, and 11 are completely non-overlapping.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the wireless access point/router; change the channel configuration from \"Auto\" to a fixed, non-overlapping channel (1, 6, or 11); use a Wi-Fi analyzer app to determine which of those three is the least congested."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39442474612924106, "y": -0.08377255967874327, "z": -0.9151017855330383, "word": "5 GHz channels", "pos_group": "other", "row_number": 6, "definition": "A high-frequency wireless band utilized by modern 802.11 standards. It offers significantly faster data transfer speeds and contains dozens of non-overlapping channels, making it highly resistant to interference, though it has a shorter effective range and struggles to pass through solid walls.", "details": [{"label": "TROUBLESHOOTING", "value": "Relocate the wireless router away from physical obstructions and place it higher in the room; ensure the client device's network card settings support 5 GHz bands; configure a separate, clear SSID name specifically for the 5 GHz network to prevent client steering confusion."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.405291805580791, "y": -0.09230093231313027, "z": -0.9095158548498148, "word": "802.11 wireless protocol: Channel bonding", "pos_group": "other", "row_number": 13, "definition": "A technology that combines two or more adjacent wireless channels into a single, wider channel to significantly increase data throughput speeds. For example, 802.11n can bond two 20 MHz channels into a 40 MHz channel, and newer standards can bond up to 160 MHz.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless access point configuration; reduce the channel width (e.g., lower it from 80 MHz back to 40 MHz or 20 MHz) if the local RF environment is highly congested to increase connection stability."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38852142421503844, "y": -0.09434921059067156, "z": -0.9165966012302443, "word": "802.11 wireless protocol: Channels", "pos_group": "other", "row_number": 14, "definition": "Smaller, distinct slices of a wireless frequency band allocated for communication. The 2.4 GHz band uses 11 channels (in the US) with only 3 being non-overlapping (1, 6, 11), while the 5 GHz and 6 GHz bands offer far more channels that do not overlap.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a wireless site survey; log into the wireless access point and change the channel configuration from \"Auto\" to a fixed, clean channel that has the least amount of detected traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4019582519155492, "y": -0.07855576159094292, "z": -0.9122820594738574, "word": "802.11 wireless protocol: Coverage/distance", "pos_group": "other", "row_number": 15, "definition": "The effective physical radius within which a wireless access point can successfully transmit and receive data from client devices. Higher frequencies (5 GHz / 6 GHz) cover less distance and degrade faster through walls than lower frequencies (2.4 GHz).", "details": [{"label": "TROUBLESHOOTING", "value": "Move the wireless access point to a central, elevated location away from thick concrete walls and metal surfaces; install a wireless range extender or transition to a mesh network to fill dead zones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4013621669056451, "y": -0.10215099693164176, "z": -0.9102052432296116, "word": "802.11 wireless protocol: Frequencies", "pos_group": "other", "row_number": 16, "definition": "The specific radio frequency bands allocated for Wi-Fi communications, primarily consisting of 2.4 GHz (long range, slow speed, high congestion), 5 GHz (shorter range, fast speed, low congestion), and 6 GHz utilized by Wi-Fi 6E/7 (shortest range, extreme speed, zero legacy interference).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify client hardware specifications; implement a \"Band Steering\" configuration on the router to automatically push dual-band client devices onto the faster, less congested 5 GHz or 6 GHz frequencies."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38580383233184373, "y": -0.08323403033040824, "z": -0.9188185343978535, "word": "802.11 wireless protocol: Licensing", "pos_group": "other", "row_number": 17, "definition": "The regulatory framework dictating that Wi-Fi consumer frequencies (2.4 GHz, 5 GHz, 6 GHz) operate within the \"ISM\" (Industrial, Scientific, and Medical) bands. These bands are completely unlicensed, meaning anyone can use them without a radio permit, but devices must accept interference from other devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify and move non-Wi-Fi interferers away from the access point and client hardware; migrate high-priority corporate traffic over to the cleaner 5 GHz or 6 GHz bands where consumer appliance overlap is non-existent."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4113492420738506, "y": -0.0854986225730861, "z": -0.9074589723967547, "word": "802.11 wireless protocol: MIMO technologies", "pos_group": "other", "row_number": 18, "definition": "Multiple-Input Multiple-Output. A wireless engineering technology used starting with 802.11n that utilizes multiple antennas for both transmitting and receiving data streams simultaneously, improving overall speed and signal reliability.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all physical external antennas on the access point are securely attached and oriented correctly (perpendicular to one another); update the client network card drivers to ensure the MIMO spatial stream logic functions correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3889409476524061, "y": -0.10377850716232684, "z": -0.9153987987158423, "word": "802.11 wireless protocol: Multipath propagation", "pos_group": "other", "row_number": 19, "definition": "A phenomenon where radio signals bounce off physical obstructions (walls, ceilings, furniture), causing the signal to split and arrive at the receiving antenna via different paths and at slightly staggered times.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the wireless system utilizes modern standards (802.11n or newer) that leverage MIMO to recombine multipath reflections into a stronger combined signal, rather than treating reflections as destructive interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3950443215587367, "y": -0.07256183575513167, "z": -0.9157918781011561, "word": "802.11 wireless protocol: MU-MIMO technologies", "pos_group": "other", "row_number": 20, "definition": "Multi-User Multiple-Input Multiple-Output. An evolution introduced in 802.11ac (Wave 2) and expanded in 802.11ax that allows a wireless access point to transmit data streams to multiple independent client devices at the exact same time, rather than making them wait in a queue.", "details": [{"label": "TROUBLESHOOTING", "value": "Upgrade the legacy access point to an enterprise-grade hardware model supporting MU-MIMO; ensure client devices support the technology; segment heavy data clients across separate physical access points or bands."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.410584103042395, "y": -0.10070068603897227, "z": -0.9062450364885604, "word": "802.11 wireless protocol: Standards", "pos_group": "other", "row_number": 21, "definition": "The official iterations of the Wi-Fi specification defined by the IEEE. Key exam standards include:\n\n- 802.11b (2.4 GHz, 11 Mbps)\n- 802.11g (2.4 GHz, 54 Mbps)\n- 802.11a (5 GHz, 54 Mbps)\n- 802.11n / Wi-Fi 4 (2.4/5 GHz, 600 Mbps)\n- 802.11ac / Wi-Fi 5 (5 GHz, 6.9 Gbps)\n- 802.11ax / Wi-Fi 6 (2.4/5/6 GHz, 9.6 Gbps).", "details": [{"label": "TROUBLESHOOTING", "value": "Review the router's allowed standard modes (e.g., ensure it is set to \"Mixed Mode\" or \"Compatibility Mode\" if legacy clients must connect); upgrade the network interface card or install a modern USB Wi-Fi dongle on older client devices."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.37975047058072764, "y": -0.09164871220700804, "z": -0.9205379371022755, "word": "802.11 wireless protocol: Wi-Fi analyzers", "pos_group": "other", "row_number": 22, "definition": "A diagnostic software tool or specialized physical hardware appliance used to scan the local airwaves. It visualizes nearby wireless networks, their respective SSID names, security protocols, signal strengths (RSSI), and specific channel usage.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy a Wi-Fi analyzer application on a mobile device or laptop; walk through the physical space to map out signal drops; identify overlapping channels from rogue access points and reconfigure your own channels based on the collected visual data graph."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41023398223731516, "y": -0.07476700261402369, "z": -0.9089103229350125, "word": "AirDrop, troubleshooting", "pos_group": "other", "row_number": 102, "definition": "A proprietary wireless ad-hoc file transfer protocol developed by Apple that combines Bluetooth (for discovery and connection setup) and point-to-point Wi-Fi (for transferring actual file data) between Apple hardware devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that both Bluetooth and Wi-Fi radios are enabled on both devices; turn off Airplane Mode; check the target device's AirDrop receiving settings inside the Control Center to ensure it is configured to \"Everyone\" or \"Contacts Only\" instead of \"Receiving Off\"; disable Personal Hotspot connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3969121035047022, "y": -0.1105345145271346, "z": -0.9111766586067288, "word": "Airplane mode", "pos_group": "other", "row_number": 103, "definition": "A mobile operating system toggle setting that instantly disables all wireless transmission radios built into a device, including cellular voice/data connections, Wi-Fi network cards, Bluetooth transmitters, and GPS (Global Positioning System) location tracking chips.", "details": [{"label": "TROUBLESHOOTING", "value": "Swipe down to open the mobile device notification pane or quick settings menu; look for the illuminated airplane icon and tap it once to turn off Airplane Mode; wait a few seconds for the device radios to reconnect to local cellular towers and Wi-Fi networks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3843589848571746, "y": -0.07399480081868155, "z": -0.9202135296828481, "word": "Antennas: SOHO networks", "pos_group": "other", "row_number": 113, "definition": "Physical hardware elements attached to SOHO (Small Office / Home Office) wireless routers or APs (Access Points) that radiate and capture radio frequency signals. They can be omnidirectional (broadcasting signals equally in all horizontal directions) or directional (focusing signal power in one explicit path to span longer distances).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all external omnidirectional antennas are physically securely screwed into their reverse polarity subminiature version A (RP-SMA) connectors; orient external antennas perpendicularly (one vertical, one horizontal) to maximize wave polarization alignment; swap low-gain factory antennas with aftermarket high-gain antennas to expand the wireless coverage radius."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4178188688605694, "y": -0.0913714004484163, "z": -0.9039240344211285, "word": "Antennas: Wi-Fi", "pos_group": "other", "row_number": 114, "definition": "The internal or external radio frequency transducers integrated into client devices (such as laptops, smartphones, and desktop computers) or networking hardware to facilitate Wi-Fi network communications. In laptops, these antennas are typically run as thin wires threaded up through the physical display bezel for elevated spatial clearance.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the laptop chassis or display bezel; check the delicate main and auxiliary micro-coaxial cable connections mating to the internal wireless network interface card (NIC); re-seat the tiny gold connectors if they have vibrated loose."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3802318242543584, "y": -0.10395357089343346, "z": -0.9190306931341882, "word": "AP (Access Points), SOHO networks", "pos_group": "other", "row_number": 121, "definition": "Access Points (APs). Network hardware components that connect wireless Wi-Fi clients to a wired Ethernet backbone infrastructure. In small office/home office (SOHO) topologies, this capability is typically integrated into a single physical unit alongside the router and local network switch.", "details": [{"label": "TROUBLESHOOTING", "value": "Power-cycle the integrated network hardware assembly; access the web configuration interface using the default gateway internet protocol (IP) address; navigate to wireless configurations to verify that the wireless radio broadcast flag is enabled; update the system firmware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40174456707782713, "y": -0.06631514477594254, "z": -0.9133474718839457, "word": "Bluetooth networks: Connectivity", "pos_group": "other", "row_number": 250, "definition": "Short-range wireless radio communication protocols facilitating data exchanges between enabled devices over short distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the radio switch is explicitly enabled on both devices, clear existing old pairing profiles out of the system cache, ensure the peripheral is explicitly placed into discovery mode, and keep them within close range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4089339091913746, "y": -0.110098687686999, "z": -0.9058980830551863, "word": "Cellular networks/connectivity", "pos_group": "other", "row_number": 336, "definition": "A wireless network where the land area is divided into cells, each served by at least one fixed-location transceiver, known as a cell site or base station.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for \"Airplane Mode\" status; update the PRL (Preferred Roaming List); toggle cellular radio off and on; ensure the SIM (Subscriber Identity Module) card is seated correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3752713563241981, "y": -0.08352771605480691, "z": -0.9231438294075656, "word": "Channel bonding", "pos_group": "other", "row_number": 343, "definition": "A technique used in 802.11 standards to increase data throughput by combining multiple wireless channels into a single, wider channel.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the router/AP (Access Point) settings; if interference is high, switch from bonded channels to a single channel to increase stability."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41861610030213164, "y": -0.07758336332773452, "z": -0.9048432915718568, "word": "Communications: Bluetooth networks", "pos_group": "other", "row_number": 414, "definition": "A short-range wireless technology standard used for exchanging data between fixed and mobile devices over short distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Turn Bluetooth off and on, clear pairing history on both devices, and ensure both are within the effective range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3884678726150751, "y": -0.11449774613992593, "z": -0.9143210475947685, "word": "Communications: Wireless networks", "pos_group": "other", "row_number": 418, "definition": "Networks that use radio waves (typically 2.4GHz or 5GHz) to transmit data without physical cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for signal interference, update wireless drivers, and verify the correct SSID (Service Set Identifier) and security credentials."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3885007905193062, "y": -0.06499563917499596, "z": -0.9191532530835692, "word": "Configuring: Bluetooth networks", "pos_group": "other", "row_number": 452, "definition": "The process of setting up short-range wireless communication between a computer and a peripheral device (like a mouse or headset).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the Bluetooth radio is enabled, put the peripheral into 'pairing mode', and go to 'Settings > Devices > Bluetooth & other devices' to add the new device."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4199794266303288, "y": -0.10101532142309856, "z": -0.9018942210952725, "word": "Connectivity: Bluetooth networks", "pos_group": "other", "row_number": 468, "definition": "Wireless personal area network connectivity between devices using the 2.4 GHz frequency band.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep devices within range, move away from sources of interference (like 2.4 GHz cordless phones), and restart the Bluetooth radio."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3724931853700432, "y": -0.09844207095568121, "z": -0.9227989951873783, "word": "Connectivity: Cellular networks", "pos_group": "other", "row_number": 471, "definition": "Wireless connectivity for mobile devices utilizing cellular towers (e.g., 4G/LTE (Long-Term Evolution), 5G) to provide data access.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle 'Airplane Mode' on and off, ensure the SIM card is seated correctly, and verify that cellular data is enabled in the device settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41113647083407306, "y": -0.06475785788991034, "z": -0.9092707089704439, "word": "Connectivity: Wireless networks", "pos_group": "other", "row_number": 521, "definition": "Networks that use radio frequency to connect devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Move closer to the access point, remove physical obstructions, and ensure the correct security key is used."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4024130897473184, "y": -0.11809707001301274, "z": -0.9078087834199216, "word": "Coverage/distance, 802.11 wireless protocol", "pos_group": "other", "row_number": 555, "definition": "The effective range and signal strength of a Wi-Fi (Wireless Fidelity) signal based on the frequency band (2.4 GHz vs 5 GHz/6 GHz) and the environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Install additional wireless access points, use signal extenders, or switch to a frequency with better range (2.4 GHz) if the signal is being blocked by walls."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3753430047507385, "y": -0.07292730389122619, "z": -0.9240125741199866, "word": "Distance/Coverage, 802.11 wireless", "pos_group": "other", "row_number": 698, "definition": "The operational range of a Wi-Fi network, which depends on the frequency band (2.4 GHz vs 5 GHz/6 GHz), signal obstacles (walls), and environmental interference.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a site survey, relocate the access point to a more central location, or install additional APs (Access Points) or range extenders to cover the area."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42503126091720783, "y": -0.08541401355181011, "z": -0.9011397635950262, "word": "GPS (Global Positioning System)", "pos_group": "other", "row_number": 1004, "definition": "A satellite-based navigation system that provides precise location and time information to a receiver, enabling features like mapping, asset tracking, and geo-tagging on mobile devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure \u201cLocation Services\u201d are enabled in \u201cSettings\u201d, check for physical obstacles (e.g., being inside a building), and perform a clear-sky test to see if the device can lock onto satellite signals."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3784807970075465, "y": -0.11347835066534771, "z": -0.9186266653144818, "word": "GSM (Global System for Mobile Communications)", "pos_group": "other", "row_number": 1014, "definition": "An older but influential standard for mobile network communication that uses TDMA (Time Division Multiple Access) technology and requires a Subscriber Identity Module (SIM) card.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the SIM card is seated properly, verify that the device supports the frequency bands used by the local carrier, and check if the device is locked to a different provider."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39685686618368937, "y": -0.05844937689199808, "z": -0.9160176297996662, "word": "Hotspots", "pos_group": "other", "row_number": 1078, "definition": "Physical locations or devices (like a smartphone) that provide internet access to mobile devices over a wireless local area network (WLAN) using a router connected to an internet service provider (ISP).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the hotspot\u2019s cellular signal strength, restart the hotspot device, ensure the security password is correct, and check if any bandwidth limits (data caps) have been reached."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4174117712241979, "y": -0.11193099646314421, "z": -0.9017975744446454, "word": "ISP (Internet Service Provider), WISP", "pos_group": "other", "row_number": 1196, "definition": "An organization that provides services for accessing and using the internet; a WISP (Wireless Internet Service Provider) provides internet access via wireless technologies like microwave or radio links.", "details": [{"label": "TROUBLESHOOTING", "value": "Contact the ISP to verify local service outages, or check the external wireless receiver/antenna for obstructions and physical damage."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3676101072724604, "y": -0.08861837736761906, "z": -0.9257481256928694, "word": "LAN: WLAN", "pos_group": "other", "row_number": 1223, "definition": "A Wireless Local Area Network (WLAN) is a local area network variant that leverages high-frequency radio frequency signals (such as 2.4 GHz, 5 GHz, or 6 GHz spectrum distributions) to bind portable computing devices to the local physical infrastructure without wired network cable interconnects.", "details": [{"label": "TROUBLESHOOTING", "value": "Relocate the client device closer to the wireless access point to mitigate RF (Radio Frequency) environmental attenuation, load a wireless site survey mapping tool to analyze local channel overlaps, and shift the active access point configuration profile to a non-overlapping channel scheme."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42096907784965176, "y": -0.06835033088674601, "z": -0.9044961402693138, "word": "Licensing: Wireless protocols", "pos_group": "other", "row_number": 1248, "definition": "The regulatory frequency allocations and standard licensing rules managed by governmental bodies (such as the FCC\u2014Federal Communications Commission) that define which wireless bands require exclusive licensing models (e.g., cellular radio networks) versus unlicensed public spectrum allocations (e.g., standard consumer Wi-Fi bands).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that internal enterprise long-range communication arrays operate strictly within unlicensed industrial bands, or register specialized microwave link assets with regional telecommunications agencies to obtain clear operating clearances."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3924001157799674, "y": -0.12271642452709669, "z": -0.9115716254289367, "word": "\u201cLong-range fixed wireless\u201d", "pos_group": "other", "row_number": 1342, "definition": "A point-to-point high-bandwidth telecommunications transport method that utilizes directional microwave or radio frequency dish antennas mounted on elevated structural towers to bridge internet connectivity over miles without physical wires.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean external structural antenna dishes to clear out debris blocks, use specialized alignment equipment to optimize physical line-of-sight path angles, and check interface cabling leading down to the indoor router equipment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38017625810882694, "y": -0.06223247589391408, "z": -0.9228180382472396, "word": "Low RF signals, troubleshooting", "pos_group": "other", "row_number": 1348, "definition": "The troubleshooting process used to isolate and remediate weak radio frequency signal strengths that cause slow wireless network connections and high packet drops.", "details": [{"label": "TROUBLESHOOTING", "value": "Open wireless monitoring utility tools to read real-time RSSI (Received Signal Strength Indicator) metric values, reposition device orientations, increase transmitter output power settings, and introduce supplementary access points to eliminate dead zones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4278338957874249, "y": -0.09675520266746557, "z": -0.8986637793814394, "word": "MIMO technologies", "pos_group": "other", "row_number": 1454, "definition": "A method for multiplying the capacity of a radio link using multiple transmit and receive antennas to exploit multipath propagation, significantly increasing wireless data throughput.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both the router and the wireless client device support the same MIMO standard; update the wireless adapter drivers on the client device; reposition the router antennas for better signal distribution; and minimize physical obstructions between the router and client."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3691232295196033, "y": -0.1073194360930191, "z": -0.9231633550275351, "word": "Multipath propagation, 802.11 wireless protocol", "pos_group": "other", "row_number": 1535, "definition": "A phenomenon where wireless signals reflect off physical objects (walls, furniture, metal), causing multiple copies of the same signal to arrive at the receiver at slightly different times, which can lead to signal interference and data errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Use MIMO (Multiple-Input Multiple-Output) technology to leverage reflected signals as an advantage, or reposition the wireless access point (AP) away from large metallic obstructions to minimize reflection zones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40788794573051756, "y": -0.05605709618577509, "z": -0.9113095114695979, "word": "MU-MIMO (Multiuser-Multiple Input, Multiple Output) technologies", "pos_group": "other", "row_number": 1538, "definition": "An advanced Wi-Fi antenna technology that allows an access point to communicate with multiple client devices simultaneously, rather than sequentially, significantly increasing network capacity and overall speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both the wireless access point and the client devices support MU-MIMO. Update the wireless adapter drivers on client machines and verify the router's firmware is up to date, as the MU-MIMO scheduling logic is managed by the AP\u2019s firmware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4102223668077794, "y": -0.12179675461090951, "z": -0.9038158885176084, "word": "Networks: Bluetooth networks", "pos_group": "other", "row_number": 1567, "definition": "Short-range wireless personal area networks (WPAN) used to exchange data between fixed and mobile devices, typically operating in the 2.4 GHz (Gigahertz) ISM (Industrial, Scientific, and Medical) band.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle Bluetooth off and on, move devices closer to eliminate interference, remove the existing \"paired\" profile from the host OS, and perform a fresh discovery and re-pairing process."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3669423941449204, "y": -0.07619603555097482, "z": -0.9271178153533176, "word": "Networks: Cellular networks", "pos_group": "other", "row_number": 1571, "definition": "Wireless mobile networks distributed over land areas called \u201ccells,\u201d each served by at least one fixed-location transceiver, known as a cell site or base station.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device has the correct APN (Access Point Name) settings, verify that the SIM (Subscriber Identity Module) card is seated correctly, and toggle \u201cAirplane Mode\u201d to force the device to re-authenticate with the nearest cellular tower."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4291485558210287, "y": -0.07687594485327184, "z": -0.899956446801534, "word": "Networks: Wireless networks", "pos_group": "other", "row_number": 1655, "definition": "Networks that use radio waves instead of cables to connect devices, providing mobility and flexibility but introducing security and interference challenges.", "details": [{"label": "TROUBLESHOOTING", "value": "Check signal strength; use a Wi-Fi analyzer to identify overlapping channels; ensure encryption settings (e.g., WPA3 (Wi-Fi Protected Access 3)) match on the client and WAP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3806200844205072, "y": -0.12258149908565984, "z": -0.9165708523718383, "word": "Networks: WLAN (Wireless Local Area Network)", "pos_group": "other", "row_number": 1656, "definition": "A wireless network that links two or more devices within a limited area (like a home or office), essentially extending a LAN without the use of permanent cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the WAP is broadcasting; check for Wi-Fi interference; ensure the client is within range; restart the WAP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38931034498771727, "y": -0.053676226124834456, "z": -0.9195413628731118, "word": "Networks: WMN (Wireless Mesh Network)", "pos_group": "other", "row_number": 1657, "definition": "A communications network made up of radio nodes organized in a mesh topology, where each node communicates with one or more neighbors to relay data across the network.", "details": [{"label": "TROUBLESHOOTING", "value": "Relocate nodes to improve signal relay; ensure the firmware is updated on all nodes; check the mesh controller for node-specific health alerts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4259923695453539, "y": -0.10968683436272748, "z": -0.8980530604906473, "word": "Networks: WPAN (Wireless Personal Area Network)", "pos_group": "other", "row_number": 1659, "definition": "A small, short-range wireless network used to connect personal devices like smartwatches, headsets, and phones to each other (e.g., Bluetooth, Zigbee).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device is in \u201cpairing mode\u201d; turn Bluetooth off and on; remove and re-add the device profile."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.36237060853904973, "y": -0.09663225112273015, "z": -0.9270111920090245, "word": "Networks: WWAN (Wireless Wide Area Network)", "pos_group": "other", "row_number": 1660, "definition": "A wireless network that covers a wide area, typically utilizing cellular technology (4G, 5G) to provide Internet access via a service provider.", "details": [{"label": "TROUBLESHOOTING", "value": "Check cellular coverage; verify SIM card installation; ensure APN (Access Point Name) settings are correct for the provider."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4197076736622594, "y": -0.05882477636414986, "z": -0.9057511326819979, "word": "NFC (Near-Field Communication)", "pos_group": "other", "row_number": 1663, "definition": "A short-range wireless communication standard that allows devices to share data by bringing them into very close proximity (typically less than 4 cm).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure NFC is enabled in system settings; remove thick cases that may block the signal; verify the NFC chip is functional."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3992297843660855, "y": -0.12852127663704596, "z": -0.9077983590680215, "word": "Pairing Bluetooth devices", "pos_group": "other", "row_number": 1725, "definition": "The process of establishing a secure, wireless connection between two devices (like a laptop and a headset) using the Bluetooth radio standard.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both devices have Bluetooth enabled and are in \"Discoverable\" mode; remove previous pairings in the OS settings and restart the process; move devices within 10 meters of each other; ensure device drivers are updated."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3711585636699191, "y": -0.063261266372309, "z": -0.9264120750462259, "word": "Physical security: NFC (Near Field Communication)", "pos_group": "other", "row_number": 1820, "definition": "A short-range wireless technology that allows for secure, contactless exchange of data, often used in mobile device-based badge access.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NFC antenna is enabled on the mobile device, move the device within 4cm of the reader, and confirm the app is updated."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4338721424021392, "y": -0.08933539053279108, "z": -0.8965345236217798, "word": "Power: Radio power levels, SOHO networks", "pos_group": "other", "row_number": 1877, "definition": "An administrative configuration option inside wireless routers and access points that controls the transmit power and coverage area of the Wi-Fi radio antenna.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the Small Office/Home Office (SOHO) router portal through an administrative browser connection, locate the advanced wireless radio settings submenu, locate the parameter named \"Transmit Power Level,\" and lower the value step-by-step from 100% until wireless signals drop off right at the physical perimeter of the office structure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3690716884198929, "y": -0.11709029612078782, "z": -0.9219956352181042, "word": "PRL (Preferred Roaming Lists)", "pos_group": "other", "row_number": 1959, "definition": "A database stored on mobile devices that identifies which cell towers or network carriers the device should connect to when outside its home service area.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the device\u2019s system profile (often by dialing a specific carrier code) to download the latest PRL update, ensuring the device has the most current list of roaming partners."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.401586992189169, "y": -0.04914572366489672, "z": -0.9145012769536792, "word": "Protocols: 802.11 wireless protocol", "pos_group": "other", "row_number": 1986, "definition": "A set of IEEE (Institute of Electrical and Electronics Engineers) standards that define communication for Wireless Local Area Networks (WLANs), determining frequency bands (2.4 GHz, 5 GHz, 6 GHz) and maximum data transfer rates.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the network adapter compatibility, ensure firmware on the Wireless Access Point (WAP) is updated, move to a less crowded frequency channel, or relocate the device closer to the signal source."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4192259288010152, "y": -0.1220168878879462, "z": -0.899645207674151, "word": "Protocols: Wireless protocols", "pos_group": "other", "row_number": 2006, "definition": "A collective term for various standards (e.g., 802.11, Bluetooth, Zigbee) that allow devices to communicate wirelessly.", "details": [{"label": "TROUBLESHOOTING", "value": "Check hardware documentation to ensure both ends of the connection support the same protocol standard, update device firmware, and minimize physical obstacles or electromagnetic interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3597954639105556, "y": -0.08277752390061854, "z": -0.9293519815905438, "word": "Radio power levels, SOHO networks", "pos_group": "other", "row_number": 2062, "definition": "A configurable transmission intensity setting for wireless access points that dictates the effective coverage radius of a Wi-Fi signal, used to prevent signal bleeding into unauthorized areas and to minimize interference between overlapping wireless networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the WAP configuration interface via a web browser, navigate to the 'Wireless' or 'Advanced Radio' settings tab, and adjust the 'Transmit Power' level slider from 'High' to 'Medium' or 'Low' to focus the signal coverage area more precisely on the intended operational space."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4302673287613545, "y": -0.06692748356373227, "z": -0.9002170503519663, "word": "RF (Radio Frequency) signals, troubleshooting", "pos_group": "other", "row_number": 2175, "definition": "The technical practice of identifying, measuring, and isolating physical or electronic impediments that block, scatter, or weaken wireless radio transmissions within a local networking environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy a specialized Wi-Fi analyzer software program on a mobile device to scan local airspace metrics; check for high RFI (Radio Frequency Interference) values on competing channels, move the WAP (Wireless Access Point) channel assignment away from crowded segments (such as shifting from channel 6 to 11 on the 2.4 GHz spectrum), and move the hardware away from physical masonry barriers or large metal structures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38589737825324766, "y": -0.13048451779144354, "z": -0.9132672139489102, "word": "RFID (Radio-Frequency Identification)", "pos_group": "other", "row_number": 2176, "definition": "A short-range, wireless tracking technology that utilizes low-power electromagnetic fields to transfer identity tracking data from a small electronic chip tag to an active reading scanner device without needing a direct physical line of sight.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the active reading gateway is receiving proper electrical input, check for dense electromagnetic field interference caused by adjacent heavy machinery, verify the RFID (Radio-Frequency Identification) tag itself is not physically shielded or bent, and test card validation paths using a known-good proximity card badge."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38013917202982744, "y": -0.05204027997570558, "z": -0.9234641406944439, "word": "SOHO (Small Office/Home Office) networks: Antennas", "pos_group": "other", "row_number": 2435, "definition": "External or internal hardware components on a wireless router that emit and receive radio waves, determining the signal coverage, quality, and directionality of the network.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the antenna angle to optimize coverage (if omnidirectional), upgrade to higher-gain antennas if distance is an issue, and ensure the router is placed in a central, elevated location away from metal obstructions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.43385220252310464, "y": -0.10404941665404085, "z": -0.8949558565984163, "word": "SOHO (Small Office/Home Office) networks: Radio power levels", "pos_group": "other", "row_number": 2442, "definition": "The configurable intensity of the Wi-Fi signal emitted by the wireless router; lowering the power can restrict signal coverage to a specific room, preventing unauthorized access from outside the office.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s wireless settings, adjust the \"Transmit Power\" (often listed as a percentage or in dBm), and perform a signal strength test from various locations to strike the right balance between coverage and security."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3597842233897544, "y": -0.10650397845890645, "z": -0.9269370071219812, "word": "Tools: Wi-Fi analyzers", "pos_group": "other", "row_number": 2634, "definition": "Software or hardware tools used to scan the wireless spectrum to visualize signal strength, channel interference, and identify the location of nearby access points (APs).", "details": [{"label": "TROUBLESHOOTING", "value": "Use the tool to identify congested frequency channels, configure the access point to use a less-crowded channel (e.g., switching from channel 1 to channel 11 on the 2.4 GHz band), and analyze the signal strength coverage map to relocate APs for better performance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41528585567810533, "y": -0.049935864977217866, "z": -0.9083193642451322, "word": "Tracking: Cellular networks", "pos_group": "other", "row_number": 2643, "definition": "The mechanism by which service providers monitor the location of a mobile device as it moves between towers (handover) to maintain connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle the \u201cAirplane Mode\u201d on and off to force the device to re-register with the nearest tower, check for carrier profile updates in the device settings, and verify that the SIM (Subscriber Identity Module) card is seated correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4080533085381235, "y": -0.13156233653656513, "z": -0.9034289396494506, "word": "Troubleshooting: AirDrop", "pos_group": "other", "row_number": 2653, "definition": "An Apple proprietary service for transferring files wirelessly between devices over Bluetooth and Wi-Fi (Wireless Fidelity).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both devices have Bluetooth and Wi-Fi (Wireless Fidelity) turned on, confirm that AirDrop is set to 'Everyone' or 'Contacts Only' in settings, and ensure the devices are within close physical range."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3623527906451751, "y": -0.06769661878155483, "z": -0.929579271992012, "word": "Troubleshooting: Low RF signals", "pos_group": "other", "row_number": 2686, "definition": "Addressing poor wireless signal strength, typically in Wi-Fi (Wireless Fidelity) networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Move the device closer to the wireless access point, identify and remove physical obstructions, check for interference from other devices (like microwaves or baby monitors), and consider installing a Wi-Fi (Wireless Fidelity) range extender."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4376292185379314, "y": -0.07967320884656134, "z": -0.8956186950225927, "word": "Troubleshooting: NFC", "pos_group": "other", "row_number": 2694, "definition": "Resolving failures with NFC (Near-Field Communication), the wireless technology used for tap-to-pay and device pairing.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure NFC (Near-Field Communication) is enabled in the device settings, remove thick cases that may block the NFC (Near-Field Communication) antenna, and ensure the devices are positioned correctly for transmission."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.37214343017324086, "y": -0.1267660412392552, "z": -0.9194779160846777, "word": "Troubleshooting: Wireless networks", "pos_group": "other", "row_number": 2721, "definition": "Resolving connectivity and configuration issues related to IEEE 802.11 wireless networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the wireless adapter is enabled, confirm the correct WPA2/WPA3 (Wi-Fi Protected Access) security key, and check for channel interference from other devices."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.392980884550782, "y": -0.04459403851532407, "z": -0.91846469507901, "word": "Updating: Cellular Networks", "pos_group": "other", "row_number": 2746, "definition": "The process of updating a mobile device's baseband firmware, PRL (Preferred Roaming List), or PRI (Product Release Instructions) configurations to optimize radio tower connections and cellular handoffs.", "details": [{"label": "TROUBLESHOOTING", "value": "On an iOS device, navigate to \"Settings > General > About\" to trigger a carrier settings update prompt if one is available. On Android, navigate to \"Settings > System > System Update\" or \"About Phone\", and select \"Update PRL\" or \"Update Profile\" while connected to a cellular network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4285043494293792, "y": -0.11888193252217519, "z": -0.895684714975028, "word": "Wi-Fi: Analyzers", "pos_group": "other", "row_number": 2901, "definition": "A specialized software diagnostic application or dedicated testing tool engineered to scan local radio waves, log surrounding wireless networks, measure signal strength parameters (expressed in dBm [decibels-milliwatt]), and map out active Wi-Fi channel allocations.", "details": [{"label": "TROUBLESHOOTING", "value": "Install an industry-standard Wi-Fi analyzer tool on a mobile device or laptop and run a site survey across the workspace. Analyze the graphical channel usage map to identify overlapping signals on the 2.4 GHz or 5 GHz bands; identify underutilized channels (such as channels 1, 6, or 11) and configure local access points to use those clear frequencies to minimize crosstalk interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3545324756016244, "y": -0.09192503912934583, "z": -0.9305141110831431, "word": "Wi-Fi: Antennas", "pos_group": "other", "row_number": 2902, "definition": "The specialized hardware components built into or attached to wireless access points, routers, and network interface cards designed to capture and broadcast high-frequency electromagnetic radio signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the laptop's interior screen shroud assembly and confirm that the small internal main and auxiliary antenna lead wires are securely attached to the micro-coaxial (U.FL) terminals on the internal M.2 wireless card module. On a desktop computer or router, ensure that external high-gain omnidirectional or directional antennas are screwed securely into their physical Threaded Neill\u2013Concelman (TNC) or SMA (SubMiniature version A) connector ports."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42835827016373274, "y": -0.056554775042197324, "z": -0.901837429807757, "word": "Wireless networks: Connectivity", "pos_group": "other", "row_number": 2971, "definition": "The baseline technical parameters, driver states, and protocol negotiations required to attach a wireless mobile device to an over-the-air radio transmission array broadcasted by local access points.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear out stale wireless connection profiles by navigating to \"Settings > Network & internet > Wi-Fi > Manage known networks\", highlight the old network name entry string, and click the instruction option \"Forget\". Re-click the network title line from the primary connection layout, key in the verified wireless network key password string, and check that dynamic IP address fields are actively allocated."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3937341285060833, "y": -0.1364610431128333, "z": -0.9090389539299801, "word": "Wireless networks: Troubleshooting", "pos_group": "other", "row_number": 2976, "definition": "The methodical technical diagnostic logic applied to solve signal dropouts, channel overlaps, RF interference blocks, low transmission distance bugs, and roaming failures across wireless client devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a local wireless optimization check using a Wi-Fi analyzer application to measure the current decibels-milliwatt (dBm) signal index values. Identify overlapping channel collisions across the local area, move access points to clear channels, relocate the broadcasting hardware out from metal enclosures, and adjust antenna angles to maximize signal distribution across the physical site footprint."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.37023024332069643, "y": -0.05364461374632083, "z": -0.9273897898654619, "word": "Wireless protocols: 802.11 wireless protocol", "pos_group": "other", "row_number": 2977, "definition": "The internationally defined collection of Institute of Electrical and Electronics Engineers (IEEE) technical networking standards (including 802.11b, 802.11g, 802.11n, 802.11ac, and 802.11ax) that define the speeds, frequencies (2.4 GHz, 5 GHz, 6 GHz), and encoding methods used for wireless local area networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Device Manager utility by executing the command \u201cdevmgmt.msc\u201d inside the Run tool. Locate the wireless network interface card adapter, right-click and open \"Properties\", switch over onto the \"Advanced\" options configuration tab, find the wireless channel operational mode parameter, and ensure it is toggled to its maximum capability rules (such as 802.11ax dual-band aggregation patterns) to maximize over-the-air data transfer metrics."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.44024876227072324, "y": -0.09558396409425839, "z": -0.8927736180729826, "word": "Wireless protocols: \"Long-range fixed wireless\"", "pos_group": "other", "row_number": 2978, "definition": "A high-power point-to-point wireless transmission system architecture that uses directional, high-gain parabolic antennas to transmit high-speed data connections over several miles between two fixed geographical structures, bypassing standard subterranean cable infrastructure runs.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a physical site visual check using spotting optics to verify that the absolute line-of-sight path between the two transceiver dish endpoints remains completely clear from growing tree lines or newly erected facility structures. Use a signal
