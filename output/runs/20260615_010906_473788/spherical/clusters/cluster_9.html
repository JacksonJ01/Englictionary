0.18872358816454937, "word": "Access: Access control vestibules (mantraps)", "pos_group": "other", "row_number": 29, "definition": "A physical security facility design utilizing two interlocking doors where the second door cannot unlock until the first door closes completely. It requires security personnel or authentication mechanisms to vet an individual before granting deep perimeter entrance, strictly preventing tailgating.", "details": [{"label": "TROUBLESHOOTING", "value": "Test the electronic door sensors and locking magnetic strikes for proper synchronization logic; re-calibrate the integrated biometric or proximity badge readers; verify the functionality of the emergency break-glass manual release switches located inside the enclosure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.923186063260027, "y": 0.3320066849394639, "z": -0.19364672410851996, "word": "Accessories: IP (Ingress Protection) ratings", "pos_group": "other", "row_number": 43, "definition": "Ingress Protection ratings. A standardized structural metric scale (e.g., IP67, IP68) that defines a mobile device's physical sealing effectiveness against the entry of foreign objects like dust and liquid moisture. The first digit measures solid particles (0-6); the second measures liquid resistance (0-9).", "details": [{"label": "TROUBLESHOOTING", "value": "If a device suffers fluid exposure beyond its rated IP (Ingress Protection) threshold, power it down immediately; do not connect a charging cable; dry the chassis exterior with a lint-free towel and allow it to dry completely in a low-humidity area before powering it back on."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9278650227539053, "y": 0.3269628135168993, "z": -0.17933716326240962, "word": "Alarm systems", "pos_group": "other", "row_number": 104, "definition": "An administrative physical security control method consisting of electronic sensors (motion detectors, glass-break sensors, door contact loops) deployed to protect physical facilities, server closets, and peripheral equipment racks from unauthorized entry.", "details": [{"label": "TROUBLESHOOTING", "value": "Audit and test all building security zones and contact sensors regularly; integrate physical alarm triggers directly with closed-circuit television (CCTV) cameras to automatically record video when a sensor is tripped; route alarm notifications to a 24/7 centralized monitoring station."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.9265667128462006, "y": 0.32007258309831327, "z": -0.19755421583494526, "word": "Badge readers", "pos_group": "other", "row_number": 210, "definition": "Physical electronic security access control hardware components mounted next to facility entry points that read encoded authentication data from a user's proximity card or RFID (Radio Frequency Identification) token before unlocking a door latch.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the low-voltage power wiring layout connected to the door access controller interface panel; test the reader device using a known functional test token asset; update the user access permission credentials inside the centralized physical access security software console."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.9220309983079471, "y": 0.3392241927953575, "z": -0.1865094774578182, "word": "BIOS firmware: Secure Boot", "pos_group": "other", "row_number": 243, "definition": "A critical security standard designed to ensure that a device boots using only software that is trusted and signed cryptographically by the Original Equipment Manufacturer.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the firmware environment, navigate to the \u201cSecurity\u201d or \u201cBoot\u201d settings panel, locate the \u201cSecure Boot\u201d entry, switch its toggle option to \u201cDisabled\u201d, or install the requisite database keys for the alternative OS."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.9311906089841937, "y": 0.3163014870690881, "
