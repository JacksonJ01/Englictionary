: 0.6560000663329243, "word": "Accessories: Add-on storage", "pos_group": "other", "row_number": 40, "definition": "External storage hardware devices\u2014such as USB flash drives, external SSDs, HDDs, and SD memory cards\u2014used to augment a system's built-in storage or provide quick file transfers.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the device inside Windows Disk Management to see if it requires initialization or a new drive letter; reformat legacy FAT32 (File Allocation Table 32) flash drives to exFAT (Extended File Allocation Table) or NTFS (New File Technology System) to support files larger than 4GB (Gigabyte); ensure the device is plugged into a high-speed USB (Universal Serial Bus) 3.0+ port (blue/SS (SuperSpeed) rather than a legacy USB (Universal Serial Bus) 2.0 port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3857890569021876, "y": -0.6525647342913073, "z": 0.6521702777142148, "word": "Cache memory", "pos_group": "other", "row_number": 328, "definition": "A small, extremely fast type of volatile memory (SRAM) located on or near the CPU that stores frequently accessed data to minimize the time the processor spends waiting for data from slower main RAM.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a CPU diagnostic utility to test for cache errors; ensure the CPU cooling system is functioning correctly, as excessive heat can lead to cache corruption."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.38627472348162656, "y": -0.6410147201216968, "z": 0.6632435198224673, "word": "DISKSPD utility", "pos_group": "other", "row_number": 678, "definition": "A storage testing tool used to measure disk performance, including input/output operations per second (IOPS) and throughput, useful for benchmarking storage systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cdiskspd.exe\u201d via the command line with specific parameters (e.g., \u201c-b4k -d60 -h -L -t2\u201d) to perform read/write tests and analyze the results to determine if the hardware is performing within expected specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.39782943268856225, "y": -0.6483707589573906, "z": 0.6491125491127976, "word": "Disk Management: Optimizing drives", "pos_group": "other", "row_number": 727, "definition": "A maintenance process that runs either \u201cdefrag\u201d on HDDs or the \u201cTRIM\u201d command on SSDs to maintain peak storage performance and drive longevity.", "details": [{"label": "TROUBLESHOOTING", "value": "Search for \u201cDefragment and Optimize Drives\u201d, verify the status of your drives, and click \u201cOptimize\u201d. Windows typically schedules this task automatically, but it can be triggered manually."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3770814169583965, "y": -0.6521489589269925, "z": 0.6576559437540938, "word": "DRAM (Dynamic RAM)", "pos_group": "other", "row_number": 768, "definition": "A type of volatile semiconductor memory that must be refreshed periodically (capacitors lose charge) to store data.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a memory diagnostic tool (like the built-in Windows Memory Diagnostic), reseat the RAM sticks, or replace failing modules."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.39655055950365786, "y": -0.6362695720330853, "z": 0.6617466928229943, "word": "Drives", "pos_group": "other", "row_number": 771, "definition": "Non-volatile storage hardware devices used by a computer system to store persistent data, operating systems (OS), applications, and user files.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical power and data cable connections, check Motherboard Basic Input/Output System (BIOS) or Unified Extensible Firmware Interface (UEFI) detection status, and run manufacturer-specific hardware diagnostic utilities."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.39039437529966803, "y": -0.6573632060678475, "z": 0.6445664023532274, "word": "Drives: Optimizing", "pos_group": "other", "row_number": 786, "definition": "Administrative storage maintenance tasks that include running standard defragmentation loops on spinning hard disk platters or issuing the TRIM command set to Solid-State Drives (SSDs) to wipe unlinked blocks and sustain write efficiency.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command dfrgui.exe to open Optimize Drives, choose the target solid-state drive instance, and click Optimize to send the TRIM instruction block down to clear residual stale garbage data blocks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3771338530270732, "y": -0.6424255303554707, "z": 0.6671277949901698, "word": "Flash memory", "pos_group": "other", "row_number": 988, "definition": "A type of non-volatile computer storage (like SSDs\u2014Solid-State Drives and USB drives) that can be electrically erased and reprogrammed, offering faster access speeds than traditional mechanical hard drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cchkdsk\u201d (Check Disk) to fix file system errors, update the device drivers, or use the manufacturer\u2019s firmware tool to perform a \u201csecure erase\u201d if the drive is unresponsive."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.4051757237368262, "y": -0.6416050674512971, "z": 0.6512876248748747, "word": "Hard drives", "pos_group": "other", "row_number": 1023, "definition": "Physical, non-volatile data storage devices\u2014such as Hard Disk Drives (HDD) or Solid-State Drives (SSD)\u2014used to retain operating system files, applications, and user data even when the system is powered off.", "details": [{"label": "TROUBLESHOOTING", "value": "Check physical power and data (SATA\u2014Serial Advanced Technology Attachment) cable connections, use the \u201cchkdsk /f /r\u201d command to identify and repair bad sectors, check SMART (Self-Monitoring, Analysis, and Reporting Technology) status logs, and replace the drive if hardware failure is detected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3762564724331681, "y": -0.6597938094579575, "z": 0.6504638313950322, "word": "Hard drives: Bottlenecks", "pos_group": "other", "row_number": 1024, "definition": "A performance constraint where the speed of the hard drive is significantly slower than the processor or RAM, causing the system to wait for data read/write operations to finish.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cPerformance Monitor\u201d tool to identify high disk queue lengths, upgrade to a faster drive (e.g., NVMe\u2014Non-Volatile Memory Express), increase RAM to reduce swapping, or spread data across multiple drives to distribute the input/output (I/O) load."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.38987921913706536, "y": -0.6323555364783355, "z": 0.6694181577835103, "word": "Hard drives: Defragmenting", "pos_group": "other", "row_number": 1025, "definition": "An optimization process that rearranges fragmented data blocks on magnetic hard drives to be contiguous, thereby reducing the physical movement required by the read/write head and improving retrieval speeds.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cDefragment and Optimize Drives\u201d utility, analyze the volume to check for fragmentation levels, and click \u201cOptimize\u201d to consolidate the files; note: never defragment an SSD, as it provides no performance benefit and causes unnecessary wear."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.40074090516132027, "y": -0.6546804391738025, "z": 0.6409370089904958, "word": "Hard drives: Hybrid drives", "pos_group": "other", "row_number": 1030, "definition": "Also known as an SSHD (Solid-State Hybrid Drive), this device combines a large-capacity magnetic hard disk with a small amount of flash-based solid-state memory, which stores frequently accessed files for faster performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Allow the drive time to \"learn\" user patterns (as the flash memory cache is managed by the drive firmware), check for firmware updates from the manufacturer, or run a diagnostic test to see if the mechanical portion of the drive is failing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3690439978765516, "y": -0.6502835516049214, "z": 0.6640314978548695, "word": "Hard drives: Magnetic disk drives/HDD", "pos_group": "other", "row_number": 1032, "definition": "Traditional mechanical storage devices that read and write data using a magnetic head on rapidly spinning platters, offering high capacity at a low cost-per-gigabyte.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive is physically level, check for physical vibrations in the chassis, run \u201cchkdsk\u201d to identify bad blocks, and perform frequent backups before the drive fails completely."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.4058951384838695, "y": -0.6327201359532637, "z": 0.6594803758372525, "word": "Hard drives: Optimizing", "pos_group": "other", "row_number": 1035, "definition": "A maintenance task that helps a drive perform more efficiently; for HDDs, this means defragmentation; for SSDs, this means the \u201cTRIM\u201d command, which helps the drive manage free space.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDefragment and Optimize Drives\u201d, verify the system correctly identifies the drive type (HDD vs SSD), and run the optimization tool to ensure the operating system is performing the correct housekeeping tasks (Defrag for HDD, TRIM for SSD)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.38367911727738935, "y": -0.6643210359277965, "z": 0.6414576339783188, "word": "Hard drives: SSD", "pos_group": "other", "row_number": 1042, "definition": "A Solid-State Drive (SSD) is a high-speed, non-volatile storage device that uses NAND (Not-AND) flash memory instead of mechanical platters, resulting in faster load times and better durability.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the drive\u2019s firmware via the manufacturer\u2019s software, check the BIOS to ensure the SATA mode is set to AHCI (Advanced Host Controller Interface), and ensure the OS is using native NVMe drivers if applicable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.37799483652659843, "y": -0.6348825701613031, "z": 0.6738278902394945, "word": "HDD: Latency", "pos_group": "other", "row_number": 1054, "definition": "The time delay that occurs while the mechanical head of a hard drive seeks the correct track and rotates to the specific sector where the data is stored.", "details": [{"label": "TROUBLESHOOTING", "value": "Latency is an inherent physical property of HDDs; to improve performance, upgrade to an SSD, as mechanical drives cannot be \"fixed\" to lower latency beyond their rotational speed limit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.4103814675510298, "y": -0.6459112945367492, "z": 0.6437279321891539, "word": "HDD: Rotational speed", "pos_group": "other", "row_number": 1055, "definition": "The speed at which the internal platters of an HDD spin, typically measured in RPM (Revolutions Per Minute), which directly impacts read/write latency and data transfer rates.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the RPM rating on the drive label; for high-performance requirements, ensure the drive is rated at 7200 RPM or higher, or migrate the high-demand data to an SSD."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.36715719148816867, "y": -0.6604376888019639, "z": 0.6549943938297798, "word": "Hibernate mode", "pos_group": "other", "row_number": 1063, "definition": "A power-saving state in Windows that saves all open documents and programs to the hard drive (in a file called \u201chiberfil.sys\u201d) and then powers down the computer completely, allowing for a faster resume than a cold boot.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \u201cpowercfg /hibernate on\u201d in an elevated command prompt to ensure the feature is enabled, and check for adequate free disk space on the primary partition."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.39839270272261657, "y": -0.6266456064103874, "z": 0.6697749908618018, "word": "Hybrid drives", "pos_group": "other", "row_number": 1087, "definition": "A storage device that combines traditional spinning magnetic platters (HDD) with a small amount of high-speed flash memory (SSD) to act as a cache, speeding up frequently accessed files.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive firmware is updated, run drive diagnostic software to check both the mechanical and flash components, and consider replacing the drive with a full SSD if performance requirements increase."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.396723879288262, "y": -0.6624596199025969, "z": 0.6354190865885123, "word": "Internal drives, OS installations", "pos_group": "other", "row_number": 1152, "definition": "The process of targeting local internal storage hardware layers (such as Non-Volatile Memory Express\u2014NVMe SSDs or SATA drives) to write the master directory trees of an operating system.", "details": [{"label": "TROUBLESHOOTING", "value": "Access firmware screens, verify the active storage device controller is set to \u201cAHCI\u201d (Advanced Host Controller Interface) mode instead of legacy options, use external media to inject missing controller drivers, and check physical link tracks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.36629820152890563, "y": -0.6438348612803366, "z": 0.6717903683120344, "word": "Latency: Magnetic disk drives/HDD", "pos_group": "other", "row_number": 1231, "definition": "The rotational delay component of access time on a Hard Disk Drive (HDD), defining the precise measurement of time required for the physical mechanical magnetic platters to spin and position the targeted target storage disk sector directly beneath the read/write drive head assembly.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the built-in system optimization command tool utility \"defrag\" to clean fragmented file data blocks and store them sequentially, which reduces the structural read head tracking sweeps across the rotating platters."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.4140150650264885, "y": -0.6342911567257432, "z": 0.6528906910277026, "word": "Magnetic disk drives/HDD", "pos_group": "other", "row_number": 1382, "definition": "An electromechanical, non-volatile data storage component that uses spinning circular platters coated with magnetic materials and moving read/write heads to store and retrieve digital information.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot into the system BIOS/UEFI (Basic Input/Output System/Unified Extensible Firmware Interface) screen and check if the drive is recognized on the SATA (Serial Advanced Technology Attachment) interface link. Run a SMART (Self-Monitoring, Analysis, and Reporting Technology) diagnostics pass using toolkits like \"chkdsk /f /r\" via the Windows command prompt to flag and quarantine bad disk sectors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.37385956760545447, "y": -0.6681904987666364, "z": 0.6432343904579856, "word": "Magnetic disk drives/HDD: latency", "pos_group": "other", "row_number": 1383, "definition": "The measurable delay time\u2014primarily consisting of rotational delay\u2014required for the physical platter of a mechanical hard disk drive to spin around and line up the targeted data sector directly underneath the read/write head.", "details": [{"label": "TROUBLESHOOTING", "value": "Defragment the mechanical drive volume using the native \"Defragment and Optimize Drives\" tool in Windows to organize scattered file segments into clean sequential blocks, reducing overall read/write head movement delays."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3844573835797406, "y": -0.6270099015652775, "z": 0.6775331014423733, "word": "Maintenance: storage drives", "pos_group": "other", "row_number": 1393, "definition": "Performing preventative operations on storage drives\u2014such as running optimization passes (TRIM commands) on Solid-State Drives (SSDs) or defragmenting Hard Disk Drives (HDDs)\u2014to maintain quick file access and long-term hardware reliability.", "details": [{"label": "TROUBLESHOOTING", "value": "For traditional mechanical hard drives, open a command prompt with administrative privileges and execute the command \u201cchkdsk C: /f /r\u201d to identify, isolate, and repair soft logical drive errors and mark bad physical sectors. For solid-state drives, run the Windows \"Optimize\" command to issue TRIM instructions, which clears out deleted file blocks and keeps write speeds fast."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.41040444858813935, "y": -0.6536075733769628, "z": 0.6358972626166458, "word": "Memory: Cache memory", "pos_group": "other", "row_number": 1436, "definition": "A high-speed type of volatile memory located within or very near the CPU that stores frequently accessed instructions and data to reduce the time it takes for the CPU to retrieve information from the much slower RAM.", "details": [{"label": "TROUBLESHOOTING", "value": "Since cache is integrated into the CPU, physical troubleshooting is limited to checking for thermal issues; ensure the CPU cooling system is working correctly to prevent thermal throttling, which can lead to processing errors; and update the BIOS/UEFI firmware to ensure optimal CPU-to-cache communication."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.36026993748973507, "y": -0.6564585267469915, "z": 0.662772792744476, "word": "Memory: Flash memory", "pos_group": "other", "row_number": 1438, "definition": "A type of non-volatile computer storage medium that can be electrically erased and reprogrammed; commonly used in USB drives, SD cards, and SSDs.", "details": [{"label": "TROUBLESHOOTING", "value": "Try plugging the device into a different USB port or a different computer; use the \u201cchkdsk /f\u201d command (in Windows) to repair logical file system errors; if the physical chip is failing, the device is usually non-repairable and the priority should be to attempt data recovery before the hardware fails completely."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.40864767823754655, "y": -0.6244442121981526, "z": 0.6656399183667482, "word": "Memory: RAM (Random Access Memory)", "pos_group": "other", "row_number": 1440, "definition": "The primary, volatile storage memory that stores data currently in use by the CPU for quick access; its content is lost when the power is turned off.", "details": [{"label": "TROUBLESHOOTING", "value": "Reseat the RAM modules to ensure good electrical contact; test the memory using \u201cWindows Memory Diagnostic\u201d; check for motherboard compatibility with the RAM speed and voltage; and replace faulty modules if diagnostics confirm persistent errors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.38800985855997366, "y": -0.6695566730435407, "z": 0.633357885593236, "word": "Memory: Virtual memory", "pos_group": "other", "row_number": 1444, "definition": "A memory management capability of the OS that uses a portion of the hard drive (known as a page file or swap file) to act as an extension of physical RAM, allowing the system to handle more data than can physically fit in RAM.", "details": [{"label": "TROUBLESHOOTING", "value": "Increase the size of the page file in the System Properties > Performance Options menu; ensure the storage drive (HDD or SSD) has enough free space; for better performance, move the page file to a faster physical drive (ideally an SSD) if the current one is a slow mechanical disk."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.368778605212023, "y": -0.6349786331030032, "z": 0.6788258066989769, "word": "Mobile devices: Rebooting", "pos_group": "other", "row_number": 1468, "definition": "The
