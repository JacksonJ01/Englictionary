ew the \u201cVirtual Network Editor\u201d settings, ensure the \u201cVMware Tools\u201d package is updated, and check for conflicts with other virtualization software installed on the same host."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9881405740430983, "y": -0.1479572522216303, "z": 0.041071370135423946, "word": "LAN: VLAN", "pos_group": "other", "row_number": 1222, "definition": "A Virtual Local Area Network (VLAN) is a logical network grouping created by configuring physical managed switches to segment broadcast domains irrespective of the physical physical placement of the infrastructure assets.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the managed switch CLI (Command Line Interface) console, run the diagnostic status command \"show vlan\", verify that the explicit destination physical port configuration matches the correct numeric VLAN ID (Identifier) tag assignment, and confirm that trunk ports linking adjacent switches carry all required tags."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9869168201535269, "y": -0.13721950621709725, "z": 0.08465221327045992, "word": "macOS (OS X): Screen Sharing", "pos_group": "other", "row_number": 1375, "definition": "A native VNC-based (Virtual Network Computing) remote desktop protocol tool integrated into macOS that enables authorized users to remotely view and fully control another Mac across a network interface.", "details": [{"label": "TROUBLESHOOTING", "value": "On the target Mac, navigate to \u201cSystem Preferences > Sharing\u201d, look for the \u201cScreen Sharing\u201d checkbox, and make sure it is toggled on. Next, verify that the local firewall settings are not blocking the incoming transmission port TCP (Transmission Control Protocol) 5900."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9923504905623416, "y": -0.11528494281268006, "z": 0.04415751172062113, "word": "Managing: desktops", "pos_group": "other", "row_number": 1415, "definition": "The configuration management, patch allocation, policy distribution, and continuous performance tracking of an organization's physical and virtual desktop computers.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy a unified endpoint management system, configure standardized corporate base system images for remote deployment, schedule non-disruptive automated software patch distribution queues, and audit local configuration states against compliance parameters."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9853218536193992, "y": -0.16006282856694776, "z": 0.05933578760899028, "word": "Native (Type 1) hypervisors", "pos_group": "other", "row_number": 1545, "definition": "A specialized virtualization software layer that runs directly on the host computer\u2019s hardware (the \u201cbare metal\u201d) rather than on top of an existing host OS, providing high performance for server virtualization.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the server hardware supports and has \u201cVirtualization Technology\u201d (like Intel VT-x or AMD-V) enabled in the BIOS (Basic Input/Output System) or UEFI (Unified Extensible Firmware Interface) settings, and verify that the hypervisor (e.g., VMware ESXi) is on the Hardware Compatibility List (HCL) for the specific server model."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.990159311764772, "y": -0.11534730125289205, "z": 0.0792435323492544, "word": "Networks: VM connectivity", "pos_group": "other", "row_number": 1650, "definition": "The ability of a virtualized OS instance to communicate with the host network, other virtual machines, or the physical Internet via a virtual switch.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the VM\u2019s virtual network adapter settings (e.g., NAT (Network Address Translation), Bridged, or Host-Only); verify that the virtual switch is correctly bridged to the physical NIC."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9901901499013949, "y": -0.13576846643721402, "z": 0  systemic methodology within cloud and hypervisor environments that tracks, labels, and preserves distinct evolutionary versions of VM (Virtual Machine) configurations, baseline templates, and snapshot files to manage changes and simplify rollbacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement automated version tracking within your central hypervisor console (such as VMware vCenter or Microsoft System Center), systematically label new base images with sequential nomenclature (e.g., \u201cWin2022_Base_v2.1\u201d), and capture a descriptive baseline snapshot before executing a localized upgrade script."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9877708723740869, "y": -0.12748185822586097, "z": 0.08976123613574322, "word": "Sandboxes", "pos_group": "other", "row_number": 2211, "definition": "An isolated virtualized environment where software can be executed, tested, or analyzed without affecting the underlying host system, commonly used for testing untrusted applications or malware.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a virtualization tool (like VirtualBox or Windows Sandbox) to create an isolated environment, take a snapshot of the clean state, run the untrusted application, analyze its behavior, and then revert the snapshot to completely erase any changes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9922814756256124, "y": -0.1193272812325986, "z": 0.03374126677961694, "word": "Screens: Screen Sharing, macOS (OS X)", "pos_group": "other", "row_number": 2226, "definition": "A remote administration feature in Apple macOS that allows one user to view and control the desktop of another Mac over a network, effectively acting as a VNC (Virtual Network Computing) client.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to \u201cSystem Settings > General > Sharing\u201d and ensure the \u201cScreen Sharing\u201d toggle is \u201cOn\u201d; if issues persist, use the command \u201cping\u201d to verify connectivity to the host IP address and ensure the local firewall permits traffic on port 5900."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.984005281406004, "y": -0.16384093038323416, "z": 0.06992678811619471, "word": "Security: Virtualization", "pos_group": "other", "row_number": 2309, "definition": "The use of software to create virtual representations of servers, storage, or networks, requiring specific security considerations to prevent 'VM escape' attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep the hypervisor patched, implement strict network isolation (VLANs) between VMs, and use secure console access methods."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9916913996723496, "y": -0.10536418784160806, "z": 0.07380078411761047, "word": "Servers: Virtual servers", "pos_group": "other", "row_number": 2332, "definition": "A physical server running software that allows it to host multiple virtual server instances (VMs), each with its own OS (Operating System) and resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the hypervisor management console for error alerts, verify hardware resource availability, and ensure the virtual network switch settings are correct."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9886720460540133, "y": -0.14698731045972693, "z": 0.030369654512143913, "word": "Storage drives: VM (Virtual Machine) connectivity", "pos_group": "other", "row_number": 2508, "definition": "The configuration that allows a virtual machine to access physical storage or virtual disk files hosted on the host machine.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the VM configuration file points to the correct path for the virtual disk image, verify the host has enough free space to support the virtual disk, and check file permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9851632683440256, "y": -0.1451444244628867, "z": 0.09157745766865928, "word": "Testing: VM", "pos_group": "other", "row_number": 2588, "definition": "Validating the configuration and performance of a virtual machine before deploying it into a production environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the VM's virtual resource allocation (CPU/RAM), verify the virtual network switch settings, and ensure the hypervisor is running the latest updates."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9934914173986383, "y": -0.10476526005218499, "z": 0.044710668094346276, "word": "Type 1 (native) hypervisors", "pos_group": "other", "row_number": 2731, "definition": "A VMM (Virtual Machine Monitor) that installs directly on the host hardware, also known as 'bare-metal' virtualization (e.g., VMware ESXi).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure virtualization extensions (VT-x or AMD-V) are enabled in the BIOS/UEFI (Unified Extensible Firmware Interface), and confirm the hardware is on the hypervisor's support list."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9845627272259985, "y": -0.16723592028117817, "z": 0.05165639481237232, "word": "Type 2 (hosted) hypervisors", "pos_group": "other", "row_number": 2732, "definition": "A VMM (Virtual Machine Monitor) that runs on top of a host OS (Operating System) (e.g., Oracle VirtualBox).", "details": [{"label": "TROUBLESHOOTING", "value": "Allocate more RAM (Random Access Memory) and CPU (Central Processing Unit) cores to the virtual machine settings, and ensure the host OS (Operating System) has the latest updates for virtualization support."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9892711755827716, "y": -0.11531523545235123, "z": 0.08969357632322407, "word": "Updating: Virtualization", "pos_group": "other", "row_number": 2751, "definition": "The process of applying software updates, hypervisor patches, and guest additions to virtual machines (VMs) and virtualization host software to maintain stability and security.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the underlying hypervisor software (such as VMware Workstation or Oracle VirtualBox) to its latest build. Once updated, boot the individual guest virtual machine, navigate to the hypervisor menu bar, and select \"Install/Update Guest Additions\" or \"Update VM Tools\" to refresh the internal integration drivers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9913695569334657, "y": -0.12858915776048963, "z": 0.025519210254079907, "word": "VDI (Virtual Desktop Infrastructures)", "pos_group": "other", "row_number": 2799, "definition": "A centralized virtualization architecture that hosts desktop operating system sessions on a cluster of secure data center virtualization infrastructure servers, allowing clients to access their workspace over the network using a thin client terminal or remote software client.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the client workstation network link stability by executing the ping command \u201cping -t [VDI_Connection_Broker_IP]\u201d to identify local packet drop thresholds. Log into the centralized virtualization management dashboard, inspect host system Central Processing Unit (CPU) and Random Access Memory (RAM) quotas, and clear hung terminal sessions manually to recycle the user profile context."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9833015208695067, "y": -0.1622673061900513, "z": 0.0823859235400039, "word": "Virtual servers", "pos_group": "other", "row_number": 2819, "definition": "Logical server instances running within a shared hardware host server environment through virtualization, each operating its own isolated server operating system stack and dedicated daemon configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the hypervisor host management portal and verify the network configuration type for the virtual instance (such as changing from Host-Only to Bridged or NAT mode to expose it to the network). Set up port forwarding rules within the local firewall or virtual switch to
