680070769, "y": -0.166658630070073, "z": -0.9748415088476561, "word": "Networking commands: Tracert command", "pos_group": "other", "row_number": 1563, "definition": "A diagnostic tool that displays the route (path) taken by packets across an IP network to reach a destination, listing every router hop along the way.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201ctracert [hostname]\u201d to see the list of hops; analyze the timing and success rate of each hop to determine if the packet is being blocked by a specific firewall or failing at a particular gateway."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.19954321008884635, "y": -0.1923971651782818, "z": -0.9608151945815592, "word": "Networks", "pos_group": "other", "row_number": 1564, "definition": "A collection of interconnected computing devices (such as servers, workstations, and mobile devices) that share resources, exchange data, and communicate via established communication protocols and physical or wireless media.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical layer connectivity (cables and switches), confirm correct TCP/IP (Transmission Control Protocol/Internet Protocol) settings on client devices, and check if the gateway or router is active and routing traffic correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17971781844157766, "y": -0.13721619971143115, "z": -0.9741012371778166, "word": "Networks: Cable modems", "pos_group": "other", "row_number": 1569, "definition": "A hardware peripheral that connects a computer or local network to the ISP (Internet Service Provider) via a coaxial cable line, converting radio frequency signals into digital data.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the modem by unplugging it for 30 seconds, inspect the coaxial cable for damage or loose fittings, and check the status page of the modem (typically by navigating to \u201c192.168.100.1\u201d) to view signal levels."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15637385715505514, "y": -0.19324917599514033, "z": -0.968608265903017, "word": "Networks: Connectivity", "pos_group": "other", "row_number": 1573, "definition": "The ability of a device to establish and maintain a functional communication link with other devices or the Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cipconfig /all\u201d (on Windows) or \u201cifconfig\u201d (on Linux) to verify the IP configuration, run a \u201cping\u201d test to the gateway, and check the physical link status on the network interface card (NIC)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2116231625570836, "y": -0.16618465935202964, "z": -0.9631190456352674, "word": "Networks: Hubs", "pos_group": "other", "row_number": 1593, "definition": "A basic networking device that connects multiple Ethernet devices together, making them act as a single network segment; hubs broadcast all incoming data to every port.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the hub with a network switch, which intelligently routes traffic only to the destination port, eliminating collisions and increasing overall network efficiency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1530325922483974, "y": -0.14908678185067809, "z": -0.976910516468701, "word": "Networks: LAN (Local Area Network)", "pos_group": "other", "row_number": 1597, "definition": "A network that connects computers within a limited area such as a residence, school, laboratory, or office building.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the central switch or router for link lights, ensure DHCP is providing correct IP addresses to local hosts, and verify that the internal cabling path is clear of defects."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.18385081424187277, "y": -0.20238243494709662, "z": -0.9618940836326444, "word": "Networks: MAN (Metropolitan Area Network)", "pos_group": "other", "row_number": 1602, "definition": "A network that spans a larger geographical area than a LAN\u2014such as a city or a large campus\u2014often connecting multiple LANs together.", "details": [{"label": "TROUBLESHOOTING", "value": "Since MANs often rely on service provider infrastructure, check with the ISP or network provider for outage reports, and verify the health of the border routers and long-haul fiber connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.19789898745097895, "y": -0.1403272298579315, "z": -0.9701258986988629, "word": "Networks: Network taps", "pos_group": "other", "row_number": 1606, "definition": "A physical hardware device installed inline between two network devices to capture and copy traffic passing through the link for security analysis or monitoring.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the tap is receiving power; verify that the transmit (TX) and receive (RX) cables are connected properly; if the tap is active, bypass the tap temporarily to confirm if the issue is with the network link or the tap hardware itself."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14534202833560697, "y": -0.17833641594176902, "z": -0.9731761492907316, "word": "Networks: NIC (Network Interface Card)", "pos_group": "other", "row_number": 1607, "definition": "A hardware component (internal or external) that connects a computer or device to a network, providing a physical port for cables or an antenna for wireless connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the Device Manager to ensure the NIC driver is installed and not showing an error code; verify the hardware is firmly seated or connected; test with a known-good network cable or port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.20937457498048095, "y": -0.18515785712253216, "z": -0.9601452261494274, "word": "Networks: NID (Network Interface Device)", "pos_group": "other", "row_number": 1608, "definition": "A device used by an ISP (Internet Service Provider) that marks the demarcation point (demarc) between the service provider\u2019s network and the customer's internal wiring.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the NID enclosure to inspect the wiring for corrosion or loose connections; perform a test at the test jack (if available) to determine if the fault is inside the building or on the provider\u2019s line."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16763156369550103, "y": -0.13607008753786348, "z": -0.9764141488786606, "word": "Networks: PAN (Personal Area Network)", "pos_group": "other", "row_number": 1610, "definition": "A computer network organized around an individual person within a single room or short range, typically used for connecting devices like smartphones, tablets, and wearable technology (often via Bluetooth).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure Bluetooth or the relevant wireless radio is enabled on all devices; remove and re-pair the devices; check for interference from other 2.4 GHz sources like microwaves or cordless phones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.164377070711865, "y": -0.2022954411165902, "z": -0.9654308536232054, "word": "Networks: Patch panels", "pos_group": "other", "row_number": 1612, "definition": "A device that acts as a static switchboard, connecting and managing incoming and outgoing LAN cables in a rack or wiring closet.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the punch-down connections on the rear of the patch panel to ensure they are seated correctly; use a cable tester to verify continuity between the patch panel and the wall jack."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2119007942069066, "y": -0.15372926033469364, "z": -0.9651245349339276, "word": "Networks: Routers", "pos_group": "other", "row_number": 1619, "definition": "A networking device that forwards data packets between computer networks, acting as a gateway between internal networks and the Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the router; check the WAN (Wide Area Network) and LAN indicator lights; review the router\u2019s routing table and firewall settings for misconfigurations; update the firmware if there is a known bug."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14437286196714869, "y": -0.1584401980394621, "z": -0.9767564590892812, "word": "Networks: SDN (Software Defined Networking)", "pos_group": "other", "row_number": 1624, "definition": "An architecture approach to networking that enables network control to be decoupled from the hardware (the data plane) and handled by a centralized software controller.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the status of the SDN controller software; ensure the communication channel between the controller and the network switches is active; review the software logic and policies for misconfigurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.19646178605383693, "y": -0.20101995960945615, "z": -0.9596841889179737, "word": "Networks: SOHO networks", "pos_group": "other", "row_number": 1630, "definition": "Small Office/Home Office networks represent a class of network typically used by small businesses or home users, characterized by a few devices and a single integrated router/switch/access point.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the SOHO router; check for Wi-Fi interference; update the router firmware; verify IP address conflicts in the local network range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.18778510120326655, "y": -0.13275503686797918, "z": -0.9731972338391949, "word": "Networks: Star (hub-and-spoke) topologies", "pos_group": "other", "row_number": 1633, "definition": "A network setup where all peripheral devices connect to a central node (a hub or switch), which acts as a conduit to pass messages.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify power to the central switch; check for individual port failures on the switch; swap the cable from the malfunctioning node to a known-working port on the switch."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14754044539593278, "y": -0.19098719484047455, "z": -0.9704409865516485, "word": "Networks: Switches", "pos_group": "other", "row_number": 1636, "definition": "A networking device that operates at the Data Link layer (Layer 2) of the OSI (Open Systems Interconnection) model to connect devices on a single LAN (Local Area Network), using MAC (Media Access Control) addresses to intelligently forward data to the specific destination port.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify power to the switch; check for link lights on individual ports; use the command \u201cping\u201d to verify connectivity between devices; check the switch\u2019s management interface for error logs or port status."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.21632536071163297, "y": -0.17388730694184767, "z": -0.9607114773944848, "word": "Networks: Topology diagrams", "pos_group": "other", "row_number": 1639, "definition": "A visual representation of a network's structure, showing the arrangement of nodes, devices, and the physical or logical connections between them.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network discovery tools to map the current network state; update the existing diagram to reflect current cabling, IP schemes, and device locations to ensure efficient future maintenance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15492532675190604, "y": -0.1399593424469803, "z": -0.977961924408422, "word": "Networks: Transfer speeds, troubleshooting", "pos_group": "other", "row_number": 1640, "definition": "The process of identifying the cause of slow data transmission across a network or between devices, which is often affected by hardware limitations, signal interference, or network congestion.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a speed test; verify link speeds on the NIC (Network Interface Card) and switch; check for heavy traffic on the network; ensure all cables meet the required category standard (e.g., Cat6 for 1 Gbps (Gigabit per second) performance)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17621472218369752, "y": -0.20789691719636275, "z": -0.9621472046968546, "word": "Networks: VLAN (Virtual Local Area Network)", "pos_group": "other", "row_number": 1649, "definition": "A logical grouping of network devices within a physical network, allowing segmentation of traffic for security and performance management, independent of the physical location of the devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the switch port configuration to ensure it is assigned to the correct VLAN ID; verify the trunk port settings if connectivity issues span multiple switches."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.20708199060781515, "y": -0.14132895919288396, "z": -0.9680615550983114, "word": "Networks: WAN (Wide Area Network)", "pos_group": "other", "row_number": 1652, "definition": "A network that spans a large geographical distance, connecting LANs across cities, states, or countries, typically managed by ISPs.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify connectivity with the service provider; check router configurations at the edge of the network; use \u201ctracert\u201d to identify where the path fails along the wide area connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13944468334036117, "y": -0.17119149463103359, "z": -0.9753197693341908, "word": "Networks: WAP (Wireless Access Point)", "pos_group": "other", "row_number": 1653, "definition": "A networking hardware device that allows wireless-capable devices (like laptops and phones) to connect to a wired network, typically via Wi-Fi.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the WAP; move the WAP to a central, elevated location away from obstructions; change the Wi-Fi channel to reduce interference; update the WAP firmware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.208654394177319, "y": -0.19453191861477162, "z": -0.9584470128445036, "word": "NIC (Network Interface Cards)", "pos_group": "other", "row_number": 1664, "definition": "The physical circuit board or chip installed in a device that provides the port and intelligence to connect to a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Check Device Manager for missing drivers; reseat the card; verify port/cable functionality."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17452459642574825, "y": -0.12939604347705116, "z": -0.9761136353800796, "word": "NID (Network Interface Devices)", "pos_group": "other", "row_number": 1665, "definition": "A wall-mounted box where the ISP's external line ends and the internal building wiring begins; it acts as the demarcation point for service troubleshooting.", "details": [{"label": "TROUBLESHOOTING", "value": "Test at the demarcation point to see if the issue is with the ISP or the internal house wiring."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1548554986801521, "y": -0.2025331927594262, "z": -0.9669540218434352, "word": "PAN (Personal Area Networks), WPAN", "pos_group": "other", "row_number": 1726, "definition": "A computer network for interconnecting electronic devices within an individual person's workspace, usually involving short-range wireless technologies (WPAN - Wireless Personal Area Network) like Bluetooth or Zigbee.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for signal interference from other devices on the 2.4 GHz (Gigahertz) frequency; keep devices within the specified operating range; re-pair devices if authentication keys become desynchronized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.21882503401128467, "y": -0.16000623338475167, "z": -0.9625557696923253, "word": "Patch panels", "pos_group": "other", "row_number": 1757, "definition": "A hardware device that acts as a central termination point for network cables, allowing for easy management and routing of connections between network devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a punch-down tool to reseat cables; test the connection with a cable tester; label both ends of the patch cables to ensure correct routing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14368524514047168, "y": -0.14885838488928113, "z": -0.9783638032843801, "word": "Pathping command", "pos_group": "other", "row_number": 1761, "definition": "A diagnostic command-line tool that combines the features of \"ping\" and \"tracert\" (Trace Route) to provide statistical information about network latency and packet loss at each hop.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \"pathping [target_IP]\" in the command prompt; wait for the test to complete (it takes longer than traceroute) and analyze the \"Lost/Sent\" column to identify which hop is causing packet loss."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.19036558243921362, "y": -0.20866716170674363, "z": -0.9592804389998947, "word": "PoE (Power over Ethernet): PD (Powered Devices)", "pos_group": "other", "row_number": 1844, "definition": "Any client infrastructure component designed to accept operating power through its network interface connection, such as VoIP (Voice over Internet Protocol) phones, wireless access points (WAPs), and IP surveillance cameras.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the patch cord from the client hardware interface, clean the pins inside the RJ-45 socket with compressed air, and hook the unit directly to a verified operational PoE port with a short, factory-certified patch cord to isolate structured line failures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.19733235067625002, "y": -0.1310672187877211, "z": -0.9715355513494282, "word": "Ports/connectors: Flapping, troubleshooting", "pos_group": "other", "row_number": 1857, "definition": "A condition where a physical network switch interface quickly toggles between an operational \"up\" status and a failed \"down\" status, creating systemic routing destabilization.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the local wall port, replace the existing RJ-45 patch cable run with a factory-certified Cat6 line, patch the link into a different switch port, and verify that the link speed and duplexing values match between the host NIC and switch port (disabling auto-negotiation if a duplex mismatch is present)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1395284192830423, "y": -0.18563885457379772, "z": -0.9726613161244279, "word": "PowerShell: Test-connection command", "pos_group": "other", "row_number": 1904, "definition": "A native PowerShell electromagnetic transmission framework component that acts as an advanced version of the \u201cping\u201d command, returning more detailed diagnostic information about network connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201c-Count\u201d parameter to adjust the number of tests (e.g., \u201cTest-Connection -ComputerName 192.168.1.1 -Count 4\u201d) and verify the host\u2019s ability to respond to ICMP packets."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.21836160111693384, "y": -0.18335398765569244, "z": -0.9584881461804341, "word": "Probe kits", "pos_group": "other", "row_number": 1961, "definition": "A set of tools used in network troubleshooting, such as a tone generator and probe, used to trace wire runs through walls or identify specific cables in a patch panel.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the tone generator to the known wall jack, then use the probe at the patch panel; when the probe emits a loud tone, you have identified the matching cable end."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.15990127932232567, "y": -0.1313117135834329, "z": -0.9783602683811654, "word": "Protocols: RDP (Remote Desktop Protocol)", "pos_group": "other", "row_number": 1997, "definition": "A proprietary protocol developed by Microsoft that provides a user with a graphical interface to connect to another computer over a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the target machine has \u201cRemote Desktop\u201d enabled in System Properties, verify that port 3389 is open through any firewalls, and check that the user account has Remote Desktop permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16671390674830225, "y": -0.21096077841641955, "z": -0.9631728937561816, "word": "Proxy servers", "pos_group": "other", "row_number": 2008, "definition": "A dedicated server application or appliance that acts as a gateway between a local network and the internet, performing functions such as caching, filtering requests, and providing an additional layer of security.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the proxy server service is running, check the network gateway settings on client devices to ensure they are pointing to the correct proxy IP address, and examine proxy logs to identify blocked requests or authentication failures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.21593338816514535, "y": -0.14543884707643234, "z": -0.9655155688214452, "word": ".ps1 files: Test-connection command", "pos_group": "other", "row_number": 2023, "definition": "A PowerShell cmdlet that sends ICMP echo requests to one or more computers, providing detailed diagnostic information about network latency and connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the '-Count' parameter to increase the number of packets sent for better data accuracy; ensure administrative privileges are used to bypass certain local security restrictions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13588352620215458, "y": -0.16193236002780897, "z": -0.9774014416209404, "word": "RDP (Remote Desktop Protocol)", "pos_group": "other", "row_number": 2101, "definition": "A proprietary protocol developed by Microsoft that provides a user with a graphical interface to connect to another computer over a network connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure RDP is enabled on the target host, check firewall rules to allow traffic on port 3389, and ensure the user account has permissions to remote in."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2048452381057748, "y": -0.2039127067752372, "z": -0.9573181479743212, "word": "Routers", "pos_group": "other", "row_number": 2196, "definition": "An essential Layer 3 networking hardware appliance that routes data packets across disparate local subnets and wide-area environments by evaluating destination IP routing table data.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the router management command interface via SSH or a console connection, execute the diagnostic command \u201cshow ip route\u201d or \u201croute print\u201d to inspect the system routing table architecture, verify the default gateway parameter pointing to the ISP gateway is online, and update out-of-date static routes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.18361723864809681, "y": -0.12481301336888824, "z": -0.9750417536521324, "word": "Satellite connectivity", "pos_group": "other", "row_number": 2220, "definition": "A method of providing internet access using an orbital satellite, useful for remote or rural locations where cable or fiber infrastructure is unavailable.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the satellite dish is clear of debris (snow, leaves), verify the alignment of the dish with the provider's satellite coordinates, and power-cycle the satellite modem."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14518482836271623, "y": -0.19970331478075126, "z": -0.9690407378840525, "word": "SDN (Software-Defined Networking)", "pos_group": "other", "row_number": 2244, "definition": "A networking architecture that separates the control plane (the 'brain' that makes routing decisions) from the data plane (the physical switches that move data), allowing network administrators to manage traffic programmatically.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the SDN (Software-Defined Networking) controller health dashboard, verify the management connectivity between the controller and the network switches, and ensure that the flow policies are not conflicting."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.22377999671004012, "y": -0.16869524283960857, "z": -0.9599293870466409, "word": "Security: Guest networks", "pos_group": "other", "row_number": 2278, "definition": "An isolated network segment, typically provided via a Wi-Fi access point, that provides internet access to visitors without allowing access to the internal corporate network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the guest network is on a separate VLAN (Virtual Local Area Network) and verify that the firewall is correctly blocking access from the guest VLAN to the internal network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14603006083977416, "y": -0.13879644584124795, "z": -0.979495159739429, "word": "Security: NFC (Near Field Communication)", "pos_group": "other", "row_number": 2287, "definition": "A set of communication protocols that enables two electronic devices to establish communication by bringing them within close proximity (typically 4 cm or less), often used for contactless payments and authentication.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NFC (Near Field Communication) feature is enabled in the device \u201cSettings\u201d, remove any thick metal cases that may block the signal, and restart the device to reset the radio hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1817877298881424, "y": -0.21461679655365798, "z": -0.9596316230195634, "word": "Serial cabling", "pos_group": "other", "row_number": 2318, "definition": "A legacy physical communication method using a serial interface (such as RS-232) to transmit data sequentially one bit at a time, often used for configuring networking hardware like routers and switches.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify cable integrity, ensure the baud rate settings in your terminal emulation software (e.g., PuTTY) match the device specifications (commonly 9600), and use a null-modem adapter if connecting two DTE (Data Terminal Equipment) devices directly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2074958855555644, "y": -0.13234465220890276, "z": -0.9692421526683704, "word": "Servers: Syslog servers", "pos_group": "other", "row_number": 2330, "definition": "A centralized server that collects and stores log files from various network devices (e.g., switches, routers, firewalls) to simplify troubleshooting and security monitoring.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the network devices are configured to send logs to the server\u2019s IP address, check that the syslog port (typically UDP 514) is open, and ensure the server has enough storage capacity."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1330854493830695, "y": -0.17763639665710915, "z": -0.975055677253963, "word": "SNMP (Simple Network Management Protocol)", "pos_group": "other", "row_number": 2397, "definition": "An internet-standard protocol utilized by central monitoring platforms to programmatically collect performance metrics, query operational states, and receive error alerts from distributed infrastructure devices like routers, switches, and UPS units.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the targeted switches via a secure shell console configuration layer, verify that the active SNMP daemon service is running, ensure the configured read/write \"Community String\" credentials or Version 3 cryptographic user parameters exactly match the central monitoring console settings, and confirm UDP (User Datagram Protocol) ports \u20 tions.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the latest version of the network topology diagram to verify current device placement and connection paths, use the diagram to trace the route from a client to a server, and update the documentation if infrastructure changes have occurred."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12884178812068298, "y": -0.16751266696216724, "z": -0.9774145998710512, "word": "Tracert command", "pos_group": "other", "row_number": 2642, "definition": "A network diagnostic tool that shows the path (route) a packet takes to reach a destination by displaying each hop (router) along the way, along with the round-trip time for each.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the command prompt and run \u201ctracert [destination IP or URL]\u201d to identify which hop in the path is causing the packet loss or high latency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.21360013485800922, "y": -0.204264335020026, "z": -0.9553277258760299, "word": "Transfer speeds (networks), troubleshooting", "pos_group": "other", "row_number": 2647, "definition": "The process of diagnosing and correcting issues that cause low data throughput between devices on a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a \u201cspeed test\u201d to baseline the performance, check for duplex mismatches on network switches, identify and isolate devices causing network congestion, and ensure the cabling meets the required category standards (e.g., Cat6 for Gigabit speeds)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17748424906458227, "y": -0.11853107032802729, "z": -0.976959429403736, "word": "Troubleshooting: Connectivity", "pos_group": "other", "row_number": 2665, "definition": "The process of isolating issues preventing a device from communicating over a network or to external services, encompassing physical, logical, and configuration layers.", "details": [{"label": "TROUBLESHOOTING", "value": " ile phone, navigate to settings, locate \"Tethering & portable hotspot\" (or \"Personal Hotspot\"), toggle \"USB tethering\" to \"Enabled\", and verify that the computer recognizes a new virtual network adapter within its network connections manager."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2258375425613955, "y": -0.19063885396254995, "z": -0.9553293838931551, "word": "Video: Surveillance", "pos_group": "other", "row_number": 2808, "definition": "The operational network of IP (Internet Protocol) digital cameras, digital video recorders (DVRs), or network video recorders (NVRs) engineered to continuously capture, encode, transmit, and archive visual optical data streams across physical environments for site monitoring.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the Power over Ethernet (PoE) budget metrics on the network switches to confirm the infrastructure has adequate electrical capacity to run all cameras simultaneously. Log into the camera management network console system, verify that video bandwidth encoding bitrates match network throughput limits, and perform routine firmware system updates across the centralized NVR platform."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.159414443846167, "y": -0.12056557335074253, "z": -0.9798219111735682, "word": "VLAN (Virtual Local Area Network)", "pos_group": "other", "row_number": 2836, "definition": "A logical subnetwork that groups together a collection of network host devices from multiple physical local area network segments into a single isolated broadcast domain via software running on managed network switches.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the managed network switch configuration portal using a terminal application or web interface. Execute the command \u201cshow vlan\u201d or check the interface mapping tables to confirm the physical drop port is provisioned to the correct numerical tag, and verify that the uplink connection between switches is
