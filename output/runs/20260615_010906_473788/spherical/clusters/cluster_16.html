<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 16, "radius": 285.0, "nodes": [{"x": 0.04183554724648825, "y": -0.5454820208944897, "z": -0.8370777454140387, "word": "568A wiring standard, UTP cabling", "pos_group": "other", "row_number": 11, "definition": "A specific commercial standard for terminating Unshielded Twisted Pair copper network cables. It maps the eight internal color-coded wires to RJ-45 modular pin connectors in the exact sequence: Green-White, Green, Orange-White, Blue, Blue-White, Orange, Brown-White, Brown.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the clear plastic modular plug termination; check for broken pins or crossed wire strands; use a network cable tester/wire mapper tool to identify continuity breaks; trim off the faulty cable end and crimp on a new RJ-45 connector matching the standard sequence perfectly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05071175532479998, "y": -0.5407366628172836, "z": -0.8396619434969678, "word": "568B wiring standard, UTP cabling", "pos_group": "other", "row_number": 12, "definition": "The most widely adopted commercial termination standard for Unshielded Twisted Pair network cables. It maps the internal color-coded copper wires to RJ-45 pin connectors in the sequence: Orange-White, Orange, Green-White, Blue, Blue-White, Green, Brown-White, Brown. (Pins 1, 2, 3, and 6 are swapped relative to the 568A standard).", "details": [{"label": "TROUBLESHOOTING", "value": "Use a professional wire mapper tool to verify continuity across all 8 pins; ensure both ends of the cable use the exact same 568B pin configuration (creating a straight-through cable); re-strip and re-crimp the connector if any pin connections are faulty."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04572277684310943, "y": -0.552731739549906, "z": -0.8321039909601986, "word": "Adapters: USB-to-Ethernet adapters", "pos_group": "other", "row_number": 78, "definition": "An external peripheral adapter plug that converts a computer's universal serial bus (USB) port into an RJ-45 physical Ethernet network interface, commonly used to provide wired network access to slim laptops that lack a built-in Ethernet port.", "details": [{"label": "TROUBLESHOOTING", "value": "Unplug the adapter and try a different physical USB (Univer port on the machine; check Device Manager to see if the device shows up with a yellow warning triangle; download and install the official hardware drivers from the adapter manufacturer's website."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.03876895569308188, "y": -0.5385540038925771, "z": -0.8416986117166535, "word": "ADSL (Asymmetrical DSL (Digital Subscriber Line)) connectivity", "pos_group": "other", "row_number": 97, "definition": "A legacy copper wire broadband internet technology that transmits digital data over standard analog telephone lines. It is \"asymmetrical\" because it allocates more bandwidth for downloading data than for uploading data, making it suitable for standard home use.", "details": [{"label": "TROUBLESHOOTING", "value": "Install physical inline DSL filters on all standard analog telephone lines sharing the premises to isolate high-frequency data signals from low-frequency voice lines; move the DSL modem closer to the primary phone line entry wall jack; contact the telecom provider to test the copper wire line for signal degradation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05797394387584611, "y": -0.5458692309402561, "z": -0.8358623119534543, "word": "Bandwidth, UTP cabling", "pos_group": "other", "row_number": 211, "definition": "The maximum information-carrying capacity and signal transmission frequency range of an Unshielded Twisted Pair (UTP) copper network cable, measured in megabits or gigabits per second and determined by its specific manufacturing category (such as Cat 5e or Cat 6).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the text markings stamped along the outer plastic jacket insulation of the copper cord to verify its classification; replace legacy Cat 5 wiring cables with modern Cat 6a structures to support stable 10 Gbps (Gigabits per second) speeds up to a maximum run distance of 100 meters."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.03506583935705623, "y": -0.5520758179833132, "z": -0.833056227459012, "word": "Cable internet connectivity", "pos_group": "other", "row_number": 294, "definition": "A high-speed internet access service provided by cable television companies that uses the existing coaxial cable infrastructure to deliver data to the end user.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the coaxial cable is securely tightened to both the wall outlet and the modem; inspect the cable for physical damage or sharp bends; power cycle the cable modem by unplugging it for 30 seconds to force a re-handshake with the service provider's headend."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04866915947337901, "y": -0.5329813092148513, "z": -0.8447261313252822, "word": "Cable modems", "pos_group": "other", "row_number": 296, "definition": "A networking device that converts radio frequency signals from a cable television service provider into digital Ethernet signals for local network use.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the coaxial cable connection; check the status lights for a \"DS\" (Downstream) or \"US\" (Upstream) connection fault; perform a factory reset by holding the recessed reset button for 10 seconds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.054073550830026205, "y": -0.5561069122279593, "z": -0.8293498376878828, "word": "Cabling: Crossover cabling", "pos_group": "other", "row_number": 298, "definition": "A specialized Ethernet cable where the transmit and receive wire pairs at one end are swapped to allow direct communication between two similar devices (e.g., switch-to-switch or PC-to-PC) without a hub or switch.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the cable with a standard \"Straight-through\" cable if the connected network interface cards support \"Auto-MDIX\" (Automatic Medium-Dependent Interface Crossover), which detects and corrects the signal automatically."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.029808479904470952, "y": -0.5415998503485959, "z": -0.8401077648898165, "word": "Cabling: RG-6 cabling", "pos_group": "other", "row_number": 311, "definition": "A specific standard of coaxial cable often used for cable TV and high-speed internet because it has a thicker conductor and better shielding than its predecessor, \"RG-59\".", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the entire run for tight kinks; ensure the connectors are \"Compression\" style rather than \"Crimp\" style for a secure, moisture-resistant connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06169380029423183, "y": -0.5380592000930883, "z": -0.8406462824520439, "word": "Cabling: SC", "pos_group": "other", "row_number": 313, "definition": "Subscriber Connector is a fiber optic cable connector that uses a push-pull latching mechanism for quick insertion and removal.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the connector clicks into place; inspect the connector for damaged latches; clean the fiber face with a specialized wipe."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.039200463751463084, "y": -0.55976348550752, "z": -0.8277246909052205, "word": "Cabling: Serial cabling", "pos_group": "other", "row_number": 315, "definition": "A cable used for transmitting data one bit at a time over a communication channel, often used for connecting console ports on network devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the \"Baud rate\" settings (usually 9600) match the device configuration; test the cable with a null-modem adapter if the connection is failing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.0387638587538153, "y": -0.5300408957868782, "z": -0.8470855990087176, "word": "Cabling: ST connectors", "pos_group": "other", "row_number": 318, "definition": "Straight Tip is a fiber optic connector that uses a bayonet-style locking mechanism, similar to a BNC connector.", "details": [{"label": "TROUBLESHOOTING", "value": "Twist the bayonet locking ring firmly until it clicks into the locked position; inspect the spring-loaded ferrule to ensure it moves freely."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06407957093226209, "y": -0.5520480651532076, "z": -0.8313463431986317, "word": "Cabling: Straight-through cabling", "pos_group": "other", "row_number": 320, "definition": "A standard Ethernet cable where the pins at one end match the pins at the other end (e.g., Pin 1 to Pin 1), used to connect different types of devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the wiring standard used (T568A or T568B) is consistent on both ends; test the cable with a continuity tester for breaks or short circuits."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02566599627320618, "y": -0.5505288178395426, "z": -0.8344215225912498, "word": "Cheat sheets, exam preparation", "pos_group": "other", "row_number": 344, "definition": "Concise study aids containing high-density information like ports, cable standards, and command-line syntax for quick review.", "details": [{"label": "TROUBLESHOOTING", "value": "Create custom cheat sheets by summarizing the most difficult topics; use these as the final review tool to consolidate memory before the exam."}, {"label": "CORE", "value": "CORE 1 & 2"}]}, {"x": 0.057138855033953655, "y": -0.5290496695142104, "z": -0.8466649859491732, "word": "Communications: Wired networks", "pos_group": "other", "row_number": 417, "definition": "Networks that use physical cables, such as Ethernet (twisted pair) or fiber optics, to transfer data.", "details": [{"label": "TROUBLESHOOTING", "value": "Test the physical cable, check port connectivity on the switch, and verify NIC (Network Interface Card) drivers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05033525592726617, "y": -0.5634535978850947, "z": -0.824612881927683, "word": "Connectivity: ADSL", "pos_group": "other", "row_number": 467, "definition": "A type of DSL technology where data transmission speeds are higher for downloading than for uploading, commonly used for residential broadband.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the ADSL filter is correctly installed on the phone line, check the modem/router\u2019s synchronization status lights, and verify the cabling from the wall jack."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.0270515565939045, "y": -0.5339618536911503, "z": -0.8450757079034737, "word": "Connectivity: Cable Internet connectivity", "pos_group": "other", "row_number": 469, "definition": "Broadband internet access provided over the same coaxial cabling infrastructure used for cable television.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the coaxial cable is securely tightened, check the status lights on the modem, and contact the ISP (Internet Service Provider) to ensure the service is active."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06969941665433582, "y": -0.5421499960433457, "z": -0.8373860358927927, "word": "Connectivity: Coaxial cabling", "pos_group": "other", "row_number": 472, "definition": "A type of copper cable with a central conductor used primarily for cable internet and television signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect for kinks or damage, ensure F-connectors are tight, and use a multimeter to check for continuity if a break is suspected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.029654789271314392, "y": -0.5609701306404303, "z": -0.8273047237883586, "word": "Connectivity: Crossover cabling", "pos_group": "other", "row_number": 473, "definition": "A twisted-pair Ethernet cable used to connect similar devices (e.g., computer to computer) by swapping the transmit and receive pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable type is correct (many modern NICs (Network Interface Cards) now support Auto-MDIX and can auto-sense the connection type)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04525521348167169, "y": -0.5237580073159234, "z": -0.8506641613616865, "word": "Connectivity: Dial-up Internet connectivity", "pos_group": "other", "row_number": 474, "definition": "A legacy connection method that uses the public switched telephone network to establish an internet connection via a modem.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the telephone line connection, verify the modem is configured correctly in Device Manager, and ensure the ISP phone number is accurate."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06385364754750635, "y": -0.5602056082832493, "z": -0.825888847329272, "word": "Connectivity: DSL", "pos_group": "other", "row_number": 476, "definition": "A technology that provides high-speed internet access over existing copper telephone lines.", "details": [{"label": "TROUBLESHOOTING", "value": "Check all microfilters in the home to ensure they are on the correct devices (e.g., phones), and verify the DSL modem status lights."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.019338378016657505, "y": -0.5442050857835116, "z": -0.8387293077883028, "word": "Connectivity: Fiber optic cabling/connectivity", "pos_group": "other", "row_number": 479, "definition": "A high-speed transmission medium that uses light pulses traveling through glass or plastic threads to carry data.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect connectors for dust or damage, ensure the cable has not been bent past its minimum bend radius, and use a light meter if signal loss is suspected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06703631238037379, "y": -0.5301032922772183, "z": -0.8452790263216609, "word": "Connectivity: RG-6 cabling", "pos_group": "other", "row_number": 495, "definition": "A common type of coaxial cable used for high-bandwidth applications like cable TV and broadband internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the connectors are crimped correctly and the center conductor is straight and undamaged."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.041684341773772775, "y": -0.5680842020250059, "z": -0.8219140800962712, "word": "Connectivity: RJ45 plugs, UTP cabling", "pos_group": "other", "row_number": 496, "definition": "The standard connector and cable type used for Ethernet networking in home and office environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the plug for broken locking tabs, ensure wires are correctly pinned (T568B standard), and check for damaged copper strands."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.030061061677701575, "y": -0.5255550671401633, "z": -0.8502283246129289, "word": "Connectivity: SC", "pos_group": "other", "row_number": 499, "definition": "A type of fiber optic connector known for its push-pull latching mechanism.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the fiber tip for contaminants and ensure the connector is fully seated into the transceiver."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07398675534064517, "y": -0.5499480157297306, "z": -0.831915344268331, "word": "Connectivity: Serial cabling", "pos_group": "other", "row_number": 503, "definition": "A legacy connection type used for transmitting data one bit at a time over a single channel.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the COM port settings (baud rate, parity, data bits) in Device Manager match the peripheral requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.020011065103056624, "y": -0.5574907779830989, "z": -0.8299419194963226, "word": "Connectivity: ST connectors", "pos_group": "other", "row_number": 505, "definition": "A fiber optic connector that uses a bayonet-style twist-lock mechanism.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the fiber tip, ensure the connector is twisted and locked properly into the port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05548654922326308, "y": -0.5207725785719156, "z": -0.8518903475582127, "word": "Connectivity: Straight-through cabling", "pos_group": "other", "row_number": 506, "definition": "The standard wiring configuration for Ethernet cables where the pin-outs are the same on both ends, used to connect dissimilar devices (e.g., switch to computer).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable type is straight-through and not crossover, and check for damaged wiring pairs."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.0582130362356627, "y": -0.5680631124638945, "z": -0.8209235912495502, "word": "Connectivity: Wired networks", "pos_group": "other", "row_number": 520, "definition": "A network that uses physical cabling (like Ethernet) to connect devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical link lights on the NIC and switch port, test with a known-good cable, and verify IP configuration."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.017352669288620854, "y": -0.5351015267439804, "z": -0.8446095198047565, "word": "Connectivity: WISP", "pos_group": "other", "row_number": 522, "definition": "An ISP that provides internet access using wireless technology instead of traditional cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the antenna alignment for clear line-of-sight to the WISP tower and restart the radio receiver equipment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07582221493099103, "y": -0.5355658740718698, "z": -0.8410827463767122, "word": "Crossover cabling", "pos_group": "other", "row_number": 582, "definition": "A twisted-pair Ethernet cable where the transmit and receive wire pairs are swapped at one end, traditionally used to connect two similar devices (like switch-to-switch or PC-to-PC) directly.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a standard straight-through cable if both devices support Auto-MDIX, or verify that the cable is indeed a \u201ccrossover\u201d type using a cable tester."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.030404176019831867, "y": -0.5689165401358023, "z": -0.8218330465736112, "word": "Dial-up Internet connectivity", "pos_group": "other", "row_number": 642, "definition": "A legacy connection that uses a modem and an analog phone line to connect to the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the phone line connection and that the modem is correctly configured in \u201cDevice Manager\u201d."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.03807275602807733, "y": -0.51843075852929, "z": -0.8542716276800789, "word": "DSL (Digital Subscriber Line)", "pos_group": "other", "row_number": 794, "definition": "A high-speed internet access technology that transmits digital data over conventional copper telephone lines while running concurrently with voice signals on distinct frequency channels.", "details": [{"label": "TROUBLESHOOTING", "value": "Install dedicated inline DSL micro-filters on all standard analog voice telephone hardware connections to separate high-frequency data signals from low-frequency voice feeds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07344388893515115, "y": -0.5596035970667446, "z": -0.8254997330878077, "word": "Ethernet: PoE (Power over Ethernet)", "pos_group": "other", "row_number": 878, "definition": "A standard technique (IEEE 802.3af/at/bt) that allows Ethernet cables to carry electrical power along with data, eliminating the need for separate power supplies for devices like Voice over IP (VoIP) phones, wireless access points, or security cameras.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the switch port is configured as a PoE-enabled port, ensure the device being powered is compliant with the same Power over Ethernet (PoE) standard (e.g., 802.3at) as the switch, and check for power budget limitations on the switch itself."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.012585534075043687, "y": -0.5499737046711691, "z": -0.8350871382690046, "word": "Ethernet: USB-to-Ethernet adapters", "pos_group": "other", "row_number": 879, "definition": "External hardware devices that bridge a computer's Universal Serial Bus (USB) port to an Ethernet network interface, commonly used for laptops lacking dedicated RJ-45 (Registered Jack 45) ports.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the adapter to a different USB port (preferably a USB 3.0 or higher port for bandwidth), verify the driver is installed via the Device Manager, and run the command \u201cipconfig /renew\u201d to re-request a network address after connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06722284688860763, "y": -0.5219508201697145, "z": -0.8503225447913005, "word": "Expansion cards: NIC", "pos_group": "other", "row_number": 899, "definition": "A Network Interface Card (NIC) is an expansion card that enables a computer to connect to a wired or wireless network, providing an RJ-45 (Registered Jack 45) port or antenna connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the link light on the card is active, run the command \u201cipconfig /all\u201d to check for a valid IP (Internet Protocol) address, and reinstall the network driver via the \u201cDevice Manager\u201d if the card is not recognized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04811773911414648, "y": -0.5737431805464683, "z": -0.8176206002535441, "word": "Fiber optic cabling/connectivity", "pos_group": "other", "row_number": 919, "definition": "A high-speed network medium that transmits data as light pulses through glass or plastic fiber strands, characterized by high bandwidth and immunity to electromagnetic interference (EMI).", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect connectors for dust or scratches, use a \u201cFiber Inspection Scope\u201d to verify the condition of the fiber ends, and use a VFL (Visual Fault Locator) to identify potential breaks in the cable run."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02050510572699995, "y": -0.5250852262718311, "z": -0.850802589200447, "word": "IEEE (Institute of Electrical and Electronics Engineers), PoE standards", "pos_group": "other", "row_number": 1099, "definition": "The professional organization that defines standards for networking, including IEEE 802.3af/at/bt for PoE (Power over Ethernet), which allows electrical power to be transmitted over twisted-pair Ethernet cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the switch port is PoE-enabled, check if the total power budget of the switch has been exceeded, and test with a residential length Ethernet cable to rule out power loss over long distances."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08140070690707922, "y": -0.5445681941979273, "z": -0.8347570944790086, "word": "Networks: Crossover cabling", "pos_group": "other", "row_number": 1574, "definition": "A specific type of Ethernet cable where the transmit and receive pairs are swapped (crossed) on one end, historically used to connect two similar devices (like switch-to-switch or PC-to-PC) directly.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm if the devices support MDI-X (Medium Dependent Interface Crossover), which automatically detects the cable type; if they do not, replace the standard patch cable with a physical crossover cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.018762989316680925, "y": -0.5653817347170633, "z": -0.8246159374401067, "word": "Networks: DSL modems", "pos_group": "other", "row_number": 1586, "definition": "A Digital Subscriber Line (DSL) modem uses existing telephone wires to transmit digital data, offering higher speeds than dial-up connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure a DSL filter is installed on all connected telephone handsets, inspect the copper phone lines for interference, and contact the ISP to confirm the signal attenuation (distance from the exchange) is within acceptable limits."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04983967123902861, "y": -0.5142746962700678, "z": -0.8561761173655306, "word": "Networks: Fiber optic cabling/connectivity", "pos_group": "other", "row_number": 1589, "definition": "A technology that transmits data as light pulses through strands of glass or plastic, offering high bandwidth and immunity to EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the fiber connector tip with approved lint-free wipes and isopropyl alcohol, and use a light meter or OTDR (Optical Time-Domain Reflectometer) to identify the precise location of a break in the cable run."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06765772803621711, "y": -0.5692121678945952, "z": -0.8194021843745064, "word": "Networks: ONT (Optical Network Terminal)", "pos_group": "other", "row_number": 1609, "definition": "A device used in fiber-to-the-premises (FTTP) installations that converts optical signals from the ISP\u2019s fiber optic cable into electrical signals (Ethernet) for the local network.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the ONT; check the fiber optic cable for sharp bends or damage; contact the ISP if the signal is not being received, as this device is typically owned and managed by the provider."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.009215337966804325, "y": -0.5395446648952651, "z": -0.8419065459593561, "word": "Networks: PoE (Power over Ethernet)", "pos_group": "other", "row_number": 1614, "definition": "A technology that allows network cables (typically Cat5e or higher) to carry both data and electrical power to devices such as IP (Internet Protocol) cameras, wireless access points, and VoIP (Voice over IP) phones.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the switch or injector supports the required PoE standard (e.g., 802.3af or 802.3at); check if the power budget of the switch has been exceeded; test with a different Ethernet cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07817609514827555, "y": -0.5275244802675825, "z": -0.8459352344392476, "word": "Networks: RG-6 cabling", "pos_group": "other", "row_number": 1618, "definition": "A type of coaxial cable with a thicker center conductor, commonly used for high-bandwidth applications like cable television and satellite Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the cable for physical damage or sharp bends; ensure the F-type connectors are tightly secured and free of oxidation; replace the cable if signal loss is above acceptable thresholds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.03511115714996011, "y": -0.5757899170517355, "z": -0.8168434232245164, "word": "Networks: SC (Subscriber Connector)", "pos_group": "other", "row_number": 1622, "definition": "A common push-pull fiber optic connector used for high-performance networks, identifiable by its square shape.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a fiber optic inspection scope to verify if the connector face is clean; clean with an approved fiber cleaner; if damaged, re-terminate or replace the fiber cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.028793446479840203, "y": -0.5160691784765941, "z": -0.8560628133883085, "word": "Networks: Serial cabling", "pos_group": "other", "row_number": 1626, "definition": "A legacy method of transmitting data one bit at a time over a single wire pair, often used for connecting modems, console ports, or specialized industrial equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the baud rate, parity, and stop bits match the settings of the connected device; swap the serial cable; ensure the COM port on the PC is correctly configured."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08224250722452058, "y": -0.5557371937596249, "z": -0.8272800864747089, "word": "Networks: ST (Straight Tip) connectors", "pos_group": "other", "row_number": 1632, "definition": "A bayonet-style fiber optic connector used primarily in older network installations, identifiable by its round shape and locking mechanism.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the bayonet lock is fully engaged (twist to lock); clean the connector and port; if the connection remains unstable, replace the cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.009018554828641162, "y": -0.5576033640601501, "z": -0.8300585244774051, "word": "Networks: Straight-through cabling", "pos_group": "other", "row_number": 1634, "definition": "A standard Ethernet cable used to connect devices of different types, such as a computer (MDI) to a switch or router (MDI-X).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable is wired to the same standard (T568B is most common) on both ends; test for continuity; swap with a known-good cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06355054162908778, "y": -0.5142706088540369, "z": -0.8552701734116231, "word": "Networks: USB-to-Ethernet adapters", "pos_group": "other", "row_number": 1644, "definition": "A bridge device that converts a USB port into an RJ-45 (Registered Jack 45) Ethernet port, allowing laptops without built-in LAN ports to connect to a wired network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the latest drivers are installed; try plugging the adapter into a USB 3.0 (blue) port; check the physical Ethernet connection; test with a known-good network cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05705563301975791, "y": -0.576901959514622, "z": -0.8148182520347126, "word": "Networks: Wired networks", "pos_group": "other", "row_number": 1654, "definition": "Networks that rely on physical cables (like Ethernet) to connect devices, offering higher reliability, security, and consistent speeds compared to wireless alternatives.", "details": [{"label": "TROUBLESHOOTING", "value": "Check physical connections; test cables with a network tester; verify TCP/IP settings; check the switch configuration."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.011073933864944083, "y": -0.5277908723028226, "z": -0.8493021624266479, "word": "ONT (Optical Network Terminals)", "pos_group": "other", "row_number": 1688, "definition": "The device used in FTTP (Fiber to the Premises) connections that converts optical signals from the ISP (Internet Service Provider) into copper-based Ethernet signals for local networking.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the power supply to the ONT; confirm the optical cable is not bent or damaged; contact the ISP to reset the port from their central office (CO)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08618431905231816, "y": -0.5370127528731865, "z": -0.8391600362273279, "word": "PD (Powered Devices)", "pos_group": "other", "row_number": 1769, "definition": "Devices that receive power via a network cable, commonly associated with PoE (Power over Ethernet) technology, such as IP cameras, VoIP (Voice over IP) phones, or wireless access points.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the switch port is PoE-enabled, check the cable for damage (must be Cat5e or better), ensure the power budget of the switch hasn't been exceeded, and test with a different PoE injector."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.021221624477230357, "y": -0.5733306663443922, "z": -0.8190491985733476, "word": "Plugs, loopback", "pos_group": "other", "row_number": 1839, "definition": "A special connector wired to send transmitted data back into the receiver, used to test the functionality of a network port or serial interface.", "details": [{"label": "TROUBLESHOOTING", "value": "Plug the loopback device into the network port and run a diagnostic test via the OS; if the loopback test succeeds, the fault lies with the external cabling or switch, not the local port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04137378693111691, "y": -0.5098256692768502, "z": -0.8592822567127697, "word": "PoE (Power over Ethernet)", "pos_group": "other", "row_number": 1840, "definition": "A networking technology that allows Ethernet network cables to carry both electrical power and data concurrently over standard twisted-pair infrastructure to connected hardware devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable run length is under 100 meters, inspect the copper pairs for physical damage using a wire mapper, and check the network switch configuration interface to verify that the power allocation budget has not been exceeded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07757059320555044, "y": -0.5673197922689777, "z": -0.8198359935801933, "word": "PoE (Power over Ethernet): IEEE standards", "pos_group": "other", "row_number": 1841, "definition": "A set of official specifications defined by the Institute of Electrical and Electronics Engineers (IEEE) that govern the maximum wattage delivery over Ethernet cables, spanning 802.3af (PoE), 802.3at (PoE+), and 802.3bt (PoE++ / Type 3 and Type 4).", "details": [{"label": "TROUBLESHOOTING", "value": "Cross-reference the technical data sheet of the endpoint device against the port profile rating of the switch, and adjust the switch port setting profiles or swap hardware interfaces to ensure the port supplies the required standard (such as 30 Watts for 802.3at or up to 60/90 Watts for 802.3bt)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.00316610207566408, "y": -0.5464069633013586, "z": -0.8375138245148162, "word": "PoE (Power over Ethernet): Injectors", "pos_group": "other", "row_number": 1842, "definition": "A hardware device also known as a midspan, used to add electrical power onto an Ethernet data line for environments where the legacy network switch does not natively support PoE functionality.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the alternating current (AC) power adapter is firmly seated into the wall outlet, swap the Ethernet line running from the legacy switch into the \u201cData In\u201d port, and ensure the client line is plugged securely into the \u201cData & Power Out\u201d interface."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.0770252598372939, "y": -0.51894870144275, "z": -0.8513279947340395, "word": "PoE (Power over Ethernet): PSE (Power Sourcing Equipment)", "pos_group": "other", "row_number": 1845, "definition": "The upstream network hardware component, typically an active network switch or an inline injector midspan, tasked with injecting operating voltage into the twisted copper cabling pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the network switch management console using a secure browser interface, issue the command \u201cshow power inline\u201d to audit consumption across the backplane, and disable non-essential ports or install an external secondary power supply module to clear the bottleneck."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04287295959732424, "y": -0.5810605174827039, "z": -0.8127303269585172, "word": "PSE (Power Sourcing Equipment)", "pos_group": "other", "row_number": 2027, "definition": "A network device, such as a PoE switch or injector, that supplies power to PDs (Powered Devices) over Ethernet cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the switch port status via the management interface; ensure the PSE supports the correct IEEE 802.3af/at/bt standard required by the PD; verify the total power budget of the switch has not been exceeded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.018512329817604433, "y": -0.5165728019053936, "z": -0.8560431262362519, "word": "RG-6 cabling", "pos_group": "other", "row_number": 2177, "definition": "A heavy-duty, heavily shielded coaxial copper cable standard featuring a 75-ohm impedance rating and a thick core conductor, optimized for delivering high-bandwidth digital television signals, satellite feeds, and high-speed cable internet connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Trace the cabling line back to the external service junction splitter box; inspect the compression F-type connector terminations for a loose, frayed copper grounding mesh, use a cable tester tool to verify line continuity and ensure no short circuits exist between the copper core and the outer aluminum shielding, and swap out damaged links with pre-terminated RG-6 cables."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08948921271711839, "y": -0.5492711398922325, "z": -0.830838670073052, "word": "RJ11 plugs, UTP cabling", "pos_group": "other", "row_number": 2180, "definition": "A small, clear plastic modular connector piece featuring up to six pin positions but typically utilizing four copper contacts (a 6P4C configuration), crimped onto the ends of thin telephone lines to transmit analog voice or DSL (Digital Subscriber Line) broadband signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the translucent connector clip housing to see if the plastic locking tab has broken off; cut back the degraded wire tip, insert the inner colored conductors cleanly into a new RJ11 plug casing following the standard wiring pattern, secure the plug with a professional crimper tool, and snap it firmly into the wall plate port until you hear an audible click."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.008706214483940227, "y": -0.5661989563598898, "z": -0.824222629904282, "word": "RJ45 crimpers", "pos_group": "other", "row_number": 2181, "definition": "A heavy-duty, handheld mechanical tool engineered to compress the internal copper contact pins of an RJ45 modular plug into individual copper wires of a twisted-pair networking line while simultaneously securing the outer plastic strain-relief jacket.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the inner conductors are pushed completely to the very front edge of the plastic RJ45 plug before applying force; insert the plug housing completely into the matching die slot of the tool handle, squeeze the tool grips firmly until the integrated ratcheting safety latch automatically unlocks, and double-check that all eight gold pins are recessed flat into the wire jackets."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05665948637258707, "y": -0.5077492038412641, "z": -0.8596397202331667, "word": "RJ45 plugs, UTP cabling", "pos_group": "other", "row_number": 2182, "definition": "An eight-position, eight-contact (8P8C) modular clear plastic connector shell crimped onto the tips of four-pair UTP networking cables (such as Category 5e or Category 6 lines), serving as the universal standard interface for Ethernet network ports.", "details": [{"label": "TROUBLESHOOTING", "value": "Snip away the degraded plug capsule from the line; strip back roughly one inch of the outer protective PVC (Polyvinyl Chloride) jacket, untwist the wire strands and line them up straight in strict compliance with the T568B standard sequence (Orange-White, Orange, Green-White, Blue, Blue-White, Green, Brown-White, Brown), feed them securely into a fresh RJ45 plug, and use a crimping tool to lock the terminal pins."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06747621785419115, "y": -0.5774131786288923, "z": -0.8136590079202544, "word": "RS-232 data transmission standard, serial cabling", "pos_group": "other", "row_number": 2197, "definition": "A legacy, low-speed legacy serial data transmission standard that defines the pinouts and electrical signal requirements for serial connections, commonly featuring a DB-9 (Data Bus 9-pin) connector to manage legacy networking equipment or specialized industrial hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the Device Manager panel within the operating system settings to check the assignment configuration of the active COM (Communication) port; verify that the connection speed, data bits, parity, and stop bit configurations fully match the hardware parameters of the target appliance (the industry standard is typically configured to \u201c9600\u201d baud, 8 data bits, no parity, and 1 stop bit)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.0026619739495807406, "y": -0.5332180947888772, "z": -0.8459736268255719, "word": "SC (Subscriber Connectors)", "pos_group": "other", "row_number": 2221, "definition": "A fiber-optic cable connector that uses a push-pull latching mechanism for quick insertion and removal, widely used in data communications.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the connector end using an approved fiber-cleaning tool (as dust can block the signal), ensure the connector is fully inserted, and check the fiber cable for sharp bends or breaks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08801013997420144, "y": -0.5281021322198685, "z": -0.8446078102921795, "word": "SDSL (Symmetric DSL) connectivity", "pos_group": "other", "row_number": 2245, "definition": "A type of DSL (Digital Subscriber Line) internet service that provides equal bandwidth for both upload and download speeds, unlike standard asymmetric lines.", "details": [{"label": "TROUBLESHOOTING", "value": "Power-cycle the DSL (Digital Subscriber Line) modem, check for faulty phone line filters, and contact the ISP (Internet Service Provider) to verify the line quality."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02699398974988526, "y": -0.5805639314152765, "z": -0.8137670711309356, "word": "Speeds: UTP (Unshielded Twisted Pair) cabling", "pos_group": "other", "row_number": 2457, "definition": "The data transmission capability of copper cables used in local networks, classified by categories (e.g., Cat5e, Cat6) that define their maximum frequency and data speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect cables for damage or sharp bends, verify the cable category meets the required standard for the network (e.g., Cat6 for Gigabit), and ensure the cable length does not exceed 100 meters, which leads to signal degradation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.03099545531402556, "y": -0.507767037387969, "z": -0.8609366512654235, "word": "ST (Straight Tip) connectors", "pos_group": "other", "row_number": 2473, "definition": "A type of fiber optic connector that uses a bayonet-style twist-lock mechanism to secure the fiber cable, commonly used in enterprise networking environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the ST connector, inspect the tip for dirt or scratches, clean the fiber tip using a dedicated fiber-optic cleaning kit, and ensure the connector is fully locked into place by twisting it until it clicks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.08699292085259207, "y": -0.5626416659551554, "z": -0.8221110554254466, "word": "Straight-through cabling", "pos_group": "other", "row_number": 2512, "definition": "A network cable (like an Ethernet patch cable) that has the same pin-out configuration on both ends (standard T568B).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable type; ensure you are not accidentally using a crossover cable for modern equipment that expects a straight-through pin-out."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.0002671300695734296, "y": -0.5549719288606876, "z": -0.8318690322509752, "word": "USB (Universal Serial Buses): USB-to-Ethernet Adapters", "pos_group": "other", "row_number": 2767, "definition": "An external peripheral accessory converter that adapts a standard USB port layout into an RJ-45 (Registered Jack 45) Ethernet port interface, allowing devices lacking native LAN (Local Area Network) hardware to join wired networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Swap out the network cable with a known functional Cat6 (Category 6) patch cable. Connect the adapter into a high-speed USB 3.0/Type-C port instead of a legacy slow USB 1.1/2.0 port, open \"Device Manager\", and update the network controller drivers associated with the external chip brand."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07253382846597746, "y": -0.5106484926743746, "z": -0.8567245535511733, "word": "UTP: 568A wiring standard", "pos_group": "other", "row_number": 2788, "definition": "A wiring standard for RJ45 connectors where the green pair is on pins 1 and 2, and the orange pair is on pins 3 and 6, commonly used in residential and federal government installations.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the wire colors at the clear plastic end of the RJ45 plug. Ensure both ends of the cable follow the same standard (either both 568A or both 568B for a straight-through cable). If they differ, the cable is a \u201ccrossover\u201d cable and may not be compatible with modern auto-MDIX (Medium Dependent Interface Crossover) equipment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.05292454574729488, "y": -0.5842362104285399, "z": -0.809856186542735, "word": "UTP: 568B wiring standard", "pos_group": "other", "row_number": 2789, "definition": "A wiring standard for RJ45 connectors where the orange pair is on pins 1 and 2, and the green pair is on pins 3 and 6, the most common standard used in commercial cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Using a crimping tool, strip the cable and re-terminate the RJ45 plug ensuring the wires are ordered: White-Orange, Orange, White-Green, Blue, White-Blue, Green, White-Brown, Brown. Use a continuity tester to verify the connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.008200202681573612, "y": -0.5198694278123486, "z": -0.8542063771138931, "word": "UTP: Bandwidth/Speeds", "pos_group": "other", "row_number": 2790, "definition": "The data transmission capacity of a UTP cable, which varies by category (e.g., Cat5e, Cat6, Cat6a) and dictates the maximum speed (e.g., 1 Gbps [Gigabits per second] or 10 Gbps) supported.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the cable jacket for text indicating its category (e.g., \u201cCat5e\u201d, \u201cCat6\u201d). If the cable is below the standard required for the network hardware (e.g., trying to run 1 Gbps over a Cat5 cable), replace the cable with the appropriate category (Cat6 or higher)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.09450402118268296, "y": -0.5407993551598338, "z": -0.8358259671959294, "word": "UTP: RJ11 plugs", "pos_group": "other", "row_number": 2795, "definition": "A smaller, 4 or 6-position connector primarily used for telephone connections (POTS [Plain Old Telephone Service]) rather than computer data networks, which use 8-position RJ45 connectors.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the connector size. If the plug has fewer than 8 metal contacts, it is likely an RJ11 or RJ12 plug and is incorrect for Ethernet data networking. Replace the plug with an 8-position \u201cRJ45\u201d (Registered Jack 45) connector."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.01169336326524412, "y": -0.5749532123518627, "z": -0.8181027251279761, "word": "UTP: RJ45 plugs", "pos_group": "other", "row_number": 2796, "definition": "An 8-position, 8-contact (8P8C) connector used specifically for Ethernet data networking on twisted-pair cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Cut off the damaged RJ45 plug and re-terminate the cable with a new RJ45 connector using a \u201ccrimping tool\u201d. Ensure the conductors are pushed all the way to the end of the plug before crimping."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.04715696882927318, "y": -0.5029921226740418, "z": -0.8630035601425389, "word": "Wired networks: Connectivity", "pos_group": "other", "row_number": 2966, "definition": "The configuration parameters, infrastructure ports, and physical link states associated with joining a computer node to a local network backbone using a copper category cable attached to a physical network interface card.", "details": [{"
