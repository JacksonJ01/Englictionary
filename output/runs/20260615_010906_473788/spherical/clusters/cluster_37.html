 -0.10874434857707332, "word": "3D printers: Installing", "pos_group": "other", "row_number": 3, "definition": "The process of unboxing, physically assembling, leveling, and connecting a 3D printing device to a workstation or network. This includes installing specialized slicing software, loading physical print filament (PLA/ABS), and flashing the initial firmware updates.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all physical shipping restraints are removed; download and install the vendor-specific driver/slicing utility; calibrate and manually or automatically level the print bed using a standard piece of paper as a gap gauge; update firmware to the latest revision."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8102734789413242, "y": -0.5749789987086888, "z": -0.11338448027960833, "word": "3D printers: Maintenance", "pos_group": "other", "row_number": 4, "definition": "Preventative maintenance tasks required to ensure consistent 3D print quality and component longevity. This includes cleaning the heated print bed, clearing out plastic residue, lubricating the metal X/Y/Z axis rails, checking drive belt tension, and replacing worn extruder nozzles.", "details": [{"label": "TROUBLESHOOTING", "value": "Pre-heat the extruder nozzle to printing temperature and perform a \"cold pull\" or use a specialized acupuncture needle to clear internal filament clogs; apply a thin layer of lithium grease to the guide rails; tighten loose axis drive belts until they are taut."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8080328277023899, "y": -0.5806050669740193, "z": -0.09990348121749545, "word": "3D printers: Printing process", "pos_group": "other", "row_number": 5, "definition": "The sequence where a 3D printer executes a compiled G-code file. The device heats the print bed and the extruder nozzle to specific temperatures, melts plastic filament, and deposits it layer-by-layer onto the build plate to create a physical object.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the heated print bed temperature matches the filament specification (e.g., 60\u00b0C for PLA); apply a print bed adhesive (like glue stick or blue painter's tape) if the model detaches; check the ambient room temperature to prevent cooling drafts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8032039131041635, "y": -0.5840875495155662, "z": -0.11706924649565413, "word": "Additive manufacturing", "pos_group": "other", "row_number": 80, "definition": "The industrial engineering term for 3D printing. It refers to the process of building an object layer-by-layer from a digital 3D model blueprint, contrasting with traditional subtractive manufacturing methods (like milling or carving) that cut away material from a solid block.", "details": [{"label": "TROUBLESHOOTING", "value": "Open your slicing software utility tool to check the G-code (geometric code) path configurations; optimize layer height and infill density settings; ensure the 3D printer's structural frame components are rigid and calibrated correctly before printing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8147327269921755, "y": -0.5699414902887645, "z": -0.10666433900472777, "word": "Collating", "pos_group": "other", "row_number": 391, "definition": "The process of arranging printed pages in a specific sequence (e.g., 1, 2, 3) rather than grouped by page number (e.g., 1, 1, 1) when producing multiple copies of a document.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the 'Printer Properties' or 'Printing Preferences' in the OS, ensure the 'Collate' box is checked, and verify that the printer firmware supports the requested job format."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8017814381198187, "y": -0.5889049267663617, "z": -0.10167355957583735, "word": "Consumables, printers/multifunction devices", "pos_group": "other", "row_number": 525, "definition": "Replaceable components required for a printer to function, such as toner cartridges, ink cartridges, paper, and transfer belts.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the printer's maintenance menu or web interface for supply levels, replace depleted consumables with manufacturer-recommended parts, and perform a calibration or cleaning cycle if necessary."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8086001147566282, "y": -0.5754546151052489, "z": -0.12254729849995614, "word": "Duplexing", "pos_group": "other", "row_number": 801, "definition": "A feature built into advanced printers that allows the print engine to automatically flip a sheet of paper to print text or graphics content on both sides without manual user intervention.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Devices and Printers management panel, right-click the specific printer hardware instance, select Printer properties, navigate to the tab labeled Device Settings, locate the entry for the Duplex Unit, modify its configuration toggle status to Installed, and click Apply."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8130021361120786, "y": -0.5744424018201683, "z": -0.09509707497222691, "word": "FDM (Fused Deposition Modeling)", "pos_group": "other", "row_number": 917, "definition": "An additive manufacturing (3D printing) process that builds parts layer-by-layer by heating and extruding thermoplastic filament.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the print nozzle, adjust the \u201cBed Leveling\u201d calibration, and ensure the filament temperature is set correctly according to the material (e.g., PLA\u2014Polylactic Acid or ABS\u2014Acrylonitrile Butadiene Styrene) requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7981172580513988, "y": -0.5915529482247023, "z": -0.11434138291615946, "word": "Impact printers: Components of", "pos_group": "other", "row_number": 1107, "definition": "The internal parts of an impact printer, including the print head, ribbon cartridge, tractor-feed gears, and platen.", "details": [{"label": "TROUBLESHOOTING", "value": "Visually inspect each component for signs of wear, ensure the ribbon is properly tensioned, and verify that the platen is not damaged or grooved."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8163976456581978, "y": -0.5658574823283332, "z": -0.11532646641943022, "word": "Impact printers: Maintenance", "pos_group": "other", "row_number": 1110, "definition": "Periodic procedures required to keep impact printers functional, including ribbon replacement, paper alignment, and cleaning of the print head and feed path.", "details": [{"label": "TROUBLESHOOTING", "value": "Vacuum out paper dust regularly, keep the carriage rods lightly lubricated, and replace the ribbon cartridge as soon as print quality begins to fade."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.80454480747327, "y": -0.5866816551085279, "z": -0.09226206331378868, "word": "Inkjet printers", "pos_group": "other", "row_number": 1130, "definition": "A standard physical output peripheral device that renders digital text and images onto paper media by precisely spraying minute droplets of liquid ink through matrix arrays of microscopic nozzles.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the printer\u2019s internal built-in print-head calibration loop, check ink cartridge fill indicators via the vendor\u2019s utility console software app, and clean the mechanical components if solid residues block physical operations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8026342168420879, "y": -0.5828210713814292, "z": -0.1268775500555203, "word": "Inkjet printers: Components of", "pos_group": "other", "row_number": 1131, "definition": "The physical electromechanical parts making up an inkjet printing assembly, including print heads, liquid ink cartridges, carriage belts, stepper motors, and paper feed rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect physical power leads, open the main access bay panel, check the carriage belt path for structural tears or debris blocks, and clean ink residue out from the tracking rods."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8185197005258681, "y": -0.5659224871006143, "z": -0.09877873478081341, "word": "Inkjet printers: Maintenance", "pos_group": "other", "row_number": 1132, "definition": "The proactive and reactive physical operations required to maintain output quality on an inkjet unit, such as nozzle head cleanings, mechanical alignments, and internal debris removal.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the device settings menu from the operational panel console, run a \u201cprint head alignment\u201d pass, deploy the automated \u201cnozzle clean cycle\u201d script to dissolve dry blockages, and manually replace old cartridges."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7961499551921022, "y": -0.5960432591407583, "z": -0.10429612687188573, "word": "Inkjet printers: Piezoelectric inkjet printers", "pos_group": "other", "row_number": 1133, "definition": "An inkjet printer technology variant that uses an electric current pulse applied to a piezoelectric crystal material to change its shape, forcing an ink drop out of the nozzle tip orifice.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute an intensive system cleaning sweep to clear old debris deposits, verify driver configuration variables, and swap out the print head assembly module if electronic components burn out."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8131981193555691, "y": -0.5681405683504379, "z": -0.12619474343651135, "word": "Inkjet printers: Printing process", "pos_group": "other", "row_number": 1134, "definition": "The sequential cycle where the data stream is parsed into raster lines, paper is pulled into the carriage by rollers, and the print head moves horizontally across the sheet while executing precisely timed ink drops.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear the printer spooler workspace by running the command \u201cnet stop spooler\u201d followed by \u201cnet start spooler\u201d in an elevated prompt windows environment, and calibrate feeding mechanisms."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8111458733242962, "y": -0.5783642979732986, "z": -0.08681653655161692, "word": "Inkjet printers: Thermal inkjet printers", "pos_group": "other", "row_number": 1135, "definition": "A common inkjet printer technology variant that utilizes electrical resistance heaters inside each nozzle to boil ink, creating a vapor bubble that forces a droplet out onto the page.", "details": [{"label": "TROUBLESHOOTING", "value": "Instantly replace dry cartridges to prevent heat stress, run automated print head clear patterns to shift persistent bubbles, and clean internal contact pins."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7960003884273588, "y": -0.5925838255004096, "z": -0.12340093751181302, "word": "Installing: 3D printers", "pos_group": "other", "row_number": 1137, "definition": "The structural preparation, unboxing, frame alignment, connection of data lines, loading of plastic filaments, and driver provisioning of an additive manufacturing device.", "details": [{"label": "TROUBLESHOOTING", "value": "Attach functional data cables to local computing interface slots, load vendor slicing software modules, verify firmware versions, and perform an manual structural frame leveling pass."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8211707534093969, "y": -0.5600427759522879, "z": -0.10968446949636591, "word": "Laser printers", "pos_group": "other", "row_number": 1225, "definition": "An electrophotographic physical output device that utilizes high-precision laser beam optics, static high-voltage charge assemblies, dry powder toner reservoirs, and heated mechanical compression rollers to seal text images onto physical paper print mediums.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical print quality defect pattern to isolate damaged core subcomponents, swap out depleted multi-part developer toner cartridges, adjust internal software settings for medium weight properties, and execute routine diagnostic check prints."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.798981233450907, "y": -0.5943240345510319, "z": -0.09169476837994191, "word": "Laser printers: Advantages of", "pos_group": "other", "row_number": 1226, "definition": "The structural performance benefits attributed to electrophotographic print units over fluid-ink printers, consisting of ultra-low per-page operational printing costs, lightning-fast high-speed text page output volume velocities, smudge-free text outputs, and high print resolution detail accuracy.", "details": [{"label": "TROUBLESHOOTING", "value": "Evaluate the operational cost-per-page ratio metrics against inkjet alternatives, ensure high-capacity dual-sided duplexing accessories are provisioned inside the driver property windows, and adjust resolution settings to match production demands."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8059549362990288, "y": -0.5767377954137719, "z": -0.13345469641976074, "word": "Laser printers: Components of", "pos_group": "other", "row_number": 1227, "definition": "The collective mechanical, optical, and high-voltage electrical hardware pieces that form a laser printer, including the primary EP (Electro-Photographic) drum, laser scanning assembly, primary charge roller, developer roller, transfer roller, fuser unit, and pickup rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Power down the system, wait for safe handling temperatures to avoid internal burns, replace defective transfer arrays, and clean embedded glass laser scanning mirror ports with lint-free swabs to remove structural dust blankets."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8187449914400275, "y": -0.5671843477139605, "z": -0.08921073197860308, "word": "Laser printers: Electrical safety", "pos_group": "other", "row_number": 1228, "definition": "The precautionary handling protocols mandated when performing technical service operations inside a laser printer, focusing on mitigating exposures to high-voltage power components (often converting standard power up to 6,000+ volts DC) and high-temperature thermal fusers.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the AC (Alternating Current) mains cord entirely before exposing inner system blocks, never touch the primary charging wire assemblies with uninsulated tools, and allow the thermal fuser block assembly to cool down completely for at least thirty minutes before mechanical handling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7920354152871607, "y": -0.6000803492673642, "z": -0.11217609083068125, "word": "Laser printers: Maintenance", "pos_group": "other", "row_number": 1229, "definition": "The scheduled proactive routines required to secure optimal electrophotographic text rendering outputs, involving the periodic deployment of systematic manufacturer maintenance kits containing replacements for high-wear pickup rollers, separation pads, and fuser heating assemblies.", "details": [{"label": "TROUBLESHOOTING", "value": "Extract the worn fuser tool module using protective thermal gear, clear away residual stray toner powders utilizing a specialized ESD-safe (Electrostatic Discharge) service vacuum cleaner tool, install replacement friction pickup pads, and execute the internal system reset menu command to update maintenance logging tracking counters."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8189000743689145, "y": -0.5604025918934921, "z": -0.12390158674384498, "word": "Laser printers: Printing process", "pos_group": "other", "row_number": 1230, "definition": "The 7-step electrophotographic imaging process cycle comprised of Processing (parsing raw print data stream), Charging (applying high uniform negative voltage to the EP drum via the primary charge roller), Exposing (writing the latent image with a laser beam to discharge targeted areas), Developing (attracting toner to the exposed areas), Transferring (pulling toner onto the paper via a high positive charge on the transfer roller), Fusing (melting toner into the paper fibers using heat and pressure), and Cleaning (scraping away residual toner and discharging the drum).", "details": [{"label": "TROUBLESHOOTING", "value": "Step through the imaging process to isolate structural failure mechanics; inspect the primary charge roller contacts if fields fail to clear, replace the structural blade cleaning modules if residual toner shadows remain, and check the fuser temperature profile settings if toner does not bond."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8062907152359258, "y": -0.58578335731441, "z": -0.0821774958111855, "word": "Maintenance: 3D printers", "pos_group": "other", "row_number": 1388, "definition": "The unique service processes applied to additive manufacturing hardware systems, including platform leveling, cleaning the print nozzle assembly, lubricating linear rails, and checking filament feed channels.", "details": [{"label": "TROUBLESHOOTING", "value": "Heat the printer nozzle to its normal operating temperature and use a fine acupuncture cleaning needle to clear internal plastic residue blocks. Use a feeler gauge across the build plate adjustment knobs to ensure the distance between the printer nozzle tip and the print bed is uniform across all coordinates."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7971846001187864, "y": -0.5889511070967832, "z": -0.1327904619425804, "word": "Maintenance: inkjet printers", "pos_group": "other", "row_number": 1390, "definition": "The periodic servicing tasks required for liquid ink print systems, which include running integrated printhead nozzle cleaning routines, aligning ink cartridges, and clearing out old ink from waste pads.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the inkjet utility interface via the connected PC or integrated LCD screen and select the option to execute a \"Nozzle Clean\" or \"Deep Clean\" cycle to flush dried ink clogs out of the microscopic jets. If text alignments look jagged, execute the \"Printhead Alignment\" option and select the best calibration block patterns."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.823993161633765, "y": -0.5576887015540779, "z": -0.10009286557851414, "word": "Maintenance: laser printers", "pos_group": "other", "row_number": 1391, "definition": "The thorough servicing required for electrophotographic print units, including replacing toner cartridges, cleaning transfer rollers, replacing ozone air filters, and deploying maintenance kits containing new fuser assemblies and pickup rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Unplug the unit and let the fuser assembly cool down completely. If toner rubs off the paper easily, replace the worn-out fuser assembly using a manufacturer-certified maintenance kit. Clean up loose internal toner powder using a specialized electrostatic toner vacuum cleaner rather than a standard vacuum."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.79310136615341, "y": -0.6013822775891948, "z": -0.09658974690528628, "word": "Maintenance: thermal printers", "pos_group": "other", "row_number": 1394, "definition": "Servicing specialized heat-sensitive print systems (commonly used for retail receipts) by cleaning the thermal print heating element, clearing out paper dust from the cutting mechanism, and adjusting spring tension rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the printer access cover and remove the special thermal paper roll. Use a specialized thermal cleaning pen or a lint-free swab dipped in 99% isopropyl alcohol to gently wipe away accumulated paper dust and adhesive residue directly off the narrow thermal printhead line element."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8116268839247738, "y": -0.5681657799933513, "z": -0.13582874414168844, "word": "Multifunction device/printers", "pos_group": "other", "row_number": 1501, "definition": "A centralized office hardware peripheral\u2014also known as an All-In-One (AIO) device\u2014that integrates multiple distinct functional capabilities into a single physical unit, including printing, scanning, document copying, and occasionally faxing (Facsimile) services.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a hard power cycle by disconnecting the AC (Alternating Current) power cable for 30 seconds to flush the volatile internal memory registers, inspect the glass scan bed for physical debris or obstructions, and navigate to the printer's integrated web interface via its IP address to check if the firmware is updated or if the network configuration interface shows an authentication failure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8158140335118033, "y": -0.5726811134106397, "z": -0.08052207813980347, "word": "Multifunction device/printers: 3D printers", "pos_group": "other", "row_number": 1502, "definition": "Additive manufacturing hardware devices that construct three-dimensional (3D) objects by depositing successive thin layers of material (typically thermoplastic filaments like PLA or ABS) based on a digital computer-aided design (CAD) model.", "details": [{"label": "TROUBLESHOOTING", "value": "Recalibrate the build plate distance using the leveling screws or the automated bed-leveling probe sensor to ensure the nozzle height (the \"Z-offset\") is correct, verify that the filament extrusion temperature matches the material manufacturer's suggested parameters, and use a dedicated needle tool to clear any carbonized material or blockages from the hot-end nozzle assembly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7902846121727015, "y": -0.6002951633435298, "z": -0.12286557137541641, "word": "Multifunction device/printers: collating", "pos_group": "other", "row_number": 1505, "definition": "A logical printing software instruction that arranges printed pages in a specific, sequential order (e.g., 1-2-3, 1-2-3 instead of 1-1, 2-2, 3-3) for multipage document sets, allowing the printer to output completed document blocks ready for distribution.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the application\u2019s print dialog box, locate the \u201cSettings\u201d or \u201cProperties\u201d section, look for the \u201cCollated\u201d checkbox or dropdown option, and toggle it to the \u201cCollated\u201d (or \u201cGrouped\u201d) state before clicking \u201cPrint\u201d to ensure the software properly sequences the output feed."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8242016781229782, "y": -0.5541651926988672, "z": -0.11658701891846292, "word": "Multifunction device/printers: consumables", "pos_group": "other", "row_number": 1508, "definition": "Replaceable supply items required for the continuous operation of a printer, including toner cartridges, ink tanks, paper, imaging drums, transfer belts, and fuser units.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the printer's status monitor software on the workstation to identify the specific part needing replacement, open the printer access panels, verify the part number on the currently installed unit matches the replacement, remove the used consumable, and install the new unit by following the specific OEM replacement steps, ensuring that any protective safety tape or tabs are removed before closing the chassis."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7997007103998482, "y": -0.5947431085549063, "z": -0.08221562267856969, "word": "Multifunction device/printers: Devices and Printers, Control Panel", "pos_group": "other", "row_number": 1509, "definition": "A Windows interface management container that provides a centralized, graphical view of all installed printing devices, scanners, and fax interfaces, allowing for the rapid diagnosis and configuration of peripheral settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Run command prompt by pressing \u201cWindows Key + R\u201d, type the instruction \u201ccontrol printers\u201d, and press Enter to load the management window. If a device is missing, click \u201cAdd a printer\u201d to initiate the automated device discovery wizard or manually enter the IP address of a networked print host to establish the connection link."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8013403591098954, "y": -0.5815480785347735, "z": -0.1401979358412122, "word": "Multifunction device/printers: drivers", "pos_group": "other", "row_number": 1510, "definition": "Essential software control files that allow the host operating system to communicate with and translate instructions for the specific hardware architecture of a printer, ensuring that document output matches the requested formatting.", "details": [{"label": "TROUBLESHOOTING", "value": "Uninstall the existing problematic driver from \u201cPrograms and Features\u201d, navigate to the official OEM support website, download the latest version of the specific model's driver (e.g., PCL (Printer Command Language) or PostScript), and install it to ensure full feature compatibility and proper communication with the OS."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.824117695714448, "y": -0.559412472696607, "z": -0.08881277499198115, "word": "Multifunction device/printers: duplexing", "pos_group": "other", "row_number": 1511, "definition": "An automated printer mechanism that allows for printing on both sides of a sheet of paper (double-sided printing) by feeding the paper through a reverse pathway back into the printing engine.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cPrinter Properties\u201d and ensure the \u201cDuplexing Unit\u201d is enabled under the \u201cDevice Settings\u201d configuration tab. If paper jams occur during duplexing, clear any paper scraps from the rear access door and clean the rollers within the duplexer module to ensure proper paper traction."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7882841569383171, "y": -0.6061182364994453, "z": -0.10596589688597548, "word": "Multifunction device/printers: inkjet printers", "pos_group": "other", "row_number": 1514, "definition": "A non-impact printing technology that creates images by spraying precise, minute droplets of liquid ink onto the paper through microscopic nozzles within the print head assembly.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cClean Print Heads\u201d or \u201cNozzle Check\u201d diagnostic utility found in the printer\u2019s software settings or on the front panel menu, which forces a small amount of ink through the nozzles to clear out blockages. If manual cleaning is required, gently wipe the nozzle surface with a lint-free cloth dampened with isopropyl alcohol."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8184020777195726, "y": -0.5589928250820937, "z": -0.13321058775872963, "word": "Multifunction device/printers: laser printers", "pos_group": "other", "row_number": 1515, "definition": "A high-speed, non-impact printing technology that utilizes a laser beam to draw a latent image onto a rotating, light-sensitive photosensitive drum, which then attracts charged toner powder that is subsequently fused onto the paper by heat.", "details": [{"label": "TROUBLESHOOTING", "value": "If the toner is smeared, the fuser assembly is likely failing to reach the required temperature, necessitating replacement. If the image is ghosting, the drum is not being wiped clean properly; check the drum\u2019s wiper blade and cleaning cycle settings, or replace the imaging drum unit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8101795019002633, "y": -0.5813894023622346, "z": -0.07480332560471298, "word": "Multifunction device/printers: managing", "pos_group": "other", "row_number": 1517, "definition": "The administrative oversight of printer status, job queues, toner levels, and hardware health to ensure high availability and consistent document output.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a centralized print server dashboard or individual web-based administration interfaces to monitor toner levels and queue status. Clear stalled jobs in the Windows Print Spooler queue by stopping the \u201cPrint Spooler\u201d service, clearing the \u201cC:\\Windows\\System32\\spool\\PRINTERS\u201d folder of any pending job files, and restarting the service."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7914626390007332, "y": -0.5963223181985732, "z": -0.1341140704187109, "word": "Multifunction device/printers: page printers", "pos_group": "other", "row_number": 1521, "definition": "A classification of high-speed printers (primarily laser printers) that process and output an entire page of content at once, rather than printing line-by-line or character-by-character.", "details": [{"label": "TROUBLESHOOTING", "value": "Increase the printer's internal RAM (Random Access Memory) if possible, or reduce the resolution/DPI (Dots Per Inch) of the documents being sent if the memory capacity is exceeded during complex image processing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8278395256908919, "y": -0.5509612441876638, "z": -0.10546765905746125, "word": "Multifunction device/printers: permissions", "pos_group": "other", "row_number": 1522, "definition": "Security settings that determine which users have the rights to print, manage their own print jobs, or manage the printer settings and queues of others.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to \u201cPrinter Properties > Security\u201d, verify the user\u2019s assigned permissions, and grant \u201cPrint\u201d rights only to general users while restricting \u201cManage Printer\u201d rights to administrative accounts to prevent unauthorized configuration changes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7926595704348488, "y": -0.6033714851117961, "z": -0.08737079805076131, "word": "Multifunction device/printers: spooling", "pos_group": "other", "row_number": 1527, "definition": "A process where print jobs are sent from an application and stored in a temporary holding area (the \u201cprint spooler\u201d) on the computer or server disk, allowing the printer to retrieve the data as it is ready to output.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the Windows \u201cPrint Spooler\u201d service. If the spooler remains frozen, navigate to \u201cC:\\Windows\\System32\\spool\\PRINTERS\u201d, delete all files in that directory (these are the pending, likely corrupted, print jobs), and restart the service again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8078379807324804, "y": -0.5715977562403173, "z": -0.14378387234701734, "word": "Multifunction device/printers: testing", "pos_group": "other", "row_number": 1528, "definition": "The diagnostic method of printing a page to verify that the printer's mechanical components, communication links, and print engine are functioning correctly.", "details": [{"label": "TROUBLESHOOTING", "value": "Print a \u201cTest Page\u201d directly from the Windows \u201cPrinter Properties\u201d menu. If the test page prints correctly, the printer hardware and driver are functional, and the issue likely lies within the application that was failing. If it does not print, the issue is with the printer, network, or driver."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8211993483178106, "y": -0.5652715217848518, "z": -0.0781008129371316, "word": "Multifunction device/printers: thermal printers", "pos_group": "other", "row_number": 1529, "definition": "A printing technology that uses heat to transfer images onto specially treated, heat-sensitive paper; common in point-of-sale receipt printers.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the thermal print head with a cotton swab dipped in isopropyl alcohol to remove residue buildup. Ensure the paper is loaded with the thermal-sensitive side facing the print head, as thermal paper only works when the correct side is impacted by heat."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.78565720950894, "y": -0.607239615633127, "z": -0.118333420268145, "word": "Multifunction device/printers: toner cartridges", "pos_group": "other", "row_number": 1530, "definition": "The consumable unit in a laser printer that contains fine, plastic-based powder (toner) and, in some designs, the imaging drum; it is responsible for the actual text and image formation.", "details": [{"label": "TROUBLESHOOTING", "value": "Remove the cartridge and gently rock it side-to-side to redistribute the toner powder. If spilling, clean the printer interior with a specialized vacuum designed for toner (do not use a standard vacuum, as toner particles can pass through the filters and damage the motor) and replace the cartridge."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8249666606528521, "y": -0.5510590346168368, "z": -0.12555456653758917, "word": "Multifunction device/printers: tray settings", "pos_group": "other", "row_number": 1531, "definition": "Configuration parameters that define which paper trays are assigned to specific paper sizes or types, ensuring the printer pulls from the correct source.", "details": [{"label": "TROUBLESHOOTING", "value": "In the printer's \u201cPrinting Preferences\u201d or the physical device\u2019s \u201cTray Management\u201d menu, assign the correct paper size (e.g., 8.5x14) to the specific tray that contains that paper stock. Ensure the \u201cPaper Type\u201d setting (e.g., Cardstock, Letterhead) also matches the physical paper loaded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8026556988738697, "y": -0.5918844838992016, "z": -0.07359746452613412, "word": "Multifunction device/printers: Windows Print Spooler", "pos_group": "other", "row_number": 1533, "definition": "A process where print jobs are sent from an application and stored in a temporary holding area (the \u201cprint spooler\u201d) on the computer or server disk, allowing the printer to retrieve the data as it is ready to output.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the Windows \u201cPrint Spooler\u201d service. If the spooler remains frozen, navigate to \u201cC:\\Windows\\System32\\spool\\PRINTERS\u201d, delete all files in that directory (these are the pending, likely corrupted, print jobs), and restart the service again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7956741438746636, "y": -0.5884336546955673, "z": -0.1436958273261222, "word": "Page printers", "pos_group": "other", "row_number": 1724, "definition": "A class of printers\u2014most commonly laser printers\u2014that receive and process an entire page of data in memory before beginning the physical printing process.", "details": [{"label": "TROUBLESHOOTING", "value": "Add more RAM (Random Access Memory) to the printer; lower the resolution (DPI - Dots Per Inch) of the print job; update the printer firmware; check the connection between the workstation and the print server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8288508245529075, "y": -0.5518049419057586, "z": -0.0922909352338998, "word": "PCL (Printer Command Language) drivers", "pos_group": "other", "row_number": 1768, "definition": "A page description language developed by Hewlett-Packard (HP) to provide a standardized way for computers to send formatting instructions to printers.", "details": [{"label": "TROUBLESHOOTING", "value": "Remove the current printer instance from the OS, download the latest PCL-specific driver from the manufacturer's support site, and reinstall the printer. If the issue persists, try an alternative driver like PostScript (PS)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7864833020777273, "y": -0.6099024272931229, "z": -0.09727818221405533, "word": "Peripherals: Printers/multifunction devices", "pos_group": "other", "row_number": 1778, "definition": "Hardware devices that perform printing, scanning, copying, and/or faxing tasks.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear paper paths, check ink/toner levels, restart the print spooler service via the command \u201cservices.msc\u201d, and ensure the printer is connected to the network or local port correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8156927665556273, "y": -0.5606980482457348, "z": -0.14234819732701418, "word": "Permissions: Printers/multifunction devices", "pos_group": "other", "row_number": 1791, "definition": "Controls that limit who can print, manage the printer queue, or change printer settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \"Print Management\", right-click the printer, select \"Properties > Security\", and ensure the user or group has the \"Print\" permission."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8153822580080706, "y": -0.5746640086222793, "z": -0.07009315601278805, "word": "Piezoelectric inkjet printers", "pos_group": "other", "row_number": 1824, "definition": "A type of inkjet printer that uses a piezoelectric crystal, which changes shape when an electric current is applied, to force ink droplets onto paper.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform the printer's built-in \"Head Cleaning\" utility, verify that the ink cartridges are not expired, and ensure the print head is seated correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7859888565299656, "y": -0.6040435296164081, "z": -0.13173052698318938, "word": "PostScript drivers", "pos_group": "other", "row_number": 1865, "definition": "A type of printer driver that converts print requests into an advanced vector-based page description language developed by Adobe, frequently used in desktop publishing for complex graphics layout processing.", "details": [{"label": "TROUBLESHOOTING", "value": "Purge the existing print queue through the Print Spooler service interface, download the certified PostScript driver variant directly from the vendor's enterprise support repository, and swap the driver configuration under the printer properties tab."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8300403859111684, "y": -0.5460043662400743, "z": -0.11363181686136042, "word": "Printers/multifunction devices", "pos_group": "other", "row_number": 1921, "definition": "Hardware peripherals designed to output digital documents to physical media, or complex units that integrate printing, scanning, copying, and faxing into a single chassis.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical power and data connections, check the print spooler status, ensure correct drivers are installed, and run the built-in self-test page to isolate hardware issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7943704204938282, "y": -0.6024408904085521, "z": -0.07772135233132253, "word": "Printers/multifunction devices: 3D printers", "pos_group": "other", "row_number": 1922, "definition": "An additive manufacturing device that creates three-dimensional objects by depositing materials, typically plastic filament, layer by layer based on a digital 3D model.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the print nozzle, re-level the print bed, ensure the filament is not tangled or moisture-damaged, and adjust the extrusion temperature settings in the slicing software."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8025279458507696, "y": -0.5775460156312681, "z": -0.14963119981137352, "word": "Printers/multifunction devices: Access", "pos_group": "other", "row_number": 1923, "definition": "The administrative control defining which users or groups can utilize or manage specific printing resources within an enterprise environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Printer Properties\" dialog, navigate to the \"Security\" tab, and verify the user or security group has the \"Print\" permission enabled."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8266879252728768, "y": -0.5570625963396713, "z": -0.0791728360445103, "word": "Printers/multifunction devices: Audit logs", "pos_group": "other", "row_number": 1924, "definition": "Security records that track which users have printed documents, what documents were printed, and when the printing occurred.", "details": [{"label": "TROUBLESHOOTING", "value": "Enable \"Audit object access\" in the \"Group Policy\" settings for the print server and configure the printer security properties to log specific user events."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7823745609429165, "y": -0.6128763600531282, "z": -0.11078182918424379, "word": "Printers/multifunction devices: Collating", "pos_group": "other", "row_number": 1925, "definition": "A print configuration that organizes multiple-page documents into complete sets (e.g., 1-2-3, 1-2-3) rather than grouped by page (e.g., 1-1, 2-2, 3-3).", "details": [{"label": "TROUBLESHOOTING", "value": "Access the print dialog, select \"Printer Properties\" or \"Preferences,\" locate the \"Collate\" checkbox in the finishing options, and ensure it is enabled before sending the job."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8236699456221922, "y": -0.550645972945543, "z": -0.13548739113877542, "word": "Printers/multifunction devices: Configuring", "pos_group": "other", "row_number": 1926, "definition": "The process of setting up printer-specific parameters, such as paper size, tray selection, default quality, and network settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Devices and Printers\" Control Panel applet, right-click the target printer, select \"Printing Preferences,\" and adjust the layout, paper quality, and finishing settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8072934414838218, "y": -0.5863864280630794, "z": -0.06654514498166039, "word": "Printers/multifunction devices: Consumables", "pos_group": "other", "row_number": 1928, "definition": "The replaceable components of a printer that are depleted through use, such as toner cartridges, ink cartridges, fuser kits, and maintenance rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the printer display for error messages, replace the depleted consumable following the manufacturer's user manual, and reset the printer\u2019s counter if required."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7895856723506578, "y": -0.596515356445241, "z": -0.1439579645020268, "word": "Printers/multifunction devices: Drivers", "pos_group": "other", "row_number": 1930, "definition": "The software layer that allows the operating system and applications to communicate with the printer hardware, translating data into a format the printer understands (e.g., PCL - Printer Command Language or PostScript).", "details": [{"label": "TROUBLESHOOTING", "value": "Download and install the latest certified driver from the manufacturer\u2019s support website, or uninstall the current driver and use the \"Add Printer\" wizard to install a fresh instance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8325403093395273, "y": -0.5450562119646115, "z": -0.09894624360546839, "word": "Printers/multifunction devices: Duplexing", "pos_group": "other", "row_number": 1931, "definition": "A printing feature that automatically prints on both sides of the paper, reducing paper waste and storage space.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the \"Printing Preferences\" menu, ensure the \"Duplex\" or \"Two-Sided\" printing option is enabled, and verify that the printer hardware supports this feature via an integrated duplexer unit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7866232147892233, "y": -0.6112521505480845, "z": -0.08714772748046463, "word": "Printers/multifunction devices: Inkjet printers", "pos_group": "other", "row_number": 1934, "definition": "Printers that create images by firing microscopic droplets of liquid ink onto paper from nozzles.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the printer\u2019s built-in \"Print Head Cleaning\" or \"Nozzle Check\" utility; if that fails, manually clean the cartridges using a lint-free cloth and distilled water."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.811181262671516, "y": -0.5651096359829413, "z": -0.15045284447251994, "word": "Printers/multifunction devices: Laser printers", "pos_group": "other", "row_number": 1935, "definition": "High-volume printers that use a laser beam and an electrostatic process to fuse toner powder onto the paper.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the corona wire, inspect the drum unit for physical damage, ensure the fuser unit is operating at the correct temperature, and replace the toner cartridge if necessary."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8212983535074204, "y": -0.5663934900451478, "z": -0.06831858429795905, "word": "Printers/multifunction devices: Managing", "pos_group": "other", "row_number": 1937, "definition": "The ongoing tasks of monitoring printer queues, managing supplies, and updating printer firmware.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a centralized management console to monitor status, schedule firmware updates during maintenance windows, and ensure that spare parts are inventoried."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7812567668198, "y": -0.6113441027899169, "z": -0.12608034058592982, "word": "Printers/multifunction devices: Page printers", "pos_group": "other", "row_number": 1941, "definition": "Printers that process and print an entire page at a time (e.g., laser printers), as opposed to line-at-a-time (impact) printers.", "details": [{"label": "TROUBLESHOOTING", "value": "Add more RAM to the printer if available, or simplify the document's graphics and font complexity to reduce the processing time."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8304512549327202, "y": -0.5431926269438413, "z": -0.12366278023123611, "word": "Printers/multifunction devices: Permissions", "pos_group": "other", "row_number": 1942, "definition": "Access rules that determine whether a user can perform tasks such as printing, managing the printer, or managing print jobs.", "details": [{"label": "TROUBLESHOOTING", "value": "In \"Printer Properties,\" check the \"Security\" tab and ensure the appropriate users are assigned \"Print,\" \"Manage this printer,\" or \"Manage documents\" permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7979632578950392, "y": -0.5987916220650165, "z": -0.06858011661029667, "word": "Printers/multifunction devices: Spooling", "pos_group": "other", "row_number": 1947, "definition": "The process of intercepting print jobs and storing them in a temporary file or memory area on the print server while waiting for the printer to be ready.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Services\" management console, find the \"Print Spooler\" service, right-click, and select \"Restart.\" You may also need to clear the \"C:\\Windows\\System32\\spool\\PRINTERS\" folder of corrupted files."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7962413300320005, "y": -0.5853427046772962, "z": -0.152884474129777, "word": "Printers/multifunction devices: Testing", "pos_group": "other", "row_number": 1948, "definition": "Validating that a printer is functioning correctly by printing a test page, often from the printer\u2019s physical control panel.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the Windows \"Print Test Page\" button in the printer properties; if this succeeds, the issue lies with the application or the driver, not the printer hardware itself."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.831738006732837, "y": -0.5488477563955257, "z": -0.0835345943647596, "word": "Printers/multifunction devices: Thermal printers", "pos_group": "other", "row_number": 1949, "definition": "Printers that create images by heating selectively coated heat-sensitive paper, commonly used for receipt printing.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the heating element with isopropyl alcohol, ensure the receipt paper is thermal-sensitive, and check that the paper roll is oriented correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7807031386261731, "y": -0.6166871739416945, "z": -0.10099276625109507, "word": "Printers/multifunction devices: Toner cartridges", "pos_group": "other", "row_number": 1950, "definition": "A consumable component for laser printers containing the powdered toner and, in some designs, the imaging drum.", "details": [{"label": "TROUBLESHOOTING", "value": "Gently shake the cartridge to redistribute the toner, inspect the drum for buildup, and replace the cartridge if output remains poor."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8204514972721421, "y": -0.5529107903668043, "z": -0.14542695252206844, "word": "Printers/multifunction devices: Tray settings", "pos_group": "other", "row_number": 1951, "definition": "Configuration options that specify which paper tray the printer should pull from for different document sizes or types.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \"Paper Source\" setting in \"Printing Preferences\" and ensure the tray is set to match the actual paper size (e.g., Letter vs. Legal) loaded in the physical tray."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8131431144987687, "y": -0.5787837338144356, "z": -0.06170627857084476, "word": "Printers/multifunction devices: Windows Print Spooler", "pos_group": "other", "row_number": 1953, "definition": "A Windows OS service that manages print jobs in the print queue and communicates with the printer.", "details": [{"label": "TROUBLESHOOTING", "value": "Stop the \"Print Spooler\" service in \"Services,\" delete all files in the spooler directory (\"C:\\Windows\\System32\\spool\\PRINTERS\"), and restart the service."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7836338625366353, "y": -0.6050161325440616, "z": -0.14097
