 0.44031620432940277, "word": "Accessories: Warranties", "pos_group": "other", "row_number": 47, "definition": "Service agreements provided by manufacturers or third-party insurers that cover the repair or replacement costs of computer hardware components due to internal defects or accidental damage over a specified timeframe.", "details": [{"label": "TROUBLESHOOTING", "value": "Look up the device serial number or IMEI (International Mobile Equipment Identity) string on the manufacturer's support portal to check coverage status before opening a laptop chassis; document all repair steps meticulously and use official OEM (Original Equipment Manufacturer) authorized parts to ensure corporate service agreements remain intact."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8316577645536123, "y": 0.34375514250919437, "z": 0.43609375672689, "word": "Analyzing: Detection/analysis phase, incident response", "pos_group": "other", "row_number": 110, "definition": "The critical second phase of the official security incident response lifecycle. Security teams analyze log files, alerts, and system anomalies to confirm that a security breach or incident is actually occurring, determine its scope, and identify the specific type of attack method used.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate and review system logs from firewalls, SIEM (Security Information and Event Management) platforms, and endpoint protection software; capture network traffic samples to verify attack patterns; document all findings carefully before moving to Step 3 (Containment) of the incident response plan."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8283097853158824, "y": 0.33601402213607307, "z": 0.4483274210639982, "word": "Analyzing: Risk, change management", "pos_group": "other", "row_number": 111, "definition": "A crucial evaluation phase within the formal IT change management workflow. Before any major network configuration or hardware modification is approved, the change a ue": "CORE 2"}]}, {"x": 0.8329366832864119, "y": 0.32662051220144545, "z": 0.4466939921748409, "word": "Backout plans", "pos_group": "other", "row_number": 200, "definition": "A mandatory step in the organizational change management workflow process that details explicit technical operations required to revert a system to its original state if a newly deployed modification fails or causes a critical infrastructure breakdown.", "details": [{"label": "TROUBLESHOOTING", "value": "Before deploying any production modification, document a step-by-step reversal sequence, preserve recent system configuration snapshots, and maintain verified system backups to allow the engineering team to run the reversal procedures immediately if an update fails."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8358903150240292, "y": 0.34399828514437314, "z": 0.4277295419616931, "word": "Best practices: Account management", "pos_group": "other", "row_number": 223, "definition": "Operational security guidelines that direct how administrative teams provision, audit, update, suspend, and delete corporate user network identities to enforce organizational data boundaries.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement an automated offboarding checklist procedure to disable user profiles immediately upon separation; run quarterly profile access audits across Active Directory (AD) containers, and configure strict profile tracking parameters to maintain regulatory compliance."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8232696902880694, "y": 0.3425434392446277, "z": 0.45264888079332305, "word": "Best practices: Change management", "pos_group": "other", "row_number": 227, "definition": "A formal corporate governance process framework used to evaluate, authorize, test, document, and execute major infrastructure modifications across an enterprise environment to reduce risk and prevent service outages.", "details": [{"label": "TROUBLESHOOTING", "value": "Mandate that all infrastructure modifications be submitted as a formal Change Request (CR) to a Change Advisory Board (CAB); ensure each request includes a defined scope of work, risk analysis, testing log, and an actionable backout plan before execution."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8397487193089037, "y": 0.3247372033639531, "z": 0.4351641496842481, "word": "Business practices, documenting", "pos_group": "other", "row_number": 292, "definition": "The administrative task of creating and maintaining clear, written records of standard operational procedures, asset tracking data, and corporate compliance guidelines.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a central knowledge base using enterprise wiki software, draft clear Standard Operating Procedures (SOPs), and enforce structured ticketing workflows to document all network change actions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8281980454148217, "y": 0.35426748479175096, "z": 0.43426092017403023, "word": "Certificates, troubleshooting", "pos_group": "other", "row_number": 338, "definition": "The process of identifying and fixing issues related to digital certificates that verify the identity of a website, person, or device.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the system date and time are accurate (crucial for certificate validity); check if the certificate has expired; ensure the certificate chain of trust is correctly installed."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8276962540934087, "y": 0.3281984557132254, "z": 0.4551974128081059, "word": "Chains of custody", "pos_group": "other", "row_number": 339, "definition": "A chronological documentation or paper trail that records the sequence of custody, control, transfer, analysis, and disposition of physical or electronic evidence.", "details": [{"label": "TROUBLESHOOTING", "value": "Maintain rigorous logs from the moment evidence is collected; document every person who touches the evidence, the time of transfer, and the physical location where it is stored."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8411977489408731, "y": 0.3358853891441817, "z": 0.42375388203091374, "word": "Change management", "pos_group": "other", "row_number": 340, "definition": "A structured approach to transitioning individuals, teams, and organizations from a current state to a desired future state to ensure changes are implemented safely.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the formal change process: document the requested change, perform risk analysis, create a \"Rollback plan\", obtain approval from the change board, and communicate with stakeholders."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8208848026248318, "y": 0.3525785275001881, "z": 0.44926219823772195, "word": "CIA triad", "pos_group": "other", "row_number": 356, "definition": "A foundational model for Information Security (InfoSec) consisting of three pillars: Confidentiality (data is private), Integrity (data is accurate/unaltered), and Availability (systems are accessible).", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a risk assessment: use encryption for confidentiality, implement hashing/checksums for integrity, and establish redundant hardware/failover systems for availability."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8373575556227368, "y": 0.3185598593564378, "z": 0.44424310917370635, "word": "Compliance policies", "pos_group": "other", "row_number": 427, "definition": "Rules and guidelines set by an organization or regulatory body to ensure systems follow specific security and operational standards (e.g., HIPAA or PCI DSS).", "details": [{"label": "TROUBLESHOOTING", "value": "Review the organization's security policy documentation, use automated configuration management tools to audit settings, and remediate discrepancies."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8340274413152196, "y": 0.352600364810203, "z": 0.4243479820488132, "word": "Containment/eradication/recovery phase, incident response", "pos_group": "other", "row_number": 527, "definition": "Stages of an IR (Incident Response) plan: Containment stops the spread of an attack, Eradication removes the threat, and Recovery restores the system to a clean state.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established IR policy: physically disconnect infected machines, change compromised credentials, re-image systems from known-good backups, and run anti-malware scans to ensure the threat is gone."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8213691024219234, "y": 0.3371371491606098, "z": 0.46009927216032515, "word": "Custody, chains of", "pos_group": "other", "row_number": 590, "definition": "The documented record of evidence or sensitive equipment, ensuring it has remained secure and untampered with from collection to analysis.", "details": [{"label": "TROUBLESHOOTING", "value": "Always maintain a physical or digital log that records who collected the item, where it was stored, and who accessed it at every step of the process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8441694751668161, "y": 0.3242866086892749, "z": 0.42686776948065713, "word": "Data, PCI-DSS", "pos_group": "other", "row_number": 599, "definition": "A set of security standards designed to ensure that all companies that accept, process, store, or transmit credit card information maintain a secure environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement strict access controls, encrypt transmitted card data, and regularly test security systems to meet \u201cPCI-DSS\u201d requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8229256648740225, "y": 0.36027138067702186, "z": 0.43931524257271176, "word": "Data, regulated data", "pos_group": "other", "row_number": 602, "definition": "Information protected by law or organizational policy (e.g., \u201cPII\u201d (Personally Identifiable Information), \u201cPHI\u201d (Protected Health Information)).", "details": [{"label": "TROUBLESHOOTING", "value": "Apply strict encryption at rest and in transit, and strictly limit access based on the \u201cPrinciple of Least Privilege\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8309413257854515, "y": 0.3192580440793928, "z": 0.45564329731986225, "word": "Detection/analysis phase, incident response", "pos_group": "other", "row_number": 630, "definition": "The stage in the incident response process where an incident is identified, validated, and analyzed to determine its scope.", "details": [{"label": "TROUBLESHOOTING", "value": "Review logs, interview users, and perform packet analysis to determine if the alert is a true positive incident."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8412043334674867, "y": 0.3433541694655963, "z": 0.41771184286073587, "word": "Documentation: Asset management", "pos_group": "other", "row_number": 738, "definition": "The process of tracking and documenting all hardware and software components within an organization, including purchase date, serial numbers, and physical location.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a physical audit, use an automated network scanning tool to compare inventory against the database, and update records for decommissioned hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8171748460817368, "y": 0.3500993520134201, "z": 0.45788176929320223, "word": "Documentation: Business practices", "pos_group": "other", "row_number": 740, "definition": "Standardized methodologies and workflows used by an organization to ensure operational efficiency, consistency, and alignment with corporate goals.", "details": [{"label": "TROUBLESHOOTING", "value": "Review existing documentation against current organizational goals, audit performance metrics, and implement refined procedural updates."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.842657981804333, "y": 0.3145518130499889, "z": 0.437017943119517, "word": "Documentation: Change control forms", "pos_group": "other", "row_number": 741, "definition": "Standardized documents used to formally request, review, and approve modifications to a production environment to prevent unauthorized or disruptive changes.", "details": [{"label": "TROUBLESHOOTING", "value": "Halt the unauthorized change, review the change management board logs, and retroactively complete the formal documentation process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.829339629804669, "y": 0.36112588406053114, "z": 0.42636120167875763, "word": "Documentation: Change management", "pos_group": "other", "row_number": 742, "definition": "A systematic approach to managing all changes made to an IT infrastructure, ensuring that changes are implemented with minimal disruption to services.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish a Change Advisory Board (CAB), implement standardized request procedures, and document all outcomes of the change."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8227092822318094, "y": 0.328067192696939, "z": 0.46424277485553894, "word": "Documentation: Change request forms", "pos_group": "other", "row_number": 743, "definition": "A specific subset of change management documentation where an engineer formally details the scope, risk, and impact of a proposed change.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all fields are filled, including backout plan (rollback plan) and justification, before submitting to the manager or CAB for approval."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8465622354119263, "y": 0.3292128373895875, "z": 0.418271788759724, "word": "Documentation: Compliance policies", "pos_group": "other", "row_number": 744, "definition": "Formal documents detailing the legal and regulatory requirements (such as HIPAA or GDPR) that an organization must follow.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a gap analysis between current operations and the regulatory documentation; update internal processes to match the required compliance standards."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8175197113313941, "y": 0.36193466620690806, "z": 0.44795626905126373, "word": "Documentation: DRP (Disaster Recovery Plan)", "pos_group": "other", "row_number": 747, "definition": "A detailed document outlining the steps to be taken in the event of a catastrophic failure (fire, flood, cyber-attack) to restore business operations.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct regular DRP testing and drills, ensure backups are verified, and keep contact lists updated."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8363299184030906, "y": 0.3115044688961362, "z": 0.4511288435043986, "word": "Documentation: Incident reports", "pos_group": "other", "row_number": 749, "definition": "A document created after a security or system event that details what occurred, when it happened, the impact, and how it was resolved.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all incidents are logged in the ticketing system and summarized for management review."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8381919082355612, "y": 0.3532776482804736, "z": 0.41548673648366513, "word": "Documentation: Incident response", "pos_group": "other", "row_number": 750, "definition": "The organized approach to addressing and managing the aftermath of a security breach or cyberattack.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the documented plan: Identify, Contain, Eradicate, Recover, Lessons Learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8158279434960046, "y": 0.3428493454497743, "z": 0.4657027946402525, "word": "Documentation: MSDS (Material Safety Data Sheet)", "pos_group": "other", "row_number": 752, "definition": "Also known as Safety Data Sheet (SDS) A document that lists information relating to occupational safety and health for the use of various substances and products (e.g., chemicals, printer toner).", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the SDS, follow the disposal instructions exactly, and ensure proper PPE (Personal Protective Equipment) is used."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.847419223247108, "y": 0.315191037806137, "z": 0.4272414654009585, "word": "Documentation: Offboarding processes", "pos_group": "other", "row_number": 754, "definition": "The structured procedure for removing an employee's access to all company systems and reclaiming hardware upon their departure.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the checklist to disable accounts, wipe devices, and revoke physical security access immediately upon departure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8231305344836204, "y": 0.367455963954997, "z": 0.4329344497202935, "word": "Documentation: Regulatory policies", "pos_group": "other", "row_number": 756, "definition": "Rules established by government bodies (e.g., PCI-DSS, HIPAA) that the organization must comply with to operate legally.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct internal audits and implement the necessary technical controls to satisfy the regulatory requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8268362496862608, "y": 0.3176742038492545, "z": 0.4641388977596058, "word": "Documentation: Ticketing systems", "pos_group": "other", "row_number": 759, "definition": "A software application that manages and maintains lists of issues (tickets) as needed for an organization's IT support.", "details": [{"label": "TROUBLESHOOTING", "value": "Log all work in the system, update status notes regularly, and ensure the ticket is closed only when the user confirms the issue is resolved."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8463208782036685, "y": 0.338273042033329, "z": 0.4114757831878918, "word": "DRP (Disaster Recovery Plans)", "pos_group": "other", "row_number": 793, "definition": "A comprehensive, documented operational roadmap specifying exact policy steps, backup restorative strategies, and personnel responsibilities required to recover an enterprise's IT infrastructure following a major catastrophic event.", "details": [{"label": "TROUBLESHOOTING", "value": "Activate the documented emergency chain of command, spin up backup computer operations at predefined alternate target sites, restore verified data from off-site secure storage backups, and continually execute plan tests to maintain readiness."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8132679251276826, "y": 0.35876399567503614, "z": 0.4581306335160274, "word": "End-user acceptance, change management", "pos_group": "other", "row_number": 852, "definition": "The process of verifying that the users affected by a change (e.g., a software update or process migration) have tested and approved the change before it is finalized in production.", "details": [{"label": "TROUBLESHOOTING", "value": "Involve key end-users in the User Acceptance Testing (UAT) phase of the change management process. Collect feedback, address concerns, and document acceptance before deploying to the full organization."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.842617871693606, "y": 0.306837131444918, "z": 0.44254502264650036, "word": "Environmental controls", "pos_group": "other", "row_number": 857, "definition": "The collective application of physical infrastructure systems, facility policies, and administrative standards designed to maintain optimal operating conditions for hardware while protecting personnel and ensuring regulatory compliance.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect room temperature and humidity levels, verify that air filtration systems are operational, maintain active Material Safety Data Sheets (MSDS) for all chemical agents, and conduct regular physical inspections of power distribution and waste management systems."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8326914887172525, "y": 0.3634172574928834, "z": 0.41779514307157434, "word": "Environmental controls: MSDS", "pos_group": "other", "row_number": 862, "definition": "The Material Safety Data Sheet (MSDS)\u2014now commonly referred to as a Safety Data Sheet (SDS)\u2014is a technical document that provides information on the hazards, handling, storage, and emergency procedures for chemical substances (such as printer toner or battery acid).", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the organization's central SDS binder or digital repository, identify the specific chemical identifier, follow the documented \"clean-up\" instructions, and use the required Personal Protective Equipment (PPE)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8172916217907328, "y": 0.33219950076868116, "z": 0.47082682234523626, "word": "First response, incident response", "pos_group": "other", "row_number": 985, "definition": "The actions taken by the first security professional to arrive at the scene of a security incident to stabilize the situation, protect evidence, and begin the documentation process.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the affected system from the network, document all observed activities and evidence (e.g., take photos or screenshots), and preserve the system state (e.g., dump the RAM before shutting down) for forensics."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8504756321597354, "y": 0.32068322984292297, "z": 0.41695739014917294, "word": "Incident reports", "pos_group": "other", "row_number": 1114, "definition": "Formal documents created after a security or system incident to record exactly what happened, what impact it had, and what steps were taken to resolve it.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all incidents are logged in the organization\u2019s ticketing or incident management system, document the timeline of events clearly, and conduct a post-incident review to update procedures."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8166527852721172, "y": 0.3699487992041207, "z": 0.44296288137350986, "word": "Incident response", "pos_group": "other", "row_number": 1115, "definition": "The organized approach to addressing and managing the aftermath of a security breach or cyberattack to limit damage and reduce recovery time.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established incident response plan (IRP), starting with identification, followed by containment, eradication, and finally, recovery and lessons learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8330718734875247, "y": 0.3081456431374869, "z": 0.4593881977362612, "word": "Incident response: Chains of custody", "pos_group": "other", "row_number": 1116, "definition": "The chronological documentation or paper trail that records the sequence of custody, control, transfer, and analysis of evidence collected during an incident.", "details": [{"label": "TROUBLESHOOTING", "value": "Maintain a strict log of who accessed the evidence, when, and for what purpose; keep all physical evidence in secured containers and digitally hash files to ensure integrity."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8432019763485805, "y": 0.34989118053267176, "z": 0.4081502038065168, "word": "Incident response: Detection/analysis phase", "pos_group": "other", "row_number": 1118, "definition": "The process of determining whether an event is truly a security incident and identifying the scope of the potential damage.", "details": [{"label": "TROUBLESHOOTING", "value": "Analyze logs, correlate events from multiple sources (e.g., IDS, Firewall, Server logs), and use forensic tools to identify the nature and source of the threat."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8111951045970951, "y": 0.3509072327173633, "z": 0.4677890724507685, "word": "Incident response: Documentation", "pos_group": "other", "row_number": 1119, "definition": "The recording of all actions taken during the incident response lifecycle to ensure compliance and assist in post-incident analysis.", "details": [{"label": "TROUBLESHOOTING", "value": "Maintain a detailed incident log that records all findings, technical actions, and communications, ensuring it is timestamped and signed off by authorized personnel."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8485438860727146, "y": 0.30659621004618265, "z": 0.43124475346829777, "word": "Incident response: First response", "pos_group": "other", "row_number": 1120, "definition": "The immediate actions taken by the first IT staff member to arrive at the scene of an incident, focused on preserving evidence and limiting initial impact.", "details": [{"label": "TROUBLESHOOTING", "value": "Secure the area, take photos of physical equipment if necessary, prevent unnecessary system reboots (which clears RAM), and follow the predefined \u201cFirst Responder\u201d checklist."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.825540656359908, "y": 0.3716595067151302, "z": 0.4246785087158499, "word": "Incident response: Lifecycle of", "pos_group": "other", "row_number": 1121, "definition": "The systematic, repeatable phases of an incident response process: Preparation, Detection/Analysis, Containment/Eradication/Recovery, and Post-Incident Activity.", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly review and update the incident response lifecycle documentation, conduct tabletop exercises, and ensure all staff are trained on their roles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8215841467991756, "y": 0.3199289903307271, "z": 0.47185265801331694, "word": "Incident response: Preparation phase", "pos_group": "other", "row_number": 1122, "definition": "The proactive steps taken before an incident occurs, such as policy development, staff training, and setting up logging/monitoring infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure security policies are clearly defined, conduct regular backups, train staff on social engineering detection, and perform vulnerability assessments."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8509695500427149, "y": 0.3305060272048903, "z": 0.40818695579518405, "word": "Internet: Network resources, troubleshooting", "pos_group": "other", "row_number": 1155, "definition": "The systemic validation method used to isolate resource attachment failures to specific network targets like off-site application stores, corporate intranet links, or external servers.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify local network gateway routing structures, execute the lookup instruction tool command \u201cnslookup domainname.com\u201d to confirm that active domain name system servers translate the path strings properly, and inspect edge firewall configurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8111519834533486, "y": 0.36760737390053383, "z": 0.45485962493240867, "word": "Licensing: Organizing", "pos_group": "other", "row_number": 1246, "definition": "The administrative procedure of collecting, indexing, tracking, and auditing corporate software activation keys, software installation media, support agreements, and purchase receipts within a structured database system.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish a secure, centralized digital licensing locker repository utilizing internal configuration management databases, scan physical certificates into encrypted digital formats, and map digital credentials to individual asset identifiers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8404315386165271, "y": 0.30147125458493, "z": 0.4503220087422391, "word": "Managing: assets", "pos_group": "other", "row_number": 1412, "definition": "The comprehensive tracking, identification, categorization, and documentation of an organization's physical and digital information technology components from acquisition through deployment to final physical disposal.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply serialized physical identification tags to all hardware equipment structures upon arrival, record component details in a centralized configuration management database (CMDB), perform routine physical audits, and follow explicit data destruction protocols during disposal phases."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8374196518666372, "y": 0.3621220557394479, "z": 0.40938483535006054, "word": "Managing: change", "pos_group": "other", "row_number": 1414, "definition": "A structured management framework used to evaluate, authorize, coordinate, document, and review modifications within an information technology infrastructure to minimize service disruptions.", "details": [{"label": "TROUBLESHOOTING", "value": "Document the proposed change, outline a comprehensive risk assessment map alongside a step-by-step fallback recovery script, submit the documentation to the Change Advisory Board (CAB) for review, execute the modification within an authorized maintenance window, and record the final implementation results in the team's historical tracking logs."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8119654562459099, "y": 0.339256507468882, "z": 0.4749917051942987, "word": "MSDS (Material Safety Data Sheets)", "pos_group": "other", "row_number": 1497, "definition": "A comprehensive workplace documentation folder template (now commonly known as a Safety Data Sheet or SDS) provided by hardware and chemical product manufacturers that details chemical hazards, flash point attributes, handling parameters, storage instructions, personal protective equipment (PPE) requirements, and disposal protocols for technical devices and hazardous cleaning chemicals.", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the physical safety compliance file cabinet inside the equipment maintenance facility, or search the digital database array folder location using the vendor product identifier string to pull up the official document page template. Follow the explicit \u201cSection 4: First-Aid Measures\u201d or \u201cSection 6: Accidental Release Measures\u201d to properly neutralize hazardous material situations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8529126754171485, "y": 0.3114015901319745, "z": 0.41900956764260083, "word": "Networks: Troubleshooting", "pos_group": "other", "row_number": 1641, "definition": "The systematic process of identifying, analyzing, and resolving issues within a network environment to restore communication and resource access.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the CompTIA troubleshooting methodology: identify the problem, establish a theory of probable cause, test the theory, establish a plan of action, verify full system functionality, and document findings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.81784493321984, "y": 0.37619766941658006, "z": 0.43543653812257066, "word": "Offboarding processes", "pos_group": "other", "row_number": 1675, "definition": "A formal procedure in corporate IT (Information Technology) management used to revoke a departing employee's access to all company digital resources, such as domain accounts, email, VPN (Virtual Private Network) access, and physical tokens.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the organizational checklist; disable the user account in \u201cActive Directory\u201d; revoke permissions in cloud identity providers (like Microsoft Entra ID, formerly Azure AD); collect all company-owned hardware; change shared administrative passwords if the employee had knowledge of them."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8282624503951377, "y": 0.30809293136703175, "z": 0.4680385228879259, "word": "PCI-DSS (Payment Card Industry-Data Security Standards)", "pos_group": "other", "row_number": 1765, "definition": "A set of proprietary information security standards administered by the Payment Card Industry Security Standards Council for organizations that handle branded credit cards.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a vulnerability scan to identify non-compliant systems, implement strong access control measures, ensure encryption of transmitted data, and maintain a secure network architecture according to the official documentation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8484528409187345, "y": 0.3434210616507125, "z": 0.40272788722861774, "word": "PHI (Protected Health Information)", "pos_group": "other", "row_number": 1797, "definition": "Any information in a medical record that can be used to identify an individual and that was created, used, or disclosed in the course of providing a health care service.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all storage media containing PHI is encrypted (e.g., AES-256), implement strict access controls, and ensure data destruction protocols meet HIPAA (Health Insurance Portability and Accountability Act) requirements before hardware disposal."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8077347145450773, "y": 0.360212193848439, "z": 0.4667031243967379, "word": "Planning: DRP (Disaster Recovery Plan)", "pos_group": "other", "row_number": 1834, "definition": "A formal, documented set of procedures that explains how an organization will quickly resume work after an unplanned incident (e.g., fire, flood, cyber-attack).", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly test the DRP with mock disaster simulations, ensure backups are off-site, and confirm that all staff know their roles in the event of a declared disaster."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8477236222582737, "y": 0.2992145648578047, "z": 0.43799007345174673, "word": "Policies: AUP (Acceptable Use Policy)", "pos_group": "other", "row_number": 1848, "definition": "A formal organizational compliance document defining the explicit parameters, behaviors, and ethical rules that employees must follow when interacting with corporate technology assets and network infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce user parameter tracking rules by using Active Directory (AD) Group Policy Objects (GPOs), push out explicit logon banner warnings that mandate acceptance before system entry, and audit access logs using a SIEM (Security Information and Event Management) system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8296331312338872, "y": 0.3728676810713422, "z": 0.41554609849153396, "word": "Policies: Compliance policies", "pos_group": "other", "row_number": 1851, "definition": "Operational and technical directives that mandate alignment with internal rules, organizational baselines, and vendor contractual obligations to manage business risk.", "details": [{"label": "TROUBLESHOOTING", "value": "Run automated network vulnerability assessments using configuration managers, deploy endpoint agents to monitor configurations, and isolate non-compliant nodes into a quarantine VLAN until they match the corporate baseline."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8157942857210516, "y": 0.32535752409938257, "z": 0.47814450210872317, "word": "Policies: Regulatory policies", "pos_group": "other", "row_number": 1852, "definition": "The mandatory framework and control sets imposed on an enterprise by external legal bodies to safeguard private data assets, with notable mandates including HIPAA (Health Insurance Portability and Accountability Act) and PCI-DSS (Payment Card Industry Data Security Standard).", "details": [{"label": "TROUBLESHOOTING", "value": "Implement strict end-to-end data encryption algorithms (like AES-256) for information at rest and in transit, roll out RBAC (Role-Based Access Control) matrix parameters across all active database files, and ensure the integrity of audit logs."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.854744771753098, "y": 0.32106176904967254, "z": 0.40783662858482783, "word": "Preparation phase, incident response", "pos_group": "other", "row_number": 1908, "definition": "The initial stage of the incident response lifecycle where organizations establish tools, policies, and procedures to effectively identify and manage potential security threats.", "details": [{"label": "TROUBLESHOOTING", "value": "Develop a clear Incident Response Plan (IRP), conduct regular team training and tabletop exercises, and ensure all critical systems have centralized logging enabled and monitored by a SIEM (Security Information and Event Management) system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.810841597856673, "y": 0.37576730317519097, "z": 0.44870350683907245, "word": "Purpose of change, change management", "pos_group": "other", "row_number": 2050, "definition": "A documented requirement in a formal Change Management process that explains why a change is necessary, what its goals are, and the business justification.", "details": [{"label": "TROUBLESHOOTING", "value": "Clearly articulate the business need, the expected benefit, and any risks involved; provide a rollback plan in case the change causes unforeseen issues."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8364723806566408, "y": 0.2987593501599512, "z": 0.45940919351991144, "word": "Recovery: Containment/eradication/recovery phase, incident response", "pos_group": "other", "row_number": 2105, "definition": "The combined core middle-to-late timeline steps of a formal Incident Response (IR) plan where security administrators limit the blast radius of a threat, remove malicious elements, and safely restore production systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the affected subnet via VLAN assignment, use enterprise anti-malware tools to eliminate malicious files or rebuild systems from pristine images, and implement continuous behavioral monitoring."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8429525847022351, "y": 0.3576270966149375, "z": 0.40191267672293085, "word": "Regulated data", "pos_group": "other", "row_number": 2117, "definition": "Subset of structured personal, corporate, or financial information that is strictly monitored and protected by national or industry-specific legal frameworks.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy DLP software signatures, apply AES 256-bit encryption algorithms to data at-rest and in-transit, and enforce strict RBAC matrix parameters."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8072174429555847, "y": 0.3483626230692212, "z": 0.4764908001594354, "word": "Regulated data: PCI-DSS", "pos_group": "other", "row_number": 2119, "definition": "An international corporate compliance framework required of any enterprise that processes, handles, transmits, or stores credit card numbers, debit details, and cardholder metadata.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the cardholder data environment using secure firewalls, deploy end-to-end point encryption tokenization, and implement mandatory multi-factor authentication."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8537089655151299, "y": 0.30229295291532704, "z": 0.424028268888784, "word": "Regulated data: PHI", "pos_group": "other", "row_number": 2120, "definition": "Individually identifiable medical or health tracking data\u2014including patient clinical histories, laboratory results, and healthcare billing records\u2014regulated under frameworks like HIPAA.", "details": [{"label": "TROUBLESHOOTING", "value": "Configure workstation screensaver idle lockouts set to a tight threshold, implement full-disk encryption via BitLocker, and verify audit log tracking mechanisms capture file read actions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8208627239851681, "y": 0.3801646079105154, "z": 0.4262150387584812, "word": "Regulatory policies", "pos_group": "other", "row_number": 2122, "definition": "The set of institutional and operational governance directives that translate national statutes, legal requirements, and security compliance rules into clear technology practices.", "details": [{"label": "TROUBLESHOOTING", "value": "Review statutory requirements, publish clear policy documentation on the intranet, and mandate yearly interactive security awareness training for all users."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8224105746124738, "y": 0.31120465778433665, "z": 0.4762273697919037, "word": "Responding to incidents", "pos_group": "other", "row_number": 2158, "definition": "A structured organizational approach to handling cybersecurity breaches, natural disasters, or critical system outages, ensuring that actions taken during the crisis are consistent, legal, and effective.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established IR (Incident Response) plan: preparation, identification, containment, eradication, recovery, and lessons learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8534181278127653, "y": 0.3345867751046518, "z": 0.39966134294627986, "word": "Responding to incidents: Chains of custody", "pos_group": "other", "row_number": 2159, "definition": "A legal and procedural record that tracks the handling, transfer, and location of digital evidence from the moment it is collected until it is presented in court, ensuring its integrity remains untainted.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a 'Chain of Custody' log form for every piece of collected evidence; record the time of collection, the name of the person who collected it, where it was stored, and the signature of anyone who accessed it thereafter."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8057265917899942, "y": 0.3698355162450866, "z": 0.4626298198411019, "word": "Responding to incidents: Detection/analysis phase", "pos_group": "other", "row_number": 2161, "definition": "The investigative step of identifying whether an event is truly a security incident and analyzing the scope, nature, and impact of the threat.", "details": [{"label": "TROUBLESHOOTING", "value": "Analyze log files from firewalls, servers, and SIEM (Security Information and Event Management) tools to identify abnormal patterns; cross-reference these patterns against known vulnerability signatures."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8450627148330717, "y": 0.29371413147903647, "z": 0.4467672962163566, "word": "Responding to incidents: Documentation", "pos_group": "other", "row_number": 2162, "definition": "The practice of keeping a detailed, chronological record of all actions taken during an incident, which is crucial for internal post-mortems and legal compliance.", "details": [{"label": "TROUBLESHOOTING", "value": "Maintain a dedicated incident log documenting the time, date, individuals involved, steps taken, and observed outcomes; keep all relevant security logs in a secure, write-once storage repository."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8349769235615315, "y": 0.3710071879376393, "z": 0.4064076815444383, "word": "Responding to incidents: First response", "pos_group": "other", "row_number": 2163, "definition": "The initial actions taken by the person who discovers a security incident, including immediate containment, reporting, and securing the physical or digital environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the incident, notify the incident response team immediately, follow the company\u2019s documented reporting procedure, and preserve the current state (like not rebooting an infected computer if it might destroy evidence in memory)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.81000238116041, "y": 0.3334081165386163, "z": 0.48242633669881474, "word": "Responding to incidents: Lifecycle of", "pos_group": "other", "row_number": 2164, "definition": "The full progression of an incident response, encompassing the entire cycle from the moment an issue is detected to its final resolution and post-incident reporting.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement a standard incident response lifecycle framework\u2014such as the one defined by NIST (National Institute of Standards and Technology)\u2014covering Preparation, Detection/Analysis, Containment/Eradication/Recovery, and Post-Incident Activity."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8572794069821901, "y": 0.31082989334534994, "z": 0.41043488614783086, "word": "Responding to incidents: Preparation phase", "pos_group": "other", "row_number": 2165, "definition": "The proactive steps taken before an incident occurs, such as establishing response policies, creating documentation templates, and ensuring the IT team is trained on incident handling.", "details": [{"label": "TROUBLESHOOTING", "value": "Develop a clear incident response policy, conduct regular tabletop exercises, ensure all security tools are updated and logs are being collected centrally, and designate an incident response team leader."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8123500815740032, "y": 0.3824728176262676, "z": 0.4402293592478065, "word": "Responsibilities (business practices), documenting", "pos_group": "other", "row_number": 2166, "definition": "The process of clearly defining and recording the roles, duties, and accountability of employees and administrators within an organization to ensure operational order and compliance.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a 'Responsibility Matrix' or RACI (Responsible, Accountable, Consulted, Informed) chart, clearly documenting who owns which processes, and ensure these documents are signed and accessible to all relevant staff."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8310842260825188, "y": 0.29896125630494164, "z": 0.4689575421990693, "word": "Risk analysis, change management", "pos_group": "other", "row_number": 2179, "definition": "A structured administrative step within a formal corporate Change Management protocol that systematically calculates the prospective liabilities, operational downtime risks, and dependencies associated with executing a technical system modification.", "details": [{"label": "TROUBLESHOOTING", "value": "Prior to executing any system adjustments, present a comprehensive risk ledger report to the CAB (Change Advisory Board); identify impacted dependencies, assign a numeric threat tier score (e.g., Low, Medium, High) to the task, document an explicit fallback recovery scenario, and schedule implementation hours strictly inside non-peak maintenance windows."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8487686075565827, "y": 0.35031185137175697, "z": 0.3960725408494657, "word": "Scope of change, change management", "pos_group": "other", "row_number": 2223, "definition": "A documented description of the extent, boundaries, and impact of a proposed technical change, intended to prevent 'scope creep' and ensure all stakeholders understand what is being modified.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a clear 'Change Request' form that details the specific systems affected, the potential risks, the required downtime, and the exact steps to be performed, and have it approved by the CAB (Change Advisory Board)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8034780091870687, "y": 0.3586993672930643, "z": 0.4751398243215781, "word": "Security: PCI-DSS (Payment Card Industry Data Security Standard)", "pos_group": "other", "row_number": 2290, "definition": "A set of security standards designed to ensure that all companies that accept, process, store, or transmit credit card information maintain a secure environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the internal network against PCI-DSS (Payment Card Industry Data Security Standard) requirements, ensure network segmentation is in place, and perform regular vulnerability scanning using authorized tools."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8527456937547077, "y": 0.29419054246847937, "z": 0.4315978527575225, "word": "Staff member responsibilities, change management", "pos
