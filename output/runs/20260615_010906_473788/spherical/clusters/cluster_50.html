<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 50, "radius": 285.0, "nodes": [{"x": 0.23489097777165815, "y": 0.5715668894225137, "z": -0.7862172215598857, "word": "Access: ACL (Access Control List)", "pos_group": "other", "row_number": 30, "definition": "A sequential rule list configured on network routers and firewalls to permit or deny traffic based on metrics like source/destination IP addresses, ports, or protocols. (Can also refer to file system lists defining user read/write permissions).", "details": [{"label": "TROUBLESHOOTING", "value": "Review the sequential rule ordering on the router/firewall via CLI or management console; ensure that a broad \"deny all\" statement isn't placed ahead of specific \"permit\" lines, as ACL rules process sequentially from top to bottom."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2243558884438314, "y": 0.5715465716701176, "z": -0.7893028263807969, "word": "Access: Remote access", "pos_group": "other", "row_number": 35, "definition": "Technologies that allow a user or administrator to connect securely to a corporate desktop, internal network, or remote server over an internet connection using protocols like RDP (Remote Desktop), SSH, or VPN client software.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the remote host machine is powered on and has active remote connections enabled within its system properties; verify that local and network firewalls aren't blocking the appropriate port traffic (TCP 3389 for RDP; TCP 22 for SSH)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2344887866802212, "y": 0.5798002469860482, "z": -0.780286282409319, "word": "ACL (Access Control Lists)", "pos_group": "other", "row_number": 69, "definition": "A formal rule matrix that dictates resource access rights. On network routers and firewalls, it filters inbound/outbound packets based on IP (Internet Protocol) addresses, protocols, or port numbers. On a file system (such as NTFS (New File Transfer System), it lists the specific explicit folder permissions granted to individual users and security groups.", "details": [{"label": "TROUBLESHOOTING", "value": "To fix a network ACL issue, trace rule order from top-to-bottom and fix any conflicting \"deny\" strings; for file permissions issues, right-click the folder, go to \"Properties > Security\", and edit the user lists to ensure the necessary permissions (Read/Write) are selected."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2346581379495983, "y": 0.5639928837243063, "z": -0.7917370683518414, "word": "CompTIA A+ certification exams", "pos_group": "other", "row_number": 429, "definition": "A series of exams (Core 1 and Core 2) that validate foundational knowledge in hardware, networking, security, and OS support.", "details": [{"label": "TROUBLESHOOTING", "value": "Use official exam objectives, practice exams, and hands-on labs to bridge knowledge gaps before sitting for the exam."}, {"label": "CORE", "value": "CORE 1 & 2"}]}, {"x": 0.21980621409522705, "y": 0.5794942340189652, "z": -0.7847749110311159, "word": "Configuring: Firewalls, SOHO networks", "pos_group": "other", "row_number": 456, "definition": "Establishing rules on a SOHO (Small Office/Home Office) router to block or permit incoming and outgoing traffic based on port numbers, IP addresses, or protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s web interface, navigate to the 'Firewall' or 'Port Forwarding' section, and define rules to block or allow specific traffic as needed."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2442640414678066, "y": 0.5741989814137075, "z": -0.7814285685776241, "word": "Configuring: Proxy settings", "pos_group": "other", "row_number": 462, "definition": "Setting up a computer to route its internet traffic through an intermediary proxy server, often for security or content filtering.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to 'Settings > Network & Internet > Proxy', disable the proxy if not needed, or update the proxy server address and port to match the network requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.22277966171001218, "y": 0.5637186249739751, "z": -0.7953556023476689, "word": "Connectivity: Access control", "pos_group": "other", "row_number": 466, "definition": "The process of limiting access to network resources based on user identity or device status, often managed via ACLs (Access Control Lists).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the permissions on the target resource, verify that the user is in the correct security group, and ensure the account is not locked out or disabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.22811448092053796, "y": 0.5867020400147694, "z": -0.7770099740909772, "word": "Content filtering/parental controls", "pos_group": "other", "row_number": 528, "definition": "A security feature that restricts access to specific websites or types of content, often managed at the router or OS level.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the filter\u2019s blocklist/allowlist, verify that the correct user account policy is applied, and update the software database used for content categorization."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.24449970603244484, "y": 0.5624578503862007, "z": -0.7898487578574663, "word": "Control Panel: Windows Defender Firewall", "pos_group": "other", "row_number": 544, "definition": "A host-based firewall that controls network traffic to and from a single workstation.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cWindows Defender Firewall\u201d in the Control Panel, click \u201cAllow an app or feature through Windows Defender Firewall\u201d, and verify the application is listed and enabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.21275801805055336, "y": 0.5743294544370141, "z": -0.7904933292073263, "word": "Documentation: AUP (Acceptable Use Policy)", "pos_group": "other", "row_number": 739, "definition": "A document that outlines the rules and constraints under which a user must agree to follow to access corporate networks and computing resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all users have signed the AUP during onboarding, conduct security awareness training, and enforce policies through Group Policy Objects (GPO)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.24382296585243998, "y": 0.5829290195755564, "z": -0.7750768474542381, "word": "Filtering: IP filtering, SOHO networks", "pos_group": "other", "row_number": 967, "definition": "A security process configured on Small Office/Home Office (SOHO) routers that controls network traffic by allowing or blocking specific IP (Internet Protocol) addresses from accessing the network or the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the router\u2019s web interface, navigate to the \u201cSecurity\u201d or \u201cFirewall\u201d settings, review the \u201cIP Filter\u201d table for incorrect block rules, and delete or modify any rules that match the affected device\u2019s IP address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.23081079397441834, "y": 0.5564473204208242, "z": -0.7981809049215491, "word": "Filtering: MAC filtering, SOHO networks", "pos_group": "other", "row_number": 968, "definition": "A security access control method where a router or access point only allows network communication from devices whose MAC (Media Access Control) address is included in an authorized \"allow list.\"", "details": [{"label": "TROUBLESHOOTING", "value": "Find the device\u2019s MAC address in its network settings, log into the wireless access point or router, locate the \u201cMAC Filtering\u201d or \u201cAccess Control\u201d menu, and add the device\u2019s MAC address to the whitelist."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.21681807004590936, "y": 0.5878111112839056, "z": -0.7794023492091535, "word": "Firewalls", "pos_group": "other", "row_number": 976, "definition": "A network security system that monitors and controls incoming and outgoing network traffic based on predetermined security rules, acting as a barrier between a trusted and untrusted network.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the firewall rules are configured to permit the necessary ports and protocols, check logs for \u201cDenied\u201d traffic, and ensure that the firewall service is actively running on the host or network gateway."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2524436605881681, "y": 0.5683904506853035, "z": -0.7830737473562778, "word": "Firewalls: Mobile devices", "pos_group": "other", "row_number": 977, "definition": "Software or hardware-based firewalls applied specifically to mobile operating systems (like Android or iOS) to control application access to mobile data or Wi-Fi networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Review app permissions in the phone\u2019s \u201cSettings\u201d menu, use a third-party firewall application (like \u201cNetGuard\u201d) to monitor and block unauthorized connections, and uninstall any apps that show persistent unauthorized network activity."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.21299042928686074, "y": 0.564210774508247, "z": -0.797684949689414, "word": "Firewalls: Port forwarding", "pos_group": "other", "row_number": 979, "definition": "A router or firewall configuration that redirects traffic arriving at a specific port on the public IP address to a specific device on the internal private network.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the internal device has a static IP address, log into the router, navigate to \u201cPort Forwarding\u201d settings, and create a rule mapping the external port to the internal IP and port of the host machine."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2349591676455226, "y": 0.5914190874027528, "z": -0.7713738734200286, "word": "Firewalls: Screened subnets", "pos_group": "other", "row_number": 980, "definition": "Also known as a DMZ (Demilitarized Zone), this is a subnetwork that exposes an organization's external-facing services (like web or email servers) to an untrusted network while protecting the internal private network.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the firewall rules governing the traffic between the \u201cScreened Subnet\u201d and the internal network; ensure the rules are restrictive and allow only necessary ports (e.g., \u201c80\u201d for HTTP or \u201c443\u201d for HTTPS)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2436487896921885, "y": 0.5543910977875381, "z": -0.7957925470720746, "word": "Firewalls: SOHO networks", "pos_group": "other", "row_number": 981, "definition": "Integrated firewall capabilities found in SOHO routers that provide essential protection for small home or office networks against internet-based threats.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router's web interface, check the firewall level (e.g., Low, Medium, High), and verify that there are no conflicting rules in the \u201cAccess Control\u201d or \u201cIP/MAC Filtering\u201d sections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2070309177393336, "y": 0.5816946151004575, "z": -0.7866190779933703, "word": "Firewalls: Windows Defender Firewall", "pos_group": "other", "row_number": 983, "definition": "The built-in, stateful firewall provided by the Windows operating system that filters traffic based on application permissions and network profile (Domain, Private, or Public).", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cWindows Defender Firewall\u201d via the Control Panel, click \u201cAllow an app or feature through Windows Defender Firewall\u201d, and ensure the application is checked for the appropriate network type."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.25338401530344945, "y": 0.5794859142942246, "z": -0.7745919028257964, "word": "Guest networks, security", "pos_group": "other", "row_number": 1016, "definition": "A segregated network segment (VLAN\u2014Virtual Local Area Network) on a router that allows visitors to access the internet while preventing them from accessing the private local network resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s web interface, enable the \u201cGuest Network\u201d feature, and ensure \u201cAP Isolation\u201d (or client isolation) is enabled to prevent guests from communicating with each other or the primary network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.22182974576959405, "y": 0.5539302774842526, "z": -0.8024667043423147, "word": "IDS (Intrusion Detection System)", "pos_group": "other", "row_number": 1098, "definition": "A security tool that monitors network traffic or system activity for suspicious patterns or policy violations and alerts administrators to potential security breaches.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the IDS log files, tune the detection rules to reduce noise, and ensure that the IDS signatures are up to date to properly identify modern threat vectors."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.22070885216655445, "y": 0.5948975829859666, "z": -0.772906506851105, "word": "Internet: Security appliances", "pos_group": "other", "row_number": 1157, "definition": "Dedicated computing hardware systems\u2014such as Unified Threat Management (UTM) gateways, next-generation network firewalls, and hardware proxy servers\u2014deployed at the network boundary line to scan, filter, and protect data traffic paths.", "details": [{"label": "TROUBLESHOOTING", "value": "Attach an administrative laptop link directly to the local hardware console serial management port line, check routing log files, update active security definitions tables, and monitor throughput trends."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2555615503557727, "y": 0.5598052863030618, "z": -0.7882298747236753, "word": "IP filtering, SOHO networks", "pos_group": "other", "row_number": 1175, "definition": "A security fea "value": "CORE 2"}]}, {"x": 0.23699976305382786, "y": 0.5483583493683081, "z": -0.8019565031786287, "word": "Netstat command", "pos_group": "other", "row_number": 1547, "definition": "A command-line utility that displays active TCP (Transmission Control Protocol) connections, listening ports, and ethernet statistics, allowing administrators to monitor network traffic.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cnetstat -ano\u201d in a terminal to display all connections with their associated PID (Process ID), identify the process blocking the port using Task Manager, and terminate that process if it is unauthorized."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.20649312222184976, "y": 0.5905869736851642, "z": -0.7801074393879801, "word": "Networks: Access", "pos_group": "other", "row_number": 1565, "definition": "The mechanisms and security configurations (such as user authentication, ACLs (Access Control Lists), and firewall rules) that control who or what can connect to a network segment and what resources they are authorized to interact with.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the permissions set on the shared resource, verify the user's membership in the appropriate security groups within Active Directory (AD), and ensure the network firewall is not blocking the specific ports required for the service."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2609211280244582, "y": 0.5718546054174641, "z": -0.7777547654712768, "word": "Networks: Firewalls", "pos_group": "other", "row_number": 1590, "definition": "A network security system that monitors and controls incoming and outgoing network traffic based on predetermined security rules.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the \u201cFirewall Logs\u201d to identify which rule is triggering the drop, temporarily disable the firewall to test if it is the source of the connectivity issue, and adjust the rule set to explicitly allow required traffic."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2108028654299697, "y": 0.5560878916432394, "z": -0.8039455259495455, "word": "Networks: Guest networks, security", "pos_group": "other", "row_number": 1591, "definition": "A segregated network segment that allows visitors to access the Internet while keeping them logically separated from the internal, trusted network resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that VLAN (Virtual Local Area Network) tagging is correctly configured on the switch, confirm that firewall rules specifically block traffic between the guest subnet and internal subnets, and consider implementing client isolation to prevent guest devices from seeing each other."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.22958240870445903, "y": 0.599170832572542, "z": -0.7669981949182058, "word": "Networks: Security", "pos_group": "other", "row_number": 1625, "definition": "The broad category of measures taken to protect the integrity, confidentiality, and availability of network resources, including physical and logical controls.", "details": [{"label": "TROUBLESHOOTING", "value": "Run regular security audits; update firmware and patches; enforce the principle of least privilege; use firewalls, VPNs (Virtual Private Networks), and IDS (Intrusion Detection System) to monitor and secure traffic."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.2533195928299383, "y": 0.5508061955314312, "z": -0.7952620441418443, "word": "Networks: VPN (Virtual Private Network)", "pos_group": "other", "row_number": 1651, "definition": "A secure, encrypted tunnel established over a public network (like the Internet) to allow remote users to access internal network resources as if they were locally connected.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for Internet connectivity; verify the VPN client credentials; ensure that necessary ports (e.g., 500/4500 for IPsec (Internet Protocol security)) are not blocked by the local firewall."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.19825848273549154, "y": 0.5787262752861052, "z": -0.7910559223701522, "word": "Online resources: Post exam/furthering education", "pos_group": "other", "row_number": 1685, "definition": "Career guidance, industry certifications (like Network+, Security+), and advanced training paths after achieving the A+ certification.", "details": [{"label": "TROUBLESHOOTING", "value": "Research the \u201cCompTIA Certification Pathway\u201d; sign up for vendor-specific training (e.g., Cisco, Microsoft, AWS (Amazon Web Services)); engage in local \u201cIT User Groups\u201d to network with other professionals."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2562521454628708, "y": 0.5868333974590048, "z": -0.7680894489396386, "word": "Ports/connectors: Forwarding", "pos_group": "other", "row_number": 1858, "definition": "A network address translation (NAT) rule configured on a gateway router that redirects inbound traffic from an external internet WAN (Wide Area Network) port to a specific internal IP address and local area network port.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the gateway router administrative console via its default gateway IP address, navigate to the \u201cPort Forwarding\u201d submenu, create a new rule mapping the external port target (e.g., TCP port 80) to the static internal IP address of the destination server, and click \u201cApply.\u201d"}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2262017075892917, "y": 0.54581310845626, "z": -0.8067966522742912, "word": "Protocols: SSH (Secure Shell)", "pos_group": "other", "row_number": 2002, "definition": "A network protocol that gives users, particularly system administrators, a secure way to access a computer over an unsecured network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the SSH service is running on the host, verify port 22 is open, and check that SSH keys are correctly placed in the \u201c.ssh\u201d directory
