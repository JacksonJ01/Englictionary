nstall the official Windows Debugging (WinDbg) software toolkit pack, open the crash file located at the path pathing location \u201cC:\\Windows\\Minidump\\\u201d, and execute the instruction query command \u201c!analyze -v\u201d to isolate the specific kernel driver source faulting execution."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.39886339964936796, "y": -0.32241319566125554, "z": 0.8584624159994692, "word": "Grinding noises, troubleshooting", "pos_group": "other", "row_number": 1009, "definition": "Audible physical symptoms originating from rotating components (like mechanical Hard Disk Drives (HDD) or cooling fans) indicating bearing failure or physical damage.", "details": [{"label": "TROUBLESHOOTING", "value": "If a hard drive is grinding, back up all data immediately and replace the drive. If a fan is grinding, clean dust out; if the noise persists, replace the fan to prevent overheating."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4432113346984681, "y": -0.3419654148066796, "z": 0.8286273999035382, "word": "Heating/cooling, troubleshooting", "pos_group": "other", "row_number": 1058, "definition": "The diagnostic process of addressing thermal instability within a computing system by monitoring temperatures and ensuring that internal air circulation is adequate.", "details": [{"label": "TROUBLESHOOTING", "value": "Monitor system temperatures using software tools like \u201cHWMonitor\u201d, ensure all case fans are spinning in the correct direction, verify that air intake vents are not blocked, and clean any accumulated debris from inside the chassis."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42792471853758646, "y": -0.2928855750870465, "z": 0.8550429668563198, "word": "Improper/spontaneous shutdowns, troubleshooting", "pos_group": "other", "row_number": 1112, "definition": "Situations where a computer restarts or turns off unexpectedly without user input, often caused by thermal issues, power supply failure, or OS instability.", "details": [{"label": "TROUBLESHOOTING", "value": "Check system temperatures, test the PSU (Power Supply Unit) with a multimeter to ensure stable voltages, check for OS updates, and disable the \"Automatically restart\" feature in \u201cSystem Properties\u201d to capture the BSOD error code for analysis."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40507536596021276, "y": -0.34618909113286683, "z": 0.8462074574670205, "word": "Intermittent shut downs/bootup failures, RAM, troubleshooting", "pos_group": "other", "row_number": 1150, "definition": "The mechanical and logical diagnosis tracking method utilized to isolate faulty or degraded random access memory modules that crash the system under high workload tasks.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the machine workstation, press the required keys to boot into an external evaluation application tool environment like MemTest86, execute deep cycle checks on each memory stick individually by isolating trace ports, and replace defective blocks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.45498722102281974, "y": -0.3169550574710666, "z": 0.8321815428435341, "word": "Logs: System logs", "pos_group": "other", "row_number": 1341, "definition": "The core Windows logging catalog that tracks system events, driver failures, device identification events, storage connectivity drops, and operating system kernel service initialization states.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Event Viewer console window by typing \"eventvwr.msc\", navigate straight to the \u201cSystem\u201d log data table, filter the entries list to capture \"Error\" or \"Critical\" flags, and parse through the driver identification lines to replace unstable software files."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.40382099952671074, "y": -0.3058176275842043, "z": 0.8622088952220438, "word": "Loose connections, troubleshooting", "pos_group": "other", "row_number": 1346, "definition": "The technical diagnostic practice of physically inspecting, reseating, and securing internal and external system connection lines (such as power lines, storage data ribbons, display interfaces, and memory chips) to resolve intermittent hardware failure points.", "details": [{"label": "TROUBLESHOOTING", "value": "Completely cut hardware electrical feeds, disassemble the device housing enclosure panels, pull out internal RAM (Random Access Memory) sticks, expansion cards, and storage ribbon attachments, clean connector pads using electronics safe tools, and firmly snap them back into motherboard slots."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4289841850820467, "y": -0.35251041222981633, "z": 0.8316904341274206, "word": "Maintenance", "pos_group": "other", "row_number": 1387, "definition": "The methodical practice of cleaning, calibrating, updating, and servicing physical computing components and software parameters to prevent equipment failures and sustain high operational availability.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish and strictly adhere to a scheduled maintenance checklist for each specific hardware tier (e.g., executing printhead alignment routines, purging temporary system update folders, or clearing dust accumulations using compressed air canisters)."}, {"label": "CORE", "value": "CORE 1 / CORE 2"}]}, {"x": 0.4439201860766326, "y": -0.2941485520215035, "z": 0.8464109508609519, "word": "Memory: Testing programs", "pos_group": "other", "row_number": 1442, "definition": "Software utilities designed to stress-test RAM modules by writing and reading data patterns to detect hardware faults, stuck bits, or addressing errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Download a reliable memory testing program like \u201cMemTest86\u201d; create a bootable USB drive containing the tool; boot the computer from the USB drive; run a full \u201cpass\u201d of the test; if the software reports any red errors, the hardware RAM module is likely defective and should be replaced."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3957488860100915, "y": -0.33339292393373565, "z": 0.8557055436846753, "word": "Memory: Troubleshooting", "pos_group": "other", "row_number": 1443, "definition": "The methodical process of identifying and resolving issues related to system memory, including physical module failure, incorrect configurations, and compatibility problems.", "details": [{"label": "TROUBLESHOOTING", "value": "Start with the simplest tasks: check for loose RAM sticks; ensure they are properly seated; test modules one by one; verify BIOS settings for correct voltage and timings; and use software diagnostic tools to rule out OS-level conflicts vs. actual physical hardware failure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.45235180529461505, "y": -0.3346378007096443, "z": 0.8266773170850371, "word": "Mobile devices: Troubleshooting", "pos_group": "other", "row_number": 1473, "definition": "The diagnostic process for resolving software or hardware issues on mobile hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow standard methodology: identify the problem, establish a theory of probable cause, test the theory, establish a plan of action, verify functionality, and document findings."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4172046759181427, "y": -0.2925254455974517, "z": 0.8604470478013447, "word": "MS OS (Microsoft Operating System): Device Manager", "pos_group": "other", "row_number": 1480, "definition": "A critical operating system administration and diagnostic component that inventories, displays, and controls all connected physical hardware devices and their active device driver software states.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the hardware management platform window by executing the command line command \u201cdevmgmt.msc\u201d, expand the specific hardware tier tree layout, right-click the malfunctioning component row item, choose \u201cUpdate driver\u201d to rewrite control files, or select \u201cProperties > Driver > Roll Back Driver\u201d to undo a problematic software update that caused hardware instability."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4116467852645385, "y": -0.35409340053570415, "z": 0.8397409052073337, "word": "MS OS (Microsoft Operating System): Event Viewer", "pos_group": "other", "row_number": 1482, "definition": "A system logging and diagnostic service database application that aggregates, categorizes, and displays critical operational alerts, warnings, system faults, and audit failure events recorded across application and operating system components.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the administrative application command line string \u201ceventvwr.msc\u201d from the Run box, navigate down the left-hand directory column tree past \u201cWindows Logs\u201d, open the \u201cSystem\u201d and \u201cApplication\u201d logging files, sort the columns by the \u201cLevel\u201d header to quickly group \u201cCritical\u201d or \u201cError\u201d metrics, and analyze the listed event identification number (Event ID) and source code description to locate the root cause."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.45591200481258953, "y": -0.305328444207607, "z": 0.8360136272965458, "word": "MS OS (Microsoft Operating System): System Information/msinfo32", "pos_group": "other", "row_number": 1492, "definition": "A read-only analytical documentation application tool that inventories, indexes, and presents comprehensive data logs regarding system hardware specifications, motherboard firmware versions, components, and software driver environment profiles.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the system architecture matrix diagnostic inventory file view by entering the application command syntax \u201cmsinfo32\u201d into an active terminal command prompt or Run window, select \u201cSystem Summary\u201d to quickly check processing variables and firmware numbers, use the file search option to look for specific component entries, or select \u201cFile > Export\u201d to output a complete configuration report text file for technical support analysis."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3955421009637632, "y": -0.31504625131324204, "z": 0.8627237714927333, "word": "msinfo32/System Information", "pos_group": "other", "row_number": 1498, "definition": "A read-only analytical documentation application tool that inventories, indexes, and presents comprehensive data logs regarding system hardware specifications, motherboard firmware versions, components, and software driver environment profiles.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the system architecture matrix diagnostic inventory file view by entering the application command syntax \u201cmsinfo32\u201d into an active terminal command prompt or Run window, select \u201cSystem Summary\u201d to quickly check processing variables and firmware numbers, use the file search option to look for specific component entries, or select \u201cFile > Export\u201d to output a complete configuration report text file for technical support analysis."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4402773075856959, "y": -0.3504209889745795, "z": 0.8266565326126493, "word": "Multifunction device/printers: troubleshooting", "pos_group": "other", "row_number": 1532, "definition": "The methodical process of diagnosing and fixing printer issues by isolating hardware failures, connectivity problems, driver conflicts, or software queue errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply the standard troubleshooting methodology: 1) Verify power and connectivity. 2) Print a hardware self-test page. 3) Check for physical jams or depleted consumables. 4) Clear and restart the Print Spooler. 5) Reinstall the driver."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4352768610075178, "y": -0.28772197386536325, "z": 0.8530827158174412, "word": "Online resources: Dump files", "pos_group": "other", "row_number": 1681, "definition": "Files created by the OS when a system crash (or \u201cBlue Screen of Death\u201d) occurs, containing the state of memory to help diagnose the cause of failure.", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the files in \u201cC:\\Windows\\Minidump\u201d; use \u201cWinDbg\u201d (Windows Debugger) or \u201cBlueScreenView\u201d to analyze the memory dump to identify the offending driver or process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3969920371009517, "y": -0.34502110450119167, "z": 0.8505044149957216, "word": "OS (Operating Systems): Compatibility", "pos_group": "other", "row_number": 1702, "definition": "The capability of software or hardware to function within a specific OS environment without errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cCompatibility Mode\u201d (right-click executable > Properties > Compatibility); run as Administrator; check the application vendor website for updates compatible with the current OS version."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.45913723563810294, "y": -0.32365275357112633, "z": 0.827310034966595, "word": "PC: Troubleshooting", "pos_group": "other", "row_number": 1763, "definition": "A systematic process of identifying, diagnosing, and resolving hardware or software issues affecting the operation of a Personal Computer (PC).", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the CompTIA troubleshooting methodology: 1) Identify the problem, 2) Establish a theory of probable cause, 3) Test the theory, 4) Establish a plan of action, 5) Verify full system functionality, 6) Document findings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4056053714545978, "y": -0.2969723459116581, "z": 0.8644603567607391, "word": "Performance: Troubleshooting", "pos_group": "other", "row_number": 1771, "definition": "The diagnostic process of investigating and rectifying system slowdowns or high resource utilization.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cTask Manager\u201d to identify high-resource processes, check for malware, clear temporary files, run disk cleanup, and ensure drivers (especially GPU/Chipset) are updated to the latest versions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4219074696604718, "y": -0.3585113036318015, "z": 0.8327446980995583, "word": "POST (Power-On Self-Test), BIOS firmware", "pos_group": "other", "row_number": 1864, "definition": "A built-in diagnostic program embedded within motherboard non-volatile memory that verifies the core hardware components (like RAM, CPU, and storage controllers) are operational before passing control to the bootstrap loader.", "details": [{"label": "TROUBLESHOOTING", "value": "Note the specific pattern of audio beeps or read the digital POST card diagnostic number, cross-reference the codes with the motherboard manual to identify the failing subsystem (such as a bad memory module), reseat the affected card or chip, and retest."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4522166018318241, "y": -0.29405465754413396, "z": 0.84204038110074, "word": "RAID: Troubleshooting", "pos_group": "other", "row_number": 2078, "definition": "The methodical process of identifying and resolving issues within a RAID array, ranging from physical drive failures and controller malfunctions to configuration errors and data corruption.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the RAID controller interface for status indicators, verify physical cable connections, test individual drives independently to rule out drive failure, and examine system logs for error codes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3904352981573525, "y": -0.32726826031344514, "z": 0.8604973932233557, "word": "RAM: Testing", "pos_group": "other", "row_number": 2092, "definition": "The process of using software tools (like 'Windows Memory Diagnostic') to identify faulty bits or modules in the system's memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the test tool; if it detects errors, replace the memory module that was identified as faulty."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4515015801328002, "y": -0.34350733564355157, "z": 0.8234980470509039, "word": "RAM: Troubleshooting", "pos_group": "other", "row_number": 2093, "definition": "The systematic analysis of memory-related issues, such as failed boots, application instability, or reporting of memory capacity errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Test modules individually, clean contacts, and verify compatibility in the BIOS."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4235323069144425, "y": -0.2854718041687643, "z": 0.8597245105406507, "word": "Remote-controlled computers, troubleshooting", "pos_group": "other", "row_number": 2130, "definition": "The process of diagnosing and resolving conflicts, software hangs, or security blockages on client machines accessed via remote links.", "details": [{"label": "TROUBLESHOOTING", "value": "Use out-of-band management or command-line shells to bypass frozen sessions, execute tasks directly, and ensure UAC settings allow remote administrative visibility."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4029326668588655, "y": -0.3552906615473646, "z": 0.8434535030428403, "word": "Screens: Switching, troubleshooting", "pos_group": "other", "row_number": 2228, "definition": "The process of diagnosing issues when a monitor or display fails to output the expected video signal from a computer, often involving input sources or connection cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the monitor\u2019s input source selection by using the physical \u201cMenu\u201d buttons on the display, swap the video cable (e.g., HDMI, VGA) with a known-good spare, and ensure the graphic adapter drivers are updated in the \u201cDevice Manager\u201d."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.46204715515295186, "y": -0.3104751239324017, "z": 0.8307331845028366, "word": "Shut downs (intermittent)/bootup failures, troubleshooting", "pos_group": "other", "row_number": 2373, "definition": "The methodical diagnostics of a catastrophic hardware environment failure state where a machine unexpectedly powers down mid-operation or fails to successfully complete the Power-On Self-Test (POST) cycle.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the chassis interior for dense dust accumulation clogging the processor heat sink fin structure, confirm that the Central Processing Unit (CPU) cooling fan spins fluidly, utilize a specialized multimeter or Power Supply Unit (PSU) tester to evaluate electrical output consistency across the motherboard lines, and evaluate system thermal trends within the UEFI configuration environment screens."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39504109031487233, "y": -0.3060633012588983, "z": 0.8661800001069879, "word": "Shutdowns, troubleshooting", "pos_group": "other", "row_number": 2376, "definition": "The diagnostic analytical review of software logs, error dump files, and system parameters to isolate why an operating system is closing its environment cycles improperly or throwing kernel exceptions.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows application interface by executing \u201ceventvwr.msc\u201d, navigate directly to the \u201cWindows Logs > System\u201d path ledger, filter for critical events listing Event ID \u201c6008\u201d or \u201c41\u201d (indicating improper un-graceful shutdowns), isolate problematic device driver files highlighted by the system log details, and update the associated hardware driver packages."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.43454095286309935, "y": -0.35821760170635014, "z": 0.8263499925047378, "word": "Sleep/suspend mode, troubleshooting", "pos_group": "other", "row_number": 2384, "definition": "The diagnostic evaluation of system conditions, firmware settings, and peripheral drivers when a computer fails to enter or successfully awaken from a low-power system state.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the Windows command utility framework box and execute the diagnostic instruction line \u201cpowercfg /devicequery wake_armed\u201d to verify which peripheral input components are authorized to wake the machine; update outdated graphics adapter and motherboard chipset driver structures, and verify that ACPI (Advanced Configuration and Power Interface) settings are fully enabled within the system BIOS."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.44393612279989075, "y": -0.2851144753891948, "z": 0.849488348829426, "word": "Slow performance, troubleshooting", "pos_group": "other", "row_number": 2386, "definition": "The technical practice of identifying and fixing software bottle-necks, resource saturation, or configuration errors that cause an operating system to run sluggishly.", "details": [{"label": "TROUBLESHOOTING", "value": "Initiate the Windows system monitoring tool by executing the keyboard shortcut sequence \u201cCtrl + Shift + Esc\u201d to launch Task Manager, review the active columns for CPU, Memory, and Disk utilization percentages to find processes consuming high resource percentages, right-click any non-responsive or looping application instances, and click \u201cEnd task\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3897678896893279, "y": -0.34077262254004853, "z": 0.8555436937376756, "word": "Stop errors/BSOD, troubleshooting", "pos_group": "other", "row_number": 2483, "definition": "A critical system failure alert in Windows that occurs when the kernel detects an error from which it cannot safely recover, usually caused by driver failures or hardware malfunctions.", "details": [{"label": "TROUBLESHOOTING", "value": "Write down the specific error code, search the error on the Microsoft knowledge base, check for outdated drivers in \u201cDevice Manager\u201d, and run a memory diagnostic test to ensure the RAM is not the source of the crash."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4607411259969619, "y": -0.3323227154406613, "z": 0.8229697610588113, "word": "Storage drives: Troubleshooting", "pos_group": "other", "row_number": 2507, "definition": "A systematic approach to diagnosing and resolving storage-related issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the \"divide and conquer\" method: check cables, verify BIOS settings, test the drive in a different system, and use OS-level tools like \u201cchkdsk\u201d or manufacturer utilities."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41025911681095406, "y": -0.28829292654283933, "z": 0.8652020836653487, "word": "System logs", "pos_group": "other", "row_number": 2538, "definition": "Recorded events generated by the OS or applications that track critical operations, errors, and warnings for diagnostic purposes.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cEvent Viewer\u201d by executing the command \u201ceventvwr\u201d, expand \u201cWindows Logs\u201d, and click \u201cSystem\u201d to review entries marked with \u201cError\u201d or \u201cCritical\u201d to pinpoint the cause of the failure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.41315847255029303, "y": -0.36231812865569263, "z": 0.8354792937035278, "word": "System scans, scheduling", "pos_group": "other", "row_number": 2545, "definition": "The automation of diagnostic or security scans (such as virus scans or disk integrity checks) to occur at specific intervals.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cTask Scheduler\u201d by executing the command \u201ctaskschd.msc\u201d, locate the task under the Library, and modify the \u201cTriggers\u201d tab to change the schedule to off-peak hours."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.46011549051629524, "y": -0.2970030734896567, "z": 0.8367095731044595, "word": "Testing: BIOS firmware", "pos_group": "other", "row_number": 2578, "definition": "The process of verifying that the BIOS/UEFI (Unified Extensible Firmware Interface) is functioning correctly and is up to date.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the manufacturer's website for firmware updates, and use the BIOS update utility to flash the firmware to the latest version."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38736011432080764, "y": -0.3188706633962967, "z": 0.865028116224309, "word": "Testing: Memory", "pos_group": "other", "row_number": 2580, "definition": "The process of checking the physical RAM modules for defects or errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the command \u201cmdsched.exe\u201d (Windows Memory Diagnostic tool) or use MemTest86 to scan the RAM for hardware errors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4477727420365112, "y": -0.3526838312439185, "z": 0.8216530208477393, "word": "Testing: POST", "pos_group": "other", "row_number": 2581, "definition": "A series of diagnostic tests performed by the BIOS/UEFI on hardware components (CPU, RAM, video) immediately after the computer is powered on.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the motherboard manual to decode the POST beep codes, which indicate which hardware component is failing the initialization test."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4318494250414943, "y": -0.2802243442694238, "z": 0.8573099736793584, "word": "Testing: RAM", "pos_group": "other", "row_number": 2584, "definition": "The act of verifying RAM integrity by either using software tests or the physical swap-and-test method.", "details": [{"label": "TROUBLESHOOTING", "value": "If software tests (like Windows Memory Diagnostic) fail, physically remove one RAM stick at a time to isolate which specific module is faulty."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3941657690671983, "y": -0.35354109651153237, "z": 0.8483171809960515, "word": "Testing: Video cards", "pos_group": "other", "row_number": 2587, "definition": "Stressing the graphics hardware to verify stability under high-graphical workloads.", "details": [{"label": "TROUBLESHOOTING", "value": "Run a GPU stress test (like FurMark) and monitor temperatures; ensure the GPU driver is updated, and check that the PCIe (Peripheral Component Interconnect Express) power cables are firmly connected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.466283803053532, "y": -0.31813996994221205, "z": 0.8254491956111553, "word": "Time drift, troubleshooting", "pos_group": "other", "row_number": 2618, "definition": "The technical diagnosis of an anomaly where a computer's internal hardware clock gradually falls out of synchronization with accurate atomic network time parameters, typically caused by a failing motherboard CMOS (Complementary Metal-Oxide-Semiconductor) backup battery or faulty network synchronization configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Command Prompt as an administrator and execute the instruction command line string \u201cw32tm /resync\u201d to force a manual time synchronization update with the network server; if the clock continues to drift backward every time the physical PC powers down, shut off the computer, strip off the case shell skin, pop the old CR2032 button cell battery out of the motherboard socket, and snap a brand new backup battery element in place."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.39737125783612637, "y": -0.29632310425893293, "z": 0.868497957008584, "word": "Tools", "pos_group": "other", "row_number": 2630, "definition": "Software utilities or physical hardware devices required to perform diagnostic, maintenance, or configuration tasks on computer systems and networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the specific category of the problem, research the appropriate industry-standard tool (e.g., \u201cping\u201d for network connectivity or \u201cchkdsk\u201d for file system health), and install or access the required tool through the OS (Operating System) utilities menu or the physical technician toolkit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42654757607911176, "y": -0.36461949777573355, "z": 0.8277135900677275, "word": "Troubleshooting", "pos_group": "other", "row_number": 2651, "definition": "The systematic process of identifying, analyzing, and resolving technical problems within hardware, software, or network systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply the CompTIA (Computing Technology Industry Association) 6-step methodology: 1. Identify the problem, 2. Establish a theory, 3. Test the theory, 4. Establish a plan of action, 5. Verify full system functionality, 6. Document findings and actions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4530844857873944, "y": -0.2853023696960668, "z": 0.8445809650853973, "word": "Troubleshooting: Applications", "pos_group": "other", "row_number": 2655, "definition": "The process of diagnosing failures in software programs, such as crashes, freezes, or inability to launch.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \u201cEvent Viewer\u201d for application-related errors, update the application to the latest version, run the \u201cSystem File Checker\u201d (command \u201csfc /scannow\u201d) to repair system files, or reinstall the application entirely."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3840733165014715, "y": -0.3338181189075496, "z": 0.8608444406747282, "word": "Troubleshooting: BSOD/stop errors", "pos_group": "other", "row_number": 2662, "definition": "A BSOD (Blue Screen of Death) is a critical system error screen displayed by the Windows OS (Operating System) when it encounters a condition it cannot recover from, usually related to hardware failure or driver conflicts.", "details": [{"label": "TROUBLESHOOTING", "value": "Note the specific stop code provided on the screen, search the Microsoft Knowledge Base for that code, update or roll back device drivers, run \u201cchkdsk\u201d to check for drive errors, and use \u201cSystem Restore\u201d to revert the system to a previous stable state."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.45961780435430244, "y": -0.34217407607237316, "z": 0.8195537661340763, "word": "Troubleshooting: CPU", "pos_group": "other", "row_number": 2667, "definition": "Diagnosing issues specifically related to the CPU (Central Processing Unit), which is the primary component executing instructions.", "details": [{"label": "TROUBLESHOOTING", "value": "Check BIOS/UEFI (Unified Extensible Firmware Interface) for correct CPU (Central Processing Unit) voltage and frequency settings, ensure the cooling assembly is functional, and run a CPU (Central Processing Unit) diagnostic stress test to detect internal hardware failures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41738552262780015, "y": -0.28057736022462115, "z": 0.8643296075167745, "word": "Troubleshooting: Crashes, applications", "pos_group": "other", "row_number": 2668, "definition": "Identifying why software programs suddenly stop responding or terminate unexpectedly in an OS (Operating System) environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \u201cEvent Viewer\u201d (specifically the Application logs) for the error code, reinstall the application, update the application to the latest version, or check for conflicting background software."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4035029580426799, "y": -0.3635358265566184, "z": 0.8396588983989889, "word": "Troubleshooting: Device issues", "pos_group": "other", "row_number": 2669, "definition": "Investigating hardware peripherals or internal components that are not recognized or functioning correctly by the OS (Operating System).", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDevice Manager\u201d, identify the problematic device, attempt to update the driver automatically, or manually download the driver from the manufacturer\u2019s website and perform a manual installation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4668791791325036, "y": -0.30278588139999985, "z": 0.8308697503925538, "word": "Troubleshooting: Grinding noises", "pos_group": "other", "row_number": 2673, "definition": "Identifying internal mechanical failures typically coming from spinning media devices, such as HDDs (Hard Disk Drives) or cooling fans.", "details": [{"label": "TROUBLESHOOTING", "value": "Power down the system immediately to prevent further damage, open the case to locate the source of the sound, and replace the failing mechanical component (usually a fan or HDD - Hard Disk Drive)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38685283809336707, "y": -0.30889913199949537, "z": 0.8688648962347745, "word": "Troubleshooting: Memory", "pos_group": "other", "row_number": 2688, "definition": "Diagnosing issues related to RAM (Random Access Memory) modules that cause system instability.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cWindows Memory Diagnostic\u201d tool or \u201cMemTest86\u201d to test modules for errors, reseat RAM (Random Access Memory) sticks, and replace faulty modules if errors are detected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4414110299967764, "y": -0.3613417913637088, "z": 0.8213333138326065, "word": "Troubleshooting: Mobile devices", "pos_group": "other", "row_number": 2690, "definition": "Diagnosing issues on smartphones and tablets, ranging from battery and app problems to network connectivity failures.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a soft reset, update the OS (Operating System) and apps, check battery health settings, and perform a factory reset if software-based troubleshooting fails."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4414662385837762, "y": -0.27730733056557916, "z": 0.8533511613663423, "word": "Troubleshooting: Monitors", "pos_group": "other", "row_number": 2691, "definition": "Diagnosing hardware failures related to desktop displays.", "details": [{"label": "TROUBLESHOOTING", "value": "Test the monitor with a different computer and cable, check the brightness/contrast settings on the monitor\u2019s OSD (On-Screen Display) menu, and ensure the power adapter is functional."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3861197532591085, "y": -0.34889101958893415, "z": 0.8539242311782228, "word": "Troubleshooting: PC", "pos_group": "other", "row_number": 2696, "definition": "A broad category covering the systematic repair of personal computers, including desktop and laptop hardware/software issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply the CompTIA (Computing Technology Industry Association) troubleshooting process: isolate the component (hardware vs. software), verify settings, and perform repairs systematically."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4681660033024958, "y": -0.3277338741905484, "z": 0.8206162934403759, "word": "Troubleshooting: Power button", "pos_group": "other", "row_number": 2699, "definition": "Diagnosing a faulty physical switch that signals the motherboard to start the power-on sequence.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the front panel connector on the motherboard to ensure the power switch cable is connected properly, and use a screwdriver to momentarily bridge the power pins on the motherboard to see if the system powers on (which confirms a faulty button)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4024362441951518, "y": -0.28664839612869847, "z": 0.8694123109060196, "word": "Troubleshooting: RAID (Redundant Array of Independent Disks)", "pos_group": "other", "row_number": 2703, "definition": "Diagnosing failures within a storage subsystem that utilizes multiple drives to provide data redundancy, performance improvement, or both.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the RAID controller utility in the BIOS/UEFI (Unified Extensible Firmware Interface) to identify the failed disk, replace the drive with one of equal or greater capacity, and trigger the 'rebuild' process to restore data parity."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41689240680118594, "y": -0.3689991461239244, "z": 0.8306866745719045, "word": "Troubleshooting: RAM (Random Access Memory)", "pos_group": "other", "row_number": 2704, "definition": "Resolving instability caused by physical memory modules failing to store temporary data correctly for the CPU (Central Processing Unit).", "details": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cWindows Memory Diagnostic\u201d tool or \u201cMemTest86\u201d, reseat the memory modules into their slots, ensure the RAM (Random Access Memory) speed and type match the motherboard requirements, and test each module individually to isolate a faulty stick."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.46194030367984895, "y": -0.28839281040864156, "z": 0.8387137430260544, "word": "Troubleshooting: Sleep/suspend mode", "pos_group": "other", "row_number": 2709, "definition": "Diagnosing failures related to the power-saving state where the computer stores the current session in RAM (Random Access Memory) and cuts power to non-essential components.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \u201cpowercfg -lastwake\u201d to identify the cause of the last wake, update NIC (Network Interface Card) or keyboard drivers to allow them to wake the system, and check BIOS/UEFI (Unified Extensible Firmware Interface) power settings."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.38046849162065605, "y": -0.32462365041684077, "z": 0.8659464258682215, "word": "Troubleshooting: Slow performance", "pos_group": "other", "row_number": 2710, "definition": "Identifying and resolving resource bottlenecks causing the OS (Operating System) to become unresponsive or lag during operations.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cTask Manager\u201d (Ctrl + Shift + Esc) to monitor resource usage, disable unnecessary \u201cStartup\u201d programs, check the drive for health issues, and scan for malware using antivirus software."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.45571918155679114, "y": -0.35241346564860243, "z": 0.817388999675644, "word": "Troubleshooting: Standby mode", "pos_group": "other", "row_number": 2711, "definition": "Addressing issues with the legacy low-power state where the system halts activity while waiting for a wake signal.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the ACPI (Advanced Configuration and Power Interface) settings in the BIOS/UEFI (Unified Extensible Firmware Interface) and ensure all chipset drivers are updated to handle state transitions correctly."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4264981928706047, "y": -0.27453099166857, "z": 0.8618190216580163, "word": "Troubleshooting: Storage drives", "pos_group": "other", "row_number": 2712, "definition": "Diagnosing issues with HDDs (Hard Disk Drives) or SSDs (Solid State Drives) that prevent data access or OS (Operating System) boot.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cchkdsk\u201d command to detect and repair file system errors, check the SATA (Serial Advanced Technology Attachment) or NVMe (Non-Volatile Memory Express) connection, and examine the SMART (Self-Monitoring, Analysis, and Reporting Technology) status for signs of drive failure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39370534796414114, "y": -0.3619146537067763, "z": 0.8449934215227589, "word": "Troubleshooting: Time drift", "pos_group": "other", "row_number": 2713, "definition": "Fixing discrepancies in the system clock that can cause network authentication and secure connection failures.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the CMOS (Complementary Metal-Oxide-Semiconductor) battery on the motherboard, and ensure the \u201cWindows Time\u201d service is set to sync with an external NTP (Network Time Protocol) server."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.47186568489931385, "y": -0.31106901986728663, "z": 0.824972023945847, "word": "Troubleshooting: USB controller resource warnings", "pos_group": "other", "row_number": 2715, "definition": "Resolving errors that occur when the USB (Universal Serial Bus) host controller is overloaded with too many high-bandwidth devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Unplug high-bandwidth devices (like webcams or external drives), move devices to different USB (Universal Serial Bus) ports to balance the load, or update the host controller drivers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38909815741502146, "y": -0.2980942922580276, "z": 0.8716320421022972, "word": "Troubleshooting: User profiles, slow profile loads", "pos_group": "other", "row_number": 2716, "definition": "Diagnosing issues where a user account takes a significant amount of time to load the desktop environment, often caused by roaming profile synchronization or registry corruption.", "details": [{"label": "TROUBLESHOOTING", "value": "Check \u201cEvent Viewer\u201d for \u201cUser Profile Service\u201d errors, clear the local \u201cAppData\u201d cache, and ensure the workstation is properly connected to the domain controller if using a centralized network."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.4327835763362377, "y": -0.3687230355861765, "z": 0.8226431176893971, "word": "Troubleshooting: Video", "pos_group": "other", "row_number": 2717, "definition": "Diagnosing graphical display problems, including corruption, driver errors, or hardware failure of the GPU (Graphics Processing Unit).", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a clean install of the latest GPU (Graphics Processing Unit) drivers, verify the card is seated correctly in the PCIe (Peripheral Component Interconnect Express) slot, and check for overheating."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.45165819997481094, "y": -0.27709980486532665, "z": 0.848068728664789, "word": "Turning on/off computers", "pos_group": "other", "row_number": 2724, "definition": "The standard procedure for initiating a system boot (POST - Power-On Self-Test) or performing a graceful shutdown to prevent data corruption.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify power connectivity, ensure the power switch is functioning, and if the OS (Operating System) is frozen, use the command \u201cshutdown /s /t 0\u201d to force a clean shutdown."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.37949588523484257, "y": -0.34153737229478826, "z": 0.8598459724949546, "word": "UEFI: Troubleshooting", "pos_group": "other", "row_number": 2738, "definition": "The systematic methodology used to isolate and resolve firmware-level configuration errors, device recognition failures, and hardware incompatibility issues within the UEFI environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Reset the firmware settings to their factory defaults by choosing \"Load Setup Defaults\" within the UEFI interface. If the settings consistently erase upon power loss, replace the CR2032 CMOS (Complementary Metal-Oxide-Semiconductor) coin-cell battery on the motherboard, or perform a clear-CMOS procedure by shorting the designated motherboard jumpers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.46738292392680364, "y": -0.33858930423397865, "z": 0.8166458751992701, "word": "Video: Troubleshooting", "pos_group": "other", "row_number": 2809, "definition": "The methodical technical diagnostic logic path applied to locate and resolve image distortion failures, color casting anomalies, hardware blackouts, and resolution configuration defects within a machine's visual processing layout.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the display screen over onto an alternate functional computer system to instantly isolate if the failure resides within the monitor hardware array or the host workstation. Use the native Windows key shortcut combination \u201cWin + Ctrl + Shift + B\u201d to instantly restart the graphic processing subsystem driver stack, or drop the resolution to base standards to check for display sync issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40999505363604966, "y": -0.27782578213666276, "z": 0.8687444335212309, "word": "Video cards: Analyzing", "pos_group": "other", "row_number": 2810, "definition": "The mechanical and software verification practice of reviewing operational metrics (such as thermal sensor numbers, core clock cycles, processing engine loads, and fan speeds) to determine the health profile of a graphics card.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch an authorized benchmarking hardware utility program (such as HWMonitor or MSI Afterburner) to capture active operational parameters. Run a controlled processing stress loop tool to review if internal temperatures scale past safety ceilings (typically 85 degrees Celsius), which indicates a requirement to clean out clogged radiator heat fins or reapply underlying thermal compound paste."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4062399570170387, "y": -0.3708636289799424, "z": 0.8351223060262623, "word": "Windows 10: Dump files", "pos_group": "other", "row_number": 2910, "definition": "System memory snapshot documents (such as MEMORY.DMP or minidump files) automatically generated by the Windows kernel when an unrecoverable system crash or Blue Screen of Death (BSOD) occurs, capturing the state of volatile memory to aid in diagnostics.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the system root path \u201cC:\\Windows\\Minidump\u201d to locate the raw debug data logs. Download and install the Microsoft WinDbg (Windows Debugger) utility tool, open the recent minidump log file .sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+'<br>subcluster: '+(info.pos_group||'other')+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
