<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 41, "radius": 285.0, "nodes": [{"x": 0.4247190613127152, "y": -0.5666915477327871, "z": -0.7060272010948758, "word": "Cabling: Coaxial cabling", "pos_group": "other", "row_number": 297, "definition": "A type of copper cable featuring a central conductor, an insulating layer, a metallic shield (to reduce Electromagnetic Interference, or EMI), and an outer jacket.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a multimeter to check for continuity in the center conductor and ensure the \"F-connector\" or \"BNC\" (Bayonet Neill-Concelman) connector is crimped correctly without stray wire strands touching the center pin."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.43046665698854586, "y": -0.5577689064520899, "z": -0.7096423776919932, "word": "Cabling: Direct burial cabling", "pos_group": "other", "row_number": 299, "definition": "Ruggedized network or power cabling specifically jacketed and shielded to be placed directly into an open trench underground without the need for additional conduit.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a \"TDR\" (Time Domain Reflectometer) test to locate a break in the cable length; if a break is detected, the segment must be excavated and replaced using a waterproof splice kit or an entirely new cable run."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.431673728394525, "y": -0.5700251846981084, "z": -0.6990916113241935, "word": "Cabling: EMI", "pos_group": "other", "row_number": 302, "definition": "Electromagnetic Interference is a disturbance generated by an external source that affects an electrical circuit by electromagnetic induction, electrostatic coupling, or conduction.", "details": [{"label": "TROUBLESHOOTING", "value": "Reroute data cables away from high-voltage power lines, electrical motors, or lights; use shielded cables like \"STP\" (Shielded Twisted Pair) to mitigate the noise."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4186420487785864, "y": -0.5631027876074467, "z": -0.7124984811093921, "word": "Cabling: Fiber optic cabling/connectivity", "pos_group": "other", "row_number": 303, "definition": "Networking cables that transmit data as pulses of light through strands of glass or plastic fiber, providing high-speed, long-distance data transmission immune to EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a fiber optic inspection scope to check the connector tips for dust or oils; clean them with a lint-free wipe and specialized fiber-cleaning solvent; use a \"Visual Fault Locator\" to check for light leakage indicating a break."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.43945559380480864, "y": -0.5574642682676705, "z": -0.704352447769193, "word": "Cabling: Managing", "pos_group": "other", "row_number": 307, "definition": "The process of organizing and securing cables to improve airflow, prevent trip hazards, and make future troubleshooting easier.", "details": [{"label": "TROUBLESHOOTING", "value": "Use cable ties, Velcro straps, or cable management sleeves to bundle cables together; route cables behind motherboard trays; label both ends of every cable."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.421733560487433, "y": -0.5757831501966697, "z": -0.7004388395200484, "word": "Cabling: Multimode cabling", "pos_group": "other", "row_number": 308, "definition": "A type of fiber optic cable designed to carry multiple light rays (modes) simultaneously, typically used for short-distance communication within a building.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable type (e.g., OM3 or OM4) matches the transceivers being used; if the distance is too long, convert to \"Single-mode\" cabling or use a signal repeater."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42491325675220026, "y": -0.5529253921714127, "z": -0.7167441907182284, "word": "Cabling: Plenum-rated cabling", "pos_group": "other", "row_number": 310, "definition": "Cable jacket material designed to be fire-resistant and produce minimal smoke, mandatory for use in \"Plenum\" spaces (the open space above drop ceilings or below raised floors used for HVAC air circulation).", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the cable jacket markings; if it does not say \"Plenum\" or \"CMP\" (Communications Multipurpose cable, Plenum), it must be removed and replaced with properly rated cabling to comply with safety regulations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.44080151840036785, "y": -0.5677048081416363, "z": -0.6952735232905093, "word": "Cabling: Signal attenuation", "pos_group": "other", "row_number": 316, "definition": "The gradual loss of signal intensity as it travels through a medium, typically caused by distance, poor cable quality, or external interference.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a signal repeater or switch to boost the signal; ensure cable runs do not exceed the standard 100-meter limit for UTP (Unshielded Twisted Pair) copper cabling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4119897090266819, "y": -0.570728697693909, "z": -0.7103050283397441, "word": "Cabling: Single-mode cabling", "pos_group": "other", "row_number": 317, "definition": "Fiber optic cable with a small core designed to carry a single ray of light (mode), allowing for extremely high speeds over very long distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the fiber type is compatible with the transceiver; check for signal loss using a power meter; re-terminate the fiber if light intensity is too low."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4390766885192464, "y": -0.5491823289169643, "z": -0.711062888361017, "word": "Cabling: STP cabling", "pos_group": "other", "row_number": 319, "definition": "Shielded Twisted Pair is a type of copper cabling that includes a foil or braided shield to reduce crosstalk and EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the RJ45 connector is a shielded version and that the shield drain wire is properly connected to the ground of the network device or patch panel."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42911024446762225, "y": -0.5792982099141796, "z": -0.6930209102784451, "word": "Cabling: Tools", "pos_group": "other", "row_number": 323, "definition": "Specialized instruments for cable installation, including wire strippers, punch-down tools, cable testers, and crimpers.", "details": [{"label": "TROUBLESHOOTING", "value": "Calibrate tools regularly; ensure the crimper is correct for the specific RJ45 or RJ11 connector; use a cable tester to verify every wire pair in the cable has a solid connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41455714753872097, "y": -0.5564569020132852, "z": -0.7200681131853681, "word": "Cabling: Twisted pair cabling", "pos_group": "other", "row_number": 324, "definition": "A type of copper cabling where pairs of insulated wires are twisted together to cancel out EMI from external sources and crosstalk from neighboring pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable category (Cat5e, Cat6, etc.) meets the network speed requirements; ensure the twists are maintained as close to the termination point as possible."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4478823638285995, "y": -0.5586328452166694, "z": -0.6980907766303995, "word": "Cabling: UTP cabling", "pos_group": "other", "row_number": 325, "definition": "Unshielded Twisted Pair is the most common copper network cable, containing no shielding, making it flexible but susceptible to EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "If EMI is present, replace with shielded cable (STP) or reroute the cable away from the source of the interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41248764716281006, "y": -0.5800861769330885, "z": -0.702391606064055, "word": "Coaxial cabling", "pos_group": "other", "row_number": 390, "definition": "A type of copper transmission cable featuring a central conductor shielded by an insulator, a metallic shield, and an outer jacket, primarily used for cable internet and television signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the F-connector for physical damage, ensure the connector is fully tightened, and test the cable with a continuity tester to check for breaks in the center conductor."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4306586212818205, "y": -0.5448451481597902, "z": -0.719497683416964, "word": "Connectivity: Multimode cabling", "pos_group": "other", "row_number": 487, "definition": "Fiber optic cabling designed to carry multiple light rays (modes) simultaneously over shorter distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable length does not exceed the manufacturer\u2019s specification (usually shorter than single-mode), and inspect connectors for cleanliness."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.44090040591997454, "y": -0.5755817918651532, "z": -0.6887034433868479, "word": "Connectivity: Plenum-rated cabling", "pos_group": "other", "row_number": 489, "definition": "Cabling with a fire-resistant jacket designed for use in plenum spaces (areas between floors or ceilings used for air circulation).", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the cable jacket label ('CMP'); if incorrect, replace with plenum-rated cabling for local building code compliance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40583831822675426, "y": -0.5663843982255321, "z": -0.7172893230110021, "word": "Connectivity: Single-mode cabling", "pos_group": "other", "row_number": 504, "definition": "Fiber optic cabling designed to carry a single ray of light (mode) over very long distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable is not bent, check for connector cleanliness, and verify the transceiver type matches the cable type."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4482236203413497, "y": -0.547609013860177, "z": -0.706554990150928, "word": "Connectivity: Twisted pair cabling", "pos_group": "other", "row_number": 512, "definition": "A type of cable where pairs of insulated copper wires are twisted together to reduce electromagnetic interference.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep cables away from fluorescent lights or motors, check for damage, and verify that the cable category meets the network speed requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4210441324957565, "y": -0.585826579540273, "z": -0.692480365927468, "word": "Connectivity: UTP cabling", "pos_group": "other", "row_number": 515, "definition": "The most common type of networking cable, consisting of twisted pairs without shielding against EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure cable runs do not exceed the 100-meter limit and keep cables away from major sources of interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41739747082022555, "y": -0.5477156974393358, "z": -0.7251116232218466, "word": "Cutters, cable", "pos_group": "other", "row_number": 591, "definition": "Tools specifically designed to cleanly cut through various types of communication cabling without crushing the internal wires.", "details": [{"label": "TROUBLESHOOTING", "value": "Use professional-grade cable cutters rather than household scissors to ensure a clean, flush cut that allows for proper termination."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4515370963145015, "y": -0.5650700591857362, "z": -0.6905143581879362, "word": "Direct burial cabling", "pos_group": "other", "row_number": 649, "definition": "Cabling specifically designed to be buried directly in the ground without the need for conduit.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable is rated for \u201cdirect burial\u201d; if it fails, test for continuity and look for signs of physical disturbance or moisture damage."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4037398108411363, "y": -0.578867142808398, "z": -0.7084539477755807, "word": "EMI: SOHO networks", "pos_group": "other", "row_number": 836, "definition": "The impact of electromagnetic noise within Small Office/Home Office (SOHO) environments, often caused by household appliances, microwaves, or poorly shielded power cabling, affecting network performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Reposition network routers away from high-noise appliances (like microwaves or cordless phones), switch Wi-Fi channels in the router interface to avoid frequency interference, and replace low-quality, unshielded Ethernet patch cables."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4400664900095934, "y": -0.5397972810388061, "z": -0.7176073994558225, "word": "EMI: UTP cabling", "pos_group": "other", "row_number": 837, "definition": "Unshielded Twisted Pair (UTP) cabling is common networking wire that relies on the twisting of internal wire pairs to cancel out crosstalk and some levels of Electromagnetic Interference (EMI).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable run adheres to maximum length limitations, verify that the cable is not bundled tightly with power lines, and replace damaged cables with certified category-rated (e.g., Cat6) cabling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4352723021052945, "y": -0.5842431847248597, "z": -0.6849802363006621, "word": "Managing: cabling", "pos_group": "other", "row_number": 1413, "definition": "The systematic installation, organization, bundling, labeling, and routing of data communication lines inside telecom closets and data centers to optimize signal integrity and keep airflow paths clear.", "details": [{"label": "TROUBLESHOOTING", "value": "Secure data bundles systematically using hook-and-loop fasteners rather than tight plastic zip-ties, separate horizontal copper pathways from electrical power distribution conduits to minimize electromagnetic interference (EMI), apply alphanumeric source-and-destination labels on both patch ends, and mount horizontal cable management brackets to clear up server rack pathing."}, {"label": "CORE", "value": "CORE 1 / CORE 2"}]}, {"x": 0.4045250576657968, "y": -0.5580447841511587, "z": -0.7245312254155583, "word": "Multimode cabling", "pos_group": "other", "row_number": 1534, "definition": "A type of optical fiber cabling with a relatively large core diameter (typically 50 or 62.5 microns) that allows multiple modes of light to propagate, making it ideal for short-range data transmission within buildings or campus environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable type (e.g., OM3 or OM4) matches the application requirements and the connected transceivers. Use a Fiber Optic Power Meter to test signal strength and ensure that the connections are free of dust or oils by cleaning the fiber tips with an approved fiber cleaning kit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.45578012196913853, "y": -0.5511073643453351, "z": -0.6989600513492421, "word": "Networks: Cabling tools", "pos_group": "other", "row_number": 1570, "definition": "Specialized hardware implements (such as crimpers, cable testers, punch-down tools, and tone generators) used to install, maintain, and verify the integrity of network cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a continuity tester to verify that each wire pin-out (T568A or T568B) is correctly mapped to the corresponding pin on the other end, and ensure the crimping tool is properly calibrated to fully seat the connector pins."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.41065821204793695, "y": -0.5887716169615487, "z": -0.6962096063241837, "word": "Networks: Coaxial cabling", "pos_group": "other", "row_number": 1572, "definition": "A type of copper cabling with a central conductor shielded by an insulator, a metal foil shield, and an outer jacket, primarily used for cable television and broadband Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Visually inspect the cable jacket for physical damage, ensure the center conductor is straight and not shorting against the shield, and use a cable tester to confirm the signal carries through the entire run."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4251832438136848, "y": -0.5393329060028035, "z": -0.7268694694941066, "word": "Networks: Multimode cabling", "pos_group": "other", "row_number": 1605, "definition": "A type of fiber optic cabling with a larger core diameter designed to carry multiple light rays (modes) simultaneously over shorter distances, commonly used for LAN (Local Area Network) backbones.", "details": [{"label": "TROUBLESHOOTING", "value": "Use an OTDR (Optical Time-Domain Reflectometer) to identify the location of signal attenuation; ensure the connectors are cleaned with fiber-optic cleaning supplies; verify the cable length is within the specifications (e.g., typically under 500 meters for 10 Gbps (Gigabits per second) speeds)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4501622898280307, "y": -0.5744647684239222, "z": -0.6836257328805241, "word": "Networks: Plenum-rated cabling", "pos_group": "other", "row_number": 1613, "definition": "Cabling with a special fire-resistant jacket designed to be run through the plenum space (the open space between the structural ceiling and the drop-down ceiling) used for HVAC (Heating, Ventilation, and Air Conditioning) air circulation.", "details": [{"label": "TROUBLESHOOTING", "value": "Visually inspect the cable jacket for the \u201cPlenum\u201d or \u201cCMP\u201d (Communications Multipurpose Cable, Plenum) rating; replace any non-rated cabling found in ceiling air-handling spaces with compliant plenum-rated cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3975868549685638, "y": -0.5729296911983764, "z": -0.7167121191242264, "word": "Networks: Single-mode cabling", "pos_group": "other", "row_number": 1628, "definition": "Fiber optic cabling with a tiny core diameter that carries a single ray of light (mode) over very long distances with minimal signal degradation.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for breaks in the fiber using an OTDR; verify that the correct laser/transceiver is being used; ensure the connectors are clean and undamaged."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4505705654234198, "y": -0.5388302437652536, "z": -0.7117921985930286, "word": "Networks: Twisted pair cabling", "pos_group": "other", "row_number": 1642, "definition": "A type of copper cabling where pairs of insulated wires are twisted together to reduce electromagnetic interference (EMI) and crosstalk from neighboring pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable is terminated to the correct standard (T568A or T568B); check for sharp bends or proximity to electrical power lines; replace damaged cables with UTP (Unshielded Twisted Pair) or STP (Shielded Twisted Pair) based on the environment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4254628155356183, "y": -0.5915025524068785, "z": -0.6849132230382565, "word": "Networks: UTP cabling", "pos_group": "other", "row_number": 1645, "definition": "Unshielded Twisted Pair (UTP) cabling is the most common type of networking cable, consisting of four pairs of copper wires twisted together without any external shielding.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable length (typically limited to 100 meters); ensure the cable is not bundled tightly with power cables; use a cable tester to ensure proper termination and continuity."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4083368213379253, "y": -0.5477542088144008, "z": -0.7302235048707685, "word": "Optical cabling/connectivity", "pos_group": "other", "row_number": 1692, "definition": "Cables that use light pulses through glass or plastic strands to transmit data, providing high bandwidth over long distances with immunity to EMI (Electromagnetic Interference).", "details": [{"label": "TRO
