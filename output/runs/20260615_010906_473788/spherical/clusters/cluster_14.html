rface) or NVMe (Non-Volatile Memory Express) standards, format target volumes, and restart the wizard."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7980360040228114, "y": -0.30783522949036213, "z": 0.5180501981158964, "word": "Bootups, OS: Multiboots", "pos_group": "other", "row_number": 263, "definition": "Advanced configuration topologies hosting three or more discrete operating system variants concurrently across local storage hardware arrays.", "details": [{"label": "TROUBLESHOOTING", "value": "Configure a unified manager application such as GRUB (Grand Unified Bootloader) to supervise all disk sectors, assigning distinct identifier values to each partition path."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.794244947403159, "y": -0.27784506383546115, "z": 0.540349039072729, "word": "Clean OS installations", "pos_group": "other", "row_number": 361, "definition": "An installation of an Operating System (OS) performed on a formatted drive, removing all previous data and settings to ensure a fresh, error-free environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Back up critical data, boot from installation media (USB/DVD), reformat the target partition, and proceed with the OS installation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8128533891038544, "y": -0.2870028045246744, "z": 0.5068518107073796, "word": "Command line: Dd command", "pos_group": "other", "row_number": 397, "definition": "A command-line utility used for low-level copying and converting of raw data, often used to create disk images or bootable USB drives.", "details": [{"label": "TROUBLESHOOTING", "value": "Double-check the 'if' (input file) and 'of' (output file) paths before executing, ensure the drive is unmounted, and monitor progress using the 'status=progress' flag."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7882611142180562, "y": -0.3057230245693445, "z": 0.534020456593079, "word": ".dmg files", "pos_group": "other", "row_number": 703, "definition cal setup optical disc medium (such as a DVD-ROM\u2014Digital Versatile Disc Read-Only Memory) into an optical drive slot.", "details": [{"label": "TROUBLESHOOTING", "value": "Eject the disc medium, inspect the surface face for physical scratches or dust build-up, clean the data surface gently with a micro-fiber wipe from the inner center out to the edge, and inspect the internal optical lens tool for dust blockages."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8191001984148168, "y": -0.27946511414268926, "z": 0.500973167878302, "word": "macOS (OS X): Boot Camp", "pos_group": "other", "row_number": 1356, "definition": "A native, built-in macOS multi-boot utility that allows users to non-destructively partition their storage drive and install Microsoft Windows operating systems natively on Intel-based Mac hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "To select an operating system at boot time, shut down the Mac completely, press the power button, and immediately hold down the \"Option\" (Alt) key until the startup manager GUI displays the available bootable drives."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7850054458559083, "y": -0.3164108700730266, "z": 0.53258859476729, "word": "macOS (OS X): .dmg files", "pos_group": "other", "row_number": 1359, "definition": "An Apple Disk Image file format that acts as a virtual, mountable physical storage volume used broadly to distribute software and raw files over the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Terminal\" application and execute the command \u201chdiutil verify [filename].dmg\u201d to see if the file is corrupted. If the verification fails, delete the file and clear the browser cache, then download a new copy over a stable connection."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.803574295093172, "y": -0.2588632416533262, "z": 0.5359647137510483, "word": "macOS (OS X): dual-booting", "pos_group": "other", "row_number": 1361, "definition": " oot sector to the system partition; if corruption is severe, the disk may need to be initialized as a GPT (GUID Partition Table) disk, which requires reformatting."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.8185451308039873, "y": -0.2633653625393997, "z": 0.5105120514263832, "word": "Multiboots", "pos_group": "other", "row_number": 1499, "definition": "The advanced system software layout state where two or more independent operating systems are deployed onto separate partition blocks of a single host computer, with a custom boot loader menu prompting the user to pick their target environment during system initialization.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot the machine host into the Windows operating system configuration, open an elevated terminal interface prompt, and execute the boot entry configuration command tool \u201cbcdedit /enum\u201d to verify active multi-boot entries. If paths are missing or broken, boot from an external live-linux patch drive tool, install and execute the \u201cboot-repair\u201d utility application to rewrite the GRUB (Grand Unified Bootloader) configuration blocks, and set the boot timeout value to \u201c30 seconds\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7930269539451524, "y": -0.3228944533734656, "z": 0.5165727657330805, "word": "Network boot (PXE) OS installations", "pos_group": "other", "row_number": 1549, "definition": "A process where a computer boots from the network interface card (NIC) using PXE (Preboot eXecution Environment) to download an OS image from a central deployment server, bypassing the need for local boot media.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the BIOS/UEFI boot order is set to prioritize \u201cNetwork Boot\u201d or \u201cPXE\u201d, check that the network cable is connected to a port with network access, and verify that the DHCP server is properly configured to provide the client with the IP address of the PXE boot server (TFTP (Trivial Fil
