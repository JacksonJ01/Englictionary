ts.", "details": []}, {"x": -0.7472882713867612, "y": -0.013564108573533377, "z": 0.6643615389277074, "word": "Water fox", "pos_group": "other", "row_number": 171233, "definition": "The carp; -- so called on account of its cunning.", "details": []}, {"x": -0.9305874833664343, "y": -0.06467175282668546, "z": 0.36031167090180516, "word": "Waterhorse", "pos_group": "noun", "row_number": 171261, "definition": "A pile of salted fish heaped up to drain.", "details": []}, {"x": -0.7546667536431706, "y": -0.2653568114162898, "z": 0.6000532089578872, "word": "Waterie", "pos_group": "noun", "row_number": 171264, "definition": "The pied wagtail; -- so called because it frequents ponds.", "details": []}, {"x": -0.8307692106405683, "y": 0.08177548326615915, "z": 0.5505772325371191, "word": "Water lizard", "pos_group": "other", "row_number": 171288, "definition": "Any aquatic lizard of the genus Varanus as the monitor of the Nile. See Monitor n. 3.", "details": []}, {"x": -0.8944796680832626, "y": -0.22948411369039934, "z": 0.3837227709550061, "word": "Water measurer", "pos_group": "other", "row_number": 171300, "definition": "Any one of numerous species of water; the skater. See Skater n. 2.", "details": []}, {"x": -0.7243632455258594, "y": -0.11762588829116098, "z": 0.6793099726450059, "word": "Water moccasin", "pos_group": "other", "row_number": 171307, "definition": "A venomous North American snake (Ancistrodon piscivorus) allied to the rattlesnake but destitute of a rattle. It lives in or about pools and ponds and feeds largely of fishes. Called also water snake water adder water viper.", "details": []}, {"x": -0.9115319613711159, "y": 0.02874853351040395, "z": 0.41022311638902975, "word": "Water monitor", "pos_group": "other", "row_number": 171310, "definition": "A very large lizard (Varanaus salvator) native of India. It frequents the borders of streams and swims actively. It becomes five or six feet long. Called also two-banded monitor and kabaragoya. The name is also applied to other aquatic monitors.", "details": []}, {"x": -0.8056161002475575, "y": -0.2990423429020454, "z": 0.5114258266587373, "word": "Water newt", "pos_group": "other", "row_number": 171315, "definition": "Any one of numerous species of aquatic salamanders; a triton.", "details": []}, {"x": -0.7745923210971577, "y": 0.03802196151544214, "z": 0.631316930344685, "word": "Water rail", "pos_group": "other", "row_number": 171361, "definition": "Any one of numerous species of rails of the genus Rallus as the common European species (Rallus aquaticus). See Illust. of Rail.", "details": []}, {"x": -0.9262838494583289, "y": -0.13124065133481594, "z": 0.3532338059555923, "word": "Water rattler", "pos_group": "other", "row_number": 171369, "definition": "The diamond rattlesnake (Crotalus adamanteus); -- so called from its preference for damp places near water.", "details": []}, {"x": -0.7335583852950499, "y": -0.218753259920686, "z": 0.6434587062410392, "word": "Water shrew", "pos_group": "other", "row_number": 171390, "definition": "Any one of several species of shrews having fringed feet and capable of swimming actively. The two common European species (Crossopus fodiens and C. ciliatus) are the best known. The most common American water shrew or marsh shrew (Neosorex palustris) is rarely seen owing to its nocturnal habits.", "details": []}, {"x": -0.866065366548512, "y": 0.0796453553549178, "z": 0.49354574077341673, "word": "Water snail", "pos_group": "other", "row_number": 171391, "definition": "Any aquatic pulmonate gastropod belonging to Planorbis Limnaea and allied genera; a pond snail.", "details": []}, {"x": -0.8633905697121332, "y": -0.2729421906616991, "z": 0.4243339306359449, "word": "Water snake", "pos_group": "other", "row_number": 171393, "definition": "A common North American colubrine snake (Tropidonotus sipedon) which lives chiefly in the water.", "details": []}, {"x": -0.7347681679004731, "y": -0.05137672476921442, "z": 0.67636984822815, "word": "Water snake", "pos_group": "other", "row_number": 171394, "definition": "Any species of snakes of the family Homalopsidae all of which are aquatic in their habits.", "details": []}, {"x": -0.9271408376979418, "y": -0.025476733650846538, "z": 0.3738459617479402, "word": "Water tupelo", "pos_group": "other", "row_number": 171429, "definition": "A species of large tupelo (Nyssa aquatica) growing in swamps in the southern of the United States. See Ogeechee lime.", "details": []}, {"x": -0.7720418384126355, "y": -0.28531320098124296, "z": 0.5679328984011007, "word": "Wattle", "pos_group": "noun", "row_number": 171462, "definition": "Barbel of a fish.", "details": []}, {"x": -0.8083564519025926, "y": 0.07203321129974216, "z": 0.5842696835685538, "word": "Weakfish", "pos_group": "noun", "row_number": 171633, "definition": "Any fish of the genus Cynoscion; a squeteague; -- so called from its tender mouth. See Squeteague.", "details": []}, {"x": -0.9099243869134497, "y": -0.19512140001429182, "z": 0.36601263551501206, "word": "Wedge-shell", "pos_group": "noun", "row_number": 171854, "definition": "Any one of numerous species of small marine bivalves belonging to Donax and allied genera in which the shell is wedge-shaped.", "details": []}, {"x": -0.7237699684759994, "y": -0.15853417874343156, "z": 0.6715831645465782, "word": "Weely", "pos_group": "other", "row_number": 171899, "definition": "A kind of trap or snare for fish made of twigs.", "details": []}, {"x": -0.8967245721643354, "y": 0.054743582879750466, "z": 0.4391903708076688, "word": "Weever", "pos_group": "noun", "row_number": 171933, "definition": "Any one of several species of edible marine fishes belonging to the genus Trachinus of the family Trachinidae. They have a broad spinose head with the eyes looking upward. The long dorsal fin is supported by numerous strong sharp spines which cause painful wounds.", "details": []}, {"x": -0.827817291897756, "y": -0.29643249419911094, "z": 0.4762838519391137, "word": "Well", "pos_group": "other", "row_number": 172056, "definition": "A compartment in the middle of the hold of a fishing vessel made tight at the sides but having holes perforated in the bottom to let in water for the preservation of fish alive while they are transported to market.", "details": []}, {"x": -0.7564256292966072, "y": 0.008199381148523806, "z": 0.6540283155124194, "word": "Welshman", "pos_group": "noun", "row_number": 172122, "definition": "A squirrel fish.", "details": []}, {"x": -0.9306381027419969, "y": -0.08983359891510365, "z": 0.35474307072969957, "word": "Welshman", "pos_group": "noun", "row_number": 172123, "definition": "The large-mouthed black bass. See Black bass.", "details": []}, {"x": -0.7450758013676042, "y": -0.24996495864439133, "z": 0.6183684740236439, "word": "Wenona", "pos_group": "noun", "row_number": 172178, "definition": "A sand snake (Charina plumbea) of Western North America of the family Erycidae.", "details": []}, {"x": -0.8444891282861279, "y": 0.08429160718986625, "z": 0.5288979458873754, "word": "Wentletrap", "pos_group": "noun", "row_number": 172181, "definition": "Any one of numerous species of elegant usually white marine shells of the genus Scalaria especially Scalaria pretiosa which was formerly highly valued; -- called also staircase shell. See Scalaria.", "details": []}, {"x": -0.8834610369695692, "y": -0.24854322192224412, "z": 0.39714337838262354, "word": "Whale", "pos_group": "noun", "row_number": 172284, "definition": "Any aquatic mammal of the order Cetacea especially any one of the large species some of which become nearly one hundred feet long. Whales are hunted chiefly for their oil and baleen or whalebone.", "details": []}, {"x": -0.726515282747928, "y": -0.09198193241339285, "z": 0.6809661284110954, "word": "Whaling", "pos_group": "noun", "row_number": 172291, "definition": "The hunting of whales.", "details": []}, {"x": -0.9190039556600954, "y": 0.01003822966812688, "z": 0.39412049353748063, "word": "Whelk", "pos_group": "noun", "row_number": 172408, "definition": "Any one numerous species of large marine gastropods belonging to Buccinum and allied genera; especially Buccinum undatum common on the coasts both of Europe and North America and much used as food in Europe.", "details": []}, {"x": -0.7920663267515543, "y": -0.29704814889184183, "z": 0.5332854125758837, "word": "Whilk", "pos_group": "noun", "row_number": 172573, "definition": "A kind of mollusk a whelk.", "details": []}, {"x": -0.7867277160128444, "y": 0.053845825137941644, "z": 0.614947256252459, "word": "Whimbrel", "pos_group": "noun", "row_number": 172582, "definition": "Any one of several species of small curlews especially the European species (Numenius phaeopus) called also Jack curlew half curlew stone curlew and tang whaup. See Illustration in Appendix.", "details": []}, {"x": -0.9215624987296747, "y": -0.1565265254538774, "z": 0.3552773673687296, "word": "Whipparee", "pos_group": "noun", "row_number": 172664, "definition": "A large sting ray (Rhinoptera bonasus or R. quadriloba) of the Atlantic coast of the United States. Its snout appears to be four-lobed when viewed in front whence it is also called cow-nosed ray.", "details": []}, {"x": -0.7280070885488998, "y": -0.1972369378462554, "z": 0.6565845485324695, "word": "Whirlpool", "pos_group": "noun", "row_number": 172718, "definition": "A sea monster of the whale kind.", "details": []}, {"x": -0.8786004001429313, "y": 0.07325201903162773, "z": 0.471906217988777, "word": "Whistlefish", "pos_group": "noun", "row_number": 172794, "definition": "A gossat or rockling; -- called also whistler three-bearded rockling sea loach and sorghe.", "details": []}, {"x": -0.8500787307751506, "y": -0.28498639500022116, "z": 0.44288701284694143, "word": "Whistler", "pos_group": "noun", "row_number": 172800, "definition": "The hoary or northern marmot (Arctomys pruinosus).", "details": []}, {"x": -0.7414879805083898, "y": -0.02716735322234032, "z": 0.6704159229019568, "word": "Whistler", "pos_group": "noun", "row_number": 172801, "definition": "The whistlefish.", "details": []}, {"x": -0.9301694184261496, "y": -0.049088207302997164, "z": 0.3638340293712733, "word": "Whitebait", "pos_group": "noun", "row_number": 172824, "definition": "The young of several species of herrings especially of the common herring esteemed a great delicacy by epicures in England.", "details": []}, {"x": -0.7604768605314893, "y": -0.27465480272038006, "z": 0.5884213489828517, "word": "Whitebait", "pos_group": "noun", "row_number": 172825, "definition": "A small translucent fish (Salanx Chinensis) abundant at certain seasons on the coasts of China and Japan and used in the same manner as the European whitebait.", "details": []}, {"x": -0.8220091934253823, "y": 0.07998021436139564, "z": 0.5638298069762344, "word": "Whitefish", "pos_group": "noun", "row_number": 172844, "definition": "Any one of several species of Coregonus a genus of excellent food fishes allied to the salmons. They inhabit the lakes of the colder parts of North America Asia and Europe. The largest and most important American species (C. clupeiformis) is abundant in the Great Lakes and in other lakes farther north. Called also lake whitefish and Oswego bass.", "details": []}, {"x": -0.9009795921079724, "y": -0.2174559927621173, "z": 0.37543130638879046, "word": "Whitefish", "pos_group": "noun", "row_number": 172846, "definition": "The beluga or white whale.", "details": []}, {"x": -0.7229304226710664, "y": -0.1334915804039534, "z": 0.6779023542796472, "word": "Whiting", "pos_group": "noun", "row_number": 172906, "definition": "A common European food fish (Melangus vulgaris) of the Codfish family; -- called also fittin.", "details": []}, {"x": -0.9065346860568632, "y": 0.04019679763901943, "z": 0.4202131369142953, "word": "Whiting", "pos_group": "noun", "row_number": 172907, "definition": "A North American fish (Merlucius vulgaris) allied to the preceding; -- called also silver hake.", "details": []}, {"x": -0.8138114703632319, "y": -0.2999778770383981, "z": 0.49771896085318074, "word": "Whiting", "pos_group": "noun", "row_number": 172908, "definition": "Any one of several species of North American marine sciaenoid food fishes belonging to genus Menticirrhus especially M. Americanus found from Maryland to Brazil and M. littoralis common from Virginia to Texas; -- called also silver whiting and surf whiting.", "details": []}, {"x": -0.7668949066035817, "y": 0.028029152135694197, "z": 0.6411603300704417, "word": "Whitling", "pos_group": "noun", "row_number": 172917, "definition": "A young full trout during its second season.", "details": []}, {"x": -0.9288305315597876, "y": -0.11548676849363251, "z": 0.35204637470830535, "word": "Wig", "pos_group": "noun", "row_number": 173139, "definition": "An old seal; -- so called by fishermen.", "details": []}, {"x": -0.7368934767086462, "y": -0.23191408917491949, "z": 0.6349833535033902, "word": "Windowpane", "pos_group": "noun", "row_number": 173396, "definition": "A thin spotted American turbot (Pleuronectes maculatus) remarkable for its translucency. It is not valued as a food fish. Called also spotted turbot daylight spotted sand flounder and water flounder.", "details": []}, {"x": -0.8579902559499306, "y": 0.08337715228323027, "z": 0.506853993939193, "word": "Wing", "pos_group": "noun", "row_number": 173437, "definition": "One of the large pectoral fins of the flying fishes.", "details": []}, {"x": -0.8713561911068913, "y": -0.26520212287324185, "z": 0.4128028854589275, "word": "Wing-footed", "pos_group": "adjective", "row_number": 173471, "definition": "Having the anterior lobes of the foot so modified as to form a pair of winglike swimming organs; -- said of the pteropod mollusks.", "details": []}, {"x": -0.7304884896604503, "y": -0.0664466201747627, "z": 0.6796847895465553, "word": "Wing-shell", "pos_group": "noun", "row_number": 173478, "definition": "Any one of various species of marine bivalve shells belonging to the genus Avicula in which the hinge border projects like a wing.", "details": []}, {"x": -0.9248764401320705, "y": -0.010912816263675417, "z": 0.3801111428645887, "word": "Wing-shell", "pos_group": "noun", "row_number": 173479, "definition": "Any marine gastropod shell of the genus Strombus. See Strombus.", "details": []}, {"x": -0.7790542215660093, "y": -0.2916402104224049, "z": 0.554995952710427, "word": "Wing-shell", "pos_group": "noun", "row_number": 173480, "definition": "Any pteropod shell.", "details": []}, {"x": -0.7996702188397148, "y": 0.06687586611109805, "z": 0.5967035776939276, "word": "Winkle", "pos_group": "noun", "row_number": 173498, "definition": "Any one of various marine spiral gastropods esp. in the United States either of two species of Fulgar (F. canaliculata and F. carica).", "details": []}, {"x": -0.9151129753351716, "y": -0.18110637305019855, "z": 0.36023426268722947, "word": "Winninish", "pos_group": "noun", "row_number": 173510, "definition": "The land-locked variety of the common salmon.", "details": []}, {"x": -0.7241976217237472, "y": -0.1739673096445333, "z": 0.6672879287569281, "word": "Witfish", "pos_group": "noun", "row_number": 173691, "definition": "The ladyfish (a).", "details": []}, {"x": -0.8902951120362993, "y": 0.06356629377358233, "z": 0.45092564772938315, "word": "Worm", "pos_group": "noun", "row_number": 174219, "definition": "Any helminth; an entozoon.", "details": []}, {"x": -0.8362641263327721, "y": -0.29392822335283647, "z": 0.4628914673284985, "word": "Worm", "pos_group": "noun", "row_number": 174220, "definition": "Any annelid.", "details": []}, {"x": -0.7497901060614847, "y": -0.004240555828830744, "z": 0.6616621604252204, "word": "Worm-shell", "pos_group": "noun", "row_number": 174249, "definition": "Any species of Vermetus.", "details": []}, {"x": -0.9313671677267108, "y": -0.0739112708766899, "z": 0.35650010226943507, "word": "Worrel", "pos_group": "noun", "row_number": 174259, "definition": "An Egyptian fork-tongued lizard about four feet long when full grown.", "details": []}, {"x": -0.7500296821317453, "y": -0.2609263529487753, "z": 0.6077605731356753, "word": "Wrack", "pos_group": "noun", "row_number": 174371, "definition": "Any marine vegetation cast up on the shore especially plants of the genera Fucus Laminaria and Zostera which are most abundant on northern shores.", "details": []}, {"x": -0.8358447462832823, "y": 0.08461086196704447, "z": 0.5424062703802649, "word": "Wrasse", "pos_group": "noun", "row_number": 174404, "definition": "Any one of numerous edible marine spiny-finned fishes of the genus Labrus of which several species are found in the Mediterranean and on the Atlantic coast of Europe. Many of the species are bright-colored.", "details": []}, {"x": -0.8906471447114633, "y": -0.2379700228834906, "z": 0.38745055404031736, "word": "Wreath-shell", "pos_group": "noun", "row_number": 174444, "definition": "A marine shell of the genus Turbo. See Turbo.", "details": []}, {"x": -0.7239549353958765, "y": -0.10781691426798608, "z": 0.6813697707659784, "word": "Wrymouth", "pos_group": "noun", "row_number": 174643, "definition": "Any one of several species of large elongated marine fishes of the genus Cryptacanthodes especially C. maculatus of the American coast. A whitish variety is called ghostfish.", "details": []}, {"x": -0.9149835634212066, "y": 0.02289655653225159, "z": 0.40284094425467254, "word": "Xanthidium", "pos_group": "noun", "row_number": 174688, "definition": "A genus of minute unicellular algae of the desmids. These algae have a rounded shape and are armed with glochidiate or branched aculei. Several species occur in ditches and others are found fossil in flint or hornstone.", "details": []}, {"x": -0.7999489633907075, "y": -0.3000942144966421, "z": 0.5196394118961494, "word": "Xenomi", "pos_group": "other", "row_number": 174732, "definition": "A suborder of soft-rayed fresh-water fishes of which the blackfish of Alaska (Dallia pectoralis) is the ty
