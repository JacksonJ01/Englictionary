stance and without an intermediate web as the kingfishers; gressorial.", "details": []}, {"x": -0.8413291654220733, "y": 0.07478440338846823, "z": 0.5353246943865269, "word": "Synentognathi", "pos_group": "other", "row_number": 154642, "definition": "An order of fishes resembling the Physoclisti without spines in the dorsal anal and ventral fins. It includes the true flying fishes.", "details": []}, {"x": -0.8854705561706138, "y": -0.2370861516727702, "z": 0.39966492320430114, "word": "Syngnathi", "pos_group": "other", "row_number": 154658, "definition": "A suborder of lophobranch fishes which have an elongated snout and lack the ventral and first dorsal fins. The pipefishes and sea horses are examples.", "details": []}, {"x": -0.7318792953313301, "y": -0.10004669108260984, "z": 0.6740499660030674, "word": "System", "pos_group": "noun", "row_number": 154795, "definition": "One of the stellate or irregular clusters of intimately united zooids which are imbedded in or scattered over the surface of the common tissue of many compound ascidians.", "details": []}, {"x": -0.9142513835614395, "y": 0.009804149300244697, "z": 0.4050287475136697, "word": "Tabulata", "pos_group": "other", "row_number": 154990, "definition": "An artificial group of stony corals including those which have transverse septa in the calicles. The genera Pocillopora and Favosites are examples.", "details": []}, {"x": -0.7988804704086407, "y": -0.2893118899598196, "z": 0.527341089170516, "word": "Tadpole", "pos_group": "noun", "row_number": 155074, "definition": "The young aquatic larva of any amphibian. In this stage it breathes by means of external or internal gills is at first destitute of legs and has a finlike tail. Called also polliwig polliwog porwiggle or purwiggy.", "details": []}, {"x": -0.7865975403833565, "y": 0.04199677260453731, "z": 0.6160361844515765, "word": "Taenioglossa", "pos_group": "other", "row_number": 155088, "definition": "An extensive division of gastropod mollusks in which the odontophore is long and narrow and usually bears seven rows of teeth. It includes a large number of families both marine and fresh-water.", "details": []}, {"x": -0.9201088913594032, "y": -0.14745868830423653, "z": 0.36284371743901517, "word": "Taeniosomi", "pos_group": "other", "row_number": 155095, "definition": "An order of fishes remarkable for their long and compressed form. The ribbon fishes are examples. See Ribbon fish under Ribbon.", "details": []}, {"x": -0.7354489153545992, "y": -0.199436140956078, "z": 0.647564760147038, "word": "Tahitian", "pos_group": "adjective", "row_number": 155135, "definition": "Of or pertaining to Tahiti an island in the Pacific Ocean.", "details": []}, {"x": -0.8742455419789115, "y": 0.06675586798717655, "z": 0.48087252616392834, "word": "Tailor", "pos_group": "noun", "row_number": 155175, "definition": "The mattowacca; -- called also tailor herring.", "details": []}, {"x": -0.8542282008737476, "y": -0.2738790838932389, "z": 0.4419099775268722, "word": "Tailor", "pos_group": "noun", "row_number": 155177, "definition": "The goldfish.", "details": []}, {"x": -0.7448897814229828, "y": -0.037726887050987465, "z": 0.666120030869109, "word": "Tang", "pos_group": "noun", "row_number": 155468, "definition": "A coarse blackish seaweed (Fuscus nodosus).", "details": []}, {"x": -0.9261704075998349, "y": -0.04529292835546355, "z": 0.37437538210643956, "word": "Tangle", "pos_group": "noun", "row_number": 155501, "definition": "Any large blackish seaweed especially the Laminaria saccharina. See Kelp.", "details": []}, {"x": -0.7681408101707732, "y": -0.27036682083130614, "z": 0.580397689471418, "word": "Tanglefish", "pos_group": "noun", "row_number": 155504, "definition": "The sea adder or great pipefish of Europe.", "details": []}, {"x": -0.8198713858063521, "y": 0.06918818091790081, "z": 0.5683519212224445, "word": "Tapayaxin", "pos_group": "noun", "row_number": 155578, "definition": "A Mexican spinous lizard (Phrynosoma orbiculare) having a head somewhat like that of a toad; -- called also horned toad.", "details": []}, {"x": -0.9016365450856253, "y": -0.20649913453319668, "z": 0.38001269452887715, "word": "Tardigrada", "pos_group": "adjective", "row_number": 155645, "definition": "An order of minute aquatic arachnids; -- called also bear animalcules sloth animalcules and water bears.", "details": []}, {"x": -0.7292660377511231, "y": -0.1395337028621482, "z": 0.6698517686386706, "word": "Tarente", "pos_group": "noun", "row_number": 155669, "definition": "A harmless lizard of the Gecko family (Platydactylus Mauritianicus) found in Southern Europe and adjacent countries especially among old walls and ruins.", "details": []}, {"x": -0.9017002636845115, "y": 0.03747983524482307, "z": 0.4307341365869478, "word": "Tarpum", "pos_group": "noun", "row_number": 155708, "definition": "A very large marine fish (Megapolis Atlanticus) of the Southern United States and the West Indies. It often becomes six or more feet in length and has large silvery scales. The scales are a staple article of trade and are used in fancywork. Called also tarpon sabalo savanilla silverfish and jewfish.", "details": []}, {"x": -0.8197735708859061, "y": -0.29060186292787793, "z": 0.49347933061053056, "word": "Taster", "pos_group": "noun", "row_number": 155867, "definition": "One of a peculiar kind of zooids situated on the polyp-stem of certain Siphonophora. They somewhat resemble the feeding zooids but are destitute of mouths. See Siphonophora.", "details": []}, {"x": -0.76810200432953, "y": 0.016244410439988293, "z": 0.6401214182281482, "word": "Tatou", "pos_group": "noun", "row_number": 155881, "definition": "The giant armadillo (Priodontes gigas) of tropical South America. It becomes nearly five feet long including the tail. It is noted for its burrowing powers feeds largely upon dead animals and sometimes invades human graves.", "details": []}, {"x": -0.9262552678762471, "y": -0.10815321651926249, "z": 0.36104578724593817, "word": "Tatusiid", "pos_group": "noun", "row_number": 155908, "definition": "Any armadillo of the family Tatusiidae of which the peba and mule armadillo are examples. Also used adjectively.", "details": []}, {"x": -0.7446512464796379, "y": -0.23161951614695697, "z": 0.625976773415892, "word": "Tau", "pos_group": "noun", "row_number": 155909, "definition": "The common American toadfish; -- so called from a marking resembling the Greek letter tau (/).", "details": []}, {"x": -0.8542897007275545, "y": 0.074937183200503, "z": 0.5143671119004398, "word": "Tautog", "pos_group": "noun", "row_number": 155943, "definition": "An edible labroid fish (Haitula onitis or Tautoga onitis) of the Atlantic coast of the United States. When adult it is nearly black more or less irregularly barred with greenish gray. Called also blackfish oyster fish salt-water chub and moll.", "details": []}, {"x": -0.8742234528787817, "y": -0.25372122371678735, "z": 0.4139551848598545, "word": "Tectibranchiata", "pos_group": "other", "row_number": 156154, "definition": "An order or suborder of gastropod Mollusca in which the gills are usually situated on one side of the back and protected by a fold of the mantle. When there is a shell it is usually thin and delicate and often rudimentary. The aplysias and the bubble shells are examples.", "details": []}, {"x": -0.7351259377762841, "y": -0.07561336910900371, "z": 0.673700581876344, "word": "Tectibranchiate", "pos_group": "adjective", "row_number": 156155, "definition": "Having the gills covered by the mantle; of or pertaining to the Tectibranchiata.", "details": []}, {"x": -0.9203357869090356, "y": -0.00954516038976269, "z": 0.39101269704148994, "word": "Tectibranchiate", "pos_group": "noun", "row_number": 156156, "definition": "A tectibranchiate mollusk.", "details": []}, {"x": -0.7862802606906816, "y": -0.2851641862762346, "z": 0.5481283960110138, "word": "Teguexin", "pos_group": "noun", "row_number": 156237, "definition": "A large South American lizard (Tejus teguexin). It becomes three or four feet long and is blackish above marked with yellowish spots of various sizes. It feeds upon fruits insects reptiles young birds and birds' eggs. The closely allied species Tejus rufescens is called red teguexin.", "details": []}, {"x": -0.7987186242206691, "y": 0.05528421719813432, "z": 0.59915959030281, "word": "Teleocephial", "pos_group": "other", "row_number": 156273, "definition": "An extensive order of bony fishes including most of the common market species as bass salmon cod perch etc.", "details": []}, {"x": -0.9144569806365407, "y": -0.171157821495578, "z": 0.36670619125669157, "word": "Teleosaur", "pos_group": "noun", "row_number": 156280, "definition": "Any one of several species of fossil suarians belonging to Teleosaurus and allied genera. These reptiles are related to the crocodiles but have biconcave vertebrae.", "details": []}, {"x": -0.7312823626540371, "y": -0.17772256609955556, "z": 0.6585140815275846, "word": "Teleosaurus", "pos_group": "noun", "row_number": 156281, "definition": "A genus of extinct crocodilian reptiles of the Jurassic period having a long and slender snout.", "details": []}, {"x": -0.8856673606757542, "y": 0.05848477958464151, "z": 0.46062224956093856, "word": "Teleostean", "pos_group": "noun", "row_number": 156284, "definition": "A teleostean fish.", "details": []}, {"x": -0.8411710943264981, "y": -0.28335118793652436, "z": 0.4605901587794971, "word": "Teleostei", "pos_group": "other", "row_number": 156285, "definition": "A subclass of fishes including all the ordinary bony fishes as distinguished from the ganoids.", "details": []}, {"x": -0.7523455234546762, "y": -0.015432207964360225, "z": 0.6585879290535578, "word": "Teleostomi", "pos_group": "other", "row_number": 156286, "definition": "An extensive division of fishes including the ordinary fishes (Teleostei) and the ganoids.", "details": []}, {"x": -0.9278570268949229, "y": -0.06865321729704799, "z": 0.3665625095348386, "word": "Tellina", "pos_group": "noun", "row_number": 156342, "definition": "A genus of marine bivalve mollusks having thin delicate and often handsomely colored shells.", "details": []}, {"x": -0.7578168652996641, "y": -0.2581634720451701, "z": 0.5992205106377563, "word": "Tench", "pos_group": "noun", "row_number": 156547, "definition": "A European fresh-water fish (Tinca tinca or T. vulgaris) allied to the carp. It is noted for its tenacity of life.", "details": []}, {"x": -0.8330343409759238, "y": 0.07460582108456619, "z": 0.5481676369643742, "word": "Ten-pounder", "pos_group": "noun", "row_number": 156651, "definition": "A large oceanic fish (Elops saurus) found in the tropical parts of all the oceans. It is used chiefly for bait.", "details": []}, {"x": -0.8921708465802133, "y": -0.22664869107178348, "z": 0.3907192743489788, "word": "Tentaculata", "pos_group": "other", "row_number": 156691, "definition": "A division of Ctenophora including those which have two long tentacles.", "details": []}, {"x": -0.7296826941622018, "y": -0.11518322788420968, "z": 0.6740148291056844, "word": "Tentaculiferous", "pos_group": "adjective", "row_number": 156695, "definition": "Producing or bearing tentacles.", "details": []}, {"x": -0.9101769745524317, "y": 0.021768444281728794, "z": 0.4136472045452927, "word": "Tentaculite", "pos_group": "noun", "row_number": 156697, "definition": "Any one of numerous species of small conical fossil shells found in Paleozoic rocks. They are supposed to be pteropods.", "details": []}, {"x": -0.8064757700123674, "y": -0.2917372535700358, "z": 0.5142822253027723, "word": "Terebra", "pos_group": "noun", "row_number": 156812, "definition": "A genus of marine gastropods having a long tapering spire. They belong to the Toxoglossa. Called also auger shell.", "details": []}, {"x": -0.7788589773940546, "y": 0.03368524036465275, "z": 0.6262938590743667, "word": "Terebratula", "pos_group": "noun", "row_number": 156821, "definition": "A genus of brachiopods which includes many living and some fossil species. The larger valve has a perforated beak through which projects a short peduncle for attachment. Called also lamp shell.", "details": []}, {"x": -0.9233133612674407, "y": -0.132693671226379, "z": 0.36039537527760573, "word": "Terebratuliform", "pos_group": "adjective", "row_number": 156823, "definition": "Having the general form of a terebratula shell.", "details": []}, {"x": -0.7378521030861148, "y": -0.21281985359055788, "z": 0.6405325783198627, "word": "Teredo", "pos_group": "noun", "row_number": 156827, "definition": "A genus of long slender wormlike bivalve mollusks which bore into submerged wood such as the piles of wharves bottoms of ships etc.; -- called also shipworm. See Shipworm. See Illust. in App.", "details": []}, {"x": -0.8668837390533055, "y": 0.07180574440060229, "z": 0.4933117858272151, "word": "Teretial", "pos_group": "adjective", "row_number": 156832, "definition": "Rounded; as the teretial tracts in the floor of the fourth ventricle of the brain of some fishes.", "details": []}, {"x": -0.8620709279253571, "y": -0.267859417348089, "z": 0.43021511800941614, "word": "Terrapin", "pos_group": "noun", "row_number": 156955, "definition": "Any one of numerous species of tortoises living in fresh and brackish waters. Many of them are valued for food.", "details": []}, {"x": -0.7400748732698451, "y": -0.05157765345515047, "z": 0.6705437551858067, "word": "Tessellata", "pos_group": "other", "row_number": 157045, "definition": "A division of Crinoidea including numerous fossil species in which the body is covered with tessellated plates.", "details": []}, {"x": -0.9248151543452885, "y": -0.030805763468546618, "z": 0.3791674237463185, "word": "Testacea", "pos_group": "other", "row_number": 157080, "definition": "Invertebrate animals covered with shells especially mollusks; shellfish.", "details": []}, {"x": -0.7743447771894835, "y": -0.2777995526842415, "z": 0.5685222727104051, "word": "Testaceography", "pos_group": "noun", "row_number": 157082, "definition": "The science which treats of testaceans or shellfish; the description of shellfish.", "details": []}, {"x": -0.8114649673319574, "y": 0.06573855612338922, "z": 0.5806918709881836, "word": "Testaceology", "pos_group": "noun", "row_number": 157083, "definition": "The science of testaceous mollusks; conchology.", "details": []}, {"x": -0.907217987489254, "y": -0.19389613108398493, "z": 0.37330927329308333, "word": "Testicardines", "pos_group": "other", "row_number": 157110, "definition": "A division of brachiopods including those which have a calcareous shell furnished with a hinge and hinge teeth. Terebratula and Spirifer are examples.", "details": []}, {"x": -0.7288314648945808, "y": -0.15459215168907425, "z": 0.6670127153328951, "word": "Testicond", "pos_group": "adjective", "row_number": 157112, "definition": "Having the testicles naturally concealed as in the case of the cetaceans.", "details": []}, {"x": -0.8961463338093845, "y": 0.04716264053420953, "z": 0.44124532149116347, "word": "Testudinal", "pos_group": "adjective", "row_number": 157148, "definition": "Of pertaining to or resembling a tortoise.", "details": []}, {"x": -0.8277886012713992, "y": -0.28974027470081076, "z": 0.4804337673617865, "word": "Testudinarious", "pos_group": "adjective", "row_number": 157149, "definition": "Of or pertaining to the shell of a tortoise; resembling a tortoise shell; having the color or markings of a tortoise shell.", "details": []}, {"x": -0.7612245418013668, "y": 0.005367045773349788, "z": 0.6484661839903187, "word": "Testudinata", "pos_group": "other", "row_number": 157150, "definition": "An order of reptiles which includes the turtles and tortoises. The body is covered by a shell consisting of an upper or dorsal shell called the carapace and a lower or ventral shell called the plastron each of which consists of several plates.", "details": []}, {"x": -0.9277699293386863, "y": -0.09289183236644655, "z": 0.36140568021891006, "word": "Testudineous", "pos_group": "adjective", "row_number": 157153, "definition": "Resembling the shell of a tortoise.", "details": []}, {"x": -0.7486855693082138, "y": -0.24316864387116177, "z": 0.6167162467030489, "word": "Testudo", "pos_group": "noun", "row_number": 157155, "definition": "A genus of tortoises which formerly included a large number of diverse forms but is now restricted to certain terrestrial species such as the European land tortoise (Testudo Graeca) and the gopher of the Southern United States.", "details": []}, {"x": -0.8462125960589135, "y": 0.07678457817512921, "z": 0.5272839565411613, "word": "Tetard", "pos_group": "noun", "row_number": 157170, "definition": "A gobioid fish (Eleotris gyrinus) of the Southern United States; -- called also sleeper.", "details": []}, {"x": -0.881489664088244, "y": -0.24481329339535327, "z": 0.4037851204322858, "word": "Tethys", "pos_group": "noun", "row_number": 157190, "definition": "A genus of a large naked mollusks having a very large broad fringed cephalic disk and branched dorsal gills. Some of the species become a foot long and are brilliantly colored.", "details": []}, {"x": -0.7318770605461402, "y": -0.09052061247589051, "z": 0.6753976509903857, "word": "Tetrabranchiata", "pos_group": "other", "row_number": 157195, "definition": "An order of Cephalopoda having four gills. Among living species it includes only the pearly nautilus. Numerous genera and species are found in the fossil state such as Ammonites Baculites Orthoceras etc.", "details": []}, {"x": -0.9172475792198804, "y": 0.0036109736356332895, "z": 0.39830119166865663, "word": "Tetrabranchiate", "pos_group": "noun", "row_number": 157197, "definition": "One of the Tetrabranchiata.", "details": []}, {"x": -0.7934738267299238, "y": -0.2895768900539594, "z": 0.5352985251625934, "word": "Tetracarpel", "pos_group": "adjective", "row_number": 157198, "definition": "Composed of four carpels.", "details": []}, {"x": -0.7905862984730476, "y": 0.04871167128547403, "z": 0.6104100898144307, "word": "Tetractinellid", "pos_group": "noun", "row_number": 157205, "definition": "Any species of sponge of the division Tetractinellida. Also used adjectively.", "details": []}, {"x": -0.9186443576953044, "y": -0.15696975454884107, "z": 0.3625645325062263, "word": "Tetractinellida", "pos_group": "other", "row_number": 157206, "definition": "A division of Spongiae in which the spicules are siliceous and have four branches diverging at right angles. Called also Tetractinellinae.", "details": []}, {"x": -0.7326299289427113, "y": -0.1919949246934479, "z": 0.652986474675667, "word": "Tetraspore", "pos_group": "noun", "row_number": 157279, "definition": "A nonsexual spore one of a group of four regularly occurring in red seaweeds.", "details": []}, {"x": -0.8788795593798208, "y": 0.06542251028075981, "z": 0.4725363639476815, "word": "Tetraxile", "pos_group": "adjective", "row_number": 157293, "definition": "Having four branches diverging at right angles; -- said of certain spicules of sponges.", "details": []}, {"x": -0.8492234185597803, "y": -0.2792271314867026, "z": 0.44816491876467496, "word": "Tetrodon", "pos_group": "noun", "row_number": 157301, "definition": "Any one of numerous species of plectognath fishes belonging to Tetrodon and allied genera. Each jaw is furnished with two large thick beaklike bony teeth.", "details": []}, {"x": -0.7466475005589229, "y": -0.028375549100543514, "z": 0.6646144281629429, "word": "Thalassian", "pos_group": "noun", "row_number": 157397, "definition": "Any sea tortoise.", "details": []}, {"x": -0.9275949156187613, "y": -0.053608233456900856, "z": 0.36972128667937604, "word": "Thalassinian", "pos_group": "noun", "row_number": 157399, "definition": "Any species of Thalaassinidae a family of burrowing macrurous Crustacea having a long and soft abdomen.", "details": []}, {"x": -0.7632921422577612, "y": -0.2673267504783669, "z": 0.5881509279481199, "word": "Thalassography", "pos_group": "noun", "row_number": 157400, "definition": "The study or science of the life of marine organisms.", "details": []}, {"x": -0.8246094348129167, "y": 0.0731506624822943, "z": 0.5609529932141581, "word": "Thaliacea", "pos_group": "other", "row_number": 157405, "definition": "A division of Tunicata comprising the free-swimming species such as Salpa and Doliolum.", "details": []}, {"x": -0.8985087459030631, "y": -0.21525634950362493, "z": 0.3825529212201602, "word": "Thalline", "pos_group": "adjective", "row_number": 157410, "definition": "Consisting of a thallus.", "details": []}, {"x": -0.7281511009423296, "y": -0.13045118212241494, "z": 0.672888150645661, "word": "Thalloid", "pos_group": "adjective", "row_number": 157415, "definition": "Resembling or consisting of thallus.", "details": []}, {"x": -0.9054846391334229, "y": 0.032971322644194175, "z": 0.4230962776679881, "word": "Theca", "pos_group": "noun", "row_number": 157516, "definition": "The more or less cuplike calicle of a coral.", "details": []}, {"x": -0.8143176180508003, "y": -0.29290818717493683, "z": 0.5010904217982651, "word": "Thecodontia", "pos_group": "other", "row_number": 157528, "definition": "A group of fossil saurians having biconcave vertebrae and the teeth implanted in sockets.", "details": []}, {"x": -0.7713752967881461, "y": 0.02428515403964143, "z": 0.6359169621878868, "word": "Thecophora", "pos_group": "other", "row_number": 157529, "definition": "A division of hydroids comprising those which have the hydranths in thecae and the gonophores in capsules. The campanularians and sertularians are examples. Called also Thecata. See Illust. under Hydroidea.", "details": []}, {"x": -0.9258956631333438, "y": -0.11757802851026505, "z": 0.35901619490282743, "word": "Thecosomata", "pos_group": "other", "row_number": 157530, "definition": "An order of Pteropoda comprising those species which have a shell. See Pteropoda.", "details": []}, {"x": -0.7409183555089742, "y": -0.22563184659042249, "z": 0.6325585034398582, "word": "Thelphusian", "pos_group": "noun", "row_number": 157546, "definition": "One of a tribe of fresh-water crabs which live in or on the banks of rivers in tropical countries.", "details": []}, {"x": -0.8591667378388541, "y": 0.07566159515738158, "z": 0.5060709827776951, "word": "Theriaca", "pos_group": "noun", "row_number": 157725, "definition": "Treacle; molasses.", "details": []}, {"x": -0.8697746475079355, "y": -0.26065062971261604, "z": 0.41899082541609817, "word": "Theriodontia", "pos_group": "other", "row_number": 157731, "definition": "An extinct order of reptiles found in the Permian and Triassic formations in South Africa. In some respects they resembled carnivorous mammals. Called also Theromorpha.", "details": []}, {"x": -0.7358206926792658, "y": -0.06598789865067889, "z": 0.673953637468241, "word": "Theropoda", "pos_group": "other", "row_number": 157787, "definition": "An order of carnivorous dinosaurs in which the feet are less birdlike and hence more like those of an ordinary quadruped than in the Ornithopoda. It includes the rapacious genera Megalosaurus Creosaurus and their allies.", "details": []}, {"x": -0.9227723216707555, "y": -0.016682979857975552, "z": 0.3849843120718321, "word": "Thoracic", "pos_group": "noun", "row_number": 158057, "definition": "One of a group of fishes having the ventral fins placed beneath the thorax or beneath the pectorial fins.", "details": []}, {"x": -0.7810023393391724, "y": -0.2841352441177069, "z": 0.5561497181487295, "word": "Thoracica", "pos_group": "other", "row_number": 158058, "definition": "A division of cirripeds including those which have six thoracic segments usually bearing six pairs of cirri. The common barnacles are examples.", "details": []}, {"x": -0.8030777315293214, "y": 0.06103534681638254, "z": 0.5927401146883203, "word": "Thoracostraca", "pos_group": "adjective", "row_number": 158061, "definition": "An extensive division of Crustacea having a dorsal shield or carapec/ //niting all or nearly all of the thoracic somites to the head. It includes the crabs lobsters shrimps and similar species.", "details": []}, {"x": -0.9123177830898612, "y": -0.18054165526758145, "z": 0.3675336357005205, "word": "Thornback", "pos_group": "noun", "row_number": 158078, "definition": "The large European spider crab or king crab (Maia squinado).", "details": []}, {"x": -0.7290884775585901, "y": -0.1695050095663847, "z": 0.6630973108248872, "word": "Thresher", "pos_group": "noun", "row_number": 158176, "definition": "A large and voracious shark (Alopias vulpes) remarkable for the great length of the upper lobe of its tail with which it beats or thrashes its prey. It is found both upon the American and the European coasts. Called also fox shark sea ape sea fox slasher swingle-tail and thrasher shark.", "details": []}, {"x": -0.89005457235343, "y": 0.05587894360387113, "z": 0.45241618217573537, "word": "Threadfin", "pos_group": "noun", "row_number": 158202, "definition": "Any one of several species of fishes belonging to Polynemus and allied genera. They have numerous long pectoral filaments.", "details": []}, {"x": -0.8359054618148285, "y": -0.2875988733893575, "z": 0.467492189168237, "word": "Threadfish", "pos_group": "noun", "row_number": 158203, "definition": "The cutlass fish.", "details": []}, {"x": -0.7547352859363878, "y": -0.006431158615095344, "z": 0.6559979331990203, "word": "Threadfish", "pos_group": "noun", "row_number": 158204, "definition": "A carangoid fish (Caranx gallus or C. crinitus) having the anterior rays of the soft dorsal and anal fins prolonged in the form of long threads.", "details": []}, {"x": -0.9286105475011397, "y": -0.07755257593397147, "z": 0.3628609224422484, "word": "Thunderfish", "pos_group": "noun", "row_number": 158542, "definition": "A large European loach (Misgurnus fossilis).", "details": []}, {"x": -0.7533261002073248, "y": -0.25391153624254376, "z": 0.6066537055927169, "word": "Thunderworm", "pos_group": "noun", "row_number": 158560, "definition": "A small footless burrowing snakelike lizard (Rhineura Floridana) allied to Amphisbaena native of Florida; -- so called because it leaves its burrows after a thundershower.", "details": []}, {"x": -0.8379160428391697, "y": 0.07736490144844681, "z": 0.5402882352750417, "word": "Tilefish", "pos_group": "noun", "row_number": 158882, "definition": "A large edible deep-water food fish (Lopholatilus chamaeleonticeps) more or less thickly covered with large round yellow spots.", "details": []}, {"x": -0.888473525212683, "y": -0.23484309768287112, "z": 0.394288618231444, "word": "Tillodontia", "pos_group": "other", "row_number": 158925, "definition": "An extinct group of Mammalia found fossil in the Eocene formation. The species are related to the carnivores ungulates and rodents. Called also Tillodonta.", "details": []}, {"x": -0.7292645333535465, "y": -0.1057271654018736, "z": 0.6760140582034658, "word": "Tippet", "pos_group": "noun", "row_number": 159204, "definition": "A length of twisted hair or gut in a fish line.", "details": []}, {"x": -0.9135036451392488, "y": 0.016145899162706992, "z": 0.40651002479340337, "word": "Titling", "pos_group": "noun", "row_number": 159352, "definition": "Stockfish; -- formerly so called in customhouses.", "details": []}, {"x": -0.8009983608209896, "y": -0.2927740117948674, "z": 0.5221924970541291, "word": "Toad", "pos_group": "noun", "row_number": 159407, "definition": "Any one of numerous species of batrachians belonging to the genus Bufo and allied genera especially those of the family Bufonidae. Toads are generally terrestrial in their habits except during the breeding season when they seek the water. Most of the species burrow beneath the earth in the daytime and come forth to feed on insects at night. Most toads have a rough warty skin in which are glands that secrete an acrid fluid.", "details": []}, {"x": -0.7826221547376752, "y": 0.04096761374461216, "z": 0.6211475006291428, "word": "Toadfish", "pos_group": "noun", "row_number": 159409, "definition": "Any marine fish of the genus Batrachus having a large thick head and a wide mouth and bearing some resemblance to a toad. The American species (Batrachus tau) is very common in shallow water. Called also oyster fish and sapo.", "details": []}, {"x": -0.9222529951227716, "y": -0.14226984440223314, "z": 0.3594561229981225, "word": "Toadfish", "pos_group": "noun", "row_number": 159411, "definition": "A swellfish.", "details": []}, {"x": -0.7346632355550279, "y": -0.20585036236669857, "z": 0.6464484191622071, "word": "Tobias fish", "pos_group": "other", "row_number": 159445, "definition": "The lant or sand eel.", "details": []}, {"x": -0.8716596715261692, "y": 0.07123326030267728, "z": 0.4849074547390894, "word": "Tody", "pos_group": "noun", "row_number": 159477, "definition": "Any one of several species of small insectivorous West Indian birds of the genus Todus. They are allied to the kingfishers.", "details": []}, {"x": -0.8572274564474878, "y": -0.2738579894436493, "z": 0.43607670143043936, "word": "Tomaley", "pos_group": "noun", "row_number": 159628, "definition": "The liver of the lobster which becomes green when boiled; -- called also tomalline.", "details": []}, {"x": -0.7414533120680575, "y": -0.042027980231797914, "z": 0.6696869678446365, "word": "Tomcod", "pos_group": "noun", "row_number": 159644, "definition": "A small edible American fish (Microgadus tomcod) of the Codfish family very abundant in autumn on the Atlantic coast of the Northen United States; -- called also frostfish. See Illust. under Frostfish.", "details": []}, {"x": -0.9266383862358423, "y": -0.03876294849377399, "z": 0.3739501771336698, "word": "Tomcod", "pos_group": "noun", "row_number": 159645, "definition": "The kingfish. See Kingfish (a).", "details": []}, {"x": -0.769288013016231, "y": -0.275486221454633, "z": 0.5764575394755354, "word": "Tomopteris", "pos_group": "noun", "row_number": 159662, "definition": "A genus of transparent marine annelids which swim actively at the surface of the sea. They have deeply divided or forked finlike organs (parapodia). This genus is the type of the order or suborder Gymnocopa.", "details": []}, {"x": -0.8161117338499124, "y": 0.07041469335668489, "z": 0.5735881874934088, "word": "Tongo", "pos_group": "noun", "row_number": 159708, "definition": "The mangrove; -- so called in the Pacific Islands.", "details": []}, {"x": -0.9044336370470801, "y": -0.20297911473329602, "z": 0.37523229493192345, "word": "Tongue", "pos_group": "noun", "row_number": 159717, "definition": "The lingual ribbon or odontophore of a mollusk.", "details": []}, {"x": -0.7273018644425794, "y": -0.14574309629632598, "z": 0.6706645568839223, "word": "Tonguefish", "pos_group": "noun", "row_number": 159739, "definition": "A flounder (Symphurus plagiusa) native of the southern coast of the United States.", "details": []}, {"x": -0.9001994219411796, "y": 0.043324308346307745, "z": 0.4333174414249674, "word": "Tongue-shell", "pos_group": "noun", "row_number": 159746, "definition": "Any species of Lingula.", "details": []}, {"x": -0.8223517229582279, "y": -0.292801690344837, "z": 0.48785737042586563, "word": "Tongueworm", "pos_group": "noun", "row_number": 159752, "definition": "Any species of Linguatulina.", "details": []}, {"x": -0.7642015184553578, "y": 0.013851093438833355, "z": 0.6448288039480512, "word": "Tooth", "pos_group": "noun", "row_number": 159836, "definition": "Any hard calcareous or chitinous organ found in the mouth of various invertebrates and used in feeding or procuring food; as the teeth of a mollusk or a starfish.", "details": []}, {"x": -0.9278289576083342, "y": -0.10221526474475594, "z": 0.3587275638651026, "word": "Toothshell", "pos_group": "noun", "row_number": 159857, "definition": "Any species of Dentalium and allied genera having a tooth-shaped shell. See Dentalium.", "details": []}, {"x": -0.744632220330476, "y": -0.23777406127090708, "z": 0.6236877040895102, "word": "Tope", "pos_group": "noun", "row_number": 159907, "definition": "A small shark or dogfish (Galeorhinus / Galeus galeus) native of Europe but found also on the coasts of California and Tasmania; -- called also toper oil shark miller's dog and penny dog.", "details": []}, {"x": -0.8511441751020887, "y": 0.07828233279170192, "z": 0.5190621056891693, "word": "Topknot", "pos_group": "noun", "row_number": 159941, "definition": "A small Europen flounder (Rhoumbus punctatus). The name is also applied to allied species.", "details": []}, {"x": -0.8772816088935913, "y": -0.2522902103252676, "z": 0.4083217217723105, "word": "Top-shell", "pos_group": "noun", "row_number": 159974, "definition": "Any one of numerous species of marine top-shaped shells of the genus Trochus or family Trochidae.", "details": []}, {"x": -0.7321627619572196, "y": -0.08086123159621446, "z": 0.6763129092571863, "word": "Torpedo", "pos_group": "noun", "row_number": 160050, "definition": "Any one of numerous species of elasmobranch fishes belonging to Torpedo and allied genera. They are related to the rays but have the power of giving electrical shocks. Called also crampfish and numbfish. See Electrical fish under Electrical.", "details": []}, {"x": -0.9200472865422513, "y": -0.0030292401504891766, "z": 0.3917956281409368, "word": "Torqued", "pos_group": "adjective", "row_number": 160080, "definition": "Twisted; bent; -- said of a dolphin haurient which forms a figure like the letter S.", "details": []}, {"x": -0.7880700331940953, "y": -0.28931595201138144, "z": 0.5433616684062332, "word": "Torsk", "pos_group": "noun", "row_number": 160109, "definition": "The codfish. Called also tusk.", "details": []}, {"x": -0.7947684017972622, "y": 0.055097788608007556, "z": 0.6044066687215924, "word": "Tortoise", "pos_group": "noun", "row_number": 160128, "definition": "Any one of numerous species of reptiles of the order Testudinata.", "details": []}, {"x": -0.9168927990317469, "y": -0.16652203696963055, "z": 0.36273682786176237, "word": "Torus", "pos_group": "noun", "row_number": 160162, "definition": "One of the ventral parapodia of tubicolous annelids. It usually has the form of an oblong thickening or elevation of the integument with rows of uncini or hooks along the center. See Illust. under Tubicolae.", "details": []}, {"x": -0.7300419494884693, "y": -0.1841641934245754, "z": 0.6581202791643413, "word": "Toxoglossa", "pos_group": "other", "row_number": 160456, "definition": "A division of marine gastropod mollusks in which the radula are converted into poison fangs. The cone shells (Conus) Pleurotoma and Terebra are examples. See Illust. of Cone n. 4 Pleurotoma and Terebra.", "details": []}, {"x": -0.883460936352734, "y": 0.06355569263159237, "z": 0.46417394139790835, "word": "Toxotes", "pos_group": "noun", "row_number": 160458, "definition": "A genus of fishes comprising the archer fishes. See Archer fish.", "details": []}, {"x": -0.8440662454207594, "y": -0.28417803272902914, "z": 0.4547472034609572, "word": "Trachelipod", "pos_group": "noun", "row_number": 160524, "definition": "One of the Trachelipoda.", "details": []}, {"x": -0.7486836734414676, "y": -0.019076578189064268, "z": 0.6626528814445665, "word": "Trachelipoda", "pos_group": "other", "row_number": 160525, "definition": "An extensive artificial group of gastropods comprising all those which have a spiral shell and the foot attached to the base of the neck.", "details": []}, {"x": -0.9287621339476717, "y": -0.06224365902527489, "z": 0.3654129519545144, "word": "Trachelobranchiate", "pos_group": "adjective", "row_number": 160527, "definition": "Having the gills situated upon the neck; -- said of certain mollusks.", "details": []}, {"x": -0.7585454933242307, "y": -0.26376224235946477, "z": 0.5958508320569893, "word": "Trachinoid", "pos_group": "adjective", "row_number": 160538, "definition": "Of pertaining to or like Trachinus a genus of fishes which includes the weevers. See Weever.", "details": []}, {"x": -0.8294553647070638, "y": 0.07665963129628932, "z": 0.5532875372608613, "word": "Trachystomata", "pos_group": "other", "row_number": 160543, "definition": "An order of tailed aquatic amphibians including Siren and Pseudobranchus. They have anterior legs only are eel-like in form and have no teeth except a small patch on the palate. The external gills are persistent through life.", "details": []}, {"x": -0.8951207952274929, "y": -0.22386929573854986, "z": 0.38554027075887465, "word": "Trawlerman", "pos_group": "noun", "row_number": 161443, "definition": "A fisherman who used unlawful arts and engines to catch fish.", "details": []}, {"x": -0.7273130137056258, "y": -0.12112798677146422, "z": 0.6755322278878573, "word": "Tren", "pos_group": "noun", "row_number": 161624, "definition": "A fish spear.", "details": []}, {"x": -0.9091218748726846, "y": 0.027963371920132988, "z": 0.41559050333090075, "word": "Trepang", "pos_group": "noun", "row_number": 161672, "definition": "Any one of several species of large holothurians some of which are dried and extensively used as food in China; -- called also beche de mer sea cucumber and sea slug.", "details": []}, {"x": -0.8088028123098153, "y": -0.29471867676082936, "z": 0.5088997075731908, "word": "Triangulares", "pos_group": "other", "row_number": 161768, "definition": "The triangular or maioid crabs. See Illust. under Maioid and Illust. of Spider crab under Spider.", "details": []}, {"x": -0.774883589597331, "y": 0.03209393212087369, "z": 0.6312886836414668, "word": "Trichiuriform", "pos_group": "adjective", "row_number": 161855, "definition": "Like or pertaining to the genus Trichiurus or family Trichiuridae comprising the scabbard fishes and hairtails.", "details": []}, {"x": -0.925249306332103, "y": -0.127156754709299, "z": 0.3574141587343194, "word": "Trichiurus", "pos_group": "noun", "row_number": 161857, "definition": "A genus of fishes comprising the hairtails. See Hairtail.", "details": []}, {"x": -0.737374404114718, "y": -0.21918526404139008, "z": 0.6389341188131765, "word": "Trichobranchia", "pos_group": "noun", "row_number": 161859, "definition": "The gill of a crustacean in which the branchial filaments are slender and cylindrical as in the crawfishes.", "details": []}, {"x": -0.8640529126081229, "y": 0.07586290476610204, "z": 0.49765187018021845, "word": "Trichophore", "pos_group": "noun", "row_number": 161865, "definition": "The special cell in red algae which produces or bears a trichogyne. See Illust. of Trichogyne.", "details": []}, {"x": -0.8651244018447526, "y": -0.2672675806707801, "z": 0.4244146671065307, "word": "Tricoccous", "pos_group": "adjective", "row_number": 161917, "definition": "Having three cocci or roundish carpels.", "details": []}, {"x": -0.7368044595318503, "y": -0.05630023114454799, "z": 0.6737577252893272, "word": "Tridacna", "pos_group": "noun", "row_number": 161934, "definition": "A genus of very large marine bivalve shells found on the coral reefs of the Indian and Pacific Oceans. One species (T. gigas) often weighs four or five hundred pounds and is sometimes used for baptismal fonts. Called also paw shell and fountain shell.", "details": []}, {"x": -0.9249850528096729, "y": -0.02422519737609566, "z": 0.3792305260534495, "word": "Trident", "pos_group": "noun", "row_number": 161943, "definition": "A kind of scepter or spear with three prongs -- the common attribute of Neptune.", "details": []}, {"x": -0.7757664823870863, "y": -0.2825721400241362, "z": 0.5642156950023159, "word": "Trident", "pos_group": "noun", "row_number": 161945, "definition": "A three-pronged fish spear.", "details": []}, {"x": -0.8075996618019617, "y": 0.06640291639823671, "z": 0.585980749642141, "word": "Trigonia", "pos_group": "noun", "row_number": 162036, "definition": "A genus of pearly bivalve shells numerous extinct species of which are characteristic of the Mesozoic rocks. A few living species exist on the coast of Australia.", "details": []}, {"x": -0.9098973592345413, "y": -0.18989413030799834, "z": 0.3688184037335676, "word": "Trilobite", "pos_group": "noun", "row_number": 162092, "definition": "Any one of numerous species of extinct arthropods belonging to the order Trilobita. Trilobites were very common in the Silurian and Devonian periods but became extinct at the close of the Paleozoic. So named from the three lobes usually seen on each segment.", "details": []}, {"x": -0.7271475737471536, "y": -0.16095019875358058, "z": 0.6673465662718366, "word": "Trinucleus", "pos_group": "noun", "row_number": 162185, "definition": "A genus of Lower Silurian trilobites in which the glabella and cheeks form three rounded elevations on the head.", "details": []}, {"x": -0.8943509303092362, "y": 0.05274414483031636, "z": 0.444245955120722, "word": "Trionyx", "pos_group": "noun", "row_number": 162198, "definition": "A genus of fresh-water or river turtles which have the shell imperfectly developed and covered with a soft leathery skin. They are noted for their agility and rapacity. Called also soft tortoise soft-shell tortoise and mud turtle.", "details": []}, {"x": -0.8305218249560326, "y": -0.29140377488798336, "z": 0.47467603505204975, "word": "Triple-tail", "pos_group": "noun", "row_number": 162272, "definition": "An edible fish (Lobotes Surinamensis) found in the warmer parts of all the oceans and common on the southern and middle coasts of the United States. When living it is silvery gray and becomes brown or blackish when dead. Its dorsal and anal fins are long and extend back on each side of the tail. It has large silvery scales which are used in the manufacture of fancy work. Called also locally black perch grouper and flasher.", "details": []}, {"x": -0.7573910011670009, "y": 0.0024457089029023237, "z": 0.6529570352321893, "word": "Triquetrum", "pos_group": "noun", "row_number": 162320, "definition": "One of the bones of the carpus; the cuneiform. See Cuneiform (b).", "details": []}, {"x": -0.9290908238948242, "y": -0.08671177248971985, "z": 0.35954319554975284, "word": "Tristoma", "pos_group": "noun", "row_number": 162359, "definition": "Any one of numerous species of trematode worms belonging to Tristoma and allied genera having a large posterior sucker and two small anterior ones. They usually have broad thin and disklike bodies and are parasite on the gills and skin of fishes.", "details": []}, {"x": -0.7489733902728856, "y": -0.24915225232577717, "z": 0.6139723249659808, "word": "Triton", "pos_group": "noun", "row_number": 162380, "definition": "A fabled sea demigod the son of Neptune and Amphitrite and the trumpeter of Neptune. He is represented by poets and painters as having the upper part of his body like that of a man and the lower part like that of a fish. He often has a trumpet made of a shell.", "details": []}, {"x": -0.8428684281174994, "y": 0.07963538255773916, "z": 0.5321945309072785, "word": "Triton", "pos_group": "noun", "row_number": 162381, "definition": "Any one of many species of marine gastropods belonging to Triton and allied genera having a stout spiral shell often handsomely colored and ornamented with prominent varices. Some of the species are among the largest of all gastropods. Called also trumpet shell and sea trumpet.", "details": []}, {"x": -0.884534875846586, "y": -0.24282438882709592, "z": 0.39828930390083533, "word": "Triton", "pos_group": "noun", "row_number": 162382, "definition": "Any one of numerous species of aquatic salamanders. The common European species are Hemisalamandra cristata Molge palmata and M. alpestris a red-bellied species common in Switzerland. The most common species of the United States is Diemyctylus viridescens. See Illust. under Salamander.", "details": []}, {"x": -0.7291326609816544, "y": -0.09609688584560552, "z": 0.6775920241713212, "word": "Trochosphere", "pos_group": "noun", "row_number": 162496, "definition": "A young larval form of many annelids mollusks and bryozoans in which a circle of cilia is developed around the anterior end.", "details": []}, {"x": -0.9166504255632697, "y": 0.010053082661947526, "z": 0.3995634278104899, "word": "Trochus", "pos_group": "noun", "row_number": 162498, "definition": "Any one of numerous species of marine univalve shells belonging to Trochus and many allied genera of the family Trochidae. Some of the species are called also topshells.", "details": []}, {"x": -0.7955009652408377, "y": -0.2932914865437513, "z": 0.5302436404350853, "word": "Trophosome", "pos_group": "noun", "row_number": 162585, "definition": "The nutritive zooids of a hydroid collectively as distinguished from the gonosome or reproductive zooids.", "details": []}, {"x": -0.7865957593553975, "y": 0.04795426154281784, "z": 0.6156033626971092, "word": "Trough-shell", "pos_group": "noun", "row_number": 162646, "definition": "Any bivalve shell of the genus Mactra. See Mactra.", "details": []}, {"x": -0.9209032481466091, "y": -0.15192933711465056, "z": 0.3589633464254085, "word": "Trout", "pos_group": "noun", "row_number": 162657, "definition": "Any one of numerous species of fishes belonging to Salmo Salvelinus and allied genera of the family Salmonidae. They are highly esteemed as game fishes and for the quality of their flesh. All the species breed in fresh water but after spawning many of them descend to the sea if they have an opportunity.", "details": []}, {"x": -0.731691762337239, "y": -0.19846231475643206, "z": 0.6521041899492322, "word": "Trout", "pos_group": "noun", "row_number": 162658, "definition": "Any one of several species of marine fishes more or less resembling a trout in appearance or habits but not belonging to the same family especially the California rock trouts the common squeteague and the southern or spotted squeteague; -- called also salt-water trout sea trout shad trout and gray trout. See Squeteague and Rock trout under Rock.", "details": []}, {"x": -0.876405398698506, "y": 0.07012659264186852, "z": 0.47644080234227865, "word": "Trout-colored", "pos_group": "adjective", "row_number": 162660, "definition": "White with spots of black bay or sorrel; as a trout-colored horse.", "details": []}, {"x": -0.8522121157293299, "y": -0.27948739679020895, "z": 0.44229097304780185, "word": "Troutlet", "pos_group": "noun", "row_number": 162661, "definition": "A little trout; a troutling.", "details": []}, {"x": -0.7431164946362312, "y": -0.03248867498435683, "z": 0.6683729209036832, "word": "Troutling", "pos_group": "noun", "row_number": 162662, "definition": "A little trout; a troutlet.", "details": []}, {"x": -0.9282145326859736, "y": -0.047074216751262395, "z": 0.3690552796368249, "word": "Trubu", "pos_group": "noun", "row_number": 162692, "definition": "An East India herring (Clupea toli) which is extensively caught for the sake of its roe and for its flesh.", "details": []}, {"x": -0.7643119229541048, "y": -0.27264036480352477, "z": 0.5843753210993766, "word": "Trumpeter", "pos_group": "noun", "row_number": 162797, "definition": "A large edible fish (Latris hecateia) of the family Cirrhitidae native of Tasmania and New Zealand. It sometimes weighs as much as fifty or sixty pounds and is highly esteemed as a food fish.", "details": []}, {"x": -0.8208876585856929, "y": 0.0746593598774971, "z": 0.5661885127449878, "word": "Trunkfish", "pos_group": "noun", "row_number": 162857, "definition": "Any one of several species of plectognath fishes belonging to the genus Ostracion or the family Ostraciontidae having an angular body covered with a rigid integument consisting of bony scales. Some of the species are called also coffer fish and boxfish.", "details": []}, {"x": -0.9013790988405016, "y": -0.21195843308469947, "z": 0.3776100406739259, "word": "Truttaceous", "pos_group": "adjective", "row_number": 162936, "definition": "Of pertaining to or resembling a trout; as fish of the truttaceous kind.", "details": []}, {"x": -0.7260426337709538, "y": -0.13661552077172753, "z": 0.6739423517120781, "word": "Tube", "pos_group": "noun", "row_number": 163001, "definition": "One of the siphons of a bivalve mollusk.", "details": []}, {"x": -0.9041249664409006, "y": 0.038971327300750015, "z": 0.4254871099183362, "word": "Tube-shell", "pos_group": "noun", "row_number": 163034, "definition": "Any bivalve mollusk which secretes a shelly tube around its siphon as the watering-shell.", "details": []}, {"x": -0.8168335664108809, "y": -0.2953826897679063, "z": 0.4955118478603292, "word": "Tubeworm", "pos_group": "noun", "row_number": 163035, "definition": "Any annelid which constructs a tube; one of the Tubicolae.", "details": []}, {"x": -0.7674269722085013, "y": 0.022141133939770307, "z": 0.6407539406938934, "word": "Tubfish", "pos_group": "noun", "row_number": 163036, "definition": "The sapphirine gurnard (Trigla hirundo). See Illust. under Gurnard.", "details": []}, {"x": -0.9276037847805886, "y": -0.11173318021019742, "z": 0.3564644651305974, "word": "Tubicolae", "pos_group": "other", "row_number": 163040, "definition": "A division of annelids including those which construct and habitually live in tubes. The head or anterior segments usually bear gills and cirri. Called also Sedentaria and Capitibranchiata. See Serpula and Sabella.", "details": []}, {"x": -0.7407505666368024, "y": -0.23189869171765615, "z": 0.6304852058588654, "word": "Tubipora", "pos_group": "noun", "row_number": 163050, "definition": "A genus of halcyonoids in which the skeleton or coral (called organ-pipe coral) consists of a mass of parallel cylindrical tubes united at intervals by transverse plates. These corals are usually red or purple and form large masses. They are natives of the tropical parts of the Indian and Pacific Oceans.", "details": []}, {"x": -0.8561077757719912, "y": 0.079265299083696, "z": 0.5106823754780522, "word": "Tubiporite", "pos_group": "noun", "row_number": 163052, "definition": "Any fossil coral of the genus Syringopora consisting of a cluster of upright tubes united together by small transverse tubules.", "details": []}, {"x": -0.8728556055629542, "y": -0.25948881570901905, "z": 0.413265830137527, "word": "Tubivalve", "pos_group": "noun", "row_number": 163053, "definition": "A shell or tube formed by an annelid as a serpula.", "details": []}, {"x": -0.7327389345341305, "y": -0.0710976054365448, "z": 0.6767856265605651, "word": "Tubularia", "pos_group": "noun", "row_number": 163057, "definition": "A genus of hydroids having large naked flowerlike hydranths at the summits of long slender usually simple stems. The gonophores are small and form clusters at the bases of the outer tentacles.", "details": []}, {"x": -0.9226375489475613, "y": -0.01010172369222006, "z": 0.38553587180764703, "word": "Tubulibranchian", "pos_group": "noun", "row_number": 163068, "definition": "One of the Tubulibranchiata.", "details": []}, {"x": -0.7826856631576529, "y": -0.2885217983840647, "z": 0.5515055072659657, "word": "Tubulibranchiata", "pos_group": "other", "row_number": 163069, "definition": "A group of gastropod mollusks having a tubular shell. Vermetus is an example.", "details": []}, {"x": -0.7991323615703582, "y": 0.06112962110828397, "z": 0.598038993807377, "word": "Tubulipore", "pos_group": "noun", "row_number": 163073, "definition": "Any one of numerous species of Bryozoa belonging to Tubulipora and allied genera having tubular calcareous calicles.", "details": []}, {"x": -0.9148545840366774, "y": -0.1760851971406215, "z": 0.3633663350050837, "word": "Tuck", "pos_group": "noun", "row_number": 163091, "definition": "A small net used for taking fish from a larger one; -- called also tuck-net.", "details": []}, {"x": -0.7276959213898805, "y": -0.17596318864810917, "z": 0.6629446449239352, "word": "Tule", "pos_group": "noun", "row_number": 163154, "definition": "A large bulrush (Scirpus lacustris and S. Tatora) growing abundantly on overflowed land in California and elsewhere.", "details": []}, {"x": -0.8879731599950682, "y": 0.06115345413244674, "z": 0.45581127912332725, "word": "Tulip-shell", "pos_group": "noun", "row_number": 163160, "definition": "A large handsomely colored marine univalve shell (Fasciolaria tulipa) native of the Southern United States. The name is sometimes applied also to other species of Fasciolaria.", "details": []}, {"x": -0.838770089958998, "y": -0.2887096517618893, "z": 0.4616399822044266, "word": "Tullibee", "pos_group": "noun", "row_number": 163165, "definition": "A whitefish (Coregonus tullibee) found in the Great Lakes of North America; -- called also mongrel whitefish.", "details": []}, {"x": -0.7509950359639933, "y": -0.009860662296919542, "z": 0.6602342185137835, "word": "Tun", "pos_group": "noun", "row_number": 163244, "definition": "Any shell belonging to Dolium and allied genera; -- called also tun-shell.", "details": []}, {"x": -0.9296634654157129, "y": -0.07117607959984416, "z": 0.36146895684698055, "word": "Tuna", "pos_group": "noun", "row_number": 163248, "definition": "The Opuntia Tuna. See Prickly pear under Prickly.", "details": []}, {"x": -0.7539168064575628, "y": -0.259676714170411, "z": 0.6034711700309207, "word": "Tunicata", "pos_group": "other", "row_number": 163290, "definition": "A grand division of the animal kingdom intermediate in some respects between the invertebrates and vertebrates and by some writers united with the latter. They were formerly classed with acephalous mollusks. The body is usually covered with a firm external tunic consisting in part of cellulose and having two openings one for the entrance and one for the exit of water. The pharynx is usually dilated in the form of a sac pierced by several series of ciliated slits and serves as a gill.", "details": []}, {"x": -0.8343942564855599, "y": 0.07969700078272376, "z": 0.5453756620992068, "word": "Tunny", "pos_group": "noun", "row_number": 163315, "definition": "Any one of several species of large oceanic fishes belonging to the Mackerel family especially the common or great tunny (Orcynus / Albacora thynnus) native of the Mediterranean Sea and the Atlantic Ocean. It sometimes weighs a thousand pounds or more and is extensively caught in the Mediterranean. On the American coast it is called horse mackerel. See Illust. of Horse mackerel under Horse.", "details": []}, {"x": -0.8914787514540966, "y": -0.23230787816060822, "z": 0.38897131700211673, "word": "Turban-shell", "pos_group": "noun", "row_number": 163338, "definition": "A sea urchin when deprived of its spines; -- popularly so called from a fancied resemblance to a turban.", "details": []}, {"x": -0.7267577589324455, "y": -0.11159041698842544, "z": 0.6777689419469136, "word": "Turbinella", "pos_group": "noun", "row_number": 163364, "definition": "A genus of large marine gastropods having a thick heavy shell with conspicuous folds on the columella.", "details": []}, {"x": -0.9125970856899176, "y": 0.02246467673223561, "z": 0.4082424493969058, "word": "Turbinite", "pos_group": "noun", "row_number": 163365, "definition": "A petrified shell resembling the genus Turbo.", "details": []}, {"x": -0.8032451233948948, "y": -0.29601985140410536, "z": 0.5168844351661325, "word": "Turbo", "pos_group": "noun", "row_number": 163371, "definition": "Any one of numerous marine gastropods of the genus Turbo or family Turbinidae usually having a turbinate shell pearly on the inside and a calcareous operculum.", "details": []}, {"x": -0.778618213118957, "y": 0.03964216763530617, "z": 0.6262445023667809, "word": "Turbot", "pos_group": "noun", "row_number": 163372, "definition": "A large European flounder (Rhombus maximus) highly esteemed as a food fish. It often weighs from thirty to forty pounds. Its color on the upper side is brownish with small roundish tubercles scattered over the surface. The lower or blind side is white. Called also bannock fluke.", "details": []}, {"x": -0.92431301170725, "y": -0.13686072675291996, "z": 0.3562507513835382, "word": "Turbot", "pos_group": "noun", "row_number": 163373, "definition": "Any one of numerous species of flounders more or less related to the true turbots as the American plaice or summer flounder (see Flounder) the halibut and the diamond flounder (Hypsopsetta guttulata) of California.", "details": []}, {"x": -0.7340327598949175, "y": -0.21229347283334776, "z": 0.64507936627473, "word": "Turbot", "pos_group": "noun", "row_number": 163374, "definition": "The filefish; -- so called in Bermuda.", "details": []}, {"x": -0.8689316928151117, "y": 0.07553265427381098, "z": 0.48913447165357005, "word": "Turbot", "pos_group": "noun", "row_number": 163375, "definition": "The trigger fish.", "details": []}, {"x": -0.8602837294389121, "y": -0.2735458958992783, "z": 0.4302145368294033, "word": "Turnip-shell", "pos_group": "noun", "row_number": 163522, "definition": "Any one of several large thick spiral marine shells belonging to Rapa and allied genera somewhat turnip-shaped.", "details": []}, {"x": -0.7380775259994627, "y": -0.046580523015222385, "z": 0.6731060989845069, "word": "Turnstone", "pos_group": "noun", "row_number": 163558, "definition": "Any species of limicoline birds of the genera Strepsilas and Arenaria allied to the plovers especially the common American and European species (Strepsilas interpres). They are so called from their habit of turning up small stones in search of mollusks and other aquatic animals. Called also brant bird sand runner sea quail sea lark sparkback and skirlcrake.", "details": []}, {"x": -0.9269625396445731, "y": -0.0321535167502658, "z": 0.37377346275019824, "word": "Turritella", "pos_group": "noun", "row_number": 163585, "definition": "Any spiral marine gastropod belonging to Turritella and allied genera. These mollusks have an elongated turreted shell composed of many whorls. They have a rounded aperture and a horny multispiral operculum.", "details": []}, {"x": -0.7705892748415281, "y": -0.28047170034206953, "z": 0.5723004410328865, "word": "Turtle", "pos_group": "noun", "row_number": 163588, "definition": "Any one of the numerous species of Testudinata especially a sea turtle or chelonian.", "details": []}, {"x": -0.8122713930331213, "y": 0.0713639471747349, "z": 0.5788975480200915, "word": "Tusk", "pos_group": "noun", "row_number": 163606, "definition": "A toothshell or Dentalium; -- called also tusk-shell.", "details": []}, {"x": -0.9071983274915373, "y": -0.19918452779389778, "z": 0.3705627051985658, "word": "Typhlosole", "pos_group": "noun", "row_number": 164023, "definition": "A fold of the wall which projects into the cavity of the intestine in bivalve mollusks certain annelids starfishes and some other animals.", "details": []}, {"x": -0.7254688107317987, "y": -0.15208046114662369, "z": 0.6712425329140129, "word": "Uintatherium", "pos_group": "noun", "row_number": 164141, "definition": "An extinct genus of large Eocene ungulates allied to Dinoceras. This name is sometimes used for nearly all the known species of the group. See Dinoceras.", "details": []}, {"x": -0.8985403042813687, "y": 0.04908259356244247, "z": 0.4361378458596886, "word": "Umbellularia", "pos_group": "noun", "row_number": 164249, "definition": "A genus of deep-sea alcyonaria consisting of a cluster of large flowerlike polyps situated at the summit of a long slender stem which stands upright in the mud supported by a bulbous base.", "details": []}, {"x": -0.8250348129310331, "y": -0.294746822577461, "z": 0.4821222542388454, "word": "Umbra", "pos_group": "noun", "row_number": 164287, "definition": "Any one of several species of sciaenoid food fishes of the genus Umbrina especially the Mediterranean species (U. cirrhosa) which is highly esteemed as a market fish; -- called also ombre and umbrine.", "details": []}, {"x": -0.7603072219417181, "y": 0.01116805718997563, "z": 0.6494676302648722, "word": "Umbrella", "pos_group": "noun", "row_number": 164304, "definition": "The umbrellalike disk or swimming bell of a jellyfish.", "details": []}, {"x": -0.9292912580520226, "y": -0.09610513230557388, "z": 0.356625239225461, "word": "Umbrella", "pos_group": "noun", "row_number": 164305, "definition": "Any marine tectibranchiate gastropod of the genus Umbrella having an umbrella-shaped shell; -- called also umbrella shell.", "details": []}, {"x": -0.7447739132642127, "y": -0.24389314851070273, "z": 0.6211505052969428, "word": "Uncinata", "pos_group": "other", "row_number": 164682, "definition": "A division of marine chaetopod annelids which are furnished with uncini as the serpulas and sabellas.", "details": []}, {"x": -0.8478757072788797, "y": 0.08140269116808688, "z": 0.5239087581601708, "word": "Unibranchiate", "pos_group": "adjective", "row_number": 165694, "definition": "Having but one gill as certain molluscs.", "details": []}, {"x": -0.880363006242979, "y": -0.2505635404814846, "z": 0.40271440180381934, "word": "Unifacial", "pos_group": "adjective", "row_number": 165717, "definition": "Having but one front surface; as some foliaceous corals are unifacial the polyp mouths being confined to one surface.", "details": []}, {"x": -0.7292909078594578, "y": -0.08632062330969323, "z": 0.6787367101497853, "word": "Unimuscular", "pos_group": "adjective", "row_number": 165763, "definition": "Having only one adductor muscle and one muscular impression on each valve as the oyster; monomyarian.", "details": []}, {"x": -0.9196035552434145, "y": 0.003502611994213014, "z": 0.3928320670374177, "word": "Unio", "pos_group": "noun", "row_number": 165773, "definition": "Any one of numerous species of fresh-water mussels belonging to Unio and many allied genera.", "details": []}, {"x": -0.790000046519136, "y": -0.29328005044568556, "z": 0.5384113097905161, "word": "Univalve", "pos_group": "noun", "row_number": 165862, "definition": "A shell consisting of one valve only; a mollusk whose shell is composed of a single piece as the snails and conchs.", "details": []}, {"x": -0.7907692689731597, "y": 0.05461836560173326, "z": 0.6096726969338959, "word": "Univalvia", "pos_group": "other", "row_number": 165865, "definition": "Same as Gastropoda.", "details": []}, {"x": -0.9192631735388701, "y": -0.1616422219923382, "z": 0.3589247969207823, "word": "Unke", "pos_group": "noun", "row_number": 165912, "definition": "A European aquatic toad (Bombinator igneus). Its back is dark; its belly is marked with crimson. Called also feuerkrote.", "details": []}, {"x": -0.7289496015027873, "y": -0.19067303110206293, "z": 0.657477203923664, "word": "Upokororo", "pos_group": "noun", "row_number": 166930, "definition": "An edible fresh-water New Zealand fish (Prototroctes oxyrhynchus) of the family Haplochitonidae. In general appearance and habits it resembles the northern lake whitefishes and trout. Called also grayling.", "details": []}, {"x": -0.8811042871455572, "y": 0.06848135793252566, "z": 0.46793753727333814, "word": "Urchin", "pos_group": "noun", "row_number": 167113, "definition": "A sea urchin. See Sea urchin.", "details": []}, {"x": -0.8470375182523863, "y": -0.28472385164807906, "z": 0.4488427018182661, "word": "Urodela", "pos_group": "other", "row_number": 167204, "definition": "An order of amphibians having the tail well developed and often long. It comprises the salamanders tritons and allied animals.", "details": []}, {"x": -0.745062451528904, "y": -0.022990439321903436, "z": 0.6665983671008543, "word": "Urogastric", "pos_group": "adjective", "row_number": 167209, "definition": "Behind the stomach; -- said of two lobes of the carapace of certain crustaceans.", "details": []}, {"x": -0.9295338830363865, "y": -0.05571807476395298, "z": 0.364502752296736, "word": "Urohyal", "pos_group": "adjective", "row_number": 167213, "definition": "Of or pertaining to one or more median and posterior elements in the hyoidean arch of fishes.", "details": []}, {"x": -0.7594327976544241, "y": -0.2692629796396062, "z": 0.5922493340159832, "word": "Uropod", "pos_group": "noun", "row_number": 167218, "definition": "Any one of the abdominal appendages of a crustacean especially one of the posterior ones which are often larger than the rest and different in structure and are used chiefly in locomotion. See Illust. of Crustacea and Stomapoda.", "details": []}, {"x": -0.8257784235121226, "y": 0.07845253066102488, "z": 0.5585115895795847, "word": "Urostyle", "pos_group": "noun", "row_number": 167232, "definition": "A styliform process forming the posterior extremity of the vertebral column in some fishes and amphibians.", "details": []}, {"x": -0.8980591972276002, "y": -0.22080355296016385, "z": 0.3804411508697325, "word": "Urva", "pos_group": "noun", "row_number": 167259, "definition": "The crab-eating ichneumon (Herpestes urva) native of India. The fur is black annulated with white at the tip of each hair and a white streak extends from the mouth to the shoulder.", "details": []}, {"x": -0.7250609749136039, "y": -0.12723443280030458, "z": 0.6768293594158864, "word": "Utricle", "pos_group": "noun", "row_number": 167397, "definition": "A utriculus.", "details": []}, {"x": -0.9079075180678309, "y": 0.034110046488002914, "z": 0.4177803769500161, "word": "Vaagmer", "pos_group": "noun", "row_number": 167451, "definition": "The dealfish.", "details": []}, {"x": -0.811249714005406, "y": -0.29746762713116204, "z": 0.5033755182119042, "word": "Valonia", "pos_group": "noun", "row_number": 167688, "definition": "A genus of marine green algae in which the whole frond consists of a single oval or cylindrical cell often an inch in length.", "details": []}, {"x": -0.770893368869276, "y": 0.03020774091592315, "z": 0.6362475196196327, "word": "Valvata", "pos_group": "noun", "row_number": 167720, "definition": "A genus of small spiral fresh-water gastropods having an operculum.", "details": []}, {"x": -0.9270899377265892, "y": -0.12141782350044841, "z": 0.3546293269070156, "word": "Valve-shell", "pos_group": "noun", "row_number": 167733, "definition": "Any fresh-water gastropod of the genus Valvata.", "details": []}, {"x": -0.7370547390865113, "y": -0.22555404331353854, "z": 0.6370837347908271, "word": "Varanus", "pos_group": "noun", "row_number": 167886, "definition": "A genus of very large lizards native of Asia and Africa. It includes the monitors. See Monitor 3.", "details": []}, {"x": -0.8610870275729956, "y": 0.07972269309755026, "z": 0.5021687198051837, "word": "Vasum", "pos_group": "noun", "row_number": 168045, "definition": "A genus including several species of large marine gastropods having massive pyriform shells with conspicuous folds on the columella.", "details": []}, {"x": -0.8682216657500323, "y": -0.26638169424056024, "z": 0.4186071333550921, "word": "Velella", "pos_group": "noun", "row_number": 168218, "definition": "Any species of oceanic Siphonophora belonging to the genus Velella.", "details": []}, {"x": -0.7336071819846226, "y": -0.061259384973154675, "z": 0.676807055439947, "word": "Veliger", "pos_group": "noun", "row_number": 168220, "definition": "Any larval gastropod or bivalve mollusk in the state when it is furnished with one or two ciliated membranes for swimming.", "details": []}, {"x": -0.9250059866307739, "y": -0.01759016109504376, "z": 0.37954513688081826, "word": "Velutina", "pos_group": "noun", "row_number": 168253, "definition": "Any one of several species of marine gastropods belonging to Velutina and allied genera.", "details": []}, {"x": -0.7773373706206572, "y": -0.2871888401125541, "z": 0.5597045491608664, "word": "Vendace", "pos_group": "noun", "row_number": 168289, "definition": "A European lake whitefish (Coregonus Willughbii or C. Vandesius) native of certain lakes in Scotland and England. It is regarded as a delicate food fish. Called also vendis.", "details": []}, {"x": -0.8036659932669916, "y": 0.06678260786754706, "z": 0.5913214477359917, "word": "Veneracea", "pos_group": "other", "row_number": 168323, "definition": "An extensive tribe of bivalve mollusks of which the genus Venus is the type. The shells are usually oval or somewhat heartshaped with a conspicuous lunule. See Venus.", "details": []}, {"x": -0.9125310268590997, "y": -0.18562859829405778, "z": 0.3644573342860042, "word": "Vent", "pos_group": "noun", "row_number": 168380, "definition": "The anal opening of certain invertebrates and fishes; also the external cloacal opening of reptiles birds amphibians and many fishes.", "details": []}, {"x": -0.7256020903629486, "y": -0.16741253447134247, "z": 0.6674388734279724, "word": "Ventriculite", "pos_group": "noun", "row_number": 168433, "definition": "Any one of numerous species of siliceous fossil sponges belonging to Ventriculites and allied genera characteristic of the Cretaceous period.", "details": []}, {"x": -0.8923998023444798, "y": 0.05821557468476822, "z": 0.4474746245762499, "word": "Venus", "pos_group": "noun", "row_number": 168473, "definition": "Any one of numerous species of marine bivalve shells of the genus Venus or family Veneridae. Many of these shells are large and ornamented with beautiful frills; others are smooth glossy and handsomely colored. Some of the larger species as the round clam or quahog are valued for food.", "details": []}, {"x": -0.83334893412272, "y": -0.2928010375144513, "z": 0.46882524081686056, "word": "Veretillum", "pos_group": "noun", "row_number": 168554, "definition": "Any one of numerous species of club-shaped compound Alcyonaria belonging to Veretillum and allied genera of the tribe Pennatulacea. The whole colony can move about as if it were a simple animal.", "details": []}, {"x": -0.7535773933223011, "y": -0.0007584828944140706, "z": 0.6573587581962113, "word": "Vermetid", "pos_group": "noun", "row_number": 168616, "definition": "Any species of vermetus.", "details": []}, {"x": -0.930291112038825, "y": -0.08038119447413664, "z": 0.35790684603186534, "word": "Vermetus", "pos_group": "noun", "row_number": 168617, "definition": "Any one of many species of marine gastropods belonging to Vermetus and allied genera of the family Vermetidae. Their shells are regularly spiral when young but later in life the whorls become separate and the shell is often irregularly bent and contorted like a worm tube.", "details": []}, {"x": -0.7494217767976955, "y": -0.2550753234509863, "z": 0.6109857443735982, "word": "Vermilinguia", "pos_group": "other", "row_number": 168642, "definition": "A tribe of Old World lizards which comprises the chameleon. They have long flexible tongues.", "details": []}, {"x": -0.8394107576120587, "y": 0.08224607510167764, "z": 0.5372384602162419, "word": "Vertebral", "pos_group": "adjective", "row_number": 168757, "definition": "Vertebrate.", "details": []}, {"x": -0.8875895603464697, "y": -0.24054231291717795, "z": 0.39284114863442593, "word": "Vertebrata", "pos_group": "other", "row_number": 168761, "definition": "One of the grand divisions of the animal kingdom comprising all animals that have a backbone composed of bony or cartilaginous vertebrae together with Amphioxus in which the backbone is represented by a simple undivided notochord. The Vertebrata always have a dorsal or neural cavity above the notochord or backbone and a ventral or visceral cavity below it. The subdivisions or classes of Vertebrata are Mammalia Aves Reptilia Amphibia Pisces", "details": []}, {"x": -0.7264904443206416, "y": -0.1018657047451578, "z": 0.679584441042884, "word": "Vertigo", "pos_group": "noun", "row_number": 168797, "definition": "Any one of numerous species of small land snails belonging to the genus Vertigo having an elongated or conical spiral shell and usually teeth in the aperture.", "details": []}, {"x": -0.9158957897599691, "y": 0.016485616251866328, "z": 0.4010774573031485, "word": "Vesicle", "pos_group": "noun", "row_number": 168824, "definition": "A small convex hollow prominence on the surface of a shell or a coral.", "details": []}, {"x": -0.7976608013367341, "y": -0.29679978489434916, "z": 0.525021079288734, "word": "Vesicularia", "pos_group": "noun", "row_number": 168835, "definition": "Any one of numerous species of marine Bryozoa belonging to Vesicularia and allied genera. They have delicate tubular cells attached in clusters to slender flexible stems.", "details": []}, {"x": -0.7825696809077843, "y": 0.04690188998910169, "z": 0.6207937719076594, "word": "Vestlet", "pos_group": "noun", "row_number": 168901, "definition": "Any one of several species of actinians belonging to the genus Cerianthus. These animals have a long smooth body tapering to the base and two separate circles of tentacles around the mouth. They form a tough flexible feltlike tube with a smooth internal lining in which they dwell whence the name.", "details": []}, {"x": -0.9230845178690392, "y": -0.1466606165693782, "z": 0.3555357034363401, "word": "Vibraculum", "pos_group": "noun", "row_number": 168999, "definition": "One of the movable slender spinelike organs or parts with which certain bryozoans are furnished. They are regarded as specially modified zooids of nearly the same nature as Avicularia.", "details": []}, {"x": -0.7309062439669556, "y": -0.20497175676856855, "z": 0.6509705380870351, "word": "Villiform", "pos_group": "adjective", "row_number": 169263, "definition": "Having the form or appearance of villi; like close-set fibers either hard or soft; as the teeth of perch are villiform.", "details": []}, {"x": -0.8737864278089466, "y": 0.0746640556965429, "z": 0.4805440222953817, "word": "Villosity", "pos_group": "noun", "row_number": 169267, "definition": "A villus.", "details": []}, {"x": -0.8552643650220099, "y": -0.2794602778493121, "z": 0.43637692311565174, "word": "Virgularian", "pos_group": "noun", "row_number": 169462, "definition": "Any one of numerous species of long slender Alcyonaria belonging to Virgularia and allied genera of the family Virgularidae. These corals are allied to the sea-pens but have a long rodlike rhachis inclosing a slender round or square calcareous axis. The polyps are arranged in transverse rows or clusters along each side of the rhachis.", "details": []}, {"x": -0.7396392345385815, "y": -0.036859298020694126, "z": 0.6719934485399416, "word": "Vitrina", "pos_group": "noun", "row_number": 169695, "definition": "A genus of terrestrial gastropods having transparent very thin and delicate shells -- whence the name.", "details": []}, {"x": -0.9286940143399224, "y": -0.04044821683094256, "z": 0.3686344659474983, "word": "Vivipara", "pos_group": "other", "row_number": 169763, "definition": "An artificial division of vertebrates including those that produce their young alive; -- opposed to Ovipara.", "details": []}, {"x": -0.765487254611087, "y": -0.27783248569141006, "z": 0.5803777846562647, "word": "Volador", "pos_group": "noun", "row_number": 169894, "definition": "A flying fish of California (Exoc/tus Californicus): -- called also volator.", "details": []}, {"x": -0.8170792998061772, "y": 0.07589659317567249, "z": 0.5715077645776772, "word": "Voluta", "pos_group": "noun", "row_number": 170043, "definition": "Any one of numerous species of large handsome marine gastropods belonging to Voluta and allied genera.", "details": []}, {"x": -0.904224243340291, "y": -0.20838206527184208, "z": 0.3727672633543887, "word": "Volvox", "pos_group": "noun", "row_number": 170052, "definition": "A genus of minute pale-green globular organisms about one fiftieth of an inch in diameter found rolling through water the motion being produced by minute colorless cilia. It has been considered as belonging to the flagellate Infusoria but is now referred to the vegetable kingdom and each globule is considered a colony of many individuals. The commonest species is Volvox globator often called globe animalcule.", "details": []}, {"x": -0.7240605694313784, "y": -0.14291935093400943, "z": 0.6747668863565471, "word": "Waldheimia", "pos_group": "noun", "row_number": 170491, "definition": "A genus of brachiopods of which many species are found in the fossil state. A few still exist in the deep sea.", "details": []}, {"x": -0.9026067752297434, "y": 0.04489824569269739, "z": 0.42811815757227784, "word": "Wall-eye", "pos_group": "noun", "row_number": 170554, "definition": "An American fresh-water food fish (Stizostedion vitreum) having large and prominent eyes; -- called also glasseye pike perch yellow pike and wall-eyed perch.", "details": []}, {"x": -0.8194595220329255, "y": -0.2976102943619617, "z": 0.48981037600213817, "word": "Wall-eye", "pos_group": "noun", "row_number": 170555, "definition": "A California surf fish (Holconotus argenteus).", "details": []}, {"x": -0.7634776008972101, "y": 0.01970579093238546, "z": 0.6455336046496493, "word": "Walrus", "pos_group": "noun", "row_number": 170591, "definition": "A very large marine mammal (Trichecus rosmarus) of the Seal family native of the Arctic Ocean. The male has long and powerful tusks descending from the upper jaw. It uses these in procuring food and in fighting. It is hunted for its oil ivory and skin. It feeds largely on mollusks. Called also morse.", "details": []}, {"x": -0.9292061124337201, "y": -0.1057059899413826, "z": 0.3541217930406504, "word": "Warmouth", "pos_group": "noun", "row_number": 170857, "definition": "An American freshwater bream or sunfish (Chaenobryttus gulosus); -- called also red-eyed bream.", "details": []}, {"x": -0.7407424780542285, "y": -0.23814345638682236, "z": 0.6281626185839286, "word": "Warp", "pos_group": "verb", "row_number": 170895, "definition": "Four; esp. four herrings; a cast. See Cast n. 17.", "details": []}, {"x": -0.8529217743390178, "y": 0.08265377545738334, "z": 0.5154539749201883, "word": "Warsaw", "pos_group": "noun", "row_number": 170949, "definition": "The black grouper (Epinephelus nigritus) of the southern coasts of the United States.", "details": []}, {"x": -0.8759668598074025, "y": -0.258032069063315, "z": 0.4075555322334161, "word": "Warsaw", "pos_group": "noun", "row_number": 170950, "definition": "The jewfish; -- called also guasa.", "details": []}, {"x": -0.7297421888054901, "y": -0.07642733630921102, "z": 0.6794374144408383, "word": "Water adder", "pos_group": "other", "row_number": 171132, "definition": "The common harmless American water snake (Tropidonotus sipedon). See Illust. under Water Snake.", "details": []}, {"x": -0.9223497888886516, "y": -0.003491286730731759, "z": 0.3863401064528811, "word": "Water bear", "pos_group": "other", "row_number": 171145, "definition": "Any species of Tardigrada 2. See Illust. of Tardigrada.", "details": []}, {"x": -0.7845122239623218, "y": -0.2927317245836132, "z": 0.546670566132836, "word": "Water breather", "pos_group": "other", "row_number": 171159, "definition": "Any arthropod that breathes by means of gills.", "details": []}, {"x": -0.795131415837048, "y": 0.06093393004200444, "z": 0.603368119574284, "word": "Water chevrotain", "pos_group": "other", "row_number": 171177, "definition": "A large West African chevrotain (Hyaemoschus aquaticus). It has a larger body and shorter legs than the other allied species. Called also water deerlet.", "details": []}, {"x": -0.9173327679224399, "y": -0.17137813588037523, "z": 0.35934680663381796, "word": "Water crowfoot", "pos_group": "other", "row_number": 171198, "definition": "An aquatic kind of buttercup (Ranunculus aquatilis) used as food for cattle in parts of England.", "details": []}, {"x": -0.7264480252170409, "y": -0.18250129679213706, "z": 0.6625455028354278, "word": "Water dog", "pos_group": "other", "row_number": 171210, "definition": "The menobranchus.", "details": []}, {"x": -0.8857397126013383, "y": 0.0662948976356656, "z": 0.4594237130018162, "word": "Water flannel", "pos_group": "other", "row_number": 171228, "definition": "A floating mass formed in pools by the entangled filaments of a European fresh-water alga (Cladophora crispata).", "details": []}, {"x": -0.8417169089326277, "y": -0.2895446452301191, "z": 0.45571541957176176, "word": "Water flea", "pos_group": "other", "row_number": 171229, "definition": "Any one of numerous species of small aquatic Entomostraca belonging to the genera Cyclops Daphnia etc; -- so called because they swim with sudden leaps or star
