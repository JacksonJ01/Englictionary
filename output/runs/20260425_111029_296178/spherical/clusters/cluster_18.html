9579185680546054, "z": 0.5072032567008163, "word": "Amioidei", "pos_group": "other", "row_number": 5258, "definition": "An order of ganoid fishes of which Amia is the type. See Bowfin and Ganoidei.", "details": []}, {"x": -0.8359004913774086, "y": -0.13609516791765636, "z": 0.5317409837359461, "word": "Ammodyte", "pos_group": "noun", "row_number": 5273, "definition": "One of a genus of fishes; the sand eel.", "details": []}, {"x": -0.8385748070546971, "y": -0.084649696538398, "z": 0.5381697890527997, "word": "Ammonite", "pos_group": "noun", "row_number": 5282, "definition": "A fossil cephalopod shell related to the nautilus. There are many genera and species and all are extinct the typical forms having existed only in the Mesozoic age when they were exceedingly numerous. They differ from the nautili in having the margins of the septa very much lobed or plaited and the siphuncle dorsal. Also called serpent stone snake stone and cornu Ammonis.", "details": []}, {"x": -0.8555105732598596, "y": -0.12016661472423856, "z": 0.503648333409635, "word": "Ammonitoidea", "pos_group": "other", "row_number": 5284, "definition": "An extensive group of fossil cephalopods often very abundant in Mesozoic rocks. See Ammonite.", "details": []}, {"x": -0.827592842806336, "y": -0.11965271160635672, "z": 0.5484280400754262, "word": "Amoeba", "pos_group": "noun", "row_number": 5308, "definition": "A rhizopod. common in fresh water capable of undergoing many changes of form at will. See Rhizopoda.", "details": []}, {"x": -0.8518655528032147, "y": -0.08432015202852652, "z": 0.516928613939255, "word": "Amoebea", "pos_group": "other", "row_number": 5310, "definition": "That division of the Rhizopoda which includes the amoeba and similar forms.", "details": []}, {"x": -0.8441311329503223, "y": -0.13735883390301176, "z": 0.5182423961167303, "word": "Amorphozoa", "pos_group": "other", "row_number": 5345, "definition": "Animals without a mouth or regular internal organs as the sponges.", "details": []}, {"x": -0.8309525580440978, "y": -0.09441683282339373, "z": 0.5482730231915206, "word": "Amphibia", "pos_group": "other", "row_number": 5391, "definition": "One of the classes of vertebrates.", "details": []}, {"x": -0.8583719050767753, "y": -0.10436838798782029, "z": 0.5022996238936392, "word": "Amphibian", "pos_group": "adjective", "row_number": 5393, "definition": "Of or pertaining to the Amphibia; as amphibian reptiles.", "details": []}, {"x": -0.8309903434692847, "y": -0.13317611981225633, "z": 0.5401103314810334, "word": "Amphibian", "pos_group": "noun", "row_number": 5394, "definition": "One of the Amphibia.", "details": []}, {"x": -0.8438213383218073, "y": -0.08027223212904566, "z": 0.5305863904604177, "word": "Amphibiology", "pos_group": "noun", "row_number": 5396, "definition": "A treatise on amphibious animals; the department of natural history which treats of the Amphibia.", "details": []}, {"x": -0.8525279486070152, "y": -0.12962754615534777, "z": 0.506352442594738, "word": "Amphibiously", "pos_group": "adverb", "row_number": 5401, "definition": "Like an amphibious being.", "details": []}, {"x": -0.8265578861477035, "y": -0.10998805426229066, "z": 0.5520006238824694, "word": "Amphibium", "pos_group": "noun", "row_number": 5404, "definition": "An amphibian.", "details": []}, {"x": -0.8562791388755303, "y": -0.08909027560083024, "z": 0.5087720109439479, "word": "Amphidisc", "pos_group": "noun", "row_number": 5428, "definition": "A peculiar small siliceous spicule having a denticulated wheel at each end; -- found in freshwater sponges.", "details": []}, {"x": -0.8384590597872692, "y": -0.14004101418841208, "z": 0.526663953015326, "word": "Amphioxus", "pos_group": "noun", "row_number": 5445, "definition": "A fishlike creature (Amphioxus lanceolatus) two or three inches long found in temperature seas; -- also called the lancelet. Its body is pointed at both ends. It is the lowest and most generalized of the vertebrates having neither brain skull vertebrae nor red blood. It forms the type of the group Acrania Leptocardia etc.", "details": []}, {"x": -0.8347655247306939, "y": -0.08556852712933993, "z": 0.5439159364148147, "word": "Amphipneust", "pos_group": "noun", "row_number": 5446, "definition": "One of a tribe of Amphibia which have both lungs and gills at the same time as the proteus and siren.", "details": []}, {"x": -0.8582963757788838, "y": -0.11479497863159269, "z": 0.5001494218789075, "word": "Amphipod", "pos_group": "noun", "row_number": 5447, "definition": "One of the Amphipoda.", "details": []}, {"x": -0.8270851959831151, "y": -0.12661342977810724, "z": 0.5476304575034121, "word": "Amphipoda", "pos_group": "other", "row_number": 5450, "definition": "A numerous group of fourteen -- footed Crustacea inhabiting both fresh and salt water. The body is usually compressed laterally and the anterior pairs or legs are directed downward and forward but the posterior legs are usually turned upward and backward. The beach flea is an example. See Tetradecapoda and Arthrostraca.", "details": []}, {"x": -0.8495543205045814, "y": -0.07944744341311206, "z": 0.5214839980738809, "word": "Amphirhina", "pos_group": "other", "row_number": 5454, "definition": "A name applied to the elasmobranch fishes because the nasal sac is double.", "details": []}, {"x": -0.8478058163808472, "y": -0.13748434869441573, "z": 0.5121751180747438, "word": "Amphisbaenoid", "pos_group": "adjective", "row_number": 5457, "definition": "Like or pertaining to the lizards of the genus Amphisbaena.", "details": []}, {"x": -0.8276194996552547, "y": -0.09911988254188547, "z": 0.5524682911039047, "word": "Amphiuma", "pos_group": "noun", "row_number": 5472, "definition": "A genus of amphibians inhabiting the Southern United States having a serpentlike form but with four minute limbs and two persistent gill openings; the Congo snake.", "details": []}, {"x": -0.8593315050094527, "y": -0.0972718568265218, "z": 0.5020832106013005, "word": "Anabas", "pos_group": "noun", "row_number": 5594, "definition": "A genus of fishes remarkable for their power of living long out of water and of making their way on land for considerable distances and for climbing trees; the climbing fishes.", "details": []}, {"x": -0.8326933569248366, "y": -0.13886467647126466, "z": 0.5360395274247767, "word": "Anacanths", "pos_group": "other", "row_number": 5605, "definition": "A group of teleostean fishes destitute of spiny fin-rays as the cod.", "details": []}, {"x": -0.8400931551317135, "y": -0.0790122913574745, "z": 0.5366568256486487, "word": "Anacanthous", "pos_group": "adjective", "row_number": 5606, "definition": "Spineless as certain fishes.", "details": []}, {"x": -0.8560628583178094, "y": -0.12571122568636517, "z": 0.5013512444835201, "word": "Anadrom", "pos_group": "noun", "row_number": 5636, "definition": "A fish that leaves the sea and ascends rivers.", "details": []}, {"x": -0.8248588602875944, "y": -0.11700696723746795, "z": 0.553097848687681, "word": "Anadromous", "pos_group": "adjective", "row_number": 5637, "definition": "Ascending rivers from the sea at certain seasons for breeding as the salmon shad etc.", "details": []}, {"x": -0.8549711580314648, "y": -0.08265375351987292, "z": 0.5120475329140959, "word": "Anallantoidea", "pos_group": "other", "row_number": 5694, "definition": "The division of Vertebrata in which no allantois is developed. It includes amphibians fishes and lower forms.", "details": []}, {"x": -0.8418578702647083, "y": -0.14242264753668335, "z": 0.5205680702290636, "word": "Analogue", "pos_group": "noun", "row_number": 5709, "definition": "An organ which is equivalent in its functions to a different organ in another species or group or even in the same group; as the gill of a fish is the analogue of a lung in a quadruped although the two are not of like structural relations.", "details": []}, {"x": -0.8308227557621963, "y": -0.08851855137997112, "z": 0.5494524679799895, "word": "Anaptychus", "pos_group": "noun", "row_number": 5777, "definition": "One of a pair of shelly plates found in some cephalopods as the ammonites.", "details": []}, {"x": -0.8604385674246682, "y": -0.10800456889345922, "z": 0.4979763897880326, "word": "Anchor", "pos_group": "noun", "row_number": 5865, "definition": "One of the anchor-shaped spicules of certain sponges; also one of the calcareous spinules of certain Holothurians as in species of Synapta.", "details": []}, {"x": -0.8276560056093136, "y": -0.13362709119506055, "z": 0.545095713501384, "word": "Anchovy", "pos_group": "noun", "row_number": 5896, "definition": "A small fish about three inches in length of the Herring family (Engraulis encrasicholus) caught in vast numbers in the Mediterranean and pickled for exportation. The name is also applied to several allied species.", "details": []}, {"x": -0.8463029202583636, "y": -0.07591534683090044, "z": 0.527264854961631, "word": "Androspore", "pos_group": "noun", "row_number": 5980, "definition": "A spore of some algae which has male functions.", "details": []}, {"x": -0.8517829772357683, "y": -0.1355880673669407, "z": 0.5060450925353082, "word": "Anemone", "pos_group": "noun", "row_number": 6013, "definition": "The sea anemone. See Actinia and Sea anemone.", "details": []}, {"x": -0.8247824670163953, "y": -0.10545186898506556, "z": 0.5555301840853523, "word": "Angiostomous", "pos_group": "adjective", "row_number": 6099, "definition": "With a narrow mouth as the shell of certain gastropods.", "details": []}, {"x": -0.859259944601231, "y": -0.08980475508155408, "z": 0.5035945329018489, "word": "Angle", "pos_group": "noun", "row_number": 6106, "definition": "A fishhook; tackle for catching fish consisting of a line hook and bait with or without a rod.", "details": []}, {"x": -0.835415151183164, "y": -0.14346802268533473, "z": 0.5305642766341996, "word": "Angler", "pos_group": "noun", "row_number": 6115, "definition": "A fish (Lophius piscatorius) of Europe and America having a large broad and depressed head with the mouth very large. Peculiar appendages on the head are said to be used to entice fishes within reach. Called also fishing frog frogfish toadfish goosefish allmouth monkfish etc.", "details": []}, {"x": -0.8358998671177066, "y": -0.07971771564788219, "z": 0.54306214926515, "word": "Anguilliform", "pos_group": "adjective", "row_number": 6172, "definition": "Eel-shaped.", "details": []}, {"x": -0.8592617527183364, "y": -0.11999279882325188, "z": 0.49726348000428816, "word": "Angular", "pos_group": "noun", "row_number": 6181, "definition": "A bone in the base of the lower jaw of many birds reptiles and fishes.", "details": []}, {"x": -0.8241192671563806, "y": -0.12470725892561364, "z": 0.5525174504691145, "word": "Anisopleura", "pos_group": "other", "row_number": 6315, "definition": "A primary division of gastropods including those having spiral shells. The two sides of the body are unequally developed.", "details": []}, {"x": -0.8525893875816213, "y": -0.07701973797362988, "z": 0.51687454584809, "word": "Anisopoda", "pos_group": "other", "row_number": 6316, "definition": "A division of Crustacea which in some its characteristics is intermediate between Amphipoda and Isopoda.", "details": []}, {"x": -0.8458746347908279, "y": -0.1429423977594285, "z": 0.5138711639509157, "word": "Annelidan", "pos_group": "noun", "row_number": 6353, "definition": "One of the Annelida.", "details": []}, {"x": -0.8270467832593568, "y": -0.0934022720374872, "z": 0.5543190722666737, "word": "Anodon", "pos_group": "noun", "row_number": 6491, "definition": "A genus of fresh-water bivalves having no teeth at the hinge.", "details": []}, {"x": -0.8617167178821679, "y": -0.10023564813539984, "z": 0.4973903024439267, "word": "Anolis", "pos_group": "noun", "row_number": 6503, "definition": "A genus of lizards which belong to the family Iguanidae. They take the place in the New World of the chameleons in the Old and in America are often called chameleons.", "details": []}, {"x": -0.8293303491082499, "y": -0.14014284594689552, "z": 0.540898469934879, "word": "Anomia", "pos_group": "noun", "row_number": 6522, "definition": "A genus of bivalve shells allied to the oyster so called from their unequal valves of which the lower is perforated for attachment.", "details": []}, {"x": -0.8422942464370494, "y": -0.07409566015941571, "z": 0.5339009604454586, "word": "Anomoura", "pos_group": "other", "row_number": 6525, "definition": "A group of decapod Crustacea of which the hermit crab in an example.", "details": []}, {"x": -0.8557684041148025, "y": -0.13167210908784333, "z": 0.5003227900137701, "word": "Anomuran", "pos_group": "adjective", "row_number": 6527, "definition": "Irregular in the character of the tail or abdomen; as the anomural crustaceans.", "details": []}, {"x": -0.8226920726180378, "y": -0.11303882648363364, "z": 0.5571355107679281, "word": "Antennule", "pos_group": "noun", "row_number": 6721, "definition": "A small antenna; -- applied to the smaller pair of antennae or feelers of Crustacea.", "details": []}, {"x": -0.8580818602474496, "y": -0.08251538485777235, "z": 0.506839947494325, "word": "Anthobranchia", "pos_group": "other", "row_number": 6779, "definition": "A division of nudibranchiate Mollusca in which the gills form a wreath or cluster upon the posterior part of the back. See Nudibranchiata and Doris.", "details": []}, {"x": -0.839016611699811, "y": -0.14655226474409294, "z": 0.5239976707869471, "word": "Anthozoa", "pos_group": "other", "row_number": 6801, "definition": "The class of the Coelenterata which includes the corals and sea anemones. The three principal groups or orders are Acyonaria Actinaria and Madreporaria.", "details": []}, {"x": -0.8315214221184076, "y": -0.08248000012870002, "z": 0.5493352110842257, "word": "Anura", "pos_group": "other", "row_number": 7242, "definition": "One of the orders of amphibians characterized by the absence of a tail as the frogs and toads.", "details": []}, {"x": -0.8618514374865358, "y": -0.11277060602825481, "z": 0.4944642455409815, "word": "Aphrodite", "pos_group": "noun", "row_number": 7399, "definition": "A large marine annelid covered with long lustrous golden hairlike setae; the sea mouse.", "details": []}, {"x": -0.8244617821317554, "y": -0.13255852129251292, "z": 0.5501736164492734, "word": "Aplysia", "pos_group": "noun", "row_number": 7440, "definition": "A genus of marine mollusks of the order Tectibranchiata; the sea hare. Some of the species when disturbed throw out a deep purple liquor which colors the water to some distance. See Illust. in Appendix.", "details": []}, {"x": -0.8492259739159748, "y": -0.07267107126308049, "z": 0.5230049336554489, "word": "Apodal", "pos_group": "noun", "row_number": 7475, "definition": "Destitute of the ventral fin as the eels.", "details": []}, {"x": -0.8502512694240497, "y": -0.1414191334836704, "z": 0.5070240699685963, "word": "Apoda", "pos_group": "noun", "row_number": 7481, "definition": "An order of Amphibia without feet. See Ophiomorpha.", "details": []}, {"x": -0.823725448829679, "y": -0.10000420307841383, "z": 0.5580999411548035, "word": "Apodeme", "pos_group": "noun", "row_number": 7490, "definition": "One of the processes of the shell which project inwards and unite with one another in the thorax of many Crustacea.", "details": []}, {"x": -0.8619648874551734, "y": -0.09198622486009454, "z": 0.4985529733442362, "word": "Apodes", "pos_group": "other", "row_number": 7491, "definition": "An order of fishes without ventral fins including the eels.", "details": []}, {"x": -0.832065011499677, "y": -0.14564291991987238, "z": 0.5352158036860044, "word": "Aporosa", "pos_group": "other", "row_number": 7570, "definition": "A group of corals in which the coral is not porous; -- opposed to Perforata.", "details": []}, {"x": -0.8377576292536956, "y": -0.0742530718309653, "z": 0.5409700878522704, "word": "Appendicularia", "pos_group": "noun", "row_number": 7791, "definition": "A genus of small free-swimming Tunicata shaped somewhat like a tadpole and remarkable for resemblances to the larvae of other Tunicata. It is the type of the order Copelata or Larvalia. See Illustration in Appendix.", "details": []}, {"x": -0.8594677307230884, "y": -0.1258640644750892, "z": 0.49545277990895886, "word": "Appendiculata", "pos_group": "other", "row_number": 7792, "definition": "An order of annelids; the Polych/ta.", "details": []}, {"x": -0.8215524904032949, "y": -0.12142856312004814, "z": 0.557051711756408, "word": "Apron", "pos_group": "noun", "row_number": 8129, "definition": "The infolded abdomen of a crab.", "details": []}, {"x": -0.8557908152985719, "y": -0.0759418362636033, "z": 0.5117176154438281, "word": "Apus", "pos_group": "noun", "row_number": 8176, "definition": "A genus of fresh-water phyllopod crustaceans. See Phyllopod.", "details": []}, {"x": -0.8433032213955841, "y": -0.14777719604134512, "z": 0.5167219533888494, "word": "Aquatic", "pos_group": "noun", "row_number": 8197, "definition": "An aquatic animal or plant.", "details": []}, {"x": -0.8272505574642308, "y": -0.0872622314139829, "z": 0.5550151512740639, "word": "Ara", "pos_group": "noun", "row_number": 8224, "definition": "A name of the great blue and yellow macaw (Ara ararauna) native of South America.", "details": []}, {"x": -0.863595409486818, "y": -0.10443894323878489, "z": 0.49324991216264885, "word": "Arapaima", "pos_group": "noun", "row_number": 8290, "definition": "A large fresh-water food fish of South America.", "details": []}, {"x": -0.8259419672330757, "y": -0.14001726977712114, "z": 0.5460906801322635, "word": "Archer fish", "pos_group": "other", "row_number": 8448, "definition": "A small fish (Toxotes jaculator) of the East Indies; -- so called from its ejecting drops of water from its mouth at its prey. The name is also applied to Chaetodon rostratus.", "details": []}, {"x": -0.8450355069272185, "y": -0.07001365498970429, "z": 0.5301066686500383, "word": "Archimedes", "pos_group": "noun", "row_number": 8481, "definition": "An extinct genus of Bryzoa characteristic of the subcarboniferous rocks. Its form is that of a screw.", "details": []}, {"x": -0.8547046847348225, "y": -0.1377986105686416, "z": 0.5004912035367849, "word": "Archipelago", "pos_group": "noun", "row_number": 8485, "definition": "The Grecian Archipelago or Aegean Sea separating Greece from Asia Minor. It is studded with a vast number of small islands.", "details": []}, {"x": -0.8211209305128128, "y": -0.10799844458752932, "z": 0.5604433543547883, "word": "Archipterygium", "pos_group": "noun", "row_number": 8487, "definition": "The primitive form of fin like that of Ceratodus.", "details": []}, {"x": -0.86108014549438, "y": -0.08379026282925048, "z": 0.5015178709581369, "word": "Architeuthis", "pos_group": "noun", "row_number": 8502, "definition": "A genus of gigantic cephalopods allied to the squids found esp. in the North Atlantic and about New Zealand.", "details": []}, {"x": -0.8357493935749536, "y": -0.14966711168992414, "z": 0.5283206477296654, "word": "Arctogeal", "pos_group": "adjective", "row_number": 8542, "definition": "Of or pertaining to arctic lands; as the arctogeal fauna.", "details": []}, {"x": -0.8329587966640282, "y": -0.07653115640379386, "z": 0.548016993495195, "word": "Argentine", "pos_group": "noun", "row_number": 8655, "definition": "A fish of Europe (Maurolicus Pennantii) with silvery scales. The name is also applied to various fishes of the genus Argentina.", "details": []}, {"x": -0.8626003633193514, "y": -0.11841274159422908, "z": 0.49183232491313655, "word": "Argonaut", "pos_group": "noun", "row_number": 8678, "definition": "A cephalopod of the genus Argonauta.", "details": []}, {"x": -0.8215110706740217, "y": -0.1301112199161474, "z": 0.5551491972541747, "word": "Argonauta", "pos_group": "noun", "row_number": 8679, "definition": "A genus of Cephalopoda. The shell is called paper nautilus or paper sailor.", "details": []}, {"x": -0.852450495448467, "y": -0.0705858928842404, "z": 0.5180210271170445, "word": "Argulus", "pos_group": "noun", "row_number": 8696, "definition": "A genus of copepod Crustacea parasitic of fishes; a fish louse. See Branchiura.", "details": []}, {"x": -0.8480338500522174, "y": -0.14691400916297936, "z": 0.5091707602340036, "word": "Argus shell", "pos_group": "other", "row_number": 8717, "definition": "A species of shell (Cypraea argus) beautifully variegated with spots resembling those in a peacock's tail.", "details": []}, {"x": -0.8233785796555266, "y": -0.09389938573980329, "z": 0.5596700991853464, "word": "Aristotle's lantern", "pos_group": "other", "row_number": 8796, "definition": "The five united jaws and accessory ossicles of certain sea urchins.", "details": []}, {"x": -0.8643059768492358, "y": -0.09546964265829998, "z": 0.49382256501033345, "word": "Ark shell", "pos_group": "other", "row_number": 8811, "definition": "A marine bivalve shell belonging to the genus Arca and its allies.", "details": []}, {"x": -0.8285447614100108, "y": -0.14655389383170755, "z": 0.5404031222548524, "word": "Armadillo", "pos_group": "noun", "row_number": 8835, "definition": "Any edentate animal if the family Dasypidae peculiar to America. The body and head are incased in an armor composed of small bony plates. The armadillos burrow in the earth seldom going abroad except at night. When attacked they curl up into a ball presenting the armor on all sides. Their flesh is good food. There are several species one of which (the peba) is found as far north as Texas. See Peba Poyou Tatouay.", "details": []}, {"x": -0.8402279283899305, "y": -0.06935524552051232, "z": 0.537779581494459, "word": "Armadillo", "pos_group": "noun", "row_number": 8836, "definition": "A genus of small isopod Crustacea that can roll themselves into a ball.", "details": []}, {"x": -0.8589408319362994, "y": -0.1321575444008113, "z": 0.4947272285719934, "word": "Arrowworm", "pos_group": "noun", "row_number": 9106, "definition": "A peculiar transparent worm of the genus Sagitta living at the surface of the sea. See Sagitta.", "details": []}, {"x": -0.8194561431799805, "y": -0.11696412275988473, "z": 0.5610802290150686, "word": "Artemia", "pos_group": "noun", "row_number": 9152, "definition": "A genus of phyllopod Crustacea found in salt lakes and brines; the brine shrimp. See Brine shrimp.", "details": []}, {"x": -0.8590284765313937, "y": -0.07619072336472521, "z": 0.506226283574167, "word": "Arthropomata", "pos_group": "other", "row_number": 9196, "definition": "One of the orders of Branchiopoda. See Branchiopoda.", "details": []}, {"x": -0.840210526911024, "y": -0.15183705231506442, "z": 0.5205687082529757, "word": "Arthrostraca", "pos_group": "other", "row_number": 9198, "definition": "One of the larger divisions of Crustacea so called because the thorax and abdomen are both segmented; Tetradecapoda. It includes the Amphipoda and Isopoda.", "details": []}, {"x": -0.8281864892947877, "y": -0.08094373927223125, "z": 0.5545766403502799, "word": "Articulary", "pos_group": "noun", "row_number": 9220, "definition": "A bone in the base of the lower jaw of many birds reptiles amphibians and fishes.", "details": []}, {"x": -0.8649142084606094, "y": -0.10967643172799335, "z": 0.4897902534007515, "word": "Articulata", "pos_group": "verb", "row_number": 9223, "definition": "One of the subdivisions of the Brachiopoda including those that have the shells united by a hinge.", "details": []}, {"x": -0.8226500767666103, "y": -0.13854533928003984, "z": 0.5514091404389926, "word": "Articulata", "pos_group": "verb", "row_number": 9224, "definition": "A subdivision of the Crinoidea.", "details": []}, {"x": -0.8481920635378637, "y": -0.06688633158968585, "z": 0.5254488005484982, "word": "Asaphus", "pos_group": "noun", "row_number": 9343, "definition": "A genus of trilobites found in the Lower Silurian formation. See Illust. in Append.", "details": []}, {"x": -0.8529330002242539, "y": -0.14385847217219686, "z": 0.5018067726851981, "word": "Ascidioidea", "pos_group": "other", "row_number": 9403, "definition": "A group of Tunicata often shaped like a two-necked bottle. The group includes social and compound species. The gill is a netlike structure within the oral aperture. The integument is usually leathery in texture. See Illustration in Appendix.", "details": []}, {"x": -0.8201799295334817, "y": -0.10210577417038745, "z": 0.5629203265751902, "word": "Asiphonate", "pos_group": "adjective", "row_number": 9488, "definition": "Destitute of a siphon or breathing tube; -- said of many bivalve shells.", "details": []}, {"x": -0.8638547295492477, "y": -0.08638778702823537, "z": 0.4962783054776425, "word": "Asiphonate", "pos_group": "noun", "row_number": 9489, "definition": "An asiphonate mollusk.", "details": []}, {"x": -0.8321845577454076, "y": -0.15168104820966546, "z": 0.5333495302933126, "word": "Asiphonida", "pos_group": "other", "row_number": 9492, "definition": "A group of bivalve mollusks destitute of siphons as the oyster; the asiphonate mollusks.", "details": []}, {"x": -0.8350578711385029, "y": -0.07088795902780273, "z": 0.545576070877842, "word": "Aspidobranchia", "pos_group": "other", "row_number": 9610, "definition": "A group of Gastropoda with limpetlike shells including the abalone shells and keyhole limpets.", "details": []}, {"x": -0.862670378627704, "y": -0.12470087330609853, "z": 0.4901525375176897, "word": "Astacus", "pos_group": "noun", "row_number": 9993, "definition": "A genus of crustaceans containing the crawfish of fresh-water lobster of Europe and allied species of western North America. See Crawfish.", "details": []}, {"x": -0.8189023082736842, "y": -0.12640704494521118, "z": 0.5598395024399865, "word": "Astarte", "pos_group": "noun", "row_number": 9996, "definition": "A genus of bivalve mollusks common on the coasts of America and Europe.", "details": []}, {"x": -0.855847369666015, "y": -0.0697103249938237, "z": 0.5125092686235236, "word": "Asterias", "pos_group": "noun", "row_number": 10006, "definition": "A genus of echinoderms.", "details": []}, {"x": -0.8452217547633306, "y": -0.151877615802362, "z": 0.5123801080184378, "word": "Asteridian", "pos_group": "noun", "row_number": 10009, "definition": "A starfish; one of the Asterioidea.", "details": []}, {"x": -0.82373703220589, "y": -0.08737268041782047, "z": 0.5601993542385051, "word": "Asteridea", "pos_group": "other", "row_number": 10011, "definition": "A class of Echinodermata including the true starfishes. The rays vary in number and always have ambulacral grooves below. The body is star-shaped or pentagonal.", "details": []}, {"x": -0.8661997325722598, "y": -0.10010465204742809, "z": 0.48956826074635285, "word": "Asteriscus", "pos_group": "noun", "row_number": 10013, "definition": "The smaller of the two otoliths found in the inner ear of many fishes.", "details": []}, {"x": -0.8249814305285356, "y": -0.14618705950984834, "z": 0.5459258034888581, "word": "Asterolepis", "pos_group": "noun", "row_number": 10025, "definition": "A genus of fishes some of which were eighteen or twenty feet long found in a fossil state in the Old Red Sandstone.", "details": []}, {"x": -0.8432077874383404, "y": -0.06519415707230142, "z": 0.5336200418715275, "word": "Astraean", "pos_group": "noun", "row_number": 10075, "definition": "A coral of the family Astraeidae; a star coral.", "details": []}, {"x": -0.857705498363055, "y": -0.13863816222700556, "z": 0.49509669565863806, "word": "Astrophyton", "pos_group": "noun", "row_number": 10151, "definition": "A genus of ophiurans having the arms much branched.", "details": []}, {"x": -0.8178968904625703, "y": -0.11148924495374914, "z": 0.5644597636956077, "word": "Athecata", "pos_group": "other", "row_number": 10229, "definition": "A division of Hydroidea in which the zooids are naked or not inclosed in a capsule. See Tubularian.", "details": []}, {"x": -0.8621803605612259, "y": -0.07774347121272596, "z": 0.5006006178045633, "word": "Atherine", "pos_group": "noun", "row_number": 10253, "definition": "A small marine fish of the family Atherinidae having a silvery stripe along the sides. The European species (Atherina presbyter) is used as food. The American species (Menidia notata) is called silversides and sand smelt. See Silversides.", "details": []}, {"x": -0.8367090151462221, "y": -0.15498108212252973, "z": 0.5252607810956085, "word": "Atlanta", "pos_group": "noun", "row_number": 10281, "definition": "A genus of small glassy heteropod mollusks found swimming at the surface in mid ocean. See Heteropod.", "details": []}, {"x": -0.8298111767098617, "y": -0.07467613351164687, "z": 0.5530252128892006, "word": "Atrypa", "pos_group": "noun", "row_number": 10412, "definition": "A extinct genus of Branchiopoda very common in Silurian limestones.", "details": []}, {"x": -0.8656247860156687, "y": -0.1157521360377958, "z": 0.4871295236772407, "word": "Aurelia", "pos_group": "noun", "row_number": 10847, "definition": "A genus of jellyfishes. See Discophora.", "details": []}, {"x": -0.819568755610387, "y": -0.13578609132708805, "z": 0.5566589550428103, "word": "Auricula", "pos_group": "noun", "row_number": 10868, "definition": "A genus of air-breathing mollusks mostly found near the sea where the water is brackish", "details": []}, {"x": -0.8516447339914694, "y": -0.0648222439481217, "z": 0.5200954948412163, "word": "Auricula", "pos_group": "noun", "row_number": 10869, "definition": "One of the five arched processes of the shell around the jaws of a sea urchin.", "details": []}, {"x": -0.8505145690488762, "y": -0.1496336787053167, "z": 0.50421694738745, "word": "Avicula", "pos_group": "noun", "row_number": 11270, "definition": "A genus of marine bivalves having a pearly interior allied to the pearl oyster; -- so called from a supposed resemblance of the typical species to a bird.", "details": []}, {"x": -0.8198979515877366, "y": -0.09557254124218625, "z": 0.5644760741986716, "word": "Axolotl", "pos_group": "noun", "row_number": 11519, "definition": "An amphibian of the salamander tribe found in the elevated lakes of Mexico; the siredon.", "details": []}, {"x": -0.8663022650345316, "y": -0.09021443987305039, "z": 0.49130615753767215, "word": "Axstone", "pos_group": "noun", "row_number": 11520, "definition": "A variety of jade. It is used by some savages particularly the natives of the South Sea Islands for making axes or hatchets.", "details": []}, {"x": -0.8284449925489827, "y": -0.15252041937290536, "z": 0.5389029745648367, "word": "Bachelor", "pos_group": "noun", "row_number": 11718, "definition": "A kind of bass an edible fresh-water fish (Pomoxys annularis) of the southern United States.", "details": []}, {"x": -0.8377412351131069, "y": -0.0657516603398706, "z": 0.5420944033595223, "word": "Backboned", "pos_group": "adjective", "row_number": 11785, "definition": "Vertebrate.", "details": []}, {"x": -0.8620526897035781, "y": -0.13141297032969476, "z": 0.48948523103762076, "word": "Baculite", "pos_group": "noun", "row_number": 11898, "definition": "A cephalopod of the extinct genus Baculites found fossil in the Cretaceous rocks. It is like an uncoiled ammonite.", "details": []}, {"x": -0.8167255244304663, "y": -0.12157144396772052, "z": 0.5640742874439352, "word": "Badderlocks", "pos_group": "noun", "row_number": 11903, "definition": "A large black seaweed (Alaria esculenta) sometimes eaten in Europe; -- also called murlins honeyware and henware.", "details": []}, {"x": -0.859293176299932, "y": -0.0700813989502675, "z": 0.50665948593266, "word": "Bag net", "pos_group": "other", "row_number": 11983, "definition": "A bag-shaped net for catching fish.", "details": []}, {"x": -0.841906507062845, "y": -0.1561305830132124, "z": 0.5165430034500459, "word": "Balaenoidea", "pos_group": "noun", "row_number": 12085, "definition": "A division of the Cetacea including the right whale and all other whales having the mouth fringed with baleen. See Baleen.", "details": []}, {"x": -0.8247893816141004, "y": -0.0806506018579655, "z": 0.5596587856869376, "word": "Balanite", "pos_group": "noun", "row_number": 12118, "definition": "A fossil balanoid shell.", "details": []}, {"x": -0.8675717300228688, "y": -0.10573731152724913, "z": 0.4859412662206368, "word": "Balanoglossus", "pos_group": "noun", "row_number": 12119, "definition": "A peculiar marine worm. See Enteropneusta and Tornaria.", "details": []}, {"x": -0.8214957253930208, "y": -0.14454279997314703, "z": 0.5515905656706951, "word": "Balanoid", "pos_group": "adjective", "row_number": 12120, "definition": "Resembling an acorn; -- applied to a group of barnacles having shells shaped like acorns. See Acornshell and Barnacle.", "details": []}, {"x": -0.8465940576815845, "y": -0.06192266705936507, "z": 0.5286247107376697, "word": "Balearic", "pos_group": "adjective", "row_number": 12166, "definition": "Of or pertaining to the isles of Majorca Minorca Ivica etc. in the Mediterranean Sea off the coast of Valencia.", "details": []}, {"x": -0.8557929681297639, "y": -0.14508095451562933, "z": 0.4965580654228493, "word": "Baleen", "pos_group": "noun", "row_number": 12167, "definition": "Plates or blades of \"\"\"\"whalebone \" from two to twelve feet long and sometimes a foot wide which in certain whales (Balaenoidea) are attached side by side along the upper jaw and form a fringelike sieve by which the food is retained in the mouth.", "details": []}, {"x": -0.816931645835466, "y": -0.10518211462103719, "z": 0.5670620854865929, "word": "Balistoid", "pos_group": "adjective", "row_number": 12175, "definition": "Like a fish of the genus Balistes; of the family Balistidae. See Filefish.", "details": []}, {"x": -0.8651316952616087, "y": -0.08056248325781688, "z": 0.4950321566778355, "word": "Balloon fish", "pos_group": "other", "row_number": 12260, "definition": "A fish of the genus Diodon or the genus Tetraodon having the power of distending its body by taking air or water into its dilatable esophagus. See Globefish and Bur fish.", "details": []}, {"x": -0.832910623806126, "y": -0.15708691387318274, "z": 0.5306445083487524, "word": "Band fish", "pos_group": "other", "row_number": 12390, "definition": "A small red fish of the genus Cepola; the ribbon fish.", "details": []}, {"x": -0.8320745144928604, "y": -0.06867675201047627, "z": 0.5503957722082922, "word": "Banstickle", "pos_group": "noun", "row_number": 12535, "definition": "A small fish the three-spined stickleback.", "details": []}, {"x": -0.8656891945293985, "y": -0.12246859051936082, "z": 0.4853696146353233, "word": "Barb", "pos_group": "noun", "row_number": 12606, "definition": "A southern name for the kingfishes of the eastern and southeastern coasts of the United States; -- also improperly called whiting.", "details": []}, {"x": -0.8168037430834795, "y": -0.13181311892121833, "z": 0.5616555412039287, "word": "Barbel", "pos_group": "noun", "row_number": 12663, "definition": "A slender tactile organ on the lips of certain fished.", "details": []}, {"x": -0.85527590065312, "y": -0.06391008304656537, "z": 0.5142165254510747, "word": "Barbel", "pos_group": "noun", "row_number": 12664, "definition": "A large fresh-water fish ( Barbus vulgaris) found in many European rivers. Its upper jaw is furnished with four barbels.", "details": []}, {"x": -0.8475168890414227, "y": -0.15492044967971047, "z": 0.5076561602704976, "word": "Barber fish", "pos_group": "other", "row_number": 12672, "definition": "See Surgeon fish.", "details": []}, {"x": -0.8202930300376307, "y": -0.08860994671571047, "z": 0.5650377175151424, "word": "Barnacle", "pos_group": "noun", "row_number": 12832, "definition": "Any cirriped crustacean adhering to rocks floating timber ships etc. esp. (a) the sessile species (genus Balanus and allies) and (b) the stalked or goose barnacles (genus Lepas and allies). See Cirripedia and Goose barnacle.", "details": []}, {"x": -0.868328924947535, "y": -0.095162855320014, "z": 0.4867739815014771, "word": "Barnacle", "pos_group": "other", "row_number": 12835, "definition": "Spectacles; -- so called from their resemblance to the barnacles used by farriers.", "details": []}, {"x": -0.8246506994026429, "y": -0.15213250337145268, "z": 0.5447998948170482, "word": "Barracouata", "pos_group": "noun", "row_number": 12879, "definition": "A voracious pikelike marine fish of the genus Sphyraena sometimes used as food.", "details": []}, {"x": -0.8409259690824186, "y": -0.06130687496674665, "z": 0.5376662362512704, "word": "Barracouata", "pos_group": "noun", "row_number": 12880, "definition": "A large edible fresh-water fish of Australia and New Zealand (Thyrsites atun).", "details": []}, {"x": -0.8607495784173566, "y": -0.1383300723616596, "z": 0.4898723857646612, "word": "Barse", "pos_group": "noun", "row_number": 12938, "definition": "The common perch. See 1st Bass.", "details": []}, {"x": -0.815060063703063, "y": -0.11574237017350338, "z": 0.5676978036798964, "word": "Bashaw", "pos_group": "noun", "row_number": 13048, "definition": "A very large siluroid fish (Leptops olivaris) of the Mississippi valley; -- also called goujon mud cat and yellow cat.", "details": []}, {"x": -0.8626689184081507, "y": -0.07171456969266735, "z": 0.5006589235260939, "word": "Basilisk", "pos_group": "noun", "row_number": 13095, "definition": "A lizard of the genus Basiliscus belonging to the family Iguanidae.", "details": []}, {"x": -0.8381840287954725, "y": -0.15951257280082548, "z": 0.5215393302433212, "word": "Basipodite", "pos_group": "noun", "row_number": 13109, "definition": "The basal joint of the legs of Crustacea.", "details": []}, {"x": -0.8265131995357727, "y": -0.0739536333154673, "z": 0.5580383419735431, "word": "Basipterygium", "pos_group": "noun", "row_number": 13110, "definition": "A bar of cartilage at the base of the embryonic fins of some fishes. It develops into the metapterygium.", "details": []}, {"x": -0.8683592846193293, "y": -0.112203152425019, "z": 0.48307619005835345, "word": "Basking shark", "pos_group": "other", "row_number": 13133, "definition": "One of the largest species of sharks (Cetorhinus maximus) so called from its habit of basking in the sun; the liver shark or bone shark. It inhabits the northern seas of Europe and America and grows to a length of more than forty feet. It is a harmless species.", "details": []}, {"x": -0.8182022570835048, "y": -0.14164317681702981, "z": 0.5572093654674498, "word": "Basommatophora", "pos_group": "other", "row_number": 13135, "definition": "A group of Pulmonifera having the eyes at the base of the tentacles including the common pond snails.", "details": []}, {"x": -0.8502806178959393, "y": -0.05967238520985607, "z": 0.522936016424444, "word": "Bass", "pos_group": "noun", "row_number": 13145, "definition": "An edible spiny-finned fish esp. of the genera Roccus Labrax and related genera. There are many species.", "details": []}, {"x": -0.8532450723207826, "y": -0.15127023021532954, "z": 0.4990893346996144, "word": "Bass", "pos_group": "noun", "row_number": 13146, "definition": "The two American fresh-water species of black bass (genus Micropterus). See Black bass.", "details": []}, {"x": -0.8166047199950904, "y": -0.09822886538695423, "z": 0.5687774795880474, "word": "Bass", "pos_group": "noun", "row_number": 13147, "definition": "Species of Serranus the sea bass and rock bass. See Sea bass.", "details": []}, {"x": -0.8677755283040655, "y": -0.08458900382805651, "z": 0.48970433213111064, "word": "Bass", "pos_group": "noun", "row_number": 13148, "definition": "The southern red or channel bass (Sciaena ocellata). See Redfish.", "details": []}, {"x": -0.8289285642639288, "y": -0.15805531540295015, "z": 0.536559365420282, "word": "Batfish", "pos_group": "noun", "row_number": 13270, "definition": "A name given to several species of fishes: (a) The Malthe vespertilio of the Atlantic coast. (b) The flying gurnard of the Atlantic (Cephalacanthus spinarella). (c) The California batfish or sting ray (Myliobatis Californicus.)", "details": []}, {"x": -0.834916573307097, "y": -0.06315028725483293, "z": 0.546741581404567, "word": "Batoidei", "pos_group": "other", "row_number": 13311, "definition": "The division of fishes which includes the rays and skates.", "details": []}, {"x": -0.8650826891188602, "y": -0.12962349202894932, "z": 0.4845922938936424, "word": "Batrachia", "pos_group": "other", "row_number": 13316, "definition": "The order of amphibians which includes the frogs and toads; the Anura. Sometimes the word is used in a wider sense as equivalent to Amphibia.", "details": []}, {"x": -0.8144512672361722, "y": -0.12671998701408832, "z": 0.5662253775560951, "word": "Batrachoid", "pos_group": "adjective", "row_number": 13319, "definition": "Froglike. Specifically: Of or pertaining to the Batrachidae a family of marine fishes including the toadfish. Some have poisonous dorsal spines.", "details": []}, {"x": -0.8589685880433957, "y": -0.06421397626989957, "z": 0.5079857576806104, "word": "Bayatte", "pos_group": "noun", "row_number": 13480, "definition": "A large edible siluroid fish of the Nile of two species (Bagrina bayad and B. docmac).", "details": []}, {"x": -0.8440161539147321, "y": -0.15953100154793304, "z": 0.5120415915490625, "word": "Beadsnake", "pos_group": "noun", "row_number": 13575, "definition": "A small poisonous snake of North America (Elaps fulvius) banded with yellow red and black.", "details": []}, {"x": -0.821369715625489, "y": -0.0814304794229715, "z": 0.5645536885666843, "word": "Beard", "pos_group": "noun", "row_number": 13691, "definition": "The appendages to the jaw in some Cetacea and to the mouth or jaws of some fishes.", "details": []}, {"x": -0.8698519688925537, "y": -0.10110756239504597, "z": 0.48284035978807727, "word": "Beard", "pos_group": "noun", "row_number": 13692, "definition": "The byssus of certain shellfish as the muscle.", "details": []}, {"x": -0.820918971709124, "y": -0.15048999036142693, "z": 0.5508582437334056, "word": "Beard", "pos_group": "noun", "row_number": 13693, "definition": "The gills of some bivalves as the oyster.", "details": []}, {"x": -0.8445219286053067, "y": -0.05771904353177197, "z": 0.5324013750156461, "word": "Beard", "pos_group": "other", "row_number": 13704, "definition": "To deprive of the gills; -- used only of oysters and similar shellfish.", "details": []}, {"x": -0.8587767275220608, "y": -0.14523580278665246, "z": 0.49133399419887186, "word": "Bear's-paw", "pos_group": "noun", "row_number": 13744, "definition": "A large bivalve shell of the East Indies (Hippopus maculatus) often used as an ornament.", "details": []}, {"x": -0.8139728031456737, "y": -0.10907335539313046, "z": 0.5705710112531641, "word": "Becker", "pos_group": "noun", "row_number": 13883, "definition": "A European fish (Pagellus centrodontus); the sea bream or braise.", "details": []}, {"x": -0.8658604482139686, "y": -0.07459969267338834, "z": 0.49469239944812327, "word": "Becuna", "pos_group": "noun", "row_number": 13908, "definition": "A fish of the Mediterranean (Sphyraena spet). See Barracuda.", "details": []}, {"x": -0.8341556860992362, "y": -0.1618852771854602, "z": 0.5272356668311611, "word": "Belemnite", "pos_group": "noun", "row_number": 14404, "definition": "A conical calcareous fossil tapering to a point at the lower extremity with a conical cavity at the other end where it is ordinarily broken; but when perfect it contains a small chambered cone called the phragmocone prolonged on one side into a delicate concave blade; the thunderstone. It is the internal shell of a cephalopod related to the sepia and belonging to an extinct family. The belemnites are found in rocks of the Jurassic and Cretaceous ages.", "details": []}, {"x": -0.8288731254862219, "y": -0.06749561351678146, "z": 0.5553500553729108, "word": "Bell animalcule", "pos_group": "other", "row_number": 14467, "definition": "An infusorian of the family Vorticellidae common in fresh-water ponds.", "details": []}, {"x": -0.8685132952302983, "y": apturus albidus a large oceanic species related to the swordfish; the spearfish.", "details": []}, {"x": -0.813516695336892, "y": -0.10173362941372022, "z": 0.5725738861094298, "word": "Billfish", "pos_group": "noun", "row_number": 15841, "definition": "The American fresh-water garpike (Lepidosteus osseus).", "details": []}, {"x": -0.8687596906749376, "y": -0.07869917236264644, "z": 0.48894073273539107, "word": "Bimuscular", "pos_group": "adjective", "row_number": 15889, "definition": "Having two adductor muscles as a bivalve mollusk.", "details": []}, {"x": -0.8299278873527779, "y": -0.16313509893055742, "z": 0.5334853712062516, "word": "Binny", "pos_group": "noun", "row_number": 15941, "definition": "A large species of barbel (Barbus bynni) found in the Nile and much esteemed for food.", "details": []}, {"x": -0.8318202561091014, "y": -0.06148152581550725, "z": 0.5516294802763774, "word": "Bipinnaria", "pos_group": "noun", "row_number": 16023, "definition": "The larva of certain starfishes as developed in the free-swimming stage.", "details": []}, {"x": -0.8679995699384493, "y": -0.1269149520118304, "z": 0.4800722253395854, "word": "Birk", "pos_group": "noun", "row_number": 16105, "definition": "A small European minnow (Leuciscus phoxinus).", "details": []}, {"x": -0.8126141478808568, "y": -0.13229263390640078, "z": 0.5675886764885077, "word": "Birt", "pos_group": "noun", "row_number": 16121, "definition": "A fish of the turbot kind; the brill.", "details": []}, {"x": -0.8581139009743609, "y": -0.058637246557089004, "z": 0.5101001923845628, "word": "Bismer", "pos_group": "noun", "row_number": 16205, "definition": "The fifteen-spined (Gasterosteus spinachia).", "details": []}, {"x": -0.8464710607473616, "y": -0.16208178423747482, "z": 0.5071649027048633, "word": "Bisque", "pos_group": "noun", "row_number": 16221, "definition": "A white soup made of crayfish.", "details": []}, {"x": -0.8179700830903275, "y": -0.08317106922852001, "z": 0.5692165812874637, "word": "Bitterling", "pos_group": "noun", "row_number": 16305, "definition": "A roachlike European fish (Rhodima amarus).", "details": []}, {"x": -0.871759543594142, "y": -0.09591007106067842, "z": 0.4804545310658118, "word": "Bivalve", "pos_group": "noun", "row_number": 16344, "definition": "A mollusk having a shell consisting of two lateral plates or valves joined together by an elastic ligament at the hinge which is usually strengthened by prominences called teeth. The shell is closed by the contraction of two transverse muscles attached to the inner surface as in the clam -- or by one as in the oyster. See Mollusca.", "details": []}, {"x": -0.8208709626819309, "y": -0.15631632362124792, "z": 0.5493050787997295, "word": "Bivalve", "pos_group": "adjective", "row_number": 16346, "definition": "Having two shells or valves which open and shut as the oyster and certain seed vessels.", "details": []}, {"x": -0.8420432437203839, "y": -0.05425836679917566, "z": 0.5366742078180581, "word": "Bivalved", "pos_group": "adjective", "row_number": 16347, "definition": "Having two valves as the oyster and some seed pods; bivalve.", "details": []}, {"x": -0.861832752591671, "y": -0.1444179549002586, "z": 0.486197244811908, "word": "Black bass", "pos_group": "other", "row_number": 16400, "definition": "An edible fresh-water fish of the United States of the genus Micropterus. the small-mouthed kind is M. dolomiei; the large-mouthed is M. salmoides.", "details": []}, {"x": -0.8113127500619948, "y": -0.11365619518721129, "z": 0.5734578370572765, "word": "Black bass", "pos_group": "other", "row_number": 16401, "definition": "The sea bass. See Blackfish 3.", "details": []}, {"x": -0.866078085362014, "y": -0.06858770219185706, "z": 0.4951812568784375, "word": "Blackfish", "pos_group": "noun", "row_number": 16431, "definition": "A small kind of whale of the genus Globicephalus of several species. The most common is G. melas. Also sometimes applied to other whales of larger size.", "details": []}, {
