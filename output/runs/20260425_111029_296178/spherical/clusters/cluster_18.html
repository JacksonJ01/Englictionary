mal.", "details": []}, {"x": -0.8503120594415063, "y": -0.2217123935182916, "z": 0.47729761797932174, "word": "Hornbeak", "pos_group": "noun", "row_number": 73821, "definition": "A fish. See Hornfish.", "details": []}, {"x": -0.7830262792889296, "y": -0.0564726820137127, "z": 0.6194196333093693, "word": "Hornel", "pos_group": "noun", "row_number": 73832, "definition": "The European sand eel.", "details": []}, {"x": -0.9020026407723167, "y": -0.0734580933782838, "z": 0.4254352413199854, "word": "Horner", "pos_group": "noun", "row_number": 73836, "definition": "The British sand lance or sand eel (Ammodytes lanceolatus).", "details": []}, {"x": -0.7937938628647997, "y": -0.21377433711583022, "z": 0.5693784647041605, "word": "Hornyhead", "pos_group": "noun", "row_number": 73862, "definition": "Any North American river chub of the genus Hybopsis esp. H. biguttatus.", "details": []}, {"x": -0.8343457008038371, "y": 0.010243951237641482, "z": 0.5511463626054286, "word": "Horsefish", "pos_group": "noun", "row_number": 73937, "definition": "The moonfish (Selene setipinnis).", "details": []}, {"x": -0.8827981385034624, "y": -0.17982635505415331, "z": 0.4339699628807959, "word": "Horsefoot", "pos_group": "noun", "row_number": 73946, "definition": "The Limulus or horseshoe crab.", "details": []}, {"x": -0.7707093933297512, "y": -0.12360852471494542, "z": 0.6250823654936055, "word": "Horsehead", "pos_group": "noun", "row_number": 73949, "definition": "The silver moonfish (Selene vomer).", "details": []}, {"x": -0.8875684551095038, "y": -0.0163182412878579, "z": 0.46038674231107046, "word": "Horseman", "pos_group": "noun", "row_number": 73963, "definition": "A land crab of the genus Ocypoda living on the coast of Brazil and the West Indies noted for running very swiftly.", "details": []}, {"x": -0.8273238623113055, "y": -0.2308715711397282, "z": 0.5120874383245282, "word": "Horseman", "pos_group": "noun", "row_number": 73964, "definition": "A West Indian fish of the genus Eques as the light-horseman (E. lanceolatus).", "details": []}, {"x": -0.7992308443696118, "y": -0.02170716579642136, "z": 0.6006320473978423, "word": "Horseshoe", "pos_group": "noun", "row_number": 73977, "definition": "Anything shaped like a horsehoe crab.", "details": []}, {"x": -0.9009541670595962, "y": -0.11556376404601779, "z": 0.4182422806190996, "word": "Horseshoe", "pos_group": "noun", "row_number": 73978, "definition": "The Limulus of horsehoe crab.", "details": []}, {"x": -0.7789744204082982, "y": -0.1864283881649788, "z": 0.598701351623465, "word": "Hound", "pos_group": "noun", "row_number": 74128, "definition": "A houndfish.", "details": []}, {"x": -0.8571108776300732, "y": 0.012058826572758459, "z": 0.5149908039469189, "word": "Houndfish", "pos_group": "noun", "row_number": 74135, "definition": "Any small shark of the genus Galeus or Mustelus of which there are several species as the smooth houndfish (G. canis) of Europe and America; -- called also houndshark and dogfish.", "details": []}, {"x": -0.863894808865473, "y": -0.2098533860637101, "z": 0.4578725975343833, "word": "Huchen", "pos_group": "noun", "row_number": 74306, "definition": "A large salmon (Salmo / Salvelinus hucho) inhabiting the Danube; -- called also huso and bull trout.", "details": []}, {"x": -0.775666296956531, "y": -0.08110486826350193, "z": 0.6259103738633052, "word": "Hudsonian", "pos_group": "adjective", "row_number": 74332, "definition": "Of or pertaining to Hudson's Bay or to the Hudson River; as the Hudsonian curlew.", "details": []}, {"x": -0.8990260598744129, "y": -0.0489551967969526, "z": 0.43515001134466297, "word": "Humpback", "pos_group": "noun", "row_number": 74569, "definition": "Any whale of the genus Megaptera characterized by a hump or bunch on the back. Several species are known. The most common ones in the North Atlantic are Megaptera longimana of Europe and M. osphyia of America; that of the California coasts is M. versabilis.", "details": []}, {"x": -0.8053105172661694, "y": -0.22523995809797767, "z": 0.5483994274764661, "word": "Humpback", "pos_group": "noun", "row_number": 74570, "definition": "A small salmon (Oncorhynchus gorbuscha) of the northwest coast of America.", "details": []}, {"x": -0.8200931288201466, "y": 0.0026675272333187222, "z": 0.5722238586081867, "word": "Huso", "pos_group": "noun", "row_number": 74780, "definition": "A large European sturgeon (Acipenser huso) inhabiting the region of the Black and Caspian Seas. It sometimes attains a length of more than twelve feet and a weight of two thousand pounds. Called also hausen.", "details": []}, {"x": -0.8920581824740913, "y": -0.157142195506632, "z": 0.42371987146271084, "word": "Huso", "pos_group": "noun", "row_number": 74781, "definition": "The huchen a large salmon.", "details": []}, {"x": -0.7710714075529121, "y": -0.14946085848007923, "z": 0.6189590747672811, "word": "Hyalea", "pos_group": "noun", "row_number": 74837, "definition": "A pteroid of the genus Cavolina. See Pteropoda and Illustration in Appendix.", "details": []}, {"x": -0.8775258016866209, "y": -0.0008493820507533814, "z": 0.47952867059685317, "word": "Hyalonema", "pos_group": "noun", "row_number": 74847, "definition": "A genus of hexactinelline sponges having a long stem composed of very long slender transparent siliceous fibres twisted together like the strands of a color. The stem of the Japanese species (H. Sieboldii) called glass-rope has long been in use as an ornament. See Glass-rope.", "details": []}, {"x": -0.8415368289786175, "y": -0.22778797500820014, "z": 0.48982487065713254, "word": "Hyalospongia", "pos_group": "other", "row_number": 74849, "definition": "An order of vitreous sponges having glassy six-rayed siliceous spicules; -- called also Hexactinellinae.", "details": []}, {"x": -0.7880723119520295, "y": -0.04170675623830574, "z": 0.6141681997780913, "word": "Hybodont", "pos_group": "adjective", "row_number": 74855, "definition": "Of pertaining to or resembling an extinct genus of sharks (Hybodus) especially in the form of the teeth which consist of a principal median cone with smaller lateral ones.", "details": []}, {"x": -0.902951005799674, "y": -0.08911278550277899, "z": 0.4204026553023812, "word": "Hybodus", "pos_group": "noun", "row_number": 74856, "definition": "An extinct genus of sharks having conical compressed teeth.", "details": []}, {"x": -0.7869553718044797, "y": -0.2054045243866326, "z": 0.5818163147846358, "word": "Hydatiform", "pos_group": "adjective", "row_number": 74873, "definition": "Resembling a hydatid.", "details": []}, {"x": -0.8430971296761322, "y": 0.01361319816580545, "z": 0.5375889793955655, "word": "Hydra", "pos_group": "noun", "row_number": 74878, "definition": "A serpent or monster in the lake or marsh of Lerna in the Peloponnesus represented as having many heads one of which when cut off was immediately succeeded by two others unless the wound was cauterized. It was slain by Hercules. Hence a terrible monster.", "details": []}, {"x": -0.8763411794721248, "y": -0.19312343422800268, "z": 0.4412816292498338, "word": "Hydra", "pos_group": "noun", "row_number": 74880, "definition": "Any small fresh-water hydroid of the genus Hydra usually found attached to sticks stones etc. by a basal sucker.", "details": []}, {"x": -0.7710884416148599, "y": -0.10731114223450657, "z": 0.6276200554159277, "word": "Hydrachnid", "pos_group": "noun", "row_number": 74882, "definition": "An aquatic mite of the genus Hydrachna. The hydrachnids while young are parasitic on fresh-water mussels.", "details": []}, {"x": -0.893082416805514, "y": -0.0270050281632698, "z": 0.44908186920284726, "word": "Hydractinian", "pos_group": "noun", "row_number": 74885, "definition": "Any species or marine hydroids of the genus Hydractinia and allied genera. These hydroids form by their rootstalks a firm chitinous coating on shells and stones and esp. on spiral shells occupied by hermit crabs. See Illust. of Athecata.", "details": []}, {"x": -0.8184200847019728, "y": -0.2313642002560607, "z": 0.5259840033653963, "word": "Hydranth", "pos_group": "noun", "row_number": 74893, "definition": "One of the nutritive zooids of a hydroid colony. Also applied to the proboscis or manubrium of a hydroid medusa. See Illust. of Hydroidea.", "details": []}, {"x": -0.8064601129651715, "y": -0.010234142264773238, "z": 0.5911999226389557, "word": "Hydrobranchiata", "pos_group": "other", "row_number": 74928, "definition": "An extensive artificial division of gastropod mollusks including those that breathe by gills as contrasted with the Pulmonifera.", "details": []}, {"x": -0.8988100439193437, "y": -0.1319475468015633, "z": 0.41800759543668187, "word": "Hydrocorallia", "pos_group": "other", "row_number": 74948, "definition": "A division of Hydroidea including those genera that secrete a stony coral as Millepora and Stylaster. Two forms of zooids in life project from small pores in the coral and resemble those of other hydroids. See Millepora.", "details": []}, {"x": -0.7745137023158737, "y": -0.17368727641580506, "z": 0.6082444039497757, "word": "Hydromedusa", "pos_group": "noun", "row_number": 74997, "definition": "Any medusa or jellyfish which is produced by budding from a hydroid. They are called also Craspedota and naked-eyed medusae.", "details": []}, {"x": -0.8654491539094183, "y": 0.009708234738590851, "z": 0.500902697313293, "word": "Hydrophid", "pos_group": "noun", "row_number": 75024, "definition": "Any sea snake of the genus Hydrophys and allied genera. These snakes are venomous live upon fishes and have a flattened tail for swimming.", "details": []}, {"x": -0.8556677740996798, "y": -0.21908615357265607, "z": 0.4688644982082114, "word": "Hydrosoma", "pos_group": "noun", "row_number": 75054, "definition": "All the zooids of a hydroid colony collectively including the nutritive and reproductive zooids and often other kinds.", "details": []}, {"x": -0.7790705021531523, "y": -0.06507957390125545, "z": 0.6235493578985276, "word": "Hydrotheca", "pos_group": "noun", "row_number": 75073, "definition": "One of the calicles which in some Hydroidea (Thecaphora) protect the hydrants. See Illust. of Hydroidea and Campanularian.", "details": []}, {"x": -0.9018482153261493, "y": -0.063308163741613, "z": 0.4273896031921046, "word": "Hydrozoon", "pos_group": "noun", "row_number": 75095, "definition": "One of the Hydrozoa.", "details": []}, {"x": -0.7973507306345697, "y": -0.22005112790290257, "z": 0.5619691392462562, "word": "Hymenium", "pos_group": "noun", "row_number": 75166, "definition": "The spore-bearing surface of certain fungi as that on the gills of a mushroom.", "details": []}, {"x": -0.8286236654021272, "y": 0.009427160764579886, "z": 0.5597266741682606, "word": "Hyoganoidei", "pos_group": "other", "row_number": 75196, "definition": "A division of ganoid fishes including the gar pikes and bowfins.", "details": []}, {"x": -0.8870494459982315, "y": -0.17225782722330152, "z": 0.4283345903782905, "word": "Hyopastron", "pos_group": "noun", "row_number": 75208, "definition": "The second lateral plate in the plastron of turtles; -- called also hyosternum.", "details": []}, {"x": -0.7695349304698527, "y": -0.13387359783691652, "z": 0.6244148065100303, "word": "Hyosternal", "pos_group": "adjective", "row_number": 75214, "definition": "Pertaining to the hyosternum of turtles.", "details": []}, {"x": -0.8844165925616964, "y": -0.008668419438118994, "z": 0.4666177764573522, "word": "Hyperotreta", "pos_group": "other", "row_number": 75292, "definition": "An order of marsipobranchs including the Myxine or hagfish and the genus Bdellostoma. They have barbels around the mouth one tooth on the plate and a communication between the nasal aperture and the throat. See Hagfish.", "details": []}, {"x": -0.8325188916091919, "y": -0.23180096200273007, "z": 0.5031705566986324, "word": "Hypoarion", "pos_group": "noun", "row_number": 75348, "definition": "An oval lobe beneath each of the optic lobes in many fishes; one of the inferior lobes.", "details": []}, {"x": -0.7940921434448924, "y": -0.027909954797421834, "z": 0.6071562419528453, "word": "#NAME?", "pos_group": "other", "row_number": 75388, "definition": "of Hypodactylum", "details": []}, {"x": -0.9027056247233636, "y": -0.10540180305429758, "z": 0.41714867254457993, "word": "Hypohyal", "pos_group": "adjective", "row_number": 75412, "definition": "Pertaining to one or more small elements in the hyoidean arch of fishes between the caratohyal and urohyal.", "details": []}, {"x": -0.780903798257123, "y": -0.19512893077769397, "z": 0.5933919094840716, "word": "Hypoplastron", "pos_group": "noun", "row_number": 75428, "definition": "The third lateral plate in the plastron of turtles; -- called also hyposternum.", "details": []}, {"x": -0.8518823302018542, "y": 0.014805349051765608, "z": 0.5235239222130298, "word": "Hyporhachides", "pos_group": "other", "row_number": 75434, "definition": "of Hyporhachis", "details": []}, {"x": -0.8690470166773346, "y": -0.2051155925945515, "z": 0.45020537144597755, "word": "Hypostoma", "pos_group": "noun", "row_number": 75455, "definition": "The lower lip of trilobites crustaceans etc.", "details": []}, {"x": -0.7726691044078884, "y": -0.09076033904665055, "z": 0.628287367332536, "word": "Hypotarsi", "pos_group": "other", "row_number": 75464, "definition": "of Hypotarsus", "details": []}, {"x": -0.8976614631484947, "y": -0.03937168307768467, "z": 0.43892341945917424, "word": "Hypural", "pos_group": "adjective", "row_number": 75500, "definition": "Under the tail; -- applied to the bones which support the caudal fin rays in most fishes.", "details": []}, {"x": -0.8096933377638516, "y": -0.22963190033173614, "z": 0.540061005008572, "word": "Ianthina", "pos_group": "noun", "row_number": 75552, "definition": "Any gastropod of the genus Ianthina of which various species are found living in mid ocean; -- called also purple shell and violet snail.", "details": []}, {"x": -0.8143639795675301, "y": -0.0003627427427648635, "z": 0.5803543548562706, "word": "Ichneumonidan", "pos_group": "noun", "row_number": 75602, "definition": "One of the Ichneumonidae.", "details": []}, {"x": -0.8954935714881995, "y": -0.14819488799852673, "z": 0.41967789862513966, "word": "Ichnolite", "pos_group": "noun", "row_number": 75608, "definition": "A fossil footprint; an ichnite.", "details": []}, {"x": -0.7711077631112455, "y": -0.15954463034839275, "z": 0.61639137615363, "word": "Ichthidin", "pos_group": "noun", "row_number": 75617, "definition": "A substance from the egg yolk of osseous fishes.", "details": []}, {"x": -0.8734045706235517, "y": 0.005153180084395719, "z": 0.48696806953732313, "word": "Ichthin", "pos_group": "noun", "row_number": 75618, "definition": "A nitrogenous substance resembling vitellin present in the egg yolk of cartilaginous fishes.", "details": []}, {"x": -0.8469501890265176, "y": -0.22646898704027607, "z": 0.4810272083956345, "word": "Ichthyic", "pos_group": "adjective", "row_number": 75621, "definition": "Like or pertaining to fishes.", "details": []}, {"x": -0.783581801803794, "y": -0.04957761374556235, "z": 0.619307371260197, "word": "Ichthyocolla", "pos_group": "noun", "row_number": 75623, "definition": "Fish glue; isinglass; a glue prepared from the sounds of certain fishes.", "details": []}, {"x": -0.9035279955248637, "y": -0.07874036414146436, "z": 0.42123285289456147, "word": "Ichthyocoprolite", "pos_group": "noun", "row_number": 75624, "definition": "Fossil dung of fishes.", "details": []}, {"x": -0.7899686648586827, "y": -0.21274622588267716, "z": 0.5750552598786203, "word": "Ichthyography", "pos_group": "noun", "row_number": 75626, "definition": "A treatise on fishes.", "details": []}, {"x": -0.8374452193630638, "y": 0.014144688443601835, "z": 0.54633820327228, "word": "Ichthyoidal", "pos_group": "adjective", "row_number": 75628, "definition": "Somewhat like a fish; having some of the characteristics of fishes; -- said of some amphibians.", "details": []}, {"x": -0.8810333178007328, "y": -0.18647816649275034, "z": 0.4347484173019321, "word": "Ichthyolite", "pos_group": "noun", "row_number": 75630, "definition": "A fossil fish or fragment of a fish.", "details": []}, {"x": -0.7691937198447663, "y": -0.11756363161687801, "z": 0.6281081227562831, "word": "Ichthyology", "pos_group": "noun", "row_number": 75634, "definition": "The natural history of fishes; that branch of zoology which relates to fishes including their structure classification and habits.", "details": []}, {"x": -0.890552157332225, "y": -0.018449772809474463, "z": 0.45450683268153264, "word": "Ichthyomancy", "pos_group": "noun", "row_number": 75635, "definition": "Divination by the heads or the entrails of fishes.", "details": []}, {"x": -0.8234192173364302, "y": -0.23364194246526732, "z": 0.5170998310211651, "word": "Ichthyomorphous", "pos_group": "adjective", "row_number": 75638, "definition": "Fish-shaped; as the ichthyomorphic idols of ancient Assyria.", "details": []}, {"x": -0.8009885368306331, "y": -0.01535402148924616, "z": 0.5984827632355249, "word": "Ichthyophagist", "pos_group": "noun", "row_number": 75639, "definition": "One who eats or subsists on fish.", "details": []}, {"x": -0.9012488817147267, "y": -0.12203368755543435, "z": 0.41576223049908867, "word": "Ichthyophagous", "pos_group": "adjective", "row_number": 75640, "definition": "Eating or subsisting on fish.", "details": []}, {"x": -0.7757624404400186, "y": -0.18310565465404224, "z": 0.6038749499989723, "word": "Ichthyohagy", "pos_group": "noun", "row_number": 75641, "definition": "The practice of eating or living upon fish.", "details": []}, {"x": -0.8605370084060586, "y": 0.013762005075671166, "z": 0.5092019878003702, "word": "Ichthyophthira", "pos_group": "other", "row_number": 75643, "definition": "A division of copepod crustaceans including numerous species parasitic on fishes.", "details": []}, {"x": -0.8610346734671411, "y": -0.21555845296307882, "z": 0.46060161142086553, "word": "Ichthyopsida", "pos_group": "other", "row_number": 75644, "definition": "A grand division of the Vertebrata including the Amphibia and Fishes.", "details": []}, {"x": -0.775440178554863, "y": -0.07425824441638633, "z": 0.6270392672066066, "word": "Ichthyopterygium", "pos_group": "noun", "row_number": 75646, "definition": "The typical limb or lateral fin of fishes.", "details": []}, {"x": -0.9012030152960281, "y": -0.05321697731526739, "z": 0.4301175171354608, "word": "Ichthyosaur", "pos_group": "noun", "row_number": 75648, "definition": "One of the Ichthyosaura.", "details": []}, {"x": -0.8013061839089541, "y": -0.22566923148195808, "z": 0.5540593809255571, "word": "Ichthyosauria", "pos_group": "other", "row_number": 75649, "definition": "An extinct order of marine reptiles including Ichthyosaurus and allied forms; -- called also Ichthyopterygia. They have not been found later than the Cretaceous period.", "details": []}, {"x": -0.8228052414750967, "y": 0.007697633784087483, "z": 0.5682713093542852, "word": "Ichthyosaurian", "pos_group": "noun", "row_number": 75651, "definition": "One of the Ichthyosauria.", "details": []}, {"x": -0.8910445084586148, "y": -0.16400227108868387, "z": 0.4232528074608593, "word": "Ichthyosauri", "pos_group": "other", "row_number": 75652, "definition": "of Ichthyosaurus", "details": []}, {"x": -0.7688352409797421, "y": -0.1442387284055018, "z": 0.6229667418535165, "word": "Ichthyosaurus", "pos_group": "noun", "row_number": 75653, "definition": "An extinct genus of marine reptiles; -- so named from their short biconcave vertebrae resembling those of fishes. Several species varying in length from ten to thirty feet are known from the Liassic Oolitic and Cretaceous formations.", "details": []}, {"x": -0.8808213130123373, "y": -0.0015585000552289104, "z": 0.47344628588763865, "word": "Ichthyoomy", "pos_group": "noun", "row_number": 75656, "definition": "The anatomy or dissection of fishes.", "details": []}, {"x": -0.8378932577594428, "y": -0.23183402009692372, "z": 0.4941536964619076, "word": "Id", "pos_group": "noun", "row_number": 75707, "definition": "A small fresh-water cyprinoid fish (Leuciscus idus or Idus idus) of Europe. A domesticated variety colored like the goldfish is called orfe in Germany.", "details": []}, {"x": -0.7891330260764655, "y": -0.03489453930406027, "z": 0.6132303305301834, "word": "Iguana", "pos_group": "noun", "row_number": 75974, "definition": "Any species of the genus Iguana a genus of large American lizards of the family Iguanidae. They are arboreal in their habits usually green in color and feed chiefly upon fruits.", "details": []}, {"x": -0.9040131948513328, "y": -0.09498370979282587, "z": 0.4168191915071553, "word": "Iguanian", "pos_group": "adjective", "row_number": 75975, "definition": "Resembling or pertaining to the iguana.", "details": []}, {"x": -0.7833085647262124, "y": -0.2034250430715824, "z": 0.5874061152881253, "word": "Iguanodon", "pos_group": "noun", "row_number": 75977, "definition": "A genus of gigantic herbivorous dinosaurs having a birdlike pelvis and large hind legs with three-toed feet capable of supporting the entire body. Its teeth resemble those of the iguana whence its name. Several species are known mostly from the Wealden of England and Europe. See Illustration in Appendix.", "details": []}, {"x": -0.8463972062592766, "y": 0.016699068756816496, "z": 0.5322902500883765, "word": "Iguanodont", "pos_group": "adjective", "row_number": 75978, "definition": "Like or pertaining to the genus Iguanodon.", "details": []}, {"x": -0.8741023858845154, "y": -0.1995247597093872, "z": 0.44287118810542325, "word": "Iguanoid", "pos_group": "adjective", "row_number": 75979, "definition": "Pertaining to the Iguanidae.", "details": []}, {"x": -0.7700718645730238, "y": -0.10082067848497343, "z": 0.6299400877725249, "word": "Imperforata", "pos_group": "other", "row_number": 76840, "definition": "A division of Foraminifera including those in which the shell is not porous.", "details": []}, {"x": -0.8958043000157331, "y": -0.030044626400050355, "z": 0.4434320427053103, "word": "Inarticulate", "pos_group": "adjective", "row_number": 77588, "definition": "Without a hinge; -- said of an order (Inarticulata or Ecardines) of brachiopods.", "details": []}, {"x": -0.8144028475170991, "y": -0.23324056307386964, "z": 0.5313631918876439, "word": "Inclusa", "pos_group": "other", "row_number": 77942, "definition": "A tribe of bivalve mollusks characterized by the closed state of the mantle which envelops the body. The ship borer (Teredo navalis) is an example.", "details": []}, {"x": -0.8086462678740727, "y": -0.004291680788671911, "z": 0.588279521086143, "word": "Incurrent", "pos_group": "adjective", "row_number": 78401, "definition": "Characterized by a current which flows inward; as the incurrent orifice of lamellibranch Mollusca.", "details": []}, {"x": -0.8985856263773389, "y": -0.13870595881230743, "z": 0.41629860564023513, "word": "Inequivalvular", "pos_group": "adjective", "row_number": 79137, "definition": "Having unequal valves as the shell of an oyster.", "details": []}, {"x": -0.7716394487622698, "y": -0.1695280879369612, "z": 0.6130520275753915, "word": "Inferobranchiata", "pos_group": "other", "row_number": 79394, "definition": "A suborder of marine gastropod mollusks in which the gills are between the foot and the mantle.", "details": []}, {"x": -0.8688967403071312, "y": 0.010465812546977335, "z": 0.4948827350508133, "word": "Inferobranchiate", "pos_group": "adjective", "row_number": 79395, "definition": "Having the gills on the sides of the body under the margin of the mantle; belonging to the Inferobranchiata.", "details": []}, {"x": -0.8524385225403105, "y": -0.22423288199816954, "z": 0.47230094211221674, "word": "Infralabial", "pos_group": "adjective", "row_number": 79640, "definition": "Below the lower lip; -- said of certain scales of reptiles and fishes.", "details": []}, {"x": -0.7793679437889879, "y": -0.05811081302219793, "z": 0.6238659644539235, "word": "Infundibulum", "pos_group": "noun", "row_number": 79706, "definition": "The siphon of Cephalopoda. See Cephalopoda.", "details": []}, {"x": -0.9036223580778099, "y": -0.068308777909906, "z": 0.4228481344908047, "word": "Infusoria", "pos_group": "other", "row_number": 79738, "definition": "One of the classes of Protozoa including a large number of species all of minute size.", "details": []}, {"x": -0.7934173601570863, "y": -0.2195125236054469, "z": 0.5677174865914637, "word": "Inia", "pos_group": "noun", "row_number": 79986, "definition": "A South American freshwater dolphin (Inia Boliviensis). It is ten or twelve feet long and has a hairy snout.", "details": []}, {"x": -0.8316344650378098, "y": 0.01376829344633185, "z": 0.5551527273254196, "word": "Inkfish", "pos_group": "noun", "row_number": 80083, "definition": "A cuttlefish. See Cuttlefish.", "details": []}, {"x": -0.8855244874941964, "y": -0.1790696867925043, "z": 0.4286961969975652, "word": "Inoceramus", "pos_group": "noun", "row_number": 80236, "definition": "An extinct genus of large fossil bivalve shells allied to the mussels. The genus is characteristic of the Cretaceous period.", "details": []}, {"x": -0.7677547389889087, "y": -0.12803339901074204, "z": 0.6278217179246264, "word": "Inoperculate", "pos_group": "adjective", "row_number": 80268, "definition": "Having no operculum; -- said of certain gastropod shells.", "details": []}, {"x": -0.8875512391020914, "y": -0.010337761191695837, "z": 0.4605930184684585, "word": "Insect", "pos_group": "noun", "row_number": 80434, "definition": "Any small crustacean. In a wider sense the word is often loosely applied to various small invertebrates.", "details": []}, {"x": -0.8286569115578891, "y": -0.23504861899894924, "z": 0.5080156194784049, "word": "Insecta", "pos_group": "noun", "row_number": 80439, "definition": "In a more restricted sense the Hexapoda alone. See Hexapoda.", "details": []}, {"x": -0.7956364510166924, "y": -0.021315151747574732, "z": 0.6053992914759152, "word": "Insecta", "pos_group": "noun", "row_number": 80440, "definition": "In the most general sense the Hexapoda Myriapoda and Arachnoidea combined.", "details": []}, {"x": -0.9032732014480268, "y": -0.11175071888857545, "z": 0.4142575290489225, "word": "Intercrural", "pos_group": "adjective", "row_number": 81283, "definition": "Between crura; -- applied especially to the interneural plates in the vertebral column of many cartilaginous fishes.", "details": []}, {"x": -0.7775033818713492, "y": -0.1922267418971043, "z": 0.5987799018656514, "word": "Interoperculum", "pos_group": "noun", "row_number": 81613, "definition": "The postero-inferior opercular bone in fishes.", "details": []}, {"x": -0.8553140965195047, "y": 0.01700794450236977, "z": 0.5178305959663135, "word": "Interradial", "pos_group": "adjective", "row_number": 81701, "definition": "Between the radii or rays; -- in zoology said of certain parts of radiate animals; as the interradial plates of a starfish.", "details": []}, {"x": -0.866367834868866, "y": -0.21113683327740984, "z": 0.452579288454764, "word": "Interrenal", "pos_group": "adjective", "row_number": 81712, "definition": "Between the kidneys; as the interrenal body an organ found in many fishes.", "details": []}, {"x": -0.7721709635812211, "y": -0.08394708023921219, "z": 0.6298451323312421, "word": "Invertebrata", "pos_group": "other", "row_number": 82352, "definition": "A comprehensive division of the animal kingdom including all except the Vertebrata.", "details": []}, {"x": -0.9000593988173726, "y": -0.04326784845710519, "z": 0.43361385112840084, "word": "Invertebrated", "pos_group": "adjective", "row_number": 82355, "definition": "Having no backbone; invertebrate.", "details": []}, {"x": -0.8056358244366043, "y": -0.23056742146721795, "z": 0.5457010010457294, "word": "Ischiocerite", "pos_group": "noun", "row_number": 82974, "definition": "The third joint or the antennae of the Crustacea.", "details": []}, {"x": -0.8169340520593875, "y": 0.005048424461789499, "z": 0.5767089976723822, "word": "Ischiopodite", "pos_group": "noun", "row_number": 82978, "definition": "The third joint of the typical appendages of Crustacea.", "details": []}, {"x": -0.8947434027454481, "y": -0.15511069063094235, "z": 0.41877788491692, "word": "Isinglass", "pos_group": "noun", "row_number": 82995, "definition": "A semitransparent whitish and very pure from of gelatin chiefly prepared from the sounds or air bladders of various species of sturgeons (as the Acipenser huso) found in the of Western Russia. It used for making jellies as a clarifier etc. Cheaper forms of gelatin are not unfrequently so called. Called also fish glue.", "details": []}, {"x": -0.7686255598509223, "y": -0.15462175475068457, "z": 0.6207309092526935, "word": "Isis", "pos_group": "noun", "row_number": 82998, "definition": "Any coral of the genus Isis or family Isidae composed of joints of white stony coral alternating with flexible horny joints. See Gorgoniacea.", "details": []}, {"x": -0.8768000860496366, "y": 0.0049413774464229275, "z": 0.4808296911509125, "word": "Isogonism", "pos_group": "noun", "row_number": 83073, "definition": "The quality of having similar sexual zooids or gonophores and dissimilar hydrants; -- said of certain hydroids.", "details": []}, {"x": -0.8434059585494231, "y": -0.23094950268813072, "z": 0.48510691222805064, "word": "Isopleura", "pos_group": "other", "row_number": 83116, "definition": "A subclass of Gastropoda in which the body is symmetrical the right and left sides being equal.", "details": []}, {"x": -0.78439648072501, "y": -0.04262208223685046, "z": 0.6187935997826856, "word": "Isopod", "pos_group": "adjective", "row_number": 83117, "definition": "Having the legs similar in structure; belonging to the Isopoda.", "details": []}, {"x": -0.9048544995300288, "y": -0.08438800554154588, "z": 0.4172732907831285, "word": "Isopod", "pos_group": "noun", "row_number": 83118, "definition": "One of the Isopoda.", "details": []}, {"x": -0.786178716373537, "y": -0.21123978279202196, "z": 0.5807760154200903, "word": "Isopoda", "pos_group": "other", "row_number": 83119, "definition": "An order of sessile-eyed Crustacea usually having seven pairs of legs which are all similar in structure.", "details": []}, {"x": -0.8406926424501732, "y": 0.0177050695288163, "z": 0.5412230699472493, "word": "Isospondyli", "pos_group": "other", "row_number": 83129, "definition": "An extensive order of fishes including the salmons herrings and many allied forms.", "details": []}, {"x": -0.8790161588409323, "y": -0.19310636584134014, "z": 0.43593637605513424, "word": "Iulidan", "pos_group": "noun", "row_number": 83277, "definition": "One of the Iulidae a family of myriapods of which the genus Iulus is the type. See Iulus.", "details": []}, {"x": -0.7679034303291132, "y": -0.11121338658062627, "z": 0.6308374626907066, "word": "Jack", "pos_group": "noun", "row_number": 83356, "definition": "A large California rock fish (Sebastodes paucispinus); -- called also boccaccio and merou.", "details": []}, {"x": -0.8934567944257366, "y": -0.021055452770274558, "z": 0.448655351470509, "word": "Jacksnipe", "pos_group": "noun", "row_number": 83396, "definition": "A small American sandpiper (Tringa maculata); -- called also pectoral sandpiper and grass snipe.", "details": []}, {"x": -0.8194069039500218, "y": -0.23601839466276123, "z": 0.5223673450167543, "word": "Jellyfish", "pos_group": "noun", "row_number": 83741, "definition": "Any one of the acalephs esp. one of the larger species having a jellylike appearance. See Medusa.", "details": []}, {"x": -0.8029851680855812, "y": -0.009107956204364952, "z": 0.5959294127397557, "word": "Jentling", "pos_group": "noun", "row_number": 83757, "definition": "A fish of the genus Leuciscus; the blue chub of the Danube.", "details": []}, {"x": -0.9012998830943026, "y": -0.12873968450214096, "z": 0.4136237594342056, "word": "Jerker", "pos_group": "noun", "row_number": 83788, "definition": "A North American river chub (Hybopsis biguttatus).", "details": []}, {"x": -0.7726720974345046, "y": -0.1793277793520478, "z": 0.6089494046296675, "word": "Jewfish", "pos_group": "noun", "row_number": 83890, "definition": "A very large serranoid fish (Promicrops itaiara) of Florida and the Gulf of Mexico. It often reaches the weight of five hundred pounds. Its color is olivaceous or yellowish with numerous brown spots. Called also guasa and warsaw.", "details": []}, {"x": -0.864028479254796, "y": 0.015029749999773623, "z": 0.5032185346860637, "word": "Jewfish", "pos_group": "noun", "row_number": 83891, "definition": "A similar gigantic fish (Stereolepis gigas) of Southern California valued as a food fish.", "details": []}, {"x": -0.8579576044499846, "y": -0.22107648060940743, "z": 0.46371752035889474, "word": "Jewfish", "pos_group": "noun", "row_number": 83893, "definition": "A large herringlike fish; the tarpum.", "details": []}, {"x": -0.7754697773262822, "y": -0.0672522572425531, "z": 0.6277927670412489, "word": "Jewstone", "pos_group": "noun", "row_number": 83901, "definition": "A large clavate spine of a fossil sea urchin.", "details": []}, {"x": -0.903220762885766, "y": -0.05790098184997816, "z": 0.4252525482497, "word": "Jill", "pos_group": "noun", "row_number": 83942, "definition": "A young woman; a sweetheart. See Gill.", "details": []}, {"x": -0.7972820628211282, "y": -0.2256352015449585, "z": 0.5598482545542611, "word": "Jowter", "pos_group": "noun", "row_number": 84246, "definition": "A mounted peddler of fish; -- called also jouster.", "details": []}, {"x": -0.8257068023169557, "y": 0.01246640037485811, "z": 0.5639617588712923, "word": "Jugular", "pos_group": "adjective", "row_number": 84386, "definition": "Having the ventral fins beneath the throat; -- said of certain fishes.", "details": []}, {"x": -0.8897722484530066, "y": -0.170940261097213, "z": 0.423184088806394, "word": "Jugular", "pos_group": "adjective", "row_number": 84388, "definition": "Any fish which has the ventral fins situated forward of the pectoral fins or beneath the throat; one of a division of fishes (Jugulares).", "details": []}, {"x": -0.7667921338659457, "y": -0.13864049734186407, "z": 0.6267444741983053, "word": "July-flower", "pos_group": "noun", "row_number": 84419, "definition": "See Gillyflower.", "details": []}, {"x": -0.8840916866122881, "y": -0.002744608401258174, "z": 0.4673054213121904, "word": "June", "pos_group": "noun", "row_number": 84507, "definition": "One of the early discovered asteroids.", "details": []}, {"x": -0.8340947929745062, "y": -0.23555269671966497, "z": 0.49879936186898755, "word": "Jurel", "pos_group": "noun", "row_number": 84534, "definition": "A yellow carangoid fish of the Atlantic and Gulf coasts (Caranx chrysos) most abundant southward where it is valued as a food fish; -- called also hardtail horse crevalle jack buffalo jack skipjack yellow mackerel and sometimes improperly horse mackerel. Other species of Caranx (as C. fallax) are also sometimes called jurel.", "details": []}, {"x": -0.7904484160424026, "y": -0.028088393232082128, "z": 0.6118842568179842, "word": "Kakaralli", "pos_group": "noun", "row_number": 84679, "definition": "A kind of wood common in Demerara durable in salt water because not subject to the depredations of the sea worm and barnacle.", "details": []}, {"x": -0.904855678031511, "y": -0.10117315614993357, "z": 0.4135216976275798, "word": "Kalan", "pos_group": "noun", "row_number": 84682, "definition": "The sea otter.", "details": []}, {"x": -0.7797322460280204, "y": -0.2009698022292894, "z": 0.5929829365976892, "word": "Kanaka", "pos_group": "noun", "row_number": 84726, "definition": "A native of the Sandwich Islands.", "details": []}, {"x": -0.8498140646118674, "y": 0.019401534840746568, "z": 0.5267253895851994, "word": "Kelp", "pos_group": "noun", "row_number": 84910, "definition": "Any large blackish seaweed.", "details": []}, {"x": -0.8716219225911626, "y": -0.20583640812172416, "z": 0.4448669431976627, "word": "Kelpfish", "pos_group": "noun", "row_number": 84911, "definition": "A small California food fish (Heterostichus rostratus) living among kelp. The name is also applied to species of the genus Platyglossus.", "details": []}, {"x": -0.7692960542717949, "y": -0.09407926041510899, "z": 0.6319277440036903, "word": "Kelt", "pos_group": "noun", "row_number": 84919, "definition": "A salmon after spawning.", "details": []}, {"x": -0.898413761837279, "y": -0.0335441973318256, "z": 0.4378669882130334, "word": "Keratophyte", "pos_group": "noun", "row_number": 84978, "definition": "A gorgonian coral having a horny axis.", "details": []}, {"x": -0.8103117582437792, "y": -0.2346895240948043, "z": 0.5369503531352121, "word": "Keratosa", "pos_group": "other", "row_number": 84979, "definition": "An order of sponges having a skeleton composed of hornlike fibers. It includes the commercial sponges.", "details": []}, {"x": -0.8110548364667852, "y": 0.0014801435021060633, "z": 0.5849682567618942, "word": "Keratose", "pos_group": "noun", "row_number": 84980, "definition": "A tough horny animal substance entering into the composition of the skeleton of sponges and other invertebrates; -- called also keratode.", "details": []}, {"x": -0.8981080560387495, "y": -0.1456401792701969, "z": 0.4149588628532269, "word": "Keratose", "pos_group": "adjective", "row_number": 84981, "definition": "Containing hornlike fibers or fibers of keratose; belonging to the Keratosa.", "details": []}, {"x": -0.768917277059162, "y": -0.16493909358690612, "z": 0.6177064970086148, "word": "Kibblings", "pos_group": "other", "row_number": 85107, "definition": "Portions of small fish used for bait on the banks of Newfoundland.", "details": []}, {"x": -0.872374200531847, "y": 0.010765067933632202, "z": 0.4887201321398629, "word": "Killer", "pos_group": "noun", "row_number": 85193, "definition": "A voracious toothed whale of the genus Orca of which several species are known.", "details": []}, {"x": -0.8490142055492899, "y": -0.22913347899671432, "z": 0.47610159375743605, "word": "Killifish", "pos_group": "noun", "row_number": 85196, "definition": "Any one of several small American cyprinodont fishes of the genus Fundulus and allied genera. They live equally well in fresh and brackish water or even in the sea. They are usually striped or barred with black. Called also minnow and brook fish. See Minnow.", "details": []}, {"x": -0.7799243098324086, "y": -0.05104695919807071, "z": 0.6237886492146774, "word": "Kingfish", "pos_group": "noun", "row_number": 85313, "definition": "An American marine food fish of the genus Menticirrus especially M. saxatilis or M. nebulosos of the Atlantic coast; -- called also whiting surf whiting and barb.", "details": []}, {"x": -0.905210696345551, "y": -0.07369590693443223, "z": 0.41852420303097676, "word": "Kingfish", "pos_group": "noun", "row_number": 85316, "definition": "The queenfish.", "details": []}, {"x": -0.7895002224765318, "y": -0.21849902170056876, "z": 0.5735395158360067, "word": "Kingfisher", "pos_group": "noun", "row_number": 85317, "definition": "Any one of numerous species of birds constituting the family Alcedinidae. Most of them feed upon fishes which they capture by diving and seizing then with the beak; others feed only upon reptiles insects etc. About one hundred and fifty species are known. They are found in nearly all parts of the world but are particularly abundant in the East Indies.", "details": []}, {"x": -0.8348081779544385, "y": 0.017795280708533666, "z": 0.5502532453379034, "word": "Kingstone", "pos_group": "noun", "row_number": 85331, "definition": "The black angel fish. See Angel fish under Angel.", "details": []}, {"x": -0.8837440631412956, "y": -0.18589316939525607, "z": 0.42946496997392075, "word": "Kipe", "pos_group": "noun", "row_number": 85364, "definition": "An osier basket used for catching fish.", "details": []}, {"x": -0.7661895360008899, "y": -0.12186207495817443, "z": 0.6309542214849102, "word": "Kipper", "pos_group": "noun", "row_number": 85365, "definition": "A salmon after spawning.", "details": []}, {"x": -0.8906252836870483, "y": -0.012484040685871153, "z": 0.45456655484705244, "word": "Knot", "pos_group": "other", "row_number": 85707, "definition": "To copulate; -- said of toads.", "details": []}, {"x": -0.8246704179935125, "y": -0.2379240145768003, "z": 0.513138251326155, "word": "Komtok", "pos_group": "noun", "row_number": 85801, "definition": "An African freshwater fish (Protopterus annectens) belonging to the Dipnoi. It can breathe air by means of its lungs and when waters dry up it encases itself in a nest of hard mud where it remains till the rainy season. It is used as food.", "details": []}, {"x": -0.7974260853499032, "y": -0.014792685986120284, "z": 0.6032352897873641, "word": "Kraken", "pos_group": "noun", "row_number": 85829, "definition": "A fabulous Scandinavian sea monster often represented as resembling an island but sometimes as resembling an immense octopus.", "details": []}, {"x": -0.9036044843220449, "y": -0.11836530607994637, "z": 0.4116899200001041, "word": "Krang", "pos_group": "noun", "row_number": 85833, "definition": "The carcass of a whale after the blubber has been removed.", "details": []}, {"x": -0.7742072672585943, "y": -0.18886048578315975, "z": 0.6040983564236277, "word": "Kurilian", "pos_group": "adjective", "row_number": 85876, "definition": "Of or pertaining to the Kurile Islands a chain of islands in the Pacific ocean extending from the southern extremity of Kamschatka to Yesso.", "details": []}, {"x": -0.8588293575393717, "y": 0.018791536257967513, "z": 0.5119169979533554, "word": "Labial", "pos_group": "noun", "row_number": 85971, "definition": "One of the scales which border the mouth of a fish or reptile.", "details": []}, {"x": -0.8634622692711942, "y": -0.21700419948564306, "z": 0.4553483138770087, "word": "Labroid", "pos_group": "adjective", "row_number": 86038, "definition": "Like the genus Labrus; belonging to the family Labridae an extensive family of marine fishes often brilliantly colored which are very abundant in the Indian and Pacific Oceans. The tautog and cunner are American examples.", "details": []}, {"x": -0.771924326363226, "y": -0.07694195869968887, "z": 0.6310410203466453, "word": "Labrus", "pos_group": "noun", "row_number": 86046, "definition": "A genus of marine fishes including the wrasses of Europe. See Wrasse.", "details": []}, {"x": -0.9023137920446589, "y": -0.04760102045675284, "z": 0.42844365269830303, "word": "Labyrinthici", "pos_group": "other", "row_number": 86063, "definition": "An order of teleostean fishes including the Anabas or climbing perch and other allied fishes.", "details": []}, {"x": -0.8015396241207353, "y": -0.23105032920924806, "z": 0.5514979386513503, "word": "Labyrinthodon", "pos_group": "noun", "row_number": 86066, "definition": "A genus of very large fossil amphibians of the Triassic period having bony plates on the under side of the body. It is the type of the order Labyrinthodonta. Called also Mastodonsaurus.", "details": []}, {"x": -0.8197057888984071, "y": 0.0102288056393357, "z": 0.5726934530633583, "word": "Labyrinthodonta", "pos_group": "other", "row_number": 86069, "definition": "An extinct order of Amphibia including the typical genus Labyrinthodon and many other allied forms from the Carboniferous Permian and Triassic formations. By recent writers they are divided into two or more orders. See Stegocephala.", "details": []}, {"x": -0.8937355232144673, "y": -0.1621387948222218, "z": 0.41826764847183684, "word": "Lacerta", "pos_group": "noun", "row_number": 86107, "definition": "A genus of lizards. See Lizard.", "details": []}, {"x": -0.7663229075087341, "y": -0.149302599520411, "z": 0.6248663338697388, "word": "Lacertilia", "pos_group": "other", "row_number": 86111, "definition": "An order of Reptilia which includes the lizards.", "details": []}, {"x": -0.8801895169813533, "y": 0.00425720160825356, "z": 0.474603297955881, "word": "Lady", "pos_group": "noun", "row_number": 86316, "definition": "The triturating apparatus in the stomach of a lobster; -- so called from a fancied resemblance to a seated female figure. It consists of calcareous plates.", "details": []}, {"x": -0.8396922320794454, "y": -0.2351296402437089, "z": 0.4895212024665557, "word": "Ladyfish", "pos_group": "noun", "row_number": 86322, "definition": "A large handsome oceanic fish (Albula vulpes) found both in the Atlantic and Pacific oceans; -- called also bonefish grubber French mullet and macabe.", "details": []}, {"x": -0.785468324460404, "y": -0.03563741882010393, "z": 0.6178749757428326, "word": "Ladyfish", "pos_group": "noun", "row_number": 86323, "definition": "A labroid fish (Harpe rufa) of Florida and the West Indies.", "details": []}, {"x": -0.9059722269475258, "y": -0.09037911414448906, "z": 0.41357700579964335, "word": "Lady's finger", "pos_group": "other", "row_number": 86340, "definition": "One of the branchiae of the lobster.", "details": []}, {"x": -0.7824406417942888, "y": -0.2092559806356314, "z": 0.5865139185362626, "word": "Lady's seal", "pos_group": "other", "row_number": 86347, "definition": "The European Solomon's seal (Polygonatum verticillatum).", "details": []}, {"x": -0.8440733793329458, "y": 0.02090463172196004, "z": 0.5358200506457651, "word": "Laelaps", "pos_group": "noun", "row_number": 86355, "definition": "A genus of huge carnivorous dinosaurian reptiles from the Cretaceous formation of the United States. They had very large hind legs and tail and are supposed to have been bipedal. Some of the species were about eighteen feet high.", "details": []}, {"x": -0.8767515534065222, "y": -0.19967980882211642, "z": 0.43753249884781503, "word": "Laemodipod", "pos_group": "noun", "row_number": 86357, "definition": "One of the Laemodipoda.", "details": []}, {"x": -0.7668458968758305, "y": -0.10458325323921701, "z": 0.6332532775964173, "word": "Laemodipoda", "pos_group": "other", "row_number": 86358, "definition": "A division of amphipod Crustacea in which the abdomen is small or rudimentary and the legs are often reduced to five pairs. The whale louse or Cyamus and Caprella are examples.", "details": []}, {"x": -0.8962666042212826, "y": -0.02412887147458851, "z": 0.44285886207573333, "word": "Lafayette", "pos_group": "noun", "row_number": 86365, "definition": "The dollar fish.", "details": []}, {"x": -0.8153027909467478, "y": -0.2379849217189167, "z": 0.5278679154001357, "word": "Lafayette", "pos_group": "noun", "row_number": 86366, "definition": "A market fish the goody or spot (Liostomus xanthurus) of the southern coast of the United States.", "details": []}, {"x": -0.8052130961418781, "y": -0.0029989779226609363, "z": 0.5929779725529695, "word": "Lagenian", "pos_group": "adjective", "row_number": 86389, "definition": "Like or pertaining to Lagena a genus of Foraminifera having a straight chambered shell.", "details": []}, {"x": -0.9011025727340644, "y": -0.13565351054871486, "z": 0.4118401127717647, "word": "Lagoon", "pos_group": "noun", "row_number": 86404, "definition": "A lake in a coral island often occupying a large portion of its area and usually communicating with the sea. See Atoll.", "details": []}, {"x": -0.7697178097074499, "y": -0.17510640756559506, "z": 0.6138992095194762, "word": "Lake-dweller", "pos_group": "noun", "row_number": 86433, "definition": "See Lake dwellers under Lake.", "details": []}, {"x": -0.8675686261766529, "y": 0.015850995584062853, "z": 0.49706480946949894, "word": "Lamellibranchiata", "pos_group": "other", "row_number": 86506, "definition": "A class of Mollusca including all those that have bivalve shells as the clams oysters mussels etc.", "details": []}, {"x": -0.8546737561043999, "y": -0.22637951050152103, "z": 0.4672098969965087, "word": "Lamellibranchiate", "pos_group": "adjective", "row_number": 86507, "definition": "Having lamellar gills; belonging to the Lamellibranchia.", "details": []}, {"x": -0.7757567786769202, "y": -0.06011706772057001, "z": 0.6281618887719059, "word": "Laminarian", "pos_group": "adjective", "row_number": 86549, "definition": "Pertaining to seaweeds of the genus Laminaria or to that zone of the sea (from two to ten fathoms in depth) where the seaweeds of this genus grow.", "details": []}, {"x": -0.9050666641534402, "y": -0.06299068957908548, "z": 0.4205787755754147, "word": "Lampern", "pos_group": "noun", "row_number": 86581, "definition": "The river lamprey (Ammocoetes / Lampetra fluviatilis).", "details": []}, {"x": -0.7932551022929749, "y": -0.22513207472314647, "z": 0.5657401272819644, "word": "Lamplighter", "pos_group": "noun", "row_number": 86588, "definition": "The calico bass.", "details": []}, {"x": -0.8287854547440827, "y": 0.01694876842591106, "z": 0.559309761450208, "word": "Lamprey", "pos_group": "noun", "row_number": 86598, "definition": "An eel-like marsipobranch of the genus Petromyzon and allied genera. The lampreys have a round sucking mouth without jaws but set with numerous minute teeth and one to three larger teeth on the palate (see Illust. of Cyclostomi). There are seven small branchial openings on each side.", "details": []}, {"x": -0.8882426763651694, "y": -0.17792500903789552, "z": 0.42351816849163104, "word": "Lance fish", "pos_group": "other", "row_number": 86618, "definition": "A slender marine fish of the genus Ammodytes especially Ammodytes tobianus of the English coast; -- called also sand lance.", "details": []}, {"x": -0.7649525592777648, "y": -0.13268705271648648, "z": 0.6302711544214998, "word": "Lancelet", "pos_group": "noun", "row_number": 86621, "definition": "A small fishlike animal (Amphioxus lanceolatus) remarkable for the rudimentary condition of its organs. It is the type of the class Leptocardia. See Amphioxus Leptocardia.", "details": []}, {"x": -0.8873202047493048, "y": -0.004408056941154853, "z": 0.46113276101102957, "word": "Landlocked", "pos_group": "adjective", "row_number": 86687, "definition": "Confined to a fresh-water lake by reason of waterfalls or dams; -- said of fishes that would naturally seek the sea after spawning; as the landlocked salmon.", "details": []}, {"x": -0.8301556124425298, "y": -0.2389226069436711, "z": 0.5037436322390672, "word": "Langaha", "pos_group": "noun", "row_number": 86726, "definition": "A curious colubriform snake of the genus Xyphorhynchus from Madagascar. It is brownish red and its nose is prolonged in the form of a sharp blade.", "details": []}, {"x": -0.7920142883439856, "y": -0.021319518847719657, "z": 0.6101301870708183, "word": "Langya", "pos_group": "noun", "row_number": 86776, "definition": "One of several species of East Indian and Asiatic fresh-water fishes of the genus Ophiocephalus remarkable for their power of living out of water and for their tenacity of life; -- called also walking fishes.", "details": []}, {"x": -0.9054704626762566, "y": -0.10765651152772723, "z": 0.4105280949539583, "word": "Lant", "pos_group": "noun", "row_number": 86805, "definition": "Any one of several species of small slender marine fishes of the genus Ammedytes. The common European species (A. tobianus) and the American species (A. Americanus) live on sandy shores buried in the sand and are caught in large quantities for bait. Called also launce and sand eel.", "details": []}, {"x": -0.776242391277516, "y": -0.1980439005926657, "z": 0.598520144541356, "word": "Lates", "pos_group": "noun", "row_number": 87178, "definition": "A genus of large percoid fishes of which one species (Lates Niloticus) inhabits the Nile and another (L. calcarifer) is found in the Ganges and other Indian rivers. They are valued as food fishes.", "details": []}, {"x": -0.8533321376942151, "y": 0.02170350814095662, "z": 0.5209157518376618, "word": "Lavaret", "pos_group": "noun", "row_number": 87390, "definition": "A European whitefish (Coregonus laveretus) found in the mountain lakes of Sweden Germany and Switzerland.", "details": []}, {"x": -0.8689067697516494, "y": -0.2120280854295647, "z": 0.4472640344011883, "word": "Layer", "pos_group": "noun", "row_number": 87536, "definition": "An artificial oyster bed.", "details": []}, {"x": -0.7687662796234696, "y": -0.08711447215650932, "z": 0.6335688408174618, "word": "Leaflet", "pos_group": "noun", "row_number": 87659, "definition": "A leaflike organ or part; as a leaflet of the gills of fishes.", "details": []}, {"x": -0.9008960531369016, "y": -0.037493354312688576, "z": 0.4324124764906032, "word": "Leap", "pos_group": "noun", "row_number": 87714, "definition": "A weel or wicker trap for fish.", "details": []}, {"x": -0.8061632949176134, "y": -0.23569882118767885, "z": 0.5427216668038188, "word": "Leatherback", "pos_group": "noun", "row_number": 87783, "definition": "A large sea turtle (Sphargis coriacea) having no bony shell on its back. It is common in the warm and temperate parts of the Atlantic and sometimes weighs over a thousand pounds; -- called also leather turtle leathery turtle leather-backed tortoise etc.", "details": []}, {"x": -0.8136762654433395, "y": 0.0070528665409243605, "z": 0.5812754872930185, "word": "Ledgy", "pos_group": "adjective", "row_number": 87878, "definition": "Abounding in ledges; consisting of a ledge or reef; as a ledgy island.", "details": []}, {"x": -0.897374943569508, "y": -0.1527204968410499, "z": 0.4139983822410967, "word": "Lister", "pos_group": "noun", "row_number": 88091, "definition": "A spear armed with three or more prongs for striking fish.", "details": []}, {"x": -0.7663602591989322, "y": -0.15993564562309887, "z": 0.6221836886158845, "word": "Lemuroid", "pos_group": "noun", "row_number": 88125, "definition": "One of the Lemuroidea.", "details": []}, {"x": -0.8758646468603528, "y": 0.010598934353929319, "z": 0.48244044499891425, "word": "Lepas", "pos_group": "noun", "row_number": 88238, "definition": "Any one of various species of Lepas a genus of pedunculated barnacles found attached to floating timber bottoms of ships Gulf weed etc.; -- called also goose barnacle. See Barnacle.", "details": []}, {"x": -0.8454066535242841, "y": -0.2337621764774936, "z": 0.4802528865351837, "word": "Lepidoganoid", "pos_group": "noun", "row_number": 88249, "definition": "Any one of a division (Lepidoganoidei) of ganoid fishes including those that have scales forming a coat of mail. Also used adjectively.", "details": []}, {"x": -0.7807390378855835, "y": -0.04391894241777605, "z": 0.6233118651352607, "word": "Lepidosauria", "pos_group": "other", "row_number": 88257, "definition": "A division of reptiles including the serpents and lizards; the Plagiotremata.", "details": []}, {"x": -0.9066022301817035, "y": -0.0794497058145537, "z": 0.4144395498447783, "word": "Lepidosiren", "pos_group": "noun", "row_number": 88258, "definition": "An eel-shaped ganoid fish of the order Dipnoi having both gills and lungs. It inhabits the rivers of South America. The name is also applied to a related African species (Protopterus annectens). The lepidosirens grow to a length of from four to six feet. Called also doko.", "details": []}, {"x": -0.78561609738193, "y": -0.21700896136460182, "z": 0.5794087143129992, "word": "Leptostraca", "pos_group": "other", "row_number": 88281, "definition": "An order of Crustacea including Nebalia and allied forms.", "details": []}, {"x": -0.8381310576088716, "y": 0.021485834025510502, "z": 0.5450455845226735, "word": "Lernaeacea", "pos_group": "other", "row_number": 88292, "definition": "A suborder of copepod Crustacea including a large number of remarkable forms mostly parasitic on fishes. The young however are active and swim freely. See Illustration in Appendix.", "details": []}, {"x": -0.8817116648853668, "y": -0.19269707074131884, "z": 0.4306418220897617, "word": "Lernean", "pos_group": "noun", "row_number": 88293, "definition": "One of a family (Lernaeidae) of parasitic Crustacea found attached to fishes and other marine animals. Some species penetrate the skin and flesh with the elongated head and feed on the viscera. See Illust. in Appendix.", "details": []}, {"x": -0.7648479137743467, "y": -0.11538335341068044, "z": 0.6337936182628662, "word": "Leucosoid", "pos_group": "adjective", "row_number": 88447, "definition": "Like or pertaining to the Leucosoidea a tribe of marine crabs including the box crab or Calappa.", "details": []}, {"x": -0.8936225640736297, "y": -0.015103467368332275, "z": 0.44856504350197085, "word": "Leviathan", "pos_group": "noun", "row_number": 88528, "definition": "An aquatic animal described in the book of Job ch. xli. and mentioned in other passages of Scripture.", "details": []}, {"x": -0.8205746502694898, "y": -0.2404090160093742, "z": 0.5185178380311606, "word": "Leviathan", "pos_group": "noun", "row_number": 88529, "definition": "The whale or a great whale.", "details": []}, {"x": -0.7994547321943936, "y": -0.008373083656455529, "z": 0.6006679803702477, "word": "Light-horseman", "pos_group": "noun", "row_number": 89064, "definition": "A West Indian fish of the genus Ephippus remarkable for its high dorsal fin and brilliant colors.", "details": []}, {"x": -0.9036935464046993, "y": -0.12521868150638635, "z": 0.40946093340915873, "word": "Ligula", "pos_group": "noun", "row_number": 89129, "definition": "A tongue-shaped lobe of the parapodia of annelids. See Parapodium.", "details": []}, {"x": -0.7710305045188414, "y": -0.18503928316391302, "z": 0.609321282073428, "word": "Limaceous", "pos_group": "adjective", "row_number": 89213, "definition": "Pertaining to or like Limax or the slugs.", "details": []}, {"x": -0.8624118453319795, "y": 0.02014269684102928, "z": 0.5058063668985006, "word": "Limacina", "pos_group": "noun", "row_number": 89214, "definition": "A genus of small spiral pteropods common in the Arctic and Antarctic seas. It contributes to the food of the right whales.", "details": []}, {"x": -0.860339258943697, "y": -0.22268877360569608, "z": 0.45850416533571564, "word": "Limax", "pos_group": "noun", "row_number": 89221, "definition": "A genus of airbreathing mollusks including the common garden slugs. They have a small rudimentary shell. The breathing pore is on the right side of the neck. Several species are troublesome in gardens. See Slug.", "details": []}, {"x": -0.7719322739743224, "y": -0.06977418943167404, "z": 0.6318640098043128, "word": "Lim naea", "pos_group": "noun", "row_number": 89320, "definition": "A genus of fresh-water air-breathing mollusks abundant in ponds and streams; -- called also pond snail.", "details": []}, {"x": -0.9044111608576303, "y": -0.05235703129477746, "z": 0.423437354741113, "word": "Limpet", "pos_group": "noun", "row_number": 89340, "definition": "In a general sense any hatshaped or conical gastropod shell.", "details": []}, {"x": -0.7974215338510166, "y": -0.23107230622778302, "z": 0.557426664813647, "word": "Limpet", "pos_group": "noun", "row_number": 89341, "definition": "Any one of many species of marine shellfish of the order Docoglossa mostly found adhering to rocks between tides.", "details": []}, {"x": -0.8226678993452541, "y": 0.015151972777240515, "z": 0.5683202839137672, "word": "Limpet", "pos_group": "noun", "row_number": 89342, "definition": "Any species of Siphonaria a genus of limpet-shaped Pulmonifera living between tides on rocks.", "details": []}, {"x": -0.8924697865635545, "y": -0.16924854706621492, "z": 0.41815381068116375, "word": "Limuloidea", "pos_group": "other", "row_number": 89356, "definition": "An order of Merostomata including among living animals the genus Limulus with various allied fossil genera mostly of the Carboniferous period. Called also Xiphosura.", "details": []}, {"x": -0.764211307911263, "y": -0.14360594209770866, "z": 0.6287753257362968, "word": "Limulus", "pos_group": "noun", "row_number": 89358, "definition": "The only existing genus of Merostomata. It includes only a few species from the East Indies and one (Limulus polyphemus) from the Atlantic coast of North America. Called also Molucca crab king crab horseshoe crab and horsefoot.", "details": []}, {"x": -0.8835560482011302, "y": 0.003097694603441328, "z": 0.46831518657347204, "word": "Lindia", "pos_group": "noun", "row_number": 89379, "definition": "A peculiar genus of rotifers remarkable for the absence of ciliated disks. By some zoologists it is thought to be like the ancestral form of the Arthropoda.", "details": []}, {"x": -0.835822303136281, "y": -0.23898626510897406, "z": 0.4942536218068878, "word": "Ling", "pos_group": "adjective", "row_number": 89464, "definition": "A large marine gadoid fish (Molva vulgaris) of Northern Europe and Greenland. It is valued as a food fish and is largely salted and dried. Called also drizzle.", "details": []}, {"x": -0.786794540635915, "y": -0.028654778446168472, "z": 0.6165494744931019, "word": "Ling", "pos_group": "adjective", "row_number": 89467, "definition": "A New Zealand food fish of the genus Genypterus. The name is also locally applied to other fishes as the cultus cod the mutton fish and the cobia.", "details": []}, {"x": -0.9068720030931648, "y": -0.09669087995408818, "z": 0.4101634354004449, "word": "Lingula", "pos_group": "noun", "row_number": 89512, "definition": "Any one of numerous species of brachiopod shells belonging to the genus Lingula and related genera. See Brachiopoda and Illustration in Appendix.", "details": []}, {"x": -0.7787707592169213, "y": -0.20679730575035865, "z": 0.5922423312488669, "word": "Lithodome", "pos_group": "noun", "row_number": 89828, "definition": "Any one of several species of bivalves which form holes in limestone in which they live; esp. any species of the genus Lithodomus.", "details": []}, {"x": -0.8475725391595708, "y": 0.023724237044944328, "z": 0.530148989850243, "word": "Lithodomus", "pos_group": "noun", "row_number": 89830, "definition": "A genus of elongated bivalve shells allied to the mussels and remarkable for their ability to bore holes for shelter in solid limestone shells etc. Called also Lithophagus.", "details": []}, {"x": -0.8742451424684694, "y": -0.20616779004972252, "z": 0.439534154777873, "word": "Lithophagous", "pos_group": "adjective", "row_number": 89865, "definition": "Eating or swallowing stones or gravel as the ostrich.", "details": []}, {"x": -0.7660276870677988, "y": -0.09769937393545779, "z": 0.6353396060204165, "word": "Lithophagous", "pos_group": "adjective", "row_number": 89866, "definition": "Eating or destroying stone; -- applied to various animals which make burrows in stone as many bivalve mollusks certain sponges annelids and sea urchins. See Lithodomus.", "details": []}, {"x": -0.8989662611863994, "y": -0.027662178977840193, "z": 0.4371435291786259, "word": "Lithophyte", "pos_group": "noun", "row_number": 89873, "definition": "A hard or stony plantlike organism as the gorgonians corals and corallines esp. those gorgonians having a calcareous axis. All the lithophytes except the corallines are animals.", "details": []}, {"x": -0.8111229084036402, "y": -0.23952696238585452, "z": 0.5335789180177805, "word": "Littorina", "pos_group": "noun", "row_number": 89948, "definition": "A genus of small pectinibranch mollusks having thick spiral shells abundant between tides on nearly all rocky seacoasts. They feed on seaweeds. The common periwinkle is a well-known example. See Periwinkle.", "details": []}, {"x": -0.8076640041269519, "y": 0.0029435945850010553, "z": 0.5896356431632489, "word": "Lituite", "pos_group": "noun", "row_number": 89952, "definition": "Any species of ammonites of the genus Lituites. They are found in the Cretaceous formation.", "details": []}, {"x": -0.9006531860626568, "y": -0.14274649175972745, "z": 0.4104232906713206, "word": "Lizard", "pos_group": "noun", "row_number": 90076, "definition": "Any one of the numerous species of reptiles belonging to the order Lacertilia; sometimes also applied to reptiles of other orders as the Hatteria.", "details": []}, {"x": -0.7669134412290041, "y": -0.17045450799153747, "z": 0.6186994701530381, "word": "Loach", "pos_group": "noun", "row_number": 90088, "definition": "Any one of several small fresh-water cyprinoid fishes of the genera Cobitis Nemachilus and allied genera having six or more barbules around the mouth. They are found in Europe and Asia. The common European species (N. barbatulus) is used as a food fish.", "details": []}, {"x": -0.8711407680998938, "y": 0.01621619782762957, "z": 0.4907655214889718, "word": "Lobated", "pos_group": "adjective", "row_number": 90165, "definition": "Having lobes; -- said of the tails of certain fishes having the integument continued to the bases of the fin rays.", "details": []}, {"x": -0.8511938627337104, "y": -0.2314405038824237, "z": 0.47106719394064683, "word": "Lobosa", "pos_group": "other", "row_number": 90195, "definition": "An order of Rhizopoda in which the pseudopodia are thick and irregular in form as in the Amoeba.", "details": []}, {"x": -0.7763020297017771, "y": -0.05288300347671794, "z": 0.6281389548692097, "word": "Lobster", "pos_group": "noun", "row_number": 90199, "definition": "Any large macrurous crustacean used as food esp. those of the genus Homarus; as the American lobster (H. Americanus) and the European lobster (H. vulgaris). The Norwegian lobster (Nephrops Norvegicus) is similar in form. All these have a pair of large unequal claws. The spiny lobsters of more southern waters belonging to Palinurus Panulirus and allied genera have no large claws. The fresh-water crayfishes are sometimes called lobsters.", "details": []}, {"x": -0.9067287364380482, "y": -0.06846841336781435, "z": 0.416119063356096, "word": "Log", "pos_group": "noun", "row_number": 90376, "definition": "A Hebrew measure of liquids containing 2.37 gills.", "details": []}, {"x": -0.7892421224380699, "y": -0.2241556107380963, "z": 0.5717089594750826, "word": "Loggerhead", "pos_group": "noun", "row_number": 90408, "definition": "A very large marine turtle (Thalassochelys caretta / caouana) common in the warmer parts of the Atlantic Ocean from Brazil to Cape Cod; -- called also logger-headed turtle.", "details": []}, {"x": -0.8320283748015098, "y": 0.02112080282444878, "z": 0.5543308535641951, "word": "Loligo", "pos_group": "noun", "row_number": 90472, "definition": "A genus of cephalopods including numerous species of squids common on the coasts of America and Europe. They are much used for fish bait.", "details": []}, {"x": -0.8864578836455417, "y": -0.18492546068940727, "z": 0.42425816964612173, "word": "Lophobranchii", "pos_group": "other", "row_number": 90769, "definition": "An order of teleostean fishes having the gills arranged in tufts on the branchial arches as the Hippocampus and pipefishes.", "details": []}, {"x": -0.7633262523277929, "y": -0.12640025554896522, "z": 0.6335266434052815, "word": "Lophophore", "pos_group": "noun", "row_number": 90770, "definition": "A disk which surrounds the mouth and bears the tentacles of the Bryozoa. See Phylactolemata.", "details": []}, {"x": -0.8904904197869236, "y": -0.0065476573172449076, "z": 0.45495487737946544, "word": "Louse", "pos_group": "noun", "row_number": 90973, "definition": "Any small crustacean parasitic on fishes. See Branchiura and Ichthvophthira.", "details": []}, {"x": -0.8260902342197193, "y": -0.24192364696951413, "z": 0.5089674586491548, "word": "Love", "pos_group": "noun", "row_number": 90997, "definition": "A climbing species of Clematis (C. Vitalba).", "details": []}, {"x": -0.7938256773713506, "y": -0.014618747896596323, "z": 0.6079696424623949, "word": "Lucernaria", "pos_group": "noun", "row_number": 91185, "definition": "A genus of acalephs having a bell-shaped body with eight groups of short tentacles around the margin. It attaches itself by a sucker at the base of the pedicel.", "details": []}, {"x": -0.905850354299777, "y": -0.11440841198171978, "z": 0.4078551837145014, "word": "Lucifer", "pos_group": "noun", "row_number": 91201, "definition": "A genus of free-swimming macruran Crustacea having a slender body and long appendages.", "details": []}, {"x": -0.7728545716444856, "y": -0.19465391370335516, "z": 0.603991444449493, "word": "Lugworm", "pos_group": "noun", "row_number": 91278, "definition": "A large marine annelid (Arenicola marina) having a row of tufted gills along each side of the back. It is found burrowing in sandy beaches both in America and Europe and is used for bait by European fishermen. Called also lobworm and baitworm.", "details": []}, {"x": -0.8569356560351203, "y": 0.023589326849568826, "z": 0.51488331209551, "word": "Lumper", "pos_group": "noun", "row_number": 91342, "definition": "The European eelpout; -- called also lumpen.", "details": []}, {"x": -0.8659646108066583, "y": -0.21807012331865894, "z": 0.4500563455238218, "word": "Lumpfish", "pos_group": "noun", "row_number": 91345, "definition": "A large thick clumsy marine fish (Cyclopterus lumpus) of Europe and America. The color is usually translucent sea green sometimes purplish. It has a dorsal row of spiny tubercles and three rows on each side but has no scales. The ventral fins unite and form a ventral sucker for adhesion to stones and seaweeds. Called also lumpsucker cock-paddle sea owl.", "details": []}, {"x": -0.7684869749479096, "y": -0.07995440267241406, "z": 0.6348504255560584, "word": "Lungfish", "pos_group": "noun", "row_number": 91396, "definition": "Any fish belonging to the Dipnoi; -- so called because they have both lungs and gills.", "details": []}, {"x": -0.9032369517811681, "y": -0.0418803399416105, "z": 0.4270937204682818, "word": "Lurg", "pos_group": "noun", "row_number": 91462, "definition": "A large marine annelid (Nephthys caeca) inhabiting the sandy shores of Europe and America. It is whitish with a pearly luster and grows to the length of eight or ten inches.", "details": []}, {"x": -0.8019739936351524, "y": -0.2362577085596829, "z": 0.5486529036458407, "word": "Lyopomata", "pos_group": "other", "row_number": 91693, "definition": "An order of brachiopods in which the valves of shell are not articulated by a hinge. It includes the Lingula Discina and allied forms.", "details": []}, {"x": -0.8165003884532651, "y": 0.012398888679112395, "z": 0.5772117317026658, "word": "Lyrie", "pos_group": "noun", "row_number": 91713, "definition": "A European fish (Peristethus cataphractum) having the body covered with bony plates and having three spines projecting in front of the nose; -- called also noble pluck pogge sea poacher and armed bullhead.", "details": []}, {"x": -0.8963847456546692, "y": -0.15991695746595205, "z": 0.41342587542683734, "word": "Lyriferous", "pos_group": "adjective", "row_number": 91714, "definition": "Having a lyre-shaped shoulder girdle as certain fishes.", "details": []}, {"x": -0.7639808330193164, "y": -0.1545343193849346, "z": 0.6264602388909823, "word": "Maara shell", "pos_group": "other", "row_number": 91739, "definition": "A large pearly spiral marine shell (Turbo margaritaceus) from the Pacific Islands. It is used as an ornament.", "details": []}, {"x": -0.8793512801240072, "y": 0.009961906135031376, "z": 0.47606941360522925, "word": "Mackerel", "pos_group": "noun", "row_number": 91845, "definition": "Any species of the genus Scomber and of several related genera. They are finely formed and very active oceanic fishes. Most of them are highly prized for food.", "details": []}, {"x": -0.8416282009278794, "y": -0.23809428425444717, "z": 0.4847402223957317, "word": "Maclurea", "pos_group": "noun", "row_number": 91857, "definition": "A genus of spiral gastropod shells often of large size characteristic of the lower Silurian rocks.", "details": []}, {"x": -0.7818107335399404, "y": -0.036757665096283636, "z": 0.6224314026287633, "word": "Macrocystis", "pos_group": "noun", "row_number": 91871, "definition": "An immensely long blackish seaweed of the Pacific (Macrocystis pyrifera) having numerous almond-shaped air vessels.", "details": []}, {"x": -0.9077866822219852, "y": -0.08554929146004762, "z": 0.41061497575110945, "word": "Macropod", "pos_group": "noun", "row_number": 91888, "definition": "Any one of a group of maioid crabs remarkable for the length of their legs; -- called also spider crab.", "details": []}, {"x": -0.7817815316726815, "y": -0.21504224033469316, "z": 0.5852986174657789, "word": "Macropodian", "pos_group": "noun", "row_number": 91890, "definition": "A macropod.", "details": []}, {"x": -0.8415889779243185, "y": 0.024818924518869915, "z": 0.5395479711962853, "word": "Macrozoospore", "pos_group": "noun", "row_number": 91906, "definition": "A large motile spore having four vibratile cilia; -- found in certain green algae.", "details": []}, {"x": -0.8794315775803357, "y": -0.19945048448049257, "z": 0.4322263349161625, "word": "Macrura", "pos_group": "other", "row_number": 91907, "definition": "A subdivision of decapod Crustacea having the abdomen largely developed. It includes the lobster prawn shrimp and many similar forms. Cf. Decapoda.", "details": []}, {"x": -0.7637376750380994, "y": -0.10862178332615437, "z": 0.6363223019150314, "word": "Mactra", "pos_group": "noun", "row_number": 91913, "definition": "Any marine bivalve shell of the genus Mactra and allied genera. Many species are known. Some of them are used as food as Mactra stultorum of Europe. See Surf clam under Surf.", "details": []}, {"x": -0.8965272889073893, "y": -0.018190741381454104, "z": 0.44261486325287286, "word": "Mademoiselle", "pos_group": "noun", "row_number": 91975, "definition": "A marine food fish (Sciaena chrysura) of the Southern United States; -- called also yellowtail and silver perch.", "details": []}, {"x": -0.8163850909086311, "y": -0.24248689461869546, "z": 0.524133083558258, "word": "Madrepora", "pos_group": "noun", "row_number": 91995, "definition": "A genus of reef corals abundant in tropical seas. It includes than one hundred and fifty species most of which are elegantly branched.", "details": []}, {"x": -0.801715347508753, "y": -0.0020863106886251834, "z": 0.5977023915600724, "word": "Madreporaria", "pos_group": "other", "row_number": 91996, "definition": "An extensive division of Anthozoa including most of the species that produce stony corals. See Illust. of Anthozoa.", "details": []}, {"x": -0.9035352936924699, "y": -0.1322833831230593, "z": 0.4075844447492812, "word": "Madrepore", "pos_group": "noun", "row_number": 91997, "definition": "Any coral of the genus Madrepora; formerly often applied to any stony coral.", "details": []}, {"x": -0.7679876456963759, "y": -0.18077366919476356, "z": 0.614423190141453, "word": "Madreporiform", "pos_group": "adjective", "row_number": 92000, "definition": "Resembling a madreporian coral in form or structure.", "details": []}, {"x": -0.8660451929319856, "y": 0.02104950539257983, "z": 0.49952241403377245, "word": "Madreporite", "pos_group": "noun", "row_number": 92001, "definition": "A fossil coral.", "details": []}, {"x": -0.857008387437539, "y": -0.22816244447443018, "z": 0.4620373608196218, "word": "Madreporite", "pos_group": "noun", "row_number": 92002, "definition": "The madreporic plate of echinoderms.", "details": []}, {"x": -0.7721970362616276, "y": -0.062473305844572, "z": 0.6323043754756165, "word": "Maestricht monitor", "pos_group": "other", "row_number": 92022, "definition": "The Mosasaurus Hofmanni. See Mosasaurus.", "details": []}, {"x": -0.9063386339091383, "y": -0.05752043655774039, "z": 0.41861877652814883, "word": "Maia", "pos_group": "noun", "row_number": 92230, "definition": "A genus of spider crabs including the common European species (Maia squinado).", "details": []}, {"x": -0.7932983021302712, "y": -0.2306265993094089, "z": 0.563461778231857, "word": "Mail", "pos_group": "noun", "row_number": 92278, "definition": "Any hard protective covering of an animal as the scales and plates of reptiles shell of a lobster etc.", "details": []}, {"x": -0.825808553162371, "y": 0.01979252702352251, "z": 0.5636031311107975, "word":
