es.", "details": []}, {"x": -0.818518888325444, "y": -0.06948620502444783, "z": 0.5702617791556608, "word": "Branchia", "pos_group": "noun", "row_number": 19046, "definition": "A gill; a respiratory organ for breathing the air contained in water such as many aquatic and semiaquatic animals have.", "details": []}, {"x": -0.8755766406678382, "y": -0.10552939956858817, "z": 0.47141180738661675, "word": "Branchial", "pos_group": "adjective", "row_number": 19047, "definition": "Of or pertaining to branchiae or gills.", "details": []}, {"x": -0.8132465973999711, "y": -0.15561353133762057, "z": 0.5607266719909131, "word": "Branchiferous", "pos_group": "adjective", "row_number": 19049, "definition": "Having gills; branchiate; as branchiferous gastropods.", "details": []}, {"x": -0.848055717082427, "y": -0.045480380556131225, "z": 0.5279517361542434, "word": "Branchiogastropoda", "pos_group": "other", "row_number": 19053, "definition": "Those Gastropoda that breathe by branchiae including the Prosobranchiata and Opisthobranchiata.", "details": []}, {"x": -0.8591462836505783, "y": -0.15790727086887044, "z": 0.48675759582788747, "word": "Branchiopod", "pos_group": "noun", "row_number": 19055, "definition": "One of the Branchiopoda.", "details": []}, {"x": -0.8078299351301519, "y": -0.10232233185412239, "z": 0.5804661370928967, "word": "Branchiopoda", "pos_group": "other", "row_number": 19056, "definition": "An order of Entomostraca; -- so named from the feet of branchiopods having been supposed to perform the function of gills. It includes the fresh-water genera Branchipus Apus and Limnadia and the genus Artemia found in salt lakes. It is also called Phyllopoda. See Phyllopoda Cladocera. It is sometimes used in a broader sense.", "details": []}, {"x": -0.8724808012459896, "y": -0.07164605809173587, "z": 0.48336745216974597, "word": "Branchiostegal", "pos_group": "adjective", "row_number": 19057, "definition": "Pertaining to the membrane covering the gills of fishes.", "details": []}, {"x": -0.8284466618261146, "y": -0.172707869883116, "z": 0.5327739860293519, "word": "Branchiostoma", "pos_group": "noun", "row_number": 19061, "definition": "The lancelet. See Amphioxus.", "details": []}, {"x": -0.8286171200002403, "y": -0.05420828878805834, "z": 0.5571850050649046, "word": "Branchiura", "pos_group": "other", "row_number": 19062, "definition": "A group of Entomostraca with suctorial mouths including species parasitic on fishes as the carp lice (Argulus).", "details": []}, {"x": -0.8725149381149292, "y": -0.1278576274805343, "z": 0.4715613532313163, "word": "Brandlin", "pos_group": "noun", "row_number": 19095, "definition": "Same as Branlin fish and worm.", "details": []}, {"x": -0.807489089057553, "y": -0.13793676124028392, "z": 0.5735283959417736, "word": "Branlin", "pos_group": "noun", "row_number": 19115, "definition": "A young salmon or parr in the stage in which it has transverse black bands as if burned by a gridiron.", "details": []}, {"x": -0.8594805145316725, "y": -0.04917515087035111, "z": 0.5087976510138875, "word": "Brasse", "pos_group": "noun", "row_number": 19145, "definition": "A spotted European fish of the genus Lucioperca resembling a perch.", "details": []}, {"x": -0.8478946452859247, "y": -0.17016064788714996, "z": 0.502115548859106, "word": "Bream", "pos_group": "noun", "row_number": 19345, "definition": "A European fresh-water cyprinoid fish of the genus Abramis little valued as food. Several species are known.", "details": []}, {"x": -0.8128395377043226, "y": -0.08049703378179743, "z": 0.5768987029773558, "word": "Bream", "pos_group": "noun", "row_number": 19346, "definition": "An American fresh-water fish of various species of Pomotis and allied genera which are also called sunfishes and pondfishes. See Pondfish.", "details": []}, {"x": -0.876215950888417, "y": -0.09157424337104049, "z": 0.4731382095748857, "word": "Bream", "pos_group": "noun", "row_number": 19347, "definition": "A marine sparoid fish of the genus Pagellus and allied genera. See Sea Bream.", "details": []}, {"x": -0.8177538886923021, "y": -0.1651435133409611, "z": 0.551367570256015, "word": "Breed", "pos_group": "other", "row_number": 19466, "definition": "To give birth to; to be the native place of; as a pond breeds fish; a northern country breeds stout men.", "details": []}, {"x": -0.8405140991898653, "y": -0.04537371256584347, "z": 0.5398863540329958, "word": "Brill", "pos_group": "noun", "row_number": 19748, "definition": "A fish allied to the turbot (Rhombus levis) much esteemed in England for food; -- called also bret pearl prill. See Bret.", "details": []}, {"x": -0.8655161163405527, "y": -0.14847447725638704, "z": 0.47836929453948973, "word": "Britt", "pos_group": "noun", "row_number": 19829, "definition": "The young of the common herring; also a small species of herring; the sprat.", "details": []}, {"x": -0.8057434699719278, "y": -0.11632544463468995, "z": 0.5807287245591859, "word": "Britt", "pos_group": "noun", "row_number": 19830, "definition": "The minute marine animals (chiefly Entomostraca) upon which the right whales feed.", "details": []}, {"x": -0.8689277906906714, "y": -0.06039857926176191, "z": 0.49123976446190654, "word": "Brittle star", "pos_group": "other", "row_number": 19844, "definition": "Any species of ophiuran starfishes. See Ophiuroidea.", "details": []}, {"x": -0.8355404040431381, "y": -0.1752389094952293, "z": 0.5207336726296393, "word": "Brontosaurus", "pos_group": "noun", "row_number": 20038, "definition": "A genus of American jurassic dinosaurs. A length of sixty feet is believed to have been attained by these reptiles.", "details": []}, {"x": -0.8214613168141357, "y": -0.06171979902754939, "z": 0.566914430391382, "word": "Brontozoum", "pos_group": "noun", "row_number": 20040, "definition": "An extinct animal of large size known from its three-toed footprints in Mesozoic sandstone.", "details": []}, {"x": -0.8757211199030425, "y": -0.11419621320196771, "z": 0.46911805022413267, "word": "Bryozoa", "pos_group": "other", "row_number": 20280, "definition": "A class of Molluscoidea including minute animals which by budding form compound colonies; -- called also Polyzoa.", "details": []}, {"x": -0.8096867537556554, "y": -0.15054289360606027, "z": 0.5672249976661317, "word": "Bryozoum", "pos_group": "noun", "row_number": 20283, "definition": "An individual zooid of a bryozoan coralline of which there may be two or more kinds in a single colony. The zooecia usually have a wreath of tentacles around the mouth and a well developed stomach and intestinal canal; but these parts are lacking in the other zooids (Avicularia Ooecia etc.).", "details": []}, {"x": -0.8527750033896682, "y": -0.0442312124648549, "z": 0.5204021458810874, "word": "Bubbler", "pos_group": "noun", "row_number": 20305, "definition": "A fish of the Ohio river; -- so called from the noise it makes.", "details": []}, {"x": -0.8553463999704921, "y": -0.16478576211856985, "z": 0.4911498637488572, "word": "Bubble shell", "pos_group": "other", "row_number": 20306, "definition": "A marine univalve shell of the genus Bulla and allied genera belonging to the Tectibranchiata.", "details": []}, {"x": -0.8083167967932978, "y": -0.09335955570314819, "z": 0.5812985028199655, "word": "Buccinoid", "pos_group": "adjective", "row_number": 20322, "definition": "Resembling the genus Buccinum or pertaining to the Buccinidae a family of marine univalve shells. See Whelk and Prosobranchiata.", "details": []}, {"x": -0.8751755009769719, "y": -0.07794103902327554, "z": 0.4774861641196302, "word": "Buccinum", "pos_group": "noun", "row_number": 20323, "definition": "A genus of large univalve mollusks abundant in the arctic seas. It includes the common whelk (B. undatum).", "details": []}, {"x": -0.8235808951063444, "y": -0.1723415767096945, "z": 0.5403821704618399, "word": "Buckie", "pos_group": "noun", "row_number": 20361, "definition": "A large spiral marine shell esp. the common whelk. See Buccinum.", "details": []}, {"x": -0.8327088897000419, "y": -0.04838624016502203, "z": 0.5515928541752663, "word": "Buckler", "pos_group": "noun", "row_number": 20381, "definition": "One of the large bony external plates found on many ganoid fishes.", "details": []}, {"x": -0.8709518078730552, "y": -0.13677583918639272, "z": 0.4719484274552836, "word": "Bud", "pos_group": "noun", "row_number": 20411, "definition": "A small protuberance on certain low forms of animals and vegetables which develops into a new organism either free or attached. See Hydra.", "details": []}, {"x": -0.8053001970678907, "y": -0.13054545426885567, "z": 0.5783160701313382, "word": "Buffalo", "pos_group": "noun", "row_number": 20459, "definition": "A species of the genus Bos or Bubalus (B. bubalus) originally from India but now found in most of the warmer countries of the eastern continent. It is larger and less docile than the common ox and is fond of marshy places and rivers.", "details": []}, {"x": -0.8638860741407047, "y": -0.05110288677892126, "z": 0.5010881617725781, "word": "Buffalo", "pos_group": "noun", "row_number": 20464, "definition": "The buffalo fish. See Buffalo fish below.", "details": []}, {"x": -0.8431840023366269, "y": -0.17467156819724133, "z": 0.508459026340475, "word": "Bufo", "pos_group": "noun", "row_number": 20505, "definition": "A genus of Amphibia including various species of toads.", "details": []}, {"x": -0.8149866500126791, "y": -0.07184764258408291, "z": 0.5750084143351477, "word": "Bufonite", "pos_group": "noun", "row_number": 20506, "definition": "An old name for a fossil consisting of the petrified teeth and palatal bones of fishes belonging to the family of Pycnodonts (thick teeth) whose remains occur in the oolite and chalk formations; toadstone; -- so named from a notion that it was originally formed in the head of a toad.", "details": []}, {"x": -0.8773706597958381, "y": -0.09977964214629564, "z": 0.46932371380804205, "word": "Bulimus", "pos_group": "noun", "row_number": 20589, "definition": "A genus of land snails having an elongated spiral shell often of large size. The species are numerous and abundant in tropical America.", "details": []}, {"x": -0.8134991910295651, "y": -0.16164038290066318, "z": 0.5586514591495937, "word": "Bulla", "pos_group": "noun", "row_number": 20618, "definition": "A genus of marine shells. See Bubble shell.", "details": []}, {"x": -0.8452468646771358, "y": -0.042271250518001055, "z": 0.5327014915814635, "word": "Bullfrog", "pos_group": "noun", "row_number": 20656, "definition": "A very large species of frog (Rana Catesbiana) found in North America; -- so named from its loud bellowing in spring.", "details": []}, {"x": -0.8623933966535307, "y": -0.15651907086246045, "z": 0.4814347410238882, "word": "Bullhead", "pos_group": "noun", "row_number": 20657, "definition": "A fresh-water fish of many species of the genus Uranidea esp. U. gobio of Europe and U. Richardsoni of the United States; -- called also miller's thumb.", "details": []}, {"x": -0.8052163522204662, "y": -0.10749863052652915, "z": 0.5831557858340146, "word": "Bullhead", "pos_group": "noun", "row_number": 20658, "definition": "In America several species of Amiurus; -- called also catfish horned pout and bullpout.", "details": []}, {"x": -0.8724415828127178, "y": -0.06532303147004835, "z": 0.4843331354953969, "word": "Bullhead", "pos_group": "noun", "row_number": 20659, "definition": "A marine fish of the genus Cottus; the sculpin.", "details": []}, {"x": -0.8304815402371147, "y": -0.17676128060981033, "z": 0.5282573813990388, "word": "Bullon", "pos_group": "noun", "row_number": 20679, "definition": "A West Indian fish (Scarus Croicensis).", "details": []}, {"x": -0.8250169264529028, "y": -0.054481857375493735, "z": 0.5624755979445882, "word": "Bull trout", "pos_group": "other", "row_number": 20692, "definition": "In England a large salmon trout of several species as Salmo trutta and S. Cambricus which ascend rivers; -- called also sea trout.", "details": []}, {"x": -0.8751439604064272, "y": -0.12331210675949442, "z": 0.46788585455289045, "word": "Bull trout", "pos_group": "other", "row_number": 20693, "definition": "Salvelinus malma of California and Oregon; -- called also Dolly Varden trout and red-spotted trout.", "details": []}, {"x": -0.8065789409242021, "y": -0.14427966674635478, "z": 0.5732484538323268, "word": "Bull trout", "pos_group": "other", "row_number": 20694, "definition": "The huso or salmon of the Danube.", "details": []}, {"x": -0.8575494531806412, "y": -0.044293939069427, "z": 0.5124909582727263, "word": "Bummalo", "pos_group": "noun", "row_number": 20735, "definition": "A small marine Asiatic fish (Saurus ophidon) used in India as a relish; -- called also Bombay duck.", "details": []}, {"x": -0.8510124854661525, "y": -0.17092079685113137, "z": 0.4965519416783062, "word": "Burbot", "pos_group": "noun", "row_number": 20861, "definition": "A fresh-water fish of the genus Lota having on the nose two very small barbels and a larger one on the chin.", "details": []}, {"x": -0.8095374086626396, "y": -0.08418112599329633, "z": 0.5810014819277824, "word": "Bur fish", "pos_group": "other", "row_number": 20897, "definition": "A spinose plectognath fish of the Allantic coast of the United States (esp. Chilo mycterus geometricus) having the power of distending its body with water or air so as to resemble a chestnut bur; -- called also ball fish balloon fish and swellfish.", "details": []}, {"x": -0.8773213477438803, "y": -0.08529916139168374, "z": 0.47226190388251393, "word": "Burgall", "pos_group": "noun", "row_number": 20901, "definition": "A small marine fish; -- also called cunner.", "details": []}, {"x": -0.8187911623698351, "y": -0.1706208864434831, "z": 0.5481510243849724, "word": "Burnstickle", "pos_group": "noun", "row_number": 21024, "definition": "A stickleback (Gasterosteus aculeatus).", "details": []}, {"x": -0.8372381867184706, "y": -0.043500084070895985, "z": 0.545105458958349, "word": "Butt", "pos_group": "noun", "row_number": 21248, "definition": "The common English flounder.", "details": []}, {"x": -0.8686664094706379, "y": -0.14566808287198332, "z": 0.47349707358102144, "word": "Butterfish", "pos_group": "noun", "row_number": 21263, "definition": "A name given to several different fishes in allusion to their slippery coating of mucus as the Stromateus triacanthus of the Atlantic coast the Epinephelus punctatus of the southern coast the rock eel and the kelpfish of New Zealand.", "details": []}, {"x": -0.8037401524317459, "y": -0.12225522270144565, "z": 0.5822846622496711, "word": "But-thorn", "pos_group": "noun", "row_number": 21283, "definition": "The common European starfish (Asterias rubens).", "details": []}, {"x": -0.868086274499125, "y": -0.05438446292527998, "z": 0.4934253238521088, "word": "Cabassou", "pos_group": "noun", "row_number": 21466, "definition": "A species of armadillo of the genus Xenurus (X. unicinctus and X. hispidus); the tatouay.", "details": []}, {"x": -0.8381470603279227, "y": -0.17808302392109457, "z": 0.5155540144880846, "word": "Cabezon", "pos_group": "noun", "row_number": 21480, "definition": "A California fish (Hemilepidotus spinosus) allied to the sculpin.", "details": []}, {"x": -0.8178215702299092, "y": -0.06346640815212959, "z": 0.5719614447696217, "word": "Cabrilla", "pos_group": "noun", "row_number": 21533, "definition": "A name applied to various species of edible fishes of the genus Serranus and related genera inhabiting the Meditarranean the coast of California etc. In California some of them are also called rock bass and kelp salmon.", "details": []}, {"x": -0.877836361182148, "y": -0.10869009638534878, "z": 0.4664652033477191, "word": "Cachalot", "pos_group": "noun", "row_number": 21543, "definition": "The sperm whale (Physeter macrocephalus). It has in the top of its head a large cavity containing an oily fluid which after death concretes into a whitish crystalline substance called spermaceti. See Sperm whale.", "details": []}, {"x": -0.8095735339723419, "y": -0.15682727569990337, "z": 0.5656817998557848, "word": "Cackerel", "pos_group": "noun", "row_number": 21560, "definition": "The mendole; a small worthless Mediterranean fish considered poisonous by the ancients. See Mendole.", "details": []}, {"x": -0.8501838199337602, "y": -0.040397640713554235, "z": 0.524933808158341, "word": "Cade", "pos_group": "noun", "row_number": 21628, "definition": "A barrel or cask as of fish.", "details": []}, {"x": -0.8586396910756378, "y": -0.16406052788439118, "z": 0.4856150987148444, "word": "Caducibranchiate", "pos_group": "adjective", "row_number": 21677, "definition": "With temporary gills: -- applied to those Amphibia in which the gills do not remain in adult life.", "details": []}, {"x": -0.8054169140771372, "y": -0.09818429290958672, "z": 0.5845198363993357, "word": "Caecilian", "pos_group": "noun", "row_number": 21686, "definition": "A limbless amphibian belonging to the order Caeciliae or Ophimorpha. See Ophiomorpha.", "details": []}, {"x": -0.8755126398684777, "y": -0.07147151751734818, "z": 0.4778801519359189, "word": "Calamary", "pos_group": "noun", "row_number": 21791, "definition": "A cephalopod belonging to the genus Loligo and related genera. There are many species. They have a sack of inklike fluid which they discharge from the siphon tube when pursued or alarmed in order to confuse their enemies. Their shell is a thin horny plate within the flesh of the back shaped very much like a quill pen. In America they are called squids. See Squid.", "details": []}, {"x": -0.825348003082309, "y": -0.17696394714961405, "z": 0.5361757503069992, "word": "Calcispongiae", "pos_group": "other", "row_number": 21874, "definition": "An order of marine sponges containing calcareous spicules. See Porifera.", "details": []}, {"x": -0.8291264039188159, "y": -0.047967336925370176, "z": 0.556999587892972, "word": "Calicle", "pos_group": "noun", "row_number": 21977, "definition": "One of the small cuplike cavities often with elevated borders covering the surface of most corals. Each is formed by a polyp. (b) One of the cuplike structures inclosing the zooids of certain hydroids. See Campanularian.", "details": []}, {"x": -0.8738236481172578, "y": -0.1326811953024783, "z": 0.46779047917219596, "word": "Calicoback", "pos_group": "noun", "row_number": 21982, "definition": "The calico bass.", "details": []}, {"x": -0.8040142599383363, "y": -0.13691795074717247, "z": 0.5786316138779528, "word": "Calipash", "pos_group": "noun", "row_number": 22000, "definition": "A part of a turtle which is next to the upper shell. It contains a fatty and gelatinous substance of a dull greenish tinge much esteemed as a delicacy in preparations of turtle.", "details": []}, {"x": -0.8622661124889404, "y": -0.045725639319975406, "z": 0.5043870707720307, "word": "Calipee", "pos_group": "noun", "row_number": 22001, "definition": "A part of a turtle which is attached to the lower shell. It contains a fatty and gelatinous substance of a light yellowish color much esteemed as a delicacy.", "details": []}, {"x": -0.8462201295412561, "y": -0.1761339692451699, "z": 0.5028800227063323, "word": "Calver", "pos_group": "other", "row_number": 22165, "definition": "To crimp; as calvered salmon.", "details": []}, {"x": -0.811493201557622, "y": -0.07499328912338403, "z": 0.5795298011424582, "word": "Camarasaurus", "pos_group": "noun", "row_number": 22210, "definition": "A genus of gigantic American Jurassic dinosaurs having large cavities in the bodies of the dorsal vertebrae.", "details": []}, {"x": -0.8788406001308876, "y": -0.09359447208907777, "z": 0.46784535303447033, "word": "Cambrian", "pos_group": "noun", "row_number": 22235, "definition": "The Cambrian formation.", "details": []}, {"x": -0.8141907909842814, "y": -0.16752537039728152, "z": 0.5559034144072548, "word": "Campanularian", "pos_group": "noun", "row_number": 22319, "definition": "A hydroid of the family ampanularidae characterized by having the polyps or zooids inclosed in bell-shaped calicles or hydrothecae.", "details": []}, {"x": -0.8421155040383179, "y": -0.03970599741143449, "z": 0.5378335352391601, "word": "Cancer", "pos_group": "noun", "row_number": 22418, "definition": "A genus of decapod Crustacea including some of the most common shore crabs of Europe and North America as the rock crab Jonah crab etc. See Crab.", "details": []}, {"x": -0.8656774814860128, "y": -0.1543242546835548, "z": 0.4762210856990683, "word": "Cancriform", "pos_group": "adjective", "row_number": 22426, "definition": "Having the form of or resembling a crab; crab-shaped.", "details": []}, {"x": -0.8028708497234971, "y": -0.11321995359202038, "z": 0.5853030332852295, "word": "Cancrine", "pos_group": "adjective", "row_number": 22428, "definition": "Having the qualities of a crab; crablike.", "details": []}, {"x": -0.8719709993076978, "y": -0.059002935089551546, "z": 0.4859889196444226, "word": "Cancroid", "pos_group": "adjective", "row_number": 22430, "definition": "Resembling a crab; pertaining to the Cancroidea one of the families of crabs including the genus Cancer.", "details": []}, {"x": -0.8328844412915966, "y": -0.1802660547512776, "z": 0.5232663346316048, "word": "Candlefish", "pos_group": "noun", "row_number": 22466, "definition": "A marine fish (Thaleichthys Pacificus) allied to the smelt found on the north Pacific coast; -- called also eulachon. It is so oily that when dried it may be used as a candle by drawing a wick through it", "details": []}, {"x": -0.8213059402841183, "y": -0.05556065297761055, "z": 0.5677759824919701, "word": "Cantab", "pos_group": "noun", "row_number": 22657, "definition": "A Cantabrigian.", "details": []}, {"x": -0.8775689992418078, "y": -0.11812859367159756, "z": 0.46467008395947174, "word": "Cantabrian", "pos_group": "adjective", "row_number": 22660, "definition": "Of or pertaining to Cantabria on the Bay of Biscay in Spain.", "details": []}, {"x": -0.8060803320582062, "y": -0.1507580535588052, "z": 0.5722818427628931, "word": "Capelin", "pos_group": "noun", "row_number": 22839, "definition": "A small marine fish (Mallotus villosus) of the family Salmonidae very abundant on the coasts of Greenland Iceland Newfoundland and Alaska. It is used as a bait for the cod.", "details": []}, {"x": -0.8552163867880131, "y": -0.03985048778921929, "z": 0.5167367515401017, "word": "Capitibranchiata", "pos_group": "other", "row_number": 22913, "definition": "A division of annelids in which the gills arise from or near the head. See Tubicola.", "details": []}, {"x": -0.8543118067314966, "y": -0.1709008719523953, "z": 0.4908607020785805, "word": "Capstone", "pos_group": "noun", "row_number": 23012, "definition": "A fossil echinus of the genus Cannulus; -- so called from its supposed resemblance to a cap.", "details": []}, {"x": -0.8063699392042113, "y": -0.08857702112022052, "z": 0.5847406540315667, "word": "Capuchin", "pos_group": "noun", "row_number": 23077, "definition": "Other species of Cabus as C. fatuellus (the brown or horned capucine.) C. albifrons (the cararara) and C. apella.", "details": []}, {"x": -0.878047535371117, "y": -0.07875487927032501, "z": 0.4720489324422029, "word": "Car", "pos_group": "noun", "row_number": 23093, "definition": "A floating perforated box for living fish.", "details": []}, {"x": -0.8202529099938087, "y": -0.17578381842189553, "z": 0.5443208730406239, "word": "Carangoid", "pos_group": "adjective", "row_number": 23117, "definition": "Belonging to the Carangidae a family of fishes allied to the mackerels and including the caranx American bluefish and the pilot fish.", "details": []}, {"x": -0.8337162479493444, "y": -0.04235858407470309, "z": 0.5505660435047314, "word": "Caranx", "pos_group": "noun", "row_number": 23118, "definition": "A genus of fishes common on the Atlantic coast including the yellow or golden mackerel.", "details": []}, {"x": -0.8717554995228385, "y": -0.14209742761255786, "z": 0.46888236277085554, "word": "Carapace", "pos_group": "noun", "row_number": 23119, "definition": "The thick shell or shield which covers the back of the tortoise or turtle the crab and other crustaceous animals.", "details": []}, {"x": -0.8020731707928771, "y": -0.12857946132420195, "z": 0.5832203278520377, "word": "Carcinology", "pos_group": "noun", "row_number": 23219, "definition": "The department of zoology which treats of the Crustacea (lobsters crabs etc.); -- called also malacostracology and crustaceology.", "details": []}, {"x": -0.8668108920053618, "y": -0.04855281398742891, "z": 0.4962675707264897, "word": "Caribbee", "pos_group": "adjective", "row_number": 23327, "definition": "Of or pertaining to the Caribs to their islands (the eastern and southern West Indies) or to the sea (called the Caribbean sea) lying between those islands and Central America.", "details": []}, {"x": -0.8410572417383891, "y": -0.18026436722625627, "z": 0.5100269346102521, "word": "Caribe", "pos_group": "noun", "row_number": 23329, "definition": "A south American fresh water fish of the genus Serrasalmo of many species remarkable for its voracity. When numerous they attack man or beast often with fatal results.", "details": []}, {"x": -0.8141685630889499, "y": -0.06600706788954769, "z": 0.5768644709689608, "word": "Carinaria", "pos_group": "noun", "row_number": 23345, "definition": "A genus of oceanic heteropod Mollusca having a thin glassy bonnet-shaped shell which covers only the nucleus and gills.", "details": []}, {"x": -0.8796683402528631, "y": -0.10267647007666124, "z": 0.46437178386436184, "word": "Carp", "pos_group": "noun", "row_number": 23485, "definition": "A fresh-water herbivorous fish (Cyprinus carpio.). Several other species of Cyprinus Catla and Carassius are called carp. See Cruclan carp.", "details": []}, {"x": -0.8098912358949723, "y": -0.16306604359915225, "z": 0.5634586510520837, "word": "Carpospore", "pos_group": "noun", "row_number": 23524, "definition": "A kind of spore formed in the conceptacles of red algae.", "details": []}, {"x": -0.8472412693002369, "y": -0.03713831689882731, "z": 0.5299084609745781, "word": "Carvel", "pos_group": "noun", "row_number": 23676, "definition": "A species of jellyfish; sea blubber.", "details": []}, {"x": -0.8620204876598612, "y": -0.16253502213925253, "z": 0.4801073269935047, "word": "Catadromous", "pos_group": "adjective", "row_number": 24000, "definition": "Living in fresh water and going to the sea to spawn; -- opposed to anadromous and said of the eel.", "details": []}, {"x": -0.8027395734479379, "y": -0.10361424399279563, "z": 0.5872591128815492, "word": "Catallacta", "pos_group": "other", "row_number": 24012, "definition": "A division of Protozoa of which Magosphaera is the type. They exist both in a myxopod state with branched pseudopodia and in the form of ciliated bodies united in free spherical colonies.", "details": []}, {"x": -0.8754349591480935, "y": -0.06491002831924228, "z": 0.47895753520011675, "word": "Catanadromous", "pos_group": "adjective", "row_number": 24036, "definition": "Ascending and descending fresh streams from and to the sea as the salmon; anadromous.", "details": []}, {"x": -0.8275042602959011, "y": -0.1811172135816709, "z": 0.531444497700884, "word": "Cataphract", "pos_group": "noun", "row_number": 24044, "definition": "The armor or plate covering some fishes.", "details": []}, {"x": -0.82538551687327, "y": -0.04833139514660847, "z": 0.5624969553508955, "word": "Catfish", "pos_group": "noun", "row_number": 24197, "definition": "A name given in the United States to various species of siluroid fishes; as the yellow cat (Amiurus natalis); the bind cat (Gronias nigrilabrus); the mud cat (Pilodictic oilwaris) the stone cat (Noturus flavus); the sea cat (Arius felis) etc. This name is also sometimes applied to the wolf fish. See Bullhrad.", "details": []}, {"x": -0.8765404623133871, "y": -0.12790190158808712, "z": 0.46402362170215555, "word": "Cauda galli", "pos_group": "other", "row_number": 24302, "definition": "A plume-shaped fossil supposed to be a seaweed characteristic of the lower Devonian rocks; as the cauda galli grit.", "details": []}, {"x": -0.8031153640164874, "y": -0.14351681904878208, "z": 0.578280757704062, "word": "Cauf", "pos_group": "noun", "row_number": 24317, "definition": "A chest with holes for keeping fish alive in water.", "details": []}, {"x": -0.8602313042889315, "y": -0.0406989995111382, "z": 0.5082771828049693, "word": "Cavally", "pos_group": "noun", "row_number": 24430, "definition": "A carangoid fish of the Atlantic coast (Caranx hippos): -- called also horse crevalle. [See Illust. under Carangoid.]", "details": []}, {"x": -0.8494810992875533, "y": -0.17685377683770662, "z": 0.49709617135062356, "word": "Cellepore", "pos_group": "noun", "row_number": 24593, "definition": "A genus of delicate branching corals made up of minute cells belonging to the Bryozoa.", "details": []}, {"x": -0.8080834280297619, "y": -0.07888262112674128, "z": 0.5837625419876166, "word": "Centiped", "pos_group": "noun", "row_number": 24751, "definition": "A species of the Myriapoda; esp. the large flattened venomous kinds of the order Chilopoda found in tropical climates. they are many-jointed and have a great number of feet.", "details": []}, {"x": -0.8799630541443847, "y": -0.08705575280818045, "z": 0.46699712980262287, "word": "Centriscoid", "pos_group": "adjective", "row_number": 24786, "definition": "Allied to or resembling the genus Centriscus of which the bellows fish is an example.", "details": []}, {"x": -0.8153111001238702, "y": -0.17318820340684696, "z": 0.5525157520066853, "word": "Cephalaspis", "pos_group": "noun", "row_number": 24826, "definition": "A genus of fossil ganoid fishes found in the old red sandstone or Devonian formation. The head is large and protected by a broad shield-shaped helmet prolonged behind into two lateral points.", "details": []}, {"x": -0.8387002014931376, "y": -0.03782130375295828, "z": 0.543278493038144, "word": "Cephalata", "pos_group": "other", "row_number": 24827, "definition": "A large division of Mollusca including all except the bivalves; -- so called because the head is distinctly developed. See Illustration in Appendix.", "details": []}, {"x": -0.8689519312842288, "y": -0.1513488975448106, "z": 0.471185793853528, "word": "Cephalopode", "pos_group": "noun", "row_number": 24842, "definition": "One of the Cephalopoda.", "details": []}, {"x": -0.8008236609016843, "y": -0.11941120161970316, "z": 0.5868751392483438, "word": "Cephalopoda", "pos_group": "other", "row_number": 24843, "definition": "The highest class of Mollusca.", "details": []}, {"x": -0.8710710004410279, "y": -0.05277050647280997, "z": 0.48831402379746347, "word": "Cephalopodous", "pos_group": "adjective", "row_number": 24845, "definition": "Belonging to or resembling the cephalopods.", "details": []}, {"x": -0.8356222935909291, "y": -0.18317220068460194, "z": 0.5178641977876004, "word": "Cephaloptera", "pos_group": "noun", "row_number": 24846, "definition": "One of the generic names of the gigantic ray (Manta birostris) known as devilfish and sea devil. It is common on the coasts of South Carolina Florida and farther south. Some of them grow to enormous size becoming twenty feet of more across the body and weighing more than a ton.", "details": []}, {"x": -0.8175309968320974, "y": -0.057433786538511375, "z": 0.5730134635264393, "word": "Cephalothorax", "pos_group": "noun", "row_number": 24849, "definition": "The anterior portion of any one of the Arachnida and higher Crustacea consisting of the united head and thorax.", "details": []}, {"x": -0.8797539986670042, "y": -0.11237307934713248, "z": 0.4619579990296299, "word": "Cephalous", "pos_group": "adjective", "row_number": 24856, "definition": "Having a head; -- applied chiefly to the Cephalata a division of mollusks.", "details": []}, {"x": -0.805999669661248, "y": -0.15728545616201897, "z": 0.5706363270822009, "word": "Ceratobranchia", "pos_group": "other", "row_number": 24872, "definition": "A group of nudibranchiate Mollusca having on the back papilliform or branched organs serving as gills.", "details": []}, {"x": -0.8525078753359555, "y": -0.03590642843520484, "z": 0.5214796744717884, "word": "Ceratodus", "pos_group": "noun", "row_number": 24875, "definition": "A genus of ganoid fishes of the order Dipnoi first known as Mesozoic fossil fishes; but recently two living species have been discovered in Australian rivers. They have lungs so well developed that they can leave the water and breathe in air. In Australia they are called salmon and baramunda. See Dipnoi and Archipterygium.", "details": []}, {"x": -0.8577470322429069, "y": -0.17009632363233937, "z": 0.4851157278065185, "word": "Ceratosaurus", "pos_group": "noun", "row_number": 24878, "definition": "A carnivorous American Jurassic dinosaur allied to the European Megalosaurus. The animal was nearly twenty feet in length and the skull bears a bony horn core on the united nasal bones. See Illustration in Appendix.", "details": []}, {"x": -0.8033778285165467, "y": -0.09362987365806962, "z": 0.5880625063773511, "word": "Ceratospongiae", "pos_group": "other", "row_number": 24879, "definition": "An order of sponges in which the skeleton consists of horny fibers. It includes all the commercial sponges.", "details": []}, {"x": -0.8783800027533649, "y": -0.07202683920063067, "z": 0.4725047144714698, "word": "Cercarian", "pos_group": "noun", "row_number": 24889, "definition": "One of the Cercariae.", "details": []}, {"x": -0.822119884871026, "y": -0.18056106052790194, "z": 0.5399227707003011, "word": "Cerite", "pos_group": "noun", "row_number": 24961, "definition": "A gastropod shell belonging to the family Cerithiidae; -- so called from its hornlike form.", "details": []}, {"x": -0.8299911649270635, "y": -0.04196896458131585, "z": 0.5561953543090669, "word": "Cero", "pos_group": "noun", "row_number": 24965, "definition": "A large and valuable fish of the Mackerel family of the genus Scomberomorus. Two species are found in the West Indies and less commonly on the Atlantic coast of the United States -- the common cero (Scomberomorus caballa) called also kingfish and spotted or king cero (S. regalis).", "details": []}, {"x": -0.8747393592251412, "y": -0.13780454132700443, "z": 0.4645868721908135, "word": "Cestraciont", "pos_group": "noun", "row_number": 25079, "definition": "A shark of the genus Cestracion and of related genera. The posterior teeth form a pavement of bony plates for crushing shellfish. Most of the species are extinct. The Port Jackson shark and a similar one found in California are living examples.", "details": []}, {"x": -0.8007646326552892, "y": -0.13521643860999727, "z": 0.5835173671949005, "word": "Cetacea", "pos_group": "other", "row_number": 25088, "definition": "An order of marine mammals including the whales. Like ordinary mammals they breathe by means of lungs and bring forth living young which they suckle for some time. The anterior limbs are changed to paddles; the tail flukes are horizontal. There are two living suborders:", "details": []}, {"x": -0.8651130101806299, "y": -0.04298218936998981, "z": 0.4997319391565559, "word": "Cetacean", "pos_group": "noun", "row_number": 25089, "definition": "One of the Cetacea.", "details": []}, {"x": -0.8442321002145666, "y": -0.18174869730673784, "z": 0.50422174883141, "word": "Cetaceous", "pos_group": "adjective", "row_number": 25090, "definition": "Of or pertaining to the Cetacea.", "details": []}, {"x": -0.8105482401839531, "y": -0.06931381797708694, "z": 0.581555796955147, "word": "Cete", "pos_group": "noun", "row_number": 25091, "definition": "One of the Cetacea or collectively the Cetacea.", "details": []}, {"x": -0.8811880939281099, "y": -0.09623077656108463, "z": 0.4628684270522185, "word": "Ceylanite", "pos_group": "noun", "row_number": 25104, "definition": "A dingy blue or grayish black variety of spinel. It is also called pleonaste.", "details": []}, {"x": -0.8106366857749445, "y": -0.16917585307281013, "z": 0.5605780002933588, "word": "Chaetetes", "pos_group": "noun", "row_number": 25122, "definition": "A genus of fossil corals common in the lower Silurian limestones.", "details": []}, {"x": -0.843980962214437, "y": -0.03450081117090453, "z": 0.535262393082255, "word": "Chaetodont", "pos_group": "noun", "row_number": 25124, "definition": "A marine fish of the family Chaetodontidae. The chaetodonts have broad compressed bodies and usually bright colors.", "details": []}, {"x": -0.8654423864406852, "y": -0.16022233260366492, "z": 0.4746980934097928, "word": "Chaetognatha", "pos_group": "other", "row_number": 25127, "definition": "An order of free-swimming marine worms of which the genus Sagitta is the type. They have groups of curved spines on each side of the head.", "details": []}, {"x": -0.8003196421053702, "y": -0.10958258919816483, "z": 0.5894744494929008, "word": "Chaetopod", "pos_group": "adjective", "row_number": 25128, "definition": "Pertaining to the Chaetopoda.", "details": []}, {"x": -0.8749373840975864, "y": -0.058342050612162494, "z": 0.48070862176462015, "word": "Chaetopod", "pos_group": "noun", "row_number": 25129, "definition": "One of the Chaetopoda.", "details": []}, {"x": -0.8300223225667249, "y": -0.184742048975714, "z": 0.5262445433267643, "word": "Chaetopoda", "pos_group": "other", "row_number": 25130, "definition": "A very extensive order of Annelida characterized by the presence of lateral setae or spines on most or all of the segments. They are divided into two principal groups: Oligochaeta including the earthworms and allied forms and Polychaeta including most of the marine species.", "details": []}, {"x": -0.8215316266010673, "y": -0.04948053049433927, "z": 0.5680118516335759, "word": "Chalcidian", "pos_group": "noun", "row_number": 25236, "definition": "One of a tropical family of snakelike lizards (Chalcidae) having four small or rudimentary legs.", "details": []}, {"x": -0.8790626077973901, "y": -0.12249409938765747, "z": 0.46069960623779405, "word": "Chalder", "pos_group": "noun", "row_number": 25252, "definition": "A kind of bird; the oyster catcher.", "details": []}, {"x": -0.8026166279928209, "y": -0.15025714493780462, "z": 0.5772602003122798, "word": "Chameleon", "pos_group": "noun", "row_number": 25331, "definition": "A lizardlike reptile of the genus Chamaeleo of several species found in Africa Asia and Europe. The skin is covered with fine granulations; the tail is prehensile and the body is much compressed laterally giving it a high back.", "details": []}, {"x": -0.8578019004629762, "y": -0.0360921232161727, "z": 0.5127116716087656, "word": "Chank", "pos_group": "noun", "row_number": 25437, "definition": "The East Indian name for the large spiral shell of several species of sea conch much used in making bangles esp. Turbinella pyrum. Called also chank chell.", "details": []}, {"x": -0.8529239395938836, "y": -0.17681381902080362, "z": 0.49117983129494225, "word": "Charr", "pos_group": "noun", "row_number": 25571, "definition": "One of the several species of fishes of the genus Salvelinus allied to the spotted trout and salmon inhabiting deep lakes in mountainous regions in Europe. In the United States the brook trout (Salvelinus fontinalis) is sometimes called a char.", "details": []}, {"x": -0.8048004765700482, "y": -0.08347188286448308, "z": 0.5876466946079775, "word": "Charybdis", "pos_group": "noun", "row_number": 25788, "definition": "A dangerous whirlpool on the coast of Sicily opposite Scylla on the Italian coast. It is personified as a female monster. See Scylla.", "details": []}, {"x": -0.880717312701541, "y": -0.08024517016115144, "z": 0.4667951668275754, "word": "Cheirotherium", "pos_group": "noun", "row_number": 26062, "definition": "A genus of extinct animals so named from fossil footprints rudely resembling impressions of the human hand and believed to have been made by labyrinthodont reptiles. See Illustration in Appendix.", "details": []}, {"x": -0.8168475589906962, "y": -0.17855211892551856, "z": 0.5485245721006021, "word": "Chela", "pos_group": "noun", "row_number": 26066, "definition": "The pincherlike claw of Crustacea and Arachnida.", "details": []}, {"x": -0.8350401667310995, "y": -0.03664878114253979, "z": 0.5489670179404805, "word": "Cheliferous", "pos_group": "adjective", "row_number": 26075, "definition": "Having cheliform claws like a crab.", "details": []}, {"x": -0.872171465110391, "y": -0.14762306077398796, "z": 0.4663950764908582, "word": "Chelonia", "pos_group": "other", "row_number": 26078, "definition": "An order of reptiles including the tortoises and turtles peculiar in having a part of the vertebrae ribs and sternum united with the dermal plates so as to form a firm shell. The jaws are covered by a horny beak. See Reptilia; also Illust. in Appendix.", "details": []}, {"x": -0.7991023968597609, "y": -0.12599646149362811, "z": 0.5878437301052635, "word": "Chelura", "pos_group": "noun", "row_number": 26081, "definition": "A genus of marine amphipod crustacea which bore into and sometimes destroy timber.", "details": []}, {"x": -0.8697460990561896, "y": -0.04670767152248644, "z": 0.49128415056613445, "word": "Chilognath", "pos_group": "noun", "row_number": 26390, "definition": "A myriapod of the order Chilognatha.", "details": []}, {"x": -0.8386608585803906, "y": -0.18543473005308037, "z": 0.5121151483556632, "word": "Chilognatha", "pos_group": "other", "row_number": 26391, "definition": "One of the two principal orders of myriapods. They have numerous segments each bearing two pairs of small slender legs which are attached ventrally near together.", "details": []}, {"x": -0.8137380816825631, "y": -0.060085763947798757, "z": 0.5781176656965186, "word": "Chilopod", "pos_group": "noun", "row_number": 26393, "definition": "A myriapod of the order Chilopoda.", "details": []}, {"x": -0.8816653436802344, "y": -0.10611335646707085, "z": 0.4597892749211391, "word": "Chilostomata", "pos_group": "other", "row_number": 26396, "definition": "An extensive suborder of marine Bryozoa mostly with calcareous shells. They have a movable lip and a lid to close the aperture of the cells.", "details": []}, {"x": -0.806340588480357, "y": -0.1637773747384503, "z": 0.5683236990421331, "word": "Chimaera", "pos_group": "noun", "row_number": 26399, "definition": "A cartilaginous fish of several species belonging to the order Holocephali. The teeth are few and large. The head is furnished with appendages and the tail terminates in a point.", "details": []}, {"x": -0.8494521391202554, "y": -0.03251865323107065, "z": 0.5266627009159278, "word": "Chiton", "pos_group": "noun", "row_number": 26587, "definition": "One of a group of gastropod mollusks with a shell composed of eight movable dorsal plates. See Polyplacophora.", "details": []}, {"x": -0.86127291257715, "y": -0.16850766520560706, "z": 0.4793893374156624, "word": "Chlamydate", "pos_group": "adjective", "row_number": 26609, "definition": "Having a mantle; -- applied to certain gastropods.", "details": []}, {"x": -0.8005996152026043, "y": -0.09928209100146233, "z": 0.5909173567799642, "word": "Chlamyphore", "pos_group": "noun", "row_number": 26610, "definition": "A small South American edentate (Chlamyphorus truncatus and C. retusus) allied to the armadillo. It is covered with a leathery shell or coat of mail like a cloak attached along the spine.", "details": []}, {"x": -0.8783071197841168, "y": -0.06519946217615334, "z": 0.47363027085319354, "word": "Chondroganoidea", "pos_group": "noun", "row_number": 26769, "definition": "An order of ganoid fishes including the sturgeons; -- so called on account of their cartilaginous skeleton.", "details": []}, {"x": -0.8243707371507845, "y": -0.1848856505160046, "z": 0.5350048448030597, "word": "Chondropterygii", "pos_group": "other", "row_number": 26779, "definition": "A group of fishes characterized by cartilaginous fins and skeleton. It includes both ganoids (sturgeons etc.) and selachians (sharks) but is now often restricted to the latter.", "details": []}, {"x": -0.8261060410062024, "y": -0.04234563791232833, "z": 0.5619213966053049, "word": "Chondrostei", "pos_group": "other", "row_number": 26780, "definition": "An order of fishes including the sturgeons; -- so named because the skeleton is cartilaginous.", "details": []}, {"x": -0.8775757519974123, "y": -0.13283506692647862, "z": 0.46066869277259825, "word": "Chouicha", "pos_group": "noun", "row_number": 26914, "definition": "The salmon of the Columbia River or California. See Quinnat.", "details": []}, {"x": -0.7998337625988778, "y": -0.1420844461203656, "z": 0.5831620378399051, "word": "Chowder", "pos_group": "noun", "row_number": 26928, "definition": "A seller of fish.", "details": []}, {"x": -0.8630064739530319, "y": -0.03774748567888478, "z": 0.5037806598511672, "word": "Chromid", "pos_group": "noun", "row_number": 27015, "definition": "One of the Chromidae a family of fresh-water fishes abundant in the tropical parts of America and Africa. Some are valuable food fishes as the bulti of the Nile.", "details": []}, {"x": -0.8476320120556555, "y": -0.18250719459927348, "z": 0.49820788437958713, "word": "Chub", "pos_group": "noun", "row_number": 27113, "definition": "A species to fresh-water fish of the Cyprinidae or Carp family. The common European species is Leuciscus cephalus; the cheven. In America the name is applied to various fishes of the same family of the genera Semotilus Squalius Ceratichthys etc. and locally to several very different fishes as the tautog black bass etc.", "details": []}, {"x": -0.8070052019751296, "y": -0.07335433294350872, "z": 0.585970772158043, "word": "Chum", "pos_group": "noun", "row_number": 27158, "definition": "Chopped pieces of fish used as bait.", "details": []}, {"x": -0.8823694363856249, "y": -0.08942947791738971, "z": 0.4619811102328077, "word": "Cilia", "pos_group": "other", "row_number": 27300, "definition": "Small vibratory swimming organs somewhat resembling true cilia as those of Ctenophora.", "details": []}, {"x": -0.8118039403007064, "y": -0.17507624220680373, "z": 0.5570661288635234, "word": "Cirripedia", "pos_group": "other", "row_number": 27664, "definition": "An order of Crustacea including the barnacles. When adult they have a calcareous shell composed of several pieces. From the opening of the shell the animal throws out a group of curved legs looking like a delicate curl whence the name of the group. See Anatifa.", "details": []}, {"x": -0.840437823975587, "y": -0.03252738781444714, "z": 0.540930894914636, "word": "Cirrobranchiata", "pos_group": "other", "row_number": 27665, "definition": "A division of Mollusca having slender cirriform appendages near the mouth; the Scaphopoda.", "details": []}, {"x": -0.8688598216078409, "y": -0.15714052060323405, "z": 0.4694565658078876, "word": "Cirrostomi", "pos_group": "other", "row_number": 27669, "definition": "The lowest group of vertebrates; -- so called from the cirri around the mouth; the Leptocardia. See Amphioxus.", "details": []}, {"x": -0.7981894206555845, "y": -0.11602046896425607, "z": 0.5911284966357283, "word": "Cirrus", "pos_group": "noun", "row_number": 27675, "definition": "A soft tactile appendage of the mantle of many Mollusca and of the parapodia of Annelida. Those near the head of annelids are Tentacular cirri; those of the last segment are caudal cirri.", "details": []}, {"x": -0.8740178059521653, "y": -0.051851083635012604, "z": 0.4831193848361271, "word": "Cisco", "pos_group": "noun", "row_number": 27685, "definition": "The Lake herring (Coregonus Artedi) valuable food fish of the Great Lakes of North America. The name is also applied to C. Hoyi a related species of Lake Michigan.", "details": []}, {"x": -0.8328730280535169, "y": -0.18778411787602795, "z": 0.5206338869248598, "word": "Clam", "pos_group": "other", "row_number": 27833, "definition": "A bivalve mollusk of many kinds especially those that are edible; as the long clam (Mya arenaria) the quahog or round clam (Venus mercenaria) the sea clam or hen clam (Spisula solidissima) and other species of the United States. The name is said to have been given originally to the Tridacna gigas a huge East Indian bivalve.", "details": []}, {"x": -0.8176098427774042, "y": -0.05141144495736253, "z": 0.573472761620728, "word": "Clamp", "pos_group": "noun", "row_number": 27874, "definition": "A mollusk. See Clam.", "details": []}, {"x": -0.8813526992025471, "y": -0.11651693833984435, "z": 0.4578659440145046, "word": "Clasper", "pos_group": "noun", "row_number": 27993, "definition": "One of a pair of organs used by the male for grasping the female among many of the Crustacea.", "details": []}, {"x": -0.8025281119151797, "y": -0.15705499949939214, "z": 0.5755713306950782, "word": "Clasper", "pos_group": "noun", "row_number": 27994, "definition": "One of a pair of male copulatory organs developed on the anterior side of the ventral fins of sharks and other elasmobranchs. See Illust. of Chimaera.", "details": []}, {"x": -0.8550004176950246, "y": -0.03196967734650534, "z": 0.5176410198889707, "word": "Claw", "pos_group": "noun", "row_number": 28090, "definition": "The whole foot of an animal armed with hooked nails; the pinchers of a lobster crab etc.", "details": []}, {"x": -0.8565053953373121, "y": -0.17600259090875206, "z": 0.4852026337021282, "word": "Clepsine", "pos_group": "noun", "row_number": 28264, "definition": "A genus of fresh-water leeches furnished with a proboscis. They feed upon mollusks and worms.", "details": []}, {"x": -0.8016856345881052, "y": -0.08871342979711351, "z": 0.5911261038633799, "word": "Clidastes", "pos_group": "noun", "row_number": 28335, "definition": "A genus of extinct marine reptiles allied to the Mosasaurus. See Illust. in Appendix.", "details": []}, {"x": -0.8810857096393867, "y": -0.07324447596134917, "z": 0.4672507025253206, "word": "Clione", "pos_group": "noun", "row_number": 28455, "definition": "A genus of naked pteropods. One species (Clione papilonacea) abundant in the Arctic Ocean constitutes a part of the food of the Greenland whale. It is sometimes incorrectly called Clio.", "details": []}, {"x": -0.8187849663998528, "y": -0.1835441682096801, "z": 0.5439694082517955, "word": "Cloaca", "pos_group": "noun", "row_number": 28487, "definition": "The common chamber into which the intestinal urinary and generative canals discharge in birds reptiles amphibians and many fishes.", "details": []}, {"x": -0.8311754657628179, "y": -0.03621431891154857, "z": 0.5548295848454151, "word": "Clypeastroid", "pos_group": "adjective", "row_number": 28826, "definition": "Like or related to the genus Clupeaster; -- applied to a group of flattened sea urchins with a rosette of pores on the upper side.", "details": []}, {"x": -0.8752921894492403, "y": -0.14318145376610386, "z": 0.46191195523235845, "word": "Cnidaria", "pos_group": "other", "row_number": 28838, "definition": "A comprehensive group equivalent to the true Coelenterata i. e. exclusive of the sponges. They are so named from presence of stinging cells (cnidae) in the tissues. See Coelenterata.", "details": []}, {"x": -0.7977317504558228, "y": -0.13289868396678953, "z": 0.5881853399351129, "word": "Coachman", "pos_group": "noun", "row_number": 28860, "definition": "A tropical fish of the Atlantic ocean (Dutes auriga); -- called also charioteer. The name refers to a long lashlike spine of the dorsal fin.", "details": []}, {"x": -0.86800373901222, "y": -0.04089336604235972, "z": 0.4948709343601938, "word": "Coalfish", "pos_group": "noun", "row_number": 28937, "definition": "The beshow or candlefish of Alaska.", "details": []}, {"x": -0.8419644873593104, "y": -0.18701422948527208, "z": 0.5060844593502193, "word": "Cob", "pos_group": "noun", "row_number": 29021, "definition": "A young herring.", "details": []}, {"x": -0.8099723237669476, "y": -0.06349583397188303, "z": 0.5830206804220465, "word": "Cob", "pos_group": "noun", "row_number": 29022, "definition": "A fish; -- also called miller's thumb.", "details": []}, {"x": -0.8832721070245779, "y": -0.09941940438038767, "z": 0.45819882909607185, "word": "Cobia", "pos_group": "noun", "row_number": 29060, "definition": "An oceanic fish of large size (Elacate canada); the crabeater; -- called also bonito cubbyyew coalfish and sergeant fish.", "details": []}, {"x": -0.8071036010689844, "y": -0.17015135402920428, "z": 0.5653603221517285, "word": "Coccolith", "pos_group": "noun", "row_number": 29090, "definition": "One of a kind of minute calcareous bodies probably vegetable often abundant in deep-sea mud.", "details": []}, {"x": -0.8460793234648434, "y": -0.029738826142851744, "z": 0.5322268131397724, "word": "Coccosphere", "pos_group": "noun", "row_number": 29091, "definition": "A small rounded marine organism capable of braking up into coccoliths.", "details": []}, {"x": -0.8648444841837089, "y": -0.16614110238077243, "z": 0.4737522055639596, "word": "Coccosteus", "pos_group": "noun", "row_number": 29092, "definition": "An extinct genus of Devonian ganoid fishes having the broad plates about the head studded with berrylike tubercles.", "details": []}, {"x": -0.7980714792940287, "y": -0.10547290091119767, "z": 0.5932599608188786, "word": "Cochleated", "pos_group": "adjective", "row_number": 29112, "definition": "Having the form of a snail shell; spiral; turbinated.", "details": []}, {"x": -0.8778204636944754, "y": -0.058356159006500645, "z": 0.4754216993630226, "word": "Cockle", "pos_group": "noun", "row_number": 29179, "definition": "A bivalve mollusk with radiating ribs of the genus Cardium especially C. edule used in Europe for food; -- sometimes applied to similar shells of other genera.", "details": []}, {"x": -0.8269817354464972, "y": -0.18869531845286228, "z": 0.5296180567464374, "word": "Cock-padle", "pos_group": "noun", "row_number": 29207, "definition": "See Lumpfish.", "details": []}, {"x": -0.8221042845303936, "y": -0.043497079918506015, "z": 0.567672924662902, "word": "Cockup", "pos_group": "noun", "row_number": 29227, "definition": "A large highly esteemed edible fish of India (Lates calcarifer); -- also called begti.", "details": []}, {"x": -0.8802243826523309, "y": -0.12723872637237535, "z": 0.4571819579723797, "word": "Cod", "pos_group": "noun", "row_number": 29253, "definition": "An important edible fish (Gadus morrhua) taken in immense numbers on the northern coasts of Europe and America. It is especially abundant and large on the Grand Bank of Newfoundland. It is salted and dried in large quantities.", "details": []}, {"x": -0.7992966029110078, "y": -0.1491016982120974, "z": 0.5821457069885436, "word": "Codfish", "pos_group": "noun", "row_number": 29272, "definition": "A kind of fish. Same as Cod.", "details": []}, {"x": -0.8605078913134064, "y": -0.032919615354323424, "z": 0.50837237131091, "word": "Cod liver", "pos_group": "noun", "row_number": 29291, "definition": "The liver of the common cod and allied species.", "details": []}, {"x": -0.8512164583425986, "y": -0.18251701825251704, "z": 0.49205495536057087, "word": "Coelacanth", "pos_group": "adjective", "row_number": 29302, "definition": "Having hollow spines as some ganoid fishes.", "details": []}, {"x": -0.8035825988839291, "y": -0.07809143515835609, "z": 0.5900480781477546, "word": "Coelenterata", "pos_group": "other", "row_number": 29304, "definition": "A comprehensive group of Invertebrata mostly marine comprising the Anthozoa Hydrozoa and Ctenophora. The name implies that the stomach and body cavities are one. The group is sometimes enlarged so as to include the sponges.", "details": []}, {"x": -0.8831892286129783, "y": -0.08235021601704001, "z": 0.4617306881548583, "word": "Coelodont", "pos_group": "adjective", "row_number": 29310, "definition": "Having hollow teeth; -- said of a group lizards.", "details": []}, {"x": -0.8133840007535982, "y": -0.18068987608541467, "z": 0.5529535568185705, "word": "Coelodont", "pos_group": "noun", "row_number": 29311, "definition": "One of a group of lizards having hollow teeth.", "details": []}, {"x": -0.8366482439456487, "y": -0.03125449552360903, "z": 0.5468481255451342, "word": "Coendoo", "pos_group": "noun", "row_number": 29315, "definition": "The Brazilian porcupine (Cercolades / Sphingurus prehensiles) remarkable for its prehensile tail.", "details": []}, {"x": -0.872228128359465, "y": -0.15331311802952705, "z": 0.4644493297859405, "word": "Coenoecium", "pos_group": "noun", "row_number": 29320, "definition": "The common tissue which unites the various zooids of a bryozoan.", "details": []}, {"x": -0.7963784051689602, "y": -0.12285676462177153, "z": 0.5921888644404032, "word": "Cold-blooded", "pos_group": "adjective", "row_number": 29615, "definition": "Having cold blood; -- said of fish or animals whose blood is but little warmer than the water or air about them.", "details": []}, {"x": -0.872677363415429, "y": -0.0455184773105198, "z": 0.48617104768345365, "word": "Columbarium", "pos_group": "noun", "row_number": 30005, "definition": "A sepulchral chamber with niches for holding cinerary urns.", "details": []}, {"x": -0.8360252234621728, "y": -0.19019453562222643, "z": 0.5146725797577231, "word": "Columbella", "pos_group": "noun", "row_number": 30010, "definition": "A genus of univalve shells abundant in tropical seas. Some species as Columbella mercatoria were formerly used as shell money.", "details": []}, {"x": -0.8136649622000205, "y": -0.05411492930602127, "z": 0.5788099029165306, "word": "Columella", "pos_group": "noun", "row_number": 30029, "definition": "The central pillar or axis of the calicles of certain corals.", "details": []}, {"x": -0.8833758140397064, "y": -0.11003284545327804, "z": 0.4555655211834418, "word": "Comber", "pos_group": "noun", "row_number": 30101, "definition": "The cabrilla. Also a name applied to a species of wrasse.", "details": []}, {"x": -0.8028565442126734, "y": -0.1638275377580831, "z": 0.5732206445052441, "word": "Compsognathus", "pos_group": "noun", "row_number": 31074, "definition": "A genus of Dinosauria found in the Jurassic formation and remarkable for having several birdlike features.", "details": []}, {"x": -0.8518518313750844, "y": -0.028391433734512087, "z": 0.5230127951335547, "word": "Conch", "pos_group": "noun", "row_number": 31290, "definition": "A name applied to various marine univalve shells; esp. to those of the genus Strombus which are of large size. S. gigas is the large pink West Indian conch. The large king queen and cameo conchs are of the genus Cassis. See Cameo.", "details": []}, {"x": -0.86018191704591, "y": -0.1744147448117234, "z": 0.4792353976695429, "word": "Conchifer", "pos_group": "noun", "row_number": 31298, "definition": "One of the Conchifera.", "details": []}, {"x": -0.7987781567650926, "y": -0.09455541858252357, "z": 0.5941487432382946, "word": "Conchifera", "pos_group": "other", "row_number": 31299, "definition": "That class of Mollusca which includes the bivalve shells; the Lamellibranchiata. See Mollusca.", "details": []}, {"x": -0.8810538827598782, "y": -0.06613545517344917, "z": 0.4683696801061566, "word": "Conchology", "pos_group": "noun", "row_number": 31309, "definition": "The science of Mollusca and of the shells which they form; malacology.", "details": []}, {"x": -0.8211052720009993, "y": -0.18809556838248553, "z": 0.5388934861798151, "word": "Cone", "pos_group": "noun", "row_number": 31676, "definition": "A shell of the genus Conus having a conical form.", "details": []}, {"x": -0.82714706453909, "y": -0.03653760811300154, "z": 0.5607965199764946, "word": "Coney", "pos_group": "noun", "row_number": 31684, "definition": "A fish. See Cony.", "details": []}, {"x": -0.8782717388735906, "y": -0.1380637767838862, "z": 0.45779596572723186, "word": "Conger", "pos_group": "noun", "row_number": 32006, "definition": "The conger eel; -- called also congeree.", "details": []}, {"x": -0.79 number": 35428, "definition": "One of the brachyuran Crustacea. They are mostly marine and usually have a broad short body covered with a strong shell or carapace. The abdomen is small and curled up beneath the body.", "details": []}, {"x": -0.7938971024625152, "y": -0.11921071062949067, "z": 0.5962517900793542, "word": "Crabbing", "pos_group": "noun", "row_number": 35445, "definition": "The act or art of catching crabs.", "details": []}, {"x": -0.8755894699639457, "y": -0.04494911473458194, "z": 0.4809601409398015, "word": "Crabby", "pos_group": "adjective", "row_number": 35449, "definition": "Crabbed; difficult or perplexing.", "details": []}, {"x": -0.8331767143121052, "y": -0.1945466783464389, "z": 0.517656404067845, "word": "Crabeater", "pos_group": "noun", "row_number": 35451, "definition": "An etheostomoid fish of the southern United States (Hadropterus nigrofasciatus).", "details": []}, {"x": -0.8139256564258578, "y": -0.04812623793710088, "z": 0.5789722713859085, "word": "Craig flounder", "pos_group": "other", "row_number": 35556, "definition": "The pole flounder.", "details": []}, {"x": -0.8848080449199882, "y": -0.11438561340974371, "z": 0.45169752610540703, "word": "Crania", "pos_group": "noun", "row_number": 35622, "definition": "A genus of living Brachiopoda; -- so called from its fancied resemblance to the cranium or skull.", "details": []}, {"x": -0.7994503603772762, "y": -0.16325735700793592, "z": 0.5781229598237962, "word": "Crapefish", "pos_group": "noun", "row_number": 35682, "definition": "Salted codfish hardened by pressure.", "details": []}, {"x": -0.8544155872025863, "y": -0.024745851076897262, "z": 0.5190006235061183, "word": "Crappie", "pos_group": "noun", "row_number": 35684, "definition": "A kind of fresh-water bass of the genus Pomoxys found in the rivers of the Southern United States and Mississippi valley. There are several species.", "details": []}, {"x": -0.8587726098289589, "y": -0.18023150268903196, "z": 0.4796104774147584, "word": "Craspedota", "pos_group": "other", "row_number": 35706, "definition": "The hydroid or naked-eyed medusae. See Hydroidea.", "details": []}, {"x": -0.7972630018713219, "y": -0.08948128463977478, "z": 0.5969629850722272, "word": "#NAME?", "pos_group": "other", "row_number": 35746, "definition": "of Crayfish", "details": []}, {"x": -0.8836681557644556, "y": -0.06767362268523662, "z": 0.4631963636304825, "word": "Crayfish", "pos_group": "noun", "row_number": 35748, "definition": "Any crustacean of the family Astacidae resembling the lobster but smaller and found in fresh waters. Crawfishes are esteemed very delicate food both in Europe and America. The North American species are numerous and mostly belong to the genus Cambarus. The blind crawfish of the Mammoth Cave is Cambarus pellucidus. The common European species is Astacus fluviatilis.", "details": []}, {"x": -0.8177303969855448, "y": -0.19076524847124457, "z": 0.5430705458976464, "word": "Crayfish", "pos_group": "noun", "row_number": 35762, "definition": "See Crawfish.", "details": []}, {"x": -0.8284825949068566, "y": -0.030924648303204513, "z": 0.559160313384028, "word": "Creaturely", "pos_group": "adjective", "row_number": 35865, "definition": "Creatural; characteristic of a creature.", "details": []}, {"x": -0.8786441271973029, "y": -0.14354440795843096, "z": 0.45538939456859706, "word": "Crevis", "pos_group": "noun", "row_number": 36112, "definition": "The crawfish.", "details": []}, {"x": -0.7938166508128062, "y": -0.13742917603627566, "z": 0.592425815158598, "word": "Crinoidea", "pos_group": "other", "row_number": 36259, "definition": "A large class of Echinodermata including numerous extinct families and genera but comparatively few living ones. Most of the fossil species like some that are recent were attached by a jointed stem. See Blastoidea Cystoidea Comatula.", "details": []}, {"x": -0.868755652111984, "y": -0.03364112346689076, "z": 0.49409704687982803, "word": "Croaker", "pos_group": "noun", "row_number": 36361, "definition": "A small American fish (Micropogon undulatus) of the Atlantic coast.", "details": []}, {"x": -0.8430993918011861, "y": -0.19295452055750367, "z": 0.5019481731622242, "word": "Croaker", "pos_group": "noun", "row_number": 36362, "definition": "An American fresh-water fish (Aplodinotus grunniens); -- called also drum.", "details": []}, {"x": -0.805882740973751, "y": -0.061771608523459136, "z": 0.5888440168508623, "word": "Croaker", "pos_group": "noun", "row_number": 36363, "definition": "The surf fish of California.", "details": []}, {"x": -0.8864950128421253, "y": -0.09580991955952897, "z": 0.4527107813163242, "word": "Crocodile", "pos_group": "noun", "row_number": 36395, "definition": "A large reptile of the genus Crocodilus of several species. They grow to the length of sixteen or eighteen feet and inhabit the large rivers of Africa Asia and America. The eggs laid in the sand are hatched by the sun's heat. The best known species is that of the Nile (C. vulgaris or C. Niloticus). The Florida crocodile (C. Americanus) is much less common than the alligator and has longer jaws. The name is also sometimes applied to the species of other related genera as the gavial and the alligator.", "details": []}, {"x": -0.8047734440903811, "y": -0.1769723617600544, "z": 0.5665866984495618, "word": "Crocodilia", "pos_group": "other", "row_number": 36397, "definition": "An order of reptiles including the crocodiles gavials alligators and many extinct kinds.", "details": []}, {"x": -0.8446258248163788, "y": -0.023079793062961, "z": 0.5348593639503963, "word": "Crossfish", "pos_group": "noun", "row_number": 36573, "definition": "A starfish.", "details": []}, {"x": -0.8676451402556785, "y": -0.1689203972919949, "z": 0.4676086076725048, "word": "Crossopterygii", "pos_group": "other", "row_number": 36596, "definition": "An order of ganoid fishes including among living species the bichir (Polypterus). See Brachioganoidei.", "details": []}, {"x": -0.7937309190083 ustaceology", "pos_group": "noun", "row_number": 36936, "definition": "That branch of Zoology which treats of the Crustacea; malacostracology; carcinology.", "details": []}, {"x": -0.8860006352090549, "y": -0.07746514477968917, "z": 0.45716739358074643, "word": "Crustaceous", "pos_group": "adjective", "row_number": 36938, "definition": "Belonging to the Crustacea; crustacean.", "details": []}, {"x": -0.8118793976998889, "y": -0.1877775279932024, "z": 0.5528032593710243, "word": "Crustalogical", "pos_group": "adjective", "row_number": 36941, "definition": "Pertaining to crustalogy.", "details": []}, {"x": -0.8343900328032606, "y": -0.025476531945009716, "z": 0.5505853425933427, "word": "Crustalogy", "pos_group": "noun", "row_number": 36943, "definition": "Crustaceology.", "details": []}, {"x": -0.8753901616870602, "y": -0.15452837344731027, "z": 0.4580535412167787, "word": "Cryptobranchiata", "pos_group": "other", "row_number": 37002, "definition": "A division of the Amphibia; the Derotremata.", "details": []}, {"x": -0.7923095306571264, "y": -0.12662003077937029, "z": 0.5968358027425259, "word": "Cryptobranchiata", "pos_group": "other", "row_number": 37003, "definition": "A group of nudibranch mollusks.", "details": []}, {"x": -0.8738460188379087, "y": -0.03854485791877714, "z": 0.48467249693907594, "word": "Cryptobranchiate", "pos_group": "adjective", "row_number": 37004, "definition": "Having concealed or rudimentary gills.", "details": []}, {"x": -0.8367007468466293, "y": -0.19649085019304557, "z": 0.5111978149568981, "word": "Ctenoidei", "pos_group": "other", "row_number": 37068, "definition": "A group of fishes established by Agassiz characterized by having scales with a pectinated margin as in the perch. The group is now generally regarded as artificial.", "details": []}, {"x": -0.8098362805885759, "y": -0.051588324044777686, "z": 0.5843833018359714, "word": "Ctenophora", "pos_group": "other", "row_number": 37069, "definition": "A class of Coelenterata commonl alled also black skimmer scissorsbill and razorbill. See Skimmer.", "details": []}, {"x": -0.8406107657129073, "y": -0.021437976039140803, "z": 0.5412152563914888, "word": "Cyathophylloid", "pos_group": "noun", "row_number": 37932, "definition": "A fossil coral of the family Cyathophyllidae; sometimes extended to fossil corals of other related families belonging to the group Rugosa; -- also called cup corals. Thay are found in paleozoic rocks.", "details": []}, {"x": -0.8713444819051067, "y": -0.1650362646635456, "z": 0.46208421873012, "word": "Cyclobranchiate", "pos_group": "adjective", "row_number": 37956, "definition": "Having the gills around the margin of the body as certain limpets.", "details": []}, {"x": -0.7916576192878418, "y": -0.11510225831441898, "z": 0.6000247361187929, "word": "Cycloganoidei", "pos_group": "other", "row_number": 37959, "definition": "An order of ganoid fishes having cycloid scales. The bowfin (Amia calva) is a living example.", "details": []}, {"x": -0.8784668234504859, "y": -0.044971431130255105, "z": 0.4756822578979684, "word": "Cycloidei", "pos_group": "other", "row_number": 37965, "definition": "An order of fishes formerly proposed by Agassiz for those with thin smooth scales destitute of marginal spines as the herring and salmon. The group is now regarded as artificial.", "details": []}, {"x": -0.8301390944522586, "y": -0.19848869963623106, "z": 0.5210290970557229, "word": "Cyclops", "pos_group": "other", "row_number": 37979, "definition": "A genus of minute Entomostraca found both in fresh and salt water. See Copepoda.", "details": []}, {"x": -0.8145008070237297, "y": -0.04215134873995371, "z": 0.5786291551219103, "word": "Cyclostomi", "pos_group": "other", "row_number": 37988, "definition": "A glass of fishes having a suckerlike mouth without jaws as the lamprey; the Marsipobranchii.", "details": []}, {"x": -0.8859667822155647, "y": -0.1191276217782938, "z": 0.4481868701111693, "word": "Cymbium", "pos_group": "noun", "row_numbe of the Gulf of Mexico and Southern Atlantic coasts. Several other related species take the same name. See Cephaloptera.", "details": []}, {"x": -0.8894019868948189, "y": -0.09188751931168646, "z": 0.44779547731335206, "word": "Devilfish", "pos_group": "noun", "row_number": 42294, "definition": "A large cephalopod especially the very large species of Octopus and Architeuthis. See Octopus.", "details": []}, {"x": -0.802830834334491, "y": -0.18358649873742966, "z": 0.5672377358067044, "word": "Devilfish", "pos_group": "noun", "row_number": 42295, "definition": "The gray whale of the Pacific coast. See Gray whale.", "details": []}, {"x": -0.8429191904908618, "y": -0.01703772541802432, "z": 0.5377703545332433, "word": "Devilfish", "pos_group": "noun", "row_number": 42296, "definition": "The goosefish or angler (Lophius) and other allied fishes. See Angler.", "details": []}, {"x": -0.8704352700542657, "y": -0.17099743948321236, "z": 0.4616300643759487, "word": "Diamond-back", "pos_group": "noun", "row_number": 42640, "definition": "The salt-marsh terrapin of the Atlantic coast (Malacoclemmys palustris).", "details": []}, {"x": -0.7896610115165752, "y": -0.110571180177906, "z": 0.6034977224519444, "word": "Dibranchiata", "pos_group": "other", "row_number": 42772, "definition": "An order of cephalopods which includes those with two gills an apparatus for emitting an inky fluid and either eight or ten cephalic arms bearing suckers or hooks as the octopi and squids. See Cephalopoda.", "details": []}, {"x": -0.8812937411391588, "y": -0.04556226017899058, "z": 0.4703673269651358, "word": "Dibranchiate", "pos_group": "adjective", "row_number": 42773, "definition": "Having two gills.", "details": []}, {"x": -0.826934361460495, "y": -0.2020149800147748, "z": 0.5247566194775951, "word": "Dibranchiate", "pos_group": "noun", "row_number": 42774, "definition": "One of the Dibranchiata.", "details": []}, {"x": -0.81537371987563, "y": -0.036221630299685836, "z": 0.577800735924255, "word": "Dicoccous", "pos_group": "adjective", "row_number": 42839, "definition": "Composed of two coherent one-seeded carpels; as a dicoccous capsule.", "details": []}, {"x": -0.8868546212844515, "y": -0.12421836425788794, "z": 0.4450378396131127, "word": "Dicynodont", "pos_group": "noun", "row_number": 42885, "definition": "One of a group of extinct reptiles having the jaws armed with a horny beak as in turtles and in the genus Dicynodon supporting also a pair of powerful tusks. Their remains are found in triassic strata of South Africa and India.", "details": []}, {"x": -0.7929213582658804, "y": -0.16038358779461026, "z": 0.5878374132121228, "word": "Didelphous", "pos_group": "noun", "row_number": 42911, "definition": "Formerly any marsupial; but the term is now restricted to an American genus which includes the opossums of which there are many species. See Opossum. [Written also Didelphis.] See Illustration in Appendix.", "details": []}, {"x": -0.8599453797720555, "y": -0.01888418673591419, "z": 0.5100365980005928, "word": "Dimyaria", "pos_group": "other", "row_number": 43432, "definition": "An order of lamellibranchiate mollusks having an anterior and posterior adductor muscle as the common clam. See Bivalve.", "details": []}, {"x": -0.8550814978009539, "y": -0.19148948342997688, "z": 0.48183753470874163, "word": "Dinichthys", "pos_group": "noun", "row_number": 43477, "definition": "A genus of large extinct Devonian ganoid fishes. In some parts of Ohio remains of the Dinichthys are abundant indicating animals twenty feet in length.", "details": []}, {"x": -0.7951201187151854, "y": -0.0784595927080733, "z": 0.6013552104425741, "word": "Dinosauria", "pos_group": "other", "row_number": 43490, "definition": "An order of extinct mesozoic reptiles mostly of large size (whence the name). Notwithstanding their size they present birdlike characters in the skeleton esp. in the pelvis and hind limbs. Some walked on their three-toed hind feet thus producing the large \"\"\"\"bird tracks \" so-called of mesozoic sandstones; others were five-toed and quadrupedal. See Illust. of Compsognathus also Illustration of Dinosaur in Appendix.", "details": []}, {"x": -0.8884633020161893, "y": -0.07241251976375981, "z": 0.4531990599636685, "word": "Dinotherium", "pos_group": "noun", "row_number": 43492, "definition": "A large extinct proboscidean mammal from the miocene beds of Europe and Asia. It is remarkable fora pair of tusks directed downward from the decurved apex of the lower jaw.", "details": []}, {"x": -0.810736571665399, "y": -0.1945269518176525, "z": 0.5521462454647028, "word": "Diodon", "pos_group": "noun", "row_number": 43508, "definition": "A genus of spinose plectognath fishes having the teeth of each jaw united into a single beaklike plate. They are able to inflate the body by taking in air or water and hence are called globefishes swellfishes etc. Called also porcupine fishes and sea hedgehogs.", "details": []}, {"x": -0.8319493615369333, "y": -0.020364188944340663, "z": 0.554477735934391, "word": "Diodon", "pos_group": "noun", "row_number": 43509, "definition": "A genus of whales.", "details": []}, {"x": -0.8784632149492458, "y": -0.15510062428137575, "z": 0.45193603123513243, "word": "Diodont", "pos_group": "adjective", "row_number": 43510, "definition": "Like or pertaining to the genus Diodon.", "details": []}, {"x": -0.7885564578433498, "y": -0.13066738851840468, "z": 0.6009199167703874, "word": "Diodont", "pos_group": "noun", "row_number": 43511, "definition": "A fish of the genus Diodon or an allied genus.", "details": []}, {"x": -0.8746410166200946, "y": -0.031794060848585395, "z": 0.4837274333139724, "word": "Dioecia", "pos_group": "other", "row_number": 43513, "definition": "A subclass of gastropod mollusks in which the sexes are separate. It includes most of the large marine species like the conchs cones and cowries.", "details": []}, {"x": -0.8376147638446766, "y": -0.20217611392284462, "z": 0.5074705177135748, "word": "Dio  -0.8746256588666181, "y": -0.179558935078042, "z": 0.4503204921894779, "word": "Footstalk", "pos_group": "noun", "row_number": 61169, "definition": "The stem which supports which supports the eye in decapod Crustacea; eyestalk.", "details": []}, {"x": -0.7805182354773587, "y": -0.1119062962303769, "z": 0.6150351737513144, "word": "Foraminifera", "pos_group": "other", "row_number": 61215, "definition": "An extensive order of rhizopods which generally have a chambered calcareous shell formed by several united zooids. Many of them have perforated walls whence the name. Some species are covered with sand. See Rhizophoda.", "details": []}, {"x": -0.886237617812839, "y": -0.03447864994273246, "z": 0.4619460006013156, "word": "Forkbeard", "pos_group": "noun", "row_number": 61724, "definition": "A European fish (Raniceps raninus) having a large flat head; -- also called tadpole fish and lesser forked beard.", "details": []}, {"x": -0.8244355791865303, "y": -0.21644925913367002, "z": 0.5229299130780871, "word": "Forktail", "pos_group": "noun", "row_number": 61732, "definition": "A salmon in its fourth year's growth.", "details": []}, {"x": -0.809774337798442, "y": -0.02545431173330995, "z": 0.5861890478824031, "word": "Fossil", "pos_group": "noun", "row_number": 62057, "definition": "The remains of an animal or plant found in stratified rocks. Most fossils belong to extinct species but many of the later ones belong to species still living.", "details": []}, {"x": -0.8932576153773794, "y": -0.12510423522904338, "z": 0.4317867099599915, "word": "Fox", "pos_group": "noun", "row_number": 62249, "definition": "The fox shark or thrasher shark; -- called also sea fox. See Thrasher shark under Shark.", "details": []}, {"x": -0.7847337625006183, "y": -0.1692660211654489, "z": 0.5962733736051283, "word": "Foxfish", "pos_group": "noun", "row_number": 62270, "definition": "The fox shark; -- called also sea fox. See Thrasher shark under Shark.", "details": []}, {"x": -0.86127230157903,  genera.", "details": []}, {"x": -0.8783361684662518, "y": -0.01897758942521292, "z": 0.47766664763580924, "word": "Frostfish", "pos_group": "noun", "row_number": 63097, "definition": "A name applied in New Zealand to the scabbard fish (Lepidotus) valued as a food fish.", "details": []}, {"x": -0.8368276811201609, "y": -0.21610001063541198, "z": 0.5030111504871728, "word": "Fry", "pos_group": "noun", "row_number": 63261, "definition": "The young of any fish.", "details": []}, {"x": -0.7991578615767544, "y": -0.04145574554541284, "z": 0.599690031133871, "word": "Fry", "pos_group": "noun", "row_number": 63262, "definition": "A swarm or crowd especially of little fishes; young or small things in general.", "details": []}, {"x": -0.8962745489129593, "y": -0.10181257337826993, "z": 0.43165510870713175, "word": "Fucivorous", "pos_group": "adjective", "row_number": 63279, "definition": "Eating fucus or other seaweeds.", "details": []}, {"x": -0.7906680684276102, "y": -0.18758229465130866, "z": 0.5828008993664143, "word": "Fucoidal", "pos_group": "adjective", "row_number": 63284, "definition": "Containing impressions of fossil fucoids or seaweeds; as fucoidal sandstone.", "details": []}, {"x": -0.8492541373486909, "y": -0.0006039864375133132, "z": 0.5279839442601587, "word": "Fucus", "pos_group": "noun", "row_number": 63287, "definition": "A genus of tough leathery seaweeds usually of a dull brownish green color; rockweed.", "details": []}, {"x": -0.8685091361694067, "y": -0.19063098862332525, "z": 0.45754967661092755, "word": "Fulcrum", "pos_group": "noun", "row_number": 63354, "definition": "One of the small spiniform scales found on the front edge of the dorsal and caudal fins of many ganoid fishes.", "details": []}, {"x": -0.7814312621802377, "y": -0.09741661943539089, "z": 0.6163401534422214, "word": "Fulmar", "pos_group": "noun", "row_number": 63428, "definition": "One of several species of sea birds of the family procellariidae allied to the albatrosses and petrels.
