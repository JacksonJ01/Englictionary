": "One of the spheromeres of a radiate especially one of the arms of a starfish or an ophiuran.", "details": []}, {"x": -0.9180947392310929, "y": -0.05366414339060301, "z": 0.39271135648252453, "word": "Ray", "pos_group": "noun", "row_number": 125732, "definition": "Any one of numerous elasmobranch fishes of the order Raiae including the skates torpedoes sawfishes etc.", "details": []}, {"x": -0.7779937156240322, "y": -0.2516032173922498, "z": 0.5756922784330017, "word": "Ray", "pos_group": "noun", "row_number": 125733, "definition": "In a restricted sense any of the broad flat narrow-tailed species as the skates and sting rays. See Skate.", "details": []}, {"x": -0.8244506940896458, "y": 0.04845416622557283, "z": 0.5638556967793139, "word": "Razorbill", "pos_group": "noun", "row_number": 125754, "definition": "A species of auk (Alca torda) common in the Arctic seas. See Auk and Illust. in Appendix.", "details": []}, {"x": -0.8960705023113478, "y": -0.1961210728386377, "z": 0.39823884752257704, "word": "Redbreast", "pos_group": "noun", "row_number": 126822, "definition": "The long-eared pondfish. See Pondfish.", "details": []}, {"x": -0.7439291099663278, "y": -0.1355469852173181, "z": 0.6543672471504083, "word": "Redeye", "pos_group": "noun", "row_number": 126889, "definition": "The goggle-eye or fresh-water rock bass.", "details": []}, {"x": -0.8966784427526329, "y": 0.01979189319103545, "z": 0.44223981194214995, "word": "Redfish", "pos_group": "noun", "row_number": 126892, "definition": "The blueback salmon of the North Pacific; -- called also nerka. See Blueback (b).", "details": []}, {"x": -0.8235546452027913, "y": -0.26994460822677807, "z": 0.49888641478215856, "word": "Redfish", "pos_group": "noun", "row_number": 126893, "definition": "The rosefish.", "details": []}, {"x": -0.7785800146174103, "y": 0.002031066190219765, "z": 0.6275420588362854, "word": "Redfish", "pos_group": "noun", "row_number": 126894, "definition": "A large California labroid food fish (Trochocopus pulcher); -- called also fathead.", "details": []}, {"x": -0.9180603207621054, "y": -0.10928177691038546, "z": 0.381081015897524, "word": "Redmouth", "pos_group": "noun", "row_number": 126940, "definition": "Any one of several species of marine food fishes of the genus Diabasis or Haemulon of the Southern United States having the inside of the mouth bright red. Called also flannelmouth and grunt.", "details": []}, {"x": -0.7572932632798518, "y": -0.21718521164932847, "z": 0.6159038051772284, "word": "Red-riband", "pos_group": "noun", "row_number": 126985, "definition": "The European red band fish or fireflame. See Rend fish.", "details": []}, {"x": -0.8548743651444759, "y": 0.05334704106528508, "z": 0.5160851800123775, "word": "Reef", "pos_group": "noun", "row_number": 127094, "definition": "A chain or range of rocks lying at or near the surface of the water. See Coral reefs under Coral.", "details": []}, {"x": -0.8717575216596173, "y": -0.23775335187028854, "z": 0.42838320123964313, "word": "Reefing", "pos_group": "noun", "row_number": 127103, "definition": "The process of taking in a reef.", "details": []}, {"x": -0.7492094431169403, "y": -0.07901219643956676, "z": 0.6576034391319737, "word": "Regular", "pos_group": "adjective", "row_number": 127692, "definition": "Having all the parts of the same kind alike in size and shape; as a regular flower; a regular sea urchin.", "details": []}, {"x": -0.9130680987016414, "y": -0.021931069267584383, "z": 0.40721698802254047, "word": "Regularia", "pos_group": "other", "row_number": 127696, "definition": "A division of Echini which includes the circular or regular sea urchins.", "details": []}, {"x": -0.7939502398434923, "y": -0.2649417227083236, "z": 0.5472192432844507, "word": "Remiped", "pos_group": "noun", "row_number": 128260, "definition": "An animal having limbs like oars especially one of certain crustaceans.", "details": []}, {"x": -0.8057061023508227, "y": 0.036412501885879536, "z": 0.591195235384265, "word": "Remora", "pos_group": "noun", "row_number": 128338, "definition": "Any one of several species of fishes belonging to Echeneis Remora and allied genera. Called also sucking fish.", "details": []}, {"x": -0.9075195971898007, "y": -0.1649833623886822, "z": 0.3862494930111711, "word": "Repkie", "pos_group": "noun", "row_number": 128741, "definition": "Any edible sea urchin.", "details": []}, {"x": -0.7455575463337601, "y": -0.16939920637863337, "z": 0.6445524447111132, "word": "Reptantia", "pos_group": "other", "row_number": 129019, "definition": "A division of gastropods; the Pectinibranchiata.", "details": []}, {"x": -0.882585460236929, "y": 0.038604990060281494, "z": 0.4685643607027895, "word": "Reptile", "pos_group": "noun", "row_number": 129025, "definition": "One of the Reptilia or one of the Amphibia.", "details": []}, {"x": -0.8424769844528104, "y": -0.2637966256097566, "z": 0.4697274432947312, "word": "Retepore", "pos_group": "noun", "row_number": 129869, "definition": "Any one of several species of bryozoans of the genus Retepora. They form delicate calcareous corals usually composed of thin fenestrated fronds.", "details": []}, {"x": -0.7645311780328526, "y": -0.02582854574784331, "z": 0.6440690677561298, "word": "Reticularia", "pos_group": "other", "row_number": 129888, "definition": "An extensive division of rhizopods in which the pseudopodia are more or less slender and coalesce at certain points forming irregular meshes. It includes the shelled Foraminifera together with some groups which lack a true shell.", "details": []}, {"x": -0.9196157136301883, "y": -0.07430698813981203, "z": 0.38572711955218975, "word": "Rhabdolith", "pos_group": "noun", "row_number": 130536, "definition": "A minute calcareous rodlike structure found both at the surface and the bottom of the ocean; -- supposed by some to be a calcareous alga.", "details": []}, {"x": -0.7688176726027779, "y": -0.2408721733367003, "z": 0.5923681139339817, "word": "Rhabdophora", "pos_group": "other", "row_number": 130541, "definition": "An extinct division of Hydrozoa which includes the graptolities.", "details": []}, {"x": -0.8360824355682271, "y": 0.05332687338802616, "z": 0.5460058658191859, "word": "Rhabdopleura", "pos_group": "noun", "row_number": 130542, "definition": "A genus of marine Bryozoa in which the tubular cells have a centralchitinous axis and the tentacles are borne on a bilobed lophophore. It is the type of the order Pterobranchia or Podostomata", "details": []}, {"x": -0.8877106284509466, "y": -0.21399499476077957, "z": 0.40764688438961394, "word": "Rhachidian", "pos_group": "adjective", "row_number": 130545, "definition": "Of or pertaining to the rhachis; as the rhachidian teeth of a mollusk.", "details": []}, {"x": -0.7442415401869958, "y": -0.11400636927623142, "z": 0.6581087126186219, "word": "Rhachiglossa", "pos_group": "other", "row_number": 130546, "definition": "A division of marine gastropods having a retractile proboscis and three longitudinal rows of teeth on the radula. It includes many of the large ornamental shells as the miters murices olives purpuras volutes and whelks. See Illust. in Append.", "details": []}, {"x": -0.9041991381147509, "y": 0.00594921951897479, "z": 0.42706969620854246, "word": "Rhachis", "pos_group": "noun", "row_number": 130556, "definition": "The median part of the radula of a mollusk.", "details": []}, {"x": -0.8117661794758061, "y": -0.2710260130329153, "z": 0.5172819058489632, "word": "Rhamphorhynchus", "pos_group": "noun", "row_number": 130567, "definition": "A genus of pterodactyls in which the elongated tail supported a leathery expansion at the tip.", "details": []}, {"x": -0.7880629028486694, "y": 0.017524996801849668, "z": 0.6153452166392647, "word": "Rhipidoglossa", "pos_group": "other", "row_number": 130681, "definition": "A division of gastropod mollusks having a large number of long divergent hooklike lingual teeth in each transverse row. It includes the scutibranchs. See Illustration in Appendix.", "details": []}, {"x": -0.9154838681267303, "y": -0.13100518697547794, "z": 0.38042992545965637, "word": "Rhizocephala", "pos_group": "other", "row_number": 130687, "definition": "A division of Pectostraca including saclike parasites of Crustacea. They adhere by rootlike extensions of the head. See Illusration in Appendix.", "details": []}, {"x": -0.7512244583758839, "y": -0.20059231233766667, "z": 0.6288279075938727, "word": "Rhizopod", "pos_group": "noun", "row_number": 130700, "definition": "One of the Rhizopoda.", "details": []}, {"x": -0.8660219714273315, "y": 0.05065397107905529, "z": 0.4974335334685837, "word": "Rhizopoda", "pos_group": "other", "row_number": 130701, "definition": "An extensive class of Protozoa including those which have pseudopodia by means of which they move about and take their food. The principal groups are Lobosa (or Am/bea) Helizoa Radiolaria and Foraminifera (or Reticularia). See Protozoa.", "details": []}, {"x": -0.8610031983201798, "y": -0.25033152689965044, "z": 0.44272747726170186, "word": "Rhizopodous", "pos_group": "adjective", "row_number": 130702, "definition": "Of or pertaining to the rhizopods.", "details": []}, {"x": -0.7535383407128953, "y": -0.05771412072054629, "z": 0.6548656727490845, "word": "Rhizostomata", "pos_group": "other", "row_number": 130703, "definition": "A suborder of Medusae which includes very large species without marginal tentacles but having large mouth lobes closely united at the edges. See Illust. in Appendix.", "details": []}, {"x": -0.9170596999324456, "y": -0.04071413937336724, "z": 0.3966659370489212, "word": "Rhizostome", "pos_group": "noun", "row_number": 130704, "definition": "One of the Rhizostomata.", "details": []}, {"x": -0.7833493024612878, "y": -0.2584929047165101, "z": 0.5652833701292083, "word": "Rhodosperm", "pos_group": "noun", "row_number": 130724, "definition": "Any seaweed with red spores.", "details": []}, {"x": -0.8169680260152279, "y": 0.04574123898559853, "z": 0.574866057029674, "word": "Rhomboganoid", "pos_group": "noun", "row_number": 130729, "definition": "A ganoid fish having rhombic enameled scales; one of the Rhomboganoidei.", "details": []}, {"x": -0.9011308787632532, "y": -0.18514615353878006, "z": 0.3920255618823363, "word": "Rhynchocephala", "pos_group": "other", "row_number": 130776, "definition": "An order of reptiles having biconcave vertebrae immovable quadrate bones and many other peculiar osteological characters. Hatteria is the only living genus but numerous fossil genera are known some of which are among the earliest of reptiles. See Hatteria. Called also Rhynchocephalia.", "details": []}, {"x": -0.7433324263926855, "y": -0.14894038541665058, "z": 0.6521300985732085, "word": "Rhyncholite", "pos_group": "noun", "row_number": 130778, "definition": "A fossil cephalopod beak.", "details": []}, {"x": -0.8918773055808561, "y": 0.028647965369312307, "z": 0.45136921236392585, "word": "Rhynchonella", "pos_group": "noun", "row_number": 130779, "definition": "A genus of brachiopods of which some species are still living while many are found fossil.", "details": []}, {"x": -0.8306147189410517, "y": -0.2695274323003871, "z": 0.4872721538483786, "word": "Rhynchophore", "pos_group": "noun", "row_number": 130781, "definition": "One of the Rhynchophora.", "details": []}, {"x": -0.7723510615625022, "y": -0.007363770424929562, "z": 0.6351532197733117, "word": "Rice-shell", "pos_group": "noun", "row_number": 130869, "definition": "Any one of numerous species of small white polished marine shells of the genus Olivella.", "details": []}, {"x": -0.9195662682714647, "y": -0.09576114420531989, "z": 0.3810874985062884, "word": "Riggle", "pos_group": "noun", "row_number": 131069, "definition": "The European lance fish.", "details": []}, {"x": -0.760685165577029, "y": -0.22764866150798652, "z": 0.6078932190645575, "word": "Right whale", "pos_group": "other", "row_number": 131141, "definition": "The bowhead Arctic or Greenland whale (Balaena mysticetus) from whose mouth the best whalebone is obtained.", "details": []}, {"x": -0.847746118270479, "y": 0.055334559538353006, "z": 0.5275079198249366, "word": "Right whale", "pos_group": "other", "row_number": 131142, "definition": "Any other whale that produces valuable whalebone as the Atlantic or Biscay right whale (Balaena cisarctica) and the Pacific right whale (B. Sieboldii); a bone whale.", "details": []}, {"x": -0.8782597843655606, "y": -0.23013628822999324, "z": 0.4191623074727504, "word": "Rip", "pos_group": "noun", "row_number": 131316, "definition": "A wicker fish basket.", "details": []}, {"x": -0.7461314727528787, "y": -0.09215529159646495, "z": 0.6593900420831292, "word": "Ripper", "pos_group": "noun", "row_number": 131350, "definition": "One who brings fish from the seacoast to markets in inland towns.", "details": []}, {"x": -0.9104844480157355, "y": -0.010084846603649342, "z": 0.4134203258071164, "word": "Rise", "pos_group": "noun", "row_number": 131423, "definition": "The spring of a fish to seize food (as a fly) near the surface of the water.", "details": []}, {"x": -0.8002219902215512, "y": -0.2691854838792964, "z": 0.5358954577476177, "word": "Rissoid", "pos_group": "noun", "row_number": 131454, "definition": "Any one of very numerous species of small spiral gastropods of the genus Rissoa or family Rissoidae found both in fresh and salt water.", "details": []}, {"x": -0.798421546267657, "y": 0.030901096254199553, "z": 0.6013053772467468, "word": "Roach", "pos_group": "noun", "row_number": 131530, "definition": "A European fresh-water fish of the Carp family (Leuciscus rutilus). It is silver-white with a greenish back.", "details": []}, {"x": -0.9113713422454379, "y": -0.15252781772663224, "z": 0.3822794022090387, "word": "Roach", "pos_group": "noun", "row_number": 131531, "definition": "An American chub (Semotilus bullaris); the fallfish.", "details": []}, {"x": -0.746545540429714, "y": -0.1821768252265509, "z": 0.6399073061115031, "word": "Rock", "pos_group": "noun", "row_number": 131666, "definition": "The striped bass. See under Bass.", "details": []}, {"x": -0.8766562489800531, "y": 0.045071487961858815, "z": 0.47900144268793937, "word": "Rockfish", "pos_group": "noun", "row_number": 131694, "definition": "Any one of several California scorpaenoid food fishes of the genus Sebastichthys as the red rockfish (S. ruber). They are among the most important of California market fishes. Called also rock cod and garrupa.", "details": []}, {"x": -0.8496157355990409, "y": -0.26047091289128976, "z": 0.45859350776049923, "word": "Rockfish", "pos_group": "noun", "row_number": 131695, "definition": "The striped bass. See Bass.", "details": []}, {"x": -0.7593149004716645, "y": -0.037122849147630414, "z": 0.6496635867838588, "word": "Rockfish", "pos_group": "noun", "row_number": 131696, "definition": "Any one of several species of Florida and Bermuda groupers of the genus Epinephelus.", "details": []}, {"x": -0.9195494097180905, "y": -0.060894492658923584, "z": 0.38822769588338696, "word": "Rockling", "pos_group": "noun", "row_number": 131704, "definition": "Any species of small marine fishes of the genera Onos and Rhinonemus (formerly Motella) allied to the cod. They have three or four barbels.", "details": []}, {"x": -0.7735156668298047, "y": -0.24927583597573866, "z": 0.5826963795729635, "word": "Rockweed", "pos_group": "noun", "row_number": 131709, "definition": "Any coarse seaweed growing on sea-washed rocks especially Fucus.", "details": []}, {"x": -0.8286008069629393, "y": 0.05238438190158717, "z": 0.5573836912156244, "word": "Roe", "pos_group": "noun", "row_number": 131751, "definition": "The ova or spawn of fishes and amphibians especially when still inclosed in the ovarian membranes. Sometimes applied loosely to the sperm and the testes of the male.", "details": []}, {"x": -0.893427611226489, "y": -0.20411689765515073, "z": 0.4001542147594683, "word": "Roncador", "pos_group": "noun", "row_number": 131939, "definition": "Any one of several species of California sciaenoid food fishes especially Roncador Stearnsi which is an excellent market fish and the red roncador (Corvina / Johnius saturna).", "details": []}, {"x": -0.742675542688252, "y": -0.12755319465135267, "z": 0.6573912235700632, "word": "Ronchil", "pos_group": "noun", "row_number": 131940, "definition": "An American marine food fish (Bathymaster signatus) of the North Pacific coast allied to the tilefish.", "details": []}, {"x": -0.9001711136376321, "y": 0.01612889260950797, "z": 0.43523766495510957, "word": "Rorqual", "pos_group": "noun", "row_number": 132104, "definition": "A very large North Atlantic whalebone whale (Physalus antiquorum or Balaenoptera physalus). It has a dorsal fin and strong longitudinal folds on the throat and belly. Called also razorback.", "details": []}, {"x": -0.8186558860811887, "y": -0.2724077348188313, "z": 0.5055655903990078, "word": "Rosefish", "pos_group": "noun", "row_number": 132149, "definition": "A large marine scorpaenoid food fish (Sebastes marinus) found on the northern coasts of Europe and America. called also red perch hemdurgan Norway haddok and also erroneously snapper bream and bergylt.", "details": []}, {"x": -0.7813120262643992, "y": 0.009459362982799764, "z": 0.624068936950541, "word": "Rosette", "pos_group": "noun", "row_number": 132176, "definition": "Any structure having a flowerlike form; especially the group of five broad ambulacra on the upper side of the spatangoid and clypeastroid sea urchins. See Illust. of Spicule and Sand dollar under Sand.", "details": []}, {"x": -0.9179303627252388, "y": -0.11764548907842624, "z": 0.37889759577834403, "word": "Rosmarine", "pos_group": "noun", "row_number": 132198, "definition": "A fabulous sea animal which was reported to climb by means of its teeth to the tops of rocks to feed upon the dew.", "details": []}, {"x": -0.7537514261357466, "y": -0.21214822011594334, "z": 0.6219742119251933, "word": "Rostrifera", "pos_group": "other", "row_number": 132218, "definition": "A division of pectinibranchiate gastropods having the head prolonged into a snout which is not retractile.", "details": []}, {"x": -0.859228803248672, "y": 0.05441388206606527, "z": 0.5086894859404459, "word": "Rostrum", "pos_group": "noun", "row_number": 132229, "definition": "The snout of a gastropod mollusk. See Illust. of Littorina.", "details": []}, {"x": -0.8678767825639515, "y": -0.24423588264511728, "z": 0.43259533505922626, "word": "Rostrum", "pos_group": "noun", "row_number": 132230, "definition": "The anterior often spinelike prolongation of the carapace of a crustacean as in the lobster and the prawn.", "details": []}, {"x": -0.7495776708232421, "y": -0.07038630013945417, "z": 0.6581634175156517, "word": "Rotalite", "pos_group": "noun", "row_number": 132250, "definition": "Any fossil foraminifer of the genus Rotalia abundant in the chalk formation. See Illust. under Rhizopod.", "details": []}, {"x": -0.9154068176599206, "y": -0.028040452674163666, "z": 0.40155210271590525, "word": "Rotella", "pos_group": "noun", "row_number": 132282, "definition": "Any one of numerous species of small polished brightcolored gastropods of the genus Rotella native of tropical seas.", "details": []}, {"x": -0.7891314828246392, "y": -0.26442836824313, "z": 0.5543907835482673, "word": "Roundfish", "pos_group": "noun", "row_number": 132467, "definition": "Any ordinary market fish exclusive of flounders sole halibut and other flatfishes.", "details": []}, {"x": -0.8094746558251926, "y": 0.0418972827676999, "z": 0.5856580907606157, "word": "Roundfish", "pos_group": "noun", "row_number": 132468, "definition": "A lake whitefish (Coregonus quadrilateralis) less compressed than the common species. It is very abundant in British America and Alaska.", "details": []}, {"x": -0.9057806706144376, "y": -0.17345771580928623, "z": 0.3866184133839004, "word": "Roussette", "pos_group": "noun", "row_number": 132520, "definition": "A fruit bat especially the large species (Pieropus vulgaris) inhabiting the islands of the Indian ocean. It measures about a yard across the expanded wings.", "details": []}, {"x": -0.743352426933, "y": -0.16225473485463143, "z": 0.648922622806504, "word": "Roussette", "pos_group": "noun", "row_number": 132521, "definition": "Any small shark of the genus Scyllium; -- called also dogfish. See Dogfish.", "details": []}, {"x": -0.8865777547118376, "y": 0.03667358469316182, "z": 0.4611235550650935, "word": "Rudd", "pos_group": "noun", "row_number": 132773, "definition": "A fresh-water European fish of the Carp family (Leuciscus erythrophthalmus). It is about the size and shape of the roach but it has the dorsal fin farther back a stouter body and red irises. Called also redeye roud finscale and shallow. A blue variety is called azurine or blue roach.", "details": []}, {"x": -0.8377933776998321, "y": -0.267964536850648, "z": 0.47570711921593556, "word": "Rudistes", "pos_group": "other", "row_number": 132812, "definition": "An extinct order or suborder of bivalve mollusks characteristic of the Cretaceous period; -- called also Rudista. See Illust. under Hippurite.", "details": []}, {"x": -0.7664462170926198, "y": -0.017617717823764614, "z": 0.6420668285490967, "word": "Ruffe", "pos_group": "noun", "row_number": 132849, "definition": "A small freshwater European perch (Acerina vulgaris); -- called also pope blacktail and stone / striped perch.", "details": []}, {"x": -0.9204759445604118, "y": -0.08211962397722564, "z": 0.3820738185788927, "word": "Ruffle", "pos_group": "other", "row_number": 132877, "definition": "The connected series of large egg capsules or oothecae of any one of several species of American marine gastropods of the genus Fulgur. See Ootheca.", "details": []}, {"x": -0.7646326792567888, "y": -0.23743100465231956, "z": 0.599135530445637, "word": "Rugosa", "pos_group": "other", "row_number": 132911, "definition": "An extinct tribe of fossil corals including numerous species many of them of large size. They are characteristic of the Paleozoic formations. The radiating septs when present are usually in multiples of four. See Cyathophylloid.", "details": []}, {"x": -0.8403952966112727, "y": 0.056196510051182154, "z": 0.5390525926954796, "word": "Runner", "pos_group": "noun", "row_number": 133165, "definition": "A food fish (Elagatis pinnulatus) of Florida and the West Indies; -- called also skipjack shoemaker and yellowtail. The name alludes to its rapid successive leaps from the water.", "details": []}, {"x": -0.884534888747587, "y": -0.22154053224616285, "z": 0.410509224208642, "word": "Rytina", "pos_group": "noun", "row_number": 133382, "definition": "A genus of large edentulous sirenians allied to the dugong and manatee including but one species (R. Stelleri); -- called also Steller's sea cow.", "details": []}, {"x": -0.7436116049843611, "y": -0.10561591156960685, "z": 0.6602174339987572, "word": "Sabella", "pos_group": "noun", "row_number": 133413, "definition": "A genus of tubicolous annelids having a circle of plumose gills around the head.", "details": []}, {"x": -0.9073052859823387, "y": 0.0012505614943041784, "z": 0.42047063408097285, "word": "Sacalait", "pos_group": "noun", "row_number": 133456, "definition": "A kind of fresh-water bass; the crappie.", "details": []}, {"x": -0.8068141429196973, "y": -0.27235823167835055, "z": 0.5242823022206606, "word": "Saccate", "pos_group": "adjective", "row_number": 133460, "definition": "Of or pertaining to the Saccata a suborder of ctenophores having two pouches into which the long tentacles can be retracted.", "details": []}, {"x": -0.7912605699612639, "y": 0.02432099752555504, "z": 0.6109952532581066, "word": "Sagitta", "pos_group": "noun", "row_number": 133755, "definition": "The larger of the two otoliths or ear bones found in most fishes.", "details": []}, {"x": -0.9147206819786031, "y": -0.13956753021610901, "z": 0.3792189057391185, "word": "Sagitta", "pos_group": "noun", "row_number": 133756, "definition": "A genus of transparent free-swimming marine worms having lateral and caudal fins and capable of swimming rapidly. It is the type of the class Chaetognatha.", "details": []}, {"x": -0.7481513108367461, "y": -0.19462982853765087, "z": 0.634341269299628, "word": "Sagoin", "pos_group": "noun", "row_number": 133769, "definition": "A marmoset; -- called also sagouin.", "details": []}, {"x": -0.8703188699799849, "y": 0.05055420507475707, "z": 0.4898870654610324, "word": "Saibling", "pos_group": "noun", "row_number": 133781, "definition": "A European mountain trout (Salvelinus alpinus); -- called also Bavarian charr.", "details": []}, {"x": -0.8567388742774641, "y": -0.25601899744994905, "z": 0.44771952631810286, "word": "Sailfish", "pos_group": "noun", "row_number": 133808, "definition": "The banner fish or spikefish (Histiophorus.)", "details": []}, {"x": -0.7545303790118282, "y": -0.04909408929103204, "z": 0.6544262200928009, "word": "Sailfish", "pos_group": "noun", "row_number": 133809, "definition": "The basking or liver shark.", "details": []}, {"x": -0.9188623144478099, "y": -0.04761027551672682, "z": 0.39169542855748984, "word": "Saithe", "pos_group": "noun", "row_number": 133846, "definition": "The pollock or coalfish; -- called also sillock.", "details": []}, {"x": -0.7786977472848962, "y": -0.25681314048999165, "z": 0.5724306326928144, "word": "Salamander", "pos_group": "noun", "row_number": 133875, "definition": "Any one of numerous species of Urodela belonging to Salamandra Amblystoma Plethodon and various allied genera especially those that are more or less terrestrial in their habits.", "details": []}, {"x": -0.8210266264159541, "y": 0.05029235740121657, "z": 0.5686703416770263, "word": "Salamandrina", "pos_group": "noun", "row_number": 133880, "definition": "A suborder of Urodela comprising salamanders.", "details": []}, {"x": -0.8987972168323642, "y": -0.19341008634473672, "z": 0.39339052036687117, "word": "Salamandroidea", "pos_group": "other", "row_number": 133883, "definition": "A division of Amphibia including the Salamanders and allied groups; the Urodela.", "details": []}, {"x": -0.7417148855473638, "y": -0.14117236600302333, "z": 0.6556900118459709, "word": "Salina", "pos_group": "adjective", "row_number": 133945, "definition": "A salt marsh or salt pond inclosed from the sea.", "details": []}, {"x": -0.8955981724059882, "y": 0.025586171577075465, "z": 0.4441275283148773, "word": "Sallyman", "pos_group": "noun", "row_number": 134000, "definition": "The velella; -- called also saleeman.", "details": []}, {"x": -0.8257441159815, "y": -0.27265165774965755, "z": 0.49376890186431804, "word": "Salmon", "pos_group": "verb", "row_number": 134009, "definition": "Any one of several species of fishes of the genus Salmo and allied genera. The common salmon (Salmo salar) of Northern Europe and Eastern North America and the California salmon or quinnat are the most important species. They are extensively preserved for food. See Quinnat.", "details": []}, {"x": -0.7748138754186881, "y": 0.00043819636298724293, "z": 0.6321892647321853, "word": "Salmon", "pos_group": "verb", "row_number": 134010, "definition": "A reddish yellow or orange color like the flesh of the salmon.", "details": []}, {"x": -0.9198059001224065, "y": -0.10401476138368779, "z": 0.37833587658891676, "word": "Salmon", "pos_group": "adjective", "row_number": 134011, "definition": "Of a reddish yellow or orange color like that of the flesh of the salmon.", "details": []}, {"x": -0.7568680811385058, "y": -0.22314801135648688, "z": 0.6142928233191084, "word": "Salmonet", "pos_group": "noun", "row_number": 134012, "definition": "A salmon of small size; a samlet.", "details": []}, {"x": -0.8521374748697244, "y": 0.057082374044887904, "z": 0.5201954695074241, "word": "Salmonoid", "pos_group": "adjective", "row_number": 134013, "definition": "Like or pertaining to the Salmonidae a family of fishes including the trout and salmon.", "details": []}, {"x": -0.8746006030238903, "y": -0.23708687095756292, "z": 0.4229226889276565, "word": "Salmonoid", "pos_group": "noun", "row_number": 134014, "definition": "Any fish of the family Salmonidae.", "details": []}, {"x": -0.7461365672538397, "y": -0.08352031022160226, "z": 0.6605335576540706, "word": "Salp", "pos_group": "noun", "row_number": 134023, "definition": "Any species of Salpa or of the family Salpidae.", "details": []}, {"x": -0.9131378356973634, "y": -0.01573944257216099, "z": 0.4073469810437443, "word": "Salpa", "pos_group": "noun", "row_number": 134026, "definition": "A genus of transparent tubular free-swimming oceanic tunicates found abundantly in all the warmer latitudes. See Illustration in Appendix.", "details": []}, {"x": -0.7953029847497236, "y": -0.26935219867673665, "z": 0.5430861400516392, "word": "Salsify", "pos_group": "noun", "row_number": 134035, "definition": "See Oyster plant (a) under Oyster.", "details": []}, {"x": -0.8020238094107719, "y": 0.03693402023168912, "z": 0.5961490478796044, "word": "salsuginous", "pos_group": "adjective", "row_number": 134039, "definition": "Growing in brackish places or in salt marshes.", "details": []}, {"x": -0.9099786624236035, "y": -0.16113047751868528, "z": 0.3820677991513418, "word": "Salt-green", "pos_group": "adjective", "row_number": 134079, "definition": "Sea-green in color.", "details": []}, {"x": -0.7439966533228136, "y": -0.17539156320195262, "z": 0.644753270175521, "word": "Sanderling", "pos_group": "noun", "row_number": 134283, "definition": "A small gray and brown sandpiper (Calidris arenaria) very common on sandy beaches in America Europe and Asia. Called also curwillet sand lark stint and ruddy plover.", "details": []}, {"x": -0.88080989635433, "y": 0.04379826652964828, "z": 0.4714399625968004, "word": "Sandfish", "pos_group": "noun", "row_number": 134287, "definition": "A small marine fish of the Pacific coast of North America (Trichodon trichodon) which buries itself in the sand.", "details": []}, {"x": -0.8450386748929024, "y": -0.2652504721165752, "z": 0.46427559162331744, "word": "Sandnecker", "pos_group": "noun", "row_number": 134295, "definition": "A European flounder (Hippoglossoides limandoides); -- called also rough dab long fluke sand fluke and sand sucker.", "details": []}, {"x": -0.7609119772498747, "y": -0.028668304832167233, "z": 0.6482214831180281, "word": "Sandpiper", "pos_group": "noun", "row_number": 134299, "definition": "A small lamprey eel; the pride.", "details": []}, {"x": -0.9207727392336579, "y": -0.06845480281354753, "z": 0.3840462246343595, "word": "Sandre", "pos_group": "noun", "row_number": 134301, "definition": "A Russian fish (Lucioperca sandre) which yields a valuable oil called sandre oil used in the preparation of caviare.", "details": []}, {"x": -0.7691137897049029, "y": -0.2464508088070073, "z": 0.5896829464416744, "word": "Sandworm", "pos_group": "noun", "row_number": 134307, "definition": "Any one of numerous species of annelids which burrow in the sand of the seashore.", "details": []}, {"x": -0.8328709838432068, "y": 0.05591041283567456, "z": 0.550635950523205, "word": "Sandworm", "pos_group": "noun", "row_number": 134308, "definition": "Any species of annelids of the genus Sabellaria. They construct firm tubes of agglutinated sand on rocks and shells and are sometimes destructive to oysters.", "details": []}, {"x": -0.8905324658812095, "y": -0.21201438977970127, "z": 0.40249450398467995, "word": "Sao", "pos_group": "noun", "row_number": 134408, "definition": "Any marine annelid of the genus Hyalinaecia especially H. tubicola of Europe which inhabits a transparent movable tube resembling a quill in color and texture.", "details": []}, {"x": -0.7416750251536735, "y": -0.11930032542805953, "z": 0.6600648372819574, "word": "Sarco-", "pos_group": "other", "row_number": 134507, "definition": "A combining form from Gr. sa`rx sa`rkos flesh; as sarcophagous flesh-eating; sarcology.", "details": []}, {"x": -0.9035438538667374, "y": 0.011985239167239824, "z": 0.42832797968583397, "word": "Sarcoblast", "pos_group": "noun", "row_number": 134510, "definition": "A minute yellowish body present in the interior of certain rhizopods.", "details": []}, {"x": -0.8136819748433932, "y": -0.27442111727395513, "z": 0.5124594561612361, "word": "Sardine", "pos_group": "noun", "row_number": 134561, "definition": "Any one of several small species of herring which are commonly preserved in olive oil for food especially the pilchard or European sardine (Clupea pilchardus). The California sardine (Clupea sagax) is similar. The American sardines of the Atlantic coast are mostly the young of the common herring and of the menhaden.", "details": []}, {"x": -0.7842758866932265, "y": 0.01670485634439949, "z": 0.6201872953600921, "word": "Sargo", "pos_group": "noun", "row_number": 134574, "definition": "Any one of several species of sparoid fishes belonging to Sargus Pomadasys and related genera; -- called also sar and saragu.", "details": []}, {"x": -0.9175346105830517, "y": -0.1261895163547771, "z": 0.3771026973443111, "word": "Sarigue", "pos_group": "noun", "row_number": 134576, "definition": "A small South American opossum (Didelphys opossum) having four white spots on the face.", "details": []}, {"x": -0.750370804269889, "y": -0.20666254249052174, "z": 0.6278807606788992, "word": "Sarpo", "pos_group": "noun", "row_number": 134595, "definition": "A large toadfish of the Southern United States and the Gulf of Mexico (Batrachus tau var. pardus).", "details": []}, {"x": -0.8636123177882976, "y": 0.05499908383384824, "z": 0.5011475484742609, "word": "Sauger", "pos_group": "noun", "row_number": 134775, "definition": "An American fresh-water food fish (Stizostedion Canadense); -- called also gray pike blue pike hornfish land pike sand pike pickering and pickerel.", "details": []}, {"x": -0.8637929439530604, "y": -0.25045685923508015, "z": 0.4371877304305376, "word": "Saurel", "pos_group": "noun", "row_number": 134791, "definition": "Any carangoid fish of the genus Trachurus especially T. trachurus or T. saurus of Europe and America and T. picturatus of California. Called also skipjack and horse mackerel.", "details": []}, {"x": -0.7502174453360467, "y": -0.0616646223036577, "z": 0.6583093946387236, "word": "Sauroid", "pos_group": "adjective", "row_number": 134799, "definition": "Resembling a saurian superficially; as a sauroid fish.", "details": []}, {"x": -0.9175491566735998, "y": -0.03455286367840748, "z": 0.39611822060994234, "word": "Sauroidichnite", "pos_group": "noun", "row_number": 134800, "definition": "The fossil track of a saurian.", "details": []}, {"x": -0.7843318424395089, "y": -0.2634164454155696, "z": 0.5616363033316771, "word": "Saury", "pos_group": "noun", "row_number": 134806, "definition": "A slender marine fish (Scomberesox saurus) of Europe and America. It has long thin beaklike jaws. Called also billfish gowdnook gawnook skipper skipjack skopster lizard fish and Egypt herring.", "details": []}, {"x": -0.8134124668588244, "y": 0.04704959992085582, "z": 0.5797814190761286, "word": "Sawfish", "pos_group": "noun", "row_number": 134922, "definition": "Any one of several species of elasmobranch fishes of the genus Pristis. They have a sharklike form but are more nearly allied to the rays. The flattened and much elongated snout has a row of stout toothlike structures inserted along each edge forming a sawlike organ with which it mutilates or kills its prey.", "details": []}, {"x": -0.9037739905161638, "y": -0.18194045543744397, "z": 0.38741482256323684, "word": "Sawtooth", "pos_group": "noun", "row_number": 134929, "definition": "An arctic seal (Lobodon carcinophaga) having the molars serrated; -- called also crab-eating seal.", "details": []}, {"x": -0.7413740161272667, "y": -0.15476549879495868, "z": 0.6530024568055431, "word": "Saxicava", "pos_group": "noun", "row_number": 134943, "definition": "Any species of marine bivalve shells of the genus Saxicava. Some of the species are noted for their power of boring holes in limestone and similar rocks.", "details": []}, {"x": -0.8905044765972374, "y": 0.0342418718302721, "z": 0.4536841096774712, "word": "Scad", "pos_group": "noun", "row_number": 135020, "definition": "A small carangoid fish (Trachurus saurus) abundant on the European coast and less common on the American. The name is applied also to several allied species.", "details": []}, {"x": -0.8329807811026705, "y": -0.27173941494115456, "z": 0.4819758382751399, "word": "Scalaria", "pos_group": "noun", "row_number": 135040, "definition": "Any one of numerous species of marine gastropods of the genus Scalaria or family Scalaridae having elongated spiral turreted shells with rounded whorls usually crossed by ribs or varices. The color is generally white or pale. Called also ladder shell and wentletrap. See Ptenoglossa and Wentletrap.", "details": []}, {"x": -0.7686181514989696, "y": -0.009486379805634253, "z": 0.6396375112393662, "word": "Scaldfish", "pos_group": "noun", "row_number": 135055, "definition": "A European flounder (Arnoglossus laterna or Psetta arnoglossa); -- called also megrim and smooth sole.", "details": []}, {"x": -0.921087283561472, "y": -0.09020825049832909, "z": 0.378762046149531, "word": "Scale", "pos_group": "noun", "row_number": 135062, "definition": "One of the small thin membranous bony or horny pieces which form the covering of many fishes and reptiles and some mammals belonging to the dermal part of the skeleton or dermoskeleton. See Cycloid Ctenoid and Ganoid.", "details": []}, {"x": -0.7605589164735169, "y": -0.23350335324125984, "z": 0.6058269708404515, "word": "Scaleback", "pos_group": "noun", "row_number": 135086, "definition": "Any one of numerous species of marine annelids of the family Polynoidae and allies which have two rows of scales or elytra along the back. See Illust. under Chaetopoda.", "details": []}, {"x": -0.8447940607262238, "y": 0.058624449013808054, "z": 0.5318704437544209, "word": "Scallop", "pos_group": "noun", "row_number": 135113, "definition": "Any one of numerous species of marine bivalve mollusks of the genus Pecten and allied genera of the family Pectinidae. The shell is usually radially ribbed and the edge is therefore often undulated in a characteristic manner. The large adductor muscle of some the species is much used as food. One species (Vola Jacobaeus) occurs on the coast of Palestine and its shell was formerly worn by pilgrims as a mark that they had been to the Holy Land. Called also fan shell. See Pecten 2.", "details": []}, {"x": -0.8811222189293048, "y": -0.2289212380066787, "z": 0.41378581669577325, "word": "Scallop", "pos_group": "noun", "row_number": 135115, "definition": "One of the shells of a scallop; also a dish resembling a scallop shell.", "details": []}, {"x": -0.7432462813900197, "y": -0.09702694625973052, "z": 0.6619446630190615, "word": "Scalloper", "pos_group": "noun", "row_number": 135123, "definition": "One who fishes for scallops.", "details": []}, {"x": -0.9102591212933706, "y": -0.0039059132534075077, "z": 0.41402062260698763, "word": "Scalloping", "pos_group": "noun", "row_number": 135124, "definition": "Fishing for scallops.", "details": []}, {"x": -0.8018231551595437, "y": -0.2732138096654394, "z": 0.5314450508360121, "word": "Scalp", "pos_group": "noun", "row_number": 135125, "definition": "A bed of oysters or mussels.", "details": []}, {"x": -0.7946690738169317, "y": 0.03087168082546764, "z": 0.6062573731031652, "word": "Scaly", "pos_group": "adjective", "row_number": 135143, "definition": "Covered or abounding with scales; as a scaly fish.", "details": []}, {"x": -0.9136864881651242, "y": -0.14824487732806288, "z": 0.3784183633103311, "word": "Scamilli", "pos_group": "other", "row_number": 135158, "definition": "of Scamillus", "details": []}, {"x": -0.7452680837987643, "y": -0.18825247235705467, "z": 0.6396377802493959, "word": "Scaphite", "pos_group": "noun", "row_number": 135251, "definition": "Any fossil cephalopod shell of the genus Scaphites belonging to the Ammonite family and having a chambered boat-shaped shell. Scaphites are found in the Cretaceous formation.", "details": []}, {"x": -0.874607716659237, "y": 0.04995735511940164, "z": 0.4822505620832283, "word": "Scaphocerite", "pos_group": "noun", "row_number": 135254, "definition": "A flattened plate or scale attached to the second joint of the antennae of many Crustacea.", "details": []}, {"x": -0.8522975066363428, "y": -0.26138831236836374, "z": 0.4530619277082236, "word": "Scaphognathite", "pos_group": "noun", "row_number": 135255, "definition": "A thin leafike appendage (the exopodite) of the second maxilla of decapod crustaceans. It serves as a pumping organ to draw the water through the gill cavity.", "details": []}, {"x": -0.7557926638300946, "y": -0.04044631970931277, "z": 0.6535606662908822, "word": "Scapholunar", "pos_group": "adjective", "row_number": 135258, "definition": "Of or pertaining to the scaphoid and lunar bones of the carpus.", "details": []}, {"x": -0.920444406035103, "y": -0.054865681766703624, "z": 0.38700368520591777, "word": "Scaphopda", "pos_group": "other", "row_number": 135260, "definition": "A class of marine cephalate Mollusca having a tubular shell open at both ends a pointed or spadelike foot for burrowing and many long slender prehensile oral tentacles. It includes Dentalium or the tooth shells and other similar shells. Called also Prosopocephala and Solenoconcha.", "details": []}, {"x": -0.7741022210216646, "y": -0.2546312980846013, "z": 0.5795935243298332, "word": "Scar", "pos_group": "noun", "row_number": 135287, "definition": "A marine food fish the scarus or parrot fish.", "details": []}, {"x": -0.8252241827530932, "y": 0.05446207010191812, "z": 0.5621733995127334, "word": "Scaroid", "pos_group": "adjective", "row_number": 135347, "definition": "Of or pertaining to the Scaridae a family of marine fishes including the parrot fishes.", "details": []}, {"x": -0.8962035790331763, "y": -0.20161372309355394, "z": 0.39518483218423406, "word": "Scarus", "pos_group": "noun", "row_number": 135357, "definition": "A Mediterranean food fish (Sparisoma scarus) of excellent quality and highly valued by the Romans; -- called also parrot fish.", "details": []}, {"x": -0.7403428868085639, "y": -0.1331119424801639, "z": 0.6589185235832421, "word": "Scaup", "pos_group": "noun", "row_number": 135395, "definition": "A bed or stratum of shellfish; scalp.", "details": []}, {"x": -0.899217906346277, "y": 0.022032611513357545, "z": 0.43694590161268193, "word": "Scepterellate", "pos_group": "adjective", "row_number": 135452, "definition": "Having a straight shaft with whorls of spines; -- said of certain sponge spicules. See Illust. under Spicule.", "details": []}, {"x": -0.820778139521599, "y": -0.2753430795392794, "z": 0.5005091749741343, "word": "Schizopod", "pos_group": "noun", "row_number": 135535, "definition": "one of the Schizopoda. Also used adjectively.", "details": []}, {"x": -0.7775195639754038, "y": 0.008093466607035542, "z": 0.6288066661810917, "word": "Schizopoda", "pos_group": "other", "row_number": 135538, "definition": "A division of shrimplike Thoracostraca in which each of the thoracic legs has a long fringed upper branch (exopodite) for swimming.", "details": []}, {"x": -0.9197836986817509, "y": -0.11248501228478516, "z": 0.3759588669663341, "word": "Sciaenoid", "pos_group": "adjective", "row_number": 135630, "definition": "Of or pertaining to the Sciaenidae a family of marine fishes which includes the meagre the squeteague and the kingfish.", "details": []}, {"x": -0.7531953389378083, "y": -0.21818121570536267, "z": 0.6205592143508063, "word": "Scincoidea", "pos_group": "other", "row_number": 135668, "definition": "A tribe of lizards including the skinks. See Skink.", "details": []}, {"x": -0.8565788355640791, "y": 0.05835912264103956, "z": 0.5127054819955159, "word": "Scincoidian", "pos_group": "noun", "row_number": 135669, "definition": "Any one of numerous species of lizards of the family Scincidae or tribe Scincoidea. The tongue is not extensile. The body and tail are covered with overlapping scales and the toes are margined. See Illust. under Skink.", "details": []}, {"x": -0.8707243268903745, "y": -0.24380896120405102, "z": 0.4270788416649857, "word": "Sclerenchyma", "pos_group": "noun", "row_number": 135741, "definition": "The hard calcareous deposit in the tissues of Anthozoa constituting the stony corals.", "details": []}, {"x": -0.7464129193685758, "y": -0.0747513516617758, "z": 0.661271494338307, "word": "Sclerobase", "pos_group": "noun", "row_number": 135748, "definition": "The calcareous or hornlike coral forming the central stem or axis of most compound alcyonarians; -- called also foot secretion. See Illust. under Gorgoniacea and Coenenchyma.", "details": []}, {"x": -0.9156092681656511, "y": -0.021820340227518845, "z": 0.40147670019755327, "word": "Scleroderm", "pos_group": "noun", "row_number": 135749, "definition": "One of a tribe of plectognath fishes (Sclerodermi) having the skin covered with hard scales or plates as the cowfish and the trunkfish.", "details": []}, {"x": -0.7903821050724019, "y": -0.2690242180515956, "z": 0.5503835917640044, "word": "Scleroderm", "pos_group": "noun", "row_number": 135750, "definition": "One of the Sclerodermata.", "details": []}, {"x": -0.8058118653566065, "y": 0.0426634745535771, "z": 0.5906327671146621, "word": "Sclerodermata", "pos_group": "other", "row_number": 135753, "definition": "The stony corals; the Madreporaria.", "details": []}, {"x": -0.90831483236677, "y": -0.1697804206635148, "z": 0.38228101451922314, "word": "Sclerodermite", "pos_group": "noun", "row_number": 135757, "definition": "The hard integument of Crustacea.", "details": []}, {"x": -0.7416629445294594, "y": -0.16823315868441105, "z": 0.6493332588362912, "word": "Scolithus", "pos_group": "noun", "row_number": 135818, "definition": "A tubular structure found in Potsdam sandstone and believed to be the fossil burrow of a marine worm.", "details": []}, {"x": -0.8849183768774054, "y": 0.042021783447830634, "z": 0.46384656512743727, "word": "Scolopendra", "pos_group": "noun", "row_number": 135822, "definition": "A sea fish.", "details": []}, {"x": -0.8403140547551777, "y": -0.26966102613164455, "z": 0.47027143264984794, "word": "Scomber", "pos_group": "noun", "row_number": 135825, "definition": "A genus of acanthopterygious fishes which includes the common mackerel.", "details": []}, {"x": -0.762772930133086, "y": -0.020254849897646168, "z": 0.6463491302011709, "word": "Scombriformes", "pos_group": "other", "row_number": 135827, "definition": "A division of fishes including the mackerels tunnies and allied fishes.", "details": []}, {"x": -0.9217554527141292, "y": -0.07632371622542493, "z": 0.38018623822189, "word": "Scombroid", "pos_group": "noun", "row_number": 135829, "definition": "Any fish of the family Scombridae of which the mackerel (Scomber) is the type.", "details": []}, {"x": -0.764803950922247, "y": -0.2431296009366151, "z": 0.5966262764931862, "word": "Scopeloid", "pos_group": "adjective", "row_number": 135873, "definition": "Like or pertaining to fishes of the genus Scopelus or family Scopelodae which includes many small oceanic fishes most of which are phosphorescent.", "details": []}, {"x": -0.8372470963071679, "y": 0.05901306180845609, "z": 0.5436310865478601, "word": "Scopeloid", "pos_group": "noun", "row_number": 135874, "definition": "Any fish of the family Scopelidae.", "details": []}, {"x": -0.8873900355316207, "y": -0.21978376963882876, "z": 0.40525796653802515, "word": "Scorpaenoid", "pos_group": "adjective", "row_number": 135946, "definition": "Of or pertaining to the family Scorpaenidae which includes the scorpene the rosefish the California rockfishes and many other food fishes. [Written also scorpaenid.] See Illust. under Rockfish.", "details": []}, {"x": -0.740934355199198, "y": -0.11081310181591282, "z": 0.6623720538726592, "word": "Scorpene", "pos_group": "noun", "row_number": 135947, "definition": "A marine food fish of the genus Scorpaena as the European hogfish (S. scrofa) and the California species (S. guttata).", "details": []}, {"x": -0.9067816660115602, "y": 0.0073676187785842355, "z": 0.42153615311006576, "word": "Scray", "pos_group": "noun", "row_number": 136163, "definition": "A tern; the sea swallow.", "details": []}, {"x": -0.8086482315692024, "y": -0.2759698914749252, "z": 0.5195465874965588, "word": "Screw", "pos_group": "noun", "row_number": 136206, "definition": "An amphipod crustacean; as the skeleton screw (Caprella). See Sand screw under Sand.", "details": []}, {"x": -0.7874639962000078, "y": 0.02373893708597345, "z": 0.6159033345864772, "word": "Scrimshaw", "pos_group": "noun", "row_number": 136264, "definition": "A shell a whale's tooth or the like that is scrimshawed.", "details": []}, {"x": -0.916868950896076, "y": -0.1348865269803158, "z": 0.37570859947826285, "word": "Scrobicula", "pos_group": "noun", "row_number": 136297, "definition": "One of the smooth areas surrounding the tubercles of a sea urchin.", "details": []}, {"x": -0.74716506280375, "y": -0.20073988046070565, "z": 0.6335991392971505, "word": "Scrode", "pos_group": "noun", "row_number": 136302, "definition": "A young codfish especially when cut open on the back and dressed.", "details": []}, {"x": -0.8680088656498965, "y": 0.05509257297065142, "z": 0.4934829455580542, "word": "Scrotum", "pos_group": "noun", "row_number": 136320, "definition": "The bag or pouch which contains the testicles; the cod.", "details": []}, {"x": -0.859516000703817, "y": -0.2563897219422201, "z": 0.4421499236870986, "word": "Scud", "pos_group": "noun", "row_number": 136391, "definition": "Any swimming amphipod crustacean.", "details": []}, {"x": -0.7511300668939107, "y": -0.05287626227618957, "z": 0.6580332237020019, "word": "Scull", "pos_group": "noun", "row_number": 136415, "definition": "A shoal of fish.", "details": []}, {"x": -0.9194832010096529, "y": -0.041451943535792256, "z": 0.39093782042435854, "word": "Sculpin", "pos_group": "noun", "row_number": 136433, "definition": "Any one of numerous species of marine cottoid fishes of the genus Cottus or Acanthocottus having a large head armed with sharp spines and a broad mouth. They are generally mottled with yellow brown and black. Several species are found on the Atlantic coasts of Europe and America.", "details": []}, {"x": -0.7795675898359494, "y": -0.2619009814710398, "z": 0.5689307943694688, "word": "Sculpin", "pos_group": "noun", "row_number": 136434, "definition": "A large cottoid market fish of California (Scorpaenichthys marmoratus); -- called also bighead cabezon scorpion salpa.", "details": []}, {"x": -0.8175074502121727, "y": 0.05184575991092657, "z": 0.5735796248358639, "word": "Scup", "pos_group": "noun", "row_number": 136472, "definition": "A marine sparoid food fish (Stenotomus chrysops or S. argyrops) common on the Atlantic coast of the United States. It appears bright silvery when swimming in the daytime but shows broad blackish transverse bands at night and when dead. Called also porgee paugy porgy scuppaug.", "details": []}, {"x": -0.9015011081309183, "y": -0.1904016081422053, "z": 0.3886424830812867, "word": "Scutellated", "pos_group": "adjective", "row_number": 136525, "definition": "Formed like a plate or salver; composed of platelike surfaces; as the scutellated bone of a sturgeon.", "details": []}, {"x": -0.7396321098172292, "y": -0.146952011594065, "z": 0.6567719911931174, "word": "Scutibranch", "pos_group": "noun", "row_number": 136536, "definition": "One of the Scutibranchiata.", "details": []}, {"x": -0.8943496246847189, "y": 0.03131013311624533, "z": 0.4462716934677186, "word": "Scutibranchian", "pos_group": "noun", "row_number": 136538, "definition": "One of the Scutibranchiata.", "details": []}, {"x": -0.8280529970797179, "y": -0.2751011609761399, "z": 0.4885156960189474, "word": "Scutibranchiata", "pos_group": "other", "row_number": 136539, "definition": "An order of gastropod Mollusca having a heart with two auricles and one ventricle. The shell may be either spiral or shieldlike.", "details": []}, {"x": -0.7710426237914937, "y": -0.001464457311230851, "z": 0.6367818524907201, "word": "Scutibranchiate", "pos_group": "adjective", "row_number": 136540, "definition": "Having the gills protected by a shieldlike shell; of or pertaining to the Scutibranchiata.", "details": []}, {"x": -0.9214423528492763, "y": -0.09854882927062619, "z": 0.37580861967892504, "word": "Scutibranchiate", "pos_group": "noun", "row_number": 136541, "definition": "One of the Scutibranchiata.", "details": []}, {"x": -0.7566116216807933, "y": -0.22909474692281998, "z": 0.6124168930311517, "word": "Scyllaea", "pos_group": "noun", "row_number": 136567, "definition": "A genus of oceanic nudibranchiate mollusks having the small branched gills situated on the upper side of four fleshy lateral lobes and on the median caudal crest.", "details": []}, {"x": -0.8492636302218269, "y": 0.060594804336357964, "z": 0.5244802723362266, "word": "Scyllarian", "pos_group": "noun", "row_number": 136568, "definition": "One of a family (Scyllaridae) of macruran Crustacea remarkable for the depressed form of the body and the broad flat antennae. Also used adjectively.", "details": []}, {"x": -0.8774796470934715, "y": -0.23610815336761928, "z": 0.41747144674821707, "word": "Scyphobranchii", "pos_group": "other", "row_number": 136577, "definition": "An order of fishes including the blennioid and gobioid fishes and other related families.", "details": []}, {"x": -0.7431502999597829, "y": -0.08826629826290397, "z": 0.6632772363504185, "word": "Scyphophori", "pos_group": "other", "row_number": 136579, "definition": "An order of fresh-water fishes inhabiting tropical Africa. They have rudimentary electrical organs on each side of the tail.", "details": []}, {"x": -0.9130466367415594, "y": -0.009509599637659514, "z": 0.4077442907627993, "word": "Sea", "pos_group": "noun", "row_number": 136599, "definition": "One of the larger bodies of salt water less than an ocean found on the earth's surface; a body of salt water of second rank generally forming part of or connecting with an ocean or a larger sea; as the Mediterranean Sea; the Sea of Marmora; the North Sea; the Carribean Sea.", "details": []}, {"x": -0.7968091432968218, "y": -0.2735815625424811, "z": 0.5387469886648082, "word": "Sea adder", "pos_group": "other", "row_number": 136606, "definition": "The European fifteen-spined stickleback (Gasterosteus spinachia); -- called also bismore.", "details": []}, {"x": -0.7982789292606891, "y": 0.0371499453441098, "z": 0.6011411087750841, "word": "Sea adder", "pos_group": "other", "row_number": 136607, "definition": "The European tanglefish or pipefish (Syngnathus acus).", "details": []}, {"x": -0.912379347056968, "y": -0.15700844066217345, "z": 0.3780374010924495, "word": "Sea ape", "pos_group": "other", "row_number": 136611, "definition": "The sea otter.", "details": []}, {"x": -0.742587121748273, "y": -0.18147560066074506, "z": 0.644694480338119, "word": "Sea apple", "pos_group": "other", "row_number": 136612, "definition": "The fruit of a West Indian palm (Manicaria Plukenetii) often found floating in the sea.", "details": []}, {"x": -0.8788722422732766, "y": 0.04885728289470895, "z": 0.474548783234863, "word": "Sea arrow", "pos_group": "other", "row_number": 136613, "definition": "A squid of the genus Ommastrephes. See Squid.", "details": []}, {"x": -0.8476907443999618, "y": -0.2664150605034765, "z": 0.45874112241608295, "word": "Sea bass", "pos_group": "other", "row_number": 136618, "definition": "A large marine food fish (Serranus / Centropristis atrarius) which abounds on the Atlantic coast of the United States. It is dark bluish with black bands and more or less varied with small white spots and blotches. Called also locally blue bass black sea bass blackfish bluefish and black perch.", "details": []}, {"x": -0.7573242818233572, "y": -0.03180067764352508, "z": 0.6522642478797599, "word": "Sea bass", "pos_group": "other", "row_number": 136619, "definition": "A California food fish (Cynoscion nobile); -- called also white sea bass and sea salmon.", "details": []}, {"x": -0.9217956705937188, "y": -0.06246072050431314, "z": 0.38261129108895675, "word": "Sea bat", "pos_group": "other", "row_number": 136620, "definition": "See Batfish (a).", "details": []}, {"x": -0.7695788329586664, "y": -0.2519464744077022, "z": 0.5867464477059116, "word": "Seabeard", "pos_group": "noun", "row_number": 136625, "definition": "A green seaweed (Cladophora rupestris) growing in dense tufts.", "details": []}, {"x": -0.8295472378278833, "y": 0.05822940701124874, "z": 0.5553923985537143, "word": "Sea beast", "pos_group": "other", "row_number": 136626, "definition": "Any large marine mammal as a seal walrus or cetacean.", "details": []}, {"x": -0.8933537019732467, "y": -0.20972703753210983, "z": 0.3974087730520057, "word": "Sea-blubber", "pos_group": "noun", "row_number": 136629, "definition": "A jellyfish.", "details": []}, {"x": -0.7392243748795482, "y": -0.12478243004777317, "z": 0.6617980573674371, "word": "Sea bream", "pos_group": "other", "row_number": 136643, "definition": "Any one of several species of sparoid fishes especially the common European species (Pagellus centrodontus) the Spanish (P. Oweni) and the black sea bream (Cantharus lineatus); -- called also old wife.", "details": []}, {"x": -0.902721051078779, "y": 0.017991646083516846, "z": 0.4298499791909148, "word": "Sea butterfly", "pos_group": "other", "row_number": 136647, "definition": "A pteropod.", "details": []}, {"x": -0.8157316395929313, "y": -0.27758481336594143, "z": 0.507472721981806, "word": "Sea canary", "pos_group": "other", "row_number": 136650, "definition": "The beluga or white whale.", "details": []}, {"x": -0.7804616797431856, "y": 0.015572776503089112, "z": 0.625009643993139, "word": "Sea cat", "pos_group": "other", "row_number": 136654, "definition": "The wolf fish.", "details": []}, {"x": -0.9194943211033263, "y": -0.12114561986831178, "z": 0.3739704964906398, "word": "Sea cat", "pos_group": "other", "row_number": 136655, "definition": "Any marine siluroid fish as Aelurichthys marinus and Arinus felis of the eastern coast of the United States. Many species are found on the coasts of Central and South America.", "details": []}, {"x": -0.7496812651757244, "y": -0.21275776593715678, "z": 0.6266674825439368, "word": "Sea chickweed", "pos_group": "other", "row_number": 136657, "definition": "A fleshy plant (Arenaria peploides) growing in large tufts in the sands of the northern Atlantic seacoast; -- called also sea sandwort and sea purslane.", "details": []}, {"x": -0.8610544116224236, "y": 0.059152526564702976, "z": 0.5050606684612987, "word": "Sea clam", "pos_group": "other", "row_number": 136658, "definition": "Any one of the large bivalve mollusks found on the open seacoast especially those of the family Mactridae as the common American species. (Mactra / Spisula solidissima); -- called also beach clam and surf clam.", "details": []}, {"x": -0.8666399145397637, "y": -0.2502749568203576, "z": 0.4316221779694359, "word": "Sea colander", "pos_group": "other", "row_number": 136666, "definition": "A large blackfish seaweed (Agarum Turneri) the frond of which is punctured with many little holes.", "details": []}, {"x": -0.746963103454537, "y": -0.06587684740068521, "z": 0.6615938051811802, "word": "Sea colewort", "pos_group": "other", "row_number": 136667, "definition": "Sea cabbage.", "details": []}, {"x": -0.9178859877492968, "y": -0.028313208379356174, "z": 0.395832888634541, "word": "Sea crawfish", "pos_group": "other", "row_number": 136674, "definition": "Alt. of Sea crayfish", "details": []}, {"x": -0.7854755914810732, "y": -0.2681942465651268, "z": 0.557763338071643, "word": "Sea crayfish", "pos_group": "other", "row_number": 136675, "definition": "Any crustacean of the genus Palinurus and allied genera as the European spiny lobster (P. vulgaris) which is much used as an article of food. See Lobster.", "details": []}, {"x": -0.8097745173465283, "y": 0.048064367535114706, "z": 0.5847692259598197, "word": "Sea cucumber", "pos_group": "other", "row_number": 136682, "definition": "Any large holothurian especially one of those belonging to the genus Pentacta or Cucumaria as the common American and European species. (P. frondosa).", "details": []}, {"x": -0.9063801236943071, "y": -0.17844793442622148, "z": 0.38292480472138046, "word": "Sea dace", "pos_group": "other", "row_number": 136683, "definition": "The European sea perch.", "details": []}, {"x": -0.7395552088286104, "y": -0.16072034269684457, "z": 0.6536260892420677, "word": "Sea devil", "pos_group": "other", "row_number": 136685, "definition": "Any very large ray especially any species of the genus Manta or Cepholoptera some of which become more than twenty feet across and weigh several tons. See also Ox ray under Ox.", "details": []}, {"x": -0.8889654956955013, "y": 0.03973995183286681, "z": 0.4562467355402918, "word": "Sea devil", "pos_group": "other", "row_number": 136686, "definition": "Any large cephalopod as a large Octopus or a giant squid (Architeuthis). See Devilfish.", "details": []}, {"x": -0.8354549643141775, "y": -0.273680764973362, "z": 0.4765646246695109, "word": "Sea dog", "pos_group": "other", "row_number": 136688, "definition": "The dogfish.", "details": []}, {"x": -0.7648946473927477, "y": -0.01191256509917134, "z": 0.6440452384597547, "word": "Sea duck", "pos_group": "other", "row_number": 136696, "definition": "Any one of numerous species of ducks which frequent the seacoasts and feed mainly on fishes and mollusks. The scoters eiders old squaw and ruddy duck are examples. They may be distinguished by the lobate hind toe.", "details": []}, {"x": -0.9224890482845186, "y": -0.08447867675800644, "z": 0.3766660443527389, "word": "Sea eagle", "pos_group": "other", "row_number": 136697, "definition": "Any one of several species of fish-eating eagles of the genus Haliaeetus and allied genera as the North Pacific sea eagle. (H. pelagicus) which has white shoulders head rump and tail; the European white-tailed eagle (H. albicilla); and the Indian white-tailed sea eagle or fishing eagle (Polioaetus ichthyaetus). The bald eagle and the osprey are also sometimes classed as sea eagles.", "details": []}, {"x": -0.7606018001296074, "y": -0.23931539870822477, "z": 0.6035006558246014, "word": "Sea-ear", "pos_group": "noun", "row_number": 136699, "definition": "Any species of ear-shaped shells of the genus Haliotis. See Abalone.", "details": []}, {"x": -0.841714562787474, "y": 0.061674471637639186, "z": 0.5363887157087754, "word": "Sea eel", "pos_group": "other", "row_number": 136700, "definition": "The conger eel.", "details": []}, {"x": -0.8840061747786221, "y": -0.22739551260601915, "z": 0.40844138355450005, "word": "Sea egg", "pos_group": "other", "row_number": 136701, "definition": "A sea urchin.", "details": []}, {"x": -0.740459478105458, "y": -0.10211721217665165, "z": 0.6642980026020411, "word": "Sea elephant", "pos_group": "other", "row_number": 136702, "definition": "A very large seal (Macrorhinus proboscideus) of the Antarctic seas much hunted for its oil. It sometimes attains a length of thirty feet and is remarkable for the prolongation of the nose of the adult male into an erectile elastic proboscis about a foot in length. Another species of smaller size (M. angustirostris) occurs on the coast of Lower California but is now nearly extinct.", "details": []}, {"x": -0.9098699246320676, "y": 0.002284394179520461, "z": 0.4148873362652421, "word": "Sea fan", "pos_group": "other", "row_number": 136703, "definition": "Any gorgonian which branches in a fanlike form especially Gorgonia flabellum of Florida and the West Indies.", "details": []}, {"x": -0.8035702803188214, "y": -0.27704070218035987, "z": 0.5268047588279209, "word": "Sea feather", "pos_group": "other", "row_number": 136706, "definition": "Any gorgonian which branches in a plumelike form.", "details": []}, {"x": -0.7908679347643589, "y": 0.03053354444541917, "z": 0.611224682441046, "word": "Sea flewer", "pos_group": "other", "row_number": 136711, "definition": "A sea anemone or any related anthozoan.", "details": []}, {"x": -0.9159301760548677, "y": -0.14370848908833989, "z": 0.37472627710909934, "word": "Sea foam", "pos_group": "other", "row_number": 136713, "definition": "Meerschaum; -- called also sea froth.", "details": []}, {"x": -0.7441473512778503, "y": -0.19439351669827618, "z": 0.6391055313888597, "word": "Sea fox", "pos_group": "other", "row_number": 136715, "definition": "The thrasher shark. See Thrasher.", "details": []}, {"x": -0.8724022582455054, "y": 0.05468590760778517, "z": 0.4857198280050499, "word": "Sea ginger", "pos_group": "other", "row_number": 136722, "definition": "A hydroid coral of the genus Millepora especially M. alcicornis of the West Indies and Florida. So called because it stings the tongue like ginger. See Illust. under Millepore.", "details": []}, {"x": -0.8550566778492493, "y": -0.26200873623104914, "z": 0.44747011051467267, "word": "Sea girdles", "pos_group": "other", "row_number": 136723, "definition": "A kind of kelp (Laminaria digitata) with palmately cleft fronds; -- called also sea wand seaware and tangle.", "details": []}, {"x": -0.7523159043714045, "y": -0.04405073403276054, "z": 0.65732816223026, "word": "Sea grape", "pos_group": "other", "row_number": 136732, "definition": "The clusters of gelatinous egg capsules of a squid (Loligo).", "details": []}, {"x": -0.9211976793474208, "y": -0.04871989679710996, "z": 0.38603265045978374, "word": "Sea green", "pos_group": "other", "row_number": 136734, "definition": "The green color of sea water.", "details": []}, {"x": -0.7748549786512806, "y": -0.2598787078876621, "z": 0.5762489212536217, "word": "Sea gull", "pos_group": "other", "row_number": 136737, "definition": "Any gull living on the seacoast.", "details": []}, {"x": -0.8217469030351819, "y": 0.0562631459759673, "z": 0.5670683254749593, "word": "Sea hare", "pos_group": "other", "row_number": 136739, "definition": "Any tectibranchiate mollusk of the genus Aplysia. See Aplysia.", "details": []}, {"x": -0.8989645030748225, "y": -0.19881108438831582, "z": 0.39030369577519924, "word": "Sea hedgehog", "pos_group": "other", "row_number": 136742, "definition": "A sea urchin.", "details": []}, {"x": -0.7381357523494876, "y": -0.13883603504075703, "z": 0.6602122132145222, "word": "Sea horse", "pos_group": "other", "row_number": 136748, "definition": "A fabulous creature half horse and half fish represented in classic mythology as driven by sea dogs or ridden by the Nereids. It is also depicted in heraldry. See Hippocampus.", "details": []}, {"x": -0.8980973777590356, "y": 0.027880374943789775, "z": 0.43891204671931433, "word": "Sea horse", "pos_group": "other", "row_number": 136750, "definition": "Any fish of the genus Hippocampus.", "details": []}, {"x": -0.8230243141817927, "y": -0.27803097129984117, "z": 0.4953077399593678, "word": "Sea jelly", "pos_group": "other", "row_number": 136753, "definition": "A medusa or jellyfish.", "details": []}, {"x": -0.7737143795552709, "y": 0.006418309482530928, "z": 0.6335020632742947, "word": "Seal", "pos_group": "noun", "row_number": 136757, "definition": "Any aquatic carnivorous mammal of the families Phocidae and Otariidae.", "details": []}, {"x": -0.9215346113393479, "y": -0.1071163000502592, "z": 0.3732292303225726, "word": "Sea lamprey", "pos_group": "other", "row_number": 136774, "definition": "The common lamprey.", "details": []}, {"x": -0.7528056953200751, "y": -0.2242124059543136, "z": 0.6188799415959741, "word": "Sea lemon", "pos_group": "other", "row_number": 136782, "definition": "Any one of several species of nudibranchiate mollusks of the genus Doris and allied genera having a smooth thick convex yellow body.", "details": []}, {"x": -0.8537885676711973, "y": 0.062093164269442065, "z": 0.516903782792285, "word": "Sea leopard", "pos_group": "other", "row_number": 136783, "definition": "Any one of several species of spotted seals especially Ogmorhinus leptonyx and Leptonychotes Weddelli of the Antarctic Ocean. The North Pacific sea leopard is the harbor seal.", "details": []}, {"x": -0.8736150393913905, "y": -0.24307280131415535, "z": 0.4215594575032901, "word": "Sea lion", "pos_group": "other", "row_number": 136793, "definition": "Any one of several large species of seals of the family Otariidae native of the Pacific Ocean especially the southern sea lion (Otaria jubata) of the South American coast; the northern sea lion (Eumetopias Stelleri) found from California to Japan; and the black or California sea lion (Zalophus Californianus) which is common on the rocks near San Francisco.", "details": []}, {"x": -0.743327495022979, "y": -0.07936155638552168, "z": 0.6642032659592474, "word": "Sea louse", "pos_group": "other", "row_number": 136795, "definition": "Any one of numerous species of isopod crustaceans of Cymothoa Livoneca and allied genera mostly parasites on fishes.", "details": []}, {"x": -0.9156543087106596, "y": -0.01554828429128627, "z": 0.401665828513208, "word": "Sea mat", "pos_group": "other", "row_number": 136821, "definition": "Any bryozoan of the genus Flustra or allied genera which form frondlike corals.", "details": []}, {"x": -0.791788217344518, "y": -0.2734519138649055, "z": 0.5461643247942972, "word": "Sea monster", "pos_group": "other", "row_number": 136832, "definition": "Any large sea animal.", "details": []}, {"x": -0.8020798976701192, "y": 0.043129452900620514, "z": 0.5956573579214682, "word": "Sea mouse", "pos_group": "other", "row_number": 136834, "definition": "A dorsibranchiate annelid belonging to Aphrodite and allied genera having long slender hairlike setae on the sides.", "details": []}, {"x": -0.9107982473409785, "y": -0.16582895004545906, "z": 0.3780837367137371, "word": "Sea nettle", "pos_group": "other", "row_number": 136844, "definition": "A jellyfish or medusa.", "details": []}, {"x": -0.7401201535731848, "y": -0.17431604515876145, "z": 0.6494890874179597, "word": "Sea orange", "pos_group": "other", "row_number": 136848, "definition": "A large American holothurian (Lophothuria Fabricii) having a bright orange convex body covered with finely granulated scales. Its expanded tentacles are bright red.", "details": []}, {"x": -0.8830961571782778, "y": 0.04724954267354333, "z": 0.4668068743003891, "word": "Sea-orb", "pos_group": "noun", "row_number": 136849, "definition": "A globefish.", "details": []}, {"x": -0.8429308823624913, "y": -0.2710758520698614, "z": 0.4647423049219754, "word": "Sea otter", "pos_group": "other", "row_number": 136850, "definition": "An aquatic carnivore (Enhydris lutris / marina) found in the North Pacific Ocean. Its fur is highly valued especially by the Chinese. It is allied to the common otter but is larger with feet more decidedly webbed.", "details": []}, {"x": -0.7591233876767969, "y": -0.023187215090043137, "z": 0.6505336542704546, "word": "Sea owl", "pos_group": "other", "row_number": 136851, "definition": "The lumpfish.", "details": []}, {"x": -0.9229065327009061, "y": -0.07037445790236466, "z": 0.3785379341267397, "word": "Sea partridge", "pos_group": "other", "row_number": 136853, "definition": "The gilthead (Crenilabrus melops) a fish of the British coasts.", "details": []}, {"x": -0.765143549725515, "y": -0.24875949170960043, "z": 0.5938636742534598, "word": "Sea perch", "pos_group": "other", "row_number": 136858, "definition": "The European bass (Roccus / Labrax lupus); -- called also sea dace.", "details": []}, {"x": -0.8339818161322706, "y": 0.061574646365672586, "z": 0.5483455965772518, "word": "Sea perch", "pos_group": "other", "row_number": 136860, "definition": "The s
