w_number": 138400, "definition": "The bone or shell of cuttlefish. See Illust. under Cuttlefish.", "details": []}, {"x": -0.9093173020023356, "y": 0.008473454221349257, "z": 0.4160171208649374, "word": "Septum", "pos_group": "noun", "row_number": 138488, "definition": "One of the radial calcareous plates of a coral.", "details": []}, {"x": -0.8054582982065182, "y": -0.2806589159257745, "z": 0.5219841978083518, "word": "Septum", "pos_group": "noun", "row_number": 138489, "definition": "One of the transverse partitions dividing the shell of a mollusk or of a rhizopod into several chambers. See Illust. under Nautilus.", "details": []}, {"x": -0.7870251514520976, "y": 0.029888620054682756, "z": 0.6161964632915621, "word": "Serpula", "pos_group": "noun", "row_number": 138723, "definition": "Any one of numerous species of tubicolous annelids of the genus Serpula and allied genera of the family Serpulidae. They secrete a calcareous tube which is usually irregularly contorted but is sometimes spirally coiled. The worm has a wreath of plumelike and often bright-colored gills around its head and usually an operculum to close the aperture of its tube when it retracts.", "details": []}, {"x": -0.9180971075660872, "y": -0.13892874627093896, "z": 0.3712095156894143, "word": "Serpulite", "pos_group": "noun", "row_number": 138726, "definition": "A fossil serpula shell.", "details": []}, {"x": -0.7431841291540541, "y": -0.20058700368992405, "z": 0.6383119959112697, "word": "Serranoid", "pos_group": "noun", "row_number": 138728, "definition": "Any fish of the family Serranidae which includes the striped bass the black sea bass and many other food fishes.", "details": []}, {"x": -0.8700440033867152, "y": 0.05924813091866995, "z": 0.4894007469890723, "word": "Serranoid", "pos_group": "adjective", "row_number": 138729, "definition": "Of or pertaining to the Serranidae.", "details": []}, {"x": -0.8578863650254049, "y": -0.2623318394576831, "z": 0.44182914198844536, "word": "Set", "pos_group": "noun", "row_number": 138937, "definition": "A young oyster when first attached.", "details": []}, {"x": -0.7488906391558897, "y": -0.04792758799458727, "z": 0.6609582111553679, "word": "Set", "pos_group": "noun", "row_number": 138938, "definition": "Collectively the crop of young oysters in any locality.", "details": []}, {"x": -0.9218072301711809, "y": -0.04247002392152116, "z": 0.3853151015367044, "word": "Setiger", "pos_group": "noun", "row_number": 138962, "definition": "An annelid having setae; a chaetopod.", "details": []}, {"x": -0.7757708656890594, "y": -0.2650075611009866, "z": 0.5726696748627034, "word": "Setiparous", "pos_group": "adjective", "row_number": 138965, "definition": "Producing setae; -- said of the organs from which the setae of annelids arise.", "details": []}, {"x": -0.818175492873089, "y": 0.057785000949066925, "z": 0.5720574765940869, "word": "Sewen", "pos_group": "noun", "row_number": 139133, "definition": "A British trout usually regarded as a variety (var. Cambricus) of the salmon trout.", "details": []}, {"x": -0.9017038255331857, "y": -0.19571563468643047, "z": 0.3855199104561345, "word": "Sexradiate", "pos_group": "adjective", "row_number": 139177, "definition": "Having six rays; -- said of certain sponge spicules. See Illust. of Spicule.", "details": []}, {"x": -0.7360572802254813, "y": -0.14471305117214528, "z": 0.6612698488873626, "word": "Shad", "pos_group": "other", "row_number": 139260, "definition": "Any one of several species of food fishes of the Herring family. The American species (Clupea sapidissima) which is abundant on the Atlantic coast and ascends the larger rivers in spring to spawn is an important market fish. The European allice shad or alose (C. alosa) and the twaite shad. (C. finta) are less important species.", "details": []}, {"x": -0.8968114439641759, "y": 0.03366051596667467, "z": 0.441130597034197, "word": "Shad-waiter", "pos_group": "noun", "row_number": 139321, "definition": "A lake whitefish; the roundfish. See Roundfish.", "details": []}, {"x": -0.8253884365309119, "y": -0.2804666199820296, "z": 0.4899718399223702, "word": "Shagreen", "pos_group": "noun", "row_number": 139369, "definition": "The skin of various small sharks and other fishes when having small rough bony scales. The dogfishes of the genus Scyllium furnish a large part of that used in the arts.", "details": []}, {"x": -0.7699033598774684, "y": 0.00443849164516334, "z": 0.6381450589335479, "word": "Shale", "pos_group": "noun", "row_number": 139410, "definition": "A shell or husk; a cod or pod.", "details": []}, {"x": -0.9231789079860241, "y": -0.1015509244934363, "z": 0.37071298005904857, "word": "Shark", "pos_group": "other", "row_number": 139574, "definition": "Any one of numerous species of elasmobranch fishes of the order Plagiostomi found in all seas.", "details": []}, {"x": -0.7525817863196349, "y": -0.23022932163917725, "z": 0.616940122181652, "word": "Sheatfish", "pos_group": "noun", "row_number": 139745, "definition": "A European siluroid fish (Silurus glanis) allied to the cat-fishes. It is the largest fresh-water fish of Europe sometimes becoming six feet or more in length. See Siluroid.", "details": []}, {"x": -0.8508632291664089, "y": 0.06560918677788781, "z": 0.5212745916144922, "word": "Sheathbill", "pos_group": "noun", "row_number": 139750, "definition": "Either one of two species of birds composing the genus Chionis and family Chionidae native of the islands of the Antarctic seas.", "details": []}, {"x": -0.8765419084652721, "y": -0.24202980912879044, "z": 0.4160478989216745, "word": "Sheepshead", "pos_group": "noun", "row_number": 139825, "definition": "A large and valuable sparoid food fish (Archosargus / Diplodus probatocephalus) found on the Atlantic coast of the United States. It often weighs from ten to twelve pounds.", "details": []}, {"x": -0.7403265030382393, "y": -0.08420654634625645, "z": 0.6669527168035283, "word": "Shell", "pos_group": "noun", "row_number": 139896, "definition": "The hard calcareous or chitinous external covering of mollusks crustaceans and some other invertebrates. In some mollusks as the cuttlefishes it is internal or concealed by the mantle. Also the hard covering of some vertebrates as the armadillo the tortoise and the like.", "details": []}, {"x": -0.915541411991164, "y": -0.009237169447032272, "z": 0.4021176415302272, "word": "Shell", "pos_group": "noun", "row_number": 139897, "definition": "Hence by extension any mollusks having such a covering.", "details": []}, {"x": -0.7933454859165041, "y": -0.2777028171617973, "z": 0.5417417145802113, "word": "Shellfish", "pos_group": "noun", "row_number": 139921, "definition": "Any aquatic animal whose external covering consists of a shell either testaceous as in oysters clams and other mollusks or crustaceous as in lobsters and crabs.", "details": []}, {"x": -0.7982856638972663, "y": 0.04329535943374964, "z": 0.600720825898023, "word": "Shelly", "pos_group": "adjective", "row_number": 139926, "definition": "Abounding with shells; consisting of shells or of a shell.", "details": []}, {"x": -0.9132250477264212, "y": -0.1616121479967242, "z": 0.3740341238777028, "word": "Shieldtail", "pos_group": "noun", "row_number": 140032, "definition": "Any species of small burrowing snakes of the family Uropeltidae native of Ceylon and Southern Asia. They have a small mouth which can not be dilated.", "details": []}, {"x": -0.7387257913204988, "y": -0.1804904913705141, "z": 0.6493900120595738, "word": "Shiner", "pos_group": "noun", "row_number": 140121, "definition": "Any one of numerous species of small freshwater American cyprinoid fishes belonging to Notropis or Minnilus and allied genera; as the redfin (Notropis megalops) and the golden shiner (Notemigonus chrysoleucus) of the Eastern United States; also loosely applied to various other silvery fishes as the dollar fish or horsefish menhaden moonfish sailor's choice and the sparada.", "details": []}, {"x": -0.881114392091658, "y": 0.05234667531396137, "z": 0.46999707832339016, "word": "Shipworm", "pos_group": "noun", "row_number": 140193, "definition": "Any long slender worm-shaped bivalve mollusk of Teredo and allied genera. The shipworms burrow in wood and are destructive to wooden ships piles of wharves etc. See Teredo.", "details": []}, {"x": -0.8456372544189724, "y": -0.2722068888342368, "z": 0.45913074783761515, "word": "Shoemaker", "pos_group": "noun", "row_number": 140329, "definition": "The threadfish.", "details": []}, {"x": -0.7555040294953235, "y": -0.026407763390543237, "z": 0.6546115576806131, "word": "Shorthead", "pos_group": "noun", "row_number": 140485, "definition": "A sucking whale less than one year old; -- so called by sailors.", "details": []}, {"x": -0.9239262836652452, "y": -0.0642843708736128, "z": 0.3771309348408226, "word": "Shote", "pos_group": "other", "row_number": 140517, "definition": "A fish resembling the trout.", "details": []}, {"x": -0.7656493083698046, "y": -0.25430925640363466, "z": 0.5908535679000932, "word": "Shovelhead", "pos_group": "noun", "row_number": 140576, "definition": "A shark (Sphryna tiburio) allied to the hammerhead and native of the warmer parts of the Atlantic and Pacific oceans; -- called also bonnet shark.", "details": []}, {"x": -0.8306055449961294, "y": 0.0638769397265799, "z": 0.5531854708801108, "word": "Shovelnose", "pos_group": "noun", "row_number": 140577, "definition": "The common sand shark. See under Snad.", "details": []}, {"x": -0.8931146492003014, "y": -0.2153546197389053, "z": 0.3949286152470268, "word": "Shovelnose", "pos_group": "noun", "row_number": 140578, "definition": "A small California shark (Heptranchias maculatus) which is taken for its oil.", "details": []}, {"x": -0.7359119294150643, "y": -0.12178951540367192, "z": 0.6660337424502877, "word": "Shovelnose", "pos_group": "noun", "row_number": 140579, "definition": "A Pacific Ocean shark (Hexanchus corinus).", "details": []}, {"x": -0.9052386069530995, "y": 0.019543430356500368, "z": 0.42445390658057613, "word": "Shovelnose", "pos_group": "noun", "row_number": 140580, "definition": "A ganoid fish of the Sturgeon family (Scaphirhynchus platyrhynchus) of the Mississippi and Ohio rivers; -- called also white sturgeon.", "details": []}, {"x": -0.8127235786657852, "y": -0.28252640583894345, "z": 0.5095676742930302, "word": "Shrimp", "pos_group": "verb", "row_number": 140684, "definition": "Any one of numerous species of macruran Crustacea belonging to Crangon and various allied genera having a slender body and long legs. Many of them are used as food. The larger kinds are called also prawns. See Illust. of Decapoda.", "details": []}, {"x": -0.7797743265036687, "y": 0.021648891759194315, "z": 0.6256862833811755, "word": "Shrimp", "pos_group": "verb", "row_number": 140685, "definition": "In a more general sense any species of the macruran tribe Caridea or any species of the order Schizopoda having a similar form.", "details": []}, {"x": -0.9209088441342166, "y": -0.12482701831792234, "z": 0.3692493957926518, "word": "Shrimp", "pos_group": "verb", "row_number": 140686, "definition": "In a loose sense any small crustacean including some amphipods and even certain entomostracans; as the fairy shrimp and brine shrimp. See under Fairy and Brine.", "details": []}, {"x": -0.7456755869257834, "y": -0.213063747905757, "z": 0.6313253981832511, "word": "Shrimper", "pos_group": "noun", "row_number": 140688, "definition": "One who fishes for shrimps.", "details": []}, {"x": -0.8629413787239236, "y": 0.06362390255713277, "z": 0.5012825310236277, "word": "Shuck", "pos_group": "noun", "row_number": 140772, "definition": "The shell of an oyster or clam.", "details": []}, {"x": -0.8652552351346197, "y": -0.25622432454531435, "z": 0.4309088924394937, "word": "Siamang", "pos_group": "noun", "row_number": 140863, "definition": "A gibbon (Hylobates syndactylus) native of Sumatra. It has the second and third toes partially united by a web.", "details": []}, {"x": -0.7445121908602582, "y": -0.06123346559445282, "z": 0.6647947505446711, "word": "Sile", "pos_group": "noun", "row_number": 141235, "definition": "A young or small herring.", "details": []}, {"x": -0.9202787002877643, "y": -0.028873961666693284, "z": 0.39019662752813955, "word": "Sill", "pos_group": "noun", "row_number": 141333, "definition": "A young herring.", "details": []}, {"x": -0.7817906829724585, "y": -0.2716703392955761, "z": 0.5612473204964842, "word": "Sillock", "pos_group": "noun", "row_number": 141339, "definition": "The pollock or coalfish.", "details": []}, {"x": -0.8102106322462724, "y": 0.05409115342119751, "z": 0.5836376260289086, "word": "Silure", "pos_group": "noun", "row_number": 141355, "definition": "A fish of the genus Silurus as the sheatfish; a siluroid.", "details": []}, {"x": -0.9068147967776409, "y": -0.1835218477783074, "z": 0.3794820888173269, "word": "Siluridan", "pos_group": "noun", "row_number": 141358, "definition": "Any fish of the family Siluridae or of the order Siluroidei.", "details": []}, {"x": -0.735871813844308, "y": -0.1589232892200313, "z": 0.6582067013734929, "word": "Siluroid", "pos_group": "noun", "row_number": 141359, "definition": "Belonging to the Siluroidei or Nematognathi an order of fishes including numerous species among which are the American catfishes and numerous allied fresh-water species of the Old World as the sheatfish (Silurus glanis) of Europe.", "details": []}, {"x": -0.8913571939344279, "y": 0.04250183803247096, "z": 0.4513047158907208, "word": "Siluroid", "pos_group": "noun", "row_number": 141360, "definition": "A siluroid fish.", "details": []}, {"x": -0.8330040472721552, "y": -0.2792115549546105, "z": 0.4776454383829473, "word": "Siluroidei", "pos_group": "other", "row_number": 141361, "definition": "An order of fishes the Nematognathi.", "details": []}, {"x": -0.763512045995279, "y": -0.006177416309302364, "z": 0.6457640398379617, "word": "Silurus", "pos_group": "noun", "row_number": 141362, "definition": "A genus of large malacopterygious fishes of the order Siluroidei. They inhabit the inland waters of Europe and Asia.", "details": []}, {"x": -0.924372575442632, "y": -0.08706818440808363, "z": 0.3714222301282405, "word": "Silverfin", "pos_group": "noun", "row_number": 141393, "definition": "A small North American fresh-water cyprinoid fish (Notropis Whipplei).", "details": []}, {"x": -0.7566001551644819, "y": -0.2408909681174826, "z": 0.6078879392490888, "word": "Silverfish", "pos_group": "noun", "row_number": 141395, "definition": "A white variety of the goldfish.", "details": []}, {"x": -0.843127300950845, "y": 0.06692656373221842, "z": 0.5335327445043467, "word": "Silversides", "pos_group": "noun", "row_number": 141406, "definition": "Any one of several species of small fishes of the family Atherinidae having a silvery stripe along each side of the body. The common species of the American coast (Menidia notata) is very abundant. Called also silverside sand smelt friar tailor and tinker.", "details": []}, {"x": -0.8833175315771088, "y": -0.23322707150218344, "z": 0.4066389941053844, "word": "Siphon", "pos_group": "noun", "row_number": 141794, "definition": "One of the tubes or folds of the mantle border of a bivalve or gastropod mollusk by which water is conducted into the gill cavity. See Illust. under Mya and Lamellibranchiata.", "details": []}, {"x": -0.7374567751017982, "y": -0.09842824058594156, "z": 0.6681836471447142, "word": "Siphon", "pos_group": "noun", "row_number": 141797, "definition": "The siphuncle of a cephalopod shell.", "details": []}, {"x": -0.9123811909013453, "y": 0.0030134117480304923, "z": 0.40933052883834564, "word": "Siphon", "pos_group": "noun", "row_number": 141800, "definition": "A tubular organ connected both with the esophagus and the intestine of certain sea urchins and annelids.", "details": []}, {"x": -0.8002628465496248, "y": -0.2814649001886347, "z": 0.5294873807694512, "word": "Siphonarid", "pos_group": "noun", "row_number": 141805, "definition": "Any one of numerous species of limpet-shaped pulmonate gastropods of the genus Siphonaria. They cling to rocks between high and low water marks and have both lunglike organs and gills.", "details": []}, {"x": -0.7906294249415623, "y": 0.03666905394318655, "z": 0.6111959529475683, "word": "Siphonata", "pos_group": "other", "row_number": 141806, "definition": "A tribe of bivalve mollusks in which the posterior mantle border is prolonged into two tubes or siphons. Called also Siphoniata. See Siphon 2 (a) and Quahaug.", "details": []}, {"x": -0.9169830719337358, "y": -0.14799490722916192, "z": 0.37045857153155587, "word": "Siphonifer", "pos_group": "noun", "row_number": 141813, "definition": "Any cephalopod having a siphonate shell.", "details": []}, {"x": -0.7402272908506834, "y": -0.19386671183988533, "z": 0.6438006336749353, "word": "Siphoniferous", "pos_group": "adjective", "row_number": 141814, "definition": "Siphon-bearing as the shell of the nautilus and other cephalopods.", "details": []}, {"x": -0.8745255369939648, "y": 0.05853382435894766, "z": 0.4814341871443419, "word": "Siphonobranchiata", "pos_group": "other", "row_number": 141817, "definition": "A tribe of gastropods having the mantle border on one or both sides prolonged in the form of a spout through which water enters the gill cavity. The shell itself is not always siphonostomatous in this group.", "details": []}, {"x": -0.8532389077588548, "y": -0.2678713571549239, "z": 0.44746877243273153, "word": "Siphonophora", "pos_group": "other", "row_number": 141821, "definition": "An order of pelagic Hydrozoa including species which form complex free-swimming communities composed of numerous zooids of various kinds some of which act as floats or as swimming organs others as feeding or nutritive zooids and others as reproductive zooids. See Illust. under Physallia and Porpita.", "details": []}, {"x": -0.7502684947727304, "y": -0.03891209074565485, "z": 0.6599871475606653, "word": "Siphonostomata", "pos_group": "other", "row_number": 141826, "definition": "A tribe of parasitic copepod Crustacea including a large number of species that are parasites of fishes as the lerneans. They have a mouth adapted to suck blood.", "details": []}, {"x": -0.9234293249469269, "y": -0.050097941696720806, "z": 0.38048453065245, "word": "Siphonostomata", "pos_group": "other", "row_number": 141827, "definition": "An artificial division of gastropods including those that have siphonostomatous shells.", "details": []}, {"x": -0.7710052257822269, "y": -0.2626447266333434, "z": 0.5801454036603183, "word": "Siphonostomatous", "pos_group": "adjective", "row_number": 141828, "definition": "Having the front edge of the aperture of the shell prolonged in the shape of a channel for the protection of the siphon; -- said of certain gastropods.", "details": []}, {"x": -0.8225882002527828, "y": 0.06205968285277296, "z": 0.565240876590769, "word": "Siphuncle", "pos_group": "noun", "row_number": 141834, "definition": "The tube which runs through the partitions of chambered cephalopod shells.", "details": []}, {"x": -0.8989674404325444, "y": -0.2042554832553556, "z": 0.3874754683877174, "word": "Siredon", "pos_group": "noun", "row_number": 141868, "definition": "The larval form of any salamander while it still has external gills; especially one of those which like the axolotl (Amblystoma Mexicanum) sometimes lay eggs while in this larval state but which under more favorable conditions lose their gills and become normal salamanders. See also Axolotl.", "details": []}, {"x": -0.7346850252724045, "y": -0.13626250844971471, "z": 0.6645829086212478, "word": "Siren", "pos_group": "noun", "row_number": 141873, "definition": "Any long slender amphibian of the genus Siren or family Sirenidae destitute of hind legs and pelvis and having permanent external gills as well as lungs. They inhabit the swamps lagoons and ditches of the Southern United States. The more common species (Siren lacertina) is dull lead-gray in color and becames two feet long.", "details": []}, {"x": -0.9005786078928354, "y": 0.029867368728909216, "z": 0.4336658982338988, "word": "Sirenia", "pos_group": "other", "row_number": 141877, "definition": "An order of large aquatic herbivorous mammals including the manatee dugong rytina and several fossil genera.", "details": []}, {"x": -0.8202097611709719, "y": -0.2831953741266719, "z": 0.49704761115320906, "word": "Siscowet", "pos_group": "noun", "row_number": 141904, "definition": "A large fat variety of the namaycush found in Lake Superior; -- called also siskawet siskiwit.", "details": []}, {"x": -0.772779596898068, "y": 0.012387700294462553, "z": 0.6345535749639066, "word": "Skate", "pos_group": "noun", "row_number": 142097, "definition": "Any one of numerous species of large flat elasmobranch fishes of the genus Raia having a long slender tail terminated by a small caudal fin. The pectoral fins which are large and broad and united to the sides of the body and head give a somewhat rhombic form to these fishes. The skin is more or less spinose.", "details": []}, {"x": -0.9231222725393036, "y": -0.11041772353581605, "z": 0.3683112763289223, "word": "Skimmer", "pos_group": "noun", "row_number": 142242, "definition": "Any species of longwinged marine birds of the genus Rhynchops allied to the terns but having the lower mandible compressed and much longer than the upper one. These birds fly rapidly along the surface of the water with the lower mandible immersed thus skimming out small fishes. The American species (R. nigra) is common on the southern coasts of the United States. Called also scissorbill and shearbill.", "details": []}, {"x": -0.7487937045927283, "y": -0.22497234624363008, "z": 0.6234544340911644, "word": "Skimmer", "pos_group": "noun", "row_number": 142243, "definition": "Any one of several large bivalve shells sometimes used for skimming milk as the sea clams and large scallops.", "details": []}, {"x": -0.855513400415403, "y": 0.06685397713587904, "z": 0.5134465575410839, "word": "Skink", "pos_group": "noun", "row_number": 142276, "definition": "Any one of numerous species of regularly scaled harmless lizards of the family Scincidae common in the warmer parts of all the continents.", "details": []}, {"x": -0.872477481510649, "y": -0.24899540424390434, "z": 0.4204572902474756, "word": "Skipjack", "pos_group": "noun", "row_number": 142305, "definition": "A name given to several kinds of a fish as the common bluefish the alewife the bonito the butterfish the cutlass fish the jurel the leather jacket the runner the saurel the saury the threadfish", "details": []}, {"x": -0.7406758645921063, "y": -0.07504726298646942, "z": 0.6676579752605187, "word": "Skirling", "pos_group": "noun", "row_number": 142322, "definition": "A small trout or salmon; -- a name used loosely.", "details": []}, {"x": -0.9180976553193889, "y": -0.015650621550596468, "z": 0.3960451405359249, "word": "Skittle-dog", "pos_group": "noun", "row_number": 142353, "definition": "The piked dogfish.", "details": []}, {"x": -0.788230980933699, "y": -0.27727533144151995, "z": 0.5493726524594156, "word": "Skowitz", "pos_group": "noun", "row_number": 142370, "definition": "The silver salmon.", "details": []}, {"x": -0.8022787412502935, "y": 0.04920996513220557, "z": 0.5949178100120482, "word": "Skullfish", "pos_group": "noun", "row_number": 142395, "definition": "A whaler's name for a whale more than two years old.", "details": []}, {"x": -0.9114569012254257, "y": -0.1706350510688962, "z": 0.3743394135744455, "word": "Slater", "pos_group": "noun", "row_number": 142597, "definition": "Any terrestrial isopod crustacean of the genus Porcellio and allied genera; a sow bug.", "details": []}, {"x": -0.7363452983515, "y": -0.17296794116409994, "z": 0.6541236067633495, "word": "Sleeper", "pos_group": "noun", "row_number": 142726, "definition": "A large fresh-water gobioid fish (Eleotris dormatrix).", "details": []}, {"x": -0.8854004751377081, "y": 0.05040562363346264, "z": 0.4620879480488992, "word": "Sleeper", "pos_group": "noun", "row_number": 142727, "definition": "A nurse shark. See under Nurse.", "details": []}, {"x": -0.8407019621356422, "y": -0.27673939885006726, "z": 0.46544120572354236, "word": "Slip", "pos_group": "noun", "row_number": 142983, "definition": "A fish the sole.", "details": []}, {"x": -0.7575023831367687, "y": -0.017650608947193665, "z": 0.6525937446420318, "word": "Slit-shell", "pos_group": "noun", "row_number": 143028, "definition": "Any species of Pleurotomaria a genus of beautiful pearly spiral gastropod shells having a deep slit in the outer lip. Many fossil species are known and a few living ones are found in deep water in tropical seas.", "details": []}, {"x": -0.9249213987129675, "y": -0.07253860153631649, "z": 0.3731736291460088, "word": "Sliver", "pos_group": "noun", "row_number": 143038, "definition": "Bait made of pieces of small fish. Cf. Kibblings.", "details": []}, {"x": -0.7611882198349598, "y": -0.25076416167520366, "z": 0.5980884794107114, "word": "Sloakan", "pos_group": "noun", "row_number": 143039, "definition": "A species of seaweed. [Spelled also slowcawn.] See 3d Laver.", "details": []}, {"x": -0.8351965881672128, "y": 0.0670341277277713, "z": 0.5458507898992396, "word": "Slobber", "pos_group": "noun", "row_number": 143043, "definition": "A jellyfish.", "details": []}, {"x": -0.889810937800361, "y": -0.22342874861573273, "z": 0.39788954404815624, "word": "Sloth", "pos_group": "noun", "row_number": 143098, "definition": "Any one of several species of arboreal edentates constituting the family Bradypodidae and the suborder Tardigrada. They have long exserted limbs and long prehensile claws. Both jaws are furnished with teeth (see Illust. of Edentata) and the ears and tail are rudimentary. They inhabit South and Central America and Mexico.", "details": []}, {"x": -0.7351985409864679, "y": -0.11290814297654082, "z": 0.6683822683023226, "word": "Slug", "pos_group": "noun", "row_number": 143180, "definition": "Any one of numerous species of terrestrial pulmonate mollusks belonging to Limax and several related genera in which the shell is either small and concealed in the mantle or altogether wanting. They are closely allied to the land snails.", "details": []}, {"x": -0.9086017788109539, "y": 0.014648834066161758, "z": 0.4174065394816811, "word": "Smelt", "pos_group": "noun", "row_number": 143411, "definition": "Any one of numerous species of small silvery salmonoid fishes of the genus Osmerus and allied genera which ascend rivers to spawn and sometimes become landlocked in lakes. They are esteemed as food and have a peculiar odor and taste.", "details": []}, {"x": -0.807482141411587, "y": -0.2840614255721505, "z": 0.516992937865959, "word": "Smeltie", "pos_group": "noun", "row_number": 143418, "definition": "A fish the bib.", "details": []}, {"x": -0.7831476645649325, "y": 0.028938977200279548, "z": 0.6211620328747514, "word": "Smolt", "pos_group": "noun", "row_number": 143561, "definition": "A young salmon two or three years old when it has acquired its silvery color.", "details": []}, {"x": -0.9201821050500473, "y": -0.1339157236306944, "z": 0.3678742618207085, "word": "Snacot", "pos_group": "noun", "row_number": 143660, "definition": "A pipefish of the genus Syngnathus. See Pipefish.", "details": []}, {"x": -0.7423791070466699, "y": -0.20682014297008083, "z": 0.6372587307227924, "word": "Snail", "pos_group": "noun", "row_number": 143676, "definition": "Any one of numerous species of terrestrial air-breathing gastropods belonging to the genus Helix and many allied genera of the family Helicidae. They are abundant in nearly all parts of the world except the arctic regions and feed almost entirely on vegetation; a land snail.", "details": []}, {"x": -0.8675371038140308, "y": 0.06363523481003759, "z": 0.4932848369822801, "word": "Snail", "pos_group": "noun", "row_number": 143677, "definition": "Any gastropod having a general resemblance to the true snails including fresh-water and marine species. See Pond snail under Pond and Sea snail.", "details": []}, {"x": -0.8607797481495122, "y": -0.26235744419981305, "z": 0.4361499703640989, "word": "Snailfish", "pos_group": "noun", "row_number": 143682, "definition": "See Sea snail (a).", "details": []}, {"x": -0.7455227682239901, "y": -0.05206835489835507, "z": 0.6644431416440519, "word": "Snail-like", "pos_group": "adjective", "row_number": 143683, "definition": "Like or suiting a snail; as snail-like progress.", "details": []}, {"x": -0.9222711677916526, "y": -0.03612881525209554, "z": 0.38485140219141933, "word": "Snail-like", "pos_group": "adverb", "row_number": 143684, "definition": "In the manner of a snail; slowly.", "details": []}, {"x": -0.776846764505103, "y": -0.27000757429025096, "z": 0.568862913454417, "word": "Snakefish", "pos_group": "noun", "row_number": 143695, "definition": "The band fish.", "details": []}, {"x": -0.814516432887898, "y": 0.05902521873910278, "z": 0.5771299715907807, "word": "Snakefish", "pos_group": "noun", "row_number": 143696, "definition": "The lizard fish.", "details": []}, {"x": -0.9044150980090143, "y": -0.1923340902743339, "z": 0.3808423928762255, "word": "Snapper", "pos_group": "noun", "row_number": 143750, "definition": "Any one of several species of large sparoid food fishes of the genus Lutjanus abundant on the southern coasts of the United States and on both coasts of tropical America.", "details": []}, {"x": -0.7341104940987084, "y": -0.1507306689567539, "z": 0.6620891540344089, "word": "Snell", "pos_group": "noun", "row_number": 143847, "definition": "A short line of horsehair gut etc. by which a fishhook is attached to a longer line.", "details": []}, {"x": -0.8953620848621512, "y": 0.039361577637450164, "z": 0.44359599096158786, "word": "Snigg", "pos_group": "noun", "row_number": 143887, "definition": "A small eel.", "details": []}, {"x": -0.8278645561525828, "y": -0.2826454465726849, "z": 0.48451194845742906, "word": "Snipefish", "pos_group": "noun", "row_number": 143906, "definition": "The bellows fish.", "details": []}, {"x": -0.7660932937493405, "y": 0.0021587149504168784, "z": 0.6427257620650112, "word": "Snipefish", "pos_group": "noun", "row_number": 143907, "definition": "A long slender deep-sea fish (Nemichthys scolopaceus) with a slender beak.", "details": []}, {"x": -0.9247125177933992, "y": -0.09580039684480227, "z": 0.3684142280104975, "word": "Snook", "pos_group": "noun", "row_number": 143948, "definition": "A large perchlike marine food fish (Centropomus undecimalis) found both on the Atlantic and Pacific coasts of tropical America; -- called also ravallia and robalo.", "details": []}, {"x": -0.7525228210054661, "y": -0.23621968556019576, "z": 0.6147435758263908, "word": "Snub-nosed", "pos_group": "adjective", "row_number": 144034, "definition": "Having a short flat nose slightly turned up; as the snub-nosed eel.", "details": []}, {"x": -0.847808048794972, "y": 0.06890059293616999, "z": 0.5258081595900794, "word": "Soal", "pos_group": "noun", "row_number": 144108, "definition": "See Sole the fish.", "details": []}, {"x": -0.879498005901539, "y": -0.240682528119583, "z": 0.4105547201935236, "word": "Soapfish", "pos_group": "noun", "row_number": 144117, "definition": "Any serranoid fish of the genus Rhypticus; -- so called from the soapy feeling of its skin.", "details": []}, {"x": -0.7374149262438465, "y": -0.08927597384824024, "z": 0.669514023039272, "word": "Soft-finned", "pos_group": "adjective", "row_number": 144307, "definition": "Having the fin rays cartilaginous or flexible; without spines; -- said of certain fishes.", "details": []}, {"x": -0.9152701482216449, "y": -0.002899712765153324, "z": 0.4028301719586156, "word": "Solarium", "pos_group": "noun", "row_number": 144389, "definition": "Any one of several species of handsome marine spiral shells of the genus Solarium and allied genera. The shell is conical and usually has a large deep umbilicus exposing the upper whorls. Called also perspective shell.", "details": []}, {"x": -0.7950495555246134, "y": -0.28176851680658527, "z": 0.5371244801689194, "word": "Sole", "pos_group": "noun", "row_number": 144429, "definition": "Any one of several species of flatfishes of the genus Solea and allied genera of the family Soleidae especially the common European species (Solea vulgaris) which is a valuable food fish.", "details": []}, {"x": -0.7944360093678005, "y": 0.043161504201870426, "z": 0.6058122742028227, "word": "Sole", "pos_group": "noun", "row_number": 144430, "definition": "Any one of several American flounders somewhat resembling the true sole in form or quality as the California sole (Lepidopsetta bilineata) the long-finned sole (Glyptocephalus zachirus) and other species.", "details": []}, {"x": -0.9155894846107027, "y": -0.1571388798350045, "z": 0.37013952519895527, "word": "Solen", "pos_group": "noun", "row_number": 144480, "definition": "Any marine bivalve mollusk belonging to Solen or allied genera of the family Solenidae; a razor shell.", "details": []}, {"x": -0.7374814851650663, "y": -0.18674373166085115, "z": 0.6490360835301133, "word": "Solenacean", "pos_group": "noun", "row_number": 144481, "definition": "Any species of marine bivalve shells belonging to the family Solenidae.", "details": []}, {"x": -0.8789764214712172, "y": 0.05730321855233817, "z": 0.47340975025995846, "word": "Solenaceous", "pos_group": "adjective", "row_number": 144482, "definition": "Of or pertaining to the solens or family Solenidae.", "details": []}, {"x": -0.8484266107607961, "y": -0.27305220467860575, "z": 0.45344765924316055, "word": "Solenogastra", "pos_group": "other", "row_number": 144487, "definition": "An order of lowly organized Mollusca belonging to the Isopleura. A narrow groove takes the place of the foot of other gastropods.", "details": []}, {"x": -0.751921184018278, "y": -0.029909382434712434, "z": 0.6585741885823685, " 01467975044944, "z": 0.6305401525849421, "word": "Spalting knife", "pos_group": "other", "row_number": 145425, "definition": "A knife used in splitting codfish.", "details": []}, {"x": -0.9227907642948235, "y": -0.1194697443200618, "z": 0.3663115962186766, "word": "Sparada", "pos_group": "noun", "row_number": 145506, "definition": "A small California surf fish (Micrometrus aggregatus); -- called also shiner.", "details": []}, {"x": -0.7451727795049561, "y": -0.21925213807394517, "z": 0.6297984031695077, "word": "Sparling", "pos_group": "noun", "row_number": 145573, "definition": "The European smelt (Osmerus eperlanus).", "details": []}, {"x": -0.8601929626497248, "y": 0.06760059438853845, "z": 0.5054683240779833, "word": "Sparling", "pos_group": "noun", "row_number": 145574, "definition": "A young salmon.", "details": []}, {"x": -0.8682035362730777, "y": -0.2556896244119728, "z": 0.42525925689041394, "word": "Sparoid", "pos_group": "adjective", "row_number": 145577, "definition": "Of or pertaining to the Sparidae a family of spinous-finned fishes which includes the scup sheepshead and sea bream.", "details": []}, {"x": -0.7413059102829713, "y": -0.06579013146553928, "z": 0.667935031257743, "word": "Spat", "pos_group": "noun", "row_number": 145612, "definition": "A young oyster or other bivalve mollusk both before and after it first becomes adherent or such young collectively.", "details": []}, {"x": -0.9204504603734981, "y": -0.02247997264802592, "z": 0.3902122509967617, "word": "Spatangoidea", "pos_group": "other", "row_number": 145622, "definition": "An order of irregular sea urchins usually having a more or less heart-shaped shell with four or five petal-like ambulacra above. The mouth is edentulous and situated anteriorly on the under side.", "details": []}, {"x": -0.7831368451464559, "y": -0.27633236883244466, "z": 0.557079082096524, "word": "Spatangus", "pos_group": "noun", "row_number": 145623, "definition": "A genus of heart-shaped sea urchins belonging to the Spatangoidea.", "details": []}, {"x": -0.8064462814076994, "y": 0.05478006046176369, "z": 0.5887644182349163, "word": "Spawn", "pos_group": "other", "row_number": 145668, "definition": "To produce or deposit (eggs) as fishes or frogs do.", "details": []}, {"x": -0.9094120639678059, "y": -0.1796654976860048, "z": 0.37508666578679606, "word": "Spawn", "pos_group": "other", "row_number": 145670, "definition": "To deposit eggs as fish or frogs do.", "details": []}, {"x": -0.734199470682202, "y": -0.16508981406818674, "z": 0.6585563685372011, "word": "Spawn", "pos_group": "other", "row_number": 145672, "definition": "The ova or eggs of fishes oysters and other aquatic animals.", "details": []}, {"x": -0.8896181875365585, "y": 0.04794748314514743, "z": 0.45418115247576535, "word": "Spawner", "pos_group": "noun", "row_number": 145676, "definition": "A mature female fish.", "details": []}, {"x": -0.8356338334011476, "y": -0.2808649536477744, "z": 0.4720497582752655, "word": "Spearfish", "pos_group": "noun", "row_number": 145721, "definition": "A large and powerful fish (Tetrapturus albidus) related to the swordfish but having scales and ventral fins. It is found on the American coast and the Mediterranean.", "details": []}, {"x": -0.7597660919482051, "y": -0.008976676453500186, "z": 0.6501345282367339, "word": "Speck", "pos_group": "noun", "row_number": 145793, "definition": "The blubber of whales or other marine mammals; also the fat of the hippopotamus.", "details": []}, {"x": -0.9256589886332288, "y": -0.08107724943631367, "z": 0.36956990730624956, "word": "Speck", "pos_group": "noun", "row_number": 145796, "definition": "A small etheostomoid fish (Ulocentra stigmaea) common in the Eastern United States.", "details": []}, {"x": -0.7568426140500676, "y": -0.24671642633337745, "z": 0.6052439694331102, "word": "Specksioneer", "pos_group": "noun", "row_number": 145808, "definition": "The chief harpooner who also directs in cutting up the speck or blubber; -- so called among whalers.", "details": []}, {"x": -0.8398758933156526, "y": 0.06973423055048938, "z": 0.5382802438477245, "word": "Spelding", "pos_group": "noun", "row_number": 145941, "definition": "A haddock or other small fish split open and dried in the sun; -- called also speldron.", "details": []}, {"x": -0.8862625538306798, "y": -0.23133152685976155, "z": 0.40127846984139687, "word": "Spent", "pos_group": "adjective", "row_number": 146000, "definition": "Exhausted of spawn or sperm; -- said especially of fishes.", "details": []}, {"x": -0.734758807503422, "y": -0.10382247589568618, "z": 0.6703360264039514, "word": "Sperling", "pos_group": "noun", "row_number": 146011, "definition": "A young herring.", "details": []}, {"x": -0.9118070426292364, "y": 0.009281368632088763, "z": 0.4105140353362371, "word": "Spermatophore", "pos_group": "noun", "row_number": 146040, "definition": "A capsule or pocket inclosing a number of spermatozoa. They are present in many annelids brachiopods mollusks and crustaceans. In cephalopods the structure of the capsule is very complex.", "details": []}, {"x": -0.8022009431390783, "y": -0.2851034031196138, "z": 0.5245852612839866, "word": "Sperm whale", "pos_group": "other", "row_number": 146067, "definition": "A very large toothed whale (Physeter macrocephalus) having a head of enormous size. The upper jaw is destitute of teeth. In the upper part of the head above the skull there is a large cavity or case filled with oil and spermaceti. This whale sometimes grows to the length of more than eighty feet. It is found in the warmer parts of all the oceans. Called also cachalot and spermaceti whale.", "details": []}, {"x": -0.7867386213161245, "y": 0.03597462796314991, "z": 0.6162371036155778, "word": "Sphaeridium", "pos_group": "noun", "row_number": 146095, "definition": "A peculiar sense organ found upon the exterior of most kinds of sea urchins and consisting of an oval or sherical head surmounting a short pedicel. It is generally supposed to be an olfactory organ.", "details": []}, {"x": -0.9191751601193207, "y": -0.1431224012111237, "z": 0.3669237022749869, "word": "Sphaerospore", "pos_group": "noun", "row_number": 146096, "definition": "One of the nonsexual spores found in red algae; a tetraspore.", "details": []}, {"x": -0.7392793116375335, "y": -0.2001481660181668, "z": 0.6429671928055887, "word": "Sphyraenoid", "pos_group": "adjective", "row_number": 146184, "definition": "Of or pertaining to the Sphyraenidae a family of marine fishes including the barracudas.", "details": []}, {"x": -0.8721239982903294, "y": 0.06313255317433762, "z": 0.4851948189498513, "word": "Spicule", "pos_group": "noun", "row_number": 146225, "definition": "Any small calcareous or siliceous body found in the tissues of various invertebrate animals especially in sponges and in most Alcyonaria.", "details": []}, {"x": -0.8561215875018954, "y": -0.26816095555430947, "z": 0.441752792101458, "word": "Spindle", "pos_group": "noun", "row_number": 146338, "definition": "Any marine univalve shell of the genus Rostellaria; -- called also spindle stromb.", "details": []}, {"x": -0.7468126607593981, "y": -0.042875449183255795, "z": 0.6636509214841807, "word": "Spindle", "pos_group": "noun", "row_number": 146339, "definition": "Any marine gastropod of the genus Fusus.", "details": []}, {"x": -0.9240353659412802, "y": -0.04375448034162068, "z": 0.3797949287968429, "word": "Spine", "pos_group": "noun", "row_number": 146354, "definition": "One of the rigid and undivided fin rays of a fish.", "details": []}, {"x": -0.7719612108205604, "y": -0.26782577214183945, "z": 0.5764939243089052, "word": "Spineback", "pos_group": "noun", "row_number": 146357, "definition": "A fish having spines in or in front of the dorsal fins.", "details": []}, {"x": -0.8189654861156489, "y": 0.06356442621469838, "z": 0.5703114028943793, "word": "Spine-finned", "pos_group": "adjective", "row_number": 146360, "definition": "Having fine supported by spinous fin rays; -- said of certain fishes.", "details": []}, {"x": -0.9017467416063456, "y": -0.2010831722136196, "z": 0.38264653644694896, "word": "Spiodea", "pos_group": "other", "row_number": 146412, "definition": "An extensive division of marine Annelida including those that are without oral tentacles or cirri and have the gills when present mostly arranged along the sides of the body. They generally live in burrows or tubes.", "details": []}, {"x": -0.7326032058582499, "y": -0.1422364066594018, "z": 0.6656285355863554, "word": "Spiracle", "pos_group": "noun", "row_number": 146416, "definition": "A tubular orifice communicating with the gill cavity of certain ganoid and all elasmobranch fishes. It is the modified first gill cleft.", "details": []}, {"x": -0.8992620037440513, "y": 0.03571306753993604, "z": 0.4359500262978793, "word": "Spiralozooid", "pos_group": "noun", "row_number": 146428, "definition": "One of the special defensive zooids of certain hydroids. They have the form of long slender tentacles and bear lasso cells.", "details": []}, {"x": -0.8226268468497808, "y": -0.2856314759258489, "z": 0.49162966835048555, "word": "Spirifer", "pos_group": "noun", "row_number": 146444, "definition": "Any one of numerous species of fossil brachipods of the genus Spirifer or Delthyris and allied genera in which the long calcareous supports of the arms form a large spiral or helix on each side.", "details": []}, {"x": -0.7689254407245916, "y": 0.010342443721616915, "z": 0.6392548008926939, "word": "Spirula", "pos_group": "noun", "row_number": 146528, "definition": "A genus of cephalopods having a multilocular internal siphunculated shell in the form of a flat spiral the coils of which are not in contact.", "details": []}, {"x": -0.9247816327337548, "y": -0.10475589662654172, "z": 0.36579384068114085, "word": "Spitchcock", "pos_group": "noun", "row_number": 146555, "definition": "An eel split and broiled.", "details": []}, {"x": -0.7485950491081701, "y": -0.2310667381684669, "z": 0.6214608716266226, "word": "Split-tail", "pos_group": "noun", "row_number": 146731, "definition": "A california market fish (Pogonichthys macrolepidotus) belonging to the Carp family.", "details": []}, {"x": -0.8525400938417513, "y": 0.07038733585205942, "z": 0.5179005805595772, "word": "Split-tongued", "pos_group": "adjective", "row_number": 146734, "definition": "Having a forked tongue as that of snakes and some lizards.", "details": []}, {"x": -0.8754542458137045, "y": -0.24790110619195457, "z": 0.41487938612994885, "word": "Sponge", "pos_group": "noun", "row_number": 146804, "definition": "The elastic fibrous skeleton of many species of horny Spongiae (keratosa) used for many purposes especially the varieties of the genus Spongia. The most valuable sponges are found in the Mediterranean and the Red Sea and on the coasts of Florida and the West Indies.", "details": []}, {"x": -0.7376535561819997, "y": -0.0799858623179443, "z": 0.6704248599815676, "word": "Sponge", "pos_group": "noun", "row_number": 146805, "definition": "One who lives upon others; a pertinaceous and indolent dependent; a parasite; a sponger.", "details": []}, {"x": -0.9179706892936943, "y": -0.009253229967636261, "z": 0.39654027706252715, "word": "Spongeous", "pos_group": "adjective", "row_number": 146822, "definition": "Resembling sponge; having the nature or qualities of sponge.", "details": []}, {"x": -0.7898346787141208, "y": -0.2815605330026151, "z": 0.5448714036870029, "word": "Spongiae", "pos_group": "other", "row_number": 146826, "definition": "The grand division of the animal kingdom which includes the sponges; -- called also Spongida Spongiaria Spongiozoa and Porifera.", "details": []}, {"x": -0.7984344155270392, "y": 0.04933966298356032, "z": 0.6000567321167759, "word": "Spongilla", "pos_group": "noun", "row_number": 146829, "definition": "A genus of siliceous spongea found in fresh water.", "details": []}, {"x": -0.9139155600240269, "y": -0.1663310947714235, "z": 0.3702597953574075, "word": "Spongious", "pos_group": "adjective", "row_number": 146837, "definition": "Somewhat spongy; spongelike; full of small cavities like sponge; as spongious bones.", "details": []}, {"x": -0.7349583589695922, "y": -0.17923536617391425, "z": 0.6539960963898996, "word": "Sporangiophore", "pos_group": "noun", "row_number": 146904, "definition": "The axis or receptacle in certain ferns (as Trichomanes) which bears the sporangia.", "details": []}, {"x": -0.8833802622226825, "y": 0.05555226320008315, "z": 0.4653528321271218, "word": "Sporocarp", "pos_group": "noun", "row_number": 146918, "definition": "A closed body or conceptacle containing one or more masses of spores or sporangia.", "details": []}, {"x": -0.8434620056112085, "y": -0.27785110355892023, "z": 0.45975059471566515, "word": "Sporocyst", "pos_group": "noun", "row_number": 146920, "definition": "An asexual zooid usually forming one of a series of larval forms in the agamic reproduction of various trematodes and other parasitic worms. The sporocyst generally develops from an egg but in its turn produces other larvae by internal budding or by the subdivision of a part or all of its contents into a number of minute germs. See Redia.", "details": []}, {"x": -0.7538466175688873, "y": -0.020949746622222112, "z": 0.656716365942263, "word": "Sporosac", "pos_group": "noun", "row_number": 146927, "definition": "A hydrozoan reproductive zooid or gonophore which does not become medusoid in form or structure. See Illust. under Athecata.", "details": []}, {"x": -0.9259455728717659, "y": -0.06635243667357284, "z": 0.3717823963377729, "word": "Spot", "pos_group": "noun", "row_number": 146974, "definition": "A sciaenoid food fish (Liostomus xanthurus) of the Atlantic coast of the United States. It has a black spot behind the shoulders and fifteen oblique dark bars on the sides. Called also goody Lafayette masooka and old wife.", "details": []}, {"x": -0.761728205230843, "y": -0.25637770319448344, "z": 0.5950131214187803, "word": "Spot", "pos_group": "noun", "row_number": 146975, "definition": "The southern redfish or red horse which has a spot on each side at the base of the tail. See Redfish.", "details": []}, {"x": -0.831769742921253, "y": 0.06933391373834118, "z": 0.5507739129320096, "word": "Spoutfish", "pos_group": "noun", "row_number": 147010, "definition": "A marine animal that spouts water; -- applied especially to certain bivalve mollusks like the long clams (Mya) which spout or squirt out water when retiring into their holes.", "details": []}, {"x": -0.892718125608192, "y": -0.2209963552773766, "z": 0.3927021252357972, "word": "Spoutshell", "pos_group": "noun", "row_number": 147012, "definition": "Any marine gastropod shell of the genus Apporhais having an elongated siphon. See Illust. under Rostrifera.", "details": []}, {"x": -0.732732849416813, "y": -0.11858621081099627, "z": 0.6701043814145733, "word": "Sprag", "pos_group": "noun", "row_number": 147016, "definition": "A young salmon.", "details": []}, {"x": -0.9077239799379448, "y": 0.020798285394721797, "z": 0.4190520344423316, "word": "Sprat", "pos_group": "noun", "row_number": 147029, "definition": "A small European herring (Clupea sprattus) closely allied to the common herring and the pilchard; -- called also garvie. The name is also applied to small herring of different kinds.", "details": []}, {"x": -0.809636725652618, "y": -0.28724144618683495, "z": 0.5118405260107907, "word": "Sprat", "pos_group": "noun", "row_number": 147030, "definition": "A California surf-fish (Rhacochilus toxotes); -- called also alfione and perch.", "details": []}, {"x": -0.7792423401131324, "y": 0.027686855954939697, "z": 0.6261108634917142, "word": "Sprod", "pos_group": "noun", "row_number": 147194, "definition": "A salmon in its second year.", "details": []}, {"x": -0.9221801181596022, "y": -0.1286795071765777, "z": 0.3647264921882358, "word": "Spur-shell", "pos_group": "noun", "row_number": 147303, "definition": "Any one of several species of handsome gastropod shells of the genus Trochus or Imperator. The shell is conical with the margin toothed somewhat like the rowel of a spur.", "details": []}, {"x": -0.7417328612442966, "y": -0.21308029835704725, "z": 0.6359474420126408, "word": "Squali", "pos_group": "other", "row_number": 147373, "definition": "The suborder of elasmobranch fishes which comprises the sharks.", "details": []}, {"x": -0.8648857512827438, "y": 0.06783866819467543, "z": 0.49736360172981714, "word": "Squalodon", "pos_group": "noun", "row_number": 147387, "definition": "A genus of fossil whales belonging to the Phocodontia; -- so called because their are serrated like a shark's.", "details": []}, {"x": -0.863730061598141, "y": -0.26208557165679713, "z": 0.43044341535328573, "word": "Squaloid", "pos_group": "adjective", "row_number": 147389, "definition": "Like or pertaining to a shark or sharks.", "details": []}, {"x": -0.7422180711619365, "y": -0.05646445340482467, "z": 0.6677754864790627, "word": "Squame", "pos_group": "noun", "row_number": 147399, "definition": "The scale or exopodite of an antenna of a crustacean.", "details": []}, {"x": -0.922587725075874, "y": -0.029708904288771945, "z": 0.3846417431133599, "word": "Squamipen", "pos_group": "noun", "row_number": 147406, "definition": "Any one of a group of fishes having the dorsal and anal fins partially covered with scales.", "details": []}, {"x": -0.7780794954972506, "y": -0.27486869406945963, "z": 0.5648358165938963, "word": "Squat", "pos_group": "noun", "row_number": 147494, "definition": "The angel fish (Squatina angelus).", "details": []}, {"x": -0.8107761715383308, "y": 0.05998160426506253, "z": 0.5822750267832518, "word": "Squeteague", "pos_group": "noun", "row_number": 147561, "definition": "An American sciaenoid fish (Cynoscion regalis) abundant on the Atlantic coast of the United States and much valued as a food fish. It is of a bright silvery color with iridescent reflections. Called also weakfish squitee chickwit and sea trout. The spotted squeteague (C. nebulosus) of the Southern United States is a similar fish but the back and upper fins are spotted with black. It is called also spotted weakfish and locally sea trout and sea salmon.", "details": []}, {"x": -0.9070919817434966, "y": -0.18867326394801565, "z": 0.37627986410098857, "word": "Squid", "pos_group": "noun", "row_number": 147570, "definition": "Any one of numerous species of ten-armed cephalopods having a long tapered body and a caudal fin on each side; especially any species of Loligo Ommastrephes and related genera. See Calamary Decacerata Dibranchiata.", "details": []}, {"x": -0.7322982878280636, "y": -0.15687664540908425, "z": 0.6626680434193872, "word": "Squid", "pos_group": "noun", "row_number": 147571, "definition": "A fishhook with a piece of bright lead bone or other substance fastened on its shank to imitate a squid.", "details": []}, {"x": -0.8937513624082415, "y": 0.04497231633756314, "z": 0.44630258004704215, "word": "Squilla", "pos_group": "noun", "row_number": 147584, "definition": "Any one of numerous stomapod crustaceans of the genus Squilla and allied genera. They make burrows in mud or beneath stones on the seashore. Called also mantis shrimp. See Illust. under Stomapoda.", "details": []}, {"x": -0.8304467314031599, "y": -0.2845631082918278, "z": 0.47893847590384875, "word": "Stalk", "pos_group": "noun", "row_number": 147896, "definition": "A stem or peduncle as of certain barnacles and crinoids.", "details": []}, {"x": -0.7622908748513034, "y": -0.00041618328314534054, "z": 0.6472344620845752, "word": "Stalk", "pos_group": "noun", "row_number": 147898, "definition": "The peduncle of the eyes of decapod crustaceans.", "details": []}, {"x": -0.9261315017699686, "y": -0.0898761919235487, "z": 0.366336882602099, "word": "Stalk-eyed", "pos_group": "adjective", "row_number": 147910, "definition": "Having the eyes raised on a stalk or peduncle; -- opposed to sessile-eyed. Said especially of podophthalmous crustaceans.", "details": []}, {"x": -0.7526279089109617, "y": -0.24217141002250592, "z": 0.6122942420895564, "word": "Starfish", "pos_group": "noun", "row_number": 148223, "definition": "Any one of numerous species of echinoderms belonging to the class Asterioidea in which the body is star-shaped and usually has five rays though the number of rays varies from five to forty or more. The rays are often long but are sometimes so short as to appear only as angles to the disklike body. Called also sea star five-finger and stellerid.", "details": []}, {"x": -0.8446282703851516, "y": 0.07196102911826201, "z": 0.5304947644929474, "word": "Starfish", "pos_group": "noun", "row_number": 148224, "definition": "The dollar fish or butterfish.", "details": []}, {"x": -0.8824764809270796, "y": -0.23903367197703548, "z": 0.4050903161910104, "word": "Stargaser", "pos_group": "noun", "row_number": 148226, "definition": "Any one of several species of spiny-rayed marine fishes belonging to Uranoscopus Astroscopus and allied genera of the family Uranoscopidae. The common species of the Eastern United States are Astroscopus anoplus and A. guttatus. So called from the position of the eyes which look directly upward.", "details": []}, {"x": -0.7345976179429485, "y": -0.0945594836339151, "z": 0.6718815697482949, "word": "Starling", "pos_group": "noun", "row_number": 148245, "definition": "A California fish; the rock trout.", "details": []}, {"x": -0.914840201511376, "y": 0.0034515280035093978, "z": 0.4038013034316082, "word": "Stavesacre", "pos_group": "noun", "row_number": 148485, "definition": "A kind of larkspur (Delphinium Staphysagria) and its seeds which are violently purgative and emetic. They are used as a parasiticide and in the East for poisoning fish.", "details": []}, {"x": -0.7968960323470988, "y": -0.28564084470406426, "z": 0.532321351691063, "word": "Steelhead", "pos_group": "noun", "row_number": 148637, "definition": "A North Pacific salmon (Salmo Gairdneri) found from Northern California to Siberia; -- called also hardhead and preesil.", "details": []}, {"x": -0.7905377223440798, "y": 0.04272839686059467, "z": 0.6109209389542628, "word": "Steganopod", "pos_group": "noun", "row_number": 148719, "definition": "One of the Steganopodes.", "details": []}, {"x": -0.9178859320729651, "y": -0.1524180624407675, "z": 0.36640708227918617, "word": "Stegocephala", "pos_group": "other", "row_number": 148725, "definition": "An extinct order of amphibians found fossil in the Mesozoic rocks; called also Stegocephali and Labyrinthodonta.", "details": []}, {"x": -0.7363887379224027, "y": -0.19306312410480736, "z": 0.6484275262293717, "word": "Stegosauria", "pos_group": "other", "row_number": 148726, "definition": "An extinct order of herbivorous dinosaurs including the genera Stegosaurus Omosaurus and their allies.", "details": []}, {"x": -0.8766856461191548, "y": 0.06210944408151326, "z": 0.47703741451224285, "word": "Stegosaurus", "pos_group": "noun", "row_number": 148727, "definition": "A genus of large Jurassic dinosaurs remarkable for a powerful dermal armature of plates and spines.", "details": []}, {"x": -0.8512924259612459, "y": -0.2736100905011396, "z": 0.4477038350036492, "word": "Stellerid", "pos_group": "noun", "row_number": 148753, "definition": "A starfish.", "details": []}, {"x": -0.7483810673185519, "y": -0.033684865715880676, "z": 0.6624130946024908, "word": "Stellerida", "pos_group": "other", "row_number": 148754, "definition": "An extensive group of echinoderms comprising the starfishes and ophiurans.", "details": []}, {"x": -0.9255608009521582, "y": -0.051731305448314904, "z": 0.37504809795199984, "word": "Stelleridean", "pos_group": "noun", "row_number": 148756, "definition": "A starfish or brittle star.", "details": []}, {"x": -0.767150299101237, "y": -0.2651237978698164, "z": 0.5841145353370069, "word": "Stellion", "pos_group": "noun", "row_number": 148760, "definition": "A lizard (Stellio vulgaris) common about the Eastern Mediterranean among ruins. In color it is olive-green shaded with black with small stellate spots. Called also hardim and star lizard.", "details": []}, {"x": -0.8235442768297269, "y": 0.06768744904578987, "z": 0.5631991063049335, "word": "Stenostome", "pos_group": "adjective", "row_number": 148826, "definition": "Having a small or narrow mouth; -- said of certain small ground snakes (Opoterodonta) which are unable to dilate their jaws.", "details": []}, {"x": -0.8988133813753759, "y": -0.20973877260367768, "z": 0.38489498922078186, "word": "Stentor", "pos_group": "noun", "row_number": 148834, "definition": "Any species of ciliated Infusoria belonging to the genus Stentor and allied genera common in fresh water. The stentors have a bell-shaped or cornucopia-like body with a circle of cilia around the spiral terminal disk. See Illust. under Heterotricha.", "details": []}, {"x": -0.7313580743420356, "y": -0.13346389540572137, "z": 0.668806964465712, "word": "Sterlet", "pos_group": "noun", "row_number": 148965, "definition": "A small sturgeon (Acipenser ruthenus) found in the Caspian Sea and its rivers and highly esteemed for its flavor. The finest caviare is made from its roe.", "details": []}, {"x": -0.9030413104848646, "y": 0.031560488105163806, "z": 0.4283927253681399, "word": "Sterrink", "pos_group": "noun", "row_number": 149013, "definition": "The crab-eating seal (Lobodon carcinophaga) of the Antarctic Ocean.", "details": []}, {"x": -0.8173058600107688, "y": -0.28815241369955824, "z": 0.4989782737466392, "word": "Stew", "pos_group": "noun", "row_number": 149037, "definition": "A small pond or pool where fish are kept for the table; a vivarium.", "details": []}, {"x": -0.7720020898483342, "y": 0.018344177274313568, "z": 0.6353552269635729, "word": "Stew", "pos_group": "noun", "row_number": 149038, "definition": "An artificial bed of oysters.", "details": []}, {"x": -0.9245744120144967, "y": -0.1139082665592878, "z": 0.3635753889601247, "word": "Stichidium", "pos_group": "noun", "row_number": 149085, "definition": "A special podlike or fusiform branch containing tetraspores. It is found in certain red algae.", "details": []}, {"x": -0.7448313596351729, "y": -0.2254414945606992, "z": 0.628014632181654, "word": "Stickleback", "pos_group": "other", "row_number": 149135, "definition": "Any one of numerous species of small fishes of the genus Gasterosteus and allied genera. The back is armed with two or more sharp spines. They inhabit both salt and brackish water and construct curious nests. Called also sticklebag sharpling and prickleback.", "details": []}, {"x": -0.8573075265770288, "y": 0.07137419164773742, "z": 0.5098328448040682, "word": "Stigma", "pos_group": "other", "row_number": 149189, "definition": "One of the apertures of the gill of an ascidian and of Amphioxus.", "details": []}, {"x": -0.8711951938956964, "y": -0.25485485061931196, "z": 0.4196045033705529, "word": "Stingbull", "pos_group": "noun", "row_number": 149321, "definition": "The European greater weever fish (Trachinus draco) which is capable of inflicting severe wounds with the spinous rays of its dorsal fin. See Weever.", "details": []}, {"x": -0.7381753840973827, "y": -0.07058653615853944, "z": 0.6709058378236253, "word": "Stinkpot", "pos_group": "noun", "row_number": 149348, "definition": "The musk turtle or musk tortoise. See under Musk.", "details": []}, {"x": -0.9204698584309807, "y": -0.0160328690240317, "z": 0.39048455389542447, "word": "Stockfish", "pos_group": "noun", "row_number": 149526, "definition": "Salted and dried fish especially codfish hake ling and torsk; also codfish dried without being salted.", "details": []}, {"x": -0.7846346038727702, "y": -0.2808333648296368, "z": 0.5527035006256836, "word": "Stolon", "pos_group": "noun", "row_number": 149580, "definition": "An extension of the integument of the body or of the body wall from which buds are developed giving rise to new zooids and thus forming a compound animal in which the zooids usually remain united by the stolons. Such stolons are often present in Anthozoa Hydroidea Bryozoa and social ascidians. See Illust. under Scyphistoma.", "details": []}, {"x": -0.8026134273322878, "y": 0.05517807266634795, "z": 0.5939419723868193, "word": "Stomapod", "pos_group": "noun", "row_number": 149612, "definition": "One of the Stomapoda.", "details": []}, {"x": -0.9119614504718104, "y": -0.1755415877776531, "z": 0.37082538183605007, "word": "Stomapoda", "pos_group": "other", "row_number": 149613, "definition": "An order of Crustacea including the squillas. The maxillipeds are leglike in form and the large claws are comblike. They have a large and elongated abdomen which contains a part of the stomach and heart; the abdominal appendages are large and bear the gills. Called also Gastrula Stomatopoda and Squilloidea.", "details": []}, {"x": -0.732668902835612, "y": -0.17136035114210477, "z": 0.658659175047395, "word": "Stomatopod", "pos_group": "noun", "row_number": 149625, "definition": "One of the Stomatopoda.", "details": []}, {"x": -0.8877206946923083, "y": 0.05327862612355701, "z": 0.4572891385254978, "word": "Stonebird", "pos_group": "noun", "row_number": 149654, "definition": "The yellowlegs; -- called also stone snipe. See Tattler 2.", "details": []}, {"x": -0.838358235917596, "y": -0.2822458764942305, "z": 0.466361162052695, "word": "Streptoneura", "pos_group": "other", "row_number": 150280, "definition": "An extensive division of gastropod Mollusca in which the loop or visceral nerves is twisted and the sexes separate. It is nearly to equivalent to Prosobranchiata.", "details": []}, {"x": -0.7560417734145222, "y": -0.012063561003014419, "z": 0.6544121845963375, "word": "Stromb", "pos_group": "noun", "row_number": 150608, "definition": "Any marine univalve mollusk of the genus Strombus and allied genera. See Conch and Strombus.", "details": []}, {"x": -0.9268215842712875, "y": -0.07493500074210427, "z": 0.36794904075515916, "word": "Strombite", "pos_group": "noun", "row_number": 150609, "definition": "A fossil shell of the genus Strombus.", "details": []}, {"x": -0.7572486908262994, "y": -0.25247776475672123, "z": 0.6023532174275368, "word": "Strombus", "pos_group": "noun", "row_number": 150613, "definition": "A genus of marine gastropods in which the shell has the outer lip dilated into a broad wing. It includes many large and handsome species commonly called conch shells or conchs. See Conch.", "details": []}, {"x": -0.83650971691401, "y": 0.07229571598324472, "z": 0.5431618754652363, "word": "Stunt", "pos_group": "noun", "row_number": 150939, "definition": "Specifically: A whale two years old which having been weaned is lean and yields but little blubber.", "details": []}, {"x": -0.8892158924512261, "y": -0.22913745311414993, "z": 0.39596858990648515, "word": "Sturgeon", "pos_group": "noun", "row_number": 150981, "definition": "Any one of numerous species of large cartilaginous ganoid fishes belonging to Acipenser and allied genera of the family Acipenseridae. They run up rivers to spawn and are common on the coasts and in the large rivers and lakes of North America Europe and Asia. Caviare is prepared from the roe and isinglass from the air bladder.", "details": []}, {"x": -0.7321660116554757, "y": -0.10941109269938415, "z": 0.6722812983943852, "word": "Sturiones", "pos_group": "other", "row_number": 150982, "definition": "An order of fishes including the sturgeons.", "details": []}, {"x": -0.9110721902414318, "y": 0.015537105971835514, "z": 0.41195395678000274, "word": "Sturionian", "pos_group": "noun", "row_number": 150983, "definition": "One of the family of fishes of which the sturgeon is the type.", "details": []}, {"x": -0.8042735228940916, "y": -0.2885298882109244, "z": 0.5195138150044888, "word": "Stylaster", "pos_group": "noun", "row_number": 151015, "definition": "Any one of numerous species of delicate usually pink calcareous hydroid corals of the genus Stylaster.", "details": []}, {"x": -0.7828128874873115, "y": 0.034979455309784496, "z": 0.6212732256342683, "word": "Stylommatophora", "pos_group": "other", "row_number": 151058, "definition": "A division of Pulmonata in which the eyes are situated at the tips of the tentacles. It includes the common land snails and slugs. See Illust. under Snail.", "details": []}, {"x": -0.9212869742556463, "y": -0.13801878487151406, "z": 0.3635672236182285, "word": "Subbrachiales", "pos_group": "other", "row_number": 151160, "definition": "A division of soft-finned fishes in which the ventral fins are situated beneath the pectorial fins or nearly so.", "details": []}, {"x": -0.738487302541967, "y": -0.20647003787316418, "z": 0.6418774240031687, "word": "Suberite", "pos_group": "noun", "row_number": 151282, "definition": "Any sponge of the genus Suberites and allied genera. These sponges have a fine and compact texture and contain minute siliceous spicules.", "details": []}, {"x": -0.8695754301544488, "y": 0.06755945446698931, "z": 0.48915671454435516, "word": "Subkingdom", "pos_group": "noun", "row_number": 151381, "definition": "One of the several primary divisions of either the animal or vegetable kingdom as in zoology the Vertebrata Tunicata Mollusca Articulata Molluscoidea Echinodermata Coelentera and the Protozoa; in botany", "details": []}, {"x": -0.8590677968591353, "y": -0.26815713686487863, "z": 0.4359980164496417, "word": "Submarine", "pos_group": "noun", "row_number": 151448, "definition": "A submarine plant or animal.", "details": []}, {"x": -0.743412842949149, "y": -0.04709999329190353, "z": 0.6671723432293688, "word": "Submedian", "pos_group": "adjective", "row_number": 151453, "definition": "Next to the median (on either side); as the submedian teeth of mollusks.", "details": []}, {"x": -0.9244979762684724, "y": -0.03731962646694132, "z": 0.3793556871273539, "word": "Suboperculum", "pos_group": "noun", "row_number": 151518, "definition": "The lower opercular bone in fishes.", "details": []}, {"x": -0.7730753567397421, "y": -0.27288077932623644, "z": 0.5726173007131609, "word": "Subumbrella", "pos_group": "noun", "row_number": 151871, "definition": "The integument of the under surface of the bell or disk-shaped body of a jellyfish.", "details": []}, {"x": -0.8152556583485072, "y": 0.06479160198622488, "z": 0.575465255113461, "word": "Sucker", "pos_group": "noun", "row_number": 152039, "definition": "Any one of numerous species of North American fresh-water cyprinoid fishes of the family Catostomidae; so called because the lips are protrusile. The flesh is coarse and they are of little value as food. The most common species of the Eastern United States are the northern sucker (Catostomus Commersoni) the white sucker (C. teres) the hog sucker (C. nigricans) and the chub or sweet sucker (Erimyzon sucetta). Some of the large Western species are called buffalo fish red horse black horse and suckerel.", "details": []}, {"x": -0.9044990371214432, "y": -0.19762796202766025, "z": 0.37792152686923774, "word": "Sucker", "pos_group": "noun", "row_number": 152041, "definition": "The lumpfish.", "details": []}, {"x": -0.7306509881877666, "y": -0.14835025892841575, "z": 0.6664392951620665, "word": "Sucker", "pos_group": "noun", "row_number": 152043, "definition": "A California food fish (Menticirrus undulatus) closely allied to the kingfish (a); -- called also bagre.", "details": []}, {"x": -0.8977839890962424, "y": 0.04148192198451543, "z": 0.4384782310114253, "word": "Sucker", "pos_group": "noun", "row_number": 152044, "definition": "A parasite; a sponger. See def. 6 above.", "details": []}, {"x": -0.8251550300755297, "y": -0.2878146901418618, "z": 0.48608834637295706, "word": "Suckfish", "pos_group": "noun", "row_number": 152053, "definition": "A sucker fish.", "details": []}, {"x": -0.7650715412679399, "y": 0.008000793278791017, "z": 0.6438955847408869, "word": "Suctorial", "pos_group": "adjective", "row_number": 152070, "definition": "Capable of adhering by suction; as the suctorial fishes.", "details": []}, {"x": -0.9263322170817256, "y": -0.09891024060889532, "z": 0.36349056094917376, "word": "Suctorian", "pos_group": "noun", "row_number": 152071, "definition": "A cartilaginous fish with a mouth adapted for suction as the lampery.", "details": []}, {"x": -0.7485592068221484, "y": -0.23713618428772615, "z": 0.6192136497068307, "word": "Sulphur-bottom", "pos_group": "noun", "row_number": 152394, "definition": "A very large whalebone whale of the genus Sibbaldius having a yellowish belly; especially S. sulfureus of the North Pacific and S. borealis of the North Atlantic; -- called also sulphur whale.", "details": []}, {"x": -0.8494381639767739, "y": 0.07369976337137811, "z": 0.5225161724375335, "word": "Sundry", "pos_group": "other", "row_number": 152543, "definition": "Several; divers; more than one or two; various.", "details": []}, {"x": -0.878460557059711, "y": -0.24650634133549426, "z": 0.4093185475540178, "word": "Sunfish", "pos_group": "noun", "row_number": 152547, "definition": "A very large oceanic plectognath fish (Mola mola Mola rotunda or Orthagoriscus mola) having a broad body and a truncated tail.", "details": []}, {"x": -0.7347189666269238, "y": -0.08514694601230442, "z": 0.6730067144267157, "word": "Sunfish", "pos_group": "noun", "row_number": 152548, "definition": "Any one of numerous species of perch-like North American fresh-water fishes of the family Centrachidae. They have a broad compressed body and strong dorsal spines. Among the common species of the Eastern United States are Lepomis gibbosus (called also bream pondfish pumpkin seed and sunny) the blue sunfish or dollardee (L. pallidus) and the long-eared sunfish (L. auritus). Several of the species are called also pondfish.", "details": []}, {"x": -0.9176875236787894, "y": -0.002828558848144053, "z": 0.39729284934306835, "word": "Sunfish", "pos_group": "noun", "row_number": 152549, "definition": "The moonfish or bluntnosed shiner.", "details": []}, {"x": -0.7915836662515401, "y": -0.285663857583679, "z": 0.5401772484973634, "word": "Sunfish", "pos_group": "noun", "row_number": 152551, "definition": "The basking or liver shark.", "details": []}, {"x": -0.7945347202763078, "y": 0.04917356290461322, "z": 0.6052243707805522, "word": "Sunfish", "pos_group": "noun", "row_number": 152552, "definition": "Any large jellyfish.", "details": []}, {"x": -0.9163132749219358, "y": -0.16177318863465384, "z": 0.36633238683033953, "word": "Sunsquall", "pos_group": "noun", "row_number": 152590, "definition": "Any large jellyfish.", "details": []}, {"x": -0.7337193226210824, "y": -0.18558183228333686, "z": 0.6536171196800308, "word": "Suprabranchial", "pos_group": "adjective", "row_number": 153083, "definition": "Situated above the branchiae; -- applied especially to the upper division of the gill cavity of bivalve mollusks.", "details": []}, {"x": -0.8812055856067281, "y": 0.060561187950502415, "z": 0.46883798737893145, "word": "Supraocular", "pos_group": "adjective", "row_number": 153124, "definition": "Above the eyes; -- said of certain scales of fishes and reptiles.", "details": []}, {"x": -0.8463046041719035, "y": -0.2786810712525191, "z": 0.4539883010419828, "word": "Surgeon", "pos_group": "noun", "row_number": 153281, "definition": "Any one of numerous species of chaetodont fishes of the family Teuthidae or Acanthuridae which have one or two sharp lancelike spines on each side of the base of the tail. Called also surgeon fish doctor fish lancet fish and sea surgeon.", "details": []}, {"x": -0.7502262474019356, "y": -0.024526955247134215, "z": 0.6607261203974872, "word": "Surinam toad", "pos_group": "other", "row_number": 153290, "definition": "A species of toad native of Surinam. See Pipa.", "details": []}, {"x": -0.92683769654584, "y": -0.06003830437097132, "z": 0.37063092999621594, "word": "Surmullet", "pos_group": "adjective", "row_number": 153318, "definition": "Any one of various species of mullets of the family Millidae esp. the European species (Millus surmulletus) which is highly prized as a food fish. See Mullet.", "details": []}, {"x": -0.7624301877093546, "y": -0.26190225150879476, "z": 0.5916987574130119, "word": "Suture", "pos_group": "noun", "row_number": 153611, "definition": "A seam or impressed line as between the segments of a crustacean or between the whorls of a univalve shell.", "details": []}, {"x": -0.8282387476413112, "y": 0.07137418455043829, "z": 0.5558113912878293, "word": "Swallowfish", "pos_group": "noun", "row_number": 153696, "definition": "The European sapphirine gurnard (Trigla hirundo). It has large pectoral fins.", "details": []}, {"x": -0.8956195897487605, "y": -0.21827064076111596, "z": 0.3875867358927467, "word": "Swarmspore", "pos_group": "noun", "row_number": 153772, "definition": "One of innumerable minute motile reproductive bodies produced asexually by certain algae and fungi; a zoospore.", "details": []}, {"x": -0.73038241224624, "y": -0.12443764874893232, "z": 0.671607626114535, "word": "Sweetmeat", "pos_group": "noun", "row_number": 153978, "definition": "A boat shell (Crepidula fornicata) of the American coast.", "details": []}, {"x": -0.9066846446797904, "y": 0.026909742548245987, "z": 0.4209499030263212, "word": "Swellfish", "pos_group": "noun", "row_number": 154020, "definition": "Any plectognath fish that dilates itself as the bur fish puffer or diodon.", "details": []}, {"x": -0.8119169363410896, "y": -0.2901924510066354, "z": 0.5065365039770189, "word": "Swelltoad", "pos_group": "noun", "row_number": 154025, "definition": "A swellfish.", "details": []}, {"x": -0.7753159743213083, "y": 0.026134694876949076, "z": 0.631032580526465, "word": "Swim", "pos_group": "noun", "row_number": 154099, "definition": "The sound or air bladder of a fish.", "details": []}, {"x": -0.9240862300336389, "y": -0.12323021760648512, "z": 0.3617719626102542, "word": "Swim", "pos_group": "noun", "row_number": 154100, "definition": "A part of a stream much frequented by fish.", "details": []}, {"x": -0.7412458407413128, "y": -0.2193549812116435, "z": 0.63438000898621, "word": "Swimmeret", "pos_group": "noun", "row_number": 154106, "definition": "One of a series of flat fringed and usually bilobed appendages of which several pairs occur on the abdominal somites of many crustaceans. They are used as fins in swimming.", "details": []}, {"x": -0.8620941919549148, "y": 0.07185013270503232, "z": 0.5016285105811589, "word": "Swinefish", "pos_group": "noun", "row_number": 154126, "definition": "The wolf fish.", "details": []}, {"x": -0.8667305868841487, "y": -0.2615164686359092, "z": 0.42472017422258496, "word": "Swordfish", "pos_group": "noun", "row_number": 154265, "definition": "A very large oceanic fish (Xiphias gladius) the only representative of the family Xiphiidae. It is highly valued as a food fish. The bones of the upper jaw are consolidated and form a long rigid swordlike beak; the dorsal fin is high and without distinct spines; the ventral fins are absent. The adult is destitute of teeth. It becomes sixteen feet or more long.", "details": []}, {"x": -0.738982203456599, "y": -0.061107221967664216, "z": 0.6709479938101197, "word": "Swordfish", "pos_group": "noun", "row_number": 154267, "definition": "The cutlass fish.", "details": []}, {"x": -0.9227552710567652, "y": -0.023222817082369975, "z": 0.38468611945807774, "word": "Sycones", "pos_group": "other", "row_number": 154310, "definition": "A division of calcareous sponges.", "details": []}, {"x": -0.7794658022094922, "y": -0.27958110612924075, "z": 0.5605956370517549, "word": "Syle", "pos_group": "noun", "row_number": 154337, "definition": "A young herring (Clupea harengus).", "details": []}, {"x": -0.8069611344830161, "y": 0.06065220803913794, "z": 0.5874819461854642, "word": "Syllidian", "pos_group": "noun", "row_number": 154369, "definition": "Any one of numerous species of marine annelids of the family Syllidae.", "details": []}, {"x": -0.9097282486612638, "y": -0.18474009190402352, "z": 0.37184084233849657, "word": "Symbranchii", "pos_group": "other", "row_number": 154440, "definition": "An order of slender eel-like fishes having the gill openings confluent beneath the neck. The pectoral arch is generally attached to the skull and the entire margin of the upper jaw is formed by the premaxillary. Called also Symbranchia.", "details": []}, {"x": -0.7306234146152356, "y": -0.16313880120303295, "z": 0.6630046436926449, "word": "Symplectic", "pos_group": "adjective", "row_number": 154505, "definition": "Plaiting or joining together; -- said of a bone next above the quadrate in the mandibular suspensorium of many fishes which unites together the other bones of the suspensorium.", "details": []}, {"x": -0.891981435539163, "y": 0.05048170607906838, "z": 0.44924460598302207, "word": "Synapta", "pos_group": "noun", "row_number": 154547, "definition": "A genus of slender transparent holothurians which have delicate calcareous anchors attached to the dermal plates. See Illustration in Appendix.", "details": []}, {"x": -0.8331290182607658, "y": -0.2862155201273685, "z": 0.4732617827060118, "word": "Synapticula", "pos_group": "noun", "row_number": 154550, "definition": "One of numerous calcareous processes which extend between and unite the adjacent septa of certain corals especially of the fungian corals.", "details": []}, {"x": -0.7585027032796016, "y": -0.0032812028836819384, "z": 0.6516616321567296, "word": "Syncarpous", "pos_group": "adjective", "row_number": 154561, "definition": "Composed of several carpels consolidated into one ovary.", "details": []}, {"x": -0.9274320615919458, "y": -0.083789766988602, "z": 0.3644846307861405, "word": "Syncytium", "pos_group": "noun", "row_number": 154615, "definition": "The ectoderm of a sponge.", "details": []}, {"x": -0.7528960455088208, "y": -0.24807259637444024, "z": 0.609596203716217, "word": "Syndactylous", "pos_group": "adjective", "row_number": 154618, "definition": "Having the toes firmly united together for some di
