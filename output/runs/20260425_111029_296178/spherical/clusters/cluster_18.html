2912113264, "word": "Pelagian", "pos_group": "adjective", "row_number": 111272, "definition": "Of or pertaining to the sea; marine; pelagic; as pelagian shells.", "details": []}, {"x": -0.9141348948061517, "y": -0.10351417667206878, "z": 0.39197220478708644, "word": "Pelican", "pos_group": "noun", "row_number": 111292, "definition": "Any large webfooted bird of the genus Pelecanus of which about a dozen species are known. They have an enormous bill to the lower edge of which is attached a pouch in which captured fishes are temporarily stored.", "details": []}, {"x": -0.7656733247047741, "y": -0.2141852685016727, "z": 0.6065220775803662, "word": "Pelicosauria", "pos_group": "other", "row_number": 111296, "definition": "A suborder of Theromorpha including terrestrial reptiles from the Permian formation.", "details": []}, {"x": -0.8516935821911742, "y": 0.04247276081261214, "z": 0.522316098395713, "word": "Pelioma", "pos_group": "noun", "row_number": 111298, "definition": "A livid ecchymosis.", "details": []}, {"x": -0.87332494621669, "y": -0.22539897761724365, "z": 0.43185511367207047, "word": "Pellibranchiata", "pos_group": "other", "row_number": 111312, "definition": "A division of Nudibranchiata in which the mantle itself serves as a gill.", "details": []}, {"x": -0.7553313867884492, "y": -0.08704565002516622, "z": 0.6495364123310827, "word": "Pen", "pos_group": "noun", "row_number": 111368, "definition": "The internal shell of a squid.", "details": []}, {"x": -0.907726134588785, "y": -0.023117928567223004, "z": 0.41892580006877544, "word": "Penk", "pos_group": "noun", "row_number": 111526, "definition": "A minnow. See Pink n. 4.", "details": []}, {"x": -0.800962123747902, "y": -0.25584436816089146, "z": 0.5412978252326578, "word": "Pennatula", "pos_group": "noun", "row_number": 111546, "definition": "Any one of numerous species of Pennatula Pteroides and allied genera of Alcyonaria having a featherlike form; a sea-pen. The zooids are situated along one edge of the side branches.", "details": []}, {"x": -0.8059587346671915, "y": 0.02349809787370775, "z": 0.5915051626232668, "word": "Pennatulacea", "pos_group": "other", "row_number": 111547, "definition": "A division of alcyonoid corals including the seapens and related kinds. They are able to move about by means of the hollow muscular peduncle which also serves to support them upright in the mud. See Pennatula and Illust. under Alcyonaria.", "details": []}, {"x": -0.9053906445414274, "y": -0.15571568510405337, "z": 0.39499418500711353, "word": "Pentacrinin", "pos_group": "noun", "row_number": 111622, "definition": "A red and purple pigment found in certain crinoids of the genus Pentacrinus.", "details": []}, {"x": -0.7536980811089921, "y": -0.17084079130655705, "z": 0.6346279434112341, "word": "Pentacrinite", "pos_group": "noun", "row_number": 111623, "definition": "Any species of Pentacrinus.", "details": []}, {"x": -0.8779612136209546, "y": 0.03078218758932343, "z": 0.47774110593964636, "word": "Pentacrinoid", "pos_group": "noun", "row_number": 111624, "definition": "An immature comatula when it is still attached by a stem and thus resembles a Pentacrinus.", "details": []}, {"x": -0.8464118920086018, "y": -0.25150230806780544, "z": 0.46939695152715455, "word": "Pentacrinus", "pos_group": "noun", "row_number": 111625, "definition": "A genus of large stalked crinoids of which several species occur in deep water among the West Indies and elsewhere.", "details": []}, {"x": -0.7686037769263804, "y": -0.0368238690459824, "z": 0.6386644163901629, "word": "Pentamerus", "pos_group": "noun", "row_number": 111662, "definition": "A genus of extinct Paleozoic brachiopods often very abundant in the Upper Silurian.", "details": []}, {"x": -0.914928575231973, "y": -0.07106552939517398, "z": 0.39731019714547444, "word": "Peraeopod", "pos_group": "noun", "row_number": 111813, "definition": "One of the thoracic legs of a crustacean. See Illust. of Crustacea.", "details": []}, {"x": -0.7769117416409309, "y": -0.23534464911294803, "z": 0.5839700692966707, "word": "Perca", "pos_group": "noun", "row_number": 111832, "definition": "A genus of fishes including the fresh-water perch.", "details": []}, {"x": -0.8340836355920473, "y": 0.041250403941026206, "z": 0.550093531149254, "word": "Percesoces", "pos_group": "other", "row_number": 111860, "definition": "An order of fishes including the gray mullets (Mugil) the barracudas the silversides and other related fishes. So called from their relation both to perches and to pikes.", "details": []}, {"x": -0.8878194465935895, "y": -0.20239425941524672, "z": 0.41329552865474645, "word": "Perch", "pos_group": "noun", "row_number": 111861, "definition": "Any fresh-water fish of the genus Perca and of several other allied genera of the family Percidae as the common American or yellow perch (Perca flavescens / Americana) and the European perch (P. fluviatilis).", "details": []}, {"x": -0.7513317536482265, "y": -0.11972633465727037, "z": 0.6489731895459289, "word": "Perch", "pos_group": "noun", "row_number": 111862, "definition": "Any one of numerous species of spiny-finned fishes belonging to the Percidae Serranidae and related families and resembling more or less the true perches.", "details": []}, {"x": -0.8988860238153249, "y": 0.0021039458334123832, "z": 0.4381774635936967, "word": "Perciformes", "pos_group": "other", "row_number": 111884, "definition": "An extensive tribe or suborder of fishes including the true perches (Percidae); the pondfishes (Centrarchidae); the sciaenoids (Sciaenidae); the sparoids (Sparidae); the serranoids (Serranidae) and some other related families.", "details": []}, {"x": -0.8177662399888928, "y": -0.2603205875092123, "z": 0.513314297924076, "word": "Percoid", "pos_group": "adjective", "row_number": 111891, "definition": "Belonging to or resembling the perches or family Percidae.", "details": []}, {"x": -0.7897776679973068, "y": 0.004896759211283658, "z": 0.6133736682332903, "word": "Percoid", "pos_group": "noun", "row_number": 111892, "definition": "Any fish of the genus Perca or allied genera of the family Percidae.", "details": []}, {"x": -0.912208752034314, "y": -0.12376698337260753, "z": 0.3905853639588205, "word": "Percomorphi", "pos_group": "other", "row_number": 111900, "definition": "A division of fishes including the perches and related kinds.", "details": []}, {"x": -0.7595923953575545, "y": -0.19932668433918968, "z": 0.6191027910010724, "word": "Perennibranchiata", "pos_group": "other", "row_number": 111957, "definition": "Those Batrachia which retain their gills through life as the menobranchus.", "details": []}, {"x": -0.8622068787550954, "y": 0.04086753513967225, "z": 0.5049050829601579, "word": "Perennibranchiate", "pos_group": "adjective", "row_number": 111958, "definition": "Having branchae or gills through life; -- said especially of certain Amphibia like the menobranchus. Opposed to caducibranchiate.", "details": []}, {"x": -0.8635161148871487, "y": -0.23784743195253813, "z": 0.44471172510266427, "word": "Perforata", "pos_group": "other", "row_number": 112002, "definition": "A division of corals including those that have a porous texture as Porites and Madrepora; -- opposed to Aporosa.", "details": []}, {"x": -0.7588979262938476, "y": -0.06702610978360601, "z": 0.6477510618086041, "word": "Perforata", "pos_group": "other", "row_number": 112003, "definition": "A division of Foraminifera including those having perforated shells.", "details": []}, {"x": -0.9118947564476695, "y": -0.04014486524387126, "z": 0.4084560477674394, "word": "Periderm", "pos_group": "noun", "row_number": 112101, "definition": "The hard outer covering of hydroids and other marine animals; the perisarc.", "details": []}, {"x": -0.7908601523232655, "y": -0.25070703453529186, "z": 0.5582886370881475, "word": "Periproct", "pos_group": "noun", "row_number": 112232, "definition": "The region surrounding the anus particularly of echinoderms.", "details": []}, {"x": -0.8163057483433663, "y": 0.033005661942975294, "z": 0.5766762969823565, "word": "Perissodactyl", "pos_group": "noun", "row_number": 112265, "definition": "One of the Perissodactyla.", "details": []}, {"x": -0.8998503101207418, "y": -0.17483086229377692, "z": 0.3996293144467995, "word": "Periwinkle", "pos_group": "noun", "row_number": 112312, "definition": "Any small marine gastropod shell of the genus Littorina. The common European species (Littorina littorea) in Europe extensively used as food has recently become naturalized abundantly on the American coast. See Littorina.", "details": []}, {"x": -0.751134326960212, "y": -0.1521054561030596, "z": 0.6423870741894714, "word": "Petalosticha", "pos_group": "other", "row_number": 112835, "definition": "An order of Echini including the irregular sea urchins as the spatangoids. See Spatangoid.", "details": []}, {"x": -0.8869022623429441, "y": 0.022319891516974142, "z": 0.4614175977286065, "word": "Petrel", "pos_group": "noun", "row_number": 112885, "definition": "Any one of numerous species of longwinged sea birds belonging to the family Procellaridae. The small petrels or Mother Carey's chickens belong to Oceanites Oceanodroma Procellaria and several allied genera.", "details": []}, {"x": -0.8354034111666571, "y": -0.2577142772466434, "z": 0.485473471895585, "word": "Phacelli", "pos_group": "other", "row_number": 112996, "definition": "of Phacellus", "details": []}, {"x": -0.775513126044168, "y": -0.019143477783490993, "z": 0.6310411385888843, "word": "Phacellus", "pos_group": "noun", "row_number": 112997, "definition": "One of the filaments on the inner surface of the gastric cavity of certain jellyfishes.", "details": []}, {"x": -0.9153663540889142, "y": -0.09088161774154953, "z": 0.3922307603422346, "word": "Phacops", "pos_group": "noun", "row_number": 113001, "definition": "A genus of trilobites found in the Silurian and Devonian formations. Phacops bufo is one of the most common species.", "details": []}, {"x": -0.7689688541883427, "y": -0.2237524981289784, "z": 0.5988503326118378, "word": "Phaeospore", "pos_group": "noun", "row_number": 113009, "definition": "A brownish zoospore characteristic of an order (Phaeosporeae) of dark green or olive-colored algae.", "details": []}, {"x": -0.8449785154914393, "y": 0.04402668708544856, "z": 0.5329849521160642, "word": "Phanerocodonic", "pos_group": "adjective", "row_number": 113066, "definition": "Having an umbrella-shaped or bell-shaped body with a wide open cavity beneath; -- said of certain jellyfishes.", "details": []}, {"x": -0.8793107624823034, "y": -0.21803793395800342, "z": 0.42340529323346393, "word": "Pharyngobranchial", "pos_group": "adjective", "row_number": 113136, "definition": "Of or pertaining to the pharynx and the branchiae; -- applied especially to the dorsal elements in the branchial arches of fishes. See Pharyngeal.", "details": []}, {"x": -0.7525986941204785, "y": -0.09937721496910487, "z": 0.650937304779143, "word": "Pharyngognathi", "pos_group": "other", "row_number": 113139, "definition": "A division of fishes in which the lower pharyngeal bones are united. It includes the scaroid labroid and embioticoid fishes.", "details": []}, {"x": -0.9051461515532516, "y": -0.012212270723916412, "z": 0.4249250578303233, "word": "Pharyngopneusta", "pos_group": "other", "row_number": 113141, "definition": "A group of invertebrates including the Tunicata and Enteropneusta.", "details": []}, {"x": -0.8068799002886072, "y": -0.2595117294860912, "z": 0.5306585425387828, "word": "Phatagin", "pos_group": "noun", "row_number": 113163, "definition": "The long-tailed pangolin (Manis tetradactyla); -- called also ipi.", "details": []}, {"x": -0.7991892232370016, "y": 0.01807729348102942, "z": 0.6008076205593924, "word": "Phoca", "pos_group": "noun", "row_number": 113383, "definition": "A genus of seals. It includes the common harbor seal and allied species. See Seal.", "details": []}, {"x": -0.9088332326689837, "y": -0.14396957904538538, "z": 0.3915289459362349, "word": "Phocacean", "pos_group": "noun", "row_number": 113384, "definition": "Any species of Phoca; a seal.", "details": []}, {"x": -0.7547712700102609, "y": -0.18266216949300074, "z": 0.6300435396091356, "word": "Phocodontia", "pos_group": "other", "row_number": 113390, "definition": "A group of extinct carnivorous whales. Their teeth had compressed and serrated crowns. It includes Squalodon and allied genera.", "details": []}, {"x": -0.8723120163272206, "y": 0.03654798055567339, "z": 0.4875817790775624, "word": "Pholas", "pos_group": "noun", "row_number": 113403, "definition": "Any one of numerous species of marine bivalve mollusks of the genus Pholas or family Pholadidae. They bore holes for themselves in clay peat and soft rocks.", "details": []}, {"x": -0.8530490897464096, "y": -0.24809864738397366, "z": 0.45907985323804495, "word": "Phycography", "pos_group": "noun", "row_number": 113661, "definition": "A description of seaweeds.", "details": []}, {"x": -0.7638439419776645, "y": -0.04753218074280681, "z": 0.6436482922356398, "word": "Phycomater", "pos_group": "noun", "row_number": 113663, "definition": "A gelatin in which the algae spores have been supposed to vegetate.", "details": []}, {"x": -0.9146870904573977, "y": -0.0585948233892161, "z": 0.39989270213716943, "word": "Phylactolaemata", "pos_group": "other", "row_number": 113677, "definition": "An order of fresh-water Bryozoa in which the tentacles are arranged on a horseshoe-shaped lophophore and the mouth is covered by an epistome. Called also Lophopoda and hippocrepians.", "details": []}, {"x": -0.7814084167927121, "y": -0.24294462801551703, "z": 0.5747858678533332, "word": "Phyllobranciae", "pos_group": "other", "row_number": 113688, "definition": "of Phyllobranchia", "details": []}, {"x": -0.8270706979070014, "y": 0.04006451027269355, "z": 0.5606682581350891, "word": "Phyllobranchia", "pos_group": "noun", "row_number": 113689, "definition": "A crustacean gill composed of lamellae.", "details": []}, {"x": -0.8930430280425589, "y": -0.1929601924035095, "z": 0.4064978649540214, "word": "Phyllopod", "pos_group": "noun", "row_number": 113707, "definition": "One of the Phyllopoda. [Also used adjectively.]", "details": []}, {"x": -0.7500215476311326, "y": -0.13237446452880217, "z": 0.6480313875343643, "word": "Phyllopoda", "pos_group": "other", "row_number": 113708, "definition": "An order of Entomostraca including a large number of species most of which live in fresh water. They have flattened or leaflike legs often very numerous which they use in swimming. Called also Branchiopoda.", "details": []}, {"x": -0.8949706179023047, "y": 0.011402451575177651, "z": 0.44597934614692947, "word": "Phyllopodous", "pos_group": "adjective", "row_number": 113709, "definition": "Of or pertaining to the Phyllopoda.", "details": []}, {"x": -0.8242307394618804, "y": -0.26130066234365296, "z": 0.5023600819978534, "word": "Phyllosoma", "pos_group": "noun", "row_number": 113711, "definition": "The larva of the spiny lobsters (Palinurus and allied genera). Its body is remarkably thin flat and transparent; the legs are very long. Called also glass-crab and glass-shrimp.", "details": []}, {"x": -0.783537980126531, "y": -0.0028799020943886034, "z": 0.6213372191195075, "word": "Physa", "pos_group": "noun", "row_number": 113730, "definition": "A genus of fresh-water Pulmonifera having reversed spiral shells. See Pond snail under Pond.", "details": []}, {"x": -0.9143229940814023, "y": -0.11123460515839387, "z": 0.3894102272787351, "word": "Physalia", "pos_group": "noun", "row_number": 113731, "definition": "A genus of large oceanic Siphonophora which includes the Portuguese man-of-war.", "details": []}, {"x": -0.7620949831186945, "y": -0.20995080343465788, "z": 0.6124801195487559, "word": "Physemaria", "pos_group": "other", "row_number": 113733, "definition": "A group of simple marine organisms usually classed as the lowest of the sponges. They have inflated hollow bodies.", "details": []}, {"x": -0.8557784594537198, "y": 0.04408065870818332, "z": 0.5154610789020553, "word": "Physeter", "pos_group": "noun", "row_number": 113734, "definition": "The genus that includes the sperm whale.", "details": []}, {"x": -0.8698727138914454, "y": -0.23187641676465287, "z": 0.4353789027680563, "word": "Physostomi", "pos_group": "other", "row_number": 113806, "definition": "An order of fishes in which the air bladder is provided with a duct and the ventral fins when present are abdominal. It includes the salmons herrings carps catfishes and others.", "details": []}, {"x": -0.7553317477914453, "y": -0.07896738338193926, "z": 0.6505675238898189, "word": "Piapec", "pos_group": "noun", "row_number": 113872, "definition": "A West African pie (Ptilostomus Senegalensis).", "details": []}, {"x": -0.9101734985574821, "y": -0.02842418420752949, "z": 0.41325085393229316, "word": "Pichiciago", "pos_group": "noun", "row_number": 113911, "definition": "A small burrowing South American edentate (Chlamyphorus truncatus) allied to the armadillos. The shell is attached only along the back.", "details": []}, {"x": -0.7963454170664306, "y": -0.2559671494858143, "z": 0.5480098494565581, "word": "Picked", "pos_group": "adjective", "row_number": 113947, "definition": "Having a pike or spine on the back; -- said of certain fishes.", "details": []}, {"x": -0.8093152929449589, "y": 0.02911880656581074, "z": 0.586652240863016, "word": "Pickerel", "pos_group": "noun", "row_number": 113961, "definition": "Any one of several species of freshwater fishes of the genus Esox esp. the smaller species.", "details": []}, {"x": -0.9040517961239266, "y": -0.16375388597499457, "z": 0.39481009960890184, "word": "Picking", "pos_group": "noun", "row_number": 113984, "definition": "The pulverized shells of oysters used in making walks.", "details": []}, {"x": -0.7513093906580826, "y": -0.16447460887233623, "z": 0.6391262023616875, "word": "Pickle-herring", "pos_group": "noun", "row_number": 114000, "definition": "A herring preserved in brine; a pickled herring.", "details": []}, {"x": -0.8818188176767292, "y": 0.029563146084152784, "z": 0.47066080481045186, "word": "Pied", "pos_group": "adjective", "row_number": 114107, "definition": "Variegated with spots of different colors; party-colored; spotted; piebald.", "details": []}, {"x": -0.8421049272860746, "y": -0.2559419551418312, "z": 0.4747136052807966, "word": "Pigfish", "pos_group": "noun", "row_number": 114179, "definition": "Any one of several species of salt-water grunts; -- called also hogfish.", "details": []}, {"x": -0.77009261232596, "y": -0.028923713195561033, "z": 0.6372760683220103, "word": "Pigfish", "pos_group": "noun", "row_number": 114180, "definition": "A sculpin. The name is also applied locally to several other fishes.", "details": []}, {"x": -0.916035316601542, "y": -0.07814772812767003, "z": 0.3934110208512164, "word": "Pigfoot", "pos_group": "noun", "row_number": 114181, "definition": "A marine fish (Scorpaena porcus) native of Europe. It is reddish brown mottled with dark brown and black.", "details": []}, {"x": -0.7727838242128464, "y": -0.23266929148365695, "z": 0.5904829903015513, "word": "Pike", "pos_group": "other", "row_number": 114230, "definition": "A large fresh-water fish (Esox lucius) found in Europe and America highly valued as a food fish; -- called also pickerel gedd luce and jack.", "details": []}, {"x": -0.8380604651549309, "y": 0.044519841443245466, "z": 0.5437578877240945, "word": "Pilchard", "pos_group": "noun", "row_number": 114248, "definition": "A small European food fish (Clupea pilchardus) resembling the herring but thicker and rounder. It is sometimes taken in great numbers on the coast of England.", "details": []}, {"x": -0.8850766896901979, "y": -0.20976311526680552, "z": 0.4154981213442556, "word": "Pillworm", "pos_group": "noun", "row_number": 114367, "definition": "Any myriapod of the genus Iulus and allied genera which rolls up spirally; a galleyworm. See Illust. under Myriapod.", "details": []}, {"x": -0.7503937965450455, "y": -0.11199532966660897, "z": 0.6514339538583943, "word": "Pindar", "pos_group": "noun", "row_number": 114478, "definition": "The peanut (Arachis hypogaea); -- so called in the West Indies.", "details": []}, {"x": -0.90200810008823, "y": -0.0017982130586893853, "z": 0.4317153620211093, "word": "Pinfish", "pos_group": "noun", "row_number": 114517, "definition": "The salt-water bream (Diplodus Holbrooki).", "details": []}, {"x": -0.8130931524185497, "y": -0.2621673917216556, "z": 0.5197574282373739, "word": "Pink", "pos_group": "other", "row_number": 114563, "definition": "The European minnow; -- so called from the color of its abdomen in summer.", "details": []}, {"x": -0.7925426282931639, "y": 0.011656080251409708, "z": 0.6097051075161963, "word": "Pinna", "pos_group": "noun", "row_number": 114583, "definition": "Any species of Pinna a genus of large bivalve mollusks found in all warm seas. The byssus consists of a large number of long silky fibers which have been used in manufacturing woven fabrics as a curiosity.", "details": []}, {"x": -0.9117993203247781, "y": -0.1317601536209614, "z": 0.388923207552665, "word": "Pinnipedia", "pos_group": "other", "row_number": 114615, "definition": "A suborder of aquatic carnivorous mammals including the seals and walruses; -- opposed to Fissipedia.", "details": []}, {"x": -0.7564246890952077, "y": -0.19416610123331926, "z": 0.624596841858067, "word": "Pinnothere", "pos_group": "noun", "row_number": 114618, "definition": "A crab of the genus pinnotheres. See Oyster crab under Oyster.", "details": []}, {"x": -0.8662841394187406, "y": 0.041381984542189, "z": 0.4978346323297346, "word": "Pipefish", "pos_group": "noun", "row_number": 114699, "definition": "Any lophobranch fish of the genus Siphostoma or Syngnathus and allied genera having a long and very slender angular body covered with bony plates. The mouth is small at the end of a long tubular snout. The male has a pouch on his belly in which the incubation of the eggs takes place.", "details": []}, {"x": -0.8596647201502056, "y": -0.2436383109707029, "z": 0.4490177528298988, "word": "Pipemouth", "pos_group": "noun", "row_number": 114706, "definition": "Any fish of the genus Fistularia; -- called also tobacco pipefish. See Fistularia.", "details": []}, {"x": -0.7594951674226874, "y": -0.0588668522180094, "z": 0.6478439506328104, "word": "Piper", "pos_group": "noun", "row_number": 114710, "definition": "A sea urchin (Goniocidaris hystrix) having very long spines native of both the American and European coasts.", "details": []}, {"x": -0.9138613006572937, "y": -0.04625748748554698, "z": 0.4033829049581604, "word": "Piraya", "pos_group": "noun", "row_number": 114778, "definition": "A large voracious fresh-water fish (Serrasalmo piraya) of South America having lancet-shaped teeth.", "details": []}, {"x": -0.7863560523234276, "y": -0.24972130733549674, "z": 0.5650517035077101, "word": "Piscation", "pos_group": "noun", "row_number": 114796, "definition": "Fishing; fishery.", "details": []}, {"x": -0.8199775960565417, "y": 0.03779769086538321, "z": 0.571146282952607, "word": "Pisces", "pos_group": "other", "row_number": 114802, "definition": "The class of Vertebrata that includes the fishes. The principal divisions are Elasmobranchii Ganoidei and Teleostei.", "details": []}, {"x": -0.8979340831025111, "y": -0.1827555641888437, "z": 0.40039328935544094, "word": "Piscicapture", "pos_group": "noun", "row_number": 114803, "definition": "Capture of fishes as by angling.", "details": []}, {"x": -0.7492823929668984, "y": -0.14507775446677454, "z": 0.6461643295235949, "word": "Pisciculture", "pos_group": "noun", "row_number": 114805, "definition": "Fish culture. See under Fish.", "details": []}, {"x": -0.8905460309698666, "y": 0.020011355327433627, "z": 0.4544527614414688, "word": "Pisciculturist", "pos_group": "noun", "row_number": 114806, "definition": "One who breeds fish.", "details": []}, {"x": -0.8308753348425313, "y": -0.2612084945628489, "z": 0.4913413277127433, "word": "Pisciform", "pos_group": "adjective", "row_number": 114807, "definition": "Having the form of a fish; resembling a fish.", "details": []}, {"x": -0.7775424741090458, "y": -0.011548180048851206, "z": 0.6287243756161704, "word": "Piscinal", "pos_group": "adjective", "row_number": 114809, "definition": "Belonging to a fishpond or a piscina.", "details": []}, {"x": -0.9158973103925169, "y": -0.09845993583732651, "z": 0.3891500454203534, "word": "Piscine", "pos_group": "adjective", "row_number": 114810, "definition": "Of or pertaining to a fish or fishes; as piscine remains.", "details": []}, {"x": -0.7651500290043062, "y": -0.22004031960038775, "z": 0.6050848625315863, "word": "Piscivorous", "pos_group": "adjective", "row_number": 114811, "definition": "Feeding or subsisting on fish.", "details": []}, {"x": -0.8490757744896854, "y": 0.046262832341548606, "z": 0.5262414650314804, "word": "Pisiform", "pos_group": "noun", "row_number": 114817, "definition": "A small bone on the ulnar side of the carpus in man and many mammals. See Illust. of Artiodactyla.", "details": []}, {"x": -0.876081528698703, "y": -0.22491972376688715, "z": 0.4264883033959676, "word": "Placodermi", "pos_group": "other", "row_number": 115079, "definition": "An extinct group of fishes supposed to be ganoids. The body and head were covered with large bony plates. See Illust. under Pterichthys and Coccosteus.", "details": []}, {"x": -0.7522583282078859, "y": -0.09133109725773385, "z": 0.6525075005818516, "word": "Placoganoidei", "pos_group": "other", "row_number": 115081, "definition": "A division of ganoid fishes including those that have large external bony plates and a cartilaginous skeleton.", "details": []}, {"x": -0.9078737095811387, "y": -0.0170666067101141, "z": 0.41889623821035316, "word": "Placoid", "pos_group": "noun", "row_number": 115083, "definition": "Any fish having placoid scales as the sharks.", "details": []}, {"x": -0.802191391909357, "y": -0.2602691376491331, "z": 0.5373536514567527, "word": "Placoides", "pos_group": "other", "row_number": 115085, "definition": "A group of fishes including the sharks and rays; the Elasmobranchii; -- called also Placoidei.", "details": []}, {"x": -0.8023720075374023, "y": 0.024182001288438965, "z": 0.5963341280977342, "word": "Placophora", "pos_group": "other", "row_number": 115087, "definition": "A division of gastropod Mollusca including the chitons. The back is covered by eight shelly plates. Called also Polyplacophora. See Illust. under Chiton and Isopleura.", "details": []}, {"x": -0.9078232390659078, "y": -0.15208692077306202, "z": 0.3908024246875295, "word": "Plagiostomi", "pos_group": "other", "row_number": 115113, "definition": "An order of fishes including the sharks and rays; -- called also Plagiostomata.", "details": []}, {"x": -0.752071944047586, "y": -0.17666358359847129, "z": 0.6349628093098293, "word": "Plaice", "pos_group": "noun", "row_number": 115130, "definition": "A European food fish (Pleuronectes platessa) allied to the flounder and growing to the weight of eight or ten pounds or more.", "details": []}, {"x": -0.8762995058673494, "y": 0.03595034764291243, "z": 0.48042350954235447, "word": "Plaice", "pos_group": "noun", "row_number": 115131, "definition": "A large American flounder (Paralichthys dentatus; called also brail puckermouth and summer flounder. The name is sometimes applied to other allied species.", "details": []}, {"x": -0.8488619625054996, "y": -0.25308733097707725, "z": 0.46409069319499513, "word": "Planorbis", "pos_group": "noun", "row_number": 115290, "definition": "Any fresh-water air-breathing mollusk belonging to Planorbis and other allied genera having shells of a discoidal form.", "details": []}, {"x": -0.7650266738026641, "y": -0.039443878657323864, "z": 0.6427895213885325, "word": "Plant", "pos_group": "noun", "row_number": 115297, "definition": "An oyster ea.", "details": []}, {"x": -0.9142576783938423, "y": -0.1191703147174929, "z": 0.3872096765165293, "word": "Plesiosaur", "pos_group": "noun", "row_number": 115800, "definition": "One of the Plesiosauria.", "details": []}, {"x": -0.7586542888677232, "y": -0.20526170776009178, "z": 0.6183132711741031, "word": "Plesiosauria", "pos_group": "other", "row_number": 115801, "definition": "An extinct order of Mesozoic marine reptiles including the genera Plesiosaurus and allied forms; -- called also Sauropterygia.", "details": []}, {"x": -0.8599147950776057, "y": 0.045233105653713634, "z": 0.5084294556372193, "word": "Plesiosaurian", "pos_group": "noun", "row_number": 115802, "definition": "A plesiosaur.", "details": []}, {"x": -0.866207952541563, "y": -0.23813685600306056, "z": 0.4392887669480419, "word": "Plesiosauri", "pos_group": "other", "row_number": 115803, "definition": "of Plesiosaurus", "details": []}, {"x": -0.7555951932871606, "y": -0.07075382715256467, "z": 0.6512064187526129, "word": "Plesiosaurus", "pos_group": "noun", "row_number": 115804, "definition": "A genus of large extinct marine reptiles having a very long neck a small head and paddles for swimming. It lived in the Mesozoic age.", "details": []}, {"x": -0.9124463946635628, "y": -0.03414717848054285, "z": 0.4077689873780054, "word": "Pleurobrachia", "pos_group": "noun", "row_number": 115837, "definition": "A genus of ctenophores having an ovate body and two long plumose tentacles.", "details": []}, {"x": -0.7917239898182372, "y": -0.2556106431717517, "z": 0.5548299947223612, "word": "Pleurobranch", "pos_group": "noun", "row_number": 115838, "definition": "Any one of the gills of a crustacean that is attached to the side of the thorax.", "details": []}, {"x": -0.8128543581067115, "y": 0.0344491830806923, "z": 0.5814473719022205, "word": "Pluroderes", "pos_group": "other", "row_number": 115845, "definition": "A group of fresh-water turtles in which the neck can not be retracted but is bent to one side for protection. The matamata is an example.", "details": []}, {"x": -0.9024494984445711, "y": -0.17184331686525606, "z": 0.3950376908674526, "word": "Pleurodont", "pos_group": "noun", "row_number": 115847, "definition": "Any lizard having pleurodont teeth.", "details": []}, {"x": -0.7491278275415569, "y": -0.15774261332111797, "z": 0.6433698515982013, "word": "Pleuron", "pos_group": "noun", "row_number": 115852, "definition": "One of lateral processes of a somite of a crustacean.", "details": []}, {"x": -0.885635425467156, "y": 0.027855591843947296, "z": 0.4635449915171482, "word": "Pleuronectoid", "pos_group": "adjective", "row_number": 115853, "definition": "Pertaining to the Pleuronectidae or Flounder family.", "details": []}, {"x": -0.8376523225355897, "y": -0.2600270012085003, "z": 0.4803379489414165, "word": "Pleurotoma", "pos_group": "noun", "row_number": 115867, "definition": "Any marine gastropod belonging to Pleurotoma and ether allied genera of the family Pleurotmidae. The species are very numerous especially in tropical seas. The outer lip has usually a posterior notch or slit.", "details": []}, {"x": -0.7718383329258491, "y": -0.021058176679880834, "z": 0.6354700158317189, "word": "Pliosaurus", "pos_group": "noun", "row_number": 115913, "definition": "An extinct genus of marine reptiles allied to Plesiosaurus but having a much shorter neck.", "details": []}, {"x": -0.9169098348865364, "y": -0.08553365493009088, "z": 0.38982091858011525, "word": "Plumularia", "pos_group": "noun", "row_number": 116125, "definition": "Any hydroid belonging to Plumularia and other genera of the family Plumularidae. They generally grow in plumelike forms.", "details": []}, {"x": -0.7687425811927637, "y": -0.22951141274856493, "z": 0.5969584200589224, "word": "Pluteus", "pos_group": "noun", "row_number": 116200, "definition": "The free-swimming larva of sea urchins and ophiurans having several long stiff processes inclosing calcareous rods.", "details": []}, {"x": -0.8421427485 : []}, {"x": -0.8703768247620746, "y": 0.041420326087643955, "z": 0.4906409476428583, "word": "Podostomata", "pos_group": "other", "row_number": 116395, "definition": "An order of Bryozoa of which Rhabdopleura is the type. See Rhabdopleura.", "details": []}, {"x": -0.8556239806681223, "y": -0.24915375181682387, "z": 0.45368492553890005, "word": "Poecilopod", "pos_group": "noun", "row_number": 116409, "definition": "One of the Poecilopoda. Also used adjectively.", "details": []}, {"x": -0.760357332316827, "y": -0.05063784577884678, "z": 0.6475280192909925, "word": "Poecilopoda", "pos_group": "other", "row_number": 116410, "definition": "Originally an artificial group including many parasitic Entomostraca together with the horseshoe crabs (Limuloidea).", "details": []}, {"x": -0.9156274759757861, "y": -0.052748617126540935, "z": 0.3985522658691691, "word": "Poggy", "pos_group": "noun", "row_number": 116438, "definition": "A small whale.", "details": []}, {"x": -0.7818835973182372, "y": -0.24824713684133626, "z": 0.5718665922177756, "word": "Polecat", "pos_group": "noun", "row_number": 116645, "definition": "The zorilla. The name is also applied to other allied species.", "details": []}, {"x": -0.823804212692831, "y": 0.04224764629003177, "z": 0.5652979351921401, "word": "Pollack", "pos_group": "noun", "row_number": 116776, "definition": "A marine gadoid food fish of Europe (Pollachius virens). Called also greenfish greenling lait leet lob lythe and whiting pollack.", "details": []}, {"x": -0.8957589512024312, "y": -0.19066433091437965, "z": 0.4015756644241437, "word": "Pollack", "pos_group": "noun", "row_number": 116777, "definition": "The American pollock; the coalfish.", "details": []}, {"x": -0.7476586239209899, "y": -0.137731564756763, "z": 0.649643439238961, "word": "Pollan", "pos_group": "noun", "row_number": 116779, "definition": "A lake whitefish (Coregonus pollan) native of Ireland. In appearance it resembles a herring.", "details": []}, {"x": -0.8941132257624065, "y": 0.017216940180257753, "z": 0.4475099065803719, "word": "Pollard", "pos_group": "noun", "row_number": 116782, "definition": "A fish the chub.", "details": []}, {"x": -0.8262330567566694, "y": -0.2643046645549285, "z": 0.49747560766035265, "word": "Pollock", "pos_group": "noun", "row_number": 116817, "definition": "A marine gadoid fish (Pollachius carbonarius) native both of the European and American coasts. It is allied to the cod and like it is salted and dried. In England it is called coalfish lob podley podling pollack etc.", "details": []}, {"x": -0.7798179153341084, "y": -0.004054221938340348, "z": 0.6259932764882066, "word": "Polybranchia", "pos_group": "other", "row_number": 116880, "definition": "A division of Nudibranchiata including those which have numerous branchiae on the back.", "details": []}, {"x": -0.916180519522608, "y": -0.10628701697710229, "z": 0.3864147068492516, "word": "Polychaeta", "pos_group": "other", "row_number": 116886, "definition": "One of the two principal groups of Chaetopoda. It includes those that have prominent parapodia and fascicles of setae. See Illust. under Parapodia.", "details": []}, {"x": -0.761451570073085, "y": -0.2158599679678193, "z": 0.6112249836698151, "word": "Polycystina", "pos_group": "other", "row_number": 116916, "definition": "A division of Radiolaria including numerous minute marine species. The skeleton is composed of silica and is often very elegant in form and sculpture. Many have been found in the fossil state.", "details": []}, {"x": -0.8532443150472487, "y": 0.04805703942559496, "z": 0.5192924607590582, "word": "Polygordius", "pos_group": "noun", "row_number": 116970, "definition": "A genus of marine annelids believed to be an ancient or ancestral type. It is remarkable for its simplicity of structure and want of parapodia. It is the type of the order Archiannelida or Gymnotoma. See Loeven's larva.", "details": []}, {"x": -0.8726278066535245, "y": -0.23161799416512663, "z": 0.42996955221734295, "word": "Polyneme", "pos_group": "noun", "row_number": 117032, "definition": "Any one of numerous species of tropical food fishes of the family Polynemidae. They have several slender filaments often very long below the pectoral fin. Some of them yield isinglass of good quality. Called also threadfish.", "details": []}, {"x": -0.7521788597941664, "y": -0.08311381468308636, "z": 0.6536964560769575, "word": "Polyp", "pos_group": "noun", "row_number": 117051, "definition": "One of the feeding or nutritive zooids of a hydroid or coral.", "details": []}, {"x": -0.9104419874066237, "y": -0.02235711606414935, "z": 0.4130321378880476, "word": "Polyphagous", "pos_group": "adjective", "row_number": 117061, "definition": "Eating or subsisting on many kinds of food; as polyphagous animals.", "details": []}, {"x": -0.7974779440869024, "y": -0.26055447220923555, "z": 0.5441877393939468, "word": "Polyphyllous", "pos_group": "adjective", "row_number": 117079, "definition": "Many-leaved; as a polyphyllous calyx or perianth.", "details": []}, {"x": -0.8057519333925272, "y": 0.030026459420055256, "z": 0.5914915329646743, "word": "Polypide", "pos_group": "noun", "row_number": 117081, "definition": "One of the ordinary zooids of the Bryozoa.", "details": []}, {"x": -0.9065484298639008, "y": -0.16029265507599252, "z": 0.39048202140429583, "word": "Polypidom", "pos_group": "noun", "row_number": 117082, "definition": "A coral or corallum; also one of the coral-like structure made by bryozoans and hydroids.", "details": []}, {"x": -0.7495671213426456, "y": -0.1702744516535873, "z": 0.6396528290535188, "word": "Polypite", "pos_group": "noun", "row_number": 117087, "definition": "One of the feeding zooids or polyps of a coral hydroid or siphonophore; a hydranth. See Illust. of Campanularian.", "details": []}, {"x": -0.8802659881672348, "y": 0.03486488790788359, "z": 0.47319787580581174, "word": "Polypite", "pos_group": "noun", "row_number": 117089, "definition": "A fossil coral.", "details": []}, {"x": -0.844512333150633, "y": -0.25774716490572597, "z": 0.469430844895747, "word": "Polypoid", "pos_group": "adjective", "row_number": 117096, "definition": "Like a polyp; having the nature of a polyp but lacking the tentacles or other parts.", "details": []}, {"x": -0.7664711707655241, "y": -0.031352892662445654, "z": 0.6415130088369401, "word": "Polypteroidei", "pos_group": "other", "row_number": 117107, "definition": "A suborder of existing ganoid fishes having numerous fins along the back. The bichir or Polypterus is the type. See Illust. under Crossopterygian.", "details": []}, {"x": -0.9173426813007919, "y": -0.07254884687278394, "z": 0.39143207569296506, "word": "Polypterus", "pos_group": "noun", "row_number": 117108, "definition": "An African genus of ganoid fishes including the bichir.", "details": []}, {"x": -0.772853387860711, "y": -0.23828381943471574, "z": 0.5881483335586571, "word": "Polythalamia", "pos_group": "other", "row_number": 117146, "definition": "A division of Foraminifera including those having a manychambered shell.", "details": []}, {"x": -0.8350256670178454, "y": 0.047410350978768216, "z": 0.5481645683929894, "word": "Polythalamous", "pos_group": "adjective", "row_number": 117147, "definition": "Many-chambered; -- applied to shells of Foraminifera and cephalopods. See Illust. of Nautilus.", "details": []}, {"x": -0.8878573285432091, "y": -0.20819830017258187, "z": 0.41032040158559435, "word": "Polyzoan", "pos_group": "noun", "row_number": 117169, "definition": "Any species of Polyzoa; one of the Polyzoa.", "details": []}, {"x": -0.7477043590820559, "y": -0.11698208025589682, "z": 0.653646222591927, "word": "Polyzoary", "pos_group": "noun", "row_number": 117173, "definition": "The compound organism of a polyzoan.", "details": []}, {"x": -0.9015680803739341, "y": 0.004201294482318098, "z": 0.4326168577107605, "word": "Polyzoon", "pos_group": "noun", "row_number": 117176, "definition": "One of the individual zooids forming the compound organism of a polyzoan.", "details": []}, {"x": -0.8148072666913873, "y": -0.26581472002525885, "z": 0.5152005946859961, "word": "Pomacentroid", "pos_group": "adjective", "row_number": 117178, "definition": "Pertaining to the Pomacentridae a family of bright-colored tropical fishes having spiny opercula; -- often called coral fishes.", "details": []}, {"x": -0.7888307167406933, "y": 0.01124522551905068, "z": 0.61450764456546, "word": "Pomfret", "pos_group": "noun", "row_number": 117202, "definition": "One of two or more species of marine food fishes of the genus Stromateus (S. niger S. argenteus) native of Southern Europe and Asia.", "details": []}, {"x": -0.9139337315430325, "y": -0.12729494706685426, "z": 0.3853843935593074, "word": "Pomfret", "pos_group": "noun", "row_number": 117203, "definition": "A marine food fish of Bermuda (Brama Raji).", "details": []}, {"x": -0.7553654894828111, "y": -0.20012768306810058, "z": 0.6239967049337578, "word": "Pompano", "pos_group": "noun", "row_number": 117229, "definition": "Any one of several species of marine fishes of the genus Trachynotus of which four species are found on the Atlantic coast of the United States; -- called also palometa.", "details": []}, {"x": -0.8640867901758105, "y": 0.04591805279174209, "z": 0.5012440039257123, "word": "Pompano", "pos_group": "noun", "row_number": 117230, "definition": "A California harvest fish (Stromateus simillimus) highly valued as a food fish.", "details": []}, {"x": -0.8623397143625066, "y": -0.24415282335716726, "z": 0.44357594150259594, "word": "Pondfish", "pos_group": "noun", "row_number": 117278, "definition": "Any one of numerous species of American fresh-water fishes belonging to the family Centrarchidae; -- called also pond perch and sunfish.", "details": []}, {"x": -0.7561241692030185, "y": -0.0624334499242456, "z": 0.6514432477795756, "word": "Poor", "pos_group": "noun", "row_number": 117376, "definition": "A small European codfish (Gadus minutus); -- called also power cod.", "details": []}, {"x": -0.9145321617187648, "y": -0.04027239518270316, "z": 0.4025034898833193, "word": "Poor-john", "pos_group": "noun", "row_number": 117379, "definition": "A small European fish similar to the cod but of inferior quality.", "details": []}, {"x": -0.7871140678332483, "y": -0.2547677905139422, "z": 0.5617337600105947, "word": "Pope", "pos_group": "noun", "row_number": 117404, "definition": "A fish; the ruff.", "details": []}, {"x": -0.8165646583367467, "y": 0.039464301191413385, "z": 0.5759034013503181, "word": "Porbeagle", "pos_group": "noun", "row_number": 117477, "definition": "A species of shark (Lamna cornubica) about eight feet long having a pointed nose and a crescent-shaped tail; -- called also mackerel shark.", "details": []}, {"x": -0.9005841486410238, "y": -0.17995427329874056, "z": 0.39568251255020676, "word": "Porcellaneous", "pos_group": "adjective", "row_number": 117484, "definition": "Having a smooth compact shell without pores; -- said of certain Foraminifera.", "details": []}, {"x": -0.7471640757603636, "y": -0.15066368883930878, "z": 0.6473378536425114, "word": "Porgy", "pos_group": "noun", "row_number": 117503, "definition": "The margate fish.", "details": []}, {"x": -0.8893948806048858, "y": 0.02565767294376614, "z": 0.4564191387014041, "word": "Porgy", "pos_group": "noun", "row_number": 117504, "definition": "The spadefish.", "details": []}, {"x": -0.83306722066683, "y": -0.2637358309597433, "z": 0.4862534496725106, "word": "Porgy", "pos_group": "noun", "row_number": 117505, "definition": "Any one of several species of embiotocoids or surf fishes of the Pacific coast. The name is also given locally to several other fishes as the bur fish.", "details": []}, {"x": -0.7738377089107324, "y": -0.013257287021876524, "z": 0.6332451694317204, "word": "Porifera", "pos_group": "other", "row_number": 117506, "definition": "A grand division of the Invertebrata including the sponges; -- called also Spongiae Spongida and Spongiozoa. The principal divisions are Calcispongiae Keratosa or Fibrospongiae and Silicea.", "details": []}, {"x": -0.9175437492091413, "y": -0.09320063784580127, "z": 0.38655802849296517, "word": "Porite", "pos_group": "noun", "row_number": 117518, "definition": "Any coral of the genus Porites or family Poritidae.", "details": []}, {"x": -0.7648036011650416, "y": -0.2258744239090589, "z": 0.6033706955667759, "word": "Porites", "pos_group": "noun", "row_number": 117519, "definition": "An important genus of reef-building corals having small twelve-rayed calicles and a very porous coral. Some species are branched others grow in large massive or globular forms.", "details": []}, {"x": -0.8463158737315267, "y": 0.04981668514301847, "z": 0.5303468108242035, "word": "Porpita", "pos_group": "noun", "row_number": 117546, "definition": "A genus of bright-colored Siphonophora found floating in the warmer parts of the ocean. The individuals are round and disk-shaped with a large zooid in the center of the under side surrounded by smaller nutritive and reproductive zooids and by slender dactylozooids near the margin. The disk contains a central float or pneumatocyst.", "details": []}, {"x": -0.8788735435074775, "y": -0.22411349700766725, "z": 0.42113469933217845, "word": "Porpoise", "pos_group": "noun", "row_number": 117547, "definition": "Any small cetacean of the genus Phocaena especially P. communis or P. phocaena of Europe and the closely allied American species (P. Americana). The color is dusky or blackish above paler beneath. They are closely allied to the dolphins but have a shorter snout. Called also harbor porpoise herring hag puffing pig and snuffer.", "details": []}, {"x": -0.7492778078933173, "y": -0.09586284337647041, "z": 0.6552809182773166, "word": "Porpoise", "pos_group": "noun", "row_number": 117548, "definition": "A true dolphin (Delphinus); -- often so called by sailors.", "details": []}, {"x": -0.9078521705894761, "y": -0.010979360531654075, "z": 0.41914662112236184, "word": "Portlast", "pos_group": "noun", "row_number": 117666, "definition": "The portoise. See Portoise.", "details": []}, {"x": -0.8035802279670936, "y": -0.2645010227936795, "z": 0.5331960485238535, "word": "Post-abdomen", "pos_group": "noun", "row_number": 117821, "definition": "That part of a crustacean behind the cephalothorax; -- more commonly called abdomen.", "details": []}, {"x": -0.7987218103144709, "y": 0.024545258772683844, "z": 0.6011996340648891, "word": "Postclavicle", "pos_group": "noun", "row_number": 117833, "definition": "A bone in the pectoral girdle of many fishes projecting backward from the clavicle.", "details": []}, {"x": -0.9101926410682922, "y": -0.1481785809148693, "z": 0.386771850453446, "word": "Postorbital", "pos_group": "adjective", "row_number": 117952, "definition": "Situated behind the orbit; as the postorbital scales of some fishes and reptiles.", "details": []}, {"x": -0.7506051591276733, "y": -0.18257839887661023, "z": 0.6350252147392051, "word": "Potamian", "pos_group": "noun", "row_number": 118042, "definition": "A river tortoise; one of a group of tortoises (Potamites or Trionychoidea) having a soft shell webbed feet and a sharp beak. See Trionyx.", "details": []}, {"x": -0.8744687643381294, "y": 0.04097435470701491, "z": 0.48334820001039513, "word": "Potamospongiae", "pos_group": "other", "row_number": 118045, "definition": "The fresh-water sponges. See Spongilla.", "details": []}, {"x": -0.8514046934070821, "y": -0.2543681901561367, "z": 0.4587012882923746, "word": "Pouch-shell", "pos_group": "noun", "row_number": 118190, "definition": "A small British and American pond snail (Bulinus hypnorum).", "details": []}, {"x": -0.7614846651833823, "y": -0.04236858932984492, "z": 0.6467967279824096, "word": "Pound", "pos_group": "noun", "row_number": 118232, "definition": "A kind of net having a large inclosure with a narrow entrance into which fish are directed by wings spreading outward.", "details": []}, {"x": -0.9171821236689645, "y": -0.05960031083085175, "z": 0.3939857294001324, "word": "Powen", "pos_group": "noun", "row_number": 118296, "definition": "A small British lake whitefish (Coregonus clupeoides or C. ferus); -- called also gwyniad and lake herring.", "details": []}, {"x": -0.7774589989478504, "y": -0.24628148859450177, "z": 0.5787079862337159, "word": "Power", "pos_group": "noun", "row_number": 118319, "definition": "Same as Poor the fish.", "details": []}, {"x": -0.8277728449217642, "y": 0.046333110048627266, "z": 0.5591469933061883, "word": "Prawn", "pos_group": "noun", "row_number": 118539, "definition": "Any one of numerous species of large shrimplike Crustacea having slender legs and long antennae. They mostly belong to the genera Pandalus Palaemon Palaemonetes and Peneus and are much used as food. The common English prawn is Palaemon serratus.", "details": []}, {"x": -0.8933275107667935, "y": -0.19852713278918993, "z": 0.40317854116223484, "word": "Preocular", "pos_group": "noun", "row_number": 119228, "definition": "One of the scales just in front of the eye of a reptile or fish.", "details": []}, {"x": -0.746271941821919, "y": -0.1300887588323207, "z": 0.6528055634527088, "word": "Preoperculum", "pos_group": "noun", "row_number": 119232, "definition": "The anterior opercular bone in fishes.", "details": []}, {"x": -0.8975880898325157, "y": 0.013938875328029069, "z": 0.4406147168960715, "word": "Preserve", "pos_group": "noun", "row_number": 119487, "definition": "A place in which game fish etc. are preserved for purposes of sport or for food.", "details": []}, {"x": -0.8214908926087662, "y": -0.266984203397206, "z": 0.5038572699656241, "word": "Priapulacea", "pos_group": "other", "row_number": 119806, "definition": "A suborder of Gephyraea having a cylindrical body with a terminal anal opening and usually with one or two caudal gills.", "details": []}, {"x": -0.7823340907138614, "y": 0.003308758862250937, "z": 0.622850240926105, "word": "Pride", "pos_group": "noun", "row_number": 119877, "definition": "A small European lamprey (Petromyzon branchialis); -- called also prid and sandpiper.", "details": []}, {"x": -0.9162095680633234, "y": -0.1143377326916964, "z": 0.3840402456411836, "word": "Proboscidifera", "pos_group": "other", "row_number": 120341, "definition": "An extensive division of pectinibranchiate gastropods including those that have a long retractile proboscis with the mouth at the end as the cones whelks tritons and cowries. See Illust. of Gastropoda and of Winkle.", "details": []}, {"x": -0.7578882934405031, "y": -0.2112188670676429, "z": 0.6172454332439432, "word": "Proboscidifera", "pos_group": "other", "row_number": 120342, "definition": "A subdivision of the taenioglossate gastropods including the fig-shells (Pyrula) the helmet shells (Cassis) the tritons and allied genera.", "details": []}, {"x": -0.8574686969113883, "y": 0.04939512974997852, "z": 0.5121596967490399, "word": "Procellarian", "pos_group": "noun", "row_number": 120376, "definition": "One of a family of oceanic birds (Procellaridae) including the petrels fulmars and shearwaters. They are often seen in great abundance in stormy weather.", "details": []}, {"x": -0.8689575511186216, "y": -0.23810440963775648, "z": 0.4338422114836034, "word": "Procerite", "pos_group": "noun", "row_number": 120383, "definition": "The segment next to the flagellum of the antennae of Crustacea.", "details": []}, {"x": -0.7523639947903339, "y": -0.07475297988037634, "z": 0.6544924837934615, "word": "Procoelian", "pos_group": "noun", "row_number": 120434, "definition": "A reptile having procoelian vertebrae; one of the Procoelia.", "details": []}, {"x": -0.9128375628434987, "y": -0.028071408509469396, "z": 0.4073568213326444, "word": "Prodigious", "pos_group": "adjective", "row_number": 120529, "definition": "Extraordinary in bulk extent quantity or degree; very great; vast; huge; immense; as a prodigious mountain; a prodigious creature; a prodigious blunder.", "details": []}, {"x": -0.7927556451504569, "y": -0.26035839482433737, "z": 0.5511370005058429, "word": "Productus", "pos_group": "noun", "row_number": 120582, "definition": "An extinct genus of brachiopods very characteristic of the Carboniferous rocks.", "details": []}, {"x": -0.8093186927373769, "y": 0.035584505194899814, "z": 0.5862908805157191, "word": "Proliferous", "pos_group": "adjective", "row_number": 120849, "definition": "Producing a cluster of branchlets from a larger branch; -- said of corals.", "details": []}, {"x": -0.9050079182570177, "y": -0.16855753331870177, "z": 0.3905752499245367, "word": "Proostracum", "pos_group": "noun", "row_number": 121070, "definition": "The anterior prolongation of the guard of the phragmocone of belemnites and allied fossil cephalopods whether horny or calcareous. See Illust. of Phragmocone.", "details": []}, {"x": -0.7472684159023267, "y": -0.1635117491507944, "z": 0.6440914705882039, "word": "Propterygium", "pos_group": "noun", "row_number": 121302, "definition": "The anterior of three principal cartilages in the fins of some fishes.", "details": []}, {"x": -0.8841952190351112, "y": 0.033287390098415706, "z": 0.46592999935171336, "word": "Prosobranchiata", "pos_group": "other", "row_number": 121422, "definition": "The highest division or subclass of gastropod mollusks including those that have the gills situated anteriorly or forward of the heart and the sexes separate.", "details": []}, {"x": -0.8400125441507081, "y": -0.2620549626554001, "z": 0.47508538413334866, "word": "Prosopulmonata", "pos_group": "other", "row_number": 121439, "definition": "A division of pulmonate mollusks having the breathing organ situated on the neck as in the common snail.", "details": []}, {"x": -0.7681754714254719, "y": -0.023289208481261547, "z": 0.6398156436572726, "word": "Proteidea", "pos_group": "other", "row_number": 121552, "definition": "An order of aquatic amphibians having prominent external gills and four legs. It includes Proteus and Menobranchus (Necturus). Called also Proteoidea and Proteida.", "details": []}, {"x": -0.9183271906003913, "y": -0.0800043202328142, "z": 0.3876525244959435, "word": "Proteroglypha", "pos_group": "other", "row_number": 121569, "definition": "A suborder of serpents including those that have permanently erect grooved poison fangs with ordinary teeth behind them in the jaws. It includes the cobras the asps and the sea snakes. Called also Proteroglyphia.", "details": []}, {"x": -0.7686930699351249, "y": -0.23522187238511158, "z": 0.5947954564262874, "word": "Proterosaurus", "pos_group": "noun", "row_number": 121571, "definition": "An extinct genus of reptiles of the Permian period. Called also Protosaurus.", "details": []}, {"x": -0.839175187212473, "y": 0.050482508259490105, "z": 0.54151317761135, "word": "Proteus", "pos_group": "noun", "row_number": 121597, "definition": "A genus of aquatic eel-shaped amphibians found in caves in Austria. They have permanent external gills as well as lungs. The eyes are small and the legs are weak.", "details": []}, {"x": -0.8848950576347147, "y": -0.21566303867590153, "z": 0.4128561380465739, "word": "Proteus", "pos_group": "noun", "row_number": 121598, "definition": "A changeable protozoan; an amoeba.", "details": []}, {"x": -0.7469202018924046, "y": -0.108912855654737, "z": 0.6559330772861969, "word": "Protist", "pos_group": "noun", "row_number": 121621, "definition": "One of the Protista.", "details": []}, {"x": -0.9046855294225649, "y": -0.00010409348410675644, "z": 0.42607990097863085, "word": "Protiston", "pos_group": "noun", "row_number": 121624, "definition": "One of the Protista.", "details": []}, {"x": -0.8099900050713653, "y": -0.26740538114176243, "z": 0.5219296445124749, "word": "Protocercal", "pos_group": "adjective", "row_number": 121630, "definition": "Having a caudal fin extending around the end of the vertebral column like that which is first formed in the embryo of fishes; diphycercal.", "details": []}, {"x": -0.7918156268714829, "y": 0.01802955449141707, "z": 0.6104940197962313, "word": "Protoconch", "pos_group": "noun", "row_number": 121640, "definition": "The embryonic shell or first chamber of ammonites and other cephalopods.", "details": []}, {"x": -0.9133468252297682, "y": -0.13558138054018185, "z": 0.38394695739583856, "word": "Protohippus", "pos_group": "noun", "row_number": 121644, "definition": "A genus of fossil horses from the Lower Pliocene. They had three toes on each foot the lateral ones being small.", "details": []}, {"x": -0.7522423557765958, "y": -0.19456002841865427, "z": 0.6295060234163052, "word": "Protoplasta", "pos_group": "other", "row_number": 121662, "definition": "A division of fresh-water rhizopods including those that have a soft body and delicate branched pseudopodia. The genus Gromia is one of the best-known.", "details": []}, {"x": -0.8682784609549576, "y": 0.046125043749868845, "z": 0.493928126938285, "word": "Protopodite", "pos_group": "noun", "row_number": 121664, "definition": "The basal portion or two proximal and more or less consolidated segments of an appendage of a crustacean.", "details": []}, {"x": -0.8582778010047128, "y": -0.24989759783719606, "z": 0.44823030564400024, "word": "Prototracheata", "pos_group": "other", "row_number": 121673, "definition": "Same as Malacopoda.", "details": []}, {"x": -0.7569202011047105, "y": -0.05403520534628829, "z": 0.6512695338665775, "word": "Protozoan", "pos_group": "noun", "row_number": 121682, "definition": "One of the Protozoa.", "details": []}, {"x": -0.9164187463649522, "y": -0.04678385170809525, "z": 0.39747698364841755, "word": "Protozoic", "pos_group": "adjective", "row_number": 121684, "definition": "Containing remains of the earliest discovered life of the globe which included mollusks radiates and protozoans.", "details": []}, {"x": -0.782531900956456, "y": -0.25343321034119154, "z": 0.568696256257796, "word": "Protozoon", "pos_group": "noun", "row_number": 121686, "definition": "One of the Protozoa.", "details": []}, {"x": -0.8204342785322483, "y": 0.04414024216290981, "z": 0.570034414426944, "word": "Protozoon", "pos_group": "noun", "row_number": 121687, "definition": "A single zooid of a compound protozoan.", "details": []}, {"x": -0.8984570685502848, "y": -0.18805685897764662, "z": 0.3967486783386811, "word": "Protracheata", "pos_group": "other", "row_number": 121689, "definition": "Same as Malacopoda.", "details": []}, {"x": -0.7454280989204438, "y": -0.14325801007468006, "z": 0.6510100551368586, "word": "Pseudobranchia", "pos_group": "noun", "row_number": 122013, "definition": "A rudimentary branchia or gill.", "details": []}, {"x": -0.8930811643687813, "y": 0.02296924877876326, "z": 0.44930885531028764, "word": "Pseudopod", "pos_group": "noun", "row_number": 122054, "definition": "A rhizopod.", "details": []}, {"x": -0.828363282012655, "y": -0.2670480623641529, "z": 0.49244248943483154, "word": "Pseudopodial", "pos_group": "adjective", "row_number": 122055, "definition": "Of or pertaining to a pseudopod or to pseudopodia. See Illust. of Heliozoa.", "details": []}, {"x": -0.77608660970385, "y": -0.005550964369745273, "z": 0.6306019037657195, "word": "Pseudopodia", "pos_group": "other", "row_number": 122056, "definition": "of Pseudopodium", "details": []}, {"x": -0.9179294896660487, "y": -0.10112492990845107, "z": 0.3836394147535395, "word": "Ptenoglossa", "pos_group": "other", "row_number": 122147, "definition": "A division of gastropod mollusks having the teeth of the radula arranged in long transverse rows somewhat like the barbs of a feather.", "details": []}, {"x": -0.7609821775302776, "y": -0.221763428761394, "z": 0.6096942735053913, "word": "Pteranodon", "pos_group": "noun", "row_number": 122149, "definition": "A genus of American Cretaceous pterodactyls destitute of teeth. Several species are known some of which had an expanse of wings of twenty feet or more.", "details": []}, {"x": -0.8505648526815217, "y": 0.05181023189721476, "z": 0.5233116960795144, "word": "Pteranodontia", "pos_group": "other", "row_number": 122150, "definition": "A group of pterodactyls destitute of teeth as in the genus Pteranodon.", "details": []}, {"x": -0.8754259254162003, "y": -0.23103656944108833, "z": 0.4245604228965325, "word": "Pterichthys", "pos_group": "noun", "row_number": 122151, "definition": "A genus of Devonian fossil fishes with winglike appendages. The head and most of the body were covered with large bony plates. See Placodermi.", "details": []}, {"x": -0.749110536436281, "y": -0.08751371406080431, "z": 0.6566389830427608, "word": "Pterobranchia", "pos_group": "other", "row_number": 122156, "definition": "An order of marine Bryozoa having a bilobed lophophore and an axial cord. The genus Rhabdopleura is the type. Called also Podostomata. See Rhabdopleura.", "details": []}, {"x": -0.9105455204519238, "y": -0.016239588686417655, "z": 0.41308973715674807, "word": "Pteroceras", "pos_group": "noun", "row_number": 122157, "definition": "A genus of large marine gastropods having the outer border of the lip divided into lobes; -- called also scorpion shell.", "details": []}, {"x": -0.7987718743167626, "y": -0.2649631672564577, "z": 0.5401462883311449, "word": "Pteropod", "pos_group": "noun", "row_number": 122165, "definition": "One of the Pteropoda.", "details": []}, {"x": -0.802118238585454, "y": 0.03061995320704767, "z": 0.5963797027013635, "word": "Pteropoda", "pos_group": "other", "row_number": 122166, "definition": "A class of Mollusca in which the anterior lobes of the foot are developed in the form of broad thin winglike organs with which they swim at near the surface of the sea.", "details": []}, {"x": -0.9089901502279872, "y": -0.15654716103826424, "z": 0.386302851606561, "word": "Pteropodous", "pos_group": "adjective", "row_number": 122167, "definition": "Of or pertaining to the Pteropoda.", "details": []}, {"x": -0.7479788581730146, "y": -0.1761797081959842, "z": 0.6399127582305039, "word": "Pterosauria", "pos_group": "other", "row_number": 122169, "definition": "An extinct order of flying reptiles of the Mesozoic age; the pterodactyls; -- called also Pterodactyli and Ornithosauria.", "details": []}, {"x": -0.8785437253661368, "y": 0.04003752839792395, "z": 0.4759810069105442, "word": "Pterygopodia", "pos_group": "other", "row_number": 122183, "definition": "of Pterygopodium", "details": []}, {"x": -0.8470183260558154, "y": -0.2592570116370441, "z": 0.4640536146208044, "word": "Puffer", "pos_group": "noun", "row_number": 122353, "definition": "Any plectognath fish which inflates its body as the species of Tetrodon and Diodon; -- called also blower puff-fish swellfish and globefish.", "details": []}, {"x": -0.7628764833988714, "y": -0.03408884389370598, "z": 0.6456449657504982, "word": "Puffer", "pos_group": "noun", "row_number": 122354, "definition": "The common or harbor porpoise.", "details": []}, {"x": -0.9185147811172335, "y": -0.066793288582949, "z": 0.38970405883110265, "word": "Pulmonata", "pos_group": "other", "row_number": 122473, "definition": "An extensive division or sub-class of hermaphrodite gastropods in which the mantle cavity is modified into an air-breathing organ as in Helix or land snails Limax or garden slugs and many pond snails as Limnaea and Planorbis.", "details": []}, {"x": -0.7730983691299466, "y": -0.24382303727862303, "z": 0.5855503719927471, "word": "Pupa", "pos_group": "noun", "row_number": 122725, "definition": "A genus of air-breathing land snails having an elongated spiral shell.", "details": []}, {"x": -0.831870190323203, "y": 0.05003284782398583, "z": 0.5527103224929493, "word": "Purple", "pos_group": "noun", "row_number": 122912, "definition": "Any shell of the genus Purpura.", "details": []}, {"x": -0.8906432676663312, "y": -0.2063139768031696, "z": 0.405202557662586, "word": "Purpura", "pos_group": "noun", "row_number": 122949, "definition": "A genus of marine gastropods usually having a rough and thick shell. Some species yield a purple dye.", "details": []}, {"x": -0.7451304764438733, "y": -0.12217233840548689, "z": 0.6556328948451728, "word": "Purpuriparous", "pos_group": "adjective", "row_number": 122958, "definition": "Producing or connected with a purple-colored secretion; as the purpuriparous gland of certain gastropods.", "details": []}, {"x": -0.9009551250746677, "y": 0.01018109298967649, "z": 0.433792816846044, "word": "Pycnodont", "pos_group": "noun", "row_number": 123189, "definition": "Any fossil fish belonging to the Pycnodontini. They have numerous round flat teeth adapted for crushing.", "details": []}, {"x": -0.8166635687335143, "y": -0.26922990885168224, "z": 0.5104663276682951, "word": "Pycnodontini", "pos_group": "other", "row_number": 123190, "definition": "An extinct order of ganoid fishes. They had a compressed body covered with dermal ribs (pleurolepida) and with enameled rhomboidal scales.", "details": []}, {"x": -0.7850847768475181, "y": 0.010511459134558955, "z": 0.6192991219024497, "word": "Pycnogonida", "pos_group": "other", "row_number": 123192, "definition": "A class of marine arthropods in which the body is small and thin and the eight legs usually very long; -- called also Pantopoda.", "details": []}, {"x": -0.9159789067419576, "y": -0.12258606609825733, "z": 0.38204096482231004, "word": "Pygobranchia", "pos_group": "other", "row_number": 123213, "definition": "A division of opisthobranchiate mollusks having the branchiae in a wreath or group around the anal opening as in the genus Doris.", "details": []}, {"x": -0.754474605181683, "y": -0.20612608544901012, "z": 0.6231212619012539, "word": "Pygopod", "pos_group": "noun", "row_number": 123214, "definition": "One of the Pygopodes.", "details": []}, {"x": -0.8617332202519914, "y": 0.05026446185925405, "z": 0.5048656662797864, "word": "Pygopod", "pos_group": "noun", "row_number": 123215, "definition": "Any species of serpentiform lizards of the family Pygopodidae which have rudimentary hind legs near the anal cleft but lack fore legs.", "details": []}, {"x": -0.8650795096901316, "y": -0.24435125679307207, "z": 0.4380980543416367, "word": "Pygopodous", "pos_group": "adjective", "row_number": 123217, "definition": "Of or pertaining to the Pygopodes.", "details": []}, {"x": -0.752816529456593, "y": -0.06627682522127637, "z": 0.6548852230853272, "word": "Pyrosome", "pos_group": "noun", "row_number": 123363, "definition": "Any compound ascidian of the genus Pyrosoma. The pyrosomes form large hollow cylinders sometimes two or three feet long which swim at the surface of the sea and are very phosphorescent.", "details": []}, {"x": -0.9150475623760738, "y": -0.03419555762496548, "z": 0.40189379496120986, "word": "Pyrula", "pos_group": "noun", "row_number": 123402, "definition": "A genus of large marine gastropods. having a pear-shaped shell. It includes the fig-shells. See Illust. in Appendix.", "details": []}, {"x": -0.7880406839719917, "y": -0.25967321286725054, "z": 0.5581771250455856, "word": "Python", "pos_group": "noun", "row_number": 123419, "definition": "Any species of very large snakes of the genus Python and allied genera of the family Pythonidae. They are nearly allied to the boas. Called also rock snake.", "details": []}, {"x": -0.8130612805252067, "y": 0.04083086676810081, "z": 0.5807445173479271, "word": "Quarl", "pos_group": "noun", "row_number": 123733, "definition": "A medusa or jellyfish.", "details": []}, {"x": -0.9032017447971445, "y": -0.17685197483726245, "z": 0.39108820896513113, "word": "Queenfish", "pos_group": "noun", "row_number": 123950, "definition": "A California sciaenoid food fish (Seriphys politus). The back is bluish and the sides and belly bright silvery. Called also kingfish.", "details": []}, {"x": -0.7451867711077975, "y": -0.1563938321498283, "z": 0.648257391343459, "word": "Quillback", "pos_group": "noun", "row_number": 124207, "definition": "An American fresh-water fish (Ictiobus / Carpiodes cyprinus); -- called also carp sucker sailfish spearfish and skimback.", "details": []}, {"x": -0.8880710158965335, "y": 0.031215346960638744, "z": 0.4586452581665114, "word": "Quinnat", "pos_group": "noun", "row_number": 124261, "definition": "The California salmon (Oncorhynchus choicha); -- called also chouicha king salmon chinnook salmon and Sacramento salmon. It is of great commercial importance.", "details": []}, {"x": -0.8353755177759566, "y": -0.2659886700939949, "z": 0.48103822268316715, "word": "Quoddies", "pos_group": "other", "row_number": 124429, "definition": "Herring taken and cured or smoked near Quoddy Head Maine or near the entrance of Passamaquoddy Ray.", "details": []}, {"x": -0.7701366976380595, "y": -0.01528284592152693, "z": 0.6376957750931733, "word": "Raash", "pos_group": "noun", "row_number": 124486, "definition": "The electric catfish.", "details": []}, {"x": -0.9190710129761935, "y": -0.08774953301775058, "z": 0.3841985067150579, "word": "Radio-flagellata", "pos_group": "other", "row_number": 124751, "definition": "A group of Protozoa having both flagella and pseudopodia.", "details": []}, {"x": -0.7646318596842014, "y": -0.23167533319652225, "z": 0.60138561601036, "word": "Radiolaria", "pos_group": "other", "row_number": 124753, "definition": "Order of rhizopods usually having a siliceous skeleton or shell and sometimes radiating spicules. The pseudopodia project from the body like rays. It includes the polycystines. See Polycystina.", "details": []}, {"x": -0.8434202867824597, "y": 0.05312949893852901, "z": 0.5346208714466113, "word": "Radula", "pos_group": "noun", "row_number": 124783, "definition": "The chitinous ribbon bearing the teeth of mollusks; -- called also lingual ribbon and tongue. See Odontophore.", "details": []}, {"x": -0.8816937135614537, "y": -0.22298542945607383, "z": 0.41580487457039716, "word": "Ragwort", "pos_group": "noun", "row_number": 124871, "definition": "A name given to several species of the composite genus Senecio.", "details": []}, {"x": -0.746394147
