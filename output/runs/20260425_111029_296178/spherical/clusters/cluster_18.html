pos_group": "noun", "row_number": 64445, "definition": "The width of the mouth when opened as of birds fishes etc.", "details": []}, {"x": -0.8048960003342996, "y": -0.029890260166236735, "z": 0.5926626367445832, "word": "Gaper", "pos_group": "noun", "row_number": 64449, "definition": "A European fish. See 4th Comber.", "details": []}, {"x": -0.8954404099100404, "y": -0.1163656558303433, "z": 0.4297039753636367, "word": "Gaper", "pos_group": "noun", "row_number": 64450, "definition": "A large edible clam (Schizothaerus Nuttalli) of the Pacific coast; -- called also gaper clam.", "details": []}, {"x": -0.7857639030093821, "y": -0.17763403941279385, "z": 0.5924704522331525, "word": "Gar", "pos_group": "verb", "row_number": 64457, "definition": "Any slender marine fish of the genera Belone and Tylosurus. See Garfish.", "details": []}, {"x": -0.8569348746988303, "y": -0.0006647707917480685, "z": 0.5154242704847087, "word": "Gar", "pos_group": "verb", "row_number": 64458, "definition": "The gar pike. See Alligator gar (under Alligator) and Gar pike.", "details": []}, {"x": -0.8616936012345489, "y": -0.2004489343941359, "z": 0.4661591598281535, "word": "Gardon", "pos_group": "noun", "row_number": 64497, "definition": "A European cyprinoid fish; the id.", "details": []}, {"x": -0.7834087799683738, "y": -0.08281734365096718, "z": 0.6159642611865249, "word": "Garfish", "pos_group": "noun", "row_number": 64501, "definition": "A European marine fish (Belone vulgaris); -- called also gar gerrick greenback greenbone gorebill hornfish longnose mackerel guide sea needle and sea pike.", "details": []}, {"x": -0.8941358014513214, "y": -0.056389462138430685, "z": 0.44423124284852117, "word": "Garfish", "pos_group": "noun", "row_number": 64502, "definition": "One of several species of similar fishes of the genus Tylosurus of which one species (T. marinus) is common on the Atlantic coast. T. Caribbaeus a very large species and T. crassus are more southern; -- called also needlefish. Many of the common names of the European garfish are also applied to the American species.", "details": []}, {"x": -0.809105267890091, "y": -0.21313456288153448, "z": 0.5476516443669294, "word": "Garibaldi", "pos_group": "noun", "row_number": 64524, "definition": "A California market fish (Pomancentrus rubicundus) of a deep scarlet color.", "details": []}, {"x": -0.8237077374774997, "y": -0.008310109377216175, "z": 0.5669537064891957, "word": "Garrupa", "pos_group": "noun", "row_number": 64600, "definition": "One of several species of California market fishes of the genus Sebastichthys; -- called also rockfish. See Rockfish.", "details": []}, {"x": -0.8872614638447069, "y": -0.15361895285483362, "z": 0.434934836613408, "word": "Garum", "pos_group": "noun", "row_number": 64611, "definition": "A sauce made of small fish. It was prized by the ancients.", "details": []}, {"x": -0.7788519935751891, "y": -0.14424926938042743, "z": 0.6103947250649916, "word": "Garvie", "pos_group": "noun", "row_number": 64612, "definition": "The sprat; -- called also garvie herring and garvock.", "details": []}, {"x": -0.8751720137512228, "y": -0.01261335319619656, "z": 0.48364744356584555, "word": "Gasteropod", "pos_group": "noun", "row_number": 64675, "definition": "Same as Gastropod.", "details": []}, {"x": -0.8415545935271216, "y": -0.21621845937943046, "z": 0.4950105493188875, "word": "Gasteropoda", "pos_group": "other", "row_number": 64676, "definition": "Same as Gastropoda.", "details": []}, {"x": -0.7947193476084321, "y": -0.047568906826143405, "z": 0.6051102028888569, "word": "Gasteropodous", "pos_group": "adjective", "row_number": 64677, "definition": "Same as Gastropodous.", "details": []}, {"x": -0.8974577798433685, "y": -0.09259384242952046, "z": 0.4312724356398738, "word": "Gastropod", "pos_group": "noun", "row_number": 64718, "definition": "One of the Gastropoda.", "details": []}, {"x": -0.7927325724633518, "y": -0.19497986813335288, "z": 0.5775447338330918, "word": "Gastropod 035702385483, "z": 0.6153402937635478, "word": "Gill", "pos_group": "noun", "row_number": 65776, "definition": "An organ for aquatic respiration; a branchia.", "details": []}, {"x": -0.8813824627539477, "y": -0.019607452905087055, "z": 0.4719962946256686, "word": "Gill", "pos_group": "noun", "row_number": 65777, "definition": "The radiating gill-shaped plates forming the under surface of a mushroom.", "details": []}, {"x": -0.8334238944350739, "y": -0.2198801542279223, "z": 0.5070082148854987, "word": "Gillian", "pos_group": "noun", "row_number": 65790, "definition": "A girl; esp. a wanton; a gill.", "details": []}, {"x": -0.8001095258140879, "y": -0.03511377060210321, "z": 0.5988253249618444, "word": "Gilthead", "pos_group": "noun", "row_number": 65804, "definition": "A marine fish.", "details": []}, {"x": -0.8972522493716028, "y": -0.10725624256893931, "z": 0.42829253954229884, "word": "Gilthead", "pos_group": "noun", "row_number": 65805, "definition": "The Pagrus / Chrysophrys auratus a valuable food fish common in the Mediterranean (so named from its golden-colored head); -- called also giltpoll.", "details": []}, {"x": -0.7872495884886755, "y": -0.18576096797855968, "z": 0.5879889014259363, "word": "Ginglymodi", "pos_group": "noun", "row_number": 65854, "definition": "An order of ganoid fishes including the modern gar pikes and many allied fossil forms. They have rhombic ganoid scales a heterocercal tail paired fins without an axis fulcra on the fins and a bony skeleton with the vertebrae convex in front and concave behind forming a ball and socket joint. See Ganoidel.", "details": []}, {"x": -0.8522972341360542, "y": 0.002288054619922539, "z": 0.5230527597576445, "word": "Gizzard", "pos_group": "noun", "row_number": 65989, "definition": "A thick muscular stomach found in many invertebrate animals.", "details": []}, {"x": -0.8664151987383024, "y": -0.196587922106259, "z": 0.4589966146685738, "word": "Gladius", "pos_group": "noun", "row_number": 66044, "definition": "The internal shell or pen of cephalopods like the squids.", "details": []}, {"x": -0.7804532165023097, "y": -0.09138609509813216, "z": 0.6184992792832616, "word": "Glass-crab", "pos_group": "noun", "row_number": 66141, "definition": "The larval state (Phyllosoma) of the genus Palinurus and allied genera. It is remarkable for its strange outlines thinness and transparency. See Phyllosoma.", "details": []}, {"x": -0.8931372082774701, "y": -0.04753159451305308, "z": 0.44726577637169335, "word": "Glasseye", "pos_group": "noun", "row_number": 66143, "definition": "A fish of the great lakes; the wall-eyed pike.", "details": []}, {"x": -0.8129041690360185, "y": -0.21754210870444637, "z": 0.540242762935593, "word": "Glass-snail", "pos_group": "noun", "row_number": 66157, "definition": "A small transparent land snail of the genus Vitrina.", "details": []}, {"x": -0.8184708858150596, "y": -0.010592090165768536, "z": 0.5744503605178014, "word": "Glass-snake", "pos_group": "noun", "row_number": 66158, "definition": "A long footless lizard (Ophiosaurus ventralis) of the Southern United States; -- so called from its fragility the tail easily breaking into small pieces. It grows to the length of three feet. The name is applied also to similar species found in the Old World.", "details": []}, {"x": -0.890551690004201, "y": -0.1457587340318681, "z": 0.4308968309051352, "word": "Glaucous", "pos_group": "adjective", "row_number": 66182, "definition": "Of a sea-green color; of a dull green passing into grayish blue.", "details": []}, {"x": -0.7786077132230276, "y": -0.1534777565918513, "z": 0.6084526334408784, "word": "Glaucus", "pos_group": "noun", "row_number": 66184, "definition": "A genus of nudibranchiate mollusks found in the warmer latitudes swimming in the open sea. These mollusks are beautifully colored with blue and silvery white.", "details": []}, {"x": -0.8716066719075993, "y": -0.006785181499821953, "z": 0.4901589240217638, "word": "Gleety", "pos_group": "adjective", "row_number": 66257, "definition": "Ichorous; thin; limpid.", "details": []}, {"x": -0.8464260705268467, "y": -0.21549647357617477, "z": 0.48695397832722814, "word": "Globefish", "pos_group": "noun", "row_number": 66360, "definition": "A plectognath fish of the genera Diodon Tetrodon and allied genera. The globefishes can suck in water or air and distend the body to a more or less globular form. Called also porcupine fish and sea hedgehog. See Diodon.", "details": []}, {"x": -0.7904694722792971, "y": -0.05438514746869043, "z": 0.6100821822748951, "word": "Globigerina", "pos_group": "noun", "row_number": 66366, "definition": "A genus of small Foraminifera which live abundantly at or near the surface of the sea. Their dead shells falling to the bottom make up a large part of the soft mud generally found in depths below 3 000 feet and called globigerina ooze. See Illust. of Foraminifera.", "details": []}, {"x": -0.8982185877198978, "y": -0.08317924295298267, "z": 0.43160697656113134, "word": "Glochidium", "pos_group": "noun", "row_number": 66387, "definition": "The larva or young of the mussel formerly thought to be a parasite upon the parent's gills.", "details": []}, {"x": -0.7952316942004147, "y": -0.2019628618464229, "z": 0.5716795911819317, "word": "Glomuliferous", "pos_group": "adjective", "row_number": 66404, "definition": "Having small clusters of minutely branched coral-like excrescences.", "details": []}, {"x": -0.8393111500296576, "y": 0.0021233611556089006, "z": 0.5436472061671028, "word": "Glut", "pos_group": "noun", "row_number": 66594, "definition": "The broad-nosed eel (Anguilla latirostris) found in Europe Asia the West Indies etc.", "details": []}, {"x": -0.8773434477260955, "y": -0.18009548601003142, "z": 0.44478544338916787, "word": "Glyptodon", "pos_group": "noun", "row_number": 66677, "definition": "An extinct South American quaternary mammal allied to the armadillos. It was as large as an ox was covered with tessellated scales and had fluted teeth.", "details": []}, {"x": -0.7770865828459762, "y": -0.11552314750925578, "z": 0.6187009335295354, "word": "Glyptodont", "pos_group": "noun", "row_number": 66678, "definition": "One of a family (Glyptodontidae) of extinct South American edentates of which Glyptodon is the type. About twenty species are known.", "details": []}, {"x": -0.8869236148656195, "y": -0.028396435242267665, "z": 0.46104245342401395, "word": "Gnathopod", "pos_group": "noun", "row_number": 66708, "definition": "A gnathopodite or maxilliped. See Maxilliped.", "details": []}, {"x": -0.825200085684246, "y": -0.22158221762772773, "z": 0.5195634123164287, "word": "Gnathopodite", "pos_group": "noun", "row_number": 66709, "definition": "Any leglike appendage of a crustacean when modified wholly or in part to serve as a jaw esp. one of the maxillipeds.", "details": []}, {"x": -0.8063071764538339, "y": -0.023753799369351493, "z": 0.5910198763278325, "word": "Gnathastegite", "pos_group": "noun", "row_number": 66710, "definition": "One of a pair of broad plates developed from the outer maxillipeds of crabs and forming a cover for the other mouth organs.", "details": []}, {"x": -0.8959485400764622, "y": -0.12226405554203788, "z": 0.4269984944437973, "word": "Gnathostoma", "pos_group": "other", "row_number": 66711, "definition": "A comprehensive division of vertebrates including all that have distinct jaws in contrast with the leptocardians and marsipobranchs (Cyclostoma) which lack them.", "details": []}, {"x": -0.7825790461427573, "y": -0.17493620431617443, "z": 0.5974674559821161, "word": "Goatfish", "pos_group": "noun", "row_number": 66801, "definition": "A fish of the genus Upeneus inhabiting the Gulf of Mexico. It is allied to the surmullet.", "details": []}, {"x": -0.8601033869744696, "y": 0.0013887637949695903, "z": 0.5101178638806599, "word": "Gobioid", "pos_group": "noun", "row_number": 66830, "definition": "A gobioid fish.", "details": []}, {"x": -0.8591813171250678, "y": -0.2060454620536125, "z": 0.4683510775799996, "word": "Goby", "pos_group": "noun", "row_number": 66836, "definition": "One of several species of small marine fishes of the genus Gobius and allied genera.", "details": []}, {"x": -0.7829229812704471, "y": -0.07647988341010542, "z": 0.6173997350438138, "word": "Goggle-eye", "pos_group": "noun", "row_number": 66901, "definition": "One of two or more species of American fresh-water fishes of the family Centrarchidae esp. Chaenobryttus antistius of Lake Michigan and adjacent waters and Ambloplites rupestris of the Great Lakes and Mississippi Valley; -- so called from their prominent eyes.", "details": []}, {"x": -0.8963433602173801, "y": -0.06000902138269919, "z": 0.4392806596549711, "word": "Goggler", "pos_group": "noun", "row_number": 66904, "definition": "A carangoid oceanic fish (Trachurops crumenophthalmus) having very large and prominent eyes; -- called also goggle-eye big-eyed scad and cicharra.", "details": []}, {"x": -0.8053106331204336, "y": -0.21400080157754178, "z": 0.5528819413829105, "word": "Goldfinny", "pos_group": "noun", "row_number": 66936, "definition": "One of two or more species of European labroid fishes (Crenilabrus melops and Ctenolabrus rupestris); -- called also goldsinny and goldney.", "details": []}, {"x": -0.8260758489306307, "y": -0.0032770800619123398, "z": 0.5635494233514979, "word": "Goldfish", "pos_group": "noun", "row_number": 66937, "definition": "A small domesticated cyprinoid fish (Carassius auratus); -- so named from its color. It is native of China and is said to have been introduced into Europe in 1691. It is often kept as an ornament in small ponds or glass globes. Many varieties are known. Called also golden fish and golden carp. See Telescope fish under Telescope.", "details": []}, {"x": -0.8865405651774214, "y": -0.1600463763517657, "z": 0.4340863781686395, "word": "Goldfish", "pos_group": "noun", "row_number": 66938, "definition": "A California marine fish of an orange or red color; the garibaldi.", "details": []}, {"x": -0.7765235401266617, "y": -0.1396667846674215, "z": 0.6144138514794576, "word": "Golet", "pos_group": "noun", "row_number": 66954, "definition": "A California trout. See Malma.", "details": []}, {"x": -0.8783065499014937, "y": -0.012811708585123706, "z": 0.4779262124253751, "word": "Goniatite", "pos_group": "noun", "row_number": 67004, "definition": "One of an extinct genus of fossil cephalopods allied to the Ammonites. The earliest forms are found in the Devonian formation the latest in the Triassic.", "details": []}, {"x": -0.8382357646001322, "y": -0.22037752263051882, "z": 0.4987930938419926, "word": "Gonophore", "pos_group": "noun", "row_number": 67025, "definition": "A sexual zooid produced as a medusoid bud upon a hydroid sometimes becoming a free hydromedusa sometimes remaining attached. See Hydroidea and Illusts. of Athecata Campanularian and Gonosome.", "details": []}, {"x": -0.7954579099659734, "y": -0.041099681821592925, "z": 0.6046135374160332, "word": "Gonosome", "pos_group": "noun", "row_number": 67031, "definition": "The reproductive zooids of a hydroid colony collectively.", "details": []}, {"x": -0.8986656741531506, "y": -0.09784606377375893, "z": 0.4275817511340316, "word": "Gonozooid", "pos_group": "noun", "row_number": 67034, "definition": "A sexual zooid or medusoid bud of a hydroid; a gonophore. See Hydroidea and Illust. of Campanularian.", "details": []}, {"x": -0.7891883028176144, "y": -0.19356865706428686, "z": 0.5828490350838558, "word": "Goody", "pos_group": "noun", "row_number": 67084, "definition": "An American fish; the lafayette or spot.", "details": []}, {"x": -0.8473905551363081, "y": 0.00446909557888949, "z": 0.5309512917871902, "word": "Gopher", "pos_group": "noun", "row_number": 67115, "definition": "A large land tortoise (Testudo Carilina) of the Southern United States which makes extensive burrows.", "details": []}, {"x": -0.8710806768305036, "y": -0.19190821356192034, "z": 0.4520947821198382, "word": "Gopher", "pos_group": "noun", "row_number": 67116, "definition": "A large burrowing snake (Spilotes Couperi) of the Southern United States.", "details": []}, {"x": -0.7778500195934361, "y": -0.1003900266900971, "z": 0.6203798752052266, "word": "Gorce", "pos_group": "noun", "row_number": 67123, "definition": "A pool of water to keep fish in; a wear.", "details": []}, {"x": -0.8916755327335729, "y": -0.038851175568573204, "z": 0.4510048009514299, "word": "Gordian", "pos_group": "adjective", "row_number": 67129, "definition": "Pertaining to the Gordiacea.", "details": []}, {"x": -0.8170338343993993, "y": -0.2212525875034266, "z": 0.5324500032581967, "word": "Gorgonia", "pos_group": "noun", "row_number": 67178, "definition": "A genus of Gorgoniacea formerly very extensive but now restricted to such species as the West Indian sea fan (Gorgonia flabellum) sea plume (G. setosa) and other allied species having a flexible horny axis.", "details": []}, {"x": -0.8132100068876075, "y": -0.013724560994396623, "z": 0.5818084917937937, "word": "Gorgonia", "pos_group": "noun", "row_number": 67179, "definition": "Any slender branched gorgonian.", "details": []}, {"x": -0.8935468065162744, "y": -0.1373417922941603, "z": 0.4274474665429605, "word": "Gorgonian", "pos_group": "adjective", "row_number": 67182, "definition": "Pertaining to the Gorgoniacea; as gorgonian coral.", "details": []}, {"x": -0.7788230940617903, "y": -0.16267633444216306, "z": 0.605781312330185, "word": "Gorgonian", "pos_group": "noun", "row_number": 67183, "definition": "One of the Gorgoniacea.", "details": []}, {"x": -0.8676591435521984, "y": -0.0015582163186566118, "z": 0.497157100494572, "word": "Goroon shell", "pos_group": "other", "row_number": 67200, "definition": "A large handsome marine univalve shell (Triton femorale).", "details": []}, {"x": -0.851401656549395, "y": -0.21391784738131742, "z": 0.47890956745161095, "word": "Gossat", "pos_group": "noun", "row_number": 67230, "definition": "A small British marine fish (Motella tricirrata); -- called also whistler and three-bearded rockling.", "details": []}, {"x": -0.7864488826797689, "y": -0.061863206475595005, "z": 0.6145495086779431, "word": "Gougeshell", "pos_group": "noun", "row_number": 67286, "definition": "A sharp-edged tubular marine shell of the genus Vermetus; also the pinna. See Vermetus.", "details": []}, {"x": -0.898537501972162, "y": -0.07364582452464526, "z": 0.4326738379885158, "word": "Gourami", "pos_group": "noun", "row_number": 67293, "definition": "A very largo East Indian freshwater fish (Osphromenus gorami) extensively reared in artificial ponds in tropical countries and highly valued as a food fish. Many unsuccessful efforts have been made to introduce it into Southern Europe.", "details": []}, {"x": -0.7981534865652721, "y": -0.20845893505440805, "z": 0.5652396697682163, "word": "Gournet", "pos_group": "noun", "row_number": 67305, "definition": "A fish. See Gurnet.", "details": []}, {"x": -0.834049959223829, "y": 0.0022463028470970405, "z": 0.5516843478314826, "word": "Graining", "pos_group": "noun", "row_number": 67552, "definition": "A small European fresh-water fish (Leuciscus vulgaris); - called also dobule and dace.", "details": []}, {"x": -0.8815480974914489, "y": -0.17369268014035166, "z": 0.43898041491035605, "word": "Grampus", "pos_group": "noun", "row_number": 67608, "definition": "A toothed delphinoid cetacean of the genus Grampus esp. G. griseus of Europe and America which is valued for its oil. It grows to be fifteen to twenty feet long; its color is gray with white streaks. Called also cowfish. The California grampus is G. Stearnsii.", "details": []}, {"x": -0.7755181148329928, "y": -0.1250089442698796, "z": 0.6188250297284454, "word": "Grapsoid", "pos_group": "adjective", "row_number": 67759, "definition": "Pertaining to the genus Grapsus or the family Grapsidae.", "details": []}, {"x": -0.8843970135453039, "y": -0.020729815705947483, "z": 0.4662748086407252, "word": "Grapsoid", "pos_group": "noun", "row_number": 67760, "definition": "A grapsoid crab.", "details": []}, {"x": -0.8298651449282669, "y": -0.22331500904592286, "z": 0.5113259703633347, "word": "Graptolite", "pos_group": "noun", "row_number": 67761, "definition": "One of numerous species of slender and delicate fossils of the genus Graptolites and allied genera found in the Silurian rocks. They belong to an extinct group (Graptolithina) supposed to be hydroids.", "details": []}, {"x": -0.8013225405060249, "y": -0.028788868783071818, "z": 0.597539443979359, "word": "Gravelling", "pos_group": "noun", "row_number": 67886, "definition": "A salmon one or two years old before it has gone to sea.", "details": []}, {"x": -0.8980004847579465, "y": -0.1130200254763588, "z": 0.42523123499552146, "word": "Grayback", "pos_group": "noun", "row_number": 67937, "definition": "The California gray whale.", "details": []}, {"x": -0.7839093575203013, "y": -0.18345060502336166, "z": 0.5931542756388686, "word": "Grayling", "pos_group": "adjective", "row_number": 67946, "definition": "A European fish (Thymallus vulgaris) allied to the trout but having a very broad dorsal fin; -- called also umber. It inhabits cold mountain streams and is valued as a game fish.", "details": []}, {"x": -0.8554553808166965, "y": 0.0047787032657206725, "z": 0.5178544732131405, "word": "Grayling", "pos_group": "adjective", "row_number": 67947, "definition": "An American fish of the genus Thymallus having similar habits to the above; one species (T. Ontariensis) inhabits several streams in Michigan; another (T. montanus) is found in the Yellowstone region.", "details": []}, {"x": -0.864074441970329, "y": -0.20244185982325158, "z": 0.4608607730377665, "word": "Greenbone", "pos_group": "noun", "row_number": 68078, "definition": "Any garfish (Belone or Tylosurus).", "details": []}, {"x": -0.7797252578100592, "y": -0.08510637438425207, "z": 0.6203107506501917, "word": "Greenbone", "pos_group": "noun", "row_number": 68079, "definition": "The European eelpout.", "details": []}, {"x": -0.8955311717492616, "y": -0.050808290622640646, "z": 0.4420887218979915, "word": "Greenfish", "pos_group": "noun", "row_number": 68087, "definition": "See Bluefish and Pollock.", "details": []}, {"x": -0.8090774834427008, "y": -0.21885675017556294, "z": 0.5454313418649661, "word": "Greengill", "pos_group": "noun", "row_number": 68089, "definition": "An oyster which has the gills tinged with a green pigment said to be due to an abnormal condition of the blood.", "details": []}, {"x": -0.8207003499604976, "y": -0.005240500260870391, "z": 0.5713348166633404, "word": "Greenhead", "pos_group": "noun", "row_number": 68092, "definition": "The striped bass. See Bass.", "details": []}, {"x": -0.8900682127169497, "y": -0.1522075578218021, "z": 0.4296643295094178, "word": "\\d8Gregarin\\91", "pos_group": "other", "row_number": 68137, "definition": "An order of Protozoa allied to the Rhizopoda and parasitic in other animals as in the earthworm lobster etc. When adult they have a small wormlike body inclosing a nucleus but without external organs; in one of the young stages they are amoebiform; -- called also Gregarinida and Gregarinaria.", "details": []}, {"x": -0.7760682650005366, "y": -0.14918270610856174, "z": 0.6127500046978241, "word": "Grenadier", "pos_group": "noun", "row_number": 68157, "definition": "Any marine fish of the genus Macrurus in which the body and tail taper to a point; they mostly inhabit the deep sea; -- called also onion fish and rat-tail fish.", "details": []}, {"x": -0.8748156341847937, "y": -0.006537899140157859, "z": 0.48441187233664096, "word": "Gribble", "pos_group": "noun", "row_number": 68177, "definition": "A small marine isopod crustacean (Limnoria lignorum or L. terebrans) which burrows into and rapidly destroys submerged timber such as the piles of wharves both in Europe and America.", "details": []}, {"x": -0.8432092870957889, "y": -0.22002568138446535, "z": 0.490496480809713, "word": "Grig", "pos_group": "noun", "row_number": 68225, "definition": "Any small eel.", "details": []}, {"x": -0.7909835519339543, "y": -0.0478157818240136, "z": 0.6099661233039945, "word": "Grig", "pos_group": "noun", "row_number": 68226, "definition": "The broad-nosed eel. See Glut.", "details": []}, {"x": -0.8996563532388313, "y": -0.08820879331084269, "z": 0.4275951997621725, "word": "Grilse", "pos_group": "noun", "row_number": 68239, "definition": "A young salmon after its first return from the sea.", "details": []}, {"x": -0.7915735130649957, "y": -0.20098069181697784, "z": 0.5770772348054549, "word": "Grimme", "pos_group": "noun", "row_number": 68251, "definition": "A West African antelope (Cephalophus rufilotus) of a deep bay color with a broad dorsal stripe of black; -- called also conquetoon.", "details": []}, {"x": -0.8422488071855337, "y": 0.0058393675397211565, "z": 0.539057370398812, "word": "Groundling", "pos_group": "noun", "row_number": 68509, "definition": "A fish that keeps at the bottom of the water as the loach.", "details": []}, {"x": -0.8756464803965262, "y": -0.18642875803107292, "z": 0.44551942667875655, "word": "Grouper", "pos_group": "noun", "row_number": 68527, "definition": "One of several species of valuable food fishes of the genus Epinephelus of the family Serranidae as the red grouper or brown snapper (E. morio) and the black grouper or warsaw (E. nigritus) both from Florida and the Gulf of Mexico.", "details": []}, {"x": -0.775629434601736, "y": -0.10976220297450084, "z": 0.6215715879748495, "word": "Grouper", "pos_group": "noun", "row_number": 68529, "definition": "In California the name is often applied to the rockfishes.", "details": []}, {"x": -0.8897497422356836, "y": -0.030427950088523028, "z": 0.4554333497285248, "word": "Growler", "pos_group": "noun", "row_number": 68574, "definition": "The large-mouthed black bass.", "details": []}, {"x": -0.8214655333640325, "y": -0.2242153644290152, "z": 0.5243299036378809, "word": "Grundel", "pos_group": "noun", "row_number": 68641, "definition": "A groundling (fish).", "details": []}, {"x": -0.8079684974499134, "y": -0.017702420455850867, "z": 0.5889597027289163, "word": "Grunt", "pos_group": "noun", "row_number": 68647, "definition": "Any one of several species of American food fishes of the genus Haemulon allied to the snappers as the black grunt (A. Plumieri) and the redmouth grunt (H. aurolineatus) of the Southern United States; -- also applied to allied species of the genera Pomadasys Orthopristis and Pristopoma. Called also pigfish squirrel fish and grunter; -- so called from the noise it makes when taken.", "details": []}, {"x": -0.896211560446062, "y": -0.12842629708798092, "z": 0.42463104589644013, "word": "Grunter", "pos_group": "noun", "row_number": 68649, "definition": "One of several American marine fishes. See Sea robin and Grunt n. 2.", "details": []}, {"x": -0.7795067100181163, "y": -0.171764332443523, "z": 0.6023838503288108, "word": "Gryphaea", "pos_group": "noun", "row_number": 68663, "definition": "A genus of cretaceous fossil shells allied to the oyster.", "details": []}, {"x": -0.8633520472824557, "y": 0.0030067744084070606, "z": 0.5045931051459676, "word": "Gryphite", "pos_group": "noun", "row_number": 68664, "definition": "A shell of the genus Gryphea.", "details": []}, {"x": -0.8564394230762353, "y": -0.21147366643192994, "z": 0.47094628462987365, "word": "Gudgeon", "pos_group": "noun", "row_number": 68758, "definition": "A small European freshwater fish (Gobio fluviatilis) allied to the carp. It is easily caught and often used for food and for bait. In America the killifishes or minnows are often called gudgeons.", "details": []}, {"x": -0.7826967794571793, "y": -0.06995544537002424, "z": 0.6184593657552945, "word": "Guffer", "pos_group": "noun", "row_number": 68808, "definition": "The eelpout; guffer eel.", "details": []}, {"x": -0.8983986581250449, "y": -0.0640727485614399, "z": 0.43448191443476825, "word": "Gunnel", "pos_group": "noun", "row_number": 68986, "definition": "A small eel-shaped marine fish of the genus Muraenoides; esp. M. gunnellus of Europe and America; -- called also gunnel fish butterfish rock eel.", "details": []}, {"x": -0.8014821315293905, "y": -0.21439901122394964, "z": 0.558264683483827, "word": "Gurnet", "pos_group": "noun", "row_number": 69030, "definition": "One ofseveral European marine fishes of the genus Trigla and allied genera having a large and spiny head with mailed cheeks. Some of the species are highly esteemed for food. The name is sometimes applied to the American sea robins.", "details": []}, {"x": -0.8286471929236378, "y": 0.0015095478945236947, "z": 0.5597691943336374, "word": "Gwiniad", "pos_group": "noun", "row_number": 69127, "definition": "A fish (Coregonus ferus) of North Wales and Northern Europe allied to the lake whitefish; -- called also powan and schelly.", "details": []}, {"x": -0.8855548600713713, "y": -0.16657839985956205, "z": 0.4336406651874357, "word": "Gymnocopa", "pos_group": "other", "row_number": 69158, "definition": "A group of transparent free-swimming Annelida having setae only in the cephalic appendages.", "details": []}, {"x": -0.7743835520992102, "y": -0.13468385485581266, "z": 0.6182154749594905, "word": "Gymnodont", "pos_group": "noun", "row_number": 69161, "definition": "One of a group of plectognath fishes (Gymnodontes) having the teeth and jaws consolidated into one or two bony plates on each jaw as the diodonts and tetradonts. See Bur fish Globefish Diodon.", "details": []}, {"x": -0.8814289181059017, "y": -0.013496238654455203, "z": 0.47212383319298934, "word": "Gymnoglossa", "pos_group": "other", "row_number": 69163, "definition": "A division of gastropods in which the odontophore is without teeth.", "details": []}, {"x": -0.8347475577476399, "y": -0.22421999543397664, "z": 0.5029134204631432, "word": "Gymnonoti", "pos_group": "other", "row_number": 69166, "definition": "The order of fishes which includes the Gymnotus or electrical eel. The dorsal fin is wanting.", "details": []}, {"x": -0.7964595206799302, "y": -0.034611514997856765, "z": 0.6037004844687878, "word": "Gymnophiona", "pos_group": "other", "row_number": 69168, "definition": "An order of Amphibia having a long annulated snakelike body. See Ophiomorpha.", "details": []}, {"x": -0.8996560058755491, "y": -0.10344284379862048, "z": 0.42416818499141157, "word": "Gymnophthalmata", "pos_group": "other", "row_number": 69169, "definition": "A group of acalephs including the naked-eyed medusae; the hydromedusae. Most of them are known to be the free-swimming progeny (gonophores) of hydroids.", "details": []}, {"x": -0.7857030249842987, "y": -0.19166834609087524, "z": 0.5881615438272983, "word": "Gymnosomata", "pos_group": "other", "row_number": 69172, "definition": "One of the orders of Pteropoda. They have no shell.", "details": []}, {"x": -0.8505210976485489, "y": 0.0073977409848376375, "z": 0.5258889007033984, "word": "Gymnotus", "pos_group": "noun", "row_number": 69179, "definition": "A genus of South American fresh-water fishes including the Gymnotus electricus or electric eel. It has a greenish eel-like body and is possessed of electric power.", "details": []}, {"x": -0.868926544800644, "y": -0.19799824298776697, "z": 0.45361145875580716, "word": "Gyracanthus", "pos_group": "noun", "row_number": 69228, "definition": "A genus of fossil fishes found in Devonian and carboniferous strata; -- so named from their round sculptured spines.", "details": []}, {"x": -0.7768748863918207, "y": -0.09420039568931345, "z": 0.6225686278199958, "word": "Gyrencephala", "pos_group": "other", "row_number": 69242, "definition": "The higher orders of Mammalia in which the cerebrum is convoluted.", "details": []}, {"x": -0.8942481767381318, "y": -0.041758616673073554, "z": 0.4456191382044518, "word": "Gyrodus", "pos_group": "noun", "row_number": 69246, "definition": "A genus of extinct oolitic fishes having rounded teeth in several rows adapted for crushing.", "details": []}, {"x": -0.8131915217637937, "y": -0.2230221770941316, "z": 0.5375692117817752, "word": "Gyrolepis", "pos_group": "noun", "row_number": 69251, "definition": "A genus of ganoid fishes found in strata of the new red sandetone and the lias bone beds.", "details": []}, {"x": -0.8152843197123419, "y": -0.008071189209051687, "z": 0.5790046061439716, "word": "Haaf", "pos_group": "noun", "row_number": 69273, "definition": "The deepsea fishing for cod ling and tusk off the Shetland Isles.", "details": []}, {"x": -0.8933086562469499, "y": -0.14378069379187608, "z": 0.4258247958573991, "word": "Haak", "pos_group": "noun", "row_number": 69274, "definition": "A sea fish. See Hake.", "details": []}, {"x": -0.7760775154776359, "y": -0.15869814103708194, "z": 0.6103430101192561, "word": "Haddock", "pos_group": "noun", "row_number": 69393, "definition": "A marine food fish (Melanogrammus aeglefinus) allied to the cod inhabiting the northern coasts of Europe and America. It has a dark lateral line and a black spot on each side of the body just back of the gills. Galled also haddie and dickie.", "details": []}, {"x": -0.8709274315208879, "y": -0.0008532472460466376, "z": 0.49141090850078417, "word": "Hadrosaurus", "pos_group": "noun", "row_number": 69401, "definition": "An American herbivorous dinosaur of great size allied to the iguanodon. It is found in the Cretaceous formation.", "details": []}, {"x": -0.8483043328228508, "y": -0.218805508058615, "z": 0.48218659101761574, "word": "Haematocrya", "pos_group": "other", "row_number": 69436, "definition": "The cold-blooded vertebrates. Same as Hematocrya.", "details": []}, {"x": -0.7867279032745946, "y": -0.05522302746500429, "z": 0.6148248721764268, "word": "Haematosac", "pos_group": "noun", "row_number": 69456, "definition": "A vascular sac connected beneath the brain in many fishes with the infundibulum.", "details": []}, {"x": -0.900203303146685, "y": -0.07842112978119763, "z": 0.4283504866434004, "word": "Haematothermal", "pos_group": "adjective", "row_number": 69461, "definition": "Warm-blooded; homoiothermal.", "details": []}, {"x": -0.7943946977157051, "y": -0.20792302918591718, "z": 0.5707057719835377, "word": "Hag", "pos_group": "noun", "row_number": 69502, "definition": "An eel-like marine marsipobranch (Myxine glutinosa) allied to the lamprey. It has a suctorial mouth with labial appendages and a single pair of gill openings. It is the type of the order Hyperotpeta. Called also hagfish borer slime eel sucker and sleepmarken.", "details": []}, {"x": -0.8369084933678587, "y": 0.00636640860014459, "z": 0.5473058035232928, "word": "Hagdon", "pos_group": "noun", "row_number": 69514, "definition": "One of several species of sea birds of the genus Puffinus; esp. P. major the greater shearwarter and P. Stricklandi the black hagdon or sooty shearwater; -- called also hagdown haglin and hag. See Shearwater.", "details": []}, {"x": -0.8800693074020854, "y": -0.18017575099652158, "z": 0.43933439760807813, "word": "Hairtail", "pos_group": "noun", "row_number": 69608, "definition": "Any species of marine fishes of the genus Trichiurus; esp. T. lepterus of Europe and America. They are long and like a band with a slender pointed tail. Called also bladefish.", "details": []}, {"x": -0.7738187997369435, "y": -0.11943152673295553, "z": 0.6220454771123342, "word": "Hake", "pos_group": "noun", "row_number": 69614, "definition": "One of several species of marine gadoid fishes of the genera Phycis Merlucius and allies. The common European hake is M. vulgaris; the American silver hake or whiting is M. bilinearis. Two American species (Phycis chuss and P. tenius) are important food fishes and are also valued for their oil and sounds. Called also squirrel hake and codling.", "details": []}, {"x": -0.8873628379941398, "y": -0.02234055259525064, "z": 0.4605302307739686, "word": "Halcyon", "pos_group": "noun", "row_number": 69626, "definition": "A kingfisher. By modern ornithologists restricted to a genus including a limited number of species having omnivorous habits as the sacred kingfisher (Halcyon sancta) of Australia.", "details": []}, {"x": -0.8261674946082157, "y": -0.22638560418882836, "z": 0.5159426606405432, "word": "Halfbeak", "pos_group": "noun", "row_number": 69645, "definition": "Any slender marine fish of the genus Hemirhamphus having the upper jaw much shorter than the lower; -- called also balahoo.", "details": []}, {"x": -0.8027902037411271, "y": -0.02251312548461963, "z": 0.5958364271829922, "word": "Half-deck", "pos_group": "noun", "row_number": 69664, "definition": "A shell of the genus Crepidula; a boat shell. See Boat shell.", "details": []}, {"x": -0.8985130771837253, "y": -0.11907559101081364, "z": 0.4224869864921976, "word": "Half-fish", "pos_group": "noun", "row_number": 69673, "definition": "A salmon in its fifth year of growth.", "details": []}, {"x": -0.7806631783728524, "y": -0.1806608944538182, "z": 0.5982697076970739, "word": "Half-moon", "pos_group": "noun", "row_number": 69685, "definition": "A marine sparoid food fish of California (Caesiosoma Californiense). The body is ovate blackish above blue or gray below. Called also medialuna.", "details": []}, {"x": -0.858711457534953, "y": 0.006853922863986456, "z": 0.5124135599684801, "word": "Halibut", "pos_group": "noun", "row_number": 69704, "definition": "A large northern marine flatfish (Hippoglossus vulgaris) of the family Pleuronectidae. It often grows very large weighing more than three hundred pounds. It is an important food fish.", "details": []}, {"x": -0.861496302791775, "y": -0.20816242780510838, "z": 0.4631333759581415, "word": "Halichondriae", "pos_group": "other", "row_number": 69705, "definition": "An order of sponges having simple siliceous spicules and keratose fibers; -- called also Keratosilicoidea.", "details": []}, {"x": -0.7792505862054208, "y": -0.07860819752856683, "z": 0.62176303780445, "word": "Halieutics", "pos_group": "noun", "row_number": 69709, "definition": "A treatise upon fish or the art of fishing; ichthyology.", "details": []}, {"x": -0.8977899511213544, "y": -0.054540653131446015, "z": 0.43703377537841526, "word": "Haliotis", "pos_group": "noun", "row_number": 69713, "definition": "A genus of marine shells; the ear-shells. See Abalone.", "details": []}, {"x": -0.8051980447062772, "y": -0.21971786535177606, "z": 0.5507995719374217, "word": "Haliotoid", "pos_group": "adjective", "row_number": 69714, "definition": "Like or pertaining to the genus Haliotis; ear-shaped.", "details": []}, {"x": -0.8231438374177907, "y": -0.00010242238188106331, "z": 0.5678329089008223, "word": "Halysites", "pos_group": "noun", "row_number": 69820, "definition": "A genus of Silurian fossil corals; the chain corals. See Chain coral under Chain.", "details": []}, {"x": -0.8893228877416708, "y": -0.1587950043481304, "z": 0.428822746519926, "word": "Haminura", "pos_group": "noun", "row_number": 69842, "definition": "A large edible river fish (Erythrinus macrodon) of Guiana.", "details": []}, {"x": -0.7737021295047415, "y": -0.1444698949785049, "z": 0.6168577342019211, "word": "Hamite", "pos_group": "noun", "row_number": 69843, "definition": "A fossil cephalopod of the genus Hamites related to the ammonites but having the last whorl bent into a hooklike form.", "details": []}, {"x": -0.878031823779185, "y": -0.006768326384728628, "z": 0.4785543920903329, "word": "Hammerhead", "pos_group": "noun", "row_number": 69868, "definition": "A shark of the genus Sphyrna or Zygaena having the eyes set on projections from the sides of the head which gives it a hammer shape. The Sphyrna zygaena is found in the North Atlantic. Called also hammer fish and balance fish.", "details": []}, {"x": -0.839809658588865, "y": -0.22426809570201356, "z": 0.4943921101626182, "word": "Hammerhead", "pos_group": "noun", "row_number": 69869, "definition": "A fresh-water fish; the stone-roller.", "details": []}, {"x": -0.7917611582966569, "y": -0 f the shells and their ornamental ribs.", "details": []}, {"x": -0.896225481001638, "y": -0.1348223183805646, "z": 0.42261428001177676, "word": "Hatteria", "pos_group": "noun", "row_number": 70585, "definition": "A New Zealand lizard which in anatomical character differs widely from all other existing lizards. It is the only living representative of the order Rhynchocephala of which many Mesozoic fossil species are known; -- called also Sphenodon and Tuatera.", "details": []}, {"x": -0.7765614678554593, "y": -0.1681319564996874, "z": 0.6071934879803652, "word": "Haurient", "pos_group": "adjective", "row_number": 70634, "definition": "In pale with the head in chief; -- said of the figure of a fish as if rising for air.", "details": []}, {"x": -0.8666633605863414, "y": 0.0041791603722648, "z": 0.4988758904134093, "word": "Hausen", "pos_group": "noun", "row_number": 70635, "definition": "A large sturgeon (Acipenser huso) from the region of the Black Sea. It is sometimes twelve feet long.", "details": []}, {"x": -0.8534791387945079, "y": -0.21670513193359037, "z": 0.4739327435789076, "word": "Hawkbill", "pos_group": "noun", "row_number": 70721, "definition": "A sea turtle (Eretmochelys imbricata) which yields the best quality of tortoise shell; -- called also caret.", "details": []}, {"x": -0.7827311215796521, "y": -0.06327581874338745, "z": 0.6191350111833558, "word": "Headfish", "pos_group": "noun", "row_number": 70861, "definition": "The sunfish (Mola).", "details": []}, {"x": -0.9002890826129099, "y": -0.06856218778261416, "z": 0.4298590398426756, "word": "Heck", "pos_group": "noun", "row_number": 71233, "definition": "A latticework contrivance for catching fish.", "details": []}, {"x": -0.7976374060356826, "y": -0.21432462130490373, "z": 0.5637725828693493, "word": "Hectocotylus", "pos_group": "noun", "row_number": 71245, "definition": "One of the arms of the male of most kinds of cephalopods which is specially modified in various ways to effect the fertilization o
