 and Lamprey. Called also Marsipobranchiata and Marsipobranchii.", "details": []}, {"x": -0.7619221824162242, "y": -0.11980292254112457, "z": 0.6364918284571319, "word": "Marsupialia", "pos_group": "other", "row_number": 93631, "definition": "A subclass of Mammalia including nearly all the mammals of Australia and the adjacent islands together with the opossums of America. They differ from ordinary mammals in having the corpus callosum very small in being implacental and in having their young born while very immature. The female generally carries the young for some time after birth in an external pouch or marsupium. Called also Marsupiata.", "details": []}, {"x": -0.8935861846507642, "y": -0.009160659002554654, "z": 0.44879818730463844, "word": "Marsupiate", "pos_group": "adjective", "row_number": 93634, "definition": "Related to or resembling the marsupials; furnished with a pouch for the young as the marsupials and also some fishes and Crustacea.", "details": []}, {"x": -0.821913499324661, "y": -0.24453706053510166, "z": 0.5144509944132117, "word": "Marsupite", "pos_group": "noun", "row_number": 93636, "definition": "A fossil crinoid of the genus Marsupites resembling a purse in form.", "details": []}, {"x": -0.7958768404610032, "y": -0.00801648800778095, "z": 0.6054054763031402, "word": "Marsupium", "pos_group": "noun", "row_number": 93638, "definition": "The pouch formed by a fold of the skin of the abdomen in which marsupials carry their young; also a pouch for similar use in other animals as certain Crustacea.", "details": []}, {"x": -0.905988981227183, "y": -0.1214027706223121, "z": 0.40551859782278493, "word": "Martineta", "pos_group": "noun", "row_number": 93672, "definition": "A species of tinamou (Calopezus elegans) having a long slender crest.", "details": []}, {"x": -0.7695839224029218, "y": -0.19080790768056358, "z": 0.6093709287006552, "word": "Marysole", "pos_group": "noun", "row_number": 93719, "definition": "A large British fluke or flounder (Rhombus megastoma); -- called also carter and whiff.", "details": []}, {"x": -0.8606086696697647, "y": 0.025044804010922492, "z": 0.5086506418764185, "word": "Mask shell", "pos_group": "other", "row_number": 93769, "definition": "Any spiral marine shell of the genus Persona having a curiously twisted aperture.", "details": []}, {"x": -0.8628038315678115, "y": -0.2239335370078392, "z": 0.4532364937149947, "word": "Massasauga", "pos_group": "noun", "row_number": 93820, "definition": "The black rattlesnake (Crotalus / Caudisona tergemina) found in the Mississippi Valley.", "details": []}, {"x": -0.7684617193398521, "y": -0.0726276086734999, "z": 0.6357608169489587, "word": "Mastigopod", "pos_group": "noun", "row_number": 93914, "definition": "One of the Mastigopoda.", "details": []}, {"x": -0.9054227940837972, "y": -0.04669202302269093, "z": 0.4219353255411759, "word": "Mastigure", "pos_group": "noun", "row_number": 93916, "definition": "Any one of several large spiny-tailed lizards of the genus Uromastix. They inhabit Southern Asia and North Africa.", "details": []}, {"x": -0.7977604226862144, "y": -0.23635699841072078, "z": 0.5547194581928664, "word": "Mastodonsaurus", "pos_group": "noun", "row_number": 93923, "definition": "A large extinct genus of labyrinthodonts found in the European Triassic rocks.", "details": []}, {"x": -0.8195164328694724, "y": 0.017491533285559507, "z": 0.5727886717806276, "word": "Mataco", "pos_group": "noun", "row_number": 93947, "definition": "The three-banded armadillo (Tolypeutis tricinctus). See Illust. under Loricata.", "details": []}, {"x": -0.8951367808917824, "y": -0.16719940934772456, "z": 0.41324871567673277, "word": "Matamata", "pos_group": "noun", "row_number": 93952, "definition": "The bearded tortoise (Chelys fimbriata) of South American rivers.", "details": []}, {"x": -0.761790771895758, "y": -0.14875290543304398, "z": 0.6305135946033943, "word": "Matelote", "pos_group": "noun", "row_number": 94002, "definition": "A dish of food composed of many kinds of fish.", "details": []}, {"x": -0.8828174186356195, "y": 0.008850071918100349, "z": 0.469632922164307, "word": "Matie", "pos_group": "noun", "row_number": 94055, "definition": "A fat herring with undeveloped roe.", "details": []}, {"x": -0.8376916738474567, "y": -0.24210624741231462, "z": 0.4895479798044042, "word": "Mattowacca", "pos_group": "noun", "row_number": 94142, "definition": "An American clupeoid fish (Clupea mediocris) similar to the shad in habits and appearance but smaller and less esteemed for food; -- called also hickory shad tailor shad fall herring and shad herring.", "details": []}, {"x": -0.783137159801186, "y": -0.02959395069049951, "z": 0.6211444172018774, "word": "Maxilliped", "pos_group": "noun", "row_number": 94256, "definition": "One of the mouth appendages of Crustacea situated next behind the maxillae. Crabs have three pairs but many of the lower Crustacea have but one pair of them. Called also jawfoot and foot jaw.", "details": []}, {"x": -0.9087545257996196, "y": -0.09197276125011354, "z": 0.4070702924885798, "word": "Mayfish", "pos_group": "noun", "row_number": 94286, "definition": "A common American minnow (Fundulus majalis). See Minnow.", "details": []}, {"x": -0.778012808151138, "y": -0.21260033893221944, "z": 0.5911828534714838, "word": "Meagre", "pos_group": "noun", "row_number": 94350, "definition": "A large European sciaenoid fish (Sciaena umbra or S. aquila) having white bloodless flesh. It is valued as a food fish.", "details": []}, {"x": -0.8451674510042045, "y": 0.027774837103676214, "z": 0.5337794846066303, "word": "Meandrina", "pos_group": "noun", "row_number": 94394, "definition": "A genus of corals with meandering grooves and ridges including the brain corals.", "details": []}, {"x": -0.8769088838457829, "y": -0.20612285825497567, "z": 0.4342167393562141, "word": "Mease", "pos_group": "noun", "row_number": 94410, "definition": "Five hundred; as a mease of herrings.", "details": []}, {"x": -0.762865 Monocardian", "pos_group": "adjective", "row_number": 98297, "definition": "Having a single heart as fishes and amphibians.", "details": []}, {"x": -0.7650621160176894, "y": -0.07579621808540714, "z": 0.6394801732332951, "word": "Monoceros", "pos_group": "noun", "row_number": 98304, "definition": "A one-horned creature; a unicorn; a sea monster with one horn.", "details": []}, {"x": -0.9062582707290698, "y": -0.04092111117285301, "z": 0.4207391227299107, "word": "Monocule", "pos_group": "noun", "row_number": 98330, "definition": "A small crustacean with one median eye.", "details": []}, {"x": -0.7982908772389405, "y": -0.2414831980174402, "z": 0.5517404647045134, "word": "Monoecian", "pos_group": "noun", "row_number": 98355, "definition": "A monoecious animal as certain mollusks.", "details": []}, {"x": -0.8162613727930327, "y": 0.019491247557253358, "z": 0.5773538451891489, "word": "Monomyaria", "pos_group": "other", "row_number": 98438, "definition": "An order of lamellibranchs having but one muscle for closing the shell as the oyster.", "details": []}, {"x": -0.8977678336409096, "y": -0.1648080133097908, "z": 0.40847427780533263, "word": "Monopneumona", "pos_group": "other", "row_number": 98461, "definition": "A suborder of Dipnoi including the Ceratodus.", "details": []}, {"x": -0.7595295225226812, "y": -0.15406517360634228, "z": 0.631964260617731, "word": "Monopode", "pos_group": "noun", "row_number": 98463, "definition": "A monopodium.", "details": []}, {"x": -0.881882660352852, "y": 0.01450375276704265, "z": 0.47124581114811914, "word": "Monopodia", "pos_group": "other", "row_number": 98465, "definition": "of Monopodium", "details": []}, {"x": -0.8396937766346728, "y": -0.24491589663794175, "z": 0.48469636377327346, "word": "#NAME?", "pos_group": "other", "row_number": 98466, "definition": "of Monopodium", "details": []}, {"x": -0.7794828777285059, "y": -0.03089235177347345, "z": 0.6256613348529627, "word": "Monorhina", "pos_group": "other", "row_number": 98490, "definition": "The Marsipobranchiata.", "details": []}, {"x": -0.9105026126903302, "y": -0.08703554967132557, "z": 0.4042397869798234, "word": "Monothalama", "pos_group": "other", "row_number": 98510, "definition": "A division of Foraminifera including those that have only one chamber.", "details": []}, {"x": -0.7774527241722242, "y": -0.21836773366066664, "z": 0.5898158988812454, "word": "Monotreme", "pos_group": "noun", "row_number": 98535, "definition": "One of the Monotremata.", "details": []}, {"x": -0.8426077865417836, "y": 0.031553589208815125, "z": 0.5376025381889461, "word": "Moon-eye", "pos_group": "noun", "row_number": 98657, "definition": "Any species of American fresh-water fishes of the genus Hyodon esp. H. tergisus of the Great Lakes and adjacent waters.", "details": []}, {"x": -0.8796055443036225, "y": -0.2057131396531841, "z": 0.4289244579227877, "word": "Moonfish", "pos_group": "noun", "row_number": 98661, "definition": "An American marine fish (Vomer setipennis); -- called also bluntnosed shiner horsefish and sunfish.", "details": []}, {"x": -0.7598126491758722, "y": -0.10577250704544428, "z": 0.6414802529350879, "word": "Moonfish", "pos_group": "noun", "row_number": 98662, "definition": "A broad thin silvery marine fish (Selene vomer); -- called also lookdown and silver moonfish.", "details": []}, {"x": -0.8994914795485361, "y": -0.015787975185015728, "z": 0.4366529721176102, "word": "Moonfish", "pos_group": "noun", "row_number": 98663, "definition": "The mola. See Sunfish 1.", "details": []}, {"x": -0.813286794768062, "y": -0.24853302411470818, "z": 0.5261139851593851, "word": "Moorball", "pos_group": "noun", "row_number": 98708, "definition": "A fresh-water alga (Cladophora Aegagropila) which forms a globular mass.", "details": []}, {"x": -0.8006716437202925, "y": 0.00477335873315763, "z": 0.5990844130743591, "word": "Morgay", "pos_group": "noun", "row_number": 98877, "definition": "The European small-spotted dogfish or houndfish. See the Note under Houndfish.", "details": []}, {"x": -0.905521196305105, "y": -0.13601114366607667, "z": 0.40191085061343806, "word": "Mormon", "pos_group": "noun", "row_number": 98908, "definition": "A genus of sea birds having a large thick bill; the puffin.", "details": []}, {"x": -0.7634522966296979, "y": -0.18178756639044638, "z": 0.6197530729868783, "word": "Morosaurus", "pos_group": "noun", "row_number": 98932, "definition": "An extinct genus of large herbivorous dinosaurs found in Jurassic strata in America.", "details": []}, {"x": -0.8680986481636364, "y": 0.026615620112447037, "z": 0.49567766322732054, "word": "Morris", "pos_group": "noun", "row_number": 98971, "definition": "A marine fish having a very slender flat transparent body. It is now generally believed to be the young of the conger eel or some allied fish.", "details": []}, {"x": -0.8558634198589452, "y": -0.23501234400615323, "z": 0.46072443468095337, "word": "Morris-pike", "pos_group": "noun", "row_number": 98972, "definition": "A Moorish pike.", "details": []}, {"x": -0.7691832977153068, "y": -0.057590120628419325, "z": 0.6364278690643659, "word": "Mort", "pos_group": "noun", "row_number": 98987, "definition": "A salmon in its third year.", "details": []}, {"x": -0.9092776394403435, "y": -0.05753014524108503, "z": 0.4121946831320564, "word": "Mosasaurian", "pos_group": "noun", "row_number": 99081, "definition": "One of an extinct order of reptiles including Mosasaurus and allied genera. See Mosasauria.", "details": []}, {"x": -0.789326719627735, "y": -0.2351480320650975, "z": 0.5671584722964391, "word": "Mosasauria", "pos_group": "other", "row_number": 99082, "definition": "An order of large extinct marine reptiles found in the Cretaceous rocks especially in America. They were serpentlike in form and in having loosely articulated and dilatable jaws with large recurved tteth but they had paddlelike feet. Some of them were over fifty feet long. They are essentially fossil sea serpents with paddles. Called also Pythonomarpha and Mosasauria.", "details": []}, {"x": -0.8260782468125619, "y": 0.02681496328604236, "z": 0.562917123462284, "word": "Mosasaurus", "pos_group": "noun", "row_number": 99083, "definition": "A genus of extinct marine reptiles allied to the lizards but having the body much elongated and the limbs in the form of paddles. The first known species nearly fifty feet in length was discovered in Cretaceous beds near Maestricht in the Netherlands.", "details": []}, {"x": -0.8918691990471752, "y": -0.18190102230306884, "z": 0.41410306673103536, "word": "Mother-of-pearl", "pos_group": "noun", "row_number": 99172, "definition": "The hard pearly internal layer of several kinds of shells esp. of pearl oysters river mussels and the abalone shells; nacre. See Pearl.", "details": []}, {"x": -0.7580223379941404, "y": -0.13612692842128174, "z": 0.6378648716307274, "word": "Motile", "pos_group": "adjective", "row_number": 99180, "definition": "Having powers of self-motion though unconscious; as the motile spores of certain seaweeds.", "details": []}, {"x": -0.8896222708941737, "y": 0.005194459814483826, "z": 0.45666752973725794, "word": "Mousefish", "pos_group": "noun", "row_number": 99343, "definition": "See Frogfish.", "details": []}, {"x": -0.8293980430792779, "y": -0.24908154029327528, "z": 0.5000572691416392, "word": "Mudfish", "pos_group": "noun", "row_number": 99571, "definition": "The mud minnow.", "details": []}, {"x": -0.786541014958388, "y": -0.015381749879987593, "z": 0.6173464453277904, "word": "Mugil", "pos_group": "noun", "row_number": 99625, "definition": "A genus of fishes including the gray mullets. See Mullet.", "details": []}, {"x": -0.9100061920888557, "y": -0.10569883267724133, "z": 0.4008946085077836, "word": "Mullet", "pos_group": "noun", "row_number": 99696, "definition": "Any one of numerous fishes of the genus Mugil; -- called also gray mullets. They are found on the coasts of both continents and are highly esteemed as food. Among the most valuable species are Mugil capito of Europe and M. cephalus which occurs both on the European and American coasts.", "details": []}, {"x": -0.7707364940379037, "y": -0.20630491245054727, "z": 0.6028296109655967, "word": "Mullet", "pos_group": "noun", "row_number": 99697, "definition": "Any species of the genus Mullus or family Mullidae; called also red mullet and surmullet esp. the plain surmullet (Mullus barbatus) and the striped surmullet (M. surmulletus) of Southern Europe. The former is the mullet of the Romans. It is noted for the brilliancy of its colors. See Surmullet.", "details": []}, {"x": -0.8526264396528672, "y": 0.03248314821533714, "z": 0.5215103062134977, "word": "Mulliod", "pos_group": "adjective", "row_number": 99712, "definition": "Like or pertaining to the genus Mullus which includes the surmullet or red mullet.", "details": []}, {"x": -0.8711599874636903, "y": -0.21910442296146196, "z": 0.43940132917526314, "word": "Multivalve", "pos_group": "noun", "row_number": 99833, "definition": "Any mollusk which has a shell composed of more than two pieces.", "details": []}, {"x": -0.7618609379033318, "y": -0.0868971144677565, "z": 0.6418853501944356, "word": "Mummichog", "pos_group": "noun", "row_number": 99871, "definition": "Any one of several species of small American cyprinodont fishes of the genus Fundulus and of allied genera; the killifishes; -- called also minnow.", "details": []}, {"x": -0.9045344645117603, "y": -0.03018378850108974, "z": 0.42533086112125035, "word": "Muraena", "pos_group": "noun", "row_number": 99959, "definition": "A genus of large eels of the family Miraenidae. They differ from the common eel in lacking pectoral fins and in having the dorsal and anal fins continuous. The murry (Muraena Helenae) of Southern Europe was the muraena of the Romans. It is highly valued as a food fish.", "details": []}, {"x": -0.8034116300283667, "y": -0.24613257086604515, "z": 0.542170185729568, "word": "Murenoid", "pos_group": "adjective", "row_number": 99961, "definition": "Like or pertaining to the genus Muraena or family Muraenidae.", "details": []}, {"x": -0.8098076790944116, "y": 0.015687039204649346, "z": 0.5864856687769228, "word": "Murex", "pos_group": "noun", "row_number": 99982, "definition": "A genus of marine gastropods having rough and frequently spinose shells which are often highly colored inside; the rock shells. They abound in tropical seas.", "details": []}, {"x": -0.9015386157673992, "y": -0.15446300415378714, "z": 0.4041896889184443, "word": "Muricoid", "pos_group": "adjective", "row_number": 99994, "definition": "Like or pertaining to the genus Murex or family Muricidae.", "details": []}, {"x": -0.7597998662033438, "y": -0.16543691593159965, "z": 0.628756542840249, "word": "Murlins", "pos_group": "noun", "row_number": 100007, "definition": "A seaweed. See Baddrelocks.", "details": []}, {"x": -0.8770858237992339, "y": 0.021008058153229408, "z": 0.4798740659621538, "word": "Murre", "pos_group": "noun", "row_number": 100025, "definition": "Any one of several species of sea birds of the genus Uria or Catarractes; a guillemot.", "details": []}, {"x": -0.8458739217731511, "y": -0.24305028935336717, "z": 0.4747882320670483, "word": "Murrelet", "pos_group": "noun", "row_number": 100026, "definition": "One of several species of sea birds of the genera Synthliboramphus and Brachyramphus inhabiting the North Pacific. They are closely related to the murres.", "details": []}, {"x": -0.7745414299508921, "y": -0.04007105595639717, "z": 0.6312526306988084, "word": "Muskellunge", "pos_group": "noun", "row_number": 100156, "definition": "A large American pike (Esox nobilitor) found in the Great Lakes and other Northern lakes and in the St. Lawrence River. It is valued as a food fish.", "details": []}, {"x": -0.9109827690484464, "y": -0.07528166981548484, "z": 0.4055158007853911, "word": "Mussel", "pos_group": "noun", "row_number": 100191, "definition": "Any one of many species of marine bivalve shells of the genus Mytilus and related genera of the family Mytidae. The common mussel (Mytilus edulis; see Illust. under Byssus) and the larger or horse mussel (Modiola modiolus) inhabiting the shores both of Europe and America are edible. The former is extensively used as food in Europe.", "details": []}, {"x": -0.7810638714520254, "y": -0.22643996844170178, "z": 0.5819485968747542, "word": "Mussel", "pos_group": "noun", "row_number": 100192, "definition": "Any one of numerous species of Unio and related fresh-water genera; -- called also river mussel. See Naiad and Unio.", "details": []}, {"x": -0.8361756864010459, "y": 0.031781188469045416, "z": 0.5475401149972802, "word": "Mutilate", "pos_group": "adjective", "row_number": 100268, "definition": "Having finlike appendages or flukes instead of legs as a cetacean.", "details": []}, {"x": -0.8848550816870637, "y": -0.19789045476303188, "z": 0.42174737975031956, "word": "Mutilate", "pos_group": "noun", "row_number": 100269, "definition": "A cetacean or a sirenian.", "details": []}, {"x": -0.7578802025320326, "y": -0.11745786564266465, "z": 0.6417330039889448, "word": "Mya", "pos_group": "noun", "row_number": 100329, "definition": "A genus of bivalve mollusks including the common long or soft-shelled clam.", "details": []}, {"x": -0.8964643821055076, "y": -0.00629723622701941, "z": 0.4430710512232676, "word": "Myaria", "pos_group": "other", "row_number": 100332, "definition": "A division of bivalve mollusks of which the common clam (Mya) is the type.", "details": []}, {"x": -0.8190606439804853, "y": -0.2507588455489585, "z": 0.5160035492719273, "word": "Mylodon", "pos_group": "noun", "row_number": 100372, "definition": "An extinct genus of large slothlike American edentates allied to Megatherium.", "details": []}, {"x": -0.7945588092437509, "y": -0.001358407595704603, "z": 0.6071856827873633, "word": "Myriacanthous", "pos_group": "adjective", "row_number": 100432, "definition": "Having numerous spines as certain fishes.", "details": []}, {"x": -0.9081358726927647, "y": -0.12465786543215686, "z": 0.39968694413809536, "word": "Myriapod", "pos_group": "noun", "row_number": 100442, "definition": "One of the Myriapoda.", "details": []}, {"x": -0.7650870454321647, "y": -0.19231765686428265, "z": 0.6145370060216984, "word": "Myriopoda", "pos_group": "other", "row_number": 100453, "definition": "See Myriapoda.", "details": []}, {"x": -0.8624461858520844, "y": 0.03086957423716692, "z": 0.5052065378591292, "word": "Mysis", "pos_group": "noun", "row_number": 100480, "definition": "A genus of small schizopod shrimps found both in fresh and salt water; the opossum shrimps. One species inhabits the Great Lakes of North America and is largely eaten by the whitefish. The marine species form part of the food of right whales.", "details": []}, {"x": -0.8619406066854681, "y": -0.23066952869240337, "z": 0.4514974629823646, "word": "Mysticete", "pos_group": "noun", "row_number": 100507, "definition": "Any right whale or whalebone whale. See Cetacea.", "details": []}, {"x": -0.7652499962155918, "y": -0.06817117797549342, "z": 0.6401133757276678, "word": "Mytilus", "pos_group": "noun", "row_number": 100541, "definition": "A genus of marine bivalve shells including the common mussel. See Illust. under Byssus.", "details": []}, {"x": -0.9083739072232933, "y": -0.046186400037344186, "z": 0.4156003622802538, "word": "Myxine", "pos_group": "noun", "row_number": 100543, "definition": "A genus of marsipobranchs including the hagfish. See Hag 4.", "details": []}, {"x": -0.7939705870358118, "y": -0.24121215162374304, "z": 0.5580568114726786, "word": "Myxopod", "pos_group": "noun", "row_number": 100549, "definition": "A rhizopod or moneran. Also used adjectively; as a myxopod state.", "details": []}, {"x": -0.8195076850451917, "y": 0.024490855214090113, "z": 0.5725446289703131, "word": "Myzontes", "pos_group": "other", "row_number": 100550, "definition": "The Marsipobranchiata.", "details": []}, {"x": -0.8962898082801963, "y": -0.17232375595893043, "z": 0.4086185295667047, "word": "Naiad", "pos_group": "noun", "row_number": 100591, "definition": "Any species of a tribe (Naiades) of freshwater bivalves including Unio Anodonta and numerous allied genera; a river mussel.", "details": []}, {"x": -0.7574512938409834, "y": -0.1478472052744311, "z": 0.6359313967332958, "word": "Naid", "pos_group": "noun", "row_number": 100595, "definition": "Any one of numerous species of small fresh-water chaetopod annelids of the tribe Naidina. They belong to the Oligochaeta.", "details": []}, {"x": -0.8854166073350523, "y": 0.01298108569248478, "z": 0.46461696360500043, "word": "Namaycush", "pos_group": "noun", "row_number": 100645, "definition": "A large North American lake trout (Salvelinus namaycush). It is usually spotted with red and sometimes weighs over forty pounds. Called also Mackinaw trout lake trout lake salmon salmon trout togue and tuladi.", "details": []}, {"x": -0.8355482926722058, "y": -0.24875880069168538, "z": 0.4898756063440967, "word": "Nandine", "pos_group": "noun", "row_number": 100670, "definition": "An African carnivore (Nandinia binotata) allied to the civets. It is spotted with black.", "details": []}, {"x": -0.7810523764297246, "y": -0.023567676853085612, "z": 0.6240206325765424, "word": "Narwhal", "pos_group": "noun", "row_number": 100812, "definition": "An arctic cetacean (Monodon monocerous) about twenty feet long. The male usually has one long twisted pointed canine tooth or tusk projecting forward from the upper jaw like a horn whence it is called also sea unicorn unicorn fish and unicorn whale. Sometimes two horns are developed side by side.", "details": []}, {"x": -0.9113236879239025, "y": -0.09386563301200805, "z": 0.4008470765367168, "word": "Nassa", "pos_group": "noun", "row_number": 100850, "definition": "Any species of marine gastropods of the genera Nassa Tritia and other allied genera of the family Nassidae; a dog whelk. See Illust. under Gastropoda.", "details": []}, {"x": -0.7736602388330777, "y": -0.2154875792007383, "z": 0.5958312999993798, "word": "Natica", "pos_group": "noun", "row_number": 100891, "definition": "Any one of numerous species of marine gastropods belonging to Natica Lunatia Neverita and other allied genera (family Naticidae.) They burrow beneath the sand or mud and drill other shells.", "details": []}, {"x": -0.8463707364497144, "y": 0.034269373836385224, "z": 0.5314905328398902, "word": "Natterjack", "pos_group": "noun", "row_number": 100942, "definition": "A European toad (Bufo calamita) having a yellow line along its back.", "details": []}, {"x": -0.8768373946244915, "y": -0.21246982200663916, "z": 0.4312919638998629, "word": "Nautilite", "pos_group": "noun", "row_number": 101031, "definition": "A fossil nautilus.", "details": []}, {"x": -0.7591210727002916, "y": -0.09838952254250695, "z": 0.643470822055061, "word": "Nautiloid", "pos_group": "noun", "row_number": 101033, "definition": "A mollusk or shell of the genus Nautilus or family Nautilidae.", "details": []}, {"x": -0.90227052629135, "y": -0.019788889764781263, "z": 0.43071602852437196, "word": "Nautilus", "pos_group": "noun", "row_number": 101036, "definition": "The only existing genus of tetrabranchiate cephalopods. About four species are found living in the tropical Pacific but many other species are found fossil. The shell is spiral symmetrical and chambered or divided into several cavities by simple curved partitions which are traversed and connected together by a continuous and nearly central tube or siphuncle. See Tetrabranchiata.", "details": []}, {"x": -0.8088678903239659, "y": -0.24988524396036474, "z": 0.5322500360298021, "word": "Nebalia", "pos_group": "noun", "row_number": 101146, "definition": "A genus of small marine Crustacea considered the type of a distinct order (Nebaloidea or Phyllocarida.)", "details": []}, {"x": -0.8033999470797311, "y": 0.010902820221671324, "z": 0.5953399478814597, "word": "Nectocalyx", "pos_group": "noun", "row_number": 101278, "definition": "The swimming bell or umbrella of a jellyfish of medusa.", "details": []}, {"x": -0.9049063373432256, "y": -0.1435697657389739, "z": 0.4006647513841519, "word": "Nectocalyx", "pos_group": "noun", "row_number": 101279, "definition": "One of the zooids of certain Siphonophora having somewhat the form and the essential structure of the bell of a jellyfish and acting as a swimming organ.", "details": []}, {"x": -0.7606191079244732, "y": -0.17663680100719137, "z": 0.6247063415638776, "word": "Needlefish", "pos_group": "noun", "row_number": 101309, "definition": "The European great pipefich (Siphostoma / Syngnathus acus); -- called also earl and tanglefish.", "details": []}, {"x": -0.8718830764261938, "y": 0.026710333906302886, "z": 0.4889851317823579, "word": "Nefasch", "pos_group": "noun", "row_number": 101347, "definition": "Any fish of the genus Distichodus. Several large species inhabit the Nile.", "details": []}, {"x": -0.852103981755892, "y": -0.2401737544393146, "z": 0.4650111525052688, "word": "Negrita", "pos_group": "noun", "row_number": 101417, "definition": "A blackish fish (Hypoplectrus nigricans) of the Sea-bass family. It is a native of the West Indies and Florida.", "details": []}, {"x": -0.7699328791400619, "y": -0.04993841271129273, "z": 0.6361678367812786, "word": "Nematocalyx", "pos_group": "noun", "row_number": 101471, "definition": "One of a peculiar kind of cups or calicles found upon hydroids of the family Plumularidae. They contain nematocysts. See Plumularia.", "details": []}, {"x": -0.9109223957127041, "y": -0.06352357181109723, "z": 0.40765812246708444, "word": "Nematognathi", "pos_group": "other", "row_number": 101477, "definition": "An order of fishes having barbels on the jaws. It includes the catfishes or siluroids. See Siluroid.", "details": []}, {"x": -0.7851395936288857, "y": -0.2338294816252313, "z": 0.5734802455526641, "word": "Nemertes", "pos_group": "noun", "row_number": 101486, "definition": "A genus of nemertina.", "details": []}, {"x": -0.8295995816196035, "y": 0.030997560401542334, "z": 0.5574976999286467, "word": "Neocarida", "pos_group": "other", "row_number": 101502, "definition": "The modern or true Crustacea as distinguished from the Merostomata.", "details": []}, {"x": -0.8898526109625642, "y": -0.18925941210141492, "z": 0.4151423920706417, "word": "Neomenoidea", "pos_group": "other", "row_number": 101536, "definition": "A division of vermiform gastropod mollusks without a shell belonging to the Isopleura.", "details": []}, {"x": -0.7564639258375635, "y": -0.12932380335764476, "z": 0.6411222058169055, "word": "Nereid", "pos_group": "noun", "row_number": 101616, "definition": "A sea nymph one of the daughters of Nereus who were attendants upon Neptune and were represented as riding on sea horses sometimes with the human form entire and sometimes with the tail of a fish.", "details": []}, {"x": -0.892928516310141, "y": 0.002651028787588158, "z": 0.45019066716952016, "word": "Nereis", "pos_group": "noun", "row_number": 101621, "definition": "A genus including numerous species of marine chaetopod annelids having a well-formed head with two pairs of eyes antennae four pairs of tentacles and a protrusile pharynx armed with a pair of hooked jaws.", "details": []}, {"x": -0.8250688592450827, "y": -0.2520039489961756, "z": 0.5057226386017841, "word": "Nereites", "pos_group": "other", "row_number": 101622, "definition": "Fossil tracks of annelids.", "details": []}, {"x": -0.7886097302021385, "y": -0.008393956385467116, "z": 0.6148367546973009, "word": "Nereocystis", "pos_group": "noun", "row_number": 101623, "definition": "A genus of gigantic seaweeds.", "details": []}, {"x": -0.9102749453372092, "y": -0.11295284462525639, "z": 0.39829785184256744, "word": "Nerita", "pos_group": "noun", "row_number": 101625, "definition": "A genus of marine gastropods mostly natives of warm climates.", "details": []}, {"x": -0.7672598352525452, "y": -0.20246235830123252, "z": 0.6085403344720387, "word": "Nerite", "pos_group": "noun", "row_number": 101626, "definition": "Any mollusk of the genus Nerita.", "details": []}, {"x": -0.8564764033973864, "y": 0.03420314336732856, "z": 0.515051759930273, "word": "Neritina", "pos_group": "noun", "row_number": 101627, "definition": "A genus including numerous species of shells resembling Nerita in form. They mostly inhabit brackish water and are often delicately tinted.", "details": []}, {"x": -0.8679479088035729, "y": -0.22535485841797673, "z": 0.44258515044104024, "word": "Newt", "pos_group": "noun", "row_number": 101889, "definition": "Any one of several species of small aquatic salamanders. The common British species are the crested newt (Triton cristatus) and the smooth newt (Lophinus punctatus). In America Diemictylus viridescens is one of the most abundant species.", "details": []}, {"x": -0.761737649773529, "y": -0.07926484795862022, "z": 0.6430185353437311, "word": "New Zealand", "pos_group": "other", "row_number": 101894, "definition": "A group of islands in the South Pacific Ocean.", "details": []}, {"x": -0.9069196258706979, "y": -0.035058985086930027, "z": 0.4198424225530667, "word": "Nidamental", "pos_group": "adjective", "row_number": 101991, "definition": "Of pertaining to or baring eggs or egg capsules; as the nidament capsules of certain gastropods; nidamental glands. See Illust. of Dibranchiata.", "details": []}, {"x": -0.7990057065778338, "y": -0.24644438870362503, "z": 0.5485025470611354, "word": "Nidulite", "pos_group": "noun", "row_number": 102011, "definition": "A Silurian fossil formerly supposed to consist of eggs.", "details": []}, {"x": -0.812911285822618, "y": 0.02115617751197578, "z": 0.5820031422039748, "word": "Nipper", "pos_group": "noun", "row_number": 102203, "definition": "A European crab (Polybius Henslowii).", "details": []}, {"x": -0.9003574832374794, "y": -0.1620883339914908, "z": 0.4038363212517355, "word": "Noble", "pos_group": "noun", "row_number": 102331, "definition": "A European fish; the lyrie.", "details": []}, {"x": -0.7574270510232769, "y": -0.15952718733144672, "z": 0.6331313756877792, "word": "Noctiluca", "pos_group": "noun", "row_number": 102368, "definition": "A genus of marine flagellate Infusoria remarkable for their unusually large size and complex structure as well as for their phosphorescence. The brilliant diffuse phosphorescence of the sea is often due to myriads of Noctilucae.", "details": []}, {"x": -0.8807579716259308, "y": 0.020049746375694167, "z": 0.473142053814334, "word": "Noctilucin", "pos_group": "noun", "row_number": 102369, "definition": "A fatlike substance in certain marine animals to which they owe their phosphorescent properties.", "details": []}, {"x": -0.8418199687798193, "y": -0.24741749177745373, "z": 0.4797121271409528, "word": "Nodosarine", "pos_group": "adjective", "row_number": 102425, "definition": "Resembling in form or structure a foraminiferous shell of the genus Nodosaria.", "details": []}, {"x": -0.7758382439684499, "y": -0.03253763790969671, "z": 0.6300923117410732, "word": "Notidanian", "pos_group": "noun", "row_number": 103054, "definition": "Any one of several species of sharks of the family Notidanidae or Hexanchidae. Called also cow sharks. See Shark.", "details": []}, {"x": -0.9121152280174089, "y": -0.08189517606356111, "z": 0.40167025152016017, "word": "Notobranchiata", "pos_group": "other", "row_number": 103075, "definition": "A division of nudibranchiate mollusks having gills upon the back.", "details": []}, {"x": -0.7770854848159073, "y": -0.22408831968322498, "z": 0.588151829266878, "word": "Notobranchiata", "pos_group": "other", "row_number": 103076, "definition": "The Dorsibranchiata.", "details": []}, {"x": -0.8399019812458347, "y": 0.03505993075256069, "z": 0.5416045265273798, "word": "Nucleobranchiata", "pos_group": "other", "row_number": 103257, "definition": "See Heteropoda.", "details": []}, {"x": -0.8823276898626294, "y": -0.20494896156644135, "z": 0.42366705188687137, "word": "Nucula", "pos_group": "noun", "row_number": 103277, "definition": "A genus of small marine bivalve shells having a pearly interior.", "details": []}, {"x": -0.756870742120569, "y": -0.11019297954584317, "z": 0.6442081860553065, "word": "Nudibrachiate", "pos_group": "adjective", "row_number": 103288, "definition": "Having tentacles without vibratile cilia.", "details": []}, {"x": -0.8994721743057862, "y": -0.009821969841675089, "z": 0.4368676419214986, "word": "Nudibranch", "pos_group": "noun", "row_number": 103290, "definition": "One of the Nudibranchiata.", "details": []}, {"x": -0.8146229924427499, "y": -0.2526955352927129, "z": 0.5220482225108604, "word": "Nudibranchiata", "pos_group": "other", "row_number": 103291, "definition": "A division of opisthobranchiate mollusks having no shell except while very young. The gills are naked and situated upon the back or sides. See Ceratobranchia.", "details": []}, {"x": -0.7970865296913147, "y": 0.005156806299889144, "z": 0.6038430851913784, "word": "Nullipore", "pos_group": "noun", "row_number": 103323, "definition": "A name for certain crustaceous marine algae which secrete carbonate of lime on their surface and were formerly thought to be of animal nature. They are now considered corallines of the genera Melobesia and Lithothamnion.", "details": []}, {"x": -0.9078363672987333, "y": -0.13220086096002434, "z": 0.39793977254261453, "word": "Nummulite", "pos_group": "noun", "row_number": 103396, "definition": "A fossil of the genus Nummulites and allied genera.", "details": []}, {"x": -0.7619899496118728, "y": -0.18757603703359021, "z": 0.6198278365976062, "word": "Nummulites", "pos_group": "noun", "row_number": 103397, "definition": "A genus of extinct Tertiary Foraminifera having a thin flat round shell containing a large number of small chambers arranged spirally.", "details": []}, {"x": -0.8663050768997352, "y": 0.031552221538811036, "z": 0.49851777405997266, "word": "Nursehound", "pos_group": "noun", "row_number": 103454, "definition": "See Houndfish.", "details": []}, {"x": -0.8583360384911464, "y": -0.2362890505550416, "z": 0.4554412471605119, "word": "Nursepond", "pos_group": "noun", "row_number": 103456, "definition": "A pond where fish are fed.", "details": []}, {"x": -0.7656972234590942, "y": -0.06043197356063726, "z": 0.6403559467660157, "word": "Nutshell", "pos_group": "noun", "row_number": 103522, "definition": "A shell of the genus Nucula.", "details": []}, {"x": -0.9103104395738298, "y": -0.05185059360786026, "z": 0.41066582466211293, "word": "Oar", "pos_group": "noun", "row_number": 103602, "definition": "An oarlike swimming organ of various invertebrates.", "details": []}, {"x": -0.7896561782465212, "y": -0.2404669909414992, "z": 0.5644632374430061, "word": "Oarfish", "pos_group": "noun", "row_number": 103609, "definition": "The ribbon fish.", "details": []}, {"x": -0.8229254995823319, "y": 0.0291898999171788, "z": 0.5673989530127761, "word": "Oarfoot", "pos_group": "noun", "row_number": 103610, "definition": "Any crustacean of the genus Remipes.", "details": []}, {"x": -0.8945539726636191, "y": -0.1798704347507673, "z": 0.4091696673683264, "word": "Oarsweed", "pos_group": "noun", "row_number": 103616, "definition": "Any large seaweed of the genus Laminaria; tangle; kelp. See Kelp.", "details": []}, {"x": -0.7555828997737641, "y": -0.14128314739665487, "z": 0.6396354851250554, "word": "Ocean", "pos_group": "noun", "row_number": 104183, "definition": "One of the large bodies of water into which the great ocean is regarded as divided as the Atlantic Pacific Indian Arctic and Antarctic oceans.", "details": []}, {"x": -0.8888999176779538, "y": 0.010978700929538253, "z": 0.4579698728934323, "word": "Oceanic", "pos_group": "adjective", "row_number": 104186, "definition": "Of or pertaining to the ocean; found or formed in or about or produced by the ocean; frequenting the ocean especially mid-ocean.", "details": []}, {"x": -0.8312687035550219, "y": -0.25224033111616234, "z": 0.4953454934168293, "word": "Octocerata", "pos_group": "other", "row_number": 104280, "definition": "A suborder of Cephalopoda including Octopus Argonauta and allied genera having eight arms around the head; -- called also Octopoda.", "details": []}, {"x": -0.7828713924168834, "y": -0.016296438611716233, "z": 0.6219701029983874, "word": "Octopod", "pos_group": "noun", "row_number": 104304, "definition": "One of the Octocerata.", "details": []}, {"x": -0.9119118728088891, "y": -0.10097843906732568, "z": 0.39776889153591555, "word": "Octopus", "pos_group": "noun", "row_number": 104308, "definition": "A genus of eight-armed cephalopods", "details": []}, {"x": -0.7699628052907151, "y": -0.21213707355308, "z": 0.601793270561567, "word": "Oculina", "pos_group": "noun", "row_number": 104335, "definition": "A genus of tropical corals usually branched and having a very volid texture.", "details": []}, {"x": -0.8502274445364785, "y": 0.0365739535141423, "z": 0.5251434456234934, "word": "Oculinacea", "pos_group": "other", "row_number": 104336, "definition": "A suborder of corals including many reef-building species having round starlike calicles.", "details": []}, {"x": -0.8738369358263042, "y": -0.21909046912089794, "z": 0.43406033673451516, "word": "Ocypodian", "pos_group": "noun", "row_number": 104345, "definition": "One of a tribe of crabs which live in holes in the sand along the seashore and run very rapidly -- whence the name.", "details": []}, {"x": -0.7586794653771775, "y": -0.09079609524857023, "z": 0.6451058346524337, "word": "Odontocete", "pos_group": "other", "row_number": 104394, "definition": "A subdivision of Cetacea including the sperm whale dolphins etc.; the toothed whales.", "details": []}, {"x": -0.9049142301349329, "y": -0.02423641692566017, "z": 0.4249033209965621, "word": "Odontolcae", "pos_group": "other", "row_number": 104401, "definition": "An extinct order of ostrichlike aquatic birds having teeth which are set in a groove in the jaw. It includes Hesperornis and allied genera. See Hesperornis.", "details": []}, {"x": -0.804399692205297, "y": -0.2507892637030569, "z": 0.5385590779026029, "word": "Odontophore", "pos_group": "noun", "row_number": 104405, "definition": "A special structure found in the mouth of most mollusks except bivalves. It consists of several muscles and a cartilage which supports a chitinous radula or lingual ribbon armed with teeth. Also applied to the radula alone. See Radula.", "details": []}, {"x": -0.8063373765137418, "y": 0.016817659111671053, "z": 0.5912167128718029, "word": "Odontornithes", "pos_group": "other", "row_number": 104409, "definition": "A group of Mesozoic birds having the jaws armed with teeth as in most other vertebrates. They have been divided into three orders: Odontolcae Odontotormae and Saururae.", "details": []}, {"x": -0.9040333491507601, "y": -0.15126018010503522, "z": 0.399805029405399, "word": "Oliva", "pos_group": "noun", "row_number": 104782, "definition": "A genus of polished marine gastropod shells chiefly tropical and often beautifully colored.", "details": []}, {"x": -0.757958595728201, "y": -0.17107712025069993, "z": 0.6294691303697593, "word": "Ombre", "pos_group": "noun", "row_number": 104825, "definition": "A large Mediterranean food fish (Umbrina cirrhosa): -- called also umbra and umbrine.", "details": []}, {"x": -0.8756719997632055, "y": 0.02633352164344129, "z": 0.4821878207385198, "word": "Omostegite", "pos_group": "noun", "row_number": 104904, "definition": "The part of the carapace of a crustacean situated behind the cervical groove.", "details": []}, {"x": -0.8481662739538884, "y": -0.24504870816333557, "z": 0.469643590773533, "word": "Onychophora", "pos_group": "other", "row_number": 105072, "definition": "Malacopoda.", "details": []}, {"x": -0.7709419877520522, "y": -0.04223782161407591, "z": 0.6355032792568516, "word": "Ooecium", "pos_group": "noun", "row_number": 105077, "definition": "One of the special zooids or cells of Bryozoa destined to receive and develop ova; an ovicell. See Bryozoa.", "details": []}, {"x": -0.9123636650459077, "y": -0.06987573061932364, "z": 0.4033731832613745, "word": "Oostegite", "pos_group": "noun", "row_number": 105116, "definition": "One of the plates which in some Crustacea inclose a cavity wherein the eggs are hatched.", "details": []}, {"x": -0.7809941339678457, "y": -0.2320307878151224, "z": 0.5798360770197974, "word": "Opah", "pos_group": "noun", "row_number": 105137, "definition": "A large oceanic fish (Lampris quttatus) inhabiting the Atlantic Ocean. It is remarkable for its brilliant colors which are red green and blue with tints of purple and gold covered with round silvery spots. Called also king of the herrings.", "details": []}, {"x": -0.8332640179019465, "y": 0.03483052643168988, "z": 0.5517770481801466, "word": "Opelet", "pos_group": "noun", "row_number": 105157, "definition": "A bright-colored European actinian (Anemonia / Anthea sulcata); -- so called because it does not retract its tentacles.", "details": []}, {"x": -0.8875843172412644, "y": -0.1965823895863143, "z": 0.41659265943111967, "word": "Opercle", "pos_group": "noun", "row_number": 105238, "definition": "Any one of the bony plates which support the gill covers of fishes; an opercular bone.", "details": []}, {"x": -0.7551347456350096, "y": -0.1222233844974945, "z": 0.6440752752720188, "word": "Opercular", "pos_group": "noun", "row_number": 105242, "definition": "The principal opercular bone or operculum of fishes.", "details": []}, {"x": -0.8961494073620973, "y": -0.0003664965346341185, "z": 0.4437523018135813, "word": "Operculated", "pos_group": "adjective", "row_number": 105245, "definition": "Having an operculum or an apparatus for protecting the gills; -- said of shells and of fishes.", "details": []}, {"x": -0.820637381261689, "y": -0.25452447981626525, "z": 0.511636177034245, "word": "Operculigenous", "pos_group": "adjective", "row_number": 105248, "definition": "Producing an operculum; -- said of the foot or part of the foot of certain mollusks.", "details": []}, {"x": -0.7909157592656029, "y": -0.0015249689694705677, "z": 0.6119231456767731, "word": "Operculum", "pos_group": "noun", "row_number": 105254, "definition": "The fold of integument usually supported by bony plates which protects the gills of most fishes and some amphibians; the gill cover; the gill lid.", "details": []}, {"x": -0.9102969951339448, "y": -0.12043366309436793, "z": 0.39604938258225203, "word": "Operculum", "pos_group": "noun", "row_number": 105256, "definition": "The lid closing the aperture of various species of shells as the common whelk. See Illust. of Gastropoda.", "details": []}, {"x": -0.7639108068345882, "y": -0.19816655823903123, "z": 0.6141419171470264, "word": "Ophidia", "pos_group": "other", "row_number": 105269, "definition": "The order of reptiles which includes the serpents.", "details": []}, {"x": -0.8603858836645102, "y": 0.035481244855624886, "z": 0.5084065424975714, "word": "Ophidioid", "pos_group": "adjective", "row_number": 105272, "definition": "Of or pertaining to the Ophidiidae a family of fishes which includes many slender species.", "details": []}, {"x": -0.8645214476855557, "y": -0.2314068847732931, "z": 0.44615414395833036, "word": "Ophidion", "pos_group": "noun", "row_number": 105275, "definition": "The typical genus of ophidioid fishes. [Written also Ophidium.] See Illust. under Ophidioid.", "details": []}, {"x": -0.7618721313504265, "y": -0.07148345228896363, "z": 0.6437708998707614, "word": "Ophiura", "pos_group": "noun", "row_number": 105292, "definition": "A genus of ophiurioid starfishes.", "details": []}, {"x": -0.9091400095557893, "y": -0.04035273162438921, "z": 0.4145311810652477, "word": "Ophiuran", "pos_group": "adjective", "row_number": 105293, "definition": "Of or pertaining to the Ophiurioidea.", "details": []}, {"x": -0.7945861054083994, "y": -0.2462880823142706, "z": 0.5549550446674679, "w th the skull.", "details": []}, {"x": -0.7731838264608307, "y": -0.22125963410498628, "z": 0.5943323521524932, "word": "Oquassa", "pos_group": "noun", "row_number": 105533, "definition": "A small handsome trout (Salvelinus oquassa) found in some of the lakes in Maine; -- called also blueback trout.", "details": []}, {"x": -0.8437402051119106, "y": 0.03794654338290673, "z": 0.5354087467748357, "word": "Orbitolites", "pos_group": "noun", "row_number": 105632, "definition": "A genus of living Foraminifera forming broad thin circular disks containing numerous small chambers.", "details": []}, {"x": -0.8795595082124493, "y": -0.21190626165887008, "z": 0.42599390580480934, "word": "Orbulina", "pos_group": "noun", "row_number": 105640, "definition": "A genus of minute living Foraminifera having a globular shell.", "details": []}, {"x": -0.7561055862642199, "y": -0.10268534803261385, "z": 0.6463436096376766, "word": "Orchestian", "pos_group": "noun", "row_number": 105655, "definition": "Any species of amphipod crustacean of the genus Orchestia or family Orchestidae. See Beach flea under Beach.", "details": []}, {"x": -0.902361461995776, "y": -0.013806135138228273, "z": 0.4307588449903153, "word": "Oreodont", "pos_group": "adjective", "row_number": 105792, "definition": "Resembling or allied to the genus Oreodon.", "details": []}, {"x": -0.8101168705229028, "y": -0.2541974228604874, "z": 0.5282937878730591, "word": "Oreosoma", "pos_group": "other", "row_number": 105796, "definition": "A genus of small oceanic fishes remarkable for the large conical tubercles which cover the under surface.", "details": []}, {"x": -0.7998348240146972, "y": 0.011489985522863379, "z": 0.6001101853210483, "word": "Organling", "pos_group": "noun", "row_number": 105841, "definition": "A large kind of sea fish; the orgeis.", "details": []}, {"x": -0.9072810238051147, "y": -0.1399103241872149, "z": 0.39656808372456204, "word": "Ormer", "pos_group": "noun", "row_number": 105971, "definition": "An abal : []}, {"x": -0.7934526564699185, "y": 0.005195768844971347, "z": 0.6086097977579225, "word": "Oxyrhyncha", "pos_group": "other", "row_number": 107989, "definition": "The maioid crabs.", "details": []}, {"x": -0.9100669302266655, "y": -0.12811490429815686, "z": 0.3941633592870951, "word": "Oyster", "pos_group": "noun", "row_number": 108006, "definition": "Any marine bivalve mollusk of the genus Ostrea. They are usually found adhering to rocks or other fixed objects in shallow water along the seacoasts or in brackish water in the mouth of rivers. The common European oyster (Ostrea edulis) and the American oyster (Ostrea Virginiana) are the most important species.", "details": []}, {"x": -0.7607038324524693, "y": -0.1934269815531648, "z": 0.6196092979445653, "word": "Oyster-green", "pos_group": "noun", "row_number": 108008, "definition": "A green membranous seaweed (Ulva) often found growing on oysters but common on stones piles etc.", "details": []}, {"x": -0.8643390175989429, "y": 0.03630503669799548, "z": 0.5015974551036432, "word": "Oysterling", "pos_group": "noun", "row_number": 108010, "definition": "A young oyster.", "details": []}, {"x": -0.8608895741961751, "y": -0.23723272248495728, "z": 0.4500997405272563, "word": "Pachyderm", "pos_group": "noun", "row_number": 108078, "definition": "One of the Pachydermata.", "details": []}, {"x": -0.7622670132728604, "y": -0.06358148118039002, "z": 0.6441322812334284, "word": "Pachyglossal", "pos_group": "adjective", "row_number": 108084, "definition": "Having a thick tongue; -- applied to a group of lizards (Pachyglossae) including the iguanas and agamas.", "details": []}, {"x": -0.911182764836285, "y": -0.046050694323290196, "z": 0.4094206914869426, "word": "Pacu", "pos_group": "noun", "row_number": 108166, "definition": "A South American freah-water fish (Myleies pacu) of the family Characinidae. It is highly esteemed as food.", "details": []}, {"x": -0.7901691463414061, "y": -0.24565623957098004, "z": 0.56150310073047 word": "Paludina", "pos_group": "noun", "row_number": 108767, "definition": "Any one of numerous species of freshwater pectinibranchiate mollusks belonging to Paludina Melantho and allied genera. They have an operculated shell which is usually green often with brown bands. See Illust. of Pond snail under Pond.", "details": []}, {"x": -0.8740788606667469, "y": 0.03151627154348043, "z": 0.48476063161473765, "word": "Palus", "pos_group": "noun", "row_number": 108778, "definition": "One of several upright slender calcareous processes which surround the central part of the calicle of certain corals.", "details": []}, {"x": -0.8505606282045454, "y": -0.24673084441457813, "z": 0.46440338948241805, "word": "Pandora", "pos_group": "noun", "row_number": 108885, "definition": "A genus of marine bivalves in which one valve is flat the other convex.", "details": []}, {"x": -0.7673741479253996, "y": -0.04472859591897698, "z": 0.6396376081836368, "word": "Papboat", "pos_group": "noun", "row_number": 109133, "definition": "A large spiral East Indian marine shell (Turbinella rapha); -- so called because used by native priests to hold the oil for anointing.", "details": []}, {"x": -0.91359877721223, "y": -0.06430859212865989, "z": 0.4014992892331786, "word": "Papula", "pos_group": "noun", "row_number": 109196, "definition": "One of the numerous small hollow processes of the integument between the plates of starfishes.", "details": []}, {"x": -0.7811104950682513, "y": -0.23753577455279243, "z": 0.5774453656423579, "word": "Paradoxides", "pos_group": "noun", "row_number": 109313, "definition": "A genus of large trilobites characteristic of the primordial formations.", "details": []}, {"x": -0.830226454908897, "y": 0.03759184492987051, "z": 0.5561572500329145, "word": "Paragnathus", "pos_group": "noun", "row_number": 109331, "definition": "One of the two lobes which form the lower lip or metastome of Crustacea.", "details": []}, {"x": -0.8903159098694584, "y": -0.19493584941989456, "z": 0.4115064947777404, "word": "Paragnathus", "pos_group": "noun", "row_number": 109332, "definition": "One of the small horny toothlike jaws of certain annelids.", "details": []}, {"x": -0.7525144027395231, "y": -0.1272003968603401, "z": 0.6461750016119091, "word": "Paramere", "pos_group": "noun", "row_number": 109440, "definition": "One of the symmetrical halves of any one of the radii or spheromeres of a radiate animal as a starfish.", "details": []}, {"x": -0.8956503800218477, "y": 0.005537380839598129, "z": 0.44472433504380804, "word": "Paraphagma", "pos_group": "noun", "row_number": 109487, "definition": "One of the outer divisions of an endosternite of Crustacea.", "details": []}, {"x": -0.8223631710902741, "y": -0.2580394823866765, "z": 0.5070842537132906, "word": "Parapodia", "pos_group": "other", "row_number": 109504, "definition": "of Parapodium", "details": []}, {"x": -0.7872396808104694, "y": -0.0020345440502997727, "z": 0.616643775277054, "word": "Parasita", "pos_group": "other", "row_number": 109521, "definition": "A division of copepod Crustacea having a sucking mouth as the lerneans. They are mostly parasites on fishes. Called also Siphonostomata.", "details": []}, {"x": -0.9123605899941669, "y": -0.11595462510849001, "z": 0.392622819944849, "word": "Parian", "pos_group": "adjective", "row_number": 109704, "definition": "Of or pertaining to Paros an island in the Aegean Sea noted for its excellent statuary marble; as Parian marble.", "details": []}, {"x": -0.7629141213122943, "y": -0.2040486771224501, "z": 0.6134543021830297, "word": "Paries", "pos_group": "noun", "row_number": 109710, "definition": "The triangular middle part of each segment of the shell of a barnacle.", "details": []}, {"x": -0.858161104302334, "y": 0.03988681968704761, "z": 0.5118286438622321, "word": "Parietal", "pos_group": "noun", "row_number": 109717, "definition": "One of the special scales or plates covering the back of the head in certain reptiles and fishes.", "details": []}, {"x": -0.8671680687494296, "y": -0.2318075537507404, "z": 0.44077749326103555, "word": "Park", "pos_group": "noun", "row_number": 109753, "definition": "A partially inclosed basin in which oysters are grown.", "details": []}, {"x": -0.7585644400705195, "y": -0.07508646656291115, "z": 0.6472573003061427, "word": "Parkeria", "pos_group": "noun", "row_number": 109759, "definition": "A genus of large arenaceous fossil Foraminifera found in the Cretaceous rocks. The species are globular or nearly so and are of all sizes up to that of a tennis ball.", "details": []}, {"x": -0.9097396648518001, "y": -0.03442730733683986, "z": 0.41374932350986304, "word": "Parr", "pos_group": "noun", "row_number": 109860, "definition": "A young salmon in the stage when it has dark transverse bands; -- called also samlet skegger and fingerling.", "details": []}, {"x": -0.7953796329683908, "y": -0.2512090505602141, "z": 0.5516024405091984, "word": "Partan", "pos_group": "noun", "row_number": 109944, "definition": "An edible British crab.", "details": []}, {"x": -0.8128008377985485, "y": 0.02789509485623308, "z": 0.5818734069855224, "word": "Patella", "pos_group": "noun", "row_number": 110422, "definition": "A genus of marine gastropods including many species of limpets. The shell has the form of a flattened cone. The common European limpet (Patella vulgata) is largely used for food.", "details": []}, {"x": -0.9015059515028103, "y": -0.16692020468624094, "z": 0.3992801831703097, "word": "Patelliform", "pos_group": "adjective", "row_number": 110426, "definition": "Resembling a limpet of the genus Patella.", "details": []}, {"x": -0.7532047387402948, "y": -0.15879398913119047, "z": 0.6383314895530123, "word": "Pauropoda", "pos_group": "other", "row_number": 110688, "definition": "An order of small myriapods having only nine pairs of legs and destitute of tracheae.", "details": []}, {"x": -0.8831978895542485, "y": 0.024142026213961814, "z": 0.46837874680348773, "word": "Pawk", "pos_group": "noun", "row_number": 110757, "definition": "A small lobster.", "details": []}, {"x": -0.8398034214452292, "y": -0.2538419220481602, "z": 0.47989008318549603, "word": "Paxillus", "pos_group": "noun", "row_number": 110782, "definition": "One of a peculiar kind of spines covering the surface of certain starfishes. They are pillarlike with a flattened summit which is covered with minute spinules or granules. See Illustration in Appendix.", "details": []}, {"x": -0.7737343516065729, "y": -0.026810229316497063, "z": 0.6329426235828595, "word": "Peal", "pos_group": "noun", "row_number": 110868, "definition": "A small salmon; a grilse; a sewin.", "details": []}, {"x": -0.9145949082327146, "y": -0.08357623139065198, "z": 0.3956401994000722, "word": "Pearl", "pos_group": "noun", "row_number": 110890, "definition": "A fish allied to the turbot; the brill.", "details": []}, {"x": -0.7728928631731622, "y": -0.22699074332900906, "z": 0.5925468964554077, "word": "Pearlfish", "pos_group": "noun", "row_number": 110904, "definition": "Any fish whose scales yield a pearl-like pigment used in manufacturing artificial pearls as the bleak and whitebait.", "details": []}, {"x": -0.8409676744074011, "y": 0.04136427586495429, "z": 0.539501962261469, "word": "Peba", "pos_group": "noun", "row_number": 110932, "definition": "An armadillo (Tatusia novemcincta) which is found from Texas to Paraguay; -- called also tatouhou.", "details": []}, {"x": -0.8823083678564533, "y": -0.2110014992757304, "z": 0.42072593373106376, "word": "Pecten", "pos_group": "noun", "row_number": 110979, "definition": "Any species of bivalve mollusks of the genus Pecten and numerous allied genera (family Pectinidae); a scallop. See Scallop.", "details": []}, {"x": -0.7531953541541072, "y": -0.10722525397901955, "z": 0.6489988469864978, "word": "Pectinal", "pos_group": "noun", "row_number": 110984, "definition": "A fish whose bone/ resemble comb teeth.", "details": []}, {"x": -0.9022732443946515, "y": -0.007804928742032507,
