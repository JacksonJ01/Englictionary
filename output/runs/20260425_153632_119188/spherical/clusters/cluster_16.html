d to a buoy.", "details": []}, {"x": -0.33421396502414813, "y": 0.6251902550161701, "z": -0.7052929679329389, "word": "Jettison", "pos_group": "noun", "row_number": 83863, "definition": "The throwing overboard of goods from necessity in order to lighten a vessel in danger of wreck.", "details": []}, {"x": -0.3199123783913179, "y": 0.4649597446237876, "z": -0.8255110574858415, "word": "Jetty", "pos_group": "noun", "row_number": 83869, "definition": "A wharf or pier extending from the shore.", "details": []}, {"x": -0.4564354432026558, "y": 0.5461328871512622, "z": -0.7024283278457826, "word": "Jetty", "pos_group": "noun", "row_number": 83870, "definition": "A structure of wood or stone extended into the sea to influence the current or tide or to protect a harbor; a mole; as the Eads system of jetties at the mouth of the Mississippi River.", "details": []}, {"x": -0.2692939138783106, "y": 0.5867568602662926, "z": -0.7636734739916946, "word": "Jib", "pos_group": "other", "row_number": 83904, "definition": "A triangular sail set upon a stay or halyard extending from the foremast or fore-topmast to the bowsprit or the jib boom. Large vessels often carry several jibe; as inner jib; outer jib; flying jib; etc.", "details": []}, {"x": -0.4087486016928552, "y": 0.4455343272143806, "z": -0.7965072152138766, "word": "Jibe", "pos_group": "other", "row_number": 83910, "definition": "To shift as the boom of a fore-and-aft sail from one side of a vessel to the other when the wind is aft or on the quarter. See Gybe.", "details": []}, {"x": -0.39031900262970726, "y": 0.613236575042643, "z": -0.6867255486845669, "word": "Jibe", "pos_group": "other", "row_number": 83911, "definition": "To change a ship's course so as to cause a shifting of the boom. See Jibe v. t. and Gybe.", "details": []}, {"x": -0.2778908986311882, "y": 0.5071499128258885, "z": -0.8158281769947913, "word": "Jigger", "pos_group": "other", "row_number": 83933, "definition": "A small fishing vessel rigged like a yawl.", "details": []}, {"x": -0.4622294787319581, "y": 0.49578304685923025, "z": -0.7352163487288353, "word": "Jigger", "pos_group": "other", "row_number": 83934, "definition": "A supplementary sail. See Dandy n. 2 (b).", "details": []}, {"x": -0.30277134852815457, "y": 0.6187507498492241, "z": -0.724897937692932, "word": "Jolly-boat", "pos_group": "noun", "row_number": 84148, "definition": "A boat of medium size belonging to a ship.", "details": []}, {"x": -0.3535071354780801, "y": 0.44866981686207524, "z": -0.8208094179546397, "word": "Jonah", "pos_group": "noun", "row_number": 84159, "definition": "The Hebrew prophet who was cast overboard as one who endangered the ship; hence any person whose presence is unpropitious.", "details": []}, {"x": -0.4382735304719684, "y": 0.5765170643430335, "z": -0.689597264357195, "word": "Journal", "pos_group": "adjective", "row_number": 84200, "definition": "A daily register of the ship's course and distance the winds weather incidents of the voyage etc.", "details": []}, {"x": -0.2623925250416671, "y": 0.5581304637957296, "z": -0.7871725021781578, "word": "Jub", "pos_group": "noun", "row_number": 84262, "definition": "A vessel for holding ale or wine; a jug.", "details": []}, {"x": -0.4370468317850282, "y": 0.45725651213858587, "z": -0.7745363444884459, "word": "Junk", "pos_group": "noun", "row_number": 84494, "definition": "A large vessel without keel or prominent stem and with huge masts in one piece used by the Chinese Japanese Siamese Malays etc. in navigating their waters.", "details": []}, {"x": -0.3554034745325847, "y": 0.6244982494796399, "z": -0.6954784732017463, "word": "Kayak", "pos_group": "noun", "row_number": 84780, "definition": "A light canoe made of skins stretched over a frame and usually capable of carrying but one person who sits amidships and uses a double-bladed paddle. It is peculiar to the Eskimos and other Arctic tribes.", "details": []}, {"x": -0.3010136773985477, "y": 0.4786966884676414, "z": -0.8247667830 ther", "row_number": 127921, "definition": "To go on shore after having embarked; to land again.", "details": []}, {"x": -0.4368215971667194, "y": 0.6026227668714511, "z": -0.6678567908593227, "word": "Reliance", "pos_group": "noun", "row_number": 128041, "definition": "Anything on which to rely; dependence; ground of trust; as the boat was a poor reliance.", "details": []}, {"x": -0.2402641779283482, "y": 0.5406731695207706, "z": -0.8061920667959832, "word": "Renderer", "pos_group": "noun", "row_number": 128449, "definition": "A vessel in which lard or tallow etc. is rendered.", "details": []}, {"x": -0.46731262310287897, "y": 0.451270420362535, "z": -0.7602459601961247, "word": "Rendezvous", "pos_group": "noun", "row_number": 128458, "definition": "Especially the appointed place for troops or for the ships of a fleet to assemble; also a place for enlistment.", "details": []}, {"x": -0.3290463515550541, "y": 0.645147973935946, "z": -0.6895742093891356, "word": "Reprise", "pos_group": "noun", "row_number": 128953, "definition": "A ship recaptured from an enemy or from a pirate.", "details": []}, {"x": -0.3058033124259199, "y": 0.44858017255203264, "z": -0.8397976916511046, "word": "Resail", "pos_group": "other", "row_number": 129159, "definition": "To sail again; also to sail back as to a former port.", "details": []}, {"x": -0.47845352809630165, "y": 0.5445399335546127, "z": -0.6888820524709142, "word": "Reship", "pos_group": "other", "row_number": 129300, "definition": "To ship again; to put on board of a vessel a second time; to send on a second voyage; as to reship bonded merchandise.", "details": []}, {"x": -0.24699745530195436, "y": 0.5996729007414489, "z": -0.7611732189132088, "word": "Respondentia", "pos_group": "noun", "row_number": 129582, "definition": "A loan upon goods laden on board a ship. It differs from bottomry which is a loan on the ship itself.", "details": []}, {"x": -0.41567430837849323, "y": 0.42229316838169295, "z": -0.8055329597801771, "word": "Retake", "pos_group": "other", "row_number": 129824, "definition": "To take from a captor; to recapture; as to retake a ship or prisoners.", "details": []}, {"x": -0.3984469212050684, "y": 0.6287922120212663, "z": -0.6677277926547651, "word": "Retire", "pos_group": "other", "row_number": 129940, "definition": "To recede; to fall or bend back; as the shore of the sea retires in bays and gulfs.", "details": []}, {"x": -0.255052467415498, "y": 0.5016461918891287, "z": -0.8266192213034982, "word": "Rider", "pos_group": "noun", "row_number": 130964, "definition": "An interior rib occasionally fixed in a ship's hold reaching from the keelson to the beams of the lower deck to strengthen her frame.", "details": []}, {"x": -0.4838312470201592, "y": 0.482558663299709, "z": -0.7300989391043625, "word": "Rider", "pos_group": "noun", "row_number": 130965, "definition": "The second tier of casks in a vessel's hold.", "details": []}, {"x": -0.28980999467411767, "y": 0.6379454003126117, "z": -0.7134674717231119, "word": "Rifter", "pos_group": "noun", "row_number": 131046, "definition": "A rafter.", "details": []}, {"x": -0.3470901334297951, "y": 0.427795612252143, "z": -0.8345773501680362, "word": "Rig", "pos_group": "noun", "row_number": 131052, "definition": "The peculiar fitting in shape number and arrangement of sails and masts by which different types of vessels are distinguished; as schooner rig ship rig etc. See Illustration in Appendix.", "details": []}, {"x": -0.456741416022556, "y": 0.5823119493607398, "z": -0.6725325810110658, "word": "Rigger", "pos_group": "noun", "row_number": 131064, "definition": "One who rigs or dresses; one whose occupation is to fit the rigging of a ship.", "details": []}, {"x": -0.2376444899342182, "y": 0.5646490102434892, "z": -0.7903774994488099, "word": "Rigging", "pos_group": "noun", "row_number": 131066, "definition": "DRess; tackle; especially (Naut.) the ropes chains etc. that support the masts and spars of a vessel and serve as purchases for adjusting the sails etc. See Illustr. of Ship and Sails.", "details": []}, {"x": -0.45113335649943054, "y": 0.43606459005295867, "z": -0.7786696141211, "word": "Right", "pos_group": "other", "row_number": 131104, "definition": "Hence to regain an upright position as a ship or boat after careening.", "details": []}, {"x": -0.3554270725356841, "y": 0.6434259371844753, "z": -0.6779931116663305, "word": "Ringtail", "pos_group": "noun", "row_number": 131287, "definition": "A light sail set abaft and beyong the leech of a boom-and-gaff sail; -- called also ringsail.", "details": []}, {"x": -0.28296665210091404, "y": 0.4661765815195922, "z": -0.8382179123840693, "word": "Rivage", "pos_group": "noun", "row_number": 131474, "definition": "A bank shore or coast.", "details": []}, {"x": -0.4856338743087436, "y": 0.5201429596410398, "z": -0.702574580852267, "word": "Rivage", "pos_group": "noun", "row_number": 131475, "definition": "A duty paid to the crown for the passage of vessels on certain rivers.", "details": []}, {"x": -0.2591485637159661, "y": 0.6178943096324954, "z": -0.742326507709198, "word": "Roach", "pos_group": "noun", "row_number": 131533, "definition": "A convex curve or arch cut in the edge of a sail to prevent chafing or to secure a better fit.", "details": []}, {"x": -0.39045322012424305, "y": 0.41966575978825904, "z": -0.8194064516196785, "word": "Road", "pos_group": "noun", "row_number": 131540, "definition": "A place where ships may ride at anchor at some distance from the shore; a roadstead; -- often in the plural; as Hampton Roads.", "details": []}, {"x": -0.42338498376974354, "y": 0.6142724937038526, "z": -0.6658937295073025, "word": "Roadstead", "pos_group": "noun", "row_number": 131545, "definition": "An anchorage off shore. Same as Road 4.", "details": []}, {"x": -0.24339256142386342, "y": 0.5255347788875788, "z": -0.8152136267403254, "word": "Roadster", "pos_group": "noun", "row_number": 131546, "definition": "A clumsy vessel that works its way from one anchorage to another by means of the tides.", "details": []}, {"x": -0.475966787110443, "y": 0.46168622168528173, "z": -0.7485328651927925, "word": "Rochelle", "pos_group": "noun", "row_number": 131654, "definition": "A seaport town in France.", "details": []}, {"x": -0.31297104999125747, "y": 0.6446704630612886, "z": -0.6974590424703903, "word": "Roll", "pos_group": "other", "row_number": 131822, "definition": "To incline first to one side then to the other; to rock; as there is a great difference in ships about rolling; in a general semse to be tossed about.", "details": []}, {"x": -0.3206824364494011, "y": 0.4386011102619985, "z": -0.8395188151732026, "word": "Roll", "pos_group": "verb", "row_number": 131837, "definition": "The oscillating movement of a vessel from side to side in sea way as distinguished from the alternate rise and fall of bow and stern called pitching.", "details": []}, {"x": -0.4724120328584881, "y": 0.5594800924917099, "z": -0.6810351659906987, "word": "Roller", "pos_group": "noun", "row_number": 131844, "definition": "One of series of long heavy waves which roll in upon a coast sometimes in calm weather.", "details": []}, {"x": -0.2408438789236118, "y": 0.5873573754606806, "z": -0.7726613355649226, "word": "Rostrated", "pos_group": "adjective", "row_number": 132217, "definition": "Furnished or adorned with beaks; as rostrated galleys.", "details": []}, {"x": -0.43062194103614426, "y": 0.42525149865780704, "z": -0.7960690339333346, "word": "Rostrum", "pos_group": "noun", "row_number": 132224, "definition": "The beak or head of a ship.", "details": []}, {"x": -0.3823754194342275, "y": 0.6364920413685085, "z": -0.6698260370327864, "word": "Rother", "pos_group": "noun", "row_number": 132287, "definition": "A rudder.", "details": []}, {"x": -0.2636279461886094, "y": 0.48706578327807387, "z": -0.832626704320785, "word": "Roundhouse", "pos_group": "noun", "row_number": 132473, "definition": "A privy near the bow of the vessel.", "details": []}, {"x": -0.48708592482128316, "y": 0.49610405565638643, "z": -0.7187684382346516, "word": "Rove", "pos_group": "other", "row_number": 132557, "definition": "To practice robbery on the seas; to wander about on the seas in piracy.", "details": []}, {"x": -0.2762497504010759, "y": 0.6322923376337828, "z": -0.7238041690767952, "word": "Row", "pos_group": "other", "row_number": 132579, "definition": "To propel with oars as a boat or vessel along the surface of water; as to row a boat.", "details": []}, {"x": -0.3636621216929075, "y": 0.4223204243555306, "z": -0.8302983321782463, "word": "Row", "pos_group": "other", "row_number": 132580, "definition": "To transport in a boat propelled with oars; as to row the captain ashore in his barge.", "details": []}, {"x": -0.44568552526252697, "y": 0.5957867106773266, "z": -0.6681336752115979, "word": "Row", "pos_group": "other", "row_number": 132582, "definition": "To be moved by oars; as the boat rows easily.", "details": []}, {"x": -0.2371947786032392, "y": 0.5499883514861166, "z": -0.8007817744135689, "word": "Row", "pos_group": "noun", "row_number": 132583, "definition": "The act of rowing; excursion in a rowboat.", "details": []}, {"x": -0.46268391389767016, "y": 0.44394928037102444, "z": -0.7673543068741994, "word": "Rowboat", "pos_group": "noun", "row_number": 132587, "definition": "A boat designed to be propelled by oars instead of sails.", "details": []}, {"x": -0.3386594444872176, "y": 0.646204596887011, "z": -0.6839074496024334, "word": "Rowlock", "pos_group": "noun", "row_number": 132608, "definition": "A contrivance or arrangement serving as a fulcrum for an oar in rowing. It consists sometimes of a notch in the gunwale of a boat sometimes of a pair of pins between which the oar rests on the edge of the gunwale sometimes of a single pin passing through the oar or of a metal fork or stirrup pivoted in the gunwale and suporting the oar.", "details": []}, {"x": -0.29596870550066207, "y": 0.4539266784510892, "z": -0.8404481518538928, "word": "Rowport", "pos_group": "noun", "row_number": 132610, "definition": "An opening in the side of small vessels of war near the surface of the water to facilitate rowing in calm weather.", "details": []}, {"x": -0.48305452649050706, "y": 0.5351748340139432, "z": -0.6929979952894383, "word": "Royal", "pos_group": "noun", "row_number": 132618, "definition": "A small sail immediately above the topgallant sail.", "details": []}, {"x": -0.2497657257702566, "y": 0.6077160454608823, "z": -0.7538556163615441, "word": "Rudder", "pos_group": "noun", "row_number": 132775, "definition": "The mechanical appliance by means of which a vessel is guided or steered when in motion. It is a broad and flat blade made of wood or iron with a long shank and is fastened in an upright position usually by one edge to the sternpost of the vessel in such a way that it can be turned from side to side in the water by means of a tiller wheel or other attachment.", "details": []}, {"x": -0.4067003909373603, "y": 0.41937924695756035, "z": -0.8116131093277806, "word": "Rudder", "pos_group": "noun", "row_number": 132776, "definition": "Fig.: That which resembles a rudder as a guide or governor; that which guides or governs the course.", "details": []}, {"x": -0.40862792424841676, "y": 0.6246207251918399, "z": -0.6654864154776191, "word": "Rudderhead", "pos_group": "noun", "row_number": 132777, "definition": "The upper end of the rudderpost to which the tiller is attached.", "details": []}, {"x": -0.24872838737823746, "y": 0.5102944310472405, "z": -0.8232458824399881, "word": "Rudderhole", "pos_group": "noun", "row_number": 132778, "definition": "The hole in the deck through which the rudderpost passes.", "details": []}, {"x": -0.4826856064552021, "y": 0.47355496372463435, "z": -0.7367226762172683, "word": "Rudderless", "pos_group": "adjective", "row_number": 132779, "definition": "Without a rudder.", "details": []}, {"x": -0.2975421803405839, "y": 0.6421514688907991, "z": -0.70 ": []}, {"x": -0.4881195640336695, "y": 0.5105230865367544, "z": -0.7078880344521769, "word": "Run", "pos_group": "noun", "row_number": 133112, "definition": "The distance sailed by a ship; as a good run; a run of fifty miles.", "details": []}, {"x": -0.2640428792047122, "y": 0.6247433425535487, "z": -0.734831350635168, "word": "Rung", "pos_group": "noun", "row_number": 133144, "definition": "A floor timber in a ship.", "details": []}, {"x": -0.3804600512833427, "y": 0.4187682880725373, "z": -0.8245503442981955, "word": "Runghead", "pos_group": "noun", "row_number": 133148, "definition": "The upper end of a floor timber in a ship.", "details": []}, {"x": -0.4329420501087056, "y": 0.6083216337110046, "z": -0.6652112230012702, "word": "Rut", "pos_group": "noun", "row_number": 133332, "definition": "Roaring as of waves breaking upon the shore; rote. See Rote.", "details": []}, {"x": -0.23900884098050473, "y": 0.534790016681722, "z": -0.8104778911177771, "word": "Ruttier", "pos_group": "noun", "row_number": 133362, "definition": "A chart of a course esp. at sea.", "details": []}, {"x": -0.47258341731834014, "y": 0.4535678371428859, "z": -0.7556064655528326, "word": "Sagging", "pos_group": "noun", "row_number": 133749, "definition": "A bending or sinking between the ends of a thing in consequence of its own or an imposed weight; an arching downward in the middle as of a ship after straining. Cf. Hogging.", "details": []}, {"x": -0.32206244749502516, "y": 0.6469633366056612, "z": -0.691168735549854, "word": "Saic", "pos_group": "noun", "row_number": 133782, "definition": "A kind of ketch very common in the Levant which has neither topgallant sail nor mizzen topsail.", "details": []}, {"x": -0.3103712892704607, "y": 0.44292192646613954, "z": -0.8411241465159086, "word": "Sail", "pos_group": "noun", "row_number": 133787, "definition": "An extent of canvas or other fabric by means of which the wind is made serviceable as a power for propelling vessels through the water.", "d ": []}, {"x": -0.4692385522354751, "y": 0.4350531708217948, "z": -0.7684685547593065, "word": "Slatting", "pos_group": "noun", "row_number": 142610, "definition": "The violent shaking or flapping of anything hanging loose in the wind as of a sail when being hauled down.", "details": []}, {"x": -0.3378206248536663, "y": 0.6544119071762744, "z": -0.6764778497256134, "word": "Slaver", "pos_group": "noun", "row_number": 142639, "definition": "A vessel engaged in the slave trade; a slave ship.", "details": []}, {"x": -0.28869994142054467, "y": 0.44784220950325926, "z": -0.8462208335954704, "word": "Sleeper", "pos_group": "noun", "row_number": 142731, "definition": "One of the knees which connect the transoms to the after timbers on the ship's quarter.", "details": []}, {"x": -0.4926525086710665, "y": 0.5330660977817441, "z": -0.6878473966628419, "word": "Slice", "pos_group": "other", "row_number": 142813, "definition": "One of the wedges by which the cradle and the ship are lifted clear of the building blocks to prepare for launching.", "details": []}, {"x": -0.24092617712090894, "y": 0.6140287661032092, "z": -0.7516137648923648, "word": "Slice", "pos_group": "other", "row_number": 142814, "definition": "A removable sliding bottom to galley.", "details": []}, {"x": -0.40818427614483227, "y": 0.4093050218343312, "z": -0.8159993846868494, "word": "Slip", "pos_group": "noun", "row_number": 142977, "definition": "An inclined plane on which a vessel is built or upon which it is hauled for repair.", "details": []}, {"x": -0.41331908425519365, "y": 0.630286713732709, "z": -0.65719555163016, "word": "Slip", "pos_group": "noun", "row_number": 142978, "definition": "An opening or space for vessels to lie in between wharves or in a dock; as Peck slip.", "details": []}, {"x": -0.23837539298750487, "y": 0.5091337054866737, "z": -0.8270187675956704, "word": "Slip", "pos_group": "noun", "row_number": 142982, "definition": "The motion of the center of resistance of the float of a paddle wheel or the blade of an oar through the water horozontally or the difference between a vessel's actual speed and the speed which she would have if the propelling instrument acted upon a solid; also the velocity relatively to still water of the backward current of water produced by the propeller.", "details": []}, {"x": -0.4913040332491526, "y": 0.4667280381232944, "z": -0.7353810477179137, "word": "Sloop", "pos_group": "noun", "row_number": 143059, "definition": "A vessel having one mast and fore-and-aft rig consisting of a boom-and-gaff mainsail jibs staysail and gaff topsail. The typical sloop has a fixed bowsprit topmast and standing rigging while those of a cutter are capable of being readily shifted. The sloop usually carries a centerboard and depends for stability upon breadth of beam rather than depth of keel. The two types have rapidly approximated since 1880. One radical distinction is that a slop may carry a centerboard. See Cutter and Illustration in Appendix.", "details": []}, {"x": -0.2932289064563677, "y": 0.6504991564653103, "z": -0.7006194800719734, "word": "Slug", "pos_group": "noun", "row_number": 143182, "definition": "A ship that sails slowly.", "details": []}, {"x": -0.3323354181822368, "y": 0.421821432935082, "z": -0.8435756329685156, "word": "Smack", "pos_group": "noun", "row_number": 143285, "definition": "A small sailing vessel commonly rigged as a sloop used chiefly in the coasting and fishing trade.", "details": []}, {"x": -0.4728336778941465, "y": 0.5752683763022073, "z": -0.6674538248266443, "word": "Smuggler", "pos_group": "noun", "row_number": 143632, "definition": "A vessel employed in smuggling.", "details": []}, {"x": -0.2264336322084317, "y": 0.5777103100670172, "z": -0.7842057178108099, "word": "Snag", "pos_group": "noun", "row_number": 143667, "definition": "A tree or a branch of a tree fixed in the bottom of a river or other navigable water and rising nearly or quite to the surface by which boats are sometimes pierced and sunk
