<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 27, "radius": 285.0, "nodes": [{"x": 0.4021746903641391, "y": -0.9000592644962518, "z": -0.1677761569025083, "word": "802.1X wireless protocol", "pos_group": "other", "row_number": 23, "definition": "An enterprise-grade authentication standard used to secure networks. Instead of relying on a single shared Wi-Fi password (WPA-Personal), it forces each user to authenticate uniquely via a central authentication server\u2014typically a RADIUS or TACACS+ server\u2014using corporate username/password credentials, digital certificates, or smart cards.", "details": []}, {"x": 0.4156038160908136, "y": -0.8924421893002544, "z": -0.1755574174101506, "word": "AAA (Authentication, Authorization, Accounting) Servers", "pos_group": "other", "row_number": 25, "definition": "A security architecture framework used to manage enterprise network access. Authentication verifies who the user is; Authorization determines what permissions and files they can access; Accounting tracks and logs what the user did while connected. Typically deployed via RADIUS or TACACS+ protocols.", "details": []}, {"x": 0.4081280176568669, "y": -0.9000240023247879, "z": -0.1529323917381348, "word": "Access: Remote access", "pos_group": "other", "row_number": 35, "definition": "Technologies that allow a user or administrator to connect securely to a corporate desktop, internal network, or remote server over an internet connection using protocols like RDP (Remote Desktop), SSH, or VPN client software.", "details": []}, {"x": 0.3973867399870493, "y": -0.8994765003273424, "z": -0.1817300312038209, "word": "Access: WPA2 (Wi-Fi Protected Access 2)", "pos_group": "other", "row_number": 38, "definition": "A widely adopted wireless security protocol introduced to replace WEP (Wired Equivalent Privacy) and WPA (Wi-Fi Protected Access). It secures network communication traffic using robust CCMP (Counter Mode Cipher Block Chaining Message Authentication Code Protocol) combined with AES (Advanced Encryption Standard) encryption.", "details": []}, {"x": 0.4266472922861649, "y": -0.8893752542058232, "z": -0.1642672979969264, "word": "Access: WPA3 (Wi-Fi Protected Access 3)", "pos_group": "other", "row_number": 39, "definition": "The latest wireless security standard that builds upon WPA2 (Wi-Fi Protected Access 2). It introduces GCMP (Galois/Counter Mode Protocol) encryption and mandates SAE (Simultaneous Authentication of Equals) to eliminate offline dictionary attacks against pre-shared keys, while adding robust individualized data encryption for open public hotspots.", "details": []}, {"x": 0.3918663211120816, "y": -0.906718986988219, "z": -0.1558892716422176, "word": "AES (Advanced Encryption Standard)", "pos_group": "other", "row_number": 99, "definition": "A highly secure, symmetric block cipher encryption algorithm selected by the US government to protect classified data. It operates with key lengths of 128, 192, or 256 bits and serves as the cryptographic core for modern security systems, including WPA2 (Wi-Fi Protected Access version 2)/WPA3 (Wi-Fi Protected Access version 3) wireless security and BitLocker drive encryption.", "details": []}, {"x": 0.41232797578047, "y": -0.8908090934148596, "z": -0.1909052107150986, "word": "AirDrop, troubleshooting", "pos_group": "other", "row_number": 102, "definition": "A proprietary wireless ad-hoc file transfer protocol developed by Apple that combines Bluetooth (for discovery and connection setup) and point-to-point Wi-Fi (for transferring actual file data) between Apple hardware devices.", "details": []}, {"x": 0.420772744095331, "y": -0.8955275288197734, "z": -0.1448473090962865, "word": "Authentication: Kerberos", "pos_group": "other", "row_number": 185, "definition": "A highly secure, ticket-based computer network authentication protocol used by Microsoft Active Directory (AD) domains. It uses a trusted third party called a Key Distribution Center (KDC) to issue time-stamped, encrypted tickets, allowing secure authentication to occur across insecure networks without transmitting raw passwords.", "details": []}, {"x": 0.3837117352692702, "y": -0.9063062399824416, "z": -0.1771279299984463, "word": "Authentication: RADIUS servers", "pos_group": "other", "row_number": 190, "definition": "Remote Authentication Dial-In User Service (RADIUS) servers. A centralized authentication server technology that allows networking devices (such as wireless access points, Virtual Private Network (VPN) gateways, and network switches) to offload user identity verification tasks to a central user database.", "details": []}, {"x": 0.4321296847458203, "y": -0.883913609899965, "z": -0.1787754619490338, "word": "Authentication: Servers", "pos_group": "other", "row_number": 191, "definition": "Dedicated network infrastructure hardware systems\u2014including Active Directory Domain Controllers, RADIUS servers, or Terminal Access Controller Access-Control System Plus (TACACS+) servers\u2014that centrally process user login requests, evaluate credentials, and hand out security tokens across a network enterprise.", "details": []}, {"x": 0.3981489691595175, "y": -0.9065622864058784, "z": -0.1400793318936076, "word": "Browsers: Secure connections", "pos_group": "other", "row_number": 284, "definition": "Encryption links established over HTTPS (Hypertext Transfer Protocol Secure) using SSL/TLS (Secure Sockets Layer/Transport Layer Security) protocols to encrypt communications between a browser and a web server.", "details": []}, {"x": 0.3971520989398007, "y": -0.8961082367541262, "z": -0.1981419650884734, "word": "Certificate Manager", "pos_group": "other", "row_number": 337, "definition": "A Windows utility used to manage user, computer, and service certificates for SSL/TLS (Secure Sockets Layer/Transport Layer Security) encryption and secure communications.", "details": []}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(n)=>String(n.pos_group||'other');const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+'<br>subcluster: '+(info.pos_group||'other')+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
