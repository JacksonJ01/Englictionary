ich opposes the observance of the Christian Sabbath.", "details": []}, {"x": 0.010215780382405835, "y": -0.9999065528912877, "z": -0.009084234488449238, "word": "Antisacerdotal", "pos_group": "adjective", "row_number": 7148, "definition": "Hostile to priests or the priesthood.", "details": []}, {"x": -0.03903808656238341, "y": -0.9973558080256798, "z": 0.06129779763573269, "word": "Antiscriptural", "pos_group": "adjective", "row_number": 7156, "definition": "Opposed to or not in accordance with the Holy Scriptures.", "details": []}, {"x": -0.05029827064365463, "y": -0.9984420877494494, "z": -0.024155359255832606, "word": "Antitheism", "pos_group": "noun", "row_number": 7185, "definition": "The doctrine of antitheists.", "details": []}, {"x": 0.015904761166941447, "y": -0.9993791511776672, "z": 0.03143804643466384, "word": "Antitheist", "pos_group": "noun", "row_number": 7186, "definition": "A disbeliever in the existence of God.", "details": []}, {"x": -0.07068797170690315, "y": -0.9968782943443724, "z": 0.035169261024634725, "word": "Anubis", "pos_group": "noun", "row_number": 7241, "definition": "An Egyptian deity the conductor of departed spirits represented by a human figure with the head of a dog or fox.", "details": []}, {"x": -0.00920392144553498, "y": -0.9996124993948549, "z": -0.026270494544184213, "word": "Apocalypse", "pos_group": "noun", "row_number": 7444, "definition": "The revelation delivered to St. John in the isle of Patmos near the close of the first century forming the last book of the New Testament.", "details": []}, {"x": -0.013041080122844361, "y": -0.9980618555242866, "z": 0.06084786583477902, "word": "Apocalyptical", "pos_group": "adjective", "row_number": 7447, "definition": "Of or pertaining to a revelation or specifically to the Revelation of St. John; containing or of the nature of a prophetic revelation.", "details": []}, {"x": -0.06920702559639395, "y": -0.9975830248929839, "z": -0.006204518793935503, "word": "Apocrisiarius", "pos_grou gil.", "details": []}, {"x": -0.06971062635142534, "y": -0.9965478248618225, "z": -0.045087263577007264, "word": "Buddha", "pos_group": "noun", "row_number": 20418, "definition": "The title of an incarnation of self-abnegation virtue and wisdom or a deified religious teacher of the Buddhists esp. Gautama Siddartha or Sakya Sinha (or Muni) the founder of Buddhism.", "details": []}, {"x": 0.04436505271425646, "y": -0.9984482449146224, "z": 0.033657752815233186, "word": "Buddhism", "pos_group": "noun", "row_number": 20419, "definition": "The religion based upon the doctrine originally taught by the Hindoo sage Gautama Siddartha surnamed Buddha \"\"\"\"the awakened or enlightened \" in the sixth century b. c. and adopted as a religion by the greater part of the inhabitants of Central and Eastern Asia and the Indian Islands. Buddha's teaching is believed to have been atheistic; yet it was characterized by elevated humanity and morality. It presents release from existence (a beatific enfranchisement Nirvana) as the greatest good. Buddhists believe in transmigration of souls through all phases and forms of life. Their number was estimated in 1881 at 470 0 000.", "details": []}, {"x": -0.09304908301976872, "y": -0.9942675855165685, "z": 0.052667224535125574, "word": "Buddhistic", "pos_group": "adjective", "row_number": 20422, "definition": "Same as Buddhist a.", "details": []}, {"x": -0.004503681714579847, "y": -0.9985132355174807, "z": -0.05432343276548074, "word": "Bull", "pos_group": "other", "row_number": 20612, "definition": "A letter edict or respect of the pope written in Gothic characters on rough parchment sealed with a bulla and dated \"\"\"\"a die Incarnationis \" i. e. \"\"\"\"from the day of the Incarnation.\"\"\"\" See Apostolical brief under Brief.", "details": []}, {"x": 0.002493956624445422, "y": -0.9964130806000181, "z": 0.08458577297357442, "word": "Bulla", "pos_group": "noun", "row_number": 20617, "definition": "A leaden seal for a document; esp. the round leaden seal attached to the papal bulls which has on one side a representation of St. Peter and St. Paul and on the other the name of the pope who uses it.", "details": []}, {"x": -0.09658299733745944, "y": -0.99523649783758, "z": -0.013267931161309471, "word": "Burgher", "pos_group": "noun", "row_number": 20920, "definition": "A member of that party among the Scotch seceders which asserted the lawfulness of the burgess oath (in which burgesses profess \"\"\"\"the true religion professed within the realm\"\"\"\") the opposite party being called antiburghers.", "details": []}, {"x": 0.04268175657598271, "y": -0.9990565269540004, "z": -0.008020199885233873, "word": "Caaba", "pos_group": "noun", "row_number": 21438, "definition": "The small and nearly cubical stone building toward which all Mohammedans must pray.", "details": []}, {"x": -0.06362751660909553, "y": -0.9945738855717692, "z": 0.08230628936376812, "word": "Cabal", "pos_group": "noun", "row_number": 21443, "definition": "Tradition; occult doctrine. See Cabala", "details": []}, {"x": -0.046250692439068944, "y": -0.9973414199942024, "z": -0.05631132579556745, "word": "Cabala", "pos_group": "noun", "row_number": 21450, "definition": "A kind of occult theosophy or traditional interpretation of the Scriptures among Jewish rabbis and certain mediaeval Christians which treats of the nature of god and the mystery of human existence. It assumes that every letter word number and accent of Scripture contains a hidden sense; and it teaches the methods of interpretation for ascertaining these occult meanings. The cabalists pretend even to foretell events by this means.", "details": []}, {"x": 0.034643079804730775, "y": -0.9977261796428909, "z": 0.05781286601479539, "word": "Cabalism", "pos_group": "noun", "row_number": 21453, "definition": "A superstitious devotion to the mysteries of the religion which one professes.", "details": []}, {"x": -0.10220275186341021, "y": -0.9943623981304339, "z": 0.028249224694472764, "w arian. The former considered the election of grace as a remedy for an existing evil; the latter regarded the fall as a part of God's original purpose in regard to men.", "details": []}, {"x": -0.12400961262509283, "y": -0.9882498323299475, "z": -0.08935258740744564, "word": "Initiation", "pos_group": "noun", "row_number": 80025, "definition": "The form or ceremony by which a person is introduced into any society; mode of entrance into an organized body; especially the rite of admission into a secret society or order.", "details": []}, {"x": 0.11452196919098338, "y": -0.9929899848376464, "z": 0.029250787762899674, "word": "Inquisition", "pos_group": "noun", "row_number": 80329, "definition": "A court or tribunal for the examination and punishment of heretics fully established by Pope Gregory IX. in 1235. Its operations were chiefly confined to Spain Portugal and their dependencies and a part of Italy.", "details": []}, {"x": -0.1414603255354922, "y": -0.984576348744215, "z": 0.10294848125593062, "word": "Inquisitional", "pos_group": "adjective", "row_number": 80331, "definition": "Relating to inquiry or inquisition; inquisitorial; also of or pertaining to or characteristic of the Inquisition.", "details": []}, {"x": -0.002514402246305221, "y": -0.9922234982937104, "z": -0.12444359049438834, "word": "Inquisitor", "pos_group": "noun", "row_number": 80340, "definition": "A member of the Court of Inquisition.", "details": []}, {"x": 0.048651613694254726, "y": -0.9893397765561782, "z": 0.13725824932846944, "word": "Inquisitorial", "pos_group": "adjective", "row_number": 80341, "definition": "Pertaining to inquisition; making rigorous and unfriendly inquiry; searching; as inquisitorial power.", "details": []}, {"x": -0.1658558375738594, "y": -0.9859205780787015, "z": -0.021270986428291696, "word": "Inquisitorial", "pos_group": "adjective", "row_number": 80342, "definition": "Pertaining to the Court of Inquisition or resembling its practices.", "details": []}, {"x": 0.09938 fe.", "details": []}, {"x": 0.0026199980732673597, "y": -0.9876802835856342, "z": 0.156463391968528, "word": "Intercessory", "pos_group": "adjective", "row_number": 81215, "definition": "Pertaining to of the nature of or characterized by intercession; interceding; as intercessory prayer.", "details": []}, {"x": -0.14488918896814323, "y": -0.98720687989233, "z": -0.06655598555655262, "word": "Intercommunion", "pos_group": "noun", "row_number": 81267, "definition": "Mutual communion; as an intercommunion of deities.", "details": []}, {"x": 0.11451916715683091, "y": -0.9934196072559333, "z": -0.0016864973090421332, "word": "Intercommunity", "pos_group": "noun", "row_number": 81268, "definition": "Intercommunication; community of possessions religion etc.", "details": []}, {"x": -0.12055632055263214, "y": -0.9847069510660645, "z": 0.1257711974061883, "word": "Interdict", "pos_group": "noun", "row_number": 81304, "definition": "To lay under an interdict; to cut off from the enjoyment of religious privileges as a city a church an individual.", "details": []}, {"x": -0.033340547648821175, "y": -0.9913217563104734, "z": -0.12715967658025482, "word": "Interdict", "pos_group": "noun", "row_number": 81306, "definition": "A prohibition of the pope by which the clergy or laymen are restrained from performing or from attending divine service or from administering the offices or enjoying the privileges of the church.", "details": []}, {"x": 0.07321655437566181, "y": -0.9902601130547558, "z": 0.11842400372449145, "word": "Interim", "pos_group": "noun", "row_number": 81378, "definition": "A name given to each of three compromises made by the emperor Charles V. of Germany for the sake of harmonizing the connecting opinions of Protestants and Catholics.", "details": []}, {"x": -0.17124075513649878, "y": -0.9851860184030788, "z": 0.00922566655425676, "word": "Internal", "pos_group": "adjective", "row_number": 81568, "definition": "Pertaining to the inner being or the heart; spiritual.", "details": []}, {"x": 0.08275683693159577, "y": -0.9937119944844762, "z": -0.07541735847112195, "word": "Internally", "pos_group": "adverb", "row_number": 81573, "definition": "Hence: Mentally; spiritually.", "details": []}, {"x": -0.04733117079980369, "y": -0.9861903196358104, "z": 0.15870858113957795, "word": "Interspiration", "pos_group": "noun", "row_number": 81788, "definition": "Spiritual inspiration at separate times or at intervals.", "details": []}, {"x": -0.10957610687154545, "y": -0.9887336026219117, "z": -0.10197519232230712, "word": "Intinction", "pos_group": "noun", "row_number": 81930, "definition": "A method or practice of the administration of the sacrament by dipping the bread or wafer in the wine and administering both together.", "details": []}, {"x": 0.11241162020218069, "y": -0.9924864721028439, "z": 0.048313873125339815, "word": "Intolerance", "pos_group": "noun", "row_number": 81949, "definition": "The quality of being intolerant; refusal to allow to others the enjoyment of their opinions chosen modes of worship and the like; want of patience and forbearance; illiberality; bigotry; as intolerance shown toward a religious sect.", "details": []}, {"x": -0.1527764971845885, "y": -0.9843840778890137, "z": 0.08744900860846783, "word": "Introit", "pos_group": "noun", "row_number": 82113, "definition": "A psalm sung or chanted immediately before the collect epistle and gospel and while the priest is entering within the rails of the altar.", "details": []}, {"x": 0.016303633619906818, "y": -0.9925599555761934, "z": -0.12066037509212672, "word": "Introit", "pos_group": "noun", "row_number": 82114, "definition": "A part of a psalm or other portion of Scripture read by the priest at Mass immediately after ascending to the altar.", "details": []}, {"x": 0.032226545269230245, "y": -0.9885848294929408, "z": 0.1471784110405578, "word": "Introit", "pos_group": "noun", "row_number": 82115, "definition": "An anthem or psalm sung before the Communion service. and solemn entreaty; esp. prayer offered to a divine being.", "details": []}, {"x": -0.016259001403817093, "y": -0.9869592392116768, "z": 0.1601471354975131, "word": "Invoke", "pos_group": "other", "row_number": 82480, "definition": "To call on for aid or protection; to invite earnestly or solemnly; to summon; to address in prayer; to solicit or demand by invocation; to implore; as to invoke the Supreme Being or to invoke His and blessing.", "details": []}, {"x": -0.1334533078291252, "y": -0.9876536344936213, "z": -0.08203970319915242, "word": "Irenicon", "pos_group": "noun", "row_number": 82627, "definition": "A proposition or device for securing peace especially in the church.", "details": []}, {"x": 0.11655161744387045, "y": -0.9930311188061286, "z": 0.017461888611092838, "word": "Irenics", "pos_group": "noun", "row_number": 82628, "definition": "That branch of Christian science which treats of the methods of securing unity among Christians or harmony and union among the churches; -- called also Irenical theology.", "details": []}, {"x": -0.13498454580641725, "y": -0.9843821439642281, "z": 0.11300870337201793, "word": "Irreligion", "pos_group": "noun", "row_number": 82805, "definition": "The state of being irreligious; want of religion; impiety.", "details": []}, {"x": -0.01407687417475628, "y": -0.9917387482477156, "z": -0.12749939936141763, "word": "Irreligious", "pos_group": "adjective", "row_number": 82807, "definition": "Destitute of religion; not controlled by religious motives or principles; ungodly. Cf. Impious.", "details": []}, {"x": 0.05924797851799362, "y": -0.9895190860683114, "z": 0.13168771904799886, "word": "Irreligious", "pos_group": "adjective", "row_number": 82808, "definition": "Indicating a want of religion; profane; wicked; as irreligious speech.", "details": []}, {"x": -0.1698965027997673, "y": -0.9854110849993056, "z": -0.01000859115460835, "word": "Irvingite", "pos_group": "noun", "row_number": 82944, "definition": "The common designation of one a sect founded by the Rev. Edward Irving (about 1830) who call themselves the Catholic Apostolic Church. They are highly ritualistic in worship have an elaborate hierarchy of apostles prophets etc. and look for the speedy coming of Christ.", "details": []}, {"x": 0.0947632201327748, "y": -0.9936705784014355, "z": -0.060321751710505196, "word": "Isagogical", "pos_group": "adjective", "row_number": 82958, "definition": "Introductory; especially introductory to the study of theology.", "details": []}, {"x": -0.06637545476891787, "y": -0.9855753694438438, "z": 0.15567751973181615, "word": "Isagogics", "pos_group": "noun", "row_number": 82959, "definition": "That part of theological science directly preliminary to actual exegesis or interpretation of the Scriptures.", "details": []}, {"x": -0.09348258341956427, "y": -0.9892313816597603, "z": -0.11261563007294283, "word": "Isapostolic", "pos_group": "adjective", "row_number": 82961, "definition": "Having equal or almost equal authority with the apostles of their teachings.", "details": []}, {"x": 0.10773843633271384, "y": -0.9919166230620958, "z": 0.06703612630268685, "word": "Islam", "pos_group": "noun", "row_number": 83000, "definition": "The religion of the Mohammedans; Mohammedanism; Islamism. Their formula of faith is: There is no God but Allah and Mohammed is his prophet.", "details": []}, {"x": -0.16197285560583866, "y": -0.9842758294915438, "z": 0.07046903948276498, "word": "Islamism", "pos_group": "noun", "row_number": 83002, "definition": "The faith doctrines or religious system of the Mohammedans; Mohammedanism; Islam.", "details": []}, {"x": 0.034558745297178686, "y": -0.9928390116537434, "z": -0.11435204441505348, "word": "Islamize", "pos_group": "other", "row_number": 83007, "definition": "To conform or cause to conform to the religion of Islam.", "details": []}, {"x": 0.014510886770149887, "y": -0.9878306694860275, "z": 0.15485477902838699, "word": "Ismaelite", "pos_group": "noun", "row_number": 83023, "definition": "One of a sect of Mohammedans who favored the pretensions of the family of Mohammed ben Ismael of the house Ali.", "details": []}, {"x": -0.15256072525803194, "y": -0.9866291766527935, "z": -0.0573418946859462, "word": "Itinerant", "pos_group": "adjective", "row_number": 83263, "definition": "One who travels from place to place particularly a preacher; one who is unsettled.", "details": []}, {"x": 0.11395797351883691, "y": -0.9933913774080176, "z": -0.013680334896539529, "word": "Izedi", "pos_group": "noun", "row_number": 83302, "definition": "One of an Oriental religious sect which worships Satan or the Devil.", "details": []}, {"x": -0.11203210697744427, "y": -0.9845967334530307, "z": 0.13423143998265283, "word": "Izedism", "pos_group": "noun", "row_number": 83303, "definition": "The religion of the Izedis.", "details": []}, {"x": -0.045332248022775024, "y": -0.9907827024729734, "z": -0.12765039666821704, "word": "Jacobin", "pos_group": "noun", "row_number": 83407, "definition": "A Dominican friar; -- so named because before the French Revolution that order had a convent in the Rue St. Jacques Paris.", "details": []}, {"x": 0.08239645958676925, "y": -0.9904356662761544, "z": 0.11067074778673915, "word": "Jacobite", "pos_group": "noun", "row_number": 83419, "definition": "One of the sect of Syrian Monophysites. The sect is named after Jacob Baradaeus its leader in the sixth century.", "details": []}, {"x": -0.1727626231803598, "y": -0.9847365780352061, "z": 0.021141142621755496, "word": "Jah", "pos_group": "noun", "row_number": 83481, "definition": "Jehovah.", "details": []}, {"x": 0.07583705884654286, "y": -0.9934694564228931, "z": -0.08524775457633696, "word": "Jaina", "pos_group": "noun", "row_number": 83486, "definition": "One of a numerous sect in British India holding the tenets of Jainism.", "details": []}, {"x": -0.03558085154874416, "y": -0.9862679513128538, "z": 0.16127470730468696, "word": "Jainism", "pos_group": "noun", "row_number": 8 tic dance; mystic Babylon.", "details": []}, {"x": 0.12897642585071836, "y": -0.9915239511760078, "z": -0.015663199516446277, "word": "Mystic", "pos_group": "noun", "row_number": 100506, "definition": "One given to mysticism; one who holds mystical views interpretations etc.; especially in ecclesiastical history one who professed mysticism. See Mysticism.", "details": []}, {"x": -0.1216728273431301, "y": -0.9818142589628258, "z": 0.14572743044329667, "word": "Mysticism", "pos_group": "noun", "row_number": 100509, "definition": "The doctrine of the Mystics who professed a pure sublime and wholly disinterested devotion and maintained that they had direct intercourse with the divine Spirit and aquired a knowledge of God and of spiritual things unattainable by the natural intellect and such as can not be analyzed or explained.", "details": []}, {"x": -0.04590173789539562, "y": -0.988693686354117, "z": -0.14275091951258673, "word": "Mythographer", "pos_group": "noun", "row_number": 100523, "definition": "A composer of fables.", "details": []}, {"x": 0.09309774240488125, "y": -0.9882389118355215, "z": 0.12131225615435097, "word": "Mythologist", "pos_group": "noun", "row_number": 100528, "definition": "One versed in or who writes on mythology or myths.", "details": []}, {"x": -0.18774477333295705, "y": -0.9820057560368347, "z": 0.02041066379815509, "word": "Nativies", "pos_group": "other", "row_number": 100933, "definition": "of Nativity", "details": []}, {"x": 0.08745754367380741, "y": -0.9916338782106415, "z": -0.0949390838351951, "word": "Naturalist", "pos_group": "noun", "row_number": 100965, "definition": "One who holds or maintains the doctrine of naturalism in religion.", "details": []}, {"x": -0.03751377200816661, "y": -0.9836463629331145, "z": 0.17616057901294224, "word": "Nave", "pos_group": "noun", "row_number": 101048, "definition": "The middle or body of a church extending from the transepts to the principal entrances or if there are no transepts from the choi rch in a spiritual court.", "details": []}, {"x": 0.002789292819024786, "y": -0.9843571070939543, "z": -0.1761627246587406, "word": "Sponsor", "pos_group": "noun", "row_number": 146854, "definition": "One who at the baptism of an infant professore the christian faith in its name and guarantees its religious education; a godfather or godmother.", "details": []}, {"x": 0.07999682662622873, "y": -0.9806714157361347, "z": 0.1785611438354339, "word": "Stabat Mater", "pos_group": "other", "row_number": 147655, "definition": "A celebrated Latin hymn beginning with these words commemorating the sorrows of the mother of our Lord at the foot of the cross. It is read in the Mass of the Sorrows of the Virgin Mary and is sung by Catholics when making \"\"\"\"the way of the cross\"\"\"\" (Via Crucis). See Station 7 (c).", "details": []}, {"x": -0.21650595168829617, "y": -0.9757896797758653, "z": -0.03097860110559877, "word": "Stall", "pos_group": "other", "row_number": 147919, "definition": "A seat in the choir of a church for one of the officiating clergy. It is inclosed either wholly or partially at the back and sides. The stalls are frequently very rich with canopies and elaborate carving.", "details": []}, {"x": 0.14359494133421724, "y": -0.986656014349333, "z": -0.0767489555076259, "word": "Stamp", "pos_group": "other", "row_number": 148004, "definition": "A character or reputation good or bad fixed on anything as if by an imprinted mark; current value; authority; as these persons have the stamp of dishonesty; the Scriptures bear the stamp of a divine origin.", "details": []}, {"x": -0.09094642452309627, "y": -0.9754908793009296, "z": 0.2003653968807087, "word": "Stand", "pos_group": "noun", "row_number": 148048, "definition": "To have or maintain a position order or rank; to be in a particular relation; as Christian charity or love stands first in the rank of gifts.", "details": []}, {"x": -0.1052179354292399, "y": -0.9810684682040983, "z": -0.16258489093292816, "word": "Station", "pos_group": "noun", "row_number": 148402, "definition": "The fast of the fourth and sixth days of the week Wednesday and Friday in memory of the council which condemned Christ and of his passion.", "details": []}, {"x": 0.15044693856669594, "y": -0.9839894120948053, "z": 0.09555394058451243, "word": "Station", "pos_group": "noun", "row_number": 148403, "definition": "A church in which the procession of the clergy halts on stated days to say stated prayers.", "details": []}, {"x": -0.21237374678141394, "y": -0.9740808918456766, "z": 0.07787045536758685, "word": "Station", "pos_group": "noun", "row_number": 148404, "definition": "One of the places at which ecclesiastical processions pause for the performance of an act of devotion; formerly the tomb of a martyr or some similarly consecrated spot; now especially one of those representations of the successive stages of our Lord's passion which are often placed round the naves of large churches and by the side of the way leading to sacred edifices or shrines and which are visited in rotation stated services being performed at each; -- called also Station of the cross.", "details": []}, {"x": 0.06703100145798582, "y": -0.985752876712707, "z": -0.15426636346320718, "word": "Stercoranism", "pos_group": "noun", "row_number": 148889, "definition": "The doctrine or belief of the Stercoranists.", "details": []}, {"x": 0.017852250142416915, "y": -0.9784277832956376, "z": 0.20581635027382364, "word": "Stercoranist", "pos_group": "noun", "row_number": 148890, "definition": "A nickname formerly given to those who held or were alleged to hold that the consecrated elements in the eucharist undergo the process of digestion in the body of the recipient.", "details": []}, {"x": -0.18910163796781154, "y": -0.977535541784859, "z": -0.09308509582781319, "word": "Stercorianism", "pos_group": "noun", "row_number": 148895, "definition": "The doctrine or belief of the Stercoranists.", "details": []}, {"x": 0.16534302855433736, "y": -0.9861580340370157, "z": -0.012410270453446146, "word": "Steward", "pos_group": "noun", "row_number": 149050, "definition": "A fiscal agent of certain bodies; as a steward in a Methodist church.", "details": []}, {"x": -0.15043229190544763, "y": -0.9743117646962232, "z": 0.16759090287544126, "word": "Stigma", "pos_group": "other", "row_number": 149191, "definition": "Marks believed to have been supernaturally impressed upon the bodies of certain persons in imitation of the wounds on the crucified body of Christ. See def. 5 above.", "details": []}, {"x": -0.03922831190703273, "y": -0.9831385473329862, "z": -0.1786049727552694, "word": "Stigmatic", "pos_group": "noun", "row_number": 149196, "definition": "A person bearing the wounds on the hands and feet resembling those of Jesus Christ caused by His crucifixion; -- for true stigmantics the wounds are supposed to have been caused miraculously as a sign of great holiness.", "details": []}, {"x": 0.11262337436538897, "y": -0.9819483825510876, "z": 0.1519649615926523, "word": "Stigmatist", "pos_group": "noun", "row_number": 149202, "definition": "One believed to be supernaturally impressed with the marks of Christ's wounds. See Stigma 8.", "details": []}, {"x": -0.22259059856289715, "y": -0.9748534175854172, "z": 0.010688295160739457, "word": "Stoic", "pos_group": "noun", "row_number": 149546, "definition": "A disciple of the philosopher Zeno; one of a Greek sect which held that men should be free from passion unmoved by joy or grief and should submit without complaint to unavoidable necessity by which all things are governed.", "details": []}, {"x": 0.11994052580707194, "y": -0.9864878854649686, "z": -0.11160610243162301, "word": "Stoical", "pos_group": "noun", "row_number": 149549, "definition": "Of or pertaining to the Stoics; resembling the Stoics or their doctrines.", "details": []}, {"x": -0.04996288411565255, "y": -0.9764037035921682, "z": 0.21009406898421304, "word": "Stool", "pos_group": "noun", "row_number": 149705, "definition": "A bishop's seat or see; a bishop-stool.", "details": []}, {"x": -0.14199772252114445, "y": -0.9796185607155291, "z": -0.14207083550272723, "word": "Stoup", "pos_group": "noun", "row_number": 149871, "definition": "A basin at the entrance of Roman Catholic churches for containing the holy water with which those who enter dipping their fingers in it cross themselves; -- called also holy-water stoup.", "details": []}, {"x": 0.16370711756381334, "y": -0.9849431612636297, "z": 0.05556031622440156, "word": "Strict", "pos_group": "adjective", "row_number": 150358, "definition": "Governed or governing by exact rules; observing exact rules; severe; rigorous; as very strict in observing the Sabbath.", "details": []}, {"x": -0.19513318583914127, "y": -0.9738528077833822, "z": 0.11633464039867839, "word": "Stylite", "pos_group": "noun", "row_number": 151041, "definition": "One of a sect of anchorites in the early church who lived on the tops of pillars for the exercise of their patience; -- called also pillarist and pillar saint.", "details": []}, {"x": 0.028345174585287167, "y": -0.984863555189914, "z": -0.1709980372297084, "word": "Subdeacon", "pos_group": "noun", "row_number": 151213, "definition": "One belonging to an order in the Roman Catholic Church next interior to the order of deacons; also a member of a minor order in the Greek Church.", "details": []}, {"x": 0.05767410403681523, "y": -0.9796959662942308, "z": 0.19201435193850505, "word": "Subdivine", "pos_group": "adjective", "row_number": 151239, "definition": "Partaking of divinity; divine in a partial or lower degree.", "details": []}, {"x": -0.20913191338975493, "y": -0.9762829350516338, "z": -0.05599529916794445, "word": "Subreligion", "pos_group": "noun", "row_number": 151580, "definition": "A secondary religion; a belief or principle held in a quasi religious veneration.", "details": []}, {"x": 0.15506037097308442, "y": -0.9864653284235421, "z": -0.053314511832359315, "word": "Subscription", "pos_group": "noun", "row_number": 151621, "definition": "The acceptance of articles or other tests tending to promote uniformity; esp. (Ch. of Eng.) formal assent to the Thirty-nine Articles and the Book of Common Prayer required before ordination.", "details": []}, {"x": -0.11522165834253967, "y": -0.9748398395452117, "z": 0.19081733853154162, "word": "Substitution", "pos_group": "noun", "row_number": 151744, "definition": "The doctrine that Christ suffered vicariously being substituted for the sinner and that his sufferings were expiatory.", "details": []}, {"x": -0.08086917415194955, "y": -0.9817806006735306, "z": -0.17195065807697005, "word": "Suburbicary", "pos_group": "adjective", "row_number": 151882, "definition": "Being in the suburbs; -- applied to the six dioceses in the suburbs of Rome subject to the pope as bishop of Rome.", "details": []}, {"x": 0.13882815574520224, "y": -0.983151401476304, "z": 0.11891200506073918, "word": "Succursal", "pos_group": "other", "row_number": 152003, "definition": "Serving to aid or help; serving as a chapel of ease; tributary.", "details": []}, {"x": -0.21958027345767067, "y": -0.9741657204423906, "z": 0.05277928213999109, "word": "Sudarium", "pos_group": "noun", "row_number": 152075, "definition": "The handkerchief upon which the Savior is said to have impressed his own portrait miraculously when wiping his face with it as he passed to the crucifixion.", "details": []}, {"x": 0.08929516478199148, "y": -0.986027169473628, "z": -0.14062999184520494, "word": "Suffrage", "pos_group": "noun", "row_number": 152187, "definition": "A prayer in general as one offered for the faithful departed.", "details": []}, {"x": -0.00776578384878602, "y": -0.9774995044749706, "z": 0.2107947137676861, "word": "Sufism", "pos_group": "noun", "row_number": 152213, "definition": "A refined mysticism among certain classes of Mohammedans particularly in Persia who hold to a kind of pantheism and practice extreme asceticism in their lives.", "details": []}, {"x": -0.1735743532114902, "y": -0.9781915131373048, "z": -0.11407588497733873, "word": "Sulpician", "pos_group": "noun", "row_number": 152412, "definition": "One of an order of priests established in France in 1642 to educate men for the ministry. The order was introduced soon afterwards into Canada and in 1791 into the United States.", "details": []}, {"x": 0.16807892628768148, "y": -0.9856802248837486, "z": 0.013563510279546588, "word": "Sunday", "pos_group": "noun", "row_number": 152527, "definition": "The first day of the week -- consecrated among Christians to rest from secular employments and to religious worship; the Christian Sabbath; the Lord's Day.", "details": []}, {"x": -0.1699874251186427, "y": -0.9739215236546214, "z": 0.15027022680423083, "word": "Sunday", "pos_group": "adjective", "row_number": 152528, "definition": "Belonging to the Christian Sabbath.", "details": []}, {"x": -0.013109368987373115, "y": -0.9837532839626921, "z": -0.17904642062150147, "word": "Sunna", "pos_group": "noun", "row_number": 152565, "definition": "A collection of traditions received by the orthodox Mohammedans as of equal authority with the Koran.", "details": []}, {"x": 0.09367205338622547, "y": -0.9809932140237732, "z": 0.16993487121163767, "word": "Sunniah", "pos_group": "noun", "row_number": 152566, "definition": "One of the sect of Sunnites.", "details": []}, {"x": -0.22075252441147947, "y": -0.9752085419919216, "z": -0.015382541790924213, "word": "Sunnite", "pos_group": "noun", "row_number": 152568, "definition": "One of the orthodox Mohammedans who receive the Sunna as of equal importance with the Koran.", "details": []}, {"x": 0.13619890336860474, "y": -0.986480756602106, "z": -0.09113493059703262, "word": "Supereminent", "pos_group": "adjective", "row_number": 152659, "definition": "Eminent in a superior degree; surpassing others in excellence; as a supereminent divine; the supereminent glory of Christ.", "details": []}, {"x": -0.07576991069269245, "y": -0.9756202007921329, "z": 0.20597122235870724, "word": "Superior", "pos_group": "noun", "row_number": 152756, "definition": "The head of a monastery convent abbey or the like.", "details": []}, {"x": -0.12018404251409917, "y": -0.9803425636796862, "z": -0.15647445083114817, "word": "Supernal", "pos_group": "adjective", "row_number": 152779, "definition": "Relating or belonging to things above; celestial; heavenly; as supernal grace.", "details": []}, {"x": 0.15735977336183748, "y": -0.9842202509813022, "z": 0.0809221804316566, "word": "Supernaturalism", "pos_group": "noun", "row_number": 152785, "definition": "The doctrine of a divine and supernatural agency in the production of the miracles and revelations recorded in the Bible and in the grace which renews and sanctifies men -- in opposition to the doctrine which denies the agency of any other than physical or natural causes in the case.", "details": []}, {"x": -0.2075790769763717, "y": -0.9737560973747127, "z": 0.093327325190464, "word": "Supernaturalist", "pos_group": "noun", "row_number": 152786, "definition": "One who holds to the principles of supernaturalism.", "details": []}, {"x": 0.05306418482562395, "y": -0.9852905820274401, "z": -0.1624397157619412, "word": "Supernaturalize", "pos_group": "other", "row_number": 152789, "definition": "To treat or regard as supernatural.", "details": []}, {"x": 0.03367621912192699, "y": -0.9787241090112352, "z": 0.20239819837591275, "word": "Superordination", "pos_group": "noun", "row_number": 152799, "definition": "The ordination of a person to fill a station already occupied; especially the ordination by an ecclesiastical official during his lifetime of his successor.", "details": []}, {"x": -0.19844991141752924, "y": -0.976850507145616, "z": -0.0798794050286259, "word": "Supersecular", "pos_group": "adjective", "row_number": 152837, "definition": "Being above the world or secular things.", "details": []}, {"x": 0.1633222733212946, "y": -0.986161602589995, "z": -0.028480319771684783, "word": "Superstition", "pos_group": "noun", "row_number": 152859, "definition": "An ignorant or irrational worship of the Supreme Deity; excessive exactness or rigor in religious opinions or practice; extreme and unnecessary scruples in the observance of religious rites not commanded or of points of minor importance; also a rite or practice proceeding from excess of sculptures in religion.", "details": []}, {"x": -0.138080718420063, "y": -0.9742813619842153, "z": 0.17807173523830683, "word": "Superstition", "pos_group": "noun", "row_number": 152860, "definition": "The worship of a false god or gods; false religion; religious veneration for objects.", "details": []}, {"x": -0.05540474434503833, "y": -0.9824694493757105, "z": -0.1780002678297128, "word": "Superstitious", "pos_group": "adjective", "row_number": 152864, "definition": "Of or pertaining to superstition; proceeding from or manifesting superstition; as superstitious rites; superstitious observances.", "details": []}, {"x": 0.12414716609004717, "y": -0.9822553130917193, "z": 0.14057731344316832, "word": "Superstitious", "pos_group": "adjective", "row_number": 152865, "definition": "Evincing superstition; overscrupulous and rigid in religious observances; addicted to superstition; full of idle fancies and scruples in regard to religion.", "details": []}, {"x": -0.22338610545221108, "y": -0.9743596733367296, "z": 0.02686772908221018, "word": "Supersubstantial", "pos_group": "adjective", "row_number": 152878, "definition": "More than substantial; spiritual.", "details": []}, {"x": 0.10960649362028252, "y": -0.9861987706239265, "z": -0.1240902952535895, "word": "Supping", "pos_group": "noun", "row_number": 152929, "definition": "The act of one who sups; the act of taking supper.", "details": []}, {"x": -0.03390515630117656, "y": -0.9766137060985385, "z": 0.2123113502304348, "word": "Supplicate", "pos_group": "other", "row_number": 152977, "definition": "To entreat for; to seek by earnest prayer; to ask for earnestly and humbly; as to supplicate blessings on Christian efforts to spread the gospel.", "details": []}, {"x": -0.15532467507804357, "y": -0.9788877190422763, "z": -0.13286488934293145, "word": "Supplicate", "pos_group": "other", "row_number": 152978, "definition": "To address in prayer; to entreat as a supplicant; as to supplicate the Deity.", "details": []}, {"x": 0.1673208283207587, "y": -0.9851007464833283, "z": 0.03975248027537714, "word": "Supplication", "pos_group": "noun", "row_number": 152981, "definition": "The act of supplicating; humble and earnest prayer as in worship.", "details": []}, {"x": -0.18711219843711394, "y": -0.9736411658795115, "z": 0.13042969485824782, "word": "Supplication", "pos_group": "noun", "row_number": 152983, "definition": "A religious solemnity observed in consequence of some military success and also in times of distress and danger to avert the anger of the gods.", "details": []}, {"x": 0.012919889087900224, "y": -0.9843078143083436, "z": -0.1759863720788848, "word": "Supply", "pos_group": "noun", "row_number": 152999, "definition": "A person who fills a place for a time; one who supplies the place of another; a substitute; esp. a clergyman who supplies a vacant pulpit.", "details": []}, {"x": 0.072421909107999, "y": -0.9800171015245677, "z": 0.18526075623438903, "word": "Support", "pos_group": "other", "row_number": 153009, "definition": "To furnish with the means of sustenance or livelihood; to maintain; to provide for; as to support a family; to support the ministers of the gospel.", "details": []}, {"x": -0.21543401420957578, "y": -0.9756549526183677, "z": -0.04105604648281502, "word": "Supralapsarian", "pos_group": "noun", "row_number": 153104, "definition": "One of that class of Calvinists who believed that God's decree of election determined that man should fall in order that the opportunity might be furnished of securing the redemption of a part of the race the decree of salvation being conceived of as formed before or beyond and not after or following the lapse or fall. Cf. Infralapsarian.", "details": []}, {"x": 0.14962321253332217, "y": -0.986360101872281, "z": -0.06860498309679855, "word": "Supranaturalism", "pos_group": "noun", "row_number": 153118, "definition": "The state of being supernatural; belief in supernatural agency or revelation; supernaturalism.", "details": []}, {"x": -0.10087823393040866, "y": -0.9749130022889937, "z": 0.19841426331527237, "word": "Surname", "pos_group": "noun", "row_number": 153320, "definition": "A name or appellation which is added to or over and above the baptismal or Christian name and becomes a family name.", "details": []}, {"x": -0.09656601065256562, "y": -0.9810677490165028, "z": -0.16787220563970878, "word": "Suspend", "pos_group": "noun", "row_number": 153496, "definition": "To make to depend; as God hath suspended the promise of eternal life on the condition of obedience and holiness of life.", "details": []}, {"x": 0.1476521177068575, "y": -0.9834194386481416, "z": 0.10528561072461082, "word": "Swaddler", "pos_group": "noun", "row_number": 153639, "definition": "A term of contempt for an Irish Methodist.", "details": []}, {"x": -0.21687346920415732, "y": -0.9737732780034206, "z": 0.06878590990767024, "word": "Swear", "pos_group": "other", "row_number": 153855, "definition": "To make an appeal to God in an irreverant manner; to use the name of God or sacred things profanely; to call upon God in imprecation; to curse.", "details": []}, {"x": 0.07649611569562599, "y": -0.9856277166973796, "z": -0.15061988036574667, "word": "Swearer", "pos_group": "noun", "row_number": 153860, "definition": "One who swears; one who calls God to witness for the truth of his declaration.", "details": []}, {"x": 0.008424291617625842, "y": -0.9777710849664228, "z": 0.2095059347949968, "word": "Swedenborgian", "pos_group": "noun", "row_number": 153892, "definition": "One who holds the doctrines of the New Jerusalem church as taught by Emanuel ivinity and humanity.", "details": []}, {"x": 0.1069179972523234, "y": -0.9856908787757974, "z": -0.13031513097775088, "word": "Theanthropism", "pos_group": "noun", "row_number": 157488, "definition": "A state of being God and man.", "details": []}, {"x": -0.027698774309031518, "y": -0.9762077653812169, "z": 0.2150608674566072, "word": "Theanthropism", "pos_group": "noun", "row_number": 157489, "definition": "The ascription of human atributes to the Deity or to a polytheistic deity; anthropomorphism.", "details": []}, {"x": -0.16173618329350217, "y": -0.9781373055403165, "z": -0.13072420787283395, "word": "Thearchic", "pos_group": "adjective", "row_number": 157492, "definition": "Divinely sovereign or supreme.", "details": []}, {"x": 0.1706206007369717, "y": -0.9847563990498203, "z": 0.03381486558579714, "word": "Thearchy", "pos_group": "noun", "row_number": 157493, "definition": "Government by God; divine sovereignty; theocracy.", "details": []}, {"x": -0.18551348813364807, "y": -0.9730425578850264, "z": 0.13701432868518534, "word": "Theatine", "pos_group": "noun", "row_number": 157501, "definition": "One of an order of Italian monks established in 1524 expressly to oppose Reformation and to raise the tone of piety among Roman Catholics. They hold no property nor do they beg but depend on what Providence sends. Their chief employment is preaching and giving religious instruction.", "details": []}, {"x": 0.007313962520706094, "y": -0.9836780576430062, "z": -0.17978872284970626, "word": "Theatine", "pos_group": "noun", "row_number": 157502, "definition": "One of an order of nuns founded by Ursula Benincasa who died in 1618.", "details": []}, {"x": 0.07914226749521275, "y": -0.9796876266766384, "z": 0.18425160957889003, "word": "Thebaic", "pos_group": "adjective", "row_number": 157508, "definition": "Of or pertaining to Thebes in Egypt; specifically designating a version of the Bible preserved by the Copts and esteemed of great value by biblical scholars. This version is also called the Sahidic version.", "details": []}, {"x": -0.21968548654811235, "y": -0.9749138328005011, "z": -0.03579532950477909, "word": "Thee", "pos_group": "other", "row_number": 157533, "definition": "The objective case of thou. See Thou.", "details": []}, {"x": 0.14922343686485304, "y": -0.9859257382798616, "z": -0.07538437827262999, "word": "Theism", "pos_group": "noun", "row_number": 157542, "definition": "The belief or acknowledgment of the existence of a God as opposed to atheism pantheism or polytheism.", "details": []}, {"x": -0.09598417305687315, "y": -0.974438018732215, "z": 0.20311963512133363, "word": "Themis", "pos_group": "noun", "row_number": 157557, "definition": "The goddess of law and order; the patroness of existing rights.", "details": []}, {"x": -0.1033313954556891, "y": -0.9803458849173259, "z": -0.16806120503806077, "word": "Theochristic", "pos_group": "adjective", "row_number": 157580, "definition": "Anointed by God.", "details": []}, {"x": 0.15278634453574164, "y": -0.9831023186113578, "z": 0.10082739738968707, "word": "Theocracy", "pos_group": "noun", "row_number": 157581, "definition": "Government of a state by the immediate direction or administration of God; hence the exercise of political authority by priests as representing the Deity.", "details": []}, {"x": -0.21762614361209645, "y": -0.9731062347982251, "z": 0.0755189871048919, "word": "Theocrasy", "pos_group": "noun", "row_number": 157583, "definition": "A mixture of the worship of different gods as of Jehovah and idols.", "details": []}, {"x": 0.07252301101787222, "y": -0.985071923665704, "z": -0.15612084447136174, "word": "Theocrasy", "pos_group": "noun", "row_number": 157584, "definition": "An intimate union of the soul with God in contemplation -- an ideal of the Neoplatonists and of some Oriental mystics.", "details": []}, {"x": 0.015088535219293929, "y": -0.9774012559668667, "z": 0.21085331616867642, "word": "Theocrat", "pos_group": "noun", "row_number": 157585, "definition": "One who lives under a theocratic form of government; one who in civil affairs conforms to divine law.", "details": []}, {"x": -0.19043263192237647, "y": -0.9767250755581579, "z": -0.09870936872975766, "word": "Theocratical", "pos_group": "adjective", "row_number": 157587, "definition": "Of or pertaining to a theocracy; administred by the immediate direction of God; as the theocratical state of the Israelites.", "details": []}, {"x": 0.170154116197123, "y": -0.9853745050321853, "z": -0.009201172411807998, "word": "Theodicy", "pos_group": "noun", "row_number": 157589, "definition": "That department of philosophy which treats of the being perfections and government of God and the immortality of the soul.", "details": []}, {"x": -0.15611287437328522, "y": -0.9732725129376673, "z": 0.16843214068255813, "word": "Theogony", "pos_group": "noun", "row_number": 157595, "definition": "The generation or genealogy of the gods; that branch of heathen theology which deals with the origin and descent of the deities; also a poem treating of such genealogies; as the Theogony of Hesiod.", "details": []}, {"x": -0.03557630611684443, "y": -0.9824495840176499, "z": -0.18310418156510527, "word": "Theologaster", "pos_group": "noun", "row_number": 157596, "definition": "A pretender or quack in theology.", "details": []}, {"x": 0.11300165902315212, "y": -0.9809985368404093, "z": 0.15771016382906794, "word": "Theologer", "pos_group": "noun", "row_number": 157597, "definition": "A theologian.", "details": []}, {"x": -0.22671588616523647, "y": -0.9739381386680677, "z": 0.006664008410208776, "word": "Theologian", "pos_group": "noun", "row_number": 157598, "definition": "A person well versed in theology; a professor of theology or divinity; a divine.", "details": []}, {"x": 0.1257311370993771, "y": -0.9857825454535413, "z": -0.11146503596569832, "word": "Theologic", "pos_group": "adjective", "row_number": 157599, "definition": "Theological.", "details": []}, {"x": -0.05429406073495756, written memorials; custom or practice long observed.", "details": []}, {"x": -0.025367508578937173, "y": -0.9824354716268331, "z": -0.1848703156211387, "word": "Tradition", "pos_group": "noun", "row_number": 160643, "definition": "An unwritten code of law represented to have been given by God to Moses on Sinai.", "details": []}, {"x": 0.10668104201685524, "y": -0.9803559147768891, "z": 0.16589585780292063, "word": "Tradition", "pos_group": "noun", "row_number": 160644, "definition": "That body of doctrine and discipline or any article thereof supposed to have been put forth by Christ or his apostles and not committed to writing.", "details": []}, {"x": -0.22757236040334192, "y": -0.973754285670793, "z": -0.0036622285858696185, "word": "Traditionlism", "pos_group": "noun", "row_number": 160648, "definition": "A system of faith founded on tradition; esp. the doctrine that all religious faith is to be based solely upon what is delivered from competent authority exclusive of rational processes.", "details": []}, {"x": 0.1333490092263011, "y": -0.9855507094266954, "z": -0.10444060937634018, "word": "Traditionalist", "pos_group": "noun", "row_number": 160649, "definition": "An advocate of or believer in traditionalism; a traditionist.", "details": []}, {"x": -0.06464158001590106, "y": -0.9747342765071781, "z": 0.2138096263854263, "word": "Traditionaries", "pos_group": "other", "row_number": 160653, "definition": "of Traditionary", "details": []}, {"x": -0.13364056499159313, "y": -0.9788673235140534, "z": -0.15478682871989163, "word": "Traditionary", "pos_group": "noun", "row_number": 160654, "definition": "One among the Jews who acknowledges the authority of traditions and explains the Scriptures by them.", "details": []}, {"x": 0.1661782344869772, "y": -0.9835700292009272, "z": 0.07053220569696023, "word": "Traditor", "pos_group": "noun", "row_number": 160658, "definition": "A deliverer; -- a name of infamy given to Christians who delivered the Scriptures or the goods of ": "Tritheite", "pos_group": "noun", "row_number": 162373, "definition": "A tritheist.", "details": []}, {"x": 0.06828656386063413, "y": -0.9845075732032597, "z": -0.16149855572585123, "word": "Triune", "pos_group": "adjective", "row_number": 162426, "definition": "Being three in one; -- an epithet used to express the unity of a trinity of persons in the Godhead.", "details": []}, {"x": 0.021863579171080595, "y": -0.9770398464245605, "z": 0.21193188151974904, "word": "TRUE", "pos_group": "noun", "row_number": 162740, "definition": "Actual; not counterfeit adulterated or pretended; genuine; pure; real; as true balsam; true love of country; a true Christian.", "details": []}, {"x": -0.19613465102038702, "y": -0.9759689366996122, "z": -0.0949517417772803, "word": "Trumpet", "pos_group": "noun", "row_number": 162786, "definition": "One who praises or propagates praise or is the instrument of propagating it.", "details": []}, {"x": 0.1718387617029389, "y": -0.9849975398015179, "z": -0.015852020734207804, "word": "Truth", "pos_group": "noun", "row_number": 162927, "definition": "Righteousness; true religion.", "details": []}, {"x": -0.15284204155530426, "y": -0.9727312094510776, "z": 0.17445143878182945, "word": "Turlupin", "pos_group": "noun", "row_number": 163447, "definition": "One of the precursors of the Reformation; -- a nickname corresponding to Lollard etc.", "details": []}, {"x": -0.042032824393813374, "y": -0.9817714204112898, "z": -0.1853594339036382, "word": "Twelfth-night", "pos_group": "noun", "row_number": 163714, "definition": "The evening of Epiphany or the twelfth day after Christmas observed as a festival by various churches.", "details": []}, {"x": 0.1193039024067634, "y": -0.9806866108759406, "z": 0.15498499965860854, "word": "Twelfthtide", "pos_group": "noun", "row_number": 163716, "definition": "The twelfth day after Christmas; Epiphany; -- called also Twelfth-day.", "details": []}, {"x": -0.22950014132571636, "y": -0.9732230306754951, "z": 0.012908  170210, "definition": "Of or pertaining to the Vulgate or the old Latin version of the Scriptures.", "details": []}, {"x": 0.17758857217396812, "y": -0.9835870480258848, "z": 0.03191892838014974, "word": "Wafer", "pos_group": "noun", "row_number": 170290, "definition": "A thin cake or piece of bread (commonly unleavened circular and stamped with a crucifix or with the sacred monogram) used in the Eucharist as in the Roman Catholic Church.", "details": []}, {"x": -0.18931526264138154, "y": -0.9714397882922032, "z": 0.14305407737574036, "word": "Wahabee", "pos_group": "noun", "row_number": 170378, "definition": "A follower of Abdel Wahab (b. 1691; d. 1787) a reformer of Mohammedanism. His doctrines prevail particularly among the Bedouins and the sect though checked in its influence extends to most parts of Arabia and also into India.", "details": []}, {"x": 0.006089356068198903, "y": -0.9823642089232075, "z": -0.1868782511940734, "word": "Wake", "pos_group": "noun", "row_number": 170469, "definition": "An annual parish festival formerly held in commemoration of the dedication of a church. Originally prayers were said on the evening preceding and hymns were sung during the night in the church; subsequently these vigils were discontinued and the day itself often with succeeding days was occupied in rural pastimes and exercises attended by eating and drinking often to excess.", "details": []}, {"x": 0.08488476693395772, "y": -0.9783811836632195, "z": 0.1885864146653343, "word": "Waldenses", "pos_group": "other", "row_number": 170487, "definition": "A sect of dissenters from the ecclesiastical system of the Roman Catholic Church who in the 13th century were driven by persecution to the valleys of Piedmont where the sect survives. They profess substantially Protestant principles.", "details": []}, {"x": -0.2267918448719991, "y": -0.9733077148707484, "z": -0.03517884694865927, "word": "Waldensian", "pos_group": "noun", "row_number": 170489, "definition": "One Holding the Waldensian doctrines.", "details": []}, {"x": 0.15409628079708246, "y": -0.984754149023131, "z": -0.08070689082250583, "word": "Water god", "pos_group": "other", "row_number": 171249, "definition": "A fabulous deity supposed to dwell in and preside over some body of water.", "details": []}, {"x": -0.09592810410076402, "y": -0.972925441254567, "z": 0.21027097898483035, "word": "Waverer", "pos_group": "noun", "row_number": 171506, "definition": "One who wavers; one who is unsettled in doctrine faith opinion or the like.", "details": []}, {"x": -0.10814948148579116, "y": -0.9789017382587654, "z": -0.1733639999778551, "word": "Wedding", "pos_group": "noun", "row_number": 171835, "definition": "Nuptial ceremony; nuptial festivities; marriage; nuptials.", "details": []}, {"x": 0.15997026588662924, "y": -0.9818982643740295, "z": 0.10141652947833218, "word": "Wesleyan", "pos_group": "noun", "row_number": 172211, "definition": "One who adopts the principles of Wesleyanism; a Methodist.", "details": []}, {"x": -0.22326522737300156, "y": -0.9714798620212675, "z": 0.07987187197769337, "word": "Wesleyanism", "pos_group": "noun", "row_number": 172212, "definition": "The system of doctrines and church polity inculcated by John Wesley (b. 1703; d. 1791) the founder of the religious sect called Methodist; Methodism. See Methodist n. 2.", "details": []}, {"x": 0.07379143497241952, "y": -0.9838282810459646, "z": -0.16320765159407774, "word": "White friar", "pos_group": "other", "row_number": 172849, "definition": "A mendicant monk of the Carmelite order so called from the white cloaks worn by the order. See Carmelite.", "details": []}, {"x": 0.01899209688124668, "y": -0.9760156087533735, "z": 0.21687054139701664, "word": "Whitsun", "pos_group": "adjective", "row_number": 172926, "definition": "Of pertaining to or observed at Whitsuntide; as Whitsun week; Whitsun Tuesday; Whitsun pastorals.", "details": []}, {"x": -0.19732004090720373, "y": -0.9751662605309905, "z": -0.10057616903811603
