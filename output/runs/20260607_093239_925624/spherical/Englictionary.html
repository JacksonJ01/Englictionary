<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Spherical Semantic Surface</title>
  <style>
    body { margin: 0; overflow: hidden; background: #f5f7fb; }
    #viewport { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed; left: 18px; top: 18px; z-index: 1000;
      background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,0.14);
      padding: 12px 14px; font-family: Segoe UI, Arial, sans-serif; font-size: 13px;
      max-width: 420px;
    }
    #tooltip {
      display: none;
      margin-top: 10px;
      max-width: 420px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      padding: 8px 10px;
      background: rgba(17, 24, 39, 0.92);
      color: #fff; border-radius: 8px; font-family: Segoe UI, Arial, sans-serif;
      font-size: 12px; line-height: 1.35;
    }
    #status {
      position: fixed; right: 18px; bottom: 18px; z-index: 1002;
      padding: 8px 10px; background: rgba(15,23,42,0.9); color: #fff;
      border-radius: 8px; font-family: Segoe UI, Arial, sans-serif; font-size: 12px;
      display: none;
    }
    #controlsPanel {
      position: fixed; right: 18px; top: 18px; z-index: 1003;
      background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,0.14);
      padding: 10px 12px; font-family: Segoe UI, Arial, sans-serif; font-size: 12px;
      min-width: 230px;
    }
    #infoPanel {
      position: fixed; right: 18px; top: 168px; z-index: 1002;
      background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,0.14);
      padding: 10px 12px; font-family: Segoe UI, Arial, sans-serif; font-size: 12px;
      min-width: 230px; max-width: 420px; height: 360px; display: flex; flex-direction: column; overflow: hidden;
    }
    .info-title { font-weight: 700; margin-bottom: 6px; color: #0f172a; }
    .controls-title { font-weight: 700; margin-bottom: 6px; }
    .control-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .controls-stack { display: flex; flex-direction: column; }
    .legend-reset-btn {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid rgba(15,23,42,0.18);
      background: #fff;
      color: #0f172a;
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
    }
    .legend-reset-btn:hover {
      background: rgba(15,23,42,0.05);
    }
    #legendList {
      margin-top: 8px;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      padding-right: 4px;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    #legendSearch {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid rgba(15,23,42,0.18);
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 12px;
      outline: none;
    }
    #legendSearch:focus {
      border-color: rgba(30,64,175,0.6);
      box-shadow: 0 0 0 2px rgba(30,64,175,0.12);
    }
    #legendInfo {
      margin-top: 6px;
      font-size: 11px;
      color: #334155;
      opacity: 0.9;
    }
    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 4px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
    }
    .legend-row:hover {
      background: rgba(15,23,42,0.07);
    }
    .legend-row.active {
      background: rgba(30,64,175,0.14);
      outline: 1px solid rgba(30,64,175,0.3);
    }
    .legend-row.selected {
      background: rgba(14,165,233,0.16);
      outline: 1px solid rgba(14,165,233,0.52);
    }
    .legend-row.active.selected {
      background: rgba(14,165,233,0.22);
      outline: 1px solid rgba(14,165,233,0.72);
    }
    .legend-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.25);
      flex: 0 0 auto;
    }
    .legend-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .legend-count { color: #0f172a; opacity: 0.8; }
  </style>

and reconnect the interface cable; completely remove generic operating system HID (Human Interface Device) pointer drivers and install the vendor's proprietary device driver pack; run the integrated calibration utility to map the pad area to your monitor coordinates. PRIMARY CATEGORY Peripherals and Hardware SUB CATEGORY Input Devices CORE CORE 1 CORE 1: DOMAIN HARDWARE"}, {"word": "Acessories: Styluses", "definition": "An input accessory shaped like a pen that is used to navigate touchscreens or drawing pads. Passive styluses simply mimic a human finger touch, while Active styluses incorporate internal batteries and Bluetooth to track advanced metrics like tilt and pressure sensitivity.", "cluster": 0, "cluster_name": "Cluster 0", "cluster_count": 5, "cluster_row_number": 2, "pos_group": "other", "row_number": 44, "details": [{"label": "ERROR SYMPTOMS", "value": "Digitizer screen ignores pen strokes completely, line rendering lags behind the physical pen movement, or pressure sensitivity features are missing."}, {"label": "TROUBLESHOOTING", "value": "Change the internal battery or charge the active stylus; inspect and replace the plastic pen tip nib if it is worn down or flat; re-pair the device via Bluetooth and verify app configuration support."}, {"label": "PRIMARY CATEGORY", "value": "Peripherals and Hardware"}, {"label": "SUB CATEGORY", "value": "Input Devices"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "HARDWARE"}], "search_text": "Acessories: Styluses An input accessory shaped like a pen that is used to navigate touchscreens or drawing pads. Passive styluses simply mimic a human finger touch, while Active styluses incorporate internal batteries and Bluetooth to track advanced metrics like tilt and pressure sensitivity. other ERROR SYMPTOMS Digitizer screen ignores pen strokes completely, line rendering lags behind the physical pen movement, or pressure sensitivity features are missing. TROUBLESHOOTING Change the internal battery or charge the active stylus; inspect and replace the plastic pen tip nib if it is worn down or flat; re-pair the device via Bluetooth and verify app configuration support. PRIMARY CATEGORY Peripherals and Hardware SUB CATEGORY Input Devices CORE CORE 1 CORE 1: DOMAIN HARDWARE"}, {"word": "Accessories: Touchpads", "definition": "The tactile sensor surface built into laptop palm rests that acts as the primary mouse pointer device by tracking finger movement and multi-touch gestures across its surface area.", "cluster": 0, "cluster_name": "Cluster 0", "cluster_count": 5, "cluster_row_number": 3, "pos_group": "other", "row_number": 45, "details": [{"label": "ERROR SYMPTOMS", "value": "The cursor jumps erratically while typing on the keyboard, mouse clicks fail to register, or multi-finger gestures like scrolling fail to work."}, {"label": "TROUBLESHOOTING", "value": "Clean the touchpad surface with a lightly damp microfiber cloth to remove skin oils; use the \"Fn\" key shortcut (e.g., Fn+F7) to verify the touchpad wasn't accidentally disabled; check Windows Settings to lower palm-rejection sensitivity settings so your palm doesn't trigger accidental inputs while typing."}, {"label": "PRIMARY CATEGORY", "value": "Mobile Devices and Mobile Hardware"}, {"label": "SUB CATEGORY", "value": "Laptop Hardware Components"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "MOBILE DEVICES"}], "search_text": "Accessories: Touchpads The tactile sensor surface built into laptop palm rests that acts as the primary mouse pointer device by tracking finger movement and multi-touch gestures across its surface area. other ERROR SYMPTOMS The cursor jumps erratically while typing on the keyboard, mouse clicks fail to register, or multi-finger gestures like scrolling fail to work. TROUBLESHOOTING Clean the touchpad surface with a lightly damp microfiber cloth to remove skin oils; use the \"Fn\" key shortcut (e.g., Fn+F7) to verify the touchpad wasn't accidentally disabled; check Windows Settings to lower palm-rejection sensitivity settings so your palm doesn't trigger accidental inputs while typing. PRIMARY CATEGORY Mobile Devices and Mobile Hardware SUB CATEGORY Laptop Hardware Components CORE CORE 1 CORE 1: DOMAIN MOBILE DEVICES"}, {"word": "Accessories: Trackpads", "definition": "An alternate term for a laptop touchpad (frequently used within Apple and modern click-surface ecosystems) that translates finger positioning and pressure into cursor movement.", "cluster": 0, "cluster_name": "Cluster 0", "cluster_count": 5, "cluster_row_number": 4, "pos_group": "other", "row_number": 46, "details": [{"label": "ERROR SYMPTOMS", "value": "The physical trackpad surface lifts or pops out of the laptop chassis enclosure, or clicking mechanisms become rigid and physically impossible to press down."}, {"label": "TROUBLESHOOTING", "value": "Safety Warning: If the surface is lifting, check for a internal swollen battery immediately; remove power, safely replace the expanding battery module, and inspect the trackpad structure for permanent structural damage before reassembling."}, {"label": "PRIMARY CATEGORY", "value": "Mobile Devices and Mobile Hardware"}, {"label": "SUB CATEGORY", "value": "Laptop Hardware Components"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "MOBILE DEVICES"}], "search_text": "Accessories: Trackpads An alternate term for a laptop touchpad (frequently used within Apple and modern click-surface ecosystems) that translates finger positioning and pressure into cursor movement. other ERROR SYMPTOMS The physical trackpad surface lifts or pops out of the laptop chassis enclosure, or clicking mechanisms become rigid and physically impossible to press down. TROUBLESHOOTING Safety Warning: If the surface is lifting, check for a internal swollen battery immediately; remove power, safely replace the expanding battery module, and inspect the trackpad structure for permanent structural damage before reassembling. PRIMARY CATEGORY Mobile Devices and Mobile Hardware SUB CATEGORY Laptop Hardware Components CORE CORE 1 CORE 1: DOMAIN MOBILE DEVICES"}, {"word": "Apple: iPadOS", "definition": "A specialized derivative variant of Apple's mobile operating system structured explicitly for iPad tablet hardware layouts. It includes enhanced multi-tasking interfaces, desktop-class browser engines, external display support, and stylus digitizer tracking logic.", "cluster": 0, "cluster_name": "Cluster 0", "cluster_count": 5, "cluster_row_number": 5, "pos_group": "other", "row_number": 128, "details": [{"label": "ERROR SYMPTOMS", "value": "Slide Over or Split View multi-tasking interfaces failing to display properly, external dock displays failing to scale resolution windows correctly, or file mapping tools dropping cloud share access paths."}, {"label": "TROUBLESHOOTING", "value": "Close running processes via the application switcher; update the system software layer; navigate to accessibility configurations to verify touch gesture parameters are matching operational intents; execute an all-settings reset routine."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Mobile Operating Systems"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Apple: iPadOS A specialized derivative variant of Apple's mobile operating system structured explicitly for iPad tablet hardware layouts. It includes enhanced multi-tasking interfaces, desktop-class browser engines, external display support, and stylus digitizer tracking logic. other ERROR SYMPTOMS Slide Over or Split View multi-tasking interfaces failing to display properly, external dock displays failing to scale resolution windows correctly, or file mapping tools dropping cloud share access paths. TROUBLESHOOTING Close running processes via the application switcher; update the system software layer; navigate to accessibility configurations to verify touch gesture parameters are matching operational intents; execute an all-settings reset routine. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Mobile Operating Systems CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "lusrmgr.msc (Local Users and Groups Manager)", "definition": "A built-in Windows Microsoft Management Console (MMC) snap-in used to create, delete, and manage local user accounts and security groups directly on a computer.", "cluster": 1, "cluster_name": "Cluster 1", "cluster_count": 3, "cluster_row_number": 1, "pos_group": "other", "row_number": 53, "details": [{"label": "ERROR SYMPTOMS", "value": "- \"This snapin may not be used with this edition of Windows\": The utility completely refuses to launch on Windows Home editions.\n- \"Access is Denied\": The console opens, but changes cannot be saved, or properties are grayed out.\n- Red \"X\" on Accounts: Specific local accounts are visible but completely locked out or disabled.\n- \"The password does not meet the policy requirements\": Attempts to set or reset a password fail with a restriction pop-up."}, {"label": "TROUBLESHOOTING", "value": "- Upgrade Windows Edition: If running Windows Home, upgrade to Pro or Enterprise, or use alternative command-line tools like \"net user\" and \"net localgroup\" in Command Prompt.\n- Elevate Permissions: Close the tool and explicitly open a Command Prompt as an Administrator, then type \"lusrmgr.msc\" to bypass local permission limits.\n- Enable Account Manually: Right-click the disabled user account, select Properties, and uncheck the Account is disabled checkbox.\n- Review Password Complexity: Adjust the local security policy constraints using \"secpol.msc\" if you need to set a simple password that violates default rules."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems"}, {"label": "SUB CATEGORY", "value": "Windows Management Tools / System Administration Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "lusrmgr.msc (Local Users and Groups Manager) A built-in Windows Microsoft Management Console (MMC) snap-in used to create, delete, and manage local user accounts and security groups directly on a computer. other ERROR SYMPTOMS - \"This snapin may not be used with this edition of Windows\": The utility completely refuses to launch on Windows Home editions.\n- \"Access is Denied\": The console opens, but changes cannot be saved, or properties are grayed out.\n- Red \"X\" on Accounts: Specific local accounts are visible but completely locked out or disabled.\n- \"The password does not meet the policy requirements\": Attempts to set or reset a password fail with a restriction pop-up. TROUBLESHOOTING - Upgrade Windows Edition: If running Windows Home, upgrade to Pro or Enterprise, or use alternative command-line tools like \"net user\" and \"net localgroup\" in Command Prompt.\n- Elevate Permissions: Close the tool and explicitly open a Command Prompt as an Administrator, then type \"lusrmgr.msc\" to bypass local permission limits.\n- Enable Account Manually: Right-click the disabled user account, select Properties, and uncheck the Account is disabled checkbox.\n- Review Password Complexity: Adjust the local security policy constraints using \"secpol.msc\" if you need to set a simple password that violates default rules. PRIMARY CATEGORY Operating Systems SUB CATEGORY Windows Management Tools / System Administration Utilities CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "Administrative Tools: Certificate Manager", "definition": "A system utility snap-in (\"certlm.msc\" for local machine, \"certmgr.msc\" for current user) used to view, manage, import, and delete digital certificates. These certificates are crucial for validating cryptographic identities, securing emails, encrypting files, and verifying trusted root authorities.", "cluster": 1, "cluster_name": "Cluster 1", "cluster_count": 3, "cluster_row_number": 2, "pos_group": "other", "row_number": 84, "details": [{"label": "ERROR SYMPTOMS", "value": "Users receive severe browser warnings stating \"Your connection is not private\" or \"The security certificate presented by this website was not issued by a trusted certificate authority\" when visiting corporate intranet sites."}, {"label": "TROUBLESHOOTING", "value": "Open the Certificate Manager snap-in; navigate to the Trusted Root Certification Authorities folder; select Action > All Tasks > Import to manually load the correct, up-to-date corporate root certificate file provided by the network security team."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Windows Administrative Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Administrative Tools: Certificate Manager A system utility snap-in (\"certlm.msc\" for local machine, \"certmgr.msc\" for current user) used to view, manage, import, and delete digital certificates. These certificates are crucial for validating cryptographic identities, securing emails, encrypting files, and verifying trusted root authorities. other ERROR SYMPTOMS Users receive severe browser warnings stating \"Your connection is not private\" or \"The security certificate presented by this website was not issued by a trusted certificate authority\" when visiting corporate intranet sites. TROUBLESHOOTING Open the Certificate Manager snap-in; navigate to the Trusted Root Certification Authorities folder; select Action > All Tasks > Import to manually load the correct, up-to-date corporate root certificate file provided by the network security team. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Windows Administrative Utilities CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "Administrative Tools: Local Users and Groups", "definition": "A local management utility snap-in ('lusrmgr.msc\") used to create, delete, modify, and disable local user accounts and local security groups on a specific computer. (Note: This tool is omitted from basic Home editions of Windows).", "cluster": 1, "cluster_name": "Cluster 1", "cluster_count": 3, "cluster_row_number": 3, "pos_group": "other", "row_number": 90, "details": [{"label": "ERROR SYMPTOMS", "value": "A standard user profile cannot run basic administrative tools because they are missing from the local privileged groups, or stale local accounts are left active on an enterprise machine after an employee departs."}, {"label": "TROUBLESHOOTING", "value": "Run \"lusrmgr.msc\" as an administrator; select the Users folder to right-click and change passwords or disable accounts; select the Groups folder, double-click Administrators, and add or remove specific user accounts to update their local privilege tokens."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Windows Administrative Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Administrative Tools: Local Users and Groups A local management utility snap-in ('lusrmgr.msc\") used to create, delete, modify, and disable local user accounts and local security groups on a specific computer. (Note: This tool is omitted from basic Home editions of Windows). other ERROR SYMPTOMS A standard user profile cannot run basic administrative tools because they are missing from the local privileged groups, or stale local accounts are left active on an enterprise machine after an employee departs. TROUBLESHOOTING Run \"lusrmgr.msc\" as an administrator; select the Users folder to right-click and change passwords or disable accounts; select the Groups folder, double-click Administrators, and add or remove specific user accounts to update their local privilege tokens. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Windows Administrative Utilities CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "Access: UAC (User Account Control)", "definition": "A Windows security feature designed to prevent unauthorized malware or unprivileged users from making changes to system files or registry sections by forcing an explicit pop-up confirmation screen before allowing elevated privileges.", "cluster": 2, "cluster_name": "Cluster 2", "cluster_count": 4, "cluster_row_number": 1, "pos_group": "other", "row_number": 36, "details": [{"label": "ERROR SYMPTOMS", "value": "Legitimate system installation tools crash out during automated deployments because the hidden background script cannot interactively click through a protective UAC confirmation prompt."}, {"label": "TROUBLESHOOTING", "value": "Type \"User Account Control Settings\" in the Windows search bar; adjust the slider mechanism to alter notifications; for enterprise automated software packaging, use administrative bypass methods or adjust settings globally via Group Policy Objects (GPOs)."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Windows Security Features"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Access: UAC (User Account Control) A Windows security feature designed to prevent unauthorized malware or unprivileged users from making changes to system files or registry sections by forcing an explicit pop-up confirmation screen before allowing elevated privileges. other ERROR SYMPTOMS Legitimate system installation tools crash out during automated deployments because the hidden background script cannot interactively click through a protective UAC confirmation prompt. TROUBLESHOOTING Type \"User Account Control Settings\" in the Windows search bar; adjust the slider mechanism to alter notifications; for enterprise automated software packaging, use administrative bypass methods or adjust settings globally via Group Policy Objects (GPOs). PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Windows Security Features CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "Alerts, ransomware hoaxes", "definition": "Deceptive tech-support popup windows or fake security warning alerts that mimic legitimate operating system or antivirus messages. They claim the machine is encrypted or infected with malware to scare users into calling a fake support number or paying money, even though no real file encryption has taken place.", "cluster": 2, "cluster_name": "Cluster 2", "cluster_count": 4, "cluster_row_number": 2, "pos_group": "other", "row_number": 105, "details": [{"label": "ERROR SYMPTOMS", "value": "A user's web browser window locks up, displaying a flashing full-screen message stating \"WARNING: Ransomware Detected! Call 1-800-XXX-XXXX immediately to save your files,\" blocking standard access to the browser interface."}, {"label": "TROUBLESHOOTING", "value": "Do not call the listed phone number or click any links; open Task Manager (\"Ctrl + Shift + Esc\"); select the web browser process from the list and click End Task to force close the window; relaunch the browser and choose not to restore the previous session tabs; clear the browser cache and run a standard scan with your legitimate local antivirus software."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Social Engineering and Security Threats"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SOFTWARE TROUBLESHOOTING"}], "search_text": "Alerts, ransomware hoaxes Deceptive tech-support popup windows or fake security warning alerts that mimic legitimate operating system or antivirus messages. They claim the machine is encrypted or infected with malware to scare users into calling a fake support number or paying money, even though no real file encryption has taken place. other ERROR SYMPTOMS A user's web browser window locks up, displaying a flashing full-screen message stating \"WARNING: Ransomware Detected! Call 1-800-XXX-XXXX immediately to save your files,\" blocking standard access to the browser interface. TROUBLESHOOTING Do not call the listed phone number or click any links; open Task Manager (\"Ctrl + Shift + Esc\"); select the web browser process from the list and click End Task to force close the window; relaunch the browser and choose not to restore the previous session tabs; clear the browser cache and run a standard scan with your legitimate local antivirus software. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Social Engineering and Security Threats CORE CORE 2 CORE 2: DOMAIN SOFTWARE TROUBLESHOOTING"}, {"word": "AutoPlay, disabling", "definition": "The system administration security practice of turning off the Windows feature that automatically scans newly inserted media drives (such as Universal Serial Bus (USB) flash drives or external hard drives) and instantly displays a pop-up window or plays media content based on file types.", "cluster": 2, "cluster_name": "Cluster 2", "cluster_count": 4, "cluster_row_number": 3, "pos_group": "other", "row_number": 197, "details": [{"label": "ERROR SYMPTOMS", "value": "Inserting an external flash drive triggers automatic system modifications or opens unauthorized windows, risking user exposure to malicious drive items."}, {"label": "TROUBLESHOOTING", "value": "Open Windows Control Panel, click on the \u201cAutoPlay\u201d applet, clear the check box for \u201cUse AutoPlay for all media and devices\u201d, select an instruction to set all individual drive dropdown listings to \u201cTake no action\u201d, and click \u201cSave\u201d to lock down the system configuration."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Operational Security Best Practices"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "AutoPlay, disabling The system administration security practice of turning off the Windows feature that automatically scans newly inserted media drives (such as Universal Serial Bus (USB) flash drives or external hard drives) and instantly displays a pop-up window or plays media content based on file types. other ERROR SYMPTOMS Inserting an external flash drive triggers automatic system modifications or opens unauthorized windows, risking user exposure to malicious drive items. TROUBLESHOOTING Open Windows Control Panel, click on the \u201cAutoPlay\u201d applet, clear the check box for \u201cUse AutoPlay for all media and devices\u201d, select an instruction to set all individual drive dropdown listings to \u201cTake no action\u201d, and click \u201cSave\u201d to lock down the system configuration. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Operational Security Best Practices CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "AutoRun, disabling", "definition": "A critical Operating System (OS) security configuration that blocks the system from reading and executing hidden initialization files (like \u201cautorun.inf\u201d) located on newly connected storage drives, which stops malicious scripts from automatically running without user consent.", "cluster": 2, "cluster_name": "Cluster 2", "cluster_count": 4, "cluster_row_number": 4, "pos_group": "other", "row_number": 198, "details": [{"label": "ERROR SYMPTOMS", "value": "Plugging a found or untrusted Universal Serial Bus (USB) flash drive into a workstation instantly installs malware or launches background terminal scripts without the user clicking a single file icon."}, {"label": "TROUBLESHOOTING", "value": "Open the \u201cLocal Group Policy Editor\u201d by executing the command \u201cgpedit.msc\u201d, navigate to \u201cComputer Configuration > Administrative Templates > Windows Components > AutoRun Policies\u201d, double-click \u201cTurn off AutoPlay\u201d, change the setting toggle to \u201cEnabled\u201d, and click \u201cApply\u201d to block automated script execution across all drives."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Logical Security Controls"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "AutoRun, disabling A critical Operating System (OS) security configuration that blocks the system from reading and executing hidden initialization files (like \u201cautorun.inf\u201d) located on newly connected storage drives, which stops malicious scripts from automatically running without user consent. other ERROR SYMPTOMS Plugging a found or untrusted Universal Serial Bus (USB) flash drive into a workstation instantly installs malware or launches background terminal scripts without the user clicking a single file icon. TROUBLESHOOTING Open the \u201cLocal Group Policy Editor\u201d by executing the command \u201cgpedit.msc\u201d, navigate to \u201cComputer Configuration > Administrative Templates > Windows Components > AutoRun Policies\u201d, double-click \u201cTurn off AutoPlay\u201d, change the setting toggle to \u201cEnabled\u201d, and click \u201cApply\u201d to block automated script execution across all drives. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Logical Security Controls CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "2.4 GHz channels", "definition": "A frequency band used by wireless networks (802.11 standards). It offers a long range and better propagation through solid walls but is highly congested. In the US, it consists of 11 channels, but only channels 1, 6, and 11 are completely non-overlapping.", "cluster": 3, "cluster_name": "Cluster 3", "cluster_count": 4, "cluster_row_number": 1, "pos_group": "other", "row_number": 1, "details": [{"label": "ERROR SYMPTOMS", "value": "Intermittent wireless drops, extremely slow data throughput, high latency auses a critical infrastructure breakdown. other ERROR SYMPTOMS A newly installed software patch causes an enterprise database to crash, and helpdesk technicians have no written documentation or configuration steps available to undo the damage quickly, extending corporate downtime. TROUBLESHOOTING Before deploying any production modification, document a step-by-step reversal sequence, preserve recent system configuration snapshots, and maintain verified system backups to allow the engineering team to run the reversal procedures immediately if an update fails. PRIMARY CATEGORY Network Infrastructure and Operational Procedures SUB CATEGORY Change Management Procedures CORE CORE 2 CORE 2: DOMAIN OPERATIONAL PROCEDURES"}, {"word": "Access: ACL (Access Control List)", "definition": "A sequential rule list configured on network routers and firewalls to permit or deny traffic based on metrics like source/destination IP addresses, ports, or protocols. (Can also refer to file system lists defining user read/write permissions).", "cluster": 6, "cluster_name": "Cluster 6", "cluster_count": 2, "cluster_row_number": 1, "pos_group": "other", "row_number": 30, "details": [{"label": "ERROR SYMPTOMS", "value": "Authorized network traffic is blocked entirely when trying to reach a server segment, or insecure external traffic passes through a perimeter firewall unfiltered."}, {"label": "TROUBLESHOOTING", "value": "Review the sequential rule ordering on the router/firewall via CLI or management console; ensure that a broad \"deny all\" statement isn't placed ahead of specific \"permit\" lines, as ACL rules process sequentially from top to bottom."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Logical Security Controls"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "Access: ACL (Access Control List) A sequential rule list configured on network routers and firewalls to permit or deny traffic based on metrics like source/destination IP addresses, ports, or protocols. (Can also refer to file system lists defining user read/write permissions). other ERROR SYMPTOMS Authorized network traffic is blocked entirely when trying to reach a server segment, or insecure external traffic passes through a perimeter firewall unfiltered. TROUBLESHOOTING Review the sequential rule ordering on the router/firewall via CLI or management console; ensure that a broad \"deny all\" statement isn't placed ahead of specific \"permit\" lines, as ACL rules process sequentially from top to bottom. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Logical Security Controls CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "ACL (Access Control Lists)", "definition": "A formal rule matrix that dictates resource access rights. On network routers and firewalls, it filters inbound/outbound packets based on IP (Internet Protocol) addresses, protocols, or port numbers. On a file system (such as NTFS (New File Transfer System), it lists the specific explicit folder permissions granted to individual users and security groups.", "cluster": 6, "cluster_name": "Cluster 6", "cluster_count": 2, "cluster_row_number": 2, "pos_group": "other", "row_number": 69, "details": [{"label": "ERROR SYMPTOMS", "value": "Users are blocked from opening folders essential to their daily tasks, or network workstations are unable to connect to an external server resource due to an overly restrictive rule line."}, {"label": "TROUBLESHOOTING", "value": "To fix a network ACL issue, trace rule order from top-to-bottom and fix any conflicting \"deny\" strings; for file permissions issues, right-click the folder, go to \"Properties > Security\", and edit the user lists to ensure the necessary permissions (Read/Write) are selected."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Logical Security Controls"}, {"lab cessing Unit. A major brand of computer processors that implements the x86-64 computing architecture. They feature a distinct physical layout compared to Intel processors, using a PGA (Pin Grid Array) layout where the delicate interface pins are located directly on the underside of the CPU chip itself, mating with sockets like AM4 or AM5.", "cluster": 9, "cluster_name": "Cluster 9", "cluster_count": 5, "cluster_row_number": 2, "pos_group": "other", "row_number": 107, "details": [{"label": "ERROR SYMPTOMS", "value": "A computer completely fails to post after a hardware upgrade, the motherboard status lights show a CPU error, or the processor cannot be physically seated into the motherboard socket."}, {"label": "TROUBLESHOOTING", "value": "Verify that the motherboard socket matches the explicit AMD socket generation (Intel motherboards are completely incompatible); lift the socket retention lever, align the gold triangle on the corner of the AMD CPU with the matching triangle on the socket, and gently drop the chip into place without applying force; inspect the underside of the processor to ensure no pins are bent."}, {"label": "PRIMARY CATEGORY", "value": "Motherboards, RAM, and CPU Diagnostics"}, {"label": "SUB CATEGORY", "value": "CPU Architecture and Hardware"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "HARDWARE"}], "search_text": "AMD CPU Advanced Micro Devices Central Processing Unit. A major brand of computer processors that implements the x86-64 computing architecture. They feature a distinct physical layout compared to Intel processors, using a PGA (Pin Grid Array) layout where the delicate interface pins are located directly on the underside of the CPU chip itself, mating with sockets like AM4 or AM5. other ERROR SYMPTOMS A computer completely fails to post after a hardware upgrade, the motherboard status lights show a CPU error, or the processor cannot be physically seated into the motherboard socket. TROUBLESHOOTING Verify that the motherboard socket matches the explicit AMD socket generation (Intel motherboards are completely incompatible); lift the socket retention lever, align the gold triangle on the corner of the AMD CPU with the matching triangle on the socket, and gently drop the chip into place without applying force; inspect the underside of the processor to ensure no pins are bent. PRIMARY CATEGORY Motherboards, RAM, and CPU Diagnostics SUB CATEGORY CPU Architecture and Hardware CORE CORE 1 CORE 1: DOMAIN HARDWARE"}, {"word": "ARM (Advanced RISC  (Reduced Instruction Set Computer) Machine) CPU", "definition": "Advanced RISC (Reduced Instruction Set Computer) Machine Central Processing Unit (ARM CPU). A processor architecture built on Reduced Instruction Set Computer (RISC) principles. It values power efficiency, low thermal output, and minimal transit layout overhead, making it the standard choice for mobile devices, tablets, and modern energy-conscious laptops.", "cluster": 9, "cluster_name": "Cluster 9", "cluster_count": 5, "cluster_row_number": 3, "pos_group": "other", "row_number": 156, "details": [{"label": "ERROR SYMPTOMS", "value": "Desktop Operating System (OS) setup files throw compilation execution errors stating \u201cIncompatible processor architecture,\u201d or desktop software binaries fail to execute natively without emulation."}, {"label": "TROUBLESHOOTING", "value": "Verify that the software packages being deployed are compiled explicitly for ARM architectures; if running legacy applications, configure an OS-level translation environment (such as \u201cRosetta\u201d or \u201cWindows on ARM\u201d emulation layers) to bridge the instruction sets."}, {"label": "PRIMARY CATEGORY", "value": "Motherboards, RAM, and CPU Diagnostics"}, {"label": "SUB CATEGORY", "value": "CPU Architecture and Hardware"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "HARDWARE"}], "search_text": "ARM (Advanced RISC  (Reduced Instruction Set Computer) Machine) CPU Advanced RISC (Reduced Instruction Set Computer) Machine Central Processing Unit (ARM CPU). A processor architecture built on Reduced Instruction Set Computer (RISC) principles. It values power efficiency, low thermal output, and minimal transit layout overhead, making it the standard choice for mobile devices, tablets, and modern energy-conscious laptops. other ERROR SYMPTOMS Desktop Operating System (OS) setup files throw compilation execution errors stating \u201cIncompatible processor architecture,\u201d or desktop software binaries fail to execute natively without emulation. TROUBLESHOOTING Verify that the software packages being deployed are compiled explicitly for ARM architectures; if running legacy applications, configure an OS-level translation environment (such as \u201cRosetta\u201d or \u201cWindows on ARM\u201d emulation layers) to bridge the instruction sets. PRIMARY CATEGORY Motherboards, RAM, and CPU Diagnostics SUB CATEGORY CPU Architecture and Hardware CORE CORE 1 CORE 1: DOMAIN HARDWARE"}, {"word": "ATX: Motherboards", "definition": "Advanced Technology eXtended (ATX) motherboards. A standard computer motherboard form factor specification created by Intel. A standard full-size ATX board measures 12 inches by 9.6 inches, contains multiple expansion slots, and implements a uniform 24-pin primary power connection interface layout.", "cluster": 9, "cluster_name": "Cluster 9", "cluster_count": 5, "cluster_row_number": 4, "pos_group": "other", "row_number": 173, "details": [{"label": "ERROR SYMPTOMS", "value": "A replacement motherboard cannot be physically mounted into a compact computer case because the mounting screw holes do not align, or the Power Supply Unit (PSU) cabling layout lacks the necessary 24-pin power connector block."}, {"label": "TROUBLESHOOTING", "value": "Check case specifications before assembly to ensure compatibility with full-size ATX components; place the motherboard gently over the matching computer case standoffs, screw down all mounting points uniformly, and insert the standard 24-pin primary power cable block firmly into the motherboard port slot."}, {"label": "PRIMARY CATEGORY", "value": "Motherboards, RAM, and CPU Diagnostics"}, {"label": "SUB CATEGORY", "value": "Motherboard Form Factors"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "HARDWARE"}], "search_text": "ATX: Motherboards Advanced Technology eXtended (ATX) motherboards. A standard computer motherboard form factor specification created by Intel. A standard full-size ATX board measures 12 inches by 9.6 inches, contains multiple expansion slots, and implements a uniform 24-pin primary power connection interface layout. other ERROR SYMPTOMS A replacement motherboard cannot be physically mounted into a compact computer case because the mounting screw holes do not align, or the Power Supply Unit (PSU) cabling layout lacks the necessary 24-pin power connector block. TROUBLESHOOTING Check case specifications before assembly to ensure compatibility with full-size ATX components; place the motherboard gently over the matching computer case standoffs, screw down all mounting points uniformly, and insert the standard 24-pin primary power cable block firmly into the motherboard port slot. PRIMARY CATEGORY Motherboards, RAM, and CPU Diagnostics SUB CATEGORY Motherboard Form Factors CORE CORE 1 CORE 1: DOMAIN HARDWARE"}, {"word": "Backlights", "definition": "A physical hardware illumination component located behind or along the edges of a Liquid Crystal Display (LCD) screen panel that provides the structural light source necessary to make visual images visible to the human eye.", "cluster": 9, "cluster_name": "Cluster 9", "cluster_count": 5, "cluster_row_number": 5, "pos_group": "other", "row_number": 199, "details": [{"label": "ERROR SYMPTOMS", "value": "The laptop screen remains completely black or dark even though the power light indicator is on, but a faint, ghostly image of the desktop can be seen if a bright flashlight is shined directly onto the monitor surface."}, {"label": "TROUBLESHOOTING", "value": "Connect an external monitor to the video port to verify whether the graphics processing hardware is functional; if external video works, inspect the internal display panel assembly to replace a faulty high-voltage inverter board or a blown Light-Emitting Diode (LED) backlight harness strip."}, {"label": "PRIMARY CATEGORY", "value": "Peripherals and Hardware"}, {"label": "SUB CATEGORY", "value": "Laptop Display Components"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "MOBILE DEVICES"}], "search_text": "Backlights A physical hardware illumination component located behind or along the edges of a Liquid Crystal Display (LCD) screen panel that provides the structural light source necessary to make visual images visible to the human eye. other ERROR SYMPTOMS The laptop screen remains completely black or dark even though the power light indicator is on, but a faint, ghostly image of the desktop can be seen if a bright flashlight is shined directly onto the monitor surface. TROUBLESHOOTING Connect an external monitor to the video port to verify whether the graphics processing hardware is functional; if external video works, inspect the internal display panel assembly to replace a faulty high-voltage inverter board or a blown Light-Emitting Diode (LED) backlight harness strip. PRIMARY CATEGORY Peripherals and Hardware SUB CATEGORY Laptop Display Components CORE CORE 1 CORE 1: DOMAIN MOBILE DEVICES"}, {"word": "Acknowledgement phase, DORA process", "definition": "The fourth and final stage of the DHCP (Dynamic Host Configuration Protocol) automated IP addressing assignment process Discover, Offer, Request, Acknowledge (DORA). The DHCP server sends a final DHCP-ACK packet to the client, officially confirming the lease configuration and authorizing the client to use the assigned IP address, subnet mask, and default gateway.", "cluster": 10, "cluster_name": "Cluster 10", "cluster_count": 8, "cluster_row_number": 1, "pos_group": "other", "row_number": 60, "details": [{"label": "ERROR SYMPTOMS", "value": "Client machines get stuck forever in a \"Configuring network interface\" loop, fail to receive a valid IP address configuration, or fall back to an APIPA auto-assigned address (169.254.x.x) despite a DHCP server being online on the broadcast domain."}, {"label": "TROUBLESHOOTING", "value": "Verify that the DHCP server's address pool has not run out of assignable IPv4 scopes; check for severe local network latency or packet drops that might cause the client to drop the packet before completing the handshake; review the server logs for lease conflicts."}, {"label": "PRIMARY CATEGORY", "value": "Network Infrastructure Services"}, {"label": "SUB CATEGORY", "value": "IP (Internet Protocol) Addressing Services (DHCP)"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "Acknowledgement phase, DORA process The fourth and final stage of the DHCP (Dynamic Host Configuration Protocol) automated IP addressing assignment process Discover, Offer, Request, Acknowledge (DORA). The DHCP server sends a final DHCP-ACK packet to the client, officially confirming the lease configuration and authorizing the client to use the assigned IP address, subnet mask, and default gateway. other ERROR SYMPTOMS Client machines get stuck forever in a \"Configuring network interface\" loop, fail to receive a valid IP address configuration, or fall back to an APIPA auto-assigned address (169.254.x.x) despite a DHCP server being online on the broadcast domain. TROUBLESHOOTING Verify that the DHCP server's address pool has not run out of assignable IPv4 scopes; check for severe local network latency or packet drops that might cause the client to drop the packet before completing the handshake; review the server logs for lease conflicts. PRIMARY CATEGORY Network Infrastructure Services SUB CATEGORY IP (Internet Protocol) Addressing Services (DHCP) CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "DHCPACK (DHCP (Dynamic Host Configuration Protocol) Acknowledgment)", "definition": "The fourth and final packet in the DHCP DORA process, sent by the DHCP server to the client to confirm the IP address lease, lease duration, subnet mask, default gateway, and DNS (Domain Name System) configurations.", "cluster": 10, "cluster_name": "Cluster 10", "cluster_count": 8, "cluster_row_number": 2, "pos_group": "other", "row_number": 64, "details": [{"label": "ERROR SYMPTOMS", "value": "- Stuck on \"Obtaining IP (Internet Protocol) Address\": The client device broadcasts requests but never receives the final confirmation, remaining offline.\n- Frequent Disconnections: The network connection drops and reconnects constantly as the client fails to renew its lease when it reaches the T1 (renewal) timer.\n- APIPA  (Automatic Private Internet Protocol Addressing) Failback: The device times out waiting for the server's final confirmation and falls back to a self-assigned \"169.254.x.x\" address.\n- Log Errors: Event Viewer logs show DHCP (Dynamic Host Configuration Protocol) Client event warnings such as ID 1001: \"Your computer was not assigned an address from the network...\""}, {"label": "TROUBLESHOOTING", "value": "- Check Server Lease Pool: Open the router or DHCP server management console to ensure the scope has available addresses and that the server is not crashing or locked up.\n- Run a Network Trace: Open Wireshark on the client machine and use the filter \"bootp\" (Bootstrap Protocol) or \"dhcp\" to see if the server's DHCP-ACK unicast or broadcast packet is actually reaching the client network card.\n- Verify UDP (User Datagram Protocol) Port Availability: Ensure network firewalls and endpoint security software are allowing inbound traffic on UDP port 68 (DHCP client port).\n- Reset the TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: R client port).\n- Reset the TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" followed by \"ipconfig /flushdns\" in an elevated Command Prompt to clear any corrupt local network configuration caching that may be blocking the packet. PRIMARY CATEGORY Networking SUB CATEGORY Network Services / IP Addressing CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "DHCP (Dynamic Host Configuration Protocol) Lease Cycle Works", "definition": "The lifecycle management process of a dynamically assigned IP (Internet Protocol) address, where a client safely holds an IP configuration for a set duration (lease time) and must periodically check in with DHCP servers to keep or update that address before it expires.", "cluster": 10, "cluster_name": "Cluster 10", "cluster_count": 8, "cluster_row_number": 3, "pos_group": "other", "row_number": 65, "details": [{"label": "ERROR SYMPTOMS", "value": "- Intermittent Drops at Midpoints: Active remote desktop, VoIP (Voice Over IP), or streaming sessions drop predictably at exact intervals (e.g., exactly every 4 or 12 hours).\n- System Event Log Warning 1003: Windows logs an error stating that the computer failed to renew its IP address lease with the network card.\n- Sudden APIPA Failback (Automatic Private IP Adressing): A working computer suddenly loses internet connectivity mid-day and shows an IP address of \"169.254.x.x\"."}, {"label": "TROUBLESHOOTING", "value": "- Query Current Lease Details: Open Command Prompt and type \"ipconfig /all\" to inspect the exact Lease Obtained and Lease Expires timestamps.\n- Isolate Network Outages: Verify if network switches or routers were offline or rebooting during the renewal windows, preventing client check-ins.\n- Adjust Lease Duration: Modify the lease time settings on the DHCP server\u2014increase short leases (e.g., 2 hours) to 8 days for stable office environments to reduce network traffic.\n- Flush Cache & Re-request: Run \"ipconfig /release\" and \"ipconfig /renew\" to wipe out a problematic lease state and start a fresh initialization cycle."}, {"label": "PRIMARY CATEGORY", "value": "Networking"}, {"label": "SUB CATEGORY", "value": "Network Services / IP Addressing"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "DHCP (Dynamic Host Configuration Protocol) Lease Cycle Works The lifecycle management process of a dynamically assigned IP (Internet Protocol) address, where a client safely holds an IP configuration for a set duration (lease time) and must periodically check in with DHCP servers to keep or update that address before it expires. other ERROR SYMPTOMS - Intermittent Drops at Midpoints: Active remote desktop, VoIP (Voice Over IP), or streaming sessions drop predictably at exact intervals (e.g., exactly every 4 or 12 hours).\n- System Event Log Warning 1003: Windows logs an error stating that the computer failed to renew its IP address lease with the network card.\n- Sudden APIPA Failback (Automatic Private IP Adressing): A working computer suddenly loses internet connectivity mid-day and shows an IP address of \"169.254.x.x\". TROUBLESHOOTING - Query Current Lease Details: Open Command Prompt and type \"ipconfig /all\" to inspect the exact Lease Obtained and Lease Expires timestamps.\n- Isolate Network Outages: Verify if network switches or routers were offline or rebooting during the renewal windows, preventing client check-ins.\n- Adjust Lease Duration: Modify the lease time settings on the DHCP server\u2014increase short leases (e.g., 2 hours) to 8 days for stable office environments to reduce network traffic.\n- Flush Cache & Re-request: Run \"ipconfig /release\" and \"ipconfig /renew\" to wipe out a problematic lease state and start a fresh initialization cycle. PRIMARY CATEGORY Networking SUB CATEGORY Network Services / IP Addressing CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "DHCP T1 Timer (Renewal)", "definition": "The first internal timer in the DHCP (Dynamic Host Configuration Protocol) lease cycle\u2014defaulting to 50% of the total lease time\u2014at which the client sends a unicast DHCPREQUEST packet directly to the original DHCP server to renew its current IP (Internet Protocol) address lease.\n", "cluster": 10, "cluster_name": "Cluster 10", "cluster_count": 8, "cluster_row_number": 4, "pos_group": "other", "row_number": 66, "details": [{"label": "ERROR SYMPTOMS", "value": "- Quiet Failures: No immediate connectivity drop is visible to the user, but background network logs show repeated, unanswered unicast requests.\n- Unicast Timed Out Logs: Event logs showing that the network card is failing to reach the local DHCP server address, despite the client still having internet access."}, {"label": "TROUBLESHOOTING", "value": "- Check Unicast Routing: Ensure that internal firewalls or routing tables have not blocked direct unicast communication between the client's subnet and the DHCP server over UDP port 67.\n- Verify Server State: Check if the original DHCP server daemon has frozen, crashed, or had its network interface changed since the initial lease was granted.\n- Monitor with Wireshark: Apply the filter \"dhcp.option.dhcp == 3\" to verify if the client is actively originating the unicast renewal request when the T1 timer hits."}, {"label": "PRIMARY CATEGORY", "value": "Networking"}, {"label": "SUB CATEGORY", "value": "Network Services / Connection Timers"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "DHCP T1 Timer (Renewal) The first internal timer in the DHCP (Dynamic Host Configuration Protocol) lease cycle\u2014defaulting to 50% of the total lease time\u2014at which the client sends a unicast DHCPREQUEST packet directly to the original DHCP server to renew its current IP (Internet Protocol) address lease.\n other ERROR SYMPTOMS - Quiet Failures: No immediate connectivity drop is visible to the user, but background network logs show repeated, unanswered unicast requests.\n- Unicast Timed Out Logs: Event logs showing that the network card is failing to reach the local DHCP server address, despite the client still having internet access. TROUBLESHOOTING - Check Unicast Routing: Ensure that internal firewalls or routing tables have not blocked direct unicast communication between the client's subnet and the DHCP server over UDP port 67.\n- Verify Server State: Check if the original DHCP server daemon has frozen, crashed, or had its network interface changed since the initial lease was granted.\n- Monitor with Wireshark: Apply the filter \"dhcp.option.dhcp == 3\" to verify if the client is actively originating the unicast renewal request when the T1 timer hits. PRIMARY CATEGORY Networking SUB CATEGORY Network Services / Connection Timers CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "DHCP T2 Timer (Rebinding)", "definition": "The second internal timer in the DHCP (Dynamic Host Configuration Protocol) lease cycle\u2014defaulting to 87.5% (7/8ths) of the total lease time\u2014triggered if the original server ignored the T1 requests, causing the client to broadcast a DHCPREQUEST to any available DHCP server on the network.", "cluster": 10, "cluster_name": "Cluster 10", "cluster_count": 8, "cluster_row_number": 5, "pos_group": "other", "row_number": 67, "details": [{"label": "ERROR SYMPTOMS", "value": "- Network Warning Pop-ups: Brief desktop alerts indicating the local area network connection is searching or re-identifying.\n- IP (Internet Protocol) Address Shifting: The client suddenly binds to a completely different IP pool or subnet if a secondary, unauthorized (rogue) DHCP server answers the broadcast first."}, {"label": "TROUBLESHOOTING", "value": "- Audit Broadcast Domains: Check that routers and switches are properly configured to forward network broadcasts or that IP Helper/DHCP Relay agents are running correctly to pass the broadcast to other subnets.\n- Identify Rogue Servers: rver to initiate a TCP (Transmission Control Protocol) three-way handshake, used to establish a reliable, connection-oriented communication channel by synchronizing sequence numbers.\n", "cluster": 13, "cluster_name": "Cluster 13", "cluster_count": 4, "cluster_row_number": 2, "pos_group": "other", "row_number": 61, "details": [{"label": "ERROR SYMPTOMS", "value": "- Connection Timeout / \"Server Unreachable\": Outbound SYN packets are sent but receive no response, causing applications to hang during the initial connection phase.\n- Connection Refused (RST): The client immediately receives a Reset (RST) packet back instead of an acknowledgement.\n- High Network Latency: Severe delays during the initial setup of web pages or network services, though active streams perform normally.\n- Server Performance Degradation: The target server runs out of memory, drops legitimate connections, or experiences high CPU usage due to a flood of orphaned connection requests."}, {"label": "TROUBLESHOOTING", "value": "- Analyze Traffic with Wireshark: Capture packets on the network interface to verify if outbound SYN packets are actually being generated and transmitted.\n- Inspect Firewall and ACL (Allow Client List) Rules: Check local, network, and cloud firewalls to ensure that the required inbound/outbound (Transmission Control Protocol) TCP port is open and not dropping traffic.\n- Verify Service Status: Check the target server to confirm that the listening application or service is active and bound to the correct port.\n- Mitigate SYN Flood Attacks: Enable TCP SYN cookies on the server operating system or implement rate-limiting on network firewalls to protect against Denial of Service (DoS) attacks."}, {"label": "PRIMARY CATEGORY", "value": "Networking"}, {"label": "SUB CATEGORY", "value": "Network Protocols / Transport Layer Security"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "SYN packet (Synchronize Packet) The initial data packet sent by a client host to a server to initiate a TCP (Transmission Control Protocol) three-way handshake, used to establish a reliable, connection-oriented communication channel by synchronizing sequence numbers.\n other ERROR SYMPTOMS - Connection Timeout / \"Server Unreachable\": Outbound SYN packets are sent but receive no response, causing applications to hang during the initial connection phase.\n- Connection Refused (RST): The client immediately receives a Reset (RST) packet back instead of an acknowledgement.\n- High Network Latency: Severe delays during the initial setup of web pages or network services, though active streams perform normally.\n- Server Performance Degradation: The target server runs out of memory, drops legitimate connections, or experiences high CPU usage due to a flood of orphaned connection requests. TROUBLESHOOTING - Analyze Traffic with Wireshark: Capture packets on the network interface to verify if outbound SYN packets are actually being generated and transmitted.\n- Inspect Firewall and ACL (Allow Client List) Rules: Check local, network, and cloud firewalls to ensure that the required inbound/outbound (Transmission Control Protocol) TCP port is open and not dropping traffic.\n- Verify Service Status: Check the target server to confirm that the listening application or service is active and bound to the correct port.\n- Mitigate SYN Flood Attacks: Enable TCP SYN cookies on the server operating system or implement rate-limiting on network firewalls to protect against Denial of Service (DoS) attacks. PRIMARY CATEGORY Networking SUB CATEGORY Network Protocols / Transport Layer Security CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "SYN-ACK (Synchronize-Acknowledgment Packet)", "definition": "The second packet in the TCP (Transmission Control Protocol) three-way handshake, sent by a server back to a client host to acknowledge the receipt of the initial SYN packet and synchronize its own sequence numbers for bidirectional communication.", "cluster": 13, "cluster_name": "Cluster 13", "cluster_count": 4, "cluster_row_number": 3, "pos_group": "other", "row_number": 62, "details": [{"label": "ERROR SYMPTOMS", "value": "-\"Connection Reset by Peer\": The client receives a SYN-ACK but the connection is instantly broken before data transfer begins.\n- Stuck in SYN_RECV (Synchronize Received) State: The server logs show numerous connections stuck waiting for the final response from the client, depleting system resources.\n- Intermittent Connectivity: Only certain client machines can successfully connect to a server, while others drop during the handshake."}, {"label": "TROUBLESHOOTING", "value": "- Trace the Handshake Sequence: Use network sniffing tools (e.g., \"tcpdump\" or Wireshark) to verify if the server is generating the SYN-ACK packet and if it reaches the client.\n- Fix Asymmetric Routing: Check router and gateway configurations to ensure that the return path from the server back to the client is not taking a different, blocked route.\n- Adjust MTU Settings: Reduce the Maximum Transmission Unit (MTU) size on the network interfaces if large packets containing handshake headers are being silently dropped by intermediate routers.\n- Clear TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" and \"netsh winsock reset\" in an elevated Windows Command Prompt to clear local network corruption preventing proper handshake negotiation."}, {"label": "PRIMARY CATEGORY", "value": "Networking"}, {"label": "SUB CATEGORY", "value": "Network Protocols / Connection Management"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "SYN-ACK (Synchronize-Acknowledgment Packet) The second packet in the TCP (Transmission Control Protocol) three-way handshake, sent by a server back to a client host to acknowledge the receipt of the initial SYN packet and synchronize its own sequence numbers for bidirectional communication. other ERROR SYMPTOMS -\"Connection Reset by Peer\": The client receives a SYN-ACK but the connection is instantly broken before data transfer begins.\n- Stuck in SYN_RECV (Synchronize Received) State: The server logs show numerous connections stuck waiting for the final response from the client, depleting system resources.\n- Intermittent Connectivity: Only certain client machines can successfully connect to a server, while others drop during the handshake. TROUBLESHOOTING - Trace the Handshake Sequence: Use network sniffing tools (e.g., \"tcpdump\" or Wireshark) to verify if the server is generating the SYN-ACK packet and if it reaches the client.\n- Fix Asymmetric Routing: Check router and gateway configurations to ensure that the return path from the server back to the client is not taking a different, blocked route.\n- Adjust MTU Settings: Reduce the Maximum Transmission Unit (MTU) size on the network interfaces if large packets containing handshake headers are being silently dropped by intermediate routers.\n- Clear TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" and \"netsh winsock reset\" in an elevated Windows Command Prompt to clear local network corruption preventing proper handshake negotiation. PRIMARY CATEGORY Networking SUB CATEGORY Network Protocols / Connection Management CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "ACK packet (Acknowledgment Packet)", "definition": "The final packet in the TCP (Transmission Control Protocol) three-way handshake\u2014and the baseline packet used during an active session\u2014sent to confirm the successful receipt of data or to complete the connection setup before data transmission begins.\n", "cluster": 13, "cluster_name": "Cluster 13", "cluster_count": 4, "cluster_row_number": 4, "pos_group": "other", "row_number": 63, "details": [{"label": "ERROR SYMPTOMS", "value": "- Stuck Connections: A socket connection appears to open successfully but immediately freezes or hangs indefinitely when attempting to transmit application data.\n- High Packet Retransmission: Network monitors reveal a surge in duplicated data frames being sent over the wire, severely throttling network throughput.\n- Connection Dropouts: Connections are abruptly terminated with errors like ECONNRESET (Connection Reset by peer) or \"Connection timed out\" shortly after the initial handshake completes."}, {"label": "TROUBLESHOOTING", "value": "- Verify Three-Way Handshake Completion: Run a packet capture in Wireshark and filter for \"tcp.flags.ack == 1\" to verify if the client's final ACK packet is reaching the server interface.\n- Check Stateful Firewall Tables: Inspect intermediate firewalls to ensure they aren't prematurely dropping the ACK packet due to exhausted state table limits or overly aggressive timeout rules.\n- Disable TCP Offloading: Open Device Manager, navigate to your Network Adapter properties, click the Advanced tab, and temporarily disable Large Send Offload (LSO) and TCP Checksum Offload to resolve hardware-level packet formatting bugs.\n- Isolate Bad Network Hardware: Run a continuous ping test (\"ping -t\") alongside your data transfer to pinpoint faulty switches, damaged cables, or failing access points that are causing packet corruption and dropping small ACK frames."}, {"label": "PRIMARY CATEGORY", "value": "Networking"}, {"label": "SUB CATEGORY", "value": "Network Protocols / Connection Management"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "ACK packet (Acknowledgment Packet) The final packet in the TCP (Transmission Control Protocol) three-way handshake\u2014and the baseline packet used during an active session\u2014sent to confirm the successful receipt of data or to complete the connection setup before data transmission begins.\n other ERROR SYMPTOMS - Stuck Connections: A socket connection appears to open successfully but immediately freezes or hangs ind m selected by the US government to protect classified data. It operates with key lengths of 128, 192, or 256 bits and serves as the cryptographic core for modern security systems, including WPA2 (Wi-Fi Protected Access version 2)/WPA3 (Wi-Fi Protected Access version 3) wireless security and BitLocker drive encryption. other ERROR SYMPTOMS Network data or hard drive partitions are vulnerable to offline dictionary cracking attacks due to the use of outdated encryption algorithms like TKIP (Temporal Key Integrity Protocol), WEP (Wire Equivalent Privacy), or DES (Data Encryption standard) instead of AES (American Encryption Standard). TROUBLESHOOTING Access the wireless access point or router management panel and switch the security configuration dropdown menu from legacy TKIP over to AES (or CCMP (Counter Cipher Mode with Block Chaining Message Authentication Code Protocol (CBA-MAC))/GCMP (Galois/Counter Mode Protocol)); ensure all corporate data encryption policies mandate the use of AES-256 bit lengths for data at rest and data in transit. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Wireless Security Standards CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "secpol.msc (Local Security Policy)", "definition": "A built-in Windows Microsoft Management Console (MMC) snap-in used to configure local security settings, password restrictions, account lockout parameters, and audit policies on an individual computer.", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 1, "pos_group": "other", "row_number": 54, "details": [{"label": "ERROR SYMPTOMS", "value": "- \"Windows cannot find 'secpol.msc'\": The utility fails to launch entirely, which typically happens on Windows Home editions where it is not included.\n- Settings Grayed Out: Specific security options or policies are visible but locked, preventing modification.\n- \"Access is Denied\": Changes to a policy fail to save or apply when clicking the \"Apply\" button.\n
