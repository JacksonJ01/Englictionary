ion, use Registry Editor (regedit) equivalents or upgrade the OS.\n- Run as Administrator: Close the console, open an elevated Command Prompt (Run as Administrator), and type \"secpol.msc\" to bypass local permission restrictions.\n- Check Domain GPO Conflicts: Run \"gpresult /h gpreport.html\" from the command line to verify if an Active Directory Domain Group Policy is overriding your local configuration.\n- Force Policy Refresh: Run \"gpupdate /force\" in the Command Prompt after making changes to instantly push the new security parameters to the operating system. PRIMARY CATEGORY Operating Systems SUB CATEGORY Windows Management Tools / Security Utilities CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "Accounts: Managing, best practices", "definition": "The framework of administrative rules for securing credentials across an enterprise network. Core principles include enforcing the Principle of Least Privilege (giving users only the access needed for their job), mandating complex unique passwords, requiring multi-factor authentication (MFA), renaming default administrator names, and immediately disabling stale or terminated employee profiles.", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 2, "pos_group": "other", "row_number": 57, "details": [{"label": "ERROR SYMPTOMS", "value": "Regular corporate users possessing full local admin rights accidentally downloading ransomware, widespread privilege escalation across internal segments, or credential-harvesting attacks succeeding due to a complete lack of MFA."}, {"label": "TROUBLESHOOTING", "value": "Conduct a thorough user access review across the local system or directory environment; strip standard users out of elevated privilege groups; configure explicit password expiration and complexity constraints using administrative templates or Group Policy."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Account Security Best Practices"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "Accounts: Managing, best practices The framework of administrative rules for securing credentials across an enterprise network. Core principles include enforcing the Principle of Least Privilege (giving users only the access needed for their job), mandating complex unique passwords, requiring multi-factor authentication (MFA), renaming default administrator names, and immediately disabling stale or terminated employee profiles. other ERROR SYMPTOMS Regular corporate users possessing full local admin rights accidentally downloading ransomware, widespread privilege escalation across internal segments, or credential-harvesting attacks succeeding due to a complete lack of MFA. TROUBLESHOOTING Conduct a thorough user access review across the local system or directory environment; strip standard users out of elevated privilege groups; configure explicit password expiration and complexity constraints using administrative templates or Group Policy. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Account Security Best Practices CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "Administrative Tools: Local Security Editor", "definition": "A specialized administrative tool (\"secpol.msc\") that is a subset of the Group Policy Editor. It is focused explicitly on configuring local machine security policies, including password complexity requirements, account lockout thresholds, user rights assignments, and audit logging parameters.", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 3, "pos_group": "other", "row_number": 89, "details": [{"label": "ERROR SYMPTOMS", "value": "Workstations permit weak user passwords (like \"12345\") or fail to log failed login attempts, making it impossible for security teams to track active brute-force password attacks on local profiles."}, {"label": "TROUBLESHOOTING", "value": "Open the Local Security Policy tool (\"secpol.msc\"); navigate to \"Account Policies > Password Policy\" to configure password length requirements; navigate to \"Local Policies > Audit Policy\" to activate tracking for successful and failed login attempts."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Windows Administrative Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Administrative Tools: Local Security Editor A specialized administrative tool (\"secpol.msc\") that is a subset of the Group Policy Editor. It is focused explicitly on configuring local machine security policies, including password complexity requirements, account lockout thresholds, user rights assignments, and audit logging parameters. other ERROR SYMPTOMS Workstations permit weak user passwords (like \"12345\") or fail to log failed login attempts, making it impossible for security teams to track active brute-force password attacks on local profiles. TROUBLESHOOTING Open the Local Security Policy tool (\"secpol.msc\"); navigate to \"Account Policies > Password Policy\" to configure password length requirements; navigate to \"Local Policies > Audit Policy\" to activate tracking for successful and failed login attempts. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Windows Administrative Utilities CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "Administrator accounts: Best practices", "definition": "Security guidelines for managing high-privileged user identities. Key rules include avoiding daily web browsing or email tasks on an administrator account, using standard accounts for routine tasks, renaming default administrator accounts to hide them from automated scripts, and requiring unique passwords paired with multi-factor authentication (MFA).", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 4, "pos_group": "other", "row_number": 94, "details": [{"label": "ERROR SYMPTOMS", "value": "Widespread malware or ransomware infections successfully compromise an entire system root folder because an employee was browsing the web or checking emails while logged directly into a local administrator account."}, {"label": "TROUBLESHOOTING", "value": "Create standard unprivileged accounts for all employees' daily workloads; remove standard users from the local Administrators group; implement strict User Account Control (UAC) alert settings across all corporate endpoints."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Account Security Best Practices"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "Administrator accounts: Best practices Security guidelines for managing high-privileged user identities. Key rules include avoiding daily web browsing or email tasks on an administrator account, using standard accounts for routine tasks, renaming default administrator accounts to hide them from automated scripts, and requiring unique passwords paired with multi-factor authentication (MFA). other ERROR SYMPTOMS Widespread malware or ransomware infections successfully compromise an entire system root folder because an employee was browsing the web or checking emails while logged directly into a local administrator account. TROUBLESHOOTING Create standard unprivileged accounts for all employees' daily workloads; remove standard users from the local Administrators group; implement strict User Account Control (UAC) alert settings across all corporate endpoints. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Account Security Best Practices CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "Administrator accounts: Passwords", "definition": "The complex authentication strings used to protect elevated administrative accounts from unauthorized access. These passwords should be significantly longer and more secure than standard user passwords, and they should be regularly rotated using centralized credential managers.", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 5, "pos_group": "other", "row_number": 95, "details": [{"label": "ERROR SYMPTOMS", "value": "Attackers successfully execute brute-force or dictionary attacks to gain full administrative control over a machine due to the local administrator password being weak or left at factory default settings."}, {"label": "TROUBLESHOOTING", "value": "Use Group Policy Objects (\"secpol.msc\") to enforce a high minimum password length (minimum 14+ characters) and complexity requirements; implement a Local Administrator Password Solution (LAPS) to automatically rotate unique passwords across every device on the network."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "User Account Management"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "Administrator accounts: Passwords The complex authentication strings used to protect elevated administrative accounts from unauthorized access. These passwords should be significantly longer and more secure than standard user passwords, and they should be regularly rotated using centralized credential managers. other ERROR SYMPTOMS Attackers successfully execute brute-force or dictionary attacks to gain full administrative control over a machine due to the local administrator password being weak or left at factory default settings. TROUBLESHOOTING Use Group Policy Objects (\"secpol.msc\") to enforce a high minimum password length (minimum 14+ characters) and complexity requirements; implement a Local Administrator Password Solution (LAPS) to automatically rotate unique passwords across every device on the network. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY User Account Management CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "Aging passwords", "definition": "A security account policy configuration that defines a maximum password lifetime (e.g., requiring a password change every 90 days). It helps limit the amount of time an attacker can use a stolen or compromised password before it becomes useless.", "cluster": 29, "cluster_name": "Cluster 29", "cluster_count": 6, "cluster_row_number": 6, "pos_group": "other", "row_number": 100, "details": [{"label": "ERROR SYMPTOMS", "value": "Users continue using the exact same weak password for years without rotating it, increasing the risk that leaked corporate credentials from old third-party breaches remain active and usable on the corporate network."}, {"label": "TROUBLESHOOTING", "value": "Open Local Security Policy (\"secpol.msc\") or use Active Directory Group Policy; navigate to \"Account Policies > Password Policy\"; configure the Maximum password age counter to a secure value (such as 60 or 90 days) to force automatic password updates."}, {"label": "PRIMARY CATEGORY", "value": "Network Security & Access Control"}, {"label": "SUB CATEGORY", "value": "Logical Security Controls"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "SECURITY"}], "search_text": "Aging passwords A security account policy configuration that defines a maximum password lifetime (e.g., requiring a password change every 90 days). It helps limit the amount of time an attacker can use a stolen or compromised password before it becomes useless. other ERROR SYMPTOMS Users continue using the exact same weak password for years without rotating it, increasing the risk that leaked corporate credentials from old third-party breaches remain active and usable on the corporate network. TROUBLESHOOTING Open Local Security Policy (\"secpol.msc\") or use Active Directory Group Policy; navigate to \"Account Policies > Password Policy\"; configure the Maximum password age counter to a secure value (such as 60 or 90 days) to force automatic password updates. PRIMARY CATEGORY Network Security & Access Control SUB CATEGORY Logical Security Controls CORE CORE 2 CORE 2: DOMAIN SECURITY"}, {"word": "802.11 wireless protocol: MIMO technologies", "definition": "Multiple-Input Multiple-Output. A wireless engineering technology used starting with 802.11n that utilizes multiple antennas for both transmitting and receiving data streams simultaneously, improving overall speed and signal reliability.", "cluster": 30, "cluster_name": "Cluster 30", "cluster_count": 2, "cluster_row_number": 1, "pos_group": "other", "row_number": 18, "details": [{"label": "ERROR SYMPTOMS", "value": "Slow file transfer speeds or erratic network performance on a device despite showing strong physical signal bars."}, {"label": "TROUBLESHOOTING", "value": "Ensure all physical external antennas on the access point are securely attached and oriented correctly (perpendicular to one another); update the client network card drivers to ensure the MIMO spatial stream logic functions correctly."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: MIMO technologies Multiple-Input Multiple-Output. A wireless engineering technology used starting with 802.11n that utilizes multiple antennas for both transmitting and receiving data streams simultaneously, improving overall speed and signal reliability. other ERROR SYMPTOMS Slow file transfer speeds or erratic network performance on a device despite showing strong physical signal bars. TROUBLESHOOTING Ensure all physical external antennas on the access point are securely attached and oriented correctly (perpendicular to one another); update the client network card drivers to ensure the MIMO spatial stream logic functions correctly. PRIMARY CATEGORY Wireless Networks SUB CATEGORY 802.11 wireless protocol CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "802.11 wireless protocol: MU-MIMO technologies", "definition": "Multi-User Multiple-Input Multiple-Output. An evolution introduced in 802.11ac (Wave 2) and expanded in 802.11ax that allows a wireless access point to transmit data streams to multiple independent client devices at the exact same time, rather than making them wait in a queue.", "cluster": 30, "cluster_name": "Cluster 30", "cluster_count": 2, "cluster_row_number": 2, "pos_group": "other", "row_number": 20, "details": [{"label": "ERROR SYMPTOMS", "value": "Severe network sluggishness, buffering, or latency spikes occurring specifically when a high volume of client devices (e.g., in a classroom or stadium) attempt to connect to a single access point simultaneously."}, {"label": "TROUBLESHOOTING", "value": "Upgrade the legacy access point to an enterprise-grade hardware model supporting MU-MIMO; ensure client devices support the technology; segment heavy data clients across separate physical access points or bands."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: MU-MIMO technologies Multi-User Multiple-Input Multiple-Output. An evolution introduced in 802.11ac (Wave 2) and expanded in 802.11ax that allows a wireless access point to transmit data streams to multiple independent client devices at the exact same time, rather than making them wait in a queue. other ERROR SYMPTOMS Severe network sluggishness, buffering, or latency spikes occurring specifically when a high volume of client devices (e.g., in a classroom or stadium) attempt to connect to a single access point simultaneously. TROUBLESHOOTING Upgrade the legacy access point to an enterprise-grade hardware model supporting MU-MIMO; ensure client devices support the technology; segment heavy data clients across separate physical access points or bands. PRIMARY CATEGORY Wireless Networks SUB CATEGORY 802.11 wireless protocol CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "802.11 wireless protocol: Channels", "definition": "Smaller, distinct slices of a wireless frequency band allocated for communication. The 2.4 GHz band uses 11 channels (in the US) with only 3 being non-overlapping (1, 6, 11), while the 5 GHz and 6 GHz bands offer far more channels that do not overlap.", "cluster": 31, "cluster_name": "Cluster 31", "cluster_count": 7, "cluster_row_number": 1, "pos_group": "other", "row_number": 14, "details": [{"label": "ERROR SYMPTOMS", "value": "Low data speeds, high latency, or intermittent dropouts caused by multiple neighboring routers broadcasting on the exact same or an overlapping channel (co-channel interference)."}, {"label": "TROUBLESHOOTING", "value": "Run a wireless site survey; log into the wireless access point and change the channel configuration from \"Auto\" to a fixed, clean channel that has the least amount of detected traffic."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: Channels Smaller, distinct slices of a wireless frequency band allocated for communication. The 2.4 GHz band uses 11 channels (in the US) with only 3 being non-overlapping (1, 6, 11), while the 5 GHz and 6 GHz bands offer far more channels that do not overlap. other ERROR SYMPTOMS Low data speeds, high latency, or intermittent dropouts caused by multiple neighboring routers broadcasting on the exact same or an overlapping channel (co-channel interference). TROUBLESHOOTING Run a wireless site survey; log into the wireless access point and change the channel configuration from \"Auto\" to a fixed, clean channel that has the least amount of detected traffic. PRIMARY CATEGORY Wireless Networks SUB CATEGORY 802.11 wireless protocol CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "802.11 wireless protocol: Coverage/distance", "definition": "The effective physical radius within which a wireless access point can successfully transmit and receive data from client devices. Higher frequencies (5 GHz / 6 GHz) cover less distance and degrade faster through walls than lower frequencies (2.4 GHz).", "cluster": 31, "cluster_name": "Cluster 31", "cluster_count": 7, "cluster_row_number": 2, "pos_group": "other", "row_number": 15, "details": [{"label": "ERROR SYMPTOMS", "value": "Low signal strength bars on client devices, sudden disconnection when moving a short distance from the access point, or a complete lack of connectivity in specific \"dead zones\" of a building."}, {"label": "TROUBLESHOOTING", "value": "Move the wireless access point to a central, elevated location away from thick concrete walls and metal surfaces; install a wireless range extender or transition to a mesh network to fill dead zones."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: Coverage/distance The effective physical radius within which a wireless access point can successfully transmit and receive data from client devices. Higher frequencies (5 GHz / 6 GHz) cover less distance and degrade faster through walls than lower frequencies (2.4 GHz). other ERROR SYMPTOMS Low signal strength bars on client devices, sudden disconnection when moving a short distance from the access point, or a complete lack of connectivity in specific \"dead zones\" of a building. TROUBLESHOOTING Move the wireless access point to a central, elevated location away from thick concrete walls and metal surfaces; install a wireless range extender or transition to a mesh network to fill dead zones. PRIMARY CATEGORY Wireless Networks SUB CATEGORY 802.11 wireless protocol CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "802.11 wireless protocol: Frequencies", "definition": "The specific radio frequency bands allocated for Wi-Fi communications, primarily consisting of 2.4 GHz (long range, slow speed, high congestion), 5 GHz (shorter range, fast speed, low congestion), and 6 GHz utilized by Wi-Fi 6E/7 (shortest range, extreme speed, zero legacy interference).", "cluster": 31, "cluster_name": "Cluster 31", "cluster_count": 7, "cluster_row_number": 3, "pos_group": "other", "row_number": 16, "details": [{"label": "ERROR SYMPTOMS", "value": "Inability of older legacy devices to discover a 5 GHz/6 GHz network, or modern high-bandwidth devices slowing down due to being forced onto a crowded 2.4 GHz band."}, {"label": "TROUBLESHOOTING", "value": "Verify client hardware specifications; implement a \"Band Steering\" configuration on the router to automatically push dual-band client devices onto the faster, less congested 5 GHz or 6 GHz frequencies."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: Frequencies The specific radio frequency bands allocated for Wi-Fi communications, primarily consisting of 2.4 GHz (long range, slow speed, high congestion), 5 GHz (shorter range, fast speed, low congestion), and 6 GHz utilized by Wi-Fi 6E/7 (shortest range, extreme speed, zero legacy interference). other ERROR SYMPTOMS Inability of older legacy devices to discover a 5 GHz/6 GHz network, or modern high-bandwidth devices slowing down due to being forced onto a crowded 2.4 GHz band. TROUBLESHOOTING Verify client hardware specifications; implement a \"Band Steering\" con oth devices). TROUBLESHOOTING Identify and move non-Wi-Fi interferers away from the access point and client hardware; migrate high-priority corporate traffic over to the cleaner 5 GHz or 6 GHz bands where consumer appliance overlap is non-existent. PRIMARY CATEGORY Wireless Networks SUB CATEGORY 802.11 wireless protocol CORE CORE 1 CORE 1: DOMAIN NETWORKING"}, {"word": "802.11 wireless protocol: Multipath propagation", "definition": "A phenomenon where radio signals bounce off physical obstructions (walls, ceilings, furniture), causing the signal to split and arrive at the receiving antenna via different paths and at slightly staggered times.", "cluster": 31, "cluster_name": "Cluster 31", "cluster_count": 7, "cluster_row_number": 5, "pos_group": "other", "row_number": 19, "details": [{"label": "ERROR SYMPTOMS", "value": "Intermittent signal degradation, packet corruption, or a \"ghosting\" effect on wireless data packet delivery in highly reflective environments like industrial warehouses."}, {"label": "TROUBLESHOOTING", "value": "Ensure the wireless system utilizes modern standards (802.11n or newer) that leverage MIMO to recombine multipath reflections into a stronger combined signal, rather than treating reflections as destructive interference."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY", "value": "802.11 wireless protocol"}, {"label": "CORE", "value": "CORE 1"}, {"label": "CORE 1: DOMAIN", "value": "NETWORKING"}], "search_text": "802.11 wireless protocol: Multipath propagation A phenomenon where radio signals bounce off physical obstructions (walls, ceilings, furniture), causing the signal to split and arrive at the receiving antenna via different paths and at slightly staggered times. other ERROR SYMPTOMS Intermittent signal degradation, packet corruption, or a \"ghosting\" effect on wireless data packet delivery in highly reflective environments like industrial warehouses. TROUBLESHOOTING Ensure the wireless system s. In laptops, these antennas are typically run as thin wires threaded up through the physical display bezel for elevated spatial clearance. other ERROR SYMPTOMS Laptop displays low signal or can no longer discover nearby wireless networks even when sitting next to the router, or experiencing intermittent dropping of local area network (LAN) associations. TROUBLESHOOTING Open the laptop chassis or display bezel; check the delicate main and auxiliary micro-coaxial cable connections mating to the internal wireless network interface card (NIC); re-seat the tiny gold connectors if they have vibrated loose. PRIMARY CATEGORY Mobile Devices and Mobile Hardware SUB CATEGORY Laptop Hardware Components CORE CORE 1 CORE 1: DOMAIN MOBILE DEVICES"}, {"word": "Antennas: SOHO networks", "definition": "Physical hardware elements attached to SOHO (Small Office / Home Office) wireless routers or APs (Access Points) that radiate and capture radio frequency signals. They can be omnidirectional (broadcasting signals equally in all horizontal directions) or directional (focusing signal power in one explicit path to span longer distances).", "cluster": 32, "cluster_name": "Cluster 32", "cluster_count": 2, "cluster_row_number": 1, "pos_group": "other", "row_number": 113, "details": [{"label": "ERROR SYMPTOMS", "value": "Unexplained wireless \"dead zones\" inside an office building, rapid drops in signal strength just a few feet away from the wireless router, or extremely low data transmission speeds."}, {"label": "TROUBLESHOOTING", "value": "Ensure all external omnidirectional antennas are physically securely screwed into their reverse polarity subminiature version A (RP-SMA) connectors; orient external antennas perpendicularly (one vertical, one horizontal) to maximize wave polarization alignment; swap low-gain factory antennas with aftermarket high-gain antennas to expand the wireless coverage radius."}, {"label": "PRIMARY CATEGORY", "value": "Wireless Networks"}, {"label": "SUB CATEGORY stems Management"}, {"label": "SUB CATEGORY", "value": "Command-Line Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "Ampersand (&&), double A logical execution operator used within command-line interfaces (such as the Windows Command Prompt or Linux Bash shell) to chain multiple independent commands together in a single line. The system will execute the second command only if the first command completes successfully without returning an error code. other ERROR SYMPTOMS Multi-step command scripts or automated deployment routines halt abruptly midway, and the secondary commands fail to run because the initial command returned an unexpected error code. TROUBLESHOOTING Check the syntax of your combined command string (e.g., \"mkdir BackupFolder && copy c:\\data\\*.* c:\\BackupFolder\"); verify that the first command runs cleanly on its own before using the \"&&\" operator to link it to additional tasks. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Command-Line Utilities CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "&& (double ampersand), Linux", "definition": "A logical conditional execution operator used in Linux shell environments (like \"Bash\" or \"Zsh\") to chain multiple commands together on a single command line. The shell evaluates the commands sequentially from left to right, executing the subsequent command if and only if the preceding command terminates with an exit status code of exactly \"0\" (which signifies success in Linux).", "cluster": 36, "cluster_name": "Cluster 36", "cluster_count": 2, "cluster_row_number": 2, "pos_group": "other", "row_number": 109, "details": [{"label": "ERROR SYMPTOMS", "value": "Scripted automation sequences fail to finish, or a combined command pipeline silently stops midway. For example, a target directory remains completely empty after running a build chain because the compilation stage failed, preventing the deployment stage from firing."}, {"label": "TROUBLESHOOTING", "value": "Manually run the first command alone, and immediately check its exit status by executing \"echo $\"?. If the returned value is anything other than \"0\" (e.g., \"1\" or \"127\"), troubleshoot the root error of that specific command before re-chaining it with the \"&&\" operator."}, {"label": "PRIMARY CATEGORY", "value": "Operating Systems Management"}, {"label": "SUB CATEGORY", "value": "Linux Command-Line Utilities"}, {"label": "CORE", "value": "CORE 2"}, {"label": "CORE 2: DOMAIN", "value": "OPERATING SYSTEMS"}], "search_text": "&& (double ampersand), Linux A logical conditional execution operator used in Linux shell environments (like \"Bash\" or \"Zsh\") to chain multiple commands together on a single command line. The shell evaluates the commands sequentially from left to right, executing the subsequent command if and only if the preceding command terminates with an exit status code of exactly \"0\" (which signifies success in Linux). other ERROR SYMPTOMS Scripted automation sequences fail to finish, or a combined command pipeline silently stops midway. For example, a target directory remains completely empty after running a build chain because the compilation stage failed, preventing the deployment stage from firing. TROUBLESHOOTING Manually run the first command alone, and immediately check its exit status by executing \"echo $\"?. If the returned value is anything other than \"0\" (e.g., \"1\" or \"127\"), troubleshoot the root error of that specific command before re-chaining it with the \"&&\" operator. PRIMARY CATEGORY Operating Systems Management SUB CATEGORY Linux Command-Line Utilities CORE CORE 2 CORE 2: DOMAIN OPERATING SYSTEMS"}, {"word": "Accounts: Lockout thresholds", "definition": "A security policy parameter that dictates the exact number of consecutive failed login attempts a user can make before their account is automatically locked out by the operating system to prevent brute-force or     function renderMetadataHtml(info, pinned) {
      return `<b>${escapeHtml(info.word)}</b>` +
        `<br>cluster number: ${info.cluster}` +
        `<br>cluster node count: ${info.cluster_count}` +
        `<br>source row: ${info.row_number} of ${payload.source_row_count}` +
        `<br>cluster row: ${info.cluster_row_number} of ${info.cluster_count}` +
        `<br>pos: ${escapeHtml(info.pos_group || 'other')}` +
        (info.definition ? `<div style="margin-top:8px;white-space:pre-wrap;">${escapeHtml(String(info.definition))}</div>` : '') +
        formatDetailFields(info.details) +
        (pinned ? '<br><span style="opacity:0.8">click empty space to clear</span>' : '');
    }

    function getLegendMatchTier(info, query) {
      const normalizedQuery = normalizeSearchValue(query);
      if (!normalizedQuery) {
        return null;
      }

      const normalizedWord = normalizeSearchValue(info.word);
      const normalizedDefinition = normalizeSearchValue(info.definition);
      const normalizedSearchText = normalizeSearchValue(info.search_text);

      if (normalizedWord && normalizedWord.startsWith(normalizedQuery)) {
        return 0;
      }

      if (normalizedDefinition && normalizedDefinition.startsWith(normalizedQuery)) {
        return 1;
      }

      if (normalizedWord && normalizedWord.includes(normalizedQuery)) {
        return 2;
      }

      if (normalizedDefinition && normalizedDefinition.includes(normalizedQuery)) {
        return 3;
      }

      if (normalizedSearchText && normalizedSearchText.startsWith(normalizedQuery)) {
        return 4;
      }

      if (normalizedSearchText && normalizedSearchText.includes(normalizedQuery)) {
        return 5;
      }

      return null;
    }

    function collectLegendMatches(indices, query) {
      const normalizedQuery = normalizeSearchValue(query);
      if (!normalizedQuery) {
        return [];
      }

      const matches = [];
      for (const metaIndex of indices) {
        const info = payload.metadata[metaIndex];
        const tier = getLegendMatchTier(info, normalizedQuery);
        if (tier === null) {
          continue;
        }
        matches.push({ metaIndex, tier, word: normalizeSearchValue(info.word) });
      }

      matches.sort((a, b) => a.tier - b.tier || a.word.localeCompare(b.word));
      return matches;
    }

    function getClusterRepresentative(clusterId) {
      const indices = clusterIndicesById.get(clusterId) || [];
      if (!indices.length) {
        return null;
      }
      return payload.metadata[indices[0]] || null;
    }

    function updateDrilldownControls() {
      const isClusterDrilldown = activeClusterId !== null;
      legendSearchInput.placeholder = isClusterDrilldown
        ? 'Search words in this cluster...'
        : 'Search words in legend...';
      const hasSearch = String(legendSearchInput.value || '').trim().length > 0;
      legendBackToClusters.style.display = (isClusterDrilldown || hasSearch) ? 'block' : 'none';
    }

    function syncLegendSelection() {
      legendList.querySelectorAll('.legend-row').forEach((el) => {
        const metaIndex = Number(el.dataset.metaIndex);
        const isSelected = !Number.isNaN(metaIndex) && selectedLegendMetaIndex !== null && metaIndex === selectedLegendMetaIndex;
        el.classList.toggle('selected', isSelected);
      });
    }

    function resetLegendScroll() {
      legendList.scrollTop = 0;
      requestAnimationFrame(() => {
        legendList.scrollTop = 0;
      });
      setTimeout(() => {
        legendList.scrollTop = 0;
      }, 0);
    }

    function resetClusterDrilldown() {
      activeClusterId = null;
      pinnedIndex = null;
      selectedLegendMetaIndex = null;
      legendSearchInput.value = '';
      tooltip.style.display = 'none';
      updateDrilldownControls();
      renderLegendList('');
    }

    function enterClusterDrilldown(clusterId) {
      activeClusterId = clusterId;
      pinnedIndex = null;
      selectedLegendMetaIndex = null;
      tooltip.style.display = 'none';
      updateDrilldownControls();
      renderLegendList(legendSearchInput.value);
    }

    function renderLegendList(rawQuery) {
      const query = normalizeSearchValue(rawQuery);
      if (activeClusterId !== null) {
        const clusterInfo = payload.cluster_summary.find((item) => item.cluster === activeClusterId);
        const clusterIndices = clusterIndicesById.get(activeClusterId) || [];
        if (!query) {
          legendList.innerHTML = clusterIndices.map((metaIndex) => {
            const info = payload.metadata[metaIndex];
            const definitionSnippet = info.definition ? `<div style="margin-top:2px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;">${escapeHtml(String(info.definition).slice(0, 60))}</div>` : '';
            return `<div class="legend-row" data-kind="word" data-meta-index="${metaIndex}" data-cluster="${info.cluster}">` +
              `<div class="legend-left">` +
                `<span class="legend-swatch" style="background:${payload.cluster_summary.find((c) => c.cluster === info.cluster)?.color || '#0f172a'}"></span>` +
                `<div style="min-width:0;">` +
                  `<div class="legend-name">${escapeHtml(info.word)}</div>` +
                  `${definitionSnippet}` +
                `</div>` +
              `</div>` +
              `<span class="legend-count">C${info.cluster}</span>` +
            `</div>`;
          }).join('');

          const clusterWordCount = clusterIndices.length;
          legendInfo.textContent = `${clusterInfo ? clusterInfo.name : `Cluster ${activeClusterId}`} • ${clusterWordCount} words`;
          resetLegendScroll();
          syncLegendSelection();
          bindLegendRowHoverHandlers();
          return;
        }

        const matches = collectLegendMatches(clusterIndices, query);

        legendList.innerHTML = matches.map(({ metaIndex }) => {
          const info = payload.metadata[metaIndex];
          const definitionSnippet = info.definition ? `<div style="margin-top:2px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;">${escapeHtml(String(info.definition).slice(0, 60))}</div>` : '';
          return `<div class="legend-row" data-kind="word" data-meta-index="${metaIndex}" data-cluster="${info.cluster}">` +
            `<div class="legend-left">` +
              `<span class="legend-swatch" style="background:${payload.cluster_summary.find((c) => c.cluster === info.cluster)?.color || '#0f172a'}"></span>` +
              `<div style="min-width:0;">` +
                `<div class="legend-name">${escapeHtml(info.word)}</div>` +
                `${definitionSnippet}` +
              `</div>` +
            `</div>` +
            `<span class="legend-count">C${info.cluster}</span>` +
          `</div>`;
        }).join('');

        const clipped = matches.length > 140 ? ' (showing first 140)' : '';
        legendInfo.textContent = `${clusterInfo ? clusterInfo.name : `Cluster ${activeClusterId}`} • ${matches.length} words${clipped}`;
        resetLegendScroll();
        syncLegendSelection();
        bindLegendRowHoverHandlers();
        return;
      }

      if (!query) {
        legendList.innerHTML = payload.cluster_summary.map((item) =>
          `<div class="legend-row" data-kind="cluster" data-cluster="${item.cluster}" data-drilldown-file="${item.drilldown_file || ''}">` +
            `<div class="legend-left">` +
              `<span class="legend-swatch" style="background:${item.color}"></span>` +
              `<span class="legend-name">${escapeHtml(item.name)}</span>` +
            `</div>` +
            `<span class="legend-count">${item.count}</span>` +
          `</div>`
        ).join('');
        legendInfo.textContent = `${payload.cluster_summary.length} clusters`;
        resetLegendScroll();
        syncLegendSelection();
        bindLegendRowHoverHandlers();
        return;
      }

      const maxResults = 140;
      const matches = collectLegendMatches(payload.metadata.map((_, index) => index), query);
      const totalMatches = matches.length;
      const visibleMatches = matches.slice(0, maxResults);

      legendList.innerHTML = visibleMatches.map(({ metaIndex }) => {
        const info = payload.metadata[metaIndex];
        const definitionSnippet = info.definition ? `<div style="margin-top:2px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;">${escapeHtml(String(info.definition).slice(0, 60))}</div>` : '';
        return `<div class="legend-row" data-kind="word" data-meta-index="${metaIndex}" data-cluster="${info.cluster}">` +
          `<div class="legend-left">` +
            `<span class="legend-swatch" style="background:${payload.cluster_summary.find((c) => c.cluster === info.cluster)?.color || '#0f172a'}"></span>` +
            `<div style="min-width:0;">` +
              `<div class="legend-name">${escapeHtml(info.word)}</div>` +
              `${definitionSnippet}` +
            `</div>` +
          `</div>` +
          `<span class="legend-count">C${info.cluster}</span>` +
        `</div>`;
      }).join('');

      const clipped = totalMatches > maxResults ? ` (showing first ${maxResults})` : '';
      legendInfo.textContent = `${totalMatches} word matches${clipped}`;
      resetLegendScroll();
      syncLegendSelection();
      bindLegendRowHoverHandlers();
    }

    function bindLegendRowHoverHandlers() {
      legendList.querySelectorAll('.legend-row').forEach((row) => {
        row.addEventListener('mouseenter', (evt) => {
          if (pinnedIndex !== null || selectedLegendMetaIndex !== null) {
            return;
          }
          showLegendRowTooltip(evt, row);
        });
        row.addEventListener('mouseleave', () => {
          hideLegendRowTooltip();
        });
      });
    }

    function showLegendRowTooltip(evt, row) {
      const rowKind = row.dataset.kind;
      if (rowKind === 'word') {
        const metaIndex = Number(row.dataset.metaIndex);
        if (!Number.isNaN(metaIndex) && payload.metadata[metaIndex]) {
          showTooltip(evt, payload.metadata[metaIndex], false);
        }
        return;
      }

      if (rowKind === 'cluster') {
        hideTooltip();
      }
    }

    function focusClusterSelection(clusterId) {
      activeClusterId = clusterId;
      focusCluster(clusterId);
    }

    function selectCluster(clusterId, focus = true) {
      activeClusterId = clusterId;
      pinnedIndex = null;
      tooltip.style.display = 'none';
      if (focus) {
        focusClusterSelection(clusterId);
      }
      updateDrilldownControls();
      renderLegendList(legendSearchInput.value);
    }

    function selectLegendWord(metaIndex, focus = true) {
      const info = payload.metadata[metaIndex];
      if (!info) {
        return;
      }

      selectedLegendMetaIndex = metaIndex;
      pinnedIndex = metaIndex;
      if (focus) {
        focusClusterSelection(info.cluster);
      }
      setTooltipFromMetadata(info);
      updateDrilldownControls();
      renderLegendList(legendSearchInput.value);
      syncLegendSelection();
    }

    function hideLegendRowTooltip() {
      if (pinnedIndex !== null || selectedLegendMetaIndex !== null) {
        return;
      }
      hideTooltip();
    }

    renderLegendList('');
    updateDrilldownControls();

    function showStatus(msg) {
      statusBox.textContent = msg;
      statusBox.style.display = 'block';
    }

    async function ensureThree() {
      if (window.THREE) return true;
      const urls = [
        'https://unpkg.com/three@0.160.0/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'
      ];
      for (const url of urls) {
        const ok = await new Promise((resolve) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload = () => resolve(true);
          s.onerror = () => resolve(false);
          document.head.appendChild(s);
        });
        if (ok && window.THREE) return true;
      }
      return false;
    }

    if (!(await ensureThree())) {
      showStatus('Three.js failed to load from CDN(s).');
      return;
    }

    try {
      const canvas = document.getElementById('viewport');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f7fb);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 20000);
      let yaw = 0;
      let pitch = 0;
      let distance = payload.radius * 3.1;
      let dragging = false;
      let movedDuringDrag = false;
      let lastX = 0;
      let lastY = 0;
      let invertHorizontal = false;
      let invertVertical = false;
      let invertZoom = false;

      scene.add(new THREE.AmbientLight(0xffffff, 0.76));
      const dir = new THREE.DirectionalLight(0xffffff, 0.72);
      dir.position.set(payload.radius * 1.6, payload.radius * 2.0, payload.radius * 1.3);
      scene.add(dir);

      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(payload.radius, 84, 84),
        new THREE.MeshPhongMaterial({
          color: 0x4f7ea8,
          emissive: 0x0d2238,
          shininess: 16,
          transparent: true,
          opacity: 0.56,
        })
      );
      scene.add(globe);

      const globeWire = new THREE.Mesh(
        new THREE.SphereGeometry(payload.radius * 1.002, 42, 32),
        new THREE.MeshBasicMaterial({ color: 0xd6e5f5, wireframe: true, transparent: true, opacity: 0.12 })
      );
      scene.add(globeWire);

      // Orientation guides (X=red, Y=green, Z=blue).
      const axisHelper = new THREE.AxesHelper(payload.radius * 1.4);
      const axisColors = axisHelper.geometry.getAttribute('color');
      // Darker axis tones for better readability on light background.
      axisColors.setXYZ(0, 0.50, 0.10, 0.10);
      axisColors.setXYZ(1, 0.50, 0.10, 0.10);
      axisColors.setXYZ(2, 0.07, 0.38, 0.16);
      axisColors.setXYZ(3, 0.07, 0.38, 0.16);
      axisColors.setXYZ(4, 0.12, 0.25, 0.60);
      axisColors.setXYZ(5, 0.12, 0.25, 0.60);
      axisColors.needsUpdate = true;
      axisHelper.material.transparent = true;
      axisHelper.material.opacity = 0.98;
      axisHelper.renderOrder = 1;
      scene.add(axisHelper);

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(payload.points, 3));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(payload.colors, 3));

      const pointMaterial = new THREE.PointsMaterial({
        size: payload.point_size,
        vertexColors: true,
        transparent: true,
        opacity: 0.97,
        depthWrite: false,
        sizeAttenuation: false,
      });

      const pointCloud = new THREE.Points(geom, pointMaterial);
      pointCloud.renderOrder = 3;
      scene.add(pointCloud);

      const raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = Math.max(3.2, payload.point_size * 2.6);
      const mouse = new THREE.Vector2();
      const clusterFocusVectors = new Map();
      const clusterPointIndices = new Map();
      const clusterColorById = new Map(payload.cluster_summary.map((c) => [c.cluster, c.color]));
      let clusterRelationshipLines = null;
      let focusTween = null;

      for (let i = 0; i < payload.metadata.length; i += 1) {
        const info = payload.metadata[i];
        const clusterId = info.cluster;
        let accum = clusterFocusVectors.get(clusterId);
        if (!accum) {
          accum = { x: 0, y: 0, z: 0, count: 0 };
          clusterFocusVectors.set(clusterId, accum);
        }
        accum.x += payload.points[i * 3 + 0];
        accum.y += payload.points[i * 3 + 1];
        accum.z += payload.points[i * 3 + 2];
        accum.count += 1;

        if (!clusterPointIndices.has(clusterId)) {
          clusterPointIndices.set(clusterId, []);
        }
        clusterPointIndices.get(clusterId).push(i);
      }

      function shortestAngleDelta(fromAngle, toAngle) {
        let delta = toAngle - fromAngle;
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;
        return delta;
      }

      function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function clearClusterRelationshipOverlay() {
        if (!clusterRelationshipLines) {
          return;
        }
        scene.remove(clusterRelationshipLines);
        clusterRelationshipLines.geometry.dispose();
        clusterRelationshipLines.material.dispose();
        clusterRelationshipLines = null;
      }

      function buildClusterRelationshipOverlay(clusterId) {
        clearClusterRelationshipOverlay();
        const pointIndices = clusterPointIndices.get(clusterId) || [];
        if (pointIndices.length < 2) {
          showStatus(`Cluster ${clusterId}: not enough points for relationship links.`);
          return;
        }

        const maxNodes = 700;
        const targetNeighbors = 2;
        const stride = Math.max(1, Math.ceil(pointIndices.length / maxNodes));
        const sampledIndices = [];
        for (let i = 0; i < pointIndices.length; i += stride) {
          sampledIndices.push(pointIndices[i]);
        }

        const vectors = sampledIndices.map((pointIdx) => {
          const x = payload.points[pointIdx * 3 + 0];
          const y = payload.points[pointIdx * 3 + 1];
          const z = payload.points[pointIdx * 3 + 2];
          const norm = Math.sqrt(x * x + y * y + z * z) || 1;
          return { pointIdx, x: x / norm, y: y / norm, z: z / norm };
        });

        const edgeKeys = new Set();
        for (let i = 0; i < vectors.length; i += 1) {
          const base = vectors[i];
          const nearest = [];

          for (let j = 0; j < vectors.length; j += 1) {
            if (i === j) continue;
            const candidate = vectors[j];
            const similarity = base.x * candidate.x + base.y * candidate.y + base.z * candidate.z;

            if (nearest.length < targetNeighbors) {
              nearest.push({ j, similarity });
              nearest.sort((a, b) => b.similarity - a.similarity);
            } else if (similarity > nearest[targetNeighbors - 1].similarity) {
              nearest[targetNeighbors - 1] = { j, similarity };
              nearest.sort((a, b) => b.similarity - a.similarity);
            }
          }

          for (const n of nearest) {
            const a = Math.min(i, n.j);
            const b = Math.max(i, n.j);
            edgeKeys.add(`${a}-${b}`);
          }
        }

        const lineVertices = [];
        for (const key of edgeKeys) {
          const [aText, bText] = key.split('-');
          const aIdx = Number(aText);
          const bIdx = Number(bText);
          const pa = vectors[aIdx].pointIdx;
          const pb = vectors[bIdx].pointIdx;

          lineVertices.push(
            payload.points[pa * 3 + 0], payload.points[pa * 3 + 1], payload.points[pa * 3 + 2],
            payload.points[pb * 3 + 0], payload.points[pb * 3 + 1], payload.points[pb * 3 + 2]
          );
        }

        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(lineVertices, 3));

        const lineMaterial = new THREE.LineBasicMaterial({
          color: new THREE.Color(clusterColorById.get(clusterId) || '#0f172a'),
          transparent: true,
          opacity: 0.32,
          depthWrite: false,
        });

        clusterRelationshipLines = new THREE.LineSegments(lineGeometry, lineMaterial);
        clusterRelationshipLines.renderOrder = 2;
        scene.add(clusterRelationshipLines);
        showStatus(`Cluster ${clusterId} relationships: ${lineVertices.length / 6} links across ${sampledIndices.length} sampled nodes.`);
      }

      function setMouse(evt) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function renderInfo(info, pinned) {
        return renderMetadataHtml(info, pinned);
      }

      function resetTooltipScroll() {
        tooltip.scrollTop = 0;
        requestAnimationFrame(() => {
          tooltip.scrollTop = 0;
        });
        setTimeout(() => {
          tooltip.scrollTop = 0;
        }, 0);
      }

      function showTooltip(evt, info, pinned) {
        tooltip.innerHTML = renderInfo(info, pinned);
        tooltip.style.display = 'block';
        resetTooltipScroll();
      }

      function setTooltipFromMetadata(info) {
        tooltip.innerHTML = renderInfo(info, true);
        tooltip.style.display = 'block';
        resetTooltipScroll();
      }

      function focusCluster(clusterId) {
        const accum = clusterFocusVectors.get(clusterId);
        if (!accum || accum.count === 0) {
          return;
        }

        const vx = accum.x / accum.count;
        const vy = accum.y / accum.count;
        const vz = accum.z / accum.count;
        const vlen = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
        const nx = vx / vlen;
        const ny = vy / vlen;
        const nz = vz / vlen;

        const targetYaw = Math.atan2(nx, nz);
        const targetPitch = Math.asin(Math.max(-1, Math.min(1, ny)));
        const targetDistance = payload.radius * 2.4;

        focusTween = {
          startAtMs: performance.now(),
          durationMs: 700,
          fromYaw: yaw,
          fromPitch: pitch,
          fromDistance: distance,
          yawDelta: shortestAngleDelta(yaw, targetYaw),
          targetPitch,
          targetDistance,
        };

        activeClusterId = clusterId;
        buildClusterRelationshipOverlay(clusterId);

        legendList.querySelectorAll('.legend-row').forEach((el) => {
          el.classList.toggle('active', Number(el.dataset.cluster) === clusterId);
        });
      }

      function hideTooltip() {
        if (pinnedIndex !== null || selectedLegendMetaIndex !== null) {
          return;
        }
        tooltip.style.display = 'none';
      }

      function pickPoint(evt) {
        setMouse(evt);
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(pointCloud);
        if (!hits.length) {
          return null;
        }
        return hits[0].index;
      }

      function onHover(evt) {
        if (dragging || pinnedIndex !== null || selectedLegendMetaIndex !== null) {
          return;
        }

        const idx = pickPoint(evt);
        if (idx === null) {
          hideTooltip();
          renderer.domElement.style.cursor = 'grab';
          return;
        }

        showTooltip(evt, payload.metadata[idx], false);
        renderer.domElement.style.cursor = 'pointer';
      }

      function onClick(evt) {
        if (movedDuringDrag) {
          movedDuringDrag = false;
          return;
        }

        const idx = pickPoint(evt);
        if (idx === null) {
          pinnedIndex = null;
          selectedLegendMetaIndex = null;
          tooltip.style.display = 'none';
          renderer.domElement.style.cursor = 'grab';
          return;
        }

        pinnedIndex = idx;
        selectLegendWord(idx, true);
        renderer.domElement.style.cursor = 'pointer';
      }

      renderer.domElement.addEventListener('mousedown', (evt) => {
        dragging = true;
        movedDuringDrag = false;
        focusTween = null;
        lastX = evt.clientX;
        lastY = evt.clientY;
        renderer.domElement.style.cursor = 'grabbing';
      });

      window.addEventListener('mouseup', () => {
        dragging = false;
        if (pinnedIndex === null) {
          renderer.domElement.style.cursor = 'grab';
        }
      });

      window.addEventListener('mousemove', (evt) => {
        if (!dragging) return;
        const dx = evt.clientX - lastX;
        const dy = evt.clientY - lastY;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          movedDuringDrag = true;
        }
        lastX = evt.clientX;
        lastY = evt.clientY;
        const horizontalSign = invertHorizontal ? 1 : -1;
        const verticalSign = invertVertical ? -1 : 1;
        yaw += dx * 0.0038 * horizontalSign;
        pitch += dy * 0.0038 * verticalSign;
        pitch = Math.max(-1.35, Math.min(1.35, pitch));
      });

      renderer.domElement.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        const zoomOutFactor = invertZoom ? 0.94 : 1.06;
        const zoomInFactor = invertZoom ? 1.06 : 0.94;
        distance *= evt.deltaY > 0 ? zoomOutFactor : zoomInFactor;
        distance = Math.max(payload.radius * 1.15, Math.min(payload.radius * 9.0, distance));
      }, { passive: false });

      detailHint.textContent = payload.definitions_enabled
        ? 'Definitions are shown in node details.'
        : 'Definitions are omitted at this scale, but word, cluster, and part of speech remain available for every node.';

      invertHorizontalCheckbox.checked = false;
      invertVerticalCheckbox.checked = false;
      invertZoomCheckbox.checked = false;
      invertHorizontalCheckbox.addEventListener('change', () => {
        invertHorizontal = invertHorizontalCheckbox.checked;
      });
      invertVerticalCheckbox.addEventListener('change', () => {
        invertVertical = invertVerticalCheckbox.checked;
      });
      invertZoomCheckbox.addEventListener('change', () => {
        invertZoom = invertZoomCheckbox.checked;
      });
      legendSearchInput.addEventListener('input', () => {
        renderLegendList(legendSearchInput.value);
        updateDrilldownControls();
      });

      legendList.addEventListener('click', (evt) => {
        const row = evt.target.closest('.legend-row');
        if (!row) {
          return;
        }

        const rowKind = row.dataset.kind;
        if (rowKind === 'word') {
          const metaIndex = Number(row.dataset.metaIndex);
          if (!Number.isNaN(metaIndex) && payload.metadata[metaIndex]) {
            selectLegendWord(metaIndex, true);
          }
          return;
        }

        const clusterId = Number(row.dataset.cluster);
        if (Number.isNaN(clusterId)) {
          return;
        }

        selectCluster(clusterId, true);
      });

      legendBackToClusters.addEventListener('click', () => {
        resetClusterDrilldown();
      });

      legendList.addEventListener('dblclick', (evt) => {
        const row = evt.target.closest('.legend-row');
        if (!row || row.dataset.kind !== 'cluster') {
          return;
        }

        const clusterId = Number(row.dataset.cluster);
        if (Number.isNaN(clusterId)) {
          return;
        }
        enterClusterDrilldown(clusterId);
      });

      legendList.addEventListener('keydown', (evt) => {
        if (evt.key !== 'Enter' && evt.key !== ' ') {
          return;
        }

        const row = evt.target.closest('.legend-row');
        if (!row) {
          return;
        }

        evt.preventDefault();
        if (row.dataset.kind === 'word') {
          const metaIndex = Number(row.dataset.metaIndex);
          if (!Number.isNaN(metaIndex)) {
            selectLegendWord(metaIndex, true);
          }
          return;
        }

        const clusterId = Number(row.dataset.cluster);
        if (!Number.isNaN(clusterId)) {
          selectCluster(clusterId, true);
        }
      });

      renderer.domElement.addEventListener('mousemove', onHover);
      renderer.domElement.addEventListener('click', onClick);
      renderer.domElement.addEventListener('mouseleave', () => {
        hideTooltip();
        renderer.domElement.style.cursor = dragging ? 'grabbing' : (pinnedIndex === null ? 'grab' : 'pointer');
      });

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      renderer.domElement.style.cursor = 'grab';
      (function animate(nowMs) {
        requestAnimationFrame(animate);

        if (focusTween) {
          const elapsed = nowMs - focusTween.startAtMs;
          const progress = Math.max(0, Math.min(1, elapsed / focusTween.durationMs));
          const eased = easeInOutQuad(progress);
          yaw = focusTween.fromYaw + focusTween.yawDelta * eased;
          pitch = focusTween.fromPitch + (focusTween.targetPitch - focusTween.fromPitch) * eased;
          distance = focusTween.fromDistance + (focusTween.targetDistance - focusTween.fromDistance) * eased;
          if (progress >= 1) {
            focusTween = null;
          }
        }

        camera.position.x = distance * Math.cos(pitch) * Math.sin(yaw);
        camera.position.y = distance * Math.sin(pitch);
        camera.position.z = distance * Math.cos(pitch) * Math.cos(yaw);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      })();

      if (payload.live_reload) {
        setInterval(() => {
          location.reload();
        }, 2000);
      }
    } catch (err) {
      showStatus('Renderer error: ' + (err && err.message ? err.message : err));
      console.error(err);
    }
  })();
  </script>
</body>
</html>
