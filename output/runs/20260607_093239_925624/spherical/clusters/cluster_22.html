-0.1146467304684441, "word": "Accounts: Accounts section, Settings", "pos_group": "other", "row_number": 48, "definition": "A central configuration interface inside modern Windows Settings (Settings > Accounts) used to manage user profiles, sign-in options (such as Windows Hello PIN (Personal Identification Number), facial recognition, or passwords), sync settings, and link Microsoft accounts or work/school credentials to the local machine.", "details": [{"label": "TROUBLESHOOTING", "value": "Open Windows Settings (Win + I), navigate to Accounts, and select Access work or school to re-authenticate or fix credential synchronization; verify the local machine has a stable internet connection to validate external Microsoft or Azure/Entra ID profiles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0199841423228379, "y": -0.9922398576833382, "z": -0.1227220390971777, "word": "Accounts: Administrator accounts", "pos_group": "other", "row_number": 51, "definition": "High-privileged user accounts that possess full control over the operating system. Members of the local Administrators group can install software, modify critical system configuration files, change hardware device drivers, and alter permissions for other system users.", "details": [{"label": "TROUBLESHOOTING", "value": "Log in using a profile that already possesses administrative rights; open \"lusrmgr.msc\" (Local Users and Groups Manager) or User Accounts in the Control Panel, select the target user account, and add them to the local Administrators group."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0097757896405513, "y": -0.9950143650381508, "z": -0.0992514347736554, "word": "Accounts: Guest accounts, disabling", "pos_group": "other", "row_number": 55, "definition": "The administrative security practice of turning off the built-in, unauthenticated \"Guest\" profile container within an operating system to prevent anonymous local or remote network access to machine resources.", "details": [{"label": " 23264203560875, "word": "Administrative Tools: Group Policy Editor", "pos_group": "other", "row_number": 88, "definition": "An advanced administrative snap-in tool (\"gpedit.msc\" for local policy, \"gpmc.msc\" for Active Directory domain policy) used to configure registry-based settings, software installation behaviors, and security baselines for users and computers across a workspace environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Local Group Policy Editor on the machine; navigate to the specific Administrative Template path; configure the target policy setting to \"Enabled\" or \"Disabled\"; run the command \"gpupdate /force\" in an elevated command prompt to instantly apply the new settings."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0175875643003022, "y": -0.990184319878864, "z": -0.13865673531428, "word": "Applications: MAM", "pos_group": "other", "row_number": 139, "definition": "Mobile Application Management (MAM). A security management strategy where corporate IT administrators secure and manage specific enterprise software applications and data containers on mobile devices, rather than managing the user's entire physical phone. This approach is highly useful for Bring Your Own Device (BYOD) deployment models.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the organization's Mobile Device Management (MDM) portal (such as Microsoft Intune); adjust the MAM security policy definitions to configure application sandboxing rules; issue a selective remote wipe command to delete only the corporate data container while leaving the user's personal photos and apps intact."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0235496114755789, "y": -0.9955837659134634, "z": -0.0908756339670594, "word": "Applications: User permissions", "pos_group": "other", "row_number": 148, "definition": "Access control configurations that define what folders, files, registry sections, and system hardware features (like the camera or microphone) a running application can interact with based on the permissions of the logged-in user.", "details": [{"label": "TROUBLESHOOTING", "value": "Right-click the application shortcut icon and select \"Run as administrator\" to grant it elevated privileges for that session; open the folder's properties sheet, navigate to the Security tab, and adjust the NT File System (NTFS) access control list or permissions to grant the user profile explicit Read and Write access."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.0158171732291272, "y": -0.9921100841979712, "z": -0.1243679937272224, "word": "Apps section, Settings", "pos_group": "other", "row_number": 150, "definition": "A central configuration interface inside the modern Windows Settings utility used to manage installed applications, configure default software associations, adjust startup programs, and modify optional Operating System (OS) features.", "details": [{"label": "TROUBLESHOOTING", "value": "Open Windows Settings by pressing the keyboard shortcut \u201cWin + I\u201d, click on the \u201cApps\u201d category, select \u201cInstalled apps\u201d to modify or uninstall problematic software packages, and navigate to \u201cStartup\u201d to toggle off unneeded background programs."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0390969112405491, "y": -0.991249395590696, "z": -0.1260796068859999, "word": "Attended installations", "pos_group": "other", "row_number": 171, "definition": "A standard Operating System (OS) installation method where a human technician must sit at the physical computer console to answer setup configuration prompts, accept software licensing agreements, partition storage disks, and create the initial user profile.", "details": [{"label": "TROUBLESHOOTING", "value": "For large-scale enterprise deployments, replace manual setup procedures with automated unattended installations by configuring custom Extensible Markup Language (XML) reply files (such as \u201cunattend.xml\u201d) paired with a Windows Deployment Services (WDS) server network environment."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.0023498108584179, "y": -0.9962978500835306, "z": -0.0859364434210817, "word": "Authentication: User accounts", "pos_group": "other", "row_number": 194, "definition": "Digital identity profiles managed inside an operating system or directory service database that hold configuration files, security group memberships, and login credentials for an individual user, defining what network resources they are permitted to access.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Local Users and Groups console panel by running \u201clusrmgr.msc\u201d on local machines or open \u201cdsa.msc\u201d for Active Directory; audit the user profile's group properties, and apply the principle of least privilege by stripping standard users out of administrative groups."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(n)=>String(n.pos_group||'other');const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+'<br>subcluster: '+(info.pos_group||'other')+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
