tion": "The shrub or tree which bears this fruit; -- also called shad bush and had tree.", "details": []}, {"x": -0.8979225293327198, "y": 0.4284978324546413, "z": 0.10062176155487017, "word": "Jungle", "pos_group": "noun", "row_number": 84478, "definition": "A dense growth of brushwood grasses reeds vines etc.; an almost impenetrable thicket of trees canes and reedy vegetation as in India Africa Australia and Brazil.", "details": []}, {"x": -0.8242295909588018, "y": 0.49896302475976095, "z": 0.2677339748901442, "word": "Jungly", "pos_group": "adjective", "row_number": 84479, "definition": "Consisting of jungles; abounding with jungles; of the nature of a jungle.", "details": []}, {"x": -0.8304283337119386, "y": 0.5514778905884222, "z": 0.07912596767533016, "word": "Juniper", "pos_group": "noun", "row_number": 84487, "definition": "Any evergreen shrub or tree of the genus Juniperus and order Coniferae.", "details": []}, {"x": -0.895043964078241, "y": 0.40342233866965205, "z": 0.19012290506253282, "word": "Juniperite", "pos_group": "noun", "row_number": 84489, "definition": "One of the fossil Coniferae evidently allied to the juniper.", "details": []}, {"x": -0.7934685868345577, "y": 0.5693077786866406, "z": 0.2151656451054698, "word": "Jupati palm", "pos_group": "other", "row_number": 84513, "definition": "A great Brazilian palm tree (Raphia taedigera) used by the natives for many purposes.", "details": []}, {"x": -0.8786424083126514, "y": 0.4727455276688924, "z": 0.06707595980382744, "word": "Jute", "pos_group": "noun", "row_number": 84617, "definition": "The coarse strong fiber of the East Indian Corchorus olitorius and C. capsularis; also the plant itself. The fiber is much used for making mats gunny cloth cordage hangings paper etc.", "details": []}, {"x": -0.8546358338419137, "y": 0.4491373935462371, "z": 0.2605248418708463, "word": "Kafal", "pos_group": "noun", "row_number": 84653, "definition": "The Arabian name of two trees of the genus Balsamodendron which yield a gum resin and a red aromatic wood.", "details": []}, {"x": -0.8047635530122622, "y": 0.5806419676736373, "z": 0.12333097388396302, "word": "Kapia", "pos_group": "noun", "row_number": 84743, "definition": "The fossil resin of the kauri tree of New Zealand.", "details": []}, {"x": -0.9023722180002455, "y": 0.4102149042882012, "z": 0.13209130357877297, "word": "Kauri", "pos_group": "noun", "row_number": 84773, "definition": "A lofty coniferous tree of New Zealand Agathis / Dammara australis) furnishing valuable timber and yielding one kind of dammar resin.", "details": []}, {"x": -0.8082506151937083, "y": 0.5300267165170095, "z": 0.2565202191196432, "word": "Kawaka", "pos_group": "noun", "row_number": 84778, "definition": "a New Zealand tree the Cypress cedar (Libocedrus Doniana) having a valuable fine-grained reddish wood.", "details": []}, {"x": -0.8493924696711137, "y": 0.5238503454758145, "z": 0.06413460852672304, "word": "Kermes", "pos_group": "noun", "row_number": 84996, "definition": "A small European evergreen oak (Quercus coccifera) on which the kermes insect (Coccus ilicis) feeds.", "details": []}, {"x": -0.8828975916998847, "y": 0.412996311013813, "z": 0.22344102053903456, "word": "Key", "pos_group": "noun", "row_number": 85072, "definition": "An indehiscent one-seeded fruit furnished with a wing as the fruit of the ash and maple; a samara; -- called also key fruit.", "details": []}, {"x": -0.7922451076297393, "y": 0.5827475257633604, "z": 0.18097792863613, "word": "Khaya", "pos_group": "noun", "row_number": 85097, "definition": "A lofty West African tree (Khaya Senegalensis) related to the mahogany which it resembles in the quality of the wood. The bark is used as a febrifuge.", "details": []}, {"x": -0.8924486750394568, "y": 0.44323423808045, "z": 0.08413544207741101, "word": "Kiabooca wood", "pos_group": "other", "row_number": 85103, "definition": "See Kyaboca wood.", "details": []}, {"x": -0.8353273676038264, "y": 0.47913637880168686, "z": 0.26954873296097726, "word": "Kinnikinic", "pos_group": "noun", "row_number": 85347, "definition": "Prepared leaves or bark of certain plants; -- used by the Indians of the Northwest for smoking either mixed with tobacco or as a substitute for it. Also a plant so used as the osier cornel (Cornus stolonijra) and the bearberry (Arctostaphylus Uva-ursi).", "details": []}, {"x": -0.8192729471481786, "y": 0.5658275051490036, "z": 0.09290356552895278, "word": "Knot", "pos_group": "noun", "row_number": 85691, "definition": "A portion of a branch of a tree that forms a mass of woody fiber running at an angle with the grain of the main stock and making a hard place in the timber. A loose knot is generally the remains of a dead branch of a tree covered by later woody growth.", "details": []}, {"x": -0.9001329801522259, "y": 0.4019473553740855, "z": 0.16792540471903294, "word": "Knotted", "pos_group": "adjective", "row_number": 85712, "definition": "Full of knots; having knots knurled; as a knotted cord; the knotted oak.", "details": []}, {"x": -0.7968678970668309, "y": 0.5569656061183396, "z": 0.2340744928981312, "word": "Kumquat", "pos_group": "noun", "row_number": 85872, "definition": "A small tree of the genus Citrus (C. Japonica) growing in China and Japan; also its small acid orange-colored fruit used for preserves.", "details": []}, {"x": -0.868271053783088, "y": 0.4922822203222741, "z": 0.06134812724914931, "word": "Laburnum", "pos_group": "noun", "row_number": 86049, "definition": "A small leguminous tree (Cytisus Laburnum) native of the Alps. The plant is reputed to be poisonous esp. the bark and seeds. It has handsome racemes of yellow blossoms.", "details": []}, {"x": -0.8662757036310064, "y": 0.4325150578031312, "z": 0.24999426007842426, "word": "Labyrinth", "pos_group": "noun", "row_number": 86051, "definition": "Any intricate or involved inclosure; especially an ornamental maze or inclosure in a park or garden.", "details": []}, {"x": -0.7977116859953006, "y": 0.5854574150961299, "z": 0.14455338507102783, "word": "Lac", "pos_group": "noun", "row_number": 86072, "definition": "A resinous substance produced mainly on the banyan tree but to some extent on other trees by the Coccus lacca a scale-shaped insect the female of which fixes herself on the bark and exudes from the margin of her body this resinous substance.", "details": []}, {"x": -0.9008635574618276, "y": 0.419599951008954, "z": 0.11126873752543298, "word": "Lace-bark", "pos_group": "noun", "row_number": 86088, "definition": "A shrub in the West Indies (Lagetta Iintearia); -- so called from the lacelike layers of its inner bark.", "details": []}, {"x": -0.8172767318923668, "y": 0.5112056078658359, "z": 0.2659465547696635, "word": "Lady's garters", "pos_group": "other", "row_number": 86341, "definition": "Ribbon grass.", "details": []}, {"x": -0.8373240710205869, "y": 0.542074032564581, "z": 0.07102213252701363, "word": "Lady's laces", "pos_group": "other", "row_number": 86344, "definition": "A slender climbing plant; dodder.", "details": []}, {"x": -0.8914080320957409, "y": 0.4047980736141608, "z": 0.2037896953073505, "word": "Lakao", "pos_group": "noun", "row_number": 86428, "definition": "Sap green.", "details": []}, {"x": -0.7915099635776404, "y": 0.5764473894774986, "z": 0.20302803925049223, "word": "Lambert pine", "pos_group": "other", "row_number": 86477, "definition": "The gigantic sugar pine of California and Oregon (Pinus Lambertiana). It has the leaves in fives and cones a foot long. The timber is soft and like that of the white pine of the Eastern States.", "details": []}, {"x": -0.8847525706348021, "y": 0.46058674166934693, "z": 0.07122318550530961, "word": "Lanceolated", "pos_group": "adjective", "row_number": 86625, "definition": "Rather narrow tapering to a point at the apex and sometimes at the base also; as a lanceolate leaf.", "details": []}, {"x": -0.8471591346281666, "y": 0.4596877420127908, "z": 0.26647435234790945, "word": "Lancewood", "pos_group": "noun", "row_number": 86632, "definition": "A tough elastic wood often used for the shafts of gigs archery bows fishing rods and the like. Also the tree which produces this wood Duguetia Quitarensis (a native of Guiana and Cuba) and several other trees of the same family (Anonaseae).", "details": []}, {"x": -0.809259508542652, "y": 0.5770002240858927, "z": 0.110316767710693, "word": "Land", "pos_group": "noun", "row_number": 86651, "definition": "Any ground soil or earth whatsoever as meadows pastures woods etc. and everything annexed to it whether by nature as trees water etc.", "details": []}, {"x": -0.9028022774628875, "y": 0.40478143195323113, "z": 0.14525852867806135, "word": "Languish", "pos_group": "other", "row_number": 86762, "definition": "To cause to droop or pine.", "details": []}, {"x": -0.8026942497805346, "y": 0.5414461445439791, "z": 0.2500360252598119, "word": "Larch", "pos_group": "noun", "row_number": 86957, "definition": "A genus of coniferous trees having deciduous leaves in fascicles (see Illust. of Fascicle).", "details": []}, {"x": -0.8567412632434616, "y": 0.5121928734021854, "z": 0.060438963359826126, "word": "Lateral", "pos_group": "adjective", "row_number": 87167, "definition": "Of or pertaining to the sides; as the lateral walls of a house; the lateral branches of a tree.", "details": []}, {"x": -0.8771950045753587, "y": 0.4185220117541904, "z": 0.23530458904420332, "word": "Latifolious", "pos_group": "adjective", "row_number": 87217, "definition": "Having broad leaves.", "details": []}, {"x": -0.7928828731297463, "y": 0.5860190230438025, "z": 0.16708816274142757, "word": "Laund", "pos_group": "noun", "row_number": 87347, "definition": "A plain sprinkled with trees or underbrush; a glade.", "details": []}, {"x": -0.8967962958719687, "y": 0.43262914311666106, "z": 0.0926737731856215, "word": "Lauraceous", "pos_group": "adjective", "row_number": 87364, "definition": "Belonging to or resembling a natural order (Lauraceae) of trees and shrubs having aromatic bark and foliage and including the laurel sassafras cinnamon tree true camphor tree etc.", "details": []}, {"x": -0.8278524363906591, "y": 0.4912664802887227, "z": 0.2707722085199656, "word": "Laureate", "pos_group": "adjective", "row_number": 87366, "definition": "Crowned or decked with laurel.", "details": []}, {"x": -0.8255309435279505, "y": 0.5582989706806685, "z": 0.08246769437032742, "word": "Laurestine", "pos_group": "noun", "row_number": 87379, "definition": "The Viburnum Tinus an evergreen shrub or tree of the south of Europe which flowers during the winter mouths.", "details": []}, {"x": -0.8979609852844868, "y": 0.4006683219107756, "z": 0.18201913285178747, "word": "Laurinol", "pos_group": "noun", "row_number": 87383, "definition": "Ordinary camphor; -- so called in allusion to the family name (Lauraceae) of the camphor trees. See Camphor.", "details": []}, {"x": -0.7933875339680095, "y": 0.5661453959864342, "z": 0.22364170350702559, "word": "Laurus", "pos_group": "noun", "row_number": 87387, "definition": "A genus of trees including according to modern authors only the true laurel (Laurus nobilis) and the larger L. Canariensis of Madeira and the Canary Islands. Formerly the sassafras the camphor tree the cinnamon tree and several other aromatic trees and shrubs were also referred to the genus Laurus.", "details": []}, {"x": -0.8751612919328638, "y": 0.47977072428899614, "z": 0.06255210002560178, "word": "Layer", "pos_group": "noun", "row_number": 87535, "definition": "A shoot or twig of a plant not detached from the stock laid under ground for growth or propagation.", "details": []}, {"x": -0.8591715078311819, "y": 0.4415433494428396, "z": 0.2585803370209957, "word": "Leaf", "pos_group": "noun", "row_number": 87644, "definition": "A colored usually green expansion growing from the side of a stem or rootstock in which the sap for the use of the plant is elaborated under the influence of light; one of the parts of a plant which collectively constitute its foliage.", "details": []}, {"x": -0.8008770362374791, "y": 0.5844149879450921, "z": 0.13059515570115768, "word": "Leaf", "pos_group": "other", "row_number": 87649, "definition": "To shoot out leaves; to produce leaves; to leave; as the trees leaf in May.", "details": []}, {"x": -0.9028843705750914, "y": 0.4118545750236499, "z": 0.12318937617875177, "word": "Leafage", "pos_group": "noun", "row_number": 87650, "definition": "Leaves collectively; foliage.", "details": []}, {"x": -0.8107051776751439, "y": 0.5234343857645465, "z": 0.262247132853736, "word": "Leafed", "pos_group": "adjective", "row_number": 87652, "definition": "Having (such) a leaf or (so many) leaves; -- used in composition; as broad-leafed; four-leafed.", "details": []}, {"x": -0.8445784513891669, "y": 0.5315369175623758, "z": 0.06446506586799321, "word": "Leafiness", "pos_group": "noun", "row_number": 87655, "definition": "The state of being leafy.", "details": []}, {"x": -0.8868612793132121, "y": 0.4078602063916267, "z": 0.21708782392642947, "word": "Leafless", "pos_group": "adjective", "row_number": 87656, "definition": "Having no leaves or foliage; bearing no foliage.", "details": []}, {"x": -0.7905366931309858, "y": 0.5822327677647242, "z": 0.18988612628244964, "word": "Leaflet", "pos_group": "noun", "row_number": 87657, "definition": "A little leaf; also a little printed leaf or a tract.", "details": []}, {"x": -0.8903205117069911, "y": 0.4487384548879879, "z": 0.07722166495578037, "word": "Leafy", "pos_group": "other", "row_number": 87662, "definition": "Full of leaves; abounding in leaves; as the leafy forest.", "details": []}, {"x": -0.8394964284874806, "y": 0.4711356312631416, "z": 0.2706971804637887, "word": "Leafy", "pos_group": "other", "row_number": 87663, "definition": "Consisting of leaves.", "details": []}, {"x": -0.8145729514354317, "y": 0.571723160865287, "z": 0.09799762303227182, "word": "Leatherwood", "pos_group": "noun", "row_number": 87789, "definition": "A small branching shrub (Dirca palustris) with a white soft wood and a tough leathery bark common in damp woods in the Northern United States; -- called also moosewood and wicopy.", "details": []}, {"x": -0.9022122702558073, "y": 0.40086298217426747, "z": 0.1591285295671867, "word": "Leave", "pos_group": "other", "row_number": 87793, "definition": "To send out leaves; to leaf; -- often with out.", "details": []}, {"x": -0.7978251270989232, "y": 0.5522668571307379, "z": 0.24181890969178638, "word": "Leaved", "pos_group": "adjective", "row_number": 87807, "definition": "Bearing or having a leaf or leaves; having folds; -- used in combination; as a four-leaved clover; a two-leaved gate; long-leaved.", "details": []}, {"x": -0.864097150548732, "y": 0.49990246357693685, "z": 0.05859728085219509, "word": "Leaveless", "pos_group": "adjective", "row_number": 87808, "definition": "Leafless.", "details": []}, {"x": -0.8707941584045721, "y": 0.4255812559111413, "z": 0.24616687085302327, "word": "Leaves", "pos_group": "noun", "row_number": 87819, "definition": "pl. of Leaf.", "details": []}, {"x": -0.7945442069681864, "y": 0.5876610313235201, "z": 0.15282020624600876, "word": "Leaviness", "pos_group": "noun", "row_number": 87821, "definition": "Leafiness.", "details": []}, {"x": -0.9003325142562058, "y": 0.42289378463648786, "z": 0.10277261643515166, "word": "Leavy", "pos_group": "adjective", "row_number": 87824, "definition": "Leafy.", "details": []}, {"x": -0.8205505007695457, "y": 0.5037443420799291, "z": 0.27007131189614897, "word": "Lecythis", "pos_group": "noun", "row_number": 87863, "definition": "A genus of gigantic trees chiefly Brazilian of the order Myrtaceae having woody capsules opening by an apical lid. Lecythis Zabucajo yields the delicious sapucaia nuts. L. Ollaria produces the monkey-pots its capsules. Its bark separates into thin sheets like paper used by the natives for cigarette wrappers.", "details": []}, {"x": -0.8323460719478832, "y": 0.5493866649075521, "z": 0.07330967831525831, "word": "Lemon", "pos_group": "noun", "row_number": 88116, "definition": "The tree which bears lemons; the lemon tree.", "details": []}, {"x": -0.8947937810285455, "y": 0.4010834266238727, "z": 0.19615344585372976, "word": "Lentisk", "pos_group": "noun", "row_number": 88211, "definition": "A tree; the mastic. See Mastic.", "details": []}, {"x": -0.7908183541085493, "y": 0.5742103234384378, "z": 0.2118698545375673, "word": "Lepidodendrid", "pos_group": "noun", "row_number": 88245, "definition": "One of an extinct family of trees allied to the modern club mosses and including Lepidodendron and its allies.", "details": []}, {"x": -0.8817032504497752, "y": 0.4672087168272533, "z": 0.0656916514249147, "word": "Lepidodendron", "pos_group": "noun", "row_number": 88248, "definition": "A genus of fossil trees of the Devonian and Carboniferous ages having the exterior marked with scars mostly in quincunx order produced by the separation of the leafstalks.", "details": []}, {"x": -0.8516693388521105, "y": 0.4517623236126306, "z": 0.26565040979325805, "word": "Lepidoted", "pos_group": "adjective", "row_number": 88260, "definition": "Having a coat of scurfy scales as the leaves of the oleaster.", "details": []}, {"x": -0.8049785353879064, "y": 0.581666035671758, "z": 0.11693665169929436, "word": "Letterwood", "pos_group": "noun", "row_number": 88400, "definition": "The beautiful and highly elastic wood of a tree of the genus Brosimum (B. Aubletii) found in Guiana; -- so called from black spots in it which bear some resemblance to hieroglyphics; also called snakewood and leopardwood. It is much used for bows and for walking sticks.", "details": []}, {"x": -0.9039221984105715, "y": 0.4054358392651756, "z": 0.13618531293771038, "word": "Leucadendron", "pos_group": "noun", "row_number": 88413, "definition": "A genus of evergreen shrubs from the Cape of Good Hope having handsome foliage. Leucadendron argenteum is the silverboom of the colonists.", "details": []}, {"x": -0.8046473487239845, "y": 0.5354137455319528, "z": 0.25666079811086845, "word": "Leucophyllous", "pos_group": "adjective", "row_number": 88440, "definition": "Having white or silvery foliage.", "details": []}, {"x": -0.8520588782916054, "y": 0.5200399661443997, "z": 0.05961628583686705, "word": "Leverwood", "pos_group": "noun", "row_number": 88524, "definition": "The American hop hornbeam (Ostrya Virginica) a small tree with very tough wood.", "details": []}, {"x": -0.8814668486761833, "y": 0.41258863236938786, "z": 0.22975381416733207, "word": "Levesel", "pos_group": "noun", "row_number": 88525, "definition": "A leafy shelter; a place covered with foliage.", "details": []}, {"x": -0.7905883067000243, "y": 0.5865200062361541, "z": 0.17596707531220201, "word": "Liana", "pos_group": "noun", "row_number": 88637, "definition": "A luxuriant woody plant climbing high trees and having ropelike stems. The grapevine often has the habit of a liane. Lianes are abundant in the forests of the Amazon region.", "details": []}, {"x": -0.8952246922177663, "y": 0.4374331651020993, "z": 0.08499986183732643, "word": "Liber", "pos_group": "noun", "row_number": 88671, "definition": "The inner bark of plants lying next to the wood. It usually contains a large proportion of woody fibrous cells and is therefore the part from which the fiber of the plant is obtained as that of hemp etc.", "details": []}, {"x": -0.8317875131771729, "y": 0.4832819838111366, "z": 0.2730715236821789, "word": "Lid", "pos_group": "noun", "row_number": 88823, "definition": "The top of an ovary which opens transversely as in the fruit of the purslane and the tree which yields Brazil nuts.", "details": []}, {"x": -0.8206192204947278, "y": 0.5648718640024005, "z": 0.08662489372621958, "word": "Lif", "pos_group": "noun", "row_number": 88889, "definition": "The fiber by which the petioles of the date palm are bound together from which various kinds of cordage are made.", "details": []}, {"x": -0.9005872132547298, "y": 0.39856866268284263, "z": 0.17345227715221853, "word": "Lightwood", "pos_group": "noun", "row_number": 89097, "definition": "Pine wood abounding in pitch used for torches in the Southern United States; pine knots dry sticks and the like for kindling a fire quickly or making a blaze.", "details": []}, {"x": -0.7937500961443483, "y": 0.5622666950293057, "z": 0.23198480237218008, "word": "Lign-aloes", "pos_group": "noun", "row_number": 89099, "definition": "Aloes wood or agallochum. See Agallochum.", "details": []}, {"x": -0.8713174434020211, "y": 0.4871977661993528, "z": 0.0586877281356702, "word": "Lign-aloes", "pos_group": "noun", "row_number": 89100, "definition": "A fragrant tree mentioned in the Bible.", "details": []}, {"x": -0.8637986828960513, "y": 0.43407372508871966, "z": 0.25579647498480046, "word": "Ligneous", "pos_group": "adjective", "row_number": 89101, "definition": "Made of wood; consisting of wood; of the nature of or resembling wood; woody.", "details": []}, {"x": -0.7972189919783711, "y": 0.5876027505268883, "z": 0.13843730133972426, "word": "Ligniferous", "pos_group": "adjective", "row_number": 89102, "definition": "Yielding or producing wood.", "details": []}, {"x": -0.9029685378328022, "y": 0.4142330555708885, "z": 0.11427508633335802, "word": "Ligniform", "pos_group": "adjective", "row_number": 89104, "definition": "Like wood.", "details": []}, {"x": -0.8135627236719102, "y": 0.5163384535854892, "z": 0.26741409087871304, "word": "Lignify", "pos_group": "other", "row_number": 89108, "definition": "To become wood.", "details": []}, {"x": -0.8395988809261332, "y": 0.539227166310243, "z": 0.06563369759971217, "word": "Lignin", "pos_group": "noun", "row_number": 89109, "definition": "A substance characterizing wood cells and differing from cellulose in its conduct with certain chemical reagents.", "details": []}, {"x": -0.8906663599706203, "y": 0.403222829998882, "z": 0.21005900262635288, "word": "Lignum rhodium", "pos_group": "other", "row_number": 89121, "definition": "The fragrant wood of several shrubs and trees especially of species of Rhodorhiza from the Canary Islands and of the West Indian Amyris balsamifera.", "details": []}, {"x": -0.789228275137108, "y": 0.5809791777539738, "z": 0.19895206643918537, "word": "Lignum-vitae", "pos_group": "noun", "row_number": 89122, "definition": "A tree (Guaiacum officinale) found in the warm latitudes of America from which the guaiacum of medicine is procured. Its wood is very hard and heavy and is used for various mechanical purposes as for the wheels of ships' blocks cogs bearings and the like. See Guaiacum.", "details": []}, {"x": -0.8877616749676106, "y": 0.454833434303807, "z": 0.0707513639310721, "word": "Ligule", "pos_group": "noun", "row_number": 89133, "definition": "The thin and scarious projection from the upper end of the sheath of a leaf of grass.", "details": []}, {"x": -0.8439008212526623, "y": 0.46300324897653083, "z": 0.2710339375913258, "word": "Lilly-pilly", "pos_group": "noun", "row_number": 89198, "definition": "An Australian myrtaceous tree (Eugenia Smithii) having smooth ovate leaves and panicles of small white flowers. The wood is hard and fine-grained.", "details": []}, {"x": -0.8099573124367405, "y": 0.5772221165323503, "z": 0.10384498166096569, "word": "Limb", "pos_group": "noun", "row_number": 89222, "definition": "A part of a tree which extends from the trunk and separates into branches and twigs; a large branch.", "details": []}, {"x": -0.9039321779993126, "y": 0.40049556867930275, "z": 0.1500330531771614, "word": "Lime", "pos_group": "noun", "row_number": 89254, "definition": "The linden tree. See Linden.", "details": []}, {"x": -0.7992283754130165, "y": 0.5469080616479871, "z": 0.2492500271597009, "word": "Linden", "pos_group": "noun", "row_number": 89378, "definition": "In America the basswood or Tilia Americana.", "details": []}, {"x": -0.8596255926405255, "y": 0.5077789436444974, "z": 0.05660728635700024, "word": "Lineated", "pos_group": "adjective", "row_number": 89443, "definition": "Marked longitudinally with depressed parallel lines; as a lineate leaf.", "details": []}, {"x": -0.8753057482552166, "y": 0.4189302855139797, "z": 0.24153108071333387, "word": "Liquidambar", "pos_group": "noun", "row_number": 89650, "definition": "A genus consisting of two species of tall trees having star-shaped leaves and woody burlike fruit. Liquidambar styraciflua is the North American sweet qum and L. Orientalis is found in Asia Minor.", "details": []}, {"x": -0.7916851398894824, "y": 0.5891914772854108, "z": 0.1615179320459675, "word": "Liquidambar", "pos_group": "noun", "row_number": 89651, "definition": "The balsamic juice which is obtained from these trees by incision. The liquid balsam of the Oriental tree is liquid storax.", "details": []}, {"x": -0.8993540214054188, "y": 0.42689757493324, "z": 0.09445001163589402, "word": "Liriodendron", "pos_group": "noun", "row_number": 89684, "definition": "A genus of large and very beautiful trees of North America having smooth shining leaves and handsome tuliplike flowers; tulip tree; whitewood; -- called also canoewood. Liriodendron tulipifera is the only extant species but there were several others in the Cretaceous epoch.", "details": []}, {"x": -0.8241759773040239, "y": 0.4959099750567991, "z": 0.273509149891045, "word": "List", "pos_group": "noun", "row_number": 89724, "definition": "A narrow strip of wood esp. sapwood cut from the edge of a plank or board.", "details": []}, {"x": -0.8272976042021035, "y": 0.5565394081163209, "z": 0.07643664889956264, "word": "Listing", "pos_group": "noun", "row_number": 89750, "definition": "The sapwood cut from the edge of a board.", "details": []}, {"x": -0.89793201498569, "y": 0.39797813607498306, "z": 0.18796675150148529, "word": "Litchi", "pos_group": "noun", "row_number": 89757, "definition": "The fruit of a tree native to China (Nephelium Litchi). It is nutlike having a rough but tender shell containing an aromatic pulp and a single large seed. In the dried fruit which is exported the pulp somewhat resembles a raisin in color and form.", "details": []}, {"x": -0.7905627141273357, "y": 0.5712349387564324, "z": 0.22068357386891244, "word": "Lithophyll", "pos_group": "noun", "row_number": 89871, "definition": "A fossil leaf or impression of a leaf.", "details": []}, {"x": -0.8782591619135949, "y": 0.47431001665870526, "z": 0.06075238770656139, "word": "Lithoxyl", "pos_group": "noun", "row_number": 89899, "definition": "Petrified wood.", "details": []}, {"x": -0.8563259397421493, "y": 0.4438690809560283, "z": 0.26398129459485525, "word": "Litter", "pos_group": "noun", "row_number": 89922, "definition": "Straw hay etc. scattered on a floor as bedding for animals to rest on; also a covering of straw for plants.", "details": []}, {"x": -0.8008771388217417, "y": 0.585805086158426, "z": 0.12421034394775445, "word": "Live-forever", "pos_group": "noun", "row_number": 89990, "definition": "A plant (Sedum Telephium) with fleshy leaves which has extreme powers of resisting drought; garden ox-pine.", "details": []}, {"x": -0.9046313048369908, "y": 0.4068351033188432, "z": 0.12699370463322007, "word": "Llano", "pos_group": "noun", "row_number": 90084, "definition": "An extensive plain with or without vegetation.", "details": []}, {"x": -0.8070270414314143, "y": 0.52881028654412, "z": 0.26280607916025045, "word": "Lobby", "pos_group": "noun", "row_number": 90173, "definition": "A confined place for cattle formed by hedges. trees or other fencing near the farmyard.", "details": []}, {"x": -0.8471589383112718, "y": 0.527984167016676, "z": 0.05961923027870609, "word": "Lobe", "pos_group": "noun", "row_number": 90181, "definition": "A rounded projection or division of a leaf.", "details": []}, {"x": -0.8856331476386372, "y": 0.4070837041899021, "z": 0.22346540131910353, "word": "Locust", "pos_group": "noun", "row_number": 90316, "definition": "The locust tree. See Locust Tree (definition note and phrases).", "details": []}, {"x": -0.7886675265653097, "y": 0.5862922950129682, "z": 0.18510774524525747, "word": "Locust tree", "pos_group": "other", "row_number": 90321, "definition": "A large North American tree of the genus Robinia (R. Pseudacacia) producing large slender racemes of white fragrant papilionaceous flowers and often cultivated as an ornamental tree. In England it is called acacia.", "details": []}, {"x": -0.8932079660151468, "y": 0.44288332933816776, "z": 0.07767809241622947, "word": "Lodge", "pos_group": "other", "row_number": 90344, "definition": "To come to a rest; to stop and remain; as the bullet lodged in the bark of a tree.", "details": []}, {"x": -0.8360054601655352, "y": 0.47507403684181393, "z": 0.2745897487020129, "word": "Log", "pos_group": "other", "row_number": 90385, "definition": "To engage in the business of cutting or transporting logs for timber; to get out logs.", "details": []}, {"x": -0.8157362074115497, "y": 0.57112803961665, "z": 0.09158167000805148, "word": "Loggat", "pos_group": "noun", "row_number": 90400, "definition": "A small log or piece of wood.", "details": []}, {"x": -0.9028885486740316, "y": 0.39715989508936156, "z": 0.16448795216035728, "word": "Logging", "pos_group": "noun", "row_number": 90413, "definition": "The business of felling trees cutting them into logs and transporting the logs to sawmills or to market.", "details": []}, {"x": -0.7945635015962458, "y": 0.557686348237459, "z": 0.24011409563097372, "word": "Logwood", "pos_group": "noun", "row_number": 90453, "definition": "The heartwood of a tree (Haematoxylon Campechianum) a native of South America It is a red heavy wood containing a crystalline substance called haematoxylin and is used largely in dyeing. An extract from this wood is used in medicine as an astringent. Also called Campeachy wood and bloodwood.", "details": []}, {"x": -0.8671343084034724, "y": 0.49496848067360183, "z": 0.055536423447120356, "word": "Lop", "pos_group": "other", "row_number": 90748, "definition": "To cut partly off and bend down; as to lop bushes in a hedge.", "details": []}, {"x": -0.8684755601708173, "y": 0.4267996177086965, "z": 0.25217511318465946, "word": "Lop", "pos_group": "noun", "row_number": 90749, "definition": "That which is lopped from anything as branches from a tree.", "details": []}, {"x": -0.7938276006294827, "y": 0.5901586072778139, "z": 0.14680108560480604, "word": "Loppard", "pos_group": "noun", "row_number": 90775, "definition": "A tree the top of which has been lopped off.", "details": []}, {"x": -0.9026102291298813, "y": 0.4173480185816111, "z": 0.10542962418649869, "word": "Lopping", "pos_group": "noun", "row_number": 90780, "definition": "A cutting off as of branches; that which is cut off; leavings.", "details": []}, {"x": -0.8168064326351897, "y": 0.5087890056305366, "z": 0.2719577161164309, "word": "Lote", "pos_group": "noun", "row_number": 90916, "definition": "A large tree (Celtis australis) found in the south of Europe. It has a hard wood and bears a cherrylike fruit. Called also nettle tree.", "details": []}, {"x": -0.8344930512083522, "y": 0.5468495708810786, "z": 0.06765274800150413, "word": "Lotus", "pos_group": "noun", "row_number": 90936, "definition": "The lote or nettle tree. See Lote.", "details": []}, {"x": -0.8942717209680657, "y": 0.3991395421016913, "z": 0.20239988885289964, "word": "Lucuma", "pos_group": "noun", "row_number": 91240, "definition": "An American genus of sapotaceous trees bearing sweet and edible fruits.", "details": []}, {"x": -0.7883411729509042, "y": 0.5789766607579394, "z": 0.20809666342346372, "word": "Lumber", "pos_group": "other", "row_number": 91309, "definition": "To cut logs in the forest or prepare timber for market.", "details": []}, {"x": -0.8847818486566124, "y": 0.4614786924858327, "z": 0.06479580749827672, "word": "Lumberer", "pos_group": "noun", "row_number": 91310, "definition": "One employed in lumbering cutting and getting logs from the forest for lumber; a lumberman.", "details": []}, {"x": -0.8485049448246359, "y": 0.45480901904859816, "z": 0.2705330197964626, "word": "Lumbering", "pos_group": "noun", "row_number": 91311, "definition": "The business of cutting or getting timber or logs from the forest for lumber.", "details": []}, {"x": -0.8054688361201663, "y": 0.5822619643550163, "z": 0.11041267547099021, "word": "Mabolo", "pos_group": "noun", "row_number": 91746, "definition": "A kind of persimmon tree (Diospyros discolor) from the Philippine Islands now introduced into the East and West Indies. It bears an edible fruit as large as a quince.", "details": []}, {"x": -0.905265194025785, "y": 0.40086733426926885, "z": 0.14071357006809201, "word": "Macaranga gum", "pos_group": "other", "row_number": 91757, "definition": "A gum of a crimson color obtained from a tree (Macaranga Indica) that grows in the East Indies. It is used in taking impressions of coins medallions etc. and sometimes as a medicine.", "details": []}, {"x": -0.8010753903673554, "y": 0.5409188748501219, "z": 0.256290830461543, "word": "Macrophyllous", "pos_group": "adjective", "row_number": 91886, "definition": "Having long or large leaves.", "details": []}, {"x": -0.8548872127491123, "y": 0.5158457127272702, "z": 0.0554170924801084, "word": "Madro\ufffda", "pos_group": "noun", "row_number": 92013, "definition": "A small evergreen tree or shrub (Arbutus Menziesii) of California having a smooth bark thick shining leaves and edible red berries which are often called madro\ufffda apples.", "details": []}, {"x": -0.8797672635061689, "y": 0.4126297232077957, "z": 0.2361064878149798, "word": "Magnolia", "pos_group": "noun", "row_number": 92182, "definition": "A genus of American and Asiatic trees with aromatic bark and large sweet-scented whitish or reddish flowers.", "details": []}, {"x": -0.7891673573458127, "y": 0.5900150720649527, "z": 0.1705787115557366, "word": "Magnoliaceous", "pos_group": "adjective", "row_number": 92183, "definition": "Pertaining to a natural order (Magnoliaceae) of trees of which the magnolia the tulip tree and the star anise are examples.", "details": []}, {"x": -0.8979228255194045, "y": 0.43159339577260725, "z": 0.08638136452220899, "word": "Mahaled", "pos_group": "noun", "row_number": 92196, "definition": "A cherry tree (Prunus Mahaleb) of Southern Europe. The wood is prized by cabinetmakers the twigs are used for pipe stems the flowers and leaves yield a perfume and from the fruit a violet dye and a fermented liquor (like kirschwasser) are prepared.", "details": []}, {"x": -0.8281280293551754, "y": 0.48776262349672483, "z": 0.27620932300685624, "word": "Mahoe", "pos_group": "noun", "row_number": 92202, "definition": "A name given to several malvaceous trees (species of Hibiscus Ochroma etc.) and to their strong fibrous inner bark which is used for strings and cordage.", "details": []}, {"x": -0.8222209774409626, "y": 0.5634615517271153, "z": 0.0803974127773981, "word": "Mahogany", "pos_group": "noun", "row_number": 92203, "definition": "A large tree of the genus Swietenia (S. Mahogoni) found in tropical America.", "details": []}, {"x": -0.9007854859092873, "y": 0.3955263348991021, "z": 0.17928866884566957, "word": "Mahwa tree", "pos_group": "other", "row_number": 92229, "definition": "An East Indian sapotaceous tree (Bassia latifolia and also B. butyracea) whose timber is used for wagon wheels and the flowers for food and in preparing an intoxicating drink. It is one of the butter trees. The oil known as mahwa and yallah is obtained from the kernels of the fruit.", "details": []}, {"x": -0.7907556474365521, "y": 0.5675268844532103, "z": 0.22938775353107138, "word": "Malaga", "pos_group": "noun", "row_number": 92486, "definition": "A city and a province of Spain on the Mediterranean. Hence Malaga grapes Malaga raisins Malaga wines.", "details": []}, {"x": -0.8744389745061796, "y": 0.48183817202788987, "z": 0.0564664133924096, "word": "Malambo", "pos_group": "noun", "row_number": 92491, "definition": "A yellowish aromatic bark used in medicine and perfumery said to be from the South American shrub Croton Malambo.", "details": []}, {"x": -0.8610888038000876, "y": 0.436079727005082, "z": 0.2614584931978828, "word": "Malleus", "pos_group": "noun", "row_number": 92658, "definition": "One of the hard lateral pieces of the mastax of Rotifera. See Mastax.", "details": []}, {"x": -0.7969958208576178, "y": 0.5893641151213245, "z": 0.1320893687726229, "word": "Malpighiaceous", "pos_group": "adjective", "row_number": 92677, "definition": "Of pertaining to or resembling a natural order of tropical trees and shrubs (Malpighiaceae) some of them climbing plants and their stems forming many of the curious lianes of South American forests.", "details": []}, {"x": -0.9049100176012552, "y": 0.40898602972667697, "z": 0.11776369361269948, "word": "Mammee", "pos_group": "noun", "row_number": 92733, "definition": "A fruit tree of tropical America belonging to the genus Mammea (M. Americana); also its fruit. The latter is large covered with a thick tough ring and contains a bright yellow pulp of a pleasant taste and fragrant scent. It is often called mammee apple.", "details": []}, {"x": -0.8098216875827954, "y": 0.5216790014007543, "z": 0.2684024102314755, "word": "Mangostan", "pos_group": "noun", "row_number": 92951, "definition": "A tree of the East Indies of the genus Garcinia (G. Mangostana). The tree grows to the height of eighteen feet and bears fruit also called mangosteen of the size of a small apple the pulp of which is very delicious food.", "details": []}, {"x": -0.8420781880724503, "y": 0.5359549227539224, "z": 0.06047020711438158, "word": "Mangrove", "pos_group": "noun", "row_number": 92952, "definition": "The name of one or two trees of the genus Rhizophora (R. Mangle and R. mucronata the last doubtfully distinct) inhabiting muddy shores of tropical regions where they spread by emitting aerial roots which fasten in the saline mire and eventually become new stems. The seeds also send down a strong root while yet attached to the parent plant.", "details": []}, {"x": -0.8896513645726629, "y": 0.40206801387313496, "z": 0.2164757763217669, "word": "Maple", "pos_group": "noun", "row_number": 93256, "definition": "A tree of the genus Acer including about fifty species. A. saccharinum is the rock maple or sugar maple from the sap of which sugar is made in the United States in great quantities by evaporation; the red or swamp maple is A. rubrum; the silver maple A. dasycarpum having fruit wooly when young; the striped maple A. Pennsylvanium called also moosewood. The common maple of Europe is A. campestre the sycamore maple is A. Pseudo-platanus", "details": []}, {"x": -0.7871465003509114, "y": 0.5853168262591952, "z": 0.19443405021542787, "word": "Maqui", "pos_group": "noun", "row_number": 93259, "definition": "A Chilian shrub (Aristotelia Maqui). Its bark furnishes strings for musical instruments and a medicinal wine is made from its berries.", "details": []}, {"x": -0.8907503722479259, "y": 0.4489469469156092, "z": 0.07078427223144136, "word": "Margosa", "pos_group": "noun", "row_number": 93395, "definition": "A large tree of genus Melia (M. Azadirachta) found in India. Its bark is bitter and used as a tonic. A valuable oil is expressed from its seeds and a tenacious gum exudes from its trunk. The M. Azedarach is a much more showy tree and is cultivated in the Southern United States where it is known as Pride of India Pride of China or bead tree. Various parts of the tree are considered anthelmintic.", "details": []}, {"x": -0.8404740312459411, "y": 0.4667099036126559, "z": 0.2752912433606676, "word": "Marron", "pos_group": "adjective", "row_number": 93563, "definition": "A large chestnut.", "details": []}, {"x": -0.8109251935888296, "y": 0.5770010131132464, "z": 0.09731475360502459, "word": "Mast", "pos_group": "noun", "row_number": 93839, "definition": "The fruit of the oak and beech or other forest trees; nuts; acorns.", "details": []}, {"x": -0.9048334140370007, "y": 0.39647277220061306, "z": 0.15519611382282217, "word": "Mastful", "pos_group": "adjective", "row_number": 93889, "definition": "Abounding in mast; producing mast in abundance; as the mastful forest; a mastful chestnut.", "details": []}, {"x": -0.7958310131721903, "y": 0.552425506368934, "z": 0.247949709389529, "word": "Mastic", "pos_group": "noun", "row_number": 93893, "definition": "A low shrubby tree of the genus Pistacia (P. Lentiscus) growing upon the islands and coasts of the Mediterranean and producing a valuable resin; -- called also mastic tree.", "details": []}, {"x": -0.8626386581223613, "y": 0.5030209233541344, "z": 0.05314598932004032, "word": "Mastic", "pos_group": "noun", "row_number": 93894, "definition": "A resin exuding from the mastic tree and obtained by incision. The best is in yellowish white semitransparent tears of a faint smell and is used as an astringent and an aromatic also as an ingredient in varnishes.", "details": []}, {"x": -0.8731594026700502, "y": 0.41979120726529934, "z": 0.2477256543671316, "word": "Mastless", "pos_group": "adjective", "row_number": 93919, "definition": "Bearing no mast; as a mastless oak or beech.", "details": []}, {"x": -0.7907391000704411, "y": 0.5920410348352125, "z": 0.15562483314381334, "word": "Maybloom", "pos_group": "noun", "row_number": 94283, "definition": "The hawthorn.", "details": []}, {"x": -0.9017987566303566, "y": 0.4211904967392886, "z": 0.09673452329160648, "word": "Maybush", "pos_group": "noun", "row_number": 94284, "definition": "The hawthorn.", "details": []}, {"x": -0.8204158189055774, "y": 0.5008407938567787, "z": 0.2758194759229351, "word": "Mayduke", "pos_group": "noun", "row_number": 94285, "definition": "A large dark-red cherry of excellent quality.", "details": []}, {"x": -0.8293018566817986, "y": 0.554332370014928, "z": 0.07052697397276096, "word": "Mayflower", "pos_group": "noun", "row_number": 94287, "definition": "In England the hawthorn; in New England the trailing arbutus (see Arbutus); also the blossom of these plants.", "details": []}, {"x": -0.8976375534791922, "y": 0.39566139059987454, "z": 0.19416201114652637, "word": "Meadow", "pos_group": "noun", "row_number": 94335, "definition": "A tract of low or level land producing grass which is mown for hay; any field on which grass is grown for hay.", "details": []}, {"x": -0.7878931813669995, "y": 0.5762217215530052, "z": 0.21723918239092901, "word": "Measles", "pos_group": "noun", "row_number": 94418, "definition": "A disease of trees.", "details": []}, {"x": -0.8813946100312186, "y": 0.4686283260985606, "z": 0.059422498987989056, "word": "Medlar", "pos_group": "noun", "row_number": 94666, "definition": "A tree of the genus Mespilus (M. Germanica); also the fruit of the tree. The fruit is something like a small apple but has a bony endocarp. When first gathered the flesh is hard and austere and it is not eaten until it has begun to decay.", "details": []}, {"x": -0.853270981603769, "y": 0.446624119917346, "z": 0.2691756442566758, "word": "Melanorrhoea", "pos_group": "noun", "row_number": 94856, "definition": "An East Indian genus of large trees. Melanorrh/a usitatissima is the lignum-vitae of Pegu and yelds a valuable black varnish.", "details": []}, {"x": -0.8011497031588452, "y": 0.5867836649844863, "z": 0.11766088405187342, "word": "Melitose", "pos_group": "noun", "row_number": 94910, "definition": "A variety of sugar isomeric with sucrose extracted from cotton seeds and from the so-called Australian manna (a secretion of certain species of Eucalyptus).", "details": []}, {"x": -0.9061869478875005, "y": 0.4019941394949352, "z": 0.13124758013031268, "word": "Membranaceous", "pos_group": "adjective", "row_number": 95014, "definition": "Thin and rather soft or pliable as the leaves of the rose peach tree and aspen poplar.", "details": []}, {"x": -0.8033599168686555, "y": 0.5343349601575709, "z": 0.26286687566560046, "word": "Merry", "pos_group": "noun", "row_number": 95399, "definition": "A kind of wild red cherry.", "details": []}, {"x": -0.8499156079854602, "y": 0.5240343225591391, "z": 0.05505895097701944, "word": "Mesophl/um", "pos_group": "noun", "row_number": 95520, "definition": "The middle bark of a tree; the green layer of bark usually soon covered by the outer or corky layer and obliterated.", "details": []}, {"x": -0.8841354218674228, "y": 0.4067448239181685, "z": 0.22991999481361503, "word": "Mesophyllum", "pos_group": "noun", "row_number": 95522, "definition": "The parenchyma of a leaf between the skin of the two surfaces.", "details": []}, {"x": -0.7870210742297553, "y": 0.5901040592068925, "z": 0.1799306200339182, "word": "Mesquit", "pos_group": "noun", "row_number": 95559, "definition": "A name for two trees of the southwestern part of North America the honey mesquite and screw-pod mesquite.", "details": []}, {"x": -0.896037665021656, "y": 0.4369569064410326, "z": 0.07864581855395295, "word": "Metrosideros", "pos_group": "noun", "row_number": 95980, "definition": "A myrtaceous genus of trees or shrubs found in Australia and the South Sea Islands and having very hard wood. Metrosideros vera is the true ironwood.", "details": []}, {"x": -0.8323782962602725, "y": 0.4793659381983039, "z": 0.27812707385313296, "word": "Mezereon", "pos_group": "noun", "row_number": 96013, "definition": "A small European shrub (Daphne Mezereum) whose acrid bark is used in medicine.", "details": []}, {"x": -0.817159269960164, "y": 0.5700835891030621, "z": 0.0851788057766901, "word": "Mixen", "pos_group": "noun", "row_number": 97607, "definition": "A compost heap; a dunghill.", "details": []}, {"x": -0.9033190412009187, "y": 0.3937668462474322, "z": 0.1701833734540604, "word": "Monarch", "pos_group": "noun", "row_number": 98134, "definition": "One superior to all others of the same kind; as an oak is called the monarch of the forest.", "details": []}, {"x": -0.7914058990231547, "y": 0.563098435665425, "z": 0.23790093472389634, "word": "Monesia", "pos_group": "noun", "row_number": 98187, "definition": "The bark or a vegetable extract brought in solid cakes from South America and believed to be derived from the bark of the tree Chrysophyllum glycyphloeum. It is used as an alterative and astringent.", "details": []}, {"x": -0.8702649524006846, "y": 0.4897362530286468, "z": 0.052889650145330806, "word": "Monkey-bread", "pos_group": "noun", "row_number": 98277, "definition": "The fruit of the Adansonia digitata; also the tree. See Adansonia.", "details": []}, {"x": -0.8659163559093989, "y": 0.42846592585251764, "z": 0.2580810240058968, "word": "Monkey's puzzle", "pos_group": "other", "row_number": 98280, "definition": "A lofty coniferous Chilian tree (Araucaria imbricata) the branches of which are so crowded and intertwisted \"\"\"\"as to puzzle a monkey to climb.\"\"\"\" The edible nuts are over an inch long and are called pi\ufffdon by the Chilians.", "details": []}, {"x": -0.7933736142443015, "y": 0.5922943955419798, "z": 0.14051924149558556, "word": "Monotropa", "pos_group": "noun", "row_number": 98537, "definition": "A genus of parasitic or saprophytic plants including the Indian pipe and pine sap. The name alludes to the dropping end of the stem.", "details": []}, {"x": -0.9047423660204643, "y": 0.41188878777918536, "z": 0.10857659798264797, "word": "Monoxylous", "pos_group": "adjective", "row_number": 98543, "definition": "Made of one piece of wood.", "details": []}, {"x": -0.8130157950926111, "y": 0.5140683762010338, "z": 0.27338438419185873, "word": "Moosewood", "pos_group": "noun", "row_number": 98723, "definition": "The striped maple (Acer Pennsylvanicum).", "details": []}, {"x": -0.8368554434372353, "y": 0.5438805719822672, "z": 0.0621843244693547, "word": "Moosewood", "pos_group": "noun", "row_number": 98724, "definition": "Leatherwood.", "details": []}, {"x": -0.8934797607094912, "y": 0.39759872920074696, "z": 0.20882808178131002, "word": "Mora", "pos_group": "noun", "row_number": 98770, "definition": "A leguminous tree of Guiana and Trinidad (Dimorphandra excelsa); also its timber used in shipbuilding and making furniture.", "details": []}, {"x": -0.7860479473773422, "y": 0.5835809816843653, "z": 0.2038672662302105, "word": "Morinda", "pos_group": "noun", "row_number": 98891, "definition": "A genus of rubiaceous trees and shrubs mostly East Indian many species of which yield valuable red and yellow dyes. The wood is hard and beautiful and used for gunstocks.", "details": []}, {"x": -0.8878601577871088, "y": 0.4555854444089873, "z": 0.06439132749769973, "word": "Morindin", "pos_group": "noun", "row_number": 98892, "definition": "A yellow dyestuff extracted from the root bark of an East Indian plant (Morinda citrifolia).", "details": []}, {"x": -0.8451583423987827, "y": 0.4582590803014164, "z": 0.2751472180398015, "word": "Moringa", "pos_group": "noun", "row_number": 98894, "definition": "A genus of trees of Southern India and Northern Africa. One species (Moringa pterygosperma) is the horse-radish tree and its seeds as well as those of M. aptera are known in commerce as ben or ben nuts and yield the oil called oil of ben.", "details": []}, {"x": -0.8062293659291143, "y": 0.5824268940154861, "z": 0.10379365414615624, "word": "Morus", "pos_group": "noun", "row_number": 99070, "definition": "A genus of trees some species of which produce edible fruit; the mulberry. See Mulberry.", "details": []}, {"x": -0.906393021100841, "y": 0.39653198972049286, "z": 0.14565051468497212, "word": "Mossback", "pos_group": "noun", "row_number": 99104, "definition": "A veteran partisan; one who is so conservative in opinion that he may be likened to a stone or old tree covered with moss.", "details": []}, {"x": -0.7975518829663498, "y": 0.5465116583916929, "z": 0.25541339279448766, "word": "Moss-grown", "pos_group": "adjective", "row_number": 99107, "definition": "Overgrown with moss.", "details": []}, {"x": -0.8578603885683991, "y": 0.5112898614081284, "z": 0.05155803862184955, "word": "Mossy", "pos_group": "other", "row_number": 99110, "definition": "Overgrown with moss; abounding with or edged with moss; as mossy trees; mossy streams.", "details": []}, {"x": -0.8778068766675543, "y": 0.4131171840374072, "z": 0.2424650068116139, "word": "Motte", "pos_group": "noun", "row_number": 99228, "definition": "A clump of trees in a prairie.", "details": []}, {"x": -0.7879874829391634, "y": 0.5932139954854772, "z": 0.16484199189332177, "word": "Mow", "pos_group": "noun", "row_number": 99449, "definition": "A heap or mass of hay or of sheaves of grain stowed in a barn.", "details": []}, {"x": -0.9005273402481416, "y": 0.4257449232223222, "z": 0.08827100212429216, "word": "Mulberry", "pos_group": "noun", "row_number": 99641, "definition": "The berry or fruit of any tree of the genus Morus; also the tree itself. See Morus.", "details": []}, {"x": -0.8243668798152414, "y": 0.4925528157893386, "z": 0.27894617961477297, "word": "Mulch", "pos_group": "noun", "row_number": 99644, "definition": "Half-rotten straw or any like substance strewn on the ground as over the roots of plants to protect from heat drought etc. and to preserve moisture.", "details": []}, {"x": -0.8240674698757829, "y": 0.5616041421033874, "z": 0.0742535700478013, "word": "Mull", "pos_group": "noun", "row_number": 99681, "definition": "An inferior kind of madder prepared from the smaller roots or the peelings and refuse of the larger.", "details": []}, {"x": -0.9007256814199593, "y": 0.39283467641979203, "z": 0.18540270718818344, "word": "Multicipital", "pos_group": "adjective", "row_number": 99728, "definition": "Having many heads or many stems from one crown or root.", "details": []}, {"x": -0.7878984092247314, "y": 0.5727175253056812, "z": 0.2262978854273154, "word": "Multijugate", "pos_group": "adjective", "row_number": 99753, "definition": "Having many pairs of leaflets.", "details": []}, {"x": -0.8776173388596749, "y": 0.476231357701857, "z": 0.05469461101707069, "word": "Multiramose", "pos_group": "adjective", "row_number": 99809, "definition": "Having many branches.", "details": []}, {"x": -0.8581591930805814, "y": 0.43852055126082, "z": 0.2669504175932152, "word": "Multiserial", "pos_group": "adjective", "row_number": 99813, "definition": "Arranged in many rows or series as the scales of a pine cone or the leaves of the houseleek.", "details": []}, {"x": -0.7970411238805025, "y": 0.5907320427916845, "z": 0.12554322149152095, "word": "Muscadine", "pos_group": "noun", "row_number": 100050, "definition": "A name given to several very different kinds of grapes but in America used chiefly for the scuppernong or southern fox grape which is said to be the parent stock of the Catawba. See Grapevine.", "details": []}, {"x": -0.9066764212023006, "y": 0.4038853259695987, "z": 0.12171487461366189, "word": "Muskwood", "pos_group": "noun", "row_number": 100171, "definition": "The wood of a West Indian tree of the Mahogany family (Moschoxylum Swartzii).", "details": []}, {"x": -0.8060717272080268, "y": 0.5271977298559076, "z": 0.2689069062531599, "word": "Muskwood", "pos_group": "noun", "row_number": 100172, "definition": "The wood of an Australian tree (Eurybia argophylla).", "details": []}, {"x": -0.8447468811383196, "y": 0.5322743671487297, "z": 0.05555812167002083, "word": "Mustaiba", "pos_group": "noun", "row_number": 100215, "definition": "A close-grained neavy wood of a brownish color brought from Brazil and used in turning for making the handles of tools and the like.", "details": []}, {"x": -0.8883672192063922, "y": 0.4013379799065983, "z": 0.22300562711284375, "word": "Myall wood", "pos_group": "other", "row_number": 100331, "definition": "A durable fragrant and dark-colored Australian wood used by the natives for spears. It is obtained from the small tree Acacia homolophylla.", "details": []}, {"x": -0.7852735892552988, "y": 0.5894368616229076, "z": 0.18949822209782724, "word": "Myrcia", "pos_group": "noun", "row_number": 100430, "definition": "A large genus of tropical American trees and shrubs nearly related to the true myrtles (Myrtus) from which they differ in having very few seeds in each berry.", "details": []}, {"x": -0.8937013004473002, "y": 0.4429575169349395, "z": 0.07132057045226917, "word": "Myriophyllous", "pos_group": "adjective", "row_number": 100452, "definition": "Having an indefinitely great or countless number of leaves.", "details": []}, {"x": -0.8368954027582076, "y": 0.47078660523162297, "z": 0.27922402686133846, "word": "Myroxylon", "pos_group": "noun", "row_number": 100470, "definition": "A genus of leguminous trees of tropical America the different species of which yield balsamic products among which are balsam of Peru and balsam of Tolu. The species were formerly referred to Myrospermum.", "details": []}, {"x": -0.8121559828637837, "y": 0.5763377877785123, "z": 0.09076019985176366, "word": "Myrrh", "pos_group": "noun", "row_number": 100471, "definition": "A gum resin usually of a yellowish brown or amber color of an aromatic odor and a bitter slightly pungent taste. It is valued for its odor and for its medicinal properties. It exudes from the bark of a shrub of Abyssinia and Arabia the Balsamodendron Myrrha. The myrrh of the Bible is supposed to have been partly the gum above named and partly the exudation of species of Cistus or rockrose.", "details": []}, {"x": -0.905499919759463, "y": 0.39273284135632536, "z": 0.16071966474515056, "word": "Myrtaceous", "pos_group": "adjective", "row_number": 100474, "definition": "Of pertaining to or resembling a large and important natural order of trees and shrubs (Myrtaceae) of which the myrtle is the type. It includes the genera Eucalyptus Pimenta Lechythis and about seventy more.", "details": []}, {"x": -0.7925182644278291, "y": 0.5579684276407193, "z": 0.24614230498726733, "word": "Naseberry", "pos_group": "noun", "row_number": 100833, "definition": "A tropical fruit. See Sapodilla.", "details": []}, {"x": -0.8657627919553041, "y": 0.49794330863153063, "z": 0.050072442069875225, "word": "Natty", "pos_group": "adjective", "row_number": 100943, "definition": "Neat; tidy; spruce.", "details": []}, {"x": -0.8707659096919355, "y": 0.4210987103226277, "z": 0.2538554838544868, "word": "Necked", "pos_group": "adjective", "row_number": 101214, "definition": "Cracked; -- said of a treenail.", "details": []}, {"x": -0.7900477578091335, "y": 0.5945521529310296, "z": 0.1494398803058892, "word": "Necrosis", "pos_group": "noun", "row_number": 101257, "definition": "A disease of trees in which the branches gradually dry up from the bark to the center.", "details": []}, {"x": -0.9041161361919182, "y": 0.4155368749559521, "z": 0.09951441015872214, "word": "Needle", "pos_group": "noun", "row_number": 101303, "definition": "One of the needle-shaped secondary leaves of pine trees. See Pinus.", "details": []}, {"x": -0.8165901261593039, "y": 0.5060317823460969, "z": 0.2776911974023748, "word": "Neishout", "pos_group": "noun", "row_number": 101456, "definition": "The mahogany-like wood of the South African tree Pteroxylon utile the sawdust of which causes violent sneezing (whence the name). Also called sneezewood.", "details": []}, {"x": -0.8315312865569914, "y": 0.5516889219758797, "z": 0.06476922761594464, "word": "Nemophilist", "pos_group": "noun", "row_number": 101492, "definition": "One who is fond of forest or forest scenery; a haunter of the woods.", "details": []}, {"x": -0.8970777388537416, "y": 0.3937289155728463, "z": 0.20057186117421505, "word": "Nemophily", "pos_group": "noun", "row_number": 101493, "definition": "Fondness for forest scenery; love of the woods.", "details": []}, {"x": -0.7853911370502318, "y": 0.5810787239167571, "z": 0.21332669419043016, "word": "Nerve", "pos_group": "noun", "row_number": 101638, "definition": "One of the principal fibrovascular bundles or ribs of a leaf especially when these extend straight from the base or the midrib of the leaf.", "details": []}, {"x": -0.8845495151331247, "y": 0.4627546468811468, "z": 0.058568695287317736, "word": "Net", "pos_group": "other", "row_number": 101705, "definition": "To inclose or cover with a net; as to net a tree.", "details": []}, {"x": -0.8500211416218967, "y": 0.44979274147592546, "z": 0.27413600367587393, "word": "Nicaragua wood", "pos_group": "other", "row_number": 101923, "definition": "Brazil wood.", "details": []}, {"x": -0.8016914570943354, "y": 0.5873449190777822, "z": 0.11098087067362006, "word": "Nine-bark", "pos_group": "noun", "row_number": 102141, "definition": "A white-flowered rosaceous shrub (Neillia / Spiraea opulifolia) common in the Northern United States. The bark separates into many thin layers whence the name.", "details": []}, {"x": -0.9075416197480524, "y": 0.3973559532412938, "z": 0.13592812383309147, "word": "Niopo", "pos_group": "noun", "row_number": 102183, "definition": "A kind of snuff prepared by the natives of Venezuela from the roasted seeds of a leguminous tree (Piptadenia peregrina) thence called niopo tree.", "details": []}, {"x": -0.7997213372668752, "y": 0.5399784412171972, "z": 0.26242916328168814, "word": "Nitid", "pos_group": "adjective", "row_number": 102233, "definition": "Gay; spruce; fine; -- said of persons.", "details": []}, {"x": -0.8528322938009225, "y": 0.519707286997474, "z": 0.050807622380720376, "word": "Nitty", "pos_group": "adjective", "row_number": 102299, "definition": "Shining; elegant; spruce.", "details": []}, {"x": -0.8823744012204288, "y": 0.40684418166555103, "z": 0.2364174864847738, "word": "Node", "pos_group": "noun", "row_number": 102416, "definition": "The joint of a stem or the part where a leaf or several leaves are inserted.", "details": []}, {"x": -0.7856042080023298, "y": 0.5936472596547528, "z": 0.17438164890100913, "word": "Nog", "pos_group": "noun", "row_number": 102451, "definition": "A treenail to fasten the shores.", "details": []}, {"x": -0.898793183661205, "y": 0.4309892232756739, "z": 0.08011930119756847, "word": "Nog", "pos_group": "other", "row_number": 102453, "definition": "To fasten as shores with treenails.", "details": []}, {"x": -0.8286322723331646, "y": 0.4839878568319119, "z": 0.2812904400921382, "word": "Notwheat", "pos_group": "noun", "row_number": 103101, "definition": "Wheat not bearded.", "details": []}, {"x": -0.8188330048262802, "y": 0.5685943886116476, "z": 0.07882215073513216, "word": "Nucament", "pos_group": "noun", "row_number": 103238, "definition": "A catkin or ament; the flower cluster of the hazel pine willow and the like.", "details": []}, {"x": -0.9034998811342101, "y": 0.39070055092997436, "z": 0.17618468802220824, "word": "Nudicaul", "pos_group": "adjective", "row_number": 103293, "definition": "Having the stems leafless.", "details": []}, {"x": -0.7883671446359855, "y": 0.5684739076572334, "z": 0.23519069193192735, "word": "Nursery", "pos_group": "noun", "row_number": 103462, "definition": "A place where young trees shrubs vines etc. are propagated for the purpose of transplanting; a plantation of young trees.", "details": []}, {"x": -0.873471096368878, "y": 0.48423212363585033, "z": 0.0506704474744872, "word": "Nurseryman", "pos_group": "noun", "row_number": 103467, "definition": "One who cultivates or keeps a nursery or place for rearing trees etc.", "details": []}, {"x": -0.8631282332022336, "y": 0.43057055182893383, "z": 0.2638534687035931, "word": "Nut", "pos_group": "noun", "row_number": 103478, "definition": "The fruit of certain trees and shrubs (as of the almond walnut hickory beech filbert etc.) consisting of a hard and indehiscent shell inclosing a kernel.", "details": []}, {"x": -0.7931829971977236, "y": 0.5940562564369659, "z": 0.13400707871054304, "word": "Nymph", "pos_group": "noun", "row_number": 103552, "definition": "A goddess of the mountains forests meadows or waters.", "details": []}, {"x": -0.9067161371856066, "y": 0.40654360475826035, "z": 0.11219689834113798, "word": "Oak", "pos_group": "noun", "row_number": 103592, "definition": "Any tree or shrub of the genus Quercus. The oaks have alternate leaves often variously lobed and staminate flowers in catkins. The fruit is a smooth nut called an acorn which is more or less inclosed in a scaly involucre called the cup or cupule. There are now recognized about three hundred species of which nearly fifty occur in the United States the rest in Europe Asia and the other parts of North America a very few barely reaching the northern parts of South America and Africa. Many of the oaks form forest trees of grand proportions and live many centuries. The wood is usually hard and tough and provided with conspicuous medullary rays forming the silver grain.", "details": []}, {"x": -0.8091966827413967, "y": 0.5195540389372819, "z": 0.27434345128739, "word": "Oak", "pos_group": "noun", "row_number": 103593, "definition": "The strong wood or timber of the oak.", "details": []}, {"x": -0.8394193600919445, "y": 0.5404940459794224, "z": 0.05693262828663568, "word": "Oaken", "pos_group": "adjective", "row_number": 103594, "definition": "Made or consisting of oaks or of the wood of oaks.", "details": []}, {"x": -0.8924202816616981, "y": 0.39646819641551123, "z": 0.21540429454838445, "word": "Oakling", "pos_group": "noun", "row_number": 103596, "definition": "A young oak.", "details": []}, {"x": -0.7839490463387737, "y": 0.587998291506424, "z": 0.19920316746993172, "word": "Oaky", "pos_group": "noun", "row_number": 103599, "definition": "Resembling oak; strong.", "details": []}, {"x": -0.8909205141121687, "y": 0.4495586029393824, "z": 0.06448022997244593, "word": "Obverse", "pos_group": "adjective", "row_number": 104078, "definition": "Having the base or end next the attachment narrower than the top as a leaf.", "details": []}, {"x": -0.8416451981956261, "y": 0.46209381887332424, "z": 0.2794685365355333, "word": "Octavo", "pos_group": "adjective", "row_number": 104266, "definition": "Having eight leaves to a sheet; as an octavo s of which the olive is the type. It includes also the ash the lilac the true jasmine and fringe tree.", "details": []}, {"x": -0.82614774457811, "y": 0.55930783498588, "z": 0.06822499433425809, "word": "Oleaster", "pos_group": "noun", "row_number": 104715, "definition": "The wild olive tree (Olea Europea var. sylvestris).", "details": []}, {"x": -0.9004061813022912, "y": 0.3905070794981701, "z": 0.19176269067374738, "word": "Olive", "pos_group": "noun", "row_number": 104786, "definition": "A tree (Olea Europaea) with small oblong or elliptical leaves axillary clusters of flowers and oval one-seeded drupes. The tree has been cultivated for its fruit for thousands of years and its branches are the emblems of peace. The wood is yellowish brown and beautifully variegated.", "details": []}, {"x": -0.7851917119035973, "y": 0.5778106832240033, "z": 0.22273030756973486, "word": "Olived", "pos_group": "adjective", "row_number": 104795, "definition": "Decorated or furnished with olive trees.", "details": []}, {"x": -0.8808345053475539, "y": 0.4704051066732512, "z": 0.05338173662272076, "word": "Oliver", "pos_group": "noun", "row_number": 104797, "definition": "An olive grove.", "details": []}, {"x": -0.8550230996201515, "y": 0.4413831684260167, "z": 0.2722432694230636, "word": "Oliver", "pos_group": "noun", "row_number": 104798, "definition": "An olive tree.", "details": []}, {"x": -0.7973533938831235, "y": 0.5916979664871088, "z": 0.11883215776078808, "word": "Olivewood", "pos_group": "noun", "row_number": 104801, "definition": "The wood of the olive.", "details": []}, {"x": -0.9082567257712366, "y": 0.39895659176878484, "z": 0.12610851666540154, "word": "Olivewood", "pos_group": "noun", "row_number": 104802, "definition": "An Australian name given to the hard white wood of certain trees of the genus Elaeodendron and also to the trees themselves.", "details": []}, {"x": -0.8023305923685924, "y": 0.5328654003206784, "z": 0.26892394034475076, "word": "Olivin", "pos_group": "noun", "row_number": 104804, "definition": "A complex bitter gum found on the leaves of the olive tree; -- called also olivite.", "details": []}, {"x": -0.847589814735258, "y": 0.5282029568717441, "z": 0.05092290554355281, "word": "Omander wood", "pos_group": "other", "row_number": 104821, "definition": "The wood of Diospyros ebenaster a kind of ebony found in Ceylon.", "details": []}, {"x": -0.8868185028199015, "y": 0.40103622081187584, "z": 0.2296146612331118, "word": "Ook", "pos_group": "noun", "row_number": 105083, "definition": "Oak.", "details": []}, {"x": -0.7836179283932165, "y": 0.5933166866201176, "z": 0.18416908448175776, "word": "Opening", "pos_group": "noun", "row_number": 105194, "definition": "A thinly wooded space without undergrowth in the midst of a forest; as oak openings.", "details": []}, {"x": -0.8965975203301695, "y": 0.4368949567597877, "z": 0.07235802164000038, "word": "Oppositifolious", "pos_group": "adjective", "row_number": 105437, "definition": "Placed at the same node with a leaf but separated from it by the whole diameter of the stem; as an oppositifolious peduncle.", "details": []}, {"x": -0.8331815170603717, "y": 0.4752119992134788, "z": 0.28281109496005685, "word": "Orange", "pos_group": "noun", "row_number": 105563, "definition": "The fruit of a tree of the genus Citrus (C. Aurantium). It is usually round and consists of pulpy carpels commonly ten in number inclosed in a leathery rind which is easily separable and is reddish yellow when ripe.", "details": []}, {"x": -0.8136421701811373, "y": 0.5752341156972339, "z": 0.08421479110554352, "word": "Orange", "pos_group": "noun", "row_number": 105564, "definition": "The tree that bears oranges; the orange tree.", "details": []}, {"x": -0.905926188933007, "y": 0.38929464938947667, "z": 0.16657555691650003, "word": "Orangery", "pos_group": "noun", "row_number": 105573, "definition": "A place for raising oranges; a plantation of orange trees.", "details": []}, {"x": -0.7893057484413616, "y" n to the midrib so that the parenchyma is interrupted.", "details": []}, {"x": -0.7932559488724074, "y": 0.5954330462650828, "z": 0.12729684597043428, "word": "Palmy", "pos_group": "adjective", "row_number": 108702, "definition": "Bearing palms; abounding in palms; derived from palms; as a palmy shore.", "details": []}, {"x": -0.9085193253399758, "y": 0.4013392197161394, "z": 0.11627323940372315, "word": "Palmyra", "pos_group": "noun", "row_number": 108704, "definition": "A species of palm (Borassus flabelliformis) having a straight black upright trunk with palmate leaves. It is found native along the entire northern shores of the Indian Ocean from the mouth of the Tigris to New Guinea. More than eight hundred uses to which it is put are enumerated by native writers. Its wood is largely used for building purposes; its fruit and roots serve for food its sap for making toddy and its leaves for thatching huts.", "details": []}, {"x": -0.805366901500185, "y": 0.5252177027058821, "z": 0.27482816218929834, "word": "Pan", "pos_group": "noun", "row_number": 108809, "definition": "A leaf of gold or silver.", "details": []}, {"x": -0.84217076539901, "y": 0.5367049537407474, "z": 0.051924893234246164, "word": "Pan", "pos_group": "noun", "row_number": 108811, "definition": "The betel leaf; also the masticatory made of the betel leaf etc. See /etel.", "details": []}, {"x": -0.8910961721660567, "y": 0.3957541683782527, "z": 0.22209513763754235, "word": "Pandanus", "pos_group": "noun", "row_number": 108857, "definition": "A genus of endogenous plants. See Screw pine.", "details": []}, {"x": -0.7820542392749523, "y": 0.5922044604956586, "z": 0.1941263603973496, "word": "Pannage", "pos_group": "noun", "row_number": 108965, "definition": "The food of swine in the woods as beechnuts acorns etc.; -- called also pawns.", "details": []}, {"x": -0.8939456287514722, "y": 0.44342751107950434, "z": 0.06506347096467457, "word": "Papaw", "pos_group": "noun", "row_number": 109130, "definition": "A tree (Carica Papaya) of tropical America belonging to the order Passifloreae. It has a soft spongy stem eighteen or twenty feet high crowned with a tuft of large long-stalked palmately lobed leaves. The milky juice of the plant is said to have the property of making meat tender. Also its dull orange-colored melon-shaped fruit which is eaten both raw and cooked or pickled.", "details": []}, {"x": -0.837981228154611, "y": 0.4662941013930793, "z": 0.2834735830134985, "word": "Papaw", "pos_group": "noun", "row_number": 109131, "definition": "A tree of the genus Asimina (A. triloba) growing in the western and southern parts of the United States and producing a sweet edible fruit; also the fruit itself.", "details": []}, {"x": -0.808538914849569, "y": 0.581456408990178, "z": 0.09040612599889547, "word": "Papyrus", "pos_group": "noun", "row_number": 109210, "definition": "The material upon which the ancient Egyptians wrote. It was formed by cutting the stem of the plant into thin longitudinal slices which were gummed together and pressed.", "details": []}, {"x": -0.9079731936895873, "y": 0.38864676402972476, "z": 0.15664728644427445, "word": "Paraguay tea", "pos_group": "other", "row_number": 109366, "definition": "See Mate the leaf of the Brazilian holly.", "details": []}, {"x": -0.7907165771585256, "y": 0.5578408040921332, "z": 0.25215259645014065, "word": "Paramo", "pos_group": "noun", "row_number": 109448, "definition": "A high bleak plateau or district with stunted trees and cold damp atmosphere as in the Andes in South America.", "details": []}, {"x": -0.8641734179764944, "y": 0.5011833741983348, "z": 0.04493917099808554, "word": "Parastichy", "pos_group": "noun", "row_number": 109540, "definition": "A secondary spiral in phyllotaxy as one of the evident spirals in a pine cone.", "details": []}, {"x": -0.8731373614679407, "y": 0.415417873447147, "z": 0.25506692931356806, "word": "Patch", "pos_group": "noun", "row_number": 110393, "definition": "Fig.: Anything regarded as a patch; a small piece of ground; a tract; a plot; as scattered patches of trees or growing corn.", "details": []}, {"x": -0.7863691461145395, "y": 0.5986531122059717, "z": 0.15244020888595775, "word": "Paulownia", "pos_group": "noun", "row_number": 110670, "definition": "A genus of trees of the order Scrophulariaceae consisting of one species Paulownia imperialis.", "details": []}, {"x": -0.905395054185811, "y": 0.41413881314779666, "z": 0.0935352302632902, "word": "Pear", "pos_group": "noun", "row_number": 110883, "definition": "The fleshy pome or fruit of a rosaceous tree (Pyrus communis) cultivated in many varieties in temperate climates; also the tree which bears this fruit. See Pear family below.", "details": []}, {"x": -0.8166105047407856, "y": 0.5029597614120312, "z": 0.2831585456018449, "word": "Pecan", "pos_group": "noun", "row_number": 110942, "definition": "A species of hickory (Carya olivaeformis) growing in North America chiefly in the Mississippi valley and in Texas where it is one of the largest of forest trees; also its fruit a smooth oblong nut an inch or an inch and a half long with a thin shell and well-flavored meat.", "details": []}, {"x": -0.828450553713368, "y": 0.5565816163672279, "z": 0.06234247648319775, "word": "Peepul tree", "pos_group": "other", "row_number": 111209, "definition": "A sacred tree (Ficus religiosa) of the Buddhists a kind of fig tree which attains great size and venerable age. See Bo tree.", "details": []}, {"x": -0.8998259552752139, "y": 0.3885559056813747, "z": 0.1983369818595996, "word": "Penicillate", "pos_group": "adjective", "row_number": 111494, "definition": "Having the form of a pencil; furnished with a pencil of fine hairs; ending in a tuft of hairs like a camel's-hair brush as the stigmas of some grasses.", "details": []}, {"x": -0.7826483143594273, "y": 0.5827791543813546, "z": 0.21870087619600495, "word": "Pentastichous", "pos_group": "adjective", "row_number": 111681, "definition": "Having or arranged in five vertical ranks as the leaves of an apple tree or a cherry tree.", "details": []}, {"x": -0.884072695053944, "y": 0.46438715993012886, "z": 0.05253604050635029, "word": "Pepperidge", "pos_group": "noun", "row_number": 111778, "definition": "A North American tree (Nyssa multiflora) with very tough wood handsome oval polished leaves and very acid berries -- the sour gum or common tupelo. See Tupelo.", "details": []}, {"x": -0.8516939741448296, "y": 0.4446538783570947, "z": 0.27730903856055633, "word": "Perdifoil", "pos_group": "noun", "row_number": 111916, "definition": "A deciduous plant; -- opposed to evergreen.", "details": []}, {"x": -0.7979305729386367, "y": 0.5922543507278799, "z": 0.11198921739933827, "word": "Perfoliate", "pos_group": "adjective", "row_number": 112000, "definition": "Having the basal part produced around the stem; -- said of leaves which the stem apparently passes directory through.", "details": []}, {"x": -0.9096405179269107, "y": 0.3942246268256754, "z": 0.1309239158817775, "word": "Periderm", "pos_group": "noun", "row_number": 112100, "definition": "The outer layer of bark.", "details": []}, {"x": -0.7986156870559323, "y": 0.5386529887304319, "z": 0.268451005064154, "word": "Perk", "pos_group": "adjective", "row_number": 112331, "definition": "Smart; trim; spruce; jaunty; vain.", "details": []}, {"x": -0.8505917416358248, "y": 0.5237586838734378, "z": 0.046588948561849156, "word": "Persimmon", "pos_group": "noun", "row_number": 112519, "definition": "An American tree (Diospyros Virginiana) and its fruit found from New York southward. The fruit is like a plum in appearance but is very harsh and astringent until it has been exposed to frost when it becomes palatable and nutritious.", "details": []}, {"x": -0.8850102916484903, "y": 0.40116522570945656, "z": 0.2362694338202358, "word": "Perula", "pos_group": "noun", "row_number": 112707, "definition": "One of the scales of a leaf bud.", "details": []}, {"x": -0.7821872732747793, "y": s planted; a plantation.", "details": []}, {"x": -0.8537372703814677, "y": 0.5189601717976184, "z": 0.04257949329650153, "word": "Plash", "pos_group": "noun", "row_number": 115352, "definition": "The branch of a tree partly cut or bent and bound to or intertwined with other branches.", "details": []}, {"x": -0.8829482254076721, "y": 0.401726371930997, "z": 0.24293693285418855, "word": "Plashing", "pos_group": "noun", "row_number": 115354, "definition": "The cutting or bending and intertwining the branches of small trees as in hedges.", "details": []}, {"x": -0.7809886930313534, "y": 0.600270095835287, "z": 0.17243106855515852, "word": "Plashoot", "pos_group": "noun", "row_number": 115356, "definition": "A hedge or fence formed of branches of trees interlaced or plashed.", "details": []}, {"x": -0.9021602508422533, "y": 0.42466779218034795, "z": 0.07592198683458874, "word": "Platan", "pos_group": "noun", "row_number": 115429, "definition": "The plane tree.", "details": []}, {"x": -0.825414317098488, "y": 0.48502145640407496, "z": 0.28886916061862067, "word": "Platanus", "pos_group": "noun", "row_number": 115431, "definition": "A genus of trees; the plane tree.", "details": []}, {"x": -0.8173484919467408, "y": 0.5717169754018518, "z": 0.07128213485682842, "word": "Pledget", "pos_group": "noun", "row_number": 115727, "definition": "A string of oakum used in calking.", "details": []}, {"x": -0.9060392286821767, "y": 0.38339382914227527, "z": 0.17917055523894043, "word": "Pliable", "pos_group": "verb", "row_number": 115880, "definition": "Capable of being plied turned or bent; easy to be bent; flexible; pliant; supple; limber; yielding; as willow is a pliable plant.", "details": []}, {"x": -0.7832413342321283, "y": 0.5744578592229294, "z": 0.2377628657450202, "word": "Plica", "pos_group": "verb", "row_number": 115886, "definition": "A diseased state in plants in which there is an excessive development of small entangled twigs instead of ordinary branches.", "details": [] rs and hairdressers. (e) A pole on which climbing beans hops or other vines are trained.", "details": []}, {"x": -0.779003187863167, "y": 0.5946128788851542, "z": 0.19897124808105365, "word": "Pollard", "pos_group": "noun", "row_number": 116780, "definition": "A tree having its top cut off at some height above the ground that may throw out branches.", "details": []}, {"x": -0.8939545613070398, "y": 0.4442689117397486, "z": 0.05890990052544138, "word": "Pollard", "pos_group": "other", "row_number": 116787, "definition": "To lop the tops of as trees; to poll; as to pollard willows.", "details": []}, {"x": -0.8392491319404303, "y": 0.4616147617458828, "z": 0.2873546698342071, "word": "Polling", "pos_group": "noun", "row_number": 116808, "definition": "The act of topping lopping or cropping as trees or hedges.", "details": []}, {"x": -0.8048917803871178, "y": 0.5864813278161084, "z": 0.09049239740613509, "word": "Polyrhizous", "pos_group": "adjective", "row_number": 117114, "definition": "Having numerous roots or rootlets.", "details": []}, {"x": -0.9103121249426026, "y": 0.3848872853683168, "z": 0.15229449347987303, "word": "Pomaceous", "pos_group": "adjective", "row_number": 117180, "definition": "Of or pertaining to a suborder (Pomeae) of rosaceous plants which includes the true thorn trees the quinces service berries medlars and loquats as well as the apples pears crabs etc.", "details": []}, {"x": -0.7891461448419343, "y": 0.5573272287891471, "z": 0.25813702200831734, "word": "Pomegranate", "pos_group": "noun", "row_number": 117192, "definition": "The fruit of the tree Punica Granatum; also the tree itself (see Balaustine) which is native in the Orient but is successfully cultivated in many warm countries and as a house plant in colder climates. The fruit is as large as an orange and has a hard rind containing many rather large seeds each one separately covered with crimson acid pulp.", "details": []}, {"x": -0.8623805576787335, "y": 0.5046679892525943, "z": 0.0401
