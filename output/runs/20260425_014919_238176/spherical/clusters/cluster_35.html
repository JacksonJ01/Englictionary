n's trespass in the forest against venison.", "details": []}, {"x": -0.8251531207378957, "y": 0.5432196686052894, "z": 0.1550313483682303, "word": "Body", "pos_group": "noun", "row_number": 17600, "definition": "The trunk or main part of a person or animal as distinguished from the limbs and head; the main central or principal part as of a tree army country etc.", "details": []}, {"x": -0.8785424331266675, "y": 0.45722860082153777, "z": 0.13822156049854867, "word": "Bogwood", "pos_group": "noun", "row_number": 17647, "definition": "The wood of trees esp. of oaks dug up from peat bogs. It is of a shining black or ebony color and is largely used for making ornaments.", "details": []}, {"x": -0.8350459736497239, "y": 0.5050669152221481, "z": 0.21818715140761177, "word": "Boldu", "pos_group": "noun", "row_number": 17715, "definition": "A fragrant evergreen shrub of Chili (Peumus Boldus). The bark is used in tanning the wood for making charcoal the leaves in medicine and the drupes are eaten.", "details": []}, {"x": -0.8456859103625946, "y": 0.5207258623143174, "z": 0.11687564900867997, "word": "Bole", "pos_group": "noun", "row_number": 17716, "definition": "The trunk or stem of a tree or that which is like it.", "details": []}, {"x": -0.8736307780700014, "y": 0.4495169230630478, "z": 0.18628955818492257, "word": "Bolling", "pos_group": "other", "row_number": 17739, "definition": "A tree from which the branches have been cut; a pollard.", "details": []}, {"x": -0.8216200472493529, "y": 0.5390244191863094, "z": 0.18545396592910315, "word": "Bombax", "pos_group": "noun", "row_number": 17844, "definition": "A genus of trees called also the silkcotton tree; also a tree of the genus Bombax.", "details": []}, {"x": -0.8704028410830416, "y": 0.4782453170919715, "z": 0.11696286126018313, "word": "Bonchretien", "pos_group": "noun", "row_number": 17876, "definition": "A name given to several kinds of pears. See Bartlett.", "details": []}, {"x": -0.8505227531242837, "y": 0.4781611504491222, "z": 0.2190273056471742, "word": "Bonduc", "pos_group": "noun", "row_number": 17915, "definition": "See Nicker tree.", "details": []}, {"x": -0.8308872212594132, "y": 0.5393203226309261, "z": 0.13696720463338974, "word": "Boon", "pos_group": "noun", "row_number": 18112, "definition": "The woody portion flax which is separated from the fiber as refuse matter by retting braking and scutching.", "details": []}, {"x": -0.8798546639905745, "y": 0.44900217203835086, "z": 0.15573316846091761, "word": "Borneol", "pos_group": "noun", "row_number": 18258, "definition": "A rare variety of camphor C10H17.OH resembling ordinary camphor from which it can be produced by reduction. It is said to occur in the camphor tree of Borneo and Sumatra (Dryobalanops camphora) but the natural borneol is rarely found in European or American commerce being in great request by the Chinese. Called also Borneo camphor Malay camphor and camphol.", "details": []}, {"x": -0.8271842917335704, "y": 0.5210497555564809, "z": 0.21041221386545816, "word": "Boscage", "pos_group": "noun", "row_number": 18297, "definition": "A growth of trees or shrubs; underwood; a thicket; thick foliage; a wooded landscape.", "details": []}, {"x": -0.8558271147902166, "y": 0.5052669054999869, "z": 0.11074883203140694, "word": "Boscage", "pos_group": "noun", "row_number": 18298, "definition": "Food or sustenance for cattle obtained from bushes and trees; also a tax on wood.", "details": []}, {"x": -0.8663732040167288, "y": 0.4562216782537836, "z": 0.20312373483443288, "word": "Bosquet", "pos_group": "noun", "row_number": 18311, "definition": "A grove; a thicket; shrubbery; an inclosure formed by branches of trees regularly or irregularly disposed.", "details": []}, {"x": -0.8220006292575291, "y": 0.5445448433256785, "z": 0.16669096888445525, "word": "Bosky", "pos_group": "adjective", "row_number": 18313, "definition": "Woody or bushy; covered with boscage or thickets.", "details": []}, {"x": -0.8769668707268098, "y": 0.46325647222144295, "z": 0.12775972993306683, "word": "Bo tree", "pos_group": "other", "row_number": 18413, "definition": "The peepul tree; esp. the very ancient tree standing at Anurajahpoora in Ceylon grown from a slip of the tree under which Gautama is said to have received the heavenly light and so to have become Buddha.", "details": []}, {"x": -0.8402751804186785, "y": 0.49467871340672903, "z": 0.22187967837235764, "word": "Bough", "pos_group": "noun", "row_number": 18485, "definition": "An arm or branch of a tree esp. a large arm or main branch.", "details": []}, {"x": -0.8392803418734832, "y": 0.529862972050374, "z": 0.12187591474394643, "word": "Bourgeon", "pos_group": "other", "row_number": 18595, "definition": "To sprout; to put forth buds; to shoot forth as a branch.", "details": []}, {"x": -0.8775772580646465, "y": 0.44629880765470686, "z": 0.17514431310700296, "word": "Box", "pos_group": "noun", "row_number": 18753, "definition": "A tree or shrub flourishing in different parts of the world. The common box (Buxus sempervirens) has two varieties one of which the dwarf box (B. suffruticosa) is much used for borders in gardens. The wood of the tree varieties being very hard and smooth is extensively used in the arts as by turners engravers mathematical instrument makers etc.", "details": []}, {"x": -0.821959355673161, "y": 0.5344487275091463, "z": 0.1968435299551807, "word": "Boxen", "pos_group": "adjective", "row_number": 18777, "definition": "Made of boxwood; pertaining to or resembling the box (Buxus).", "details": []}, {"x": -0.8656749402780106, "y": 0.4880816182545077, "z": 0.11127996988103293, "word": "Boxwood", "pos_group": "noun", "row_number": 18792, "definition": "The wood of the box (Buxus).", "details": []}, {"x": -0.8569015692071053, "y": 0.4680733465366703, "z": 0.21593295939333257, "word": "Brachiate", "pos_group": "adjective", "row_number": 18853, "definition": "Having branches in pairs decussated all nearly horizontal and each pair at right angles with the next as in the maple and lilac.", "details": []}, {"x": -0.8259490409083499, "y": 0.544189797204182, "z": 0.1471925488652478, "word": "Brake", "pos_group": "noun", "row_number": 18996, "definition": "A thicket; a place overgrown with shrubs and brambles with undergrowth and ferns or with canes.", "details": []}, {"x": -0.8804797012961941, "y": 0.4517853080759051, "z": 0.14368552819307914, "word": "Braky", "pos_group": "adjective", "row_number": 19012, "definition": "Full of brakes; abounding with brambles shrubs or ferns; rough; thorny.", "details": []}, {"x": -0.8309557015106608, "y": 0.5118958191049935, "z": 0.21788825693403815, "word": "Bramble bush", "pos_group": "other", "row_number": 19017, "definition": "The bramble or a collection of brambles growing together.", "details": []}, {"x": -0.8493652728151553, "y": 0.515839281844047, "z": 0.11175181717652072, "word": "Brambled", "pos_group": "adjective", "row_number": 19018, "definition": "Overgrown with brambles.", "details": []}, {"x": -0.8718669631103636, "y": 0.4496434613086041, "z": 0.19408440519302322, "word": "Brambly", "pos_group": "adjective", "row_number": 19021, "definition": "Pertaining to resembling or full of brambles.", "details": []}, {"x": -0.8201104898979669, "y": 0.5434920739909057, "z": 0.17898365810425454, "word": "Branch", "pos_group": "noun", "row_number": 19029, "definition": "A shoot or secondary stem growing from the main stem or from a principal limb or bough of a tree or other plant.", "details": []}, {"x": -0.8739789541453621, "y": 0.47126242941644586, "z": 0.11862761201123558, "word": "Branch", "pos_group": "other", "row_number": 19038, "definition": "To shoot or spread in branches; to separate into branches; to ramify.", "details": []}, {"x": -0.8463223110473578, "y": 0.48375717305135457, "z": 0.22297431095267697, "word": "Branch", "pos_group": "other", "row_number": 19041, "definition": "To adorn with needlework representing branches flowers or twigs.", "details": []}, {"x": -0.833084868444915, "y": 0.5378023547443613, "z": 0.12937630849401616, "word": "Brancher", "pos_group": "noun", "row_number": 19042, "definition": "That which shoots forth branches; one who shows growth in various directions.", "details": []}, {"x": -0.880392948432381, "y": 0.4453837538614462, "z": 0.16291583148001829, "word": "Branchery", "pos_group": "noun", "row_number": 19044, "definition": "A system of branches.", "details": []}, {"x": -0.8237569483838229, "y": 0.5276756498542536, "z": 0.20732317415152382, "word": "Branchiae", "pos_group": "other", "row_number": 19045, "definition": "of Branchia", "details": []}, {"x": -0.8599293833811997, "y": 0.4988502781958901, "z": 0.10802710558703679, "word": "Branchiate", "pos_group": "adjective", "row_number": 19048, "definition": "Furnished with branchiae; as branchiate segments.", "details": []}, {"x": -0.8633192081492285, "y": 0.4588143767616963, "z": 0.21016496500931273, "word": "Branchiness", "pos_group": "noun", "row_number": 19050, "definition": "Fullness of branches.", "details": []}, {"x": -0.8219747798295866, "y": 0.5469003917381685, "z": 0.15892584069540397, "word": "Branching", "pos_group": "adjective", "row_number": 19051, "definition": "Furnished with branches; shooting our branches; extending in a branch or branches.", "details": []}, {"x": -0.8796431046137247, "y": 0.4569233269364137, "z": 0.1320949726783232, "word": "Branchiostegal", "pos_group": "noun", "row_number": 19058, "definition": "A branchiostegal ray. See Illustration of Branchial arches in Appendix.", "details": []}, {"x": -0.8359173503601555, "y": 0.5014323577245482, "z": 0.22317655341378878, "word": "Branchiostegous", "pos_group": "adjective", "row_number": 19060, "definition": "Branchiostegal.", "details": []}, {"x": -0.8426133126144583, "y": 0.5259816618397389, "z": 0.11552530810690657, "word": "Branchless", "pos_group": "adjective", "row_number": 19063, "definition": "Destitute of branches or shoots; without any valuable product; barren; naked.", "details": []}, {"x": -0.8765947255991722, "y": 0.445013941622504, "z": 0.18315097273373823, "word": "Branchlet", "pos_group": "noun", "row_number": 19064, "definition": "A little branch; a twig.", "details": []}, {"x": -0.8196421450468246, "y": 0.5399944943149588, "z": 0.19129218534109568, "word": "Branchy", "pos_group": "adjective", "row_number": 19066, "definition": "Full of branches; having wide-spreading branches; consisting of branches.", "details": []}, {"x": -0.869661101996008, "y": 0.48092172232515934, "z": 0.11137263878929753, "word": "Brash", "pos_group": "noun", "row_number": 19129, "definition": "Refuse boughs of trees; also the clippings of hedges.", "details": []}, {"x": -0.8529059327849865, "y": 0.4728483745758091, "z": 0.22128236369215615, "word": "Braziletto", "pos_group": "noun", "row_number": 19241, "definition": "See Brazil wood.", "details": []}, {"x": -0.8274320026140628, "y": 0.544064073344869, "z": 0.1391063087910495, "word": "Brazil wood", "pos_group": "other", "row_number": 19246, "definition": "The wood of the oriental Caesalpinia Sapan; -- so called before the discovery of America.", "details": []}, {"x": -0.8818695161046338, "y": 0.4469322289914526, "z": 0.15019234086367575, "word": "Brazil wood", "pos_group": "other", "row_number": 19247, "definition": "A very heavy wood of a reddish color imported from Brazil and other tropical countries for cabinet-work and for dyeing. The best is the heartwood of Caesalpinia echinata a leguminous tree; but other trees also yield it. An inferior sort comes from Jamaica the timber of C. Braziliensis and C. crista. This is often distinguished as Braziletto but the better kind is also frequently so named.", "details": []}, {"x": -0.8269867681181706, "y": 0.5189496588674679, "z": 0.21629640986110193, "word": "Breadfruit", "pos_group": "noun", "row_number": 19269, "definition": "The fruit of a tree (Artocarpus incisa) found in the islands of the Pacific esp. the South Sea islands. It is of a roundish form from four to six or seven inches in diameter and when baked somewhat resembles bread and is eaten as food whence the name.", "details": []}, {"x": -0.8534134821025859, "y": 0.5100297821597284, "z": 0.10749441788129886, "word": "Breadfruit", "pos_group": "noun", "row_number": 19270, "definition": "The tree itself which is one of considerable size with large lobed leaves. Cloth is made from the bark and the timber is used for many purposes. Called also breadfruit tree and bread tree.", "details": []}, {"x": -0.8694369737128899, "y": 0.4509084451109108, "z": 0.20189334528070113, "word": "Bristle-pointed", "pos_group": "adjective", "row_number": 19820, "definition": "Terminating in a very fine sharp point as some leaves.", "details": []}, {"x": -0.819216114402706, "y": 0.5472016911770636, "z": 0.1716253683925953, "word": "Broadcast", "pos_group": "adjective", "row_number": 19890, "definition": "Scattering in all directions (as a method of sowing); -- opposed to planting in hills or rows.", "details": []}, {"x": -0.877313184357166, "y": 0.4642600689725759, "z": 0.12159015137200926, "word": "Broadleaf", "pos_group": "noun", "row_number": 19901, "definition": "A tree (Terminalia latifolia) of Jamaica the wood of which is used for boards scantling shingles etc; -- sometimes called the almond tree from the shape of its fruit.", "details": []}, {"x": -0.8418636574503379, "y": 0.4901407972307283, "z": 0.22589285326093522, "word": "Broad-leafed", "pos_group": "adjective", "row_number": 19903, "definition": "Having broad or relatively broad leaves.", "details": []}, {"x": -0.8359062741195767, "y": 0.5351404206542485, "z": 0.1220058648980484, "word": "Broom", "pos_group": "noun", "row_number": 20086, "definition": "A plant having twigs suitable for making brooms to sweep with when bound together; esp. the Cytisus scoparius of Western Europe which is a low shrub with long straight green angular branches minute leaves and large yellow flowers.", "details": []}, {"x": -0.8802683582170742, "y": 0.4426671468832159, "z": 0.17080226752619643, "word": "Browse", "pos_group": "noun", "row_number": 20160, "definition": "The tender branches or twigs of trees and shrubs fit for the food of cattle and other animals; green food.", "details": []}, {"x": -0.820684740373248, "y": 0.534114405697649, "z": 0.20297378782675776, "word": "Browse", "pos_group": "noun", "row_number": 20163, "definition": "To eat or nibble off as the tender branches of trees shrubs etc.; -- said of cattle sheep deer and some other animals.", "details": []}, {"x": -0.8641706845895932, "y": 0.49180755276843807, "z": 0.10646294630468255, "word": "Browse", "pos_group": "other", "row_number": 20165, "definition": "To feed on the tender branches or shoots of shrubs or trees as do cattle sheep and deer.", "details": []}, {"x": -0.8597045157699539, "y": 0.46251947150395156, "z": 0.21675766202018046, "word": "Browsing", "pos_group": "noun", "row_number": 20169, "definition": "Browse; also a place abounding with shrubs where animals may browse.", "details": []}, {"x": -0.8226382933102727, "y": 0.5482393547064908, "z": 0.150664688399679, "word": "Brush", "pos_group": "noun", "row_number": 20210, "definition": "Branches of trees lopped off; brushwood.", "details": []}, {"x": -0.8818623406399063, "y": 0.4509786472167807, "z": 0.13761203405090724, "word": "Brush", "pos_group": "noun", "row_number": 20211, "definition": "A thicket of shrubs or small trees; the shrubs and small trees in a wood; underbrush.", "details": []}, {"x": -0.8315447979642837, "y": 0.5086298128394173, "z": 0.2232240185765817, "word": "Brushwood", "pos_group": "noun", "row_number": 20230, "definition": "Brush; a thicket or coppice of small trees and shrubs.", "details": []}, {"x": -0.8464256788849773, "y": 0.5210559318173106, "z": 0.10983754386410492, "word": "Brushwood", "pos_group": "noun", "row_number": 20231, "definition": "Small branches of trees cut off.", "details": []}, {"x": -0.8749188757528619, "y": 0.44482789791658556, "z": 0.1914291045960882, "word": "Buchu", "pos_group": "noun", "row_number": 20328, "definition": "A South African shrub (Barosma) with small leaves that are dotted with oil glands; also the leaves themselves which are used in medicine for diseases of the urinary organs etc. Several species furnish the leaves.", "details": []}, {"x": -0.8178695033461757, "y": 0.5449625170708751, "z": 0.18467628565697428, "word": "Buck", "pos_group": "noun", "row_number": 20344, "definition": "The beech tree.", "details": []}, {"x": -0.8735369676478707, "y": 0.4735154952462842, "z": 0.11276631551234144, "word": "Buckeye", "pos_group": "noun", "row_number": 20357, "definition": "A name given to several American trees and shrubs of the same genus (Aesculus) as the horse chestnut.", "details": []}, {"x": -0.8485282820919628, "y": 0.47856578367003266, "z": 0.22577543088287944, "word": "Buckthorn", "pos_group": "noun", "row_number": 20401, "definition": "A genus (Rhamnus) of shrubs or trees. The shorter branches of some species terminate in long spines or thorns. See Rhamnus.", "details": []}, {"x": -0.8295899333174526, "y": 0.542792817185347, "z": 0.13098282387526697, "word": "Bud", "pos_group": "other", "row_number": 20417, "definition": "To graft as a plant with another or into another by inserting a bud from the one into an opening in the bark of the other in order to raise upon the budded stock fruit different from that which it would naturally bear.", "details": []}, {"x": -0.8826447703200296, "y": 0.4428282206585672, "z": 0.15761147298045736, "word": "Budding", "pos_group": "noun", "row_number": 20425, "definition": "The act or process of ingrafting one kind of plant upon another stock by inserting a bud under the bark.", "details": []}, {"x": -0.8232502406787034, "y": 0.5260437387998229, "z": 0.21339406292575325, "word": "Bully tree", "pos_group": "other", "row_number": 20708, "definition": "The name of several West Indian trees of the order Sapotaceae as Dipholis nigra and species of Sapota and Mimusops. Most of them yield a substance closely resembling gutta-percha.", "details": []}, {"x": -0.8577337633535622, "y": 0.5034110481440466, "z": 0.10425980917807079, "word": "Burl", "pos_group": "noun", "row_number": 20959, "definition": "An overgrown knot or an excrescence on a tree; also veneer made from such excrescences.", "details": []}, {"x": -0.8663725579384713, "y": 0.45332877795305254, "z": 0.2095032456329539, "word": "Bush", "pos_group": "noun", "row_number": 21104, "definition": "A thicket or place abounding in trees or shrubs; a wild forest.", "details": []}, {"x": -0.8189868198601433, "y": 0.5500146921552561, "z": 0.16353723523628547, "word": "Bush", "pos_group": "noun", "row_number": 21105, "definition": "A shrub; esp. a shrub with branches rising from or near the root; a thick shrub or a cluster of shrubs.", "details": []}, {"x": -0.8803001781909078, "y": 0.45742578653845606, "z": 0.1258302272378583, "word": "Bush", "pos_group": "noun", "row_number": 21106, "definition": "A shrub cut off or a shrublike branch of a tree; as bushes to support pea vines.", "details": []}, {"x": -0.837252343244546, "y": 0.4971738505870627, "z": 0.2276547298519178, "word": "Bush", "pos_group": "noun", "row_number": 21107, "definition": "A shrub or branch properly a branch of ivy (as sacred to Bacchus) hung out at vintners' doors or as a tavern sign; hence a tavern sign and symbolically the tavern itself.", "details": []}, {"x": -0.8393010300060069, "y": 0.5313508879917233, "z": 0.11506526348669777, "word": "Bush", "pos_group": "other", "row_number": 21113, "definition": "To use a bush harrow on (land) for covering seeds sown; to harrow with a bush; as to bush a piece of land; to bush seeds into the ground.", "details": []}, {"x": -0.8794497484533833, "y": 0.44096632901401733, "z": 0.1792117089399643, "word": "Bushless", "pos_group": "adjective", "row_number": 21133, "definition": "Free from bushes; bare.", "details": []}, {"x": -0.8180640105221332, "y": 0.5401814989536806, "z": 0.19742143469389958, "word": "Bushman", "pos_group": "noun", "row_number": 21135, "definition": "A woodsman; a settler in the bush.", "details": []}, {"x": -0.8684400090283477, "y": 0.4842970338522438, "z": 0.10615240798381301, "word": "Bushment", "pos_group": "noun", "row_number": 21137, "definition": "A thicket; a cluster of bushes.", "details": []}, {"x": -0.855596597651778, "y": 0.4672878665859855, "z": 0.2227027431986861, "word": "Bushy", "pos_group": "adjective", "row_number": 21145, "definition": "Full of bushes; overgrowing with shrubs.", "details": []}, {"x": -0.8240025990684646, "y": 0.5484759097241333, "z": 0.14210521869621748, "word": "Busket", "pos_group": "noun", "row_number": 21161, "definition": "A small bush; also a sprig or bouquet.", "details": []}, {"x": -0.8835402624790307, "y": 0.4455981426052862, "z": 0.14421823700629774, "word": "Busket", "pos_group": "noun", "row_number": 21162, "definition": "A part of a garden devoted to shrubs.", "details": []}, {"x": -0.8272705024634258, "y": 0.5160976259752685, "z": 0.22196115925225002, "word": "Butternut", "pos_group": "noun", "row_number": 21271, "definition": "An American tree (Juglans cinerea) of the Walnut family and its edible fruit; -- so called from the oil contained in the latter. Sometimes called oil nut and white walnut.", "details": []}, {"x": -0.850635037870145, "y": 0.5151660409941009, "z": 0.10499515490784002, "word": "Buttonwood", "pos_group": "noun", "row_number": 21306, "definition": "The Platanus occidentalis or American plane tree a large tree producing rough balls from which it is named; -- called also buttonball tree and in some parts of the United States sycamore. The California buttonwood is P. racemosa.", "details": []}, {"x": -0.8725583399782302, "y": 0.44579566772245477, "z": 0.19977028301107813, "word": "Buxeous", "pos_group": "adjective", "row_number": 21326, "definition": "Belonging to the box tree.", "details": []}, {"x": -0.8167110796015828, "y": 0.5491914141115477, "z": 0.17712087150354502, "word": "Cabbage", "pos_group": "noun", "row_number": 21468, "definition": "The terminal bud of certain palm trees used like cabbage for food. See Cabbage tree below.", "details": []}, {"x": -0.877191138677233, "y": 0.4660460793364439, "z": 0.11548488282571205, "word": "Cacao", "pos_group": "noun", "row_number": 21542, "definition": "A small evergreen tree (Theobroma Cacao) of South America and the West Indies. Its fruit contains an edible pulp inclosing seeds about the size of an almond from which cocoa chocolate and broma are prepared.", "details": []}, {"x": -0.8438633540066885, "y": 0.4851166911836313, "z": 0.22925190446237872, "word": "Cade", "pos_group": "noun", "row_number": 21629, "definition": "A species of juniper (Juniperus Oxycedrus) of Mediterranean countries.", "details": []}, {"x": -0.8323944223604185, "y": 0.5403535811064284, "z": 0.12303468213769632, "word": "Cajuput", "pos_group": "noun", "row_number": 21766, "definition": "A highly stimulating volatile inflammable oil distilled from the leaves of an East Indian tree (Melaleuca cajuputi etc.) It is greenish in color and has a camphoraceous odor and pungent taste.", "details": []}, {"x": -0.8827526645832804, "y": 0.4396152702299512, "z": 0.16578946695060356, "word": "Calabash", "pos_group": "noun", "row_number": 21782, "definition": "The fruit of the calabash tree.", "details": []}, {"x": -0.819852434789328, "y": 0.5329909900007109, "z": 0.20919509972289635, "word": "Calamander wood", "pos_group": "other", "row_number": 21789, "definition": "A valuable furniture wood from India and Ceylon of a hazel-brown color with black stripes very hard in texture. It is a species of ebony and is obtained from the Diospyros quaesita. Called also Coromandel wood.", "details": []}, {"x": -0.8622220299798425, "y": 0.4961171499935478, "z": 0.10218094000213142, "word": "Calambac", "pos_group": "noun", "row_number": 21792, "definition": "A fragrant wood; agalloch.", "details": []}, {"x": -0.8627210045731327, "y": 0.456893669553615, "z": 0.21670404470188548, "word": "Calambour", "pos_group": "noun", "row_number": 21793, "definition": "A species of agalloch or aloes wood of a dusky or mottled color of a light friable texture and less fragrant than calambac; -- used by cabinetmakers.", "details": []}, {"x": -0.8194569000956228, "y": 0.5518129451723696, "z": 0.15489629571383565, "word": "Calamiferous", "pos_group": "adjective", "row_number": 21794, "definition": "Producing reeds; reedy.", "details": []}, {"x": -0.8828420470029529, "y": 0.45094468957116385, "z": 0.1312966373948793, "word": "Calculary", "pos_group": "noun", "row_number": 21890, "definition": "A congeries of little stony knots found in the pulp of the pear and other fruits.", "details": []}, {"x": -0.8325985261739445, "y": 0.5047013013556919, "z": 0.22815847699098643, "word": "Calisaya bark", "pos_group": "other", "row_number": 22006, "definition": "A valuable kind of Peruvian bark obtained from the Cinchona Calisaya and other closely related species.", "details": []}, {"x": -0.8432044616990022, "y": 0.5264774381186627, "z": 0.108755427096332, "word": "Cambium", "pos_group": "noun", "row_number": 22224, "definition": "A series of formative cells lying outside of the wood proper and inside of the inner bark. The growth of new wood takes place in the cambium which is very soft.", "details": []}, {"x": -0.8779224072265266, "y": 0.4403718612453545, "z": 0.18794911735063544, "word": "Campeachy Wood", "pos_group": "other", "row_number": 22322, "definition": "Logwood.", "details": []}, {"x": -0.8159811389284779, "y": 0.545699612447332, "z": 0.19075301803068787, "word": "Camphor", "pos_group": "noun", "row_number": 22333, "definition": "A gum resembling ordinary camphor obtained from a tree (Dryobalanops camphora) growing in Sumatra and Borneo; -- called also Malay camphor camphor of Borneo or borneol. See Borneol.", "details": []}, {"x": -0.8726245977929141, "y": 0.47648982969869613, "z": 0.10716227657371939, "word": "Canaliculated", "pos_group": "adjective", "row_number": 22375, "definition": "Having a channel or groove as in the leafstalks of most palms.", "details": []}, {"x": -0.8510754752478347, "y": 0.47304436757550333, "z": 0.22781475311481547, "word": "Canaster", "pos_group": "noun", "row_number": 22390, "definition": "A kind of tobacco for smoking made of the dried leaves coarsely broken; -- so called from the rush baskets in which it is packed in South America.", "details": []}, {"x": -0.8260623639667599, "y": 0.5475499189605066, "z": 0.13345432583468722, "word": "Candelabra", "pos_group": "other", "row_number": 22433, "definition": "of Candelabrum", "details": []}, {"x": -0.8846047204567286, "y": 0.4409457524008872, "z": 0.15179371523646334, "word": "Candelabrums", "pos_group": "other", "row_number": 22434, "definition": "of Candelabrum", "details": []}, {"x": -0.8232062702208918, "y": 0.5236540041597963, "z": 0.21935797363310033, "word": "Candelabrum", "pos_group": "noun", "row_number": 22437, "definition": "A large candlestick having several branches.", "details": []}, {"x": -0.855148541962326, "y": 0.5084163292072686, "z": 0.10116228237398568, "word": "Candleberry tree", "pos_group": "other", "row_number": 22462, "definition": "A shrub (the Myrica cerifera or wax-bearing myrtle) common in North America the little nuts of which are covered with a greenish white wax which was formerly used for hardening candles; -- also called bayberry tree bayberry or candleberry.", "details": []}, {"x": -0.8695383305356722, "y": 0.4479450662333591, "z": 0.20796227871041326, "word": "Cane", "pos_group": "noun", "row_number": 22488, "definition": "Any plant with long hard elastic stems as reeds and bamboos of many kinds; also the sugar cane.", "details": []}, {"x": -0.8162225159342371, "y": 0.5525357948140843, "z": 0.16877499794445858, "word": "Canella", "pos_group": "noun", "row_number": 22499, "definition": "A genus of trees of the order Canellaceae growing in the West Indies.", "details": []}, {"x": -0.8805162869104268, "y": 0.458700221677608, "z": 0.11952060541341152, "word": "Canister", "pos_group": "noun", "row_number": 22511, "definition": "A small basket of rushes reeds or willow twigs etc.", "details": []}, {"x": -0.8390138968216173, "y": 0.4923708959121293, "z": 0.2315741388818956, "word": "Canker", "pos_group": "noun", "row_number": 22516, "definition": "A disease incident to trees causing the bark to rot and fall off.", "details": []}, {"x": -0.8358011683308453, "y": 0.5367517581000756, "z": 0.11547275519910136, "word": "Caoutchouc", "pos_group": "noun", "row_number": 22773, "definition": "A tenacious elastic gummy substance obtained from the milky sap of several plants of tropical South America (esp. the euphorbiaceous tree Siphonia elastica or Hevea caoutchouc) Asia and Africa. Being impermeable to liquids and gases and not readly affected by exposure to air acids and alkalies it is used especially when vulcanized for many purposes in the arts and in manufactures. Also called India rubber (because it was first brought from India and was formerly used chiefly for erasing pencil marks) and gum elastic. See Vulcanization.", "details": []}, {"x": -0.8821558242318276, "y": 0.4374156277710089, "z": 0.17455277240868736, "word": "Caper", "pos_group": "noun", "row_number": 22852, "definition": "A plant of the genus Capparis; -- called also caper bush caper tree.", "details": []}, {"x": -0.8168928127201645, "y": 0.5396056012789344, "z": 0.20374476090083427, "word": "Caprification", "pos_group": "noun", "row_number": 22987, "definition": "The practice of hanging upon the cultivated fig tree branches of the wild fig infested with minute hymenopterous insects.", "details": []}, {"x": -0.8667688712905385, "y": 0.4883000512739892, "z": 0.10136460766729871, "word": "Capsheaf", "pos_group": "noun", "row_number": 23002, "definition": "The top sheaf of a stack of grain: (fig.) the crowning or finishing part of a thing.", "details": []}, {"x": -0.8585443135386506, "y": 0.4615646757838391, "z": 0.22329288335951678, "word": "Capulin", "pos_group": "noun", "row_number": 23081, "definition": "The Mexican cherry (Prunus Capollin).", "details": []}, {"x": -0.8206442748372973, "y": 0.5525012086898758, "z": 0.14589512868150448, "word": "Carambola", "pos_group": "noun", "row_number": 23114, "definition": "An East Indian tree (Averrhoa Carambola) and its acid juicy fruit; called also Coromandel gooseberry.", "details": []}, {"x": -0.8848503372403388, "y": 0.44499578805182344, "z": 0.13790804654477318, "word": "Carbunculation", "pos_group": "noun", "row_number": 23191, "definition": "The blasting of the young buds of trees or plants by excessive heat or cold.", "details": []}, {"x": -0.8280148287423489, "y": 0.512554209769744, "z": 0.227331531974981, "word": "Carnauba", "pos_group": "noun", "row_number": 23411, "definition": "The Brazilian wax palm. See Wax palm.", "details": []}, {"x": -0.8475388186461074, "y": 0.520590369891773, "z": 0.10326479392274801, "word": "Carob", "pos_group": "noun", "row_number": 23430, "definition": "An evergreen leguminous tree (Ceratania Siliqua) found in the countries bordering the Mediterranean; the St. John's bread; -- called also carob tree.", "details": []}, {"x": -0.875688446210917, "y": 0.44094895440593596, "z": 0.19680895503259438, "word": "Carolitic", "pos_group": "adjective", "row_number": 23453, "definition": "Adorned with sculptured leaves and branches.", "details": []}, {"x": -0.8145107707950517, "y": 0.550502193715335, "z": 0.18308342080443754, "word": "Carve", "pos_group": "other", "row_number": 23667, "definition": "To make or shape by cutting sculpturing or engraving; to form; as to carve a name on a tree.", "details": []}, {"x": -0.876612170896206, "y": 0.46856653183324537, "z": 0.10952856742606014, "word": "Cascara sagrada", "pos_group": "other", "row_number": 23706, "definition": "Holy bark; the bark of the California buckthorn (Rhamnus Purshianus) used as a mild cathartic or laxative.", "details": []}, {"x": -0.8462322043934114, "y": 0.47968902014407405, "z": 0.2319256350658241, "word": "Cassia", "pos_group": "noun", "row_number": 23800, "definition": "The bark of several species of Cinnamomum grown in China etc.; Chinese cinnamon. It is imported as cassia but commonly sold as cinnamon from which it differs more or less in strength and flavor and the amount of outer bark attached.", "details": []}, {"x": -0.8287954977614713, "y": 0.5454282824041745, "z": 0.12492402348606511, "word": "Castanea", "pos_group": "noun", "row_number": 23869, "definition": "A genus of nut-bearing trees or shrubs including the chestnut and chinquapin.", "details": []}, {"x": -0.884997245267698, "y": 0.4371703016598617, "z": 0.16019364286766033, "word": "Casuarina", "pos_group": "noun", "row_number": 23961, "definition": "A genus of leafless trees or shrubs with drooping branchlets of a rushlike appearance mostly natives of Australia. Some of them are large producing hard and heavy timber of excellent quality called beefwood from its color.", "details": []}, {"x": -0.8194604914292692, "y": 0.5311124001214645, "z": 0.2154161586875916, "word": "Catadromous", "pos_group": "adjective", "row_number": 23999, "definition": "Having the lowest inferior segment of a pinna nearer the rachis than the lowest superior one; -- said of a mode of branching in ferns and opposed to anadromous.", "details": []}, {"x": -0.8598646961860171, "y": 0.5009332714662156, "z": 0.09848127634775644, "word": "Catalpa", "pos_group": "noun", "row_number": 24021, "definition": "A genus of American and East Indian trees of which the best know species are the Catalpa bignonioides a large ornamental North American tree with spotted white flowers and long cylindrical pods and the C. speciosa of the Mississipi valley; -- called also Indian bean.", "details": []}, {"x": -0.8659002343008603, "y": 0.4512760108362393, "z": 0.2157932952652741, "word": "Caudex", "pos_group": "noun", "row_number": 24309, "definition": "The stem of a tree. esp. a stem without a branch as of a palm or a tree fern; also the perennial rootstock of an herbaceous plant.", "details": []}, {"x": -0.816444244602673, "y": 0.5548692786887484, "z": 0.1598088828025487, "word": "Caulescent", "pos_group": "adjective", "row_number": 24325, "definition": "Having a leafy stem.", "details": []}, {"x": -0.8834113401976552, "y": 0.45166453566408254, "z": 0.12483409483603113, "word": "Caulis", "pos_group": "noun", "row_number": 24334, "definition": "An herbaceous or woody stem which bears leaves and may bear flowers.", "details": []}, {"x": -0.8340886465170642, "y": 0.5001793750184659, "z": 0.2326300121598009, "word": "Caulocarpous", "pos_group": "adjective", "row_number": 24336, "definition": "Having stems which bear flowers and fruit year after year as most trees and shrubs.", "details": []}, {"x": -0.8397507776307592, "y": 0.5320206414869, "z": 0.1085019285561444, "word": "Cedar", "pos_group": "noun", "row_number": 24514, "definition": "The name of several evergreen trees. The wood is remarkable for its durability and fragrant odor.", "details": []}, {"x": -0.8808331490380034, "y": 0.4363292133459657, "z": 0.1837111350372793, "word": "Cedry", "pos_group": "adjective", "row_number": 24526, "definition": "Of the nature of cedar.", "details": []}, {"x": -0.814461926599608, "y": 0.5457067912990199, "z": 0.19711891854863303, "word": "Centifolious", "pos_group": "adjective", "row_number": 24738, "definition": "Having a hundred leaves.", "details": []}, {"x": -0.8712617398490714, "y": 0.4801266349678476, "z": 0.10188913126344909, "word": "Cerci", "pos_group": "other", "row_number": 24891, "definition": "of Cercus", "details": []}, {"x": -0.8539180263111875, "y": 0.46727631029959527, "z": 0.22907827084558308, "word": "Cerris", "pos_group": "noun", "row_number": 24988, "definition": "A species of oak (Quercus cerris) native in the Orient and southern Europe; -- called also bitter oak and Turkey oak.", "details": []}, {"x": -0.8225500243708739, "y": 0.5520092100899281, "z": 0.13673803195661538, "word": "Cespitose", "pos_group": "adjective", "row_number": 25048, "definition": "Having the form a piece of turf i. e. many stems from one rootstock or from many entangled rootstocks or roots.", "details": []}, {"x": -0.8862478909671115, "y": 0.4397483094693031, "z": 0.145554457421396, "word": "Chaparral", "pos_group": "noun", "row_number": 25499, "definition": "A thicket of low evergreen oaks.", "details": []}, {"x": -0.8236140556988905, "y": 0.5205530886251833, "z": 0.2251318928495177, "word": "Chaparral", "pos_group": "noun", "row_number": 25500, "definition": "An almost impenetrable thicket or succession of thickets of thorny shrubs and brambles.", "details": []}, {"x": -0.8522147811057016, "y": 0.5137853292958098, "z": 0.09876539001774591, "word": "Chard", "pos_group": "noun", "row_number": 25621, "definition": "The tender leaves or leafstalks of the artichoke white beet etc. blanched for table use.", "details": []}, {"x": -0.8727668627667251, "y": 0.4427359765395778, "z": 0.20557932370225118, "word": "Chat", "pos_group": "noun", "row_number": 25855, "definition": "A twig cone or little branch. See Chit.", "details": []}, {"x": -0.8137142137314176, "y": 0.5544369340569201, "z": 0.17455332859909325, "word": "Cherry", "pos_group": "noun", "row_number": 26125, "definition": "A tree or shrub of the genus Prunus (Which also includes the plum) bearing a fleshy drupe with a bony stone;", "details": []}, {"x": -0.8802932328891414, "y": 0.4607135715029693, "z": 0.11325559219112447, "word": "Cherry", "pos_group": "noun", "row_number": 26127, "definition": "The wild cherry; as Prunus serotina (wild black cherry) valued for its timber; P. Virginiana (choke cherry) an American shrub which bears astringent fruit; P. avium and P. Padus European trees (bird cherry).", "details": []}, {"x": -0.8411670758145744, "y": 0.4870990050415798, "z": 0.23488829228605904, "word": "Cherry", "pos_group": "noun", "row_number": 26129, "definition": "The timber of the cherry tree esp. of the black cherry used in cabinetmaking etc.", "details": []}, {"x": -0.8321635001393083, "y": 0.5421057910695941, "z": 0.11672711906281787, "word": "Chesteyn", "pos_group": "noun", "row_number": 26177, "definition": "The chestnut tree.", "details": []}, {"x": -0.8846743392512462, "y": 0.4344023410773815, "z": 0.16925105475848914, "word": "Chestnut", "pos_group": "noun", "row_number": 26179, "definition": "The edible nut of a forest tree (Castanea vesca) of Europe and America. Commonly two or more of the nuts grow in a prickly bur.", "details": []}, {"x": -0.8161358846753052, "y": 0.5382853253231346, "z": 0.21016928007447755, "word": "Chestnut", "pos_group": "noun", "row_number": 26180, "definition": "The tree itself or its light coarse-grained timber used for ornamental work furniture etc.", "details": []}, {"x": -0.8646753956005012, "y": 0.49286301296002516, "z": 0.09706961779610816, "word": "Chestnut", "pos_group": "noun", "row_number": 26182, "definition": "The horse chestnut (often so used in England).", "details": []}, {"x": -0.8617008639103867, "y": 0.4557603403178462, "z": 0.2230563456381693, "word": "Chestnut", "pos_group": "adjective", "row_number": 26185, "definition": "Of the color of a chestnut; of a reddish brown color; as chestnut curls.", "details": []}, {"x": -0.8174005520321849, "y": 0.5560872331574842, "z": 0.1504105270808295, "word": "Chiminage", "pos_group": "noun", "row_number": 26424, "definition": "A toll for passage through a forest.", "details": []}, {"x": -0.8857836155082915, "y": 0.4451216382177303, "z": 0.13135491497246332, "word": "Chinquapin", "pos_group": "noun", "row_number": 26482, "definition": "A branching nut-bearing tree or shrub (Castanea pumila) of North America from six to twenty feet high allied to the chestnut. Also its small sweet edible nat.", "details": []}, {"x": -0.8292001141049461, "y": 0.5083772457009906, "z": 0.23233541878460828, "word": "Chip", "pos_group": "noun", "row_number": 26497, "definition": "Wood or Cuban palm leaf split into slips or straw plaited in a special manner for making hats or bonnets.", "details": []}, {"x": -0.8441698948291407, "y": 0.5262209217663046, "z": 0.10231681269262667, "word": "Chokecherry", "pos_group": "noun", "row_number": 26714, "definition": "The astringent fruit of a species of wild cherry (Prunus Virginiana); also the bush or tree which bears such fruit.", "details": []}, {"x": -0.8787803611558807, "y": 0.43643139204720627, "z": 0.1930614329235068, "word": "Chyliferous", "pos_group": "adjective", "row_number": 27229, "definition": "Transmitting or conveying chyle; as chyliferous vessels.", "details": []}, {"x": -0.8126394763365354, "y": 0.5511225990200191, "z": 0.18942270811309989, "word": "Cinchona", "pos_group": "noun", "row_number": 27335, "definition": "A genus of trees growing naturally on the Andes in Peru and adjacent countries but now cultivated in the East Indies producing a medicinal bark of great value.", "details": []}, {"x": -0.8755872706911925, "y": 0.4717753349136552, "z": 0.10380252776621972, "word": "Cinchona", "pos_group": "noun", "row_number": 27336, "definition": "The bark of any species of Cinchona containing three per cent. or more of bitter febrifuge alkaloids; Peruvian bark; Jesuits' bark.", "details": []}, {"x": -0.8489297467778619, "y": 0.4739372212573309, "z": 0.23388414940426147, "word": "Cinnamon", "pos_group": "noun", "row_number": 27378, "definition": "The inner bark of the shoots of Cinnamomum Zeylanicum a tree growing in Ceylon. It is aromatic of a moderately pungent taste and is one of the best cordial carminative and restorative spices.", "details": []}, {"x": -0.8251582500782779, "y": 0.5502932832744021, "z": 0.12763684699502995, "word": "Cirl bunting", "pos_group": "other", "row_number": 27648, "definition": "A European bunting (Emberiza cirlus).", "details": []}, {"x": -0.8869705339520495, "y": 0.4353581012579093, "z": 0.15409930424866985, "word": "Citron", "pos_group": "noun", "row_number": 27747, "definition": "A citron tree.", "details": []}, {"x": -0.8195068407883673, "y": 0.5285115753530908, "z": 0.22154921037743303, "word": "Citrus", "pos_group": "noun", "row_number": 27749, "definition": "A genus of trees including the orange lemon citron etc. originally natives of southern Asia.", "details": []}, {"x": -0.8571332439976379, "y": 0.506181491186147, "z": 0.09540911913781865, "word": "Cladophyll", "pos_group": "noun", "row_number": 27809, "definition": "A special branch resembling a leaf as in the apparent foliage of the broom (Ruscus) and of the common cultivated smilax (Myrsiphillum).", "details": []}, {"x": -0.8691932634111135, "y": 0.4457434588821586, "z": 0.21404634943046344, "word": "Clean", "pos_group": "other", "row_number": 28119, "definition": "Free from that which is useless or injurious; without defects; as clean land; clean timber.", "details": []}, {"x": -0.8136380588773582, "y": 0.5573690581410055, "z": 0.16532647148382779, "word": "Clearing", "pos_group": "noun", "row_number": 28193, "definition": "A tract of land cleared of wood for cultivation.", "details": []}, {"x": -0.8835633860938458, "y": 0.4531193577922003, "z": 0.11831563864663767, "word": "Cleft", "pos_group": "adjective", "row_number": 28241, "definition": "Incised nearly to the midrib; as a cleft leaf.", "details": []}, {"x": -0.8359875806505451, "y": 0.49513104517974077, "z": 0.23657982394377194, "word": "Close", "pos_group": "other", "row_number": 28584, "definition": "Short; as to cut grass or hair close.", "details": []}, {"x": -0.8361121474983574, "y": 0.5376054414676464, "z": 0.10907275603954389, "word": "Cloudberry", "pos_group": "noun", "row_number": 28677, "definition": "A species of raspberry (Rubus Chamaemerous) growing in the northern regions and bearing edible amber-colored fruit.", "details": []}, {"x": -0.88360850038686 "\" (pyrenes) obtained from the drupes of a small evergreen tree of the genus Coffea growing in Abyssinia Arabia Persia and other warm regions of Asia and Africa and also in tropical America.", "details": []}, {"x": -0.8489726408730203, "y": 0.5194396203955993, "z": 0.09709755822040847, "word": "Coffee", "pos_group": "noun", "row_number": 29365, "definition": "The coffee tree.", "details": []}, {"x": -0.8760102276797516, "y": 0.43777119034149325, "z": 0.2023918622560253, "word": "Coma", "pos_group": "noun", "row_number": 30052, "definition": "A tuft or bunch -- as the assemblage of branches forming the head of a tree; or a cluster of bracts when empty and terminating the inflorescence of a plant; or a tuft of long hairs on certain seeds.", "details": []}, {"x": -0.8114925405604789, "y": 0.5556935850225485, "z": 0.18078853995618, "word": "Compt", "pos_group": "adjective", "row_number": 31077, "definition": "Neat; spruce.", "details": []}, {"x": -0.8796336702731191, "y": 0.4634324575581651, "z": 0.10712125560989794, "word": "Cone", "pos_group": "noun", "row_number": 31675, "definition": "The fruit or strobile of the Coniferae as of the pine fir cedar and cypress. It is composed of woody scales each one of which has one or two seeds at its base.", "details": []}, {"x": -0.8436773859844695, "y": 0.4814319148550392, "z": 0.23755374073548594, "word": "Conferruminated", "pos_group": "adjective", "row_number": 31749, "definition": "Closely united by the coalescence or sticking together of contiguous faces as in the case of the cotyledons of the live-oak acorn.", "details": []}, {"x": -0.8284362732922131, "y": 0.5473375078689243, "z": 0.11880653842926593, "word": "Conifer", "pos_group": "noun", "row_number": 32120, "definition": "A tree or shrub bearing cones; one of the order Coniferae which includes the pine cypress and (according to some) the yew.", "details": []}, {"x": -0.8869685399487365, "y": 0.431964222831935, "z": 0.16338212672874922, "word": "Coniferin", "pos_group": "noun", "row_number": 32121, "definition": "A glucoside extracted from the cambium layer of coniferous trees as a white crystalline substance.", "details": []}, {"x": -0.8157992858402222, "y": 0.5362403224387887, "z": 0.21660526727973847, "word": "Coniferous", "pos_group": "adjective", "row_number": 32123, "definition": "Pertaining to the order Coniferae of which the pine tree is the type.", "details": []}, {"x": -0.8621873359572033, "y": 0.49791922869240646, "z": 0.09332437738008133, "word": "Copaiva", "pos_group": "noun", "row_number": 33690, "definition": "A more or less viscid yellowish liquid the bitter oleoresin of several species of Copaifera a genus of trees growing in South America and the West Indies. It is stimulant and diuretic and is much used in affections of the mucous membranes; -- called also balsam of copaiba.", "details": []}, {"x": -0.865019247368554, "y": 0.44995364055181897, "z": 0.22199870052796417, "word": "Copal", "pos_group": "other", "row_number": 33691, "definition": "A resinous substance flowing spontaneously from trees of Zanzibar Madagascar and South America (Trachylobium Hornemannianum T. verrucosum and Hymenaea Courbaril) and dug from earth where forests have stood in Africa; -- used chiefly in making varnishes.", "details": []}, {"x": -0.8143130690619278, "y": 0.5591843300478333, "z": 0.15558634446473757, "word": "Coppice", "pos_group": "noun", "row_number": 33768, "definition": "A grove of small growth; a thicket of brushwood; a wood cut at certain times for fuel or other purposes. See Copse.", "details": []}, {"x": -0.8863255892829436, "y": 0.4459702958455973, "z": 0.12464928802698096, "word": "Copse", "pos_group": "noun", "row_number": 33783, "definition": "A wood of small growth; a thicket of brushwood. See Coppice.", "details": []}, {"x": -0.8308061894406521, "y": 0.5036242735734757, "z": 0.23690434072572916, "word": "Copse", "pos_group": "other", "row_number": 33784, "definition": "To trim or cut; -- said of small trees bru , "details": []}, {"x": -0.8008134614885954, "y": 0.5768217568814266, "z": 0.16116594146058977, "word": "Gnarl", "pos_group": "noun", "row_number": 66692, "definition": "a knot in wood; a large or hard knot or a protuberance with twisted grain on a tree.", "details": []}, {"x": -0.8936901301366298, "y": 0.4361439968069185, "z": 0.10533928681009898, "word": "Gonakie", "pos_group": "noun", "row_number": 66983, "definition": "An African timber tree (Acacia Adansonii).", "details": []}, {"x": -0.8280695794063138, "y": 0.49735557773385264, "z": 0.25872417930853786, "word": "Gooseberry", "pos_group": "adjective", "row_number": 67099, "definition": "Any thorny shrub of the genus Ribes; also the edible berries of such shrub. There are several species of which Ribes Grossularia is the one commonly cultivated.", "details": []}, {"x": -0.8318797166638847, "y": 0.5478927021430302, "z": 0.08825941276500558, "word": "Gopher wood", "pos_group": "other", "row_number": 67117, "definition": "A species of wood used in the construction of Noah's ark.", "details": []}, {"x": -0.891954468870391, "y": 0.4119942679600577, "z": 0.18622016171777686, "word": "Gosling", "pos_group": "noun", "row_number": 67208, "definition": "A catkin on nut trees and pines.", "details": []}, {"x": -0.7994584853321497, "y": 0.5619334826685475, "z": 0.2123602865095595, "word": "Gourd tree", "pos_group": "other", "row_number": 67300, "definition": "A tree (the Crescentia Cujete or calabash tree) of the West Indies and Central America.", "details": []}, {"x": -0.8757829069758392, "y": 0.4767368273575327, "z": 0.07567230200028621, "word": "Graft", "pos_group": "noun", "row_number": 67490, "definition": "A small shoot or scion of a tree inserted in another tree the stock of which is to support and nourish it. The two unite and become one tree but the graft determines the kind of fruit.", "details": []}, {"x": -0.8557538860392108, "y": 0.45229980825949684, "z": 0.2512173759460354, "word": "Graft", "pos_group": "noun ually in the plural.", "details": []}, {"x": -0.821780516989237, "y": 0.5607866942104562, "z": 0.10097061698043924, "word": "Greenwood", "pos_group": "noun", "row_number": 68117, "definition": "A forest as it appears is spring and summer.", "details": []}, {"x": -0.8964585389374934, "y": 0.4108604288887217, "z": 0.16599938535859177, "word": "Greenwood", "pos_group": "adjective", "row_number": 68118, "definition": "Pertaining to a greenwood; as a greenwood shade.", "details": []}, {"x": -0.8026645396476029, "y": 0.5505417014802033, "z": 0.22941985904359835, "word": "Grenadillo", "pos_group": "noun", "row_number": 68159, "definition": "A handsome tropical American wood much used for making flutes and other wind instruments; -- called also Grenada cocos or cocus and red ebony.", "details": []}, {"x": -0.866279892642769, "y": 0.4945312615032572, "z": 0.0706963860379697, "word": "Groundnut", "pos_group": "noun", "row_number": 68514, "definition": "The dwarf ginseng (Aralia trifolia).", "details": []}, {"x": -0.8663058594088608, "y": 0.4372963493098144, "z": 0.24142506256431526, "word": "Grove", "pos_group": "verb", "row_number": 68546, "definition": "A smaller group of trees than a forest and without underwood planted or growing naturally as if arranged by art; a wood of small extent.", "details": []}, {"x": -0.8025400318658521, "y": 0.5778436620705091, "z": 0.14841226181721096, "word": "Grovy", "pos_group": "adjective", "row_number": 68555, "definition": "Pertaining to or resembling a grove; situated in or frequenting groves.", "details": []}, {"x": -0.8965997106171497, "y": 0.42772951069232573, "z": 0.11470145859642318, "word": "Grub", "pos_group": "other", "row_number": 68590, "definition": "To dig; to dig up by the roots; to root out by digging; -- followed by up; as to grub up trees rushes or sedge.", "details": []}, {"x": -0.8216241116488993, "y": 0.5085062817090454, "z": 0.257594993390008, "word": "Grugru palm", "pos_group": "other", "row_number": 68620, "definition": "A West Indian name for several kinds of palm. See Macaw tree under Macaw.", "details": []}, {"x": -0.8380577598940868, "y": 0.5396147231010265, "z": 0.08046826513544027, "word": "Guaiacum", "pos_group": "noun", "row_number": 68675, "definition": "A genus of small crooked trees growing in tropical America.", "details": []}, {"x": -0.8888684096420113, "y": 0.41280025795868064, "z": 0.19876845164594928, "word": "Guaiacum", "pos_group": "noun", "row_number": 68676, "definition": "The heart wood or the resin of the Guaiacum offinale or lignum-vitae a large tree of the West Indies and Central America. It is much used in medicine.", "details": []}, {"x": -0.7974049039637455, "y": 0.5687877314034637, "z": 0.2015587649780354, "word": "Gum", "pos_group": "noun", "row_number": 68946, "definition": "A vegetable secretion of many trees or plants that hardens when it exudes but is soluble in water; as gum arabic; gum tragacanth; the gum of the cherry tree. Also with less propriety exudations that are not soluble in water; as gum copal and gum sandarac which are really resins.", "details": []}, {"x": -0.8814826379028807, "y": 0.4655669331198103, "z": 0.0789670175528573, "word": "Gum", "pos_group": "noun", "row_number": 68947, "definition": "See Gum tree below.", "details": []}, {"x": -0.8489757394719888, "y": 0.4616768535379687, "z": 0.2570888498073588, "word": "Gunny cloth", "pos_group": "other", "row_number": 68995, "definition": "A strong coarse kind of sacking made from the fibers (called jute) of two plants of the genus Corchorus (C. olitorius and C. capsularis) of India. The fiber is also used in the manufacture of cordage.", "details": []}, {"x": -0.8127310686588721, "y": 0.5707745433456014, "z": 0.11698132630992034, "word": "Gurjun", "pos_group": "noun", "row_number": 69025, "definition": "A thin balsam or wood oil derived from the Diptcrocarpus laevis an East Indian tree. It is used in medicine and as a substitute for linseed oil in the coarser kinds of paint.", "details": []}, {"x": -0.8987538437546019, "y": 0.4136531874381911, "z": 0.1453704538706307, "word": "Gutta-percha", "pos_group": "noun", "row_number": 69081, "definition": "A concrete juice produced by various trees found in the Malayan archipelago especially by the Isonandra / Dichopsis Gutta. It becomes soft and unpressible at the tamperature of boiling water and on cooling retains its new shape. It dissolves in oils and ethers but not in water. In many of its properties it resembles caoutchouc and it is extensively used for many economical purposes. The Mimusops globosa of Guiana also yields this material.", "details": []}, {"x": -0.8080787019090073, "y": 0.536266094615875, "z": 0.24377753646817227, "word": "Guttatrap", "pos_group": "noun", "row_number": 69084, "definition": "The inspissated juice of a tree of the genus Artocarpus (A. incisa or breadfruit tree) sometimes used in making birdlime on account of its glutinous quality.", "details": []}, {"x": -0.8557305352688669, "y": 0.5126489781736817, "z": 0.07011616208791545, "word": "Guttiferous", "pos_group": "adjective", "row_number": 69095, "definition": "Pertaining to a natural order of trees and shrubs (Guttiferae) noted for their abounding in a resinous sap.", "details": []}, {"x": -0.8761906635630409, "y": 0.42470379824947957, "z": 0.22785215565674077, "word": "Hackberry", "pos_group": "noun", "row_number": 69357, "definition": "A genus of trees (Celtis) related to the elm but bearing drupes with scanty but often edible pulp. C. occidentalis is common in the Eastern United States.", "details": []}, {"x": -0.7982563541768519, "y": 0.5781308401853225, "z": 0.16897196407361004, "word": "Hackmatack", "pos_group": "noun", "row_number": 69375, "definition": "The American larch (Larix Americana) a coniferous tree with slender deciduous leaves; also its heavy close-grained timber. Called also tamarack.", "details": []}, {"x": -0.8927612251116991, "y": 0.43976408323867006, "z": 0.09790273760375824, "word": "Haematoxylon", "pos_group": "noun", "row_number": 69464, "definition": "A genus of leguminous plants containing but a single species the H. Campechianum or logwood tree native in Yucatan.", "details": []}, {"x": -0.831317317623717, "y": 0.4903071230622985, "z": 0.26174499516376676, "word": "Halesia", "pos_group": "noun", "row_number": 69636, "definition": "A genus of American shrubs containing several species called snowdrop trees or silver-bell trees. They have showy white flowers drooping on slender pedicels.", "details": []}, {"x": -0.8273364062175115, "y": 0.5542674368861149, "z": 0.09111574701877509, "word": "Hamadryad", "pos_group": "noun", "row_number": 69826, "definition": "A tree nymph whose life ended with that of the particular tree usually an oak which had been her abode.", "details": []}, {"x": -0.894721930382272, "y": 0.4092501128701383, "z": 0.17884913309490735, "word": "Hammock", "pos_group": "noun", "row_number": 69877, "definition": "A piece of land thickly wooded and usually covered with bushes and vines. Used also adjectively; as hammock land.", "details": []}, {"x": -0.799242406276428, "y": 0.5592010815922295, "z": 0.22024015609226688, "word": "Hand", "pos_group": "noun", "row_number": 69922, "definition": "A bundle of tobacco leaves tied together.", "details": []}, {"x": -0.8726482343269649, "y": 0.4831169740631418, "z": 0.07129550124730166, "word": "Hangbird", "pos_group": "noun", "row_number": 70058, "definition": "The Baltimore oriole (Icterus galbula); -- so called because its nest is suspended from the limb of a tree. See Baltimore oriole.", "details": []}, {"x": -0.8599115327900183, "y": 0.44522641374496674, "z": 0.2496509488836706, "word": "Hanger", "pos_group": "noun", "row_number": 70069, "definition": "A steep wooded declivity.", "details": []}, {"x": -0.8051790512766405, "y": 0.5773234577210602, "z": 0.135588792126224, "word": "Hardbeam", "pos_group": "noun", "row_number": 70196, "definition": "A tree of the genus Carpinus of compact horny texture; hornbeam.", "details": []}, {"x": -0.8986861177615778, "y": 0.4203105052663109, "z": 0.1253089817427372, "word": "Harrow", "pos_group": "noun", "row_number": 70413, "definition": "An implement of agriculture usually formed of pieces of timber or metal crossing each other and set with iron or wooden teeth. It is drawn over plowed land to level it and break the clods to stir the soil and make it fine or to cover seed when sown.", "details": []}, {"x": -0.8154803019149862, "y": 0.5197317149425535, "z": 0.2546975101399993, "word": "Hastated", "pos_group": "noun", "row_number": 70493, "definition": "Shaped like the head of a halberd; triangular with the basal angles or lobes spreading; as a hastate leaf.", "details": []}, {"x": -0.8446149068714033, "y": 0.5302298392751961, "z": 0.07404037164149394, "word": "Haw", "pos_group": "noun", "row_number": 70696, "definition": "A hedge; an inclosed garden or yard.", "details": []}, {"x": -0.8849209255286647, "y": 0.41516538158911165, "z": 0.2110750138966212, "word": "Haw", "pos_group": "noun", "row_number": 70697, "definition": "The fruit of the hawthorn.", "details": []}, {"x": -0.7962434406043586, "y": 0.5744489902756342, "z": 0.1897491524772577, "word": "Hawebake", "pos_group": "noun", "row_number": 70707, "definition": "Probably the baked berry of the hawthorn tree that is coarse fare. See 1st Haw 2.", "details": []}, {"x": -0.8867282223464159, "y": 0.45459700832499333, "z": 0.08399178362394241, "word": "Hawthorn", "pos_group": "noun", "row_number": 70740, "definition": "A thorny shrub or tree (the Crataegus oxyacantha) having deeply lobed shining leaves small roselike fragrant flowers and a fruit called haw. It is much used in Europe for hedges and for standards in gardens. The American hawthorn is Crataegus cordata which has the leaves but little lobed.", "details": []}, {"x": -0.8419749035627889, "y": 0.4719532922581334, "z": 0.26141605095544757, "word": "Hay", "pos_group": "noun", "row_number": 70744, "definition": "Grass cut and cured for fodder.", "details": []}, {"x": -0.8173896390826374, "y": 0.5663462046944364, "z": 0.10548058754369627, "word": "Hay", "pos_group": "other", "row_number": 70745, "definition": "To cut and cure grass for hay.", "details": []}, {"x": -0.898466835637632, "y": 0.40965298881338513, "z": 0.15792964894395492, "word": "Haycock", "pos_group": "noun", "row_number": 70749, "definition": "A conical pile or hear of hay in the field.", "details": []}, {"x": -0.803415778824898, "y": 0.5463589213627443, "z": 0.23667491498365678, "word": "Hayfield", "pos_group": "noun", "row_number": 70751, "definition": "A field where grass for hay has been cut; a meadow.", "details": []}, {"x": -0.8624786295352526, "y": 0.5015123943842907, "z": 0.06794064964311235, "word": "Haymaking", "pos_group": "noun", "row_number": 70756, "definition": "The operation or work of cutting grass and curing it for hay.", "details": []}, {"x": -0.8704785238912295, "y": 0.43078856590985537, "z": 0.2380931559820152, "word": "Haymow", "pos_group": "noun", "row_number": 70757, "definition": "A mow or mass of hay laid up in a barn for preservation.", "details": []}, {"x": -0.7995083372495425, "y": 0.580056115088101, "z": 0.15595294808810578, "word": "Haystack", "pos_group": "noun", "row_number": 70762, "definition": "A stack or conical pile of hay in the open air.", "details": []}, {"x": -0.8962117406904799, "y": 0.4305837349636481, "z": 0.10678091137134432, "word": "Haythorn", "pos_group": "noun", "row_number": 70764, "definition": "Hawthorn.", "details": []}, {"x": -0.8245493153686396, "y": 0.5016832643170615, "z": 0.2615957354952198, "word": "Hazel", "pos_group": "noun", "row_number": 70792, "definition": "A shrub or small tree of the genus Corylus as the C. avellana bearing a nut containing a kernel of a mild farinaceous taste; the filbert. The American species are C. Americana which produces the common hazelnut and C. rostrata. See Filbert.", "details": []}, {"x": -0.8334488766889313, "y": 0.5464240281743697, "z": 0.08236353185514773, "word": "Hazel", "pos_group": "adjective", "row_number": 70794, "definition": "Consisting of hazels or of the wood of the hazel; pertaining to or derived from the hazel; as a hazel wand.", "details": []}, {"x": -0.8920559394741633, "y": 0.40918929548247296, "z": 0.19183409840647517, "word": "Head", "pos_group": "other", "row_number": 70834, "definition": "To cut off the top of; to lop off; as to head trees.", "details": []}, {"x": -0.7966349892098729, "y": 0.5668992252893214, "z": 0.2097569124795483, "word": "Heartwood", "pos_group": "noun", "row_number": 71068, "definition": "The hard central part of the trunk of a tree consisting of the old and matured wood and usually differing in color from the outer layers. It is technically known as duramen and distinguished from the softer sapwood or alburnum.", "details": []}, {"x": -0.8787447248207422, "y": 0.47157022386113234, "z": 0.07368332625010642, "word": "Heath", "pos_group": "noun", "row_number": 71099, "definition": "A place overgrown with heath; any cheerless tract of country overgrown with shrubs or coarse herbage.", "details": []}, {"x": -0.8531029431280012, "y": 0.4543145007051034, "z": 0.25654181506221363, "word": "Hedge", "pos_group": "noun", "row_number": 71271, "definition": "A thicket of bushes usually thorn bushes; especially such a thicket planted as a fence between any two portions of land; and also any sort of shrubbery as evergreens planted in a line or as a fence; particularly such a thicket planted round a field to fence it or in rows to separate the parts of a garden.", "details": []}, {"x": -0.8087018914095718, "y": 0.5752267183399039, "z": 0.12294500127490302, "word": "Hedge", "pos_group": "other", "row_number": 71274, "definition": "To inclose or separate with a hedge; to fence with a thickly set line or thicket of shrubs or small trees; as to hedge a field or garden.", "details": []}, {"x": -0.8998829344367096, "y": 0.4140591772500236, "z": 0.1369879631376795, "word": "Hedgerow", "pos_group": "noun", "row_number": 71290, "definition": "A row of shrubs or trees planted for inclosure or separation of fields.", "details": []}, {"x": -0.8097648353360125, "y": 0.5308121805146124, "z": 0.2500386779491588, "word": "Hemlock", "pos_group": "noun", "row_number": 71721, "definition": "An evergreen tree common in North America (Abies / Tsuga Canadensis); hemlock spruce.", "details": []}, {"x": -0.8514306568453209, "y": 0.5198899506442045, "z": 0.06913953863826425, "word": "Hemlock", "pos_group": "noun", "row_number": 71722, "definition": "The wood or timber of the hemlock tree.", "details": []}, {"x": -0.8801630624937262, "y": 0.41908535076307973, "z": 0.22289112184528895, "word": "Henna", "pos_group": "noun", "row_number": 71785, "definition": "A thorny tree or shrub of the genus Lawsonia (L. alba). The fragrant white blossoms are used by the Buddhists in religious ceremonies. The powdered leaves furnish a red coloring matter used in the East to stain the hails and fingers the manes of horses etc.", "details": []}, {"x": -0.796019371095345, "y": 0.5787715409063587, "z": 0.17713459367907355, "word": "Heptaphyllous", "pos_group": "adjective", "row_number": 71854, "definition": "Having seven leaves.", "details": []}, {"x": -0.8914017395479661, "y": 0.44404641910245635, "z": 0.0906957353636079, "word": "Herborize", "pos_group": "other", "row_number": 71930, "definition": "To form the figures of plants in; -- said in reference to minerals. See Arborized.", "details": []}, {"x": -0.8348801041754543, "y": 0.48295120946343545, "z": 0.2640707119878827, "word": "Hercynian", "pos_group": "adjective", "row_number": 71942, "definition": "Of or pertaining to an extensive forest in Germany of which there are still portions in Swabia and the Hartz mountains.", "details": []}, {"x": -0.8227598338535048, "y": 0.5604332280478564, "z": 0.09476736092776157, "word": "Hibernaculum", "pos_group": "noun", "row_number": 72385, "definition": "A winter bud in which the rudimentary foliage or flower as of most trees and shrubs in the temperate zone is protected by closely overlapping scales.", "details": []}, {"x": -0.8972237253547549, "y": 0.4071218816270559, "z": 0.1710010530990398, "word": "Hickory", "pos_group": "noun", "row_number": 72404, "definition": "An American tree of the genus Carya of which there are several species. The shagbark is the C. alba and has a very rough bark; it affords the hickory nut of the markets. The pignut or brown hickory is the C. glabra. The swamp hickory is C. amara having a nut whose shell is very thin and the kernel bitter.", "details": []}, {"x": -0.7994517676566384, "y": 0.5557698886497415, "z": 0.22802785369539882, "word": "Hidebound", "pos_group": "adjective", "row_number": 72429, "definition": "Having the bark so close and constricting that it impedes the growth; -- said of trees.", "details": []}, {"x": -0.8691525567779981, "y": 0.4899114919057937, "z": 0.06753194166398896, "word": "Hierapicra", "pos_group": "noun", "row_number": 72443, "definition": "A warming cathartic medicine made of aloes and canella bark.", "details": []}, {"x": -0.8641762887627991, "y": 0.4382414453199254, "z": 0.2472726785232412, "word": "Hilling", "pos_group": "noun", "row_number": 72616, "definition": "The act or process of heaping or drawing earth around plants.", "details": []}, {"x": -0.8017057342767492, "y": 0.5804270423903345, "z": 0.1427317907467959, "word": "Hoary", "pos_group": "adjective", "row_number": 72940, "definition": "Covered with short dense grayish white hairs; canescent.", "details": []}, {"x": -0.8988578115769241, "y": 0.4223279556566732, "z": 0.11702022234638684, "word": "Holly", "pos_group": "noun", "row_number": 73216, "definition": "A tree or shrub of the genus Ilex. The European species (Ilex Aguifolium) is best known having glossy green leaves with a spiny waved edge and bearing berries that turn red or yellow about Michaelmas.", "details": []}, {"x": -0.8180223074164727, "y": 0.5132510536133745, "z": 0.25963986699617403, "word": "Holm", "pos_group": "noun", "row_number": 73219, "definition": "A common evergreen oak of Europe (Quercus Ilex); -- called also ilex and holly.", "details": []}, {"x": -0.8400112243859678, "y": 0.5373721858124911, "z": 0.07491513078606066, "word": "Holt", "pos_group": "noun", "row_number": 73269, "definition": "A piece of woodland; especially a woody hill.", "details": []}, {"x": -0.8884848356321894, "y": 0.4107203403065427, "z": 0.20470344137341565, "word": "Home", "pos_group": "noun", "row_number": 73299, "definition": "The locality where a thing is usually found or was first found or where it is naturally abundant; habitat; seat; as the home of the pine.", "details": []}, {"x": -0.7949132751361311, "y": 0.5734577769405194, "z": 0.19813899938878027, "word": "Homodromous", "pos_group": "adjective", "row_number": 73387, "definition": "Running in the same direction; -- said of stems twining round a support or of the spiral succession of leaves on stems and their branches.", "details": []}, {"x": -0.8844402991511386, "y": 0.4601118483506938, "z": 0.07786169947254216, "word": "Homomallous", "pos_group": "adjective", "row_number": 73449, "definition": "Uniformly bending or curving to one side; -- said of leaves which grow on several sides of a stem.", "details": []}, {"x": -0.8459995269554949, "y": 0.46441319552553034, "z": 0.26192591359551376, "word": "Hornbeam", "pos_group": "noun", "row_number": 73822, "definition": "A tree of the genus Carpinus (C. Americana) having a smooth gray bark and a ridged trunk the wood being white and very hard. It is common along the banks of streams in the United States and is also called ironwood. The English hornbeam is C. Betulus. The American is called also blue beech and water beech.", "details": []}, {"x": -0.8130614608661905, "y": 0.571549968086483, "z": 0.11073253737938368, "word": "Horse-chestnut", "pos_group": "noun", "row_number": 73934, "definition": "The tree itself which was brought from Constantinople in the beginning of the sixteenth century and is now common in the temperate zones of both hemispheres. The native American species are called buckeyes.", "details": []}, {"x": -0.9001401126956213, "y": 0.40912821342952604, "z": 0.14953889959565117, "word": "Horsewood", "pos_group": "noun", "row_number": 73988, "definition": "A West Indian tree (Calliandra latifolia) with showy crimson blossoms.", "details": []}, {"x": -0.8045987159884224, "y": 0.5415258020090399, "z": 0.24366105964689547, "word": "Hortyard", "pos_group": "noun", "row_number": 74005, "definition": "An orchard.", "details": []}, {"x": -0.858376512033251, "y": 0.5087696978235652, "z": 0.06590264157185251, "word": "Hothouse", "pos_group": "noun", "row_number": 74097, "definition": "A house kept warm to shelter tender plants and shrubs from the cold air; a place in which the plants of warmer climates may be reared and fruits ripened.", "details": []}, {"x": -0.8746633536755197, "y": 0.4245244979565594, "z": 0.23397215298369067, "word": "Hoult", "pos_group": "noun", "row_number": 74125, "definition": "A piece of woodland; a small wood. [Obs.] See Holt.", "details": []}, {"x": -0.7967601666628814, "y": 0.5816332173035657, "z": 0.16393912696010196, "word": "Hulver", "pos_group": "noun", "row_number": 74402, "definition": "Holly an evergreen shrub or tree.", "details": []}, {"x": -0.8953940447662236, "y": 0.43413117542793866, "z": 0.09899306601342339, "word": "Humiri", "pos_group": "noun", "row_number": 74518, "definition": "A fragrant balsam obtained from Brazilian trees of the genus Humirium.", "details": []}, {"x": -0.8278249331872275, "y": 0.49447407362343987, "z": 0.26495522359033263, "word": "Hummock", "pos_group": "noun", "row_number": 74529, "definition": "Timbered land. See Hammock.", "details": []}, {"x": -0.8287537308278629, "y": 0.5531094616422135, "z": 0.08507159973080755, "word": "Hurst", "pos_group": "noun", "row_number": 74715, "definition": "A
