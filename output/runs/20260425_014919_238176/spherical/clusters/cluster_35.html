reasing in length by growth at its extremity only not divided into joints leafless and without buds and having for its offices to fix the plant in the earth to supply it with moisture and soluble matters and sometimes to serve as a reservoir of nutriment for future growth. A true root however may never reach the ground but may be attached to a wall", "details": []}, {"x": -0.9109172975777023, "y": 0.40154819022727184, "z": 0.09480890200259974, "word": "Root", "pos_group": "other", "row_number": 132055, "definition": "To fix the root; to enter the earth as roots; to take root and begin to grow.", "details": []}, {"x": -0.8087205406300455, "y": 0.5112073735398027, "z": 0.2909262937611239, "word": "Root", "pos_group": "other", "row_number": 132057, "definition": "To plant and fix deeply in the earth or as in the earth; to implant firmly; hence to make deep or radical; to establish; -- used chiefly in the participle; as rooted trees or forests; rooted dislike.", "details": []}, {"x": -0.8306158859851134, "y": 0.5546999561591299, "z": 0.04883859729992714, "word": "Rootery", "pos_group": "noun", "row_number": 132062, "definition": "A pile of roots set with plants mosses etc. and used as an ornamental object in gardening.", "details": []}, {"x": -0.9005680353668203, "y": 0.3807818420032066, "z": 0.20971981898759748, "word": "Rooty", "pos_group": "adjective", "row_number": 132066, "definition": "Full of roots; as rooty ground.", "details": []}, {"x": -0.7754362562188976, "y": 0.5938253418291203, "z": 0.21463940910920462, "word": "Rosebush", "pos_group": "noun", "row_number": 132141, "definition": "The bush or shrub which bears roses.", "details": []}, {"x": -0.8900176668445893, "y": 0.453561371314746, "z": 0.04637494103069873, "word": "Rosetta wood", "pos_group": "other", "row_number": 132171, "definition": "An east Indian wood of a reddish orange color handsomely veined with darker marks. It is occasionally used for cabinetwork.", "details": []}, {"x": -0.8461827939967355, d. See under Sandalwood.", "details": []}, {"x": -0.7861880123958973, "y": 0.6052648367761704, "z": 0.12475129869986946, "word": "Rugose", "pos_group": "adjective", "row_number": 132912, "definition": "Wrinkled; full of wrinkles; specifically (Bot.) having the veinlets sunken and the spaces between them elevated as the leaves of the sage and horehound.", "details": []}, {"x": -0.9133727251364702, "y": 0.3920744591295281, "z": 0.10967170772385285, "word": "Run", "pos_group": "noun", "row_number": 133105, "definition": "That which runs or flows in the course of a certain operation or during a certain time; as a run of must in wine making; the first run of sap in a maple orchard.", "details": []}, {"x": -0.800650122635647, "y": 0.5263547710782899, "z": 0.28619929435036096, "word": "Runner", "pos_group": "noun", "row_number": 133158, "definition": "A slender trailing branch which takes root at the joints or end and there forms new plants as in the strawberry and the common cinquefoil.", "details": []}, {"x": -0.8396490155973899, "y": 0.5415904364685176, "z": 0.04085743178633195, "word": "Runt", "pos_group": "adjective", "row_number": 133188, "definition": "The dead stump of a tree; also the stem of a plant.", "details": []}, {"x": -0.8949011686754083, "y": 0.3847216532228245, "z": 0.226144086468971, "word": "Rustle", "pos_group": "other", "row_number": 133319, "definition": "To cause to rustle; as the wind rustles the leaves.", "details": []}, {"x": -0.7743407257215299, "y": 0.6008894181505311, "z": 0.19831376060115077, "word": "Rys", "pos_group": "noun", "row_number": 133378, "definition": "A branch.", "details": []}, {"x": -0.896888768485874, "y": 0.43895406033633894, "z": 0.05394320975001594, "word": "Sabal", "pos_group": "noun", "row_number": 133395, "definition": "A genus of palm trees including the palmetto of the Southern United States.", "details": []}, {"x": -0.8367256228239788, "y": 0.46151503540703304, "z": 0.29477805922943073, "word": "Sabicu", "pos_group": antalum or a tree which yields sandalwood.", "details": []}, {"x": -0.7932488551845025, "y": 0.5411184952782603, "z": 0.27918994934679814, "word": "Sandalwood", "pos_group": "noun", "row_number": 134272, "definition": "The red wood of a kind of buckthorn used in Russia for dyeing leather (Rhamnus Dahuricus).", "details": []}, {"x": -0.8489111903892693, "y": 0.5273750281010394, "z": 0.03500529341830773, "word": "Sanders", "pos_group": "noun", "row_number": 134284, "definition": "An old name of sandalwood now applied only to the red sandalwood. See under Sandalwood.", "details": []}, {"x": -0.8882269223010875, "y": 0.3906771225780491, "z": 0.241711233486725, "word": "Sandhiller", "pos_group": "noun", "row_number": 134289, "definition": "A nickname given to any \"\"\"\"poor white\"\"\"\" living in the pine woods which cover the sandy hills in Georgia and South Carolina.", "details": []}, {"x": -0.774502433019695, "y": 0.6060864100238664, "z": 0.18112218205110744, "word": "Santalum", "pos_group": "noun", "row_number": 134399, "definition": "A genus of trees with entire opposite leaves and small apetalous flowers. There are less than a dozen species occurring from India to Australia and the Pacific Islands. See Sandalwood.", "details": []}, {"x": -0.9029132397000614, "y": 0.4250844196703251, "z": 0.0636468202495788, "word": "Sap", "pos_group": "noun", "row_number": 134410, "definition": "The sapwood or alburnum of a tree.", "details": []}, {"x": -0.8272595981314319, "y": 0.47653412908122167, "z": 0.29758491413413996, "word": "Sapan wood", "pos_group": "other", "row_number": 134422, "definition": "A dyewood yielded by Caesalpinia Sappan a thorny leguminous tree of Southern Asia and the neighboring islands. It is the original Brazil wood.", "details": []}, {"x": -0.8103452111729477, "y": 0.5817542319894328, "z": 0.070018942376016, "word": "Sapindaceous", "pos_group": "adjective", "row_number": 134436, "definition": "Of or pertaining to an order of trees and shrubs (Sapindaceae) including the (typical) genus Sapindus the maples the margosa and about seventy other genera.", "details": []}, {"x": -0.9109876318553332, "y": 0.3750267855141139, "z": 0.1716287993128275, "word": "Sapindus", "pos_group": "noun", "row_number": 134437, "definition": "A genus of tropical and subtropical trees with pinnate leaves and panicled flowers. The fruits of some species are used instead of soap and their round black seeds are made into necklaces.", "details": []}, {"x": -0.7794192786119916, "y": 0.5746982883008672, "z": 0.24945433560476743, "word": "sapling", "pos_group": "noun", "row_number": 134440, "definition": "A young tree.", "details": []}, {"x": -0.8727831952125149, "y": 0.48699448151417996, "z": 0.032952528421471755, "word": "Sapodilla", "pos_group": "noun", "row_number": 134441, "definition": "A tall evergeen tropical American tree (Achras Sapota); also its edible fruit the sapodilla plum.", "details": []}, {"x": -0.8666901369869386, "y": 0.41655324186696396, "z": 0.2744660327612215, "word": "Sapotaceous", "pos_group": "adjective", "row_number": 134460, "definition": "Of or pertaining to a natural order (Sapotaceae) of (mostly tropical) trees and shrubs including the star apple the Lucuma or natural marmalade tree the gutta-percha tree (Isonandra) and the India mahwa as well as the sapodilla or sapota after which the order is named.", "details": []}, {"x": -0.7822274213222782, "y": 0.6082294373683023, "z": 0.13482289438421644, "word": "Sappan wood", "pos_group": "other", "row_number": 134461, "definition": "Sapan wood.", "details": []}, {"x": -0.9129107144115476, "y": 0.3959355174978433, "z": 0.09914178481504722, "word": "Sappy", "pos_group": "other", "row_number": 134475, "definition": "Abounding with sap; full of sap; juicy; succulent.", "details": []}, {"x": -0.804621424048398, "y": 0.5173000658513539, "z": 0.29152187882303676, "word": "Sappy", "pos_group": "other", "row_number": 134478, "definition": "Abounding in sap; resembling or consisting largely of sapwood.", "details": []}, {"x": -0.8335797076222871, "y": 0.5506907272364009, "z": 0.04341191053370457, "word": "Sapucaia", "pos_group": "noun", "row_number": 134486, "definition": "A Brazilian tree. See Lecythis and Monkey-pot.", "details": []}, {"x": -0.8992063818694005, "y": 0.37996628908155466, "z": 0.21691819187641734, "word": "Sapwood", "pos_group": "noun", "row_number": 134487, "definition": "The alburnum or part of the wood of any exogenous tree next to the bark being that portion of the tree through which the sap flows most freely; -- distinguished from heartwood.", "details": []}, {"x": -0.7733901137801499, "y": 0.5984048602904862, "z": 0.20923516694822225, "word": "Sarcocolla", "pos_group": "noun", "row_number": 134514, "definition": "A gum resin obtained from certain shrubs of Africa (Penaea) -- formerly thought to cause healing of wounds and ulcers.", "details": []}, {"x": -0.8933092680434146, "y": 0.4469851895462631, "z": 0.046933910491564444, "word": "Sassafras", "pos_group": "noun", "row_number": 134624, "definition": "An American tree of the Laurel family (Sassafras officinale); also the bark of the roots which has an aromatic smell and taste.", "details": []}, {"x": -0.8422835146969441, "y": 0.45176206843084277, "z": 0.2940569917496419, "word": "Sassy bark", "pos_group": "other", "row_number": 134633, "definition": "The bark of a West African leguminous tree (Erythrophlaeum Guineense used by the natives as an ordeal poison and also medicinally; -- called also mancona bark.", "details": []}, {"x": -0.7975346403632252, "y": 0.5962325055630493, "z": 0.09189829558109076, "word": "Satinwood", "pos_group": "noun", "row_number": 134665, "definition": "The hard lemon-colored fragrant wood of an East Indian tree (Chloroxylon Swietenia). It takes a lustrous finish and is used in cabinetwork. The name is also given to the wood of a species of prickly ash (Xanthoxylum Caribaeum) growing in Florida and the West Indies.", "details": []}, {"x": -0.914594149580927, "y": 0.37830768091076106, "z": 0.14283150953575594, "word": "Sation", "pos_group": "noun", "row_number": 134667, "definition": "A sowing or planting.", "details": []}, {"x": -0.7866611559401705, "y": 0.5552193329014214, "z": 0.2699920704527731, "word": "Saul", "pos_group": "noun", "row_number": 134780, "definition": "Same as Sal the tree.", "details": []}, {"x": -0.858233035043294, "y": 0.5122974788079164, "z": 0.03142213817404597, "word": "Savage", "pos_group": "adjective", "row_number": 134823, "definition": "Of or pertaining to the forest; remote from human abodes and cultivation; in a state of nature; wild; as a savage wilderness.", "details": []}, {"x": -0.880650677912633, "y": 0.3985680246615946, "z": 0.25612089569063745, "word": "Savanna", "pos_group": "noun", "row_number": 134837, "definition": "A tract of level land covered with the vegetable growth usually found in a damp soil and warm climate -- as grass or reeds -- but destitute of trees.", "details": []}, {"x": -0.7759353862994193, "y": 0.6092907718441344, "z": 0.1633677802810269, "word": "Savine", "pos_group": "noun", "row_number": 134861, "definition": "A coniferous shrub (Juniperus Sabina) of Western Asia occasionally found also in the northern parts of the United States and in British America. It is a compact bush with dark-colored foliage and produces small berries having a glaucous bloom. Its bitter acrid tops are sometimes used in medicine for gout amenorrhoea etc.", "details": []}, {"x": -0.9079649611677022, "y": 0.4122179570622901, "z": 0.07533913436670855, "word": "Savine", "pos_group": "noun", "row_number": 134862, "definition": "The North American red cedar (Juniperus Virginiana.)", "details": []}, {"x": -0.8179567778723681, "y": 0.4920672951917766, "z": 0.29802094982618654, "word": "Sawyer", "pos_group": "noun", "row_number": 134936, "definition": "A tree which has fallen into a stream so that its branches project above the surface rising and falling with a rocking or swaying motion in the current.", "details": []}, {"x": -0.8185986509127453, "y": 0.5714710920479136, "z": 0.05759374686021276, "word": "Scaleboard", "pos_group": "noun", "row_number": 135090, "definition": "A thin veneer of leaf of wood used for covering the surface of articles of furniture and the like.", "details": []}, {"x": -0.9077047523556827, "y": 0.37441104419161636, "z": 0.1894424781780802, "word": "Scar", "pos_group": "noun", "row_number": 135281, "definition": "A mark left upon a stem or branch by the fall of a leaf leaflet or frond or upon a seed by the separation of its support. See Illust.. under Axillary.", "details": []}, {"x": -0.7755873476577313, "y": 0.5856548588837535, "z": 0.2355263306280134, "word": "Schiedam", "pos_group": "noun", "row_number": 135501, "definition": "Holland gin made at Schiedam in the Netherlands.", "details": []}, {"x": -0.8813059055007392, "y": 0.4712038032709564, "z": 0.03559321160710022, "word": "Scion", "pos_group": "noun", "row_number": 135691, "definition": "A piece of a slender branch or twig cut for grafting.", "details": []}, {"x": -0.8575352049582843, "y": 0.42864280490090256, "z": 0.2844269995338697, "word": "Sciuroid", "pos_group": "adjective", "row_number": 135727, "definition": "Resembling the tail of a squirrel; -- generally said of branches which are close and dense or of spikes of grass like barley.", "details": []}, {"x": -0.7867892352209892, "y": 0.6059530637889391, "z": 0.11740350857265205, "word": "Sclerogen", "pos_group": "noun", "row_number": 135759, "definition": "The thickening matter of woody cells; lignin.", "details": []}, {"x": -0.9149262172305134, "y": 0.3869533245959466, "z": 0.11479173144616012, "word": "Scrag", "pos_group": "noun", "row_number": 136070, "definition": "A ragged stunted tree or branch.", "details": []}, {"x": -0.7966669976556663, "y": 0.5325873459839294, "z": 0.2857838584386824, "word": "Scrog", "pos_group": "noun", "row_number": 136308, "definition": "A stunted shrub bush or branch.", "details": []}, {"x": -0.8428822774969204, "y": 0.5368833444445027, "z": 0.036135034795749546, "word": "Scrub", "pos_group": "noun", "row_number": 136332, "definition": "A thicket or jungle often specified by the name of the prevailing plant; as oak scrub palmetto scrub etc.", "details": []}, {"x": -0.8930264010831898, "y": 0.3847960661357617, "z": 0.2333148826261378, "word": "Scuffler", "pos_group": "noun", "row_number": 136409, "definition": "An agricultural implement resembling a scarifier but usually lighter.", "details": []}, {"x": -0.7727825476426006, "y": 0.6048542988606597, "z": 0.192245705306495, "word": "Scutch", "pos_group": "noun", "row_number": 136511, "definition": "The woody fiber of flax; the refuse of scutched flax.", "details": []}, {"x": -0.8999742166002378, "y": 0.432394648141452, "z": 0.055509257907289354, "word": "Sea fir", "pos_group": "other", "row_number": 136710, "definition": "A sertularian hydroid especially Sertularia abietina which branches like a miniature fir tree.", "details": []}, {"x": -0.8326427952408642, "y": 0.466591418634008, "z": 0.2983260357236428, "word": "Sea grape", "pos_group": "other", "row_number": 136731, "definition": "A shrubby plant (Coccoloba uvifera) growing on the sandy shores of tropical America somewhat resembling the grapevine.", "details": []}, {"x": -0.8046723011588132, "y": 0.5887130979147617, "z": 0.07693748170680183, "word": "Season", "pos_group": "noun", "row_number": 136966, "definition": "Hence a period of time especially as regards its fitness for anything contemplated or done; a suitable or convenient time; proper conjuncture; as the season for planting; the season for rest.", "details": []}, {"x": -0.913295637343022, "y": 0.3743189786748892, "z": 0.16055024451551303, "word": "Seed-lac", "pos_group": "noun", "row_number": 137370, "definition": "A species of lac. See the Note under Lac.", "details": []}, {"x": -0.7810183719338875, "y": 0.5683863861173324, "z": 0.25874160619857545, "word": "Seerwood", "pos_group": "noun", "row_number": 137440, "definition": "Dry wood.", "details": []}, {"x": -0.8674416160370803, "y": 0.4966211227818652, "z": 0.03020766746801473, "word": "Semicirque", "pos_group": "noun", "row_number": 137947, "definition": "A semicircular hollow or opening among trees or hills.", "details": []}, {"x": -0.8722961454554055, "y": 0.40827691602188015, "z": 0.26908993750659765, "word": "Seminary", "pos_group": "noun", "row_number": 138021, "definition": "Fig.: A seed bed; a source.", "details": []}, {"x": -0.7786301127908464, "y": 0.6104122707602756, "z": 0.14536852190415128, "word": "Sempervirent", "pos_group": "adjective", "row_number": 138119, "definition": "Always fresh; evergreen.", "details": []}, {"x": -0.9119341177125305, "y": 0.40060532082076616, "z": 0.08883435079944886, "word": "Senega", "pos_group": "noun", "row_number": 138163, "definition": "Seneca root.", "details": []}, {"x": -0.8089886602304871, "y": 0.5078350236033157, "z": 0.2960421193349036, "word": "Septifolious", "pos_group": "adjective", "row_number": 138464, "definition": "Having seven leaves.", "details": []}, {"x": -0.8274417738359616, "y": 0.5595872997331752, "z": 0.046927229712938286, "word": "Sequoia", "pos_group": "noun", "row_number": 138561, "definition": "A genus of coniferous trees consisting of two species Sequoia Washingtoniana syn. S. gigantea the \"\"\"\"big tree\"\"\"\" of California and S. sempervirens the redwood both of which attain an immense height.", "details": []}, {"x": -0.9032171228154098, "y": 0.37592221551425403, "z": 0.20707804551885245, "word": "Serrated", "pos_group": "adjective", "row_number": 138732, "definition": "Beset with teeth pointing forwards or upwards; as serrate leaves.", "details": []}, {"x": -0.7729429395340991, "y": 0.5950753341025582, "z": 0.22010124708214293, "word": "Sertularia", "pos_group": "noun", "row_number": 138754, "definition": "A genus of delicate branching hydroids having small sessile hydrothecae along the sides of the branches.", "details": []}, {"x": -0.8892823537831775, "y": 0.45555113736152414, "z": 0.040620887465355665, "word": "Service", "pos_group": "other", "row_number": 138797, "definition": "A name given to several trees and shrubs of the genus Pyrus as Pyrus domestica and P. torminalis of Europe the various species of mountain ash or rowan tree and the American shad bush (see Shad bush under Shad). They have clusters of small edible applelike berries.", "details": []}, {"x": -0.8479980397925919, "y": 0.44206600682576597, "z": 0.2923644474231493, "word": "Sesban", "pos_group": "noun", "row_number": 138839, "definition": "A leguminous shrub (Sesbania aculeata) which furnishes a fiber used for making ropes.", "details": []}, {"x": -0.7924617933643472, "y": 0.6015710950689878, "z": 0.10058093077349001, "word": "Sessile", "pos_group": "adjective", "row_number": 138867, "definition": "Resting directly upon the main stem or branch without a petiole or footstalk; as a sessile leaf or blossom.", "details": []}, {"x": -0.9156856512320217, "y": 0.37974317803807855, "z": 0.13158611956178548, "word": "Set", "pos_group": "other", "row_number": 138889, "definition": "To fix in the ground as a post or a tree; to plant; as to set pear trees in an orchard.", "details": []}, {"x": -0.7894543866450323, "y": 0.5473673755148356, "z": 0.2777601980646556, "word": "Setterwort", "pos_group": "noun", "row_number": 138988, "definition": "The bear's-foot (Helleborus f/tidus); -- so called because the root was used in settering or inserting setons into the dewlaps of cattle. Called also pegroots.", "details": []}, {"x": -0.8523475155623694, "y": 0.5220511753630356, "z": 0.031085093159413497, "word": "Sexto", "pos_group": "noun", "row_number": 139198, "definition": "A book consisting of sheets each of which is folded into six leaves.", "details": []}, {"x": -0.8858642795619165, "y": 0.39164546644178944, "z": 0.24871330244247014, "word": "Shaddock", "pos_group": "noun", "row_number": 139265, "defini
