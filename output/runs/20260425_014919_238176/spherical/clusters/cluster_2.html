volve.", "details": []}, {"x": 0.17942398648347258, "y": -0.3394948765878181, "z": -0.9233364835448672, "word": "'Twixt", "pos_group": "other", "row_number": 163913, "definition": "An abbreviation of Betwixt used in poetry or in colloquial language.", "details": []}, {"x": 0.13639068559597975, "y": -0.6548933460411194, "z": -0.7433117019082409, "word": "Two-hand", "pos_group": "adjective", "row_number": 163926, "definition": "Employing two hands; as the two-hand alphabet. See Dactylology.", "details": []}, {"x": -0.07622802174694271, "y": -0.4081574448776541, "z": -0.9097234683635969, "word": "Two-handed", "pos_group": "adjective", "row_number": 163927, "definition": "Having two hands; -- often used as an epithet equivalent to large stout strong or powerful.", "details": []}, {"x": 0.28042179431172815, "y": -0.4565780215040821, "z": -0.8443341326479753, "word": "#NAME?", "pos_group": "noun", "row_number": 164002, "definition": "A combining form signifying impressed form; stamp; print; type; typical form; representative; as in stereotype phototype ferrotype monotype.", "details": []}, {"x": -0.032941823529693826, "y": -0.6319607043386452, "z": -0.7743000093208976, "word": "Type", "pos_group": "noun", "row_number": 164005, "definition": "A figure or representation of something to come; a token; a sign; a symbol; -- correlative to antitype.", "details": []}, {"x": 0.07249695856946482, "y": -0.32483137147702673, "z": -0.9429892741184978, "word": "Type", "pos_group": "noun", "row_number": 164011, "definition": "Such letters or characters in general or the whole quantity of them used in printing spoken of collectively; any number or mass of such letters or characters however disposed.", "details": []}, {"x": 0.23043667644608332, "y": -0.602389054317165, "z": -0.7642161771301066, "word": "Type", "pos_group": "other", "row_number": 164015, "definition": "To furnish an expression or copy of; to represent; to typify.", "details": []}, {"x": -0.10799192261449428, "y": -0.50021 iscourse or treatise on types.", "details": []}, {"x": -0.09566570167745592, "y": -0.4415180095517676, "z": -0.8921378373121528, "word": "U", "pos_group": "other", "row_number": 164097, "definition": "the twenty-first letter of the English alphabet is a cursive form of the letter V with which it was formerly used interchangeably both letters being then used both as vowels and consonants. U and V are now however differentiated U being used only as a vowel or semivowel and V only as a consonant. The true primary vowel sound of U in Anglo-Saxon was the sound which it still retains in most of the languages of Europe that of long oo as in tool", "details": []}, {"x": 0.2693931191736644, "y": -0.42167801756319234, "z": -0.8658030935760507, "word": "Ultima", "pos_group": "noun", "row_number": 164193, "definition": "The last syllable of a word.", "details": []}, {"x": 0.0027442788560401326, "y": -0.6499286152523781, "z": -0.7599903052076957, "word": "Ultra-", "pos_group": "adjective", "row_number": 164210, "definition": "A prefix from the Latin ultra beyond (see Ulterior) having in composition the signification beyond on the other side chiefly when joined with words expressing relations of place; as ultramarine ultramontane ultramundane ultratropical etc. In other relations it has the sense of excessively exceedingly beyond what is common natural", "details": []}, {"x": 0.03086904001350246, "y": -0.33310275740125495, "z": -0.9423850886873824, "word": "Umlauted", "pos_group": "adjective", "row_number": 164316, "definition": "Having the umlaut; as umlauted vowels.", "details": []}, {"x": 0.2561147262177041, "y": -0.5720782793773712, "z": -0.7791865561462524, "word": "Un-", "pos_group": "other", "row_number": 164330, "definition": "An inseparable verbal prefix or particle. It is prefixed: (a) To verbs to express the contrary and not the simple negative of the action of the verb to which it is prefixed; as in uncoil undo unfold. (b) To nouns to form verbs expressing privation of the thing quality or state expressed by the noun or separation from it; as in unchild unsex. Sometimes particles and participial adjectives formed with this prefix coincide in form with compounds of the negative prefix un- (see 2d Un-); as in undone (from undo) meaning unfastened ruined; and undone (from 2d un- and done) meaning not done not finished. Un- is sometimes used with an intensive force merely; as in unloose.", "details": []}, {"x": -0.10424972534955948, "y": -0.5365104374882872, "z": -0.837429725547564, "word": "Un-", "pos_group": "adverb", "row_number": 164331, "definition": "An inseparable prefix or particle signifying not; in-; non-. In- is prefixed mostly to words of Latin origin or else to words formed by Latin suffixes; un- is of much wider application and is attached at will to almost any adjective or participle used adjectively or adverb from which it may be desired to form a corresponding negative adjective or adverb and is also but less freely prefixed to nouns. Un- sometimes has merely an intensive force; as in unmerciless unremorseless.", "details": []}, {"x": 0.2019581564311558, "y": -0.3499124248127901, "z": -0.9147536269469296, "word": "Un-", "pos_group": "adverb", "row_number": 164332, "definition": "Un- is prefixed to adjectives or to words used adjectively.", "details": []}, {"x": 0.1107856244406474, "y": -0.6607058461286013, "z": -0.742424629379161, "word": "Un-", "pos_group": "adverb", "row_number": 164334, "definition": "To past particles or to adjectives formed after the analogy of past particles to indicate the absence of the condition or state expressed by them", "details": []}, {"x": -0.0610417107890503, "y": -0.388941482399907, "z": -0.9192379631044991, "word": "Un-", "pos_group": "adverb", "row_number": 164335, "definition": "To present particles which come from intransitive verbs or are themselves employed as adjectives to mark the absence of the activity disposition or condition implied by the participle; as - ---- and the like.", "details": []}, {"x": 0.283595861273663, "y": -0.47888487062659235, "z": -0.8308084425145192, "word": "Un-", "pos_group": "adverb", "row_number": 164337, "definition": "Those which have the value of independent words inasmuch as the simple words are either not used at all or are rarely or at least much less frequently used; as unavoidable unconscionable undeniable unspeakable unprecedented unruly and the like; or inasmuch as they are used in a different sense from the usual meaning of the primitive", "details": []}, {"x": -0.052853879230928054, "y": -0.6180586030942058, "z": -0.7843532562509583, "word": "Unabridged", "pos_group": "adjective", "row_number": 164345, "definition": "Not abridged or shortened; full; complete; entire; whole.", "details": []}, {"x": 0.09865227024513384, "y": -0.32280101434845737, "z": -0.9413114440561573, "word": "Uncial", "pos_group": "adjective", "row_number": 164677, "definition": "Of pertaining to or designating a certain style of letters used in ancient manuscripts esp. in Greek and Latin manuscripts. The letters are somewhat rounded and the upstrokes and downstrokes usually have a slight inclination. These letters were used as early as the 1st century b. c. and were seldom used after the 10th century a. d. being superseded by the cursive style.", "details": []}, {"x": 0.21173699778271515, "y": -0.6190682264571552, "z": -0.7562552312289514, "word": "Uncial", "pos_group": "noun", "row_number": 164678, "definition": "An uncial letter.", "details": []}, {"x": -0.10661311892106004, "y": -0.47742228697191263, "z": -0.8721820926712682, "word": "Uncipher", "pos_group": "other", "row_number": 164687, "definition": "To decipher; as to uncipher a letter.", "details": []}, {"x": 0.24982036390129753, "y": -0.3899765218208772, "z": -0.886288947357866, "word": "Underline", "pos_group": "other", "row_number": 165068, "definition": "To mark a line below as words; to underscore.", "details": []}, {"x": 0.042539660579687236, "y": -0.660634410560
