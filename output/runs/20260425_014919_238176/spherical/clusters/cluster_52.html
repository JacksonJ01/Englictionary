ne of numerous species of Heliconius a genus of tropical American butterflies. The wings are usually black marked with green crimson and white.", "details": []}, {"x": -0.5988980235545831, "y": -0.04061208793498988, "z": 0.7997948585080893, "word": "Heliconian", "pos_group": "adjective", "row_number": 71418, "definition": "Like or pertaining to the butterflies of the genus Heliconius.", "details": []}, {"x": -0.607383995160095, "y": 0.13154977941994017, "z": 0.7834407048130233, "word": "Hellgramite", "pos_group": "noun", "row_number": 71500, "definition": "The aquatic larva of a large American winged insect (Corydalus cornutus) much used a fish bait by anglers; the dobson. It belongs to the Neuroptera.", "details": []}, {"x": -0.6916519644530313, "y": -0.006924388749770621, "z": 0.7221977657876717, "word": "Helminth", "pos_group": "noun", "row_number": 71532, "definition": "An intestinal worm or wormlike intestinal parasite; one of the Helminthes.", "details": []}, {"x": -0.5587654891721199, "y": 0.0250142775796482, "z": 0.8289483783851741, "word": "Helminthes", "pos_group": "other", "row_number": 71534, "definition": "One of the grand divisions or branches of the animal kingdom. It is a large group including a vast number of species most of which are parasitic. Called also Enthelminthes Enthelmintha.", "details": []}, {"x": -0.6704767069772627, "y": 0.11656873931635231, "z": 0.7327159848229885, "word": "Helminthiasis", "pos_group": "noun", "row_number": 71535, "definition": "A disease in which worms are present in some part of the body.", "details": []}, {"x": -0.6386834592081233, "y": -0.05054727595827071, "z": 0.7678075356670732, "word": "Helminthic", "pos_group": "adjective", "row_number": 71536, "definition": "Of or relating to worms or Helminthes; expelling worms.", "details": []}, {"x": -0.5737040951630249, "y": 0.10439948109251256, "z": 0.8123819049811419, "word": "Helminthic", "pos_group": "noun", "row_number": 71537, "definition": "A vermifuge; an anthelmintic.", "details": []}, {"x": -0.7014355647143361, "y": 0.043092324320552426, "z": 0.7114289846067087, "word": "Helminthoid", "pos_group": "adjective", "row_number": 71539, "definition": "Wormlike; vermiform.", "details": []}, {"x": -0.5779834308618844, "y": -0.02161661910991339, "z": 0.815762143904326, "word": "Helminthology", "pos_group": "noun", "row_number": 71543, "definition": "The natural history or study of worms esp. parasitic worms.", "details": []}, {"x": -0.6322384120405409, "y": 0.13528985245041214, "z": 0.7628703993237652, "word": "Hemelytrum", "pos_group": "noun", "row_number": 71649, "definition": "One of the partially thickened anterior wings of certain insects as of many Hemiptera the earwigs etc.", "details": []}, {"x": -0.6757947783466935, "y": -0.03147811518275773, "z": 0.7364173720274966, "word": "Hemerobian", "pos_group": "noun", "row_number": 71651, "definition": "A neuropterous insect of the genus Hemerobius and allied genera.", "details": []}, {"x": -0.5571549025107383, "y": 0.05749997252977985, "z": 0.8284154560166801, "word": "Hemimetabola", "pos_group": "other", "row_number": 71677, "definition": "Those insects which have an incomplete metamorphosis.", "details": []}, {"x": -0.6886148071607239, "y": 0.09320620453319207, "z": 0.7191121267198292, "word": "Hemimetabolic", "pos_group": "adjective", "row_number": 71678, "definition": "Having an incomplete metamorphosis the larvae differing from the adults chiefly in laking wings as in the grasshoppers and cockroaches.", "details": []}, {"x": -0.6134047503804751, "y": -0.048610605531708824, "z": 0.7882712865762063, "word": "Hemipter", "pos_group": "noun", "row_number": 71693, "definition": "One of the Hemiptera.", "details": []}, {"x": -0.5927260025859696, "y": 0.124932184412818, "z": 0.7956556008451765, "word": "Hemiptera", "pos_group": "other", "row_number": 71694, "definition": "An order of hexapod insects having a jointed proboscis including four sharp stylets (mandibles and maxillae) for piercing. In many of the species (Heteroptera) the front wings are partially coriaceous and different from the others.", "details": []}, {"x": -0.6985577092974203, "y": 0.010839659566835283, "z": 0.715471612687475, "word": "Hemipteran", "pos_group": "noun", "row_number": 71697, "definition": "One of the Hemiptera; an hemipter.", "details": []}, {"x": -0.5630580873088621, "y": 0.00541305282704479, "z": 0.8263995941281537, "word": "Herbivora", "pos_group": "other", "row_number": 71919, "definition": "An extensive division of Mammalia. It formerly included the Proboscidea Hyracoidea Perissodactyla and Artiodactyla but by later writers it is generally restricted to the two latter groups (Ungulata). They feed almost exclusively upon vegetation.", "details": []}, {"x": -0.6570283026267162, "y": 0.12769098745659443, "z": 0.7429729613315791, "word": "Hesperian", "pos_group": "adjective", "row_number": 72148, "definition": "Of or pertaining to a family of butterflies called Hesperidae or skippers.", "details": []}, {"x": -0.6540342281118752, "y": -0.0473427200294371, "z": 0.7549820496662936, "word": "Heterocera", "pos_group": "other", "row_number": 72181, "definition": "A division of Lepidoptera including the moths and hawk moths which have the antennae variable in form.", "details": []}, {"x": -0.5643221212356851, "y": 0.08851748706272662, "z": 0.8207954665860167, "word": "Heterogangliate", "pos_group": "adjective", "row_number": 72211, "definition": "Having the ganglia of the nervous system unsymmetrically arranged; -- said of certain invertebrate animals.", "details": []}, {"x": -0.6997097873568355, "y": 0.06330797286463838, "z": 0.7116166903950625, "word": "Heterogynous", "pos_group": "adjective", "row_number": 72226, "definition": "Having females very unlike the males in form and structure; -- as certain insects the males of which are winged and the females wingless.", "details": []}, {"x": -0.5897299520076227, "y": -0.03555703416924227, "z": 0.8068173777418125, "word": "Heteromera", "pos_group": "other", "row_number": 72230, "definition": "A division of Coleoptera having heteromerous tarsi.", "details": []}, {"x": -0.6164346981858118, "y": 0.13560266357020465, "z": 0.7756417862036786, "word": "Heteromerous", "pos_group": "adjective", "row_number": 72234, "definition": "Having five tarsal joints in the anterior and middle legs but only four in the posterior pair as the blister beetles and oil beetles.", "details": []}, {"x": -0.6871559766894672, "y": -0.017990951218504022, "z": 0.7262871259868219, "word": "Heteroptera", "pos_group": "other", "row_number": 72264, "definition": "A suborder of Hemiptera in which the base of the anterior wings is thickened. See Hemiptera.", "details": []}, {"x": -0.5560195657988605, "y": 0.037269443609353387, "z": 0.830333204817136, "word": "Hexapoda", "pos_group": "other", "row_number": 72346, "definition": "The true or six-legged insects; insects other than myriapods and arachnids.", "details": []}, {"x": -0.678714708980653, "y": 0.10954076445053905, "z": 0.7261867285601542, "word": "Hibernaculum", "pos_group": "noun", "row_number": 72386, "definition": "A little case in which certain insects pass the winter.", "details": []}, {"x": -0.628955276475997, "y": -0.052468218676342326, "z": 0.775668966906588, "word": "Hibernate", "pos_group": "other", "row_number": 72391, "definition": "To winter; to pass the season of winter in close quarters in a torpid or lethargic state as certain mammals reptiles and insects.", "details": []}, {"x": -0.5794954230904613, "y": 0.1142522736132143, "z": 0.8069271792370228, "word": "Hippobosca", "pos_group": "noun", "row_number": 72714, "definition": "A genus of dipterous insects including the horsefly or horse tick.", "details": []}, {"x": -0.7023117504586759, "y": 0.030451115498958355, "z": 0.7112179235174965, "word": "Hirudinea", "pos_group": "other", "row_number": 72776, "definition": "An order of Annelida including the leeches; -- called also Hirudinei.", "details": []}, {"x": -0.5705719979723389, "y": -0.012845839728743265, "z": 0.8211471119912171, "word": "Hive", "pos_group": "noun", "row_number": 72891, "definition": "A box basket or other structure for the reception and habitation of a swarm of honeybees.", "details": []}, {"x": -0.641982872026008, "y": 0.13498221643890068, "z": 0.7547435281408381, "word": "Hive", "pos_group": "noun", "row_number": 72892, "definition": "The bees of one hive; a swarm of bees.", "details": []}, {"x": -0.6685155328146946, "y": -0.03982925661468033, "z": 0.7426308724413543, "word": "Hognosesnake", "pos_group": "other", "row_number": 73080, "definition": "A harmless North American snake of the genus Heterodon esp. H. platyrhynos; -- called also puffing adder blowing adder and sand viper.", "details": []}, {"x": -0.5578226634324204, "y": 0.07011383564614009, "z": 0.8269933048170021, "word": "Holometabola", "pos_group": "other", "row_number": 73239, "definition": "Those insects which have a complete metamorphosis; metabola.", "details": []}, {"x": -0.694601242711574, "y": 0.08292932095354835, "z": 0.7145990773501742, "word": "Holometabolic", "pos_group": "adjective", "row_number": 73240, "definition": "Having a complete metamorphosis;-said of certain insects as the butterflies and bees.", "details": []}, {"x": -0.6035814637729561, "y": -0.046095016340472375, "z": 0.7959677544085987, "word": "Holostomate", "pos_group": "adjective", "row_number": 73253, "definition": "Same as Holostomatous.", "details": []}, {"x": -0.6009126516718802, "y": 0.13148986748776686, "z": 0.7884252658360962, "word": "Holotricha", "pos_group": "other", "row_number": 73261, "definition": "A group of ciliated Infusoria having cilia all over the body.", "details": []}, {"x": -0.6959934397471537, "y": -0.0013806699612797587, "z": 0.7180468129442418, "word": "Homogangliate", "pos_group": "adjective", "row_number": 73406, "definition": "Having the ganglia of the nervous system symmetrically arranged as in certain invertebrates; -- opposed to heterogangliate.", "details": []}, {"x": -0.558326340418074, "y": 0.01686252515989835, "z": 0.8294500303457665, "word": "Homomorphism", "pos_group": "noun", "row_number": 73454, "definition": "The possession of but one kind of larvae or young as in most insects.", "details": []}, {"x": -0.6662628270416051, "y": 0.12300783171857746, "z": 0.7355018141639231, "word": "Homoptera", "pos_group": "other", "row_number": 73486, "definition": "A suborder of Hemiptera in which both pairs of wings are similar in texture and do not overlap when folded as in the cicada. See Hemiptera.", "details": []}, {"x": -0.6448241389694752, "y": -0.0519177692021223, "z": 0.7625656529396992, "word": "Honeybee", "pos_group": "noun", "row_number": 73538, "definition": "Any bee of the genus Apis which lives in communities and collects honey esp. the common domesticated hive bee (Apis mellifica) the Italian bee (A. ligustica) and the Arabiab bee (A. fasciata). The two latter are by many entomologists considered only varieties of the common hive bee. Each swarm of bees consists of a large number of workers (barren females) with ordinarily one queen or fertile female but in the swarming season several young queens and a number of males or drones are produced.", "details": []}, {"x": -0.5683507313130042, "y": 0.09993939324748294, "z": 0.8166942903518416, "word": "Honeycomb", "pos_group": "noun", "row_number": 73540, "definition": "A mass of hexagonal waxen cells formed by bees and used by them to hold their honey and their eggs.", "details": []}, {"x": -0.7026690055392594, "y": 0.05100892559184541, "z": 0.7096860983311101, "word": "Hopper", "pos_group": "noun", "row_number": 73755, "definition": "See Grasshopper and Frog hopper Grape hopper Leaf hopper Tree hopper under Frog Grape Leaf and Tree.", "details": []}, {"x": -0.5810094207151726, "y": -0.02886284290374758, "z": 0.8133848961836785, "word": "Hopper", "pos_group": "noun", "row_number": 73756, "definition": "The larva of a cheese fly.", "details": []}, {"x": -0.6260252610521392, "y": 0.13801746331135276, "z": 0.7674917278679296, "word": "Hornbug", "pos_group": "noun", "row_number": 73829, "definition": "A large nocturnal beetle of the genus Lucanus (as L. capreolus and L. dama) having long curved upper jaws resembling a sickle. The grubs are found in the trunks of old trees.", "details": []}, {"x": -0.6814150989384463, "y": -0.028280696012532858, "z": 0.731350576106804, "word": "Hornet", "pos_group": "noun", "row_number": 73837, "definition": "A large strong wasp. The European species (Vespa crabro) is of a dark brown and yellow color. It is very pugnacious and its sting is very severe. Its nest is constructed of a paperlike material and the layers of comb are hung together by columns. The American white-faced hornet (V. maculata) is larger and has similar habits.", "details": []}, {"x": -0.5545708660348642, "y": 0.05001811247964025, "z": 0.8306318937828687, "word": "Horntail", "pos_group": "noun", "row_number": 73854, "definition": "Any one of family (Uroceridae) of large hymenopterous insects allied to the sawflies. The larvae bore in the wood of trees. So called from the long stout ovipositors of the females.", "details": []}, {"x": -0.6862844500835018, "y": 0.10100650323683111, "z": 0.7202855960502428, "word": "Horsefly", "pos_group": "noun", "row_number": 73942, "definition": "Any dipterous fly of the family Tabanidae that stings horses and sucks their blood.", "details": []}, {"x": -0.6189147924453758, "y": -0.05265979707031361, "z": 0.7836908991846282, "word": "Horseworm", "pos_group": "noun", "row_number": 73989, "definition": "The larva of a botfly.", "details": []}, {"x": -0.5864170066819779, "y": 0.12306051007989413, "z": 0.8006067730996443, "word": "Hunter", "pos_group": "noun", "row_number": 74648, "definition": "A kind of spider. See Hunting spider under Hunting.", "details": []}, {"x": -0.7018323643735377, "y": 0.01762024555034343, "z": 0.7121241880912313, "word": "Hydrophyllium", "pos_group": "noun", "row_number": 75034, "definition": "One of the flat leaflike protective zooids covering other zooids of certain Siphonophora.", "details": []}, {"x": -0.5640300088690344, "y": -0.002749194255707579, "z": 0.8257497145177475, "word": "Hydrozoa", "pos_group": "other", "row_number": 75091, "definition": "The Acalephae; one of the classes of coelenterates including the Hydroidea Discophora and Siphonophora.", "details": []}, {"x": -0.651801360143053, "y": 0.13290733981550013, "z": 0.7466529487913601, "word": "Hylophagous", "pos_group": "adjective", "row_number": 75151, "definition": "Eating green shoots as certain insects do.", "details": []}, {"x": -0.6602565976487696, "y": -0.04689927019773324, "z": 0.7495743350170084, "word": "Hymenopter", "pos_group": "noun", "row_number": 75170, "definition": "One of the Hymenoptera.", "details": []}, {"x": -0.5598625873338337, "y": 0.08260609322397211, "z": 0.8244574680759087, "word": "Hymenoptera", "pos_group": "other", "row_number": 75171, "definition": "An extensive order of insects including the bees ants ichneumons sawflies etc.", "details": []}, {"x": -0.6995432695190378, "y": 0.07154919245987244, "z": 0.7109992455192586, "word": "Hymenopteral", "pos_group": "adjective", "row_number": 75172, "definition": "Alt. of Hymenopterous", "details": []}, {"x": -0.5939260832021058, "y": -0.041829132279152845, "z": 0.8034314727373943, "word": "Hymenopterous", "pos_group": "adjective", "row_number": 75173, "definition": "Like or characteristic of the Hymenoptera; pertaining to the Hymenoptera.", "details": []}, {"x": -0.6098973257621837, "y": 0.1365685598402062, "z": 0.7806242889452704, "word": "Hymenopteran", "pos_group": "noun", "row_number": 75174, "definition": "One of the Hymenoptera.", "details": []}, {"x": -0.6920832099140848, "y": -0.013170341154712066, "z": 0.7216975631584779, "word": "Hypermetamorphosis", "pos_group": "noun", "row_number": 75281, "definition": "A kind of metamorphosis in certain insects in which the larva itself undergoes remarkable changes of form and structure during its growth.", "details": []}, {"x": -0.5547824893724211, "y": 0.029157171325587913, "z": 0.831484364763421, "word": "Hyperoartia", "pos_group": "other", "row_number": 75288, "definition": "An order of marsipobranchs including the lampreys. The suckerlike moth contains numerous teeth; the nasal opening is in the middle of the head above but it does not connect with the mouth. See Cyclostoma and Lamprey.", "details": []}, {"x": -0.6750916854352643, "y": 0.11664590798097701, "z": 0.7284538066394243, "word": "Hypoderma", "pos_group": "noun", "row_number": 75392, "definition": "An inner cellular layer which lies beneath the chitinous cuticle of arthropods annelids and some other invertebrates.", "details": []}, {"x": -0.6350235976568136, "y": -0.05486100258214386, "z": 0.7705422122211601, "word": "Hypopharynx", "pos_group": "noun", "row_number": 75418, "definition": "An appendage or fold on the lower side of the pharynx in certain insects.", "details": []}, {"x": -0.5736572313879299, "y": 0.11063345956513439, "z": 0.8115895628339393, "word": "Hyracoid", "pos_group": "adjective", "row_number": 75501, "definition": "Of or pertaining to the Hyracoidea.", "details": []}, {"x": -0.7043332566788459, "y": 0.038150380810961226, "z": 0.7088435737030769, "word": "Hyracoid", "pos_group": "noun", "row_number": 75502, "definition": "One of the Hyracoidea.", "details": []}, {"x": -0.572921033894722, "y": -0.02061400648682415, "z": 0.8193512992957075, "word": "Ichneumon", "pos_group": "noun", "row_number": 75599, "definition": "Any carnivorous mammal of the genus Herpestes and family Viverridae. Numerous species are found in Asia and Africa. The Egyptian species(H. ichneumon) which ranges to Spain and Palestine is noted for destroying the eggs and young of the crocodile as well as various snakes and lizards and hence was considered sacred by the ancient Egyptians. The common species of India (H. griseus) known as the mongoose has similar habits and is often domesticated. It is noted for killing the cobra.", "details": []}, {"x": -0.635979451197941, "y": 0.13869765766413858, "z": 0.7591397087575166, "word": "Ichneumon", "pos_group": "noun", "row_number": 75600, "definition": "Any hymenopterous insect of the family Ichneumonidae of which several thousand species are known belonging to numerous genera.", "details": []}, {"x": -0.6745046684005959, "y": -0.03756658074155268, "z": 0.7373141829079314, "word": "Ichneumonidan", "pos_group": "adjective", "row_number": 75601, "definition": "Of or pertaining to the Ichneumonidae or ichneumon flies.", "details": []}, {"x": -0.5544845963391345, "y": 0.06302178098402811, "z": 0.8298042465209662, "word": "Ichneumonides", "pos_group": "other", "row_number": 75603, "definition": "The ichneumon flies.", "details": []}, {"x": -0.6930142730401906, "y": 0.09109072529463333, "z": 0.715145927156041, "word": "Imago", "pos_group": "noun", "row_number": 76258, "definition": "The final adult and usually winged state of an insect. See Illust. of Ant-lion and Army worm.", "details": []}, {"x": -0.6087501054937943, "y": -0.05106743572147573, "z": 0.791716758740225, "word": "Immane", "pos_group": "adjective", "row_number": 76401, "definition": "Very great; huge; vast; also monstrous in character; inhuman; atrocious; fierce.", "details": []}, {"x": -0.5943630355492129, "y": 0.1306187441705655, "z": 0.793518320925251, "word": "Impennous", "pos_group": "adjective", "row_number": 76804, "definition": "Having no wings as some insects.", "details": []}, {"x": -0.6999653009166842, "y": 0.004848327125505123, "z": 0.7141603960152789, "word": "Impester", "pos_group": "other", "row_number": 76921, "definition": "See Pester.", "details": []}, {"x": -0.5585107658935468, "y": 0.008512009874178042, "z": 0.8294535972969832, "word": "Inarticulate", "pos_group": "adjective", "row_number": 77587, "definition": "Not jointed or articulated; having no distinct body segments; as an inarticulate worm.", "details": []}, {"x": -0.6614997373570594, "y": 0.12905445752666167, "z": 0.7387577711733669, "word": "Inchworm", "pos_group": "noun", "row_number": 77813, "definition": "The larva of any geometrid moth. See Geometrid.", "details": []}, {"x": -0.6511510711242683, "y": -0.05251080090864021, "z": 0.7571293801997458, "word": "Incrassated", "pos_group": "adjective", "row_number": 78260, "definition": "Swelled out on some particular part as the antennae of certain insects.", "details": []}, {"x": -0.5632725494022408, "y": 0.09472574335092032, "z": 0.8208234089233298, "word": "Indusial", "pos_group": "adjective", "row_number": 79026, "definition": "Of pertaining to or containing the petrified cases of the larvae of certain insects.", "details": []}, {"x": -0.7033107949176399, "y": 0.05925877069388285, "z": 0.7084083030626953, "word": "Infraocular", "pos_group": "adjective", "row_number": 79654, "definition": "Situated below the eyes as the antenna of certain insects.", "details": []}, {"x": -0.5846327529783916, "y": -0.03584650307055485, "z": 0.8105057509743653, "word": "Inocular", "pos_group": "adjective", "row_number": 80239, "definition": "Inserted in the corner of the eye; -- said of the antenn/ of certain insects.", "details": []}, {"x": -0.6195236871006812, "y": 0.14002464022613498, "z": 0.772388180418835, "word": "Inquiline", "pos_group": "noun", "row_number": 80307, "definition": "A gallfly which deposits its eggs in galls formed by other insects.", "details": []}, {"x": -0.6868634401191699, "y": -0.024283786046368397, "z": 0.7263806938258435, "word": "Insect", "pos_group": "noun", "row_number": 80432, "definition": "One of the Insecta; esp. one of the Hexapoda. See Insecta.", "details": []}, {"x": -0.5525292685411952, "y": 0.042078294573526465, "z": 0.8324306725073959, "word": "Insect", "pos_group": "noun", "row_number": 80433, "definition": "Any air-breathing arthropod as a spider or scorpion.", "details": []}, {"x": -0.6833267857725388, "y": 0.10868220418432666, "z": 0.7219783115436413, "word": "Insect", "pos_group": "adjective", "row_number": 80436, "definition": "Of or pertaining to an insect or insects.", "details": []}, {"x": -0.624807392715903, "y": -0.05606714338697331, "z": 0.7787632486449139, "word": "Insect", "pos_group": "adjective", "row_number": 80437, "definition": "Like an insect; small; mean; ephemeral.", "details": []}, {"x": -0.5801719100949141, "y": 0.12036723445234669, "z": 0.8055509193136787, "word": "Insecta", "pos_group": "other", "row_number": 80438, "definition": "One of the classes of Arthropoda including those that have one pair of antennae three pairs of mouth organs and breathe air by means of tracheae opening by spiracles along the sides of the body. In this sense it includes the Hexapoda or six-legged insects and the Myriapoda with numerous legs. See Insect n.", "details": []}, {"x": -0.7046304747719978, "y": 0.024970056273448372, "z": 0.7091349591666525, "word": "Insectary", "pos_group": "noun", "row_number": 80441, "definition": "A place for keeping living insects.", "details": []}, {"x": -0.5656409400448635, "y": -0.010928716050087358, "z": 0.8245792200332602, "word": "Insected", "pos_group": "adjective", "row_number": 80444, "definition": "Pertaining to having the nature of or resembling an insect.", "details": []}, {"x": -0.6461094110294393, "y": 0.13757974566532838, "z": 0.7507425940772606, "word": "Insecticide", "pos_group": "noun", "row_number": 80445, "definition": "An agent or preparation for destroying insects; an insect powder.", "details": []}, {"x": -0.6665256405044618, "y": -0.04563657181028861, "z": 0.7440839158747629, "word": "Insectile", "pos_group": "adjective", "row_number": 80446, "definition": "Pertaining to or having the nature of insects.", "details": []}, {"x": -0.5557997885969881, "y": 0.07603105259840885, "z": 0.827832032501957, "word": "Insectivora", "pos_group": "other", "row_number": 80448, "definition": "An order of mammals which feed principally upon insects.", "details": []}, {"x": -0.6987455130280471, "y": 0.07994929634687724, "z": 0.7108887522227444, "word": "Insectivora", "pos_group": "other", "row_number": 80449, "definition": "A division of the Cheiroptera including the common or insect-eating bats.", "details": []}, {"x": -0.5986563328217176, "y": -0.047671550343637945, "z": 0.7995861544951157, "word": "Insectivores", "pos_group": "other", "row_number": 80450, "definition": "of Insectivore", "details": []}, {"x": -0.6032043390688195, "y": 0.13674205178814888, "z": 0.7857774090678071, "word": "Insectivore", "pos_group": "noun", "row_number": 80451, "definition": "One of the Insectivora.", "details": []}, {"x": -0.6967059061668628, "y": -0.0076112980170695765, "z": 0.7173164911353327, "word": "Insectivorous", "pos_group": "adjective", "row_number": 80452, "definition": "Feeding or subsisting on insects; carnivorous.", "details": []}, {"x": -0.5541504347609448, "y": 0.020748948994530204, "z": 0.8321579037477673, "word": "Insectivorous", "pos_group": "adjective", "row_number": 80453, "definition": "plants which have some special adaptation for catching and digesting insects as the sundew Venus's flytrap Sarracenia etc.", "details": []}, {"x": -0.6708816838674749, "y": 0.1234486809580021, "z": 0.7312169236422739, "word": "Insectivorous", "pos_group": "adjective", "row_number": 80454, "definition": "the Insectivora and to many bats birds and reptiles.", "details": []}, {"x": -0.6413524188456923, "y": -0.056511904815628254, "z": 0.7651623876373491, "word": "Insectologer", "pos_group": "noun", "row_number": 80455, "definition": "An entomologist.", "details": []}, {"x": -0.5680225487165692, "y": 0.10622338403672157, "z": 0.8161292647818236, "word": "Insectology", "pos_group": "noun", "row_number": 80456, "definition": "Entomology.", "details": []}, {"x": -0.70579448429313, "y": 0.046274075443143735, "z": 0.7069037104749678, "word": "Interepimeral", "pos_group": "adjective", "row_number": 81317, "definition": "Between the epimeral plates of insects and crustaceans.", "details": []}, {"x": -0.5758928784951599, "y": -0.02821632383231316, "z": 0.8170380845272446, "word": "Interocular", "pos_group": "adjective", "row_number": 81609, "definition": "Between or within the eyes; as the interocular distance; situated between the eyes as the antennae of some insects.", "details": []}, {"x": -0.629618667095372, "y": 0.14174400867685663, "z": 0.7638644971781726, "word": "Intersternal", "pos_group": "adjective", "row_number": 81794, "definition": "Between the sternal; -- said of certain membranes or parts of insects and crustaceans.", "details": []}, {"x": -0.6803979831753951, "y": -0.03448333356066319, "z": 0.7320310677815517, "word": "Intombment", "pos_group": "noun", "row_number": 81961, "definition": "See Entombment.", "details": []}, {"x": -0.5516456699198249, "y": 0.05538930997992889, "z": 0.8322373935354351, "word": "Inuloid", "pos_group": "noun", "row_number": 82203, "definition": "A substance resembling inulin found in the unripe bulbs of the dahila.", "details": []}, {"x": -0.6907876230873393, "y": 0.09922801044469558, "z": 0.716216630449567, "word": "Invertebral", "pos_group": "adjective", "row_number": 82351, "definition": "Same as Invertebrate.", "details": []}, {"x": -0.614362875068417, "y": -0.0554636373593654, "z": 0.7870718154454126, "word": "Io moth", "pos_group": "other", "row_number": 82587, "definition": "A large and handsome American moth (Hyperchiria Io) having a large bright-colored spot on each hind wing resembling the spots on the tail of a peacock. The larva is covered with prickly hairs which sting like nettles.", "details": []}, {"x": -0.5877989238233786, "y": 0.1289222317508109, "z": 0.7986685691276877, "word": "Isabella moth", "pos_group": "other", "row_number": 82952, "definition": "A common American moth (Pyrrharctia isabella) of an isabella color. The larva called woolly bear and hedgehog caterpillar is densely covered with hairs which are black at each end of the body and red in the middle part.", "details": []}, {"x": -0.7035145886450483, "y": 0.011717805538569482, "z": 0.7105842079563467, "word": "Ischium", "pos_group": "noun", "row_number": 82977, "definition": "One of the pleurae of insects.", "details": []}, {"x": -0.5593330753032837, "y": 4.2951642984724494e-05, "z": 0.8289430071041843, "word": "Isle", "pos_group": "noun", "row_number": 83017, "definition": "A spot within another of a different color as upon the wings of some insects.", "details": []}, {"x": -0.6562192924960369, "y": 0.1346351389296252, "z": 0.7424618640182143, "word": "Isopodiform", "pos_group": "adjective", "row_number": 83120, "definition": "Having the shape of an isopod; -- said of the larvae of certain insects.", "details": []}, {"x": -0.6576029842471885, "y": -0.05229825129617638, "z": 0.7515472094423302, "word": "Itch", "pos_group": "noun", "row_number": 83229, "definition": "An eruption of small isolated acuminated vesicles produced by the entrance of a parasitic mite (the Sarcoptes scabei) and attended with itching. It is transmissible by contact.", "details": []}, {"x": -0.5585280314787491, "y": 0.08879054199785039, "z": 0.8247197570715773, "word": "Iulus", "pos_group": "noun", "row_number": 83278, "definition": "A genus of chilognathous myriapods. The body is long and round consisting of numerous smooth equal segments each of which bears two pairs of short legs. It includes the galleyworms. See Chilognatha.", "details": []}, {"x": -0.7033359752370563, "y": 0.06776655028259249, "z": 0.7076200962381831, "word": "Ixodes", "pos_group": "noun", "row_number": 83296, "definition": "A genus of parasitic Acarina which includes various species of ticks. See Tick the insect.", "details": []}, {"x": -0.5888317481042075, "y": -0.042488577064977606, "z": 0.8071380880887339, "word": "Ixodian", "pos_group": "noun", "row_number": 83297, "definition": "A tick of the genus Ixodes or the family Ixodidae.", "details": []}, {"x": -0.6127906063484905, "y": 0.14127017927570773, "z": 0.7775155363196665, "word": "Jararaca", "pos_group": "noun", "row_number": 83602, "definition": "A poisonous serpent of Brazil (Bothrops jararaca) about eighteen inches long and of a dusky brownish color variegated with red and black spots.", "details": []}, {"x": -0.6920775663952304, "y": -0.019505650450166643, "z": 0.7215595413359672, "word": "Jew's-ear", "pos_group": "noun", "row_number": 83897, "definition": "A species of fungus (Hirneola Auricula-Judae / Auricula) bearing some resemblance to the human ear.", "details": []}, {"x": -0.551064954866669, "y": 0.03374864587727447, "z": 0.8337796138184517, "word": "Jigger", "pos_group": "noun", "row_number": 83928, "definition": "A species of flea (Sarcopsylla / Pulex penetrans) which burrows beneath the skin. See Chigoe.", "details": []}, {"x": -0.6797526694957686, "y": 0.11615113004739405, "z": 0.7241859038272492, "word": "Jointworm", "pos_group": "noun", "row_number": 84123, "definition": "The larva of a small hymenopterous fly (Eurytoma hordei) which is found in gall-like swellings on the stalks of wheat usually at or just above the first joint. In some parts of America it does great damage to the crop.", "details": []}, {"x": -0.631031706252613, "y": -0.05877960852982074, "z": 0.7735269506132266, "word": "Jumper", "pos_group": "noun", "row_number": 84454, "definition": "The larva of the cheese fly. See Cheese fly under Cheese.", "details": []}, {"x": -0.5740548195254608, "y": 0.11685633350144851, "z": 0.8104354764570643, "word": "Katydid", "pos_group": "noun", "row_number": 84772, "definition": "A large green arboreal orthopterous insect (Cyrtophyllus concavus) of the family Locustidae common in the United States. The males have stridulating organs at the bases of the front wings. During the summer and autumn in the evening the males make a peculiar loud shrill sound resembling the combination Katy-did whence the name.", "details": []}, {"x": -0.7069083658784081, "y": 0.03283020032461882, "z": 0.70654280846794, "word": "Kell", "pos_group": "noun", "row_number": 84905, "definition": "The cocoon or chrysalis of an insect.", "details": []}, {"x": -0.5678911711463707, "y": -0.01904266398072129, "z": 0.8228833420859367, "word": "Kermes", "pos_group": "noun", "row_number": 84995, "definition": "The dried bodies of the females of a scale insect (Coccus ilicis) allied to the cochineal insect and found on several species of oak near the Mediterranean. They are round about the size of a pea contain coloring matter analogous to carmine and are used in dyeing. They were anciently thought to be of a vegetable nature and were used in medicine.", "details": []}, {"x": -0.6399956963817104, "y": 0.14164494513434836, "z": 0.7552100490133703, "word": "Killdeer", "pos_group": "noun", "row_number": 85191, "definition": "A small American plover (Aegialitis vocifera).", "details": []}, {"x": -0.6727773152173644, "y": -0.04354419934933034, "z": 0.7385625138280042, "word": "Klipspringer", "pos_group": "noun", "row_number": 85467, "definition": "A small graceful South African antelope (Nanotragus oreotragus) which like the chamois springs from one crag to another with great agility; -- called also kainsi.", "details": []}, {"x": -0.552184905346058, "y": 0.06884024745397997, "z": 0.8308747502713268, "word": "Kneebrush", "pos_group": "noun", "row_number": 85543, "definition": "A thick mass or collection of hairs on the legs of bees by aid of which they carry the collected pollen to the hive or nest; -- usually in the plural.", "details": []}, {"x": -0.6973050961315284, "y": 0.08842726680070867, "z": 0.7112989676606851, "word": "Koba", "pos_group": "noun", "row_number": 85783, "definition": "Any one of several species of African antelopes of the genus Kobus esp. the species Kobus sing-sing.", "details": []}, {"x": -0.6038863649142214, "y": -0.05301272010678732, "z": 0.7953055449181574, "word": "Kusimanse", "pos_group": "noun", "row_number": 85879, "definition": "A carnivorous animal (Crossarchus obscurus) of tropical Africa. It its allied to the civets. Called also kusimansel and mangue.", "details": []}, {"x": -0.5964177801031587, "y": 0.13609863451372606, "z": 0.791051827164516, "word": "Labellum", "pos_group": "noun", "row_number": 85961, "definition": "A small appendage beneath the upper lip or labrum of certain insects.", "details": []}, {"x": -0.7009669280818962, "y": -0.001349254678625451, "z": 0.7131925022371184, "word": "Labial", "pos_group": "adjective", "row_number": 85968, "definition": "Of or pertaining to the labium; as the labial palpi of insects. See Labium.", "details": []}, {"x": -0.5541456043102562, "y": 0.012121518090044872, "z": 0.8323314952726549, "word": "Labipalpus", "pos_group": "noun", "row_number": 85993, "definition": "One of the labial palpi of an insect. See Illust. under Labium.", "details": []}, {"x": -0.6661091021936015, "y": 0.12987137164453186, "z": 0.7344604079199927, "word": "Labium", "pos_group": "noun", "row_number": 85999, "definition": "The organ of insects which covers the mouth beneath and serves as an under lip. It consists of the second pair of maxillae usually closely united in the middle line but bearing a pair of palpi in most insects. It often consists of a thin anterior part (ligula or palpiger) and a firmer posterior plate (mentum).", "details": []}, {"x": -0.6478835692995243, "y": -0.05738308772200857, "z": 0.759574921831413, "word": "Labrum", "pos_group": "noun", "row_number": 86043, "definition": "An organ in insects and crustaceans covering the upper part of the mouth and serving as an upper lip. See Illust. of Hymenoptera.", "details": []}, {"x": -0.5626527410946878, "y": 0.1010439665163097, "z": 0.820494978515582, "word": "Lacertian", "pos_group": "adjective", "row_number": 86109, "definition": "Like a lizard; of or pertaining to the Lacertilia.", "details": []}, {"x": -0.7066631251763993, "y": 0.05475204912097594, "z": 0.7054285510475026, "word": "Lacewing", "pos_group": "noun", "row_number": 86117, "definition": "Any one of several species of neuropterous insects of the genus Chrysopa and allied genera. They have delicate lacelike wings and brilliant eyes. Their larvae are useful in destroying aphids. Called also lace-winged fly and goldeneyed fly.", "details": []}, {"x": -0.579473803497092, "y": -0.03557128556582414, "z": 0.8142142191731906, "word": "Lace-winged", "pos_group": "adjective", "row_number": 86118, "definition": "Having thin transparent reticulated wings; as the lace-winged flies.", "details": []}, {"x": -0.6229530642456228, "y": 0.14407124731406656, "z": 0.7688777246379024, "word": "Lacinia", "pos_group": "noun", "row_number": 86142, "definition": "The posterior inner process of the stipes on the maxillae of insects.", "details": []}, {"x": -0.6861317364630082, "y": -0.030587265381259773, "z": 0.7268339971511745, "word": "Ladybird", "pos_group": "noun", "row_number": 86318, "definition": "Any one of numerous species of small beetles of the genus Coccinella and allied genera (family Coccinellidae); -- called also ladybug ladyclock lady cow lady fly and lady beetle. Coccinella seplempunctata in one of the common European species. See Coccinella.", "details": []}, {"x": -0.5493473178871936, "y": 0.04727786672958758, "z": 0.8342555529618283, "word": "Lamellicorn", "pos_group": "adjective", "row_number": 86509, "definition": "Having antennae terminating in a group of flat lamellae; -- said of certain coleopterous insects.", "details": []}, {"x": -0.6879239410725515, "y": 0.10725833787289653, "z": 0.7178135553581808, "word": "Lamellicorn", "pos_group": "adjective", "row_number": 86510, "definition": "Terminating in a group of flat lamellae; -- said of antennae.", "details": []}, {"x": -0.6203744375813813, "y": -0.059222929740156034, "z": 0.782066622346573, "word": "Lamellicorn", "pos_group": "noun", "row_number": 86511, "definition": "A lamellicorn insect.", "details": []}, {"x": -0.58128450620551, "y": 0.12639368313150412, "z": 0.8038239606467759, "word": "Lamellicornia", "pos_group": "other", "row_number": 86512, "definition": "A group of lamellicorn plant-eating beetles; -- called also Lamellicornes.", "details": []}, {"x": -0.706591997544763, "y": 0.019176878657304844, "z": 0.707361291230065, "word": "Lampyrine", "pos_group": "noun", "row_number": 86600, "definition": "An insect of the genus Lampyris or family Lampyridae. See Lampyris.", "details": []}, {"x": -0.5608017755972283, "y": -0.00846297981678433, "z": 0.8279068464867388, "word": "Lampyris", "pos_group": "noun", "row_number": 86601, "definition": "A genus of coleopterous insects including the glowworms.", "details": []}, {"x": -0.6504582515757172, "y": 0.1396803511485592, "z": 0.7465878799311412, "word": "Lanioid", "pos_group": "adjective", "row_number": 86790, "definition": "Of or pertaining to the shrikes (family Laniidae).", "details": []}, {"x": -0.6641171768547925, "y": -0.0512592819600029, "z": 0.7458691985994362, "word": "Larvae", "pos_group": "other", "row_number": 87032, "definition": "of Larva", "details": []}, {"x": -0.5541728629459929, "y": 0.08217258620113775, "z": 0.8283357435552676, "word": "Larvas", "pos_group": "other", "row_number": 87033, "definition": "of Larva", "details": []}, {"x": -0.7027251446991307, "y": 0.07645422813001146, "z": 0.7073415879252611, "word": "Larva", "pos_group": "noun", "row_number": 87034, "definition": "Any young insect from the time that it hatches from the egg until it becomes a pupa or chrysalis. During this time it usually molts several times and may change its form or color each time. The larvae of many insects are much like the adults in form and habits but have no trace of wings the rudimentary wings appearing only in the pupa stage. In other groups of insects the larvae are totally unlike the parents in structure and habits and are called caterpillars grubs maggots etc.", "details": []}, {"x": -0.5935793287738345, "y": -0.048712808511923014, "z": 0.8032998460968886, "word": "Larva", "pos_group": "noun", "row_number": 87035, "definition": "The early immature form of any animal when more or less of a metamorphosis takes place before the assumption of the mature shape.", "details": []}, {"x": -0.6058853395558601, "y": 0.1417196846006766, "z": 0.7828272391198233, "word": "Larval", "pos_group": "adjective", "row_number": 87036, "definition": "Of or pertaining to a larva.", "details": []}, {"x": -0.6969970947531099, "y": -0.013971829767776675, "z": 0.7169378200922759, "word": "Larvalia", "pos_group": "other", "row_number": 87037, "definition": "An order of Tunicata including Appendicularia and allied genera; -- so called because certain larval features are retained by them through life. Called also Copelata. See Appendicularia.", "details": []}, {"x": -0.5502076319709803, "y": 0.025101215007769618, "z": 0.83465052011367, "word": "Larve", "pos_group": "noun", "row_number": 87040, "definition": "A larva.", "details": []}, {"x": -0.6755786821911816, "y": 0.12333259654256845, "z": 0.7268992466627647, "word": "Larviform", "pos_group": "adjective", "row_number": 87041, "definition": "Having the form or structure of a larva.", "details": []}, {"x": -0.6375335818245139, "y": -0.06075028161898357, "z": 0.7680236554489841, "word": "Larviparous", "pos_group": "adjective", "row_number": 87042, "definition": "Depositing living larvae instead of eggs; -- said of certain insects.", "details": []}, {"x": -0.5681289912609583, "y": 0.11253932454577453, "z": 0.8152081634279595, "word": "Leaf-footed", "pos_group": "adjective", "row_number": 87654, "definition": "Having leaflike expansions on the legs; -- said of certain insects; as the leaf-footed bug (Leptoglossus phyllopus).", "details": []}, {"x": -0.7086269247604293, "y": 0.041136789290263015, "z": 0.704383167084127, "word": "Leaf-nosed", "pos_group": "noun", "row_number": 87660, "definition": "Having a leaflike membrane on the nose; -- said of certain bats esp. of the genera Phyllostoma and Rhinonycteris. See Vampire.", "details": []}, {"x": -0.5707751144391493, "y": -0.02700836221747123, "z": 0.8206621211602896, "word": "Least", "pos_group": "adjective", "row_number": 87771, "definition": "Smallest either in size or degree; shortest; lowest; most unimportant; as the least insect; the least mercy; the least space.", "details": []}, {"x": -0.6335075646637475, "y": 0.1450449316235343, "z": 0.7600198242967957, "word": "Leech", "pos_group": "noun", "row_number": 87890, "definition": "Any one of numerous genera and species of annulose worms belonging to the order Hirudinea or Bdelloidea esp. those species used in medicine as Hirudo medicinalis of Europe and allied species.", "details": []}, {"x": -0.6789474015394694, "y": -0.04061930329819143, "z": 0.7330624108098655, "word": "Lepidodendroid", "pos_group": "noun", "row_number": 88247, "definition": "A lepidodendrid.", "details": []}, {"x": -0.5490652730673864, "y": 0.061087480158525914, "z": 0.8335440274390538, "word": "Lepidopter", "pos_group": "noun", "row_number": 88252, "definition": "One of the Lepidoptera.", "details": []}, {"x": -0.6952164471754112, "y": 0.09690093191807615, "z": 0.7122389353090766, "word": "Lepidoptera", "pos_group": "other", "row_number": 88253, "definition": "An order of insects which includes the butterflies and moths. They have broad wings covered with minute overlapping scales usually brightly colored.", "details": []}, {"x": -0.6095770603859176, "y": -0.057785292645102, "z": 0.790617902279719, "word": "Lepidopterous", "pos_group": "adjective", "row_number": 88255, "definition": "Of or pertaining to the Lepidoptera.", "details": []}, {"x": -0.5896008943739034, "y": 0.1346211812428686, "z": 0.7963968375842961, "word": "Lepidopterist", "pos_group": "noun", "row_number": 88256, "definition": "One who studies the Lepidoptera.", "details": []}, {"x": -0.7048121475664044, "y": 0.005573693603449178, "z": 0.7093720959993056, "word": "Lepisma", "pos_group": "noun", "row_number": 88261, "definition": "A genus of wingless thysanurous insects having an elongated flattened body covered with shining scales and terminated by seven unequal bristles. A common species (Lepisma saccharina) is found in houses and often injures books and furniture. Called also shiner silver witch silver moth and furniture bug.", "details": []}, {"x": -0.5547845577912587, "y": 0.003354067048828973, "z": 0.8319872863635533, "word": "Leptiform", "pos_group": "adjective", "row_number": 88272, "definition": "Having a form somewhat like leptus; -- said of active insect larvae having three pairs of legs. See Larva.", "details": []}, {"x": -0.6608036511052673, "y": 0.13583932321611814, "z": 0.7381640826768364, "word": "Leptothrix", "pos_group": "noun", "row_number": 88282, "definition": "A genus of bacteria characterized by having their filaments very long slender and indistinctly articulated.", "details": []}, {"x": -0.6545566859947967, "y": -0.05744366730315776, "z": 0.7538274138728793, "word": "Leptus", "pos_group": "noun", "row_number": 88284, "definition": "The six-legged young or larva of certain mites; -- sometimes used as a generic name. See Harvest mite under Harvest.", "details": []}, {"x": -0.5576070939540927, "y": 0.09512432743763483, "z": 0.824636702494868, "word": "Lernaea", "pos_group": "noun", "row_number": 88291, "definition": "A Linnaean genus of parasitic Entomostraca -- the same as the family Lernaeidae.", "details": []}, {"x": -0.7069121329433635, "y": 0.06351048568497154, "z": 0.7044442167450332, "word": "Leucoryx", "pos_group": "noun", "row_number": 88445, "definition": "A large antelope of North Africa (Oryx leucoryx) allied to the gemsbok.", "details": []}, {"x": -0.5836444007080565, "y": -0.04259918117907528, "z": 0.8108911907802464, "word": "Libelluloid", "pos_group": "adjective", "row_number": 88669, "definition": "Like or pertaining to the dragon flies.", "details": []}, {"x": -0.616038301890128, "y": 0.14563566690276164, "z": 0.7741363336842647, "word": "Lick-spittle", "pos_group": "noun", "row_number": 88813, "definition": "An abject flatterer or parasite.", "details": []}, {"x": -0.691643274820541, "y": -0.025893645640539066, "z": 0.72177496459143, "word": "Ligniperdous", "pos_group": "adjective", "row_number": 89110, "definition": "Wood-destroying; -- said of certain insects.", "details": []}, {"x": -0.5476262547734776, "y": 0.038753668810832136, "z": 0.8358251241955309, "word": "Ligula", "pos_group": "noun", "row_number": 89128, "definition": "The central process or front edge of the labium of insects. It sometimes serves as a tongue or proboscis as in bees.", "details": []}, {"x": -0.6844317484156778, "y": 0.11509934931360112, "z": 0.7199342480728667, "word": "Lindiform", "pos_group": "adjective", "row_number": 89380, "definition": "Resembling the genus Lindia; -- said of certain apodous insect larvae.", "details": []}, {"x": -0.6267355156568835, "y": -0.062290104439238096, "z": 0.7767383963106557, "word": "Lingua", "pos_group": "noun", "row_number": 89492, "definition": "A median process of the labium at the under side of the mouth in insects and serving as a tongue.", "details": []}, {"x": -0.5748839127464953, "y": 0.12303405825593572, "z": 0.8089320783442543, "word": "Linguatulina", "pos_group": "other", "row_number": 89501, "definition": "An order of wormlike degraded parasitic arachnids. They have two pairs of retractile hooks near the mouth. Called also Pentastomida.", "details": []}, {"x": -0.7091522536840421, "y": 0.027168924159161, "z": 0.704531710184061, "word": "Liparian", "pos_group": "noun", "row_number": 89603, "definition": "Any species of a family (Liparidae) of destructive bombycid moths as the tussock moths.", "details": []}, {"x": -0.5629194871273966, "y": -0.016923263753831342, "z": 0.8263384622272806, "word": "Lithosian", "pos_group": "noun", "row_number": 89876, "definition": "Any one of various species of moths belonging to the family Lithosidae. Many of them are beautifully colored.", "details": []}, {"x": -0.6442580237847139, "y": 0.14412505128959208, "z": 0.7511055640719139, "word": "Lobworm", "pos_group": "noun", "row_number": 90205, "definition": "The lugworm.", "details": []}, {"x": -0.6706299768380782, "y": -0.049380516352592795, "z": 0.7401466062685893, "word": "Locust", "pos_group": "noun", "row_number": 90315, "definition": "Any one of numerous species of long-winged migratory orthopterous insects of the family Acrididae allied to the grasshoppers; esp. (Edipoda / Pachytylus migratoria and Acridium perigrinum of Southern Europe Asia and Africa. In the United States the related species with similar habits are usually called grasshoppers. See Grasshopper.", "details": []}, {"x": -0.5502595096273212, "y": 0.07491719592145801, "z": 0.831626049267317, "word": "Locusting", "pos_group": "other", "row_number": 90320, "definition": "Swarming and devastating like locusts.", "details": []}, {"x": -0.7014646211063598, "y": 0.08524161062645991, "z": 0.7075883359368766, "word": "Loeven's larva", "pos_group": "other", "row_number": 90365, "definition": "The peculiar larva of Polygordius. See Polygordius.", "details": []}, {"x": -0.5988432018904268, "y": -0.0544462835283137, "z": 0.799013405243977, "word": "Loir", "pos_group": "noun", "row_number": 90459, "definition": "A large European dormouse (Myoxus glis).", "details": []}, {"x": -0.5988691795143855, "y": 0.14134584824711466, "z": 0.7882747344746439, "word": "Longbeak", "pos_group": "noun", "row_number": 90551, "definition": "The American redbellied snipe (Macrorhamphus scolopaceus); -- called also long-billed dowitcher.", "details": []}, {"x": -0.7015639505638889, "y": -0.0077149755286030994, "z": 0.712564735600761, "word": "Longicornia", "pos_group": "other", "row_number": 90569, "definition": "A division of beetles including a large number of species in which the antennae are very long. Most of them while in the larval state bore into the wood or beneath the bark of trees and some species are very destructive to fruit and shade trees. See Apple borer under Apple and Locust beetle under Locust.", "details": []}, {"x": -0.5499816295816083, "y": 0.016211449290669158, "z": 0.8350193985978138, "word": "Longipalp", "pos_group": "noun", "row_number": 90577, "definition": "One of a tribe of beetles having long maxillary palpi.", "details": []}, {"x": -0.6708270269598398, "y": 0.13014801915667384, "z": 0.7301045082793395, "word": "Looper", "pos_group": "noun", "row_number": 90696, "definition": "The larva of any species of geometrid moths. See Geometrid.", "details": []}, {"x": -0.6442559543597655, "y": -0.06193874830395672, "z": 0.7622977480817631, "word": "Lore", "pos_group": "noun", "row_number": 90826, "definition": "The anterior portion of the cheeks of insects.", "details": []}, {"x": -0.5624563558411501, "y": 0.10743520659008393, "z": 0.8198173724426919, "word": "Louse", "pos_group": "noun", "row_number": 90970, "definition": "Any one of numerous species of small wingless suctorial parasitic insects belonging to a tribe (Pediculina) now usually regarded as degraded Hemiptera. To this group belong of the lice of man and other mammals; as the head louse of man (Pediculus capitis) the body louse (P. vestimenti) and the crab louse (Phthirius pubis) and many others. See Crab louse Dog louse Cattle louse etc.", "details": []}, {"x": -0.7097519083828622, "y": 0.04982139782303591, "z": 0.7026877378080851, "word": "Louse", "pos_group": "noun", "row_number": 90971, "definition": "Any one of numerous small mandibulate insects mostly parasitic on birds and feeding on the feathers. They are known as Mallophaga or bird lice though some occur on the hair of mammals. They are usually regarded as degraded Pseudoneuroptera. See Mallophaga.", "details": []}, {"x": -0.5742813255006, "y": -0.034743926684747024, "z": 0.8179204232318684, "word": "Louse", "pos_group": "noun", "row_number": 90972, "definition": "Any one of the numerous species of aphids or plant lice. See Aphid.", "details": []}, {"x": -0.6266961315022385, "y": 0.14772740427571324, "z": 0.7651330425397201, "word": "Lug", "pos_group": "noun", "row_number": 91263, "definition": "The lugworm.", "details": []}, {"x": -0.6849719809687458, "y": -0.036866657720809395, "z": 0.7276360593292835, "word": "Lumbric", "pos_group": "noun", "row_number": 91315, "definition": "An earthworm or a worm resembling an earthworm.", "details": []}, {"x": -0.5464840141906429, "y": 0.05283209020900012, "z": 0.8358014073200819, "word": "Lumbrical", "pos_group": "adjective", "row_number": 91316, "definition": "Resembling a worm; as the lumbrical muscles of the hands of the hands and feet.", "details": []}, {"x": -0.6924799065898665, "y": 0.10528757828346266, "z": 0.7137129008421339, "word": "Lumbriciform", "pos_group": "adjective", "row_number": 91318, "definition": "Resembling an earthworm; vermiform.", "details": []}, {"x": -0.6156847943332998, "y": -0.061926658705924544, "z": 0.7855554232314116, "word": "Lumbricoid", "pos_group": "adjective", "row_number": 91319, "definition": "Like an earthworm; belonging to the genus Lumbricus or family Lumbricidae.", "details": []}, {"x": -0.5828176596633649, "y": 0.1323000974116547, "z": 0.8017607247860081, "word": "Lumbricus", "pos_group": "noun", "row_number": 91320, "definition": "A genus of annelids belonging to the Oligochaeta and including the common earthworms. See Earthworm.", "details": []}, {"x": -0.7081908632868393, "y": 0.013109082981161795, "z": 0.7058993222127601, "word": "Lungworm", "pos_group": "noun", "row_number": 91402, "definition": "Any one of several species of parasitic nematoid worms which infest the lungs and air passages of cattle sheep and other animals often proving fatal. The lungworm of cattle (Strongylus micrurus) and that of sheep (S. filaria) are the best known.", "details": []}, {"x": -0.5560780684084671, "y": -0.0054723564858192965, "z": 0.8311120472894136, "word": "Lunulet", "pos_group": "noun", "row_number": 91421, "definition": "A small spot shaped like a half-moon or crescent; as the lunulet on the wings of many insects.", "details": []}, {"x": -0.6550001484007965, "y": 0.1412815066674383, "z": 0.7423034025711543, "word": "Lusern", "pos_group": "noun", "row_number": 91476, "definition": "A lynx. See 1st Lucern and Loup-cervier.", "details": []}, {"x": -0.6613096612589362, "y": -0.05666996982256721, "z": 0.7479692817528675, "word": "Lyencephalous", "pos_group": "adjective", "row_number": 91647, "definition": "Pertaining to or characteristic of the Lyencephala.", "details": []}, {"x": -0.5529423577073869, "y": 0.08850059301329441, "z": 0.8285061219383303, "word": "Mad", "pos_group": "noun", "row_number": 91939, "definition": "An earthworm.", "details": []}, {"x": -0.7065199451030868, "y": 0.07247244800057037, "z": 0.7039725218020487, "word": "Maggot", "pos_group": "noun", "row_number": 92046, "definition": "The footless larva of any fly. See Larval.", "details": []}, {"x": -0.5883797093573622, "y": -0.04922270432309082, "z": 0.8070851522582159, "word": "Maia", "pos_group": "noun", "row_number": 92231, "definition": "A beautiful American bombycid moth (Eucronia maia).", "details": []}, {"x": -0.6089327436494243, "y": 0.14640022825417207, "z": 0.7795946939780382, "word": "Maian", "pos_group": "noun", "row_number": 92232, "definition": "Any spider crab of the genus Maia or family Maiadae.", "details": []}, {"x": -0.6968715098922905, "y": -0.020425172873873295, "z": 0.7169050920543888, "word": "Malacoderm", "pos_group": "noun", "row_number": 92462, "definition": "One of a tribe of beetles (Malacodermata) with a soft and flexible body as the fireflies.", "details": []}, {"x": -0.5465141818609528, "y": 0.02988722197174001, "z": 0.8369163655871865, "word": "Malacopoda", "pos_group": "other", "row_number": 92466, "definition": "A class of air-breathing Arthropoda; -- called also Protracheata and Onychophora.", "details": []}, {"x": -0.6803253950570591, "y": 0.12266979259434971, "z": 0.7225714351019664, "word": "Mall", "pos_group": "noun", "row_number": 92624, "definition": "A large heavy wooden beetle; a mallet for driving anything with force; a maul.", "details": []}, {"x": -0.6333932498530945, "y": -0.06461587342155652, "z": 0.7711276028923519, "word": "Mallophaga", "pos_group": "other", "row_number": 92660, "definition": "An extensive group of insects which are parasitic on birds and mammals and feed on the feathers and hair; -- called also bird lice. See Bird louse under Bird.", "details": []}, {"x": -0.568660726888457, "y": 0.1188519425654907, "z": 0.81394053434087, "word": "Mandible", "pos_group": "noun", "row_number": 92853, "definition": "The anterior pair of mouth organs of insects crustaceaus and related animals whether adapted for biting or not. See Illust. of Diptera.", "details": []}, {"x": -0.711154472092677, "y": 0.035631994688270836, "z": 0.7021322366742043, "word": "Mandibulated", "pos_group": "adjective", "row_number": 92857, "definition": "Provided with mandibles adapted for biting as many insects.", "details": []}, {"x": -0.5656829038324921, "y": -0.0252551527226688, "z": 0.8242360278297681, "word": "Mandibulate", "pos_group": "noun", "row_number": 92858, "definition": "An insect having mandibles.", "details": []}, {"x": -0.6376643691333237, "y": 0.14790918820427917, "z": 0.7559808359889498, "word": "Mandibuliform", "pos_group": "adjective", "row_number": 92859, "definition": "Having the form of a mandible; -- said especially of the maxillae of an insect when hard and adapted for biting.", "details": []}, {"x": -0.6770772228111746, "y": -0.046656166796766506, "z": 0.7344315056219604, "word": "Manis", "pos_group": "noun", "row_number": 93039, "definition": "A genus of edentates covered with large hard triangular scales with sharp edges that overlap each other like tiles on a roof. They inhabit the warmest parts of Asia and Africa and feed on ants. Called also Scaly anteater. See Pangolin.", "details": []}, {"x": -0.5468368072876494, "y": 0.06707589090790944, "z": 0.8345479800792525, "word": "Manitrunk", "pos_group": "noun", "row_number": 93043, "definition": "The anterior segment of the thorax in insects. See Insect.", "details": []}, {"x": -0.6995465654478348, "y": 0.09404695071346743, "z": 0.7083712118879738, "word": "Manta", "pos_group": "noun", "row_number": 93124, "definition": "See Coleoptera and Sea devil.", "details": []}, {"x": -0.6045860872736344, "y": -0.05961999810904521, "z": 0.7943054317456445, "word": "Mantis", "pos_group": "noun", "row_number": 93140, "definition": "Any one of numerous species of voracious orthopterous insects of the genus Mantis and allied genera. They are remarkable for their slender grotesque forms and for holding their stout anterior legs in a manner suggesting hands folded in prayer. The common American species is M. Carolina.", "details": []}, {"x": -0.5918049299119247, "y": 0.14012868249646745, "z": 0.7938078339710098, "word": "Mantispid", "pos_group": "noun", "row_number": 93141, "definition": "Any neuropterous insect of the genus Mantispa and allied genera. The larvae feed on plant lice. Also used adjectively. See Illust. under Neuroptera.", "details": []}, {"x": -0.705722818892837, "y": -0.0007746248757742501, "z": 0.708487616582146, "word": "Marbling", "pos_group": "noun", "row_number": 93303, "definition": "Distinct markings resembling the variegations of marble as on birds and insects.", "details": []}, {"x": -0.5504056961189855, "y": 0.007157629646540603, "z": 0.8348666588249992, "word": "Marimonda", "pos_group": "noun", "row_number": 93409, "definition": "A spider monkey (Ateles belzebuth) of Central and South America.", "details": []}, {"x": -0.6655253782439017, "y": 0.13652152118133676, "z": 0.7337832412692767, "word": "Mask", "pos_group": "noun", "row_number": 93753, "definition": "The lower lip of the larva of a dragon fly modified so as to form a prehensile organ.", "details": []}, {"x": -0.6511392717824234, "y": -0.06231142194389973, "z": 0.7563960175979147, "word": "Mawworm", "pos_group": "noun", "row_number": 94245, "definition": "Any intestinal worm found in the stomach esp. the common round worm (Ascaris lumbricoides) and allied species.", "details": []}, {"x": -0.5570970393741725, "y": 0.10157034010110493, "z": 0.8242125664731625, "word": "Mawworm", "pos_group": "noun", "row_number": 94246, "definition": "One of the larvae of botflies of horses; a bot.", "details": []}, {"x": -0.7102542224189846, "y": 0.05881157259945283, "z": 0.7014842396407653, "word": "Maxilla", "pos_group": "noun", "row_number": 94250, "definition": "One of the lower or outer jaws of arthropods.", "details": []}, {"x": -0.5783925711818128, "y": -0.04216889553088784, "z": 0.8146679187567145, "word": "Mealy", "pos_group": "other", "row_number": 94364, "definition": "Overspread with something that resembles meal; as the mealy wings of an insect.", "details": []}, {"x": -0.619615900269297, "y": 0.14964618849085207, "z": 0.7705077250771913, "word": "Measle", "pos_group": "noun", "row_number": 94413, "definition": "A tapeworm larva. See 2d Measles 4.", "details": []}, {"x": -0.690787928439753, "y": -0.032298649383238336, "z": 0.7223356803937719, "word": "Measles", "pos_group": "noun", "row_number": 94419, "definition": "The larvae of any tapeworm (Taenia) in the cysticerus stage when contained in meat. Called also bladder worms.", "details": []}, {"x": -0.5444796926035389, "y": 0.044138517154329815, "z": 0.8376118764951775, "word": "Measly", "pos_group": "adjective", "row_number": 94421, "definition": "Containing larval tapeworms; -- said of pork and beef.", "details": []}, {"x": -0.6891017442781029, "y": 0.1135045848736131, "z": 0.7157202632632002, "word": "Meerkat", "pos_group": "noun", "row_number": 94712, "definition": "A South African carnivore (Cynictis penicillata) allied to the ichneumons.", "details": []}, {"x": -0.6221617562918093, "y": -0.06537944626685906, "z": 0.7801540085225036, "word": "Megachile", "pos_group": "noun", "row_number": 94746, "definition": "A leaf-cutting bee of the genus Megachilus. See Leaf cutter under Leaf.", "details": []}, {"x": -0.5761322961740831, "y": 0.12913342002286196, "z": 0.8070911578863801, "word": "Megalops", "pos_group": "noun", "row_number": 94762, "definition": "A larva in a stage following the zoea in the development of most crabs. In this stage the legs and abdominal appendages have appeared the abdomen is relatively long and the eyes are large. Also used adjectively.", "details": []}, {"x": -0.7110562026893806, "y": 0.02120243259205526, "z": 0.7028154334312371, "word": "Meloe", "pos_group": "other", "row_number": 94971, "definition": "A genus of beetles without wings but having short oval elytra; the oil beetles. These beetles are sometimes used instead of cantharides for raising blisters. See Oil beetle under Oil.", "details": []}, {"x": -0.5580310201573413, "y": -0.014275463795377976, "z": 0.8296972891817735, "word": "Melolonthidian", "pos_group": "noun", "row_number": 94973, "definition": "A beetle of the genus Melolontha and allied genera. See May beetle under May.", "details": []}, {"x": -0.6487382679148722, "y": 0.14613108071044667, "z": 0.746849628100067, "word": "Mentum", "pos_group": "noun", "row_number": 95206, "definition": "The front median plate of the labium in insects. See Labium.", "details": []}, {"x": -0.6680791159187379, "y": -0.05504573893155469, "z": 0.742051387370657, "word": "Meroistic", "pos_group": "adjective", "row_number": 95380, "definition": "Applied to the ovaries of insects when they secrete vitelligenous cells as well as ova.", "details": []}, {"x": -0.5487123011081155, "y": 0.08121564024646825, "z": 0.8320569874665995, "word": "Mesoderm", "pos_group": "noun", "row_number": 95493, "definition": "The middle body layer in some invertebrates.", "details": []}, {"x": -0.7054706682599214, "y": 0.08155846148709638, "z": 0.704030790224943, "word": "Mesonotum", "pos_group": "noun", "row_number": 95519, "definition": "The dorsal portion of the mesothorax of insects.", "details": []}, {"x": -0.5936493900339559, "y": -0.05536755836239495, "z": 0.8028168129737312, "word": "Mesoscutum", "pos_group": "noun", "row_number": 95535, "definition": "The scutum or dorsal plate of the middle thoracic segment of an insect. See Illust. of Butterfly.", "details": []}, {"x": -0.6016970155158774, "y": 0.14633486879675953, "z": 0.785204946299704, "word": "Mesosternum", "pos_group": "noun", "row_number": 95542, "definition": "The ventral piece of the middle segment of the thorax in insects.", "details": []}, {"x": -0.7017573963314088, "y": -0.014211824515493167, "z": 0.7122742314151924, "word": "Mesothorax", "pos_group": "noun", "row_number": 95547, "definition": "The middle segment of the thorax in insects. See Illust. of Coleoptera.", "details": []}, {"x": -0.546037524648503, "y": 0.02075278907561679, "z": 0.8375036378555727, "word": "Mesotrochal", "pos_group": "adjective", "row_number": 95548, "definition": "Having the middle of the body surrounded by bands of cilia; -- said of the larvae of certain marine annelids.", "details": []}, {"x": -0.6756249682958353, "y": 0.1298901546866374, "z": 0.7257130630839801, "word": "Metabolia", "pos_group": "other", "row_number": 95613, "definition": "A comprehensive group of insects including those that undegro a metamorphosis.", "details": []}, {"x": -0.6402915959680886, "y": -0.0661572712801224, "z": 0.76527765392007, "word": "Metabolian", "pos_group": "noun", "row_number": 95614, "definition": "An insect which undergoes a metamorphosis.", "details": []}, {"x": -0.5626774906194218, "y": 0.11386350663739128, "z": 0.8187973762821101, "word": "Metamere", "pos_group": "noun", "row_number": 95710, "definition": "One of successive or homodynamous parts in animals and plants; one of a series of similar parts that follow one another in a vertebrate or articulate animal as in an earthworm; a segment; a somite. See Illust. of Loeven's larva.", "details": []}, {"x": -0.7125624890189007, "y": 0.0444992800752331, "z": 0.7001960534850041, "word": "Metamorphoses", "pos_group": "other", "row_number": 95728, "definition": "of Metamorphosis", "details": []}, {"x": -0.5690827984749026, "y": -0.033376314043357114, "z": 0.8216025743270603, "word": "Metanotum", "pos_group": "noun", "row_number": 95735, "definition": "The dorsal portion of the metaphorax of insects.", "details": []}, {"x": -0.6307270581132741, "y": 0.15097818605050092, "z": 0.7611760410711013, "word": "Metasternum", "pos_group": "noun", "row_number": 95789, "definition": "The ventral plate of the third or last segment of the thorax of insects.", "details": []}, {"x": -0.6833947609361711, "y": -0.04308810568513844, "z": 0.728776382626015, "word": "Metastome", "pos_group": "noun", "row_number": 95791, "definition": "A median elevation behind the mouth in the arthropods.", "details": []}, {"x": -0.5439495694245047, "y": 0.05870601165581255, "z": 0.8370618078244662, "word": "Metathorax", "pos_group": "noun", "row_number": 95804, "definition": "The last or posterior segment of the thorax in insects. See Illust. of Coleoptera.", "details": []}, {"x": -0.6969690631313417, "y": 0.10278757831661371, "z": 0.7096963003860354, "word": "Microbion", "pos_group": "noun", "row_number": 96076, "definition": "A microscopic organism; -- particularly applied to bacteria and especially to pathogenic forms; as the microbe of fowl cholera.", "details": []}, {"x": -0.6107659904477641, "y": -0.06416940869180776, "z": 0.7892066851595373, "word": "Microlepidoptera", "pos_group": "other", "row_number": 96108, "definition": "A tribe of Lepidoptera including a vast number of minute species as the plume moth clothes moth etc.", "details": []}, {"x": -0.5847564216036788, "y": 0.1380557009586624, "z": 0.7993751002039489, "word": "Microscopical", "pos_group": "adjective", "row_number": 96150, "definition": "Very small; visible only by the aid of a microscope; as a microscopic insect.", "details": []}, {"x": -0.709421585015383, "y": 0.006803083424007204, "z": 0.7047515397430414, "word": "Microsthene", "pos_group": "noun", "row_number": 96159, "definition": "One of a group of mammals having a small size as a typical characteristic. It includes the lower orders as the Insectivora Cheiroptera Rodentia and Edentata.", "details": []}, {"x": -0.5514928330843191, "y": -0.0019797296242590897, "z": 0.8341772807546646, "word": "Mida", "pos_group": "noun", "row_number": 96176, "definition": "The larva of the bean fly.", "details": []}, {"x": -0.6597066851669167, "y": 0.14238053485401878, "z": 0.7379125102888298, "word": "Midge", "pos_group": "noun", "row_number": 96210, "definition": "Any one of many small delicate long-legged flies of the Chironomus and allied genera which do not bite. Their larvae are usually aquatic.", "details": []}, {"x": -0.658121950899597, "y": -0.06184182956853132, "z": 0.7503673006333134, "word": "Midge", "pos_group": "noun", "row_number": 96211, "definition": "A very small fly abundant in many parts of the United States and Canada noted for the irritating quality of its bite.", "details": []}, {"x": -0.5521088878844549, "y": 0.09497826710008997, "z": 0.8283446774728828, "word": "Miller", "pos_group": "noun", "row_number": 96416, "definition": "A moth or lepidopterous insect; -- so called because the wings appear as if covered with white dust or powder like a miller's clothes. Called also moth miller.", "details": []}, {"x": -0.7101101665717776, "y": 0.06803138396094931, "z": 0.7007961773067547, "word": "Mimetical", "pos_group": "other", "row_number": 96486, "definition": "Characterized by mimicry; -- applied to animals and plants; as mimetic species; mimetic organisms. See Mimicry.", "details": []}, {"x": -0.5830859438449436, "y": -0.049204862801954276, "z": 0.8109190240505472, "word": "Miner", "pos_group": "noun", "row_number": 96567, "definition": "Any of numerous insects which in the larval state excavate galleries in the parenchyma of leaves. They are mostly minute moths and dipterous flies.", "details": []}, {"x": -0.6123243479997976, "y": 0.15076161850919784, "z": 0.7760991091549517, "word": "Minge", "pos_group": "noun", "row_number": 96596, "definition": "A small biting fly; a midge.", "details": []}, {"x": -0.6963334088111506, "y": -0.02693520782677201, "z": 0.7172128542857913, "word": "Mire", "pos_group": "noun", "row_number": 96805, "definition": "An ant.", "details": []}, {"x": -0.543085995743257, "y": 0.035075814485141216, "z": 0.8389441509813147, "word": "Mite", "pos_group": "noun", "row_number": 97545, "definition": "A minute arachnid of the order Acarina of which there are many species; as the cheese mite sugar mite harvest mite etc. See Acarina.", "details": []}, {"x": -0.6850941316100881, "y": 0.12147007014958228, "z": 0.7182555623810195, "word": "Mole", "pos_group": "noun", "row_number": 97982, "definition": "Any insectivore of the family Talpidae. They have minute eyes and ears soft fur and very large and strong fore feet.", "details": []}, {"x": -0.628956309764843, "y": -0.068091988514, "z": 0.7744529950275872, "word": "Monarch", "pos_group": "noun", "row_number": 98136, "definition": "A very large red and black butterfly (Danais Plexippus); -- called also milkweed butterfly.", "details": []}, {"x": -0.5696087642036605, "y": 0.12512686026994022, "z": 0.812335598494468, "word": "Mongoos", "pos_group": "noun", "row_number": 98226, "definition": "A species of ichneumon (Herpestes griseus) native of India. Applied also to other allied species as the African banded mongoose (Crossarchus fasciatus).", "details": []}, {"x": -0.7133655031305434, "y": 0.029793650107107213, "z": 0.7001585515842838, "word": "Monomerous", "pos_group": "adjective", "row_number": 98426, "definition": "Having but one joint; -- said of the foot of certain insects.", "details": []}, {"x": -0.5606423484034989, "y": -0.022972365991345098, "z": 0.8277393476073065, "word": "Monomphalus", "pos_group": "noun", "row_number": 98436, "definition": "A form of double monster in which two individuals are united by a common umbilicus.", "details": []}, {"x": -0.6420622456830415, "y": 0.15032593126946267, "z": 0.7517700360192726, "word": "Mormo", "pos_group": "noun", "row_number": 98907, "definition": "A bugbear; false terror.", "details": []}, {"x": -0.6748008922244346, "y": -0.052562289993651444, "z": 0.7361256424848479, "word": "Morpho", "pos_group": "noun", "row_number": 98951, "definition": "Any one of numerous species of large handsome tropical American butterflies of the genus Morpho. They are noted for the very brilliant metallic luster and bright colors (often blue) of the upper surface of the wings. The lower surface is usually brown or gray with eyelike spots.", "details": []}, {"x": -0.5449672782300671, "y": 0.07331878458345896, "z": 0.8352454857619508, "word": "Mosquito", "pos_group": "noun", "row_number": 99098, "definition": "Any one of various species of gnats of the genus Culex and allied genera. The females have a proboscis containing within the sheathlike labium six fine sharp needlelike organs with which they puncture the skin of man and animals to suck the blood. These bites when numerous cause in many persons considerable irritation and swelling with some pain. The larvae and pupae called wigglers are aquatic.", "details": []}, {"x": -0.7037542234967352, "y": 0.09068712933853365, "z": 0.7046317034329661, "word": "Mot", "pos_group": "noun", "row_number": 99132, "definition": "A note or brief strain on a bugle.", "details": []}, {"x": -0.5994179436456383, "y": -0.0609630512711486, "z": 0.7981112924995772, "word": "Moths", "pos_group": "other", "row_number": 99144, "definition": "of Moth", "details": []}, {"x": -0.5943935373450986, "y": 0.1454167643414581, "z": 0.7909173707858754, "word": "Moth", "pos_group": "noun", "row_number": 99145, "definition": "Any nocturnal lepidopterous insect or any not included among the butterflies; as the luna moth; Io moth; hawk moth.", "details": []}, {"x": -0.7062444037506697, "y": -0.007290647599199536, "z": 0.7079305676607311, "word": "Moth", "pos_group": "noun", "row_number": 99146, "definition": "Any lepidopterous insect that feeds upon garments grain etc.; as the clothes moth; grain moth; bee moth. See these terms under Clothes Grain etc.", "details": []}, {"x": -0.5462172055974277, "y": 0.01142781935781424, "z": 0.8375656208644565, "word": "Moth", "pos_group": "noun", "row_number": 99147, "definition": "Any one of various other insects that destroy woolen and fur goods etc. esp. the larvae of several species of beetles of the genera Dermestes and Anthrenus. Carpet moths are often the larvae of Anthrenus. See Carpet beetle under Carpet Dermestes Anthrenus.", "details": []}, {"x": -0.6703561556435735, "y": 0.13668329413364877, "z": 0.7293423761825054, "word": "Moth-eat", "pos_group": "other", "row_number": 99149, "definition": "To eat or prey upon as a moth eats a garment.", "details": []}, {"x": -0.6473717548032983, "y": -0.06687801688979421, "z": 0.7592345763594981, "word": "Mothen", "pos_group": "adjective", "row_number": 99150, "definition": "Full of moths.", "details": []}, {"x": -0.5569952077906148, "y": 0.10809240667827687, "z": 0.8234514983390265, "word": "Mothy", "pos_group": "adjective", "row_number": 99177, "definition": "Infested with moths; moth-eaten.", "details": []}, {"x": -0.7133451644508133, "y": 0.053699616092020994, "z": 0.69875247948484, "word": "Mouse-ear", "pos_group": "noun", "row_number": 99341, "definition": "The forget-me-not (Myosotis palustris) and other species of the same genus.", "details": []}, {"x": -0.5731040735051026, "y": -0.04120548067749704, "z": 0.8184459843471616, "word": "Mucivore", "pos_group": "noun", "row_number": 99499, "definition": "An insect which feeds on mucus or the sap of plants as certain Diptera of the tribe Mucivora.", "details": []}, {"x": -0.6234994938831001, "y": 0.15328339520769022, "z": 0.7666502343840514, "word": "Muckworm", "pos_group": "noun", "row_number": 99515, "definition": "A larva or grub that lives in muck or manure; -- applied to the larvae of the tumbledung and allied beetles.", "details": []}, {"x": -0.6895189513310371, "y": -0.038685879189590974, "z": 0.7232337232919073, "word": "Mudfish", "pos_group": "noun", "row_number": 99570, "definition": "The South American lipedosiren and the allied African species (Protopterus annectens). See Lipedosiren.", "details": []}, {"x": -0.5416382184031677, "y": 0.04987028832751678, "z": 0.8391310950663029, "word": "Mudwall", "pos_group": "noun", "row_number": 99577, "definition": "The European bee-eater. See Bee-eater.", "details": []}, {"x": -0.6937361612562407, "y": 0.11138054995167151, "z": 0.7115648330671764, "word": "Multiped", "pos_group": "noun", "row_number": 99774, "definition": "An insect having many feet as a myriapod.", "details": []}, {"x": -0.6173365168381051, "y": -0.06803495894511336, "z": 0.7837517906451845, "word": "Multisect", "pos_group": "adjective", "row_number": 99811, "definition": "Divided into many similar segments; -- said of an insect or myriapod.", "details": []}, {"x": -0.5777880118383762, "y": 0.1351220454813478, "z": 0.8049242487344959, "word": "Mummiform", "pos_group": "adjective", "row_number": 99874, "definition": "Having some resemblance to a mummy; -- in zoology said of the pupae of certain insects.", "details": []}, {"x": -0.7126117586457201, "y": 0.014965749006707193, "z": 0.7013989647814728, "word": "Musca", "pos_group": "noun", "row_number": 100047, "definition": "A genus of dipterous insects including the common house fly and numerous allied species.", "details": []}, {"x": -0.5532501704745851, "y": -0.011118509425919392, "z": 0.832940950859056, "word": "Muscardine", "pos_group": "noun", "row_number": 100056, "definition": "A disease which is very destructive to silkworms and which sometimes extends to other insects. It is attended by the development of a fungus (provisionally called Botrytis bassiana). Also the fungus itself.", "details": []}, {"x": -0.6534089307282012, "y": 0.1476563882678925, "z": 0.7424650565840186, "word": "Muscid", "pos_group": "noun", "row_number": 100066, "definition": "Any fly of the genus Musca or family Muscidae.", "details": []}, {"x": -0.6651408572978629, "y": -0.06051084851948685, "z": 0.7442621024642566, "word": "Musciform", "pos_group": "adjective", "row_number": 100067, "definition": "Having the form or structure of flies of the genus Musca or family Muscidae.", "details": []}, {"x": -0.547547000427822, "y": 0.08769947283909557, "z": 0.8321665006392887, "word": "Musketo", "pos_group": "noun", "row_number": 100160, "definition": "See Mosquito.", "details": []}, {"x": -0.7093016429808461, "y": 0.07740201429430324, "z": 0.7006426389022131, "word": "Musquito", "pos_group": "noun", "row_number": 100182, "definition": "See Mosquito.", "details": []}, {"x": -0.5883330212084252, "y": -0.05577610783313317, "z": 0.806692805193373, "word": "Mygale", "pos_group": "noun", "row_number": 100371, "definition": "A genus of very large hairy spiders having four lungs and only four spinnerets. They do not spin webs but usually construct tubes in the earth which are often furnished with a trapdoor. The South American bird spider (Mygale avicularia) and the crab spider or matoutou (M. cancerides) are among the largest species. Some of the species are erroneously called tarantulas as the Texas tarantula (M. Hentzii).", "details": []}, {"x": -0.6048814810332624, "y": 0.15104087695916651, "z": 0.7818599921919608, "word": "Myogalid", "pos_group": "noun", "row_number": 100390, "definition": "One of the Myogalodae a family of Insectivora including the desman and allied species.", "details": []}, {"x": -0.7015483723541948, "y": -0.02080367633278803, "z": 0.7123181089220043, "word": "Myriapoda", "pos_group": "other", "row_number": 100443, "definition": "A class or subclass of arthropods related to the hexapod insects from which they differ in having the body made up of num
