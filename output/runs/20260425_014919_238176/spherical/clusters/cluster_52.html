erous similar segments nearly all of which bear true jointed legs. They have one pair of antennae three pairs of mouth organs and numerous trachaae similar to those of true insects. The larvae when first hatched often have but three pairs of legs. See Centiped Galleyworm", "details": []}, {"x": -0.5423314484257354, "y": 0.02571711948045932, "z": 0.8397709388958822, "word": "Myrmicine", "pos_group": "adjective", "row_number": 100460, "definition": "Of or pertaining to Myrmica a genus of ants including the small house ant (M. molesta) and many others.", "details": []}, {"x": -0.6804750676652154, "y": 0.12910354493294018, "z": 0.7213085033269528, "word": "Myrmidonian", "pos_group": "adjective", "row_number": 100463, "definition": "Consisting of or like myrmidons.", "details": []}, {"x": -0.6360133874157522, "y": -0.07001875630963769, "z": 0.7684948567119964, "word": "Mytiloid", "pos_group": "adjective", "row_number": 100539, "definition": "Like or pertaining to the genus Mytilus or family Mytilidae.", "details": []}, {"x": -0.5633102550255908, "y": 0.12029378807030049, "z": 0.8174417172708408, "word": "Myzostomata", "pos_group": "other", "row_number": 100551, "definition": "An order of curious parasitic worms found on crinoids. The body is short and disklike with four pairs of suckers and five pairs of hook-bearing parapodia on the under side.", "details": []}, {"x": -0.7150806673619813, "y": 0.0388174873476836, "z": 0.6979633527923628, "word": "Naiad", "pos_group": "noun", "row_number": 100592, "definition": "One of a group of butterflies. See Nymph.", "details": []}, {"x": -0.5639050250321265, "y": -0.03148023059927673, "z": 0.8252394306047993, "word": "Nail", "pos_group": "noun", "row_number": 100600, "definition": "The basal thickened portion of the anterior wings of certain hemiptera.", "details": []}, {"x": -0.6350205460903738, "y": 0.15380918401540447, "z": 0.7570281639117523, "word": "Natatorious", "pos_group": "adjective", "row_number": 100877, "definition": "Adapted for swimming; -- said of the legs of certain insects.", "details": []}, {"x": -0.68141056116108, "y": -0.049218609017906534, "z": 0.7302445998872465, "word": "Nauplius", "pos_group": "noun", "row_number": 101013, "definition": "A crustacean larva having three pairs of locomotive organs (corresponding to the antennules antennae and mandibles) a median eye and little or no segmentation of the body.", "details": []}, {"x": -0.5417538142593955, "y": 0.06486541292382869, "z": 0.8380305978552439, "word": "Necrobiotic", "pos_group": "adjective", "row_number": 101230, "definition": "Of or pertaining to necrobiosis; as a necrobiotic metamorphosis.", "details": []}, {"x": -0.7013664496601865, "y": 0.09977577286031113, "z": 0.7057831808999084, "word": "Necrophagan", "pos_group": "noun", "row_number": 101245, "definition": "Any species of a tribe (Necrophaga) of beetles which in the larval state feed on carrion; a burying beetle.", "details": []}, {"x": -0.6056449735856168, "y": -0.06594267289747364, "z": 0.7929979381193966, "word": "Necrophore", "pos_group": "noun", "row_number": 101248, "definition": "Any one of numerous species of beetles of the genus Necrophorus and allied genera; -- called also burying beetle carrion beetle sexton beetle.", "details": []}, {"x": -0.5870860327858268, "y": 0.14363053976135706, "z": 0.7966807755655086, "word": "Nectostem", "pos_group": "noun", "row_number": 101282, "definition": "That portion of the axis which bears the nectocalyces in the Siphonophora.", "details": []}, {"x": -0.7102789772378535, "y": 0.00029450817031279687, "z": 0.7039202282637473, "word": "Nematelmia", "pos_group": "other", "row_number": 101462, "definition": "Same as Nemathelminthes.", "details": []}, {"x": -0.5470684552814286, "y": 0.0019923438600318102, "z": 0.8370855008909992, "word": "Nematelminthes", "pos_group": "other", "row_number": 101466, "definition": "An ordr of helminths including the Nematoidea and Gordiacea; the roundworms.", "details": []}, {"x": -0.6645500625341544, "y": 0.1429750656858371, "z": 0.7334380307687776, "word": "Nematocera", "pos_group": "other", "row_number": 101472, "definition": "A suborder of dipterous insects having long antennae as the mosquito gnat and crane fly; -- called also Nemocera.", "details": []}, {"x": -0.6545726300355971, "y": -0.06674882976443652, "z": 0.753046655748075, "word": "Nematoid", "pos_group": "noun", "row_number": 101479, "definition": "One of the Nematoidea. see Illustration in Appendix.", "details": []}, {"x": -0.5516728511600353, "y": 0.1015696260762415, "z": 0.8278530523901512, "word": "Nematoidea", "pos_group": "other", "row_number": 101480, "definition": "An order of worms having a long round and generally smooth body; the roundworms. they are mostly parasites. Called also Nematodea and Nematoda.", "details": []}, {"x": -0.7134766510435128, "y": 0.06315803475233824, "z": 0.6978267199398114, "word": "Nemertina", "pos_group": "other", "row_number": 101490, "definition": "An order of helminths usually having a long slender smooth often bright-colored body covered with minute vibrating cilia; -- called also Nemertea Nemertida and Rhynchocoela.", "details": []}, {"x": -0.5777258576935065, "y": -0.04866310437808315, "z": 0.8147789489331386, "word": "Nepa", "pos_group": "noun", "row_number": 101566, "definition": "A genus of aquatic hemipterus insects. The species feed upon other insects and are noted for their voracity; -- called also scorpion bug and water scorpion.", "details": []}, {"x": -0.6160383006153676, "y": 0.1547825050019823, "z": 0.7723594942254812, "word": "Nereid", "pos_group": "noun", "row_number": 101617, "definition": "Any species of Nereis. The word is sometimes used for similar annelids of other families.", "details": []}, {"x": -0.695387178569067, "y": -0.03346666243206015, "z": 0.7178555943833071, "word": "Nereidian", "pos_group": "noun", "row_number": 101618, "definition": "Any annelid resembling Nereis or of the family Lycoridae or allied families.", "details": []}, {"x": -0.5399384443980707, "y": 0.04063636161361693, "z": 0.840722999789942, "word": "Nerve", "pos_group": "noun", "row_number": 101639, "definition": "One of the nervures or veins in the wings of insects.", "details": []}, {"x": -0.6898578608277651, "y": 0.11974331060534622, "z": 0.7139731587527725, "word": "Neuration", "pos_group": "noun", "row_number": 101747, "definition": "The arrangement or distribution of nerves as in the leaves of a plant or the wings of an insect; nervation.", "details": []}, {"x": -0.624247224550005, "y": -0.07116257658601137, "z": 0.7779789780805493, "word": "Neuropter", "pos_group": "noun", "row_number": 101782, "definition": "One of the Neuroptera.", "details": []}, {"x": -0.5709640716931892, "y": 0.13133055662899928, "z": 0.8104025627618979, "word": "Neuroptera", "pos_group": "other", "row_number": 101783, "definition": "An order of hexapod insects having two pairs of large membranous net-veined wings. The mouth organs are adapted for chewing. They feed upon other insects and undergo a complete metamorphosis. The ant-lion hellgamite and lacewing fly are examples. Formerly the name was given to a much more extensive group including the true Neuroptera and the Pseudoneuroptera.", "details": []}, {"x": -0.7152488769586024, "y": 0.02365510311116519, "z": 0.6984693838002194, "word": "Neurula", "pos_group": "noun", "row_number": 101803, "definition": "An embryo or certain invertebrates in the stage when the primitive band is first developed.", "details": []}, {"x": -0.5556788852333361, "y": -0.020175636370812926, "z": 0.8311521642893496, "word": "Neuter", "pos_group": "noun", "row_number": 101811, "definition": "An organism either vegetable or animal which at its maturity has no generative organs or but imperfectly developed ones as a plant without stamens or pistils as the garden Hydrangea; esp. one of the imperfectly developed females of certain social insects as of the ant and the common honeybee which perform the labors of the community and are called workers.", "details": []}, {"x": -0.6466748487941765, "y": 0.15228487140704164, "z": 0.7474094981183808, "word": "Nibble", "pos_group": "noun", "row_number": 101918, "definition": "A small or cautious bite.", "details": []}, {"x": -0.6721318043884833, "y": -0.05830689041700706, "z": 0.7381321995817423, "word": "Nidus", "pos_group": "noun", "row_number": 102013, "definition": "A nest: a repository for the eggs of birds insects etc.; a breeding place; esp. the place or substance where parasites or the germs of a disease effect lodgment or are developed.", "details": []}, {"x": -0.543463276193195, "y": 0.07978109073926618, "z": 0.8356330803587255, "word": "Nit", "pos_group": "noun", "row_number": 102225, "definition": "The egg of a louse or other small insect.", "details": []}, {"x": -0.7078163248732634, "y": 0.08684237733916013, "z": 0.7010381243134997, "word": "Nitter", "pos_group": "noun", "row_number": 102295, "definition": "The horselouse; an insect that deposits nits on horses.", "details": []}, {"x": -0.594100070784281, "y": -0.061810213473712565, "z": 0.8020128449123785, "word": "Noctuid", "pos_group": "noun", "row_number": 102378, "definition": "Any one of numerous moths of the family Noctuidae or Noctuaelitae as the cutworm moths and armyworm moths; -- so called because they fly at night.", "details": []}, {"x": -0.5973493647061425, "y": 0.1504582870260543, "z": 0.7877410998230024, "word": "Noctuid", "pos_group": "adjective", "row_number": 102379, "definition": "Of or pertaining to the noctuids or family Noctuidae.", "details": []}, {"x": -0.7063750438862239, "y": -0.01393862424223002, "z": 0.7077005101940856, "word": "Nodosarine", "pos_group": "noun", "row_number": 102426, "definition": "A foraminifer of the genus Nodosaria or of an allied genus.", "details": []}, {"x": -0.5422391619879144, "y": 0.016139084019998768, "z": 0.8400691764215847, "word": "Nodose", "pos_group": "adjective", "row_number": 102428, "definition": "Having nodes or prominences; having the alternate joints enlarged as the antennae of certain insects.", "details": []}, {"x": -0.6752682597966712, "y": 0.13632656415431904, "z": 0.7248640184317704, "word": "Nonagrian", "pos_group": "noun", "row_number": 102583, "definition": "Any moth of the genus Nonagria and allied genera as the spindleworm and stalk borer.", "details": []}, {"x": -0.6432749182542153, "y": -0.07112074996437072, "z": 0.7623248772469242, "word": "Nopalry", "pos_group": "noun", "row_number": 102817, "definition": "A plantation of the nopal for raising the cochineal insect.", "details": []}, {"x": -0.5572986803040885, "y": 0.11465515776083005, "z": 0.8223578149018591, "word": "Notodontian", "pos_group": "noun", "row_number": 103080, "definition": "Any one of several species of bombycid moths belonging to Notodonta Nerice and allied genera. The caterpillar of these moths has a hump or spine on its back.", "details": []}, {"x": -0.7161684891810602, "y": 0.04820404190568862, "z": 0.6962607740265656, "word": "Nurse", "pos_group": "noun", "row_number": 103444, "definition": "A peculiar larva of certain trematodes which produces cercariae by asexual reproduction. See Cercaria and Redia.", "details": []}, {"x": -0.5678060890251879, "y": -0.03971694709196472, "z": 0.8222036301182417, "word": "Nyentek", "pos_group": "noun", "row_number": 103549, "definition": "A carnivorous mannual (Helictis moscatus or H. orientalis) native of Eastern Asia and the Indies. It has a dorsal white stripe and another one across the shoulders. It has a strong musky odor.", "details": []}, {"x": -0.6276654909147464, "y": 0.15652968408321444, "z": 0.762584086849155, "word": "Nymph", "pos_group": "noun", "row_number": 103554, "definition": "The pupa of an insect; a chrysalis.", "details": []}, {"x": -0.6878439390082262, "y": -0.04502139428540777, "z": 0.7244610338908819, "word": "Nymph", "pos_group": "noun", "row_number": 103555, "definition": "Any one of a subfamily (Najades) of butterflies including the purples the fritillaries the peacock butterfly etc.; -- called also naiad.", "details": []}, {"x": -0.539114214764997, "y": 0.05591656500259518, "z": 0.8403744410657854, "word": "Nymphales", "pos_group": "other", "row_number": 103561, "definition": "An extensive family of butterflies including the nymphs the satyrs the monarchs the heliconias and others; -- called also brush-footed butterflies.", "details": []}, {"x": -0.6983091628004556, "y": 0.10874109057530118, "z": 0.70748829557062, "word": "Nyula", "pos_group": "noun", "row_number": 103577, "definition": "A species of ichneumon (Herpestes nyula). Its fur is beautifully variegated by closely set zigzag markings.", "details": []}, {"x": -0.6122854890303944, "y": -0.07024464825650231, "z": 0.7875101074361719, "word": "Obliterate", "pos_group": "adjective", "row_number": 103825, "definition": "Scarcely distinct; -- applied to the markings of insects.", "details": []}, {"x": -0.5798390224458506, "y": 0.1409684255772713, "z": 0.8024429020430711, "word": "Occiput", "pos_group": "noun", "row_number": 104130, "definition": "A plate which forms the back part of the head of insects.", "details": []}, {"x": -0.7138109814415335, "y": 0.008493313087614933, "z": 0.7002869029235592, "word": "Ocellus", "pos_group": "noun", "row_number": 104196, "definition": "A little eye; a minute simple eye found in many invertebrates.", "details": []}, {"x": -0.5486006645124654, "y": -0.0074716571805735835, "z": 0.8360511259698519, "word": "Odonata", "pos_group": "other", "row_number": 104385, "definition": "The division of insects that includes the dragon flies.", "details": []}, {"x": -0.6582429860806621, "y": 0.14869493052031493, "z": 0.7379742467818046, "word": "Odontostomatous", "pos_group": "adjective", "row_number": 104410, "definition": "Having toothlike mandibles; -- applied to certain insects.", "details": []}, {"x": -0.6618313098821906, "y": -0.06574769712282716, "z": 0.7467640575058957, "word": "Oestrus", "pos_group": "noun", "row_number": 104461, "definition": "A genus of gadflies. The species which deposits its larvae in the nasal cavities of sheep is oestrus ovis.", "details": []}, {"x": -0.5467668783294631, "y": 0.09433325873161717, "z": 0.8319538551259485, "word": "Ogre", "pos_group": "noun", "row_number": 104635, "definition": "An imaginary monster or hideous giant of fairy tales who lived on human beings; hence any frightful giant; a cruel monster.", "details": []}, {"x": -0.7129366261457813, "y": 0.07279635111600961, "z": 0.6974396449615299, "word": "Oligochaeta", "pos_group": "other", "row_number": 104768, "definition": "An order of Annelida which includes the earthworms and related species.", "details": []}, {"x": -0.5829216482475724, "y": -0.055672004408907044, "z": 0.8106188869804528, "word": "Ommateum", "pos_group": "noun", "row_number": 104856, "definition": "A compound eye as of insects and crustaceans.", "details": []}, {"x": -0.6084028817162265, "y": 0.15543991339532132, "z": 0.778257262634308, "word": "Ommatidium", "pos_group": "noun", "row_number": 104858, "definition": "One of the single eyes forming the compound eyes of crustaceans insects and other invertebrates.", "details": []}, {"x": -0.7009383610883212, "y": -0.027455155664024507, "z": 0.7126932217878058, "word": "Oophorida", "pos_group": "other", "row_number": 105100, "definition": "of Oophoridium", "details": []}, {"x": -0.5388808960708921, "y": 0.031076259698102793, "z": 0.8418085565810128, "word": "Oophoridiums", "pos_group": "other", "row_number": 105101, "definition": "of Oophoridium", "details": []}, {"x": -0.6853500632904984, "y": 0.12779436130962638, "z": 0.7169127505946412, "word": "Oospore", "pos_group": "noun", "row_number": 105113, "definition": "A special kind of spore resulting from the fertilization of an oosphere by antherozoids.", "details": []}, {"x": -0.6314440127292393, "y": -0.073504134688282, "z": 0.7719297901830988, "word": "Ootheca", "pos_group": "noun", "row_number": 105118, "definition": "An egg case especially those of many kinds of mollusks and of some insects as the cockroach. Cf. Ooecium.", "details": []}, {"x": -0.5643484667566623, "y": 0.12669178613613355, "z": 0.8157573164826907, "word": "Ootype", "pos_group": "noun", "row_number": 105121, "definition": "The part of the oviduct of certain trematode worms in which the ova are completed and furnished with a shell.", "details": []}, {"x": -0.7172928819768009, "y": 0.0328074517814987, "z": 0.6959989889166649, "word": "Ophidian", "pos_group": "noun", "row_number": 105270, "definition": "One of the Ophidia; a snake or serpent.", "details": []}, {"x": -0.5587741642330167, "y": -0.029067748941886382, "z": 0.8288102915366974, "word": "Ophidian", "pos_group": "adjective", "row_number": 105271, "definition": "Of or pertaining to the Ophidia; belonging to serpents.", "details": []}, {"x": -0.6395516010979624, "y": 0.15620677525107465, "z": 0.7527105638282839, "word": "Ophidioid", "pos_group": "noun", "row_number": 105273, "definition": "One of the Ophidiidae.", "details": []}, {"x": -0.6790300668546706, "y": -0.055226029776393716, "z": 0.7320302274786735, "word": "Ophidious", "pos_group": "adjective", "row_number": 105276, "definition": "Ophidian.", "details": []}, {"x": -0.5399059803754246, "y": 0.07127655268870077, "z": 0.8387020838126411, "word": "Ophiology", "pos_group": "noun", "row_number": 105281, "definition": "That part of natural history which treats of the ophidians or serpents.", "details": []}, {"x": -0.7056477831457809, "y": 0.09626976266701828, "z": 0.7019924066095593, "word": "Ophiomorpha", "pos_group": "other", "row_number": 105283, "definition": "An order of tailless amphibians having a slender wormlike body with regular annulations and usually with minute scales imbedded in the skin. The limbs are rudimentary or wanting. It includes the caecilians. Called also Gymnophiona and Ophidobatrachia.", "details": []}, {"x": -0.6003482975427189, "y": -0.06723866676228779, "z": 0.7969070732084068, "word": "Ophiophagus", "pos_group": "noun", "row_number": 105287, "definition": "A genus of venomous East Indian snakes which feed on other snakes. Ophiophagus elaps is said to be the largest and most deadly of poisonous snakes.", "details": []}, {"x": -0.5897916314095131, "y": 0.14899555358087044, "z": 0.7936914743982294, "word": "Orbitelae", "pos_group": "other", "row_number": 105631, "definition": "A division of spiders including those that make geometrical webs as the garden spider or Epeira.", "details": []}, {"x": -0.7107584005564082, "y": -0.006381601603670073, "z": 0.703407258421086, "word": "Order", "pos_group": "noun", "row_number": 105710, "definition": "An assemblage of genera having certain important characters in common; as the Carnivora and Insectivora are orders of Mammalia.", "details": []}, {"x": -0.5428266217922434, "y": 0.006421271445732557, "z": 0.8398202343041284, "word": "Oreades", "pos_group": "other", "row_number": 105787, "definition": "A group of butterflies which includes the satyrs. See Satyr 2.", "details": []}, {"x": -0.669502959005433, "y": 0.14306337096004174, "z": 0.7289023664198926, "word": "Organity", "pos_group": "noun", "row_number": 105828, "definition": "Organism.", "details": []}, {"x": -0.6506802830583162, "y": -0.07136584579044784, "z": 0.755990797095946, "word": "Orgyia", "pos_group": "noun", "row_number": 105879, "definition": "A genus of bombycid moths whose caterpillars (esp. those of Orgyia leucostigma) are often very injurious to fruit trees and shade trees. The female is wingless. Called also vaporer moth.", "details": []}, {"x": -0.5516341650908196, "y": 0.1082393747905865, "z": 0.8270332433762848, "word": "Ortalidian", "pos_group": "noun", "row_number": 106063, "definition": "Any one of numerous small two-winged flies of the family Ortalidae. The larvae of many of these flies live in fruit; those of others produce galls on various plants.", "details": []}, {"x": -0.7166009455621138, "y": 0.05787930050001155, "z": 0.6950777448552885, "word": "Orthoptera", "pos_group": "other", "row_number": 106132, "definition": "An order of mandibulate insects including grasshoppers locusts cockroaches etc. See Illust. under Insect.", "details": []}, {"x": -0.5723267228593314, "y": -0.04760179492437929, "z": 0.8186428961525749, "word": "Orthopteran", "pos_group": "noun", "row_number": 106133, "definition": "One of the Orthoptera.", "details": []}, {"x": -0.620052854360674, "y": 0.15844243773353553, "z": 0.7683947239044757, "word": "Orvet", "pos_group": "noun", "row_number": 106157, "definition": "The blindworm.", "details": []}, {"x": -0.6940376081974698, "y": -0.03998503938371655, "z": 0.7188275141040569, "word": "Oryx", "pos_group": "noun", "row_number": 106171, "definition": "A genus of African antelopes which includes the gemsbok the leucoryx the bisa antelope (O. beisa) and the beatrix antelope (O. beatrix) of Arabia.", "details": []}, {"x": -0.5370862026494525, "y": 0.04653846647593479, "z": 0.8422425909805676, "word": "Osculant", "pos_group": "adjective", "row_number": 106210, "definition": "Adhering closely; embracing; -- applied to certain creeping animals as caterpillars.", "details": []}, {"x": -0.6945901705135487, "y": 0.11749982991274883, "z": 0.7097452254129186, "word": "Osmaterium", "pos_group": "noun", "row_number": 106241, "definition": "One of a pair of scent organs which the larvae of certain butterflies emit from the first body segment either above or below.", "details": []}, {"x": -0.6192902470220012, "y": -0.07381246106389157, "z": 0.7816849176843059, "word": "Otter", "pos_group": "noun", "row_number": 106465, "definition": "The larva of the ghost moth. It is very injurious to hop vines.", "details": []}, {"x": -0.5727173049983479, "y": 0.13743035809498075, "z": 0.8081508431161318, "word": "Ovariole", "pos_group": "noun", "row_number": 106964, "definition": "One of the tubes of which the ovaries of most insects are composed.", "details": []}, {"x": -0.7167941236404805, "y": 0.017249333552551375, "z": 0.6970714775447842, "word": "Ovenbird", "pos_group": "noun", "row_number": 106991, "definition": "Any species of the genus Furnarius allied to the creepers. They inhabit South America and the West Indies and construct curious oven-shaped nests.", "details": []}, {"x": -0.5508172795051933, "y": -0.016880909244584078, "z": 0.8344551273145693, "word": "Ovigerons", "pos_group": "adjective", "row_number": 107770, "definition": "Bearing eggs; oviferous.", "details": []}, {"x": -0.6514761464161648, "y": 0.15377654588677875, "z": 0.7429209948479552, "word": "Oviposit", "pos_group": "other", "row_number": 107778, "definition": "To lay or deposit eggs; -- said esp. of insects.", "details": []}, {"x": -0.6690835682380477, "y": -0.06386008832377575, "z": 0.7404384294680558, "word": "Oviposition", "pos_group": "noun", "row_number": 107781, "definition": "The depositing of eggs esp. by insects.", "details": []}, {"x": -0.5423307614040118, "y": 0.08642823538960326, "z": 0.8357077870657805, "word": "Ovipositor", "pos_group": "noun", "row_number": 107782, "definition": "The organ with which many insects and some other animals deposit their eggs. Some ichneumon files have a long ovipositor fitted to pierce the eggs or larvae of other insects in order to lay their own eggs within the same.", "details": []}, {"x": -0.7117104841238985, "y": 0.08253378146565135, "z": 0.6976075986578028, "word": "Paedogenesis", "pos_group": "noun", "row_number": 108244, "definition": "Reproduction by young or larval animals.", "details": []}, {"x": -0.5886594977246061, "y": -0.062158005496457634, "z": 0.8059878275081557, "word": "Paedogenetic", "pos_group": "adjective", "row_number": 108245, "definition": "Producing young while in the immature or larval state; -- said of certain insects etc.", "details": []}, {"x": -0.6006549517278095, "y": 0.1552270494249425, "z": 0.7842947099730365, "word": "Page", "pos_group": "noun", "row_number": 108266, "definition": "Any one of several species of beautiful South American moths of the genus Urania.", "details": []}, {"x": -0.7061134545874548, "y": -0.0206834215703459, "z": 0.70779657057852, "word": "Palmer", "pos_group": "noun", "row_number": 108677, "definition": "A palmerworm.", "details": []}, {"x": -0.5384909064352209, "y": 0.021265835700450906, "z": 0.8423629312348305, "word": "Palmer", "pos_group": "noun", "row_number": 108678, "definition": "Short for Palmer fly an artificial fly made to imitate a hairy caterpillar; a hackle.", "details": []}, {"x": -0.6802344712116689, "y": 0.1354539260853183, "z": 0.7203702506929714, "word": "Palmerworm", "pos_group": "noun", "row_number": 108679, "definition": "Any hairy caterpillar which appears in great numbers devouring herbage and wandering about like a palmer. The name is applied also to other voracious insects.", "details": []}, {"x": -0.6388695423119648, "y": -0.07501787252946215, "z": 0.7656487619706924, "word": "Palmerworm", "pos_group": "noun", "row_number": 108680, "definition": "In America the larva of any one of several moths which destroys the foliage of fruit and forest trees esp. the larva of Ypsolophus pometellus which sometimes appears in vast numbers.", "details": []}, {"x": -0.5580040359288063, "y": 0.12122395035110932, "z": 0.8209362032146197, "word": "Palpator", "pos_group": "noun", "row_number": 108714, "definition": "One of a family of clavicorn beetles including those which have very long maxillary palpi.", "details": []}, {"x": -0.7187084683373755, "y": 0.04235416558082192, "z": 0.6940203615154934, "word": "Palpicorn", "pos_group": "noun", "row_number": 108721, "definition": "One of a group of aquatic beetles (Palpicornia) having short club-shaped antennae and long maxillary palpi.", "details": []}, {"x": -0.5625252128029997, "y": -0.03771187319185731, "z": 0.8259196084252397, "word": "Palpiger", "pos_group": "noun", "row_number": 108724, "definition": "That portion of the labium which bears the palpi in insects.", "details": []}, {"x": -0.6320904167306586, "y": 0.15936839841583372, "z": 0.7583293602806331, "word": "Palpus", "pos_group": "noun", "row_number": 108734, "definition": "A feeler; especially one of the jointed sense organs attached to the mouth organs of insects arachnids crustaceans and annelids; as the mandibular palpi maxillary palpi and labial palpi. The palpi of male spiders serve as sexual organs. Called also palp. See Illust. of Arthrogastra and Orthoptera.", "details": []}, {"x": -0.6857709038318879, "y": -0.05127207523240339, "z": 0.72600925735073, "word": "Pangolin", "pos_group": "noun", "row_number": 108940, "definition": "Any one of several species of Manis Pholidotus and related genera found in Africa and Asia. They are covered with imbricated scales and feed upon ants. Called also scaly ant-eater.", "details": []}, {"x": -0.536919333217848, "y": 0.062245187212804955, "z": 0.8413341585159517, "word": "Panoistic", "pos_group": "adjective", "row_number": 108980, "definition": "Producing ova only; -- said of the ovaries of certain insects which do not produce vitelligenous cells.", "details": []}, {"x": -0.7027955690583734, "y": 0.10560049959402695, "z": 0.7035104282080039, "word": "Panorpid", "pos_group": "noun", "row_number": 108993, "definition": "Any neuropterous insect of the genus Panorpa and allied genera. The larvae feed on plant lice.", "details": []}, {"x": -0.6070341330963079, "y": -0.07199743610922711, "z": 0.7914075627953725, "word": "Papilio", "pos_group": "noun", "row_number": 109158, "definition": "A genus of butterflies.", "details": []}, {"x": -0.5822729713428406, "y": 0.14664195024101584, "z": 0.7996588805691406, "word": "Papilionaceous", "pos_group": "adjective", "row_number": 109159, "definition": "Resembling the butterfly.", "details": []}, {"x": -0.7146466336095727, "y": 0.001819162380893794, "z": 0.6994832948103457, "word": "Papiliones", "pos_group": "other", "row_number": 109162, "definition": "The division of Lepidoptera which includes the butterflies.", "details": []}, {"x": -0.5441055156567549, "y": -0.0033544753423931225, "z": 0.8390100925060879, "word": "Papilionides", "pos_group": "other", "row_number": 109163, "definition": "The typical butterflies.", "details": []}, {"x": -0.6632137510121617, "y": 0.14924152700660318, "z": 0.7333992685332564, "word": "Paraglossa", "pos_group": "noun", "row_number": 109327, "definition": "One of a pair of small appendages of the lingua or labium of certain insects. See Illust. under Hymenoptera.", "details": []}, {"x": -0.6581667941667315, "y": -0.07072909352205575, "z": 0.7495424380152438, "word": "Parapleura", "pos_group": "noun", "row_number": 109503, "definition": "A chitinous piece between the metasternum and the pleuron of certain insects.", "details": []}, {"x": -0.5463745492103973, "y": 0.10108210380199807, "z": 0.8314188236178546, "word": "Parapterum", "pos_group": "noun", "row_number": 109509, "definition": "A special plate situated on the sides of the mesothorax and metathorax of certain insects.", "details": []}, {"x": -0.7163554520458081, "y": 0.0677657195875268, "z": 0.6944369471543334, "word": "Parasita", "pos_group": "other", "row_number": 109520, "definition": "An artificial group formerly made for parasitic insects as lice ticks mites etc.", "details": []}, {"x": -0.577442374674583, "y": -0.05505610786020425, "z": 0.8145729733531943, "word": "Parasital", "pos_group": "adjective", "row_number": 109522, "definition": "Of or pertaining to parasites; parasitic.", "details": []}, {"x": -0.6122414273725642, "y": 0.15950901128410827, "z": 0.7744141720862109, "word": "Parasite", "pos_group": "noun", "row_number": 109526, "definition": "An animal which lives during the whole or part of its existence on or in the body of some other animal feeding upon its food blood or tissues as lice tapeworms etc.", "details": []}, {"x": -0.6999294376738069, "y": -0.03413155696099385, "z": 0.7133959763672956, "word": "Parasite", "pos_group": "noun", "row_number": 109527, "definition": "An animal which steals the food of another as the parasitic jager.", "details": []}, {"x": -0.5357025865596066, "y": 0.036802017361030864, "z": 0.843604380187482, "word": "Parasitical", "pos_group": "adjective", "row_number": 109530, "definition": "Of the nature of a parasite; fawning for food or favors; sycophantic.", "details": []}, {"x": -0.6902232404046623, "y": 0.1259694654151542, "z": 0.712547242074733, "word": "Parasitical", "pos_group": "adjective", "row_number": 109531, "definition": "Of or pertaining to parasites; living on or deriving nourishment from some other living animal or plant. See Parasite 2 & 3.", "details": []}, {"x": -0.6266061307144738, "y": -0.07659534222164538, "z": 0.7755629635954676, "word": "Parasitism", "pos_group": "noun", "row_number": 109533, "definition": "The state or behavior of a parasite; the act of a parasite.", "details": []}, {"x": -0.5657854308674366, "y": 0.13302402135752153, "z": 0.8137514706346298, "word": "Parasitism", "pos_group": "noun", "row_number": 109534, "definition": "The state of being parasitic.", "details": []}, {"x": -0.7191863515789777, "y": 0.026500458892969318, "z": 0.6943116860466783, "word": "Parnassian", "pos_group": "noun", "row_number": 109793, "definition": "Any one of numerous species of butterflies belonging to the genus Parnassius. They inhabit the mountains both in the Old World and in America.", "details": []}, {"x": -0.5537157416630446, "y": -0.026151515008004906, "z": 0.8322950052098899, "word": "Patagium", "pos_group": "noun", "row_number": 110383, "definition": "One of a pair of small vesicular organs situated at the bases of the anterior wings of lepidopterous insects. See Illust. of Butterfly.", "details": []}, {"x": -0.6442953774956044, "y": 0.15815832844238287, "z": 0.7482442179409796, "word": "Patellula", "pos_group": "noun", "row_number": 110428, "definition": "A cuplike sucker on the feet of certain insects.", "details": []}, {"x": -0.6762643809411847, "y": -0.06107911394562357, "z": 0.734122489036982, "word": "Paxilli", "pos_group": "other", "row_number": 110781, "definition": "of Paxillus", "details": []}, {"x": -0.5384145349000578, "y": 0.0779059946871357, "z": 0.8390711796982199, "word": "Pebrine", "pos_group": "noun", "row_number": 110941, "definition": "An epidemic disease of the silkworm characterized by the presence of minute vibratory corpuscles in the blood.", "details": []}, {"x": -0.7097894866523171, "y": 0.09228758761420923, "z": 0.6983422411756216, "word": "Pecten", "pos_group": "noun", "row_number": 110980, "definition": "The comb of a scorpion. See Comb 4 (b).", "details": []}, {"x": -0.5949022446558594, "y": -0.06805055900317598, "z": 0.8009122553206283, "word": "Pectinated", "pos_group": "adjective", "row_number": 110987, "definition": "Having very narrow close divisions in arrangement and regularity resembling those of a comb; comblike; as a pectinate leaf; pectinated muscles. See Illust. (e) of Antennae.", "details": []}, {"x": -0.5928580458362621, "y": 0.15412264477023485, "z": 0.790421120578288, "word": "Pedicellariae", "pos_group": "other", "row_number": 111121, "definition": "of Pedicellaria", "details": []}, {"x": -0.7108559447122401, "y": -0.013190664360218452, "z": 0.7032139306363353, "word": "Pediculina", "pos_group": "other", "row_number": 111131, "definition": "A division of parasitic hemipterous insects including the true lice. See Illust. in Appendix.", "details": []}, {"x": -0.5387882569091802, "y": 0.011284170186652301, "z": 0.8423656460943583, "word": "Pediculus", "pos_group": "noun", "row_number": 111134, "definition": "A genus of wingless parasitic Hemiptera including the common lice of man. See Louse.", "details": []}, {"x": -0.674538443379867, "y": 0.1426446121525258, "z": 0.7243275523038741, "word": "Pedipalpi", "pos_group": "other", "row_number": 111146, "definition": "A division of Arachnida including the whip scorpions (Thelyphonus) and allied forms. Sometimes used in a wider sense to include also the true scorpions.", "details": []}, {"x": -0.646463685777518, "y": -0.07566877157149557, "z": 0.7591830740867498, "word": "Pedipalpus", "pos_group": "noun", "row_number": 111149, "definition": "One of the second pair of mouth organs of arachnids. In some they are leglike but in others as the scorpion they terminate in a claw.", "details": []}, {"x": -0.5519920730617667, "y": 0.1149528242722841, "z": 0.825887764450351, "word": "Pela", "pos_group": "noun", "row_number": 111270, "definition": "See Wax insect under Wax.", "details": []}, {"x": -0.7194653978596087, "y": 0.052222212006120275, "z": 0.6925621862734804, "word": "Pentail", "pos_group": "noun", "row_number": 111656, "definition": "A peculiar insectivore (Ptilocercus Lowii) of Borneo; -- so called from its very long quill-shaped tail which is scaly at the base and plumose at the tip.", "details": []}, {"x": -0.5669153093579503, "y": -0.04602610196951217, "z": 0.8224892886555252, "word": "Pentamera", "pos_group": "other", "row_number": 111658, "definition": "An extensive division of Coleoptera including those that normally have five-jointed tarsi. It embraces about half of all the known species of the Coleoptera.", "details": []}, {"x": -0.6243461968777568, "y": 0.16172201628100596, "z": 0.7642236687608459, "word": "Perichaetous", "pos_group": "adjective", "row_number": 112080, "definition": "Surrounded by setae; -- said of certain earthworms (genus Perichaetus).", "details": []}, {"x": -0.6922900872118299, "y": -0.04645658193262735, "z": 0.7201223653958915, "word": "Perimorph", "pos_group": "noun", "row_number": 112151, "definition": "A crystal of one species inclosing one of another species. See Endomorph.", "details": []}, {"x": -0.5345431262657834, "y": 0.052751768437352166, "z": 0.8434932703280652, "word": "Peripatus", "pos_group": "noun", "row_number": 112209, "definition": "A genus of lowly organized arthropods found in South Africa Australia and tropical America. It constitutes the order Malacopoda.", "details": []}, {"x": -0.699265251687241, "y": 0.11475063478981612, "z": 0.7055922332325615, "word": "Perisome", "pos_group": "noun", "row_number": 112256, "definition": "The entire covering of an invertebrate animal as echinoderm or coelenterate; the integument.", "details": []}, {"x": -0.6141095643612484, "y": -0.07602751944946894, "z": 0.7855502907175315, "word": "Peritreme", "pos_group": "noun", "row_number": 112295, "definition": "That part of the integument of an insect which surrounds the spiracles.", "details": []}, {"x": -0.5748586103218567, "y": 0.14339444993416872, "z": 0.805590224535341, "word": "Perlid", "pos_group": "noun", "row_number": 112337, "definition": "Any insect of the genus Perla or family Perlidae. See Stone fly under Stone.", "details": []}, {"x": -0.7179915897474033, "y": 0.010609115163011253, "z": 0.6959709216105614, "word": "Pernyi moth", "pos_group": "other", "row_number": 112404, "definition": "A silk-producing moth (Attacus Pernyi) which feeds upon the oak. It has been introduced into Europe and America from China.", "details": []}, {"x": -0.5460816053133735, "y": -0.013104689260636897, "z": 0.8376294810103994, "word": "Pest", "pos_group": "noun", "row_number": 112783, "definition": "Anything which resembles a pest; one who or that which is troublesome noxious mischievous or destructive; a nuisance.", "details": []}, {"x": -0.6564403043025813, "y": 0.15479252308786648, "z": 0.7383260808634806, "word": "Pestalozzian", "pos_group": "noun", "row_number": 112785, "definition": "An advocate or follower of the system of Pestalozzi.", "details": []}, {"x": -0.665670195663053, "y": -0.06919296126427706, "z": 0.7430313080331091, "word": "Pestiferous", "pos_group": "adjective", "row_number": 112797, "definition": "Pest-bearing; pestilential; noxious to health; malignant; infectious; contagious; as pestiferous bodies.", "details": []}, {"x": -0.5415749016210649, "y": 0.0932260190280058, "z": 0.8354672556781167, "word": "Pestilentious", "pos_group": "adjective", "row_number": 112806, "definition": "Pestilential.", "details": []}, {"x": -0.7154150786015891, "y": 0.07778283852998218, "z": 0.6943566053114931, "word": "Phaeton", "pos_group": "noun", "row_number": 113014, "definition": "A handsome American butterfly (Euphydryas / Melitaea Phaeton). The upper side of the wings is black with orange-red spots and marginal crescents and several rows of cream-colored spots; -- called also Baltimore.", "details": []}, {"x": -0.5831229257378402, "y": -0.0620039285943234, "z": 0.81001430006995, "word": "Phalaena", "pos_group": "noun", "row_number": 113024, "definition": "A linnaean genus which included the moths in general.", "details": []}, {"x": -0.6042925547088499, "y": 0.15969788316946404, "z": 0.7805940650777737, "word": "Phalaenid", "pos_group": "noun", "row_number": 113025, "definition": "Any moth of the family Phalaenidae of which the cankerworms are examples; a geometrid.", "details": []}, {"x": -0.7054590981074874, "y": -0.027490443084626462, "z": 0.7082172946464815, "word": "Phalangides", "pos_group": "other", "row_number": 113032, "definition": "of Phalangid", "details": []}, {"x": -0.5349909641359532, "y": 0.026782239794853367, "z": 0.8444331707864479, "word": "Phalangid", "pos_group": "noun", "row_number": 113033, "definition": "One of the Phalangoidea.", "details": []}, {"x": -0.6852280223395367, "y": 0.13406887750909402, "z": 0.7158827372440957, "word": "Phalangious", "pos_group": "adjective", "row_number": 113034, "definition": "Of or pertaining to Phalangoidea.", "details": []}, {"x": -0.6341765609018793, "y": -0.07854871844178452, "z": 0.7691880059087103, "word": "Phalangoidea", "pos_group": "other", "row_number": 113039, "definition": "A division of Arachnoidea including the daddy longlegs or harvestman (Phalangium) and many similar kinds. They have long slender many-jointed legs; usually a rounded segmented abdomen; and chelate jaws. They breathe by tracheae. Called also Phalangides Phalangidea Phalangiida and Opilionea.", "details": []}, {"x": -0.5591071730720462, "y": 0.12776482976449666, "z": 0.8191918684256053, "word": "Phallus", "pos_group": "noun", "row_number": 113062, "definition": "A genus of fungi which have a fetid and disgusting odor; the stinkhorn.", "details": []}, {"x": -0.7209502222004455, "y": 0.03617937578873041, "z": 0.6920417833315169, "word": "Phaneroglossal", "pos_group": "adjective", "row_number": 113073, "definition": "Having a conspicious tongue; -- said of certain reptiles and insects.", "details": []}, {"x": -0.5572874731117412, "y": -0.035199636648781535, "z": 0.829573178141943, "word": "Phasmid", "pos_group": "noun", "row_number": 113161, "definition": "Any orthopterous insect of the family Phasmidae as a leaf insect or a stick insect.", "details": []}, {"x": -0.6367507795617745, "y": 0.16178398593656265, "z": 0.75390608607568, "word": "Philander", "pos_group": "noun", "row_number": 113223, "definition": "An Australian bandicoot (Perameles lagotis).", "details": []}, {"x": -0.6833084527964873, "y": -0.05740562737150949, "z": 0.7278695984054794, "word": "Phono", "pos_group": "noun", "row_number": 113423, "definition": "A South American butterfly (Ithonia phono) having nearly transparent wings.", "details": []}, {"x": -0.5350643661387597, "y": 0.06882410109407584, "z": 0.8420031871656541, "word": "Phoronis", "pos_group": "noun", "row_number": 113458, "definition": "A remarkable genus of marine worms having tentacles around the mouth. It is usually classed with the gephyreans. Its larva (Actinotrocha) undergoes a peculiar metamorphosis.", "details": []}, {"x": -0.7071708690915753, "y": 0.10197374199645655, "z": 0.6996504254636782, "word": "Phryganeid", "pos_group": "noun", "row_number": 113631, "definition": "Any insect belonging to the Phryganeides.", "details": []}, {"x": -0.6016077864202951, "y": -0.07328334162182408, "z": 0.7954229209415654, "word": "Phryganeides", "pos_group": "other", "row_numb etails": []}, {"x": -0.5719219062416017, "y": -0.05393027177386548, "z": 0.8185333584817235, "word": "Physophorae", "pos_group": "other", "row_number": 113802, "definition": "An order of Siphonophora furnished with an air sac or float and a series of nectocalyces. See Illust. under Nectocalyx.", "details": []}, {"x": -0.6163770878105546, "y": 0.16322630802121926, "z": 0.7703482705841183, "word": "Physopod", "pos_group": "noun", "row_number": 113803, "definition": "One of the Physopoda; a thrips.", "details": []}, {"x": -0.6985244305208698, "y": -0.0407988042381539, "z": 0.7144221983800836, "word": "Physopoda", "pos_group": "other", "row_number": 113804, "definition": "Same as Thysanoptera.", "details": []}, {"x": -0.5328123695275422, "y": 0.04286601915168499, "z": 0.8451470187372925, "word": "Phytophaga", "pos_group": "other", "row_number": 113838, "definition": "A division of Hymenoptera; the sawflies.", "details": []}, {"x": -0.6950684092340677, "y": 0.12363661784912375, "z": 0.7082329371129615, "word": "Piercer", "pos_group": "noun", "row_number": 114136, "definition": "The ovipositor or sting of an insect.", "details": []}, {"x": -0.621522499334971, "y": -0.07927545822184556, "z": 0.7793748677909283, "word": "Piercer", "pos_group": "noun", "row_number": 114137, "definition": "An insect provided with an ovipositor.", "details": []}, {"x": -0.5676137790205814, "y": 0.1392577971124263, "z": 0.8114319834769694, "word": "Pierid", "pos_group": "noun", "row_number": 114140, "definition": "Any butterfly of the genus Pieris and related genera. See Cabbage butterfly under Cabbage.", "details": []}, {"x": -0.7207491879914955, "y": 0.019927788500681103, "z": 0.6929094394327966, "word": "Pilidium", "pos_group": "noun", "row_number": 114308, "definition": "The free-swimming hat-shaped larva of certain nemertean worms. It has no resemblance to its parent and the young worm develops in its interior.", "details": []}, {"x": -0.5487546425542998, "y": -0.02274495248909123, "z": 0. plants; as a plant-eating beetle.", "details": []}, {"x": -0.5349734630918409, "y": 0.016557689370956002, "z": 0.8447065980032462, "word": "Planula", "pos_group": "noun", "row_number": 115341, "definition": "The very young free-swimming larva of the coelenterates. It usually has a flattened oval or oblong form and is entirely covered with cilia.", "details": []}, {"x": -0.6796299245831684, "y": 0.14171902599670747, "z": 0.7197352869504325, "word": "Plasmodia", "pos_group": "other", "row_number": 115375, "definition": "of Plasmodium", "details": []}, {"x": -0.6419419376940408, "y": -0.07963461665338975, "z": 0.7626066328455896, "word": "Plasmodium", "pos_group": "noun", "row_number": 115377, "definition": "A naked mobile mass of protoplasm formed by the union of several amoebalike young and constituting one of the stages in the life cycle of Mycetozoa and other low organisms.", "details": []}, {"x": -0.5527449997461916, "y": 0.12167585077868845, "z": 0.8244197672259348, "word": "Platyelminthes", "pos_group": "other", "row_number": 115539, "definition": "A class of helminthes including the cestodes or tapeworms the trematodes and the turbellarians. Called also flatworms.", "details": []}, {"x": -0.7220532377525056, "y": 0.04621408680200579, "z": 0.6902922424829793, "word": "Platyptera", "pos_group": "other", "row_number": 115544, "definition": "A division of Pseudoneuroptera including the species which have four broad flat wings as the termites or white-ants and the stone flies (Perla).", "details": []}, {"x": -0.5615179086640939, "y": -0.04394218325362935, "z": 0.8262969942946704, "word": "Pleuron", "pos_group": "noun", "row_number": 115851, "definition": "One of the lateral pieces of a somite of an insect.", "details": []}, {"x": -0.6288963357904205, "y": 0.16460301229620766, "z": 0.7598652822523195, "word": "Plumous", "pos_group": "adjective", "row_number": 116096, "definition": "Having hairs or other parts arranged along an axis like a feather; feathery; plumelike
