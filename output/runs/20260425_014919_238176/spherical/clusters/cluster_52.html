oa. See Anthozoa Madreporaria Hydroid.", "details": []}, {"x": -0.560603178040396, "y": 0.13424452032368858, "z": 0.8171306416565656, "word": "Polyphemus", "pos_group": "noun", "row_number": 117065, "definition": "A very large American moth (Telea polyphemus) belonging to the Silkworm family (Bombycidae). Its larva which is very large bright green with silvery tubercles and with oblique white stripes on the sides feeds on the oak chestnut willow cherry apple and other trees. It produces a large amount of strong silk. Called also American silkworm.", "details": []}, {"x": -0.7228798082364067, "y": 0.029709255113034037, "z": 0.6903348050074866, "word": "Polystomata", "pos_group": "other", "row_number": 117124, "definition": "A division of trematode worms having more two suckers. Called also Polystomea and Polystoma.", "details": []}, {"x": -0.5521183312948759, "y": -0.03219058251011537, "z": 0.8331441139717793, "word": "Postfurca", "pos_group": "noun", "row_number": 117885, "definition": "One of the internal thoracic processes of the sternum of an insect.", "details": []}, {"x": -0.6416229830994002, "y": 0.16376212624237352, "z": 0.7493343136192308, "word": "Postscutellum", "pos_group": "noun", "row_number": 117982, "definition": "The hindermost dorsal piece of a thoracic somite of an insect; the plate behind the scutellum.", "details": []}, {"x": -0.6804659159936494, "y": -0.06339060172666705, "z": 0.7300327176117897, "word": "Praetores", "pos_group": "other", "row_number": 118456, "definition": "A division of butterflies including the satyrs.", "details": []}, {"x": -0.5335591445453234, "y": 0.07562126360708091, "z": 0.8423752511574227, "word": "Preocular", "pos_group": "adjective", "row_number": 119227, "definition": "Placed just in front of the eyes as the antennae of certain insects.", "details": []}, {"x": -0.7114112439498923, "y": 0.09787661546117066, "z": 0.6959268712497981, "word": "Prescutum", "pos_group": "noun", "row_number": 119403, "definition": "The first of the four pieces composing the dorsal part or tergum of a thoracic segment of an insect. It is usually small and inconspicuous.", "details": []}, {"x": -0.5960317306991815, "y": -0.07409362266438531, "z": 0.799535059318981, "word": "Press", "pos_group": "noun", "row_number": 119524, "definition": "An East Indian insectivore (Tupaia ferruginea). It is arboreal in its habits and has a bushy tail. The fur is soft and varies from rusty red to maroon and to brownish black.", "details": []}, {"x": -0.5882376816787821, "y": 0.1573527520294403, "z": 0.7932317071839307, "word": "Prey", "pos_group": "noun", "row_number": 119793, "definition": "The act of devouring other creatures; ravage.", "details": []}, {"x": -0.7152026224352656, "y": -0.011999496716652264, "z": 0.6988141533628708, "word": "Procris", "pos_group": "noun", "row_number": 120459, "definition": "Any species of small moths of the genus Procris. The larvae of some species injure the grapevine by feeding in groups upon the leaves.", "details": []}, {"x": -0.5356665227306824, "y": 0.006209834587915477, "z": 0.8444067825284269, "word": "Proglottis", "pos_group": "noun", "row_number": 120717, "definition": "One of the free or nearly free segments of a tapeworm. It contains both male and female reproductive organs and is capable of a brief independent existence.", "details": []}, {"x": -0.6734599443417743, "y": 0.14884361254969042, "z": 0.7240837536986531, "word": "Progne", "pos_group": "noun", "row_number": 120724, "definition": "An American butterfly (Polygonia / Vanessa Progne). It is orange and black above grayish beneath with an L-shaped silver mark on the hind wings. Called also gray comma.", "details": []}, {"x": -0.6498401089740641, "y": -0.07982202029585872, "z": 0.7558678970855054, "word": "Proleg", "pos_group": "noun", "row_number": 120818, "definition": "One of the fleshy legs found on the abdominal segments of the larvae of Lepidoptera sawflies and some other insects. Those of Lepidoptera have a circle of hooks. Called also proped propleg and falseleg.", "details": []}, {"x": -0.5467595527802611, "y": 0.11478766769000996, "z": 0.8293839778955323, "word": "Promethea", "pos_group": "noun", "row_number": 120906, "definition": "A large American bombycid moth (Callosamia promethea). Its larva feeds on the sassafras wild cherry and other trees and suspends its cocoon from a branch by a silken band.", "details": []}, {"x": -0.7224681460767368, "y": 0.056528469164385434, "z": 0.6890894790071709, "word": "Promuscis", "pos_group": "noun", "row_number": 120991, "definition": "The proboscis of hemipterous insects. See Illust. under Hemiptera.", "details": []}, {"x": -0.5663865744715074, "y": -0.05229749762262142, "z": 0.8224787048920134, "word": "Pronotum", "pos_group": "noun", "row_number": 121027, "definition": "The dorsal plate of the prothorax in insects. See Illust. of Coleoptera.", "details": []}, {"x": -0.6207894959219784, "y": 0.1665711415538404, "z": 0.7660773176085992, "word": "Prophragma", "pos_group": "noun", "row_number": 121177, "definition": "An internal dorsal chitinous process between the first two divisions of the thorax of insects.", "details": []}, {"x": -0.6967270403567777, "y": -0.047423440228085596, "z": 0.7157670351117172, "word": "Propodium", "pos_group": "noun", "row_number": 121225, "definition": "The segment which forms the posterior part of the thorax of a hymenopterous insect.", "details": []}, {"x": -0.5302251462608675, "y": 0.049239599642742604, "z": 0.846425871591638, "word": "Proscolex", "pos_group": "noun", "row_number": 121352, "definition": "An early larval form of a trematode worm; a redia. See Redia.", "details": []}, {"x": -0.699859903337436, "y": 0.12080463073185625, "z": 0.7039903102275307, "word": "Prosternum", "pos_group": "noun", "row_number": 121476, "definition": "The ventral plate of the prothorax of an insect.", "details": []}, {"x": -0.6162160562593912, "y": -0.0815288195978741, "z": 0.7833459156612105, "word": "Prothorax", "pos_group": "noun", "row_number": 121617, "definition": "The first or anterior segment of the thorax in insects. See Illusts. of Butterfly and Coleoptera.", "details": []}, {"x": -0.5698253528387831, "y": 0.1453612164032442, "z": 0.8088072601231554, "word": "Protovertebrae", "pos_group": "other", "row_number": 121675, "definition": "of Protovertebra", "details": []}, {"x": -0.7219704878237145, "y": 0.013120802888906935, "z": 0.6917994357059984, "word": "Pruner", "pos_group": "noun", "row_number": 121942, "definition": "Any one of several species of beetles whose larvae gnaw the branches of trees so as to cause them to fall especially the American oak pruner (Asemum moestum) whose larva eats the pith of oak branches and when mature gnaws a circular furrow on the inside nearly to the bark. When the branches fall each contains a pupa.", "details": []}, {"x": -0.5439150924630258, "y": -0.018862408888377993, "z": 0.8389282339520263, "word": "Pseudo-cone", "pos_group": "noun", "row_number": 122019, "definition": "One of the soft gelatinous cones found in the compound eyes of certain insects taking the place of the crystalline cones of others.", "details": []}, {"x": -0.6543218853818271, "y": 0.16067868414716682, "z": 0.7389487335201991, "word": "Pseudohalter", "pos_group": "noun", "row_number": 122031, "definition": "One of the rudimentary front wings of certain insects (Stylops). They resemble the halteres or rudimentary hind wings of Diptera.", "details": []}, {"x": -0.669624824163126, "y": -0.07220188747633867, "z": 0.7391816301216885, "word": "Pseudoneuroptera", "pos_group": "other", "row_number": 122046, "definition": "division of insects (Zool.) reticulated wings as in the Neuroptera but having an active pupa state. It includes the dragon flies May flies white ants etc. By some zoologists they are classed with the Orthoptera; by others with the Neuroptera.", "details": []}, {"x": -0.5365301126827036, "y": 0.09168695599300254, "z": 0.8388855346740833, "word": "Pseudopupa", "pos_group": "noun", "row_number": 122060, "definition": "A stage intermediate between the larva and pupa of bees and certain other hymenopterous insects.", "details": []}, {"x": -0.7175634365314683, "y": 0.08297020172155696, "z": 0.6915335567992587, "word": "Pseudoscorpiones", "pos_group": "other", "row_number": 122065, "definition": "An order of Arachnoidea having the palpi terminated by large claws as in the scorpions but destitute of a caudal sting; the false scorpions. Called also Pseudoscorpii and Pseudoscorpionina. See Illust. of Book scorpion under Book.", "details": []}, {"x": -0.5836662057001749, "y": -0.06820049710018332, "z": 0.8091244975396857, "word": "Pseudotetramera", "pos_group": "other", "row_number": 122074, "definition": "A division of beetles having the fifth tarsal joint minute and obscure so that there appear to be but four joints.", "details": []}, {"x": -0.6000102545227611, "y": 0.163555883761781, "z": 0.7830946094530559, "word": "Pseudotinea", "pos_group": "noun", "row_number": 122076, "definition": "The bee moth or wax moth (Galleria).", "details": []}, {"x": -0.7098942007119871, "y": -0.027071205652326975, "z": 0.7037878754426069, "word": "Psorosperm", "pos_group": "noun", "row_number": 122103, "definition": "A minute parasite usually the young of Gregarinae in the pseudonavicula stage.", "details": []}, {"x": -0.5314014648744768, "y": 0.02221789035142106, "z": 0.8468287007875871, "word": "Psychian", "pos_group": "noun", "row_number": 122110, "definition": "Any small moth of the genus Psyche and allied genera (family Psychidae). The larvae are called basket worms. See Basket worm under Basket.", "details": []}, {"x": -0.6847511290431761, "y": 0.14028806402241295, "z": 0.7151469431990456, "word": "Pterophore", "pos_group": "noun", "row_number": 122164, "definition": "Any moth of the genus Pterophorus and allied genera; a plume moth. See Plume moth under Plume.", "details": []}, {"x": -0.6371345506909666, "y": -0.08324159236102024, "z": 0.7662443485057635, "word": "Pterostigma", "pos_group": "noun", "row_number": 122172, "definition": "A thickened opaque spot on the wings of certain insects.", "details": []}, {"x": -0.5538904431934574, "y": 0.12837488439388922, "z": 0.8226331296488192, "word": "Puffball", "pos_group": "noun", "row_number": 122350, "definition": "A kind of ball-shaped fungus (Lycoperdon giganteum and other species of the same genus) full of dustlike spores when ripe; -- called also bullfist bullfice puckfist puff and puffin.", "details": []}, {"x": -0.7243486479709612, "y": 0.039882631081601325, "z": 0.6882793124311157, "word": "Pug", "pos_group": "noun", "row_number": 122380, "definition": "Any geometrid moth of the genus Eupithecia.", "details": []}, {"x": -0.5561603363590043, "y": -0.041357325194454335, "z": 0.8300453312402879, "word": "Pulex", "pos_group": "noun", "row_number": 122422, "definition": "A genus of parasitic insects including the fleas. See Flea.", "details": []}, {"x": -0.6336810247848159, "y": 0.167068472130713, "z": 0.75533865547023, "word": "Pulicene", "pos_group": "adjective", "row_number": 122423, "definition": "Pertaining to or abounding in fleas; pulicose.", "details": []}, {"x": -0.6876265866425743, "y": -0.059127820579133336, "z": 0.7236529404181566, "word": "Pulicous", "pos_group": "adjective", "row_number": 122425, "definition": "Abounding with fleas.", "details": []}, {"x": -0.5304352153909166, "y": 0.06598996757558225, "z": 0.8451531260384507, "word": "Pulmonarian", "pos_group": "noun", "row_number": 122470, "definition": "Any arachnid that breathes by lunglike organs as the spiders and scorpions. Also used adjectively.", "details": []}, {"x": -0.7083435398486032, "y": 0.10778364172733154, "z": 0.6975902207820465, "word": "Pulvillus", "pos_group": "noun", "row_number": 122559, "definition": "One of the minute cushions on the feet of certain insects.", "details": []}, {"x": -0.603174033680398, "y": -0.0791027677104263, "z": 0.7936774138365463, "word": "Pupa", "pos_group": "noun", "row_number": 122724, "definition": "Any insect in that stage of its metamorphosis which usually immediately precedes the adult or imago stage.", "details": []}, {"x": -0.5802626665619001, "y": 0.154792709839574, "z": 0.7995839260359068, "word": "Pupigerous", "pos_group": "adjective", "row_number": 122731, "definition": "Bearing or containing a pupa; -- said of dipterous larvae which do not molt when the pupa is formed within them.", "details": []}, {"x": -0.7193093119312822, "y": -0.003244033501108282, "z": 0.6946823662765516, "word": "Pupipara", "pos_group": "other", "row_number": 122741, "definition": "A division of Diptera in which the young are born in a stage like the pupa. It includes the sheep tick horse tick and other parasites. Called also Homaloptera.", "details": []}, {"x": -0.5370807181271421, "y": -0.004177590811397115, "z": 0.8435205095023155, "word": "Pupiparous", "pos_group": "adjective", "row_number": 122742, "definition": "Bearing or containing a pupa; -- said of the matured larvae or larval skins of certain Diptera.", "details": []}, {"x": -0.6667544536256041, "y": 0.15536972663292128, "z": 0.7289024259915954, "word": "Pupivora", "pos_group": "other", "row_number": 122744, "definition": "A group of parasitic Hymenoptera including the ichneumon flies which destroy the larvae and pupae of insects.", "details": []}, {"x": -0.657806862060556, "y": -0.0790871740612661, "z": 0.749022930974111, "word": "Pupivorous", "pos_group": "adjective", "row_number": 122745, "definition": "Feeding on the pupae of insects.", "details": []}, {"x": -0.5412091369379544, "y": 0.10713818294058253, "z": 0.8340348193277454, "word": "Purple", "pos_group": "noun", "row_number": 122911, "definition": "Any species of large butterflies usually marked with purple or blue of the genus Basilarchia (formerly Limenitis) as the banded purple (B. arthemis). See Illust. under Ursula.", "details": []}, {"x": -0.7221732022400215, "y": 0.0670428696434887, "z": 0.6884556046662407, "word": "Pygidium", "pos_group": "noun", "row_number": 123207, "definition": "The caudal plate of trilobites crustacean and certain insects. See Illust. of Limulus and Trilobite.", "details": []}, {"x": -0.571867213200553, "y": -0.060186036818480795, "z": 0.8181353992086625, "word": "Pyralid", "pos_group": "noun", "row_number": 123244, "definition": "Any moth of the family Pyralidae. The species are numerous and mostly small but some of them are very injurious as the bee moth meal moth hop moth and clover moth.", "details": []}, {"x": -0.6124907299594292, "y": 0.1676507564619228, "z": 0.7724948734920579, "word": "Quadricornous", "pos_group": "adjective", "row_number": 123533, "definition": "Having four horns or hornlike organs; as a quadricornous beetle.", "details": []}, {"x": -0.7029744165587479, "y": -0.04115524223364878, "z": 0.7100233909531273, "word": "Quadripennate", "pos_group": "adjective", "row_number": 123569, "definition": "Having four wings; -- said of insects.", "details": []}, {"x": -0.528805619222898, "y": 0.038878623399749714, "z": 0.8478520329166096, "word": "Quaker", "pos_group": "noun", "row_number": 123651, "definition": "Any grasshopper or locust of the genus (Edipoda; -- so called from the quaking noise made during flight.", "details": []}, {"x": -0.6951922110399231, "y": 0.12978103052103157, "z": 0.707011084655907, "word": "Queen", "pos_group": "noun", "row_number": 123940, "definition": "The fertile or fully developed female of social bees ants and termites.", "details": []}, {"x": -0.6240128818303057, "y": -0.08443496288418113, "z": 0.7768388895727247, "word": "Quica", "pos_group": "noun", "row_number": 124090, "definition": "A small South American opossum (Didelphys quica) native of Guiana and Brazil. It feeds upon insects small birds and fruit.", "details": []}, {"x": -0.5624862286709718, "y": 0.14063043732789096, "z": 0.8147590580364684, "word": "Quilting", "pos_group": "noun", "row_number": 124221, "definition": "A quilting bee. See Bee 2.", "details": []}, {"x": -0.7244842959045666, "y": 0.022973654267287875, "z": 0.6889083510869, "word": "Radiata", "pos_group": "other", "row_number": 124690, "definition": "An extensive artificial group of invertebrates having all the parts arranged radially around the vertical axis of the body and the various organs repeated symmetrically in each ray or spheromere.", "details": []}, {"x": -0.5470426671268418, "y": -0.028696144110275584, "z": 0.8366127250143602, "word": "Raptorial", "pos_group": "adjective", "row_number": 125372, "definition": "Adapted for seizing prey; -- said of the legs claws etc. of insects birds and other animals.", "details": []}, {"x": -0.6466832740295083, "y": 0.16528983510122885, "z": 0.744634147419177, "word": "Rattlesnake", "pos_group": "noun", "row_number": 125611, "definition": "Any one of several species of venomous American snakes belonging to the genera Crotalus and Caudisona or Sistrurus. They have a series of horny interlocking joints at the end of the tail which make a sharp rattling sound when shaken. The common rattlesnake of the Northern United States (Crotalus horridus) and the diamond rattlesnake of the South (C. adamanteus) are the best known. See Illust. of Fang.", "details": []}, {"x": -0.6772534382001179, "y": -0.0691964287283228, "z": 0.7324886584086917, "word": "Redhorn", "pos_group": "noun", "row_number": 126907, "definition": "Any species of a tribe of butterflies (Fugacia) including the common yellow species and the cabbage butterflies. The antennae are usually red.", "details": []}, {"x": -0.5324124553702727, "y": 0.0826045889478297, "z": 0.8424449295065864, "word": "Redia", "pos_group": "noun", "row_number": 126911, "definition": "A kind of larva or nurse which is prroduced within the sporocyst of certain trematodes by asexual generation. It in turn produces in the same way either another generation of rediae or else cercariae within its own body. Called also proscolex and nurse. See Illustration in Appendix.", "details": []}, {"x": -0.7154935976817638, "y": 0.09332586247447631, "z": 0.6923577074531643, "word": "Reduvid", "pos_group": "noun", "row_number": 127053, "definition": "Any hemipterous insect of the genus Redivius or family Reduvidae. They live by sucking the blood of other insects and some species also attack man.", "details": []}, {"x": -0.5903312281775516, "y": -0.07442088765315813, "z": 0.8037229451243133, "word": "Reeler", "pos_group": "noun", "row_number": 127126, "definition": "The grasshopper warbler; -- so called from its note.", "details": []}, {"x": -0.5917408273463667, "y": 0.16233371970814592, "z": 0.789614182178331, "word": "Remiped", "pos_group": "adjective", "row_number": 128259, "definition": "Having feet or legs that are used as oars; -- said of certain crustaceans and insects.", "details": []}, {"x": -0.7149131416908867, "y": -0.019077125880099067, "z": 0.6989529763194526, "word": "Remiped", "pos_group": "noun", "row_number": 128261, "definition": "One of a group of aquatic beetles having tarsi adapted for swimming. See Water beetle.", "details": []}, {"x": -0.5317647511915048, "y": 0.011614660576899223, "z": 0.8468124639197986, "word": "Reptant", "pos_group": "adjective", "row_number": 129018, "definition": "Creeping; crawling; -- said of reptiles worms etc.", "details": []}, {"x": -0.6786831626923243, "y": 0.14789460849521566, "z": 0.7193860920646097, "word": "Reptile", "pos_group": "noun", "row_number": 129024, "definition": "An animal that crawls or moves on its belly as snakes or by means of small short legs as lizards and the like.", "details": []}, {"x": -0.645212844869132, "y": -0.08388464320586621, "z": 0.7593837972001416, "word": "Retiary", "pos_group": "noun", "row_number": 129875, "definition": "Any spider which spins webs to catch its prey.", "details": []}, {"x": -0.5475376153611279, "y": 0.12167678200939643, "z": 0.827887263149088, "word": "Retiary", "pos_group": "adjective", "row_number": 129878, "definition": "Constructing or using a web or net to catch prey; -- said of certain spiders.", "details": []}, {"x": -0.725126043945558, "y": 0.050372620358577175, "z": 0.686771300732693, "word": "Reticulated", "pos_group": "adjective", "row_number": 129893, "definition": "Having veins fibers or lines crossing like the threads or fibers of a network; as a reticulate leaf; a reticulated surface; a reticulated wing of an insect.", "details": []}, {"x": -0.5608623393780275, "y": -0.05016204936009778, "z": 0.8263880475124271, "word": "Retinaculum", "pos_group": "noun", "row_number": 129907, "definition": "One of the retractor muscles of the proboscis of certain worms.", "details": []}, {"x": -0.625457886156894, "y": 0.16952413492229582, "z": 0.7616193276978974, "word": "Retinophora", "pos_group": "noun", "row_number": 129922, "definition": "One of group of two to four united cells which occupy the axial part of the ocelli or ommatidia of the eyes of invertebrates and contain the terminal nerve fibrillae. See Illust. under Ommatidium.", "details": []}, {"x": -0.6945419279902741, "y": -0.05397263732376884, "z": 0.7174248843494835, "word": "Retinula", "pos_group": "noun", "row_number": 129927, "definition": "One of the group of pigmented cells which surround the retinophorae of invertebrates. See Illust. under Ommatidium.", "details": []}, {"x": -0.5279548015193419, "y": 0.0558937337591569, "z": 0.8474311878135786, "word": "Retitelae", "pos_group": "other", "row_number": 129952, "definition": "A group of spiders which spin irregular webs; -- called also Retitelariae.", "details": []}, {"x": -0.7045725930304575, "y": 0.11748347782867935, "z": 0.6998393341243513, "word": "Rhabdite", "pos_group": "noun", "row_number": 130532, "definition": "One of the hard parts forming the ovipositor of insects.", "details": []}, {"x": -0.6107099665636141, "y": -0.08334111596594708, "z": 0.7874564083994873, "word": "Rhabdom", "pos_group": "noun", "row_number": 130538, "definition": "One of numerous minute rodlike structures formed of two or more cells situated behind the retinulae in the compound eyes of insects etc. See Illust. under Ommatidium.", "details": []}, {"x": -0.5724111204851712, "y": 0.15130321276718842, "z": 0.8058863734741006, "word": "Rheumides", "pos_group": "other", "row_number": 130645, "definition": "The class of skin disease developed by the dartrous diathesis. See under Dartrous.", "details": []}, {"x": -0.7228404079437315, "y": 0.006110995443272495, "z": 0.6909879885920104, "word": "Rhipipter", "pos_group": "noun", "row_number": 130682, "definition": "One of the Rhipiptera a group of insects having wings which fold like a fan; a strepsipter.", "details": []}, {"x": -0.5392206288143602, "y": -0.014519257615465356, "z": 0.842039372368859, "word": "Rhombohedron", "pos_group": "noun", "row_number": 130734, "definition": "A solid contained by six rhomboids; a parallelopiped.", "details": []}, {"x": -0.6595549417369456, "y": 0.16122846945535071, "z": 0.7341611944712545, "word": "Rhopalocera", "pos_group": "other", "row_number": 130750, "definition": "A division of Lepidoptera including all the butterflies. They differ from other Lepidoptera in having club-shaped antennae.", "details": []}, {"x": -0.6657764348117274, "y": -0.07741383411466182, "z": 0.7421245428747477, "word": "Rhynchophora", "pos_group": "other", "row_number": 130780, "definition": "A group of Coleoptera having a snoutlike head; the snout beetles curculios or weevils.", "details": []}, {"x": -0.536149223692133, "y": 0.09877236303079001, "z": 0.8383245375364107, "word": "Ringworm", "pos_group": "noun", "row_number": 131290, "definition": "A contagious affection of the skin due to the presence of a vegetable parasite and forming ring-shaped discolored patches covered with vesicles or powdery scales. It occurs either on the body the face or the scalp. Different varieties are distinguished as Tinea circinata Tinea tonsurans etc. but all are caused by the same parasite (a species of Trichophyton).", "details": []}, {"x": -0.7211523890141828, "y": 0.07767473101610843, "z": 0.6884082131851073, "word": "Roller", "pos_group": "noun", "row_number": 131849, "definition": "ANy insect whose larva rolls up leaves; a leaf roller. see Tortrix.", "details": []}, {"x": -0.5779279551683514, "y": -0.06753104088700781, "z": 0.8132889014069018, "word": "Roller", "pos_group": "noun", "row_number": 131851, "definition": "Any species of small ground snakes of the family Tortricidae.", "details": []}, {"x": -0.6040630552590603, "y": 0.16781124804898542, "z": 0.7790681679412472, "word": "Rose", "pos_group": "noun", "row_number": 132128, "definition": "The erysipelas.", "details": []}, {"x": -0.7088318321125845, "y": -0.03407532043592371, "z": 0.7045539768684198, "word": "Roseworm", "pos_group": "noun", "row_number": 132181, "definition": "The larva of any one of several species of lepidopterous insects which feed upon the leaves buds or blossoms of the rose especially Cacaecia rosaceana which rolls up the leaves for a nest and devours both the leaves and buds.", "details": []}, {"x": -0.5280905554781496, "y": 0.02824016947848194, "z": 0.8487183620274784, "word": "Rostrulum", "pos_group": "noun", "row_number": 132221, "definition": "A little rostrum or beak as of an insect.", "details": []}, {"x": -0.6898760986512567, "y": 0.1383544971402512, "z": 0.7105835641434367, "word": "Rostrum", "pos_group": "noun", "row_number": 132228, "definition": "The beak or sucking mouth parts of Hemiptera.", "details": []}, {"x": -0.6320615048568048, "y": -0.08646918937514492, "z": 0.7700787838701678, "word": "Rotifer", "pos_group": "noun", "row_number": 132288, "definition": "One of the Rotifera. See Illust. in Appendix.", "details": []}, {"x": -0.5554248947345575, "y": 0.13501691965469653, "z": 0.8205325208156367, "word": "Rotifera", "pos_group": "noun", "row_number": 132289, "definition": "An order of minute worms which usually have one or two groups of vibrating cilia on the head which when in motion often give an appearance of rapidly revolving wheels. The species are very numerous in fresh waters and are very diversified in form and habits.", "details": []}, {"x": -0.7263368267382199, "y": 0.033256000832791184, "z": 0.6865339412821939, "word": "Roundworm", "pos_group": "noun", "row_number": 132495, "definition": "A nematoid worm.", "details": []}, {"x": -0.5508679193301214, "y": -0.03828004332682487, "z": 0.833714083925538, "word": "Royal", "pos_group": "noun", "row_number": 132619, "definition": "One of the upper or distal branches of an antler as the third and fourth tynes of the antlers of a stag.", "details": []}, {"x": -0.6386777205145756, "y": 0.16910280409624348, "z": 0.7506630475553548, "word": "Rubytail", "pos_group": "noun", "row_number": 132751, "definition": "A European gold wasp (Chrysis ignita) which has the under side of the abdomen bright red and the other parts deep bluish green with a metallic luster. The larva is parasitic in the nests of other wasps and of bees.", "details": []}, {"x": -0.6847255092829777, "y": -0.06526374361993813, "z": 0.7258730059079742, "word": "Rurales", "pos_group": "other", "row_number": 133215, "definition": "The gossamer-winged butterflies; a family of small butterflies including the hairstreaks violets and theclas.", "details": []}, {"x": -0.5288931807134395, "y": 0.07295338398810657, "z": 0.8455470460947191, "word": "Rutilian", "pos_group": "noun", "row_number": 133356, "definition": "Any species of lamellicorn beetles belonging to Rutila and allied genera as the spotted grapevine beetle (Pelidnota punctata).", "details": []}, {"x": -0.7126982358831592, "y": 0.10359272955794319, "z": 0.693779338804326, "word": "Sack-winged", "pos_group": "adjective", "row_number": 133546, "definition": "Having a peculiar pouch developed near the front edge of the wing; -- said of certain bats of the genus Saccopteryx.", "details": []}, {"x": -0.5974679053940501, "y": -0.07994113589566926, "z": 0.7978981869986648, "word": "Saddle", "pos_group": "noun", "row_number": 133639, "definition": "The clitellus of an earthworm.", "details": []}, {"x": -0.5835020838176079, "y": 0.1601678332378512, "z": 0.7961605261355285, "word": "Saddleback", "pos_group": "noun", "row_number": 133649, "definition": "The larva of a bombycid moth (Empretia stimulea) which has a large bright green saddle-shaped patch of color on the back.", "details": []}, {"x": -0.7194152620927594, "y": -0.010391734144338027, "z": 0.6945024784185293, "word": "Sagittocyst", "pos_group": "noun", "row_number": 133767, "definition": "A defensive cell containing a minute rodlike structure which may be expelled. Such cells are found in certain Turbellaria.", "details": []}, {"x": -0.5328599157608138, "y": 0.0009361480114903094, "z": 0.8462029507170716, "word": "Sainfoin", "pos_group": "noun", "row_number": 133822, "definition": "A kind of tick trefoil (Desmodium Canadense).", "details": []}, {"x": -0.6720532720029393, "y": 0.15492049962323934, "z": 0.7241160393104333, "word": "Saltatoria", "pos_group": "other", "row_number": 134067, "definition": "A division of Orthoptera including grasshoppers locusts and crickets.", "details": []}, {"x": -0.6533879432779061, "y": -0.08359597872151814, "z": 0.7523934528693476, "word": "Saltatorious", "pos_group": "adjective", "row_number": 134071, "definition": "Capable of leaping; formed for leaping; saltatory; as a saltatorious insect or leg.", "details": []}, {"x": -0.5416046192361469, "y": 0.11418556501232066, "z": 0.832842177825358, "word": "Saltigradae", "pos_group": "other", "row_number": 134082, "definition": "A tribe of spiders including those which lie in wait and leap upon their prey; the leaping spiders.", "details": []}, {"x": -0.7251877558744966, "y": 0.06110009738954129, "z": 0.6858348903553247, "word": "Saltigrade", "pos_group": "noun", "row_number": 134084, "definition": "One of the Saltigradae a tribe of spiders which leap to seize their prey.", "details": []}, {"x": -0.5662001417868556, "y": -0.0585234372313599, "z": 0.822187573936247, "word": "Sandworm", "pos_group": "noun", "row_number": 134309, "definition": "The chigoe a species of flea.", "details": []}, {"x": -0.6170134986219423, "y": 0.17108835155110452, "z": 0.7681296234893146, "word": "Saprophagan", "pos_group": "noun", "row_number": 134480, "definition": "One of a tribe of beetles which feed upon decaying animal and vegetable substances; a carrion beetle.", "details": []}, {"x": -0.7011477692158781, "y": -0.04794628500684699, "z": 0.7114021081481553, "word": "Sarcophaga", "pos_group": "other", "row_number": 134531, "definition": "A suborder of carnivorous and insectivorous marsupials including the dasyures and the opossums.", "details": []}, {"x": -0.5261525803830571, "y": 0.045404648947499016, "z": 0.8491771782203082, "word": "Sarcophaga", "pos_group": "noun", "row_number": 134532, "definition": "A genus of Diptera including the flesh flies.", "details": []}, {"x": -0.7001114577625294, "y": 0.12689106213715684, "z": 0.7026682041044194, "word": "Sarcophagan", "pos_group": "noun", "row_number": 134534, "definition": "Any fly of the genus Sarcophaga.", "details": []}, {"x": -0.6185855902858292, "y": -0.08675534256650597, "z": 0.7809131693260783, "word": "Sarcoptes", "pos_group": "noun", "row_number": 134543, "definition": "A genus of parasitic mites including the itch mites.", "details": []}, {"x": -0.5647495248556651, "y": 0.14689071484094024, "z": 0.8120844119109897, "word": "Sarcoptid", "pos_group": "noun", "row_number": 134544, "definition": "Any species of the genus Sarcoptes and related genera of mites comprising the itch mites and mange mites.", "details": []}, {"x": -0.7257518306272184, "y": 0.016002731005874814, "z": 0.6877704507621674, "word": "Sarcoptid", "pos_group": "adjective", "row_number": 134545, "definition": "Of or pertaining to the itch mites.", "details": []}, {"x": -0.5420847534332864, "y": -0.024728927861307506, "z": 0.8399598801264279, "word": "Sarcoseptum", "pos_group": "noun", "row_number": 134548, "definition": "One of the mesenteries of an anthozoan.", "details": []}, {"x": -0.6519077160571185, "y": 0.16635555074551298, "z": 0.739825763596638, "word": "Sasin", "pos_group": "noun", "row_number": 134621, "definition": "The Indian antelope (Antilope bezoartica / cervicapra) noted for its beauty and swiftness. It has long spiral divergent horns.", "details": []}, {"x": -0.6736820422470081, "y": -0.07479346129530344, "z": 0.7352267977307194, "word": "Saturnian", "pos_group": "noun", "row_number": 134730, "definition": "Any one of numerous species of large handsome moths belonging to Saturnia and allied genera. The luna moth polyphemus and promethea are examples. They belong to the Silkworn family and some are raised for their silk. See Polyphemus.", "details": []}, {"x": -0.5316319738898085, "y": 0.08974192652747907, "z": 0.8422077124802186, "word": "Satyr", "pos_group": "noun", "row_number": 134738, "definition": "Any one of many species of butterflies belonging to the family Nymphalidae. Their colors are commonly brown and gray often with ocelli on the wings. Called also meadow browns.", "details": []}, {"x": -0.7193955940681938, "y": 0.08833924540937105, "z": 0.6889601998343399, "word": "Sauba ant", "pos_group": "other", "row_number": 134744, "definition": "A South American ant (Oecodoma cephalotes) remarkable for having two large kinds of workers besides the ordinary ones and for the immense size of its formicaries. The sauba ant cuts off leaves of plants and carries them into its subterranean nests and thus often does great damage by defoliating trees and cultivated plants.", "details": []}, {"x": -0.5845315344760715, "y": -0.07425918428435667, "z": 0.8079656296851192, "word": "Sawfly", "pos_group": "noun", "row_number": 134923, "definition": "Any one of numerous species of hymenopterous insects belonging to the family Tenthredinidae. The female usually has an ovipositor containing a pair of sawlike organs with which she makes incisions in the leaves or stems of plants in which to lay the eggs. The larvae resemble those of Lepidoptera.", "details": []}, {"x": -0.5955715405653065, "y": 0.16702932279976462, "z": 0.7857453438574864, "word": "Scale", "pos_group": "noun", "row_number": 135064, "definition": "One of the small scalelike structures covering parts of some invertebrates as those on the wings of Lepidoptera and on the body of Thysanura; the elytra of certain annelids. See Lepidoptera.", "details": []}, {"x": -0.7142406117156662, "y": -0.026222674379299545, "z": 0.6994088360354253, "word": "Scale", "pos_group": "noun", "row_number": 135065, "definition": "A scale insect. (See below.)", "details": []}, {"x": -0.528101389782901, "y": 0.017405048948659702, "z": 0.8490029366147465, "word": "Scaled", "pos_group": "adjective", "row_number": 135091, "definition": "Covered with scales or scalelike structures; -- said of a fish a reptile a moth etc.", "details": []}, {"x": -0.6839386513569805, "y": 0.14644487562598738, "z": 0.7146900164287199, "word": "Scale-winged", "pos_group": "adjective", "row_number": 135103, "definition": "Having the wings covered with small scalelike structures as the Lepidoptera; scaly-winged.", "details": []}, {"x": -0.6403005424827484, "y": -0.08759413657035425, "z": 0.763113676023954, "word": "Scape", "pos_group": "noun", "row_number": 135232, "definition": "The long basal joint of the antennae of an insect.", "details": []}, {"x": -0.5487047742090984, "y": 0.12854574786844208, "z": 0.826074489053551, "word": "Scarabee", "pos_group": "noun", "row_number": 135289, "definition": "Any one of numerous species of lamellicorn beetles of the genus Scarabaeus or family Scarabaeidae especially the sacred or Egyptian species (Scarabaeus sacer and S. Egyptiorum).", "details": []}, {"x": -0.727495956227207, "y": 0.04389347753403785, "z": 0.6847065037686079, "word": "Scaraboid", "pos_group": "adjective", "row_number": 135292, "definition": "Of or pertaining to the family Scarabaeidae an extensive group which includes the Egyptian scarab the tumbledung and many similar lamellicorn beetles.", "details": []}, {"x": -0.5553747765399474, "y": -0.047529537538203666, "z": 0.8302408088287446, "word": "Scaraboid", "pos_group": "noun", "row_number": 135293, "definition": "A scaraboid beetle.", "details": []}, {"x": -0.6303610600274678, "y": 0.17206727131489918, "z": 0.7569925945102053, "word": "Scincoid", "pos_group": "adjective", "row_number": 135666, "definition": "Of or pertaining to the family Scincidae or skinks.", "details": []}, {"x": -0.6919747779237124, "y": -0.060414224797844064, "z": 0.7193893439296307, "word": "Sciniph", "pos_group": "noun", "row_number": 135670, "definition": "Some kind of stinging or biting insect as a flea a gnat a sandfly or the like.", "details": []}, {"x": -0.5260141440138902, "y": 0.06279900251831204, "z": 0.8481541166439267, "word": "Sclerotium", "pos_group": "noun", "row_number": 135778, "definition": "A hardened body formed by certain fungi as by the Claviceps purpurea which produces ergot.", "details": []}, {"x": -0.7091819100422253, "y": 0.11368437197901357, "z": 0.6957994553293344, "word": "Sclerotium", "pos_group": "noun", "row_number": 135779, "definition": "The mature or resting stage of a plasmodium.", "details": []}, {"x": -0.6050276453803176, "y": -0.0846994697634951, "z": 0.7916865213879364, "word": "Scolex", "pos_group": "noun", "row_number": 135814, "definition": "The embryo produced directly from the egg in a metagenetic series especially the larva of a tapeworm or other parasitic worm. See Illust. of Echinococcus.", "details": []}, {"x": -0.5753611188701677, "y": 0.15705359157873228, "z": 0.802679109149285, "word": "Scolopacine", "pos_group": "adjective", "row_number": 135820, "definition": "Of or pertaining to the Scolopacidae or Snipe family.", "details": []}, {"x": -0.7233502281753019, "y": -0.0010699908179437028, "z": 0.6904804867035621, "word": "Scolopendra", "pos_group": "noun", "row_number": 135821, "definition": "A genus of venomous myriapods including the centipeds. See Centiped.", "details": []}, {"x": -0.534694065799865, "y": -0.009731966210358961, "z": 0.8449896714351542, "word": "Scolytid", "pos_group": "noun", "row_number": 135824, "definition": "Any one of numerous species of small bark-boring beetles of the genus Scolytus and allied genera. Also used adjectively.", "details": []}, {"x": -0.6649013259864894, "y": 0.16129436647399165, "z": 0.7293081338125621, "word": "Scopula", "pos_group": "noun", "row_number": 135884, "definition": "A peculiar brushlike organ found on the foot of spiders and used in the construction of the web.", "details": []}, {"x": -0.6615939434118316, "y": -0.08235606116291623, "z": 0.7453260583332049, "word": "Scopula", "pos_group": "noun", "row_number": 135885, "definition": "A special tuft of hairs on the leg of a bee.", "details": []}, {"x": -0.5361487551806904, "y": 0.1059438162351424, "z": 0.8374487567127499, "word": "Scopuliped", "pos_group": "noun", "row_number": 135886, "definition": "Any species of bee which has on the hind legs a brush of hairs used for collecting pollen as the hive bees and bumblebees.", "details": []}, {"x": -0.7245152095861168, "y": 0.07198272353404905, "z": 0.685489750901504, "word": "Scorpiodea", "pos_group": "other", "row_number": 135953, "definition": "Same as Scorpiones.", "details": []}, {"x": -0.5721438145001714, "y": -0.06636266526107952, "z": 0.8174640372448438, "word": "Scorpion", "pos_group": "noun", "row_number": 135956, "definition": "Any one of numerous species of pulmonate arachnids of the order Scorpiones having a suctorial mouth large claw-bearing palpi and a caudal sting.", "details": []}, {"x": -0.6084105767535073, "y": 0.17172725063334446, "z": 0.7748201865493548, "word": "Scorpiones", "pos_group": "other", "row_number": 135962, "definition": "A division of arachnids comprising the scorpions.", "details": []}, {"x": -0.7073815669546185, "y": -0.04 ow_number": 144415, "definition": "One of the asexual polymorphic forms of white ants or termites in which the head and jaws are very large and strong. The soldiers serve to defend the nest. See Termite.", "details": []}, {"x": -0.6778292134430537, "y": -0.07698283975475445, "z": 0.731177953569762, "word": "Solenodon", "pos_group": "noun", "row_number": 144486, "definition": "Either one of two species of singular West Indian insectivores allied to the tenrec. One species (Solendon paradoxus) native of St. Domingo is called also agouta; the other (S. Cubanus) found in Cuba is called almique.", "details": []}, {"x": -0.5268815789097606, "y": 0.08741343548010642, "z": 0.8454316608118737, "word": "Solenoglyph", "pos_group": "adjective", "row_number": 144488, "definition": "Pertaining to the Selenoglypha. See Ophidia.", "details": []}, {"x": -0.7209225336185793, "y": 0.09387190120719185, "z": 0.6866285507351959, "word": "Solenoglypha", "pos_group": "other", "row_number": 144490, "definition": "A suborder of serpents including those which have tubular erectile fangs as the viper and rattlesnake. See Fang.", "details": []}, {"x": -0.5857016198768167, "y": -0.08017579264275257, "z": 0.8065515821990427, "word": "Solifugae", "pos_group": "other", "row_number": 144568, "definition": "A division of arachnids having large powerful fangs and a segmented abdomen; -- called also Solpugidea and Solpugides.", "details": []}, {"x": -0.5909909503967381, "y": 0.17013003047360903, "z": 0.7885337464434917, "word": "Solubility", "pos_group": "noun", "row_number": 144622, "definition": "The tendency to separate readily into parts by spurious articulations as the pods of tick trefoil.", "details": []}, {"x": -0.7184941334318928, "y": -0.02496648024478727, "z": 0.6950847826618995, "word": "Somatocyst", "pos_group": "noun", "row_number": 144673, "definition": "A cavity in the primary nectocalyx of certain Siphonophora. See Illust. under Nectocalyx.", "details": []}, {"x": -0.5250824221989294, ils": []}, {"x": -0.5217987979721584, "y": 0.059273315307205754, "z": 0.8510068674971448, "word": "Spermatium", "pos_group": "noun", "row_number": 146025, "definition": "One of the motionless spermatozoids in the conceptacles of certain fungi.", "details": []}, {"x": -0.7096992176530421, "y": 0.11966116029724606, "z": 0.6942681234069276, "word": "Spermatogenesis", "pos_group": "noun", "row_number": 146032, "definition": "The development of the spermatozoids.", "details": []}, {"x": -0.6071514414534742, "y": -0.09007371710589698, "z": 0.7894642820468165, "word": "Spermatozoid", "pos_group": "noun", "row_number": 146045, "definition": "The male germ cell in animals and plants the essential element in fertilization; a microscopic animalcule-like particle usually provided with one or more cilia by which it is capable of active motion. In animals the familiar type is that of a small more or less ovoid head with a delicate threadlike cilium or tail. Called also spermatozoon. In plants the more usual term is antherozoid.", "details": []}, {"x": -0.5703844902713684, "y": 0.15891072751485338, "z": 0.8058591154405162, "word": "Spermogonium", "pos_group": "noun", "row_number": 146056, "definition": "A conceptacle of certain lichens which contains spermatia.", "details": []}, {"x": -0.7272343260913784, "y": 0.0014771324154925192, "z": 0.6863876842093294, "word": "Sphex", "pos_group": "noun", "row_number": 146163, "definition": "Any one of numerous species of sand wasps of the genus Sphex and allied genera. These wasps have the abdomen attached to the thorax by a slender pedicel. See Illust. of Sand wasp under Sand.", "details": []}, {"x": -0.5326160283472402, "y": -0.015432769424623991, "z": 0.8462162820316672, "word": "Sphingid", "pos_group": "adjective", "row_number": 146168, "definition": "Of or pertaining to a sphinx or the family Sphingidae.", "details": []}, {"x": -0.6627523757856456, "y": 0.16706228626104047, "z": 0.729965397056406, "word": "Sphinx", "pos_group": "noun", "row_number": 146172, "definition": "Any one of numerous species of large moths of the family Sphingidae; -- called also hawk moth.", "details": []}, {"x": -0.6655112076031825, "y": -0.0852474707274432, "z": 0.7415036758433011, "word": "Spider", "pos_group": "noun", "row_number": 146234, "definition": "Any one of numerous species of arachnids comprising the order Araneina. Spiders have the mandibles converted into poison fangs or falcers. The abdomen is large and not segmented with two or three pairs of spinnerets near the end by means of which they spin threads of silk to form cocoons or nests to protect their eggs and young. Many species spin also complex webs to entrap the insects upon which they prey. The eyes are usually eight in number (rarely six) and are situated on the back of the cephalothorax. See Illust. under Araneina.", "details": []}, {"x": -0.5311944545437448, "y": 0.10434974432204168, "z": 0.8407993710284863, "word": "Spider", "pos_group": "noun", "row_number": 146235, "definition": "Any one of various other arachnids resembling the true spiders especially certain mites as the red spider (see under Red).", "details": []}, {"x": -0.7265732157422685, "y": 0.0771348218734843, "z": 0.6827456198471613, "word": "Spidered", "pos_group": "adjective", "row_number": 146239, "definition": "Infested by spiders; cobwebbed.", "details": []}, {"x": -0.5727355181890871, "y": -0.07245266644947206, "z": 0.8165320797917492, "word": "Spider's web", "pos_group": "other", "row_number": 146242, "definition": "The silken web which is formed by most kinds of spiders particularly the web spun to entrap their prey. See Geometric spider Triangle spider under Geometric and Triangle.", "details": []}, {"x": -0.604152103003468, "y": 0.17546416118793243, "z": 0.7773111118304579, "word": "Spindleworm", "pos_group": "noun", "row_number": 146350, "definition": "The larva of a noctuid mmoth (Achatodes zeae) which feeds inside the stalks of corn (maize) sometimes causing much damage. It is smooth with a black head and tail and a row of black dots across each segment.", "details": []}, {"x": -0.7117392058363969, "y": -0.04058588698318153, "z": 0.7012703392081854, "word": "Spinner", "pos_group": "noun", "row_number": 146381, "definition": "A spider.", "details": []}, {"x": -0.5215640506778176, "y": 0.030048662199299123, "z": 0.8526828360771542, "word": "Spinneret", "pos_group": "noun", "row_number": 146384, "definition": "One of the special jointed organs situated on the under side and near the end of the abdomen of spiders by means of which they spin their webs. Most spiders have three pairs of spinnerets but some have only two pairs. The ordinary silk line of the spider is composed of numerous smaller lines jointed after issuing from the spinnerets.", "details": []}, {"x": -0.6944442968298792, "y": 0.1420499941948438, "z": 0.7053856517889343, "word": "Spinnerule", "pos_group": "noun", "row_number": 146385, "definition": "One of the numerous small spinning tubes on the spinnerets of spiders.", "details": []}, {"x": -0.6296972847185286, "y": -0.09386989580263816, "z": 0.7711483464808273, "word": "Spiracle", "pos_group": "noun", "row_number": 146415, "definition": "One of the external openings communicating with the air tubes or tracheae of insects myriapods and arachnids. They are variable in number and are usually situated on the sides of the thorax and abdomen a pair to a segment. These openings are usually elliptical and capable of being closed. See Illust. under Coleoptera.", "details": []}, {"x": -0.5521957497915096, "y": 0.1420928526023327, "z": 0.8215165702233426, "word": "Spirochaete", "pos_group": "noun", "row_number": 146519, "definition": "A genus of Spirobacteria similar to Spirillum but distinguished by its motility. One species the Spirochaete Obermeyeri is supposed to be the cause of relapsing fever.", "details": []}, {"x": -0.7313110525406958, "y": 0.030073731311299163, "z": 0.6813807416685882, "word": "Splanchnapophyses", "pos_group": "other", "row_number": 146587, "definition": "of Splanchnapophysis", "details": []}, {"x": -0.5446098902615445, "y": -0.040802838897339655, "z": 0.8376963625128296, "word": "Sponger", "pos_group": "noun", "row_number": 146825, "definition": "Fig.: A parasitical dependent; a hanger-on.", "details": []}, {"x": -0.6407847356562202, "y": 0.17585910204692845, "z": 0.7473074994787862, "word": "Spoonworm", "pos_group": "noun", "row_number": 146894, "definition": "A gephyrean worm of the genus Thalassema having a spoonlike probiscis.", "details": []}, {"x": -0.6857224727986826, "y": -0.07284941785227912, "z": 0.7242082936679503, "word": "Sporocyst", "pos_group": "noun", "row_number": 146921, "definition": "Any protozoan when it becomes encysted produces germs by sporulation.", "details": []}, {"x": -0.5231674376767221, "y": 0.07724326802803567, "z": 0.8487221628419526, "word": "Sporogenesis", "pos_group": "noun", "row_number": 146922, "definition": "reproduction by spores.", "details": []}, {"x": -0.7179951642195207, "y": 0.104703637198008, "z": 0.6881279623114377, "word": "Sporosac", "pos_group": "noun", "row_number": 146928, "definition": "An early or simple larval stage of trematode worms and some other invertebrates which is capable or reproducing other germs by asexual generation; a nurse; a redia.", "details": []}, {"x": -0.5932292235760283, "y": -0.08601040010892087, "z": 0.8004256988431132, "word": "Sporozoa", "pos_group": "other", "row_number": 146929, "definition": "An extensive division of parasitic Protozoa which increase by sporulation. It includes the Gregarinida.", "details": []}, {"x": -0.5823090899822352, "y": 0.16786337568160048, "z": 0.7954483080809456, "word": "Springer", "pos_group": "noun", "row_number": 147147, "definition": "A species of antelope; the sprinkbok.", "details": []}, {"x": -0.7232606079506053, "y": -0.015818226062311584, "z": 0.6903940010683484, "word": "Springtail", "pos_group": "noun", "row_number": 147155, "definition": "Any one of numerous species of small apterous insects belonging to the order Thysanura. They have two elastic caudal stylets which can be bent under the abdomen and then suddenly extended like a spring thus enabling them to leap to a considerable distance. See Collembola and Podura.", "details": []}, {"x": -0.526232039942878, "y": 0.0011034681232112902, "z": 0.8503402980546424, "word": "Spur", "pos_group": "noun", "row_number": 147257, "definition": "Any stiff sharp spine as on the wings and legs of certain burds on the legs of insects etc.; especially the spine on a cock's leg.", "details": []}, {"x": -0.6758341617729234, "y": 0.15995278173256566, "z": 0.7194882163014931, "word": "Stage", "pos_group": "noun", "row_number": 147759, "definition": "One of several marked phases or periods in the development and growth of many animals and plants; as the larval stage; pupa stage; zoea stage.", "details": []}, {"x": -0.6522865939093836, "y": -0.0913277937502312, "z": 0.7524502863942641, "word": "Stag-horned", "pos_group": "adjective", "row_number": 147791, "definition": "Having the mandibles large and palmate or branched somewhat like the antlers of a stag; -- said of certain beetles.", "details": []}, {"x": -0.5373005833980574, "y": 0.12041387285126536, "z": 0.8347506108443806, "word": "Stagworm", "pos_group": "noun", "row_number": 147807, "definition": "The larve of any species of botfly which is parasitic upon the stag as /strus or Hypoderma actaeon which burrows beneath the skin and Cephalomyia auribarbis which lives in the nostrils.", "details": []}, {"x": -0.730485564651572, "y": 0.05949869787368129, "z": 0.6803313492607925, "word": "Stalk", "pos_group": "noun", "row_number": 147897, "definition": "The narrow basal portion of the abdomen of a hymenopterous insect.", "details": []}, {"x": -0.5605397244400873, "y": -0.06253031443106073, "z": 0.8257633905071016, "word": "Staphylinid", "pos_group": "noun", "row_number": 148153, "definition": "Any rove beetle.", "details": []}, {"x": -0.6179164551365774, "y": 0.17845330517947608, "z": 0.7657242795823878, "word": "Steinbock", "pos_group": "noun", "row_number": 148731, "definition": "A small South African antelope (Nanotragus tragulus) which frequents dry rocky districts; -- called also steenbok.", "details": []}, {"x": -0.7033236232830086, "y": -0.05494633151059231, "z": 0.7087430998504245, "word": "Stemma", "pos_group": "noun", "row_number": 148792, "definition": "One of the ocelli of an insect. See Ocellus.", "details": []}, {"x": -0.5198922706780608, "y": 0.04822271788528446, "z": 0.8528696244848717, "word": "Stemma", "pos_group": "noun", "row_number": 148793, "definition": "One of the facets of a compound eye of any arthropod.", "details": []}, {"x": -0.7050191127977185, "y": 0.1295871430354854, "z": 0.6972483222997518, "word": "Stenodermine", "pos_group": "adjective", "row_number": 148814, "definition": "Of or pertaining to the genus Stenoderma which includes several West Indian and South American nose-leaf bats.", "details": []}, {"x": -0.6154557458150802, "y": -0.09369124211386297, "z": 0.7825830154650464, "word": "Sternite", "pos_group": "noun", "row_number": 148987, "definition": "The sternum of an arthropod somite.", "details": []}, {"x": -0.5623110012813548, "y": 0.15428010195644332, "z": 0.8124062948908445, "word": "Sternum", "pos_group": "noun", "row_number": 149003, "definition": "The ventral part of any one of the somites of an arthropod.", "details": []}, {"x": -0.7303263214451121, "y": 0.011893829803697905, "z": 0.6829948762743768, "word": "Stigma", "pos_group": "other", "row_number": 149187, "definition": "One of the external openings of the tracheae of insects myriapods and other arthropods; a spiracle.", "details": []}, {"x": -0.535626968463844, "y": -0.026198575022732554, "z": 0.8440482126756801, "word": "Stigma", "pos_group": "other", "row_number": 149188, "definition": "One of the apertures of the pulmonary sacs of arachnids. See Illust. of Scorpion.", "details": []}, {"x": -0.6547096760973878, "y": 0.17248504773633344, "z": 0.7359375981235422, "word": "Sting", "pos_group": "other", "row_number": 149308, "definition": "Any sharp organ of offense and defense especially when connected with a poison gland and adapted to inflict a wound by piercing; as the caudal sting of a scorpion. The sting of a bee or wasp is a modified ovipositor. The caudal sting or spine of a sting ray is a modified dorsal fin ray. The term is sometimes applied to the fang of a serpent. See Illust. of Scorpion.", "details": []}, {"x": -0.6738548508019137, "y": -0.08250730080966695, "z": 0.7342425929921486, "word": "Sting", "pos_group": "other", "row_number": 149317, "definition": "To pierce or wound with a sting; as bees will sting an animal that irritates them; the nettles stung his hands.", "details": []}, {"x": -0.5264279027095768, "y": 0.09484724470674724, "z": 0.8449128140940546, "word": "Stinkard", "pos_group": "noun", "row_number": 149339, "definition": "The teledu of the East Indies. It emits a disagreeable odor.", "details": []}, {"x": -0.7247478512283551, "y": 0.08837592328573723, "z": 0.6833229458486489, "word": "Stipes", "pos_group": "noun", "row_number": 149382, "definition": "The second joint of a maxilla of an insect or a crustacean.", "details": []}, {"x": -0.5796908677994389, "y": -0.07955931366644943, "z": 0.8109431628658429, "word": "Stomodaeum", "pos_group": "noun", "row_number": 149631, "definition": "The primitive mouth and esophagus of the embryo of annelids and arthropods.", "details": []}, {"x": -0.5952118219880744, "y": 0.17466434994954205, "z": 0.7843565846108137, "word": "Strawworm", "pos_group": "noun", "row_number": 150173, "definition": "A caddice worm.", "details": []}, {"x": -0.7174597964246506, "y": -0.03232850554364462, "z": 0.6958493430647278, "word": "Strepsiptera", "pos_group": "other", "row_number": 150272, "definition": "A group of small insects having the anterior wings rudimentary and in the form of short and slender twisted appendages while the posterior ones are large and membranous. They are parasitic in the larval state on bees wasps and the like; -- called also Rhipiptera. See Illust. under Rhipipter.", "details": []}, {"x": -0.5215649992910536, "y": 0.01863460743601128, "z": 0.8530080321545802, "word": "Strobila", "pos_group": "noun", "row_number": 150552, "definition": "A form of the larva of certain Discophora in a state of development succeeding the scyphistoma. The body of the strobila becomes elongated and subdivides transversely into a series of lobate segments which eventually become ephyrae or young medusae.", "details": []}, {"x": -0.688211325999112, "y": 0.15058982256946443, "z": 0.7097097125621441, "word": "Strobila", "pos_group": "noun", "row_number": 150553, "definition": "A mature tapeworm.", "details": []}, {"x": -0.6383835482443954, "y": -0.09507904051673126, "z": 0.7638235538298838, "word": "Strobilation", "pos_group": "noun", "row_number": 150556, "definition": "The act or phenomenon of spontaneously dividing transversely as do certain species of annelids and helminths; transverse fission. See Illust. under Syllidian.", "details": []}, {"x": -0.5451128893939888, "y": 0.13529680001582897, "z": 0.8273733822900114, "word": "Strongyloid", "pos_group": "adjective", "row_number": 150644, "definition": "Like or pertaining to Strongylus a genus of parasitic nematode worms of which many species infest domestic animals. Some of the species especially those living in the kidneys lungs and bronchial tubes are often very injurious.", "details": []}, {"x": -0.73255972526954, "y": 0.04127459057950642, "z": 0.6794502609356406, "word": "Strongyloid", "pos_group": "noun", "row_number": 150645, "definition": "A strongyloid worm.", "details": []}, {"x": -0.5493486962444528, "y": -0.05055844765093943, "z": 0.8340622598497353, "word": "Style", "pos_group": "other", "row_number": 151021, "definition": "A long slender bristlelike process as the anal styles of insects.", "details": []}, {"x": -0.6320380124752125, "y": 0.17900707831989984, "z": 0.7539790558747348, "word": "Stylet", "pos_group": "noun", "row_number": 151035, "definition": "Any small more or less rigid bristlelike organ; as the caudal stylets of certain insects; the ventral stylets of certain Infusoria.", "details": []}, {"x": -0.693375710157476, "y": -0.06776465354875676, "z": 0.7173827962064832, "word": "Stylommatophorous", "pos_group": "adjective", "row_number": 151059, "definition": "Of or pertaining to Stylommatophora.", "details": []}, {"x": -0.5201239099994621, "y": 0.06655865313732, "z": 0.8514934315304007, "word": "Stylops", "pos_group": "noun", "row_number": 151062, "definition": "A genus of minute insects parasitic in their larval state on bees and wasps. It is the typical genus of the group Strepsiptera formerly considered a distinct order but now generally referred to the Coleoptera. See Strepsiptera.", "details": []}, {"x": -0.7143192285227027, "y": 0.11534228370558802, "z": 0.6902493733081623, "word": "Subcostal", "pos_group": "noun", "row_number": 151203, "definition": "One of the principal nervures of the wings of an insect. It is situated next beneath or behind the costal. See Nervure.", "details": []}, {"x": -0.6011902475915772, "y": -0.09104547254684228, "z": 0.7939023920668713, "word": "Subimago", "pos_group": "noun", "row_number": 151311, "definition": "A stage in the development of certain insects such as the May flies intermediate between the pupa and imago. In this stage the insect is able to fly but subsequently sheds a skin before becoming mature. Called also pseudimago.", "details": []}, {"x": -0.5737373154770349, "y": 0.16461072177303018, "z": 0.8023271172698623, "word": "Submentum", "pos_group": "noun", "row_number": 151457, "definition": "The basal part of the labium of insects. It bears the mentum.", "details": []}, {"x": -0.7274314173008831, "y": -0.0060156887380547405, "z": 0.6861540239717576, "word": "Subulicornes", "pos_group": "other", "row_number": 151867, "definition": "A division of insects having slender or subulate antennae. The dragon flies and May flies are examples.", "details": []}, {"x": -0.5281504007170583, "y": -0.010135305410303597, "z": 0.84909035432435, "word": "Subulipalp", "pos_group": "noun", "row_number": 151869, "definition": "One of a group of carabid beetles having slender palpi.", "details": []}, {"x": -0.668323832056577, "y": 0.16668788227881817, "z": 0.7249540712394236, "word": "Suctoria", "pos_group": "other", "row_number": 152067, "definition": "An order of Infusoria having the body armed with somewhat stiff tubular processes which they use as suckers in obtaining their food. They are usually stalked.", "details": []}, {"x": -0.6609384916385814, "y": -0.09005023582637228, "z": 0.7450176275083239, "word": "Sug", "pos_group": "noun", "row_number": 152214, "definition": "A kind of worm or larva.", "details": []}, {"x": -0.5315467593588792, "y": 0.1117557096060953, "z": 0.839624144475081, "word": "Sulphur", "pos_group": "noun", "row_number": 152387, "definition": "Any one of numerous species of yellow or orange butterflies of the subfamily Pierinae; as the clouded sulphur (Eurymus / Colias philodice) which is the common yellow butterfly of the Eastern United States.", "details": []}, {"x": -0.7298083462370359, "y": 0.07095794418440543, "z": 0.6799593722568176, "word": "Supercrescence", "pos_group": "noun", "row_number": 152652, "definition": "That which grows upon another growing thing; a parasite.", "details": []}, {"x": -0.5667895609593038, "y": -0.07080370336362905, "z": 0.8208144913301391, "word": "Suture", "pos_group": "noun", "row_number": 153610, "definition": "The line at which the elytra of a beetle meet and are sometimes confluent.", "details": []}, {"x": -0.6088681696482517, "y": 0.17915636119686024, "z": 0.7727758732206175, "word": "Swallowtail", "pos_group": "noun", "row_number": 153702, "definition": "Any one of numerous species of large and handsome butterflies belonging to Papilio and allied genera in which the posterior border of each hind wing is prolongated in the form of a long lobe.", "details": []}, {"x": -0.7099097864248604, "y": -0.04773834578770398, "z": 0.7026728580781121, "word": "Swarm", "pos_group": "noun", "row_number": 153761, "definition": "A large number or mass of small animals or insects especially when in motion.", "details": []}, {"x": -0.5187246445513004, "y": 0.03685276510809479, "z": 0.8541467185671411, "word": "Swarm", "pos_group": "noun", "row_number": 153762, "definition": "Especially a great number of honeybees which emigrate from a hive at once and seek new lodgings under the direction of a queen; a like body of bees settled permanently in a hive.", "details": []}, {"x": -0.6996440179790974, "y": 0.13911208719712118, "z": 0.7008181470978937, "word": "Swarm", "pos_group": "other", "row_number": 153766, "definition": "To collect and depart from a hive by flight in a body; -- said of bees; as bees swarm in warm clear days in summer.", "details": []}, {"x": -0.624046130380092, "y": -0.09639773045094208, "z": 0.7754185351934403, "word": "Swarmspore", "pos_group": "noun", "row_number": 153773, "definition": "One of the minute flagellate germs produced by the sporulation of a protozoan; -- called also zoospore.", "details": []}, {"x": -0.5545112990626732, "y": 0.14870708494050855, "z": 0.818781669372442, "word": "Swift", "pos_group": "noun", "row_number": 154058, "definition": "The ghost moth. See under Ghost.", "details": []}, {"x": -0.7327286327543551, "y": 0.022788936417231544, "z": 0.6801392615625897, "word": "Swordtail", "pos_group": "noun", "row_number": 154282, "definition": "Any hemipterous insect of the genus Uroxiphus found upon forest trees.", "details": []}, {"x": -0.5393815303752815, "y": -0.036727051896992643, "z": 0.8412601787491043, "word": "Sycophantical", "pos_group": "adjective", "row_number": 154323, "definition": "Of or pertaining to a sycophant; characteristic of a sycophant; meanly or obsequiously flattering; courting favor by mean adulation; parasitic.", "details": []}, {"x": -0.6462606338762082, "y": 0.17707913264973837, "z": 0.7422871236131863, "word": "Symphyla", "pos_group": "other", "row_number": 154496, "definition": "An order of small apterous insects having an elongated body with three pairs of thoracic and about nine pairs of abdominal legs. They are in many respects intermediate between myriapods and true insects.", "details": []}, {"x": -0.6820541312680847, "y": -0.07878236395476489, "z": 0.7270457352531801, "word": "Syrphian", "pos_group": "adjective", "row_number": 154778, "definition": "Of or pertaining to the syrphus flies.", "details": []}, {"x": -0.5222811857801932, "y": 0.08472147842561556, "z": 0.8485544378962455, "word": "Syrphian", "pos_group": "noun", "row_number": 154779, "definition": "A syrphus fly.", "details": []}, {"x": -0.7221530980743225, "y": 0.0995509938001163, "z": 0.684532323981174, "word": "Syrphus fly", "pos_group": "other", "row_number": 154780, "definition": "Any one of numerous species of dipterous flies of the genus Syrphus and allied genera. They are usually bright-colored with yellow bands and hover around plants. The larvae feed upon plant lice and are therefore very beneficial to agriculture.", "details": []}, {"x": -0.5871611596317682, "y": -0.08594494545080149, "z": 0.8048945514608333, "word": "Tabanus", "pos_group": "noun", "row_number": 154842, "definition": "A genus of blood sucking flies including the horseflies.", "details": []}, {"x": -0.5862822204123447, "y": 0.17286721556611695, "z": 0.791448092935215, "word": "Tachina", "pos_group": "noun", "row_number": 155008, "definition": "Any one of numerous species of Diptera belonging to Tachina and allied genera. Their larvae are external parasites of other insects.", "details": []}, {"x": -0.7226497697291016, "y": -0.023321570375443603, "z": 0.6908208267457634, "word": "Tachyglossa", "pos_group": "other", "row_number": 155014, "definition": "A division of monotremes which comprises the spiny ant-eaters of Australia and New Guinea. See Illust. under Echidna.", "details": []}, {"x": -0.5223382156137222, "y": 0.007112934157187387, "z": 0.8527087396509715, "word": "Taenia", "pos_group": "noun", "row_number": 155081, "definition": "A genus of intestinal worms which includes the common tapeworms of man. See Tapeworm.", "details": []}, {"x": -0.6813706083550237, "y": 0.15853844075875884, "z": 0.7145625633012733, "word": "Taenidium", "pos_group": "noun", "row_number": 155087, "definition": "The chitinous fiber forming the spiral thread of the tracheae of insects. See Illust. of Trachea.", "details": []}, {"x": -0.6471938371397145, "y": -0.09530851851200689, "z": 0.7563441170971182, "word": "Taenioidea", "pos_group": "other", "row_number": 155092, "definition": "The division of cestode worms which comprises the tapeworms. See Tapeworm.", "details": []}, {"x": -0.5384555351324724, "y": 0.12764740575929573, "z": 0.8329296347760264, "word": "Tagtail", "pos_group": "noun", "row_number": 155129, "definition": "A worm which has its tail conspicuously colored.", "details": []}, {"x": -0.7330570876143965, "y": 0.05275385823230334, "z": 0.6781182321246829, "word": "Taintworm", "pos_group": "noun", "row_number": 155211, "definition": "A destructive parasitic worm or insect larva.", "details": []}, {"x": -0.5547702166506079, "y": -0.059870850753373374, "z": 0.8298466653228805, "word": "Talpa", "pos_group": "noun", "row_number": 155367, "definition": "A genus of small insectivores including the common European mole.", "details": []}, {"x": -0.6230364341431995, "y": 0.18122284258892127, "z": 0.7609099046891934, "word": "Tamandu", "pos_group": "noun", "row_number": 155375, "definition": "A small ant-eater (Tamandua tetradactyla) native of the tropical parts of South America.", "details": []}, {"x": -0.7007221011137506, "y": -0.06174840489058458, "z": 0.7107571114693114, "word": "Tampan", "pos_group": "noun", "row_number": 155428, "definition": "A venomous South African tick.", "details": []}, {"x": -0.5177882921370789, "y": 0.05543294423014251, "z": 0.853711000994918, "word": "Tant", "pos_group": "noun", "row_number": 155537, "definition": "A small scarlet arachnid.", "details": []}, {"x": -0.7099065730803943, "y": 0.1256995306470337, "z": 0.6929879403657515, "word": "Tanystomata", "pos_group": "other", "row_number": 155558, "definition": "A division of dipterous insects in which the proboscis is large and contains lancelike mandibles and maxillae. The horseflies and robber flies are examples.", "details": []}, {"x": -0.6095299117058768, "y": -0.09522415757003781, "z": 0.7870232820894835, "word": "Tapeworm", "pos_group": "noun", "row_number": 155601, "definition": "Any one of numerous species of cestode worms belonging to Taenia and many allied genera. The body is long flat and composed of numerous segments or proglottids varying in shape those toward the end of the body being much larger and longer than the anterior ones and containing the fully developed sexual organs. The head is small destitute of a mouth but furnished with two or more suckers (which vary greatly in shape in different genera) and sometimes also with hooks for adhesion to the walls of the intestines of the animals in which they are parasitic. The larvae (see Cysticercus) live in the flesh of various creatures and when swallowed by another animal of the right species develop into the mature tapeworm in its intestine. See Illustration in Appendix.", "details": []}, {"x": -0.5653445607767688, "y": 0.16037656934096947, "z": 0.8091136407245546, "word": "Tarantulas", "pos_group": "other", "row_number": 155637, "definition": "of Tarantula", "details": []}, {"x": -0.7309597031032159, "y": 0.004377621961492144, "z": 0.6824065861824757, "word": "Tarantulae", "pos_group": "other", "row_number": 155638, "definition": "of Tarantula", "details": []}, {"x": -0.5308376483077859, "y": -0.02126335180196888, "z": 0.8472067404177123, "word": "Tarantula", "pos_group": "noun", "row_number": 155639, "definition": "Any one of several species of large spiders popularly supposed to be very venomous especially the European species (Tarantula apuliae). The tarantulas of Texas and adjacent countries are large species of Mygale.", "details": []}, {"x": -0.6603227052289891, "y": 0.17266860545998988, "z": 0.7308621468153705, "word": "Tarantulated", "pos_group": "adjective", "row_number": 155640, "definition": "Bitten by a tarantula; affected with tarantism.", "details": []}, {"x": -0.6695453130130004, "y": -0.08777082014525235, "z": 0.7375671880943138, "word": "Tarentula", "pos_group": "noun", "row_number": 155671, "definition": "See Tarantula.", "details": []}, {"x": -0.5263508328307832, "y": 0.10237472667301512, "z": 0.8440818776143498, "word": "Tarsus", "pos_group": "noun", "row_number": 155753, "definition": "The foot of an insect or a crustacean. It usually consists of form two to five joints.", "details": []}, {"x": -0.7283537469464079, "y": 0.08248089505850767, "z": 0.680218877464802, "word": "Taxicorn", "pos_group": "noun", "row_number": 156010, "definition": "One of a family of beetles (Taxicornes) whose antennae are largest at the tip. Also used adjectively.", "details": []}, {"x": -0.5736281029848855, "y": -0.07844781759986291, "z": 0.8153506849078993, "word": "Tegmen", "pos_group": "noun", "row_number": 156232, "definition": "One of the elytra of an insect especially of certain Orthoptera.", "details": []}, {"x": -0.5997297625335857, "y": 0.17886759318759102, "z": 0.7799555090123329, "word": "Tegula", "pos_group": "noun", "row_number": 156239, "definition": "A small appendage situated above the base of the wings of Hymenoptera and attached to the mesonotum.", "details": []}, {"x": -0.7160402012459359, "y": -0.03969712050140023, "z": 0.6969293858229662, "word": "Telotrocha", "pos_group": "noun", "row_number": 156371, "definition": "An annelid larva having telotrochal bands of cilia.", "details": []}, {"x": -0.518319719770187, "y": 0.025246257996557546, "z": 0.8548141871509424, "word": "Telotrochous", "pos_group": "adjective", "row_number": 156373, "definition": "Having both a preoral and a posterior band of cilla; -- applied to the larvae of certain annelids.", "details": []}, {"x": -0.6936003714064647, "y": 0.14815225948538424, "z": 0.7049605895326273, "word": "Tendrac", "pos_group": "noun", "row_number": 156598, "definition": "Any one of several species of small insectivores of the family Centetidae belonging to Ericulus Echinope and related genera native of Madagascar. They are more or less spinose and resemble the hedgehog in habits. The rice tendrac (Oryzorictes hora) is very injurious to rice crops. Some of the species are called also tenrec.", "details": []}, {"x": -0.6328597971765567, "y": -0.09815252989744748, "z": 0.7680198942686174, "word": "Teneral", "pos_group": "adjective", "row_number": 156621, "definition": "Of pertaining to or designating a condition assumed by the imago of certain Neuroptera after exclusion from the pupa. In this state the insect is soft and has not fully attained its mature coloring.", "details": []}, {"x": -0.5470515447688997, "y": 0.14221548917876112, "z": 0.8249299133887716, "word": "Tenrec", "pos_group": "noun", "row_number": 156652, "definition": "A small insectivore (Centetes ecaudatus) native of Madagascar but introduced also into the islands of Bourbon and Mauritius; -- called also tanrec. The name is applied to other allied genera. See Tendrac.", "details": []}, {"x": -0.7344065110573369, "y": 0.03408666844059828, "z": 0.6778533584420824, "word": "Tenthredinides", "pos_group": "other", "row_number": 156728, "definition": "A group of Hymneoptera comprising the sawflies.", "details": []}, {"x": -0.5438647737346847, "y": -0.046930261583862654, "z": 0.8378595696405158, "word": "Terebra", "pos_group": "noun", "row_number": 156813, "definition": "The boring ovipositor of a hymenopterous insect.", "details": []}, {"x": -0.6374620429135464, "y": 0.1807906674987483, "z": 0.7489705457425178, "word": "Terebrant", "pos_group": "adjective", "row_number": 156814, "definition": "Boring or adapted for boring; -- said of certain Hymenoptera as the sawflies.", "details": []}, {"x": -0.6900402394463528, "y": -0.07408118191740272, "z": 0.7199697538303542, "word": "Terebrantia", "pos_group": "other", "row_number": 156815, "definition": "A division of Hymenoptera including those which have an ovipositor adapted for perforating plants. It includes the sawflies.", "details": []}, {"x": -0.5187989639314383, "y": 0.0740389054478907, "z": 0.851684140690517, "word": "Terebratulae", "pos_group": "other", "row_number": 156820, "definition": "of Terebratula", "details": []}, {"x": -0.7187919288804683, "y": 0.11057054842463894, "z": 0.6863762210314184, "word": "Terebratulid", "pos_group": "noun", "row_number": 156822, "definition": "Any species of Terebratula or allied genera. Used also adjectively.", "details": []}, {"x": -0.5950973333351594, "y": -0.09154408038854613, "z": 0.7984227233760306, "word": "Tergite", "pos_group": "noun", "row_number": 156840, "definition": "The dorsal portion of an arthromere or somite of an articulate animal. See Illust. under Coleoptera.", "details": []}, {"x": -0.5774326744561977, "y": 0.17006570837229276, "z": 0.7985293741035411, "word": "Termatarium", "pos_group": "noun", "row_number": 156874, "definition": "Any nest or dwelling of termes or white ants.", "details": []}, {"x": -0.7272558928565341, "y": -0.013620190128363685, "z": 0.686231270583258, "word": "Termes", "pos_group": "noun", "row_number": 156879, "definition": "A genus of Pseudoneuroptera including the white ants or termites. See Termite.", "details": []}, {"x": -0.523892801782113, "y": -0.004428035631567859, "z": 0.851772695465952, "word": "Termite", "pos_group": "noun", "row_number": 156919, "definition": "Any one of numerous species of pseudoneoropterous insects belonging to Termes and allied genera; -- called also white ant. See Illust. of White ant.", "details": []}, {"x": -0.6739619723778068, "y": 0.16582072689183242, "z": 0.7199157911323245, "word": "Terricolae", "pos_group": "other", "row_number": 156985, "definition": "A division of annelids including the common earthworms and allied species.", "details": []}, {"x": -0.6560603096991373, "y": -0.09453589974355352, "z": 0.7487642043374862, "word": "Testa", "pos_group": "noun", "row_number": 157076, "definition": "The external hard or firm covering of many invertebrate animals.", "details": []}, {"x": -0.5322838914084694, "y": 0.11918674059177455, "z": 0.8381338674783199, "word": "Testiculate", "pos_group": "adjective", "row_number": 157115, "definition": "Having two tubers resembling testicles in form as some species of orchis.", "details": []}, {"x": -0.732782220515138, "y": 0.06442705348931937, "z": 0.6774063566837767, "word": "Tetramera", "pos_group": "other", "row_number": 157245, "definition": "A division of Coleoptera having apparently only four tarsal joints one joint being rudimentary.", "details": []}, {"x": -0.5608450748281181, "y": -0.06865754846169753, "z": 0.8250690535223536, "word": "Tetramerous", "pos_group": "adjective", "row_number": 157247, "definition": "Having four joints in each of the tarsi; -- said of certain insects.", "details": []}, {"x": -0.6138442492234889, "y": 0.1824692417761274, "z": 0.7680496165619095, "word": "Tetraneumona", "pos_group": "other", "row_number": 157262, "definition": "A division of Arachnida including those spiders which have four lungs or pulmonary sacs. It includes the bird spiders (Mygale) and the trapdoor spiders. See Mygale.", "details": []}, {"x": -0.7076962836726974, "y": -0.05482841083001567, "z": 0.7043861266675457, "word": "Tetrapod", "pos_group": "noun", "row_number": 157264, "definition": "An insect characterized by having but four perfect legs as certain of the butterflies.", "details": []}, {"x": -0.5161927028294819, "y": 0.043944214978997295, "z": 0.8553443748078745, "word": "Tetrapteran", "pos_group": "noun", "row_number": 157266, "definition": "An insect having four wings.", "details": []}, {"x": -0.7047752167390767, "y": 0.1356879898819659, "z": 0.6963337298107705, "word": "Tettigonian", "pos_group": "noun", "row_number": 157316, "definition": "Any one of numerous species of Hemiptera belonging to Tettigonia and allied genera; a leaf hopper.", "details": []}, {"x": -0.6181895123984811, "y": -0.09849568363728671, "z": 0.7798335252253215, "word": "Tettix", "pos_group": "noun", "row_number": 157319, "definition": "A genus of small grasshoppers.", "details": []}, {"x": -0.5571993716080842, "y": 0.15517346395305592, "z": 0.8157512221041203, "word": "Tharos", "pos_group": "noun", "row_number": 157453, "definition": "A small American butterfly (Phycoides tharos) having the upper surface of the wings variegated with orange and black the outer margins black with small white crescents; -- called also pearl crescent.", "details": []}, {"x": -0.7338031035711556, "y": 0.015292414943529682, "z": 0.6791900670906009, "word": "Thecasporous", "pos_group": "adjective", "row_number": 157521, "definition": "Having the spores in thecae or cases.", "details": []}, {"x": -0.5342876838517774, "y": -0.03219103590829319, "z": 0.8446895335515021, "word": "Thecla", "pos_group": "noun", "row_number": 157523, "definition": "Any one of many species of small delicately colored butterflies belonging to Thecla and allied genera; -- called also hairstreak and elfin.", "details": []}, {"x": -0.6518821520635162, "y": 0.17783208014620625, "z": 0.7371739354398743, "word": "Thelytokous", "pos_group": "adjective", "row_number": 157547, "definition": "Producing females only; -- said of certain female insects.", "details": []}, {"x": -0.6780374009233605, "y": -0.08448649654620405, "z": 0.7301556785031822, "word": "Thigh", "pos_group": "noun", "row_number": 157889, "definition": "The coxa or femur of an insect.", "details": []}, {"x": -0.5217641392129645,
