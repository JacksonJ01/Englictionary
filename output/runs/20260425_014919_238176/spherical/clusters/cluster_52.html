"y": 0.09232931965789413, "z": 0.8480786990385176, "word": "Thorax", "pos_group": "noun", "row_number": 158065, "definition": "The middle region of the body of an insect or that region which bears the legs and wings. It is composed of three united somites each of which is composed of several distinct parts. See Illust. in Appendix. and Illust. of Coleoptera.", "details": []}, {"x": -0.7261157429585625, "y": 0.09397838171992803, "z": 0.681119660263186, "word": "Thousand legs", "pos_group": "other", "row_number": 158142, "definition": "A millepid or galleyworm; -- called also thousand-legged worm.", "details": []}, {"x": -0.5810128796851478, "y": -0.08538957432876554, "z": 0.8094026527235528, "word": "Threadworm", "pos_group": "noun", "row_number": 158207, "definition": "Any long slender nematode worm especially the pinworm and filaria.", "details": []}, {"x": -0.5905698922178143, "y": 0.17756842492149674, "z": 0.7872081407586804, "word": "Thrips", "pos_group": "noun", "row_number": 158320, "definition": "Any one of numerous small species of Thysanoptera especially those which attack useful plants as the grain thrips (Thrips cerealium).", "details": []}, {"x": -0.7216561010899317, "y": -0.03086836998982709, "z": 0.6915631681154293, "word": "Thysanopter", "pos_group": "noun", "row_number": 158639, "definition": "One of the Thysanoptera.", "details": []}, {"x": -0.518695477488509, "y": 0.013489195609820386, "z": 0.8548526441643424, "word": "Thysanoptera", "pos_group": "other", "row_number": 158640, "definition": "A division of insects considered by some writers a distinct order but regarded by others as belonging to the Hemiptera. They are all of small size and have narrow broadly fringed wings with rudimentary nervures. Most of the species feed upon the juices of plants and some as those which attack grain are very injurious to crops. Called also Physopoda. See Thrips.", "details": []}, {"x": -0.686920443234618, "y": 0.15662656556914964, "z": 0.7096537350175569, "word": "Thysanopteran", "pos_group": "noun", "row_number": 158641, "definition": "One of the Thysanoptera.", "details": []}, {"x": -0.6418311684706425, "y": -0.09892207855111448, "z": 0.7604388032936884, "word": "Thysanura", "pos_group": "other", "row_number": 158643, "definition": "An order of wingless hexapod insects which have setiform caudal appendages either bent beneath the body to form a spring or projecting as bristles. It comprises the Cinura or bristletails and the Collembola or springtails. Called also Thysanoura. See Lepisma and Podura.", "details": []}, {"x": -0.5399961654800819, "y": 0.13483694358361922, "z": 0.8307966898777557, "word": "Thysbe", "pos_group": "noun", "row_number": 158646, "definition": "A common clearwing moth (Hemaris thysbe).", "details": []}, {"x": -0.7353305449395183, "y": 0.04570680778576587, "z": 0.6761655695175451, "word": "Tibia", "pos_group": "noun", "row_number": 158655, "definition": "The fourth joint of the leg of an insect. See Illust. under Coleoptera and under Hexapoda.", "details": []}, {"x": -0.5490556216261125, "y": -0.05672154456725271, "z": 0.833858855408197, "word": "Tick", "pos_group": "noun", "row_number": 158679, "definition": "Any one of numerous species of large parasitic mites which attach themselves to and suck the blood of cattle dogs and many other animals. When filled with blood they become ovate much swollen and usually livid red in color. Some of the species often attach themselves to the human body. The young are active and have at first but six legs.", "details": []}, {"x": -0.6283744075653795, "y": 0.18357210005994307, "z": 0.7559410611922338, "word": "Tick", "pos_group": "noun", "row_number": 158680, "definition": "Any one of several species of dipterous insects having a flattened and usually wingless body as the bird ticks (see under Bird) and sheep tick (see under Sheep).", "details": []}, {"x": -0.6977450319381975, "y": -0.06842031891693419, "z": 0.7130711958597604, "word": "Ticpolonga", "pos_group": "noun", "row_number": 158731, "definition": "A very venomous viper (Daboia Russellii) native of Ceylon and India; -- called also cobra monil.", "details": []}, {"x": -0.5160212035848726, "y": 0.06287152289065301, "z": 0.8542653504972736, "word": "Timaline", "pos_group": "adjective", "row_number": 158957, "definition": "Of or pertaining to the genus Timalus or family Timalidae which includes the babblers thrushes and bulbuls.", "details": []}, {"x": -0.7146735716069633, "y": 0.1213449810714244, "z": 0.6888520026938457, "word": "Tinea", "pos_group": "noun", "row_number": 159090, "definition": "A name applied to various skin diseases but especially to ringworm. See Ringworm and Sycosis.", "details": []}, {"x": -0.6034457988797496, "y": -0.09629659689313, "z": 0.7915681481977296, "word": "Tinea", "pos_group": "noun", "row_number": 159091, "definition": "A genus of small Lepidoptera including the clothes moths and carpet moths.", "details": []}, {"x": -0.5687329832365563, "y": 0.166260803723066, "z": 0.8055433811559791, "word": "Tinean", "pos_group": "noun", "row_number": 159092, "definition": "Any species of Tinea or of the family Tineidae which includes numerous small moths many of which are injurious to woolen and fur goods and to cultivated plants. Also used adjectively.", "details": []}, {"x": -0.7312288399346637, "y": -0.0032859465478336882, "z": 0.6821243187301642, "word": "Tingis", "pos_group": "noun", "row_number": 159108, "definition": "A genus of small hemipterous insects which injure trees by sucking the sap from the leaves. See Illustration in Appendix.", "details": []}, {"x": -0.5262316753900923, "y": -0.01589846118053119, "z": 0.8501926033248157, "word": "Tinkling", "pos_group": "noun", "row_number": 159140, "definition": "A grackle (Quiscalus crassirostris) native of Jamaica. It often associates with domestic cattle and rids them of insects.", "details": []}, {"x": -0.6660304587107866, "y": 0.17236579403941638, "z": 0.7257364956474635, "word": "Tipula", "pos_group": "noun", "row_number": 159234, "definition": "Any one of many species of long-legged dipterous insects belonging to Tipula and allied genera. They have long and slender bodies. See Crane fly under Crane.", "details": []}, {"x": -0.6649136240191265, "y": -0.09274651833777689, "z": 0.7411396332203346, "word": "Tithymal", "pos_group": "noun", "row_number": 159324, "definition": "Any kind of spurge esp. Euphorbia Cyparissias.", "details": []}, {"x": -0.5266551615515973, "y": 0.1099640888503057, "z": 0.8429366761355108, "word": "Toadeater", "pos_group": "noun", "row_number": 159408, "definition": "A fawning obsequious parasite; a mean sycophant; a flatterer; a toady.", "details": []}, {"x": -0.7317201310019323, "y": 0.07620682396060927, "z": 0.6773316542642546, "word": "Tongue", "pos_group": "noun", "row_number": 159718, "definition": "The proboscis of a moth or a butterfly.", "details": []}, {"x": -0.5675381569333606, "y": -0.07683902161667781, "z": 0.8197537466713256, "word": "Tongue", "pos_group": "noun", "row_number": 159719, "definition": "The lingua of an insect.", "details": []}, {"x": -0.6045282392272431, "y": 0.18271639040616625, "z": 0.7753452964026741, "word": "Torilto", "pos_group": "noun", "row_number": 160016, "definition": "A species of Turnix (Turnix sylvatica) native of Spain and Northen Africa.", "details": []}, {"x": -0.7142348991118203, "y": -0.04704014627642979, "z": 0.6983235163797795, "word": "Tornaria", "pos_group": "noun", "row_number": 160044, "definition": "The peculiar free swimming larva of Balanoglossus. See Illust. in Append.", "details": []}, {"x": -0.5153637731509516, "y": 0.03217467767932458, "z": 0.856367311052825, "word": "Tortricid", "pos_group": "adjective", "row_number": 160132, "definition": "Of or pertaining to Tortix or the family Tortricidae.", "details": []}, {"x": -0.6989492670427283, "y": 0.14522190794398515, "z": 0.7002717469336753, "word": "Tortrix", "pos_group": "noun", "row_number": 160133, "definition": "Any one of numerous species of small moths of the family Tortricidae the larvae of which usually roll up the leaves of plants on which they live; -- also called leaf roller.", "details": []}, {"x": -0.6271068563259158, "y": -0.10081582936126074, "z": 0.7723814856010134, "word": "Tortrix", "pos_group": "noun", "row_number": 160134, "definition": "A genus of tropical short-tailed snakes which are not venomous. One species (Tortrix scytalae) is handsomely banded with black and is sometimes worn alive by the natives of Brazil for a necklace.", "details": []}, {"x": -0.549369349902288, "y": 0.14902197536481404, "z": 0.8221835368373086, "word": "Trachea", "pos_group": "noun", "row_number": 160512, "definition": "One of the respiratory tubes of insects and arachnids.", "details": []}, {"x": -0.7359241393166388, "y": 0.02665411783591479, "z": 0.6765391482933223, "word": "Trachearia", "pos_group": "other", "row_number": 160515, "definition": "A division of Arachnida including those that breathe only by means of tracheae. It includes the mites ticks false scorpions and harvestmen.", "details": []}, {"x": -0.5384881526288468, "y": -0.04282896053037012, "z": 0.8415439320785691, "word": "Tracheata", "pos_group": "other", "row_number": 160518, "definition": "An extensive division of arthropods comprising all those which breathe by tracheae as distinguished from Crustacea which breathe by means of branchiae.", "details": []}, {"x": -0.6430578850685219, "y": 0.18212106858527405, "z": 0.7438470762384949, "word": "Tracheate", "pos_group": "noun", "row_number": 160520, "definition": "Any arthropod having tracheae; one of the Tracheata.", "details": []}, {"x": -0.6863449529764623, "y": -0.08020228417875604, "z": 0.7228403690554698, "word": "Trachelidan", "pos_group": "noun", "row_number": 160523, "definition": "Any one of a tribe of beetles (Trachelides) which have the head supported on a pedicel. The oil beetles and the Cantharides are examples.", "details": []}, {"x": -0.5178338854172944, "y": 0.08168414897531565, "z": 0.8515725259305909, "word": "Tracheobranchia", "pos_group": "noun", "row_number": 160531, "definition": "One of the gill-like breathing organs of certain aquatic insect larvae. They contain tracheal tubes somewhat similar to those of other insects.", "details": []}, {"x": -0.723094543881869, "y": 0.10536006810017508, "z": 0.6826664900653893, "word": "Trachymedusae", "pos_group": "other", "row_number": 160541, "definition": "A division of acalephs in which the development is direct from the eggs without a hydroid stage. Some of the species are parasitic on other medusae.", "details": []}, {"x": -0.5888963574809654, "y": -0.09156043563026287, "z": 0.8030054587441156, "word": "Tradescantia", "pos_group": "noun", "row_number": 160625, "definition": "A genus including spiderwort and Wandering Jew.", "details": []}, {"x": -0.5814584480914758, "y": 0.1752481498963481, "z": 0.7944772867118101, "word": "Transform", "pos_group": "other", "row_number": 161000, "definition": "To change the form of; to change in shape or appearance; to metamorphose; as a caterpillar is ultimately transformed into a butterfly.", "details": []}, {"x": -0.7267019679597488, "y": -0.021304867824457317, "z": 0.6866224234398485, "word": "Transformation", "pos_group": "noun", "row_number": 161008, "definition": "Change of one from of material into another as in assimilation; metabolism; metamorphosis.", "details": []}, {"x": -0.5198638769440161, "y": 0.001670115434053327, "z": 0.8542474818008972, "word": "Trematodea", "pos_group": "other", "row_number": 161602, "definition": "An extensive order of parasitic worms. They are found in the internal cavities of animals belonging to all classes. Many species are found also on the gills and skin of fishes. A few species are parasitic on man and some of which the fluke is the most important are injurious parasites of domestic animals. The trematodes usually have a flattened body covered with a chitinous skin and are furnished with two or more suckers for adhesion. Most of the species are hermaphrodite. Called also Trematoda and Trematoidea. See Fluke Tristoma and Cercaria.", "details": []}, {"x": -0.6796421344903093, "y": 0.16445722866161755, "z": 0.7148708897181341, "word": "Tremex", "pos_group": "noun", "row_number": 161614, "definition": "A genus of large hymenopterous insects allied to the sawflies. The female lays her eggs in holes which she bores in the trunks of trees with her large and long ovipositor and the larva bores in the wood. See Illust. of Horntail.", "details": []}, {"x": -0.6508923862113027, "y": -0.09868024577375582, "z": 0.752729241272177, "word": "Trichina", "pos_group": "noun", "row_number": 161847, "definition": "A small slender nematoid worm (Trichina spiralis) which in the larval state is parasitic often in immense numbers in the voluntary muscles of man the hog and many other animals. When insufficiently cooked meat containing the larvae is swallowed by man they are liberated and rapidly become adult pair and the ovoviviparous females produce in a short time large numbers of young which find their way into the muscles either directly", "details": []}, {"x": -0.5334073187983837, "y": 0.1266107173493209, "z": 0.8363290970094308, "word": "Trichoptera", "pos_group": "other", "row_number": 161868, "definition": "A suborder of Neuroptera usually having the wings covered with minute hairs. It comprises the caddice flies and is considered by some to be a distinct order.", "details": []}, {"x": -0.735476950541385, "y": 0.05756530252220881, "z": 0.6750999119892342, "word": "Trichoscolices", "pos_group": "other", "row_number": 161872, "definition": "An extensive group of wormlike animals characterized by being more or less covered with cilia.", "details": []}, {"x": -0.5549269684010362, "y": -0.06601622976185256, "z": 0.8292755375321678, "word": "Trilobita", "pos_group": "other", "row_number": 162091, "definition": "An extinct order of arthropods comprising the trilobites.", "details": []}, {"x": -0.619061493669086, "y": 0.185382645101545, "z": 0.7631488334206867, "word": "Trimera", "pos_group": "other", "row_number": 162116, "definition": "A division of Coleoptera including those which have but three joints in the tarsi.", "details": []}, {"x": -0.7051015858937615, "y": -0.06182432930301494, "z": 0.7064060488673173, "word": "Tritovum", "pos_group": "noun", "row_number": 162386, "definition": "An embryonic insect which has twice cast its skin previous to hatching from the egg.", "details": []}, {"x": -0.5139828090291362, "y": 0.05129634204981647, "z": 0.8562653544987247, "word": "Triungulus", "pos_group": "noun", "row_number": 162428, "definition": "The active young larva of any oil beetle. It has feet armed with three claws and is parasitic on bees. See Illust. of Oil beetle under Oil.", "details": []}, {"x": -0.7098134983172776, "y": 0.13178528341769363, "z": 0.6919519034449622, "word": "Trochanter", "pos_group": "noun", "row_number": 162463, "definition": "The third joint of the leg of an insect or the second when the trochantine is united with the coxa.", "details": []}, {"x": -0.612148821601747, "y": -0.1001482702219742, "z": 0.7843750022681364, "word": "Trochantine", "pos_group": "noun", "row_number": 162465, "definition": "The second joint of the leg of an insect -- often united with the coxa.", "details": []}, {"x": -0.5602528122529694, "y": 0.16146157492295093, "z": 0.8124327333299903, "word": "Trochilus", "pos_group": "noun", "row_number": 162477, "definition": "Any one of several species of wrens and kinglets.", "details": []}, {"x": -0.7345236277294914, "y": 0.007613535092668072, "z": 0.6785403999693018, "word": "Trochoid", "pos_group": "adjective", "row_number": 162492, "definition": "Of or pertaining to the genus Trochus or family Trochidae.", "details": []}, {"x": -0.5293514837539322, "y": -0.027207689407166037, "z": 0.847966242420436, "word": "Troilus", "pos_group": "noun", "row_number": 162518, "definition": "A large handsome American butterfly (Euph/ades / Papilio troilus). It is black with yellow marginal spots on the front wings and blue spots on the rear wings.", "details": []}, {"x": -0.6576260108949674, "y": 0.17810760228958103, "z": 0.7319875079542196, "word": "Trophi", "pos_group": "other", "row_number": 162581, "definition": "The mouth parts of an insect collectively including the labrum labium maxillae mandibles and lingua with their appendages.", "details": []}, {"x": -0.6736834798120636, "y": -0.08993366866072716, "z": 0.7335274393432951, "word": "Trumpie", "pos_group": "noun", "row_number": 162805, "definition": "The Richardson's skua (Stercorarius parasiticus).", "details": []}, {"x": -0.5216230581459128, "y": 0.10003562539876011, "z": 0.8472911299320821, "word": "Truncus", "pos_group": "noun", "row_number": 162825, "definition": "The thorax of an insect. See Trunk n. 5.", "details": []}, {"x": -0.7298619323883659, "y": 0.08800361814324126, "z": 0.6779062788055725, "word": "Trunk", "pos_group": "noun", "row_number": 162845, "definition": "That segment of the body of an insect which is between the head and abdomen and bears the wings and legs; the thorax; the truncus.", "details": []}, {"x": -0.5748088359685752, "y": -0.08433940024132716, "z": 0.8139297682597588, "word": "Trunk", "pos_group": "noun", "row_number": 162847, "definition": "The proboscis of an insect.", "details": []}, {"x": -0.5951572080069658, "y": 0.18194198394768846, "z": 0.7827419831812602, "word": "Trygon", "pos_group": "noun", "row_number": 162954, "definition": "Any one of several species of large sting rays belonging to Trygon and allied genera.", "details": []}, {"x": -0.7202771208771084, "y": -0.038426615450883723, "z": 0.6926212993880374, "word": "Tsetse", "pos_group": "noun", "row_number": 162975, "definition": "A venomous two-winged African fly (Glossina morsitans) whose bite is very poisonous and even fatal to horses and cattle but harmless to men. It renders extensive districts in which it abounds uninhabitable during certain seasons of the year.", "details": []}, {"x": -0.5153223772636537, "y": 0.020210065118109476, "z": 0.8567580759813465, "word": "Tube", "pos_group": "noun", "row_number": 163000, "definition": "A more or less cylindrical and often spiral case secreted or constructed by many annelids crustaceans insects and other animals for protection or concealment. See Illust. of Tubeworm.", "details": []}, {"x": -0.6924587882896073, "y": 0.15421787089550493, "z": 0.7047820051739022, "word": "Tubicolous", "pos_group": "adjective", "row_number": 163043, "definition": "Inhabiting a tube; as tubicolous worms.", "details": []}, {"x": -0.6362167241892115, "y": -0.10214734469099128, "z": 0.7647183794277007, "word": "Tumbledung", "pos_group": "noun", "row_number": 163176, "definition": "Any one of numerous species of scaraboid beetles belonging to Scarabaeus Copris Phanaeus and allied genera. The female lays her eggs in a globular mass of dung which she rolls by means of her hind legs to a burrow excavated in the earth in which she buries it.", "details": []}, {"x": -0.5419206017125086, "y": 0.1419506136407998, "z": 0.8283550475047236, "word": "Tunicated", "pos_group": "adjective", "row_number": 163294, "definition": "Having each joint buried in the preceding funnel-shaped one as in certain antennae of insects.", "details": []}, {"x": -0.7372905635365147, "y": 0.03838342193931867, "z": 0.6744844978502003, "word": "Turbellaria", "pos_group": "other", "row_number": 163343, "definition": "An extensive group of worms which have the body covered externally with vibrating cilia. It includes the Rhabdoc/la and Dendroc/la. Formerly the nemerteans were also included in this group.", "details": []}, {"x": -0.5434204798364264, "y": -0.05308868614259047, "z": 0.8377802656412967, "word": "Turbinoid", "pos_group": "adjective", "row_number": 163366, "definition": "Like or pertaining to Turbo or the family Turbinidae.", "details": []}, {"x": -0.633909555481868, "y": 0.18548448271166643, "z": 0.7508356558808099, "word": "Turk", "pos_group": "noun", "row_number": 163430, "definition": "The plum weevil. See Curculio and Plum weevil under Plum.", "details": []}, {"x": -0.6943985800129759, "y": -0.07493131302708454, "z": 0.7156786362635116, "word": "Turnus", "pos_group": "noun", "row_number": 163560, "definition": "A common large handsome American swallowtail butterfly now regarded as one of the forms of Papilio / Jasoniades glaucus. The wings are yellow margined and barred with black and with an orange-red spot near the posterior angle of the hind wings. Called also tiger swallowtail. See Illust. under Swallowtail.", "details": []}, {"x": -0.5146027293193239, "y": 0.0705096846806931, "z": 0.8545246721677098, "word": "Tussock", "pos_group": "noun", "row_number": 163621, "definition": "A caterpillar of any one of numerous species of bombycid moths. The body of these caterpillars is covered with hairs which form long tufts or brushes. Some species are very injurious to shade and fruit trees. Called also tussock caterpillar. See Orgyia.", "details": []}, {"x": -0.7192966543047201, "y": 0.11653516359123485, "z": 0.6848590210786452, "word": "Ularburong", "pos_group": "noun", "row_number": 164144, "definition": "A large East Indian nocturnal tree snake (Dipsas dendrophila). It is not venomous.", "details": []}, {"x": -0.5972262699045234, "y": -0.09689700429776857, "z": 0.7961983126671693, "word": "Ulonata", "pos_group": "other", "row_number": 164182, "definition": "A division of insects nearly equivalent to the true Orthoptera.", "details": []}, {"x": -0.5724660025169827, "y": 0.1719040970953869, "z": 0.8017054679644176, "word": "Uncinus", "pos_group": "noun", "row_number": 164686, "definition": "One of the peculiar minute chitinous hooks found in large numbers in the tori of tubicolous annelids belonging to the Uncinata.", "details": []}, {"x": -0.7311260107066001, "y": -0.01106609531655488, "z": 0.6821526940522169, "word": "Underwing", "pos_group": "noun", "row_number": 165248, "definition": "One of the posterior wings of an insect.", "details": []}, {"x": -0.5218306983816979, "y": -0.01012059074105908, "z": 0.8529890361953788, "word": "Underwing", "pos_group": "noun", "row_number": 165249, "definition": "Any one of numerous species of noctuid moths belonging to Catocala and allied genera in which the hind wings are banded with red and black or other conspicuous colors. Many of the species are called red underwing.", "details": []}, {"x": -0.6718087304321769, "y": 0.17157044681716618, "z": 0.7205807459917762, "word": "Unguis", "pos_group": "noun", "row_number": 165603, "definition": "One of the terminal hooks on the foot of an insect.", "details": []}, {"x": -0.6599738328474319, "y": -0.09740861723746465, "z": 0.7449470459331692, "word": "Unicorn", "pos_group": "noun", "row_number": 165706, "definition": "Any large beetle having a hornlike prominence on the head or prothorax.", "details": []}, {"x": -0.5273443715011258, "y": 0.11758348288395695, "z": 0.8414761068497196, "word": "Unicorn", "pos_group": "noun", "row_number": 165707, "definition": "The larva of a unicorn moth.", "details": []}, {"x": -0.7348278194598397, "y": 0.06957490157113147, "z": 0.674675780519254, "word": "Unicornous", "pos_group": "adjective", "row_number": 165710, "definition": "Having but a single horn; -- said of certain insects.", "details": []}, {"x": -0.5614458355479715, "y": -0.07473233336468448, "z": 0.824132059864018, "word": "Unwormed", "pos_group": "adjective", "row_number": 166800, "definition": "Not wormed; not having had the worm or lytta under the tongue cut out; -- said of a dog.", "details": []}, {"x": -0.6095898507412488, "y": 0.18618868014721723, "z": 0.7705413611599959, "word": "Urania", "pos_group": "noun", "row_number": 167063, "definition": "A genus of large brilliantly colored moths native of the West Indies and South America. Their bright colored and tailed hind wings and their diurnal flight cause them to closely resemble butterflies.", "details": []}, {"x": -0.7120447477130138, "y": -0.05432564219693006, "z": 0.7000292864260763, "word": "Urbicolae", "pos_group": "other", "row_number": 167105, "definition": "An extensive family of butterflies including those known as skippers (Hesperiadae).", "details": []}, {"x": -0.5127132911574447, "y": 0.039394822448827305, "z": 0.8576556004800102, "word": "Urocerata", "pos_group": "other", "row_number": 167196, "definition": "A division of boring Hymenoptera including Tremex and allied genera. See Illust. of Horntail.", "details": []}, {"x": -0.7042333648792258, "y": 0.14180376411584386, "z": 0.6956630364432632, "word": "Urochord", "pos_group": "noun", "row_number": 167197, "definition": "The central axis or cord in the tail of larval ascidians and of certain adult tunicates.", "details": []}, {"x": -0.6211449424469948, "y": -0.1030512670177285, "z": 0.7768908525903496, "word": "Urosome", "pos_group": "noun", "row_number": 167226, "definition": "The abdomen or post-abdomen of arthropods.", "details": []}, {"x": -0.5520611339781898, "y": 0.15568520316891224, "z": 0.8191401722934661, "word": "Urosternite", "pos_group": "noun", "row_number": 167231, "definition": "The sternal or under piece of any one of the uromeres of insects and other arthropods.", "details": []}, {"x": -0.7371000202680242, "y": 0.019005065960222892, "z": 0.6755163710738072, "word": "Ursula", "pos_group": "noun", "row_number": 167245, "definition": "A beautiful North American butterfly (Basilarchia / Limenitis astyanax). Its wings are nearly black with red and blue spots and blotches. Called also red-spotted purple.", "details": []}, {"x": -0.5332425667395954, "y": -0.0382649726347762, "z": 0.8450965370217938, "word": "Utricle", "pos_group": "noun", "row_number": 167395, "definition": "A microscopic cell in the structure of an egg animal or plant.", "details": []}, {"x": -0.6488031254901387, "y": 0.1829855371174719, "z": 0.738627644730454, "word": "Vagantes", "pos_group": "other", "row_number": 167535, "definition": "A tribe of spiders comprising some of those which take their prey in a web but which also frequently run with agility and chase and seize their prey.", "details": []}, {"x": -0.6822991715406311, "y": -0.08609874035180498, "z": 0.7259854319645823, "word": "Vagina", "pos_group": "noun", "row_number": 167544, "definition": "The terminal part of the oviduct in insects and various other invertebrates. See Illust. of Spermatheca.", "details": []}, {"x": -0.5172373372833098, "y": 0.08946403628270891, "z": 0.8511531725442124, "word": "Vampire", "pos_group": "noun", "row_number": 167753, "definition": "Either one of two or more species of South American blood-sucking bats belonging to the genera Desmodus and Diphylla. These bats are destitute of molar teeth but have strong sharp cutting incisors with which they make punctured wounds from which they suck the blood of horses cattle and other animals as well as man chiefly during sleep. They have a caecal appendage to the stomach in which the blood with which they gorge themselves is stored.", "details": []}, {"x": -0.7272049778577099, "y": 0.0997263798873835, "z": 0.6791373714746709, "word": "Vampire", "pos_group": "noun", "row_number": 167754, "definition": "Any one of several species of harmless tropical American bats of the genus Vampyrus especially V. spectrum. These bats feed upon insects and fruit but were formerly erroneously supposed to suck the blood of man and animals. Called also false vampire.", "details": []}, {"x": -0.582611240617893, "y": -0.09108710823315852, "z": 0.8076306587911336, "word": "Vanessa", "pos_group": "noun", "row_number": 167790, "definition": "Any one of numerous species of handsomely colored butterflies belonging to Vanessa and allied genera. Many of these species have the edges of the wings irregularly scalloped.", "details": []}, {"x": -0.5858014517022412, "y": 0.18013155492748412, "z": 0.7901830687270852, "word": "Vansire", "pos_group": "noun", "row_number": 167828, "definition": "An ichneumon (Herpestes galera) native of Southern Africa and Madagascar. It is reddish brown or dark brown grizzled with white. Called also vondsira and marsh ichneumon.", "details": []}, {"x": -0.7257651673517753, "y": -0.029038084759699136, "z": 0.6873294053744087, "word": "Vein", "pos_group": "noun", "row_number": 168195, "definition": "One of the ribs or nervures of the wings of insects. See Venation.", "details": []}, {"x": -0.5160834064050553, "y": 0.008138980490545152, "z": 0.8564996641154795, "word": "Velum", "pos_group": "noun", "row_number": 168248, "definition": "A thin membrane surrounding the sporocarps of quillworts Isoetes).", "details": []}, {"x": -0.6853396219635647, "y": 0.1625954958093961, "z": 0.7098396349242093, "word": "Venantes", "pos_group": "other", "row_number": 168276, "definition": "The hunting spiders which run after or leap upon their prey.", "details": []}, {"x": -0.645451361591716, "y": -0.10246032041562252, "z": 0.7568978944083067, "word": "Venation", "pos_group": "noun", "row_number": 168281, "definition": "The arrangement or system of veins as in the wing of an insect or in the leaves of a plant. See Illust. in Appendix.", "details": []}, {"x": -0.5349171929630498, "y": 0.1339956824422055, "z": 0.8342114562623668, "word": "Venene", "pos_group": "adjective", "row_number": 168318, "definition": "Poisonous; venomous.", "details": []}, {"x": -0.7378756736540601, "y": 0.05039686815026137, "z": 0.6730524837709256, "word": "Venomous", "pos_group": "adjective", "row_number": 168366, "definition": "Full of venom; noxious to animal life; poisonous; as the bite of a serpent may be venomous.", "details": []}, {"x": -0.5490599553717267, "y": -0.06288344819517558, "z": 0.8334139651759396, "word": "Venomous", "pos_group": "adjective", "row_number": 168367, "definition": "Having a poison gland or glands for the secretion of venom as certain serpents and insects.", "details": []}, {"x": -0.6245003165471297, "y": 0.18787785589950404, "z": 0.7580905393784703, "word": "Venter", "pos_group": "noun", "row_number": 168398, "definition": "The lower part of the abdomen in insects.", "details": []}, {"x": -0.7021298653322271, "y": -0.06869480215560532, "z": 0.7087275050153977, "word": "Ventriculus", "pos_group": "noun", "row_number": 168436, "definition": "One of the stomachs of certain insects.", "details": []}, {"x": -0.5121083918909818, "y": 0.058881702550802745, "z": 0.8569001925892835, "word": "Venule", "pos_group": "noun", "row_number": 168468, "definition": "A small vein; a veinlet; specifically (Zool.) one of the small branches of the veins of the wings in insects.", "details": []}, {"x": -0.7147348864441743, "y": 0.12741314440092327, "z": 0.6876917425224056, "word": "Vermeologist", "pos_group": "noun", "row_number": 168612, "definition": "One who treats of vermes or worms; a helminthologist.", "details": []}, {"x": -0.6059459868847819, "y": -0.10134158358626663, "z": 0.7890242990012764, "word": "Vermeology", "pos_group": "noun", "row_number": 168613, "definition": "A discourse or treatise on worms; that part of zoology which treats of worms; helminthology.", "details": []}, {"x": -0.5636632536043265, "y": 0.1675417349428681, "z": 0.8088346577567745, "word": "Vermes", "pos_group": "other", "row_number": 168614, "definition": "An extensive artificial division of the animal kingdom including the parasitic worms or helminths together with the nemerteans annelids and allied groups. By some writers the branchiopods the bryzoans and the tunicates are also included. The name was used in a still wider sense by Linnaeus and his followers.", "details": []}, {"x": -0.7348806173978897, "y": -0.00021783496690028908, "z": 0.6781964543705781, "word": "Vermicide", "pos_group": "noun", "row_number": 168619, "definition": "A medicine which destroys intestinal worms; a worm killer.", "details": []}, {"x": -0.5245954332872784, "y": -0.021791380323101673, "z": 0.8510727155289063, "word": "Vermicious", "pos_group": "adjective", "row_number": 168620, "definition": "Of or pertaining to worms; wormy.", "details": []}, {"x": -0.6634686099695573, "y": 0.1778970237371773, "z": 0.726747585156303, "word": "Vermicular", "pos_group": "adjective", "row_number": 168621, "definition": "Of or pertaining to a worm or worms; resembling a worm; shaped like a worm; especially resembling the motion or track of a worm; as the vermicular or peristaltic motion of the intestines. See Peristaltic.", "details": []}, {"x": -0.6690046696251312, "y": -0.09509672152453906, "z": 0.7371494865867121, "word": "Vermiculate", "pos_group": "adjective", "row_number": 168625, "definition": "Wormlike in shape; covered with wormlike elevations; marked with irregular fine lines of color or with irregular wavy impressed lines like worm tracks; as a vermiculate nut.", "details": []}, {"x": -0.5218633963653071, "y": 0.10780901904815622, "z": 0.8461889924514148, "word": "Vermiculate", "pos_group": "adjective", "row_number": 168626, "definition": "Crawling or creeping like a worm; hence insinuating; sophistical.", "details": []}, {"x": -0.7333713223694173, "y": 0.08164581897114767, "z": 0.6749077446367487, "word": "Vermiculation", "pos_group": "noun", "row_number": 168630, "definition": "Penetration by worms; the state of being wormeaten.", "details": []}, {"x": -0.5685735746861375, "y": -0.08279124161092842, "z": 0.818455680218024, "word": "Vermicule", "pos_group": "noun", "row_number": 168632, "definition": "A small worm or insect larva; also a wormlike body.", "details": []}, {"x": -0.6000283089710043, "y": 0.18596408792725902, "z": 0.7780638704083229, "word": "Vermiculous", "pos_group": "adjective", "row_number": 168635, "definition": "Containing or full of worms; resembling worms.", "details": []}, {"x": -0.7185116717828528, "y": -0.04596438361290556, "z": 0.6939944185300744, "word": "Vermiformia", "pos_group": "other", "row_number": 168637, "definition": "A tribe of worms including Phoronis. See Phoronis.", "details": []}, {"x": -0.5122364761077127, "y": 0.02725226701288547, "z": 0.8584119678146451, "word": "Vermifugal", "pos_group": "adjective", "row_number": 168638, "definition": "Tending to prevent destroy or expel worms or vermin; anthelmintic.", "details": []}, {"x": -0.6979609017885536, "y": 0.1513147627995592, "z": 0.6999674436239319, "word": "Vermifuge", "pos_group": "noun", "row_number": 168639, "definition": "A medicine or substance that expels worms from animal bodies; an anthelmintic.", "details": []}, {"x": -0.630369430383075, "y": -0.10496459329404734, "z": 0.769166311920337, "word": "Vermilinguia", "pos_group": "other", "row_number": 168641, "definition": "A tribe of edentates comprising the South American ant-eaters. The tongue is long slender exsertile and very flexible whence the name.", "details": []}, {"x": -0.5442256698967927, "y": 0.1489569240441284, "z": 0.8256090206657744, "word": "Vermin", "pos_group": "other", "row_number": 168648, "definition": "A noxious or mischievous animal; especially noxious little animals or insects collectively as squirrels rats mice flies lice bugs etc.", "details": []}, {"x": -0.7389228991513944, "y": 0.03081042063409937, "z": 0.6730851856117828, "word": "Vermiparous", "pos_group": "adjective", "row_number": 168657, "definition": "Producing or breeding worms.", "details": []}, {"x": -0.537888968737126, "y": -0.04898019218483988, "z": 0.8415915862723721, "word": "Vermivorous", "pos_group": "adjective", "row_number": 168658, "definition": "Devouring worms; feeding on worms; as vermivorous birds.", "details": []}, {"x": -0.6396204640357692, "y": 0.1869449493760086, "z": 0.7456119955375373, "word": "Vespa", "pos_group": "noun", "row_number": 168842, "definition": "A genus of Hymenoptera including the common wasps and hornets.", "details": []}, {"x": -0.6906901486702333, "y": -0.0812512909062685, "z": 0.7185717405074848, "word": "Vespertiliones", "pos_group": "other", "row_number": 168849, "definition": "A tribe of bats including the common insectivorous bats of America and Europe belonging to Vespertilio and allied genera. They lack a nose membrane.", "details": []}, {"x": -0.5135433604870645, "y": 0.07831808567505144, "z": 0.8544820035295351, "word": "Vespiary", "pos_group": "noun", "row_number": 168854, "definition": "A nest or habitation of insects of the wasp kind.", "details": []}, {"x": -0.7237529461254985, "y": 0.11128325960372748, "z": 0.6810269518210205, "word": "Vestales", "pos_group": "other", "row_number": 168886, "definition": "A group of butterflies including those known as virgins or gossamer-winged butterflies.", "details": []}, {"x": -0.5908945670800699, "y": -0.09701547902574217, "z": 0.8008942548330975, "word": "Vibratile", "pos_group": "adjective", "row_number": 169011, "definition": "Adapted to or used in vibratory motion; having the power of vibrating; vibratory; as the vibratile organs of insects.", "details": []}, {"x": -0.5765322132115362, "y": 0.17727866948959062, "z": 0.7976107324211532, "word": "Vibrio", "pos_group": "noun", "row_number": 169020, "definition": "A genus of motile bacteria characterized by short slightly sinuous filaments and an undulatory motion; also an individual of this genus.", "details": []}, {"x": -0.7306447944397283, "y": -0.018931756879703825, "z": 0.6824952548842923, "word": "Viceroy", "pos_group": "other", "row_number": 169065, "definition": "A large and handsome American butterfly (Basilarchia / Limenitis archippus). Its wings are orange-red with black lines along the nervures and a row of white spots along the outer margins. The larvae feed on willow poplar and apple trees.", "details": []}, {"x": -0.5176555881186392, "y": -0.003947779811360573, "z": 0.8555799828912002, "word": "Violet", "pos_group": "noun", "row_number": 169402, "definition": "Any one of numerous species of small violet-colored butterflies belonging to Lycaena or Rusticus and allied genera.", "details": []}, {"x": -0.6776331606351357, "y": 0.1702781034569693, "z": 0.7154150313564387, "word": "Violet-tip", "pos_group": "noun", "row_number": 169404, "definition": "A very handsome American butterfly (Polygonia interrogationis). Its wings are mottled with various shades of red and brown and have violet tips.", "details": []}, {"x": -0.654740993262504, "y": -0.10173250282086842, "z": 0.7489757870661987, "word": "Viper", "pos_group": "adjective", "row_number": 169415, "definition": "Any one of numerous species of Old World venomous makes belonging to Vipera Clotho Daboia and other genera of the family Viperidae.", "details": []}, {"x": -0.5284206172805204, "y": 0.12520107022963933, "z": 0.8397001507956436, "word": "Viperous", "pos_group": "adjective", "row_number": 169422, "definition": "Having the qualities of a viper; malignant; venomous; as a viperous tongue.", "details": []}, {"x": -0.7376585817741527, "y": 0.06260746958201427, "z": 0.6722649191259967, "word": "Virgin", "pos_group": "noun", "row_number": 169445, "definition": "Any one of several species of gossamer-winged butterflies of the family Lycaenidae.", "details": []}, {"x": -0.5553758672663602, "y": -0.072128866438353, "z": 0.8284654927541982, "word": "Virgin", "pos_group": "noun", "row_number": 169446, "definition": "A female insect producing eggs from which young are hatched though there has been no fecundation by a male; a parthenogenetic insect.", "details": []}, {"x": -0.6148963562369194, "y": 0.18926376624579233, "z": 0.7655597284817284, "word": "Vitellogene", "pos_group": "noun", "row_number": 169653, "definition": "A gland secreting the yolk of the eggs in trematodes turbellarians and some other helminths.", "details": []}, {"x": -0.7094719203115254, "y": -0.06152197445733628, "z": 0.7020431902300225, "word": "Vitrella", "pos_group": "noun", "row_number": 169674, "definition": "One of the transparent lenslike cells in the ocelli of certain arthropods.", "details": []}, {"x": -0.5103833052083665, "y": 0.04688073500492107, "z": 0.858668200441813, "word": "V moth", "pos_group": "other", "row_number": 169788, "definition": "A common gray European moth (Halia vauaria) having a V-shaped spot of dark brown on each of the fore wings.", "details": []}, {"x": -0.7094283234966803, "y": 0.13790447799523553, "z": 0.6911539689313454, "word": "Vortex", "pos_group": "noun", "row_number": 170092, "definition": "Any one of numerous species of small Turbellaria belonging to Vortex and allied genera. See Illustration in Appendix.", "details": []}, {"x": -0.6149949208498595, "y": -0.10484269634543322, "z": 0.7815300738627363, "word": "Vorticella", "pos_group": "noun", "row_number": 170097, "definition": "Any one of numerous species of ciliated Infusoria belonging to Vorticella and many other genera of the family Vorticellidae. They have a more or less bell-shaped body with a circle of vibrating cilia around the oral disk. Most of the species have slender contractile stems either simple or branched.", "details": []}, {"x": -0.5551204630004022, "y": 0.16217471227831146, "z": 0.8158067382999886, "word": "Vulturish", "pos_group": "adjective", "row_number": 170233, "definition": "Vulturous.", "details": []}, {"x": -0.7379227782150395, "y": 0.011168288339211742, "z": 0.6747927405707398, "word": "Vulva", "pos_group": "noun", "row_number": 170237, "definition": "The orifice of the oviduct of an insect or other invertebrate.", "details": []}, {"x": -0.5281512230669287, "y": -0.033250277484979496, "z": 0.8484990893454627, "word": "Wainscot", "pos_group": "noun", "row_number": 170404, "definition": "Any one of numerous species of European moths of the family Leucanidae.", "details": []}, {"x": -0.6546749131139232, "y": 0.1833729680557337, "z": 0.7333315162501253, "word": "Walker", "pos_group": "other", "row_number": 170524, "definition": "Any ambulatorial orthopterous insect as a stick insect.", "details": []}, {"x": -0.6779133883184598, "y": -0.09174219617583029, "z": 0.7293948226985304, "word": "Wallbird", "pos_group": "noun", "row_number": 170545, "definition": "The spotted flycatcher.", "details": []}, {"x": -0.5170166911568114, "y": 0.0973478566256425, "z": 0.8504217400064839, "word": "Wall-plat", "pos_group": "noun", "row_number": 170586, "definition": "The spotted flycatcher. It builds its nest on walls.", "details": []}, {"x": -0.7311018665220343, "y": 0.09368642277092805, "z": 0.675805382455914, "word": "Warega fly", "pos_group": "other", "row_number": 170794, "definition": "A Brazilian fly whose larvae live in the skin of man and animals producing painful sores.", "details": []}, {"x": -0.5762661164046319, "y": -0.09011837206829887, "z": 0.8122783033540186, "word": "Wasp", "pos_group": "noun", "row_number": 171035, "definition": "Any one of numerous species of stinging hymenopterous insects esp. any of the numerous species of the genus Vespa which includes the true or social wasps some of which are called yellow jackets.", "details": []}, {"x": -0.590447454735738, "y": 0.1846905425499532, "z": 0.7856597270375341, "word": "Waspish", "pos_group": "adjective", "row_number": 171036, "definition": "Resembling a wasp in form; having a slender waist like a wasp.", "details": []}, {"x": -0.7244423450332411, "y": -0.03678813705025083, "z": 0.6883530501821798, "word": "Water beetle", "pos_group": "other", "row_number": 171149, "definition": "Any one of numerous species of aquatic beetles belonging to Dytiscus and allied genera of the family Dytiscidae and to various genera of the family Hydrophilidae. These beetles swim with great agility the fringed hind legs acting together like oars.", "details": []}, {"x": -0.5125702562963348, "y": 0.014957182797398398, "z": 0.8585150057180566, "word": "Water bug", "pos_group": "other", "row_number": 171163, "definition": "The Croton bug.", "details": []}, {"x": -0.6910297566591849, "y": 0.16023535334631753, "z": 0.7048421858469658, "word": "Water bug", "pos_group": "other", "row_number": 171164, "definition": "Any one of numerous species of large rapacious aquatic hemipterous insects belonging to Belostoma Benacus Zaitha and other genera of the family Belostomatidae. Their hind legs are long and fringed and act like oars. Some of these insects are of great size being among the largest existing Hemiptera. Many of them come out of the water and fly about at night.", "details": []}, {"x": -0.6397547636862565, "y": -0.10585449212633631, "z": 0.7612546675307925, "word": "Water devil", "pos_group": "other", "row_number": 171205, "definition": "The rapacious larva of a large water beetle (Hydrophilus piceus) and of other similar species. See Illust. of Water beetle.", "details": []}, {"x": -0.5368123383045587, "y": 0.14130991058851927, "z": 0.8317836393037895, "word": "Water mite", "pos_group": "other", "row_number": 171306, "definition": "Any of numerous species of aquatic mites belonging to Hydrachna and allied genera of the family Hydrachnidae usually having the legs fringed and adapted for swimming. They are often red or red and black in color and while young are parasites of fresh-water insects and mussels. Called also water tick and water spider.", "details": []}, {"x": -0.7399625964929005, "y": 0.04294690730215451, "z": 0.6712755909048573, "word": "Water spider", "pos_group": "other", "row_number": 171402, "definition": "An aquatic European spider (Argyoneta aquatica) which constructs its web beneath the surface of the water on water plants. It lives in a bell-shaped structure of silk open beneath like a diving bell and filled with air which the spider carries down in the form of small bubbles attached one at a time to the spinnerets and hind feet. Called also diving spider.", "details": []}, {"x": -0.5432684999892837, "y": -0.059264582277529364, "z": 0.8374646537059719, "word": "Water spider", "pos_group": "other", "row_number": 171404, "definition": "Any spider that habitually lives on or about the water especially the large American species (Dolomedes lanceolatus) which runs rapidly on the surface of water; -- called also raft spider.", "details": []}, {"x": -0.63014042961209, "y": 0.18993765250881262, "z": 0.7528922413783611, "word": "Water tiger", "pos_group": "other", "row_number": 171422, "definition": "A diving or water beetle especially the larva of a water beetle. See Illust. b of Water beetle.", "details": []}, {"x": -0.6987865787617805, "y": -0.07540905486629508, "z": 0.7113443552784952, "word": "Wax", "pos_group": "noun", "row_number": 171532, "definition": "A substance similar to beeswax secreted by several species of scale insects as the Chinese wax. See Wax insect below.", "details": []}, {"x": -0.5105816878527002, "y": 0.06667213212516931, "z": 0.8572404369996621, "word": "Weaver", "pos_group": "noun", "row_number": 171777, "definition": "An aquatic beetle of the genus Gyrinus. See Whirling.", "details": []}, {"x": -0.7195158782259344, "y": 0.12258233682922892, "z": 0.6835718482195182, "word": "Web", "pos_group": "noun", "row_number": 171787, "definition": "The texture of very fine thread spun by a spider for catching insects at its prey; a cobweb.", "details": []}, {"x": -0.5996034317548818, "y": -0.10206333729484493, "z": 0.7937624328525555, "word": "Webform", "pos_group": "noun", "row_number": 171821, "definition": "Any one of various species of moths whose gregarious larvae eat the leaves of trees and construct a large web to which they retreat when not feeding.", "details": []}, {"x": -0.5674211253028288, "y": 0.17338506252099598, "z": 0.8049663885248017, "word": "Weevil", "pos_group": "noun", "row_number": 171934, "definition": "Any one of numerous species of snout beetles or Rhynchophora in which the head is elongated and usually curved downward. Many of the species are very injurious to cultivated plants. The larvae of some of the species live in nuts fruit and grain by eating out the interior as the plum weevil or curculio the nut weevils and the grain weevil (see under Plum Nut and Grain). The larvae of other species bore under the bark and into the pith of trees and various other plants as the pine weevils (see under Pine). See also Pea weevil", "details": []}, {"x": -0.7348657640423519, "y": -0.008171388210578497, "z": 0.6781633558761211, "word": "Weeviled", "pos_group": "adjective", "row_number": 171935, "definition": "Infested by weevils; as weeviled grain.", "details": []}, {"x": -0.5200413523972233, "y": -0.015957925481179722, "z": 0.8539920002032831, "word": "Whealworm", "pos_group": "noun", "row_number": 172342, "definition": "The harvest mite; -- so called from the wheals caused by its bite.", "details": []}, {"x": -0.6693860767927233, "y": 0.1771933669008161, "z": 0.7214740403662485, "word": "Wheatworm", "pos_group": "noun", "row_number": 172349, "definition": "A small nematode worm (Anguillula tritici) which attacks the grains of wheat in the ear. It is found in wheat affected with smut each of the diseased grains containing a large number of the minute young of the worm.", "details": []}, {"x": -0.6640143568224707, "y": -0.09994955073822222, "z": 0.7410094609658289, "word": "Whipparee", "pos_group": "noun", "row_number": 172663, "definition": "A large sting ray (Dasybatis / Trygon Sayi) native of the Southern United States. It is destitute of large spines on the body and tail.", "details": []}, {"x": -0.5224892800835554, "y": 0.11561798061334903, "z": 0.8447706403259168, "word": "Whipworm", "pos_group": "noun", "row_number": 172688, "definition": "A nematode worm (Trichocephalus dispar) often found parasitic in the human intestine. Its body is thickened posteriorly but is very long and threadlike anteriorly.", "details": []}, {"x": -0.736624441616296, "y": 0.0749253663059623, "z": 0.6721388409379402, "word": "Whirligig", "pos_group": "noun", "row_number": 172714, "definition": "Any one of numerous species of beetles belonging to Gyrinus and allied genera. The body is firm oval or boatlike in form and usually dark colored with a bronzelike luster. These beetles live mostly on the surfac
