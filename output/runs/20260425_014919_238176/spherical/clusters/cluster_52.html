6835, "word": "Coleopterist", "pos_group": "noun", "row_number": 29636, "definition": "One versed in the study of the Coleoptera.", "details": []}, {"x": -0.5809918383924952, "y": 0.03307375131082438, "z": 0.8132371183704901, "word": "Colleterial", "pos_group": "adjective", "row_number": 29792, "definition": "Of or pertaining to the colleterium of insects.", "details": []}, {"x": -0.6612127317613249, "y": 0.09248784112424377, "z": 0.7444754680987834, "word": "Colleterium", "pos_group": "noun", "row_number": 29793, "definition": "An organ of female insects containing a cement to unite the ejected ova.", "details": []}, {"x": -0.6350348036868094, "y": -0.022797539720057464, "z": 0.7721470522440449, "word": "Collophore", "pos_group": "noun", "row_number": 29862, "definition": "A suckerlike organ at the base of the abdomen of insects belonging to the Collembola.", "details": []}, {"x": -0.5932048966681083, "y": 0.0878862254970961, "z": 0.8002399402284622, "word": "Colorado beetle", "pos_group": "other", "row_number": 29948, "definition": "A yellowish beetle (Doryphora decemlineata) with ten longitudinal black dorsal stripes. It has migrated eastwards from its original habitat in Colorado and is very destructive to the potato plant; -- called also potato beetle and potato bug. See Potato beetle.", "details": []}, {"x": -0.6812413735355576, "y": 0.040051299435203615, "z": 0.730962437062903, "word": "Coluber", "pos_group": "noun", "row_number": 29997, "definition": "A genus of harmless serpents.", "details": []}, {"x": -0.5931506966019846, "y": -0.00033472100146241744, "z": 0.8050913855472753, "word": "Comb", "pos_group": "noun", "row_number": 30072, "definition": "The waxen framework forming the walls of the cells in which bees store their honey eggs etc.; honeycomb.", "details": []}, {"x": -0.6349344747806094, "y": 0.10730911549091256, "z": 0.7650770983813525, "word": "Commensal", "pos_group": "noun", "row_number": 30305, "definition": "An animal not truly parasitic which lives in with or on another partaking usually of the same food. Both species may be benefited by the association.", "details": []}, {"x": -0.6615748350086206, "y": -0.01117767520595282, "z": 0.749795837051865, "word": "Complicant", "pos_group": "adjective", "row_number": 30882, "definition": "Overlapping as the elytra of certain beetles.", "details": []}, {"x": -0.5802907492790345, "y": 0.055848663527050424, "z": 0.8124921987831141, "word": "Condylopod", "pos_group": "noun", "row_number": 31672, "definition": "An arthropod.", "details": []}, {"x": -0.6736142539258109, "y": 0.07570991606293852, "z": 0.7351951071094774, "word": "Constrictor", "pos_group": "noun", "row_number": 32713, "definition": "A serpent that kills its prey by inclosing and crushing it with its folds; as the boa constrictor.", "details": []}, {"x": -0.6172956455139326, "y": -0.020868547490724258, "z": 0.7864544422629736, "word": "Copperhead", "pos_group": "noun", "row_number": 33754, "definition": "A poisonous American serpent (Ancistrodon conotortrix) closely allied to the rattlesnake but without rattles; -- called also copper-belly and red viper.", "details": []}, {"x": -0.606846791571534, "y": 0.10186028270147165, "z": 0.7882648377083121, "word": "Copperworm", "pos_group": "noun", "row_number": 33766, "definition": "The ringworm.", "details": []}, {"x": -0.6787627436389533, "y": 0.017464723916421846, "z": 0.734149931053762, "word": "Coprophagan", "pos_group": "noun", "row_number": 33779, "definition": "A kind of beetle which feeds upon dung.", "details": []}, {"x": -0.583004677786539, "y": 0.019004310657648883, "z": 0.81224650313525, "word": "Coprophagous", "pos_group": "adjective", "row_number": 33780, "definition": "Feeding upon dung as certain insects.", "details": []}, {"x": -0.6522869739610591, "y": 0.10139110657542996, "z": 0.7511601341312878, "word": "Coplatry", "pos_group": "adjective", "row_number": 33806, "definition": "Used in sexual union; as the copulatory organs of insects.", "details": []}, {"x": -0.6459973726763049, "y": -0.021844013759784755, "z": 0.7630270202018887, "word": "Core", "pos_group": "noun", "row_number": 33959, "definition": "A disorder of sheep occasioned by worms in the liver.", "details": []}, {"x": -0.5857726002509945, "y": 0.07753374012186859, "z": 0.8067583156918204, "word": "Corneule", "pos_group": "noun", "row_number": 34087, "definition": "One of the corneas of a compound eye in the invertebrates.", "details": []}, {"x": -0.681020909604227, "y": 0.05436827852131235, "z": 0.7302428438351589, "word": "Corselet", "pos_group": "noun", "row_number": 34430, "definition": "The thorax of an insect.", "details": []}, {"x": -0.6007333520650595, "y": -0.011104043324173337, "z": 0.7993723412393827, "word": "Costa", "pos_group": "noun", "row_number": 34576, "definition": "The anterior rib in the wing of an insect.", "details": []}, {"x": -0.6237605819265002, "y": 0.10883654876631194, "z": 0.774000866981008, "word": "Coxa", "pos_group": "noun", "row_number": 35386, "definition": "The first joint of the leg of an insect or crustacean.", "details": []}, {"x": -0.6702698831321439, "y": -0.0026437048532645105, "z": 0.7421127236415442, "word": "Crawl", "pos_group": "other", "row_number": 35755, "definition": "To have a sensation as of insect creeping over the body; as the flesh crawls. See Creep v. i. 7.", "details": []}, {"x": -0.5784616186511322, "y": 0.04170187779360235, "z": 0.8146429335211833, "word": "Crawl", "pos_group": "noun", "row_number": 35756, "definition": "The act or motion of crawling; slow motion as of a creeping animal.", "details": []}, {"x": -0.6673950060374969, "y": 0.08802561224711998, "z": 0.7394831962287779, "word": "Creep", "pos_group": "other", "row_number": 35941, "definition": "To have a sensation as of insects creeping on the skin of the body; to crawl; as the sight made my flesh creep. See Crawl v. i. 4.", "details": []}, {"x": -0.6281154162436726, "y": -0.024876994929545496, "z": 0.7777224177046161, "word": "Creep", "pos_group": "noun", "row_number": 35944, "definition": "A distressing sensation or sound like that occasioned by the creeping of insects.", "details": []}, {"x": -0.596910308548557, "y": 0.09541247237919527, "z": 0.7966144259696505, "word": "Creepiness", "pos_group": "noun", "row_number": 35958, "definition": "An uneasy sensation as of insects creeping on the skin.", "details": []}, {"x": -0.6823837821184229, "y": 0.03099290910139746, "z": 0.7303367808670117, "word": "Creepy", "pos_group": "adjective", "row_number": 35964, "definition": "Crawly; having or producing a sensation like that caused by insects creeping on the skin.", "details": []}, {"x": -0.587426292753544, "y": 0.005482889463931109, "z": 0.8092590984999515, "word": "Cremaster", "pos_group": "noun", "row_number": 35969, "definition": "The apex of the last abdominal segment of an insect.", "details": []}, {"x": -0.6419277596130524, "y": 0.10777412477946413, "z": 0.7591531396669502, "word": "Crepusculous", "pos_group": "adjective", "row_number": 36035, "definition": "Flying in the twilight or evening or before sunrise; -- said certain birds and insects.", "details": []}, {"x": -0.6566602927490793, "y": -0.01772002484282871, "z": 0.7539782892406538, "word": "Cribellum", "pos_group": "noun", "row_number": 36153, "definition": "A peculiar perforated organ of certain spiders (Ciniflonidae) used for spinning a special kind of silk.", "details": []}, {"x": -0.5802201414190918, "y": 0.06502881467343163, "z": 0.8118594956972405, "word": "Cricket", "pos_group": "noun", "row_number": 36162, "definition": "An orthopterous insect of the genus Gryllus and allied genera. The males make chirping musical notes by rubbing together the basal parts of the veins of the front wings.", "details": []}, {"x": -0.6783262477686163, "y": 0.06868302520645385, "z": 0.7315436717220916, "word": "Crotalus", "pos_group": "noun", "row_number": 36631, "definition": "A genus of poisonous serpents including the rattlesnakes.", "details": []}, {"x": -0.6100830125146068, "y": -0.01971160650513175, "z": 0.7920922739239973, "word": "Croton bug", "pos_group": "other", "row_number": 36651, "definition": "A small active winged species of cockroach (Ectobia Germanica) the water bug. It is common aboard ships and in houses in cities esp. in those with hot-water pipes.", "details": []}, {"x": -0.6124596526075479, "y": 0.10717535525073489, "z": 0.7832027943992034, "word": "Cucujo", "pos_group": "noun", "row_number": 37140, "definition": "The fire beetle of Mexico and the West Indies.", "details": []}, {"x": -0.6773805744394246, "y": 0.008429070133189042, "z": 0.7355844670388336, "word": "Cucullated", "pos_group": "adjective", "row_number": 37144, "definition": "Having the prothorax elevated so as to form a sort of hood receiving the head as in certain insects.", "details": []}, {"x": -0.579098521737797, "y": 0.027005171187459043, "z": 0.8148101759613918, "word": "Cucurbitive", "pos_group": "adjective", "row_number": 37153, "definition": "Having the shape of a gourd seed; -- said of certain small worms.", "details": []}, {"x": -0.659124568073938, "y": 0.09860718667815145, "z": 0.745541029385214, "word": "Culex", "pos_group": "noun", "row_number": 37216, "definition": "A genus of dipterous insects including the gnat and mosquito.", "details": []}, {"x": -0.6394900511041186, "y": -0.0257743498792539, "z": 0.7683672022068313, "word": "Curculio", "pos_group": "noun", "row_number": 37476, "definition": "One of a large group of beetles (Rhynchophora) of many genera; -- called also weevils snout beetles billbeetles and billbugs. Many of the species are very destructive as the plum curculio the corn grain and rice weevils etc.", "details": []}, {"x": -0.5882117161799436, "y": 0.08611144406407971, "z": 0.8041093185319048, "word": "Cursores", "pos_group": "other", "row_number": 37642, "definition": "A group of running spiders; the wolf spiders.", "details": []}, {"x": -0.6836212994717116, "y": 0.045612937292800526, "z": 0.7284101721284043, "word": "Cutworm", "pos_group": "noun", "row_number": 37901, "definition": "A caterpillar which at night eats off young plants of cabbage corn etc. usually at the ground. Some kinds ascend fruit trees and eat off the flower buds. During the day they conceal themselves in the earth. The common cutworms are the larvae of various species of Agrotis and related genera of noctuid moths.", "details": []}, {"x": -0.5941248640817566, "y": -0.0067890962498837505, "z": 0.8043441763647848, "word": "Cyathophylloid", "pos_group": "adjective", "row_number": 37931, "definition": "Like or pertaining to the family Cyathophyllidae.", "details": []}, {"x": -0.6305977493435163, "y": 0.11121809256051825, "z": 0.7680996122965378, "word": "Cyphonautes", "pos_group": "noun", "row_number": 38064, "definition": "The free-swimming bivalve larva of certain Bryozoa.", "details": []}, {"x": -0.6664730343384127, "y": -0.010510707423000774, "z": 0.7454550419235335, "word": "Cysticercus", "pos_group": "noun", "row_number": 38104, "definition": "The larval form of a tapeworm having the head and neck of a tapeworm attached to a saclike body filled with fluid; -- called also bladder worm hydatid and measle (as pork measle).", "details": []}, {"x": -0.5768960761358176, "y": 0.05091686431198626, "z": 0.8152290415998019, "word": "Daboia", "pos_group": "noun", "row_number": 38171, "definition": "A large and highly venomous Asiatic viper (Daboia xanthica).", "details": []}, {"x": -0.6731949222467417, "y": 0.08227610549688398, "z": 0.7348736211931065, "word": "Dactyl", "pos_group": "noun", "row_number": 38183, "definition": "The claw or terminal joint of a leg of an insect or crustacean.", "details": []}, {"x": -0.6207949141056365, "y": -0.02564257712738905, "z": 0.7835535290322169, "word": "Dactylar", "pos_group": "adjective", "row_number": 38185, "definition": "Of or pertaining to a finger or toe or to the claw of an insect crustacean.", "details": []}, {"x": -0.6015913023385614, "y": 0.10228702111683007, "z": 0.7922280418299005, "word": "Daddy longlegs", "pos_group": "other", "row_number": 38212, "definition": "An arachnidan of the genus Phalangium and allied genera having a small body and four pairs of long legs; -- called also harvestman carter and grandfather longlegs.", "details": []}, {"x": -0.6824869012559235, "y": 0.02158142916322613, "z": 0.7305791343375199, "word": "Daddy longlegs", "pos_group": "other", "row_number": 38213, "definition": "A name applied to many species of dipterous insects of the genus Tipula and allied genera with slender bodies and very long slender legs; the crane fly; -- called also father longlegs.", "details": []}, {"x": -0.582260256964996, "y": 0.012474740998213687, "z": 0.8129067437265388, "word": "Dauber", "pos_group": "noun", "row_number": 38760, "definition": "The mud wasp; the mud dauber.", "details": []}, {"x": -0.6491371772595393, "y": 0.1068581701920307, "z": 0.7531283134783396, "word": "Dayfly", "pos_group": "noun", "row_number": 38832, "definition": "A neuropterous insect of the genus Ephemera and related genera of many species and inhabiting fresh water in the larval state; the ephemeral fly; -- so called because it commonly lives but one day in the winged or adult state. See Ephemeral fly under Ephemeral.", "details": []}, {"x": -0.6508674358136084, "y": -0.023398383183592816, "z": 0.7588307430921681, "word": "Deathwatch", "pos_group": "noun", "row_number": 39036, "definition": "A small beetle (Anobium tessellatum and other allied species). By forcibly striking its head against woodwork it makes a ticking sound which is a call of the sexes to each other but has been imagined by superstitious people to presage death.", "details": []}, {"x": -0.5812306564426005, "y": 0.07431569161064804, "z": 0.8103382639316339, "word": "Deathwatch", "pos_group": "noun", "row_number": 39037, "definition": "A small wingless insect of the family Psocidae which makes a similar but fainter sound; -- called also deathtick.", "details": []}, {"x": -0.6823209742302305, "y": 0.060633228780035985, "z": 0.7285339386008156, "word": "Demoiselle", "pos_group": "noun", "row_number": 40716, "definition": "A beautiful small dragon fly of the genus Agrion.", "details": []}, {"x": -0.6028473352172327, "y": -0.017150526676785478, "z": 0.7976722070225277, "word": "Dentated", "pos_group": "adjective", "row_number": 40958, "definition": "Having teeth or toothlike points. See Illust. of Antennae.", "details": []}, {"x": -0.6188250199606139, "y": 0.11144069587076703, "z": 0.7775837999692283, "word": "Dermatophyte", "pos_group": "noun", "row_number": 41524, "definition": "A vegetable parasite infesting the skin.", "details": []}, {"x": -0.6749100445726373, "y": -0.0004621564473986345, "z": 0.7378998700002454, "word": "Dermestes", "pos_group": "noun", "row_number": 41525, "definition": "A genus of coleopterous insects the larvae of which feed animal substances. They are very destructive to dries meats skins woolens and furs. The most common species is D. lardarius known as the bacon beetle.", "details": []}, {"x": -0.5760465745511146, "y": 0.03584398403748199, "z": 0.8166306097350553, "word": "Dermestoid", "pos_group": "adjective", "row_number": 41526, "definition": "Pertaining to or resembling the genus Dermestes.", "details": []}, {"x": -0.6657904720293476, "y": 0.09444084374338542, "z": 0.740137807700685, "word": "Dermoptera", "pos_group": "other", "row_number": 41537, "definition": "The division of insects which includes the earwigs (Forticulidae).", "details": []}, {"x": -0.632381005969159, "y": -0.028501816047434875, "z": 0.7741330052203126, "word": "Dermopteran", "pos_group": "noun", "row_number": 41540, "definition": "An insect which has the anterior pair of wings coriaceous and does not use them in flight as the earwig.", "details": []}, {"x": -0.5917117562085499, "y": 0.0942968119590161, "z": 0.8006155811742358, "word": "Desman", "pos_group": "noun", "row_number": 41788, "definition": "An amphibious insectivorous mammal found in Russia (Myogale moschata). It is allied to the moles but is called muskrat by some English writers.", "details": []}, {"x": -0.6852573049349394, "y": 0.03623248341616744, "z": 0.72739922544556, "word": "Desmodont", "pos_group": "noun", "row_number": 41793, "definition": "A member of a group of South American blood-sucking bats of the genera Desmodus and Diphylla. See Vampire.", "details": []}, {"x": -0.5878785469102675, "y": -0.0011578357368783976, "z": 0.8089483750518809, "word": "Dewworm", "pos_group": "noun", "row_number": 42427, "definition": "See Earthworm.", "details": []}, {"x": -0.637865903682491, "y": 0.11228130940508, "z": 0.7619186285146203, "word": "Dicyemata", "pos_group": "other", "row_number": 42882, "definition": "An order of worms parasitic in cephalopods. They are remarkable for the extreme simplicity of their structure. The embryo exists in two forms.", "details": []}, {"x": -0.661676985887878, "y": -0.017748630815995967, "z": 0.7495789167595966, "word": "Dimera", "pos_group": "other", "row_number": 43360, "definition": "A division of Coleoptera having two joints to the tarsi.", "details": []}, {"x": -0.576374994061901, "y": 0.06052292649463188, "z": 0.8149410049743904, "word": "Dimera", "pos_group": "other", "row_number": 43361, "definition": "A division of the Hemiptera including the aphids.", "details": []}, {"x": -0.6784528716385513, "y": 0.07531891586441704, "z": 0.7307727156089041, "word": "Dionaea", "pos_group": "noun", "row_number": 43522, "definition": "An insectivorous plant. See Venus's flytrap.", "details": []}, {"x": -0.6132290776035886, "y": -0.025015911743140676, "z": 0.7895088995958888, "word": "Diplopoda", "pos_group": "other", "row_number": 43624, "definition": "An order of myriapods having two pairs of legs on each segment; the Chilognatha.", "details": []}, {"x": -0.6071776066963236, "y": 0.10831455625753396, "z": 0.7871488492205638, "word": "Dipneumona", "pos_group": "other", "row_number": 43627, "definition": "A group of spiders having only two lunglike organs.", "details": []}, {"x": -0.6814986125547358, "y": 0.012026756064230436, "z": 0.7317205738699316, "word": "Diptera", "pos_group": "other", "row_number": 43654, "definition": "An extensive order of insects having only two functional wings and two balancers as the house fly mosquito etc. They have a suctorial proboscis often including two pairs of sharp organs (mandibles and maxillae) with which they pierce the skin of animals. They undergo a complete metamorphosis their larvae (called maggots) being usually without feet.", "details": []}, {"x": -0.5777998220493215, "y": 0.020526404258527794, "z": 0.8159203590841376, "word": "Dipteral", "pos_group": "adjective", "row_number": 43655, "definition": "Having two wings only; belonging to the order Diptera.", "details": []}, {"x": -0.6563975378694598, "y": 0.10452017432221751, "z": 0.7471397496041583, "word": "Dipteran", "pos_group": "noun", "row_number": 43657, "definition": "An insect of the order Diptera.", "details": []}, {"x": -0.6442928046894415, "y": -0.02803763636370525, "z": 0.7642647923151697, "word": "Dipterous", "pos_group": "adjective", "row_number": 43659, "definition": "Having two wings as certain insects; belonging to the order Diptera.", "details": []}, {"x": -0.5833450528855778, "y": 0.08349190264956531, "z": 0.8079218102427227, "word": "Discolith", "pos_group": "noun", "row_number": 44141, "definition": "One of a species of coccoliths having an oval discoidal body with a thick strongly refracting rim and a thinner central portion. One of them measures about / of an inch in its longest diameter.", "details": []}, {"x": -0.6854682551842721, "y": 0.051706229148910765, "z": 0.7262642335967194, "word": "Disembowel", "pos_group": "other", "row_number": 44505, "definition": "To take or draw from the body as the web of a spider.", "details": []}, {"x": -0.5957580028668993, "y": -0.01318289120958652, "z": 0.803055797189336, "word": "Disk", "pos_group": "noun", "row_number": 44871, "definition": "The lower side of the body of some invertebrates especially when used for locomotion when it is often called a creeping disk.", "details": []}, {"x": -0.625823092581156, "y": 0.1145069674815998, "z": 0.7715138438098994, "word": "Distoma", "pos_group": "noun", "row_number": 45808, "definition": "A genus of parasitic trematode worms having two suckers for attaching themselves to the part they infest. See 1st Fluke 2.", "details": []}, {"x": -0.6713585268925322, "y": -0.008990933486782529, "z": 0.741078195255889, "word": "Ditokous", "pos_group": "adjective", "row_number": 46011, "definition": "Having two kinds of young as certain annelids.", "details": []}, {"x": -0.5739578106128089, "y": 0.04534832783777912, "z": 0.8176282534250321, "word": "Diurna", "pos_group": "other", "row_number": 46042, "definition": "A division of Lepidoptera including the butterflies; -- so called because they fly only in the daytime.", "details": []}, {"x": -0.6721164486545053, "y": 0.08892846775699502, "z": 0.7350858501361927, "word": "Dobson", "pos_group": "noun", "row_number": 46354, "definition": "The aquatic larva of a large neuropterous insect (Corydalus cornutus) used as bait in angling. See Hellgamite.", "details": []}, {"x": -0.6248095509307561, "y": -0.02990762380076182, "z": 0.780204177830585, "word": "Dog bee", "pos_group": "other", "row_number": 46508, "definition": "A male or drone bee.", "details": []}, {"x": -0.5962353935714293, "y": 0.10187808752308322, "z": 0.7963191638629339, "word": "Dor", "pos_group": "noun", "row_number": 46882, "definition": "A large European scaraboid beetle (Geotrupes stercorarius) which makes a droning noise while flying. The name is also applied to allied American species as the June bug. Called also dorr dorbeetle or dorrbeetle dorbug dorrfly and buzzard clock.", "details": []}, {"x": -0.6858446426537244, "y": 0.026420652057381148, "z": 0.7272682278829785, "word": "Dorhawk", "pos_group": "noun", "row_number": 46890, "definition": "The European goatsucker; -- so called because it eats the dor beetle. See Goatsucker.", "details": []}, {"x": -0.5821561605794541, "y": 0.0057156193772628745, "z": 0.813056908459994, "word": "Doryphora", "pos_group": "noun", "row_number": 46954, "definition": "A genus of plant-eating beetles including the potato beetle. See Potato beetle.", "details": []}, {"x": -0.6454105889180162, "y": 0.11194177616458414, "z": 0.7555886516231023, "word": "Dracunculus", "pos_group": "noun", "row_number": 47379, "definition": "The Guinea worm (Filaria medinensis).", "details": []}, {"x": -0.655947895304816, "y": -0.02415869658163783, "z": 0.7544194562871895, "word": "Dragon", "pos_group": "noun", "row_number": 47450, "definition": "A small arboreal lizard of the genus Draco of several species found in the East Indies and Southern Asia. Five or six of the hind ribs on each side are prolonged and covered with weblike skin forming a sort of wing. These prolongations aid them in making long leaps from tree to tree. Called also flying lizard.", "details": []}, {"x": -0.5769552497421421, "y": 0.07031110318201464, "z": 0.8137438101542219, "word": "Drill", "pos_group": "noun", "row_number": 47912, "definition": "A large African baboon (Cynocephalus leucophaeus).", "details": []}, {"x": -0.6830187018287938, "y": 0.06726362058373511, "z": 0.7272970908082038, "word": "Drone", "pos_group": "other", "row_number": 48048, "definition": "The male of bees esp. of the honeybee. It gathers no honey. See Honeybee.", "details": []}, {"x": -0.6055826485348467, "y": -0.022949680590994663, "z": 0.795451424006703, "word": "Drone bee", "pos_group": "other", "row_number": 48057, "definition": "The male of the honeybee; a drone.", "details": []}, {"x": -0.613576268157125, "y": 0.11331559231636275, "z": 0.7814625644855725, "word": "Drone fly", "pos_group": "other", "row_number": 48058, "definition": "A dipterous insect (Eristalis tenax) resembling the drone bee. See Eristalis.", "details": []}, {"x": -0.6793912999322801, "y": 0.0025464968952971056, "z": 0.7337717471597613, "word": "Dropworm", "pos_group": "noun", "row_number": 48131, "definition": "The larva of any geometrid moth which drops from trees by means of a thread of silk as the cankerworm.", "details": []}, {"x": -0.5741787582799197, "y": 0.029496237398860498, "z": 0.8181984634056944, "word": "Dubbing", "pos_group": "noun", "row_number": 48368, "definition": "The body substance of an angler's fly.", "details": []}, {"x": -0.6635390043761945, "y": 0.10075149804892664, "z": 0.7413265982765932, "word": "Dupion", "pos_group": "noun", "row_number": 48676, "definition": "A double cocoon made by two silkworms.", "details": []}, {"x": -0.6370532641045202, "y": -0.03148331073462182, "z": 0.7701765640675933, "word": "Duykerbok", "pos_group": "noun", "row_number": 48806, "definition": "A small South African antelope (Cephalous mergens); -- called also impoon and deloo.", "details": []}, {"x": -0.5865607498410755, "y": 0.09233806082621251, "z": 0.8046242410397102, "word": "Dynastidan", "pos_group": "noun", "row_number": 48901, "definition": "One of a group of gigantic horned beetles including Dynastus Neptunus and the Hercules beetle (D. Hercules) of tropical America which grow to be six inches in length.", "details": []}, {"x": -0.687654969364423, "y": 0.04207132025369361, "z": 0.7248176647409509, "word": "Earthmad", "pos_group": "noun", "row_number": 49097, "definition": "The earthworm.", "details": []}, {"x": -0.5889845857096927, "y": -0.007839096768266869, "z": 0.8081062469491492, "word": "Earthworm", "pos_group": "noun", "row_number": 49114, "definition": "Any worm of the genus Lumbricus and allied genera found in damp soil. One of the largest and most abundant species in Europe and America is L. terrestris; many others are known; -- called also angleworm and dewworm.", "details": []}, {"x": -0.6333167394213742, "y": 0.11624964953709965, "z": 0.7651117085440403, "word": "Earwig", "pos_group": "noun", "row_number": 49121, "definition": "Any insect of the genus Forticula and related genera belonging to the order Euplexoptera.", "details": []}, {"x": -0.6667587838008475, "y": -0.0169430305797959, "z": 0.7450809740821372, "word": "Echidna", "pos_group": "noun", "row_number": 49326, "definition": "A genus of Monotremata found in Australia Tasmania and New Guinea. They are toothless and covered with spines; -- called also porcupine ant-eater and Australian ant-eater.", "details": []}, {"x": -0.5729210778108628, "y": 0.05532655089155144, "z": 0.8177410417525123, "word": "Echidnine", "pos_group": "noun", "row_number": 49327, "definition": "The clear viscid fluid secreted by the poison glands of certain serpents; also a nitrogenous base contained in this and supposed to be the active poisonous principle of the virus.", "details": []}, {"x": -0.6779385592101846, "y": 0.08213861672107181, "z": 0.7305152685462281, "word": "Echinococcus", "pos_group": "noun", "row_number": 49334, "definition": "A parasite of man and of many domestic and wild animals forming compound cysts or tumors (called hydatid cysts) in various organs but especially in the liver and lungs which often cause death. It is the larval stage of the Taenia echinococcus a small tapeworm peculiar to the dog.", "details": []}, {"x": -0.6169287909022065, "y": -0.02990121214947567, "z": 0.7864507514574155, "word": "Ectoparasite", "pos_group": "noun", "row_number": 49473, "definition": "Any parasite which lives on the exterior of animals; -- opposed to endoparasite.", "details": []}, {"x": -0.6017206521494862, "y": 0.10865298536275672, "z": 0.791281735887135, "word": "Ectorganism", "pos_group": "noun", "row_number": 49482, "definition": "An external parasitic organism.", "details": []}, {"x": -0.6853216039962183, "y": 0.01638544138107549, "z": 0.7280561904185676, "word": "Eggar", "pos_group": "noun", "row_number": 49844, "definition": "Any bombycid moth of the genera Eriogaster and Lasiocampa; as the oak eggar (L. roboris) of Europe.", "details": []}, {"x": -0.577110813536196, "y": 0.01372663039415192, "z": 0.8165504813038887, "word": "Elapine", "pos_group": "adjective", "row_number": 50046, "definition": "Like or pertaining to the Elapidae a family of poisonous serpents including the cobras. See Ophidia.", "details": []}, {"x": -0.6530675319432163, "y": 0.110145834842198, "z": 0.7492467509362394, "word": "Elater", "pos_group": "noun", "row_number": 50078, "definition": "An elastic spiral filament for dispersing the spores as in some liverworts.", "details": []}, {"x": -0.6493750603504661, "y": -0.02955699070850269, "z": 0.7598936868372351, "word": "Elater", "pos_group": "noun", "row_number": 50079, "definition": "Any beetle of the family Elateridae having the habit when laid on the back of giving a sudden upward spring by a quick movement of the articulation between the abdomen and thorax; -- called also click beetle spring beetle and snapping beetle.", "details": []}, {"x": -0.5786693965963533, "y": 0.08006359014347632, "z": 0.8116227886008067, "word": "Elater", "pos_group": "noun", "row_number": 50080, "definition": "The caudal spring used by Podura and related insects for leaping. See Collembola.", "details": []}, {"x": -0.6867550029709244, "y": 0.05824771512060631, "z": 0.7245514264547647, "word": "Elephansy", "pos_group": "noun", "row_number": 50385, "definition": "Elephantiasis.", "details": []}, {"x": -0.5980258991024636, "y": -0.019428914099672866, "z": 0.8012412503731929, "word": "Elytroid", "pos_group": "adjective", "row_number": 50640, "definition": "Resembling a beetle's wing case.", "details": []}, {"x": -0.6206734256399186, "y": 0.11713044770928194, "z": 0.7752708926071142, "word": "Elytrum", "pos_group": "noun", "row_number": 50643, "definition": "One of the anterior pair of wings in the Coleoptera and some other insects when they are thick and serve only as a protection for the posterior pair.", "details": []}, {"x": -0.67616266538 ]}, {"x": -0.6611685134819275, "y": -0.024112629037157225, "z": 0.7498498369013722, "word": "Ennation", "pos_group": "noun", "row_number": 52193, "definition": "The ninth segment in insects.", "details": []}, {"x": -0.5730029992509004, "y": 0.06557168384611713, "z": 0.8169258945137297, "word": "Enteropneusta", "pos_group": "other", "row_number": 52447, "definition": "A group of wormlike invertebrates having along the sides of the body branchial openings for the branchial sacs which are formed by diverticula of the alimentary canal. Balanoglossus is the only known genus. See Illustration in Appendix.", "details": []}, {"x": -0.6831007146709139, "y": 0.07417086622596022, "z": 0.7265480687603383, "word": "Enthelminthes", "pos_group": "other", "row_number": 52485, "definition": "Intestinal worms. See Helminthes.", "details": []}, {"x": -0.6089024808980551, "y": -0.02842246629643761, "z": 0.7927357265607634, "word": "Entombed", "pos_group": "other", "row_number": 52559, "definition": "of Entomb", "details": []}, {"x": -0.6080819877947771, "y": 0.11443311734171381, "z": 0.7855834505480688, "word": "Entombing", "pos_group": "other", "row_number": 52560, "definition": "of Entomb", "details": []}, {"x": -0.6836506033826193, "y": 0.006344800375281088, "z": 0.7297818824846081, "word": "Entomical", "pos_group": "adjective", "row_number": 52565, "definition": "Relating to insects; entomological.", "details": []}, {"x": -0.57288359495531, "y": 0.022741972513631418, "z": 0.8193211759238677, "word": "Entomoid", "pos_group": "adjective", "row_number": 52566, "definition": "Resembling an insect.", "details": []}, {"x": -0.6606660632119866, "y": 0.10687205491197627, "z": 0.7430334560427725, "word": "Entomoid", "pos_group": "noun", "row_number": 52567, "definition": "An object resembling an insect.", "details": []}, {"x": -0.6420692413690445, "y": -0.033778557589780524, "z": 0.7659021467099655, "word": "Entomolite", "pos_group": "noun", "row_number": 52569, "definition": "A fossil insect.", "details": []}, {"x": -0.5815247162845876, "y": 0.08955831872381588, "z": 0.8085841402708152, "word": "Entomologic", "pos_group": "adjective", "row_number": 52570, "definition": "Alt. of Entomological", "details": []}, {"x": -0.6895401859979712, "y": 0.04843395335301562, "z": 0.7226261025291579, "word": "Entomologist", "pos_group": "noun", "row_number": 52572, "definition": "One versed in entomology.", "details": []}, {"x": -0.5907310374656531, "y": -0.014471648650191614, "z": 0.8067387512448493, "word": "Entomologize", "pos_group": "other", "row_number": 52573, "definition": "To collect specimens in the study of entomology.", "details": []}, {"x": -0.6283365343775483, "y": 0.11962287724454013, "z": 0.7686895126162121, "word": "Entomologies", "pos_group": "other", "row_number": 52574, "definition": "of Entomology", "details": []}, {"x": -0.6718360444935655, "y": -0.015309361947607894, "z": 0.7405416617287626, "word": "Entomology", "pos_group": "noun", "row_number": 52575, "definition": "That part of zoology which treats of insects.", "details": []}, {"x": -0.5699049174007786, "y": 0.04950494039223033, "z": 0.8202180478379962, "word": "Entomology", "pos_group": "noun", "row_number": 52576, "definition": "A treatise on the science of entomology.", "details": []}, {"x": -0.6767842425808448, "y": 0.08905200945513779, "z": 0.7307754980883487, "word": "Entomophaga", "pos_group": "other", "row_number": 52577, "definition": "One of a group of hymenopterous insects whose larvae feed parasitically upon living insects. See Ichneumon 2.", "details": []}, {"x": -0.6211343085917027, "y": -0.03429975623090481, "z": 0.7829531897966876, "word": "Entomophaga", "pos_group": "other", "row_number": 52578, "definition": "A group of marsupials which are partly insectivorous as the opossum.", "details": []}, {"x": -0.596158427086787, "y": 0.10818071936404622, "z": 0.7955451349680204, "word": "Entomophaga", "pos_group": "other", "row_number": 52579, "definition": "A group of edentates e subsisting in the interior of the body.", "details": []}, {"x": -0.5696004057927562, "y": 0.032602374888618904, "z": 0.8212749009146385, "word": "Entorganism", "pos_group": "noun", "row_number": 52601, "definition": "An internal parasitic organism.", "details": []}, {"x": -0.668032712954916, "y": 0.10213206080536005, "z": 0.7370897751140936, "word": "Entozoa", "pos_group": "other", "row_number": 52608, "definition": "A group of worms including the tapeworms flukes roundworms etc. most of which live parasitically in the interior of other animals; the Helminthes.", "details": []}, {"x": -0.6341605254563448, "y": -0.03668116332285825, "z": 0.7723308359830098, "word": "Entozoa", "pos_group": "other", "row_number": 52609, "definition": "An artificial group including all kinds of animals living parasitically in others.", "details": []}, {"x": -0.5855027716974683, "y": 0.0985736815821716, "z": 0.804655040146968, "word": "Epeira", "pos_group": "noun", "row_number": 52841, "definition": "A genus of spiders including the common garden spider (E. diadema). They spin geometrical webs. See Garden spider.", "details": []}, {"x": -0.6912712798315841, "y": 0.03800713960440499, "z": 0.7215950907670416, "word": "Ephemera", "pos_group": "noun", "row_number": 52859, "definition": "A genus of insects including the day flies or ephemeral flies. See Ephemeral fly under Ephemeral.", "details": []}, {"x": -0.5838685269988454, "y": -0.008128921712738326, "z": 0.8118075287973047, "word": "Ephemeral", "pos_group": "noun", "row_number": 52862, "definition": "Anything lasting but a day or a brief time; an ephemeral plant insect etc.", "details": []}, {"x": -0.6364169985345541, "y": 0.12068327539713011, "z": 0.7618457527713139, "word": "Ephemeran", "pos_group": "noun", "row_number": 52863, "definition": "One of the ephemeral flies.", "details": []}, {"x": -0.6664602048103164, "y": -0.023252896784842655, "z": 0.7451778970120522, "word": "Ephemeron", "pos_group": "noun", "row_number": 52873, "definition": "One of the ephemeral flies.", "details": []}, {"x": -0.5694270526119136, "y": 0.060152010253586886, "z": 0.8198381348877114, "word": "Epicranium", "pos_group": "noun", "row_number": 52928, "definition": "The dorsal wall of the head of insects.", "details": []}, {"x": -0.6825576401896271, "y": 0.08126719847431163, "z": 0.7262993255338356, "word": "Epimeron", "pos_group": "noun", "row_number": 53042, "definition": "In insects: The lateral piece behind the episternum.", "details": []}, {"x": -0.6127675636680376, "y": -0.03349396139223552, "z": 0.7895530808416827, "word": "Epipharynx", "pos_group": "noun", "row_number": 53059, "definition": "A structure which overlaps the mouth of certain insects.", "details": []}, {"x": -0.6024094550087591, "y": 0.11477044869962304, "z": 0.7898927728630873, "word": "Epiphyte", "pos_group": "noun", "row_number": 53075, "definition": "A vegetable parasite growing on the surface of the body.", "details": []}, {"x": -0.6876279625803545, "y": 0.010891568771122618, "z": 0.7259815140947424, "word": "Episternum", "pos_group": "noun", "row_number": 53142, "definition": "One of the lateral pieces next to the sternum in the thorax of insects.", "details": []}, {"x": -0.5721823549790662, "y": 0.015664727619468882, "z": 0.8199768100130745, "word": "Epozoic", "pos_group": "adjective", "row_number": 53222, "definition": "Living upon the exterior of another animal; ectozoic; -- said of external parasites.", "details": []}, {"x": -0.6572002086717327, "y": 0.1127204552815728, "z": 0.7452395485231215, "word": "Epizoon", "pos_group": "noun", "row_number": 53224, "definition": "One of the artificial group of invertebrates of various kinds which live parasitically upon the exterior of other animals; an ectozoon. Among them are the lice ticks many acari the lerneans or fish lice and other crustaceans.", "details": []}, {"x": -0.6473655689101662, "y": -0.035349989197916654, "z": 0.761359441035129, "word": "Erecto-patent", "pos_group": "adjective", , "definition": "A genus of small beetles one species of which (E. viti) is very injurious to the vines in the wine countries of Europe.", "details": []}, {"x": -0.5905594793300741, "y": 0.10689330580013776, "z": 0.7998833180836503, "word": "Euplexoptera", "pos_group": "other", "row_number": 54415, "definition": "An order of insects including the earwig. The anterior wings are short in the form of elytra while the posterior wings fold up beneath them. See Earwig.", "details": []}, {"x": -0.6918663821408468, "y": 0.027170432269277952, "z": 0.7215141556987197, "word": "Exarticulate", "pos_group": "adjective", "row_number": 54857, "definition": "Having but one joint; -- said of certain insects.", "details": []}, {"x": -0.5776033972342385, "y": -0.0004840933301837989, "z": 0.8163173899636795, "word": "Exsanguious", "pos_group": "adjective", "row_number": 55956, "definition": "Destitute of true or red blood as insects.", "details": []}, {"x": -0.6447531628288695, "y": 0.12023137383966384, "z": 0.7548760002588478, "word": "Exscutellate", "pos_group": "adjective", "row_number": 55963, "definition": "Without or apparently without a scutellum; -- said of certain insects.", "details": []}, {"x": -0.6601086225756063, "y": -0.030267279978466958, "z": 0.7505601229508804, "word": "Extra-ocular", "pos_group": "adjective", "row_number": 56216, "definition": "Inserted exterior to the eyes; -- said of the antennae of certain insects.", "details": []}, {"x": -0.5701341202979877, "y": 0.07094160514916155, "z": 0.8184829708252336, "word": "Eye-spot", "pos_group": "noun", "row_number": 56427, "definition": "A simple visual organ found in many invertebrates consisting of pigment cells covering a sensory nerve termination.", "details": []}, {"x": -0.6875586126056802, "y": 0.07234136861715479, "z": 0.7225163531840293, "word": "Facet", "pos_group": "noun", "row_number": 56544, "definition": "One of the numerous small eyes which make up the compound eyes of insects and crustaceans.", "details": []}, {"x": -0.6043548650562799, "y": -0.031145961582689778, "z": 0.7961062279368848, "word": "Falcer", "pos_group": "noun", "row_number": 56838, "definition": "One of the mandibles of a spider.", "details": []}, {"x": -0.6095020780488337, "y": 0.1202255752100132, "z": 0.7836153571233625, "word": "Fanfoot", "pos_group": "noun", "row_number": 57117, "definition": "A species of gecko having the toes expanded into large lobes for adhesion. The Egyptian fanfoot (Phyodactylus gecko) is believed by the natives to have venomous toes.", "details": []}, {"x": -0.6852646952627799, "y": 0.00046196749763978656, "z": 0.7282939543978383, "word": "Fanfoot", "pos_group": "noun", "row_number": 57118, "definition": "Any moth of the genus Polypogon.", "details": []}, {"x": -0.5682460359688872, "y": 0.025578469851286624, "z": 0.8224610534765235, "word": "Fang", "pos_group": "other", "row_number": 57121, "definition": "The tusk of an animal by which the prey is seized and held or torn; a long pointed tooth; esp. one of the usually erectile venomous teeth of serpents. Also one of the falcers of a spider.", "details": []}, {"x": -0.6650615973814479, "y": 0.10851014794182658, "z": 0.7388630586800776, "word": "Fan-nerved", "pos_group": "adjective", "row_number": 57142, "definition": "Having the nerves or veins arranged in a radiating manner; -- said of certain leaves and of the wings of some insects.", "details": []}, {"x": -0.6393818013879058, "y": -0.039087664979324685, "z": 0.7678952184383105, "word": "Farinose", "pos_group": "adjective", "row_number": 57246, "definition": "Civered with a sort of white mealy powder as the leaves of some poplars and the body of certain insects; mealy.", "details": []}, {"x": -0.5802616335827473, "y": 0.09570076447308523, "z": 0.8087878586323787, "word": "Faunal", "pos_group": "adjective", "row_number": 57584, "definition": "Relating to fauna.", "details": []}, {"x": -0.6932551812868558, "y": 0.04461925324635271, "z": 0.7193096522768663, "word": "Fecifork", "pos_group": "noun", "row_number": 57796, "definition": "The anal fork on which the larvae of certain insects carry their faeces.", "details": []}, {"x": -0.5856748950231662, "y": -0.015037561418920053, "z": 0.8104065578992902, "word": "Feeler", "pos_group": "noun", "row_number": 57901, "definition": "One of the sense organs or certain animals (as insects) which are used in testing objects by touch and in searching for food; an antenna; a palp.", "details": []}, {"x": -0.6312497918194153, "y": 0.12421548150187824, "z": 0.7655679032477792, "word": "Fenestrate", "pos_group": "adjective", "row_number": 58125, "definition": "Having transparent spots as the wings of certain butterflies.", "details": []}, {"x": -0.6717549680894974, "y": -0.02157803329202838, "z": 0.7404590814665767, "word": "Fer-de-lance", "pos_group": "noun", "row_number": 58168, "definition": "A large venomous serpent (Trigonocephalus lanceolatus) of Brazil and the West Indies. It is allied to the rattlesnake but has no rattle.", "details": []}, {"x": -0.5662767291143942, "y": 0.05411016406629469, "z": 0.8224370834344847, "word": "Fertilizer", "pos_group": "noun", "row_number": 58298, "definition": "One who fertilizes; the agent that carries the fertilizing principle as a moth to an orchid.", "details": []}, {"x": -0.6813846926332218, "y": 0.08846550437747276, "z": 0.7265595331288202, "word": "Fidia", "pos_group": "noun", "row_number": 58620, "definition": "A genus of small beetles of which one species (the grapevine Fidia F. longipes) is very injurious to vines in America.", "details": []}, {"x": -0.6171356774077573, "y": -0.03809373969384892, "z": 0.7859341083491707, "word": "Figeater", "pos_group": "noun", "row_number": 58705, "definition": "A large beetle (Allorhina nitida) which in the Southern United States destroys figs. The elytra are velvety green with pale borders.", "details": []}, {"x": -0.5966257076322472, "y": 0.11431077315237502, "z": 0.7943367120646171, "word": "Filanders", "pos_group": "other", "row_number": 58795, "definition": "A disease in hawks characterized by the presence of small threadlike worms also of filaments of coagulated blood from the rupture of a vein; -- called also backworm.", "details": []}, {"x": -0.6912667064759943, "y": 0.016141229539931704, "z": 0.722419408118837, "word": "Filaria", "pos_group": "noun", "row_number": 58797, "definition": "A genus of slender nematode worms of many species parasitic in various animals. See Guinea worm.", "details": []}, {"x": -0.5720916242428989, "y": 0.008348502149000991, "z": 0.8201472282358759, "word": "Fimbricate", "pos_group": "adjective", "row_number": 58945, "definition": "fringed on one side only by long straight hairs as the antennae of certain insects.", "details": []}, {"x": -0.6531736055761138, "y": 0.11821836854544783, "z": 0.7479228959706689, "word": "Fire beetle", "pos_group": "other", "row_number": 59180, "definition": "A very brilliantly luminous beetle (Pyrophorus noctilucus) one of the elaters found in Central and South America; -- called also cucujo. The name is also applied to other species. See Firefly.", "details": []}, {"x": -0.6528782450008653, "y": -0.03616602891972979, "z": 0.7565989793521846, "word": "Fireflaire", "pos_group": "noun", "row_number": 59194, "definition": "A European sting ray of the genus Trygon (T. pastinaca); -- called also fireflare and fiery flaw.", "details": []}, {"x": -0.5720545757378694, "y": 0.08164727728454589, "z": 0.8161417061328177, "word": "Firefly", "pos_group": "noun", "row_number": 59197, "definition": "Any luminous winged insect esp. luminous beetles of the family Lampyridae.", "details": []}, {"x": -0.6916481192128663, "y": 0.062422165108830946, "z": 0.7195320371550046, "word": "Fireworm", "pos_group": "noun", "row_number": 59219, "definition": "The larva of a small tortricid moth which eats the leaves of the cranberry so that the vines look as if burned; -- called also cranberry worm.", "details": []}, {"x": -0.5960729907013959, "y": -0.02724706853572255, "z": 0.8024678105771614, "word": "Flagellum", "pos_group": "other", "row_number": 59535, "definition": "A long whiplike cilium. See Flagellata.", "details": []}, {"x": -0.6173144925158851, "y": 0.12438549585936318, "z": 0.7768211285422634, "word": "Flagellum", "pos_group": "other", "row_number": 59536, "definition": "An appendage of the reproductive apparatus of the snail.", "details": []}, {"x": -0.6817076941411663, "y": -0.009608317871151833, "z": 0.7315615490007803, "word": "Flagellum", "pos_group": "other", "row_number": 59537, "definition": "A lashlike appendage of a crustacean esp. the terminal ortion of the antennae and the epipodite of the maxilipeds. See Maxilliped.", "details": []}, {"x": -0.5653516687863072, "y": 0.03625879262094693, "z": 0.8240526624908195, "word": "Flagworm", "pos_group": "noun", "row_number": 59567, "definition": "A worm or grub found among flags and sedge.", "details": []}, {"x": -0.6725800886607164, "y": 0.10280806007768321, "z": 0.732848229253647, "word": "Flatworm", "pos_group": "noun", "row_number": 59827, "definition": "Any worm belonging to the Plathelminthes; also sometimes applied to the planarians.", "details": []}, {"x": -0.6308609906439491, "y": -0.04139028807828733, "z": 0.7747911038057496, "word": "Flea", "pos_group": "noun", "row_number": 59879, "definition": "An insect belonging to the genus Pulex of the order Aphaniptera. Fleas are destitute of wings but have the power of leaping energetically. The bite is poisonous to most persons. The human flea (Pulex irritans) abundant in Europe is rare in America where the dog flea (P. canis) takes its place. See Aphaniptera and Dog flea. See Illustration in Appendix.", "details": []}, {"x": -0.5849912336932417, "y": 0.10479238768475398, "z": 0.8042411404456921, "word": "Flea-beetle", "pos_group": "noun", "row_number": 59881, "definition": "A small beetle of the family Halticidae of many species. They have strong posterior legs and leap like fleas. The turnip flea-beetle (Phyllotreta vittata) and that of the grapevine (Graptodera chalybea) are common injurious species.", "details": []}, {"x": -0.6944896152540382, "y": 0.033480507824318585, "z": 0.7187233333488788, "word": "Flea-bite", "pos_group": "noun", "row_number": 59882, "definition": "The bite of a flea or the red spot caused by the bite.", "details": []}, {"x": -0.5787944656183374, "y": -0.007720842316975205, "z": 0.8154369105967054, "word": "Flea-bitten", "pos_group": "adjective", "row_number": 59884, "definition": "Bitten by a flea; as a flea-bitten face.", "details": []}, {"x": -0.6398532911770393, "y": 0.12455050148560262, "z": 0.7583369556797266, "word": "Fleen", "pos_group": "other", "row_number": 59929, "definition": "Obs. pl. of Flea.", "details": []}, {"x": -0.6656258692617343, "y": -0.02942471074843004, "z": 0.7457052960566473, "word": "Flocculate", "pos_group": "adjective", "row_number": 60223, "definition": "Furnished with tufts of curly hairs as some insects.", "details": []}, {"x": -0.5663877661174374, "y": 0.06533915472670515, "z": 0.8215446994851217, "word": "Floccus", "pos_group": "noun", "row_number": 60233, "definition": "A woolly filament sometimes occuring with the sporules of certain fungi.", "details": []}, {"x": -0.6870423957353686, "y": 0.07972554607565165, "z": 0.7222302844419805, "word": "Fluke", "pos_group": "noun", "row_number": 60531, "definition": "A parasitic trematode worm of several species having a flat lanceolate body and two suckers. Two species (Fasciola hepatica and Distoma lanceolatum) are found in the livers of sheep and produce the disease called rot.", "details": []}, {"x": -0.6083515438346562, "y": -0.036460413483550905, "z": 0.7928297656890785, "word": "Fluor albus", "pos_group": "other", "row_number": 60566, "definition": "The whites; leucorrhaea.", "details": []}, {"x": -0.6036083962629133, "y": 0.120634188487901, "z": 0.7881017044320989, "word": "Fly", "pos_group": "other", "row_number": 60711, "definition": "Any winged insect; esp. one with transparent wings; as the Spanish fly; firefly; gall fly; dragon fly.", "details": []}, {"x": -0.689438177521975, "y": 0.005146717029203809, "z": 0.7243262460238473, "word": "Fly", "pos_group": "other", "row_number": 60712, "definition": "Any dipterous insect; as the house fly; flesh fly; black fly. See Diptera and Illust. in Append.", "details": []}, {"x": -0.5674766567202179, "y": 0.018225555362157145, "z": 0.8231877508863851, "word": "Fly", "pos_group": "other", "row_number": 60715, "definition": "A parasite.", "details": []}, {"x": -0.6615006688652252, "y": 0.11462842433518715, "z": 0.7411323697055012, "word": "Flybane", "pos_group": "noun", "row_number": 60732, "definition": "A kind of catchfly of the genus Silene; also a poisonous mushroom (Agaricus muscarius); fly agaric.", "details": []}, {"x": -0.6448877567568736, "y": -0.040782326234276904, "z": 0.7631884322053162, "word": "Fly-bitten", "pos_group": "adjective", "row_number": 60733, "definition": "Marked by or as if by the bite of flies.", "details": []}, {"x": -0.5751910334759794, "y": 0.09203861458635806, "z": 0.812824807959168, "word": "Flyblow", "pos_group": "other", "row_number": 60734, "definition": "To deposit eggs upon as a flesh fly does on meat; to cause to be maggoty; hence to taint or contaminate as if with flyblows.", "details": []}, {"x": -0.694703506300274, "y": 0.05168275939014339, "z": 0.7174370569714987, "word": "Flyblow", "pos_group": "noun", "row_number": 60735, "definition": "One of the eggs or young larvae deposited by a flesh fly or blowfly.", "details": []}, {"x": -0.5881003891538665, "y": -0.02182229938581241, "z": 0.8084934876216299, "word": "Fly-case", "pos_group": "noun", "row_number": 60739, "definition": "The covering of an insect esp. the elytra of beetles.", "details": []}, {"x": -0.625706033542123, "y": 0.1271138104664499, "z": 0.7696324049685559, "word": "Flycatcher", "pos_group": "noun", "row_number": 60740, "definition": "One of numerous species of birds that feed upon insects which they take on the wing.", "details": []}, {"x": -0.6769859996514827, "y": -0.01909288870249392, "z": 0.7357482027683633, "word": "Fly-catching", "pos_group": "adjective", "row_number": 60741, "definition": "Having the habit of catching insects on the wing.", "details": []}, {"x": -0.5635971779962726, "y": 0.04750800554702405, "z": 0.8246824906372038, "word": "Flyspeck", "pos_group": "noun", "row_number": 60757, "definition": "A speck or stain made by the excrement of a fly; hence any insignificant dot.", "details": []}, {"x": -0.6795820558051583, "y": 0.09567941981290602, "z": 0.7273332647775025, "word": "Flytrap", "pos_group": "noun", "row_number": 60759, "definition": "A trap for catching flies.", "details": []}, {"x": -0.6219614340414612, "y": -0.04215627634140839, "z": 0.7819122859567535, "word": "Fog", "pos_group": "noun", "row_number": 60821, "definition": "Dead or decaying grass remaining on land through the winter; -- called also foggage.", "details": []}, {"x": -0.5907974843345931, "y": 0.11304377918735636, "z": 0.7988613374616126, "word": "Footman", "pos_group": "noun", "row_number": 61150, "definition": "A moth of the family Lithosidae; -- so called from its livery-like colors.", "details": []}, {"x": -0.6945137872222413, "y": 0.02204350842016003, "z": 0.7191416293712594, "word": "Forceps", "pos_group": "noun", "row_number": 61292, "definition": "The caudal forceps-shaped appendage of earwigs and some other insects. See Earwig.", "details": []}, {"x": -0.5726229274519109, "y": 0.0008777271863909746, "z": 0.8198184021790376, "word": "Forester", "pos_group": "noun", "row_number": 61567, "definition": "A lepidopterous insect belonging to Alypia and allied genera; as the eight-spotted forester (A. octomaculata) which in the larval state is injurious to the grapevine.", "details": []}, {"x": -0.6486222713320301, "y": 0.12329154425344449, "z": 0.7510581497112452, "word": "Forficula", "pos_group": "noun", "row_number": 61645, "definition": "A genus of insects including the earwigs. See Earwig 1.", "details": []}, {"x": -0.6585426469268572, "y": -0.036201570464720105, "z": 0.7516721549149313, "word": "Formica", "pos_group": "noun", "row_number": 61833, "definition": "A Linnaean genus of hymenopterous insects including the common ants. See Ant.", "details": []}, {"x": -0.5677419956311588, "y": 0.07658486102155637, "z": 0.8196363739238628, "word": "Formicaroid", "pos_group": "adjective", "row_number": 61834, "definition": "Like or pertaining to the family Formicaridae or ant thrushes.", "details": []}, {"x": -0.6918201686935822, "y": 0.06988953681856708, "z": 0.7186795578225874, "word": "Formicary", "pos_group": "noun", "row_number": 61835, "definition": "The nest or dwelling of a swarm of ants; an ant-hill.", "details": []}, {"x": -0.5996217663530474, "y": -0.03322549154975817, "z": 0.7995935242527471, "word": "Formicate", "pos_group": "adjective", "row_number": 61836, "definition": "Resembling or pertaining to an ant or ants.", "details": []}, {"x": -0.6113921798603573, "y": 0.12569050008165888, "z": 0.7812819597269752, "word": "Formication", "pos_group": "noun", "row_number": 61837, "definition": "A sensation resembling that made by the creeping of ants on the skin.", "details": []}, {"x": -0.6863725358138031, "y": -0.00558083527244225, "z": 0.7272287098005631, "word": "Formicid", "pos_group": "adjective", "row_number": 61838, "definition": "Pertaining to the ants.", "details": []}, {"x": -0.5638861612023968, "y": 0.028977399354293904, "z": 0.8253439934542968, "word": "Formicid", "pos_group": "noun", "row_number": 61839, "definition": "One of the family Formicidae or ants.", "details": []}, {"x": -0.6695541561735925, "y": 0.10947951797865856, "z": 0.7346505748271276, "word": "Fossores", "pos_group": "other", "row_number": 62072, "definition": "A group of hymenopterous insects including the sand wasps. They excavate cells in earth where they deposit their eggs with the bodies of other insects for the food of the young when hatched.", "details": []}, {"x": -0.6362753800799359, "y": -0.04397288267997454, "z": 0.7702077812466881, "word": "Fossorious", "pos_group": "adjective", "row_number": 62075, "definition": "Adapted for digging; -- said of the legs of certain insects.", "details": []}, {"x": -0.5795198140533026, "y": 0.10188609742688653, "z": 0.8085641645971854, "word": "Frill", "pos_group": "other", "row_number": 62878, "definition": "A similar ruffle around the legs or other appendages of animals.", "details": []}, {"x": -0.6966213769567084, "y": 0.04031854721572503, "z": 0.7163051527926858, "word": "Fritillary", "pos_group": "noun", "row_number": 62936, "definition": "One of several species of butterflies belonging to Argynnis and allied genera; -- so called because the coloring of their wings resembles that of the common Fritillaria. See Aphrodite.", "details": []}, {"x": -0.580613398130999, "y": -0.0149303634687129, "z": 0.8140424842460412, "word": "Frugivora", "pos_group": "other", "row_number": 63186, "definition": "The fruit bate; a group of the Cheiroptera comprising the bats which live on fruits. See Eruit bat under Fruit.", "details": []}, {"x": -0.6345198837651361, "y": 0.12830160582933758, "z": 0.7621831899538927, "word": "Fulcrum", "pos_group": "noun", "row_number": 63353, "definition": "The horny inferior surface of the lingua of certain insects.", "details": []}, {"x": -0.6711546025809055, "y": -0.027772201081968435, "z": 0.7407970061234924, "word": "Fungian", "pos_group": "noun", "row_number": 63585, "definition": "One of the Fungidae.", "details": []}, {"x": -0.5630583515700186, "y": 0.05911103199640074, "z": 0.8243004177019286, "word": "Fungivorous", "pos_group": "adjective", "row_number": 63594, "definition": "Eating fungi; -- said of certain insects and snails.", "details": []}, {"x": -0.6859005767853091, "y": 0.08722197306355922, "z": 0.7224491166722261, "word": "Fungoid", "pos_group": "adjective", "row_number": 63595, "definition": "Like a fungus; fungous; spongy.", "details": []}, {"x": -0.6128536832517446, "y": -0.0413146421688382, "z": 0.7891156209752986, "word": "Funiculi", "pos_group": "other", "row_number": 63612, "definition": "of Funiculus", "details": []}, {"x": -0.5975956965029058, "y": 0.12025230766892929, "z": 0.7927286837383292, "word": "Gadfly", "pos_group": "noun", "row_number": 63927, "definition": "Any dipterous insect of the genus Oestrus and allied genera of botflies.", "details": []}, {"x": -0.6932820015349146, "y": 0.010536325515881953, "z": 0.7205893783510594, "word": "Galea", "pos_group": "noun", "row_number": 64078, "definition": "The anterior outer process of the second joint of the maxillae in certain insects.", "details": []}, {"x": -0.5673125062859556, "y": 0.010624292572944054, "z": 0.8234340560232324, "word": "Gale-opithecus", "pos_group": "noun", "row_number": 64092, "definition": "A genus of flying Insectivora formerly called flying lemurs. See Colugo.", "details": []}, {"x": -0.6573777550925277, "y": 0.12040791844767543, "z": 0.7438793049175428, "word": "Gall", "pos_group": "noun", "row_number": 64112, "definition": "An excrescence of any form produced on any part of a plant by insects or their larvae. They are most commonly caused by small Hymenoptera and Diptera which puncture the bark and lay their eggs in the wounds. The larvae live within the galls. Some galls are due to aphids mites etc. See Gallnut.", "details": []}, {"x": -0.6506171366320695, "y": -0.04172932349885055, "z": 0.7582585344597286, "word": "Galley-worm", "pos_group": "noun", "row_number": 64166, "definition": "A chilognath myriapod of the genus Iulus and allied genera having numerous short legs along the sides; a milliped or \"\"\"\"thousand legs.\"\"\"\" See Chilognatha.", "details": []}, {"x": -0.5703534738478712, "y": 0.08761333691855971, "z": 0.816713424686812, "word": "Gallfly", "pos_group": "noun", "row_number": 64168, "definition": "An insect that deposits its eggs in plants and occasions galls esp. any small hymenopteran of the genus Cynips and allied genera. See Illust. of Gall.", "details": []}, {"x": -0.6955853191767745, "y": 0.05912336759388928, "z": 0.7160066278674402, "word": "Gallinipper", "pos_group": "noun", "row_number": 64200, "definition": "A large mosquito.", "details": []}, {"x": -0.5911281556071029, "y": -0.02839969225618666, "z": 0.8060775155828989, "word": "Galliwasp", "pos_group": "noun", "row_number": 64208, "definition": "A West Indian lizard (Celestus occiduus) about a foot long imagined by the natives to be venomous.", "details": []}, {"x": -0.6198414891013502, "y": 0.129329480513183, "z": 0.7739963913732487, "word": "Gapeworm", "pos_group": "noun", "row_number": 64454, "definition": "The parasitic worm that causes the gapes in birds. See Illustration in Appendix.", "details": []}, {"x": -0.6820879234523131, "y": -0.015808933398710937, "z": 0.7310992698021976, "word": "Gasteromycetes", "pos_group": "other", "row_number": 64674, "definition": "An order of fungi in which the spores are borne inside a sac called the peridium as in the puffballs.", "details": []}, {"x": -0.5614290556395172, "y": 0.04041119889450007, "z": 0.8265375674992813, "word": "Gastraea", "pos_group": "noun", "row_number": 64683, "definition": "A primeval larval form; a double-walled sac from which according to the hypothesis of Haeckel man and all other animals that in the first stages of their individual evolution pass through a two-layered structural stage or gastrula form must have descended. This idea constitutes the Gastraea theory of Haeckel. See Gastrula.", "details": []}, {"x": -0.6771551237356861, "y": 0.10282359476552767, "z": 0.728620783918495, "word": "Gastrotricha", "pos_group": "other", "row_number": 64729, "definition": "A group of small wormlike animals having cilia on the ventral side. The group is regarded as an ancestral or synthetic one related to rotifers and annelids.", "details": []}, {"x": -0.6271962479978741, "y": -0.04562135911429922, "z": 0.7775239919706358, "word": "Gastrotrocha", "pos_group": "noun", "row_number": 64730, "definition": "A form of annelid larva having cilia on the ventral side.", "details": []}, {"x": -0.5849910269020074, "y": 0.11096599156787686, "z": 0.8034127501847931, "word": "Gazelle", "pos_group": "noun", "row_number": 64905, "definition": "One of several small swift elegantly formed species of antelope of the genus Gazella esp. G. dorcas; -- called also algazel corinne korin and kevel. The gazelles are celebrated for the luster and soft expression of their eyes.", "details": []}, {"x": -0.6973200968447513, "y": 0.0285433521191282, "z": 0.716191287008038, "word": "Gena", "pos_group": "other", "row_number": 65083, "definition": "The part of the head to which the jaws of an insect are attached.", "details": []}, {"x": -0.5737824639593863, "y": -0.0066629554071258295, "z": 0.8189806402339058, "word": "Gentle", "pos_group": "noun", "row_number": 65307, "definition": "A dipterous larva used as fish bait.", "details": []}, {"x": -0.6435861450369129, "y": 0.12787021101776982, "z": 0.7546165139001376, "word": "Geodephagous", "pos_group": "adjective", "row_number": 65359, "definition": "Living in the earth; -- applied to the ground beetles.", "details": []}, {"x": -0.6642936937873569, "y": -0.035438338903154856, "z": 0.7466311087345173, "word": "Geometer", "pos_group": "noun", "row_number": 65405, "definition": "Any species of geometrid moth; a geometrid.", "details": []}, {"x": -0.5637868747779458, "y": 0.07083969577135656, "z": 0.822876720615633, "word": "Geometrid", "pos_group": "adjective", "row_number": 65411, "definition": "Pertaining or belonging to the Geometridae.", "details": []}, {"x": -0.6913790861700251, "y": 0.07756443341489247, "z": 0.7183165861065216, "word": "Geometrid", "pos_group": "noun", "row_number": 65412, "definition": "One of numerous genera and species of moths of the family Geometridae; -- so called because their larvae (called loopers measuring worms spanworms and inchworms) creep in a looping manner as if measuring. Many of the species are injurious to agriculture as the cankerworms.", "details": []}, {"x": -0.6037171224226113, "y": -0.03882699392682245, "z": 0.7962525357173869, "word": "Gila monster", "pos_group": "other", "row_number": 65760, "definition": "A large tuberculated lizard (Heloderma suspectum) native of the dry plains of Arizona New Mexico etc. It is the only lizard known to have venomous teeth.", "details": []}, {"x": -0.6052777830117839, "y": 0.12623246202622757, "z": 0.7859415823858266, "word": "Gilttail", "pos_group": "noun", "row_number": 65808, "definition": "A yellow-tailed worm or larva.", "details": []}, {"x": -0.6907742567806896, "y": -0.0008056215170303554, "z": 0.7230700361258633, "word": "Girdle", "pos_group": "noun", "row_number": 65905, "definition": "The clitellus of an earthworm.", "details": []}, {"x": -0.5630009195230699, "y": 0.021357022951512265, "z": 0.8261802722086908, "word": "Girdler", "pos_group": "noun", "row_number": 65913, "definition": "An American longicorn beetle (Oncideres cingulatus) which lays its eggs in the twigs of the hickory and then girdles each branch by gnawing a groove around it thus killing it to provide suitable food for the larvae.", "details": []}, {"x": -0.665936467530021, "y": 0.11590286813295998, "z": 0.7369498940716328, "word": "Gizzard", "pos_group": "noun", "row_number": 65990, "definition": "A stomach armed with chitinous or shelly plates or teeth as in certain insects and mollusks.", "details": []}, {"x": -0.6419820338833723, "y": -0.04585077095552334, "z": 0.7653474864228358, "word": "Globard", "pos_group": "noun", "row_number": 66349, "definition": "A glowworm.", "details": []}, {"x": -0.5742097712492391, "y": 0.09818928179928663, "z": 0.8127988702881154, "word": "Glossa", "pos_group": "noun", "row_number": 66468, "definition": "The tongue or lingua of an insect. See Hymenoptera.", "details": []}, {"x": -0.6982233709874143, "y": 0.04761703206075286, "z": 0.7142945768131641, "word": "Glossata", "pos_group": "other", "row_number": 66476, "definition": "The Lepidoptera.", "details": []}, {"x": -0.5830521399299464, "y": -0.022027950372034893, "z": 0.8121360548119491, "word": "Glowbard", "pos_group": "noun", "row_number": 66528, "definition": "The glowworm.", "details": []}, {"x": -0.6288030916135725, "y": 0.1314272830791261, "z": 0.7663768924228158, "word": "Glowworm", "pos_group": "noun", "row_number": 66535, "definition": "A coleopterous insect of the genus Lampyris; esp. the wingless females and larvae of the two European species (L. noctiluca and L. splendidula) which emit light from some of the abdominal segments.", "details": []}, {"x": -0.6766289330264845, "y": -0.025309779876586908, "z": 0.7358890555199471, "word": "Gnat", "pos_group": "noun", "row_number": 66700, "definition": "A blood-sucking dipterous fly of the genus Culex undergoing a metamorphosis in water. The females have a proboscis armed with needlelike organs for penetrating the skin of animals. These are wanting in the males. In America they are generally called mosquitoes. See Mosquito.", "details": []}, {"x": -0.5601928950237767, "y": 0.052314653130476445, "z": 0.8267085928141292, "word": "Gnat", "pos_group": "noun", "row_number": 66701, "definition": "Any fly resembling a Culex in form or habits; esp. in America a small biting fly of the genus Simulium and allies as the buffalo gnat the black fly etc.", "details": []}, {"x": -0.6841296894680668, "y": 0.09474602764306309, "z": 0.7231803082455898, "word": "Gnathidia", "pos_group": "other", "row_number": 66703, "definition": "of Gnathidium", "details": []}, {"x": -0.6178193994028433, "y": -0.04564127287694944, "z": 0.7849943082161055, "word": "Gnathite", "pos_group": "noun", "row_number": 66705, "definition": "Any one of the mouth appendages of the Arthropoda. They are known as mandibles maxillae and maxillipeds.", "details": []}, {"x": -0.5915291937128837, "y": 0.11906517806725499, "z": 0.797443851538902, "word": "Gnatling", "pos_group": "noun", "row_number": 66714, "definition": "A small gnat.", "details": []}, {"x": -0.6967418807595225, "y": 0.01658520603955403, "z": 0.7171301712634248, "word": "Gnatworm", "pos_group": "noun", "row_number": 66715, "definition": "The aquatic larva of a gnat; -- called also colloquially wiggler.", "details": []}, {"x": -0.5677684388868453, "y": 0.0028566388527256474, "z": 0.8231833571073093, "word": "Goa", "pos_group": "noun", "row_number": 66785, "definition": "A species of antelope (Procapra picticauda) inhabiting Thibet.", "details": []}, {"x": -0.6527252146610814, "y": 0.12577336186004742, "z": 0.7470815588622616, "word": "Goliath beetle", "pos_group": "other", "row_number": 66960, "definition": "Any species of Goliathus a genus of very large and handsome African beetles.", "details": []}, {"x": -0.6565073866202527, "y": -0.04189960252956925, "z": 0.7531550136730886, "word": "Gordiacea", "pos_group": "other", "row_number": 67127, "definition": "A division of nematoid worms including the hairworms or hair eels (Gordius and Mermis). See Gordius and Illustration in Appendix.", "details": []}, {"x": -0.5658088375181274, "y": 0.08245732675930975, "z": 0.8204030403710688, "word": "Gordius", "pos_group": "noun", "row_number": 67131, "definition": "A genus of long slender nematoid worms parasitic in insects until near maturity when they leave the insect and live in water in which they deposit their eggs; -- called also hair eel hairworm and hair snake from the absurd but common and widely diffused notion that they are metamorphosed horsehairs.", "details": []}, {"x": -0.6958748559883928, "y": 0.06686427678581428, "z": 0.7150436023719416, "word": "Gossamer", "pos_group": "noun", "row_number": 67224, "definition": "A fine filmy substance like cobwebs floating in the air in calm clear weather especially in autumn. It is seen in stubble fields and on furze or low bushes and is formed by small spiders.", "details": []}, {"x": -0.5947363250925854, "y": -0.034688889608800316, "z": 0.8031720765521388, "word": "Gout", "pos_group": "noun", "row_number": 67308, "definition": "A disease of cornstalks. See Corn fly under Corn.", "details": []}, {"x": -0.6137141517819776, "y": 0.1308200553156515, "z": 0.7786148297006279, "word": "Granilla", "pos_group": "noun", "row_number": 67669, "definition": "Small grains or dust of cochineal or the coccus insect.", "details": []}, {"x": -0.6869970968783461, "y": -0.011744413602978647, "z": 0.726565246643305, "word": "Grasshopper", "pos_group": "noun", "row_number": 67793, "definition": "Any jumping orthopterous insect of the families Acrididae and Locustidae. The species and genera are very numerous. The former family includes the Western grasshopper or locust (Caloptenus spretus) noted for the great extent of its ravages in the region beyond the Mississippi. In the Eastern United States the red-legged (Caloptenus femurrubrum and C. atlanis) are closely related species but their ravages are less important. They are closely related to the migratory locusts of the Old World. See Locust.", "details": []}, {"x": -0.5598082260783505, "y": 0.03288906066855899, "z": 0.827969238379875, "word": "Gravedigger", "pos_group": "noun", "row_number": 67871, "definition": "See Burying beetle under Bury v. t.", "details": []}, {"x": -0.6741146329276873, "y": 0.10981407183115562, "z": 0.7304179155118193, "word": "Gressorious", "pos_group": "adjective", "row_number": 68166, "definition": "Adapted for walking; anisodactylous; as the feet of certain birds and insects. See Illust. under Aves.", "details": []}, {"x": -0.6327884429106218, "y": -0.04843449146179663, "z": 0.7728084410483546, "word": "Grig", "pos_group": "noun", "row_number": 68224, "definition": "A cricket or grasshopper.", "details": []}, {"x": -0.5792717909092903, "y": 0.10808098256542265, "z": 0.8079373078800338, "word": "Grinder", "pos_group": "noun", "row_number": 68280, "definition": "The restless flycatcher (Seisura inquieta) of Australia; -- called also restless thrush and volatile thrush. It makes a noise like a scissors grinder to which the name alludes.", "details": []}, {"x": -0.6996407846368917, "y": 0.03558102308785816, "z": 0.7136082701795825, "word": "Grub", "pos_group": "noun", "row_number": 68592, "definition": "The larva of an insect especially of a beetle; -- called also grubworm. See Illust. of Goldsmith beetle under Goldsmith.", "details": []}, {"x": -0.5755709325386524, "y": -0.014189044223994515, "z": 0.8176287498862765, "word": "Grugru worm", "pos_group": "other", "row_number": 68621, "definition": "The larva or grub of a large South American beetle (Calandra palmarum) which lives in the pith of palm trees and sugar cane. It is eaten by the natives and esteemed a delicacy.", "details": []}, {"x": -0.6381090258893101, "y": 0.13188949686055854, "z": 0.7585657728216219, "word": "Gryllus", "pos_group": "noun", "row_number": 68660, "definition": "A genus of insects including the common crickets.", "details": []}, {"x": -0.6700661129244384, "y": -0.03386515494306121, "z": 0.7415285264850008, "word": "Grysbok", "pos_group": "noun", "row_number": 68666, "definition": "A small South African antelope (Neotragus melanotis). It is speckled with gray and chestnut above; the under parts are reddish fawn.", "details": []}, {"x": -0.5602416659972103, "y": 0.06446014192334258, "z": 0.8258172714250367, "word": "Gue'vi", "pos_group": "noun", "row_number": 68806, "definition": "One of several very small species and varieties of African antelopes of the genus Cephalophus as the Cape guevi or kleeneboc (Cephalophus pygmaea); -- called also pygmy antelope.", "details": []}, {"x": -0.6903127822728512, "y": 0.08536438236292189, "z": 0.7184575038612321, "word": "Guib", "pos_group": "noun", "row_number": 68814, "definition": "A West African antelope (Tragelaphus scriptus) curiously marked with white stripes and spots on a reddish fawn ground and hence called harnessed antelope; -- called also guiba.", "details": []}, {"x": -0.6083244529157432, "y": -0.043978323991166024, "z": 0.7924690952987945, "word": "Gula", "pos_group": "noun", "row_number": 68888, "definition": "A plate which in most insects supports the submentum.", "details": []}, {"x": -0.5990344054459519, "y": 0.12598582138713701, "z": 0.7907498681007941, "word": "Gut", "pos_group": "noun", "row_number": 69073, "definition": "The sac of silk taken from a silkworm (when ready to spin its cocoon) for the purpose of drawing it out into a thread. This when dry is exceedingly strong and is used as the snood of a fish line.", "details": []}, {"x": -0.6948544130901925, "y": 0.004681788229273811, "z": 0.7191351927614587, "word": "Gynaecophore", "pos_group": "noun", "row_number": 69184, "definition": "A ventral canal or groove in which the males of some di/cious trematodes carry the female. See Illust. of Haematozoa.", "details": []}, {"x": -0.5627190322741998, "y": 0.013475602142424594, "z": 0.8265383831760551, "word": "Haematophlina", "pos_group": "other", "row_number": 69452, "definition": "A division of Cheiroptera including the bloodsucking bats. See Vampire.", "details": []}, {"x": -0.661751400892195, "y": 0.12199872434004871, "z": 0.7397306230491058, "word": "Haematozoon", "pos_group": "noun", "row_number": 69466, "definition": "A parasite inhabiting the blood", "details": []}, {"x": -0.647921932318288, "y": -0.046984817912391424, "z": 0.7602562702843533, "word": "Haematozoon", "pos_group": "noun", "row_number": 69468, "definition": "The trematode Bilharzia haematobia which infests the inhabitants of Egypt and other parts of Africa often causing death.", "details": []}, {"x": -0.569123750445876, "y": 0.09372359548970237, "z": 0.8168929209675542, "word": "Hair", "pos_group": "noun", "row_number": 69580, "definition": "A slender outgrowth from the chitinous cuticle of insects spiders crustaceans and other invertebrates. Such hairs are totally unlike those of vertebrates in structure composition and mode of growth.", "details": []}, {"x": -0.6992622330636521, "y": 0.05530491862364652, "z": 0.7127227338782357, "word": "Hairstreak", "pos_group": "noun", "row_number": 69607, "definition": "A butterfly of the genus Thecla; as the green hairstreak (T. rubi).", "details": []}, {"x": -0.5860972614068245, "y": -0.028930508357344335, "z": 0.8097240430279972, "word": "Hairworm", "pos_group": "other", "row_number": 69609, "definition": "A nematoid worm of the genus Gordius resembling a hair. See Gordius.", "details": []}, {"x": -0.6227560636816413, "y": 0.13387603989515987, "z": 0.7708774812444175, "word": "Half-hatched", "pos_group": "adjective", "row_number": 69674, "definition": "Imperfectly hatched; as half-hatched eggs.", "details": []}, {"x": -0.6819839264282658, "y": -0.022044589889053216, "z": 0.7310348556328277, "word": "Halteres", "pos_group": "other", "row_number": 69807, "definition": "Balancers; the rudimentary hind wings of Diptera.", "details": []}, {"x": -0.5578340020141115, "y": 0.045012020384909486, "z": 0.8287310445601691, "word": "Hand-winged", "pos_group": "adjective", "row_number": 70024, "definition": "Having wings that are like hands in the structure and arrangement of their bones; -- said of bats. See Cheiroptera.", "details": []}, {"x": -0.6817318270242877, "y": 0.10221343954242564, "z": 0.7244267587541431, "word": "Harvester", "pos_group": "noun", "row_number": 70459, "definition": "A harvesting ant.", "details": []}, {"x": -0.6232030179115667, "y": -0.049378042470638255, "z": 0.7804997164558634, "word": "Hatch", "pos_group": "other", "row_number": 70534, "definition": "To produce young; -- said of eggs; to come forth from the egg; -- said of the young of birds fishes insects etc.", "details": []}, {"x": -0.585474132823871, "y": 0.11706524069902349, "z": 0.8021943462866191, "word": "Hatcher", "pos_group": "noun", "row_number": 70554, "definition": "One who hatches or that which hatches; a hatching apparatus; an incubator.", "details": []}, {"x": -0.6997672799131949, "y": 0.023242265080180367, "z": 0.7139926827894184, "word": "Haustellata", "pos_group": "other", "row_number": 70637, "definition": "An artificial division of insects including all those with a sucking proboscis.", "details": []}, {"x": -0.5688537397421393, "y": -0.004994522792732405, "z": 0.8224235390134789, "word": "Haustellum", "pos_group": "noun", "row_number": 70641, "definition": "The sucking proboscis of various insects. See Lepidoptera and Diptera.", "details": []}, {"x": -0.6475798728843083, "y": 0.13065363321290388, "z": 0.7507129520418647, "word": "Hawk moth", "pos_group": "other", "row_number": 70729, "definition": "Any moth of the family Sphingidae of which there are numerous genera and species. They are large handsome moths which fly mostly at twilight and hover about flowers like a humming bird sucking the honey by means of a long slender proboscis. The larvae are large hairless caterpillars ornamented with green and other bright colors and often with a caudal spine. See Sphinx also Tobacco worm and Tomato worm.", "details": []}, {"x": -0.6624949333154818, "y": -0.041271159157921726, "z": 0.7479285759703777, "word": "Hedgehog", "pos_group": "noun", "row_number": 71283, "definition": "A small European insectivore (Erinaceus Europaeus) and other allied species of Asia and Africa having the hair on the upper part of its body mixed with prickles or spines. It is able to roll itself into a ball so as to present the spines outwardly in every direction. It is nocturnal in its habits feeding chiefly upon insects.", "details": []}, {"x": -0.5616140394527457, "y": 0.07660923651347254, "z": 0.8238450676980427, "word": "Helianthoidea", "pos_group": "other", "row_number": 71404, "definition": "An order of Anthozoa; the Actinaria.", "details": []}, {"x": -0.6955517551118389, "y": 0.07482650634173028, "z": 0.7145689259333431, "word": "Heliconia", "pos_group": "noun", "row_number": 71416, "definition": "O
