n aphides or plant lice as do beetles of the family Coccinellidae.", "details": []}, {"x": -0.6063513000922905, "y": 0.04953841454148059, "z": 0.793652346031375, "word": "Aphis", "pos_group": "noun", "row_number": 7377, "definition": "A genus of insects belonging to the order Hemiptera and family Aphidae including numerous species known as plant lice and green flies.", "details": []}, {"x": -0.6534868640950005, "y": 0.058868127639801836, "z": 0.7546452557350815, "word": "Aphis lion", "pos_group": "other", "row_number": 7378, "definition": "The larva of the lacewinged flies (Chrysopa) which feeds voraciously upon aphids. The name is also applied to the larvae of the ladybugs (Coccinella).", "details": []}, {"x": -0.6245334262165559, "y": 0.010394848814384901, "z": 0.7809288998726681, "word": "Aphrodite", "pos_group": "noun", "row_number": 7400, "definition": "A beautiful butterfly (Argunnis Aphrodite) of the United States.", "details": []}, {"x": -0.6197552462610333, "y": 0.07287816203524976, "z": 0.7814039980895222, "word": "Apian", "pos_group": "adjective", "row_number": 7410, "definition": "Belonging to bees.", "details": []}, {"x": -0.6561425467483577, "y": 0.029237728125011454, "z": 0.7540703638259942, "word": "Apiculture", "pos_group": "noun", "row_number": 7420, "definition": "Rearing of bees for their honey and wax.", "details": []}, {"x": -0.6069755948628802, "y": 0.030737392902838927, "z": 0.794125833806198, "word": "Apiologist", "pos_group": "noun", "row_number": 7425, "definition": "A student of bees.", "details": []}, {"x": -0.6430766156025451, "y": 0.07268028852973675, "z": 0.762345093854752, "word": "Apis", "pos_group": "noun", "row_number": 7426, "definition": "A genus of insects of the order Hymenoptera including the common honeybee (Apis mellifica) and other related species. See Honeybee.", "details": []}, {"x": -0.6392605268320344, "y": 0.00893941833606805, "z": 0.7689382716670062, "word": "Apoda", "pos_group": "noun", "row_number": 7482, "definiti spiders is secreted.", "details": []}, {"x": -0.6136970332396305, "y": 0.071179854450914, "z": 0.7863265096085865, "word": "Arachnoid", "pos_group": "adjective", "row_number": 8255, "definition": "Resembling a spider's web; cobweblike.", "details": []}, {"x": -0.6594790264688445, "y": 0.03579669933514262, "z": 0.7508701685141143, "word": "Arachnoid", "pos_group": "noun", "row_number": 8259, "definition": "One of the Arachnoidea.", "details": []}, {"x": -0.607961443339595, "y": 0.02275217162833021, "z": 0.7936404866806075, "word": "Arachnology", "pos_group": "noun", "row_number": 8264, "definition": "The department of zoology which treats of spiders and other Arachnida.", "details": []}, {"x": -0.6380551093965889, "y": 0.07784157207523344, "z": 0.7660459301045616, "word": "Araneidan", "pos_group": "noun", "row_number": 8283, "definition": "One of the Araneina; a spider.", "details": []}, {"x": -0.6454819136763625, "y": 0.009359732273574535, "z": 0.7637182036120834, "word": "Araneiform", "pos_group": "adjective", "row_number": 8284, "definition": "Having the form of a spider.", "details": []}, {"x": -0.6040562628867643, "y": 0.05521199113187082, "z": 0.7950268343285845, "word": "Araneina", "pos_group": "other", "row_number": 8285, "definition": "The order of Arachnida that includes the spiders.", "details": []}, {"x": -0.6579386590185095, "y": 0.05642625397061931, "z": 0.7509545917242725, "word": "Araneose", "pos_group": "adjective", "row_number": 8286, "definition": "Of the aspect of a spider's web; arachnoid.", "details": []}, {"x": -0.6199058129205403, "y": 0.008313103529909988, "z": 0.7846321911679542, "word": "Araneous", "pos_group": "adjective", "row_number": 8287, "definition": "Cobweblike; extremely thin and delicate like a cobweb; as the araneous membrane of the eye. See Arachnoid.", "details": []}, {"x": -0.6218381864869221, "y": 0.07839055400458948, "z": 0.7792125453748223, "word": "Arango", "pos_group": "noun", "row_number": 8289, "definition": "A bead of rough carnelian. Arangoes were formerly imported from Bombay for use in the African slave trade.", "details": []}, {"x": -0.6573661621822369, "y": 0.023124639892541623, "z": 0.7532164229805649, "word": "Archiannelida", "pos_group": "other", "row_number": 8461, "definition": "A group of Annelida remarkable for having no external segments or distinct ventral nerve ganglions.", "details": []}, {"x": -0.6027513277179858, "y": 0.03426097413493391, "z": 0.79719321534088, "word": "Arctisca", "pos_group": "other", "row_number": 8541, "definition": "A group of Arachnida. See Illust. in Appendix.", "details": []}, {"x": -0.6477941614810871, "y": 0.07355711399445215, "z": 0.7582559431562816, "word": "Areola", "pos_group": "noun", "row_number": 8608, "definition": "An interstice or small space as between the cracks of the surface in certain crustaceous lichens; or as between the fibers composing organs or vessels that interlace; or as between the nervures of an insect's wing.", "details": []}, {"x": -0.6361734916517741, "y": 0.004086454464267739, "z": 0.7715352159230981, "word": "Areolation", "pos_group": "noun", "row_number": 8614, "definition": "Any small space bounded by some part different in color or structure as the spaces bounded by the nervures of the wings of insects or those by the veins of leaves; an areola.", "details": []}, {"x": -0.607907056122131, "y": 0.06735058511959693, "z": 0.7911465792133415, "word": "Areolet", "pos_group": "noun", "row_number": 8616, "definition": "A small inclosed area; esp. one of the small spaces on the wings of insects circumscribed by the veins.", "details": []}, {"x": -0.6615012668247354, "y": 0.043738528353534104, "z": 0.7486674930346165, "word": "Argas", "pos_group": "noun", "row_number": 8639, "definition": "A genus of venomous ticks which attack men and animals. The famous Persian Argas also called Miana bug is A. Persicus; that of Central America called talaje by the natives is A. Talaje.", "details": []}, {"x": -0.61061234914547 Arthropoda", "pos_group": "other", "row_number": 9195, "definition": "A large division of Articulata embracing all those that have jointed legs. It includes Insects Arachnida Pychnogonida and Crustacea.", "details": []}, {"x": -0.6033196028521769, "y": 0.025482099351876196, "z": 0.7970922904073987, "word": "Ascarid", "pos_group": "noun", "row_number": 9354, "definition": "A parasitic nematoid worm espec. the roundworm Ascaris lumbricoides often occurring in the human intestine and allied species found in domestic animals; also commonly applied to the pinworm (Oxyuris) often troublesome to children and aged persons.", "details": []}, {"x": -0.6426593993368542, "y": 0.07969316576294283, "z": 0.7619959945922773, "word": "Ascus", "pos_group": "noun", "row_number": 9430, "definition": "A small membranous bladder or tube in which are inclosed the seedlike reproductive particles or sporules of lichens and certain fungi.", "details": []}, {"x": -0.6429872990683164, "y": 0.003854551899440382, "z": 0.7658671396962307, "word": "Asilus", "pos_group": "noun", "row_number": 9483, "definition": "A genus of large and voracious two-winged flies including the bee killer and robber fly.", "details": []}, {"x": -0.6028151053399209, "y": 0.0614966655492763, "z": 0.7955074537050804, "word": "Asp", "pos_group": "noun", "row_number": 9527, "definition": "A small hooded poisonous serpent of Egypt and adjacent countries whose bite is often fatal. It is the Naja haje. The name is also applied to other poisonous serpents esp. to Vipera aspis of southern Europe. See Haje.", "details": []}, {"x": -0.6619588496400283, "y": 0.05260743906542951, "z": 0.7476917404507204, "word": "Astraean", "pos_group": "adjective", "row_number": 10074, "definition": "Pertaining to the genus Astraea or the family Astraeidae.", "details": []}, {"x": -0.614867389587539, "y": 0.007650057080766842, "z": 0.7885934122527696, "word": "Astragaloid", "pos_group": "adjective", "row_number": 10079, "definition": "Resembling the astragalus in form.", "details": []}, {"x": -0.6249538500681234, "y": 0.08318275166214205, "z": 0.7762173117825599, "word": "Athalamous", "pos_group": "adjective", "row_number": 10225, "definition": "Not furnished with shields or beds for the spores as the thallus of certain lichens.", "details": []}, {"x": -0.6574785099402154, "y": 0.016662789176109055, "z": 0.7532890284768966, "word": "Atokous", "pos_group": "adjective", "row_number": 10324, "definition": "Producing only asexual individuals as the eggs of certain annelids.", "details": []}, {"x": -0.5991368470174986, "y": 0.03901266450505304, "z": 0.7996955986837407, "word": "Atrocha", "pos_group": "noun", "row_number": 10394, "definition": "A kind of chaetopod larva in which no circles of cilia are developed.", "details": []}, {"x": -0.6527180543679271, "y": 0.07297323593253129, "z": 0.7540782773291396, "word": "Attercop", "pos_group": "noun", "row_number": 10571, "definition": "A spider.", "details": []}, {"x": -0.6321773589175993, "y": 0.0001633316799220751, "z": 0.7748236962010979, "word": "Attired", "pos_group": "other", "row_number": 10604, "definition": "Provided with antlers as a stag.", "details": []}, {"x": -0.608569090961914, "y": 0.07373101256182715, "z": 0.7900679713242382, "word": "Aurelia", "pos_group": "noun", "row_number": 10846, "definition": "The chrysalis or pupa of an insect esp. when reflecting a brilliant golden color as that of some of the butterflies.", "details": []}, {"x": -0.6642069403909895, "y": 0.03819408915674917, "z": 0.7465724023093318, "word": "Aurelian", "pos_group": "noun", "row_number": 10849, "definition": "An amateur collector and breeder of insects esp. of butterflies and moths; a lepidopterist.", "details": []}, {"x": -0.6056147267894496, "y": 0.016664182405532673, "z": 0.7955835014129538, "word": "Auricula", "pos_group": "noun", "row_number": 10867, "definition": "A species of Hirneola (H. auricula) a membranaceous fungus called also auricula Judae or Jew's-ear.", "details": []}, {"x": -0.6362723659433194, "y": 0.08434680327960753, "z": 0.7668396788856207, "word": "Auricularia", "pos_group": "other", "row_number": 10875, "definition": "A kind of holothurian larva with soft blunt appendages. See Illustration in Appendix.", "details": []}, {"x": -0.6499132641317032, "y": 0.005846174269599555, "z": 0.759985902074561, "word": "Azurine", "pos_group": "noun", "row_number": 11582, "definition": "The blue roach of Europe (Leuciscus caeruleus); -- so called from its color.", "details": []}, {"x": -0.5988147908815857, "y": 0.053854082799647235, "z": 0.7990748300298611, "word": "Bacillus", "pos_group": "noun", "row_number": 11730, "definition": "A variety of bacterium; a microscopic rod-shaped vegetable organism.", "details": []}, {"x": -0.660695252009128, "y": 0.06188045152069851, "z": 0.748099320740361, "word": "Bacteroidal", "pos_group": "adjective", "row_number": 11893, "definition": "Resembling bacteria; as bacteroid particles.", "details": []}, {"x": -0.6205632753418271, "y": 0.0016317170433458054, "z": 0.7841546778515794, "word": "Baenomere", "pos_group": "noun", "row_number": 11932, "definition": "One of the somites (arthromeres) that make up the thorax of Arthropods.", "details": []}, {"x": -0.6176110589427567, "y": 0.08272412964245258, "z": 0.7821210253192952, "word": "Baenopod", "pos_group": "noun", "row_number": 11933, "definition": "One of the thoracic legs of Arthropods.", "details": []}, {"x": -0.6623930221409035, "y": 0.023386988313452966, "z": 0.7487913814919791, "word": "Baenosome", "pos_group": "noun", "row_number": 11934, "definition": "The thorax of Arthropods.", "details": []}, {"x": -0.5990693794971506, "y": 0.0295259043393336, "z": 0.80015254765691, "word": "Bagworm", "pos_group": "noun", "row_number": 11995, "definition": "One of several lepidopterous insects which construct in the larval state a baglike case which they carry about for protection. One species (Platoeceticus Gloveri) feeds on the orange tree. See Basket worm.", "details": []}, {"x": -0.6476703017633512, "y": 0.08020672661782793, "z": 0.7576873109792871, "word": "Balancer", "pos_group": "noun", "row_number": 12112, "definition": "In Diptera the rudimentary posterior wing.", "details": []}, {"x": -0.6395041263455216, "y": -0.0009865765706445068, "z": 0.7687870310129596, "word": "Ballooning spider", "pos_group": "other", "row_number": 12263, "definition": "A spider which has the habit of rising into the air. Many kinds ( esp. species of Lycosa) do this while young by ejecting threads of silk until the force of the wind upon them carries the spider aloft.", "details": []}, {"x": -0.6026260093860487, "y": 0.06813439366774313, "z": 0.7951098019839619, "word": "Banxring", "pos_group": "noun", "row_number": 12549, "definition": "An East Indian insectivorous mammal of the genus Tupaia.", "details": []}, {"x": -0.6654127832203299, "y": 0.04760754432147568, "z": 0.7449559380598649, "word": "Barbet", "pos_group": "noun", "row_number": 12677, "definition": "A larva that feeds on aphides.", "details": []}, {"x": -0.6096164109583387, "y": 0.008376062868882098, "z": 0.7926523027539188, "word": "Bark beetle", "pos_group": "other", "row_number": 12796, "definition": "A small beetle of many species (family Scolytidae) which in the larval state bores under or in the bark of trees often doing great damage.", "details": []}, {"x": -0.6289465674650808, "y": 0.08710358834073996, "z": 0.7725536746220676, "word": "Basicerite", "pos_group": "noun", "row_number": 13061, "definition": "The second joint of the antennae of crustaceans.", "details": []}, {"x": -0.6565100012382432, "y": 0.010102304243797482, "z": 0.7542496680298425, "word": "Basidiospore", "pos_group": "noun", "row_number": 13064, "definition": "A spore borne by a basidium.", "details": []}, {"x": -0.5962423427096902, "y": 0.044777311494488506, "z": 0.8015547773766842, "word": "Basilisk", "pos_group": "noun", "row_number": 13094, "definition": "A fabulous serpent or dragon. The ancients alleged that its hissing would drive away all other serpents and that its breath and even its look was fatal. See Cockatrice.", "details": []}, {"x": -0.6576571172755977, "y": 0.07099449174742499, "z": 0.749964597989982, "word": "Bat", "pos_group": "noun", "row_number": 13237, "definition": "One of the Cheiroptera an order of flying mammals in which the wings are formed by a membrane stretched between the elongated fingers legs and tail. The common bats are small and insectivorous. See Cheiroptera and Vampire.", "details": []}, {"x": -0.6274420091870487, "y": -0.0027123945864163976, "z": 0.7786585696073262, "word": "Bdelloidea", "pos_group": "other", "row_number": 13514, "definition": "The order of Annulata which includes the leeches. See Hirudinea.", "details": []}, {"x": -0.6103058919443487, "y": 0.07995663990077365, "z": 0.7881203296412235, "word": "Bdellomorpha", "pos_group": "noun", "row_number": 13516, "definition": "An order of Nemertina including the large leechlike worms (Malacobdella) often parasitic in clams.", "details": []}, {"x": -0.6660645766552911, "y": 0.03183460233879118, "z": 0.7452144240545393, "word": "Beak", "pos_group": "noun", "row_number": 13587, "definition": "The long projecting sucking mouth of some insects and other invertebrates as in the Hemiptera.", "details": []}, {"x": -0.6007969043814584, "y": 0.01981605591455646, "z": 0.7991560571087778, "word": "Beambird", "pos_group": "noun", "row_number": 13626, "definition": "A small European flycatcher (Muscicapa gricola) so called because it often nests on a beam in a building.", "details": []}, {"x": -0.6412237655133198, "y": 0.08603888964386674, "z": 0.7625151749373711, "word": "Beard", "pos_group": "noun", "row_number": 13694, "definition": "In insects the hairs of the labial palpi of moths and butterflies.", "details": []}, {"x": -0.6470913760769479, "y": 0.00015383231305515543, "z": 0.762412439131512, "word": "Bear's-foot", "pos_group": "noun", "row_number": 13740, "definition": "A species of hellebore (Helleborus foetidus) with digitate leaves. It has an offensive smell and acrid taste and is a powerful emetic cathartic and anthelmintic.", "details": []}, {"x": -0.5977032523651139, "y": 0.060567422543115076, "z": 0.7994263001919869, "word": "Beast", "pos_group": "noun", "row_number": 13746, "definition": "Any living creature; an animal; -- including man insects etc.", "details": []}, {"x": -0.6648525533885821, "y": 0.05762705501521656, "z": 0.7447484171067139, "word": "Bedbug", "pos_group": "noun", "row_number": 13949, "definition": "A wingless bloodsucking hemipterous insect (Cimex Lectularius) sometimes infesting houses and especially beds. See Illustration in Appendix.", "details": []}, {"x": -0.6151981003306002, "y": 0.00117247182959388, "z": 0.7883716906760602, "word": "Bee", "pos_group": "noun", "row_number": 14058, "definition": "An insect of the order Hymenoptera and family Apidae (the honeybees) or family Andrenidae (the solitary bees.) See Honeybee.", "details": []}, {"x": -0.6210639522349909, "y": 0.08765253175630343, "z": 0.7788431170081451, "word": "Beefeater", "pos_group": "noun", "row_number": 14076, "definition": "An African bird of the genus Buphaga which feeds on the larvae of botflies hatched under the skin of oxen antelopes etc. Two species are known.", "details": []}, {"x": -0.6623415919819354, "y": 0.01652553203893572, "z": 0.7490197075656055, "word": "Beeswax", "pos_group": "noun", "row_number": 14097, "definition": "The wax secreted by bees and of which their cells are constructed.", "details": []}, {"x": -0.5953574211485899, "y": 0.03472130239784567, "z": 0.8027103912639341, "word": "Beetle", "pos_group": "other", "row_number": 14110, "definition": "Any insect of the order Coleoptera having four wings the outer pair being stiff cases for covering the others when they are folded up. See Coleoptera.", "details": []}, {"x": -0.6528984974878916, "y": 0.07937688914338681, "z": 0.7532747582708265, "word": "Beetlestock", "pos_group": "noun", "row_number": 14117, "definition": "The handle of a beetle.", "details": []}, {"x": -0.6351638968292338, "y": -0.004994264599867562, "z": 0.7723612376898576, "word": "Beetrave", "pos_group": "noun", "row_number": 14119, "definition": "The common beet (Beta vulgaris).", "details": []}, {"x": -0.6034846671626837, "y": 0.07488221943981085, "z": 0.7938506847709542, "word": "Bell bearer", "pos_group": "other", "row_number": 14468, "definition": "A Brazilian leaf hopper (Bocydium tintinnabuliferum) remarkable for the four bell-shaped appendages of its thorax.", "details": []}, {"x": -0.6681758633362698, "y": 0.041614136409565974, "z": 0.7428386630390993, "word": "Belzebuth", "pos_group": "noun", "row_number": 14600, "definition": "A spider monkey (Ateles belzebuth) of Brazil.", "details": []}, {"x": -0.6043398659960548, "y": 0.010457975252317096, "z": 0.796657992567383, "word": "Berna fly", "pos_group": "other", "row_number": 14921, "definition": "A Brazilian dipterous insect of the genus Trypeta which lays its eggs in the nostrils or in wounds of man and beast where the larvae do great injury.", "details": []}, {"x": -0.6336661671542216, "y": 0.09001491396413441, "z": 0.7683518099595441, "word": "Bertram", "pos_group": "noun", "row_number": 14959, "definition": "Pellitory of Spain (Anacyclus pyrethrum).", "details": []}, {"x": -0.6544947056039723, "y": 0.0036788291463970683, "z": 0.7560576344118756, "word": "Bete noire", "pos_group": "other", "row_number": 15202, "definition": "Something especially hated or dreaded; a bugbear.", "details": []}, {"x": -0.594167385711708, "y": 0.05134680123753435, "z": 0.8027008307951273, "word": "Bike", "pos_group": "noun", "row_number": 15725, "definition": "A nest of wild bees wasps or ants; a swarm.", "details": []}, {"x": -0.6624313251433946, "y": 0.06769154190441266, "z": 0.7460580370342307, "word": "Billbug", "pos_group": "noun", "row_number": 15817, "definition": "A weevil or curculio of various species as the corn weevil. See Curculio.", "details": []}, {"x": -0.6221324418624467, "y": -0.004437126324710482, "z": 0.7828994422607851, "word": "Binervate", "pos_group": "adjective", "row_number": 15936, "definition": "Having only two nerves as the wings of some insects.", "details": []}, {"x": -0.613054623941215, "y": 0.08580503774174454, "z": 0.7853671266117733, "word": "Bipupillate", "pos_group": "adjective", "row_number": 16035, "definition": "Having an eyelike spot on the wing with two dots within it of a different color as in some butterflies.", "details": []}, {"x": -0.6670020379336956, "y": 0.024883354224609504, "z": 0.7446402487609903, "word": "Bit", "pos_group": "verb", "row_number": 16245, "definition": "A part of anything such as may be bitten off or taken into the mouth; a morsel; a bite. Hence: A small piece of anything; a little; a mite.", "details": []}, {"x": -0.5963273806539379, "y": 0.024217612303571376, "z": 0.8023759482541382, "word": "Bite", "pos_group": "other", "row_number": 16262, "definition": "To puncture abrade or sting with an organ (of some insects) used in taking food.", "details": []}, {"x": -0.6465795493168832, "y": 0.0864772914675795, "z": 0.7579291289201171, "word": "Bite", "pos_group": "verb", "row_number": 16272, "definition": "The act of puncturing or abrading with an organ for taking food as is done by some insects.", "details": []}, {"x": -0.643325252499962, "y": -0.004935461548628512, "z": 0.7655770769263944, "word": "Bite", "pos_group": "verb", "row_number": 16273, "definition": "The wound made by biting; as the pain of a dog's or snake's bite; the bite of a mosquito.", "details": []}, {"x": -0.5975818068138209, "y": 0.06764198083372916, "z": 0.79894965210207, "word": "Bite", "pos_group": "verb", "row_number": 16274, "definition": "A morsel; as much as is taken at once by biting.", "details": []}, {"x": -0.6684911647968107, "y": 0.05223865735395893, "z": 0.7418832019034122, "word": "Bitterweed", "pos_group": "noun", "row_number": 16322, "definition": "A species of Ambrosia (A. artemisiaefolia); Roman worm wood.", "details": []}, {"x": -0.6096103553641238, "y": 0.002027863840375512, "z": 0.7926986201584255, "word": "Blindworm", "pos_group": "noun", "row_number": 16929, "definition": "A small burrowing snakelike limbless lizard (Anguis fragilis) with minute eyes popularly believed to be blind; the slowworm; -- formerly a name for the adder.", "details": []}, {"x": -0.6253632520959121, "y": 0.09177354626439022, "z": 0.7749183306220615, "word": "Blister", "pos_group": "noun", "row_number": 16958, "definition": "A vesicatory; a plaster of Spanish flies or other matter applied to raise a blister.", "details": []}, {"x": -0.6612631825065842, "y": 0.009543441551421422, "z": 0.7500932783225154, "word": "Bloodybones", "pos_group": "noun", "row_number": 17100, "definition": "A terrible bugbear.", "details": []}, {"x": -0.5923164905263629, "y": 0.040900803919066746, "z": 0.804666576470843, "word": "Blow", "pos_group": "noun", "row_number": 17203, "definition": "An egg or a larva deposited by a fly on or in flesh or the act of depositing it.", "details": []}, {"x": -0.6581616500383485, "y": 0.07721487553222485, "z": 0.748906606604149, "word": "Blowfly", "pos_group": "noun", "row_number": 17213, "definition": "Any species of fly of the genus Musca that deposits its eggs or young larvae (called flyblows and maggots) upon meat or other animal products.", "details": []}, {"x": -0.6301022321727953, "y": -0.008018042175631597, "z": 0.7764707901850079, "word": "Blown", "pos_group": "other", "row_number": 17222, "definition": "Covered with the eggs and larvae of flies; fly blown.", "details": []}, {"x": -0.6053735187368035, "y": 0.08150779990201215, "z": 0.7917571479736413, "word": "Bluebottle", "pos_group": "noun", "row_number": 17284, "definition": "A large and troublesome species of blowfly (Musca vomitoria). Its body is steel blue.", "details": []}, {"x": -0.6701386924598777, "y": 0.034818723992075494, "z": 0.7414187678550692, "word": "Boat bug", "pos_group": "other", "row_number": 17478, "definition": "An aquatic hemipterous insect of the genus Notonecta; -- so called from swimming on its back which gives it the appearance of a little boat. Called also boat fly boat insect boatman and water boatman.", "details": []}, {"x": -0.5992160794546971, "y": 0.013845918079646637, "z": 0.8004676012653315, "word": "Bogey", "pos_group": "noun", "row_number": 17627, "definition": "A goblin; a bugbear. See Bogy.", "details": []}, {"x": -0.638959559064597, "y": 0.09179910985296533, "z": 0.7637431540185345, "word": "Bogle", "pos_group": "noun", "row_number": 17639, "definition": "A goblin; a specter; a frightful phantom; a bogy; a bugbear.", "details": []}, {"x": -0.651479900334407, "y": -0.0023849722517752564, "z": 0.7586621457326244, "word": "Bogy", "pos_group": "noun", "row_number": 17649, "definition": "A specter; a hobgoblin; a bugbear.", "details": []}, {"x": -0.5929951127352332, "y": 0.058511011961634, "z": 0.8030773672264421, "word": "Bollworm", "pos_group": "noun", "row_number": 17740, "definition": "The larva of a moth (Heliothis armigera) which devours the bolls or unripe pods of the cotton plant often doing great damage to the crops.", "details": []}, {"x": -0.6668712793268724, "y": 0.06315133532206897, "z": 0.7424921586494905, "word": "Bombycid", "pos_group": "adjective", "row_number": 17857, "definition": "Like or pertaining to the genus Bombyx or the family Bombycidae.", "details": []}, {"x": -0.6164148728491111, "y": -0.004929192156644129, "z": 0.7874061262113072, "word": "Bombycinous", "pos_group": "adjective", "row_number": 17859, "definition": "Being of the color of the silkworm; transparent with a yellow tint.", "details": []}, {"x": -0.6167397639001249, "y": 0.09106937597143581, "z": 0.7818813416270984, "word": "Bombyx", "pos_group": "noun", "row_number": 17861, "definition": "A genus of moths which includes the silkworm moth. See Silkworm.", "details": []}, {"x": -0.6669646363757992, "y": 0.017563108563506964, "z": 0.7448823471137469, "word": "Bookworm", "pos_group": "noun", "row_number": 18075, "definition": "Any larva of a beetle or moth which is injurious to books. Many species are known.", "details": []}, {"x": -0.5923619231150404, "y": 0.029747460508440318, "z": 0.8051226245962473, "word": "Boomslange", "pos_group": "noun", "row_number": 18106, "definition": "A large South African tree snake (Bucephalus Capensis). Although considered venomous by natives it has no poison fangs.", "details": []}, {"x": -0.6521651195927658, "y": 0.08561839658051545, "z": 0.7532264911389767, "word": "Borer", "pos_group": "noun", "row_number": 18248, "definition": "One of the larvae of many species of insects which penetrate trees as the apple peach pine etc. See Apple borer under Apple.", "details": []}, {"x": -0.6387163853277734, "y": -0.009236465618108128, "z": 0.769386812219126, "word": "Botfly", "pos_group": "noun", "row_number": 18393, "definition": "A dipterous insect of the family (Estridae of many different species some of which are particularly troublesome to domestic animals as the horse ox and sheep on which they deposit their eggs. A common species is one of the botflies of the horse (Gastrophilus equi) the larvae of which (bots) are taken into the stomach of the animal where they live several months and pass through their larval states. In tropical America one species sometimes lives under the human skin and another in the stomach. See Gadfly.", "details": []}, {"x": -0.5984752917581658, "y": 0.07484872116445182, "z": 0.7976371318431861, "word": "Bots", "pos_group": "other", "row_number": 18420, "definition": "The larvae of several species of botfly especially those larvae which infest the stomach throat or intestines of the horse and are supposed to be the cause of various ailments.", "details": []}, {"x": -0.6714733005065356, "y": 0.04586747005953619, "z": 0.7396078568384715, "word": "Boud", "pos_group": "noun", "row_number": 18475, "definition": "A weevil; a worm that breeds in malt biscuit etc.", "details": []}, {"x": -0.6039780084540821, "y": 0.004202399436920426, "z": 0.7969899027859847, "word": "Brachelytra", "pos_group": "other", "row_number": 18848, "definition": "A group of beetles having short elytra as the rove beetles.", "details": []}, {"x": -0.630384525754973, "y": 0.09492869555168638, "z": 0.7704569374400706, "word": "Brachyceral", "pos_group": "adjective", "row_number": 18867, "definition": "Having short antennae as certain insects.", "details": []}, {"x": -0.6591633655477919, "y": 0.002669442163001872, "z": 0.7519950342909497, "word": "Brachyptera", "pos_group": "other", "row_number": 18875, "definition": "A group of Coleoptera having short wings; the rove beetles.", "details": []}, {"x": -0.5900625306433551, "y": 0.047885897854292224, "z": 0.8059361951900708, "word": "Brain", "pos_group": "noun", "row_number": 18972, "definition": "The anterior or cephalic ganglion in insects and other invertebrates.", "details": []}, {"x": -0.6632835544621186, "y": 0.07375521826163234, "z": 0.7447248445964971, "word": "Branlin", "pos_group": "noun", "row_number": 19116, "definition": "A small red worm or larva used as bait for small fresh-water fish; -- so called from its red color.", "details": []}, {"x": -0.6244628052788855, "y": -0.00993062893433643, "z": 0.7809914131616257, "word": "Breeze fly", "pos_group": "noun", "row_number": 19485, "definition": "A fly of various species of the family Tabanidae noted for buzzing about animals and tormenting them by sucking their blood; -- called also horsefly and gadfly. They are among the largest of two-winged or dipterous insects. The name is also given to different species of botflies.", "details": []}, {"x": -0.6082568949787399, "y": 0.08778932599838253, "z": 0.7888704481418808, "word": "Breve", "pos_group": "noun", "row_number": 19536, "definition": "The great ant thrush of Sumatra (Pitta gigas) which has a very short tail.", "details": []}, {"x": -0.6712104186358132, "y": 0.027420819763938054, "z": 0.7407595241090121, "word": "Bristletail", "pos_group": "noun", "row_number": 19822, "definition": "An insect of the genera Lepisma Campodea etc. belonging to the Thysanura.", "details": []}, {"x": -0.5944143895748069, "y": 0.018467513850750027, "z": 0.8039468168968531, "word": "Bug", "pos_group": "noun", "row_number": 20507, "definition": "A bugbear; anything which terrifies.", "details": []}, {"x": -0.6446681012892179, "y": 0.09236364107616413, "z": 0.7588623043657577, "word": "Bug", "pos_group": "noun", "row_number": 20508, "definition": "A general name applied to various insects belonging to the Hemiptera; as the squash bug; the chinch bug etc.", "details": []}, {"x": -0.6475301664091672, "y": -0.007880635958528689, "z": 0.7619990676943151, "word": "Bug", "pos_group": "noun", "row_number": 20509, "definition": "An insect of the genus Cimex especially the bedbug (C. lectularius). See Bedbug.", "details": []}, {"x": -0.592788753252828, "y": 0.06605535509069614, "z": 0.8026444942069932, "word": "Bug", "pos_group": "noun", "row_number": 20510, "definition": "One of various species of Coleoptera; as the ladybug; potato bug etc.; loosely any beetle.", "details": []}, {"x": -0.6708194286081558, "y": 0.05748179618653849, "z": 0.7393897059798687, "word": "Bug", "pos_group": "noun", "row_number": 20511, "definition": "One of certain kinds of Crustacea; as the sow bug; pill bug; bait bug; salve bug etc.", "details": []}, {"x": -0.6104581924781097, "y": -0.004133349336725495, "z": 0.7920376952264455, "word": "Bugginess", "pos_group": "adjective", "row_number": 20522, "definition": "The state of being infested with bugs.", "details": []}, {"x": -0.6212698514743452, "y": 0.09556059350774529, "z": 0.7777479955727898, "word": "Buggy", "pos_group": "adjective", "row_number": 20523, "definition": "Infested or abounding with bugs.", "details": []}, {"x": -0.6659184954434703, "y": 0.010097147154871004, "z": 0.7459561683139551, "word": "Buglosses", "pos_group": "other", "row_number": 20538, "definition": "of Bugloss", "details": []}, {"x": -0.5890417080560539, "y": 0.0362654749007061, "z": 0.8072884747725766, "word": "Bullcomber", "pos_group": "noun", "row_number": 20628, "definition": "A scaraboid beetle; esp. the Typhaeus vulgaris of Europe.", "details": []}, {"x": -0.6578063698901379, "y": 0.08344571329081303, "z": 0.7485503274098186, "word": "Bullfice", "pos_group": "noun", "row_number": 20653, "definition": "A kind of fungus. See Puffball.", "details": []}, {"x": -0.6333802872005445, "y": -0.012585023106168273, "z": 0.7737383465869924, "word": "Bullhead", "pos_group": "noun", "row_number": 20660, "definition": "The black-bellied plover (Squatarola helvetica); -- called also beetlehead.", "details": []}, {"x": -0.6003873602861115, "y": 0.0819623204374423, "z": 0.7954980802221872, "word": "Bullhead", "pos_group": "noun", "row_number": 20663, "definition": "A small black water insect.", "details": []}, {"x": -0.6736782732372923, "y": 0.038681519243636324, "z": 0.7380117371946223, "word": "Bumblebee", "pos_group": "noun", "row_number": 20732, "definition": "A large bee of the genus Bombus sometimes called humblebee; -- so named from its sound.", "details": []}, {"x": -0.5984751863861064, "y": 0.007673501541733457, "z": 0.8011045928305518, "word": "Bungarum", "pos_group": "noun", "row_number": 20791, "definition": "A venomous snake of India of the genus Bungarus allied to the cobras but without a hood.", "details": []}, {"x": -0.6359917509964198, "y": 0.09698350174654459, "z": 0.7655773592874114, "word": "Buprestidan", "pos_group": "noun", "row_number": 20848, "definition": "One of a tribe of beetles of the genus Buprestis and allied genera usually with brilliant metallic colors. The larvae are usually borers in timber or beneath bark and are often very destructive to trees.", "details": []}, {"x": -0.6560686884190425, "y": -0.0038758247585753544, "z": 0.7546912309405469, "word": "Butterfly", "pos_group": "noun", "row_number": 21265, "definition": "A general name for the numerous species of diurnal Lepidoptera.", "details": []}, {"x": -0.5886922267159442, "y": 0.05548579207100459, "z": 0.8064507356822711, "word": "Caddis", "pos_group": "noun", "row_number": 21620, "definition": "The larva of a caddice fly. These larvae generally live in cylindrical cases open at each end and covered externally with pieces of broken shells gravel bits of wood etc. They are a favorite bait with anglers. Called also caddice worm or caddis worm.", "details": []}, {"x": -0.668095266978699, "y": 0.0690587215414651, "z": 0.740864094972701, "word": "Calamistrum", "pos_group": "noun", "row_number": 21800, "definition": "A comblike structure on the metatarsus of the hind legs of certain spiders (Ciniflonidae) used to curl certain fibers in the construction of their webs.", "details": []}, {"x": -0.6183979907960295, "y": -0.010631124470090274, "z": 0.7857931688249368, "word": "Calicoback", "pos_group": "noun", "row_number": 21983, "definition": "An hemipterous insect (Murgantia histrionica) which injures the cabbage and other garden plants; -- called also calico bug and harlequin cabbage bug.", "details": []}, {"x": -0.6120789698968381, "y": 0.09351742971924411, "z": 0.7852476201484037, "word": "Calycozoa", "pos_group": "other", "row_number": 22186, "definition": "A group of acalephs of which Lucernaria is the type. The body is cup-shaped with eight marginal lobes bearing clavate tentacles. An aboral sucker serves for attachment. The interior is divided into four large compartments. See Lucernarida.", "details": []}, {"x": -0.6713211600582799, "y": 0.01962816332356189, "z": 0.7409066305969658, "word": "Canker fly", "pos_group": "other", "row_number": 22531, "definition": "A fly that preys on fruit.", "details": []}, {"x": -0.590093502988746, "y": 0.02422571435131163, "z": 0.8069713579146657, "word": "Cankerworm", "pos_group": "noun", "row_number": 22534, "definition": "The larva of two species of geometrid moths which are very injurious to fruit and shade trees by eating and often entirely destroying the foliage. Other similar larvae are also called cankerworms.", "details": []}, {"x": -0.6506277160158985, "y": 0.09164408367199237, "z": 0.7538467596798809, "word": "Cantharis", "pos_group": "noun", "row_number": 22692, "definition": "A beetle (Lytta / Cantharis vesicatoria) havin1g an elongated cylindrical body of a brilliant green color and a nauseous odor; the blister fly or blister beetle of the apothecary; -- also called Spanish fly. Many other species of Lytta used for the same purpose take the same name. See Blister beetle under Blister. The plural form in usually applied to the dried insects used in medicine.", "details": []}, {"x": -0.6427288100083254, "y": -0.01261632730940402, "z": 0.7659898857494817, "word": "Carabid", "pos_group": "noun", "row_number": 23095, "definition": "One of the Carabidae a family of active insectivorous beetles.", "details": []}, {"x": -0.5935893845875855, "y": 0.07376147405890084, "z": 0.8013806133477335, "word": "Carabus", "pos_group": "noun", "row_number": 23099, "definition": "A genus of ground beetles including numerous species. They devour many injurious insects.", "details": []}, {"x": -0.674132054004297, "y": 0.05081314560016775, "z": 0.7368609081761387, "word": "Cardo", "pos_group": "noun", "row_number": 23272, "definition": "The basal joint of the maxilla in insects.", "details": []}, {"x": -0.6044331780612965, "y": -0.002023456367903706, "z": 0.7966532739423394, "word": "Carpintero", "pos_group": "noun", "row_number": 23514, "definition": "A california woodpecker (Melanerpes formicivorus) noted for its habit of inserting acorns in holes which it drills in trees. The acorns become infested by insect larvae which when grown are extracted for food by the bird.", "details": []}, {"x": -0.6265367252345685, "y": 0.09911012570070839, "z": 0.7730646253166243, "word": "Caseworm", "pos_group": "noun", "row_number": 23745, "definition": "A worm or grub that makes for itself a case. See Caddice.", "details": []}, {"x": -0.6638524777421321, "y": 0.0027077905161491172, "z": 0.7478586468485555, "word": "Cast", "pos_group": "noun", "row_number": 23854, "definition": "That which is throw out or off shed or ejected; as the skin of an insect the refuse from a hawk's stomach the excrement of a earthworm.", "details": []}, {"x": -0.5864911652511244, "y": 0.04361233277251378, "z": 0.8087806114840524, "word": "Catchfly", "pos_group": "noun", "row_number": 24107, "definition": "A plant with the joints of the stem and sometimes other parts covered with a viscid secretion to which small insects adhere. The species of Silene are examples of the catchfly.", "details": []}, {"x": -0.6633310306865193, "y": 0.07997203541717018, "z": 0.7440406019026077, "word": "Caterpillar", "pos_group": "noun", "row_number": 24186, "definition": "The larval state of a butterfly or any lepidopterous insect; sometimes but less commonly the larval state of other insects as the sawflies which are also called false caterpillars. The true caterpillars have three pairs of true legs and several pairs of abdominal fleshy legs (prolegs) armed with hooks. Some are hairy others naked. They usually feed on leaves fruit and succulent vegetables being often very destructive Many of them are popularly called worms as the cutworm", "details": []}, {"x": -0.6274465988457452, "y": -0.014840875912089255, "z": 0.7785181526458252, "word": "Cavitary", "pos_group": "adjective", "row_number": 24476, "definition": "Containing a body cavity; as the cavitary or nematoid worms.", "details": []}, {"x": -0.603298978047777, "y": 0.08876326879707232, "z": 0.7925600451694286, "word": "Cecidomyia", "pos_group": "noun", "row_number": 24511, "definition": "A genus of small dipterous files including several very injurious species as the Hessian fly. See Hessian fly.", "details": []}, {"x": -0.6750046616847628, "y": 0.03086427723187985, "z": 0.7371676221150739, "word": "Cephalomere", "pos_group": "noun", "row_number": 24837, "definition": "One of the somites (arthromeres) which make up the head of arthropods.", "details": []}, {"x": -0.5932703971967311, "y": 0.012389966105548628, "z": 0.8049078981783794, "word": "Cephalosome", "pos_group": "noun", "row_number": 24847, "definition": "The anterior region or head of insects and other arthropods.", "details": []}, {"x": -0.642037834538348, "y": 0.09783019333202195, "z": 0.7604055972268539, "word": "Cephalotrocha", "pos_group": "noun", "row_number": 24855, "definition": "A kind of annelid larva with a circle of cilia around the head.", "details": []}, {"x": -0.652027674247315, "y": -0.00988235024405184, "z": 0.7581307612604116, "word": "Cercaria", "pos_group": "noun", "row_number": 24887, "definition": "The larval form of a trematode worm having the shape of a tadpole with its body terminated by a tail-like appendage.", "details": []}, {"x": -0.5882809698337944, "y": 0.06349854967357253, "z": 0.8061596831402345, "word": "Cercopod", "pos_group": "noun", "row_number": 24890, "definition": "One of the jointed antenniform appendages of the posterior somites of certain insects.", "details": []}, {"x": -0.6724371805304883, "y": 0.06321330819666603, "z": 0.7374498734877108, "word": "Cestoidea", "pos_group": "other", "row_number": 25077, "definition": "A class of parasitic worms (Platelminthes) of which the tapeworms are the most common examples. The body is flattened and usually but not always long and composed of numerous joints or segments each of which may contain a complete set of male and female reproductive organs. They have neither mouth nor intestine. See Tapeworm.", "details": []}, {"x": -0.6120677771228774, "y": -0.010047436678694052, "z": 0.7907414781229372, "word": "Chacma", "pos_group": "noun", "row_number": 25119, "definition": "A large species of African baboon (Cynocephalus porcarius); -- called also ursine baboon. [See Illust. of Baboon.]", "details": []}, {"x": -0.6167633112325331, "y": 0.09849800412544413, "z": 0.780961689905968, "word": "Chaetodont", "pos_group": "adjective", "row_number": 25125, "definition": "Of or pertaining to the Chaetodonts or the family Chaetodontidae.", "details": []}, {"x": -0.6704237848724994, "y": 0.011654909236585693, "z": 0.7418868591422277, "word": "Chaetotaxy", "pos_group": "noun", "row_number": 25131, "definition": "The arrangement of bristles on an insect.", "details": []}, {"x": -0.5863992575477607, "y": 0.030998687922781012, "z": 0.8094288060691323, "word": "Chafer", "pos_group": "noun", "row_number": 25145, "definition": "A kind of beetle; the cockchafer. The name is also applied to other species; as the rose chafer.", "details": []}, {"x": -0.6566704696717377, "y": 0.08960612968517977, "z": 0.7488355198466097, "word": "Chalcid fly", "pos_group": "other", "row_number": 25235, "definition": "One of a numerous family of hymenopterous insects (Chalcididae. Many are gallflies others are parasitic on insects.", "details": []}, {"x": -0.6371777412781442, "y": -0.01641975665865135, "z": 0.7705419635626298, "word": "Cheiropterous", "pos_group": "adjective", "row_number": 26058, "definition": "Belonging to the Cheiroptera or Bat family.", "details": []}, {"x": -0.5954145132554005, "y": 0.08140961575223642, "z": 0.7992834490141203, "word": "Chelicera", "pos_group": "noun", "row_number": 26070, "definition": "One of the anterior pair of mouth organs terminated by a pincherlike claw in scorpions and allied Arachnida. They are homologous with the falcers of spiders and probably with the mandibles of insects.", "details": []}, {"x": -0.676681533409123, "y": 0.04329727839639034, "z": 0.7350016653222927, "word": "Chigre", "pos_group": "noun", "row_number": 26316, "definition": "A species of flea (Pulex penetrans) common in the West Indies and South America which often attacks the feet or any exposed part of the human body and burrowing beneath the skin produces great irritation. When the female is allowed to remain and breed troublesome sores result which are sometimes dangerous. See Jigger.", "details": []}, {"x": -0.5985105160380316, "y": 0.0013960615056533992, "z": 0.8011137330018513, "word": "Chilopoda", "pos_group": "other", "row_number": 26394, "definition": "One of the orders of myriapods including the centipeds. They have a single pair of elongated legs attached laterally to each segment; well developed jaws; and a pair of thoracic legs converted into poison fangs. They are insectivorous very active and some species grow to the length of a foot.", "details": []}, {"x": -0.6324162073201147, "y": 0.10157274679389325, "z": 0.7679405692028423, "word": "Chinch", "pos_group": "noun", "row_number": 26441, "definition": "The bedbug (Cimex lectularius).", "details": []}, {"x": -0.6607791605714164, "y": -0.004386398979387074, "z": 0.7505675588902893, "word": "Chinch", "pos_group": "noun", "row_number": 26442, "definition": "A bug (Blissus leucopterus) which in the United States is very destructive to grass wheat and other grains; -- also called chiniz chinch bug chink bug. It resembles the bedbug in its disgusting odor.", "details": []}, {"x": -0.5848158133379973, "y": 0.05161084212410114, "z": 0.8095225663593684, "word": "Chitin", "pos_group": "noun", "row_number": 26583, "definition": "A white amorphous horny substance forming the harder part of the outer integument of insects crustacea and various other invertebrates; entomolin.", "details": []}, {"x": -0.6685709380374278, "y": 0.0752402826482398, "z": 0.7398322787488844, "word": "Chlorocruorin", "pos_group": "noun", "row_number": 26643, "definition": "A green substance supposed to be the cause of the green color of the blood in some species of worms.", "details": []}, {"x": -0.6210578729674883, "y": -0.015890277274602394, "z": 0.7836036099414267, "word": "Chrysalis", "pos_group": "noun", "row_number": 27086, "definition": "The pupa state of certain insects esp. of butterflies from which the perfect insect emerges. See Pupa and Aurelia (a).", "details": []}, {"x": -0.607167948887141, "y": 0.09504094575539346, "z": 0.7888690008322691, "word": "Chrysopa", "pos_group": "noun", "row_number": 27102, "definition": "A genus of neuropterous insects. See Lacewing.", "details": []}, {"x": -0.675372258253162, "y": 0.022612691206345275, "z": 0.7371302320339538, "word": "Chuck-Will's-widow", "pos_group": "noun", "row_number": 27143, "definition": "A species of goatsucker (Antrostomus Carolinensis) of the southern United States; -- so called from its note.", "details": []}, {"x": -0.5885240855582183, "y": 0.018271800889109367, "z": 0.8082731852598674, "word": "Churrworm", "pos_group": "noun", "row_number": 27218, "definition": "An insect that turns about nimbly; the mole cricket; -- called also fan cricket.", "details": []}, {"x": -0.6483663056322686, "y": 0.09738994838865538, "z": 0.7550737259854954, "word": "Cicada", "pos_group": "noun", "row_number": 27255, "definition": "Any species of the genus Cicada. They are large hemipterous insects with nearly transparent wings. The male makes a shrill sound by peculiar organs in the under side of the abdomen consisting of a pair of stretched membranes acted upon by powerful muscles. A noted American species (C. septendecim) is called the seventeen year locust. Another common species is the dogday cicada.", "details": []}, {"x": -0.6471107614975111, "y": -0.01515396076196309, "z": 0.7622453803253492, "word": "Cilia", "pos_group": "other", "row_number": 27298, "definition": "Small generally microscopic vibrating appendages lining certain organs as the air passages of the higher animals and in the lower animals often covering also the whole or a part of the exterior. They are also found on some vegetable organisms. In the Infusoria and many larval forms they are locomotive organs.", "details": []}, {"x": -0.5888812288993274, "y": 0.07171361714528637, "z": 0.8050317107828469, "word": "Ciliary", "pos_group": "adjective", "row_number": 27302, "definition": "Pertaining to or connected with the cilia in animal or vegetable organisms; as ciliary motion.", "details": []}, {"x": -0.6761615271290576, "y": 0.05633347933744598, "z": 0.7345965752276812, "word": "Cimex", "pos_group": "noun", "row_number": 27327, "definition": "A genus of hemipterous insects of which the bedbug is the best known example. See Bedbug.", "details": []}, {"x": -0.6056376681252578, "y": -0.008138036921748821, "z": 0.795698930062659, "word": "Cingulum", "pos_group": "noun", "row_number": 27370, "definition": "The clitellus of earthworms.", "details": []}, {"x": -0.622213485207469, "y": 0.10255538049597605, "z": 0.7761010068008547, "word": "Cirrus", "pos_group": "noun", "row_number": 27677, "definition": "The external male organ of trematodes and some other worms and of certain Mollusca.", "details": []}, {"x": -0.6684951337336054, "y": 0.0037186501700136867, "z": 0.7437072191497149, "word": "Citigradae", "pos_group": "other", "row_number": 27727, "definition": "A suborder of Arachnoidea including the European tarantula and the wolf spiders (Lycosidae) and their allies which capture their prey by rapidly running and jumping. See Wolf spider.", "details": []}, {"x": -0.5834621795054113, "y": 0.03864105301884274, "z": 0.8112205335840497, "word": "Cladocera", "pos_group": "other", "row_number": 27808, "definition": "An order of the Entomostraca.", "details": []}, {"x": -0.6626269878014648, "y": 0.08624675965852764, "z": 0.7439670499999054, "word": "Clavicorn", "pos_group": "adjective", "row_number": 28074, "definition": "Having club-shaped antennae. See Antennae", "details": []}, {"x": -0.6309963392535262, "y": -0.019141182837884244, "z": 0.7755496341100391, "word": "Clavicornes", "pos_group": "other", "row_number": 28076, "definition": "A group of beetles having club-shaped antennae.", "details": []}, {"x": -0.5982573245350695, "y": 0.08878193163605873, "z": 0.796370480527192, "word": "Clearwing", "pos_group": "noun", ber": 29148, "definition": "A venomous serpent which which cannot now be identified.", "details": []}, {"x": -0.6283144361338032, "y": 0.10553553560995033, "z": 0.7707679417758512, "word": "Cockatrice", "pos_group": "noun", "row_number": 29149, "definition": "Any venomous or deadly thing.", "details": []}, {"x": -0.6655367089710164, "y": -0.003963244798282849, "z": 0.7463545951507888, "word": "Cockchafer", "pos_group": "noun", "row_number": 29153, "definition": "A beetle of the genus Melolontha (esp. M. vulgaris) and allied genera; -- called also May bug chafer or dorbeetle.", "details": []}, {"x": -0.5813950664748841, "y": 0.04698608427116872, "z": 0.812263556097113, "word": "Cockroach", "pos_group": "noun", "row_number": 29212, "definition": "An orthopterous insect of the genus Blatta and allied genera.", "details": []}, {"x": -0.6683293519343168, "y": 0.08159465915071368, "z": 0.7393768923499945, "word": "Cocktail", "pos_group": "noun", "row_number": 29226, "definition": "A species of rove beetle; -- so called from its habit of elevating the tail.", "details": []}, {"x": -0.6243195860360251, "y": -0.020656257985525374, "z": 0.7808958787814425, "word": "Cocoon", "pos_group": "noun", "row_number": 29238, "definition": "An oblong case in which the silkworm lies in its chrysalis state. It is formed of threads of silk spun by the worm just before leaving the larval state. From these the silk of commerce is prepared.", "details": []}, {"x": -0.6020865320424025, "y": 0.0956662839873624, "z": 0.7926788568147902, "word": "Cocoon", "pos_group": "noun", "row_number": 29239, "definition": "The case constructed by any insect to contain its larva or pupa.", "details": []}, {"x": -0.6790745112623502, "y": 0.02642761059611364, "z": 0.7335934770375078, "word": "Cocoon", "pos_group": "noun", "row_number": 29240, "definition": "The case of silk made by spiders to protect their eggs.", "details": []}, {"x": -0.5876384059653669, "y": 0.011991125699306588, "z": 0.8090348056412321, "wo
