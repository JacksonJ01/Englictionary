ation or adjournment; thus a session of Parliaments is opened with a speech from the throne and closed by prorogation. The session of a judicial court is called a term.", "details": []}, {"x": 0.136612611117737, "y": -0.8393702989246168, "z": -0.5261126265038633, "word": "Set", "pos_group": "other", "row_number": 138901, "definition": "To determine; to appoint; to assign; to fix; as to set a time for a meeting; to set a price on a horse.", "details": []}, {"x": 0.22582231055865337, "y": -0.6430798689884157, "z": -0.7317462443742319, "word": "Set-off", "pos_group": "noun", "row_number": 138970, "definition": "A counterclaim; a cross debt or demand; a distinct claim filed or set up by the defendant against the plaintiff's demand.", "details": []}, {"x": 0.34603793542212286, "y": -0.7918593305373143, "z": -0.5032062677369898, "word": "Settle", "pos_group": "noun", "row_number": 139007, "definition": "Hence to pay; as to settle a bill.", "details": []}, {"x": 0.07944796442148211, "y": -0.7687653198394923, "z": -0.6345769488102808, "word": "Settle", "pos_group": "other", "row_number": 139012, "definition": "To be established in an employment or profession; as to settle in the practice of law.", "details": []}, {"x": 0.352415239690039, "y": -0.6539611572089034, "z": -0.6694313285888288, "word": "Settle", "pos_group": "other", "row_number": 139018, "definition": "To adjust differences or accounts; to come to an agreement; as he has settled with his creditors.", "details": []}, {"x": 0.21647721838728956, "y": -0.8463978896684127, "z": -0.48656780235046315, "word": "Settlement", "pos_group": "noun", "row_number": 139024, "definition": "The act or process of adjusting or determining; composure of doubts or differences; pacification; liquidation of accounts; arrangement; adjustment; as settlement of a controversy of accounts etc.", "details": []}, {"x": 0.14389177964016872, "y": -0.6773780822387453, "z": -0.7214250407731526, "word": "Settlement", "pos_group": "noun", "row_numb
