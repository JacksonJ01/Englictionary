": 0.7814524048666883, "word": "Aloe", "pos_group": "noun", "row_number": 4652, "definition": "A genus of succulent plants some classed as trees others as shrubs but the greater number having the habit and appearance of evergreen herbaceous plants; from some of which are prepared articles for medicine and the arts. They are natives of warm countries.", "details": []}, {"x": -0.4944764826046563, "y": 0.3387937888507198, "z": 0.8004447368726343, "word": "Alpine", "pos_group": "adjective", "row_number": 4719, "definition": "Of or pertaining to the Alps or to any lofty mountain; as Alpine snows; Alpine plants.", "details": []}, {"x": -0.4468220922946934, "y": 0.3814098920483249, "z": 0.8092444081271599, "word": "Alsike", "pos_group": "noun", "row_number": 4731, "definition": "A species of clover with pinkish or white flowers; Trifolium hybridum.", "details": []}, {"x": -0.5030321104321208, "y": 0.3784871342426264, "z": 0.7769853184501047, "word": "Althea", "pos_group": "noun", "row_number": 4801, "definition": "A genus of plants of the Mallow family. It includes the officinal marsh mallow and the garden hollyhocks.", "details": []}, {"x": -0.4678490926698348, "y": 0.3397453310469928, "z": 0.8158984841999535, "word": "Althea", "pos_group": "noun", "row_number": 4802, "definition": "An ornamental shrub (Hibiscus Syriacus) of the Mallow family.", "details": []}, {"x": -0.4631960046901097, "y": 0.4001214594117139, "z": 0.7907921844311311, "word": "Alum root", "pos_group": "other", "row_number": 4861, "definition": "A North American herb (Heuchera Americana) of the Saxifrage family whose root has astringent properties.", "details": []}, {"x": -0.5056299564400314, "y": 0.3497590234834312, "z": 0.7886741866210459, "word": "Alyssum", "pos_group": "noun", "row_number": 4890, "definition": "A genus of cruciferous plants; madwort. The sweet alyssum (A. maritimum) cultivated for bouquets bears small white sweet-scented flowers.", "details": []}, {"x": -0.4474224847202503, "y": 0.36 od and wormwood. Of these A. absinthium or common wormwood is well known and A. tridentata is the sage brush of the Rocky Mountain region.", "details": []}, {"x": -0.4324963941340584, "y": 0.3658571141874859, "z": 0.8240724731839077, "word": "Arthrozoic", "pos_group": "adjective", "row_number": 9199, "definition": "Of or pertaining to the Articulata; articulate.", "details": []}, {"x": -0.5008352952666999, "y": 0.4020129903831153, "z": 0.7665178162171724, "word": "Artichoke", "pos_group": "noun", "row_number": 9201, "definition": "The Cynara scolymus a plant somewhat resembling a thistle with a dilated imbricated and prickly involucre. The head (to which the name is also applied) is composed of numerous oval scales inclosing the florets sitting on a broad receptacle which with the fleshy base of the scales is much esteemed as an article of food.", "details": []}, {"x": -0.4842127557984258, "y": 0.31977511507469, "z": 0.8144211950219999, "word": "Articuli", "pos_group": "other", "row_number": 9254, "definition": "of Articulus", "details": []}, {"x": -0.440111313982129, "y": 0.4050056020402031, "z": 0.8014190499488868, "word": "Artificial", "pos_group": "adjective", "row_number": 9267, "definition": "Cultivated; not indigenous; not of spontaneous growth; as artificial grasses.", "details": []}, {"x": -0.5219926623807836, "y": 0.3616349409252067, "z": 0.7724919610731515, "word": "Artocarpous", "pos_group": "adjective", "row_number": 9304, "definition": "Of or pertaining to the breadfruit or to the genus Artocarpus.", "details": []}, {"x": -0.4452544062549453, "y": 0.3401063327253411, "z": 0.8282971665716815, "word": "Arum", "pos_group": "noun", "row_number": 9310, "definition": "A genus of plants found in central Europe and about the Mediterranean having flowers on a spadix inclosed in a spathe. The cuckoopint of the English is an example.", "details": []}, {"x": -0.4764124299085851, "y": 0.4154944300913183, "z": 0.7748519698572676, "word": "Asafoetida", "pos_group": "noun", "row_number": 9342, "definition": "The fetid gum resin or inspissated juice of a large umbelliferous plant (Ferula asafoetida) of Persia and the East Indies. It is used in medicine as an antispasmodic.", "details": []}, {"x": -0.5074404567286551, "y": 0.3256795398592915, "z": 0.797770029640155, "word": "Asarabacca", "pos_group": "noun", "row_number": 9344, "definition": "An acrid herbaceous plant (Asarum Europaeum) the leaves and roots of which are emetic and cathartic. It is principally used in cephalic snuffs.", "details": []}, {"x": -0.4302638870134933, "y": 0.3826934877365611, "z": 0.8175687628426529, "word": "Ascidium", "pos_group": "noun", "row_number": 9406, "definition": "A pitcher-shaped or flask-shaped organ or appendage of a plant as the leaves of the pitcher plant or the little bladderlike traps of the bladderwort (Utricularia).", "details": []}, {"x": -0.5131590177165667, "y": 0.3886401695953596, "z": 0.7652624655064814, "word": "Ascidium", "pos_group": "noun", "row_number": 9407, "definition": "A genus of simple ascidians which formerly included most of the known species. It is sometimes used as a name for the Ascidioidea or for all the Tunicata.", "details": []}, {"x": -0.4681507841289048, "y": 0.3225668098867478, "z": 0.8226697371843568, "word": "Asclepiadaceous", "pos_group": "adjective", "row_number": 9416, "definition": "Of pertaining to or resembling plants of the Milkweed family.", "details": []}, {"x": -0.4513931793877058, "y": 0.414247485257267, "z": 0.7903437344347639, "word": "Asclepias", "pos_group": "noun", "row_number": 9417, "definition": "A genus of plants including the milkweed swallowwort and some other species having medicinal properties.", "details": []}, {"x": -0.521364393528389, "y": 0.3451015871586009, "z": 0.7804383791827448, "word": "Ascospore", "pos_group": "noun", "row_number": 9420, "definition": "One of the spores contained in the asci of lichens and fungi. [See Illust. of Ascus.]", "details": []}, {"x": -0.4347653057125076, "y": 0.3552001876168403, "z": 0.8275336583279687, "word": "Ashweed", "pos_group": "noun", "row_number": 9470, "definition": "Goutweed.", "details": []}, {"x": -0.4924662047902721, "y": 0.4097229964376555, "z": 0.7678568247594174, "word": "Aspalathus", "pos_group": "noun", "row_number": 9529, "definition": "A genus of plants of the natural order Leguminosae. The species are chiefly natives of the Cape of Good Hope.", "details": []}, {"x": -0.494158956591004, "y": 0.3189844221752159, "z": 0.8087372033178849, "word": "Asparagus", "pos_group": "noun", "row_number": 9532, "definition": "A genus of perennial plants belonging to the natural order Liliaceae and having erect much branched stems and very slender branchlets which are sometimes mistaken for leaves. Asparagus racemosus is a shrubby climbing plant with fragrant flowers. Specifically: The Asparagus officinalis a species cultivated in gardens.", "details": []}, {"x": -0.4336881461144412, "y": 0.3983235532710314, "z": 0.8082406441335146, "word": "Asp", "pos_group": "noun", "row_number": 9548, "definition": "One of several species of poplar bearing this name especially the Populus tremula so called from the trembling of its leaves which move with the slightest impulse of the air.", "details": []}, {"x": -0.5213534509181015, "y": 0.3721934024562044, "z": 0.7678949474920774, "word": "Asphodel", "pos_group": "noun", "row_number": 9597, "definition": "A general name for a plant of the genus Asphodelus. The asphodels are hardy perennial plants several species of which are cultivated for the beauty of their flowers.", "details": []}, {"x": -0.4525126507107905, "y": 0.3311153932402124, "z": 0.8280065804726879, "word": "Aspic", "pos_group": "noun", "row_number": 9608, "definition": "A European species of lavender (Lavandula spica) which produces a volatile oil. See Spike.", "details": []}, {"x": -0.4661958911428174, "y": 0.4180647201297571, "z": 0.7796686994258409, "word": "Aster", "pos_group": "noun", "row_number": 10004, "definition": "A genus of herbs with compound white or bluish flowers; starwort; Michaelmas daisy.", "details": []}, {"x": -0.5151045539611484, "y": 0.3308068624896496, "z": 0.7907174705406732, "word": "Aster", "pos_group": "noun", "row_number": 10005, "definition": "A plant of the genus Callistephus. Many varieties (called China asters German asters etc.) are cultivated for their handsome compound flowers.", "details": []}, {"x": -0.4290666220623338, "y": 0.3724324839445398, "z": 0.8229191204091193, "word": "Astragalus", "pos_group": "noun", "row_number": 10082, "definition": "A genus of papilionaceous plants of the tribe Galegeae containing numerous species two of which are called in English milk vetch and licorice vetch. Gum tragacanth is obtained from different oriental species particularly the A. gummifer and A. verus.", "details": []}, {"x": -0.5070932446560046, "y": 0.398541391578163, "z": 0.7642127978666591, "word": "Astrofell", "pos_group": "noun", "row_number": 10117, "definition": "A bitter herb probably the same as aster or starwort.", "details": []}, {"x": -0.4781757281968272, "y": 0.318140695672698, "z": 0.8186174141320998, "word": "Atropine", "pos_group": "noun", "row_number": 10408, "definition": "A poisonous white crystallizable alkaloid extracted from the Atropa belladonna or deadly nightshade and the Datura Stramonium or thorn apple. It is remarkable for its power in dilating the pupil of the eye. Called also daturine.", "details": []}, {"x": -0.4425398594623562, "y": 0.4107358335120558, "z": 0.7971540301950399, "word": "Attar", "pos_group": "noun", "row_number": 10489, "definition": "A fragrant essential oil; esp. a volatile and highly fragrant essential oil obtained from the petals of roses.", "details": []}, {"x": -0.5242367977831538, "y": 0.3546275409815911, "z": 0.7742190174798179, "word": "Attire", "pos_group": "noun", "row_number": 10603, "definition": "The internal parts of a flower included within the calyx and the corolla.", "details": []}, {"x": -0.4392761209215702, "y": 0.344550119389971, "z": 0.8296515562671204, "word": "Aura", "pos_group": "noun", "row_number": 10836, "definition": "Any subtile invisible emanation effluvium or exhalation from a substance as the aroma of flowers the odor of the blood a supposed fertilizing emanation from the pollen of flowers etc.", "details": []}, {"x": -0.4827817060994132, "y": 0.4157818827016223, "z": 0.7707446076832678, "word": "Aurantiaceous", "pos_group": "adjective", "row_number": 10840, "definition": "Pertaining to or resembling the Aurantiaceae an order of plants (formerly considered natural) of which the orange is the type.", "details": []}, {"x": -0.5037967039256687, "y": 0.3206238202600265, "z": 0.8021154823312527, "word": "Auricled", "pos_group": "adjective", "row_number": 10863, "definition": "Having ear-shaped appendages or lobes; auriculate; as auricled leaves.", "details": []}, {"x": -0.4290403867520157, "y": 0.3897118879058753, "z": 0.8148920118399241, "word": "Auricula", "pos_group": "noun", "row_number": 10866, "definition": "A species of Primula or primrose called also from the shape of its leaves bear's-ear.", "details": []}, {"x": -0.5184034213496591, "y": 0.3831611344859056, "z": 0.7644903123993408, "word": "Autogamy", "pos_group": "noun", "row_number": 11051, "definition": "Self-fertilization the fertilizing pollen being derived from the same blossom as the pistil acted upon.", "details": []}, {"x": -0.4613998518784101, "y": 0.3234569042261087, "z": 0.8261269925350723, "word": "Autumnal", "pos_group": "adjective", "row_number": 11114, "definition": "Of belonging to or peculiar to autumn; as an autumnal tint; produced or gathered in autumn; as autumnal fruits; flowering in autumn; as an autumnal plant.", "details": []}, {"x": -0.4558941453266599, "y": 0.4182576759000211, "z": 0.7856341672862677, "word": "Avena", "pos_group": "noun", "row_number": 11178, "definition": "A genus of grasses including the common oat (Avena sativa); the oat grasses.", "details": []}, {"x": -0.5212597198206682, "y": 0.3381058883474964, "z": 0.7835641089006239, "word": "Avenaceous", "pos_group": "adjective", "row_number": 11179, "definition": "Belonging to or resembling oats or the oat grasses.", "details": []}, {"x": -0.4301820263360301, "y": 0.3613518875975591, "z": 0.8272655181663915, "word": "Avenious", "pos_group": "adjective", "row_number": 11194, "definition": "Being without veins or nerves as the leaves of certain plants.", "details": []}, {"x": -0.4991283317537134, "y": 0.4074729736392891, "z": 0.7647461567045044, "word": "Avens", "pos_group": "noun", "row_number": 11196, "definition": "A plant of the genus Geum esp. Geum urbanum or herb bennet.", "details": []}, {"x": -0.488682981715278, "y": 0.3159682423051115, "z": 0.8132361362092092, "word": "Avignon berry", "pos_group": "other", "row_number": 11281, "definition": "The fruit of the Rhamnus infectorius eand of other species of the same genus; -- so called from the city of Avignon in France. It is used by dyers and painters for coloring yellow. Called also French berry.", "details": []}, {"x": -0.4348804967506302, "y": 0.4048709014924491, "z": 0.8043373090132129, "word": "Awlwort", "pos_group": "noun", "row_number": 11455, "definition": "A plant (Subularia aquatica) with awl-shaped leaves.", "details": []}, {"x": -0.5248629842226705, "y": 0.3653653685017696, "z": 0.7687828011164395, "word": "Awn", "pos_group": "noun", "row_number": 11457, "definition": "The bristle or beard of barley oats grasses etc. or any similar bristlelike appendage; arista.", "details": []}, {"x": -0.4459042247985018, "y": 0.3344728642451643, "z": 0.8302393181429577, "word": "Azalea", "pos_group": "noun", "row_number": 11545, "definition": "A genus of showy flowering shrubs mostly natives of China or of North America; false honeysuckle. The genus is scarcely distinct from Rhododendron.", "details": []}, {"x": -0.4722261883957416, "y": 0.4197792402339879, "z": 0.7751050357608352, "word": "Azarole", "pos_group": "noun", "row_number": 11546, "definition": "The Neapolitan medlar (Crataegus azarolus) a shrub of southern Europe; also its fruit.", "details": []}, {"x": -0.5125954617703119, "y": 0.3247312371744836, "z": 0.7948556574470675, "word": "Bachelor's button", "pos_group": "other", "row_number": 11722, "definition": "A plant with flowers shaped like buttons; especially several species of Ranunculus and the cornflower (Centaures cyanus) and globe amaranth (Gomphrena).", "details": []}, {"x": -0.4265050382108037, "y": 0.3795261380376238, "z": 0.8210075291536902, "word": "Bacterium", "pos_group": "noun", "row_number": 11891, "definition": "A microscopic vegetable organism belonging to the class Algae usually in the form of a jointed rodlike filament and found in putrefying organic infusions. Bacteria are destitute of chlorophyll and are the smallest of microscopic organisms. They are very widely diffused in nature and multiply with marvelous rapidity both by fission and by spores. Certain species are active agents in fermentation while others appear to be the cause of certain infectious diseases. See Bacillus.", "details": []}, {"x": -0.5131774035595297, "y": 0.3939756928213773, "z": 0.7625169545274489, "word": "Bactrian", "pos_group": "adjective", "row_number": 11894, "definition": "Of or pertaining to Bactria in Asia.", "details": []}, {"x": -0.4715267557408442, "y": 0.3176040320456456, "z": 0.8226725943222264, "word": "Badian", "pos_group": "noun", "row_number": 11924, "definition": "An evergreen Chinese shrub of the Magnolia family (Illicium anisatum) and its aromatic seeds; Chinese anise; star anise.", "details": []}, {"x": -0.4460464378548118, "y": 0.4159392643941437, "z": 0.7924879201680567, "word": "Ball-flower", "pos_group": "noun", "row_number": 12241, "definition": "An ornament resembling a ball placed in a circular flower the petals of which form a cup round it -- usually inserted in a hollow molding.", "details": []}, {"x": -0.5255008061861901, "y": 0.3472999259156694, "z": 0.7766798981283313, "word": "Balm", "pos_group": "noun", "row_number": 12280, "definition": "An aromatic plant of the genus Melissa.", "details": []}, {"x": -0.4336670699481419, "y": 0.3499942170519107, "z": 0.8303233830700022, "word": "Balsam", "pos_group": "noun", "row_number": 12302, "definition": "An annual garden plant (Impatiens balsamina) with beautiful flowers; balsamine.", "details": []}, {"x": -0.4895864458784187, "y": 0.4149120743856902, "z": 0.7669113915838659, "word": "Balsamine", "pos_group": "noun", "row_number": 12310, "definition": "The Impatiens balsamina or garden balsam.", "details": []}, {"x": -0.4991402048246456, "y": 0.3162767530265352, "z": 0.8067391594701494, "word": "Bamboo", "pos_group": "noun", "row_number": 12324, "definition": "A plant of the family of grasses and genus Bambusa growing in tropical countries.", "details": []}, {"x": -0.4288773348854747, "y": 0.3968415976786615, "z": 0.8115300228416565, "word": "Banana", "pos_group": "noun", "row_number": 12345, "definition": "A perennial herbaceous plant of almost treelike size (Musa sapientum); also its edible fruit. See Musa.", "details": []}, {"x": -0.5230948223748293, "y": 0.3768085172732088, "z": 0.7644521882465978, "word": "Band", "pos_group": "other", "row_number": 12360, "definition": "A space between elevated lines or ribs as of the fruits of umbelliferous plants.", "details": []}, {"x": -0.4544046804404024, "y": 0.3255262410956261, "z": 0.8291857769836672, "word": "Bandicoot", "pos_group": "noun", "row_number": 12391, "definition": "A species of very large rat (Mus giganteus) found in India and Ceylon. It does much injury to rice fields and gardens.", "details": []}, {"x": -0.4613094769413228, "y": 0.4214000910149238, "z": 0.7807787969564344, "word": "Baneberry", "pos_group": "noun", "row_number": 12425, "definition": "A genus (Actaea) of plants of the order Ranunculaceae native in the north temperate zone. The red or white berries are poisonous.", "details": []}, {"x": -0.5200487484125911, "y": 0.3312120362681407, "z": 0.787304189183323, "word": "Barberry", "pos_group": "noun", "row_number": 12674, "definition": "A shrub of the genus Berberis common along roadsides and in neglected fields. B. vulgaris is the species best known; its oblong red berries are made into a preserve or sauce and have been deemed efficacious in fluxes and fevers. The bark dyes a fine yellow esp. the bark of the root.", "details": []}, {"x": -0.4263180782640366, "y": 0.368221701055977, "z": 0.826235847090104, "word": "Barometz", "pos_group": "noun", "row_number": 12848, "definition": "The woolly-skinned rhizoma or rootstock of a fern (Dicksonia barometz) which when specially prepared and inverted somewhat resembles a lamb; -- called also Scythian lamb.", "details": []}, {"x": -0.505835093885415, "y": 0.4040601851532654, "z": 0.7621458026964671, "word": "Barrenwort", "pos_group": "noun", "row_number": 12911, "definition": "An herbaceous plant of the Barberry family (Epimedium alpinum) having leaves that are bitter and said to be sudorific.", "details": []}, {"x": -0.4824211965378748, "y": 0.3139511988460249, "z": 0.8177435012729289, "word": "Basidium", "pos_group": "noun", "row_number": 13065, "definition": "A special oblong or pyriform cell with slender branches which bears the spores in that division of fungi called Basidiomycetes of which the common mushroom is an example.", "details": []}, {"x": -0.4371891760638491, "y": 0.4111060402506783, "z": 0.799910900039511, "word": "Basigynium", "pos_group": "noun", "row_number": 13069, "definition": "The pedicel on which the ovary of certain flowers as the passion flower is seated; a carpophore or thecaphore.", "details": []}, {"x": -0.5275099145105885, "y": 0.3579986129148468, "z": 0.7704351259152696, "word": "Basil", "pos_group": "noun", "row_number": 13076, "definition": "The name given to several aromatic herbs of the Mint family but chiefly to the common or sweet basil (Ocymum basilicum) and the bush basil or lesser basil (O. minimum) the leaves of which are used in cookery. The name is also given to several kinds of mountain mint (Pycnanthemum).", "details": []}, {"x": -0.4394529102483967, "y": 0.3389387777481819, "z": 0.8318663622318089, "word": "Basisolute", "pos_group": "adjective", "row_number": 13117, "definition": "Prolonged at the base as certain leaves.", "details": []}, {"x": -0.4788878641787241, "y": 0.4203954880854113, "z": 0.7706711666721214, "word": "Batata", "pos_group": "noun", "row_number": 13243, "definition": "An aboriginal American name for the sweet potato (Ipomaea batatas).", "details": []}, {"x": -0.5089964312812958, "y": 0.3191687374515354, "z": 0.7994085000652031, "word": "Bayberry", "pos_group": "noun", "row_number": 13488, "definition": "The fruit of Myrica cerifera (wax myrtle); the shrub itself; -- called also candleberry tree.", "details": []}, {"x": -0.4249217912567198, "y": 0.3869611047234197, "z": 0.818353575630003, "word": "Bay tree", "pos_group": "other", "row_number": 13505, "definition": "A species of laurel. (Laurus nobilis).", "details": []}, {"x": -0.5189072838374614, "y": 0.388392205214292, "z": 0.7615029387397056, "word": "Beak", "pos_group": "noun", "row_number": 13594, "definition": "Any process somewhat like the beak of a bird terminating the fruit or other parts of a plant.", "details": []}, {"x": -0.4644219810127157, "y": 0.3182294291205239, "z": 0.8264637039784931, "word": "Bean", "pos_group": "noun", "row_number": 13640, "definition": "A name given to the seed of certain leguminous herbs chiefly of the genera Faba Phaseolus and Dolichos; also to the herbs.", "details": []}, {"x": -0.4505811139120946, "y": 0.4204447746522993, "z": 0.7875295875415177, "word": "Bean caper", "pos_group": "other", "row_number": 13642, "definition": "A deciduous plant of warm climates generally with fleshy leaves and flowers of a yellow or whitish yellow color of the genus Zygophyllum.", "details": []}, {"x": -0.5257022913170069, "y": 0.339840241837195, "z": 0.7798369771510489, "word": "Bean trefoil", "pos_group": "other", "row_number": 13643, "definition": "A leguminous shrub of southern Europe with trifoliate leaves (Anagyris foetida).", "details": []}, {"x": -0.4285987034638722, "y": 0.3563321182839959, "z": 0.830259340729346, "word": "Bear", "pos_group": "noun", "row_number": 13675, "definition": "Any species of the genus Ursus and of the closely allied genera. Bears are plantigrade Carnivora but they live largely on fruit and insects.", "details": []}, {"x": -0.4966560926500509, "y": 0.4128540702124609, "z": 0.7634685601533231, "word": "Bearberry", "pos_group": "noun", "row_number": 13686, "definition": "A trailing plant of the heath family (Arctostaphylos uva-ursi) having leaves which are tonic and astringent and glossy red berries of which bears are said to be fond.", "details": []}, {"x": -0.4935511923577609, "y": 0.3127904235679961, "z": 0.8115228717949888, "word": "Bear's-ear", "pos_group": "noun", "row_number": 13739, "definition": "A kind of primrose (Primula auricula) so called from the shape of the leaf.", "details": []}, {"x": -0.4298268459900881, "y": 0.4038891866079876, "z": 0.8075409632999128, "word": "Bebirine", "pos_group": "noun", "row_number": 13851, "definition": "An alkaloid got from the bark of the bebeeru or green heart of Guiana (Nectandra Rodioei). It is a tonic antiperiodic and febrifuge and is used in medicine as a substitute for quinine.", "details": []}, {"x": -0.5270761488011609, "y": 0.3697156507313595, "z": 0.7651804172672115, "word": "Bedegar", "pos_group": "noun", "row_number": 13963, "definition": "A gall produced on rosebushes esp. on the sweetbrier or eglantine by a puncture from the ovipositor of a gallfly (Rhodites rosae). It was once supposed to have medicinal properties.", "details": []}, {"x": -0.4473448917375223, "y": 0.3287714674197779, "z": 0.831740265976699, "word": "Bedstraw", "pos_group": "noun", "row_number": 14041, "definition": "A genus of slender herbs usually with square stems whorled leaves and small white flowers.", "details": []}, {"x": -0.4675311932482521, "y": 0.4235464054489316, "z": 0.7759014278702898, "word": "Beet", "pos_group": "noun", "row_number": 14099, "definition": "A biennial plant of the genus Beta which produces an edible root the first year and seed the second year.", "details": []}, {"x": -0.5177112342337158, "y": 0.3246126919931238, "z": 0.791581757082097, "word": "Beet", "pos_group": "noun", "row_number": 14100, "definition": "The root of plants of the genus Beta different species and varieties of which are used for the table for feeding stock or in making sugar.", "details": []}, {"x": -0.4233112625984527, "y": 0.3756536743884567, "z": 0.8244342859656888, "word": "Beflower", "pos_group": "other", "row_number": 14133, "definition": "To besprinkle or scatter over with or as with flowers.", "details": []}, {"x": -0.512403433978551, "y": 0.3995221235315226, "z": 0.7601478761766367, "word": "Beggar's lice", "pos_group": "other", "row_number": 14206, "definition": "The prickly fruit or seed of certain plants (as some species of Echinospermum and Cynoglossum) which cling to the clothing of those who brush by them.", "details": []}, {"x": -0.4755059172231556, "y": 0.3130338704919642, "z": 0.8221337595614145, "word": "Beggar's ticks", "pos_group": "other", "row_number": 14207, "definition": "The bur marigold (Bidens) and its achenes which are armed with barbed awns and adhere to clothing and fleeces with unpleasant tenacity.", "details": []}, {"x": -0.4406019636054121, "y": 0.4168431071854022, "z": 0.7950545475997696, "word": "Begonia", "pos_group": "noun", "row_number": 14245, "definition": "A genus of plants mostly of tropical America many species of which are grown as ornamental plants. The leaves are curiously one-sided and often exhibit brilliant colors.", "details": []}, {"x": -0.5291800040392929, "y": 0.3502668014201566, "z": 0.7728400165285612, "word": "Belamour", "pos_group": "noun", "row_number": 14368, "definition": "A flower but of what kind is unknown.", "details": []}, {"x": -0.4333394625184932, "y": 0.3444427133565753, "z": 0.8328121801701411, "word": "Bell", "pos_group": "noun", "row_number": 14455, "definition": "Anything in the form of a bell as the cup or corol of a flower.", "details": []}, {"x": -0.486028437981377, "y": 0.4198437531187931, "z": 0.7664904307559935, "word": "Belladonna", "pos_group": "noun", "row_number": 14465, "definition": "An herbaceous European plant (Atropa belladonna) with reddish bell-shaped flowers and shining black berries. The whole plant and its fruit are very poisonous and the root and leaves are used as powerful medicinal agents. Its properties are largely due to the alkaloid atropine which it contains. Called also deadly nightshade.", "details": []}, {"x": -0.5043517326051475, "y": 0.3142926093468505, "z": 0.8042695353723986, "word": "Belladonna", "pos_group": "noun", "row_number": 14466, "definition": "A species of Amaryllis (A. belladonna); the belladonna lily.", "details": []}, {"x": -0.4244039974200424, "y": 0.394551467029042, "z": 0.814991034821316, "word": "Bellflower", "pos_group": "noun", "row_number": 14480, "definition": "A plant of the genus Campanula; -- so named from its bell-shaped flowers.", "details": []}, {"x": -0.5241100971417927, "y": 0.3818920384101762, "z": 0.7612273491362099, "word": "Bellflower", "pos_group": "noun", "row_number": 14481, "definition": "A kind of apple. The yellow bellflower is a large yellow winter apple.", "details": []}, {"x": -0.4570292486781547, "y": 0.32005357023005, "z": 0.8298734711000708, "word": "Bell pepper", "pos_group": "other", "row_number": 14513, "definition": "A species of Capsicum or Guinea pepper (C. annuum). It is the red pepper of the gardens.", "details": []}, {"x": -0.4560689836195064, "y": 0.4240971589024122, "z": 0.7823954767195248, "word": "Bellwort", "pos_group": "noun", "row_number": 14518, "definition": "A genus of plants (Uvularia) with yellowish bell-shaped flowers.", "details": []}, {"x": -0.5247839703536904, "y": 0.3324408131075662, "z": 0.7836356871915655, "word": "Ben nut", "pos_group": "other", "row_number": 14633, "definition": "The seed of one or more species of moringa; as oil of ben. See Moringa.", "details": []}, {"x": -0.4242304253107113, "y": 0.36343522100788, "z": 0.8294235265361397, "word": "Benne", "pos_group": "noun", "row_number": 14793, "definition": "The name of two plants (Sesamum orientale and S. indicum) originally Asiatic; -- also called oil plant. From their seeds an oil is expressed called benne oil used mostly for making soap. In the southern United States the seeds are used in candy.", "details": []}, {"x": -0.5038127180687391, "y": 0.4096053419709825, "z": 0.7605236412768664, "word": "Bennet", "pos_group": "adjective", "row_number": 14794, "definition": "The common yellow-flowered avens of Europe (Geum urbanum); herb bennet. The name is sometimes given to other plants as the hemlock valerian etc.", "details": []}, {"x": -0.4871328314291274, "y": 0.3102971349489021, "z": 0.8163438568313871, "word": "Bent", "pos_group": "noun", "row_number": 14805, "definition": "A reedlike grass; a stalk of stiff coarse grass.", "details": []}, {"x": -0.4319145891839916, "y": 0.410661967871742, "z": 0.802998465623523, "word": "Bent", "pos_group": "noun", "row_number": 14806, "definition": "A grass of the genus Agrostis esp. Agrostis vulgaris or redtop. The name is also used of many other grasses esp. in America.", "details": []}, {"x": -0.5302063812418927, "y": 0.3620345725960645, "z": 0.7666890905285934, "word": "Berberine", "pos_group": "noun", "row_number": 14878, "definition": "An alkaloid obtained as a bitter yellow substance from the root of the barberry gold thread and other plants.", "details": []}, {"x": -0.4404029008759469, "y": 0.3331608958082708, "z": 0.8336960491715678, "word": "Bergamot", "pos_group": "noun", "row_number": 14895, "definition": "A variety of mint (Mentha aquatica var. glabrata).", "details": []}, {"x": -0.4744311255655378, "y": 0.4245913649708565, "z": 0.7711272786556068, "word": "Bermuda grass", "pos_group": "other", "row_number": 14919, "definition": "A kind of grass (Cynodon Dactylon) esteemed for pasture in the Southern United States. It is a native of Southern Europe but is now wide-spread in warm countries; -- called also scutch grass and in Bermuda devil grass.", "details": []}, {"x": -0.5142539136836818, "y": 0.3184948469717661, "z": 0.7963064389501368, "word": "Betel", "pos_group": "noun", "row_number": 15199, "definition": "A species of pepper (Piper betle) the leaves of which are chewed with the areca or betel nut and a little shell lime by the inhabitants of the East Indies. It is a woody climber with ovate many-nerved leaves.", "details": []}, {"x": -0.4212797880309098, "y": 0.3834771251056131, "z": 0.8218689887794561, "word": "Betony", "pos_group": "noun", "row_number": 15240, "definition": "A plant of the genus Betonica (Linn.).", "details": []}, {"x": -0.518652188925435, "y": 0.3939236814782864, "z": 0.7588307058187935, "word": "Bicarinate", "pos_group": "adjective", "row_number": 15530, "definition": "Having two keel-like projections as the upper palea of grasses.", "details": []}, {"x": -0.4680862754004839, "y": 0.3132911613860558, "z": 0.8262831760232557, "word": "Biennial", "pos_group": "noun", "row_number": 15635, "definition": "A plant which exists or lasts for two years.", "details": []}, {"x": -0.4450799397572676, "y": 0.4219066875917188, "z": 0.7898725176831075, "word": "Biflorous", "pos_group": "adjective", "row_number": 15655, "definition": "Bearing two flowers; two-flowered.", "details": []}, {"x": -0.5297815681455703, "y": 0.3423538847877405, "z": 0.7759673366991441, "word": "Bifoliolate", "pos_group": "adjective", "row_number": 15658, "definition": "Having two leaflets as some compound leaves.", "details": []}, {"x": -0.4277380909638716, "y": 0.3508886235980465, "z": 0.833016986242208, "word": "Biforine", "pos_group": "noun", "row_number": 15660, "definition": "An oval sac or cell found in the leaves of certain plants of the order Araceae. It has an opening at each end through which raphides generated inside are discharged.", "details": []}, {"x": -0.4934825141673995, "y": 0.4180818329149021, "z": 0.7626811845047299, "word": "Bigeminate", "pos_group": "adjective", "row_number": 15687, "definition": "Having a forked petiole and a pair of leaflets at the end of each division; biconjugate; twice paired; -- said of a decompound leaf.", "details": []}, {"x": -0.4987312376446277, "y": 0.3102611697205292, "z": 0.8093238901460321, "word": "Biglandular", "pos_group": "adjective", "row_number": 15705, "definition": "Having two glands as a plant.", "details": []}, {"x": -0.4250139335565768, "y": 0.4021058003679582, "z": 0.8109710732160608, "word": "Bignonia", "pos_group": "noun", "row_number": 15708, "definition": "A large genus of American mostly tropical climbing shrubs having compound leaves and showy somewhat tubular flowers. B. capreolata is the cross vine of the Southern United States. The trumpet creeper was formerly considered to be of this genus.", "details": []}, {"x": -0.5286240740413899, "y": 0.374599366512625, "z": 0.761729547117757, "word": "Bignoniaceous", "pos_group": "adjective", "row_number": 15709, "definition": "Of pertaining to or resembling the family of plants of which the trumpet flower is an example.", "details": []}, {"x": -0.4495250072153885, "y": 0.3230846285088487, "z": 0.8327926456863701, "word": "Bikh", "pos_group": "noun", "row_number": 15726, "definition": "The East Indian name of a virulent poison extracted from Aconitum ferox or other species of aconite: also the plant itself.", "details": []}, {"x": -0.4624114247900914, "y": 0.4267601856418657, "z": 0.7772074486097761, "word": "Bilabiate", "pos_group": "adjective", "row_number": 15727, "definition": "Having two lips as the corols of certain flowers.", "details": []}, {"x": -0.5227149370017262, "y": 0.3252945062266505, "z": 0.788005443416504, "word": "Bilamellated", "pos_group": "adjective", "row_number": 15731, "definition": "Formed of two plates as the stigma of the Mimulus; also having two elevated ridges as in the lip of certain flowers.", "details": []}, {"x": -0.4207064660417706, "y": 0.3711551364378088, "z": 0.8277982448196397, "word": "Bilberry", "pos_group": "noun", "row_number": 15741, "definition": "Any similar plant or its fruit; esp. in America the species Vaccinium myrtilloides V. caespitosum and V. uliginosum.", "details": []}, {"x": -0.5108743814796447, "y": 0.4051920063134777, "z": 0.7581733339860016, "word": "Bind", "pos_group": "noun", "row_number": 15920, "definition": "Any twining or climbing plant or stem esp. a hop vine; a bine.", "details": []}, {"x": -0.480009388917199, "y": 0.3089067359226974, "z": 0.8210771066428062, "word": "Bindweed", "pos_group": "noun", "row_number": 15933, "definition": "A plant of the genus Convolvulus; as greater bindweed (C. Sepium); lesser bindweed (C. arvensis); the white the blue the Syrian bindweed. The black bryony or Tamus is called black bindweed and the Smilax aspera rough bindweed.", "details": []}, {"x": -0.4351391207580302, "y": 0.416971713662152, "z": 0.7979903104622116, "word": "Bine", "pos_group": "noun", "row_number": 15934, "definition": "The winding or twining stem of a hop vine or other climbing plant.", "details": []}, {"x": -0.5323633793791841, "y": 0.3539332117636273, "z": 0.7689736756916054, "word": "Binomial", "pos_group": "adjective", "row_number": 15951, "definition": "Having two names; -- used of the system by which every animal and plant receives two names the one indicating the genus the other the species to which it belongs.", "details": []}, {"x": -0.4337604039442807, "y": 0.338634935632185, "z": 0.8349720308725798, "word": "Binturong", "pos_group": "noun", "row_number": 15958, "definition": "A small Asiatic civet of the genus Arctilis.", "details": []}, {"x": -0.4818632750885241, "y": 0.4244549752050399, "z": 0.766580562070713, "word": "Bipetalous", "pos_group": "adjective", "row_number": 16022, "definition": "Having two petals.", "details": []}, {"x": -0.5097105444421789, "y": 0.3130361512034424, "z": 0.8013760221794718, "word": "Bird cherry", "pos_group": "other", "row_number": 16069, "definition": "A shrub (Prunus Padus ) found in Northern and Central Europe. It bears small black cherries.", "details": []}, {"x": -0.4203198438753587, "y": 0.3915098756916735, "z": 0.8185665801145833, "word": "Bird pepper", "pos_group": "other", "row_number": 16084, "definition": "A species of capsicum (Capsicum baccatum) whose small conical coral-red fruit is among the most piquant of all red peppers.", "details": []}, {"x": -0.5244056402307681, "y": 0.3873560554842948, "z": 0.758257219401046, "word": "Bird's-eye", "pos_group": "noun", "row_number": 16089, "definition": "A plant with a small bright flower as the Adonis or pheasant's eye the mealy primrose (Primula farinosa) and species of Veronica Geranium etc.", "details": []}, {"x": -0.4603254031907143, "y": 0.3147706752777803, "z": 0.8300722529770984, "word": "Bird's-foot", "pos_group": "noun", "row_number": 16091, "definition": "A papilionaceous plant the Ornithopus having a curved cylindrical pod tipped with a short clawlike point.", "details": []}, {"x": -0.4505580842615722, "y": 0.4261353203812241, "z": 0.7844782351538718, "word": "Bird's-nest", "pos_group": "noun", "row_number": 16096, "definition": "An orchideous plant with matted roots of the genus Neottia (N. nidus-avis.)", "details": []}, {"x": -0.5292474165345759, "y": 0.3344505456123704, "z": 0.7797691995911772, "word": "Bird's-tongue", "pos_group": "noun", "row_number": 16098, "definition": "The knotgrass (Polygonum aviculare).", "details": []}, {"x": -0.4228129866375289, "y": 0.3581565691124269, "z": 0.8324380159100544, "word": "Birthroot", "pos_group": "noun", "row_number": 16139, "definition": "An herbaceous plant (Trillium erectum) and its astringent rootstock which is said to have medicinal properties.", "details": []}, {"x": -0.501074968183575, "y": 0.4150960342851291, "z": 0.759354435412468, "word": "Birthwort", "pos_group": "noun", "row_number": 16140, "definition": "A genus of herbs and shrubs (Aristolochia) reputed to have medicinal properties.", "details": []}, {"x": -0.4922291938679985, "y": 0.30721458382945, "z": 0.8144505019868046, "word": "Bisexual", "pos_group": "adjective", "row_number": 16171, "definition": "Of both sexes; hermaphrodite; as a flower with stamens and pistil or an animal having ovaries and testes.", "details": []}, {"x": -0.4267876520614265, "y": 0.409430932908943, "z": 0.8063613403587795, "word": "Bishop's cap", "pos_group": "other", "row_number": 16191, "definition": "A plant of the genus Mitella; miterwort.", "details": []}, {"x": -0.5323017430104269, "y": 0.3666591021667136, "z": 0.7630307707991604, "word": "Bishop's-weed", "pos_group": "noun", "row_number": 16195, "definition": "An umbelliferous plant of the genus Ammi.", "details": []}, {"x": -0.442090850733367, "y": 0.3273019317781894, "z": 0.8351222216850138, "word": "Bishop's-weed", "pos_group": "noun", "row_number": 16196, "definition": "Goutweed (Aegopodium podagraria).", "details": []}, {"x": -0.4694879192711665, "y": 0.428319427082372, "z": 0.7720903846326927, "word": "Bishop's-wort", "pos_group": "noun", "row_number": 16197, "definition": "Wood betony (Stachys betonica); also the plant called fennel flower (Nigella Damascena) or devil-in-a-bush.", "details": []}, {"x": -0.5194914379112635, "y": 0.3185908823042238, "z": 0.792860956063233, "word": "Bistort", "pos_group": "noun", "row_number": 16228, "definition": "An herbaceous plant of the genus Polygonum section Bistorta; snakeweed; adderwort. Its root is used in medicine as an astringent.", "details": []}, {"x": -0.4181529064797895, "y": 0.3793265375427121, "z": 0.8253844708488051, "word": "Biternate", "pos_group": "adjective", "row_number": 16281, "definition": "Doubly ternate as when a petiole has three ternate leaflets.", "details": []}, {"x": -0.5176587510044255, "y": 0.3996684745339812, "z": 0.7565015055981175, "word": "Bitterroot", "pos_group": "noun", "row_number": 16314, "definition": "A plant (Lewisia rediviva) allied to the purslane but with fleshy farinaceous roots growing in the mountains of Idaho Montana etc. It gives the name to the Bitter Root mountains and river. The Indians call both the plant and the river Spaet'lum.", "details": []}, {"x": -0.4723238672428016, "y": 0.3087042805715284, "z": 0.8255978631207928, "word": "Bittersweet", "pos_group": "noun", "row_number": 16320, "definition": "A climbing shrub with oval coral-red berries (Solanum dulcamara); woody nightshade. The whole plant is poisonous and has a taste at first sweetish and then bitter. The branches are the officinal dulcamara.", "details": []}, {"x": -0.4394717491347332, "y": 0.4226384660856784, "z": 0.7926167476764563, "word": "Blackberry", "pos_group": "noun", "row_number": 16402, "definition": "The fruit of several species of bramble (Rubus); also the plant itself. Rubus fruticosus is the blackberry of England; R. villosus and R. Canadensis are the high blackberry and low blackberry of the United States. There are also other kinds.", "details": []}, {"x": -0.5334464557164861, "y": 0.3455921032579625, "z": 0.7720109954199206, "word": "Bladderwort", "pos_group": "noun", "row_number": 16519, "definition": "A genus (Utricularia) of aquatic or marshy plants which usually bear numerous vesicles in the divisions of the leaves. These serve as traps for minute animals. See Ascidium.", "details": []}, {"x": -0.4275947092983683, "y": 0.3451071254340899, "z": 0.8355021463495252, "word": "Blade", "pos_group": "noun", "row_number": 16521, "definition": "Properly the leaf or flat part of the leaf of any plant especially of gramineous plants. The term is sometimes applied to the spire of grasses.", "details": []}, {"x": -0.4896666534369076, "y": 0.4230842710871613, "z": 0.7623819699275058, "word": "Blanch", "pos_group": "adjective", "row_number": 16566, "definition": "Fig.: To whiten; to give a favorable appearance to; to whitewash; to palliate.", "details": []}, {"x": -0.5041413873391467, "y": 0.3084012624682778, "z": 0.8066784507346982, "word": "Blastocarpous", "pos_group": "adjective", "row_number": 16676, "definition": "Germinating inside the pericarp as the mangrove.", "details": []}, {"x": -0.4205035166308043, "y": 0.3995618742159732, "z": 0.8145717286857834, "word": "Blight", "pos_group": "noun", "row_number": 16883, "definition": "Mildew; decay; anything nipping or blasting; -- applied as a general name to various injuries or diseases of plants causing the whole or a part to wither whether occasioned by insects fungi or atmospheric influences.", "details": []}, {"x": -0.5294971126664847, "y": 0.379935056828462, "z": 0.7584735725591296, "word": "Blite", "pos_group": "noun", "row_number": 16965, "definition": "A genus of herbs (Blitum) with a fleshy calyx. Blitum capitatum is the strawberry blite.", "details": []}, {"x": -0.4523972047355305, "y": 0.3174915802543896, "z": 0.8333881842305235, "word": "Bloodflower", "pos_group": "noun", "row_number": 17058, "definition": "A genus of bulbous plants natives of Southern Africa named Haemanthus of the Amaryllis family. The juice of H. toxicarius is used by the Hottentots to poison their arrows.", "details": []}, {"x": -0.456946437982696, "y": 0.4293848695702484, "z": 0.7789920324361905, "word": "Bloodroot", "pos_group": "noun", "row_number": 17072, "definition": "A plant (Sanguinaria Canadensis) with a red root and red sap and bearing a pretty white flower in early spring; -- called also puccoon redroot bloodwort tetterwort turmeric and Indian paint. It has acrid emetic properties and the rootstock is used as a stimulant expectorant. See Sanguinaria.", "details": []}, {"x": -0.5275363741998893, "y": 0.3267503548378195, "z": 0.7841808334238941, "word": "Bloodwort", "pos_group": "noun", "row_number": 17091, "definition": "A plant Rumex sanguineus or bloody-veined dock. The name is applied also to bloodroot (Sanguinaria Canadensis) and to an extensive order of plants (Haemodoraceae) the roots of many species of which contain a red coloring matter useful in dyeing.", "details": []}, {"x": -0.4187149099407741, "y": 0.3661050169760746, "z": 0.8310505043246394, "word": "Bloom", "pos_group": "noun", "row_number": 17106, "definition": "A blossom; the flower of a plant; an expanded bud; flowers collectively.", "details": []}, {"x": -0.5086244634721981, "y": 0.4109016313372892, "z": 0.7566115281450404, "word": "Bloom", "pos_group": "noun", "row_number": 17107, "definition": "The opening of flowers in general; the state of blossoming or of having the flowers open; as the cherry trees are in bloom.", "details": []}, {"x": -0.4849624495248498, "y": 0.3052718840032192, "z": 0.8195245569157659, "word": "Bloom", "pos_group": "other", "row_number": 17115, "definition": "To produce or yield blossoms; to blossom; to flower or be in flower.", "details": []}, {"x": -0.4297340768420898, "y": 0.4163358911419771, "z": 0.8012446873132406, "word": "Blooming", "pos_group": "adjective", "row_number": 17126, "definition": "Opening in blossoms; flowering.", "details": []}, {"x": -0.5350130454790833, "y": 0.3582340563412555, "z": 0.7651335844442372, "word": "Bloomingness", "pos_group": "noun", "row_number": 17129, "definition": "A blooming condition.", "details": []}, {"x": -0.4349098231731647, "y": 0.332656202972488, "z": 0.8367755352132453, "word": "Bloomless", "pos_group": "adjective", "row_number": 17130, "definition": "Without bloom or flowers.", "details": []}, {"x": -0.4771583900121774, "y": 0.4286847513366743, "z": 0.7671696388755228, "word": "Bloomy", "pos_group": "adjective", "row_number": 17132, "definition": "Covered with bloom as fruit.", "details": []}, {"x": -0.5151371250837613, "y": 0.3125122743200922, "z": 0.7981038909563847, "word": "Blossom", "pos_group": "noun", "row_number": 17136, "definition": "The flower of a plant or the essential organs of reproduction with their appendages; florescence; bloom; the flowers of a plant collectively; as the blossoms and fruit of a tree; an apple tree in blossom.", "details": []}, {"x": -0.4166749620755539, "y": 0.3877704556952792, "z": 0.8222019518763085, "word": "Blossomless", "pos_group": "adjective", "row_number": 17143, "definition": "Without blossoms.", "details": []}, {"x": -0.523986862135503, "y": 0.3931165148412294, "z": 0.7555773779491249, "word": "Blossomy", "pos_group": "adjective", "row_number": 17144, "definition": "Full of blossoms; flowery.", "details": []}, {"x": -0.4642351742921172, "y": 0.3097481090653384, "z": 0.8297841959692982, "word": "Blow", "pos_group": "other", "row_number": 17177, "definition": "To cause to blossom; to put forth (blossoms or flowers).", "details": []}, {"x": -0.4448569479732771, "y": 0.4274943120671276, "z": 0.7869885062630548, "word": "Blow", "pos_group": "noun", "row_number": 17178, "definition": "A blossom; a flower; also a state of blossoming; a mass of blossoms.", "details": []}, {"x": -0.533378601927531, "y": 0.3372007359196398, "z": 0.7757595830546252, "word": "Blowball", "pos_group": "noun", "row_number": 17204, "definition": "The downy seed head of a dandelion which children delight to blow away.", "details": []}, {"x": -0.4220750350491405, "y": 0.3524657442530345, "z": 0.8352368310344206, "word": "Blown", "pos_group": "other", "row_number": 17223, "definition": "Opened; in blossom or having blossomed as a flower.", "details": []}, {"x": -0.4976685201194978, "y": 0.4204545972800905, "z": 0.758646146571711, "word": "Blowth", "pos_group": "noun", "row_number": 17232, "definition": "A blossoming; a bloom.", "details": []}, {"x": -0.4976321351978313, "y": 0.3047383403118786, "z": 0.812094084427666, "word": "Bluebell", "pos_group": "noun", "row_number": 17272, "definition": "A plant of the genus Campanula especially the Campanula rotundifolia which bears blue bell-shaped flowers; the harebell.", "details": []}, {"x": -0.4218771276329018, "y": 0.4074390894430424, "z": 0.8099463424042588, "word": "Bluebell", "pos_group": "noun", "row_number": 17273, "definition": "A plant of the genus Scilla (Scilla nutans).", "details": []}, {"x": -0.5337725028738327, "y": 0.3717988721737496, "z": 0.7595080735753452, "word": "Blueberry", "pos_group": "noun", "row_number": 17274, "definition": "The berry of several species of Vaccinium an ericaceous genus differing from the American huckleberries in containing numerous minute seeds instead of ten nutlets. The commonest species are V. Pennsylvanicum and V. vacillans. V. corymbosum is the tall blueberry.", "details": []}, {"x": -0.4444828105979088, "y": 0.3214440129126306, "z": 0.836127249672924, "word": "Blue-bonnet", "pos_group": "noun", "row_number": 17279, "definition": "A plant. Same as Bluebottle.", "details": []}, {"x": -0.464131803477108, "y": 0.4315316482332939, "z": 0.7735386904183551, "word": "Bluebottle", "pos_group": "noun", "row_number": 17283, "definition": "A plant (Centaurea cyanus) which grows in grain fields. It receives its name from its blue bottle-shaped flowers.", "details": []}, {"x": -0.5246343227002352, "y": 0.3194457551999741, "z": 0.7891218137458776, "word": "Blue-eyed grass", "pos_group": "other", "row_number": 17292, "definition": "a grasslike plant (Sisyrinchium anceps) with small flowers of a delicate blue color.", "details": []}, {"x": -0.4155779489050878, "y": 0.3745736422465595, "z": 0.8288483304670323, "word": "Blue grass", "pos_group": "other", "row_number": 17297, "definition": "A species of grass (Poa compressa) with bluish green stems valuable in thin gravelly soils; wire grass.", "details": []}, {"x": -0.5159471954748104, "y": 0.4055427526126921, "z": 0.7545419585980613, "word": "Bluets", "pos_group": "adjective", "row_number": 17311, "definition": "A name given to several different species of plants having blue flowers as the Houstonia coerulea the Centaurea cyanus or bluebottle and the Vaccinium angustifolium.", "details": []}, {"x": -0.4770681726301906, "y": 0.3045283293734414, "z": 0.8244200720945066, "word": "Blush", "pos_group": "other", "row_number": 17385, "definition": "To have a warm and delicate color as some roses and other flowers.", "details": []}, {"x": -0.4338346206509811, "y": 0.422635911917858, "z": 0.7957175427763171, "word": "Bogberry", "pos_group": "noun", "row_number": 17626, "definition": "The small cranberry (Vaccinium oxycoccus) which grows in boggy places.", "details": []}, {"x": -0.5366481861988813, "y": 0.3495016589498698, "z": 0.7680216889129756, "word": "bolete", "pos_group": "noun", "row_number": 17723, "definition": "any fungus of the family Boletaceae.", "details": []}, {"x": -0.4281625926157988, "y": 0.3390703832896845, "z": 0.8376801713424427, "word": "Boletus", "pos_group": "noun", "row_number": 17725, "definition": "A genus of fungi having the under side of the pileus or cap composed of a multitude of fine separate tubes. A few are edible and others very poisonous.", "details": []}, {"x": -0.4852659947358863, "y": 0.4277923922423797, "z": 0.7625684123359245, "word": "Boll", "pos_group": "noun", "row_number": 17732, "definition": "The pod or capsule of a plant as of flax or cotton; a pericarp of a globular form.", "details": []}, {"x": -0.5097027631984471, "y": 0.3072299061485044, "z": 0.8036248365722957, "word": "Boneset", "pos_group": "noun", "row_number": 17940, "definition": "A medicinal plant the thoroughwort (Eupatorium perfoliatum). Its properties are diaphoretic and tonic.", "details": []}, {"x": -0.4163546164774423, "y": 0.3962979378535551, "z": 0.8182889329515227, "word": "Bon Silene", "pos_group": "other", "row_number": 17992, "definition": "A very fragrant tea rose with petals of various shades of pink.", "details": []}, {"x": -0.5296869051347199, "y": 0.3856437399609482, "z": 0.7554539617724793, "word": "Borage", "pos_group": "noun", "row_number": 18179, "definition": "A mucilaginous plant of the genus Borago (B. officinalis) which is used esp. in France as a demulcent and diaphoretic.", "details": []}, {"x": -0.4559149015972141, "y": 0.3120684173600384, "z": 0.8335195890847458, "word": "Boragewort", "pos_group": "noun", "row_number": 18180, "definition": "Plant of the Borage family.", "details": []}, {"x": -0.4512133195018328, "y": 0.4313870101834826, "z": 0.7812245437446858, "word": "Boraginaceous", "pos_group": "adjective", "row_number": 18181, "definition": "Of pertaining to or resembling a family of plants (Boraginaceae) which includes the borage heliotrope beggar's lice and many pestiferous plants.", "details": []}, {"x": -0.5321082936619925, "y": 0.3289536300306525, "z": 0.7801604149825724, "word": "Border", "pos_group": "noun", "row_number": 18201, "definition": "A narrow flower bed.", "details": []}, {"x": -0.4173588793776739, "y": 0.3605759701876692, "z": 0.8341441934868535, "word": "Borecole", "pos_group": "noun", "row_number": 18239, "definition": "A brassicaceous plant of many varieties cultivated for its leaves which are not formed into a compact head like the cabbage but are loose and are generally curled or wrinkled; kale.", "details": []}, {"x": -0.505687933923268, "y": 0.4165703498384532, "z": 0.7554792234865795, "word": "Botanical", "pos_group": "adjective", "row_number": 18358, "definition": "Of or pertaining to botany; relating to the study of plants; as a botanical system arrangement textbook expedition.", "details": []}, {"x": -0.4902923048647742, "y": 0.3021757890156686, "z": 0.8174981641099541, "word": "Botanist", "pos_group": "noun", "row_number": 18359, "definition": "One skilled in botany; one versed in the knowledge of plants.", "details": []}, {"x": -0.4244600501368085, "y": 0.414947576768883, "z": 0.8047683979701801, "word": "Botanize", "pos_group": "other", "row_number": 18362, "definition": "To seek after plants for botanical investigation; to study plants.", "details": []}, {"x": -0.5370936362914736, "y": 0.3631053226635801, "z": 0.7613704423659875, "word": "Botanize", "pos_group": "other", "row_number": 18363, "definition": "To explore for botanical purposes.", "details": []}, {"x": -0.4367668063567825, "y": 0.3265890528496237, "z": 0.8381970814931788, "word": "Botanologer", "pos_group": "noun", "row_number": 18365, "definition": "A botanist.", "details": []}, {"x": -0.4719799509965872, "y": 0.432475201197007, "z": 0.7682448348065006, "word": "Botanology", "pos_group": "noun", "row_number": 18366, "definition": "The science of botany.", "details": []}, {"x": -0.5205547203329065, "y": 0.3127239785388668, "z": 0.7944976377472446, "word": "Botanomancy", "pos_group": "noun", "row_number": 18367, "definition": "An ancient species of divination by means of plants esp. sage and fig leaves.", "details": []}, {"x": -0.4135165420051799, "y": 0.3833865686005691, "z": 0.825844300400965, "word": "Botanies", "pos_group": "other", "row_number": 18368, "definition": "of Botany", "details": []}, {"x": -0.522860765977704, "y": 0.3990916854705001, "z": 0.7532213791373183, "word": "Botany", "pos_group": "other", "row_number": 18369, "definition": "The science which treats of the structure of plants the functions of their parts their places of growth their classification and the terms which are employed in their description and denomination. See Plant.", "details": []}, {"x": -0.4687011127034028, "y": 0.3050531875488885, "z": 0.8290125570320721, "word": "Botany", "pos_group": "other", "row_number": 18370, "definition": "A book which treats of the science of botany.", "details": []}, {"x": -0.4390433477346996, "y": 0.4281564139198437, "z": 0.7898879819501035, "word": "Botryose", "pos_group": "adjective", "row_number": 18419, "definition": "Of the racemose or acropetal type of inflorescence.", "details": []}, {"x": -0.5371201351945153, "y": 0.340650317303192, "z": 0.7716601076185424, "word": "Bougainvillaea", "pos_group": "noun", "row_number": 18478, "definition": "A genus of plants of the order Nyctoginaceae from tropical South America having the flowers surrounded by large bracts.", "details": []}, {"x": -0.42202359489869, "y": 0.3464410311158342, "z": 0.8377796233546052, "word": "Bouquet", "pos_group": "noun", "row_number": 18576, "definition": "A nosegay; a bunch of flowers.", "details": []}, {"x": -0.4936403135353035, "y": 0.4256065306942934, "z": 0.7584051172580093, "word": "Boxberry", "pos_group": "noun", "row_number": 18776, "definition": "The wintergreen. (Gaultheria procumbens).", "details": []}, {"x": -0.5032653855474281, "y": 0.3029001573675779, "z": 0.8093055333905084, "word": "Boxthorn", "pos_group": "noun", "row_number": 18791, "definition": "A plant of the genus Lycium esp. Lycium barbarum.", "details": []}, {"x": -0.4172486757457341, "y": 0.4047139770586325, "z": 0.8137015050753045, "word": "Bract", "pos_group": "noun", "row_number": 18903, "definition": "A leaf usually smaller than the true leaves of a plant from the axil of which a flower stalk arises.", "details": []}, {"x": -0.5345979425523442, "y": 0.3773815450158382, "z": 0.7561667866947472, "word": "Bract", "pos_group": "noun", "row_number": 18904, "definition": "Any modified leaf or scale on a flower stalk or at the base of a flower.", "details": []}, {"x": -0.4475437848986454, "y": 0.3156663657063535, "z": 0.8366954679931867, "word": "Bractlet", "pos_group": "noun", "row_number": 18912, "definition": "A bract on the stalk of a single flower which is itself on a main stalk that support several flowers.", "details": []}, {"x": -0.4584350970762124, "y": 0.4341833713897277, "z": 0.775449586870335, "word": "Brake", "pos_group": "noun", "row_number": 18995, "definition": "A fern of the genus Pteris esp. the P. aquilina common in almost all countries. It has solitary stems dividing into three principal branches. Less properly: Any fern.", "details": []}, {"x": -0.5296108164132906, "y": 0.3210462394562912, "z": 0.785138010332592, "word": "Bramble", "pos_group": "noun", "row_number": 19015, "definition": "Any plant of the genus Rubus including the raspberry and blackberry. Hence: Any rough prickly shrub.", "details": []}, {"x": -0.4135885589509107, "y": 0.3692825444962674, "z": 0.8322108544324998, "word": "Brand", "pos_group": "other", "row_number": 19072, "definition": "Any minute fungus which produces a burnt appearance in plants. The brands are of many species and several genera of the order Pucciniaei.", "details": []}, {"x": -0.5135395351624508, "y": 0.4114651465265455, "z": 0.7529764797249793, "word": "Brand spore", "pos_group": "other", "row_number": 19097, "definition": "One of several spores growing in a series or chain and produced by one of the fungi called brand.", "details": []}, {"x": -0.4822531199408014, "y": 0.3008193388711624, "z": 0.8227634250916116, "word": "Brassica", "pos_group": "noun", "row_number": 19147, "definition": "A genus of plants embracing several species and varieties differing much in appearance and qualities: such as the common cabbage (B. oleracea) broccoli cauliflowers etc.; the wild turnip (B. campestris); the common turnip (B. rapa); the rape or coleseed (B. napus) etc.", "details": []}, {"x": -0.4282440478628054, "y": 0.4218976160386004, "z": 0.7991304255570708, "word": "Brassicaceous", "pos_group": "adjective", "row_number": 19148, "definition": "Related to or resembling the cabbage or plants of the Cabbage family.", "details": []}, {"x": -0.539341363286387, "y": 0.354028678292168, "z": 0.7640514307264153, "word": "Breadroot", "pos_group": "noun", "row_number": 19272, "definition": "The root of a leguminous plant (Psoralea esculenta) found near the Rocky Mountains. It is usually oval in form and abounds in farinaceous matter affording sweet and palatable food.", "details": []}, {"x": -0.4294333246963264, "y": 0.3328592822699406, "z": 0.8395187418080666, "word": "Breathe", "pos_group": "other", "row_number": 19405, "definition": "To exhale; to emit as breath; as the flowers breathe odors or perfumes.", "details": []}, {"x": -0.4803382871383235, "y": 0.4321406683166555, "z": 0.7632362495950095, "word": "Briar", "pos_group": "noun", "row_number": 19696, "definition": "A plant with a slender woody stem bearing stout prickles; especially species of Rosa Rubus and Smilax.", "details": []}, {"x": -0.5153385754067962, "y": 0.3067629972236527, "z": 0.8002016097409796, "word": "Bristle-shaped", "pos_group": "adjective", "row_number": 19821, "definition": "Resembling a bristle in form; as a bristle-shaped leaf.", "details": []}, {"x": -0.4126228459605968, "y": 0.3923559782879904, "z": 0.8220700537624829, "word": "Broccoli", "pos_group": "noun", "row_number": 19929, "definition": "A plant of the Cabbage species (Brassica oleracea) of many varieties resembling the cauliflower. The \"\"\"\"curd \" or flowering head is the part used for food.", "details": []}, {"x": -0.5291880950890533, "y": 0.3916476007355377, "z": 0.752709849048168, "word": "Brome grass", "pos_group": "other", "row_number": 20005, "definition": "A genus (Bromus) of grasses one species of which is the chess or cheat.", "details": []}, {"x": -0.4600304616754113, "y": 0.3068880031518187, "z": 0.8331816895804883, "word": "Bromeliaceous", "pos_group": "adjective", "row_number": 20006, "definition": "Pertaining to or resembling a family of endogenous and mostly epiphytic or saxicolous plants of which the genera Tillandsia and Billbergia are examples. The pineapple though terrestrial is also of this family.", "details": []}, {"x": -0.4452876909637472, "y": 0.4327368300684719, "z": 0.7838735281781526, "word": "Brooklime", "pos_group": "noun", "row_number": 20082, "definition": "A plant (Veronica Beccabunga) with flowers usually blue in axillary racemes. The American species is V. Americana.", "details": []}, {"x": -0.5363667117363907, "y": 0.3318754927753499, "z": 0.7759957524601602, "word": "Brookweed", "pos_group": "noun", "row_number": 20085, "definition": "A small white-flowered herb (Samolus Valerandi) found usually in wet places; water pimpernel.", "details": []}, {"x": -0.4166572397876152, "y": 0.3546402763839992, "z": 0.837034658122856, "word": "Broom corn", "pos_group": "other", "row_number": 20089, "definition": "A variety of Sorghum vulgare having a joined stem like maize rising to the height of eight or ten feet and bearing its seeds on a panicle with long branches of which brooms are made.", "details": []}, {"x": -0.5021008623596175, "y": 0.42212033748324, "z": 0.7547907953206398, "word": "Broom rape", "pos_group": "other", "row_number": 20090, "definition": "A genus (Orobanche) of parasitic plants of Europe and Asia. They are destitute of chlorophyll have scales instead of leaves and spiked flowers and grow attached to the roots of other plants as furze clover flax wild carrot etc. The name is sometimes applied to other plants related to this genus as Aphyllon uniflorumand A. Ludovicianum.", "details": []}, {"x": -0.4959269059680173, "y": 0.299661067664883, "z": 0.8150213177966155, "word": "Brownwort", "pos_group": "noun", "row_number": 20157, "definition": "A species of figwort or Scrophularia (S. vernalis) and other species of the same genus mostly perennials with inconspicuous coarse flowers.", "details": []}, {"x": -0.4193873000084335, "y": 0.4128216279189792, "z": 0.8085125825328635, "word": "Brucine", "pos_group": "noun", "row_number": 20172, "definition": "A powerful vegetable alkaloid found associated with strychnine in the seeds of different species of Strychnos especially in the Nux vomica. It is less powerful than strychnine. Called also brucia and brucina.", "details": []}, {"x": -0.5385734659229392, "y": 0.3684825323705236, "z": 0.757732964270104, "word": "Bruisewort", "pos_group": "noun", "row_number": 20187, "definition": "A plant supposed to heal bruises as the true daisy the soapwort and the comfrey.", "details": []}, {"x": -0.4393079244469844, "y": 0.3205137598425526, "z": 0.8392136064612354, "word": "Bryology", "pos_group": "noun", "row_number": 20276, "definition": "That part of botany which relates to mosses.", "details": []}, {"x": -0.4663941635790936, "y": 0.435772307273183, "z": 0.769791517485848, "word": "Bryony", "pos_group": "noun", "row_number": 20278, "definition": "The common name of several cucurbitaceous plants of the genus Bryonia. The root of B. alba (rough or white bryony) and of B. dioica is a strong irritating cathartic.", "details": []}, {"x": -0.5258890699005857, "y": 0.3136707717341592, "z": 0.7906018802904492, "word": "Buck bean", "pos_group": "other", "row_number": 20346, "definition": "A plant (Menyanthes trifoliata) which grows in moist and boggy places having racemes of white or reddish flowers and intensely bitter leaves sometimes used in medicine; marsh trefoil; -- called also bog bean.", "details": []}, {"x": -0.4108880013492257, "y": 0.3784128896317595, "z": 0.8294424243476943, "word": "Buckram", "pos_group": "noun", "row_number": 20390, "definition": "A plant. See Ramson.", "details": []}, {"x": -0.5210374746482512, "y": 0.405201408775265, "z": 0.7512201863227009, "word": "Buck's-horn", "pos_group": "noun", "row_number": 20394, "definition": "A plant with leaves branched somewhat like a buck's horn (Plantago Coronopus); also Lobelia coronopifolia.", "details": []}, {"x": -0.4736649225851897, "y": 0.3007495421719018, "z": 0.8277628005629135, "word": "Buckwheat", "pos_group": "noun", "row_number": 20403, "definition": "A plant (Fagopyrum esculentum) of the Polygonum family the seed of which is used for food.", "details": []}, {"x": -0.4331931622603227, "y": 0.4281078256663542, "z": 0.7931376764308502, "word": "Bud", "pos_group": "noun", "row_number": 20410, "definition": "A small protuberance on the stem or branches of a plant containing the rudiments of future leaves flowers or stems; an undeveloped branch or flower.", "details": []}, {"x": -0.5404183161509697, "y": 0.3447560922191484, "z": 0.7675228207984, "word": "Bud", "pos_group": "other", "row_number": 20414, "definition": "To put forth or produce buds as a plant; to grow as a bud does into a flower or shoot.", "details": []}, {"x": -0.422662089213385, "y": 0.3401599306366178, "z": 0.8400285589972927, "word": "Bugbane", "pos_group": "noun", "row_number": 20514, "definition": "A perennial white-flowered herb of the order Ranunculaceae and genus Cimiciguga; bugwort. There are several species.", "details": []}, {"x": -0.4890389342174873, "y": 0.4304806640466073, "z": 0.7586351683789886, "word": "Bugle", "pos_group": "noun", "row_number": 20532, "definition": "A plant of the genus Ajuga of the Mint family a native of the Old World.", "details": []}, {"x": -0.5090538612327465, "y": 0.3017276044456699, "z": 0.8061170008624735, "word": "Bugleweed", "pos_group": "noun", "row_number": 20537, "definition": "A plant of the Mint family and genus Lycopus; esp. L. Virginicus which has mild narcotic and astringent properties and is sometimes used as a remedy for hemorrhage.", "details": []}, {"x": -0.412964517003098, "y": 0.4012860158672107, "z": 0.8175755874326351, "word": "Bugloss", "pos_group": "noun", "row_number": 20539, "definition": "A plant of the genus Anchusa and especially the A. officinalis sometimes called alkanet; oxtongue.", "details": []}, {"x": -0.5347612813219871, "y": 0.3833347144906481, "z": 0.7530503759146793, "word": "Bulb", "pos_group": "noun", "row_number": 20563, "definition": "A spheroidal body growing from a plant either above or below the ground (usually below) which is strictly a bud consisting of a cluster of partially developed leaves and producing as it grows a stem above and roots below as in the onion tulip etc. It differs from a corm in not being solid.", "details": []}, {"x": -0.45123637762649, "y": 0.3100454035894193, "z": 0.8368139454022009, "word": "Bulbel", "pos_group": "noun", "row_number": 20570, "definition": "A separable bulb formed on some flowering plants.", "details": []}, {"x": -0.4524697188465769, "y": 0.4362342098378756, "z": 0.7777987321242071, "word": "Bulblet", "pos_group": "noun", "row_number": 20572, "definition": "A small bulb either produced on a larger bulb or on some aerial part of a plant as in the axils of leaves in the tiger lily or replacing the flowers in some kinds of onion.", "details": []}, {"x": -0.5343521936799686, "y": 0.3233755795876736, "z": 0.7809583648541973, "word": "Bullace", "pos_group": "noun", "row_number": 20619, "definition": "A small European plum (Prunus communis var. insitita). See Plum.", "details": []}, {"x": -0.4122142677472104, "y": 0.3635182974490824, "z": 0.8354243501869881, "word": "Bull brier", "pos_group": "other", "row_number": 20627, "definition": "A species of Smilax (S. Pseudo-China) growing from New Jersey to the Gulf of Mexico which has very large tuberous and farinaceous rootstocks formerly used by the Indians for a sort of bread and by the negroes as an ingredient in making beer; -- called also bamboo brier and China brier.", "details": []}, {"x": -0.5104608591279308, "y": 0.4173564425362783, "z": 0.7518266496818511, "word": "Bullweed", "pos_group": "noun", "row_number": 20695, "definition": "Knapweed.", "details": []}, {"x": -0.4878122069762716, "y": 0.2976291653647506, "z": 0.8206437294278321, "word": "Bunchberry", "pos_group": "noun", "row_number": 20765, "definition": "The dwarf cornel (Cornus Canadensis) which bears a dense cluster of bright red edible berries.", "details": []}, {"x": -0.4227730558007272, "y": 0.4204262175252937, "z": 0.8028105249100124, "word": "Bunch grass", "pos_group": "other", "row_number": 20766, "definition": "A grass growing in bunches and affording pasture. In California Atropis tenuifolia Festuca scabrella and several kinds of Stipa are favorite bunch grasses. In Utah Eriocoma cuspidata is a good bunch grass.", "details": []}, {"x": -0.5414847077852624, "y": 0.3591174711570546, "z": 0.7601506121450347, "word": "Bunt", "pos_group": "noun", "row_number": 20821, "definition": "A fungus (Ustilago foetida) which affects the ear of cereals filling the grains with a fetid dust; -- also called pepperbrand.", "details": []}, {"x": -0.4313948455024506, "y": 0.3265533238242503, "z": 0.840988355432613, "word": "Burr", "pos_group": "noun", "row_number": 20850, "definition": "Any rough or prickly envelope of the seeds of plants whether a pericarp a persistent calyx or an involucre as of the chestnut and burdock. Also any weed which bears burs.", "details": []}, {"x": -0.4749425506806259, "y": 0.4360674703438874, "z": 0.7643786593442179, "word": "Burdock", "pos_group": "noun", "row_number": 20881, "definition": "A genus of coarse biennial herbs (Lappa) bearing small burs which adhere tenaciously to clothes or to the fur or wool of animals.", "details": []}, {"x": -0.5209738223039754, "y": 0.3070120184660448, "z": 0.7964483015183036, "word": "Burgrass", "pos_group": "noun", "row_number": 20936, "definition": "Grass of the genus Cenchrus growing in sand and having burs for fruit.", "details": []}, {"x": -0.4093598686164078, "y": 0.3877806203685521, "z": 0.8258636015910485, "word": "Burnet", "pos_group": "noun", "row_number": 21005, "definition": "A genus of perennial herbs (Poterium); especially P.Sanguisorba the common or garden burnet.", "details": []}, {"x": -0.5279994043119371, "y": 0.3978693528660687, "z": 0.7502776866575301, "word": "Burstwort", "pos_group": "noun", "row_number": 21087, "definition": "A plant (Herniaria glabra) supposed to be valuable for the cure of hernia or rupture.", "details": []}, {"x": -0.4646941628805477, "y": 0.3020197481440326, "z": 0.8323721563794417, "word": "Butcher's broom", "pos_group": "other", "row_number": 21218, "definition": "A genus of plants (Ruscus); esp. R. aculeatus which has large red berries and leaflike branches. See Cladophyll.", "details": []}, {"x": -0.4392441618513562, "y": 0.4334091608093867, "z": 0.7869060081140584, "word": "Butterbur", "pos_group": "noun", "row_number": 21260, "definition": "A broad-leaved plant (Petasites vulgaris) of the Composite family said to have been used in England for wrapping up pats of butter.", "details": []}, {"x": -0.5402512589204816, "y": 0.3354837269525613, "z": 0.7717378092233488, "word": "Buttercup", "pos_group": "noun", "row_number": 21261, "definition": "A plant of the genus Ranunculus or crowfoot particularly R. bulbosus with bright yellow flowers; -- called also butterflower golden cup and kingcup. It is the cuckoobud of Shakespeare.", "details": []}, {"x": -0.4166244969158612, "y": 0.3483705903500564, "z": 0.8396796772274284, "word": "Butternut", "pos_group": "noun", "row_number": 21272, "definition": "The nut of the Caryocar butyrosum and C. nuciferum of S. America; -- called also Souari nut.", "details": []}, {"x": -0.4979021600281965, "y": 0.4274766222313552, "z": 0.7545576031589154, "word": "Butterweed", "pos_group": "noun", "row_number": 21274, "definition": "An annual composite plant of the Mississippi valley (Senecio lobatus).", "details": []}, {"x": -0.5017943750199492, "y": 0.2977657126449284, "z": 0.8121194404589738, "word": "Butterwort", "pos_group": "noun", "row_number": 21276, "definition": "A genus of low herbs (Pinguicula) having simple leaves which secrete from their glandular upper surface a viscid fluid to which insects adhere after which the margin infolds and the insects are digested by the plant. The species are found mostly in the North Temperate zone.", "details": []}, {"x": -0.4145829625648674, "y": 0.4099769050789483, "z": 0.8124283995853573, "word": "Button", "pos_group": "noun", "row_number": 21291, "definition": "A bud; a germ of a plant.", "details": []}, {"x": -0.5394253236396406, "y": 0.3742999168485422, "z": 0.7542677856460817, "word": "Buttonbush", "pos_group": "noun", "row_number": 21300, "definition": "A shrub (Cephalanthus occidentalis) growing by the waterside; -- so called from its globular head of flowers. See Capitulum.", "details": []}, {"x": -0.4425062415302424, "y": 0.3145084785260475, "z": 0.8398051221217989, "word": "Buttonweed", "pos_group": "noun", "row_number": 21305, "definition": "The name of several plants of the genera Spermacoce and Diodia of the Madder family.", "details": []}, {"x": -0.4604679349135225, "y": 0.4385265079596999, "z": 0.7717925775317791, "word": "Buxine", "pos_group": "noun", "row_number": 21327, "definition": "An alkaloid obtained from the Buxus sempervirens or common box tree. It is identical with bebeerine; -- called also buxina.", "details": []}, {"x": -0.5310684079788393, "y": 0.3153476724655247, "z": 0.7864618182196751, "word": "Byssolite", "pos_group": "noun", "row_number": 21409, "definition": "An olive-green fibrous variety of hornblende.", "details": []}, {"x": -0.4088283399400002, "y": 0.3729062759090799, "z": 0.8329467557110267, "word": "Byssus", "pos_group": "noun", "row_number": 21414, "definition": "An obsolete name for certain fungi composed of slender threads.", "details": []}, {"x": -0.5185311647407411, "y": 0.4113668097038741, "z": 0.7496017469741295, "word": "Cabbage", "pos_group": "noun", "row_number": 21467, "definition": "An esculent vegetable of many varieties derived from the wild Brassica oleracea of Europe. The common cabbage has a compact head of leaves. The cauliflower Brussels sprouts etc. are sometimes classed as cabbages.", "details": []}, {"x": -0.4790667362533648, "y": 0.2968966952993866, "z": 0.8260432280067745, "word": "Cabbage", "pos_group": "noun", "row_number": 21469, "definition": "The cabbage palmetto. See below.", "details": []}, {"x": -0.4273805192506361, "y": 0.4273395616967227, "z": 0.7966974273674478, "word": "Cacoon", "pos_group": "noun", "row_number": 21591, "definition": "One of the seeds or large beans of a tropical vine (Entada scandens) used for making purses scent bottles etc.", "details": []}, {"x": -0.5432236324660867, "y": 0.3494718492605106, "z": 0.7633986584379023, "word": "Cactaceous", "pos_group": "adjective", "row_number": 21603, "definition": "Belonging to or like the family of plants of which the prickly pear is a common example.", "details": []}, {"x": -0.423989481818534, "y": 0.3336995692152723, "z": 0.8419486426218601, "word": "Cactus", "pos_group": "noun", "row_number": 21606, "definition": "Any plant of the order Cactacae as the prickly pear and the night-blooming cereus. See Cereus. They usually have leafless stems and branches often beset with clustered thorns and are mostly natives of the warmer parts of America.", "details": []}, {"x": -0.4839153733013169, "y": 0.4350094217272837, "z": 0.7593370229951528, "word": "Cadene", "pos_group": "noun", "row_number": 21641, "definition": "A species of inferior carpet imported from the Levant.", "details": []}, {"x": -0.5149233990509103, "y": 0.3012432866048479, "z": 0.8025623809931329, "word": "Cahincic", "pos_group": "adjective", "row_number": 21735, "definition": "Pertaining to or derived from cahinca the native name of a species of Brazilian Chiococca perhaps C. racemosa; as cahincic acid.", "details": []}, {"x": -0.4090830800715869, "y": 0.3971893789481252, "z": 0.8215178822459961, "word": "Calabash", "pos_group": "noun", "row_number": 21781, "definition": "The common gourd (plant or fruit).", "details": []}, {"x": -0.5342504442746875, "y": 0.3895854017699292, "z": 0.7501997584110928, "word": "Caladium", "pos_group": "noun", "row_number": 21786, "definition": "A genus of aroideous plants of which some species are cultivated for their immense leaves (which are often curiously blotched with white and red) and others (in Polynesia) for food.", "details": []}, {"x": -0.4555200233895565, "y": 0.3046546089152971, "z": 0.8364729987021968, "word": "Calamint", "pos_group": "noun", "row_number": 21796, "definition": "A genus of perennial plants (Calamintha) of the Mint family esp. the C. Nepeta and C. Acinos which are called also basil thyme.", "details": []}, {"x": -0.4463075537261217, "y": 0.4376487073561528, "z": 0.7805595277981644, "word": "Calamite", "pos_group": "noun", "row_number": 21801, "definition": "A fossil plant of the coal formation having the general form of plants of the modern Equiseta (the Horsetail or Scouring Rush family) but sometimes attaining the height of trees and having the stem more or less woody within. See Acrogen and Asterophyllite.", "details": []}, {"x": -0.5387929723679582, "y": 0.3264126505168765, "z": 0.7766317753668387, "word": "Calamus", "pos_group": "noun", "row_number": 21808, "definition": "The indian cane a plant of the Palm family. It furnishes the common rattan. See Rattan and Dragon's blood.", "details": []}, {"x": -0.4114798243485258, "y": 0.3573474763489571, "z": 0.8384432809088149, "word": "Calamus", "pos_group": "noun", "row_number": 21809, "definition": "A species of Acorus (A. calamus) commonly called calamus or sweet flag. The root has a pungent aromatic taste and is used in medicine as a stomachic; the leaves have an aromatic odor and were formerly used instead of rushes to strew on floors.", "details": []}, {"x": -0.5067400902820162, "y": 0.4231395680988042, "z": 0.7511107686687307, "word": "Calcarated", "pos_group": "adjective", "row_number": 21827, "definition": "Having a spur as the flower of the toadflax and larkspur; spurred.", "details": []}, {"x": -0.4936780557330376, "y": 0.2950049532040177, "z": 0.8180794917810513, "word": "Calceolaria", "pos_group": "noun", "row_number": 21843, "definition": "A genus of showy herbaceous or shrubby plants brought from South America; slipperwort. It has a yellow or purple flower often spotted or striped the shape of which suggests its name.", "details": []}, {"x": -0.4174921087940393, "y": 0.418229194211022, "z": 0.8067122660554413, "word": "Calendula", "pos_group": "noun", "row_number": 21956, "definition": "A genus of composite herbaceous plants. One species Calendula officinalis is the common marigold and was supposed to blossom on the calends of every month wh
