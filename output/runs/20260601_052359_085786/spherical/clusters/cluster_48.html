ence the name.", "details": []}, {"x": -0.5430416234611993, "y": 0.3647099095336697, "z": 0.7563679508523399, "word": "Calla", "pos_group": "noun", "row_number": 22053, "definition": "A genus of plants of the order Araceae.", "details": []}, {"x": -0.4340307226037594, "y": 0.3202307558885784, "z": 0.8420627024272527, "word": "Calliopsis", "pos_group": "noun", "row_number": 22079, "definition": "A popular name given to a few species of the genus Coreopsis especially to C. tinctoria of Arkansas.", "details": []}, {"x": -0.4691395798553393, "y": 0.4395154840662095, "z": 0.7659857661074397, "word": "Callot", "pos_group": "noun", "row_number": 22093, "definition": "A plant coif or skullcap. Same as Calotte.", "details": []}, {"x": -0.5265352705537005, "y": 0.3079833116478844, "z": 0.7924057600808713, "word": "Caltrap", "pos_group": "noun", "row_number": 22141, "definition": "A genus of herbaceous plants (Tribulus) of the order Zygophylleae having a hard several-celled fruit armed with stout spines and resembling the military instrument of the same name. The species grow in warm countries and are often very annoying to cattle.", "details": []}, {"x": -0.4066129379604216, "y": 0.3826197742190062, "z": 0.8296192060576895, "word": "Calumba", "pos_group": "noun", "row_number": 22143, "definition": "The root of a plant (Jateorrhiza Calumba and probably Cocculus palmatus) indigenous in Mozambique. It has an unpleasantly bitter taste and is used as a tonic and antiseptic.", "details": []}, {"x": -0.526124317921216, "y": 0.40423201007743, "z": 0.7481909409507015, "word": "Callyciflorous", "pos_group": "adjective", "row_number": 22180, "definition": "Having the petals and stamens adnate to the calyx; -- applied to a subclass of dicotyledonous plants in the system of the French botanist Candolle.", "details": []}, {"x": -0.4698536546480951, "y": 0.2975293114588204, "z": 0.8310919636458225, "word": "Calypso", "pos_group": "noun", "row_number": 22192, "definition": "A small and beautiful species of orchid having a flower variegated with purple pink and yellow. It grows in cold and wet localities in the northern part of the United States. The Calypso borealis is the only orchid which reaches 68\ufffd N.", "details": []}, {"x": -0.4331564474146073, "y": 0.4333840970486456, "z": 0.790287110162178, "word": "Calyptra", "pos_group": "noun", "row_number": 22193, "definition": "A little hood or veil resembling an extinguisher in form and position covering each of the small flasklike capsules which contain the spores of mosses; also any similar covering body.", "details": []}, {"x": -0.5437055369913898, "y": 0.3397420844366965, "z": 0.7674370365753225, "word": "Calyx", "pos_group": "noun", "row_number": 22197, "definition": "The covering of a flower. See Flower.", "details": []}, {"x": -0.4172701660683903, "y": 0.3418402517025789, "z": 0.8420396967038878, "word": "Camass", "pos_group": "noun", "row_number": 22213, "definition": "A blue-flowered liliaceous plant (Camassia esculenta) of northwestern America the bulbs of which are collected for food by the Indians.", "details": []}, {"x": -0.493134143992094, "y": 0.4325672728437779, "z": 0.7547875664673346, "word": "Camellia", "pos_group": "noun", "row_number": 22245, "definition": "An Asiatic genus of small shrubs often with shining leaves and showy flowers. Camellia Japonica is much cultivated for ornament and C. Sassanqua and C. oleifera are grown in China for the oil which is pressed from their seeds. The tea plant is now referred to this genus under the name of Camellia Thea.", "details": []}, {"x": -0.5078228038360256, "y": 0.2965225183569034, "z": 0.808820373143133, "word": "Cammock", "pos_group": "noun", "row_number": 22278, "definition": "A plant having long hard crooked roots the Ononis spinosa; -- called also rest-harrow. The Scandix Pecten-Veneris is also called cammock.", "details": []}, {"x": -0.4101107930296083, "y": 0.4064369182055704, "z": 0.8164668817289433, "word": "Chamomile", "pos_group": "noun", "row_number": 22280, "definition": "A genus of herbs (Anthemis) of the Composite family. The common camomile A. nobilis is used as a popular remedy. Its flowers have a strong and fragrant and a bitter aromatic taste. They are tonic febrifugal and in large doses emetic and the volatile oil is carminative.", "details": []}, {"x": -0.5396270421683019, "y": 0.380490042175594, "z": 0.7510192961341969, "word": "Campagnol", "pos_group": "noun", "row_number": 22298, "definition": "A mouse (Arvicala agrestis) called also meadow mouse which often does great damage in fields and gardens by feeding on roots and seeds.", "details": []}, {"x": -0.4463307445161977, "y": 0.3086491562937972, "z": 0.8399550969062237, "word": "Campana", "pos_group": "noun", "row_number": 22306, "definition": "The pasque flower.", "details": []}, {"x": -0.4542691445170523, "y": 0.4406931885483064, "z": 0.7742280399900743, "word": "Campanula", "pos_group": "noun", "row_number": 22317, "definition": "A large genus of plants bearing bell-shaped flowers often of great beauty; -- also called bellflower.", "details": []}, {"x": -0.5360236273209739, "y": 0.3177445855774695, "z": 0.7821234233098174, "word": "Campanulaceous", "pos_group": "adjective", "row_number": 22318, "definition": "Of pertaining to or resembling the family of plants (Camponulaceae) of which Campanula is the type and which includes the Canterbury bell the harebell and the Venus's looking-glass.", "details": []}, {"x": -0.4073716391300219, "y": 0.3669261903396943, "z": 0.8363094633419601, "word": "Campion", "pos_group": "noun", "row_number": 22344, "definition": "A plant of the Pink family (Cucubalus bacciferus) bearing berries regarded as poisonous.", "details": []}, {"x": -0.5153606298903993, "y": 0.4175102925230081, "z": 0.7483906578761679, "word": "Canada", "pos_group": "noun", "row_number": 22365, "definition": "A British province in North America giving its name to various plants and animals.", "details": []}, {"x": -0.4848447881163682, "y": 0.2935496534514123, "z": 0.8238653605990179, "word": "Cancellate", "pos_group": "other", "row_number": 22409, "definition": "Consisting of a network of veins without intermediate parenchyma as the leaves of certain plants; latticelike.", "details": []}, {"x": -0.421677717534623, "y": 0.4258480426862624, "z": 0.8005256692168401, "word": "Candite", "pos_group": "noun", "row_number": 22459, "definition": "A variety of spinel of a dark color found at Candy in Ceylon.", "details": []}, {"x": -0.5454911898207369, "y": 0.3547479050345766, "z": 0.7593373991194795, "word": "Candock", "pos_group": "noun", "row_number": 22473, "definition": "A plant or weed that grows in rivers; a species of Equisetum; also the yellow frog lily (Nuphar luteum).", "details": []}, {"x": -0.4259997319653293, "y": 0.3271367837699127, "z": 0.8435080041529808, "word": "Candytuft", "pos_group": "noun", "row_number": 22486, "definition": "An annual plant of the genus Iberis cultivated in gardens. The name was originally given to the I. umbellata first discovered in the island of Candia.", "details": []}, {"x": -0.4783233955853142, "y": 0.4391291467352273, "z": 0.7605079366603127, "word": "Cane", "pos_group": "noun", "row_number": 22487, "definition": "A name given to several peculiar palms species of Calamus and Daemanorops having very long smooth flexible stems commonly called rattans.", "details": []}, {"x": -0.5208007561106028, "y": 0.3014642940537135, "z": 0.798677564380846, "word": "Cane", "pos_group": "noun", "row_number": 22489, "definition": "Stems of other plants are sometimes called canes; as the canes of a raspberry.", "details": []}, {"x": -0.4056586427371984, "y": 0.3924624715755875, "z": 0.825478209268661, "word": "Canker bloom", "pos_group": "other", "row_number": 22526, "definition": "The bloom or blossom of the wild rose or dog-rose.", "details": []}, {"x": -0.5330585808436397, "y": 0.3960599002830965, "z": 0.7476530644468117, "word": "Canna", "pos_group": "noun", "row_number": 22538, "definition": "A genus of tropical plants with large leaves and often with showy flowers. The Indian shot (C. Indica) is found in gardens of the northern United States.", "details": []}, {"x": -0.4603505888223873, "y": 0.2995642893898269, "z": 0.8356665434808607, "word": "Cannabis", "pos_group": "noun", "row_number": 22542, "definition": "A genus of a single species belonging to the order Uricaceae; hemp.", "details": []}, {"x": -0.4400205223734227, "y": 0.438396841340536, "z": 0.7837028450840671, "word": "Caper", "pos_group": "noun", "row_number": 22851, "definition": "The pungent grayish green flower bud of the European and Oriental caper (Capparis spinosa) much used for pickles.", "details": []}, {"x": -0.5428712022283233, "y": 0.3301314687794321, "z": 0.7722072721185094, "word": "Caper tree", "pos_group": "other", "row_number": 22856, "definition": "See Capper a plant 2.", "details": []}, {"x": -0.4114047109754333, "y": 0.3508383931279863, "z": 0.8412244561914454, "word": "Capillaire", "pos_group": "noun", "row_number": 22865, "definition": "A sirup prepared from the maiden-hair formerly supposed to have medicinal properties.", "details": []}, {"x": -0.502410403515267, "y": 0.4287397593683316, "z": 0.7508435290900574, "word": "Capillary", "pos_group": "adjective", "row_number": 22872, "definition": "Resembling a hair; fine; minute; very slender; having minute tubes or interspaces; having very small bore; as the capillary vessels of animals and plants.", "details": []}, {"x": -0.4997822821642126, "y": 0.2929886832284505, "z": 0.8150922045601896, "word": "Capitate", "pos_group": "adjective", "row_number": 22906, "definition": "Headlike in form; also having the distal end enlarged and rounded as the stigmas of certain flowers.", "details": []}, {"x": -0.4124688899312743, "y": 0.4153193511246497, "z": 0.8107892768286111, "word": "Capitate", "pos_group": "adjective", "row_number": 22907, "definition": "Having the flowers gathered into a head.", "details": []}, {"x": -0.5439806428632179, "y": 0.3707451635428339, "z": 0.7527503463298557, "word": "Capitulum", "pos_group": "noun", "row_number": 22941, "definition": "A thick head of flowers on a very short axis as a clover top or a dandelion; a composite flower. A capitulum may be either globular or flat.", "details": []}, {"x": -0.4373197229461628, "y": 0.3139684765217637, "z": 0.8427189660099589, "word": "Caprifoliaceous", "pos_group": "adjective", "row_number": 22989, "definition": "Of pertaining to or resembling the Honeysuckle family of plants (Caprifoliacae.", "details": []}, {"x": -0.4629921260213104, "y": 0.4424321073380222, "z": 0.7680443487447217, "word": "Capsicine", "pos_group": "noun", "row_number": 23004, "definition": "A volatile alkaloid extracted from Capsicum annuum or from capsicin.", "details": []}, {"x": -0.5319516106924757, "y": 0.3096775978264094, "z": 0.7881162790389152, "word": "Capsicum", "pos_group": "noun", "row_number": 23005, "definition": "A genus of plants of many species producing capsules or dry berries of various forms which have an exceedingly pungent biting taste and when ground form the red or Cayenne pepper of commerce.", "details": []}, {"x": -0.4044244942570853, "y": 0.3769249391826262, "z": 0.8332877166183804, "word": "Carabid", "pos_group": "adjective", "row_number": 23094, "definition": "Of pertaining to or resembling the genus Carbus or family Carabidae.", "details": []}, {"x": -0.5235715145500355, "y": 0.4106589167547689, "z": 0.7464798210545156, "word": "Caraboid", "pos_group": "adjective", "row_number": 23098, "definition": "Like or pertaining to the genus Carabus.", "details": []}, {"x": -0.4754537314432069, "y": 0.2934782588383514, "z": 0.8293456823580505, "word": "Caraway", "pos_group": "noun", "row_number": 23135, "definition": "A biennial plant of the Parsley family (Carum Carui). The seeds have an aromatic smell and a warm pungent taste. They are used in cookery and confectionery and also in medicine as a carminative.", "details": []}, {"x": -0.4270972743919802, "y": 0.4326474605401966, "z": 0.793979907236361, "word": "Cardamine", "pos_group": "noun", "row_number": 23236, "definition": "A genus of cruciferous plants containing the lady's-smock cuckooflower bitter cress meadow cress etc.", "details": []}, {"x": -0.5466774772339161, "y": 0.3446099498196013, "z": 0.7631433144373954, "word": "Cardamom", "pos_group": "noun", "row_number": 23238, "definition": "A plant which produces cardamoms esp. Elettaria Cardamomum and several species of Amomum.", "details": []}, {"x": -0.4185983469252605, "y": 0.3351233143272469, "z": 0.8440780699353351, "word": "Cardoon", "pos_group": "noun", "row_number": 23275, "definition": "A large herbaceous plant (Cynara Cardunculus) related to the artichoke; -- used in cookery and as a salad.", "details": []}, {"x": -0.4878428001778837, "y": 0.4373236852240478, "z": 0.7554848752004631, "word": "Carex", "pos_group": "noun", "row_number": 23317, "definition": "A numerous and widely distributed genus of perennial herbaceous plants of the order Cypreaceae; the sedges.", "details": []}, {"x": -0.5139402909282342, "y": 0.2959586381855938, "z": 0.8051545577365445, "word": "Carina", "pos_group": "noun", "row_number": 23342, "definition": "That part of a papilionaceous flower consisting of two petals commonly united which incloses the organs of fructification", "details": []}, {"x": -0.4060308539350824, "y": 0.4022301855447099, "z": 0.8205789562799035, "word": "Carl", "pos_group": "noun", "row_number": 23361, "definition": "Large stalks of hemp which bear the seed; -- called also carl hemp.", "details": []}, {"x": -0.5391619120338289, "y": 0.3869837252108273, "z": 0.7480294305934603, "word": "Carline thistle", "pos_group": "other", "row_number": 23368, "definition": "A prickly plant of the genus Carlina (C. vulgaris) found in Europe and Asia.", "details": []}, {"x": -0.4507460504518777, "y": 0.3030093021405781, "z": 0.8396507374011608, "word": "Carnation", "pos_group": "noun", "row_number": 23409, "definition": "A species of Dianthus (D. Caryophyllus) or pink having very beautiful flowers of various colors esp. white and usually a rich spicy scent.", "details": []}, {"x": -0.447866660230745, "y": 0.4422330980276595, "z": 0.7770748623283453, "word": "Carnous", "pos_group": "adjective", "row_number": 23427, "definition": "Of a fleshy consistence; -- applied to succulent leaves stems etc.", "details": []}, {"x": -0.5406885439549294, "y": 0.3208459268065027, "z": 0.7776334545835683, "word": "Carpellum", "pos_group": "noun", "row_number": 23492, "definition": "A simple pistil or single-celled ovary or seed vessel or one of the parts of a compound pistil ovary or seed vessel. See Illust of Carpaphore.", "details": []}, {"x": -0.4065466632268047, "y": 0.3605348345555998, "z": 0.8394846298123135, "word": "Carpolite", "pos_group": "noun", "row_number": 23516, "definition": "A general term for a fossil fruit nut or seed.", "details": []}, {"x": -0.5115495968099744, "y": 0.4235557179482192, "z": 0.747607894418539, "word": "Carpology", "pos_group": "noun", "row_number": 23519, "definition": "That branch of botany which relates to the structure of seeds and fruit.", "details": []}, {"x": -0.4909353498461001, "y": 0.2907585201505759, "z": 0.821244156893268, "word": "Carpophore", "pos_group": "noun", "row_number": 23521, "definition": "A slender prolongation of the receptacle as an axis between the carpels as in Geranium and many umbelliferous plants.", "details": []}, {"x": -0.4161550095915994, "y": 0.4236354813433892, "z": 0.8045793851067592, "word": "Carpophyll", "pos_group": "noun", "row_number": 23522, "definition": "A leaf converted into a fruit or a constituent portion of a fruit; a carpel. [See Illust. of Gymnospermous.]", "details": []}, {"x": -0.5471810905390526, "y": 0.3605309273856263, "z": 0.7553875194593522, "word": "Carpophyte", "pos_group": "noun", "row_number": 23523, "definition": "A flowerless plant which forms a true fruit as the result of fertilization as the red seaweeds the Ascomycetes etc.", "details": []}, {"x": -0.4286814606518972, "y": 0.3205479973401041, "z": 0.8446781556868893, "word": "Carrigeen", "pos_group": "noun", "row_number": 23529, "definition": "A small purplish branching cartilaginous seaweed (Chondrus crispus) which when bleached is the Irish moss of commerce.", "details": []}, {"x": -0.4723196491917818, "y": 0.4427804551300517, "z": 0.7621414681948334, "word": "Carrancha", "pos_group": "noun", "row_number": 23530, "definition": "The Brazilian kite (Polyborus Brasiliensis); -- so called in imitation of its notes.", "details": []}, {"x": -0.5266137802839197, "y": 0.3024018116256617, "z": 0.7945005165137385, "word": "Carrot", "pos_group": "noun", "row_number": 23557, "definition": "An umbelliferous biennial plant (Daucus Carota) of many varieties.", "details": []}, {"x": -0.4027409767785224, "y": 0.3871481469345319, "z": 0.8294070279112901, "word": "Carrot", "pos_group": "noun", "row_number": 23558, "definition": "The esculent root of cultivated varieties of the plant usually spindle-shaped and of a reddish yellow color.", "details": []}, {"x": -0.531184410916827, "y": 0.4026838489064172, "z": 0.7454453966782929, "word": "Carter", "pos_group": "noun", "row_number": 23609, "definition": "Any species of Phalangium; -- also called harvestman", "details": []}, {"x": -0.4656802219688136, "y": 0.2948412588855778, "z": 0.8343923315358573, "word": "Caryophyllaceous", "pos_group": "adjective", "row_number": 23694, "definition": "Having corollas of five petals with long claws inclosed in a tubular calyx as the pink", "details": []}, {"x": -0.4336804573189344, "y": 0.4384544130401118, "z": 0.7871969185821875, "word": "Caryophyllaceous", "pos_group": "adjective", "row_number": 23695, "definition": "Belonging to the family of which the pink and the carnation are the types.", "details": []}, {"x": -0.5465287933757293, "y": 0.3345009425027406, "z": 0.7677339366447518, "word": "Caryophyllous", "pos_group": "adjective", "row_number": 23697, "definition": "Caryophyllaceous.", "details": []}, {"x": -0.4120027892837212, "y": 0.344061072818841, "z": 0.8437272543856704, "word": "Cascarilla", "pos_group": "noun", "row_number": 23707, "definition": "A euphorbiaceous West Indian shrub (Croton Eleutheria); also its aromatic bark.", "details": []}, {"x": -0.4975094135522028, "y": 0.4340848428826671, "z": 0.7510357731869192, "word": "Cashew", "pos_group": "noun", "row_number": 23755, "definition": "A tree (Anacardium occidentale) of the same family which the sumac. It is native in tropical America but is now naturalized in all tropical countries. Its fruit a kidney-shaped nut grows at the extremity of an edible pear-shaped hypocarp about three inches long.", "details": []}, {"x": -0.5060555739727755, "y": 0.2916167875167981, "z": 0.8117064772991942, "word": "Cassava", "pos_group": "noun", "row_number": 23794, "definition": "A shrubby euphorbiaceous plant of the genus Manihot with fleshy rootstocks yielding an edible starch; -- called also manioc.", "details": []}, {"x": -0.4077680020778577, "y": 0.4117151003901527, "z": 0.8149944371541187, "word": "Cassia", "pos_group": "noun", "row_number": 23799, "definition": "A genus of leguminous plants (herbs shrubs or trees) of many species most of which have purgative qualities. The leaves of several species furnish the senna used in medicine.", "details": []}, {"x": -0.5442757841258874, "y": 0.37715967706718, "z": 0.7493426778241921, "word": "Cassidony", "pos_group": "noun", "row_number": 23803, "definition": "The French lavender (Lavandula Stoechas)", "details": []}, {"x": -0.4412355913716702, "y": 0.3078417917364193, "z": 0.8429380666261334, "word": "Cassidony", "pos_group": "noun", "row_number": 23804, "definition": "The goldilocks (Chrysocoma Linosyris) and perhaps other plants related to the genus Gnaphalium or cudweed.", "details": []}, {"x": -0.4565648650378909, "y": 0.4447698259316981, "z": 0.7705376862643507, "word": "Cassioberry", "pos_group": "noun", "row_number": 23809, "definition": "The fruit of the Viburnum obovatum a shrub which grows from Virginia to Florida.", "details": []}, {"x": -0.5371537239449661, "y": 0.3120896718753629, "z": 0.783623578997457, "word": "Cassumuniar", "pos_group": "noun", "row_number": 23821, "definition": "A pungent bitter aromatic gingerlike root obtained from the East Indies.", "details": []}, {"x": -0.402831809040544, "y": 0.3707512744615936, "z": 0.8368213824408568, "word": "Castor bean", "pos_group": "other", "row_number": 23935, "definition": "The bean or seed of the castor-oil plant (Ricinus communis or Palma Christi.)", "details": []}, {"x": -0.5203551178744826, "y": 0.4170739487162595, "z": 0.7451710358059148, "word": "Catapetalous", "pos_group": "adjective", "row_number": 24039, "definition": "Having the petals held together by stamens which grow to their bases as in the mallow.", "details": []}, {"x": -0.4814363204084621, "y": 0.2899237006266812, "z": 0.8271416548611797, "word": "Catawba", "pos_group": "noun", "row_number": 24070, "definition": "A well known light red variety of American grape.", "details": []}, {"x": -0.4211381489208853, "y": 0.4311911268890937, "z": 0.7979454064129974, "word": "Caterpillar", "pos_group": "noun", "row_number": 24187, "definition": "A plant of the genus Scorpiurus with pods resembling caterpillars.", "details": []}, {"x": -0.5491196902451575, "y": 0.3500422252793332, "z": 0.7589057954097828, "word": "Catkin", "pos_group": "noun", "row_number": 24255, "definition": "An ament; a species of inflorescence consisting of a slender axis with many unisexual apetalous flowers along its sides as in the willow and poplar and (as to the staminate flowers) in the chestnut oak hickory etc. -- so called from its resemblance to a cat's tail. See Illust. of Ament.", "details": []}, {"x": -0.4206074456069787, "y": 0.3282943887750326, "z": 0.8457612967018533, "word": "Catmint", "pos_group": "noun", "row_number": 24262, "definition": "A well-know plant of the genus Nepeta (N. Cataria) somewhat like mint having a string scent and sometimes used in medicine. It is so called because cats have a peculiar fondness for it.", "details": []}, {"x": -0.4820778396160024, "y": 0.4416809263291434, "z": 0.756649797375376, "word": "Cat's-foot", "pos_group": "noun", "row_number": 24277, "definition": "A plant (Nepeta Glechoma) of the same genus with catnip; ground ivy.", "details": []}, {"x": -0.5200751363882025, "y": 0.2960952408869111, "z": 0.8011550791419316, "word": "Cat-tail", "pos_group": "noun", "row_number": 24289, "definition": "A tall rush or flag (Typha latifolia) growing in marshes with long flat leaves and having its flowers in a close cylindrical spike at the top of the stem. The leaves are frequently used for seating chairs making mats etc. See Catkin.", "details": []}, {"x": -0.402399175389026, "y": 0.3973903913086034, "z": 0.8247155755421546, "word": "Caudicula", "pos_group": "noun", "row_number": 24311, "definition": "A slender elastic process to which the masses of pollen in orchidaceous plants are attached.", "details": []}, {"x": -0.5380189820919363, "y": 0.3937101463736538, "z": 0.7453374373739673, "word": "Caulicle", "pos_group": "noun", "row_number": 24326, "definition": "A short caulis or stem esp. the rudimentary stem seen in the embryo of seed; -- otherwise called a radicle.", "details": []}, {"x": -0.4557123074151116, "y": 0.2976596652156026, "z": 0.8388831960256029, "word": "Cauliculus", "pos_group": "noun", "row_number": 24328, "definition": "In the Corinthian capital one of the eight stalks rising out of the lower leafage and terminating in leaves which seem to support the volutes. See Illust. of Corinthian order under Corinthian.", "details": []}, {"x": -0.4413301829377506, "y": 0.4431127049668721, "z": 0.7803068629232176, "word": "Cauliflower", "pos_group": "noun", "row_number": 24329, "definition": "An annual variety of Brassica oleracea or cabbage of which the cluster of young flower stalks and buds is eaten as a vegetable.", "details": []}, {"x": -0.5450002223455203, "y": 0.3246304247719405, "z": 0.7730393553731421, "word": "Cauliflower", "pos_group": "noun", "row_number": 24330, "definition": "The edible head or \"\"\"\"curd\"\"\"\" of a cauliflower plant.", "details": []}, {"x": -0.4063765404332785, "y": 0.3537970824463633, "z": 0.8424284728319202, "word": "Cauline", "pos_group": "adjective", "row_number": 24332, "definition": "Growing immediately on a caulis; of or pertaining to a caulis.", "details": []}, {"x": -0.5071268659539283, "y": 0.4294286977097438, "z": 0.7472705904898573, "word": "Celandine", "pos_group": "noun", "row_number": 24538, "definition": "A perennial herbaceous plant (Chelidonium majus) of the poppy family with yellow flowers. It is used as a medicine in jaundice etc. and its acrid saffron-colored juice is used to cure warts and the itch; -- called also greater celandine and swallowwort.", "details": []}, {"x": -0.4972728437962243, "y": 0.288568132659974, "z": 0.818198112706178, "word": "Celery", "pos_group": "noun", "row_number": 24557, "definition": "A plant of the Parsley family (Apium graveolens) of which the blanched leafstalks are used as a salad.", "details": []}, {"x": -0.4108802955892335, "y": 0.4207101181559114, "z": 0.8088141808708248, "word": "Cenanthy", "pos_group": "noun", "row_number": 24638, "definition": "The absence or suppression of the essential organs (stamens and pistil) in a flower.", "details": []}, {"x": -0.5482587667517648, "y": 0.3667639543174406, "z": 0.7515959862141819, "word": "Centaurea", "pos_group": "noun", "row_number": 24689, "definition": "A large genus of composite plants related to the thistles and including the cornflower or bluebottle (Centaurea Cyanus) and the star thistle (C. Calcitrapa).", "details": []}, {"x": -0.4320177701056661, "y": 0.3140089558596253, "z": 0.8454342209497293, "word": "Centaury", "pos_group": "noun", "row_number": 24690, "definition": "A gentianaceous plant not fully identified. The name is usually given to the Erytheraea Centaurium and the Chlora perfoliata of Europe but is also extended to the whole genus Sabbatia and even to the unrelated Centaurea.", "details": []}, {"x": -0.4659635960617232, "y": 0.4459086014295491, "z": 0.7642273525047184, "word": "Centinody", "pos_group": "noun", "row_number": 24750, "definition": "A weed with a stem of many joints (Illecebrum verticillatum); also the Polygonum aviculare or knotgrass.", "details": []}, {"x": -0.5322916922231514, "y": 0.3040608483830727, "z": 0.7900712340484116, "word": "Centrifugal", "pos_group": "adjective", "row_number": 24775, "definition": "Expanding first at the summit and later at the base as a flower cluster.", "details": []}, {"x": -0.400375005537524, "y": 0.3812937356092298, "z": 0.8332556283194169, "word": "Centrifugal", "pos_group": "adjective", "row_number": 24776, "definition": "Having the radicle turned toward the sides of the fruit as some embryos.", "details": []}, {"x": -0.528632442996564, "y": 0.4093824594108598, "z": 0.7436085947178129, "word": "Centripetal", "pos_group": "adjective", "row_number": 24782, "definition": "Having the radicle turned toward the axis of the fruit as some embryos.", "details": []}, {"x": -0.4714573761447802, "y": 0.2905484755291567, "z": 0.8326521037302208, "word": "Cereal", "pos_group": "adjective", "row_number": 24897, "definition": "Of or pertaining to the grasses which are cultivated for their edible seeds (as wheat maize rice etc.) or to their seeds or grain.", "details": []}, {"x": -0.4273588497034714, "y": 0.4378033489197533, "z": 0.7910073585338979, "word": "Cereus", "pos_group": "noun", "row_number": 24953, "definition": "A genus of plants of the Cactus family. They are natives of America from California to Chili.", "details": []}, {"x": -0.5497118626970398, "y": 0.3394847931373493, "z": 0.763260730837531, "word": "Cernuous", "pos_group": "adjective", "row_number": 24964, "definition": "Inclining or nodding downward; pendulous; drooping; -- said of a bud flower fruit or the capsule of a moss.", "details": []}, {"x": -0.4132820473875791, "y": 0.3370870662142582, "z": 0.8459138603298773, "word": "Cestraciont", "pos_group": "adjective", "row_number": 25080, "definition": "Pertaining to or characteristic of the genus Cestracion.", "details": []}, {"x": -0.4920791980110758, "y": 0.4391055880054236, "z": 0.7516943165058437, "word": "Cestus", "pos_group": "noun", "row_number": 25082, "definition": "A genus of Ctenophora. The typical species (Cestus Veneris) is remarkable for its brilliant iridescent colors and its long girdlelike form.", "details": []}, {"x": -0.5124279103300764, "y": 0.2909198214172901, "z": 0.8079500567617304, "word": "Ceterach", "pos_group": "noun", "row_number": 25093, "definition": "A species of fern with fronds (Asplenium Ceterach).", "details": []}, {"x": -0.4034506232220189, "y": 0.4074405880081786, "z": 0.8192800265265315, "word": "Cetraric", "pos_group": "adjective", "row_number": 25100, "definition": "Pertaining to or derived from the lichen Iceland moss (Cetaria Islandica).", "details": []}, {"x": -0.5439068352362006, "y": 0.3838873108974699, "z": 0.7461875683199565, "word": "Chafeweed", "pos_group": "noun", "row_number": 25149, "definition": "The cudweed (Gnaphalium) used to prevent or cure chafing.", "details": []}, {"x": -0.4457469799433415, "y": 0.3019240788259658, "z": 0.8427048596611286, "word": "Chaff", "pos_group": "noun", "row_number": 25150, "definition": "The glumes or husks of grains and grasses separated from the seed by threshing and winnowing etc.", "details": []}, {"x": -0.4499242157346192, "y": 0.4464865630243116, "z": 0.7734455049545023, "word": "Chaff", "pos_group": "noun", "row_number": 25154, "definition": "The scales or bracts on the receptacle which subtend each flower in the heads of many Compositae as the sunflower.", "details": []}, {"x": -0.5420750189819007, "y": 0.3152082282306077, "z": 0.7789726867172515, "word": "Chaffy", "pos_group": "adjective", "row_number": 25176, "definition": "Bearing or covered with dry scales as the under surface of certain ferns or the disk of some composite flowers.", "details": []}, {"x": -0.4018666738521405, "y": 0.3641575038568846, "z": 0.8401740824565707, "word": "Champignon", "pos_group": "noun", "row_number": 25359, "definition": "An edible species of mushroom (Agaricus campestris).", "details": []}, {"x": -0.5164948148686194, "y": 0.423401827598208, "z": 0.7442875778893048, "word": "Chanterelle", "pos_group": "noun", "row_number": 25471, "definition": "A name for several species of mushroom of which one (Cantharellus cibrius) is edible the others reputed poisonous.", "details": []}, {"x": -0.4877406203506526, "y": 0.2869179266041831, "z": 0.8244920804065479, "word": "Chara", "pos_group": "noun", "row_number": 25582, "definition": "A genus of flowerless plants having articulated stems and whorled branches. They flourish in wet places.", "details": []}, {"x": -0.4153490341464098, "y": 0.4290132453421275, "z": 0.8021426401548917, "word": "Chard", "pos_group": "noun", "row_number": 25622, "definition": "A variety of the white beet which produces large succulent leaves and leafstalks.", "details": []}, {"x": -0.5509897990983631, "y": 0.3559893748276289, "z": 0.7547726851836779, "word": "Charlock", "pos_group": "noun", "row_number": 25714, "definition": "A cruciferous plant (Brassica sinapistrum) with yellow flowers; wild mustard. It is troublesome in grain fields. Called also chardock chardlock chedlock and kedlock.", "details": []}, {"x": -0.4232900097345498, "y": 0.321428356771835, "z": 0.8470592536073748, "word": "Charras", "pos_group": "noun", "row_number": 25746, "definition": "The gum resin of the hemp plant (Cannabis sativa). Same as Churrus.", "details": []}, {"x": -0.4758926058960924, "y": 0.4455781084509392, "z": 0.7582785615607958, "word": "Chay root", "pos_group": "other", "row_number": 25908, "definition": "The root of the Oldenlandia umbellata native in India which yieds a durable red dyestuff.", "details": []}, {"x": -0.5261561432296943, "y": 0.2969472481955653, "z": 0.7968576063078866, "word": "Cheat", "pos_group": "noun", "row_number": 25927, "definition": "A troublesome grass growing as a weed in grain fields; -- called also chess. See Chess.", "details": []}, {"x": -0.399267405898377, "y": 0.3919563948237994, "z": 0.8288279213105159, "word": "Checkerberry", "pos_group": "noun", "row_number": 25975, "definition": "A spicy plant and its bright red berry; the wintergreen (Gaultheria procumbens). Also incorrectly applied to the partridge berry (Mitchella repens).", "details": []}, {"x": -0.5361932692853497, "y": 0.4005970997096478, "z": 0.7429796374580577, "word": "Cheese", "pos_group": "noun", "row_number": 26038, "definition": "The flat circular mucilaginous fruit of the dwarf mallow (Malva rotundifolia).", "details": []}, {"x": -0.461185237353068, "y": 0.2926678586463833, "z": 0.8376477191295485, "word": "Chelone", "pos_group": "noun", "row_number": 26077, "definition": "A genus of hardy perennial flowering plants of the order Scrophulariaceae natives of North America; -- called also snakehead turtlehead shellflower etc.", "details": []}, {"x": -0.4347299730113365, "y": 0.4433044985067694, "z": 0.7838947455935805, "word": "Cherimoyer", "pos_group": "noun", "row_number": 26113, "definition": "A small downy-leaved tree (Anona Cherimolia) with fragrant flowers. It is a native of Peru.", "details": []}, {"x": -0.548899333945044, "y": 0.3290710569687211, "z": 0.7683890685454705, "word": "Cherry", "pos_group": "noun", "row_number": 26126, "definition": "The common garden cherry (Prunus Cerasus) of which several hundred varieties are cultivated for the fruit some of which are the begarreau blackheart black Tartarian oxheart morelle or morello May-duke (corrupted from Medoc in France).", "details": []}, {"x": -0.4068785112046371, "y": 0.3467802717775414, "z": 0.8450995918977791, "word": "Chervil", "pos_group": "noun", "row_number": 26149, "definition": "A plant (Anthriscus cerefolium) with pinnately divided aromatic leaves of which several curled varieties are used in soups and salads.", "details": []}, {"x": -0.5021263208360259, "y": 0.4350569648543479, "z": 0.7473918619140825, "word": "Chess", "pos_group": "noun", "row_number": 26155, "definition": "A species of brome grass (Bromus secalinus) which is a troublesome weed in wheat fields and is often erroneously regarded as degenerate or changed wheat; it bears a very slight resemblance to oats and if reaped and ground up with wheat so as to be used for food is said to produce narcotic effects; -- called also cheat and Willard's bromus.", "details": []}, {"x": -0.5037900821431717, "y": 0.2870177274958386, "z": 0.8147492726215232, "word": "Chichling vetch", "pos_group": "noun", "row_number": 26257, "definition": "A leguminous plant (Lathyrus sativus) with broad flattened seeds which are sometimes used for food.", "details": []}, {"x": -0.4059187627560319, "y": 0.4170863406402381, "z": 0.8131844455558329, "word": "Chick-pea", "pos_group": "noun", "row_number": 26271, "definition": "A Small leguminous plant (Cicer arietinum) of Asia Africa and the south of Europe; the chich; the dwarf pea; the gram.", "details": []}, {"x": -0.5486952698835454, "y": 0.3733865549123953, "z": 0.7480080089264259, "word": "Chickweed", "pos_group": "noun", "row_number": 26273, "definition": "The name of several caryophyllaceous weeds especially Stellaria media the seeds and flower buds of which are a favorite food of small birds.", "details": []}, {"x": -0.4359861808447433, "y": 0.307594371893083, "z": 0.8457551374317005, "word": "Chicory", "pos_group": "noun", "row_number": 26275, "definition": "A branching perennial plant (Cichorium Intybus) with bright blue flowers growing wild in Europe Asia and America; also cultivated for its roots and as a salad plant; succory; wild endive. See Endive.", "details": []}, {"x": -0.4593173135198527, "y": 0.448463840402239, "z": 0.766751452135945, "word": "Chiretta", "pos_group": "noun", "row_number": 26515, "definition": "A plant (Agathotes Chirayta) found in Northern India having medicinal properties to the gentian and esteemed as a tonic and febrifuge.", "details": []}, {"x": -0.5377654402385905, "y": 0.3064400639631696, "z": 0.7854316128621532, "word": "Chit", "pos_group": "noun", "row_number": 26576, "definition": "The embryo or the growing bud of a plant; a shoot; a sprout; as the chits of Indian corn or of potatoes.", "details": []}, {"x": -0.3986004817565423, "y": 0.3749509372017046, "z": 0.8369763740004946, "word": "Chive", "pos_group": "noun", "row_number": 26605, "definition": "A perennial plant (Allium Schoenoprasum) allied to the onion. The young leaves are used in omelets etc.", "details": []}, {"x": -0.5254130910859645, "y": 0.4160808503183029, "z": 0.7421710110977726, "word": "Chlorophyll", "pos_group": "noun", "row_number": 26656, "definition": "Literally leaf green; a green granular matter formed in the cells of the leaves (and other parts exposed to light) of plants to which they owe their green color and through which all ordinary assimilation of plant food takes place. Similar chlorophyll granules have been found in the tissues of the lower animals.", "details": []}, {"x": -0.477626961914837, "y": 0.2867446598231353, "z": 0.8304516754844423, "word": "Chlorosis", "pos_group": "noun", "row_number": 26660, "definition": "A disease in plants causing the flowers to turn green or the leaves to lose their normal green color.", "details": []}, {"x": -0.4211265083358525, "y": 0.436431926555727, "z": 0.7950972503157772, "word": "Chokeberry", "pos_group": "noun", "row_number": 26713, "definition": "The small apple-shaped or pear-shaped fruit of an American shrub (Pyrus arbutifolia) growing in damp thickets; also the shrub.", "details": []}, {"x": -0.5523710824278554, "y": 0.3450416071500142, "z": 0.7588362647059079, "word": "Chorion", "pos_group": "noun", "row_number": 26880, "definition": "The outer membrane of seeds of plants.", "details": []}, {"x": -0.4152444299623887, "y": 0.3299891467687347, "z": 0.8477495068710176, "word": "Chorisis", "pos_group": "noun", "row_number": 26881, "definition": "The separation of a leaf or floral organ into two more parts.", "details": []}, {"x": -0.486166196873817, "y": 0.4437361007489865, "z": 0.7528218261377218, "word": "Christ's-thorn", "pos_group": "noun", "row_number": 26991, "definition": "One of several prickly or thorny shrubs found in Palestine especially the Paliurus aculeatus Zizyphus Spina-Christi and Z. vulgaris. The last bears the fruit called jujube and may be considered to have been the most readily obtainable for the Crown of Thorns.", "details": []}, {"x": -0.5188288805420005, "y": 0.2909221889666132, "z": 0.8038537632445398, "word": "Chromatism", "pos_group": "noun", "row_number": 27001, "definition": "An abnormal coloring of plants.", "details": []}, {"x": -0.3995741387613853, "y": 0.4025257018688477, "z": 0.8235979401188961, "word": "Chromatophore", "pos_group": "noun", "row_number": 27006, "definition": "One of the granules of protoplasm which in mass give color to the part of the plant containing them.", "details": []}, {"x": -0.542859574650112, "y": 0.3908596069869048, "z": 0.7433251306371538, "word": "Chromule", "pos_group": "noun", "row_number": 27044, "definition": "A general name for coloring matter of plants other than chlorophyll especially that of petals.", "details": []}, {"x": -0.4508174930218239, "y": 0.2962863895031464, "z": 0.842008291752942, "word": "Chrysalid", "pos_group": "adjective", "row_number": 27082, "definition": "Pertaining to a chrysalis; resembling a chrysalis.", "details": []}, {"x": -0.4431380517852825, "y": 0.4475459974958621, "z": 0.7767440036365767, "word": "Chrysalides", "pos_group": "other", "row_number": 27085, "definition": "of Chrysalis", "details": []}, {"x": -0.5466518106051019, "y": 0.3190157914757665, "z": 0.7742097408010662, "word": "Chrysanthemum", "pos_group": "noun", "row_number": 27088, "definition": "A genus of composite plants mostly perennial and of many species including the many varieties of garden chrysanthemums (annual and perennial) and also the feverfew and the oxeye daisy.", "details": []}, {"x": -0.4015551325983468, "y": 0.357205697917982, "z": 0.8433015859458889, "word": "Chufa", "pos_group": "noun", "row_number": 27146, "definition": "A sedgelike plant (Cyperus esculentus) producing edible tubers native about the Mediterranean now cultivated in many regions; the earth almond.", "details": []}, {"x": -0.5120158690070692, "y": 0.4295685112822859, "z": 0.7438485356573986, "word": "Chulan", "pos_group": "noun", "row_number": 27153, "definition": "The fragrant flowers of the Chloranthus inconspicuus used in China for perfuming tea.", "details": []}, {"x": -0.4943033513902474, "y": 0.2845080503210862, "z": 0.8214130301540532, "word": "Cibol", "pos_group": "noun", "row_number": 27249, "definition": "A perennial alliaceous plant (Allium fistulosum) sometimes called Welsh onion. Its fistular leaves areused in cookery.", "details": []}, {"x": -0.4097979694476322, "y": 0.4261183698213901, "z": 0.80652883341971, "word": "Cicely", "pos_group": "noun", "row_number": 27270, "definition": "Any one of several umbelliferous plants of the genera Myrrhis Osmorrhiza etc.", "details": []}, {"x": -0.5522507489137409, "y": 0.3623975889881174, "z": 0.7507909814454432, "word": "Cichoraceous", "pos_group": "adjective", "row_number": 27277, "definition": "Belonging to or resembling a suborder of composite plants of which the chicory (Cichorium) is the type.", "details": []}, {"x": -0.4266326554787241, "y": 0.3145999970266192, "z": 0.8479454104775987, "word": "Cicuta", "pos_group": "noun", "row_number": 27286, "definition": "a genus of poisonous umbelliferous plants of which the water hemlock or cowbane is best known.", "details": []}, {"x": -0.4693438713414201, "y": 0.4489587746059194, "z": 0.7603633007573416, "word": "Cinchonaceous", "pos_group": "adjective", "row_number": 27337, "definition": "Allied or pertaining to cinchona or to the plants that produce it.", "details": []}, {"x": -0.5321129908618878, "y": 0.2985231435486466, "z": 0.7923002573026532, "word": "Cineraria", "pos_group": "noun", "row_number": 27358, "definition": "A Linnaean genus of free-flowering composite plants mostly from South Africa. Several species are cultivated for ornament.", "details": []}, {"x": -0.3966824673193111, "y": 0.3859721247416154, "z": 0.8328676599820086, "word": "Cinquefoil", "pos_group": "noun", "row_number": 27385, "definition": "The name of several different species of the genus Potentilla; -- also called five-finger because of the resemblance of its leaves to the fingers of the hand.", "details": []}, {"x": -0.5336858913146979, "y": 0.4075713409869562, "z": 0.7409891844134641, "word": "Cinura", "pos_group": "other", "row_number": 27391, "definition": "The group of Thysanura which includes Lepisma and allied forms; the bristletails. See Bristletail and Lepisma.", "details": []}, {"x": -0.4671162875862173, "y": 0.288097953228725, "z": 0.8359437440504534, "word": "Circinate", "pos_group": "adjective", "row_number": 27419, "definition": "Rolled together downward the tip occupying the center; -- a term used in reference to foliation or leafing as in ferns.", "details": []}, {"x": -0.4281364937908538, "y": 0.4427872368407377, "z": 0.7878061979798194, "word": "Circumnutation", "pos_group": "noun", "row_number": 27572, "definition": "The successive bowing or bending in different directions of the growing tip of the stems of many plants especially seen in climbing plants.", "details": []}, {"x": -0.5523305300223194, "y": 0.3341350922452687, "z": 0.7637307940207133, "word": "Cirriferous", "pos_group": "adjective", "row_number": 27659, "definition": "Bearing cirri as many plants and animals.", "details": []}, {"x": -0.408063737480449, "y": 0.339553891816829, "z": 0.8474592265740767, "word": "Cirriform", "pos_group": "adjective", "row_number": 27660, "definition": "Formed like a cirrus or tendril; -- said of appendages of both animals and plants.", "details": []}, {"x": -0.496586834244829, "y": 0.440370791203952, "z": 0.7479806697429446, "word": "Cirrose", "pos_group": "adjective", "row_number": 27667, "definition": "Bearing a tendril or tendrils; as a cirrose leaf.", "details": []}, {"x": -0.5104185968258136, "y": 0.2861406394572428, "z": 0.8109231717403121, "word": "Clavus", "pos_group": "noun", "row_number": 28086, "definition": "A callous growth esp. one the foot; a corn.", "details": []}, {"x": -0.4013324935706027, "y": 0.4127847070912876, "z": 0.8176435746680593, "word": "Claw", "pos_group": "noun", "row_number": 28092, "definition": "A slender appendage or process formed like a claw as the base of petals of the pink.", "details": []}, {"x": -0.5484675162508015, "y": 0.3803350968920562, "z": 0.7446667695619209, "word": "Claytonia", "pos_group": "noun", "row_number": 28115, "definition": "An American genus of perennial herbs with delicate blossoms; -- sometimes called spring beauty.", "details": []}, {"x": -0.4405586636733738, "y": 0.3013775065335404, "z": 0.8456238303276208, "word": "Cleavers", "pos_group": "noun", "row_number": 28231, "definition": "A species of Galium (G. Aparine) having a fruit set with hooked bristles which adhere to whatever they come in contact with; -- called also goose grass catchweed etc.", "details": []}, {"x": -0.4524452002501116, "y": 0.4504017741784105, "z": 0.7696957727489326, "word": "Cleistogamous", "pos_group": "adjective", "row_number": 28249, "definition": "Having beside the usual flowers other minute closed flowers without petals or with minute petals; -- said of certain species of plants which possess flowers of two or more kinds the closed ones being so constituted as to insure self-fertilization.", "details": []}, {"x": -0.5429681013977846, "y": 0.3095316773672073, "z": 0.7806252504055504, "word": "Clematis", "pos_group": "noun", "row_number": 28251, "definition": "A genus of flowering plants of many species mostly climbers having feathery styles which greatly enlarge in the fruit; -- called also virgin's bower.", "details": []}, {"x": -0.397451692057309, "y": 0.3681756058333027, "z": 0.8405229775265293, "word": "Climber", "pos_group": "noun", "row_number": 28390, "definition": "A plant that climbs.", "details": []}, {"x": -0.5215427070259316, "y": 0.4227044546857388, "z": 0.7411573036386375, "word": "Clinanthium", "pos_group": "noun", "row_number": 28395, "definition": "The receptacle of the flowers in a composite plant; -- also called clinium.", "details": []}, {"x": -0.484130596474024, "y": 0.2834839092752578, "z": 0.8278009656552251, "word": "Clove", "pos_group": "noun", "row_number": 28714, "definition": "A very pungent aromatic spice the unexpanded flower bud of the clove tree (Eugenia / Caryophullus aromatica) a native of the Molucca Isles.", "details": []}, {"x": -0.4150531596498447, "y": 0.4343349327290758, "z": 0.7994273205713638, "word": "Clove", "pos_group": "noun", "row_number": 28715, "definition": "One of the small bulbs developed in the axils of the scales of a large bulb as in the case of garlic.", "details": []}, {"x": -0.5544620191112677, "y": 0.3511249903470772, "z": 0.7545085224944921, "word": "Clover", "pos_group": "noun", "row_number": 28720, "definition": "A plant of different species of the genus Trifolium; as the common red clover T. pratense the white T. repens and the hare's foot T. arvense.", "details": []}, {"x": -0.4178857407149952, "y": 0.3228409242438577, "z": 0.8492027115715373, "word": "Clovered", "pos_group": "adjective", "row_number": 28721, "definition": "Covered with growing clover.", "details": []}, {"x": -0.4798210155755453, "y": 0.4479142381512478, "z": 0.754416747079119, "word": "Club-rush", "pos_group": "noun", "row_number": 28769, "definition": "A rushlike plant the reed mace or cat-tail or some species of the genus Scirpus. See Bulrush.", "details": []}, {"x": -0.5251880723198002, "y": 0.2916419203782457, "z": 0.7994513612291252, "word": "Coadunate", "pos_group": "adjective", "row_number": 28887, "definition": "United at the base as contiguous lobes of a leaf.", "details": []}, {"x": -0.3961917670529346, "y": 0.3970059833079878, "z": 0.8278999534588287, "word": "Cob", "pos_group": "noun", "row_number": 29019, "definition": "The axis on which the kernels of maize or indian corn grow.", "details": []}, {"x": -0.541125933083347, "y": 0.3980061424449451, "z": 0.7407927072540409, "word": "Cobaea", "pos_group": "noun", "row_number": 29035, "definition": "A genus of climbing plants native of Mexico and South America. C. scandens is a conservatory climber with large bell-shaped flowers.", "details": []}, {"x": -0.456405825055185, "y": 0.2909970169297113, "z": 0.8408415183574757, "word": "Cobnut", "pos_group": "noun", "row_number": 29064, "definition": "A large roundish variety of the cultivated hazelnut.", "details": []}, {"x": -0.4362753359891634, "y": 0.4479178464939615, "z": 0.7804059418019282, "word": "Coca", "pos_group": "noun", "row_number": 29081, "definition": "The dried leaf of a South American shrub (Erythroxylon Coca). In med. called Erythroxylon.", "details": []}, {"x": -0.5508237204540356, "y": 0.3234887348492922, "z": 0.7693817436167683, "word": "Coccobacterium", "pos_group": "noun", "row_number": 29088, "definition": "One of the round variety of bacteria a vegetable organism generally less than a thousandth of a millimeter in diameter.", "details": []}, {"x": -0.4019172582768351, "y": 0.3499609627208945, "z": 0.8461618297173988, "word": "Cocculus Indicus", "pos_group": "noun", "row_number": 29093, "definition": "The fruit or berry of the Anamirta Cocculus a climbing plant of the East Indies. It is a poisonous narcotic and stimulant.", "details": []}, {"x": -0.5069490468099996, "y": 0.4355016341522427, "z": 0.7438689337438142, "word": "Cochineal fig", "pos_group": "other", "row_number": 29103, "definition": "A plant of Central and Southern America of the Cactus family extensively cultivated for the sake of the cochineal insect which lives on it.", "details": []}, {"x": -0.5010590876091501, "y": 0.2827356726983047, "z": 0.8179244036633967, "word": "Cockamaroo", "pos_group": "noun", "row_number": 29143, "definition": "The Russian variety of bagatelle.", "details": []}, {"x": -0.4045506537735946, "y": 0.422517512567636, "z": 0.8110596279590143, "word": "Cockle", "pos_group": "noun", "row_number": 29188, "definition": "A plant or weed that grows among grain; the corn rose (Luchnis Githage).", "details": []}, {"x": -0.5528710869957045, "y": 0.3692090436949976, "z": 0.7470061868672931, "word": "Cocklebur", "pos_group": "noun", "row_number": 29190, "definition": "A coarse composite weed having a rough or prickly fruit; one of several species of the genus Xanthium; -- called also clotbur.", "details": []}, {"x": -0.4306160731210383, "y": 0.3078835495844961, "z": 0.8483970282038166, "word": "Cockscomb", "pos_group": "noun", "row_number": 29214, "definition": "A plant (Celosia cristata) of many varieties cultivated for its broad fantastic spikes of brilliant flowers; -- sometimes called garden cockscomb. Also the Pedicularis or lousewort the Rhinanthus Crista-galli and the Onobrychis Crista-galli.", "details": []}, {"x": -0.4624915473589804, "y": 0.4517712808083571, "z": 0.7628920490202217, "word": "Cockshead", "pos_group": "noun", "row_number": 29215, "definition": "A leguminous herb (Onobrychis Caput-galli) having small spiny-crested pods.", "details": []}, {"x": -0.5378766566170918, "y": 0.3008248460651828, "z": 0.7875234055291808, "word": "Coelospermous", "pos_group": "adjective", "row_number": 29312, "definition": "Hollow-seeded; having the ventral face of the seedlike carpels incurved at the ends as in coriander seed.", "details": []}, {"x": -0.3946862242527643, "y": 0. ", "details": []}, {"x": -0.5170890359039423, "y": 0.2859640384777352, "z": 0.8067487202626576, "word": "Colicroot", "pos_group": "noun", "row_number": 29659, "definition": "A bitter American herb of the Bloodwort family with the leaves all radical and the small yellow or white flowers in a long spike (Aletris farinosa and A. aurea). Called sometimes star grass blackroot blazing star and unicorn root.", "details": []}, {"x": -0.3971800598238203, "y": 0.4078318886412477, "z": 0.8221442395867402, "word": "Colocynth", "pos_group": "noun", "row_number": 29897, "definition": "The light spongy pulp of the fruit of the bitter cucumber (Citrullus / Cucumis colocynthis) an Asiatic plant allied to the watermelon; coloquintida. It comes in white balls is intensely bitter and a powerful cathartic. Called also bitter apple bitter cucumber bitter gourd.", "details": []}, {"x": -0.5475584876865202, "y": 0.387543096369851, "z": 0.7416131410772864, "word": "Colony", "pos_group": "noun", "row_number": 29926, "definition": "A number of animals or plants living or growing together beyond their usual range.", "details": []}, {"x": -0.4457017514743875, "y": 0.2954297117409264, "z": 0.8450273570443362, "word": "Coltsfoot", "pos_group": "noun", "row_number": 29995, "definition": "A perennial herb (Tussilago Farfara) whose leaves and rootstock are sometimes employed in medicine.", "details": []}, {"x": -0.4454136099213344, "y": 0.4516836760135935, "z": 0.773038532622852, "word": "Columbine", "pos_group": "noun", "row_number": 30020, "definition": "A plant of several species of the genus Aquilegia; as A. vulgaris or the common garden columbine; A. Canadensis the wild red columbine of North America.", "details": []}, {"x": -0.5478353096419084, "y": 0.3133214490399417, "z": 0.775697198061889, "word": "Columella", "pos_group": "noun", "row_number": 30026, "definition": "A columnlike axis in the capsules of mosses.", "details": []}, {"x": -0.3969571934067638, "y": 0.3610274514401595, "z": 0.8438 , "y": 0.2930905015166782, "z": 0.7947793769826075, "word": "Composite", "pos_group": "other", "row_number": 30954, "definition": "Belonging to the order Compositae; bearing involucrate heads of many small florets as the daisy thistle and dandelion.", "details": []}, {"x": -0.393352190486613, "y": 0.3909224574551433, "z": 0.8321380213021246, "word": "Conceptacle", "pos_group": "noun", "row_number": 31228, "definition": "A pericarp opening longitudinally on one side and having the seeds loose in it; a follicle; a double follicle or pair of follicles.", "details": []}, {"x": -0.5387040991343953, "y": 0.4052549510032749, "z": 0.7386246125489812, "word": "Conceptacle", "pos_group": "noun", "row_number": 31229, "definition": "One of the cases containing the spores etc. of flowerless plants especially of algae.", "details": []}, {"x": -0.4624659751510009, "y": 0.2861210443070052, "z": 0.8392019839301517, "word": "Concord", "pos_group": "noun", "row_number": 31406, "definition": "A variety of American grape with large dark blue (almost black) grapes in compact clusters.", "details": []}, {"x": -0.4294056977017281, "y": 0.4475781082252812, "z": 0.7844007800982674, "word": "Concupy", "pos_group": "noun", "row_number": 31478, "definition": "Concupiscence. [Used only in \"\"\"\"Troilus and Cressida\"\"\"\"]", "details": []}, {"x": -0.554534084970233, "y": 0.3285973752462204, "z": 0.7645362735590253, "word": "Conferva", "pos_group": "noun", "row_number": 31751, "definition": "Any unbranched slender green plant of the fresh-water algae. The word is frequently used in a wider sense.", "details": []}, {"x": -0.4029669753459812, "y": 0.342491055991465, "z": 0.8487152015525364, "word": "Conglobate", "pos_group": "adjective", "row_number": 32021, "definition": "Collected into or forming a rounded mass or ball; as the conglobate [lymphatic] glands; conglobate flowers.", "details": []}, {"x": -0.50133047035856, "y": 0.4411309780308884, "z": 0.7443596037612308, "word": "Conglomerate", "pos_group": "adjective", "row_number": 32033, "definition": "Closely crowded together; densly clustered; as conglomerate flowers.", "details": []}, {"x": -0.5079406529316068, "y": 0.2816365726229387, "z": 0.8140498351210552, "word": "Conglutin", "pos_group": "noun", "row_number": 32041, "definition": "A variety of vegetable casein resembling legumin and found in almonds rye wheat etc.", "details": []}, {"x": -0.3996700096630318, "y": 0.4182281278719864, "z": 0.815689350446998, "word": "Conidium", "pos_group": "noun", "row_number": 32119, "definition": "A peculiar kind of reproductive cell found in certain fungi and often containing zoospores.", "details": []}, {"x": -0.5528252086511096, "y": 0.3763622348578257, "z": 0.7434620076726719, "word": "Conium", "pos_group": "noun", "row_number": 32134, "definition": "A genus of biennial poisonous white-flowered umbelliferous plants bearing ribbed fruit (\"\"\"\"seeds\"\"\"\") and decompound leaves.", "details": []}, {"x": -0.4352151020085477, "y": 0.3013522385819752, "z": 0.8483953343137395, "word": "Conium", "pos_group": "noun", "row_number": 32135, "definition": "The common hemlock (Conium maculatum poison hemlock spotted hemlock poison parsley) a roadside weed of Europe Asia and America cultivated in the United States for medicinal purpose. It is an active poison. The leaves and fruit are used in medicine.", "details": []}, {"x": -0.4553983271336909, "y": 0.4539691643399254, "z": 0.7658487849911011, "word": "Connate", "pos_group": "adjective", "row_number": 32224, "definition": "Congenitally united; growing from one base or united at their bases; united into one body; as connate leaves or athers. See Illust. of Connate-perfoliate.", "details": []}, {"x": -0.5433798676517599, "y": 0.303847646235545, "z": 0.7825694392882174, "word": "Connate-perfoliate", "pos_group": "adjective", "row_number": 32225, "definition": "Connate or coalescent at the base so as to produce a broad foliaceous body through the center of which the stem passes; -- applied to leaves as the leaves of the boneset.", "details": []}, {"x": -0.3933151759597973, "y": 0.372552559234923, "z": 0.8405401614243205, "word": "Conservatory", "pos_group": "noun", "row_number": 32424, "definition": "A place for preserving anything from loss decay waste or injury; particulary a greenhouse for preserving exotic or tender plants.", "details": []}, {"x": -0.5266614357717492, "y": 0.4214860833634258, "z": 0.7382257199541334, "word": "Consolidation", "pos_group": "noun", "row_number": 32553, "definition": "To organic cohesion of different circled in a flower; adnation.", "details": []}, {"x": -0.480138661034267, "y": 0.2804599068045698, "z": 0.831149268696901, "word": "Consound", "pos_group": "noun", "row_number": 32589, "definition": "A name applied loosely to several plants of different genera esp. the comfrey.", "details": []}, {"x": -0.4152500666076507, "y": 0.4395730530754934, "z": 0.7964564728798625, "word": "Contorted", "pos_group": "adjective", "row_number": 33047, "definition": "Twisted back upon itself as some parts of plants.", "details": []}, {"x": -0.557589907356037, "y": 0.3459747633328656, "z": 0.7545826385171166, "word": "Contrayerva", "pos_group": "noun", "row_number": 33191, "definition": "A species of Dorstenia (D. Contrayerva) a South American plant the aromatic root of which is sometimes used in medicine as a gentle stimulant and tonic.", "details": []}, {"x": -0.4124974662531739, "y": 0.3247587393939161, "z": 0.8511037548513026, "word": "Convallaria", "pos_group": "noun", "row_number": 33303, "definition": "The lily of the valley.", "details": []}, {"x": -0.4840703364923492, "y": 0.4497915785382917, "z": 0.7505754094054877, "word": "Conventional", "pos_group": "adjective", "row_number": 33350, "definition": "Abstracted; removed from close representation of nature by the deliberate selection of what is to be represented and what is to be rejected; as a conventional flower; a conventional shell. Cf. Conventionalize v. t.", "details": []}, {"x": -0.5237316084765953, "y": 0.2865087080598136, "z": 0.802258039840309, "word": "Convolute", "pos_group": "adjective", "row_number": 33532, "definition": "Rolled or wound together one part upon another; -- said of the leaves of plants in aestivation.", "details": []}, {"x": -0.3935161154551919, "y": 0.4022605392261155, "z": 0.8266386910002285, "word": "Convolvulaceous", "pos_group": "adjective", "row_number": 33541, "definition": "Of pertaining to or resembling the family of plants of which the bindweed and the morning-glory are common examples.", "details": []}, {"x": -0.5459573858300509, "y": 0.3949416320186362, "z": 0.7388854039403356, "word": "Convolvulus", "pos_group": "noun", "row_number": 33545, "definition": "A large genus of plants having monopetalous flowers including the common bindweed (C. arwensis) and formerly the morning-glory but this is now transferred to the genus Ipomaea.", "details": []}, {"x": -0.4513767201096971, "y": 0.2898199497571266, "z": 0.8439570209825785, "word": "Coontie", "pos_group": "noun", "row_number": 33633, "definition": "A cycadaceous plant of Florida and the West Indies the Zamia integrifolia from the stems of which a kind of sago is prepared.", "details": []}, {"x": -0.4382904294815095, "y": 0.4522767837855876, "z": 0.7767542792115658, "word": "Coquelicot", "pos_group": "noun", "row_number": 33832, "definition": "The wild poppy or red corn rose.", "details": []}, {"x": -0.5523056964683193, "y": 0.3177887300264125, "z": 0.7706936750206561, "word": "Coquelicot", "pos_group": "noun", "row_number": 33833, "definition": "The color of the wild poppy; a color nearly red like orange mixed with scarlet.", "details": []}, {"x": -0.3971395860283461, "y": 0.3535696727820664, "z": 0.8469171362642369, "word": "Coralline", "pos_group": "noun", "row_number": 33869, "definition": "A submarine semicalcareous or calcareous plant consisting of many jointed branches.", "details": []}, {"x": -0.5119436259006765, "y": 0. 9214421, "word": "Cormophyta", "pos_group": "other", "row_number": 34021, "definition": "A term proposed by Endlicher to include all plants with an axis containing vascular tissue and with foliage.", "details": []}, {"x": -0.5355985702808174, "y": 0.4125329953567077, "z": 0.7368518842041234, "word": "Cormus", "pos_group": "noun", "row_number": 34026, "definition": "A vegetable or animal made up of a number of individuals such as for example would be formed by a process of budding from a parent stalk wherre the buds remain attached.", "details": []}, {"x": -0.4689475267942266, "y": 0.2817198885313274, "z": 0.837091465444174, "word": "Corn", "pos_group": "noun", "row_number": 34028, "definition": "A single seed of certain plants as wheat rye barley and maize; a grain.", "details": []}, {"x": -0.4225989689729819, "y": 0.4465092614980364, "z": 0.7886948654704498, "word": "Corn", "pos_group": "noun", "row_number": 34030, "definition": "The plants which produce corn when growing in the field; the stalks and ears or the stalks ears and seeds after reaping and before thrashing.", "details": []}, {"x": -0.5577303592456649, "y": 0.3343061365193994, "z": 0.7597211682329078, "word": "Cornbind", "pos_group": "noun", "row_number": 34040, "definition": "A weed that binds stalks of corn as Convolvulus arvensis Polygonum Convolvulus.", "details": []}, {"x": -0.4047119291093921, "y": 0.3348659460227972, "z": 0.8509248219618532, "word": "Corncob", "pos_group": "noun", "row_number": 34041, "definition": "The cob or axis on which the kernels of Indian corn grow.", "details": []}, {"x": -0.4952014049682491, "y": 0.44638895919576, "z": 0.7453270863356557, "word": "Cornel", "pos_group": "noun", "row_number": 34050, "definition": "The cornelian cherry (Cornus Mas) a European shrub with clusters of small greenish flowers followed by very acid but edible drupes resembling cherries.", "details": []}, {"x": -0.5148795654041637, "y": 0.2812404307531664, "z": 0.8098165553006391, "word": "Cornel", "pos_group": "noun", "row_number": 34051, "definition": "Any species of the genus Cornus as C. florida the flowering cornel; C. stolonifera the osier cornel; C. Canadensis the dwarf cornel or bunchberry.", "details": []}, {"x": -0.3952157406700025, "y": 0.4132740311561778, "z": 0.820371314404998, "word": "Cornflower", "pos_group": "noun", "row_number": 34090, "definition": "A conspicuous wild flower (Centaurea Cyanus) growing in grainfields.", "details": []}, {"x": -0.5520935646278856, "y": 0.3837923747508942, "z": 0.740200046595205, "word": "Cornshuck", "pos_group": "noun", "row_number": 34120, "definition": "The husk covering an ear of Indian corn.", "details": []}, {"x": -0.4403988683300333, "y": 0.2950777685380554, "z": 0.847925673209762, "word": "Cornstalk", "pos_group": "noun", "row_number": 34121, "definition": "A stalk of Indian corn.", "details": []}, {"x": -0.448129274313212, "y": 0.455511489439092, "z": 0.7692135181420656, "word": "Cornucopia", "pos_group": "noun", "row_number": 34128, "definition": "The horn of plenty from which fruits and flowers are represented as issuing. It is an emblem of abundance.", "details": []}, {"x": -0.548557569665644, "y": 0.3075802009995836, "z": 0.7774824838641561, "word": "Cornucopia", "pos_group": "noun", "row_number": 34129, "definition": "A genus of grasses bearing spikes of flowers resembling the cornucopia in form.", "details": []}, {"x": -0.3926001772476692, "y": 0.3652283130948916, "z": 0.8440813824146095, "word": "Corolla", "pos_group": "noun", "row_number": 34143, "definition": "The inner envelope of a flower; the part which surrounds the organs of fructification consisting of one or more leaves called petals. It is usually distinguished from the calyx by the fineness of its texture and the gayness of its colors. See the Note under Blossom.", "details": []}, {"x": -0.5221773624654951, "y": 0.4282789143521776, "z": 0.7375011685752769, "word": "Corollet", "pos_group": "noun", "row_number": 34150, "definition": "A floret in an aggregate flower.", "details": []}, {"x": -0.487113982925072, "y": 0.2774984443825872, "z": 0.8280788495089805, "word": "Corolliflorous", "pos_group": "adjective", "row_number": 34152, "definition": "Having the stamens borne on the petals and the latter free from the calyx. Compare Calycifloral and Thalamifloral.", "details": []}, {"x": -0.4090951398018893, "y": 0.4368665002373803, "z": 0.8011172370888145, "word": "Coronilla", "pos_group": "noun", "row_number": 34195, "definition": "A genus of plants related to the clover having their flowers arranged in little heads or tufts resembling coronets.", "details": []}, {"x": -0.5593305861457972, "y": 0.3526579362508242, "z": 0.7501877600981691, "word": "Coronule", "pos_group": "noun", "row_number": 34199, "definition": "A coronet or little crown of a seed; the downy tuft on seeds. See Pappus.", "details": []}, {"x": -0.4157369741754177, "y": 0.3173359135976275, "z": 0.8523266311952401, "word": "Corymb", "pos_group": "noun", "row_number": 34475, "definition": "A flat-topped or convex cluster of flowers each on its own footstalk and arising from different points of a common axis the outermost blossoms expanding first as in the hawthorn.", "details": []}, {"x": -0.4771940739983912, "y": 0.4537758182928121, "z": 0.7525777849986716, "word": "Corymb", "pos_group": "noun", "row_number": 34476, "definition": "Any flattish flower cluster whatever be the order of blooming or a similar shaped cluster of fruit.", "details": []}, {"x": -0.5302765644507552, "y": 0.2877888684810132, "z": 0.7974862584225023, "word": "Corymbiferous", "pos_group": "adjective", "row_number": 34478, "definition": "Bearing corymbs of flowers or fruit.", "details": []}, {"x": -0.3903909982719966, "y": 0.3961091005778453, "z": 0.8310790870354063, "word": "Cosmopolite", "pos_group": "adjective", "row_number": 34544, "definition": "Common everywhere; widely spread; found in all parts of the world.", "details": []}, {"x": -0.5436597387578129, "y": 0.
