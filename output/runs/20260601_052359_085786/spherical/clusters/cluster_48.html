y used in confectionery perfumery etc.", "details": []}, {"x": -0.6249282788827933, "y": 0.2450148728350757, "z": 0.741237045986101, "word": "Vaporous", "pos_group": "adjective", "row_number": 167876, "definition": "Producing vapors; hence windy; flatulent.", "details": []}, {"x": -0.2987322724979705, "y": 0.3485663115836424, "z": 0.8884033744854718, "word": "Variegated", "pos_group": "adjective", "row_number": 167926, "definition": "Having marks or patches of different colors; as variegated leaves or flowers.", "details": []}, {"x": -0.5584779809956402, "y": 0.4954664719508397, "z": 0.6652934088923632, "word": "Vascular", "pos_group": "adjective", "row_number": 167999, "definition": "Of or pertaining to the higher division of plants that is the phaenogamous plants all of which are vascular in distinction from the cryptogams which to a large extent are cellular only.", "details": []}, {"x": -0.5016469058409105, "y": 0.1752057339389712, "z": 0.8471442218743791, "word": "Vase", "pos_group": "noun", "row_number": 168009, "definition": "The calyx of a plant.", "details": []}, {"x": -0.3256380335172946, "y": 0.5006247543708587, "z": 0.8020814961324733, "word": "Vase-shaped", "pos_group": "adjective", "row_number": 168011, "definition": "Formed like a vase or like a common flowerpot.", "details": []}, {"x": -0.6420810087881931, "y": 0.3409937390466239, "z": 0.6866259885006823, "word": "Vaulted", "pos_group": "adjective", "row_number": 168086, "definition": "Arched like the roof of the mouth as the upper lip of many ringent flowers.", "details": []}, {"x": -0.3513926692361158, "y": 0.2509197897521016, "z": 0.9019769681748414, "word": "Vegetable", "pos_group": "verb", "row_number": 168133, "definition": "Of or pertaining to plants; having the nature of or produced by plants; as a vegetable nature; vegetable growths juices etc.", "details": []}, {"x": -0.4635987671575328, "y": 0.5434450625116998, "z": 0.6998168668456559, "word": "Vegetable", "pos_group": "verb", "row_number": 168134, "definition": "Consisting of or comprising plants; as the vegetable kingdom.", "details": []}, {"x": -0.5888637417543116, "y": 0.2020763288132633, "z": 0.7825628734999286, "word": "Vegetable", "pos_group": "verb", "row_number": 168135, "definition": "Plants having distinct flowers and true seeds.", "details": []}, {"x": -0.2918545705358117, "y": 0.4129607187237832, "z": 0.8627191631397167, "word": "Vegetable", "pos_group": "verb", "row_number": 168136, "definition": "Plants without true flowers and reproduced by minute spores of various kinds or by simple cell division.", "details": []}, {"x": -0.6046178203574322, "y": 0.4433772244163349, "z": 0.6617053182309288, "word": "Vegetable", "pos_group": "noun", "row_number": 168137, "definition": "A plant. See Plant.", "details": []}, {"x": -0.4403927827202191, "y": 0.1875602350918173, "z": 0.8779950769453346, "word": "Vegetable", "pos_group": "noun", "row_number": 168138, "definition": "A plant used or cultivated for food for man or domestic animals as the cabbage turnip potato bean dandelion etc.; also the edible part of such a plant as prepared for market or the table.", "details": []}, {"x": -0.3697521473463117, "y": 0.5344454721073253, "z": 0.7600338064038793, "word": "Vegetal", "pos_group": "adjective", "row_number": 168139, "definition": "Of or pertaining to vegetables or the vegetable kingdom; of the nature of a vegetable; vegetable.", "details": []}, {"x": -0.6382071530297369, "y": 0.2786900418537698, "z": 0.7176513710662178, "word": "Vegetality", "pos_group": "noun", "row_number": 168143, "definition": "The quality or state of being vegetal or exhibiting those physiological phenomena which are common to plants and animals. See Vegetal a. 2.", "details": []}, {"x": -0.3128997490530242, "y": 0.3089228359538862, "z": 0.8981427661951984, "word": "Vegetate", "pos_group": "other", "row_number": 168149, "definition": "To grow as plants by nutriment imbibed by means of roots and leaves; to start into growth; to sprout; to germinate.", "details": []}, {"x": -0.5241695047816022, "y": 0.5201536388084249, "z": 0.6743044729878073, "word": "Vegetation", "pos_group": "noun", "row_number": 168152, "definition": "The act or process of vegetating or growing as a plant does; vegetable growth.", "details": []}, {"x": -0.5379492056001802, "y": 0.1783485721900671, "z": 0.8238946771231741, "word": "Vegetation", "pos_group": "noun", "row_number": 168153, "definition": "The sum of vegetable life; vegetables or plants in general; as luxuriant vegetation.", "details": []}, {"x": -0.3062831259567581, "y": 0.471194872339135, "z": 0.8271433001816934, "word": "Vegetative", "pos_group": "adjective", "row_number": 168156, "definition": "Having the power to produce growth in plants; as the vegetative properties of soil.", "details": []}, {"x": -0.6341862156178816, "y": 0.3811576648198995, "z": 0.6727010320114803, "word": "Vegetive", "pos_group": "adjective", "row_number": 168159, "definition": "Having the nature of a plant; vegetable; as vegetive life.", "details": []}, {"x": -0.3822683258623135, "y": 0.2210185840229621, "z": 0.897230022100748, "word": "Veil", "pos_group": "noun", "row_number": 168182, "definition": "The calyptra of mosses.", "details": []}, {"x": -0.4258264591068139, "y": 0.547272216100138, "z": 0.72053101821462, "word": "Veinless", "pos_group": "adjective", "row_number": 168207, "definition": "Having no veins; as a veinless leaf.", "details": []}, {"x": -0.613561946653645, "y": 0.2262415198966993, "z": 0.7565424722336618, "word": "Velarium", "pos_group": "noun", "row_number": 168215, "definition": "The marginal membrane of certain medusae belonging to the Discophora.", "details": []}, {"x": -0.2930799804985153, "y": 0.3733900661085735, "z": 0.8801613395068116, "word": "Velutinous", "pos_group": "adjective", "row_number": 168254, "definition": "Having the surface covered with a fine and dense silky pubescence; velvety; as a velutinous leaf.", "details": []}, {"x": -0.577975604709851, "y": 0.4774697657877638, "z": 0.6617906187903088, "word": "Velvetleaf", "pos_group": "noun", "row_number": 168265, "definition": "A name given to several plants which have soft velvety leaves as the Abutilon Avicennae the Cissampelos Pareira and the Lavatera arborea and even the common mullein.", "details": []}, {"x": -0.478333602144111, "y": 0.1767577696079321, "z": 0.8602055893465635, "word": "Venerean", "pos_group": "adjective", "row_number": 168335, "definition": "Devoted to the offices of Venus or love; venereal.", "details": []}, {"x": -0.3403120112867098, "y": 0.5161761202617584, "z": 0.7859707041903744, "word": "Venous", "pos_group": "adjective", "row_number": 168374, "definition": "Marked with veins; veined; as a venous leaf.", "details": []}, {"x": -0.6435486031087596, "y": 0.3163421342295712, "z": 0.696974066625039, "word": "Ventral", "pos_group": "adjective", "row_number": 168426, "definition": "Of or pertaining to the lower side or surface of a creeping moss or other low flowerless plant. Opposed to dorsal.", "details": []}, {"x": -0.3343407925737768, "y": 0.2715626746106928, "z": 0.9024798879639512, "word": "Veratralbine", "pos_group": "noun", "row_number": 168480, "definition": "A yellowish amorphous alkaloid extracted from the rootstock of Veratrum album.", "details": []}, {"x": -0.4870726892532953, "y": 0.5374949748185878, "z": 0.6883744238627175, "word": "Veratric", "pos_group": "adjective", "row_number": 168483, "definition": "Pertaining to or derived from plants of the genus Veratrum.", "details": []}, {"x": -0.5710884888592482, "y": 0.1900421564089145, "z": 0.798587450865533, "word": "Veratrine", "pos_group": "noun", "row_number": 168485, "definition": "A poisonous alkaloid obtained from the root hellebore (Veratrum) and from sabadilla seeds as a white crystalline powder having an acrid burning taste. It is sometimes used externally as in ointments in the local treatment of neuralgia and rheumatism. Called also veratria and veratrina.", "details": []}, {"x": -0.2943826842296064, "y": 0.436501106691589, "z": 0.8501797569236696, "word": "Veratrum", "pos_group": "noun", "row_number": 168487, "definition": "A genus of coarse liliaceous herbs having very poisonous qualities.", "details": []}, {"x": -0.6184604608043991, "y": 0.4205323094685383, "z": 0.663821689246945, "word": "Verbena", "pos_group": "noun", "row_number": 168510, "definition": "A genus of herbaceous plants of which several species are extensively cultivated for the great beauty of their flowers; vervain.", "details": []}, {"x": -0.4172376113549878, "y": 0.1975469735167667, "z": 0.887067059993296, "word": "Verbenaceous", "pos_group": "adjective", "row_number": 168511, "definition": "Of or pertaining to a natural order (Verbenaceae) of gamopetalous plants of which Verbena is the type. The order includes also the black and white mangroves and many plants noted for medicinal use or for beauty of bloom.", "details": []}, {"x": -0.389849553612728, "y": 0.5424056002063172, "z": 0.7441864621267854, "word": "Verdant", "pos_group": "adjective", "row_number": 168527, "definition": "Covered with growing plants or grass; green; fresh; flourishing; as verdant fields; a verdant lawn.", "details": []}, {"x": -0.6315172345718401, "y": 0.2567980984589361, "z": 0.7316014755771139, "word": "Verdoy", "pos_group": "adjective", "row_number": 168546, "definition": "Charged with leaves fruits flowers etc.; -- said of a border.", "details": []}, {"x": -0.3024549310291369, "y": 0.333088798760554, "z": 0.893069351638724, "word": "Verdurous", "pos_group": "adjective", "row_number": 168550, "definition": "Covered with verdure; clothed with the fresh green of vegetation; verdured; verdant; as verdurous pastures.", "details": []}, {"x": -0.5460581777492011, "y": 0.5062466923231218, "z": 0.6674838972028614, "word": "Vermeil", "pos_group": "noun", "row_number": 168609, "definition": "Vermilion; also the color of vermilion a bright beautiful red.", "details": []}, {"x": -0.5159031805918112, "y": 0.1745263994421118, "z": 0.8386801798975732, "word": "Vermilion", "pos_group": "noun", "row_number": 168644, "definition": "Hence a red color like the pigment; a lively and brilliant red; as cheeks of vermilion.", "details": []}, {"x": -0.3166962187670468, "y": 0.4905820604144504, "z": 0.8118083191358458, "word": "Verminate", "pos_group": "other", "row_number": 168650, "definition": "To breed vermin.", "details": []}, {"x": -0.6406708437995087, "y": 0.3562241976253461, "z": 0.6801802635562163, "word": "Vermination", "pos_group": "noun", "row_number": 168651, "definition": "The generation or breeding of vermin.", "details": []}, {"x": -0.3620787089589818, "y": 0.2382402978579174, "z": 0.9011884203623388, "word": "Vernal", "pos_group": "adjective", "row_number": 168669, "definition": "Of or pertaining to the spring; appearing in the spring; as vernal bloom.", "details": []}, {"x": -0.448909968935048, "y": 0.5466502008749085, "z": 0.7068616538433505, "word": "Vernonin", "pos_group": "noun", "row_number": 168681, "definition": "A glucoside extracted from the root of a South African plant of the genus Vernonia as a deliquescent powder and used as a mild heart tonic.", "details": []}, {"x": -0.5995012442800816, "y": 0.2097708668409403, "z": 0.7723952624993468, "word": "Veronica", "pos_group": "noun", "row_number": 168685, "definition": "A genus scrophulariaceous plants; the speedwell. See Speedwell.", "details": []}, {"x": -0.2905198591624379, "y": 0.3981444907888098, "z": 0.870102968554157, "word": "Verruculose", "pos_group": "adjective", "row_number": 168693, "definition": "Minutely verrucose; as a verruculose leaf or stalk.", "details": []}, {"x": -0.5956075983814302, "y": 0.4572720124592862, "z": 0.660419484397409, "word": "Verticil", "pos_group": "noun", "row_number": 168784, "definition": "A circle either of leaves or flowers about a stem at the same node; a whorl.", "details": []}, {"x": -0.4546790612606775, "y": 0.1816256993241601, "z": 0.8719398239535335, "word": "Verticillaster", "pos_group": "adjective", "row_number": 168785, "definition": "A whorl of flowers apparently of one cluster but composed of two opposite axillary cymes as in mint. See Illust. of Whorl.", "details": []}, {"x": -0.3573555565957467, "y": 0.5290383859276034, "z": 0.7696852554033112, "word": "Verticillated", "pos_group": "adjective", "row_number": 168787, "definition": "Arranged in a transverse whorl or whorls like the rays of a wheel; as verticillate leaves of a plant; a verticillate shell.", "details": []}, {"x": -0.6418625701627743, "y": 0.2923400807078707, "z": 0.7089074116101153, "word": "Vervain", "pos_group": "noun", "row_number": 168803, "definition": "Any plant of the genus Verbena.", "details": []}, {"x": -0.319570250809936, "y": 0.2939374329254192, "z": 0.9008194271453572, "word": "Vesicle", "pos_group": "noun", "row_number": 168821, "definition": "A small bladderlike body in the substance of vegetable or upon the surface of a leaf.", "details": []}, {"x": -0.510336331019477, "y": 0.5283407462648794, "z": 0.678537312959169, "word": "Vesicular", "pos_group": "adjective", "row_number": 168833, "definition": "Containing or composed of vesicles or vesiclelike structures; covered with vesicles or bladders; vesiculate; as vesicular coral; vesicular lava; a vesicular leaf.", "details": []}, {"x": -0.5513414774204721, "y": 0.1810016856172366, "z": 0.814408352781042, "word": "Vetch", "pos_group": "noun", "row_number": 168918, "definition": "Any leguminous plant of the genus Vicia some species of which are valuable for fodder. The common species is V. sativa.", "details": []}, {"x": -0.3000295065094851, "y": 0.4588310037666201, "z": 0.8363351034162029, "word": "Vetchling", "pos_group": "noun", "row_number": 168919, "definition": "Any small leguminous plant of the genus Lathyrus especially L. Nissolia.", "details": []}, {"x": -0.629675507463188, "y": 0.396478326307894, "z": 0.6680671314090131, "word": "Vetiver", "pos_group": "noun", "row_number": 168927, "definition": "An East Indian grass (Andropogon muricatus); also its fragrant roots which are much used for making mats and screens. Also called kuskus and khuskhus.", "details": []}, {"x": -0.3948385325462364, "y": 0.2105279562240934, "z": 0.8943044855444039, "word": "Vexillary", "pos_group": "other", "row_number": 168960, "definition": "Of or pertaining to the vexillum or upper petal of papilionaceous flowers.", "details": []}, {"x": -0.4114601810104678, "y": 0.5471587862507908, "z": 0.7289154834899547, "word": "Vexillum", "pos_group": "noun", "row_number": 168968, "definition": "The upper petal of a papilionaceous flower; the standard.", "details": []}, {"x": -0.6218391284057456, "y": 0.2366412514831314, "z": 0.7465366812689649, "word": "Viburnum", "pos_group": "noun", "row_number": 169026, "definition": "A genus of shrubs having opposite petiolate leaves and cymose flowers several species of which are cultivated as ornamental as the laurestine and the guelder-rose.", "details": []}, {"x": -0.2949040234480753, "y": 0.3579034780613947, "z": 0.8859665441458239, "word": "Victoria", "pos_group": "noun", "row_number": 169104, "definition": "A genus of aquatic plants named in honor of Queen Victoria. The Victoria regia is a native of Guiana and Brazil. Its large spreading leaves are often over five feet in diameter and have a rim from three to five inches high; its immense rose-white flowers sometimes attain a diameter of nearly two feet.", "details": []}, {"x": -0.5666675512066557, "y": 0.4896473718310343, "z": 0.6626713647566288, "word": "Vignette", "pos_group": "noun", "row_number": 169193, "definition": "A running ornament consisting of leaves and tendrils used in Gothic architecture.", "details": []}, {"x": -0.4928494174687222, "y": 0.174026556880927, "z": 0.852533992988497, "word": "Vigor", "pos_group": "noun", "row_number": 169198, "definition": "Strength or force in animal or force in animal or vegetable nature or action; as a plant grows with vigor.", "details": []}, {"x": -0.3298754455507278, "y": 0.5077621248644617, "z": 0.7958390634894945, "word": "Villus", "pos_group": "noun", "row_number": 169272, "definition": "Fine hairs on plants resembling the pile of velvet.", "details": []}, {"x": -0.6440836166238144, "y": 0.3312229436889566, "z": 0.6895271251885667, "word": "Vincetoxin", "pos_group": "noun", "row_number": 169290, "definition": "A glucoside extracted from the root of the white swallowwort (Vincetoxicum officinale a plant of the Asclepias family) as a bitter yellow amorphous substance; -- called also asclepiadin and cynanchin.", "details": []}, {"x": -0.3436531343025181, "y": 0.2577698189542329, "z": 0.903026712628346, "word": "Vine", "pos_group": "noun", "row_number": 169323, "definition": "Hence a climbing or trailing plant; the long slender stem of any plant that trails on the ground or climbs by winding round a fixed object or by seizing anything with its tendrils or claspers; a creeper; as the hop vine; the bean vine; the vines of melons squashes pumpkins and other cucurbitaceous plants.", "details": []}, {"x": -0.4724643926992333, "y": 0.5426921074404748, "z": 0.6944513475781878, "word": "Vined", "pos_group": "adjective", "row_number": 169326, "definition": "Having leaves like those of the vine; ornamented with vine leaves.", "details": []}, {"x": -0.5829814867261004, "y": 0.1959124176112129, "z": 0.7885118329868965, "word": "Viola", "pos_group": "noun", "row_number": 169364, "definition": "A genus of polypetalous herbaceous plants including all kinds of violets.", "details": []}, {"x": -0.2911158010636182, "y": 0.4223830970716664, "z": 0.8583962428151902, "word": "Violaceous", "pos_group": "adjective", "row_number": 169367, "definition": "Resembling violets in color; bluish purple.", "details": []}, {"x": -0.6110443394172497, "y": 0.4352221800668169, "z": 0.6612159021409149, "word": "Violaceous", "pos_group": "adjective", "row_number": 169368, "definition": "Of or pertaining to a natural order of plants of which the violet is the type. It contains about twenty genera and two hundred and fifty species.", "details": []}, {"x": -0.4311055582987468, "y": 0.18974141928222, "z": 0.8821259498578957, "word": "Violescent", "pos_group": "adjective", "row_number": 169398, "definition": "Tending to a violet color; violascent.", "details": []}, {"x": -0.376475539975543, "y": 0.5389629348814082, "z": 0.7535151774344974, "word": "Violet", "pos_group": "noun", "row_number": 169399, "definition": "Any plant or flower of the genus Viola of many species. The violets are generally low herbaceous plants and the flowers of many of the species are blue while others are white or yellow or of several colors as the pansy (Viola tricolor).", "details": []}, {"x": -0.6370328733225679, "y": 0.2694224055287959, "z": 0.7222192781319744, "word": "Viridity", "pos_group": "noun", "row_number": 169471, "definition": "Greenness; verdure; the color of grass and foliage.", "details": []}, {"x": -0.3073595615138958, "y": 0.3176513921280394, "z": 0.8970104196859165, "word": "Viscum", "pos_group": "noun", "row_number": 169558, "definition": "A genus of parasitic shrubs including the mistletoe of Europe.", "details": []}, {"x": -0.5329689190136597, "y": 0.5161266085684476, "z": 0.6704904587636152, "word": "Vitellin", "pos_group": "noun", "row_number": 169651, "definition": "An albuminous body belonging to the class of globulins obtained from yolk of egg of which it is the chief proteid constituent and from the seeds of many plants. From the latter it can be separated in crystalline form.", "details": []}, {"x": -0.529964741500079, "y": 0.1751349627571277, "z": 0.829737981284944, "word": "Vitis", "pos_group": "noun", "row_number": 169672, "definition": "A genus of plants including all true grapevines.", "details": []}, {"x": -0.3087114385825226, "y": 0.4795405726922143, "z": 0.8214244255135906, "word": "Vitta", "pos_group": "noun", "row_number": 169714, "definition": "One of the oil tubes in the fruit of umbelliferous plants.", "details": []}, {"x": -0.6380441347614169, "y": 0.3716396777640848, "z": 0.6743764764639721, "word": "Vivacious", "pos_group": "adjective", "row_number": 169728, "definition": "Living through the winter or from year to year; perennial.", "details": []}, {"x": -0.3736019316668306, "y": 0.226287153046099, "z": 0.8995641839363683, "word": "Viviparous", "pos_group": "adjective", "row_number": 169765, "definition": "Producing young in a living state as most mammals or as those plants the offspring of which are produced alive either by bulbs instead of seeds or by the seeds themselves germinating on the plant instead of falling as they usually do; -- opposed to oviparous.", "details": []}, {"x": -0.4342035084363418, "y": 0.5485991456784363, "z": 0.7144972292615704, "word": "Voluble", "pos_group": "adjective", "row_number": 169993, "definition": "Having the power or habit of turning or twining; as the voluble stem of hop plants.", "details": []}, {"x": -0.6093275929385011, "y": 0.2185917700600659, "z": 0.7621925757613884, "word": "Volva", "pos_group": "noun", "row_number": 170051, "definition": "A saclike envelope of certain fungi which bursts open as the plant develops.", "details": []}, {"x": -0.2903993909229947, "y": 0.3829237002022751, "z": 0.8769479081307805, "word": "Vorticellas", "pos_group": "other", "row_number": 170095, "definition": "of Vorticella", "details": []}, {"x": -0.5856180882318586, "y": 0.4706369728038807, "z": 0.6599638585298914, "word": "Vorticellae", "pos_group": "other", "row_number": 170096, "definition": "of Vorticella", "details": []}, {"x": -0.469195316256094, "y": 0.1768774402805483, "z": 0.8651994719850129, "word": "Wake-robin", "pos_group": "noun", "row_number": 170481, "definition": "Any plant of the genus Arum especially in England the cuckoopint (Arum maculatum).", "details": []}, {"x": -0.3455995458844086, "y": 0.5224118068236854, "z": 0.7795170671484384, "word": "Wallflower", "pos_group": "noun", "row_number": 170558, "definition": "A perennial cruciferous plant (Cheiranthus Cheiri) with sweet-scented flowers varying in color from yellow to orange and deep red. In Europe it very common on old walls.", "details": []}, {"x": -0.6443433717914206, "y": 0.3066022983853759, "z": 0.7005830784805382, "word": "Wanhorn", "pos_group": "noun", "row_number": 170647, "definition": "An East Indian plant (Kaempferia Galanga) of the Ginger family. See Galanga.", "details": []}, {"x": -0.327332637838193, "y": 0.2792691256181224, "z": 0.9026971251102884, "word": "Wapatoo", "pos_group": "noun", "row_number": 170697, "definition": "The edible tuber of a species of arrowhead (Sagittaria variabilis); -- so called by the Indians of Oregon.", "details": []}, {"x": -0.4960678957696684, "y": 0.5354479866419649, "z": 0.6835291481624755, "word": "Ware", "pos_group": "noun", "row_number": 170787, "definition": "Seaweed.", "details": []}, {"x": -0.56428373695916, "y": 0.1849304663569314, "z": 0.8046021295127258, "word": "Wart", "pos_group": "noun", "row_number": 170952, "definition": "An excrescence or protuberance more or less resembling a true wart; specifically (Bot.) a glandular excrescence or hardened protuberance on plants.", "details": []}, {"x": -0.29487519970597, "y": 0.445665992194912, "z": 0.8452398712787329, "word": "Wartwort", "pos_group": "noun", "row_number": 170957, "definition": "A name given to several plants because they were thought to be a cure for warts as a kind of spurge (Euphorbia Helioscopia) and the nipplewort (Lampsana communis).", "details": []}, {"x": -0.6239937795206951, "y": 0.4117047305458958, "z": 0.6641769176699905, "word": "Watches", "pos_group": "other", "row_number": 171103, "definition": "The leaves of Saracenia flava. See Trumpets.", "details": []}, {"x": -0.4080364618819247, "y": 0.2009778752273387, "z": 0.8905695590148952, "word": "Water agrimony", "pos_group": "other", "row_number": 171134, "definition": "A kind of bur marigold (Bidens tripartita) found in wet places in Europe.", "details": []}, {"x": -0.3973396341793617, "y": 0.5457525977259592, "z": 0.7377501726096569, "word": "Water arum", "pos_group": "other", "row_number": 171137, "definition": "An aroid herb (Calla palustris) having a white spathe. It is an inhabitant of the north temperate zone.", "details": []}, {"x": -0.6291261981884757, "y": 0.2480070191881949, "z": 0.736676825471184, "word": "Water can", "pos_group": "other", "row_number": 171167, "definition": "Any one of several species of Nuphar; the yellow frog lily; -- so called from the shape of the seed vessel. See Nuphar and cf. Candock.", "details": []}, {"x": -0.2979427867417565, "y": 0.3422853697246472, "z": 0.8911065152387889, "word": "Water chickweed", "pos_group": "other", "row_number": 171179, "definition": "A small annual plant (Montia fontana) growing in wet places in southern regions.", "details": []}, {"x": -0.5545585127391025, "y": 0.5010528164341026, "z": 0.6643876361673569, "word": "Water chinquapin", "pos_group": "other", "row_number": 171180, "definition": "The American lotus and its edible seeds which somewhat resemble chinquapins. Cf. Yoncopin.", "details": []}, {"x": -0.5073317547175267, "y": 0.1725659185901609, "z": 0.8442958571474629, "word": "Water cress", "pos_group": "other", "row_number": 171195, "definition": "A perennial cruciferous herb (Nasturtium officinale) growing usually in clear running or spring water. The leaves are pungent and used for salad and as an antiscorbutic.", "details": []}, {"x": -0.3202896734314741, "y": 0.4982467069582533, "z": 0.8057076045926439, "word": "Water dropwort", "pos_group": "other", "row_number": 171216, "definition": "A European poisonous umbelliferous plant (Enanthe fistulosa) with large hollow stems and finely divided leaves.", "details": []}, {"x": -0.6433974999033412, "y": 0.3464574705940793, "z": 0.6826469645341455, "word": "Water feather-foil", "pos_group": "other", "row_number": 171226, "definition": "The water violet (Hottonia palustris); also the less showy American plant H. inflata.", "details": []}, {"x": -0.3539156940953278, "y": 0.2445571575676714, "z": 0.9027377682114798, "word": "Water flag", "pos_group": "other", "row_number": 171227, "definition": "A European species of Iris (Iris Pseudacorus) having bright yellow flowers.", "details": []}, {"x": -0.4576763051526129, "y": 0.546679864365325, "z": 0.7011943565084948, "word": "Water germander", "pos_group": "other", "row_number": 171246, "definition": "A labiate plant (Teucrium Scordium) found in marshy places in Europe.", "details": []}, {"x": -0.5941893880677189, "y": 0.2029861861371702, "z": 0.7782901639781885, "word": "Water hemlock", "pos_group": "other", "row_number": 171254, "definition": "A poisonous umbelliferous plant (Cicuta virosa) of Europe; also any one of several plants of that genus.", "details": []}, {"x": -0.2890394128030291, "y": 0.4076999162390267, "z": 0.86616222276498, "word": "Water hemlock", "pos_group": "other", "row_number": 171255, "definition": "A poisonous plant (/nanthe crocata) resembling the above.", "details": []}, {"x": -0.6025578631284741, "y": 0.4495419413567005, "z": 0.6594210070533815, "word": "Water horehound", "pos_group": "other", "row_number": 171260, "definition": "Bugleweed.", "details": []}, {"x": -0.44536155131082, "y": 0.1830472261104191, "z": 0.8764398448423605, "word": "Water hyacinth", "pos_group": "other", "row_number": 171262, "definition": "Either of several tropical aquatic plants of the genus Eichhornia related to the pickerel weed.", "details": []}, {"x": -0.363600060984265, "y": 0.534251506515548, "z": 0.7631319174547124, "word": "Waterleaf", "pos_group": "noun", "row_number": 171277, "definition": "Any plant of the American genus Hydrophyllum herbs having white or pale blue bell-shaped flowers.", "details": []}, {"x": -0.6414252856729903, "y": 0.2828064968980784, "z": 0.7131578284023531, "word": "Water lemon", "pos_group": "other", "row_number": 171279, "definition": "The edible fruit of two species of passion flower (Passiflora laurifolia and P. maliformis); -- so called in the West Indies.", "details": []}, {"x": -0.313422368580591, "y": 0.3023626610475013, "z": 0.9001906687350218, "word": "Water lettuce", "pos_group": "other", "row_number": 171281, "definition": "A plant (Pistia stratiotes) which floats on tropical waters and forms a rosette of spongy wedge-shaped leaves.", "details": []}, {"x": -0.5192952216413511, "y": 0.5250274142719955, "z": 0.6742986630887846, "word": "Water lily", "pos_group": "other", "row_number": 171284, "definition": "A blossom or plant of any species of the genus Nymphaea distinguished for its large floating leaves and beautiful flowers. See Nymphaea.", "details": []}, {"x": -0.5437300021235149, "y": 0.1770390546414333, "z": 0.8203748276991623, "word": "Watermelon", "pos_group": "noun", "row_number": 171301, "definition": "The very large ovoid or roundish fruit of a cucurbitaceous plant (Citrullus vulgaris) of many varieties; also the plant itself. The fruit sometimes weighs many pounds; its pulp is usually pink in color and full of a sweet watery juice. It is a native of tropical Africa but is now cultivated in many countries. See Illust. of Melon.", "details": []}, {"x": -0.3017484795273321, "y": 0.4675678634300012, "z": 0.8308598848123833, "word": "Water milfoil", "pos_group": "other", "row_number": 171303, "definition": "Any plant of the genus Myriophyllum aquatic herbs with whorled leaves the submersed ones pinnately parted into capillary divisions.", "details": []}, {"x": -0.6342069430781728, "y": 0.3871328871952118, "z": 0.6692605479208666, "word": "Water mint", "pos_group": "other", "row_number": 171305, "definition": "A kind of mint (Mentha aquatica) growing in wet places and sometimes having a perfume resembling bergamot.", "details": []}, {"x": -0.3858885942250528, "y": 0.2151510063254315, "z": 0.8971064804827611, "word": "Water nymph", "pos_group": "other", "row_number": 171317, "definition": "A water lily (Nymphaea).", "details": []}, {"x": -0.419582083067467, "y": 0.5492655192947556, "z": 0.7226743837183021, "word": "Water parsnip", "pos_group": "other", "row_number": 171323, "definition": "Any plant of the aquatic umbelliferous genus Sium poisonous herbs with pinnate or dissected leaves and small white flowers.", "details": []}, {"x": -0.618265085582071, "y": 0.228487267243731, "z": 0.7520251675693347, "word": "Water pepper", "pos_group": "other", "row_number": 171326, "definition": "Smartweed.", "details": []}, {"x": -0.2915050413887869, "y": 0.3674010863561798, "z": 0.8831994410036843, "word": "Water pimpernel", "pos_group": "other", "row_number": 171335, "definition": "A small white-flowered shrub; brookweed.", "details": []}, {"x": -0.5747094970107086, "y": 0.4833723638740497, "z": 0.6603485079020861, "word": "Water pitcher", "pos_group": "other", "row_number": 171338, "definition": "One of a family of plants having pitcher-shaped leaves. The sidesaddle flower (Sarracenia purpurea) is the type.", "details": []}, {"x": -0.4838408719965409, "y": 0.1733597966048207, "z": 0.8578137277444109, "word": "Water plant", "pos_group": "other", "row_number": 171339, "definition": "A plant that grows in water; an aquatic plant.", "details": []}, {"x": -0.3345723747283349, "y": 0.514600108628389, "z": 0.7894606097002514, "word": "Water plantain", "pos_group": "other", "row_number": 171340, "definition": "A kind of plant with acrid leaves. See under 2d Plantain.", "details": []}, {"x": -0.645620089057039, "y": 0.3213816482093508, "z": 0.6927398767215744, "word": "Water poa", "pos_group": "other", "row_number": 171342, "definition": "Meadow reed grass. See under Reed.", "details": []}, {"x": -0.336142090123828, "y": 0.2650237114787211, "z": 0.9037537981116472, "word": "Water pore", "pos_group": "other", "row_number": 171345, "definition": "One of certain minute pores in the leaves of some plants. They are without true guardian cells but in other respects closely resemble ordinary stomata.", "details": []}, {"x": -0.4814597783402764, "y": 0.5414143947026903, "z": 0.6892509956824521, "word": "Water radish", "pos_group": "other", "row_number": 171360, "definition": "A coarse yellow-flowered plant (Nasturtium amphibium) related to the water cress and to the horse-radish.", "details": []}, {"x": -0.5766798496809271, "y": 0.1901190046859258, "z": 0.7945408202409843, "word": "Water rocket", "pos_group": "other", "row_number": 171374, "definition": "A cruciferous plant (Nasturtium sylvestre) with small yellow flowers.", "details": []}, {"x": -0.2908663862234456, "y": 0.4317842828809632, "z": 0.8537910039478547, "word": "Water shield", "pos_group": "other", "row_number": 171386, "definition": "An aquatic American plant (Brasenia peltata) having floating oval leaves and the covered with a clear jelly.", "details": []}, {"x": -0.617169080837145, "y": 0.426728246481008, "z": 0.6610637861158921, "word": "Water soldier", "pos_group": "other", "row_number": 171396, "definition": "An aquatic European plant (Stratiotes aloides) with bayonet-shaped leaves.", "details": []}, {"x": -0.421774552810455, "y": 0.1924440892502606, "z": 0.886042605699172, "word": "Water speedwell", "pos_group": "other", "row_number": 171401, "definition": "A kind of speedwell (Veronica Anagallis) found in wet places in Europe and America.", "details": []}, {"x": -0.3835659022080849, "y": 0.5430505914339336, "z": 0.7469760731151653, "word": "Water star grass", "pos_group": "other", "row_number": 171409, "definition": "An aquatic plant (Schollera graminea) with grassy leaves and yellow star-shaped blossoms.", "details": []}, {"x": -0.6353616554073389, "y": 0.2602675669560205, "z": 0.7270325717798614, "word": "Water torch", "pos_group": "other", "row_number": 171424, "definition": "The common cat-tail (Typha latifolia) the spike of which makes a good torch soaked in oil.", "details": []}, {"x": -0.3021858652774852, "y": 0.3266438932971858, "z": 0.8955375312057859, "word": "Water vine", "pos_group": "other", "row_number": 171433, "definition": "Any plant of the genus Phytocrene climbing shrubs of Asia and Africa the stems of which are singularly porous and when cut stream with a limpid potable juice.", "details": []}, {"x": -0.541725351456242, "y": 0.511597864687404, "z": 0.6669342309680167, "word": "Water willow", "pos_group": "other", "row_number": 171444, "definition": "An American aquatic plant (Dianthera Americana) with long willowlike leaves and spikes of small purplish flowers.", "details": []}, {"x": -0.521677660756094, "y": 0.1723978085744497, "z": 0.8355425865069818, "word": "Water-white", "pos_group": "noun", "row_number": 171448, "definition": "A vinelike plant (Vitis Caribaea) growing in parched districts in the West Indies and containing a great amount of sap which is sometimes used for quenching thirst.", "details": []}, {"x": -0.3116296540530229, "y": 0.4876857450765052, "z": 0.815505715960328, "word": "Waterwort", "pos_group": "noun", "row_number": 171452, "definition": "Any plant of the natural order Elatineae consisting of two genera (Elatine and Bergia) mostly small annual herbs growing in the edges of ponds. Some have a peppery or acrid taste.", "details": []}, {"x": -0.6414826781983145, "y": 0.3619413424777846, "z": 0.6763863083895892, "word": "Wax", "pos_group": "noun", "row_number": 171533, "definition": "A waxlike product secreted by certain plants. See Vegetable wax under Vegetable.", "details": []}, {"x": -0.3650646651184089, "y": 0.232022731925535, "z": 0.9016059239777628, "word": "Waxberry", "pos_group": "noun", "row_number": 171537, "definition": "The wax-covered fruit of the wax myrtle or bayberry. See Bayberry and Candleberry tree.", "details": []}, {"x": -0.4428101090323763, "y": 0.549418047412385, "z": 0.7085612298992212, "word": "Waxwork", "pos_group": "noun", "row_number": 171546, "definition": "An American climbing shrub (Celastrus scandens). It bears a profusion of yellow berrylike pods which open in the autumn and display the scarlet coverings of the seeds.", "details": []}, {"x": -0.6046260487774171, "y": 0.2112246818595762, "z": 0.7679918456032779, "word": "Waybread", "pos_group": "noun", "row_number": 171567, "definition": "The common dooryard plantain (Plantago major).", "details": []}, {"x": -0.2881788610705108, "y": 0.3925489676134849, "z": 0.8734175702707672, "word": "Wayside", "pos_group": "adjective", "row_number": 171594, "definition": "Of or pertaining to the wayside; as wayside flowers.", "details": []}, {"x": -0.593049822556286, "y": 0.463386727088777, "z": 0.6584562621191394, "word": "Weak", "pos_group": "other", "row_number": 171608, "definition": "Not stiff; pliant; frail; soft; as the weak stalk of a plant.", "details": []}, {"x": -0.4599082828968261, "y": 0.1775216282591381, "z": 0.8700404834392003, "word": "Weapon", "pos_group": "noun", "row_number": 171677, "definition": "A thorn prickle or sting with which many plants are furnished.", "details": []}, {"x": -0.3513178279799823, "y": 0.5282917956142236, "z": 0.7729706090338281, "word": "Weed", "pos_group": "noun", "row_number": 171870, "definition": "Any plant growing in cultivated ground to the injury of the crop or desired vegetation or to the disfigurement of the place; an unsightly useless or injurious plant.", "details": []}, {"x": -0.6446521180526578, "y": 0.2968629177182092, "z": 0.70448282787734, "word": "Weed", "pos_group": "other", "row_number": 171876, "definition": "To free from noxious plants; to clear of weeds; as to weed corn or onions; to weed a garden.", "details": []}, {"x": -0.3206110819612168, "y": 0.2873311030072711, "z": 0.9025792881338918, "word": "Weedery", "pos_group": "noun", "row_number": 171881, "definition": "Weeds collectively; also a place full of weeds or for growing weeds.", "details": []}, {"x": -0.5051270438141667, "y": 0.5328765681491675, "z": 0.6788882328668884, "word": "Weedless", "pos_group": "adjective", "row_number": 171884, "definition": "Free from weeds or noxious matter.", "details": []}, {"x": -0.5570985652940319, "y": 0.1802371377839135, "z": 0.810651443414982, "word": "Weedy", "pos_group": "other", "row_number": 171886, "definition": "Abounding with weeds; as weedy grounds; a weedy garden; weedy corn.", "details": []}, {"x": -0.295865431721467, "y": 0.4547387595508762, "z": 0.8400454195306348, "word": "Weigelia", "pos_group": "noun", "row_number": 171948, "definition": "A hardy garden shrub (Diervilla Japonica) belonging to the Honeysuckle family with white or red flowers. It was introduced from China.", "details": []}, {"x": -0.6291740166743114, "y": 0.40259500444905, "z": 0.6648739122078582, "word": "Weld", "pos_group": "noun", "row_number": 172024, "definition": "An herb (Reseda luteola) related to mignonette growing in Europe and to some extent in America; dyer's broom; dyer's rocket; dyer's weed; wild woad. It is used by dyers to give a yellow color.", "details": []}, {"x": -0.3988588404134812, "y": 0.2049175076292714, "z": 0.8938234951549554, "word": "Weld", "pos_group": "noun", "row_number": 172025, "definition": "Coloring matter or dye extracted from this plant.", "details": []}, {"x": -0.4051487174225827, "y": 0.5486318493543746, "z": 0.7313396000797682, "word": "Welwitschia", "pos_group": "noun", "row_number": 172146, "definition": "An African plant (Welwitschia mirabilis) belonging to the order Gnetaceae. It consists of a short woody topshaped stem and never more than two leaves which are the cotyledons enormously developed and at length split into diverging segments.", "details": []}, {"x": -0.6262416520205519, "y": 0.2393974557182122, "z": 0.7419637804301611, "word": "Whiteweed", "pos_group": "noun", "row_number": 172893, "definition": "A perennial composite herb (Chrysanthemum Leucanthemum) with conspicuous white rays and a yellow disk a common weed in grass lands and pastures; -- called also oxeye daisy.", "details": []}, {"x": -0.2938400527267703, "y": 0.3516824737689137, "z": 0.8888067624952604, "word": "Whitten tree", "pos_group": "other", "row_number": 172930, "definition": "Either of two shrubs (Viburnum Lantana and V. Opulus) so called on account of their whitish branches.", "details": []}, {"x": -0.5629491313039606, "y": 0.4953820274076261, "z": 0.661577601257499, "word": "Whorl", "pos_group": "other", "row_number": 173006, "definition": "A circle of two or more leaves flowers or other organs about the same part or joint of a stem.", "details": []}, {"x": -0.4985132176913757, "y": 0.1711087363464136, "z": 0.8498272601728686, "word": "Whorled", "pos_group": "adjective", "row_number": 173009, "definition": "Furnished with whorls; arranged in the form of a whorl or whorls; verticillate; as whorled leaves.", "details": []}, {"x": -0.3243579079363001, "y": 0.5056464261784581, "z": 0.7994458325941413, "word": "Whortleberry", "pos_group": "noun", "row_number": 173013, "definition": "In England the fruit of Vaccinium Myrtillus; also the plant itself. See Bilberry 1.", "details": []}, {"x": -0.6456715700226562, "y": 0.336578535102316, "z": 0.6854364400678282, "word": "Whortleberry", "pos_group": "noun", "row_number": 173014, "definition": "The fruit of several shrubby plants of the genus Gaylussacia; also any one of these plants. See Huckleberry.", "details": []}, {"x": -0.345945917387912, "y": 0.251304933010038, "z": 0.9039730376993864, "word": "Wildering", "pos_group": "noun", "row_number": 173183, "definition": "A plant growing in a state of nature; especially one which has run wild or escaped from cultivation.", "details": []}, {"x": -0.4666108464441019, "y": 0.546186585341603, "z": 0.6956684066231547, "word": "Wilding", "pos_group": "noun", "row_number": 173193, "definition": "A wild or uncultivated plant; especially a wild apple tree or crab apple; also the fruit of such a plant.", "details": []}, {"x": -0.588436703320268, "y": 0.1965422669460907, "z": 0.7842916444086768, "word": "Willow-herb", "pos_group": "noun", "row_number": 173246, "definition": "A perennial herb (Epilobium spicatum) with narrow willowlike leaves and showy rose-purple flowers. The name is sometimes made to include other species of the same genus.", "details": []}, {"x": -0.2880415002609146, "y": 0.4172761953892345, "z": 0.8619238196551521, "word": "Willow-weed", "pos_group": "noun", "row_number": 173249, "definition": "A European species of loosestrife (Lysimachia vulgaris).", "details": []}, {"x": -0.6092378621775193, "y": 0.4414407055394335, "z": 0.6587558962029965, "word": "Willow-wort", "pos_group": "noun", "row_number": 173252, "definition": "Any plant of the order Salicaceae or the Willow family.", "details": []}, {"x": -0.4359606014922934, "y": 0.1849957887707094, "z": 0.8807467922641449, "word": "Wilt", "pos_group": "other", "row_number": 173266, "definition": "To cause to begin to wither; to make flaccid as a green plant.", "details": []}, {"x": -0.3702385123126872, "y": 0.539058917204424, "z": 0.7565308505162772, "word": "Wincopipe", "pos_group": "noun", "row_number": 173312, "definition": "A little red flower no doubt the pimpernel which when it opens in the morning is supposed to bode a fair day. See Pimpernel.", "details": []}, {"x": -0.6404909387045098, "y": 0.2733446164538425, "z": 0.717672681724139, "word": "Winder", "pos_group": "noun", "row_number": 173350, "definition": "One who or that which winds; hence a creeping or winding plant.", "details": []}, {"x": -0.3076141765434616, "y": 0.3110883465471009, "z": 0.8992205285868863, "word": "Wind-fertilized", "pos_group": "adjective", "row_number": 173359, "definition": "Anemophilous; fertilized by pollen borne by the wind.", "details": []}, {"x": -0.5282507863145269, "y": 0.5211996160679595, "z": 0.6702999828201517, "word": "Wind-plant", "pos_group": "noun", "row_number": 173399, "definition": "A windflower.", "details": []}, {"x": -0.5357842241078671, "y": 0.1735351675612344, "z": 0.8263297228205124, "word": "Wineberry", "pos_group": "noun", "row_number": 173427, "definition": "A peculiar New Zealand shrub (Coriaria ruscifolia) in which the petals ripen and afford an abundant purple juice from which a kind of wine is made. The plant also grows in Chili.", "details": []}, {"x": -0.3039644269426491, "y": 0.4761430748817131, "z": 0.8251626502669728, "word": "Wing", "pos_group": "noun", "row_number": 173444, "definition": "Any membranaceous expansion as that along the sides of certain stems or of a fruit of the kind called samara.", "details": []}, {"x": -0.6383402654522641, "y": 0.3775674667051124, "z": 0.6707939427187882, "word": "Wing", "pos_group": "noun", "row_number": 173445, "definition": "Either of the two side petals of a papilionaceous flower.", "details": []}, {"x": -0.3770293472142746, "y": 0.2202606363043329, "z": 0.8996299925158054, "word": "Wintergreen", "pos_group": "noun", "row_number": 173531, "definition": "A plant which keeps its leaves green through the winter.", "details": []}, {"x": -0.4279689624950111, "y": 0.5508750006166303, "z": 0.7165049203156746, "word": "Winter-ground", "pos_group": "other", "row_number": 173532, "definition": "To coved over in the season of winter as for protection or shelter; as to winter-ground the roods of a plant.", "details": []}, {"x": -0.6142100432100913, "y": 0.2205804745006747, "z": 0.7576874534324262, "word": "Winterweed", "pos_group": "noun", "row_number": 173541, "definition": "A kind of speedwell (Veronica hederifolia) which spreads chiefly in winter.", "details": []}, {"x": -0.2885510525134611, "y": 0.3770318678735527, "z": 0.8801052554672955, "word": "Wistaria", "pos_group": "noun", "row_number": 173646, "definition": "A genus of climbing leguminous plants bearing long pendulous clusters of pale bluish flowers.", "details": []}, {"x": -0.58257672886863, "y": 0.476654109346477, "z": 0.6583351844036922, "word": "Withwind", "pos_group": "noun", "row_number": 173772, "definition": "A kind of bindweed (Convolvulus arvensis).", "details": []}, {"x": -0.4746454960355435, "y": 0.1732140496457081, "z": 0.8629649738538099, "word": "Woad", "pos_group": "noun", "row_number": 173837, "definition": "An herbaceous cruciferous plant (Isatis tinctoria). It was formerly cultivated for the blue coloring matter derived from its leaves.", "details": []}, {"x": -0.339720180006329, "y": 0.5211133626611246, "z": 0.7829630020329713, "word": "Woad-waxen", "pos_group": "noun", "row_number": 173840, "definition": "A leguminous plant (Genista tinctoria) of Europe and Russian Asia and adventitious in America; -- called also greenwood greenweed dyer's greenweed and whin wood-wash wood-wax and wood-waxen.", "details": []}, {"x": -0.6466789406415419, "y": 0.3114986339166657, "z": 0.6962578177649313, "word": "Wolfberry", "pos_group": "noun", "row_number": 173875, "definition": "An American shrub (Symphoricarpus occidentalis) which bears soft white berries.", "details": []}, {"x": -0.328885118329592, "y": 0.2726643617959047, "z": 0.9041508307510217, "word": "Wolfsbane", "pos_group": "noun", "row_number": 173885, "definition": "A poisonous plant (Aconitum Lycoctonum) a kind of monkshood; also by extension any plant or species of the genus Aconitum. See Aconite.", "details": []}, {"x": -0.4905586784312841, "y": 0.5396083684816638, "z": 0.6842331413197614, "word": "Wolf's-claw", "pos_group": "noun", "row_number": 173886, "definition": "A kind of club moss. See Lycopodium.", "details": []}, {"x": -0.5699719558737438, "y": 0.1847184416174617, "z": 0.8006316674001069, "word": "Wolf's-foot", "pos_group": "noun", "row_number": 173887, "definition": "Club moss. See Lycopodium.", "details": []}, {"x": -0.2911132149142462, "y": 0.4411348642595087, "z": 0.848912909335838, "word": "Wolf's-milk", "pos_group": "noun", "row_number": 173888, "definition": "Any kind of spurge (Euphorbia); -- so called from its acrid milky juice.", "details": []}, {"x": -0.622968756033118, "y": 0.4179164496187038, "z": 0.6612531815762, "word": "Woodbine", "pos_group": "other", "row_number": 173983, "definition": "A climbing plant having flowers of great fragrance (Lonicera Periclymenum); the honeysuckle.", "details": []}, {"x": -0.4124272250369241, "y": 0.1956666476103432, "z": 0.8897293673141694, "word": "Woodwardia", "pos_group": "noun", "row_number": 174043, "definition": "A genus of ferns one species of which (Woodwardia radicans) is a showy plant in California the Azores etc.", "details": []}, {"x": -0.3910060242979578, "y": 0.5466897685396808, "z": 0.7404354029466277, "word": "Wool", "pos_group": "noun", "row_number": 174062, "definition": "A sort of pubescence or a clothing of dense curling hairs on the surface of certain plants.", "details": []}, {"x": -0.6331914196545838, "y": 0.2512546650482314, "z": 0.7320790390164944, "word": "Wormseed", "pos_group": "noun", "row_number": 174247, "definition": "Any one of several plants as Artemisia santonica and Chenopodium anthelminticum whose seeds have the property of expelling worms from the stomach and intestines.", "details": []}, {"x": -0.2973989386439191, "y": 0.3358760358900391, "z": 0.8937232008895503, "word": "Wormwood", "pos_group": "noun", "row_number": 174251, "definition": "A composite plant (Artemisia Absinthium) having a bitter and slightly aromatic taste formerly used as a tonic and a vermifuge and to protect woolen garments from moths. It gives the peculiar flavor to the cordial called absinthe. The volatile oil is a narcotic poison. The term is often extended to other species of the same genus.", "details": []}, {"x": -0.5504109716194044, "y": 0.5065741104325018, "z": 0.6636493298124415, "word": "Wort", "pos_group": "noun", "row_number": 174309, "definition": "A plant of any kind.", "details": []}, {"x": -0.5131087301604107, "y": 0.1701515285407372, "z": 0.8412894200977578, "word": "Woundwort", "pos_group": "noun", "row_number": 174355, "definition": "Any one of certain plants whose soft downy leaves have been used for dressing wounds as the kidney vetch and several species of the labiate genus Stachys.", "details": []}, {"x": -0.3150349754390693, "y": 0.4956024175418035, "z": 0.8094017593116689, "word": "Wrack", "pos_group": "noun", "row_number": 174372, "definition": "Coarse seaweed of any kind.", "details": []}, {"x": -0.6444852009537333, "y": 0.3520894947386118, "z": 0.6787280850578788, "word": "Xanthin", "pos_group": "noun", "row_number": 174690, "definition": "A yellow insoluble coloring matter extracted from yellow flowers; specifically the coloring matter of madder.", "details": []}, {"x": -0.3566838730450288, "y": 0.2382137139828549, "z": 0.9033442539697104, "word": "Xanthium", "pos_group": "noun", "row_number": 174693, "definition": "A genus of composite plants in which the scales of the involucre are united so as to form a kind of bur; cocklebur; clotbur.", "details": []}, {"x": -0.4516225718488808, "y": 0.5497192007230832, "z": 0.7027416687182972, "word": "Xanthophyll", "pos_group": "noun", "row_number": 174705, "definition": "A yellow coloring matter found in yellow autumn leaves and also produced artificially from chlorophyll; -- formerly called also phylloxanthin.", "details": []}, {"x": -0.5994649031332165, "y": 0.204166200052086, "z": 0.7739237641187761, "word": "Xanthorhiza", "pos_group": "noun", "row_number": 174711, "definition": "A genus of shrubby ranunculaceous plants of North America including only the species Xanthorhiza apiifolia which has roots of a deep yellow color; yellowroot. The bark is intensely bitter and is sometimes used as a tonic.", "details": []}, {"x": -0.286430888675946, "y": 0.4022373222348738, "z": 0.8695760361311863, "word": "Xanthorhoea", "pos_group": "noun", "row_number": 174712, "definition": "A genus of endogenous plants native to Australia having a thick sometimes arborescent stem and long grasslike leaves. See Grass tree.", "details": []}, {"x": -0.6002447833338151, "y": 0.4557351839746835, "z": 0.6572759254438753, "word": "Xiphidium", "pos_group": "noun", "row_number": 174753, "definition": "
