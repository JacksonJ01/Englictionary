and a single pistil. They are natives of Mexico and South America. Double-flowered varieties are now common in cultivation.", "details": []}, {"x": -0.5779783805613765, "y": 0.3657143305309651, "z": 0.7295162918317429, "word": "Fucoid", "pos_group": "adjective", "row_number": 63280, "definition": "Properly belonging to an order of alga: (Fucoideae) which are blackish in color and produce oospores which are not fertilized until they have escaped from the conceptacle. The common rockweeds and the gulfweed (Sargassum) are fucoid in character.", "details": []}, {"x": -0.4118719255524964, "y": 0.2892128641882591, "z": 0.864128136406692, "word": "Fucoid", "pos_group": "adjective", "row_number": 63281, "definition": "In a vague sense resembling seaweeds or of the nature of seaweeds.", "details": []}, {"x": -0.4596296415776443, "y": 0.4786017311725394, "z": 0.7481182897789991, "word": "Fucoid", "pos_group": "noun", "row_number": 63282, "definition": "A plant whether recent or fossil which resembles a seaweed. See Fucoid a.", "details": []}, {"x": -0.555404886064675, "y": 0.2757436496128846, "z": 0.784532250601371, "word": "Full-bloomed", "pos_group": "adjective", "row_number": 63402, "definition": "Like a perfect blossom.", "details": []}, {"x": -0.3662947770593102, "y": 0.3854760089923058, "z": 0.8468980946905205, "word": "Full-blown", "pos_group": "adjective", "row_number": 63403, "definition": "Fully expanded as a blossom; as a full-bloun rose.", "details": []}, {"x": -0.5494333256945463, "y": 0.4266012659863669, "z": 0.7184249302989559, "word": "Fumaric", "pos_group": "adjective", "row_number": 63464, "definition": "Pertaining to or derived from fumitory (Fumaria officinalis).", "details": []}, {"x": -0.4684968146381092, "y": 0.2560953776209649, "z": 0.8455329042888399, "word": "Fumitory", "pos_group": "noun", "row_number": 63518, "definition": "The common uame of several species of the genus Fumaria annual herbs of the Old World with finely dissected leaves and small flowers in dense racemes or spikes. F. officinalis is a common species and was formerly used as an antiscorbutic.", "details": []}, {"x": -0.4046053486031793, "y": 0.4664839061989241, "z": 0.786566765849596, "word": "Fungin", "pos_group": "noun", "row_number": 63592, "definition": "A name formerly given to cellulose found in certain fungi and mushrooms.", "details": []}, {"x": -0.5798610510329946, "y": 0.3267267303062247, "z": 0.7463315651895706, "word": "Fungous", "pos_group": "adjective", "row_number": 63599, "definition": "Of the nature of fungi; spongy.", "details": []}, {"x": -0.385231775939992, "y": 0.322346237916094, "z": 0.8646903386227122, "word": "Fungus", "pos_group": "noun", "row_number": 63603, "definition": "Any one of the Fungi a large and very complex group of thallophytes of low organization -- the molds mildews rusts smuts mushrooms toadstools puff balls and the allies of each.", "details": []}, {"x": -0.4969664788439171, "y": 0.4686741079951854, "z": 0.7303210933557894, "word": "Funicle", "pos_group": "noun", "row_number": 63607, "definition": "The little stalk that attaches a seed to the placenta.", "details": []}, {"x": -0.5268990805657131, "y": 0.257165619783252, "z": 0.8100883920292291, "word": "Funnelform", "pos_group": "adjective", "row_number": 63627, "definition": "Having the form of a funnel or tunnel; that is expanding gradually from the bottom upward as the corolla of some flowers; infundibuliform.", "details": []}, {"x": -0.3709004965797021, "y": 0.4227572245271561, "z": 0.8268670695746844, "word": "Furze", "pos_group": "noun", "row_number": 63752, "definition": "A thorny evergreen shrub (Ulex Europaeus) with beautiful yellow flowers very common upon the plains and hills of Great Britain; -- called also gorse and whin. The dwarf furze is Ulex nanus.", "details": []}, {"x": -0.5710849126798982, "y": 0.3901275520841312, "z": 0.7222620823594691, "word": "Gage", "pos_group": "noun", "row_number": 63972, "definition": "A variety of plum; as the greengage; also the blue gage frost gage golden gage etc. having more or less likeness to the greengage. See Greengage.", "details": []}, {"x": -0.4318606275561912, "y": 0.2725311522445292, "z": 0.8597808845415453, "word": "Galangal", "pos_group": "noun", "row_number": 64057, "definition": "The pungent aromatic rhizome or tuber of certain East Indian or Chinese species of Alpinia (A. Galanga and A. officinarum) and of the Kaempferia Galanga) -- all of the Ginger family.", "details": []}, {"x": -0.4369045801237686, "y": 0.4786752240507816, "z": 0.7615670802672654, "word": "Gale", "pos_group": "noun", "row_number": 64072, "definition": "A plant of the genus Myrica growing in wet places and strongly resembling the bayberry. The sweet gale (Myrica Gale) is found both in Europe and in America.", "details": []}, {"x": -0.5687918443405016, "y": 0.2922268499152783, "z": 0.7688168221366675, "word": "Galea", "pos_group": "noun", "row_number": 64074, "definition": "The upper lip or helmet-shaped part of a labiate flower.", "details": []}, {"x": -0.3691541067200501, "y": 0.3609805704399206, "z": 0.8563984313720988, "word": "Galingale", "pos_group": "noun", "row_number": 64104, "definition": "A plant of the Sedge family (Cyperus longus) having aromatic roots; also any plant of the same genus.", "details": []}, {"x": -0.531682369711887, "y": 0.4461391092839746, "z": 0.7199123230677846, "word": "Gallic", "pos_group": "adjective", "row_number": 64178, "definition": "Pertaining to or derived from galls nutgalls and the like.", "details": []}, {"x": -0.4916889293330472, "y": 0.2516826217210277, "z": 0.8336053350926635, "word": "Gama grass", "pos_group": "other", "row_number": 64291, "definition": "A species of grass (Tripsacum dactyloides) tall stout and exceedingly productive; cultivated in the West Indies Mexico and the Southern States of North America as a forage grass; -- called also sesame grass.", "details": []}, {"x": -0.3880207236361827, "y": 0.4533362509304606, "z": 0.8024500991470855, "word": "Gang-flower", "pos_group": "noun", "row_number": 64385, "definition": "The common English milkwort (Polygala vulgaris) so called from blossoming in gang week.", "details": []}, {"x": -0.5809828919084147, "y": 0.3504361931103645, "z": 0.7346110221525746, "word": "Ganja", "pos_group": "noun", "row_number": 64416, "definition": "The dried hemp plant used in India for smoking. It is extremely narcotic and intoxicating.", "details": []}, {"x": -0.4000405061916131, "y": 0.3004218672314865, "z": 0.8658604362685162, "word": "Garcinia", "pos_group": "noun", "row_number": 64481, "definition": "A genus of plants including the mangosteen tree (Garcinia Mangostana) found in the islands of the Indian Archipelago; -- so called in honor of Dr. Garcin.", "details": []}, {"x": -0.4738616616998721, "y": 0.4771866097257012, "z": 0.7401000372041114, "word": "Garden", "pos_group": "noun", "row_number": 64485, "definition": "A piece of ground appropriated to the cultivation of herbs fruits flowers or vegetables.", "details": []}, {"x": -0.546030580006427, "y": 0.2664455116756138, "z": 0.7942653177658994, "word": "Garden", "pos_group": "other", "row_number": 64490, "definition": "To cultivate as a garden.", "details": []}, {"x": -0.3656648276141022, "y": 0.4004430690030325, "z": 0.840199132547387, "word": "Gardenia", "pos_group": "noun", "row_number": 64492, "definition": "A genus of plants some species of which produce beautiful and fragrant flowers; Cape jasmine; -- so called in honor of Dr. Alexander Garden.", "details": []}, {"x": -0.5595274752769499, "y": 0.4136565580066269, "z": 0.7182041885343695, "word": "Garlic", "pos_group": "noun", "row_number": 64537, "definition": "A plant of the genus Allium (A. sativum is the cultivated variety) having a bulbous root a very strong smell and an acrid pungent taste. Each root is composed of several lesser bulbs called cloves of garlic inclosed in a common membranous coat and easily separable.", "details": []}, {"x": -0.4540169676123617, "y": 0.2600470552127554, "z": 0.8521995788518377, "word": "Gaultheria", "pos_group": "noun", "row_number": 64840, "definition": "A genus of ericaceous shrubs with evergreen foliage and often edible berries. It includes the American winter-green (Gaultheria procumbens) and the larger-fruited salal of Northwestern America (Gaultheria Shallon).", "details": []}, {"x": -0.4156494585436119, "y": 0.4734410041855431, "z": 0.7765881425621863, "word": "Geitonogamy", "pos_group": "noun", "row_number": 64971, "definition": "Fertilization of flowers by pollen from other flowers on the same plant.", "details": []}, {"x": -0.577840843404575, "y": 0.3123394112740798, "z": 0.7540186017986896, "word": "Gelose", "pos_group": "noun", "row_number": 65011, "definition": "An amorphous gummy carbohydrate found in Gelidium agar-agar and other seaweeds.", "details": []}, {"x": -0.3769420497272557, "y": 0.3364428725968864, "z": 0.8629721227398776, "word": "Gelsemium", "pos_group": "noun", "row_number": 65015, "definition": "A genus of climbing plants. The yellow (false) jasmine (Gelsemium sempervirens) is a native of the Southern United States. It has showy and deliciously fragrant flowers.", "details": []}, {"x": -0.5110018479115869, "y": 0.462106995299417, "z": 0.7247994455891148, "word": "Gelsemium", "pos_group": "noun", "row_number": 65016, "definition": "The root of the yellow jasmine used in malarial fevers etc.", "details": []}, {"x": -0.5142703787368877, "y": 0.2525788836515918, "z": 0.8195912914905416, "word": "Gemma", "pos_group": "noun", "row_number": 65045, "definition": "A leaf bud as distinguished from a flower bud.", "details": []}, {"x": -0.375268991778281, "y": 0.4359291876637959, "z": 0.8180091241254559, "word": "Gemma", "pos_group": "noun", "row_number": 65046, "definition": "A bud spore; one of the small spores or buds in the reproduction of certain Protozoa which separate one at a time from the parent cell.", "details": []}, {"x": -0.5770613285907074, "y": 0.3751161657927675, "z": 0.7254571560099607, "word": "Gemmate", "pos_group": "adjective", "row_number": 65050, "definition": "Having buds; reproducing by buds.", "details": []}, {"x": -0.4184536983535136, "y": 0.2813286235852239, "z": 0.863568588987528, "word": "Gemmation", "pos_group": "noun", "row_number": 65053, "definition": "The arrangement of buds on the stalk; also of leaves in the bud.", "details": []}, {"x": -0.4504867895609021, "y": 0.4805511272036226, "z": 0.7524176144764548, "word": "Gemmiflorate", "pos_group": "adjective", "row_number": 65058, "definition": "Having flowers like buds.", "details": []}, {"x": -0.5619531265031116, "y": 0.2804867247680053, "z": 0.7781618603107551, "word": "Gemmiparity", "pos_group": "noun", "row_number": 65062, "definition": "Reproduction by budding; gemmation. See Budding.", "details": []}, {"x": -0.3654335730613567, "y": 0.3762568196861341, "z": 0.8514041985562942, "word": "Gemmiparous", "pos_group": "adjective", "row_number": 65063, "definition": "Producing buds; reproducing by buds. See Gemmation 1.", "details": []}, {"x": -0.5437987138785573, "y": 0.4351822662788756, "z": 0.7175648778336415, "word": "Gemmule", "pos_group": "noun", "row_number": 65066, "definition": "A little leaf bud as the plumule between the cotyledons.", "details": []}, {"x": -0.477318738139764, "y": 0.2523920211688402, "z": 0.8417036829377493, "word": "Gemmule", "pos_group": "noun", "row_number": 65067, "definition": "One of the buds of mosses.", "details": []}, {"x": -0.3968792444015167, "y": 0.4630875124850405, "z": 0.7924877419516964, "word": "Gemmule", "pos_group": "noun", "row_number": 65070, "definition": "A bud produced in generation by gemmation.", "details": []}, {"x": -0.5820775848764363, "y": 0.3351713802116731, "z": 0.740841299517931, "word": "Genera", "pos_group": "other", "row_number": 65107, "definition": "See Genus.", "details": []}, {"x": -0.3893425296643957, "y": 0.3130167296762944, "z": 0.8662753150917362, "word": "Generically", "pos_group": "adverb", "row_number": 65174, "definition": "With regard to a genus or an extensive class; as an animal generically distinct from another or two animals or plants generically allied.", "details": []}, {"x": -0.4883327307295166, "y": 0.4737134475558763, "z": 0.7328892915734133, "word": "Genipap", "pos_group": "noun", "row_number": 65233, "definition": "The edible fruit of a West Indian tree (Genipa Americana) of the order Rubiaceae. It is oval in shape as a large as a small orange of a pale greenish color and with dark purple juice.", "details": []}, {"x": -0.5351693293285761, "y": 0.2587970458621361, "z": 0.8041255362187135, "word": "Genista", "pos_group": "noun", "row_number": 65234, "definition": "A genus of plants including the common broom of Western Europe.", "details": []}, {"x": -0.3669896462912114, "y": 0.4150358231560619, "z": 0.8325045735683508, "word": "Gentian", "pos_group": "noun", "row_number": 65272, "definition": "Any one of a genus (Gentiana) of herbaceous plants with opposite leaves and a tubular four- or five-lobed corolla usually blue but sometimes white yellow or red. See Illust. of Capsule.", "details": []}, {"x": -0.5682256438960486, "y": 0.3996132327252828, "z": 0.7193252962671133, "word": "Gentianaceous", "pos_group": "adjective", "row_number": 65273, "definition": "Of or pertaining to a natural order of plants (Gentianaceae) of which the gentian is the type.", "details": []}, {"x": -0.4396406229086285, "y": 0.2659943525515501, "z": 0.8578829332136144, "word": "Genera", "pos_group": "other", "row_number": 65346, "definition": "of Genus", "details": []}, {"x": -0.4279380061418696, "y": 0.4785531992374974, "z": 0.7667176132050687, "word": "Geraniaceous", "pos_group": "adjective", "row_number": 65451, "definition": "Of or pertaining to a natural order of pants (Geraniaceae) which includes the genera Geranium Pelargonium and many others.", "details": []}, {"x": -0.5738810332097752, "y": 0.2986770542290349, "z": 0.7625303777549766, "word": "Geranine", "pos_group": "noun", "row_number": 65453, "definition": "A valuable astringent obtained from the root of the Geranium maculatum or crane's-bill.", "details": []}, {"x": -0.3702687936937608, "y": 0.3513162611829126, "z": 0.8599290116312082, "word": "Geranine", "pos_group": "noun", "row_number": 65454, "definition": "A liquid terpene obtained from the crane's-bill (Geranium maculatum) and having a peculiar mulberry odor.", "details": []}, {"x": -0.5245933878809957, "y": 0.4536683649482003, "z": 0.720407379221483, "word": "Geranium", "pos_group": "noun", "row_number": 65455, "definition": "A genus of plants having a beaklike tours or receptacle around which the seed capsules are arranged and membranous projections or stipules at the joints. Most of the species have showy flowers and a pungent odor. Called sometimes crane's-bill.", "details": []}, {"x": -0.5006788890757516, "y": 0.2499761868390399, "z": 0.8287536160085724, "word": "Geranium", "pos_group": "noun", "row_number": 65456, "definition": "A cultivated pelargonium.", "details": []}, {"x": -0.3815022883257713, "y": 0.4480468353800071, "z": 0.8085233684366586, "word": "Germander", "pos_group": "noun", "row_number": 65480, "definition": "A plant of the genus Teucrium (esp. Teucrium Chamaedrys or wall germander) mintlike herbs and low shrubs.", "details": []}, {"x": -0.5812499463613988, "y": 0.3596748605849533, "z": 0.7299195123560306, "word": "Germinate", "pos_group": "other", "row_number": 65505, "definition": "To sprout; to bud; to shoot; to begin to vegetate as a plant or its seed; to begin to develop as a germ.", "details": []}, {"x": -0.4058184147395413, "y": 0.2918156129454988, "z": 0.86611492441796, "word": "Germination", "pos_group": "noun", "row_number": 65507, "definition": "The process of germinating; the beginning of vegetation or growth in a seed or plant; the first development of germs either animal or vegetable.", "details": []}, {"x": -0.4647197408803764, "y": 0.4803645550765187, "z": 0.7438316050439198, "word": "Germinative", "pos_group": "adjective", "row_number": 65508, "definition": "Pertaining to germination; having power to bud or develop.", "details": []}, {"x": -0.5533821203885476, "y": 0.2700989149531974, "z": 0.7879180191970356, "word": "Geyserite", "pos_group": "noun", "row_number": 65600, "definition": "A loose hydrated form of silica a variety of opal deposited in concretionary cauliflowerlike masses around some hot springs and geysers.", "details": []}, {"x": -0.3636177775117546, "y": 0.3916019328907741, "z": 0.8452396334966918, "word": "Giant", "pos_group": "noun", "row_number": 65643, "definition": "Any animal plant or thing of extraordinary size or power.", "details": []}, {"x": -0.5548384313600581, "y": 0.4227705287422775, "z": 0.7165328988349978, "word": "Gill", "pos_group": "noun", "row_number": 65786, "definition": "The ground ivy (Nepeta Glechoma); -- called also gill over the ground and other like names.", "details": []}, {"x": -0.4626309315724522, "y": 0.2551791843447676, "z": 0.8490325111734791, "word": "Gillyflower", "pos_group": "noun", "row_number": 65792, "definition": "A name given by old writers to the clove pink (Dianthus Caryophyllus) but now to the common stock (Matthiola incana) a cruciferous plant with showy and fragrant blossoms usually purplish but often pink or white.", "details": []}, {"x": -0.4072839283801295, "y": 0.4712292319873913, "z": 0.7823444334842695, "word": "Ginger", "pos_group": "noun", "row_number": 65844, "definition": "A plant of the genus Zingiber of the East and West Indies. The species most known is Z. officinale.", "details": []}, {"x": -0.5812089491040907, "y": 0.3202020603598704, "z": 0.7481088142928223, "word": "Ginseng", "pos_group": "noun", "row_number": 65867, "definition": "A plant of the genus Aralia the root of which is highly valued as a medicine among the Chinese. The Chinese plant (Aralia Schinseng) has become so rare that the American (A. quinquefolia) has largely taken its place and its root is now an article of export from America to China. The root when dry is of a yellowish white color with a sweetness in the taste somewhat resembling that of licorice combined with a slight aromatic bitterness.", "details": []}, {"x": -0.3799940657748786, "y": 0.3267864529230329, "z": 0.8653410450000969, "word": "Girandole", "pos_group": "noun", "row_number": 65878, "definition": "A flower stand fountain or the like of branching form.", "details": []}, {"x": -0.5027775940183581, "y": 0.4682111948673852, "z": 0.7266312461998635, "word": "Gith", "pos_group": "noun", "row_number": 65950, "definition": "The corn cockle; also anciently applied to the Nigella or fennel flower.", "details": []}, {"x": -0.5229962830862415, "y": 0.2529666868061408, "z": 0.8139304289951936, "word": "Gladen", "pos_group": "noun", "row_number": 66026, "definition": "Sword grass; any plant with sword-shaped leaves esp. the European Iris foetidissima.", "details": []}, {"x": -0.3702762514982418, "y": 0.4289767814130604, "z": 0.8239383584861808, "word": "Gladiate", "pos_group": "adjective", "row_number": 66029, "definition": "Sword-shaped; resembling a sword in form as the leaf of the iris or of the gladiolus.", "details": []}, {"x": -0.5753422018130248, "y": 0.3847121611578062, "z": 0.7217879909434841, "word": "Gladiole", "pos_group": "noun", "row_number": 66038, "definition": "A lilylike plant of the genus Gladiolus; -- called also corn flag.", "details": []}, {"x": -0.4256346466336961, "y": 0.2738595619313344, "z": 0.8624593253735425, "word": "Gladiolus", "pos_group": "noun", "row_number": 66041, "definition": "A genus of plants having bulbous roots and gladiate leaves and including many species some of which are cultivated and valued for the beauty of their flowers; the corn flag; the sword lily.", "details": []}, {"x": -0.4412630030618758, "y": 0.4816941029932948, "z": 0.7571378693938773, "word": "Gland", "pos_group": "noun", "row_number": 66089, "definition": "A special organ of plants usually minute and globular which often secretes some kind of resinous gummy or aromatic product.", "details": []}, {"x": -0.5680214424186416, "y": 0.2860039033275464, "z": 0.7717210689323268, "word": "Glandulation", "pos_group": "noun", "row_number": 66100, "definition": "The situation and structure of the secretory vessels in plants.", "details": []}, {"x": -0.3653613887345903, "y": 0.3667030004737942, "z": 0.8555933409426748, "word": "Glasswort", "pos_group": "noun", "row_number": 66162, "definition": "A seashore plant of the Spinach family (Salicornia herbacea) with succulent jointed stems; also a prickly plant of the same family (Salsola Kali) both formerly burned for the sake of the ashes which yield soda for making glass and soap.", "details": []}, {"x": -0.5374808429151416, "y": 0.4434824250982486, "z": 0.7172431122905295, "word": "Glaucine", "pos_group": "noun", "row_number": 66174, "definition": "An alkaloid obtained from the plant Glaucium as a bitter white crystalline substance.", "details": []}, {"x": -0.4863591209533688, "y": 0.2494378561236568, "z": 0.8373980901565876, "word": "Glaucous", "pos_group": "adjective", "row_number": 66183, "definition": "Covered with a fine bloom or fine white powder easily rubbed off as that on a blue plum or on a cabbage leaf.", "details": []}, {"x": -0.3895148185309309, "y": 0.4588673522685692, "z": 0.7985730769108415, "word": "Gleby", "pos_group": "adjective", "row_number": 66237, "definition": "Pertaining to the glebe; turfy; cloddy; fertile; fruitful.", "details": []}, {"x": -0.5835423412178806, "y": 0.3440815162846317, "z": 0.735585648417112, "word": "Gloam", "pos_group": "other", "row_number": 66340, "definition": "To begin to grow dark; to grow dusky.", "details": []}, {"x": -0.3942003812514835, "y": 0.3038251086483268, "z": 0.8673501961584014, "word": "Globeflower", "pos_group": "noun", "row_number": 66361, "definition": "A plant of the genus Trollius (T. Europaeus) found in the mountainous parts of Europe and producing handsome globe-shaped flowers.", "details": []}, {"x": -0.4793495571086775, "y": 0.4780838487742387, "z": 0.7359754314112159, "word": "Globeflower", "pos_group": "noun", "row_number": 66362, "definition": "The American plant Trollius laxus.", "details": []}, {"x": -0.5432076311960482, "y": 0.2612772619844805, "z": 0.7979095573937381, "word": "Glomerule", "pos_group": "noun", "row_number": 66400, "definition": "A head or dense cluster of flowers formed by condensation of a cyme as in the flowering dogwood.", "details": []}, {"x": -0.3637707308774605, "y": 0.4067320778575478, "z": 0.8379975371076933, "word": "Gloriosa", "pos_group": "noun", "row_number": 66438, "definition": "A genus of climbing plants with very showy lilylike blossoms natives of India.", "details": []}, {"x": -0.5645781805367248, "y": 0.4091086849021371, "z": 0.716855328500448, "word": "Gloxinia", "pos_group": "noun", "row_number": 66536, "definition": "American genus of herbaceous plants with very handsome bell-shaped blossoms; -- named after B. P. Gloxin a German botanist.", "details": []}, {"x": -0.4478909836176416, "y": 0.2600259890141114, "z": 0.8554414952708658, "word": "Glume", "pos_group": "noun", "row_number": 66571, "definition": "The bracteal covering of the flowers or seeds of grain and grasses; esp. an outer husk or bract of a spikelt.", "details": []}, {"x": -0.4190665809152114, "y": 0.4775832146257723, "z": 0.772203000426538, "word": "Glumelle", "pos_group": "noun", "row_number": 66573, "definition": "One of the pelets or inner chaffy scales of the flowers or spikelets of grasses.", "details": []}, {"x": -0.5783594858556187, "y": 0.30580928654496, "z": 0.7562942452403607, "word": "Glycyrrhiza", "pos_group": "noun", "row_number": 66659, "definition": "A genus of papilionaceous herbaceous plants one species of which (G. glabra) is the licorice plant the roots of which have a bittersweet mucilaginous taste.", "details": []}, {"x": -0.3721892466438539, "y": 0.3414946776426025, "z": 0.8630507226255335, "word": "Gnaphalium", "pos_group": "noun", "row_number": 66684, "definition": "A genus of composite plants with white or colored dry and persistent involucres; a kind of everlasting.", "details": []}, {"x": -0.5169273301413696, "y": 0.4607473365983484, "z": 0.7214554921618128, "word": "Goolde", "pos_group": "noun", "row_number": 66917, "definition": "An old English name of some yellow flower -- the marigold (Calendula) according to Dr. Prior but in Chaucer perhaps the turnsole.", "details": []}, {"x": -0.5097139522274534, "y": 0.2490913900880783, "z": 0.8234956990104186, "word": "Golden-rod", "pos_group": "noun", "row_number": 66932, "definition": "A tall herb (Solidago Virga-aurea) bearing yellow flowers in a graceful elongated cluster. The name is common to all the species of the genus Solidago.", "details": []}, {"x": -0.3754949597002808, "y": 0.4419963400331839, "z": 0.8146427257620084, "word": "Golding", "pos_group": "noun", "row_number": 66944, "definition": "A conspicuous yellow flower commonly the corn marigold (Chrysanthemum segetum).", "details": []}, {"x": -0.5807182916815292, "y": 0.3692140777154415, "z": 0.7255668339465512, "word": "Goldylocks", "pos_group": "noun", "row_number": 66952, "definition": "A plant of several species of the genus Chrysocoma; -- so called from the tufts of yellow flowers which terminate the stems; also the Ranunculus auricomus a kind of buttercup.", "details": []}, {"x": -0.4122631290747856, "y": 0.2835277768991794, "z": 0.8658239498489722, "word": "Gomuti", "pos_group": "noun", "row_number": 66979, "definition": "A black fibrous substance resembling horsehair obtained from the leafstalks of two kinds of palms Metroxylon Sagu and Arenga saccharifera of the Indian islands. It is used for making cordage. Called also ejoo.", "details": []}, {"x": -0.4553937670155505, "y": 0.4827723357650596, "z": 0.7480290026351486, "word": "Gonidial", "pos_group": "adjective", "row_number": 67005, "definition": "Pertaining to or containing gonidia.", "details": []}, {"x": -0.5603381543090744, "y": 0.2745697718434923, "z": 0.7814298389588871, "word": "Gonimia", "pos_group": "other", "row_number": 67010, "definition": "Bluish green granules which occur in certain lichens as Collema Peltigera etc. and which replace the more usual gonidia.", "details": []}, {"x": -0.3623384226066777, "y": 0.3823259481985603, "z": 0.8500221978495482, "word": "Gonimous", "pos_group": "adjective", "row_number": 67011, "definition": "Pertaining to or containing gonidia or gonimia as that part of a lichen which contains the green or chlorophyll-bearing cells.", "details": []}, {"x": -0.5494131062895644, "y": 0.4317080952606865, "z": 0.715383365143223, "word": "Gonoblastid", "pos_group": "noun", "row_number": 67016, "definition": "A reproductive bud of a hydroid; a simple gonophore.", "details": []}, {"x": -0.4715628975384098, "y": 0.2510067514401857, "z": 0.8453543898251337, "word": "Gonotheca", "pos_group": "noun", "row_number": 67033, "definition": "A capsule developed on certain hydroids (Thecaphora) inclosing the blastostyle upon which the medusoid buds or gonophores are developed; -- called also gonangium and teleophore. See Hydroidea and Illust. of Campanularian.", "details": []}, {"x": -0.3991863142034575, "y": 0.4681684696467973, "z": 0.7883327790858593, "word": "Goosefoot", "pos_group": "noun", "row_number": 67102, "definition": "A genus of herbs (Chenopodium) mostly annual weeds; pigweed.", "details": []}, {"x": -0.5838639621752107, "y": 0.3286211879331088, "z": 0.7423684991394074, "word": "Gossypium", "pos_group": "noun", "row_number": 67248, "definition": "A genus of plants which yield the cotton of the arts. The species are much confused. G. herbaceum is the name given to the common cotton plant while the long-stapled sea-island cotton is produced by G. Barbadense a shrubby variety. There are several other kinds besides these.", "details": []}, {"x": -0.3838299462071475, "y": 0.3171589525592166, "z": 0.8672282117217813, "word": "Goutwort", "pos_group": "noun", "row_number": 67313, "definition": "A coarse umbelliferous plant of Europe (Aegopodium Podagraria); -- called also bishop's weed ashweed and herb gerard.", "details": []}, {"x": -0.4941109755630716, "y": 0.4737161244233729, "z": 0.7290043739851009, "word": "Grain", "pos_group": "noun", "row_number": 67514, "definition": "A single small hard seed; a kernel especially of those plants like wheat whose seeds are used for food.", "details": []}, {"x": -0.5315905290228515, "y": 0.2542095633797993, "z": 0.8079535923179353, "word": "Grained", "pos_group": "adjective", "row_number": 67543, "definition": "Having tubercles or grainlike processes as the petals or sepals of some flowers.", "details": []}, {"x": -0.3659205270408059, "y": 0.4213630490644005, "z": 0.8297923528048029, "word": "Gram", "pos_group": "noun", "row_number": 67570, "definition": "The East Indian name of the chick-pea (Cicer arietinum) and its seeds; also other similar seeds there used for food.", "details": []}, {"x": -0.5728155277810589, "y": 0.3944281343846352, "z": 0.7185463227508462, "word": "Grama grass", "pos_group": "other", "row_number": 67573, "definition": "The name of several kinds of pasture grasses found in the Western United States esp. the Bouteloua oligostachya.", "details": []}, {"x": -0.4333694595436173, "y": 0.2668754229689942, "z": 0.8607952254456301, "word": "Graminaceous", "pos_group": "adjective", "row_number": 67579, "definition": "Pertaining to or resembling the grasses; gramineous; as graminaceous plants.", "details": []}, {"x": -0.4320305741772411, "y": 0.4820020170859202, "z": 0.7622490659234603, "word": "Gramineous", "pos_group": "adjective", "row_number": 67581, "definition": "Like Or pertaining to grass. See Grass n. 2.", "details": []}, {"x": -0.5735485533025148, "y": 0.2922676544826713, "z": 0.7652592208838717, "word": "Graminifolious", "pos_group": "adjective", "row_number": 67582, "definition": "Bearing leaves resembling those of grass.", "details": []}, {"x": -0.3660962755174108, "y": 0.3568838007797559, "z": 0.8594227538256567, "word": "Granadilla", "pos_group": "noun", "row_number": 67612, "definition": "The fruit of certain species of passion flower (esp. Passiflora quadrangularis) found in Brazil and the West Indies. It is as large as a child's head and is a good dessert fruit. The fruit of Passiflora edulis is used for flavoring ices.", "details": []}, {"x": -0.5305143938126375, "y": 0.4514271628727433, "z": 0.717473340674255, "word": "Granatin", "pos_group": "noun", "row_number": 67616, "definition": "Mannite; -- so called because found in the pomegranate.", "details": []}, {"x": -0.4955487626296201, "y": 0.2472735892987228, "z": 0.8326386946879054, "word": "Grape", "pos_group": "noun", "row_number": 67718, "definition": "The plant which bears this fruit; the grapevine.", "details": []}, {"x": -0.382579425369886, "y": 0.4538380011314953, "z": 0.8047757774763208, "word": "Grapevine", "pos_group": "noun", "row_number": 67726, "definition": "A vine or climbing shrub of the genus Vitis having small green flowers and lobed leaves and bearing the fruit called grapes.", "details": []}, {"x": -0.5842252185102151, "y": 0.3533949238343172, "z": 0.7306113343391469, "word": "Grass", "pos_group": "noun", "row_number": 67779, "definition": "Popularly: Herbage; the plants which constitute the food of cattle and other beasts; pasture.", "details": []}, {"x": -0.3997823431225666, "y": 0.2948485398407077, "z": 0.8678930905827243, "word": "Grass", "pos_group": "noun", "row_number": 67780, "definition": "An endogenous plant having simple leaves a stem generally jointed and tubular the husks or glumes in pairs and the seed single.", "details": []}, {"x": -0.4700809683121141, "y": 0.4817337546580388, "z": 0.7395650565391887, "word": "Grass-green", "pos_group": "adjective", "row_number": 67791, "definition": "Of the color of grass; clear and vivid green.", "details": []}, {"x": -0.5509425875419842, "y": 0.2646051062544396, "z": 0.7914836719583164, "word": "Grassiness", "pos_group": "noun", "row_number": 67795, "definition": "The state of abounding with grass; a grassy state.", "details": []}, {"x": -0.3612850072255548, "y": 0.397899276161355, "z": 0.843296691315874, "word": "Grassless", "pos_group": "adjective", "row_number": 67796, "definition": "Destitute of grass.", "details": []}, {"x": -0.5601531049362826, "y": 0.4185364895088208, "z": 0.7148816027706089, "word": "Grass tree", "pos_group": "other", "row_number": 67798, "definition": "An Australian plant of the genus Xanthorrhoea having a thick trunk crowned with a dense tuft of pendulous grasslike leaves from the center of which arises a long stem bearing at its summit a dense flower spike looking somewhat like a large cat-tail. These plants are often called \"\"\"\"blackboys\"\"\"\" from the large trunks denuded and blackened by fire. They yield two kinds of fragrant resin called Botany-bay gum and Gum Acaroides.", "details": []}, {"x": -0.4565548332860882, "y": 0.2546869232023909, "z": 0.8524624656562959, "word": "Grass tree", "pos_group": "other", "row_number": 67799, "definition": "A similar Australian plant (Kingia australis).", "details": []}, {"x": -0.4103635919367653, "y": 0.475752964768067, "z": 0.7779851148493461, "word": "Grassy", "pos_group": "adjective", "row_number": 67801, "definition": "Resembling grass; green.", "details": []}, {"x": -0.5821760230613, "y": 0.3135808110270171, "z": 0.7501587519506567, "word": "Gratiolin", "pos_group": "noun", "row_number": 67833, "definition": "One of the essential principles of the hedge hyssop (Gratiola officinalis).", "details": []}, {"x": -0.3749176253793486, "y": 0.3315911503042382, "z": 0.8657274878504335, "word": "Grazer", "pos_group": "noun", "row_number": 67962, "definition": "One that grazes; a creature which feeds on growing grass or herbage.", "details": []}, {"x": -0.5087322077311557, "y": 0.46730768697312 ge bunches of white flowers; -- called also snowball tree.", "details": []}, {"x": -0.5229399846386386, "y": 0.4589437029622496, "z": 0.7182648884481536, "word": "Guernsey lily", "pos_group": "other", "row_number": 68781, "definition": "A South African plant (Nerine Sarniensis) with handsome lilylike flowers naturalized on the island of Guernsey.", "details": []}, {"x": -0.5048161482172632, "y": 0.2459339849344597, "z": 0.8274521929110727, "word": "Guid", "pos_group": "noun", "row_number": 68896, "definition": "A flower. See Gold.", "details": []}, {"x": -0.3761378940916122, "y": 0.448020994432777, "z": 0.8110471460869538, "word": "Gumbo", "pos_group": "noun", "row_number": 68955, "definition": "The okra plant or its pods.", "details": []}, {"x": -0.5841021538938753, "y": 0.3630450688548555, "z": 0.7259634645054176, "word": "Guttifer", "pos_group": "noun", "row_number": 69093, "definition": "A plant that exudes gum or resin.", "details": []}, {"x": -0.406059048604164, "y": 0.2861635964825614, "z": 0.8678861936307357, "word": "Gutwort", "pos_group": "noun", "row_number": 69111, "definition": "A plant Globularia Alypum a violent purgative found in Africa.", "details": []}, {"x": -0.460594341564068, "y": 0.4846168010352399, "z": 0.7436393001136595, "word": "Gymnocladus", "pos_group": "noun", "row_number": 69157, "definition": "A genus of leguminous plants; the Kentucky coffee tree. The leaves are cathartic and the seeds a substitute for coffee.", "details": []}, {"x": -0.558304215189709, "y": 0.2687723512097212, "z": 0.7848935128580191, "word": "Gymnogen", "pos_group": "noun", "row_number": 69162, "definition": "One of a class of plants so called by Lindley because the ovules are fertilized by direct contact of the pollen. Same as Gymnosperm.", "details": []}, {"x": -0.3595682774060497, "y": 0.3885959308133523, "z": 0.8483536152092184, "word": "Gymnolaemata", "pos_group": "other", "row_number": 69165, "definition": "An order of Bryozoa having no epistome.", "details": cies of Aegilops from one of which it is contended that wheat has been derived.", "details": []}, {"x": -0.4138343343964069, "y": 0.4800308926598718, "z": 0.7735059700912784, "word": "Hardhack", "pos_group": "noun", "row_number": 70217, "definition": "A very astringent shrub (Spiraea tomentosa) common in pastures. The Potentilla fruticosa in also called by this name.", "details": []}, {"x": -0.5827523283716357, "y": 0.3068917525629588, "z": 0.7524740367522811, "word": "Harebell", "pos_group": "noun", "row_number": 70268, "definition": "A small slender branching plant (Campanula rotundifolia) having blue bell-shaped flowers; also Scilla nutans which has similar flowers; -- called also bluebell.", "details": []}, {"x": -0.370027118818836, "y": 0.3367421136962686, "z": 0.865843334675506, "word": "Hare's-ear", "pos_group": "noun", "row_number": 70279, "definition": "An umbelliferous plant (Bupleurum rotundifolium ); -- so named from the shape of its leaves.", "details": []}, {"x": -0.5148038943407586, "y": 0.4659616805725358, "z": 0.7196225834488571, "word": "Hare's-foot fern", "pos_group": "other", "row_number": 70280, "definition": "A species of fern (Davallia Canariensis) with a soft gray hairy rootstock; -- whence the name.", "details": []}, {"x": -0.5140880090925307, "y": 0.2454475272098156, "z": 0.8218692294360855, "word": "Hare's-tail", "pos_group": "noun", "row_number": 70281, "definition": "A kind of grass (Eriophorum vaginatum). See Cotton grass under Cotton.", "details": []}, {"x": -0.3702519778533842, "y": 0.4414447159652278, "z": 0.8173371615447546, "word": "Harmel", "pos_group": "noun", "row_number": 70318, "definition": "A kind of rue (Ruta sylvestris) growing in India. At Lahore the seeds are used medicinally and for fumigation.", "details": []}, {"x": -0.583155374528943, "y": 0.3729615997730334, "z": 0.7216851489761638, "word": "Hart's-ear", "pos_group": "noun", "row_number": 70442, "definition": "An Asiatic species of Cacalia (C. Kleinia) used medicina nt of the genus Senecio (S. hieracifolius).", "details": []}, {"x": -0.3827733927641077, "y": 0.3118482253611089, "z": 0.8696178552277897, "word": "Head", "pos_group": "noun", "row_number": 70823, "definition": "A dense cluster of flowers as in clover daisies thistles; a capitulum.", "details": []}, {"x": -0.4909721244171485, "y": 0.4786159673882295, "z": 0.7279238482192634, "word": "Head", "pos_group": "noun", "row_number": 70824, "definition": "A dense compact mass of leaves as in a cabbage or a lettuce plant.", "details": []}, {"x": -0.5363562383523146, "y": 0.2515876108597305, "z": 0.8056212879774517, "word": "Head", "pos_group": "other", "row_number": 70839, "definition": "To form a head; as this kind of cabbage heads early.", "details": []}, {"x": -0.3611157246116255, "y": 0.4196195992056211, "z": 0.8327753751166845, "word": "Headed", "pos_group": "adjective", "row_number": 70852, "definition": "Formed into a head; as a headed cabbage.", "details": []}, {"x": -0.5742152690659298, "y": 0.3989109731238015, "z": 0.7149453547600427, "word": "Healall", "pos_group": "noun", "row_number": 70936, "definition": "A common herb of the Mint family (Brunela vulgaris) destitute of active properties but anciently thought a panacea.", "details": []}, {"x": -0.4351925696839122, "y": 0.2613011799513968, "z": 0.8615852370183236, "word": "Healthful", "pos_group": "adjective", "row_number": 70943, "definition": "Full of health; free from illness or disease; well; whole; sound; healthy; as a healthful body or mind; a healthful plant.", "details": []}, {"x": -0.4270254037996094, "y": 0.4850277827713482, "z": 0.7631496278251666, "word": "Heart's-ease", "pos_group": "noun", "row_number": 71053, "definition": "A species of violet (Viola tricolor); -- called also pansy.", "details": []}, {"x": -0.578186154147368, "y": 0.2926719874393296, "z": 0.7616061179642589, "word": "Heartseed", "pos_group": "noun", "row_number": 71054, "definition": "A climbing plant of the genus Cardiospermum having round seeds which are marked with a spot like a heart.", "details": []}, {"x": -0.3633466142142746, "y": 0.3525530952862928, "z": 0.8623720501866216, "word": "Heath", "pos_group": "noun", "row_number": 71097, "definition": "A low shrub (Erica / Calluna vulgaris) with minute evergreen leaves and handsome clusters of pink flowers. It is used in Great Britain for brooms thatch beds for the poor and for heating ovens. It is also called heather and ling.", "details": []}, {"x": -0.52901267869981, "y": 0.4566980486849324, "z": 0.7152429504037259, "word": "Heath", "pos_group": "noun", "row_number": 71098, "definition": "Also any species of the genus Erica of which several are European and many more are South African some of great beauty. See Illust. of Heather.", "details": []}, {"x": -0.4995942113271968, "y": 0.2431247846967198, "z": 0.8314420984497536, "word": "Hederiferous", "pos_group": "adjective", "row_number": 71269, "definition": "Producing ivy; ivy-bearing.", "details": []}, {"x": -0.3771994924680129, "y": 0.4539744835069166, "z": 0.8072346072899141, "word": "Helichrysum", "pos_group": "noun", "row_number": 71406, "definition": "A genus of composite plants with shining commonly white or yellow or sometimes reddish radiated involucres which are often called \"\"\"\"everlasting flowers.", "details": []}, {"x": -0.5871931710335333, "y": 0.3566332966126567, "z": 0.7266476943049998, "word": "Heliotrope", "pos_group": "noun", "row_number": 71443, "definition": "A plant of the genus Heliotropium; -- called also turnsole and girasole. H. Peruvianum is the commonly cultivated species with fragrant flowers.", "details": []}, {"x": -0.3998688716981289, "y": 0.2892291214225416, "z": 0.8697421461375838, "word": "Heliotropism", "pos_group": "noun", "row_number": 71448, "definition": "The phenomenon of turning toward the light seen in many leaves and flowers.", "details": []}, {"x": -0.4660678281918107, "y": 0.4860706348947947, "z": 0.7392672841520449, "word": "Hellebore", "pos_group": "noun", "row_number": 71478, "definition": "A genus of perennial herbs (Helleborus) of the Crowfoot family mostly having powerfully cathartic and even poisonous qualities. H. niger is the European black hellebore or Christmas rose blossoming in winter or earliest spring. H. officinalis was the officinal hellebore of the ancients.", "details": []}, {"x": -0.5558544005122664, "y": 0.2631218993097563, "z": 0.7885383640221795, "word": "Hellebore", "pos_group": "noun", "row_number": 71479, "definition": "Any plant of several species of the poisonous liliaceous genus Veratrum especially V. album and V. viride both called white hellebore.", "details": []}, {"x": -0.3571392579534129, "y": 0.3950401961449634, "z": 0.8464010833276587, "word": "Helleborin", "pos_group": "noun", "row_number": 71481, "definition": "A poisonous glucoside found in several species of hellebore and extracted as a white crystalline substance with a sharp tingling taste. It possesses the essential virtues of the plant; -- called also elleborin.", "details": []}, {"x": -0.56043541617214, "y": 0.4235254974284578, "z": 0.7117150394139059, "word": "Helmet", "pos_group": "noun", "row_number": 71528, "definition": "The hood-formed upper sepal or petal of some flowers as of the monkshood or the snapdragon.", "details": []}, {"x": -0.4593664678270636, "y": 0.2494822010304324, "z": 0.8524911023612494, "word": "Hemachate", "pos_group": "noun", "row_number": 71600, "definition": "A species of agate sprinkled with spots of red jasper.", "details": []}, {"x": -0.4050187137147421, "y": 0.4777280372981, "z": 0.7795740913602511, "word": "Hemerocallis", "pos_group": "noun", "row_number": 71653, "definition": "A genus of plants some species of which are cultivated for their beautiful flowers; day lily.", "details": []}, {"x": -0.5863262008687925, "y": 0.3151647431576743, "z": 0.7462524846492141, "word": "Hemicrany", "pos_group": "noun", "row_number": 71664, "definition": "Hemicranis.", "details": []}, {"x": 3585168734462289, "z": 0.8616078972565187, "word": "Herby", "pos_group": "adjective", "row_number": 71936, "definition": "Having the nature of pertaining to or covered with herbs or herbage.", "details": []}, {"x": -0.5351182911428, "y": 0.4540137467696643, "z": 0.7124043319833061, "word": "Hercogamous", "pos_group": "adjective", "row_number": 71937, "definition": "Not capable of self-fertilization; -- said of hermaphrodite flowers in which some structural obstacle forbids autogamy.", "details": []}, {"x": -0.4940663079008595, "y": 0.2406806400433485, "z": 0.8354467744300276, "word": "Hermodactyl", "pos_group": "noun", "row_number": 72065, "definition": "A heart-shaped bulbous root about the size of a finger brought from Turkey formerly used as a cathartic.", "details": []}, {"x": -0.3786800814690566, "y": 0.4598285869265416, "z": 0.8032179446101342, "word": "Heterauxesis", "pos_group": "noun", "row_number": 72176, "definition": "Unequal growth of a cell or of a part of a plant.", "details": []}, {"x": -0.5899726982221694, "y": 0.3500035259464684, "z": 0.7276192322757097, "word": "Hetercephalous", "pos_group": "adjective", "row_number": 72180, "definition": "Bearing two kinds of heads or capitula; -- said of certain composite plants.", "details": []}, {"x": -0.3937197637960488, "y": 0.2927160474170734, "z": 0.8713794025457046, "word": "Heterochromous", "pos_group": "adjective", "row_number": 72184, "definition": "Having the central florets of a flower head of a different color from those of the circumference.", "details": []}, {"x": -0.4717928094112741, "y": 0.4871213224171183, "z": 0.7349315357463001, "word": "Heterogamous", "pos_group": "adjective", "row_number": 72207, "definition": "The condition of having two or more kinds of flowers which differ in regard to stamens and pistils as in the aster.", "details": []}, {"x": -0.5529931313985293, "y": 0.2576451718416596, "z": 0.7923493939246313, "word": "Heterogony", "pos_group": "noun", "row_number": 72223, "definition": "The condition of having two or more kinds of flowers different as to the length of their stamens and pistils.", "details": []}, {"x": -0.3550662566720055, "y": 0.4016318025200353, "z": 0.8441681399919312, "word": "Heteromorphic", "pos_group": "adjective", "row_number": 72235, "definition": "Deviating from the normal perfect or mature form; having different forms at different stages of existence or in different individuals of the same species; -- applied especially to insects in which there is a wide difference of form between the larva and the adult and to plants having more than one form of flower.", "details": []}, {"x": -0.5657900912795488, "y": 0.4188417968307701, "z": 0.7102486338159701, "word": "Heterophyllous", "pos_group": "adjective", "row_number": 72256, "definition": "Having leaves of more than one shape on the same plant.", "details": []}, {"x": -0.4529733790216392, "y": 0.24935995930771, "z": 0.8559408440960016, "word": "Heterosporous", "pos_group": "adjective", "row_number": 72270, "definition": "Producing two kinds of spores unlike each other.", "details": []}, {"x": -0.4085272300403851, "y": 0.4821568013280021, "z": 0.7750034330560606, "word": "Hexagynia", "pos_group": "other", "row_number": 72321, "definition": "A Linnaean order of plants having six pistils.", "details": []}, {"x": -0.5869793632476539, "y": 0.3083149547401274, "z": 0.7485967644900503, "word": "Hexandria", "pos_group": "other", "row_number": 72336, "definition": "A Linnaean class of plants having six stamens.", "details": []}, {"x": -0.3681857532970963, "y": 0.3318099491366051, "z": 0.8685283004732853, "word": "Hexapetalous", "pos_group": "adjective", "row_number": 72341, "definition": "Having six petals.", "details": []}, {"x": -0.5123748148626507, "y": 0.4711015072801116, "z": 0.7180079518590803, "word": "Hexaphyllous", "pos_group": "adjective", "row_number": 72342, "definition": "Having six leaves or leaflets.", "details": []}, {"x": -0.5185936640340868, "y": 0.2420941598213667, "z": 0.8200311148999698, "word": "Hibiscus", "pos_group": "noun", "row_number": 72398, "definition": "A genus of plants (herbs shrubs or trees) some species of which have large showy flowers. Some species are cultivated in India for their fiber which is used as a substitute for hemp. See Althea Hollyhock and Manoe.", "details": []}, {"x": -0.3651219364619215, "y": 0.4405404989580113, "z": 0.8201280633487206, "word": "Hig-taper", "pos_group": "noun", "row_number": 72597, "definition": "A plant of the genus Verbascum (V. Thapsus); the common mullein. [Also high-taper and hag-taper.]", "details": []}, {"x": -0.5852960073089868, "y": 0.3769398235450392, "z": 0.7178753048085671, "word": "Hill", "pos_group": "noun", "row_number": 72610, "definition": "The earth raised about the roots of a plant or cluster of plants. [U. S.] See Hill v. t.", "details": []}, {"x": -0.414052437059033, "y": 0.2721768943872626, "z": 0.8686082647126842, "word": "Hill", "pos_group": "other", "row_number": 72611, "definition": "A single cluster or group of plants growing close together and having the earth heaped up about them; as a hill of corn or potatoes.", "details": []}, {"x": -0.4463436544195968, "y": 0.490363048858483, "z": 0.748546205970996, "word": "Hilum", "pos_group": "noun", "row_number": 72624, "definition": "The eye of a bean or other seed; the mark or scar at the point of attachment of an ovule or seed to its base or support; -- called also hile.", "details": []}, {"x": -0.5700558624347447, "y": 0.2733126412130973, "z": 0.7748138575534774, "word": "Hip", "pos_group": "noun", "row_number": 72704, "definition": "The fruit of a rosebush especially of the English dog-rose (Rosa canina).", "details": []}, {"x": -0.3552275897345495, "y": 0.3751715130832717, "z": 0.8561890534585168, "word": "Hirudo", "pos_group": "noun", "row_number": 72777, "definition": "A genus of leeches including the common medicinal leech. See Leech.", "details": []}, {"x": -0.5483439099327967, "y": 0.442095008954195, "z": 0.70983868554581, "word": "Histophyly", "pos_group": "noun", "row_number": 72821, "definition": "The tribal history of cells a division of morphophyly.", "details": []}, {"x": -0.4784150232670734, "y": 0.2414312436085025, "z": 0.8442926152241398, "word": "Hobblebush", "pos_group": "noun", "row_number": 72966, "definition": "A low bush (Viburnum lantanoides) having long straggling branches and handsome flowers. It is found in the Northern United States. Called also shinhopple.", "details": []}, {"x": -0.3883194173350521, "y": 0.4704810020229686, "z": 0.7923734327045732, "word": "Hognut", "pos_group": "noun", "row_number": 73082, "definition": "In England the Bunium flexuosum a tuberous plant.", "details": []}, {"x": -0.5911975544951734, "y": 0.3333700071160492, "z": 0.7344044457343458, "word": "Hogweed", "pos_group": "noun", "row_number": 73095, "definition": "A common weed (Ambrosia artemisiaege). See Ambrosia 3.", "details": []}, {"x": -0.3820506672942221, "y": 0.306428607310358, "z": 0.8718593901781835, "word": "Hogweed", "pos_group": "noun", "row_number": 73096, "definition": "In England the Heracleum Sphondylium.", "details": []}, {"x": -0.4875661616439707, "y": 0.4833691005230128, "z": 0.7270719020009913, "word": "Holdfast", "pos_group": "noun", "row_number": 73157, "definition": "A conical or branching body by which a seaweed is attached to its support and differing from a root in that it is not specially absorbent of moisture.", "details": []}, {"x": -0.5411836840389149, "y": 0.2492919258819971, "z": 0.8031025811315218, "word": "Hollyhock", "pos_group": "noun", "row_number": 73218, "definition": "A species of Althaea (A. rosea) bearing flowers of various colors; -- called also rose mallow.", "details": []}, {"x": -0.3564883516910018, "y": 0.4175429575318869, "z": 0.8358073544329204, "word": "Homochromous", "pos_group": "adjective", "row_number": 73381, "definition": "Having all the florets in the same flower head of the same color.", "details": []}, {"x": -0.5752932966120723, "y": 0.4035601661886546, "z": 0.7114610426010687, "word": "Homodermy", "pos_group": "noun", "row_number": 73384, "definition": "Homology of the germinal layers.", "details": []}, {"x": -0.4373141850490732, "y": 0.2558158215266982, "z": 0.8621569282975609, "word": "Homodynamous", "pos_group": "adjective", "row_number": 73390, "definition": "Pertaining to or involving homodynamy; as successive or homodynamous parts in plants and animals.", "details": []}, {"x": -0.4219031854657435, "y": 0.4877574785033411, "z": 0.7642580351281373, "word": "Homogamous", "pos_group": "adjective", "row_number": 73404, "definition": "Having all the flowers alike; -- said of such composite plants as Eupatorium and the thistels.", "details": []}, {"x": -0.5826995656365099, "y": 0.2934251489663869, "z": 0.7578673354625307, "word": "Homogenous", "pos_group": "adjective", "row_number": 73416, "definition": "Having a resemblance in structure due to descent from a common progenitor with subsequent modification; homogenetic; -- applied both to animals and plants. See Homoplastic.", "details": []}, {"x": -0.3608985224692029, "y": 0.348005183570374, "z": 0.8652425374932144, "word": "Homogonous", "pos_group": "adjective", "row_number": 73419, "definition": "Having all the flowers of a plant alike in respect to the stamens and pistils.", "details": []}, {"x": -0.5271920270561963, "y": 0.46194176122564, "z": 0.713216920609805, "word": "Homogony", "pos_group": "noun", "row_number": 73420, "definition": "The condition of having homogonous flowers.", "details": []}, {"x": -0.5038100264229255, "y": 0.2392342630250601, "z": 0.8300255566370155, "word": "Homomorphism", "pos_group": "noun", "row_number": 73453, "definition": "The possession in one species of plants of only one kind of flowers; -- opposed to heteromorphism dimorphism and trimorphism.", "details": []}, {"x": -0.3718886362498497, "y": 0.4537585505741013, "z": 0.8098160408445352, "word": "Homoplasmy", "pos_group": "noun", "row_number": 73479, "definition": "Resemblance between different plants or animals in external shape in general habit or in organs which is not due to descent from a common ancestor but to similar surrounding circumstances.", "details": []}, {"x": -0.5898905927372086, "y": 0.3601342928211907, "z": 0.7227256600774083, "word": "Homostyled", "pos_group": "adjective", "row_number": 73489, "definition": "Having only one form of pistils; -- said of the flowers of some plants.", "details": []}, {"x": -0.4002867217202032, "y": 0.2835758808931536, "z": 0.8714099266075437, "word": "Homosystemic", "pos_group": "adjective", "row_number": 73490, "definition": "Developing in the case of multicellular organisms from the same embryonic systems into which the secondary unit (gastrula or plant enbryo) differentiates.", "details": []}, {"x": -0.4618381209918551, "y": 0.4901961390283386, "z": 0.7391977376050486, "word": "Honesty", "pos_group": "adjective", "row_number": 73528, "definition": "Satin flower; the name of two cruciferous herbs having large flat pods the round shining partitions of which are more beautiful than the blossom; -- called also lunary and moonwort. Lunaria biennis is common honesty; L. rediva is perennial honesty.", "details": []}, {"x": -0.5607559391217269, "y": 0.2619852800070765, "z": 0.7854403158734112, "word": "Honewort", "pos_group": "noun", "row_number": 73529, "definition": "An umbelliferous plant of the genus Sison (S. Amomum); -- so called because used to cure a swelling called a hone.", "details": []}, {"x": -0.3532265915622111, "y": 0.3918825854356623, "z": 0.8495051584573244, "word": "Honeydew", "pos_group": "noun", "row_number": 73543, "definition": "A sweet saccharine substance found on the leaves of trees and other plants in small drops like dew. Two substances have been called by this name; one exuded from the plants and the other secreted by certain insects esp. aphids.", "details": []}, {"x": -0.5603859239927227, "y": 0.4286094553357753, "z": 0.7087041350151643, "word": "Honeysuckle", "pos_group": "noun", "row_number": 73552, "definition": "One of several species of flowering plants much admired for their beauty and some for their fragrance.", "details": []}, {"x": -0.4624358693739446, "y": 0.2444369946329603, "z": 0.8522931551826344, "word": "Honeywort", "pos_group": "noun", "row_number": 73557, "definition": "A European plant of the genus Cerinthe whose flowers are very attractive to bees.", "details": []}, {"x": -0.3996269270649464, "y": 0.4793742636278921, "z": 0.7813441204334004, "word": "Hop", "pos_group": "noun", "row_number": 73721, "definition": "A climbing plant (Humulus Lupulus) having a long twining annual stalk. It is cultivated for its fruit (hops).", "details": []}, {"x": -0.5902894943028597, "y": 0.3170752443841795, "z": 0.7423082933083711, "word": "Hordock", "pos_group": "noun", "row_number": 73784, "definition": "An unidentified plant mentioned by Shakespeare perhaps equivalent to burdock.", "details": []}, {"x": -0.3718591213609429, "y": 0.3214017610055377, "z": 0.8708741022003161, "word": "Horehound", "pos_group": "noun", "row_number": 73786, "definition": "A plant of the genus Marrubium (M. vulgare) which has a bitter taste and is a weak tonic used as a household remedy for colds coughing etc.", "details": []}, {"x": -0.5032940513535685, "y": 0.4774181936543137, "z": 0.7202547925838214, "word": "Hormogonium", "pos_group": "noun", "row_number": 73798, "definition": "A chain of small cells in certain algae by which the plant is propogated.", "details": []}, {"x": -0.5279628810490299, "y": 0.2429210853066834, "z": 0.8137840884091005, "word": "Horn", "pos_group": "noun", "row_number": 73802, "definition": "An incurved tapering and pointed appendage found in the flowers of the milkweed (Asclepias).", "details": []}, {"x": -0.3600382183323186, "y": 0.4327296215028324, "z": 0.8265092594847955, "word": "Hornwort", "pos_group": "noun", "row_number": 73856, "definition": "An aquatic plant (Ceratophyllum) with finely divided leaves.", "details": []}, {"x": -0.5830697280608016, "y": 0.3873637593118123, "z": 0.7141281468972661, "word": "Hornwrack", "pos_group": "noun", "row_number": 73857, "definition": "A bryozoan of the genus Flustra.", "details": []}, {"x": -0.4220734561371119, "y": 0.2643462937907387, "z": 0.8671649408178205, "word": "Horse-chestnut", "pos_group": "noun", "row_number": 73933, "definition": "The large nutlike seed of a species of Aesculus (Ae. Hippocastanum) formerly ground and fed to horses whence the name.", "details": []}, {"x": -0.4363897541668931, "y": 0.4912128912132026, "z": 0.7538394245223083, "word": "Horseknop", "pos_group": "noun", "row_number": 73954, "definition": "Knapweed.", "details": []}, {"x": -0.5763626142334349, "y": 0.2796243898881334, "z": 0.7678647911538138, "word": "Horsemint", "pos_group": "noun", "row_number": 73966, "definition": "A coarse American plant of the Mint family (Monarda punctata).", "details": []}, {"x": -0.3555349888090964, "y": 0.3647404550695861, "z": 0.8605575356524087, "word": "Horse-radish", "pos_group": "noun", "row_number": 73974, "definition": "A plant of the genus Nasturtium (N. Armoracia) allied to scurvy grass having a root of a pungent taste much used when grated as a condiment and in medicine.", "details": []}, {"x": -0.5412297573445678, "y": 0.4508956052043815, "z": 0.7097629907033154, "word": "Horsetail", "pos_group": "noun", "row_number": 73981, "definition": "A leafless plant with hollow and rushlike stems. It is of the genus Equisetum and is allied to the ferns. See Illust. of Equisetum.", "details": []}, {"x": -0.4882515099923404, "y": 0.2386170884596395, "z": 0.8394476446361883, "word": "Horseweed", "pos_group": "noun", "row_number": 73983, "definition": "A composite plant (Erigeron Canadensis) which is a common weed.", "details": []}, {"x": -0.3805785954247652, "y": 0.4655555851430369, "z": 0.7990105943269071, "word": "Horticultural", "pos_group": "adjective", "row_number": 74000, "definition": "Of or pertaining to horticulture or the culture of gardens or orchards.", "details": []}, {"x": -0.592423237658538, "y": 0.3431810972675981, "z": 0.7288768359334674, "word": "Horticulture", "pos_group": "noun", "row_number": 74001, "definition": "The cultivation of a garden or orchard; the art of cultivating gardens or orchards.", "details": []}, {"x": -0.3876385918219274, "y": 0.2966147204156532, "z": 0.8727863597485108, "word": "Hortus siccus", "pos_group": "other", "row_number": 74004, "definition": "A collection of specimens of plants dried and preserved and arranged systematically; an herbarium.", "details": []}, {"x": -0.4777471602043767, "y": 0.4877577634460928, "z": 0.7306504055392833, "word": "Hound's-tongue", "pos_group": "noun", "row_number": 74138, "definition": "A biennial weed (Cynoglossum officinale) with soft tongue-shaped leaves and an offensive odor. It bears nutlets covered with barbed or hooked prickles. Called also dog's-tongue.", "details": []}, {"x": -0.549726171115885, "y": 0.2523681886070498, "z": 0.7963111415580378, "word": "Houseleek", "pos_group": "noun", "row_number": 74194, "definition": "A succulent plant of the genus Sempervivum (S. tectorum) originally a native of subalpine Europe but now found very generally on old walls and roofs. It is very tenacious of life under drought and heat; -- called also ayegreen.", "details": []}, {"x": -0.3533628945856818, "y": 0.4083434779225021, "z": 0.8416592355390533, "word": "Huckleberry", "pos_group": "noun", "row_number": 74312, "definition": "The edible black or dark blue fruit of several species of the American genus Gaylussacia shrubs nearly related to the blueberries (Vaccinium) and formerly confused with them. The commonest huckelberry comes from G. resinosa.", "details": []}, {"x": -0.5710058039151193, "y": 0.4137816876854415, "z": 0.7090395523745033, "word": "Huckleberry", "pos_group": "noun", "row_number": 74313, "definition": "The shrub that bears the berries. Called also whortleberry.", "details": []}, {"x": -0.4464162089597163, "y": 0.2496733323207635, "z": 0.8592879584317941, "word": "Husk", "pos_group": "noun", "row_number": 74766, "definition": "The external covering or envelope of certain fruits or seeds; glume; hull; rind; in the United States especially applied to the covering of the ears of maize.", "details": []}, {"x": -0.4124173315619812, "y": 0.4863198670384541, "z": 0.7703278078526019, "word": "Hyacinth", "pos_group": "noun", "row_number": 74828, "definition": "A bulbous plant of the genus Hyacinthus bearing beautiful spikes of fragrant flowers. H. orientalis is a common variety.", "details": []}, {"x": -0.587234326090345, "y": 0.3014219203940189, "z": 0.7511994889290062, "word": "Hyacinth", "pos_group": "noun", "row_number": 74829, "definition": "A plant of the genus Camassia (C. Farseri) called also Eastern camass; wild hyacinth.", "details": []}, {"x": -0.3633514561382888, "y": 0.3373775721335584, "z": 0.8684193072148101, "word": "Hyacinth", "pos_group": "noun", "row_number": 74830, "definition": "The name also given to Scilla Peruviana a Mediterranean plant one variety of which produces white and another blue flowers; -- called also from a mistake as to its origin Hyacinth of Peru.", "details": []}, {"x": -0.5186862737319109, "y": 0.4693462744394835, "z": 0.7146178168167109, "word": "Hyacinthine", "pos_group": "adjective", "row_number": 74833, "definition": "Belonging to the hyacinth; resemblingthe hyacinth; in color like the hyacinth.", "details": []}, {"x": -0.5135524132662729, "y": 0.2386761520673862, "z": 0.8241951305744853, "word": "Hybrid", "pos_group": "noun", "row_number": 74857, "definition": "The offspring of the union of two distinct species; an animal or plant produced from the mixture of two species. See Mongrel.", "details": []}, {"x": -0.3656791724739672, "y": 0.4469023615161898, "z": 0.8164294348503165, "word": "Hybrid", "pos_group": "adjective", "row_number": 74858, "definition": "Produced from the mixture of two species; as plants of hybrid nature.", "details": []}, {"x": -0.5889516799310607, "y": 0.3705359948626819, "z": 0.7182193225035818, "word": "Hydrangea", "pos_group": "noun", "row_number": 74891, "definition": "A genus of shrubby plants bearing opposite leaves and large heads of showy flowers white or of various colors. H. hortensis the common garden species is a native of China or Japan.", "details": []}, {"x": -0.407535319759885, "y": 0.2748228508191363, "z": 0.8708543872633651, "word": "Hydrocaulus", "pos_group": "noun", "row_number": 74939, "definition": "The hollow stem of a hydroid either simple or branched. See Illust. of Gymnoblastea and Hydroidea.", "details": []}, {"x": -0.4517355633673743, "y": 0.492429064073232, "z": 0.7439412595394354, "word": "Hydroidea", "pos_group": "other", "row_number": 74986, "definition": "An extensive order of Hydrozoa or Acalephae.", "details": []}, {"x": -0.5680550646972857, "y": 0.2671799258593594, "z": 0.7784139841302633, "word": "Hydrophyllia", "pos_group": "other", "row_number": 75032, "definition": "of Hydrophyllium", "details": []}, {"x": -0.3522189809321022, "y": 0.3817155178037441, "z": 0.8545379177888894, "word": "Hydrophylliums", "pos_group": "other", "row_number": 75033, "definition": "of Hydrophyllium", "details": []}, {"x": -0.5542187094702343, "y": 0.4381385880144716, "z": 0.7077260767880699, "word": "Hydrophyte", "pos_group": "noun", "row_number": 75035, "definition": "An aquatic plant; an alga.", "details": []}, {"x": -0.4721915101588731, "y": 0.2402840736830094, "z": 0.8481148163239344, "word": "Hydrophytology", "pos_group": "noun", "row_number": 75036, "definition": "The branch of botany which treats of water plants.", "details": []}, {"x": -0.3910579274171938, "y": 0.4756948127295212, "z": 0.7879010994702282, "word": "Hydropiper", "pos_group": "noun", "row_number": 75040, "definition": "A species (Polygonum Hydropiper) of knotweed with acrid foliage; water pepper; smartweed.", "details": []}, {"x": -0.592817905945746, "y": 0.3263881161191391, "z": 0.7362321156037002, "word": "Hydrorhizae", "pos_group": "other", "row_number": 75045, "definition": "of Hydrorhiza", "details": []}, {"x": -0.3763541935198848, "y": 0.3110761254686492, "z": 0.8726907614862267, "word": "Hydrorhizas", "pos_group": "other", "row_number": 75046, "definition": "of Hydrorhiza", "details": []}, {"x": -0.4937837091030793, "y": 0.4830604246223277, "z": 0.7230700344974212, "word": "Hymenomycetes", "pos_group": "other", "row_number": 75168, "definition": "One of the great divisions of fungi containing those species in which the hymenium is completely exposed.", "details": []}, {"x": -0.5371437730282419, "y": 0.2446603415976529, "z": 0.8072285205233423, "word": "Hyoscyamus", "pos_group": "noun", "row_number": 75211, "definition": "A genus of poisonous plants of the Nightshade family; henbane.", "details": []}, {"x": -0.3556622876582911, "y": 0.4242481285284543, "z": 0.8327771986418545, "word": "Hyoscyamus", "pos_group": "noun", "row_number": 75212, "definition": "The leaves of the black henbane (Hyoscyamus niger) used in neuralgic and pectorial troubles.", "details": []}, {"x": -0.5799881802942759, "y": 0.3978641505810136, "z": 0.7108571082864568, "word": "Hypanthia", "pos_group": "other", "row_number": 75222, "definition": "of Hypanthium", "details": []}, {"x": -0.4306479767532884, "y": 0.2570740676470171, "z": 0.8651330787004482, "word": "Hypanthiums", "pos_group": "other", "row_number": 75223, "definition": "of Hypanthium", "details": []}, {"x": -0.426475433358297, "y": 0.4911628642997163, "z": 0.759524683914059, "word": "Hypanthium", "pos_group": "noun", "row_number": 75224, "definition": "A fruit consisting in large part of a receptacle enlarged below the calyx as in the Calycanthus the rose hip and the pear.", "details": []}, {"x": -0.5820574231825166, "y": 0.2867048624072728, "z": 0.7609267231410363, "word": "Hypericum", "pos_group": "noun", "row_number": 75276, "definition": "A genus of plants generally with dotted leaves and yellow flowers; -- called also St. John's-wort.", "details": []}, {"x": -0.3567055659030867, "y": 0.3540761177862717, "z": 0.8645179246650477, "word": "Hyphae", "pos_group": "other", "row_number": 75315, "definition": "The long branching filaments of which the mycelium (and the greater part of the plant) of a fungus is formed. They are also found enveloping the gonidia of lichens making up a large part of their structure.", "details": []}, {"x": -0.5334549888812588, "y": 0.4592713127320006, "z": 0.7102785623536172, "word": "Hyphomycetes", "pos_group": "other", "row_number": 75321, "definition": "One of the great division of fungi containing those species which have naked spores borne on free or only fasciculate threads.", "details": []}, {"x": -0.4981989345153728, "y": 0.2366631754817845, "z": 0.8341392947335745, "word": "Hypnum", "pos_group": "noun", "row_number": 75341, "definition": "The largest genus of true mosses; feather moss.", "details": []}, {"x": -0.3733353351391908, "y": 0.4597866794977193, "z": 0.8057399933557783, "word": "Hypocraterimorphous", "pos_group": "adjective", "row_number": 75379, "definition": "Salver-shaped; having a slender tube expanding suddenly above into a bowl-shaped or spreading border as in the blossom of the phlox and the lilac.", "details": []}, {"x": -0.5928042946475222, "y": 0.353375731588071, "z": 0.7236771798060578, "word": "Hypoderma", "pos_group": "noun", "row_number": 75391, "definition": "A layer of tissue beneath the epidermis in plants and performing the physiological function of strengthening the epidermal tissue. In phanerogamous plants it is developed as collenchyma.", "details": []}, {"x": -0.3939746587297209, "y": 0.287079244841479, "z": 0.8731377184957972, "word": "Hypogea", "pos_group": "other", "row_number": 75405, "definition": "of Hypogeum", "details": []}, {"x": -0.4676700124604253, "y": 0.4913522258785487, "z": 0.7347501273014256, "word": "Hypogyn", "pos_group": "noun", "row_number": 75410, "definition": "An hypogynous plant.", "details": []}, {"x": -0.5579010899157292, "y": 0.2563374347867305, "z": 0.7893272410083159, "word": "Hypogynous", "pos_group": "adjective", "row_number": 75411, "definition": "Inserted below the pistil or pistils; -- said of sepals petals and stamens; having the sepals petals and stamens inserted below the pistil; -- said of a flower or a plant.", "details": []}, {"x": -0.3510380684805008, "y": 0.3986217224540714, "z": 0.8472738617856852, "word": "Hypophyllous", "pos_group": "adjective", "row_number": 75423, "definition": "Being or growing on the under side of a leaf as the fruit dots of ferns.", "details": []}, {"x": -0.5659054424662711, "y": 0.4238802389891623, "z": 0.7071609245295903, "word": "Hyssop", "pos_group": "noun", "row_number": 75510, "definition": "A plant (Hyssopus officinalis). The leaves have an aromatic smell and a warm pungent taste.", "details": []}, {"x": -0.4559163101020121, "y": 0.2442349321437895, "z": 0.8558560720726845, "word": "Hysteranthous", "pos_group": "adjective", "row_number": 75511, "definition": "Having the leaves expand after the flowers have opened.", "details": []}, {"x": -0.4031578677652981, "y": 0.48396700028183, "z": 0.7766850560537039, "word": "Hysterophyte", "pos_group": "noun", "row_number": 75522, "definition": "A plant like the fungus which lives on dead or living organic matter.", "details": []}, {"x": -0.5910371226433246, "y": 0.3100643209415475, "z": 0.7446712271442724, "word": "Iceland moss", "pos_group": "other", "row_number": 75591, "definition": "A kind of lichen (Cetraria Icelandica) found from the Arctic regions to the North Temperate zone. It furnishes a nutritious jelly and other forms of food and is used in pulmonary complaints as a demulcent.", "details": []}, {"x": -0.3666576803240439, "y": 0.3267136245794195, "z": 0.8711029519945215, "word": "Ice plant", "pos_group": "other", "row_number": 75596, "definition": "A plant (Mesembryanthemum crystallinum) sprinkled with pellucid watery vesicles which glisten like ice. It is native along the Mediterranean in the Canaries and in South Africa. Its juice is said to be demulcent and diuretic; its ashes are used in Spain in making glass.", "details": []}, {"x": -0.5096545680733174, "y": 0.4761585879526377, "z": 0.7166067403820248, "word": "Icosandria", "pos_group": "other", "row_number": 75687, "definition": "A Linnaean class of plants having twenty or more stamens inserted in the calyx.", "details": []}, {"x": -0.5232170180818774, "y": 0.2390280051845402, "z": 0.8179911764359122, "word": "Ilicic", "pos_group": "adjective", "row_number": 76003, "definition": "Pertaining to or derived from the holly (Ilex) and allied plants; as ilicic acid.", "details": []}, {"x": -0.3601108782671846, "y": 0.4392967441179887, "z": 0.8230057873192458, "word": "Ilixanthin", "pos_group": "noun", "row_number": 76010, "definition": "A yellow dye obtained from the leaves of the holly.", "details": []}, {"x": -0.5871451504272266, "y": 0.3811327667931399, "z": 0.7141417131118973, "word": "Immortelle", "pos_group": "noun", "row_number": 76569, "definition": "A plant with a conspicuous dry unwithering involucre as the species of Antennaria Helichrysum Gomphrena etc. See Everlasting.", "details": []}, {"x": -0.4154222889650502, "y": 0.2665321012747861, "z": 0.8697039501008865, "word": "Impatiens", "pos_group": "noun", "row_number": 76720, "definition": "A genus of plants several species of which have very beautiful flowers; -- so called because the elastic capsules burst when touched and scatter the seeds with considerable force. Called also touch-me-not jewelweed and snapweed. I. Balsamina (sometimes called lady's slipper) is the common garden balsam.", "details": []}, {"x": -0.4415597603963503, "y": 0.4937851719225486, "z": 0.7491336209169474, "word": "Inactose", "pos_group": "noun", "row_number": 77499, "definition": "A variety of sugar found in certain plants. It is optically inactive.", "details": []}, {"x": -0.5748237413498234, "y": 0.2732054440834428, "z": 0.7713212376848962, "word": "Incanous", "pos_group": "adjective", "row_number": 77658, "definition": "Hoary with white pubescence.", "details": []}, {"x": -0.3520672374856761, "y": 0.3712004382357983, "z": 0.8592199339766018, "word": "Incomplete", "pos_group": "adjective", "row_number": 78055, "definition": "Wanting any of the usual floral organs; -- said of a flower.", "details": []}, {"x": -0.5473201209829415, "y": 0.4473498743241738, "z": 0.7073321533122642, "word": "Incubous", "pos_group": "adjective", "row_number": 78339, "definition": "Having the leaves so placed that the upper part of each one covers the base of the leaf next above it as in hepatic mosses of the genus Frullania. See Succubous.", "details": []}, {"x": -0.4821697696079034, "y": 0.2369483098904814, "z": 0.8434262337135984, "word": "Indigofera", "pos_group": "noun", "row_number": 78739, "definition": "A genus of leguminous plants having many species mostly in tropical countries several of them yielding indigo esp. Indigofera tinctoria and I. Anil.", "details": []}, {"x": -0.3828925625933165, "y": 0.4711283176075407, "z": 0.7946265751024261, "word": "Induplicative", "pos_group": "adjective", "row_number": 79013, "definition": "Having induplicate leaves in vernation.", "details": []}, {"x": -0.5945284847853752, "y": 0.3361918847983373, "z": 0.7304183030117382, "word": "Indusium", "pos_group": "noun", "row_number": 79030, "definition": "A collection of hairs united so as to form a sort of cup and inclosing the stigma of a flower.", "details": []}, {"x": -0.3816518697041657, "y": 0.3009141398547921, "z": 0.8739522474293232, "word": "Indusium", "pos_group": "noun", "row_number": 79031, "definition": "The immediate covering of the fruit dots or sori in many ferns usually a very thin scale attached by the middle or side to a veinlet.", "details": []}, {"x": -0.4839080823202834, "y": 0.4879703095452087, "z": 0.7264419762565067, "word": "Indusium", "pos_group": "noun", "row_number": 79032, "definition": "A peculiar covering found in certain fungi.", "details": []}, {"x": -0.546060628957391, "y": 0.2473161756286019, "z": 0.8004077078433846, "word": "Indutive", "pos_group": "adjective", "row_number": 79043, "definition": "Covered; -- applied to seeds which have the usual integumentary covering.", "details": []}, {"x": -0.3520414812084263, "y": 0.4151476685587821, "z": 0.8388797344070155, "word": "Induviae", "pos_group": "other", "row_number": 79044, "definition": "Persistent portions of a calyx or corolla; also leaves which do not disarticulate from the stem and hence remain for a long time.", "details": []}, {"x": -0.5760572926604057, "y": 0.4083605800164703, "z": 0.7080957790167767, "word": "Inee", "pos_group": "noun", "row_number": 79067, "definition": "An arrow poison made from an apocynaceous plant (Strophanthus hispidus) of the Gaboon country; -- called also onaye.", "details": []}, {"x": -0.4397199012547891, "y": 0.2504271437862455, "z": 0.8625153065862318, "word": "Infertile", "pos_group": "adjective", "row_number": 79397, "definition": "Not fertile; not productive; barren; sterile; as an infertile soil.", "details": []}, {"x": -0.4166774909713956, "y": 0.4901947129259327, "z": 0.7655645054058116, "word": "Inflated", "pos_group": "adjective", "row_number": 79516, "definition": "Hollow and distended as a perianth corolla nectary or pericarp.", "details": []}, {"x": -0.5870831479320283, "y": 0.2945140280552009, "z": 0.7540522957281681, "word": "Inflorescence", "pos_group": "noun", "row_number": 79563, "definition": "A flowering; the putting forth and unfolding of blossoms.", "details": []}, {"x": -0.3587467628796974, "y": 0.3432557982794624, "z": 0.8680300784367251, "word": "Inflorescence", "pos_group": "noun", "row_number": 79564, "definition": "The mode of flowering or the general arrangement and disposition of the flowers with reference to the axis and to each other.", "details": []}, {"x": -0.5250657917311169, "y": 0.4671481828446739, "z": 0.7113919381175853, "word": "Inflorescence", "pos_group": "noun", "row_number": 79565, "definition": "An axis on which all the flower buds.", "details": []}, {"x": -0.5081817373772138, "y": 0.2356012350176399, "z": 0.8283980805472929, "word": "Inheritance", "pos_group": "noun", "row_number": 79946, "definition": "Transmission and reception by animal or plant generation.", "details": []}, {"x": -0.3666548635424771, "y": 0.4532014663644759, "z": 0.8125100872762973, "word": "Innovation", "pos_group": "noun", "row_number": 80208, "definition": "A newly formed shoot or the annually produced addition to the stems of many mosses.", "details": []}, {"x": -0.5923201186803637, "y": 0.3638820822569252, "z": 0.7188509631480259, "word": "Inoculator", "pos_group": "noun", "row_number": 80251, "definition": "One who inoculates; one who propagates plants or diseases by inoculation.", "details": []}, {"x": -0.4010240066629927, "y": 0.2779009173881547, "z": 0.872897947182133, "word": "Inserted", "pos_group": "adjective", "row_number": 80490, "definition": "Situated upon attached to or growing out of some part; -- said especially of the parts of the flower; as the calyx corolla and stamens of many flowers are inserted upon the receptacle.", "details": []}, {"x": -0.4574067443947465, "y": 0.494108224539114, "z": 0.7393484514253097, "word": "Intercross", "pos_group": "noun", "row_number": 81282, "definition": "The process or result of cross fertilization between different kinds of animals or different varieties of plants.", "details": []}, {"x": -0.5656370938404011, "y": 0.2611861759166354, "z": 0.7821997568280302, "word": "Interosculant", "pos_group": "adjective", "row_number": 81616, "definition": "Uniting two groups; -- said of certain genera which connect family groups or of species that connect genera. See Osculant.", "details": []}, {"x": -0.3495470393114757, "y": 0.388441862695364, "z": 0.8526017749303234, "word": "I
