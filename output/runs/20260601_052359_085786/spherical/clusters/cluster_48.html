 []}, {"x": -0.6042125469492805, "y": 0.327707572861694, "z": 0.726316008909456, "word": "Marlite", "pos_group": "noun", "row_number": 93508, "definition": "A variety of marl.", "details": []}, {"x": -0.3694852992062358, "y": 0.2994920225061844, "z": 0.8796505795630635, "word": "Marram", "pos_group": "noun", "row_number": 93551, "definition": "A coarse grass found on sandy beaches (Ammophila arundinacea). See Beach grass under Beach.", "details": []}, {"x": -0.4892201968316205, "y": 0.4962691962036306, "z": 0.7172032375215779, "word": "Marrowfat", "pos_group": "noun", "row_number": 93577, "definition": "A rich but late variety of pea.", "details": []}, {"x": -0.5474377485005746, "y": 0.2342198237674104, "z": 0.8034008872729635, "word": "Marrubium", "pos_group": "noun", "row_number": 93581, "definition": "A genus of bitter aromatic plants sometimes used in medicine; hoarhound.", "details": []}, {"x": -0.3417503288946665, "y": 0.4238869341704145, "z": 0.8387649132742702, "word": "Marsdenia", "pos_group": "noun", "row_number": 93595, "definition": "A genus of plants of the Milkweed family mostly woody climbers with fragrant flowers several species of which furnish valuable fiber and one species (Marsdenia tinctoria) affords indigo.", "details": []}, {"x": -0.586907309248851, "y": 0.4062842702818658, "z": 0.7003377057333166, "word": "Marsh marigold", "pos_group": "other", "row_number": 93623, "definition": "A perennial plant of the genus Caltha (C. palustris) growing in wet places and bearing bright yellow flowers. In the United States it is used as a pot herb under the name of cowslip. See Cowslip.", "details": []}, {"x": -0.4310555472869501, "y": 0.242474519614493, "z": 0.8691359056504734, "word": "Marshy", "pos_group": "adjective", "row_number": 93625, "definition": "Pertaining to or produced in marshes; as a marshy weed.", "details": []}, {"x": -0.415659515107418, "y": 0.501719321473268, "z": 0.7586203859382304, "word": "Martagon", "pos_group": "noun", "row_number": 93646, "definition": "A lily (Lilium Martagon) with purplish red flowers found in Europe and Asia.", "details": []}, {"x": -0.5942950742213827, "y": 0.2831885691439724, "z": 0.7527400607529738, "word": "Mary-bud", "pos_group": "noun", "row_number": 93717, "definition": "The marigold; a blossom of the marigold.", "details": []}, {"x": -0.3461784853183893, "y": 0.3461592591744494, "z": 0.8719714580136564, "word": "Masterwort", "pos_group": "noun", "row_number": 93879, "definition": "A tall and coarse European umbelliferous plant (Peucedanum Ostruthium formerly Imperatoria).", "details": []}, {"x": -0.5334418714738873, "y": 0.4719082800876432, "z": 0.7019560847682418, "word": "Masterwort", "pos_group": "noun", "row_number": 93880, "definition": "The Astrantia major a European umbelliferous plant with a showy colored involucre.", "details": []}, {"x": -0.5054422899796506, "y": 0.2234002317667958, "z": 0.8334389167459537, "word": "Mat", "pos_group": "noun", "row_number": 93939, "definition": "Anything growing thickly or closely interwoven so as to resemble a mat in form or texture; as a mat of weeds; a mat of hair.", "details": []}, {"x": -0.3593723213578194, "y": 0.4641579914255109, "z": 0.8095732787325232, "word": "Mate", "pos_group": "noun", "row_number": 93987, "definition": "The Paraguay tea being the dried leaf of the Brazilian holly (Ilex Paraguensis). The infusion has a pleasant odor with an agreeable bitter taste and is much used for tea in South America.", "details": []}, {"x": -0.6028485242720798, "y": 0.35764125528834, "z": 0.7132085174048022, "word": "Matfelon", "pos_group": "noun", "row_number": 94044, "definition": "The knapweed (Centaurea nigra).", "details": []}, {"x": -0.3898270209540725, "y": 0.2738738722744071, "z": 0.8792201065828141, "word": "Mathes", "pos_group": "noun", "row_number": 94051, "definition": "The mayweed. Cf. Maghet.", "details": []}, {"x": -0.4604456632517317, "y": 0.5040067628529895, "z": 0.7307304388015621, "word": "Matico", "pos_group": "noun", "row_number": 94054, "definition": "A Peruvian plant (Piper / Artanthe elongatum) allied to the pepper the leaves of which are used as a styptic and astringent.", "details": []}, {"x": -0.569398182266225, "y": 0.2483351303911688, "z": 0.7836551365527569, "word": "Mattamore", "pos_group": "noun", "row_number": 94110, "definition": "A subterranean repository for wheat.", "details": []}, {"x": -0.3380130723232921, "y": 0.395220910520017, "z": 0.8541355833977987, "word": "Matweed", "pos_group": "noun", "row_number": 94175, "definition": "A name of several maritime grasses as the sea sand-reed (Ammophila arundinacea) which is used in Holland to bind the sand of the seacoast dikes (see Beach grass under Beach); also the Lygeum Spartum a Mediterranean grass of similar habit.", "details": []}, {"x": -0.5703152726171082, "y": 0.4343445862811365, "z": 0.6971981570457153, "word": "Maudeline", "pos_group": "noun", "row_number": 94184, "definition": "An aromatic composite herb the costmary; also the South European Achillea Ageratum a kind of yarrow.", "details": []}, {"x": -0.4591371263862857, "y": 0.229660880185467, "z": 0.8581660557760254, "word": "May", "pos_group": "noun", "row_number": 94274, "definition": "The flowers of the hawthorn; -- so called from their time of blossoming; also the hawthorn.", "details": []}, {"x": -0.3907039031160084, "y": 0.492443132028155, "z": 0.7777211722771968, "word": "Maypop", "pos_group": "noun", "row_number": 94298, "definition": "The edible fruit of a passion flower especially that of the North American Passiflora incarnata an oval yellowish berry as large as a small apple.", "details": []}, {"x": -0.602878213707768, "y": 0.3095898315320425, "z": 0.7353176154890434, "word": "Mayweed", "pos_group": "noun", "row_number": 94299, "definition": "A composite plant (Anthemis Cotula) having a strong odor; dog's fennel. It is a native of Europe now common by the roadsides in the United States.", "details": []}, {"x": -0.358353338407547, "y": 0.3163928204776805, "z": 0.8783384700685405, "word": "Meadow", "pos_group": "noun", "row_number": 94336, "definition": "Low land covered with coarse grass or rank herbage near rives and in marshy places by the sea; as the salt meadows near Newark Bay.", "details": []}, {"x": -0.5067620416022163, "y": 0.4892993842028328, "z": 0.7097734468193934, "word": "Meadow", "pos_group": "adjective", "row_number": 94337, "definition": "Of or pertaining to a meadow; of the nature of a meadow; produced growing or living in a meadow.", "details": []}, {"x": -0.5324839998071285, "y": 0.2274259046646543, "z": 0.81531481517072, "word": "Meadowwort", "pos_group": "noun", "row_number": 94339, "definition": "The name of several plants of the genus Spiraea especially the white- or pink-flowered S. salicifolia a low European and American shrub and the herbaceous S. Ulmaria which has fragrant white flowers in compound cymes.", "details": []}, {"x": -0.3460437749193384, "y": 0.44071676051169, "z": 0.8282647178551408, "word": "Mechoacan", "pos_group": "noun", "row_number": 94515, "definition": "A species of jalap of very feeble properties said to be obtained from the root of a species of Convolvulus (C. Mechoacan); -- so called from Michoacan in Mexico whence it is obtained.", "details": []}, {"x": -0.5953208506931033, "y": 0.3880893630956527, "z": 0.7035479592622316, "word": "Medic", "pos_group": "noun", "row_number": 94593, "definition": "A leguminous plant of the genus Medicago. The black medic is the Medicago lupulina; the purple medic or lucern is M. sativa.", "details": []}, {"x": -0.4141339582757113, "y": 0.252310410014016, "z": 0.8745470379581938, "word": "Medical", "pos_group": "adjective", "row_number": 94597, "definition": "Containing medicine; used in medicine; medicinal; as the medical properties of a plant.", "details": []}, {"x": -0.431988964357464, "y": 0.5052485747262553, "z": 0.7470672074254452, "word": "Mediostapedial", "pos_group": "noun", "row_number": 94637, "definition": "The mediostapedial part of the columella.", "details": []}, {"x": -0.5869225021260829, "y": 0.2679755418673856, "z": 0.7640098726187636, "word": "Medoc", "pos_group": "noun", "row_number": 94676, "definition": "A class of claret wines including several varieties from the district of Medoc in the department of Gironde.", "details": []}, {"x": -0.3405015695324204, "y": 0.3649039941541192, "z": 0.8665470305738336, "word": "Medullin", "pos_group": "noun", "row_number": 94687, "definition": "A variety of lignin or cellulose found in the medulla or pith of certain plants. Cf. Lignin and Cellulose.", "details": []}, {"x": -0.5489780945643468, "y": 0.4593121469800918, "z": 0.6983232799535168, "word": "Megacephalous", "pos_group": "adjective", "row_number": 94744, "definition": "Large headed; -- applied to animals and to plants when they have large flower heads.", "details": []}, {"x": -0.4879892744447178, "y": 0.2230611585072669, "z": 0.8438662142735148, "word": "Megaphyton", "pos_group": "noun", "row_number": 94773, "definition": "An extinct genus of tree ferns with large two-ranked leaves or fronds.", "details": []}, {"x": -0.3693592946002431, "y": 0.4770951872265038, "z": 0.7974671741317745, "word": "Melanosperm", "pos_group": "noun", "row_number": 94859, "definition": "An alga of any kind that produces blackish spores or seed dust. The melanosperms include the rockweeds and all kinds of kelp.", "details": []}, {"x": -0.6053638127797641, "y": 0.3387303904475031, "z": 0.720275209044452, "word": "Melastoma", "pos_group": "noun", "row_number": 94869, "definition": "A genus of evergreen tropical shrubs; -- so called from the black berries of some species which stain the mouth.", "details": []}, {"x": -0.3759098144779149, "y": 0.2886606133461771, "z": 0.8805491818642434, "word": "Melastomaceous", "pos_group": "adjective", "row_number": 94870, "definition": "Belonging to the order of which Melastoma is the type.", "details": []}, {"x": -0.4782445480207151, "y": 0.5009490789864941, "z": 0.72134053854684, "word": "Meleagrine", "pos_group": "adjective", "row_number": 94872, "definition": "Of or pertaining to the genus Meleagris.", "details": []}, {"x": -0.5568520327881444, "y": 0.2378854635823367, "z": 0.7958180192706924, "word": "Meliaceous", "pos_group": "adjective", "row_number": 94880, "definition": "Pertaining to a natural order (Meliacae) of plants of which the genus Melia is the type. It includes the mahogany and the Spanish cedar.", "details": []}, {"x": -0.3384978331318266, "y": 0.4135293445088619, "z": 0.8452293760838705, "word": "Melic grass", "pos_group": "other", "row_number": 94885, "definition": "A genus of grasses (Melica) of little agricultural importance.", "details": []}, {"x": -0.5819383628120892, "y": 0.4176262358998442, "z": 0.6978080459379303, "word": "Melilot", "pos_group": "noun", "row_number": 94889, "definition": "Any species of Melilotus a genus of leguminous herbs having a vanillalike odor; sweet clover; hart's clover. The blue melilot (Melilotus caerulea) is used in Switzerland to give color and flavor to sapsago cheese.", "details": []}, {"x": -0.4412917327198222, "y": 0.2358392856422638, "z": 0.8658183631575873, "word": "Meliphagan", "pos_group": "adjective", "row_number": 94900, "definition": "Belonging to the genus Meliphaga.", "details": []}, {"x": -0.4051849086058913, "y": 0.499890413056556, "z": 0.7654637579743283, "word": "Melissa", "pos_group": "noun", "row_number": 94906, "definition": "A genus of labiate herbs including the balm or bee balm (Melissa officinalis).", "details": []}, {"x": -0.5991567092474359, "y": 0.2922565973205556, "z": 0.7453840078016125, "word": "Melluco", "pos_group": "noun", "row_number": 94947, "definition": "A climbing plant (Ullucus officinalis) of the Andes having tuberous roots which are used as a substitute for potatoes.", "details": []}, {"x": -0.3491400376281398, "y": 0.3343451159869846, "z": 0.8753939556226503, "word": "Menispermaceous", "pos_group": "adjective", "row_number": 95135, "definition": "Pertaining to a natural order (Menispermace/) of climbing plants of which moonseed (Menispermum) is the type.", "details": []}, {"x": -0.5238620066037313, "y": 0.4799935785144614, "z": 0.7036865514005463, "word": "Menispermic", "pos_group": "adjective", "row_number": 95136, "definition": "Pertaining to or obtained from moonseed (Menispermum) or other plants of the same family as the Anamirta Cocculus.", "details": []}, {"x": -0.5162625376963166, "y": 0.2230260189209886, "z": 0.8268811202679707, "word": "Menispermine", "pos_group": "noun", "row_number": 95137, "definition": "An alkaloid distinct from picrotoxin and obtained from the cocculus indicus (the fruit of Anamirta Cocculus formerly Menispermum Cocculus) as a white crystalline tasteless powder; -- called also menispermina.", "details": []}, {"x": -0.3526495160983767, "y": 0.4563522232560001, "z": 0.8169338817339421, "word": "Mentha", "pos_group": "noun", "row_number": 95192, "definition": "A widely distributed genus of fragrant herbs including the peppermint spearmint etc. The plants have small flowers usually arranged in dense axillary clusters.", "details": []}, {"x": -0.6015917956236109, "y": 0.36926115359528, "z": 0.7083314985822972, "word": "Mercury", "pos_group": "noun", "row_number": 95296, "definition": "A plant (Mercurialis annua) of the Spurge family the leaves of which are sometimes used for spinach in Europe.", "details": []}, {"x": -0.3980596789105465, "y": 0.2642755774813538, "z": 0.8784685032330581, "word": "Meride", "pos_group": "noun", "row_number": 95327, "definition": "A permanent colony of cells or plastids which may remain isolated like Rotifer or may multiply by gemmation to form higher aggregates termed zoides.", "details": []}, {"x": -0.4492122646092582, "y": 0.5062704594808498, "z": 0.7361375979948795, "word": "Mesembryanthemum", "pos_group": "noun", "row_number": 95431, "definition": "A genus of herbaceous or suffruticose plants chiefly natives of South Africa. The leaves are opposite thick and f/eshy. The flowers usually open about midday whence the name.", "details": []}, {"x": -0.5773836802226967, "y": 0.2543310207346176, "z": 0.7758503835821584, "word": "Mesosperm", "pos_group": "noun", "row_number": 95538, "definition": "A membrane of a seed. See Secundine.", "details": []}, {"x": -0.3371260295577524, "y": 0.3838436272021151, "z": 0.8596569723156727, "word": "Micaceous", "pos_group": "adjective", "row_number": 96053, "definition": "Pertaining to or containing mica; splitting into laminae or leaves like mica.", "details": []}, {"x": -0.5632868283948202, "y": 0.4448592579720827, "z": 0.6962816883657307, "word": "Microphyte", "pos_group": "noun", "row_number": 96141, "definition": "A very minute plant one of certain unicellular algae such as the germs of various infectious diseases are believed to be.", "details": []}, {"x": -0.4700445490768772, "y": 0.2252661948818478, "z": 0.8534127157047571, "word": "Micropyle", "pos_group": "noun", "row_number": 96143, "definition": "An opening in the outer coat of a seed through which the fecundating pollen enters the ovule.", "details": []}, {"x": -0.3812998299210288, "y": 0.4881371467364997, "z": 0.7850685101812092, "word": "Microspore", "pos_group": "noun", "row_number": 96157, "definition": "One of the exceedingly minute spores found in certain flowerless plants as Selaginella and Isoetes which bear two kinds of spores one very much smaller than the other. Cf. Macrospore.", "details": []}, {"x": -0.6054892997131769, "y": 0.3200699832595447, "z": 0.7286548660024729, "word": "Midrib", "pos_group": "noun", "row_number": 96227, "definition": "A continuation of the petiole extending from the base to the apex of the lamina of a leaf.", "details": []}, {"x": -0.3635635059886439, "y": 0.304974158280992, "z": 0.8802342528520721, "word": "Mignonette", "pos_group": "noun", "row_number": 96279, "definition": "A plant (Reseda odorata) having greenish flowers with orange-colored stamens and exhaling a delicious fragrance. In Africa it is a low shrub but further north it is usually an annual herb.", "details": []}, {"x": -0.496117192876422, "y": 0.4953885706410534, "z": 0.7130623359921859, "word": "Milfoil", "pos_group": "noun", "row_number": 96315, "definition": "A common composite herb (Achillea Millefolium) with white flowers and finely dissected leaves; yarrow.", "details": []}, {"x": -0.5426254560883597, "y": 0.2296003807237983, "z": 0.807985940209597, "word": "Miliary", "pos_group": "adjective", "row_number": 96317, "definition": "Like millet seeds; as a miliary eruption.", "details": []}, {"x": -0.3413878044562817, "y": 0.4311488090499767, "z": 0.8352036107580632, "word": "Miliolitic", "pos_group": "adjective", "row_number": 96325, "definition": "Of or pertaining to the genus Miliola; containing miliolites.", "details": []}, {"x": -0.5916947184516334, "y": 0.3997586096379534, "z": 0.700064578575986, "word": "Milk", "pos_group": "noun", "row_number": 96346, "definition": "A kind of juice or sap usually white in color found in certain plants; latex. See Latex.", "details": []}, {"x": -0.4237937420926216, "y": 0.2444024602404222, "z": 0.8721618551573793, "word": "Milk vetch", "pos_group": "other", "row_number": 96366, "definition": "A leguminous herb (Astragalus glycyphyllos) of Europe and Asia supposed to increase the secretion of milk in goats.", "details": []}, {"x": -0.4210212068199787, "y": 0.5049696725362062, "z": 0.7534897300073341, "word": "Milkweed", "pos_group": "noun", "row_number": 96367, "definition": "Any plant of the genera Asclepias and Acerates abounding in a milky juice and having its seed attached to a long silky down; silkweed. The name is also applied to several other plants with a milky juice as to several kinds of spurge.", "details": []}, {"x": -0.5930884161089565, "y": 0.2760306845930602, "z": 0.7563419807471062, "word": "Milkwort", "pos_group": "noun", "row_number": 96368, "definition": "A genus of plants (Polygala) of many species. The common European P. vulgaris was supposed to have the power of producing a flow of milk in nurses.", "details": []}, {"x": -0.3420327572825784, "y": 0.3530332154705912, "z": 0.8708508148472802, "word": "Millepora", "pos_group": "noun", "row_number": 96411, "definition": "A genus of Hydrocorallia which includes the millipores.", "details": []}, {"x": -0.5402032965969024, "y": 0.4684945130167753, "z": 0.6990660123471987, "word": "Millet", "pos_group": "noun", "row_number": 96422, "definition": "The name of several cereal and forage grasses which bear an abundance of small roundish grains. The common millets of Germany and Southern Europe are Panicum miliaceum and Setaria Italica.", "details": []}, {"x": -0.4990532424044756, "y": 0.2211254569415777, "z": 0.8378838783136707, "word": "Miltwaste", "pos_group": "other", "row_number": 96474, "definition": "A small European fern (Asplenium Ceterach) formerly used in medicine.", "details": []}, {"x": -0.3614716278706614, "y": 0.4704951941519661, "z": 0.8049674120884881, "word": "Mimosa", "pos_group": "noun", "row_number": 96504, "definition": "A genus of leguminous plants containing many species and including the sensitive plants (Mimosa sensitiva and M. pudica).", "details": []}, {"x": -0.6055816320105086, "y": 0.3501340952853081, "z": 0.7146166820682455, "word": "Mineral", "pos_group": "other", "row_number": 96571, "definition": "Anything which is neither animal nor vegetable as in the most general classification of things into three kingdoms (animal vegetable and mineral).", "details": []}, {"x": -0.3831330129371916, "y": 0.2781749152336181, "z": 0.880810882614673, "word": "Mint", "pos_group": "noun", "row_number": 96732, "definition": "The name of several aromatic labiate plants mostly of the genus Mentha yielding odoriferous essential oils by distillation. See Mentha.", "details": []}, {"x": -0.4670249911860478, "y": 0.5047381761835528, "z": 0.7260351445423098, "word": "Mirabilis", "pos_group": "noun", "row_number": 96790, "definition": "A genus of plants. See Four-o'clock.", "details": []}, {"x": -0.5658272403511767, "y": 0.2425192473576612, "z": 0.7880507272616689, "word": "Mistletoe", "pos_group": "noun", "row_number": 97473, "definition": "A parasitic evergreen plant of Europe (Viscum album) bearing a glutinous fruit. When found upon the oak where it is rare it was an object of superstitious regard among the Druids. A bird lime is prepared from its fruit.", "details": []}, {"x": -0.3361371804777792, "y": 0.4026351743801519, "z": 0.8514086634820636, "word": "Miterwort", "pos_group": "noun", "row_number": 97561, "definition": "Any plant of the genus Mitella -- slender perennial herbs with a pod slightly resembling a bishop's miter; bishop's cap.", "details": []}, {"x": -0.5760935115924074, "y": 0.428791207104062, "z": 0.6958838743722763, "word": "Mitu", "pos_group": "noun", "row_number": 97594, "definition": "A South American curassow of the genus Mitua.", "details": []}, {"x": -0.45192778662558, "y": 0.2300020973782216, "z": 0.8618934451991868, "word": "Modioli", "pos_group": "other", "row_number": 97821, "definition": "of Modiolus", "details": []}, {"x": -0.3949970465161562, "y": 0.4970616931531116, "z": 0.7725975708240839, "word": "Moly", "pos_group": "noun", "row_number": 98069, "definition": "A kind of garlic (Allium Moly) with large yellow flowers; -- called also golden garlic.", "details": []}, {"x": -0.6031955907518072, "y": 0.3020010365202968, "z": 0.7382075949475491, "word": "Monad", "pos_group": "noun", "row_number": 98112, "definition": "One of the smallest flangellate Infusoria; esp. the species of the genus Monas and allied genera.", "details": []}, {"x": -0.3530284356193532, "y": 0.3225337500445817, "z": 0.8782612958148226, "word": "Monadelphia", "pos_group": "other", "row_number": 98116, "definition": "A Linnaean class of plants having the stamens united into a tube or ring by the filaments as in the Mallow family.", "details": []}, { ant of the genus Aconitum; aconite. See Aconite.", "details": []}, {"x": -0.3371823251498922, "y": 0.3721246155697554, "z": 0.8647724267653162, "word": "Monocarp", "pos_group": "noun", "row_number": 98299, "definition": "A monocarpic plant.", "details": []}, {"x": -0.5554796324501337, "y": 0.4549865532280012, "z": 0.6960097803298224, "word": "Monocephalous", "pos_group": "adjective", "row_number": 98303, "definition": "Having a solitary head; -- said of unbranched composite plants.", "details": []}, {"x": -0.4811570307089782, "y": 0.2217849119680791, "z": 0.8481151835821775, "word": "Monochlamydeous", "pos_group": "adjective", "row_number": 98306, "definition": "Having a single floral envelope that is a calyx without a corolla or possibly in rare cases a corolla without a calyx.", "details": []}, {"x": -0.3723726315613905, "y": 0.4828716832826026, "z": 0.7925740096343499, "word": "Monoclinous", "pos_group": "adjective", "row_number": 98318, "definition": "Hermaphrodite or having both stamens and pistils in every flower.", "details": []}, {"x": -0.6071921018671633, "y": 0.3310516510643595, "z": 0.7223036451228098, "word": "Monocotyl", "pos_group": "noun", "row_number": 98320, "definition": "Any monocotyledonous plant.", "details": []}, {"x": -0.3696364551669592, "y": 0.2937758761507062, "z": 0.8815126916859957, "word": "Monocotyle", "pos_group": "adjective", "row_number": 98321, "definition": "Monocotyledonous.", "details": []}, {"x": -0.4851087180808644, "y": 0.5006511434955244, "z": 0.7169504614396759, "word": "Monocotyledon", "pos_group": "noun", "row_number": 98322, "definition": "A plant with only one cotyledon or seed lobe.", "details": []}, {"x": -0.5524402863788878, "y": 0.2327737403820681, "z": 0.8003912266973908, "word": "Monocotyledonous", "pos_group": "adjective", "row_number": 98323, "definition": "Having only one cotyledon seed lobe or seminal leaf.", "details": []}, {"x": -0.3375775915179355, "y": 0.4209347341759415, "z": 0.8419354602754177, "word": "Monoecia", "pos_group": "other", "row_number": 98352, "definition": "A Linnaean class of plants whose stamens and pistils are in distinct flowers in the same plant.", "details": []}, {"x": -0.5871481511611529, "y": 0.4113816794363018, "z": 0.6971528974423099, "word": "Monoecious", "pos_group": "adjective", "row_number": 98356, "definition": "Having the sexes united in one individual as when male and female flowers grow upon the same individual plant; hermaphrodite; -- opposed to dioecious.", "details": []}, {"x": -0.4339651826438219, "y": 0.2372091999643837, "z": 0.8691409642314479, "word": "Monogamia", "pos_group": "other", "row_number": 98359, "definition": "A Linnaean order of plants having solitary flowers with united anthers as in the genus Lobelia.", "details": []}, {"x": -0.4102198612501632, "y": 0.503683025844298, "z": 0.760278287807977, "word": "Monogynia", "pos_group": "other", "row_number": 98400, "definition": "A Linnaean order of plants including those which have only one style or stigma.", "details": []}, {"x": -0.5984972208113146, "y": 0.2848573354171907, "z": 0.74877057577081, "word": "Monomerous", "pos_group": "adjective", "row_number": 98425, "definition": "Composed of solitary parts as a flower with one sepal one petal one stamen and one pistil.", "details": []}, {"x": -0.3445143577251627, "y": 0.341032885727855, "z": 0.874646458961191, "word": "Monophyllous", "pos_group": "adjective", "row_number": 98454, "definition": "One-leaved; composed of a single leaf; as a monophyllous involucre or calyx.", "details": []}, {"x": -0.53078438003933, "y": 0.4770962753535608, "z": 0.700462051755856, "word": "Monosperm", "pos_group": "noun", "row_number": 98493, "definition": "A monospermous plant.", "details": []}, {"x": -0.5101166204109053, "y": 0.2201758806209358, "z": 0.8314467001397935, "word": "Monostichous", "pos_group": "adjective", "row_number": 98498, "definition": "Arranged in a single row on one side of an axis as the flowers in grasses of the tribe "An edible fungus. Same as 1st Morel.", "details": []}, {"x": -0.3851756010161027, "y": 0.4932371225254285, "z": 0.779972369603385, "word": "Morning-glory", "pos_group": "noun", "row_number": 98924, "definition": "A climbing plant (Ipomoea purpurea) having handsome funnel-shaped flowers usually red pink purple white or variegated sometimes pale blue. See Dextrorsal.", "details": []}, {"x": -0.6063674163082793, "y": 0.312360068573713, "z": 0.7312658504266744, "word": "Moroxylic", "pos_group": "adjective", "row_number": 98943, "definition": "Of pertaining to or derived from the mulberry; moric.", "details": []}, {"x": -0.357829316265413, "y": 0.3108123695505874, "z": 0.8805417942127313, "word": "Moschatel", "pos_group": "noun", "row_number": 99084, "definition": "A plant of the genus Adoxa (A. moschatellina) the flowers of which are pale green and have a faint musky smell. It is found in woods in all parts of Europe and is called also hollow root and musk crowfoot.", "details": []}, {"x": -0.5031367314070152, "y": 0.4940554771934491, "z": 0.7090575540562405, "word": "Moss", "pos_group": "noun", "row_number": 99099, "definition": "A cryptogamous plant of a cellular structure with distinct stem and simple leaves. The fruit is a small capsule usually opening by an apical lid and so discharging the spores. There are many species collectively termed Musci growing on the earth on rocks and trunks of trees etc. and a few in running water.", "details": []}, {"x": -0.537445343339455, "y": 0.2252926905136684, "z": 0.8126473445005821, "word": "Mossy", "pos_group": "other", "row_number": 99111, "definition": "Resembling moss; as mossy green.", "details": []}, {"x": -0.3414458706835162, "y": 0.4384038016255803, "z": 0.8313945057031675, "word": "Mother-of-thyme", "pos_group": "noun", "row_number": 99173, "definition": "An aromatic plant (Thymus Serphyllum); -- called also wild thyme.", "details": []}, {"x": -0.5962301675888905, "y": 0.3929317435019954, "z": 0.7000815896775214, "word": "Mouse-ear", "pos_group": "noun", "row_number": 99342, "definition": "A European species of hawkweed (Hieracium Pilosella).", "details": []}, {"x": -0.4164835239109781, "y": 0.2467820417237289, "z": 0.8750086274965303, "word": "Mousetail", "pos_group": "noun", "row_number": 99348, "definition": "A genus of ranunculaceous plants (Myosurus) in which the prolonged receptacle is covered with imbricating achenes and so resembles the tail of a mouse.", "details": []}, {"x": -0.4267068916333491, "y": 0.5078555040935528, "z": 0.7483341603819036, "word": "Moutan", "pos_group": "noun", "row_number": 99358, "definition": "The Chinese tree peony (Paeonia Mountan) a shrub with large flowers of various colors.", "details": []}, {"x": -0.5914528305911098, "y": 0.268959237857233, "z": 0.7601608234821237, "word": "Mowing", "pos_group": "noun", "row_number": 99457, "definition": "Land from which grass is cut; meadow land.", "details": []}, {"x": -0.3381962757395751, "y": 0.3601446915969906, "z": 0.8694360702147053, "word": "Moxa", "pos_group": "noun", "row_number": 99460, "definition": "A soft woolly mass prepared from the young leaves of Artemisia Chinensis and used as a cautery by burning it on the skin; hence any substance used in a like manner as cotton impregnated with niter amadou.", "details": []}, {"x": -0.5469381239823274, "y": 0.4646443719195656, "z": 0.6963937795372419, "word": "Moxa", "pos_group": "noun", "row_number": 99461, "definition": "A plant from which this substance is obtained esp. Artemisia Chinensis and A. moxa.", "details": []}, {"x": -0.4923947094751745, "y": 0.2192572691448552, "z": 0.8423026178328066, "word": "Mucor", "pos_group": "noun", "row_number": 99524, "definition": "A genus of minute fungi. The plants consist of slender threads with terminal globular sporangia; mold.", "details": []}, {"x": -0.363995634408162, "y": 0.4766695277351253, "z": 0.8001833161598485, "word": "Mudar", "pos_group": "noun", "row_number": 99541, "definition": "Either one of two asclepiadaceous shrubs (Calotropis gigantea and C. procera) which furnish a strong and valuable fiber. The acrid milky juice is used medicinally.", "details": []}, {"x": -0.607958367229942, "y": 0.342460977284048, "z": 0.716314946621078, "word": "Mudwort", "pos_group": "noun", "row_number": 99578, "definition": "A small herbaceous plant growing on muddy shores (Limosella aquatica).", "details": []}, {"x": -0.3765405010220092, "y": 0.2828841064013896, "z": 0.8821529535378667, "word": "Mugweed", "pos_group": "noun", "row_number": 99627, "definition": "A slender European weed (Galium Cruciata); -- called also crossweed.", "details": []}, {"x": -0.4738116096070614, "y": 0.5050339570960656, "z": 0.7214175356764313, "word": "Mugwort", "pos_group": "noun", "row_number": 99628, "definition": "A somewhat aromatic composite weed (Artemisia vulgaris) at one time used medicinally; -- called also motherwort.", "details": []}, {"x": -0.5618495864543006, "y": 0.236938200545683, "z": 0.792581435136671, "word": "Mule", "pos_group": "noun", "row_number": 99657, "definition": "A plant or vegetable produced by impregnating the pistil of one species with the pollen or fecundating dust of another; -- called also hybrid.", "details": []}, {"x": -0.3346544861188429, "y": 0.4101391791014663, "z": 0.8484056981695187, "word": "Mulewort", "pos_group": "noun", "row_number": 99662, "definition": "A fern of the genus Hemionitis.", "details": []}, {"x": -0.581699097269062, "y": 0.4228710210817722, "z": 0.6948426151047571, "word": "Mullein", "pos_group": "noun", "row_number": 99690, "definition": "Any plant of the genus Verbascum. They are tall herbs having coarse leaves and large flowers in dense spikes. The common species with densely woolly leaves is Verbascum Thapsus.", "details": []}, {"x": -0.444580444122778, "y": 0.2307950852119981, "z": 0.8654951515436584, "word": "Multicostate", "pos_group": "adjective", "row_number": 99730, "definition": "Having numerous ribs or costae as the leaf of a plant or as certain shells and corals.", "details": []}, {"x": -0.399667018163739, "y": 0.5013811562003363, "z": 0.7673872625990866, "word": "Multiflorous", "pos_group": "adjective", "row_number": 99743, "definition": "Having many flowers.", "details": []}, {"x": -0.6030957073430886, "y": 0.294402044404607, "z": 0.741352145767939, "word": "Multiplication", "pos_group": "noun", "row_number": 99785, "definition": "An increase above the normal number of parts especially of petals; augmentation.", "details": []}, {"x": -0.3479427242623811, "y": 0.3289893149405311, "z": 0.8778962873186289, "word": "Multiseptate", "pos_group": "adjective", "row_number": 99812, "definition": "Divided into many chambers by partitions as the pith of the pokeweed.", "details": []}, {"x": -0.5207799506891408, "y": 0.4850436110986813, "z": 0.7025104542229724, "word": "Multisiliquous", "pos_group": "adjective", "row_number": 99814, "definition": "Having many pods or seed vessels.", "details": []}, {"x": -0.5210966230852443, "y": 0.2202349639696709, "z": 0.8245937606206054, "word": "Munjistin", "pos_group": "noun", "row_number": 99953, "definition": "An orange-red coloring substance resembling alizarin found in the root of an East Indian species of madder (Rubia munjista).", "details": []}, {"x": -0.3476962497383874, "y": 0.454715543217809, "z": 0.819964080112046, "word": "Murrayin", "pos_group": "noun", "row_number": 100024, "definition": "A glucoside found in the flowers of a plant (Murraya exotica) of South Asia and extracted as a white amorphous slightly bitter substance.", "details": []}, {"x": -0.6031527430683737, "y": 0.373764592933613, "z": 0.7046323847214708, "word": "Musa", "pos_group": "noun", "row_number": 100040, "definition": "A genus of perennial herbaceous endogenous plants of great size including the banana (Musa sapientum) the plantain (M. paradisiaca of Linnaeus but probably not a distinct species) the Abyssinian (M. Ensete) the Philippine Island (M. textilis which yields Manila hemp) and about eighteen other species. See Illust. of Banana and Plantain.", "details": []}, {"x": -0.399804189188219, "y": 0.258570846292143, "z": 0.8793734859292244, "word": "Musaceous", "pos_group": "adjective", "row_number": 100041, "definition": "Of pertaining to or resembling plants of the genus Musa.", "details": []}, {"x": -0.4441709557170604, "y": 0.5094767253287056, "z": 0.7369841439581531, "word": "Muscales", "pos_group": "other", "row_number": 100053, "definition": "An old name for mosses in the widest sense including the true mosses and also hepaticae and sphagna.", "details": []}, {"x": -0.5821645302557161, "y": 0.2546076534134014, "z": 0.7721783489165328, "word": "Muscat", "pos_group": "noun", "row_number": 100059, "definition": "A name given to several varieties of Old World grapes differing in color size etc. but all having a somewhat musky flavor. The muscat of Alexandria is a large oval grape of a pale amber color.", "details": []}, {"x": -0.3342108789982554, "y": 0.3795277257083631, "z": 0.8627060877134525, "word": "Musci", "pos_group": "other", "row_number": 100064, "definition": "An order or subclass of cryptogamous plants; the mosses. See Moss and Cryptogamia.", "details": []}, {"x": -0.5618958920049858, "y": 0.4502451579384647, "z": 0.6939396978851176, "word": "Muscoid", "pos_group": "adjective", "row_number": 100076, "definition": "Mosslike; resembling moss.", "details": []}, {"x": -0.47410330229393, "y": 0.2209399446860363, "z": 0.8522978350295872, "word": "Muscoid", "pos_group": "noun", "row_number": 100077, "definition": "A term formerly applied to any mosslike flowerless plant with a distinct stem and often with leaves but without any vascular system.", "details": []}, {"x": -0.3757985522294767, "y": 0.488428311996293, "z": 0.7875361783325776, "word": "Mushroom", "pos_group": "noun", "row_number": 100123, "definition": "An edible fungus (Agaricus campestris) having a white stalk which bears a convex or oven flattish expanded portion called the pileus. This is whitish and silky or somewhat scaly above and bears on the under side radiating gills which are at first flesh-colored but gradually become brown. The plant grows in rich pastures and is proverbial for rapidity of growth and shortness of duration. It has a pleasant smell and is largely used as food. It is also cultivated from spawn.", "details": []}, {"x": -0.6086338834510759, "y": 0.3232663341216002, "z": 0.7246127746174809, "word": "Mushroom", "pos_group": "noun", "row_number": 100124, "definition": "Any large fungus especially one of the genus Agaricus; a toadstool. Several species are edible; but many are very poisonous.", "details": []}, {"x": -0.3635211606439143, "y": 0.2992687024106393, "z": 0.8822078040470701, "word": "Mushroom", "pos_group": "adjective", "row_number": 100127, "definition": "Resembling mushrooms in rapidity of growth and shortness of duration; short-lived; ephemerial; as mushroom cities.", "details": []}, {"x": -0.492126874562012, "y": 0.4999033016004892, "z": 0.7126765243662486, "word": "Musk", "pos_group": "noun", "row_number": 100150, "definition": "The musk plant (Mimulus moschatus).", "details": []}, {"x": -0.5476438785607413, "y": 0.2279484970086417, "z": 0.8050625224083215, "word": "Musk", "pos_group": "noun", "row_number": 100151, "definition": "A plant of the genus Erodium (E. moschatum); -- called also musky heron's-bill.", "details": []}, {"x": -0.3370713320454536, "y": 0.42836796246275, "z": 0.8383816588216941, "word": "Musk", "pos_group": "noun", "row_number": 100152, "definition": "A plant of the genus Muscari; grape hyacinth.", "details": []}, {"x": -0.5921325735586996, "y": 0.4048099753959039, "z": 0.696783968781371, "word": "Mustard", "pos_group": "noun", "row_number": 100217, "definition": "The name of several cruciferous plants of the genus Brassica (formerly Sinapis) as white mustard (B. alba) black mustard (B. Nigra) wild mustard or charlock (B. Sinapistrum).", "details": []}, {"x": -0.4265575967794234, "y": 0.2390342949812014, "z": 0.8723022540682803, "word": "Mycetoid", "pos_group": "other", "row_number": 100336, "definition": "Resembling a fungus.", "details": []}, {"x": -0.4156003312952661, "y": 0.507131845660383, "z": 0.755045466011391, "word": "Mycology", "pos_group": "noun", "row_number": 100342, "definition": "That branch of botanical science which relates to the musgrooms and other fungi.", "details": []}, {"x": -0.5974096826344164, "y": 0.2775103936188758, "z": 0.7523892958622834, "word": "Myosotis", "pos_group": "noun", "row_number": 100422, "definition": "A genus of plants. See Mouse-ear.", "details": []}, {"x": -0.3401750988305308, "y": 0.3479877742216345, "z": 0.8736048369416868, "word": "Myrica", "pos_group": "noun", "row_number": 100446, "definition": "A widely dispersed genus of shrubs and trees usually with aromatic foliage. It includes the bayberry or wax myrtle the sweet gale and the North American sweet fern so called.", "details": []}, {"x": -0.5377129500981983, "y": 0.4737530593603837, "z": 0.697440192449051, "word": "Myrobolan", "pos_group": "noun", "row_number": 100466, "definition": "A dried astringent fruit much resembling a prune. It contains tannin and was formerly used in medicine but is now chiefly used in tanning and dyeing. Myrobolans are produced by various species of Terminalia of the East Indies and of Spondias of South America.", "details": []}, {"x": -0.5036756695476178, "y": 0.2177167938983676, "z": 0.8360085032823377, "word": "Myrtiform", "pos_group": "adjective", "row_number": 100475, "definition": "Resembling myrtle or myrtle berries; having the form of a myrtle leaf.", "details": []}, {"x": -0.356238984396, "y": 0.4695609159183722, "z": 0.8078405363921806, "word": "Myrtle", "pos_group": "noun", "row_number": 100476, "definition": "A species of the genus Myrtus especially Myrtus communis. The common myrtle has a shrubby upright stem eight or ten feet high. Its branches form a close full head thickly covered with ovate or lanceolate evergreen leaves. It has solitary axillary white or rosy flowers followed by black several-seeded berries. The ancients considered it sacred to Venus. The flowers leaves and berries are used variously in perfumery and as a condiment and the beautifully mottled wood is used in turning.", "details": []}, {"x": -0.6077665877779863, "y": 0.3542198297959965, "z": 0.7107377061617025, "word": "Myxinoid", "pos_group": "adjective", "row_number": 100544, "definition": "Like or pertaining to the genus Myxine.", "details": []}, {"x": -0.3842371928936978, "y": 0.2723838333111418, "z": 0.8821387798685076, "word": "Nabk", "pos_group": "noun", "row_number": 100562, "definition": "The edible berries of the Zizyphys Lotus a tree of Northern Africa and Southwestern Europe.", "details": []}, {"x": -0.462304090847475, "y": 0.5084898344584072, "z": 0.726438583665647, "word": "Naiad", "pos_group": "noun", "row_number": 100593, "definition": "Any plant of the order Naiadaceae such as eelgrass pondweed etc.", "details": []}, {"x": -0.5707764547624677, "y": 0.2420783241699148, "z": 0.784609663244007, "word": "Naked", "pos_group": "adjective", "row_number": 100631, "definition": "Without pubescence; as a naked leaf or stem; bare or not covered by the customary parts as a flower without a perianth a stem without leaves seeds without a pericarp buds without bud scales.", "details": []}, {"x": -0.3326536529593651, "y": 0.3988321043691526, "z": 0.8545609982308247, "word": "Napha water", "pos_group": "other", "row_number": 100692, "definition": "A perfume distilled from orange flowers.", "details": []}, {"x": -0.5753726237794061, "y": 0.4341388974815389, "z": 0.6931592612803466, "word": "Narcissus", "pos_group": "noun", "row_number": 100740, "definition": "A genus of endogenous bulbous plants with handsome flowers having a cup-shaped crown within the six-lobed perianth and comprising the daffodils and jonquils of several kinds.", "details": []}, {"x": -0.4555673796495197, "y": 0.2252195270689678, "z": 0.861240110088993, "word": "Nard", "pos_group": "noun", "row_number": 100752, "definition": "An East Indian plant (Nardostachys Jatamansi) of the Valerian family used from remote ages in Oriental perfumery.", "details": []}, {"x": -0.3894440053268228, "y": 0.4980642109007649, "z": 0.7747679707724114, "word": "Nard", "pos_group": "noun", "row_number": 100753, "definition": "An ointment prepared partly from this plant. See Spikenard.", "details": []}, {"x": -0.6068361039241158, "y": 0.30460516188381, "z": 0.7341427915112545, "word": "Nard", "pos_group": "noun", "row_number": 100754, "definition": "A kind of grass (Nardus stricta) of little value found in Europe and Asia.", "details": []}, {"x": -0.3523069548896952, "y": 0.316990328347239, "z": 0.8805662617149601, "word": "Nardoo", "pos_group": "noun", "row_number": 100756, "definition": "An Australian name for Marsilea Drummondii a four-leaved cryptogamous plant sometimes used for food.", "details": []}, {"x": -0.510253875648432, "y": 0.4922666642113225, "z": 0.7052052989676207, "word": "Narthex", "pos_group": "noun", "row_number": 100808, "definition": "A tall umbelliferous plant (Ferula communis). See Giant fennel under Fennel.", "details": []}, {"x": -0.5319099633334761, "y": 0.221317875671367, "z": 0.8173678418037338, "word": "Nasturtium", "pos_group": "noun", "row_number": 100854, "definition": "A genus of cruciferous plants having white or yellowish flowers including several species of cress. They are found chiefly in wet or damp grounds and have a pungent biting taste.", "details": []}, {"x": -0.3419309486759119, "y": 0.4456240098602569, "z": 0.8273466432963009, "word": "Nasturtium", "pos_group": "noun", "row_number": 100855, "definition": "Any plant of the genus Tropaeolum geraniaceous herbs having mostly climbing stems peltate leaves and spurred flowers and including the common Indian cress (Tropaeolum majus) the canary-bird flower (T. peregrinum) and about thirty more species all natives of South America. The whole plant has a warm pungent flavor and the fleshy fruits are used as a substitute for capers while the leaves and flowers are sometimes used in salads.", "details": []}, {"x": -0.6004916326559201, "y": 0.3858237007782916, "z": 0.7003926548929327, "word": "Natal plum", "pos_group": "other", "row_number": 100869, "definition": "The drupaceous fruit of two South African shrubs of the genus Arduina (A. bispinosa and A. grandiflora).", "details": []}, {"x": -0.409150953208684, "y": 0.2496116247643261, "z": 0.8776614006955863, "word": "Natchnee", "pos_group": "noun", "row_number": 100882, "definition": "An annual grass (Eleusine coracona) cultivated in India as a food plant.", "details": []}, {"x": -0.4327001564016365, "y": 0.5103592047010528, "z": 0.7431716200359835, "word": "Navelwort", "pos_group": "noun", "row_number": 101053, "definition": "A European perennial succulent herb (Cotyledon umbilicus) having round peltate leaves with a central depression; -- also called pennywort and kidneywort.", "details": []}, {"x": -0.5893864639880851, "y": 0.2620018419181961, "z": 0.7641849454805391, "word": "Navew", "pos_group": "noun", "row_number": 101054, "definition": "A kind of small turnip a variety of Brassica campestris. See Brassica.", "details": []}, {"x": -0.3346881863880996, "y": 0.3674705724243706, "z": 0.8677264524574262, "word": "Neck", "pos_group": "noun", "row_number": 101205, "definition": "the point where the base of the stem of a plant arises from the root.", "details": []}, {"x": -0.5536199689688426, "y": 0.4603643353748368, "z": 0.6939521659839549, "word": "Neckweed", "pos_group": "noun", "row_number": 101227, "definition": "An American annual weed (veronica peregrina) with small white flowers and a roundish pod.", "details": []}, {"x": -0.4854864587495335, "y": 0.2178092271845988, "z": 0.8466770570436436, "word": "Nectar", "pos_group": "noun", "row_number": 101260, "definition": "A sweetish secretion of blossoms from which bees make honey.", "details": []}, {"x": -0.3669415695652676, "y": 0.4826545155702751, "z": 0.7952348729303821, "word": "Nectarial", "pos_group": "adjective", "row_number": 101266, "definition": "Of or pertaining to the nectary of a plant.", "details": []}, {"x": -0.6099630492782692, "y": 0.3346473914401818, "z": 0.7183009132093857, "word": "Nectariferous", "pos_group": "adjective", "row_number": 101268, "definition": "Secreting nectar; -- said of blossoms or their parts.", "details": []}, {"x": -0.3700753824153895, "y": 0.2879903264797758, "z": 0.8832359725374501, "word": "Nectary", "pos_group": "noun", "row_number": 101276, "definition": "That part of a blossom which secretes nectar usually the base of the corolla or petals; also the spur of such flowers as the larkspur and columbine whether nectariferous or not. See the Illustration of Nasturtium.", "details": []}, {"x": -0.4807830029329237, "y": 0.5048850147038123, "z": 0.7168952685143986, "word": "Neem tree", "pos_group": "other", "row_number": 101335, "definition": "An Asiatic name for Melia Azadirachta and M. Azedarach. See Margosa.", "details": []}, {"x": -0.5574725304103948, "y": 0.23161651608625, "z": 0.7972315644239755, "word": "Nelumbo", "pos_group": "noun", "row_number": 101459, "definition": "A genus of great water lilies. The North American species is Nelumbo lutea the Asiatic is the sacred lotus N. speciosa.", "details": []}, {"x": -0.33357672232746, "y": 0.4177058418516153, "z": 0.8451321790136156, "word": "Nemathecium", "pos_group": "noun", "row_number": 101464, "definition": "A peculiar kind of fructification on certain red algae consisting of an external mass of filaments at length separating into tetraspores.", "details": []}, {"x": -0.587107414253853, "y": 0.416599445403527, "z": 0.6940819737016862, "word": "Nematogene", "pos_group": "noun", "row_number": 101475, "definition": "One of the dimorphic forms of the species of Dicyemata which produced vermiform embryos; -- opposed to rhombogene.", "detai "definition": "A cruciferous herb (Camelina sativa).", "details": []}, {"x": -0.3703051728267414, "y": 0.4884242389558524, "z": 0.7901365969110362, "word": "Oleander", "pos_group": "noun", "row_number": 104713, "definition": "A beautiful evergreen shrub of the Dogbane family having clusters of fragrant red or white flowers. It is native of the East Indies but the red variety has become common in the south of Europe. Called also rosebay rose laurel and South-sea rose.", "details": []}, {"x": -0.6115812388499255, "y": 0.3267194229924497, "z": 0.7205711671488604, "word": "Oleandrine", "pos_group": "noun", "row_number": 104714, "definition": "One of several alkaloids found in the leaves of the oleander.", "details": []}, {"x": -0.3637632128211879, "y": 0.2934810206093793, "z": 0.8840504598381724, "word": "Oleaster", "pos_group": "noun", "row_number": 104716, "definition": "Any species of the genus Elaeagus. See Eleagnus. The small silvery berries of the common species (Elaeagnus hortensis) are called Trebizond dates and are made into cakes by the Arabs.", "details": []}, {"x": -0.4879159177920234, "y": 0.5042837801457948, "z": 0.7124857375744689, "word": "Oleiferous", "pos_group": "adjective", "row_number": 104723, "definition": "Producing oil; as oleiferous seeds.", "details": []}, {"x": -0.5527048116662941, "y": 0.2265779111114798, "z": 0.8019849383606182, "word": "Olibanum", "pos_group": "noun", "row_number": 104747, "definition": "The fragrant gum resin of various species of Boswellia; Oriental frankincense.", "details": []}, {"x": -0.3329142516536074, "y": 0.4253077507669809, "z": 0.841594568770171, "word": "Oliganthous", "pos_group": "adjective", "row_number": 104754, "definition": "Having few flowers.", "details": []}, {"x": -0.5922944386849959, "y": 0.4099931915670786, "z": 0.6936085933518028, "word": "Oligomerous", "pos_group": "adjective", "row_number": 104771, "definition": "Having few members in each set of organs; as an oligomerous flower.", "details": []}, {"x": -0.4295705315411804, "y": 0.2337521658286875, "z": 0.8722551710375956, "word": "Oligopetalous", "pos_group": "adjective", "row_number": 104773, "definition": "Having few petals.", "details": []}, {"x": -0.4100896219260739, "y": 0.5090365304074502, "z": 0.7567749419076155, "word": "Olivaceous", "pos_group": "adjective", "row_number": 104783, "definition": "Resembling the olive; of the color of the olive; olive-green.", "details": []}, {"x": -0.6016159109074813, "y": 0.2792848919140109, "z": 0.7483703928480472, "word": "Olive", "pos_group": "noun", "row_number": 104788, "definition": "Any shell of the genus Oliva and allied genera; -- so called from the form. See Oliva.", "details": []}, {"x": -0.3385783578648269, "y": 0.3427662692494344, "z": 0.8762853303863882, "word": "Olusatrum", "pos_group": "noun", "row_number": 104813, "definition": "An umbelliferous plant the common Alexanders of Western Europe (Smyrnium Olusatrum).", "details": []}, {"x": -0.5349544216355357, "y": 0.4789776652011098, "z": 0.6959914963640597, "word": "Omnifarious", "pos_group": "adjective", "row_number": 104864, "definition": "Of all varieties forms or kinds.", "details": []}, {"x": -0.5084341745849515, "y": 0.2145353378440194, "z": 0.833948007330356, "word": "Omphalode", "pos_group": "noun", "row_number": 104912, "definition": "The central part of the hilum of a seed through which the nutrient vessels pass into the rhaphe or the chalaza; -- called also omphalodium.", "details": []}, {"x": -0.3510753081058095, "y": 0.4683267447831909, "z": 0.8108120547692854, "word": "Onagrarieous", "pos_group": "adjective", "row_number": 104951, "definition": "Pertaining to or resembling a natural order of plants (Onagraceae or Onagrarieae) which includes the fuchsia the willow-herb (Epilobium) and the evening primrose (/nothera).", "details": []}, {"x": -0.6097153370855924, "y": 0.358521751397842, "z": 0.706901238856763, "word": "Oncidium", "pos_group": "noun", "row_number": 104958, "definition": "A genus of tropical orchidaceous plants the flower of one species of which (O. Papilio) resembles a butterfly.", "details": []}, {"x": -0.3856221905533599, "y": 0.2665749656879697, "z": 0.8833081646975114, "word": "Oneberry", "pos_group": "noun", "row_number": 104978, "definition": "The herb Paris. See Herb Paris under Herb.", "details": []}, {"x": -0.457406794274283, "y": 0.5120527671358575, "z": 0.7270357544304372, "word": "One-sided", "pos_group": "adjective", "row_number": 105005, "definition": "Growing on one side of a stem; as one-sided flowers.", "details": []}, {"x": -0.5757065276785149, "y": 0.2419345946049291, "z": 0.7810439462166621, "word": "Onion", "pos_group": "noun", "row_number": 105010, "definition": "A liliaceous plant of the genus Allium (A. cepa) having a strong-flavored bulb and long hollow leaves; also its bulbous root much used as an article of food. The name is often extended to other species of the genus.", "details": []}, {"x": -0.3293761887697446, "y": 0.3947806868294284, "z": 0.8577059726841142, "word": "Onocerin", "pos_group": "noun", "row_number": 105024, "definition": "A white crystalline waxy substance extracted from the root of the leguminous plant Ononis spinosa.", "details": []}, {"x": -0.5743685649576573, "y": 0.4395568155101679, "z": 0.6905726301606818, "word": "Onycha", "pos_group": "noun", "row_number": 105067, "definition": "An ingredient of the Mosaic incense probably the operculum of some kind of strombus.", "details": []}, {"x": -0.459419984316946, "y": 0.2205828411471041, "z": 0.8603932171987925, "word": "Ooecia", "pos_group": "other", "row_number": 105076, "definition": "of Ooecium", "details": []}, {"x": -0.3838614870933262, "y": 0.4987826021064254, "z": 0.777088331248413, "word": "Oogonium", "pos_group": "noun", "row_number": 105081, "definition": "A special cell in certain cryptogamous plants containing oospheres as in the rockweeds (Fucus) and the orders Vaucherieae and Peronosporeae.", "details": []}, {"x": -0.610308645140164, "y": 0.3074835230393516, "z": 0.7300529026902681, "word": "Oophore", "pos_group": "noun", "row_number": 105097, "definition": "An alternately produced form of certain cryptogamous plants as ferns mosses and the like which bears antheridia and archegonia and so has sexual fructification as contrasted with the sporophore which is nonsexual but produces spores in countless number. In ferns the oophore is a minute prothallus; in mosses it is the leafy plant.", "details": []}, {"x": -0.3518640994711472, "y": 0.3113277753774909, "z": 0.8827608236560236, "word": "Oophoridium", "pos_group": "noun", "row_number": 105102, "definition": "The macrosporangium or case for the larger kind of spores in heterosporous flowerless plants.", "details": []}, {"x": -0.506527916725079, "y": 0.4970377572416413, "z": 0.7045444893364439, "word": "Oophyte", "pos_group": "noun", "row_number": 105104, "definition": "Any plant of a proposed class or grand division (collectively termed oophytes or Oophyta) which have their sexual reproduction accomplished by motile antherozoids acting on oospheres either while included in their oogonia or after exclusion.", "details": []}, {"x": -0.5369411447147306, "y": 0.2192464217509521, "z": 0.8146319498165037, "word": "Oospere", "pos_group": "noun", "row_number": 105108, "definition": "An unfertilized rounded mass of protoplasm produced in an oogonium.", "details": []}, {"x": -0.337332992475356, "y": 0.4432068504072983, "z": 0.8305264233843882, "word": "Oospere", "pos_group": "noun", "row_number": 105109, "definition": "An analogous mass of protoplasm in the ovule of a flowering plant; an embryonic vesicle.", "details": []}, {"x": -0.6013337115768337, "y": 0.3907599863984338, "z": 0.6969249603444585, "word": "Oosporangium", "pos_group": "noun", "row_number": 105112, "definition": "An oogonium; also a case containing oval or rounded spores of some other kind than oospores.", "details": []}, {"x": -0.4116021928962797, "y": 0.2440506952728485, "z": 0.8780790926447418, "word": "Oospore", "pos_group": "noun", "row_number": 105114, "definition": "A fertilized oosphere in the ovule of a flowering plant.", "details": []}, {"x": -0.427337699308623, "y": 0.5129222570190717, "z": 0.7445087299717005, "word": "Open", "pos_group": "adjective", "row_number": 105161, "definition": "Not drawn together closed or contracted; extended; expanded; as an open hand; open arms; an open flower; an open prospect.", "details": []}, {"x": -0.5939362550257413, "y": 0.2630846674559031, "z": 0.7602803316643238, "word": "Operculated", "pos_group": "adjective", "row_number": 105244, "definition": "Closed by a lid or cover as the capsules of the mosses.", "details": []}, {"x": -0.3324369098723178, "y": 0.3626107509394708, "z": 0.8706314629380547, "word": "Operculum", "pos_group": "noun", "row_number": 105251, "definition": "The lid of a pitcherform leaf.", "details": []}, {"x": -0.5514833160228698, "y": 0.465747709997432, "z": 0.6920586844918338, "word": "Operculum", "pos_group": "noun", "row_number": 105252, "definition": "The lid of the urnlike capsule of mosses.", "details": []}, {"x": -0.4899829972241829, "y": 0.2140321687837216, "z": 0.8450484560999699, "word": "Opetide", "pos_group": "noun", "row_number": 105264, "definition": "The early spring or the time when flowers begin opening.", "details": []}, {"x": -0.3615425266953601, "y": 0.4821400721713142, "z": 0.7980150075013469, "word": "Opopanax", "pos_group": "noun", "row_number": 105386, "definition": "The inspissated juice of an umbelliferous plant (the Opoponax Chironum) brought from Turkey and the East Indies in loose granules or sometimes in larger masses of a reddish yellow color with specks of white. It has a strong smell and acrid taste and was formerly used in medicine as an emmenagogue and antispasmodic.", "details": []}, {"x": -0.6125212406918324, "y": 0.3384840297167045, "z": 0.7143152604614291, "word": "Opossum", "pos_group": "noun", "row_number": 105387, "definition": "Any American marsupial of the genera Didelphys and Chironectes. The common species of the United States is Didelphys Virginiana.", "details": []}, {"x": -0.3707974878387686, "y": 0.2821479428717749, "z": 0.8848173604454671, "word": "Opuntia", "pos_group": "noun", "row_number": 105525, "definition": "A genus of cactaceous plants; the prickly pear or Indian fig.", "details": []}, {"x": -0.4762539686197274, "y": 0.5089630267150501, "z": 0.7170347235741202, "word": "Orache", "pos_group": "noun", "row_number": 105542, "definition": "A genus (Atriplex) of herbs or low shrubs of the Goosefoot family most of them with a mealy surface.", "details": []}, {"x": -0.5625229649245125, "y": 0.2307470635906729, "z": 0.7939292831082737, "word": "Orangeroot", "pos_group": "noun", "row_number": 105572, "definition": "An American ranunculaceous plant (Hidrastis Canadensis) having a yellow tuberous root; -- also called yellowroot golden seal etc.", "details": []}, {"x": -0.3297537899213429, "y": 0.4142096374429476, "z": 0.8483471071925058, "word": "Orchard", "pos_group": "noun", "row_number": 105647, "definition": "A garden.", "details": []}, {"x": -0.5867876540435755, "y": 0.4219248161799583, "z": 0.6911292922120617, "word": "Orchid", "pos_group": "noun", "row_number": 105667, "definition": "Any plant of the order Orchidaceae. See Orchidaceous.", "details": []}, {"x": -0.4405091683146787, "y": 0.2269889097866644, "z": 0.8685779800712033, "word": "Orchidaceous", "pos_group": "adjective", "row_number": 105668, "definition": "Pertaining to or resembling a natural order (Orchidaceae) of endogenous plants of which the genus Orchis is the type. They are mostly perennial herbs having the stamens and pistils united in a single column and normally three petals and three sepals all adherent to the ovary. The flowers are curiously shaped often resembling insects the odd or lower petal (called the lip) being unlike the others and sometimes of a strange and unexpected appearance. About one hundred species occur in the United States but several thousand in the tropics.", "details": []}, {"x": -0.3991184664561384, "y": 0.5068081728327187, "z": 0.7641007300635574, "word": "Orchidean", "pos_group": "adjective", "row_number": 105669, "definition": "Orchidaceous.", "details": []}, {"x": -0.6065090214234702, "y": 0.2890709455674097, "z": 0.7406651033771661, "word": "Orchideous", "pos_group": "adjective", "row_number": 105670, "definition": "Same as Orchidaceous.", "details": []}, {"x": -0.3419913075025292, "y": 0.3302939553471951, "z": 0.8797430583152195, "word": "Orchidologist", "pos_group": "noun", "row_number": 105671, "definition": "One versed in orchidology.", "details": []}, {"x": -0.5246791134302704, "y": 0.4873168073044425, "z": 0.6980216022793493, "word": "Orchidology", "pos_group": "noun", "row_number": 105672, "definition": "The branch of botany which treats of orchids.", "details": []}, {"x": -0.519830050845201, "y": 0.2144458826404077, "z": 0.8269157645473039, "word": "Orchis", "pos_group": "noun", "row_number": 105676, "definition": "A genus of endogenous plants growing in the North Temperate zone and consisting of about eighty species. They are perennial herbs growing from a tuber (beside which is usually found the last year's tuber also) and are valued for their showy flowers. See Orchidaceous.", "details": []}, {"x": -0.3442004520818974, "y": 0.4598486115680102, "z": 0.8185751665092159, "word": "Orchis", "pos_group": "noun", "row_number": 105677, "definition": "Any plant of the same family with the orchis; an orchid.", "details": []}, {"x": -0.6081089496735299, "y": 0.3708494652550203, "z": 0.7019075291283188, "word": "Oregon grape", "pos_group": "other", "row_number": 105789, "definition": "An evergreen species of barberry (Berberis Aquifolium) of Oregon and California; also its roundish blue-black berries.", "details": []}, {"x": -0.394523828067035, "y": 0.2566063285234366, "z": 0.8823288169662457, "word": "Oreoselin", "pos_group": "noun", "row_number": 105795, "definition": "A white crystalline substance which is obtained indirectly from the root of an umbelliferous plant (Imperatoria Oreoselinum) and yields resorcin on decomposition.", "details": []}, {"x": -0.4455381108365784, "y": 0.5141561681250648, "z": 0.7328978281937549, "word": "Oreweed", "pos_group": "noun", "row_number": 105797, "definition": "Same as Oarweed.", "details": []}, {"x": -0.583961491613618, "y": 0.2485381248448537, "z": 0.7727986651198373, "word": "Orewood", "pos_group": "noun", "row_number": 105798, "definition": "Same as Oarweed.", "details": []}, {"x": -0.3287283412010676, "y": 0.3826689420890816, "z": 0.8634246686605714, "word": "Organography", "pos_group": "noun", "row_number": 105851, "definition": "A description of the organs of animals or plants.", "details": []}, {"x": -0.5667196557613452, "y": 0.4505481337310879, "z": 0.689808097201806, "word": "Origanum", "pos_group": "noun", "row_number": 105921, "definition": "A genus of aromatic labiate plants including the sweet marjoram (O. Marjorana) and the wild marjoram (O. vulgare).", "details": []}, {"x": -0.4710045885675746, "y": 0.2162206893729159, "z": 0.8552211942155027, "word": "Oriole", "pos_group": "noun", "row_number": 105956, "definition": "In America any one of several species of the genus Icterus belonging to the family Icteridae. See Baltimore oriole and Orchard oriole under Orchard.", "details": []}, {"x": -0.3740807046543988, "y": 0.4939534138535338, "z": 0.7849035936646664, "word": "Orleans", "pos_group": "noun", "row_number": 105968, "definition": "A variety of the plum. See under Plum.", "details": []}, {"x": -0.6127997822485398, "y": 0.3187036768394983, "z": 0.7231212852939172, "word": "Orpine", "pos_group": "noun", "row_number": 106049, "definition": "A low plant with fleshy leaves (Sedum telephium) having clusters of purple flowers. It is found on dry sandy places and on old walls in England and has become naturalized in America. Called also stonecrop and live-forever.", "details": []}, {"x": -0.3576291310510549, "y": 0.2993422328377408, "z": 0.8845878318535607, "word": "Orris", "pos_group": "noun", "row_number": 106053, "definition": "A plant of the genus Iris (I. Florentina); a kind of flower-de-luce. Its rootstock has an odor resembling that of violets.", "details": []}, {"x": -0.495186429957057, "y": 0.5032242311949131, "z": 0.708206024208121, "word": "Orthogamy", "pos_group": "noun", "row_number": 106099, "definition": "Direct fertilization in plants as when the pollen fertilizing the ovules comes from the stamens of the same blossom; -- opposed to heterogamy.", "details": []}, {"x": -0.5475565759642439, "y": 0.2218452229672023, "z": 0.8068249457998592, "word": "Orthospermous", "pos_group": "adjective", "row_number": 106139, "definition": "Having the seeds straight as in the fruits of some umbelliferous plants; -- opposed to coelospermous.", "details": []}, {"x": -0.3326760335496798, "y": 0.4329172447611703, "z": 0.8378002840116784, "word": "Ortolan", "pos_group": "noun", "row_number": 106153, "definition": "In England the wheatear (Saxicola oenanthe).", "details": []}, {"x": -0.5972368096025901, "y": 0.403070218465507, "z": 0.6934281449738594, "word": "Orval", "pos_group": "noun", "row_number": 106156, "definition": "A kind of sage (Salvia Horminum).", "details": []}, {"x": -0.4219585247003639, "y": 0.2359201950485383, "z": 0.875381439716968, "word": "Oryza", "pos_group": "noun", "row_number": 106172, "definition": "A genus of grasses including the rice plant; rice.", "details": []}, {"x": -0.4158150618067971, "y": 0.5123319639579236, "z": 0.751407873981652, "word": "Osculant", "pos_group": "adjective", "row_number": 106211, "definition": "Intermediate in character or on the border between two genera groups families etc. of animals or plants and partaking somewhat of the characters of each thus forming a connecting link; interosculant; as the genera by which two families approximate are called osculant genera.", "details": []}, {"x": -0.6002255382239231, "y": 0.271822493417833, "z": 0.7522245910204705, "word": "Osmund", "pos_group": "noun", "row_number": 106256, "definition": "A fern of the genus Osmunda or flowering fern. The most remarkable species is the osmund royal or royal fern (Osmunda regalis) which grows in wet or boggy places and has large bipinnate fronds often with a panicle of capsules at the top. The rootstock contains much starch and has been used in stiffening linen.", "details": []}, {"x": -0.3343423198229857, "y": 0.350045892280264, "z": 0.8750331916408075, "word": "Oso-berry", "pos_group": "noun", "row_number": 106258, "definition": "The small blueblack drupelike fruit of the Nuttallia cerasiformis a shrub of Oregon and California belonging to the Cherry tribe of Rosaceae.", "details": []}, {"x": -0.542035003952579, "y": 0.4752721817917159, "z": 0.6930471900996855, "word": "Osteocolla", "pos_group": "noun", "row_number": 106327, "definition": "A cellular calc tufa which in some places forms incrustations on the stems of plants -- formerly supposed to have the quality of uniting fractured bones.", "details": []}, {"x": -0.5016673979989715, "y": 0.2122869939968297, "z": 0.8386084032280691, "word": "Oswego tea", "pos_group": "other", "row_number": 106404, "definition": "An American aromatic herb (Monarda didyma) with showy bright red labiate flowers.", "details": []}, {"x": -0.3534148378018897, "y": 0.4749184176443043, "z": 0.8059469269149764, "word": "Ovaria", "pos_group": "other", "row_number": 106969, "definition": "of Ovarium", "details": []}, {"x": -0.6124743114243538, "y": 0.3506149807633141, "z": 0.7084803124361359, "word": "Ovariums", "pos_group": "other", "row_number": 106970, "definition": "of Ovarium", "details": []}, {"x": -0.378652410909652, "y": 0.2712125790426803, "z": 0.8849102150395406, "word": "Ovary", "pos_group": "noun", "row_number": 106973, "definition": "That part of the pistil which contains the seed and in most flowering plants develops into the fruit. See Illust. of Flower.", "details": []}, {"x": -0.4643691835537364, "y": 0.5126893496310383, "z": 0.7221571104271836, "word": "Overground", "pos_group": "adjective", "row_number": 107228, "definition": "Situated over or above ground; as the overground portion of a plant.", "details": []}, {"x": -0.5718490170063552, "y": 0.2359239971303379, "z": 0.7857025959782171, "word": "Ovule", "pos_group": "noun", "row_number": 107800, "definition": "The rudiment of a seed. It grows from a placenta and consists of a soft nucleus within two delicate coatings. The attached base of the ovule is the hilum the coatings are united with the nucleus at the chalaza and their minute orifice is the foramen.", "details": []}, {"x": -0.3275422867219849, "y": 0.4025786096976662, "z": 0.8547786341637391, "word": "Oxalis", "pos_group": "noun", "row_number": 107863, "definition": "A genus of plants mostly herbs with acid-tasting trifoliolate or multifoliolate leaves; -- called also wood sorrel.", "details": []}, {"x": -0.5803737511674971, "y": 0.4336344220244549, "z": 0.6892949274376572, "word": "Oxbane", "pos_group": "noun", "row_number": 107881, "definition": "A poisonous bulbous plant (Buphane toxicaria) of the Cape of Good Hope.", "details": []}, {"x": -0.4518366050953803, "y": 0.221086417602967, "z": 0.8642710675750795, "word": "Oxeye", "pos_group": "noun", "row_number": 107888, "definition": "The corn camomile (Anthemis arvensis).", "details": []}, {"x": -0.3884815714547626, "y": 0.5035325338459241, "z": 0.7717104742056711, "word": "Oxeye", "pos_group": "noun", "row_number": 107889, "definition": "A genus of composite plants (Buphthalmum) with large yellow flowers.", "details": []}, {"x": -0.6105203825324933, "y": 0.2995407105495086, "z": 0.7331713478006852, "word": "Oxtongue", "pos_group": "noun", "row_number": 107935, "definition": "A name given to several plants from the shape and roughness of their leaves; as Anchusa officinalis a kind of bugloss and Helminthia echioides both ginally purple and yellow. Cultivated varieties have very large flowers of a great diversity of colors. Called also heart's-ease love-in-idleness and many other quaint names.", "details": []}, {"x": -0.5319354349963327, "y": 0.4841572119576143, "z": 0.6947204380934047, "word": "Papaver", "pos_group": "noun", "row_number": 109126, "definition": "A genus of plants including the poppy.", "details": []}, {"x": -0.5133169421212996, "y": 0.211585291654246, "z": 0.8317075094567957, "word": "Papaveraceous", "pos_group": "adjective", "row_number": 109127, "definition": "Of pertaining to or resembling a natural order of plants (Papaveraceae) of which the poppy the celandine and the bloodroot are well-known examples.", "details": []}, {"x": -0.3459903011152549, "y": 0.4667975927492244, "z": 0.8138738962134762, "word": "Papilionaceous", "pos_group": "adjective", "row_number": 109160, "definition": "Having a winged corolla somewhat resembling a butterfly as in the blossoms of the bean and pea.", "details": []}, {"x": -0.6114253764710783, "y": 0.3630284107138826, "z": 0.703114060463701, "word": "Papilionaceous", "pos_group": "adjective", "row_number": 109161, "definition": "Belonging to that suborder of leguminous plants (Papilionaceae) which includes the bean pea vetch clover and locust.", "details": []}, {"x": -0.3872819958869772, "y": 0.2607602862388837, "z": 0.884317097416088, "word": "Papillate", "pos_group": "other", "row_number": 109168, "definition": "To cover with papillae; to take the form of a papilla or of papillae.", "details": []}, {"x": -0.452344464234357, "y": 0.5154207551337411, "z": 0.7278227331252416, "word": "Pappiform", "pos_group": "adjective", "row_number": 109186, "definition": "Resembling the pappus of composite plants.", "details": []}, {"x": -0.5806067031983629, "y": 0.2420852590171661, "z": 0.7773612953882639, "word": "Pappus", "pos_group": "noun", "row_number": 109190, "definition": "The hairy or feathery appendage of the achenes of thistles dandelions and most other plants of the order Compositae; also the scales awns or bristles which represent the calyx in other plants of the same order.", "details": []}, {"x": -0.3263092897184624, "y": 0.3904912645216619, "z": 0.8608361166770979, "word": "Papulose", "pos_group": "adjective", "row_number": 109201, "definition": "Having papulae; papillose; as a papulose leaf.", "details": []}, {"x": -0.5730854427834441, "y": 0.4450325015670312, "z": 0.6881272758862956, "word": "Papulous", "pos_group": "adjective", "row_number": 109202, "definition": "Covered with or characterized by papulae; papulose.", "details": []}, {"x": -0.4634750378478668, "y": 0.2161000748486183, "z": 0.8593553670876443, "word": "Papyrus", "pos_group": "noun", "row_number": 109209, "definition": "A tall rushlike plant (Cyperus Papyrus) of the Sedge family formerly growing in Egypt and now found in Abyssinia Syria Sicily etc. The stem is triangular and about an inch thick.", "details": []}, {"x": -0.3782609610541395, "y": 0.4992174668601293, "z": 0.7795515160168404, "word": "Paradactyla", "pos_group": "other", "row_number": 109264, "definition": "of Paradactylum", "details": []}, {"x": -0.6136068524958996, "y": 0.3106271995416578, "z": 0.7259458474810518, "word": "Paragnath", "pos_group": "noun", "row_number": 109328, "definition": "Same as Paragnathus.", "details": []}, {"x": -0.35169778380909, "y": 0.3055586451763957, "z": 0.8848404281121768, "word": "Paragnathi", "pos_group": "other", "row_number": 109330, "definition": "of Paragnathus", "details": []}, {"x": -0.502570014173846, "y": 0.5017019126722962, "z": 0.7040728454316781, "word": "Para grass", "pos_group": "other", "row_number": 109362, "definition": "A valuable pasture grass (Panicum barbinode) introduced into the Southern United States from Brazil.", "details": []}, {"x": -0.5420393475791604, "y": 0.2174403400256445, "z": 0.8117345897554755, "word": "Paraphysis", "pos_group": "noun", "row_number": 109499, "definition": "A minute jointed filament growing among the archegonia and antheridia of mosses or with the spore cases etc. of other flowerless plants.", "details": []}, {"x": -0.3328695954680418, "y": 0.4405064951643933, "z": 0.8337576747058612, "word": "Parasite", "pos_group": "noun", "row_number": 109524, "definition": "A plant obtaining nourishment immediately from other plants to which it attaches itself and whose juices it absorbs; -- sometimes but erroneously called epiphyte.", "details": []}, {"x": -0.6019118993582191, "y": 0.3958496811715836, "z": 0.6935453087775425, "word": "Parasite", "pos_group": "noun", "row_number": 109525, "definition": "A plant living on or within an animal and supported at its expense as many species of fungi of the genus Torrubia.", "details": []}, {"x": -0.4143094939359733, "y": 0.2385478510258571, "z": 0.8783180323809041, "word": "Parenchyma", "pos_group": "noun", "row_number": 109642, "definition": "The soft celluar substance of the tissues of plants and animals like the pulp of leaves to soft tissue of glands and the like.", "details": []}, {"x": -0.4218630214460555, "y": 0.515247467104006, "z": 0.746023886198901, "word": "Parietary", "pos_group": "noun", "row_number": 109719, "definition": "Any one of several species of Parietaria. See 1st Pellitory.", "details": []}, {"x": -0.5983970214101818, "y": 0.2644612570507256, "z": 0.7562944190502615, "word": "Paripinnate", "pos_group": "adjective", "row_number": 109729, "definition": "Pinnate with an equal number of leaflets on each side; having no odd leaflet at the end.", "details": []}, {"x": -0.3304305786280877, "y": 0.357556737633009, "z": 0.8734808595961029, "word": "Paris", "pos_group": "noun", "row_number": 109730, "definition": "A plant common in Europe (Paris quadrifolia); herb Paris; truelove. It has been used as a narcotic.", "details": []}, {"x": -0.5490760183532806, "y": 0.4711248838462786, "z": 0.6903309857525871, "word": "Parnassia", "pos_group": "noun", "row_number": 109791, "definition": "A genus of herbs growing in wet places and having white flowers; grass of Parnassus.", "details": []}, {"x": -0.4946352016549524, "y": 0.2104595457149253, "z": 0.8432335363950081, "word": "Parraqua", "pos_group": "noun", "row_number": 109867, "definition": "A curassow of the genus Ortalida allied to the guan.", "details": []}, {"x": -0.35618603631423, "y": 0.4813315708210322, "z": 0.8009066278073341, "word": "Parsley", "pos_group": "noun", "row_number": 109897, "definition": "An aromatic umbelliferous herb (Carum Petroselinum) having finely divided leaves which are used in cookery and as a garnish.", "details": []}, {"x": -0.614862576067217, "y": 0.3425510099830649, "z": 0.7103540090064728, "word": "Parsnip", "pos_group": "noun", "row_number": 109898, "definition": "The aromatic and edible spindle-shaped root of the cultivated form of the Pastinaca sativa a biennial umbelliferous plant which is very poisonous in its wild state; also the plant itself.", "details": []}, {"x": -0.3717982851881483, "y": 0.2762610748640852, "z": 0.8862538313858466, "word": "Parterre", "pos_group": "noun", "row_number": 109949, "definition": "An ornamental and diversified arrangement of beds or plots in which flowers are cultivated with intervening spaces of gravel or turf for walking on.", "details": []}, {"x": -0.4715323263881867, "y": 0.5128775134895276, "z": 0.7173659605304283, "word": "Parti-colored", "pos_group": "adjective", "row_number": 110111, "definition": "Colored with different tints; variegated; as a party-colored flower.", "details": []}, {"x": -0.5675802719435658, "y": 0.2301643416988875, "z": 0.7904916259586725, "word": "Passiflora", "pos_group": "noun", "row_number": 110239, "definition": "A genus of plants including the passion flower. It is the type of the order Passifloreae which includes about nineteen genera and two hundred and fifty species.", "details": []}, {"x": -0.326114776181432, "y": 0.4104553165797363, "z": 0.8515724196141882, "word": "Pastel", "pos_group": "noun", "row_n esembling that of the cinchona first brought from Payta in Peru.", "details": []}, {"x": -0.6093666723701049, "y": 0.3756372549569158, "z": 0.6982613488465607, "word": "Pea", "pos_group": "noun", "row_number": 110818, "definition": "A plant and its fruit of the genus Pisum of many varieties much cultivated for food. It has a papilionaceous flower and the pericarp is a legume popularly called a pod.", "details": []}, {"x": -0.3966338609388146, "y": 0.2508739064117788, "z": 0.8830310659532106, "word": "Pea", "pos_group": "noun", "row_number": 110819, "definition": "A name given especially in the Southern States to the seed of several leguminous plants (species of Dolichos Cicer Abrus etc.) esp. those having a scar (hilum) of a different color from the rest of the seed.", "details": []}, {"x": -0.4402648313579133, "y": 0.5171221588240957, "z": 0.7339969694232358, "word": "Peanut", "pos_group": "noun", "row_number": 110882, "definition": "The fruit of a trailing leguminous plant (Arachis hypogaea); also the plant itself which is widely cultivated for its fruit.", "details": []}, {"x": -0.5887230310994948, "y": 0.2491997226666722, "z": 0.7689633872141618, "word": "Pearlwort", "pos_group": "noun", "row_number": 110909, "definition": "A name given to several species of Sagina low and inconspicuous herbs of the Chickweed family.", "details": []}, {"x": -0.3260774010268986, "y": 0.3780286048580304, "z": 0.8664686390450806, "word": "Pearmain", "pos_group": "noun", "row_number": 110912, "definition": "The name of several kinds of apples; as the blue pearmain winter pearmain and red pearmain.", "details": []}, {"x": -0.5649624115030192, "y": 0.4560307254726476, "z": 0.6876434039628271, "word": "Peascod", "pos_group": "noun", "row_number": 110921, "definition": "The legume or pericarp or the pod of the pea.", "details": []}, {"x": -0.4753433309975908, "y": 0.2120791223641321, "z": 0.8538566410899282, "word": "Peccary", "pos_group": "noun", "row_number": 110956, "definition": "A
