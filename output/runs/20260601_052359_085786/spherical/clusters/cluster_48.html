16795015, "y": 0.2491603965106641, "z": 0.8858460948372756, "word": "Pink", "pos_group": "other", "row_number": 114561, "definition": "A color resulting from the combination of a pure vivid red with more or less white; -- so called from the common color of the flower.", "details": []}, {"x": -0.4417693020078031, "y": 0.521547643425955, "z": 0.729950641783656, "word": "Pink", "pos_group": "adjective", "row_number": 114564, "definition": "Resembling the garden pink in color; of the color called pink (see 6th Pink 2); as a pink dress; pink ribbons.", "details": []}, {"x": -0.59027524765695, "y": 0.2432586396313369, "z": 0.7696754941195918, "word": "Pinkroot", "pos_group": "noun", "row_number": 114571, "definition": "The root of Spigelia Marilandica used as a powerful vermifuge; also that of S. Anthelmia. See definition 2 (below).", "details": []}, {"x": -0.3208247014180441, "y": 0.3812390541546233, "z": 0.8670226609191429, "word": "Pinkroot", "pos_group": "noun", "row_number": 114572, "definition": "A perennial North American herb (Spigelia Marilandica) sometimes cultivated for its showy red blossoms. Called also Carolina pink Maryland pinkroot and worm grass.", "details": []}, {"x": -0.5696982602584311, "y": 0.4561083390309137, "z": 0.6836732226180706, "word": "Pinkroot", "pos_group": "noun", "row_number": 114573, "definition": "An annual South American and West Indian plant (Spigelia Anthelmia).", "details": []}, {"x": -0.4721509965519309, "y": 0.2076276852929415, "z": 0.8567170949356115, "word": "Pinna", "pos_group": "noun", "row_number": 114580, "definition": "A leaflet of a pinnate leaf. See Illust. of Bipinnate leaf under Bipinnate.", "details": []}, {"x": -0.367050823171132, "y": 0.4992391383547901, "z": 0.7848783191961421, "word": "Pinna", "pos_group": "noun", "row_number": 114581, "definition": "One of the primary divisions of a decompound leaf.", "details": []}, {"x": -0.6196554519967047, "y": 0.3176753933203213, "z": 0.7177112687491668, "word": "Pinnated", " center of the stems of many plants and trees especially those of the dicotyledonous or exogenous classes. It consists of cellular tissue.", "details": []}, {"x": -0.6188787806582063, "y": 0.3513344697659141, "z": 0.7025333765774517, "word": "Pixie", "pos_group": "noun", "row_number": 114998, "definition": "A low creeping evergreen plant (Pyxidanthera barbulata) with mosslike leaves and little white blossoms found in New Jersey and southward where it flowers in earliest spring.", "details": []}, {"x": -0.3746181674158861, "y": 0.2644022998535054, "z": 0.8886802869840987, "word": "Placenta", "pos_group": "noun", "row_number": 115046, "definition": "The part of a pistil or fruit to which the ovules or seeds are attached.", "details": []}, {"x": -0.4615533301450263, "y": 0.5201860061806846, "z": 0.7185924035263838, "word": "Placoganoid", "pos_group": "adjective", "row_number": 115080, "definition": "Pertaining to the Placoganoidei.", "details": []}, {"x": -0.5776711589531618, "y": 0.2298547852154025, "z": 0.7832386672191892, "word": "Planarida", "pos_group": "other", "row_number": 115199, "definition": "A division of Turbellaria; the Dendrocoela.", "details": []}, {"x": -0.3194117930530231, "y": 0.4022085567898287, "z": 0.8580235330710316, "word": "Planipetalous", "pos_group": "adjective", "row_number": 115259, "definition": "Having flat petals.", "details": []}, {"x": -0.5841791196092535, "y": 0.4384222585694207, "z": 0.6830231909704424, "word": "Plant", "pos_group": "noun", "row_number": 115301, "definition": "To put in the ground and cover as seed for growth; as to plant maize.", "details": []}, {"x": -0.4519918319690624, "y": 0.2125734196767961, "z": 0.8663232220598519, "word": "Plantage", "pos_group": "noun", "row_number": 115311, "definition": "A word used once by Shakespeare to designate plants in general or anything that is planted.", "details": []}, {"x": -0.3820874609341795, "y": 0.5094730556180616, "z": 0.7710034875382001, "word": "Plantain", "pos_group": "noun", "row_number": 115312, "definition": "A treelike perennial herb (Musa paradisiaca) of tropical regions bearing immense leaves and large clusters of the fruits called plantains. See Musa.", "details": []}, {"x": -0.6174304386167515, "y": 0.2974678312852882, "z": 0.7282118804441144, "word": "Plantain", "pos_group": "noun", "row_number": 115314, "definition": "Any plant of the genus Plantago but especially the P. major a low herb with broad spreading radical leaves and slender spikes of minute flowers. It is a native of Europe but now found near the abode of civilized man in nearly all parts of the world.", "details": []}, {"x": -0.3402131389843921, "y": 0.3131549640848596, "z": 0.8866729884976744, "word": "Plantal", "pos_group": "adjective", "row_number": 115315, "definition": "Belonging to plants; as plantal life.", "details": []}, {"x": -0.513670193283002, "y": 0.5020999307105138, "z": 0.6957288208153379, "word": "Plant-cane", "pos_group": "noun", "row_number": 115320, "definition": "A stalk or shoot of sugar cane of the first growth from the cutting. The growth of the second and following years is of inferior quality and is called rattoon.", "details": []}, {"x": -0.5351347532601212, "y": 0.2076973605606103, "z": 0.8188361266269248, "word": "Planter", "pos_group": "noun", "row_number": 115323, "definition": "One who or that which plants or sows; as a planterof corn; a machine planter.", "details": []}, {"x": -0.3299356505380584, "y": 0.4529226392944123, "z": 0.8282533122895505, "word": "Planticle", "pos_group": "noun", "row_number": 115327, "definition": "A young plant or plant in embryo.", "details": []}, {"x": -0.6111288497543196, "y": 0.3857208203668367, "z": 0.6911880914291686, "word": "Plantless", "pos_group": "adjective", "row_number": 115335, "definition": "Without plants; barren of vegetation.", "details": []}, {"x": -0.4016307532008218, "y": 0.2395129046896412, "z": 0.8839266409439593, "word": "Plantlet", "pos_group": "noun", "row_number": 115336, "definition": "A little plant.", "details": []}, {"x": -0.4293304700016702, "y": 0.5223966428217868, "z": 0.7367340735276681, "word": "Plastide", "pos_group": "noun", "row_number": 115407, "definition": "One of the many minute granules found in the protoplasm of vegetable cells. They are divided by their colors into three classes chloroplastids chromoplastids and leucoplastids.", "details": []}, {"x": -0.5980457497156041, "y": 0.2513919918428195, "z": 0.7610146829624254, "word": "Platband", "pos_group": "noun", "row_number": 115432, "definition": "A border of flowers in a garden along a wall or a parterre; hence a border.", "details": []}, {"x": -0.3214631247487599, "y": 0.3681273506466538, "z": 0.872435506574921, "word": "Pleiophyllous", "pos_group": "adjective", "row_number": 115737, "definition": "Having several leaves; -- used especially when several leaves or leaflets appear where normally there should be only one.", "details": []}, {"x": -0.5606389044717869, "y": 0.4670455142503936, "z": 0.683778111971464, "word": "Plerome", "pos_group": "noun", "row_number": 115794, "definition": "The central column of parenchyma in a growing stem or root.", "details": []}, {"x": -0.4845307018564349, "y": 0.2043467368246583, "z": 0.850571813609894, "word": "Pleurocarp", "pos_group": "noun", "row_number": 115841, "definition": "Any pleurocarpic moss.", "details": []}, {"x": -0.3575099082710076, "y": 0.4928711391298338, "z": 0.793262066218293, "word": "Pleurocarpous", "pos_group": "adjective", "row_number": 115843, "definition": "Side-fruited; -- said of those true mosses in which the pedicels or the capsules are from lateral archegonia; -- opposed to acrocarpous.", "details": []}, {"x": -0.6209994393607197, "y": 0.3300846223626689, "z": 0.7109176030971283, "word": "Pleuroptera", "pos_group": "other", "row_number": 115859, "definition": "A group of Isectivora including the colugo.", "details": []}, {"x": -0.3594048116840793, "y": 0.2815512738216002, "z": 0.8896949261110606, "word": ecandra) bearing dark purple juicy berries; -- called also garget pigeon berry pocan and pokeweed. The root and berries have emetic and purgative properties and are used in medicine. The young shoots are sometimes eaten as a substitute for asparagus and the berries are said to be used in Europe to color wine.", "details": []}, {"x": -0.5465676626652445, "y": 0.2101096410481112, "z": 0.810627984261144, "word": "Pokeweed", "pos_group": "noun", "row_number": 116589, "definition": "See Poke the plant.", "details": []}, {"x": -0.3246760491587549, "y": 0.4422016494761751, "z": 0.836088012294885, "word": "Polemoniaceous", "pos_group": "adjective", "row_number": 116657, "definition": "Of or pertaining to a natural order of plants (Polemoniaceae) which includes Polemonium Phlox Gilia and a few other genera.", "details": []}, {"x": -0.6071053421915601, "y": 0.3988552392169528, "z": 0.687268216660465, "word": "Polemonium", "pos_group": "noun", "row_number": 116658, "definition": "A genus of gamopetalous perennial herbs including the Jacob's ladder and the Greek valerian.", "details": []}, {"x": -0.4124832093986527, "y": 0.2305994951282234, "z": 0.8812953391518622, "word": "Pollen", "pos_group": "noun", "row_number": 116791, "definition": "The fecundating dustlike cells of the anthers of flowers. See Flower and Illust. of Filament.", "details": []}, {"x": -0.417004537094628, "y": 0.5221385019248325, "z": 0.743961424302488, "word": "Pollened", "pos_group": "adjective", "row_number": 116793, "definition": "Covered with pollen.", "details": []}, {"x": -0.6050256752770183, "y": 0.2604240986301884, "z": 0.7524116035178096, "word": "Polleniferous", "pos_group": "adjective", "row_number": 116794, "definition": "Producing pollen; polliniferous.", "details": []}, {"x": -0.3231548604247167, "y": 0.3547977769910799, "z": 0.8773194820737025, "word": "Pollenin", "pos_group": "noun", "row_number": 116795, "definition": "A substance found in the pollen of certain plants.", "details": []}, {"x": -0.5508170862270171, "y": 0.4774051094399361, "z": 0.6846056521830808, "word": "Pollenized", "pos_group": "other", "row_number": 116796, "definition": "of Pollenize", "details": []}, {"x": -0.4969814908742981, "y": 0.2021357909202293, "z": 0.8438901111859372, "word": "Pollenizing", "pos_group": "other", "row_number": 116797, "definition": "of Pollenize", "details": []}, {"x": -0.3486271136373267, "y": 0.4855029355356082, "z": 0.8017144349599883, "word": "Polliniferous", "pos_group": "adjective", "row_number": 116811, "definition": "Producing pollen; polleniferous.", "details": []}, {"x": -0.6213018600232482, "y": 0.3428988394823191, "z": 0.7045597097573284, "word": "Pollinium", "pos_group": "noun", "row_number": 116813, "definition": "A coherent mass of pollen as in the milkweed and most orchids.", "details": []}, {"x": -0.3675012723147235, "y": 0.2697560703461952, "z": 0.8900418402291197, "word": "Poly", "pos_group": "noun", "row_number": 116854, "definition": "A whitish woolly plant (Teucrium Polium) of the order Labiatae found throughout the Mediterranean region. The name with sundry prefixes is sometimes given to other related species of the same genus.", "details": []}, {"x": -0.4690714324765766, "y": 0.5202975180160002, "z": 0.7136262915425428, "word": "Polyadelphia", "pos_group": "other", "row_number": 116863, "definition": "A Linnaean class of plants having stamens united in three or more bodies or bundles by the filaments.", "details": []}, {"x": -0.5731442347297149, "y": 0.2239048595087747, "z": 0.7882717171663874, "word": "Polyadelphous", "pos_group": "adjective", "row_number": 116865, "definition": "Belonging to the class Polyadelphia; having stamens united in three or more bundles.", "details": []}, {"x": -0.3180124855896432, "y": 0.4104442173494196, "z": 0.854636532950423, "word": "Polyandria", "pos_group": "other", "row_number": 116866, "definition": "A Linnaean class of monoclinous or hermaphrodite plants having many stamens or any number above twenty inserted in the receptacle.", "details": []}, {"x": -0.5902156220646616, "y": 0.4317960222082851, "z": 0.6820540408764737, "word": "Polyanthus", "pos_group": "noun", "row_number": 116872, "definition": "The oxlip. So called because the peduncle bears a many-flowered umbel. See Oxlip. (b) A bulbous flowering plant of the genus Narcissus (N. Tazetta or N. polyanthus of some authors). See Illust. of Narcissus.", "details": []}, {"x": -0.4439308103579997, "y": 0.2136796174742142, "z": 0.8702105818081985, "word": "Polycarpous", "pos_group": "adjective", "row_number": 116885, "definition": "Having several pistils in one flower.", "details": []}, {"x": -0.3873835725528487, "y": 0.5140402647148881, "z": 0.76530815621424, "word": "Polycotyledon", "pos_group": "noun", "row_number": 116907, "definition": "A plant that has many or more than two cotyledons in the seed.", "details": []}, {"x": -0.617125760852448, "y": 0.2891943523340898, "z": 0.7317939750164343, "word": "Polygala", "pos_group": "noun", "row_number": 116930, "definition": "A genus of bitter herbs or shrubs having eight stamens and a two-celled ovary (as the Seneca snakeroot the flowering wintergreen etc.); milkwort.", "details": []}, {"x": -0.3348083346859961, "y": 0.3203608706769902, "z": 0.8861559070298358, "word": "Polygalaceous", "pos_group": "adjective", "row_number": 116931, "definition": "Of or pertaining to a natural order of plants (Polygalaceae) of which Polygala is the type.", "details": []}, {"x": -0.5213915722305978, "y": 0.4993171590445222, "z": 0.6919777475400581, "word": "Polygamia", "pos_group": "other", "row_number": 116933, "definition": "A Linnaean class of plants characterized by having both hermaphrodite and unisexual flowers on the same plant.", "details": []}, {"x": -0.5285953412266235, "y": 0.2041641282432935, "z": 0.8239562937268975, "word": "Polygamia", "pos_group": "other", "row_number": 116934, "definition": "A name given by Linnaeus to file orders of plants having syngenesious flowers.", "details": []}, {"x": -0.3313017511669582, "y": 0.4604887658451412, "z": 0.8235224624769659, "word": "Polygamous", "pos_group": "adjective", "row_number": 116940, "definition": "Belonging to the Polygamia; bearing both hermaphrodite and unisexual flowers on the same plant.", "details": []}, {"x": -0.615099323401005, "y": 0.3776647266146007, "z": 0.6921142800309387, "word": "Polygamy", "pos_group": "noun", "row_number": 116943, "definition": "The condition or state of a plant which bears both perfect and unisexual flowers.", "details": []}, {"x": -0.3938510592517259, "y": 0.2433981640041762, "z": 0.8863626102705876, "word": "Polygonaceous", "pos_group": "adjective", "row_number": 116963, "definition": "Of or pertaining to a natural order of apetalous plants (Polygonaceae) of which the knotweeds (species of Polygonum) are the type and which includes also the docks (Rumex) the buckwheat rhubarb sea grape (Coccoloba) and several other genera.", "details": []}, {"x": -0.4362784472060289, "y": 0.5242948229270874, "z": 0.7312838403488416, "word": "Polygonum", "pos_group": "noun", "row_number": 116968, "definition": "A genus of plants embracing a large number of species including bistort knotweed smartweed etc.", "details": []}, {"x": -0.5950230143266966, "y": 0.2442756648632928, "z": 0.7656872807988704, "word": "Polygony", "pos_group": "noun", "row_number": 116969, "definition": "Any plant of the genus Polygonum.", "details": []}, {"x": -0.3184154182914113, "y": 0.3762963704501391, "z": 0.8700647464300328, "word": "Polygyn", "pos_group": "noun", "row_number": 116982, "definition": "A plant of the order Polygynia.", "details": []}, {"x": -0.5676023901201873, "y": 0.4616845223855253, "z": 0.6816706892037387, "word": "Polygynia", "pos_group": "other", "row_number": 116983, "definition": "A Linnaean order of plants having many styles.", "details": []}, {"x": -0.4767514104306944, "y": 0.2036533065310323, "z": 0.8551218763377072, "word": "Poly-mountain", "pos_group": "noun", "row_number": 117027, "definition": "The closely related Teucrium montanum formerly called Polium montanum a plant of Southern Europe.", "details": []}, {"x": -0.3614632369011455, "y": 0.4988274164132241, "z": 0.7877280857018202, "word": "Poly-mountain", "pos_group": "noun", "row_number": 117028, "definition": "The Bartsia alpina a low purple-flowered herb of Europe.", "details": []}, {"x": -0.6223938367512414, "y": 0.3215624941757706, "z": 0.7135989590193685, "word": "Polypetalous", "pos_group": "adjective", "row_number": 117060, "definition": "Consisting of or having several or many separate petals; as a polypetalous corolla flower or plant.", "details": []}, {"x": -0.3528370734205963, "y": 0.2877344870191442, "z": 0.8903453625418727, "word": "Polypite", "pos_group": "noun", "row_number": 117088, "definition": "Sometimes the manubrium of a hydroid medusa.", "details": []}, {"x": -0.4893971935210214, "y": 0.5149593577630429, "z": 0.7037806809127558, "word": "Polypode", "pos_group": "noun", "row_number": 117092, "definition": "A plant of the genus Polypodium; polypody.", "details": []}, {"x": -0.5576205400712294, "y": 0.2136293875559014, "z": 0.8021357853026885, "word": "Polypodium", "pos_group": "noun", "row_number": 117094, "definition": "A genus of plants of the order Filices or ferns. The fructifications are in uncovered roundish points called sori scattered over the inferior surface of the frond or leaf. There are numerous species.", "details": []}, {"x": -0.3203646147768785, "y": 0.4307773771301072, "z": 0.8436808430631618, "word": "Polypody", "pos_group": "noun", "row_number": 117095, "definition": "Any plant of the genus Polypodium.", "details": []}, {"x": -0.6020637549192666, "y": 0.4119192364102209, "z": 0.6839896034938936, "word": "Polypori", "pos_group": "other", "row_number": 117100, "definition": "of Polyporus", "details": []}, {"x": -0.4238889511090941, "y": 0.2224936606301189, "z": 0.8779605504275471, "word": "Polysporous", "pos_group": "adjective", "row_number": 117123, "definition": "Containing many spores.", "details": []}, {"x": -0.4048812245209768, "y": 0.5207598692640165, "z": 0.7515852264344469, "word": "Polytocous", "pos_group": "adjective", "row_number": 117154, "definition": "Bearing fruit repeatedly as most perennial plants; polycarpic.", "details": []}, {"x": -0.6111534806894081, "y": 0.270301134710368, "z": 0.7439278994738058, "word": "Polytomous", "pos_group": "adjective", "row_number": 117156, "definition": "Subdivided into many distinct subordinate parts which however not being jointed to the petiole are not true leaflets; -- said of leaves.", "details": []}, {"x": -0.3259009257257816, "y": 0.3413430730564162, "z": 0.8816311547849706, "word": "Polyzoa", "pos_group": "other", "row_number": 117168, "definition": "Same as Bryozoa. See Illust. under Bryozoa and Phylactolaemata.", "details": []}, {"x": -0.5402928684737877, "y": 0.487104189601679, "z": 0.6861582359404119, "word": "Pomegranate", "pos_group": "noun", "row_number": 117193, "definition": "A carved or embroidered ornament resembling a pomegranate.", "details": []}, {"x": -0.5094137618732306, "y": 0.2010243943673584, "z": 0.8367119050685249, "word": "Pompillion", "pos_group": "noun", "row_number": 117237, "definition": "An ointment or pomatum made of black poplar buds.", "details": []}, {"x": -0.3404745059150322, "y": 0.4771739120393888, "z": 0.8101741593576904, "word": "Pondweed", "pos_group": "noun", "row_number": 117279, "definition": "Any aquatic plant of the genus Potamogeton of which many species are found in ponds or slow-moving rivers.", "details": []}, {"x": -0.6205460568241268, "y": 0.3560304019663949, "z": 0.6986880163819005, "word": "Poppy", "pos_group": "noun", "row_number": 117436, "definition": "Any plant or species of the genus Papaver herbs with showy polypetalous flowers and a milky juice. From one species (Papaver somniferum) opium is obtained though all the species contain it to some extent; also a flower of the plant. See Illust. of Capsule.", "details": []}, {"x": -0.3764282885472708, "y": 0.2584541484742945, "z": 0.8896646540791648, "word": "Populin", "pos_group": "noun", "row_number": 117470, "definition": "A glycoside related to salicin found in the bark of certain species of the poplar (Populus) and extracted as a sweet white crystalline substance.", "details": []}, {"x": -0.4563167789365987, "y": 0.5235655112471626, "z": 0.7194818640476107, "word": "Portulaca", "pos_group": "noun", "row_number": 117703, "definition": "A genus of polypetalous plants; also any plant of the genus.", "details": []}, {"x": -0.5826830109244527, "y": 0.2301255819479, "z": 0.779437441564847, "word": "Portulacaceous", "pos_group": "adjective", "row_number": 117704, "definition": "Of or pertaining to a natural order of plants (Portulacaceae) of which Portulaca is the type and which includes also the spring beauty (Claytonia) and other genera.", "details": []}, {"x": -0.3163590640516363, "y": 0.3977341016521826, "z": 0.861234304341916, "word": "Posterior", "pos_group": "adjective", "row_number": 117862, "definition": "On the side next the axis of inflorescence; -- said of an axillary flower.", "details": []}, {"x": -0.5827683145735834, "y": 0.4440546387630628, "z": 0.6805854607042902, "word": "Posy", "pos_group": "noun", "row_number": 118018, "definition": "A flower; a bouquet; a nosegay.", "details": []}, {"x": -0.4562259570498994, "y": 0.208048104312696, "z": 0.8652016310697737, "word": "Potato", "pos_group": "noun", "row_number": 118061, "definition": "A plant (Solanum tuberosum) of the Nightshade family and its esculent farinaceous tuber of which there are numerous varieties used for food. It is native of South America but a form of the species is found native as far north as New Mexico.", "details": []}, {"x": -0.3763551517568919, "y": 0.5098178364008206, "z": 0.773590701491191, "word": "Potpourri", "pos_group": "noun", "row_number": 118131, "definition": "A jar or packet of flower leaves perfumes and spices used to scent a room.", "details": []}, {"x": -0.6207489642918066, "y": 0.3007906867023339, "z": 0.7240135952617106, "word": "Prairie", "pos_group": "noun", "row_number": 118473, "definition": "A meadow or tract of grass; especially a so called natural meadow.", "details": []}, {"x": -0.3401533819751457, "y": 0.3072152157916177, "z": 0.8887713361247541, "word": "Prangos", "pos_group": "noun", "row_number": 118504, "definition": "A genus of umbelliferous plants one species of which (P. pabularia) found in Thibet Cashmere Afghanistan etc. has been used as fodder for cattle. It has decompound leaves with very long narrow divisions and a highly fragrant smell resembling that of new clover hay.", "details": []}, {"x": -0.5095395883805296, "y": 0.5068404986117149, "z": 0.6953287832673322, "word": "Prie", "pos_group": "noun", "row_number": 119893, "definition": "The plant privet.", "details": []}, {"x": -0.5403861208206472, "y": 0.2059527815735169, "z": 0.8158224636442318, "word": "Prime", "pos_group": "adjective", "row_number": 119973, "definition": "Early; blooming; being in the first stage.", "details": []}, {"x": -0.3254236891953317, "y": 0.4500589014711888, "z": 0.8315926934004692, "word": "Primer", "pos_group": "noun", "row_number": 120003, "definition": "A kind of type of which there are two species; one called long primer intermediate in size between bourgeois and small pica [see Long primer]; the other called great primer larger than pica.", "details": []}, {"x": -0.6116304541267578, "y": 0.3909938577132381, "z": 0.6877732117604003, "word": "Primordian", "pos_group": "noun", "row_number": 120048, "definition": "A name given to several kinds of plums; as red primordian amber primordian etc.", "details": []}, {"x": -0.4045044244358449, "y": 0.2339065538690297, "z": 0.8841175796628752, "word": "Primrose", "pos_group": "adjective", "row_number": 120051, "definition": "An early flowering plant of the genus Primula (P. vulgaris) closely allied to the c bases. There are about seventeen American species usually growing in the mud under still shallow water. So called from the shape of the shape of the leaves.", "details": []}, {"x": -0.3559017047390513, "y": 0.4981351903941989, "z": 0.7906929294326415, "word": "Quiname", "pos_group": "adjective", "row_number": 124227, "definition": "Growing in sets of five; -- said especially of leaves composed of five leaflets set at the end of a common petiole.", "details": []}, {"x": -0.6249339185705782, "y": 0.3256799991839785, "z": 0.7094999193456936, "word": "Quincewort", "pos_group": "noun", "row_number": 124232, "definition": "The squinancy. Called also quinsywort.", "details": []}, {"x": -0.3537555420938136, "y": 0.2816609551978382, "z": 0.8919215900262497, "word": "Quincuncial", "pos_group": "other", "row_number": 124235, "definition": "Having the leaves of a pentamerous calyx or corolla so imbricated that two are exterior two are interior and the other has one edge exterior and one interior; as quincuncial aestivation.", "details": []}, {"x": -0.4846037713582353, "y": 0.5191033394625313, "z": 0.7040531995128091, "word": "Quincunx", "pos_group": "noun", "row_number": 124239, "definition": "A quincuncial arrangement as of the parts of a flower in aestivation. See Quincuncial 2.", "details": []}, {"x": -0.5628720917719716, "y": 0.2128992052214159, "z": 0.7986544538912526, "word": "Quinology", "pos_group": "noun", "row_number": 124267, "definition": "The science which treats of the cultivation of the cinchona and of its use in medicine.", "details": []}, {"x": -0.3165164088250169, "y": 0.4270153479567802, "z": 0.8470391109942119, "word": "Quinquefoliated", "pos_group": "adjective", "row_number": 124284, "definition": "Having five leaves or leaflets.", "details": []}, {"x": -0.6015875412514465, "y": 0.417503252954826, "z": 0.6810164931799945, "word": "Quinquelocular", "pos_group": "adjective", "row_number": 124290, "definition": "Having five cells or loculi; five-celled; as a quinquelocular pericarp.", "details": []}, {"x": -0.4275418101366867, "y": 0.2173280116455171, "z": 0.877483068747911, "word": "Quitch grass", "pos_group": "other", "row_number": 124379, "definition": "A perennial grass (Agropyrum repens) having long running rootstalks by which it spreads rapidly and pertinaciously and so becomes a troublesome weed. Also called couch grass quick grass quick grass twitch grass. See Illustration in Appendix.", "details": []}, {"x": -0.3990725130248527, "y": 0.5220983106074614, "z": 0.7537602293892028, "word": "Race", "pos_group": "noun", "row_number": 124550, "definition": "A variety of such fixed character that it may be propagated by seed.", "details": []}, {"x": -0.6151673828199895, "y": 0.2728001364413108, "z": 0.7396953269231914, "word": "Raceme", "pos_group": "noun", "row_number": 124569, "definition": "A flower cluster with an elongated axis and many one-flowered lateral pedicels as in the currant and chokecherry.", "details": []}, {"x": -0.3248933871431952, "y": 0.3356252925562091, "z": 0.8841945204462538, "word": "Racemose", "pos_group": "adjective", "row_number": 124574, "definition": "Resembling a raceme; growing in the form of a raceme; as (Bot.) racemose berries or flowers; (Anat.) the racemose glands in which the ducts are branched and clustered like a raceme.", "details": []}, {"x": -0.5368656489914935, "y": 0.4923424964296318, "z": 0.6851088534987562, "word": "Radiant", "pos_group": "adjective", "row_number": 124684, "definition": "Having a raylike appearance as the large marginal flowers of certain umbelliferous plants; -- said also of the cluster which has such marginal flowers.", "details": []}, {"x": -0.5145771722431739, "y": 0.1983247440905142, "z": 0.8341928012681786, "word": "Radiate-veined", "pos_group": "adjective", "row_number": 124705, "definition": "Having the principal veins radiating or diverging from the apex of the petiole; -- said of such leaves as those of the grapevine most maples and the castor-oil plant.", "details": []}, {"x": -0.335389931587491, "y": 0.4752217171682172, "z": 0.8134358692124594, "word": "Radiatiform", "pos_group": "adjective", "row_number": 124706, "definition": "Having the marginal florets enlarged and radiating but not ligulate as in the capitula or heads of the cornflower.", "details": []}, {"x": -0.6219813479239344, "y": 0.3609155140388904, "z": 0.6948950960834082, "word": "Radical", "pos_group": "adjective", "row_number": 124713, "definition": "Belonging to or proceeding from the root of a plant; as radical tubers or hairs.", "details": []}, {"x": -0.378499096568653, "y": 0.2525090419419575, "z": 0.8904929071218189, "word": "Radical", "pos_group": "adjective", "row_number": 124714, "definition": "Proceeding from a rootlike stem or one which does not rise above the ground; as the radical leaves of the dandelion and the sidesaddle flower.", "details": []}, {"x": -0.4509292826903159, "y": 0.5267525300680229, "z": 0.720551562401563, "word": "Radicality", "pos_group": "noun", "row_number": 124725, "definition": "Germinal principle; source; origination.", "details": []}, {"x": -0.5876582722849034, "y": 0.2306782941505384, "z": 0.7755290320954594, "word": "Radication", "pos_group": "noun", "row_number": 124740, "definition": "The disposition of the roots of a plant.", "details": []}, {"x": -0.3135126878945918, "y": 0.3930375715688893, "z": 0.8644253940418098, "word": "Radicle", "pos_group": "noun", "row_number": 124744, "definition": "The rudimentary stem of a plant which supports the cotyledons in the seed and from which the root is developed downward; the stem of the embryo; the caulicle.", "details": []}, {"x": -0.5810913200099922, "y": 0.4497337436732981, "z": 0.6782863979254228, "word": "Radiculose", "pos_group": "adjective", "row_number": 124748, "definition": "Producing numerous radicles or rootlets.", "details": []}, {"x": -0.4606477380556024, "y": 0.2036770756047175, "z": 0.8638977429634639, "word": "Radish", "pos_group": "noun", "row_number": 124765, "definition": "The pungent fleshy root of a well-known cruciferous plant (Raphanus sativus); also the whole plant.", "details": []}, {"x": -0.3706137764122044, "y": 0.5098895593580509, "z": 0.7763105473914014, "word": "Radius", "pos_group": "noun", "row_number": 124770, "definition": "A ray or outer floret of the capitulum of such plants as the sunflower and the daisy. See Ray 2.", "details": []}, {"x": -0.6238947218811142, "y": 0.3043630435093003, "z": 0.7198044968980416, "word": "Radix", "pos_group": "noun", "row_number": 124781, "definition": "The root of a plant.", "details": []}, {"x": -0.3403589134039835, "y": 0.3011817420113384, "z": 0.8907555042465217, "word": "Rafflesia", "pos_group": "noun", "row_number": 124802, "definition": "A genus of stemless leafless plants living parasitically upon the roots and stems of grapevines in Malaysia. The flowers have a carrionlike odor and are very large in one species (Rafflesia Arnoldi) having a diameter of two or three feet.", "details": []}, {"x": -0.5051920475318794, "y": 0.5114709530971379, "z": 0.6951103935695772, "word": "Ragweed", "pos_group": "noun", "row_number": 124869, "definition": "A common American composite weed (Ambrosia artemisiaefolia) with finely divided leaves; hogweed.", "details": []}, {"x": -0.5456935971673172, "y": 0.2044654150209113, "z": 0.8126576106029649, "word": "Rambutan", "pos_group": "noun", "row_number": 125057, "definition": "A Malayan fruit produced by the tree Nephelium lappaceum and closely related to the litchi nut. It is bright red oval in shape covered with coarse hairs (whence the name) and contains a pleasant acid pulp. Called also ramboostan.", "details": []}, {"x": -0.321047377936805, "y": 0.4469271545789381, "z": 0.8349758676871304, "word": "Ramenta", "pos_group": "other", "row_number": 125065, "definition": "Thin brownish chaffy scales upon the leaves or young shoots of some plants especially upon the petioles and leaves of ferns.", "details": []}, {"x": -0.611877434539178, "y": 0.3964060455621163, "z": 0.6844474064115953, "word": "Ramie", "pos_group": "noun", "row_number": 125069, "definition": "The grass-cloth plant (B/hmeria nivea); also its fiber which is very fine and exceedingly strong; -- called also China grass and rhea. See Grass-cloth plant under Grass.", "details": []}, {"x": -0.4076193878032528, "y": 0.2283641374450768, "z": 0.8841358806291415, "word": "Rampion", "pos_group": "noun", "row_number": 125125, "definition": "A plant (Campanula Rapunculus) of the Bellflower family with a tuberous esculent root; -- also called ramps.", "details": []}, {"x": -0.4179531757361559, "y": 0.5267612662673029, "z": 0.7401605982842707, "word": "Ramson", "pos_group": "noun", "row_number": 125133, "definition": "A broad-leaved species of garlic (Allium ursinum) common in European gardens; -- called also buckram.", "details": []}, {"x": -0.6070359681181076, "y": 0.2547182076669839, "z": 0.7527456197772465, "word": "Ramsted", "pos_group": "noun", "row_number": 125134, "definition": "A yellow-flowered weed; -- so named from a Mr. Ramsted who introduced it into Pennsylvania. See Toad flax. Called also Ramsted weed.", "details": []}, {"x": -0.3177878949333182, "y": 0.3574684263875682, "z": 0.8781954099002373, "word": "Ranal", "pos_group": "adjective", "row_number": 125146, "definition": "Having a general affinity to ranunculaceous plants.", "details": []}, {"x": -0.5552692119248507, "y": 0.4780483347523742, "z": 0.6805482289513631, "word": "Range", "pos_group": "noun", "row_number": 125193, "definition": "To dispose in a classified or in systematic order; to arrange regularly; as to range plants and animals in genera and species.", "details": []}, {"x": -0.4943277175729647, "y": 0.1973941083303682, "z": 0.8465669929991142, "word": "Range", "pos_group": "verb", "row_number": 125211, "definition": "The region within which a plant or animal naturally lives.", "details": []}, {"x": -0.3466362493961449, "y": 0.4907304271281987, "z": 0.799391617728851, "word": "Rank", "pos_group": "other", "row_number": 125228, "definition": "Luxuriant in growth; of vigorous growth; exuberant; grown to immoderate height; as rank grass; rank weeds.", "details": []}, {"x": -0.6254380174727134, "y": 0.3388070582649417, "z": 0.7028777017160655, "word": "Rankly", "pos_group": "adverb", "row_number": 125254, "definition": "With rank or vigorous growth; luxuriantly; hence coarsely; grossly; as weeds grow rankly.", "details": []}, {"x": -0.3619380614556305, "y": 0.269441583514321, "z": 0.8924136220066542, "word": "Ranunculaceous", "pos_group": "adjective", "row_number": 125290, "definition": "Of or pertaining to a natural order of plants (Ranunculaceae) of which the buttercup is the type and which includes also the virgin's bower the monkshood larkspur anemone meadow rue and peony.", "details": []}, {"x": -0.4716876222839813, "y": 0.523729719226521, "z": 0.709378578886474, "word": "Ranunculus", "pos_group": "noun", "row_number": 125293, "definition": "A genus of herbs mostly with yellow flowers including crowfoot buttercups and the cultivated ranunculi (R. Asiaticus R. aconitifolius etc.) in which the flowers are double and of various colors.", "details": []}, {"x": -0.5733945901388015, "y": 0.2180345192271211, "z": 0.7897338744317316, "word": "Rape", "pos_group": "noun", "row_number": 125325, "definition": "A name given to a variety or to varieties of a plant of the turnip kind grown for seeds and herbage. The seeds are used for the production of rape oil and to a limited extent for the food of cage birds.", "details": []}, {"x": -0.313574149946569, "y": 0.4145479353911801, "z": 0.8542957694781104, "word": "Rappee", "pos_group": "verb", "row_number": 125354, "definition": "A pungent kind of snuff made from the darker and ranker kinds of tobacco leaves.", "details": []}, {"x": -0.595057991998732, "y": 0.4304902435817302, "z": 0.6786634927115056, "word": "Raspberry", "pos_group": "noun", "row_number": 125457, "definition": "The thimble-shaped fruit of the Rubus Idaeus and other similar brambles; as the black the red and the white raspberry.", "details": []}, {"x": -0.4397732206442114, "y": 0.2103798067430924, "z": 0.8731207541451278, "word": "Rasse", "pos_group": "noun", "row_number": 125462, "definition": "A carnivore (Viverricula Mallaccensis) allied to the civet but smaller native of China and the East Indies. It furnishes a perfume resembling that of the civet which is highly prized by the Javanese. Called also Malacca weasel and lesser civet.", "details": []}, {"x": -0.3872206821586113, "y": 0.5190900203665301, "z": 0.7619748644571519, "word": "Rattlebox", "pos_group": "noun", "row_number": 125602, "definition": "An American herb (Crotalaria sagittalis) the seeds of which when ripe rattle in the inflated pod.", "details": []}, {"x": -0.6200696687520075, "y": 0.2839232479985075, "z": 0.7313693971856858, "word": "Rattlebox", "pos_group": "noun", "row_number": 125603, "definition": "Any species of Crotalaria a genus of yellow-flowered herbs with inflated many-seeded pods.", "details": []}, {"x": -0.3291760903575416, "y": 0.3219636067374999, "z": 0.8876838048953603, "word": "Rattleweed", "pos_group": "noun", "row_number": 125613, "definition": "Any plant of the genus Astragalus. See Milk vetch.", "details": []}, {"x": -0.5253018412848448, "y": 0.5011009925582747, "z": 0.687717798809849, "word": "Ravenala", "pos_group": "noun", "row_number": 125665, "definition": "A genus of plants related to the banana.", "details": []}, {"x": -0.5270063330052925, "y": 0.1988081867414651, "z": 0.8262805999519082, "word": "Ray", "pos_group": "noun", "row_number": 125720, "definition": "A radiating part of a flower or plant; the marginal florets of a compound flower as an aster or a sunflower; one of the pedicels of an umbel or other circular flower cluster; radius. See Radius.", "details": []}, {"x": -0.3282825962463377, "y": 0.4654820678515811, "z": 0.8219227345136403, "word": "Ray grass", "pos_group": "other", "row_number": 125735, "definition": "A perennial European grass (Lolium perenne); -- called also rye grass and red darnel. See Darnel and Grass.", "details": []}, {"x": -0.6196878527600423, "y": 0.3745327799062324, "z": 0.6897189006525467, "word": "Receptacle", "pos_group": "noun", "row_number": 126236, "definition": "The apex of the flower stalk from which the organs of the flower grow or into which they are inserted. See Illust. of Flower and Ovary.", "details": []}, {"x": -0.3886491257119696, "y": 0.2419024501811606, "z": 0.8890641493613791, "word": "Receptacle", "pos_group": "noun", "row_number": 126237, "definition": "The dilated apex of a pedicel which serves as a common support to a head of flowers.", "details": []}, {"x": -0.4379098442308139, "y": 0.5285097938601857, "z": 0.7272636152865124, "word": "Receptacle", "pos_group": "noun", "row_number": 126239, "definition": "A special branch which bears the fructification in many cryptogamous plants.", "details": []}, {"x": -0.5963649614966099, "y": 0.2384321339718962, "z": 0.7664848010161419, "word": "Receptacular", "pos_group": "adjective", "row_number": 126240, "definition": "Pertaining to the receptacle or growing on it; as the receptacular chaff or scales in the sunflower.", "details": []}, {"x": -0.3133520908162296, "y": 0.3795781740961697, "z": 0.8704773845028458, "word": "Rectiserial", "pos_group": "adjective", "row_number": 126709, "definition": "Arranged in exactly vertical ranks as the leaves on stems of many kinds; -- opposed to curviserial.", "details": []}, {"x": -0.5722754875262396, "y": 0.4615644425033013, "z": 0.6778340739393537, "word": "Redhead", "pos_group": "noun", "row_number": 126903, "definition": "A kind of milkweed (Asclepias Curassavica) with red flowers. It is used in medicine.", "details": []}, {"x": -0.4734687214909452, "y": 0.1994267746477653, "z": 0.8579372537215757, "word": "Redroot", "pos_group": "noun", "row_number": 126986, "definition": "A name of several plants having red roots as the New Jersey tea (see under Tea) the gromwell the bloodroot and the Lachnanthes tinctoria an endogenous plant found in sandy swamps from Rhode Island to Florida.", "details": []}, {"x": -0.3601795602513821, "y": 0.5040587449708767, "z": 0.7849811883067681, "word": "Redtop", "pos_group": "noun", "row_number": 127004, "definition": "A kind of grass (Agrostis vulgaris) highly valued in the United States for pasturage and hay for cattle; -- called also English grass and in some localities herd's grass. See Illustration in Appendix. The tall redtop is Triodia seslerioides.", "details": []}, {"x": -0.6261163702104443, "y": 0.3169504339518583, "z": 0.712404880227688, "word": "Reduplicate", "pos_group": "adjective", "row_number": 127046, "definition": "Valvate with the margins curved outwardly; -- said of the /stivation of certain flowers.", "details": []}, {"x": -0.3471774003242251, "y": 0.2881839322546203, "z": 0.8924224750051833, "word": "Redweed", "pos_group": "noun", "row_number": 127054, "definition": "The red poppy (Papaver Rhoeas).", "details": []}, {"x": -0.4925697657212192, "y": 0.517785499900355, "z": 0.6994806659159942, "word": "Reed", "pos_group": "noun", "row_number": 127069, "definition": "A name given to many tall and coarse grasses or grasslike plants and their slender often jointed stems such as the various kinds of bamboo and especially the common reed of Europe and North America (Phragmites communis).", "details": []}, {"x": -0.5571473285561135, "y": 0.2078895337139431, "z": 0.8039706437768642, "word": "Reezed", "pos_group": "adjective", "row_number": 127191, "definition": "Grown rank; rancid; rusty.", "details": []}, {"x": -0.3164377124843333, "y": 0.43529503511471, "z": 0.8428436429861507, "word": "Reflorescence", "pos_group": "noun", "row_number": 127309, "definition": "A blossoming anew of a plant after it has apparently ceased blossoming for the season.", "details": []}, {"x": -0.6068758425721227, "y": 0.4098729346998688, "z":  of some plants.", "details": []}, {"x": -0.6248571341842507, "y": 0.3522712196681911, "z": 0.6967485555439139, "word": "Resuscitable", "pos_group": "adjective", "row_number": 129784, "definition": "Capable of resuscitation; as resuscitable plants.", "details": []}, {"x": -0.3709798071854327, "y": 0.2577175525396377, "z": 0.8921634635948944, "word": "Retinaculum", "pos_group": "noun", "row_number": 129908, "definition": "A small gland or process to which bodies are attached; as the glandular retinacula to which the pollinia of orchids are attached or the hooks which support the seeds in many acanthaceous plants.", "details": []}, {"x": -0.4585897647989751, "y": 0.5272884610175392, "z": 0.7153057433708857, "word": "Rhachilla", "pos_group": "noun", "row_number": 130547, "definition": "A branch of inflorescence; the zigzag axis on which the florets are arranged in the spikelets of grasses.", "details": []}, {"x": -0.5833257829274421, "y": 0.2242491609978468, "z": 0.7806685242558766, "word": "Rhachis", "pos_group": "noun", "row_number": 130552, "definition": "The continued stem or midrib of a pinnately compound leaf as in a rose leaf or a fern.", "details": []}, {"x": -0.3116860037691818, "y": 0.4015567841299083, "z": 0.8611643189157594, "word": "Rhamnaceous", "pos_group": "adjective", "row_number": 130565, "definition": "Of or pertaining to a natural order of shrubs and trees (Rhamnaceae or Rhamneae) of which the buckthorn (Rhamnus) is the type. It includes also the New Jersey tea the supple-jack and one of the plants called lotus (Zizyphus).", "details": []}, {"x": -0.5875654448005043, "y": 0.4431701668329226, "z": 0.6770281023012744, "word": "Rhaphe", "pos_group": "noun", "row_number": 130570, "definition": "The continuation of the seed stalk along the side of an anatropous ovule or seed forming a ridge or seam.", "details": []}, {"x": -0.4523707064959737, "y": 0.2044085878100566, "z": 0.8680886320726888, "word": "Rhatanhy", "pos_group": "noun", "row_number": 130590, ers; deep orange-yellow; as a saffron face; a saffron streamer.", "details": []}, {"x": -0.6271577583908885, "y": 0.2993886421975612, "z": 0.7190546481410272, "word": "Sagapen", "pos_group": "noun", "row_number": 133732, "definition": "Sagapenum.", "details": []}, {"x": -0.3347337342194011, "y": 0.3022902099299367, "z": 0.8925099193600315, "word": "Sage", "pos_group": "noun", "row_number": 133735, "definition": "A suffruticose labiate plant (Salvia officinalis) with grayish green foliage much used in flavoring meats etc. The name is often extended to the whole genus of which many species are cultivated for ornament as the scarlet sage and Mexican red and blue sage.", "details": []}, {"x": -0.5087760937384787, "y": 0.5136897722491663, "z": 0.6908470918566673, "word": "Sagebrush", "pos_group": "noun", "row_number": 133741, "definition": "A low irregular shrub (Artemisia tridentata) of the order Compositae covering vast tracts of the dry alkaline regions of the American plains; -- called also sagebush and wild sage.", "details": []}, {"x": -0.5445820595241005, "y": 0.1989646074872066, "z": 0.8147658960781009, "word": "Sagus", "pos_group": "noun", "row_number": 133772, "definition": "A genus of palms from which sago is obtained.", "details": []}, {"x": -0.3176534026100713, "y": 0.4517017492226233, "z": 0.8337036917031532, "word": "Sainfoin", "pos_group": "noun", "row_number": 133821, "definition": "A leguminous plant (Onobrychis sativa) cultivated for fodder.", "details": []}, {"x": -0.6165447419432919, "y": 0.3937441386514013, "z": 0.681790388946446, "word": "Salal-berry", "pos_group": "noun", "row_number": 133873, "definition": "The edible fruit of the Gaultheria Shallon an ericaceous shrub found from California northwards. The berries are about the size of a common grape and of a dark purple color.", "details": []}, {"x": -0.4026793565230848, "y": 0.2263963016983256, "z": 0.886901375806507, "word": "Salamstone", "pos_group": "noun", "row_number": 133884, "definition" 013, "definition": "Any plant of the genus Scabiosa several of the species of which are common in Europe. They resemble the Compositae and have similar heads of flowers but the anthers are not connected.", "details": []}, {"x": -0.3127342411457302, "y": 0.4398832300561863, "z": 0.8418432385725626, "word": "Scale", "pos_group": "noun", "row_number": 135066, "definition": "A small appendage like a rudimentary leaf resembling the scales of a fish in form and often in arrangement; as the scale of a bud of a pine cone and the like. The name is also given to the chaff on the stems of ferns.", "details": []}, {"x": -0.6116037928941331, "y": 0.4076031562864999, "z": 0.6780858850490796, "word": "Scallion", "pos_group": "noun", "row_number": 135111, "definition": "A kind of small onion (Allium Ascalonicum) native of Palestine; the eschalot or shallot.", "details": []}, {"x": -0.4145461480910907, "y": 0.2175134506962, "z": 0.8836511697887754, "word": "Scammony", "pos_group": "noun", "row_number": 135161, "definition": "A species of bindweed or Convolvulus (C. Scammonia).", "details": []}, {"x": -0.4062206210816095, "y": 0.530179151987798, "z": 0.7442411395546277, "word": "Scape", "pos_group": "noun", "row_number": 135231, "definition": "A peduncle rising from the ground or from a subterranean stem as in the stemless violets the bloodroot and the like.", "details": []}, {"x": -0.6156179589224898, "y": 0.2591469051954107, "z": 0.7442159701187205, "word": "Scattered", "pos_group": "adjective", "row_number": 135387, "definition": "Irregular in position; having no regular order; as scattered leaves.", "details": []}, {"x": -0.3150757090665564, "y": 0.3461350795699719, "z": 0.8836955382071905, "word": "Schizomycetes", "pos_group": "other", "row_number": 135531, "definition": "An order of Schizophyta including the so-called fission fungi or bacteria. See Schizophyta in the Supplement.", "details": []}, {"x": -0.5488936194913655, "y": 0.4889478465896244, "z": 0.6779718266986005, "word": "Schizophyte", "pos_group": "noun", "row_number": 135534, "definition": "One of a class of vegetable organisms in the classification of Cohn which includes all of the inferior forms that multiply by fission whether they contain chlorophyll or not.", "details": []}, {"x": -0.5046509406933964, "y": 0.1912726916476, "z": 0.8418682708637689, "word": "Scion", "pos_group": "noun", "row_number": 135690, "definition": "A shoot or sprout of a plant; a sucker.", "details": []}, {"x": -0.3359983681399229, "y": 0.4874719815521248, "z": 0.80590083993563, "word": "Scirrhoid", "pos_group": "adjective", "row_number": 135702, "definition": "Resembling scirrhus.", "details": []}, {"x": -0.6290087475130159, "y": 0.3483510602863228, "z": 0.6949816791466533, "word": "Scitamineous", "pos_group": "adjective", "row_number": 135724, "definition": "Of or pertaining to a natural order of plants (Scitamineae) mostly tropical herbs including the ginger Indian shot banana and the plants producing turmeric and arrowroot.", "details": []}, {"x": -0.3655211116681136, "y": 0.2572426405785992, "z": 0.8945504685556069, "word": "Scoke", "pos_group": "noun", "row_number": 135796, "definition": "Poke (Phytolacca decandra).", "details": []}, {"x": -0.4610410551822308, "y": 0.53078949969267, "z": 0.7111284359751479, "word": "Scolopendrine", "pos_group": "adjective", "row_number": 135823, "definition": "Like or pertaining to the Scolopendra.", "details": []}, {"x": -0.5837197669066891, "y": 0.2184413433675674, "z": 0.78201957343162, "word": "Scorpionwort", "pos_group": "noun", "row_number": 135964, "definition": "A leguminous plant (Ornithopus scorpioides) of Southern Europe having slender curved pods.", "details": []}, {"x": -0.3072053842144122, "y": 0.405503106107815, "z": 0.8609251319636275, "word": "Scrobiculae", "pos_group": "other", "row_number": 136296, "definition": "of Scrobicula", "details": []}, {"x": -0.5923313889327501, "y": 0.4420378422260954, "z": 0.6736067634199472, "word": "Scroll", "pos_group": "noun", "row_number": 136311, "definition": "An ornament formed of undulations giving off spirals or sprays usually suggestive of plant form. Roman architectural ornament is largely of some scroll pattern.", "details": []}, {"x": -0.4483729668672663, "y": 0.2010138875049262, "z": 0.8709506872451517, "word": "Scrophularia", "pos_group": "noun", "row_number": 136315, "definition": "A genus of coarse herbs having small flowers in panicled cymes; figwort.", "details": []}, {"x": -0.3754748941342791, "y": 0.5199681492852516, "z": 0.767236422234843, "word": "Scrophulariaceous", "pos_group": "adjective", "row_number": 136316, "definition": "Of or pertaining to a very large natural order of gamopetalous plants (Scrophulariaceae or Scrophularineae) usually having irregular didynamous flowers and a two-celled pod. The order includes the mullein foxglove snapdragon figwort painted cup yellow rattle and some exotic trees as the Paulownia.", "details": []}, {"x": -0.6269983003078798, "y": 0.2906125193494072, "z": 0.7227845425909578, "word": "Scuppernong", "pos_group": "noun", "row_number": 136475, "definition": "An American grape a form of Vitis vulpina found in the Southern Atlantic States and often cultivated.", "details": []}, {"x": -0.3289157236761656, "y": 0.3098372443621992, "z": 0.8920848214853916, "word": "Scurf", "pos_group": "noun", "row_number": 136480, "definition": "Minute membranous scales on the surface of some leaves as in the goosefoot.", "details": []}, {"x": -0.5169647413363638, "y": 0.5109092648999152, "z": 0.6868181558858609, "word": "Scutch grass", "pos_group": "other", "row_number": 136517, "definition": "A kind of pasture grass (Cynodon Dactylon). See Bermuda grass: also Illustration in Appendix.", "details": []}, {"x": -0.5377702681273252, "y": 0.1950894838690221, "z": 0.8202092611047399, "word": "Scutellum", "pos_group": "noun", "row_number": 136532, "definition": "A rounded apothecium having an elevated rim formed of the proper thallus the fructification of certain lichens.", "details": []}, {"x": -0.3189571254106383, "y": 0.4597722029108985, "z": 0.8287797497406907, "word": "Scyphus", "pos_group": "noun", "row_number": 136582, "definition": "The cup of a narcissus or a similar appendage to the corolla in other flowers.", "details": []}, {"x": -0.6208828505781, "y": 0.3852889674077294, "z": 0.6826835998117269, "word": "Scyphus", "pos_group": "noun", "row_number": 136583, "definition": "A cup-shaped stem or podetium in lichens. Also called scypha. See Illust. of Cladonia pyxidata under Lichen.", "details": []}, {"x": -0.3944233582232295, "y": 0.2303681590177666, "z": 0.8895845804636426, "word": "Sea blite", "pos_group": "other", "row_number": 136628, "definition": "A plant (Suaeda maritima) of the Goosefoot family growing in salt marches.", "details": []}, {"x": -0.4264086315166487, "y": 0.5333773506220567, "z": 0.7305369811388704, "word": "Sea daffodil", "pos_group": "other", "row_number": 136684, "definition": "A European amarylidaceous plant (Pancratium maritimum).", "details": []}, {"x": -0.6057592856991691, "y": 0.2414073114549836, "z": 0.7581412782359953, "word": "Sea fern", "pos_group": "other", "row_number": 136708, "definition": "Any gorgonian which branches like a fern.", "details": []}, {"x": -0.3092112625444175, "y": 0.3689388553920041, "z": 0.8765115607325012, "word": "Sea grape", "pos_group": "other", "row_number": 136730, "definition": "The gulf weed. See under Gulf.", "details": []}, {"x": -0.567194880563878, "y": 0.472894870597474, "z": 0.6742851094490568, "word": "Sea heath", "pos_group": "other", "row_number": 136741, "definition": "A low perennial plant (Frankenia laevis) resembling heath growing along the seashore in Europe.", "details": []}, {"x": -0.4833119073192114, "y": 0.1919762369948468, "z": 0.8541397571081472, "word": "Sea holly", "pos_group": "other", "row_number": 136745, "definition": "An evergeen seashore plant (Eryngium maritimum). See Eryngium.", "details": []}, {"x": -0 ked inflorescence and long grasslike leaves which are usually rough on the margins and midrib. There are several hundred species.", "details": []}, {"x": -0.4475080797013676, "y": 0.5335226210025342, "z": 0.7176977995511625, "word": "Sedum", "pos_group": "noun", "row_number": 137336, "definition": "A genus of plants mostly perennial having succulent leaves and cymose flowers; orpine; stonecrop.", "details": []}, {"x": -0.5933673494600349, "y": 0.2257067122429315, "z": 0.7726394169619224, "word": "Seed", "pos_group": "noun", "row_number": 137353, "definition": "A ripened ovule consisting of an embryo with one or more integuments or coverings; as an apple seed; a currant seed. By germination it produces a new plant.", "details": []}, {"x": -0.3061717604437224, "y": 0.3917891216602525, "z": 0.8676175063099407, "word": "Seed", "pos_group": "noun", "row_number": 137354, "definition": "Any small seedlike fruit though it may consist of a pericarp or even a calyx as well as the seed proper; as parsnip seed; thistle seed.", "details": []}, {"x": -0.5838635126072784, "y": 0.4547336821082031, "z": 0.6725478994110429, "word": "Seedbox", "pos_group": "noun", "row_number": 137365, "definition": "A plant (Ludwigia alternifolia) which has somewhat cubical or box-shaped capsules.", "details": []}, {"x": -0.4615551943091513, "y": 0.1957429964525073, "z": 0.8652464862373238, "word": "Seeder", "pos_group": "noun", "row_number": 137368, "definition": "One who or that which sows or plants seed.", "details": []}, {"x": -0.3641609902322915, "y": 0.5147784576581456, "z": 0.7761378181251944, "word": "Seedling", "pos_group": "noun", "row_number": 137372, "definition": "A plant reared from the seed as distinguished from one propagated by layers buds or the like.", "details": []}, {"x": -0.6301575445658891, "y": 0.3032760040571631, "z": 0.714790273010069, "word": "Seedy", "pos_group": "other", "row_number": 137381, "definition": "Abounding with seeds; bearing seeds; having run to seeds.", "deta  "pos_group": "noun", "row_number": 142720, "definition": "A plant (Tragopogon pratensis) which closes its flowers at midday; a kind of goat's beard.", "details": []}, {"x": -0.3182008294052166, "y": 0.3258191446045132, "z": 0.8902753041475516, "word": "Slender", "pos_group": "other", "row_number": 142787, "definition": "Small or narrow in proportion to the length or the height; not thick; slim; as a slender stem or stalk of a plant.", "details": []}, {"x": -0.5333808324278606, "y": 0.503888530995759, "z": 0.6794124196167585, "word": "Slickensides", "pos_group": "noun", "row_number": 142829, "definition": "A variety of galena found in Derbyshire England.", "details": []}, {"x": -0.5231698204622548, "y": 0.1886056687544763, "z": 0.8310964087704681, "word": "Smallage", "pos_group": "noun", "row_number": 143314, "definition": "A biennial umbelliferous plant (Apium graveolens) native of the seacoats of Europe and Asia. When deprived of its acrid and even poisonous properties by cultivation it becomes celery.", "details": []}, {"x": -0.3229683722714347, "y": 0.4755064002449157, "z": 0.8182817936618547, "word": "Smartweed", "pos_group": "noun", "row_number": 143350, "definition": "An acrid plant of the genus Polygonum (P. Hydropiper) which produces smarting if applied where the skin is tender.", "details": []}, {"x": -0.6284671575723143, "y": 0.3677131384389879, "z": 0.6854313092296891, "word": "Smilax", "pos_group": "noun", "row_number": 143435, "definition": "A genus of perennial climbing plants usually with a prickly woody stem; green brier or cat brier. The rootstocks of certain species are the source of the medicine called sarsaparilla.", "details": []}, {"x": -0.3781195611878484, "y": 0.2397015956376908, "z": 0.8941860782274871, "word": "Smilax", "pos_group": "noun", "row_number": 143436, "definition": "A delicate trailing plant (Myrsiphyllum asparagoides) much used for decoration. It is a native of the Cape of Good Hope.", "details": []}, {"x": -0.4417670882770612, 85, "y": 0.2898125384644305, "z": 0.8961687275438074, "word": "Sneezewort", "pos_group": "noun", "row_number": 143844, "definition": "A European herbaceous plant (Achillea Ptarmica) allied to the yarrow having a strong pungent smell.", "details": []}, {"x": -0.4993170816254626, "y": 0.5227010192214491, "z": 0.6909892159085329, "word": "Snowberry", "pos_group": "noun", "row_number": 143997, "definition": "A name of several shrubs with white berries; as the Symphoricarpus racemosus of the Northern United States and the Chiococca racemosa of Florida and tropical America.", "details": []}, {"x": -0.5554861963434424, "y": 0.1967756516349748, "z": 0.8079074381360316, "word": "Snowdrop", "pos_group": "noun", "row_number": 144007, "definition": "A bulbous plant (Galanthus nivalis) bearing white flowers which often appear while the snow is on the ground. It is cultivated in gardens for its beauty.", "details": []}, {"x": -0.3092472233133119, "y": 0.4445363523263003, "z": 0.8406863781062673, "word": "Snowflake", "pos_group": "noun", "row_number": 144010, "definition": "A name given to several bulbous plants of the genus Leucoium (L. vernum aestivum etc.) resembling the snowdrop but having all the perianth leaves of equal size.", "details": []}, {"x": -0.6162480336219488, "y": 0.4051199598369183, "z": 0.6753637384393798, "word": "Soaproot", "pos_group": "noun", "row_number": 144119, "definition": "A perennial herb (Gypsophila Struthium) the root of which is used in Spain as a substitute for soap.", "details": []}, {"x": -0.4097379717425913, "y": 0.2154070482372193, "z": 0.8864054366270526, "word": "Soapwort", "pos_group": "noun", "row_number": 144122, "definition": "A common plant (Saponaria officinalis) of the Pink family; -- so called because its bruised leaves when agitated in water produce a lather like that from soap. Called also Bouncing Bet.", "details": []}, {"x": -0.4072234667761777, "y": 0.5346525648707067, "z": 0.7404834116872342, "word": "Soboles", "pos_group": "noun", "row_number": 144156, "definition": "A shoot running along under ground forming new plants at short distances.", "details": []}, {"x": -0.6175015359524324, "y": 0.2535390287082791, "z": 0.744587009031214, "word": "Soboliferous", "pos_group": "adjective", "row_number": 144158, "definition": "Producing soboles. See Illust. of Houseleek.", "details": []}, {"x": -0.3098499441365109, "y": 0.3488170118259064, "z": 0.8844883856667911, "word": "Social", "pos_group": "adjective", "row_number": 144181, "definition": "Naturally growing in groups or masses; -- said of many individual plants of the same species.", "details": []}, {"x": -0.553272803521946, "y": 0.4894833510474577, "z": 0.6740142831797538, "word": "Social", "pos_group": "adjective", "row_number": 144183, "definition": "Forming compound groups or colonies by budding from basal processes or stolons; as the social ascidians.", "details": []}, {"x": -0.5019723862408246, "y": 0.1866850847216854, "z": 0.8444953538025829, "word": "Soil", "pos_group": "noun", "row_number": 144325, "definition": "The upper stratum of the earth; the mold or that compound substance which furnishes nutriment to plants or which is particularly adapted to support and nourish them.", "details": []}, {"x": -0.3341253960438238, "y": 0.4925866555715054, "z": 0.8035661805174711, "word": "Sola", "pos_group": "noun", "row_number": 144361, "definition": "A leguminous plant (Aeschynomene aspera) growing in moist places in Southern India and the East Indies. Its pithlike stem is used for making hats swimming-jackets etc.", "details": []}, {"x": -0.633004612582345, "y": 0.3442784239290545, "z": 0.6933812279449175, "word": "Solanaceous", "pos_group": "adjective", "row_number": 144371, "definition": "Of or pertaining to plants of the natural order Solanaceae of which the nightshade (Solanum) is the type. The order includes also the tobacco ground cherry tomato eggplant red pepper and many more.", "details": []}, {"x": -0.3600555703117755, "y": 0.2570191593457176, "z": 0.896828377125012, "word": "Solanine", "pos_group": "noun", "row_number": 144378, "definition": "A poisonous alkaloid glucoside extracted from the berries of common nightshade (Solanum nigrum) and of bittersweet and from potato sprouts as a white crystalline substance having an acrid burning taste; -- called also solonia and solanina.", "details": []}, {"x": -0.4636619614415965, "y": 0.5340752290380616, "z": 0.7069520742172509, "word": "Solanum", "pos_group": "noun", "row_number": 144381, "definition": "A genus of plants comprehending the potato (S. tuberosum) the eggplant (S. melongena and several hundred other species; nightshade.", "details": []}, {"x": -0.5838743802608001, "y": 0.212702629693715, "z": 0.7834847154836172, "word": "Soldanel", "pos_group": "noun", "row_number": 144401, "definition": "A plant of the genus Soldanella low Alpine herbs of the Primrose family.", "details": []}, {"x": -0.3029119926300659, "y": 0.4095657250715055, "z": 0.8605232370874912, "word": "Soldierwood", "pos_group": "noun", "row_number": 144424, "definition": "A showy leguminous plant (Calliandra purpurea) of the West Indies. The flowers have long tassels of purple stamens.", "details": []}, {"x": -0.5970644046000395, "y": 0.4406679668691542, "z": 0.670317715516311, "word": "Solidago", "pos_group": "noun", "row_number": 144541, "definition": "A genus of yellow-flowered composite perennial herbs; golden-rod.", "details": []}, {"x": -0.4442404923704734, "y": 0.1978561475771234, "z": 0.8737867759381456, "word": "Solisequious", "pos_group": "adjective", "row_number": 144579, "definition": "Following the course of the sun; as solisequious plants.", "details": []}, {"x": -0.3753927225070719, "y": 0.5248792524667936, "z": 0.7639254376041085, "word": "Sophora", "pos_group": "noun", "row_number": 144911, "definition": "A genus of leguminous plants.", "details": []}, {"x": -0.629806894933457, "y": 0.2854105857258669, "z": 0.722415443252631, "word": "Sophora", "pos_group": "noun", "row_number": 144912, "definition": "A tree (Sophora Japonica) of Eastern Asia resembling the common locust; occasionally planted in the United States.", "details": []}, {"x": -0.3234108935696396, "y": 0.3114830710931017, "z": 0.8935231895943703, "word": "Sorediate", "pos_group": "adjective", "row_number": 144976, "definition": "Sorediiferous.", "details": []}, {"x": -0.5208309466695014, "y": 0.5125672983901468, "z": 0.6826491702275608, "word": "Sorema", "pos_group": "noun", "row_number": 144987, "definition": "A heap of carpels belonging to one flower.", "details": []}, {"x": -0.5361276941486642, "y": 0.1898825148293888, "z": 0.8225033289470042, "word": "Sorghum", "pos_group": "noun", "row_number": 144991, "definition": "A genus of grasses properly limited to two species Sorghum Halepense the Arabian millet or Johnson grass (see Johnson grass) and S. vulgare the Indian millet (see Indian millet under Indian).", "details": []}, {"x": -0.3160694488203959, "y": 0.4646782350889046, "z": 0.8271482583896506, "word": "Sorgo", "pos_group": "noun", "row_number": 144993, "definition": "Indian millet and its varieties. See Sorghum.", "details": []}, {"x": -0.625339786442057, "y": 0.3821436251793819, "z": 0.6803796008313024, "word": "Sorrel", "pos_group": "noun", "row_number": 145009, "definition": "One of various plants having a sour juice; especially a plant of the genus Rumex as Rumex Acetosa Rumex Acetosella etc.", "details": []}, {"x": -0.3892927262039279, "y": 0.2289858913909457, "z": 0.8921976433888444, "word": "Sorus", "pos_group": "noun", "row_number": 145056, "definition": "One of the fruit dots or small clusters of sporangia on the back of the fronds of ferns.", "details": []}, {"x": -0.4280749005801026, "y": 0.5374452544613736, "z": 0.7265703530631321, "word": "Souari nut", "pos_group": "other", "row_number": 145092, "definition": "The large edible nutlike seed of a tall tropical American tree (Caryocar nuciferum) of the same natural order with the tea plant; -- also called butternut.", "details": []}, {"x": -0.6069873747289246, "y": 0.2356738965851748, "z": 0.7589625428096227, "word": "Southernwood", "pos_group": "noun", "row_number": 145265, "definition": "A shrubby species of wormwood (Artemisia Abrotanum) having aromatic foliage. It is sometimes used in making beer.", "details": []}, {"x": -0.3042894777123511, "y": 0.3722118329822577, "z": 0.8768501953820462, "word": "Sow", "pos_group": "other", "row_number": 145317, "definition": "To scatter as seed upon the earth; to plant by strewing; as to sow wheat. Also used figuratively: To spread abroad; to propagate.", "details": []}, {"x": -0.5717817008665117, "y": 0.4726846147493939, "z": 0.6705482395274898, "word": "Spaad", "pos_group": "noun", "row_number": 145346, "definition": "A kind of spar; earth flax or amianthus.", "details": []}, {"x": -0.4800237337980158, "y": 0.187897991717241, "z": 0.8568964696503536, "word": "Spadiceous", "pos_group": "adjective", "row_number": 145383, "definition": "Bearing flowers on a spadix; of the nature of a spadix.", "details": []}, {"x": -0.3477740859833559, "y": 0.5074394012008716, "z": 0.788389776206758, "word": "Spadix", "pos_group": "noun", "row_number": 145388, "definition": "A fleshy spike of flowers usually inclosed in a leaf called a spathe.", "details": []}, {"x": -0.6346183906055103, "y": 0.3209948363055744, "z": 0.7030091132911644, "word": "Spannishing", "pos_group": "noun", "row_number": 145489, "definition": "The full blooming of a flower.", "details": []}, {"x": -0.3438116141908242, "y": 0.276342120279617, "z": 0.8974567435296621, "word": "Sparrowwort", "pos_group": "noun", "row_number": 145584, "definition": "An evergreen shrub of the genus Erica (E. passerina).", "details": []}, {"x": -0.4857969970299663, "y": 0.5287027395082073, "z": 0.6960421617353243, "word": "Spathal", "pos_group": "adjective", "row_number": 145629, "definition": "Furnished with a spathe; as spathal flowers.", "details": []}, {"x": -0.56726425518
