ds.", "details": []}, {"x": -0.4757959837058044, "y": 0.2778508496083653, "z": 0.8345160796901012, "word": "Coxcomb", "pos_group": "noun", "row_number": 35393, "definition": "A name given to several plants of different genera but particularly to Celosia cristata or garden cockscomb. Same as Cockscomb.", "details": []}, {"x": -0.4159246916072133, "y": 0.4447004191128474, "z": 0.7932516549949974, "word": "Crake", "pos_group": "noun", "row_number": 35561, "definition": "Any species or rail of the genera Crex and Porzana; -- so called from its singular cry. See Corncrake.", "details": []}, {"x": -0.5603645077056897, "y": 0.3405737747866735, "z": 0.7549841868750073, "word": "Cranberry", "pos_group": "noun", "row_number": 35607, "definition": "A red acid berry much used for making sauce etc.; also the plant producing it (several species of Vaccinum or Oxycoccus.) The high cranberry or cranberry tree is a species of Viburnum (V. Opulus) and the other is sometimes called low cranberry or marsh cranberry to distinguish it.", "details": []}, {"x": -0.4071534033493288, "y": 0.3271573254959933, "z": 0.8527568179237074, "word": "Crane's-bill", "pos_group": "noun", "row_number": 35619, "definition": "The geranium; -- so named from the long axis of the fruit which resembles the beak of a crane.", "details": []}, {"x": -0.4886079891421751, "y": 0.451211119901069, "z": 0.7467735655632591, "word": "Cress", "pos_group": "noun", "row_number": 36059, "definition": "A plant of various species chiefly cruciferous. The leaves have a moderately pungent taste and are used as a salad and antiscorbutic.", "details": []}, {"x": -0.5218065181955113, "y": 0.2815705915743078, "z": 0.8052552139099577, "word": "Crinum", "pos_group": "noun", "row_number": 36265, "definition": "A genus of bulbous plants of the order Amaryllidace/ cultivated as greenhouse plants on account of their beauty.", "details": []}, {"x": -0.3912438923180188, "y": 0.4076852574225183, "z": 0.8250581480139333, "word": "Crocin", "pos_group": "noun", "row_number": 36378, "definition": "The coloring matter of Chinese yellow pods the fruit of Gardenia grandiflora.", "details": []}, {"x": -0.5506628268381768, "y": 0.3914318393418678, "z": 0.7372594972518363, "word": "Crocus", "pos_group": "noun", "row_number": 36407, "definition": "A genus of iridaceous plants with pretty blossoms rising separately from the bulb or corm. C. vernus is one of the earliest of spring-blooming flowers; C. sativus produces the saffron and blossoms in the autumn.", "details": []}, {"x": -0.4461309806171543, "y": 0.2891298061996504, "z": 0.846977628571457, "word": "Crossbreed", "pos_group": "noun", "row_number": 36556, "definition": "A breed or an animal produced from parents of different breeds; a new variety as of plants combining the qualities of two parent varieties or stocks.", "details": []}, {"x": -0.4407513684645315, "y": 0.4563631635064368, "z": 0.7729624144750119, "word": "Crosswort", "pos_group": "noun", "row_number": 36626, "definition": "A name given to several inconspicuous plants having leaves in whorls of four as species of Crucianella Valantia etc.", "details": []}, {"x": -0.5533474016356723, "y": 0.3120045864844638, "z": 0.7723080933900077, "word": "Crotalaria", "pos_group": "noun", "row_number": 36627, "definition": "A genus of leguminous plants; rattlebox.", "details": []}, {"x": -0.3925661935476672, "y": 0.3575751578243126, "z": 0.8473675649860652, "word": "Croton", "pos_group": "noun", "row_number": 36650, "definition": "A genus of euphorbiaceous plants belonging to tropical countries.", "details": []}, {"x": -0.5170774599450381, "y": 0.4348647282901267, "z": 0.7372405092681369, "word": "Crotonic", "pos_group": "adjective", "row_number": 36652, "definition": "Of or pertaining to or derived from a plant of the genus Croton or from croton oil.", "details": []}, {"x": -0.4943162024335139, "y": 0.2751714487181765, "z": 0.8245799935858552, "word": "Crowberry", "pos_group": "noun", "row_number": 36690, "definition": "A heathlike plant of the genus Empetrum and its fruit a black scarcely edible berry; -- also called crakeberry.", "details": []}, {"x": -0.4032220081791096, "y": 0.4334317609019767, "z": 0.8059459788108739, "word": "Crowflower", "pos_group": "noun", "row_number": 36707, "definition": "A kind of campion; according to Gerarde the Lychnis Flos-cuculi.", "details": []}, {"x": -0.5604290054076304, "y": 0.3597801878563847, "z": 0.7459742263133753, "word": "Crowfoot", "pos_group": "noun", "row_number": 36708, "definition": "The genus Ranunculus of many species; some are common weeds others are flowering plants of considerable beauty.", "details": []}, {"x": -0.4196417534507884, "y": 0.3099943939901231, "z": 0.8531144556596402, "word": "Crown-imperial", "pos_group": "noun", "row_number": 36749, "definition": "A spring-blooming plant (Fritillaria imperialis) of the Lily family having at the top of the stalk a cluster of pendent bell-shaped flowers surmounted with a tuft of green leaves.", "details": []}, {"x": -0.4699796974846407, "y": 0.4572010737901177, "z": 0.7550405698221844, "word": "Crow-silk", "pos_group": "noun", "row_number": 36766, "definition": "A filamentous fresh-water alga (Conferva rivularis of Linnaeus Rhizoclonium rivulare of Kutzing).", "details": []}, {"x": -0.5366546981648247, "y": 0.2898120473905292, "z": 0.7924712689586485, "word": "Crowtoe", "pos_group": "noun", "row_number": 36771, "definition": "The Lotus corniculatus.", "details": []}, {"x": -0.3878503487046695, "y": 0.3894215479089167, "z": 0.8354178385897021, "word": "Cruciate", "pos_group": "adjective", "row_number": 36783, "definition": "Having the leaves or petals arranged in the form of a cross; cruciform.", "details": []}, {"x": -0.5406674588430822, "y": 0.410025269153371, "z": 0.7345461031166589, "word": "Crucifer", "pos_group": "noun", "row_number": 36789, "definition": "Any plant of the order Cruciferae.", "details": []}, {"x": -0.4641426247950609, "y": 0.2798754816402516, "z": 0.8403816624754422, "word": "Cruciferous", "pos_group": "adjective", "row_number": 36791, "definition": "Of pertaining to or resembling a family of plants which have four petals arranged like the arms of a cross as the mustard radish turnip etc.", "details": []}, {"x": -0.4240456970456617, "y": 0.4512968971744993, "z": 0.7851855560424734, "word": "Cryptogam", "pos_group": "noun", "row_number": 37006, "definition": "A plant belonging to the Cryptogamia.", "details": []}, {"x": -0.5598281634521056, "y": 0.3286419061306292, "z": 0.7606490156048773, "word": "Cryptogamia", "pos_group": "noun", "row_number": 37008, "definition": "The series or division of flowerless plants or those never having true stamens and pistils but propagated by spores of various kinds.", "details": []}, {"x": -0.3995945836655146, "y": 0.337992897081095, "z": 0.8521061965670198, "word": "Cryptogamous", "pos_group": "adjective", "row_number": 37011, "definition": "Of or pertaining to the series Cryptogamia or to plants of that series.", "details": []}, {"x": -0.5000816032689305, "y": 0.4469971922661379, "z": 0.7416952879573694, "word": "Cryptogamist", "pos_group": "noun", "row_number": 37012, "definition": "One skilled in cryptogamic botany.", "details": []}, {"x": -0.5122225187272152, "y": 0.2767712006435019, "z": 0.8130349277879163, "word": "Cuckoobud", "pos_group": "noun", "row_number": 37136, "definition": "A species of Ranunculus (R. bulbosus); -- called also butterflower buttercup kingcup goldcup.", "details": []}, {"x": -0.3936812192147527, "y": 0.4188184333020616, "z": 0.8182947009262571, "word": "Cuckooflower", "pos_group": "noun", "row_number": 37137, "definition": "A species of Cardamine (C. pratensis) or lady's smock. Its leaves are used in salads. Also the ragged robin (Lychnis Flos-cuculi).", "details": []}, {"x": -0.5564427294589227, "y": 0.3796372289383191, "z": 0.7390852882018005, "word": "Cuckoopint", "pos_group": "noun", "row_number": 37138, "definition": "A plant of the genus Arum (A. maculatum); the European wake-robin.", "details": []}, {"x": -0.4349412971786188, "y": 0.2952203672198432, "z": 0.8506885462889231, "word": "Cucullated", "pos_group": "adjective", "row_number": 37143, "definition": "Having the edges toward the base rolled inward as the leaf of the commonest American blue violet.", "details": []}, {"x": -0.4512593225650876, "y": 0.4590146931413978, "z": 0.7652911441264733, "word": "Cucumber", "pos_group": "noun", "row_number": 37147, "definition": "A creeping plant and its fruit of several species of the genus Cucumis esp. Cucumis sativus the unripe fruit of which is eaten either fresh or picked. Also similar plants or fruits of several other genera. See below.", "details": []}, {"x": -0.5488240403774717, "y": 0.3018239275737363, "z": 0.7795476184606759, "word": "Cucumis", "pos_group": "noun", "row_number": 37149, "definition": "A genus of plants including the cucumber melon and same kinds of gourds.", "details": []}, {"x": -0.388501749267042, "y": 0.369776082629853, "z": 0.8439976537475495, "word": "Cucurbitaceous", "pos_group": "adjective", "row_number": 37152, "definition": "Of pertaining to or resembling a family of plants of which the cucumber melon and gourd are common examples.", "details": []}, {"x": -0.5273858937947505, "y": 0.4268823758165068, "z": 0.7345989084143583, "word": "Cudweed", "pos_group": "noun", "row_number": 37178, "definition": "A small composite plant with cottony or silky stem and leaves primarily a species of Gnaphalium but the name is now given to many plants of different genera as Filago Antennaria etc.; cottonweed.", "details": []}, {"x": -0.4829531544602784, "y": 0.2745666745503962, "z": 0.831486254740993, "word": "Culrage", "pos_group": "noun", "row_number": 37269, "definition": "Smartweed (Polygonum Hydropiper).", "details": []}, {"x": -0.4094516051398918, "y": 0.4421474327631456, "z": 0.7980319735131705, "word": "Culverkey", "pos_group": "noun", "row_number": 37315, "definition": "An English meadow plant perhaps the columbine or the bluebell squill (Scilla nutans).", "details": []}, {"x": -0.5623933742394618, "y": 0.3473536605501325, "z": 0.7503726588262501, "word": "Cumin", "pos_group": "noun", "row_number": 37335, "definition": "A dwarf umbelliferous plant somewhat resembling fennel (Cuminum Cyminum) cultivated for its seeds which have a bitterish warm taste with an aromatic flavor and are used like those of anise and caraway.", "details": []}, {"x": -0.4102862871754823, "y": 0.3194380901518728, "z": 0.8541805834341364, "word": "Cundurango", "pos_group": "noun", "row_number": 37365, "definition": "The bark of a South American vine (Gonolobus Condurango) of the Milkweed family. It has been supposed but erroneously to be a cure for cancer.", "details": []}, {"x": -0.4816009126934977, "y": 0.4555366149250188, "z": 0.7486968367473212, "word": "Cup", "pos_group": "noun", "row_number": 37393, "definition": "Anything shaped like a cup; as the cup of an acorn or of a flower.", "details": []}, {"x": -0.5286518877040268, "y": 0.2826438677966147, "z": 0.8003996661818013, "word": "Cup-moss", "pos_group": "noun", "row_number": 37416, "definition": "A kind of lichen of the genus Cladonia.", "details": []}, {"x": -0.3878064248821469, "y": 0.4014978624440981, "z": 0.8297021412970728, "word": "Curari", "pos_group": "noun", "row_number": 37446, "definition": "A black resinoid extract prepared by the South American Indians from the bark of several species of Strychnos (S. toxifera etc.). It sometimes has little effect when taken internally but is quickly fatal when introduced into the blood and used by the Indians as an arrow poison.", "details": []}, {"x": -0.5485260096806724, "y": 0.3992106575572045, "z": 0.734676845692406, "word": "Curcuma", "pos_group": "noun", "row_number": 37478, "definition": "A genus of plants of the order Scitamineae including the turmeric plant (Curcuma longa).", "details": []}, {"x": -0.4523697787029607, "y": 0.2835754578373362, "z": 0.8455451159036869, "word": "Curd", "pos_group": "noun", "row_number": 37482, "definition": "The edible flower head of certain brassicaceous plants as the broccoli and cauliflower.", "details": []}, {"x": -0.433333016233009, "y": 0.4564952181911978, "z": 0.7770679589398688, "word": "Cutgrass", "pos_group": "other", "row_number": 37843, "definition": "A grass with leaves having edges furnished with very minute hooked prickles which form a cutting edge; one or more species of Leersia.", "details": []}, {"x": -0.5576901676620278, "y": 0.3170964068885623, "z": 0.7670929185121335, "word": "Cuticle", "pos_group": "noun", "row_number": 37845, "definition": "The outermost skin or pellicle of a plant found especially in leaves and young stems.", "details": []}, {"x": -0.3932320944295259, "y": 0.3496580289122598, "z": 0.8503574440949886, "word": "Cyanin", "pos_group": "noun", "row_number": 37913, "definition": "The blue coloring matter of flowers; -- called also anthokyan and anthocyanin.", "details": []}, {"x": -0.511393102605209, "y": 0.4411721829724703, "z": 0.7374579307181687, "word": "Cycad", "pos_group": "noun", "row_number": 37933, "definition": "Any plant of the natural order Cycadaceae as the sago palm etc.", "details": []}, {"x": -0.5016801932725097, "y": 0.2735191682857352, "z": 0.8206730458948539, "word": "Cyclamen", "pos_group": "noun", "row_number": 37936, "definition": "A genus of plants of the Primrose family having depressed rounded corms and pretty nodding flowers with the petals so reflexed as to point upwards whence it is called rabbits' ears. It is also called sow bread because hogs are said to eat the corms.", "details": []}, {"x": -0.3976953163277678, "y": 0.4292808358724012, "z": 0.8108985135783944, "word": "Cydonin", "pos_group": "noun", "row_number": 37992, "definition": "A peculiar mucilaginous substance extracted from the seeds of the quince (Cydonia vulgaris) and regarded as a variety of amylose.", "details": []}, {"x": -0.5608549817468633, "y": 0.3672835765950582, "z": 0.7419868353368997, "word": "Cyme", "pos_group": "noun", "row_number": 38022, "definition": "A flattish or convex flower cluster of the centrifugal or determinate type differing from a corymb chiefly in the order of the opening of the blossoms.", "details": []}, {"x": -0.4241916607835537, "y": 0.302807605797157, "z": 0.8534453636836304, "word": "Cymule", "pos_group": "noun", "row_number": 38038, "definition": "A small cyme or one of very few flowers.", "details": []}, {"x": -0.462487088102698, "y": 0.460017031395092, "z": 0.7579512017041297, "word": "Cyperaceous", "pos_group": "adjective", "row_number": 38061, "definition": "Of pertaining to or resembling a large family of plants of which the sedge is the type.", "details": []}, {"x": -0.5427978666981259, "y": 0.2925789998592004, "z": 0.7872534564861267, "word": "Cyperus", "pos_group": "noun", "row_number": 38062, "definition": "A large genus of plants belonging to the Sedge family and including the species called galingale several bulrushes and the Egyptian papyrus.", "details": []}, {"x": -0.3859347523225498, "y": 0.3822470811310357, "z": 0.83960796561046, "word": "Cypripedium", "pos_group": "noun", "row_number": 38080, "definition": "A genus of orchidaceous plants including the lady's slipper.", "details": []}, {"x": -0.5369888510411851, "y": 0.4175647160462724, "z": 0.732995690144672, "word": "Cyrenian", "pos_group": "adjective", "row_number": 38089, "definition": "Pertaining to Cyrene in Africa; Cyrenaic.", "details": []}, {"x": -0.4711322731447636, "y": 0.2756623472270551, "z": 0.8378810485520711, "word": "Cystocarp", "pos_group": "noun", "row_number": 38112, "definition": "A minute vesicle in a red seaweed which contains the reproductive spores.", "details": []}, {"x": -0.4170632601088319, "y": 0.4496903146859475, "z": 0.7898334368365563, "word": "Cystolith", "pos_group": "noun", "row_number": 38117, "definition": "A concretion of mineral matter within a leaf or other part of a plant.", "details": []}, {"x": -0.5627764249748272, "y": 0.3349557527781139, "z": 0.7557032083916276, "word": "Cytogenesis", "pos_group": "noun", "row_number": 38130, "definition": "Development of cells in animal and vegetable organisms. See Gemmation Budding Karyokinesis; also Cell development under Cell.", "details": []}, {"x": -0.4018811408688839, "y": 0.3300137110039101, "z": 0.8541560157040119, "word": "Daffodil", "pos_group": "noun", "row_number": 38230, "definition": "A plant of the genus Asphodelus.", "details": []}, {"x": -0.4934027393739241, "y": 0.4521729927387707, "z": 0.7430298253878987, "word": "Daffodil", "pos_group": "noun", "row_number": 38231, "definition": "A plant of the genus Narcissus (N. Pseudo-narcissus). It has a bulbous root and beautiful flowers usually of a yellow hue. Called also daffodilly daffadilly daffadowndilly daffydowndilly etc.", "details": []}, {"x": -0.5194312283362159, "y": 0.2768503224471035, "z": 0.808421361661148, "word": "Dahlia", "pos_group": "noun", "row_number": 38276, "definition": "A genus of plants native to Mexico and Central America of the order Compositae; also any plant or flower of the genus. The numerous varieties of cultivated dahlias bear conspicuous flowers which differ in color.", "details": []}, {"x": -0.3893791650804634, "y": 0.4132465107320842, "z": 0.8231714202819476, "word": "Dahlin", "pos_group": "noun", "row_number": 38277, "definition": "A variety of starch extracted from the dahlia; -- called also inulin. See Inulin.", "details": []}, {"x": -0.5552178613857184, "y": 0.3875035467691112, "z": 0.7359172016196036, "word": "Daisied", "pos_group": "adjective", "row_number": 38314, "definition": "Full of daisies; adorned with daisies.", "details": []}, {"x": -0.4407004586082671, "y": 0.2889207424837535, "z": 0.8498869985739868, "word": "Daisy", "pos_group": "noun", "row_number": 38316, "definition": "A genus of low herbs (Bellis) belonging to the family Compositae. The common English and classical daisy is B. prennis which has a yellow disk and white or pinkish rays.", "details": []}, {"x": -0.4436356230224643, "y": 0.4601588372117997, "z": 0.7690521949265565, "word": "Daisy", "pos_group": "noun", "row_number": 38317, "definition": "The whiteweed (Chrysanthemum Leucanthemum) the plant commonly called daisy in North America; -- called also oxeye daisy. See Whiteweed.", "details": []}, {"x": -0.5539501903585299, "y": 0.3061688604080544, "z": 0.7742091548917396, "word": "Damewort", "pos_group": "noun", "row_number": 38396, "definition": "A cruciferrous plant (Hesperis matronalis) remarkable for its fragrance especially toward the close of the day; -- called also rocket and dame's violet.", "details": []}, {"x": -0.3882175897783632, "y": 0.3619476118598898, "z": 0.8475146189037692, "word": "Damson", "pos_group": "noun", "row_number": 38454, "definition": "A small oval plum of a blue color the fruit of a variety of the Prunus domestica; -- called also damask plum.", "details": []}, {"x": -0.5223189992773157, "y": 0.4338070018715977, "z": 0.7341623445268212, "word": "Dandelion", "pos_group": "noun", "row_number": 38473, "definition": "A well-known plant of the genus Taraxacum (T. officinale formerly called T. Dens-leonis and Leontodos Taraxacum) bearing large yellow compound flowers and deeply notched leaves.", "details": []}, {"x": -0.4903575794826976, "y": 0.2719151430379705, "z": 0.8280166660342713, "word": "Danewort", "pos_group": "noun", "row_number": 38507, "definition": "A fetid European species of elder (Sambucus Ebulus); dwarf elder; wallwort; elderwort; -- called also Daneweed Dane's weed and Dane's-blood. [Said to grow on spots where battles were fought against the Danes.]", "details": []}, {"x": -0.4032471242115951, "y": 0.4388529476542875, "z": 0.802994300820511, "word": "Dangleberry", "pos_group": "noun", "row_number": 38527, "definition": "A dark blue edible berry with a white bloom and its shrub (Gaylussacia frondosa) closely allied to the common huckleberry. The bush is also called blue tangle and is found from New England to Kentucky and southward.", "details": []}, {"x": -0.5637790256335403, "y": 0.3545941130419767, "z": 0.7459331238466822, "word": "Daphne", "pos_group": "noun", "row_number": 38547, "definition": "A genus of diminutive Shrubs mostly evergreen and with fragrant blossoms.", "details": []}, {"x": -0.4140990917167614, "y": 0.3117817908316033, "z": 0.8551690225593954, "word": "Daphnia", "pos_group": "noun", "row_number": 38550, "definition": "A genus of the genus Daphnia.", "details": []}, {"x": -0.4742350482058423, "y": 0.4593086851637119, "z": 0.7510903080098855, "word": "Daphnin", "pos_group": "noun", "row_number": 38551, "definition": "A dark green bitter resin extracted from the mezereon (Daphne mezereum) and regarded as the essential principle of the plant.", "details": []}, {"x": -0.535346260550252, "y": 0.2844703903816145, "z": 0.7952867271060127, "word": "Darlingtonia", "pos_group": "noun", "row_number": 38628, "definition": "A genus of California pitcher plants consisting of a single species. The long tubular leaves are hooded at the top and frequently contain many insects drowned in the secretion of the leaves.", "details": []}, {"x": -0.3849508049652312, "y": 0.3947536697734691, "z": 0.8342556070875398, "word": "Darnel", "pos_group": "noun", "row_number": 38634, "definition": "Any grass of the genus Lolium esp. the Lolium temulentum (bearded darnel) the grains of which have been reputed poisonous. Other species as Lolium perenne (rye grass or ray grass) and its variety L. Italicum (Italian rye grass) are highly esteemed for pasture and for making hay.", "details": []}, {"x": -0.5456825448722448, "y": 0.407057034698667, "z": 0.7324855839701412, "word": "Datura", "pos_group": "noun", "row_number": 38745, "definition": "A genus of solanaceous plants with large funnel-shaped flowers and a four-celled capsular fruit.", "details": []}, {"x": -0.4590686323029019, "y": 0.2784787503877583, "z": 0.8436264436455365, "word": "Davyne", "pos_group": "noun", "row_number": 38796, "definition": "A variety of nephelite from Vesuvius.", "details": []}, {"x": -0.4259435359156616, "y": 0.4558850507332144, "z": 0.7814991520978368, "word": "Dayflower", "pos_group": "noun", "row_number": 38831, "definition": "A genus consisting mostly of tropical perennial herbs (Commelina) having ephemeral flowers.", "details": []}, {"x": -0.5615302983892427, "y": 0.3228249579867369, "z": 0.7618843550643032, "word": "Day lily", "pos_group": "other", "row_number": 38837, "definition": "A genus of plants (Hemerocallis) closely resembling true lilies but having tuberous rootstocks instead of bulbs. The common species have long narrow leaves and either yellow or tawny-orange flowers.", "details": []}, {"x": -0.3946104889876521, "y": 0.34154479904054, "z": 0.8530121407279518, "word": "Day lily", "pos_group": "other", "row_number": 38838, "definition": "A genus of plants (Funkia) differing from the last in having ovate veiny leaves and large white or blue flowers.", "details": []}, {"x": -0.5051612708921526, "y": 0.4471319139162916, "z": 0.7381633572239815, "word": "Decagynia", "pos_group": "other", "row_number": 39163, "definition": "A Linnaean order of plants characterized by having ten styles.", "details": []}, {"x": -0.5091388227409385, "y": 0.2725759969419641, "z": 0.8163822542590362, "word": "Decandria", "pos_group": "other", "row_number": 39190, "definition": "A Linnaean class of plants characterized by having ten stamens.", "details": []}, {"x": -0.392577060862402, "y": 0.4244323825422852, "z": 0.8159291660028566, "word": "Decandrous", "pos_group": "adjective", "row_number": 39192, "definition": "Belonging to the Decandria; having ten stamens.", "details": []}, {"x": -0.5605842439335585, "y": 0.3751061991885513, "z": 0.7382686806195692, "word": "Decemlocular", "pos_group": "adjective", "row_number": 39271, "definition": "Having ten cells for seeds.", "details": []}, {"x": -0.4293604818198798, "y": 0.2958481593160377, "z": 0.8533014961200484, "word": "Deerberry", "pos_group": "noun", "row_number": 39769, "definition": "A shrub of the blueberry group (Vaccinium stamineum); also its bitter greenish white berry; -- called also squaw huckleberry.", "details": []}, {"x": -0.4547791675818977, "y": 0.4621785418446577, "z": 0.7612929161576785, "word": "Deergrass", "pos_group": "noun", "row_number": 39770, "definition": "An American genus (Rhexia) of perennial herbs with opposite leaves and showy flowers (usually bright purple) with four petals and eight stamens -- the only genus of the order Melastomaceae inhabiting a temperate clime.", "details": []}, {"x": -0.5486395149656501, "y": 0.2960836794059549, "z": 0.781875397622721, "word": "Deer's-tongue", "pos_group": "noun", "row_number": 39777, "definition": "A plant (Liatris odoratissima) whose fleshy leaves give out a fragrance compared to vanilla.", "details": []}, {"x": -0.3846794117411385, "y": 0.3746397660124224, "z": 0.8436034589216956, "word": "Deflorate", "pos_group": "adjective", "row_number": 40023, "definition": "Past the flowering state; having shed its pollen.", "details": []}, {"x": -0.5326385711579285, "y": 0.4250044839597273, "z": 0.7318929847518462, "word": "Defloration", "pos_group": "noun", "row_number": 40025, "definition": "That which is chosen as the flower or choicest part; careful culling or selection.", "details": []}, {"x": -0.4784519628182536, "y": 0.2720294435842345, "z": 0.8349153855922241, "word": "Degrade", "pos_group": "other", "row_number": 40139, "definition": "To degenerate; to pass from a higher to a lower type of structure; as a family of plants or animals degrades through this or that genus or group of genera.", "details": []}, {"x": -0.410266411005747, "y": 0.4473280612259148, "z": 0.7947194961999661, "word": "Dehiscent", "pos_group": "adjective", "row_number": 40163, "definition": "Characterized by dehiscence; opening in some definite way as the capsule of a plant.", "details": []}, hite flowers much cultivated.", "details": []}, {"x": -0.5586381842388635, "y": 0.3111996340649317, "z": 0.7688160813017363, "word": "Dewberry", "pos_group": "noun", "row_number": 42413, "definition": "The fruit of certain species of bramble (Rubus); in England the fruit of R. caesius which has a glaucous bloom; in America that of R. canadensis and R. hispidus species of low blackberries.", "details": []}, {"x": -0.3886401270498773, "y": 0.3538323010943518, "z": 0.8507417671355575, "word": "Dewberry", "pos_group": "noun", "row_number": 42414, "definition": "The plant which bears the fruit.", "details": []}, {"x": -0.5166486509852851, "y": 0.4404685657806832, "z": 0.7342081544045892, "word": "Diadelphia", "pos_group": "other", "row_number": 42510, "definition": "A Linnaean class of plants whose stamens are united into two bodies or bundles by their filaments.", "details": []}, {"x": -0.4979449946574604, "y": 0.2699386810247819, "z": 0.8241261376647283, "word": "Diadelphous", "pos_group": "adjective", "row_number": 42512, "definition": "Of or pertaining to the class Diadelphia; having the stamens united into two bodies by their filaments (said of a plant or flower); grouped into two bundles or sets by coalescence of the filaments (said of stamens).", "details": []}, {"x": -0.3973768127482069, "y": 0.4348264055820401, "z": 0.8080950845653496, "word": "Diaheliotropism", "pos_group": "noun", "row_number": 42554, "definition": "A tendency of leaves or other organs of plants to have their dorsal surface faced towards the rays of light.", "details": []}, {"x": -0.5644890631370408, "y": 0.3622387825140194, "z": 0.7417109693414455, "word": "Dialypetalous", "pos_group": "adjective", "row_number": 42596, "definition": "Having separate petals; polypetalous.", "details": []}, {"x": -0.4185740169057672, "y": 0.3042620664368906, "z": 0.8556987713552728, "word": "Diandria", "pos_group": "other", "row_number": 42648, "definition": "A Linnaean class of plants having two stamens.", "details": []}, {"x": -0.4665690406002836, "y": 0.4624751114181873, "z": 0.753943036092294, "word": "Diandrous", "pos_group": "noun", "row_number": 42650, "definition": "Of or pertaining to the class Diandria; having two stamens.", "details": []}, {"x": -0.5418209721918074, "y": 0.2870535067796564, "z": 0.7899558964515845, "word": "Dianthus", "pos_group": "noun", "row_number": 42654, "definition": "A genus of plants containing some of the most popular of cultivated flowers including the pink carnation and Sweet William.", "details": []}, {"x": -0.3827196218153872, "y": 0.3874999665773297, "z": 0.8386712508367359, "word": "Diatom", "pos_group": "noun", "row_number": 42745, "definition": "One of the Diatomaceae a family of minute unicellular Algae having a siliceous covering of great delicacy each individual multiplying by spontaneous division. By some authors diatoms are called Bacillariae but this word is not in general use.", "details": []}, {"x": -0.5421383082537297, "y": 0.4148979030216818, "z": 0.7307159398781411, "word": "Dicentra", "pos_group": "noun", "row_number": 42791, "definition": "A genus of herbaceous plants with racemes of two-spurred or heart-shaped flowers including the Dutchman's breeches and the more showy Bleeding heart (D. spectabilis).", "details": []}, {"x": -0.4661762855696029, "y": 0.2739001237368401, "z": 0.8412243416529696, "word": "Dichogamy", "pos_group": "noun", "row_number": 42799, "definition": "The condition of certain species of plants in which the stamens and pistil do not mature simultaneously so that these plants can never fertilize themselves.", "details": []}, {"x": -0.4186526223410012, "y": 0.4545166217726387, "z": 0.7862217386586248, "word": "Diclinous", "pos_group": "adjective", "row_number": 42838, "definition": "Having the stamens and pistils in separate flowers.", "details": []}, {"x": -0.5648162954877365, "y": 0.3291534435832563, "z": 0.7567301784181689, "word": "Dicotyledon", "pos_group": "noun", "row_number": 42840, "definition": "A plant whose seeds divide into two seed lobes or cotyledons in germinating.", "details": []}, {"x": -0.3967076058358786, "y": 0.3333057607544807, "z": 0.8552954725238772, "word": "Dicotyledonous", "pos_group": "adjective", "row_number": 42841, "definition": "Having two cotyledons or seed lobes; as a dicotyledonous plant.", "details": []}, {"x": -0.4984242833822644, "y": 0.4526770808361819, "z": 0.7393623565076255, "word": "Dictamnus", "pos_group": "noun", "row_number": 42849, "definition": "A suffrutescent D. Fraxinella (the only species) with strong perfume and showy flowers. The volatile oil of the leaves is highly inflammable.", "details": []}, {"x": -0.516623467087807, "y": 0.2723701856460171, "z": 0.8117355944057938, "word": "Dictyogen", "pos_group": "noun", "row_number": 42880, "definition": "A plant with net-veined leaves and monocotyledonous embryos belonging to the class Dictyogenae proposed by Lindley for the orders Dioscoreaceae Smilaceae Trilliaceae etc.", "details": []}, {"x": -0.3879260983684847, "y": 0.4189115931151916, "z": 0.8209911201458253, "word": "Didine", "pos_group": "adjective", "row_number": 42912, "definition": "Like or pertaining to the genus Didus or the dodo.", "details": []}, {"x": -0.5595986428735591, "y": 0.3831826588613435, "z": 0.734860809161859, "word": "Didynamia", "pos_group": "other", "row_number": 42924, "definition": "A Linnaean class of plants having four stamens disposed in pairs of unequal length.", "details": []}, {"x": -0.4351161139653209, "y": 0.2891872811047871, "z": 0.8526691526113388, "word": "Difference", "pos_group": "noun", "row_number": 43002, "definition": "The quality or attribute which is added to those of the genus to constitute a species; a differentia.", "details": []}, {"x": -0.4469214183558878, "y": 0.4636459906367733, "z": 0.7650448622016924, "word": "Difform", "pos_group": "adjective", "row_number": 43058, "definition": "Irregular in form; -- opposed to uniform; anomalous; hence unlike; dissimilar; as to difform corolla the parts of which do not correspond in size or proportion; difform leaves.", "details": []}, {"x": -0.554115200609983, "y": 0.30031326099992, "z": 0.7763815361795723, "word": "Digitalis", "pos_group": "noun", "row_number": 43162, "definition": "A genus of plants including the foxglove.", "details": []}, {"x": -0.3841138526764233, "y": 0.366658129482649, "z": 0.8473596428119289, "word": "Digitalis", "pos_group": "noun", "row_number": 43163, "definition": "The dried leaves of the purple foxglove (Digitalis purpurea) used in heart disease disturbance of the circulation etc.", "details": []}, {"x": -0.5276375340493233, "y": 0.4322711065607305, "z": 0.7312594088933905, "word": "Digitigrade", "pos_group": "adjective", "row_number": 43169, "definition": "Walking on the toes; -- distinguished from plantigrade.", "details": []}, {"x": -0.4860413283367769, "y": 0.2690265575221296, "z": 0.8314977681848665, "word": "Digynia", "pos_group": "noun", "row_number": 43214, "definition": "A Linnaean order of plants having two styles.", "details": []}, {"x": -0.4037232359195296, "y": 0.4442102035370955, "z": 0.7998030031527738, "word": "Dildo", "pos_group": "noun", "row_number": 43288, "definition": "A columnar cactaceous plant of the West Indies (Cereus Swartzii).", "details": []}, {"x": -0.5668220020660386, "y": 0.3491353090259476, "z": 0.7462019525337653, "word": "Dill", "pos_group": "noun", "row_number": 43308, "definition": "An herb (Peucedanum graveolens) the seeds of which are moderately warming pungent and aromatic and were formerly used as a soothing medicine for children; -- called also dillseed.", "details": []}, {"x": -0.4085591015813518, "y": 0.3140356875599332, "z": 0.8570070288240339, "word": "Dimidiate", "pos_group": "adjective", "row_number": 43370, "definition": "Consisting of only one half of what the normal condition requires; having the appearance of lacking one half; as a dimidiate leaf which has only one side developed.", "details": []}, {"x": -0.4787938838708559, "y": 0.4610014156816528, "z": 0.7471506618529983, "word": "Dimorphism", "pos_group": "noun", "row_number": 43418, "definition": "Difference of form between members of the same species as when a plant has two kinds of flowers both hermaphrodite (as in the partridge berry) or when there are two forms of one or both sexes of the same species of butterfly.", "details": []}, {"x": -0.5335882445366559, "y": 0.2792747867379744, "z": 0.7983039388508295, "word": "Dioecia", "pos_group": "other", "row_number": 43512, "definition": "A Linnaean class of plants having the stamens and pistils on different plants.", "details": []}, {"x": -0.382411514603386, "y": 0.4002854791997657, "z": 0.8327862682828999, "word": "Dioecious", "pos_group": "adjective", "row_number": 43515, "definition": "Having the sexes in two separate individuals; -- applied to plants in which the female flowers occur on one individual and the male flowers on another of the same species and to animals in which the ovum is produced by one individual and the sperm cell by another; -- opposed to monoecious.", "details": []}, {"x": -0.5506162774859191, "y": 0.4036488583275626, "z": 0.7306772982229602, "word": "Dioscorea", "pos_group": "noun", "row_number": 43544, "definition": "A genus of plants. See Yam.", "details": []}, {"x": -0.453755194001267, "y": 0.2775316529166791, "z": 0.8468071832159954, "word": "Diphyllous", "pos_group": "adjective", "row_number": 43588, "definition": "Having two leaves as a calyx etc.", "details": []}, {"x": -0.428276346841804, "y": 0.4602502887097213, "z": 0.7776561209676528, "word": "Diplostemonous", "pos_group": "adjective", "row_number": 43625, "definition": "Having twice as many stamens as petals as the geranium.", "details": []}, {"x": -0.5628309154271866, "y": 0.3168878509428675, "z": 0.7634156473142308, "word": "Diptych", "pos_group": "noun", "row_number": 43663, "definition": "Anything consisting of two leaves.", "details": []}, {"x": -0.3897843835806621, "y": 0.3454971068241598, "z": 0.8536391998337344, "word": "Disc", "pos_group": "noun", "row_number": 43985, "definition": "A circular structure either in plants or animals; as a blood disc a germinal disc etc. Same as Disk.", "details": []}, {"x": -0.5104098116684235, "y": 0.4467967463098244, "z": 0.7347479102655269, "word": "Disciflorous", "pos_group": "adjective", "row_number": 44064, "definition": "Bearing the stamens on a discoid outgrowth of the receptacle; -- said of a subclass of plants. Cf. Calycifloral.", "details": []}, {"x": -0.5056488261489942, "y": 0.2686740075804255, "z": 0.8198375096717749, "word": "Disk", "pos_group": "noun", "row_number": 44868, "definition": "The central part of a radiate compound flower as in sunflower.", "details": []}, {"x": -0.3919038615698292, "y": 0.4300839957271422, "z": 0.8132890752407976, "word": "Disporous", "pos_group": "adjective", "row_number": 45230, "definition": "Having two spores.", "details": []}, {"x": -0.5644968977837576, "y": 0.3702270762996332, "z": 0.7377500690390613, "word": "Dittander", "pos_group": "noun", "row_number": 46021, "definition": "A kind of peppergrass (Lepidium latifolium).", "details": []}, {"x": -0.4236870682073656, "y": 0.2969520646864078, "z": 0.8557503955665614, "word": "Dittany", "pos_group": "noun", "row_number": 46022, "definition": "A plant of the Mint family (Origanum Dictamnus) a native of Crete.", "details": []}, {"x": -0.4586648593777893, "y": 0.464988642404069, "z": 0.7572397963704585, "word": "Dittany", "pos_group": "noun", "row_number": 46024, "definition": "In America the Cunila Mariana a fragrant herb of the Mint family.", "details": []}, {"x": -0.5480086505856726, "y": 0.2903897293251959, "z": 0.784449057610314, "word": "Diurnal", "pos_group": "adjective", "row_number": 46045, "definition": "Opening during the day and closing at night; -- said of flowers or leaves.", "details": []}, {"x": -0.3811502335158193, "y": 0.3797891513707496, "z": 0.8429025447772255, "word": "Divide", "pos_group": "other", "row_number": 46181, "definition": "To separate into species; -- said of a genus or generic term.", "details": []}, {"x": -0.5379055975589243, "y": 0.4226594930170341, "z": 0.729394626438501, "word": "Division", "pos_group": "noun", "row_number": 46258, "definition": "The separation of a genus into its constituent species.", "details": []}, {"x": -0.4736372440056824, "y": 0.2698959405904348, "z": 0.8383459562397291, "word": "Dock", "pos_group": "noun", "row_number": 46373, "definition": "A genus of plants (Rumex) some species of which are well-known weeds which have a long taproot and are difficult of extermination.", "details": []}, {"x": -0.4115297983814051, "y": 0.4523806065650373, "z": 0.7911984655243014, "word": "Dodder", "pos_group": "noun", "row_number": 46442, "definition": "A plant of the genus Cuscuta. It is a leafless parasitical vine with yellowish threadlike stems. It attaches itself to some other plant as to flax goldenrod etc. and decaying at the root is nourished by the plant that supports it.", "details": []}, {"x": -0.5675011534835316, "y": 0.3360392430064733, "z": 0.7516781678048775, "word": "Dodecagynia", "pos_group": "other", "row_number": 46446, "definition": "A Linnaean order of plants having twelve styles.", "details": []}, {"x": -0.3995232198240067, "y": 0.3250130805358941, "z": 0.857174249672741, "word": "Dodecandria", "pos_group": "other", "row_number": 46451, "definition": "A Linnaean class of plants including all that have any number of stamens between twelve and nineteen.", "details": []}, {"x": -0.4912294826928751, "y": 0.4577439052183157, "z": 0.7410560792333978, "word": "Dodecandrous", "pos_group": "adjective", "row_number": 46453, "definition": "Of or pertaining to the Dodecandria; having twelve stamens or from twelve to nineteen.", "details": []}, {"x": -0.5240645481703259, "y": 0.2729235958753445, "z": 0.8067645630327994, "word": "Dogbane", "pos_group": "noun", "row_number": 46507, "definition": "A small genus of perennial herbaceous plants with poisonous milky juice bearing slender pods pods in pairs.", "details": []}, {"x": -0.3837976681347193, "y": 0.4127500203124176, "z": 0.8260367852986031, "word": "Dog-rose", "pos_group": "noun", "row_number": 46565, "definition": "A common European wild rose with single pink or white flowers.", "details": []}, {"x": -0.5578863185148912, "y": 0.3914445692288077, "z": 0.731801889062316, "word": "Dog's-tail grass", "pos_group": "noun", "row_number": 46574, "definition": "A hardy species of British grass (Cynosurus cristatus) which abounds in grass lands and is well suited for making straw plait; -- called also goldseed.", "details": []}, {"x": -0.4414207978480752, "y": 0.282894245138935, "z": 0.8515389159013466, "word": "Doob grass", "pos_group": "other", "row_number": 46831, "definition": "A perennial creeping grass (Cynodon dactylon) highly prized in Hindostan as food for cattle and acclimated in the United States.", "details": []}, {"x": -0.4389813750892866, "y": 0.464385632819052, "z": 0.7691822517166964, "word": "Dorsal", "pos_group": "adjective", "row_number": 46927, "definition": "Pertaining to the surface naturally superior as of a creeping hepatic moss.", "details": []}, {"x": -0.5591631123894404, "y": 0.3052482165297953, "z": 0.7708178384341746, "word": "Dorsiferous", "pos_group": "other", "row_number": 46940, "definition": "Bearing or producing on the back; -- applied to ferns which produce seeds on the back of the leaf and to certain Batrachia the ova of which become attached to the skin of the back of the parent where they develop; dorsiparous.", "details": []}, {"x": -0.3842616681683306, "y": 0.3583647132465037, "z": 0.8508335340571874, "word": "Dorsiventral", "pos_group": "adjective", "row_number": 46943, "definition": "Having distinct upper and lower surfaces as most common leaves. The leaves of the iris are not dorsiventral.", "details": []}, {"x": -0.5220127721031198, "y": 0.4392919008862902, "z": 0.7311123659034403, "word": "Double", "pos_group": "adjective", "row_number": 47023, "definition": "Having the petals in a flower considerably increased beyond the natural number usually as the result of cultivation and the expense of the stamens or stamens and pistils. The white water lily and some other plants have their blossoms naturally double.", "details": []}, {"x": -0.4938369161131607, "y": 0.2666983052623367, "z": 0.8276455245176166, "word": "Doughbird", "pos_group": "noun", "row_number": 47153, "definition": "The Eskimo curlew (Numenius borealis). See Curlew.", "details": []}, {"x": -0.3975002567205719, "y": 0.4403436500247069, "z": 0.8050410025520426, "word": "Dove plant", "pos_group": "other", "row_number": 47188, "definition": "A Central American orchid (Peristeria elata) having a flower stem five or six feet high with numerous globose white fragrant flowers. The column in the center of the flower resembles a dove; -- called also Holy Spirit plant.", "details": []}, {"x": -0.5678446811192345, "y": 0.35689632071839, "z": 0.7417394652991512, "word": "Dove's-foot", "pos_group": "noun", "row_number": 47190, "definition": "A small annual species of Geranium native in England; -- so called from the shape of the leaf.", "details": []}, {"x": -0.4129259272855707, "y": 0.3061842424299367, "z": 0.8577548532436045, "word": "Down", "pos_group": "noun", "row_number": 47231, "definition": "The pubescence of plants; the hairy crown or envelope of the seeds of certain plants as of the thistle.", "details": []}, {"x": -0.4709747745175611, "y": 0.464541429298444, "z": 0.7499226775031483, "word": "Downweed", "pos_group": "noun", "row_number": 47295, "definition": "Cudweed a species of Gnaphalium.", "details": []}, {"x": -0.5403976441735645, "y": 0.281638752916536, "z": 0.7928745165707369, "word": "Dracaena", "pos_group": "noun", "row_number": 47358, "definition": "A genus of liliaceous plants with woody stems and funnel-shaped flowers.", "details": []}, {"x": -0.3798398303253476, "y": 0.3929815322362593, "z": 0.8374289334741505, "word": "Drank", "pos_group": "noun", "row_number": 47523, "definition": "Wild oats or darnel grass. See Drake a plant.", "details": []}, {"x": -0.5472400179485285, "y": 0.4117836611859616, "z": 0.7286717910938911, "word": "Dropwort", "pos_group": "noun", "row_number": 48132, "definition": "An Old World species of Spiraea (S. filipendula) with finely cut leaves.", "details": []}, {"x": -0.4609561718693565, "y": 0.2725696141644061, "z": 0.84452662068748, "word": "Drosera", "pos_group": "noun", "row_number": 48133, "definition": "A genus of low perennial or biennial plants the leaves of which are beset with gland-tipped bristles. See Sundew.", "details": []}, {"x": -0.4206797880350589, "y": 0.4591539233858354, "z": 0.7824360616549906, "word": "Duboisine", "pos_group": "noun", "row_number": 48384, "definition": "An alkaloid obtained from the leaves of an Australian tree (Duboisia myoporoides) and regarded as identical with hyoscyamine. It produces dilation of the pupil of the eye.", "details": []}, {"x": -0.5664751259803968, "y": 0.3231988594325298, "z": 0.7580556898454134, "word": "Duck's-foot", "pos_group": "noun", "row_number": 48416, "definition": "The May apple (Podophyllum peltatum).", "details": []}, {"x": -0.3916590263304257, "y": 0.3370117113909332, "z": 0.8561695588370667, "word": "Duckweed", "pos_group": "noun", "row_number": 48417, "definition": "A genus (Lemna) of small plants seen floating in great quantity on the surface of stagnant pools fresh water and supposed to furnish food for ducks; -- called also duckmeat.", "details": []}, {"x": -0.5036429674232272, "y": 0.4527234572743771, "z": 0.7357888505533778, "word": "Dulcamara", "pos_group": "noun", "row_number": 48495, "definition": "A plant (Solanum Dulcamara). See Bittersweet n. 3 (a).", "details": []}, {"x": -0.5134007112501824, "y": 0.2681518195242236, "z": 0.8151774723173202, "word": "Dulse", "pos_group": "noun", "row_number": 48549, "definition": "A seaweed of a reddish brown color which is sometimes eaten as in Scotland. The true dulse is Sarcophyllis edulis; the common is Rhodymenia. [Written also dillisk.]", "details": []}, {"x": -0.3868885754438652, "y": 0.424648552922607, "z": 0.8185296797867212, "word": "Durra", "pos_group": "noun", "row_number": 48736, "definition": "A kind of millet cultivated throughout Asia and introduced into the south of Europe; a variety of Sorghum vulgare; -- called also Indian millet and Guinea corn.", "details": []}, {"x": -0.5637819857785022, "y": 0.3784946244735283, "z": 0.7340924272571481, "word": "Dwale", "pos_group": "adjective", "row_number": 48811, "definition": "The deadly nightshade (Atropa Belladonna) having stupefying qualities.", "details": []}, {"x": -0.4294082227377511, "y": 0.2899238570549798, "z": 0.8553085614885247, "word": "Dwale", "pos_group": "adjective", "row_number": 48812, "definition": "The tincture sable or black when blazoned according to the fantastic system in which plants are substituted for the tinctures.", "details": []}, {"x": -0.4505873180283469, "y": 0.4668073917401177, "z": 0.7609611868215156, "word": "Dwarf", "pos_group": "noun", "row_number": 48818, "definition": "An animal or plant which is much below the ordinary size of its species or kind; especially a diminutive human being.", "details": []}, {"x": -0.5538437588386482, "y": 0.2944687351492641, "z": 0.7788101532562798, "word": "Eardrop", "pos_group": "noun", "row_number": 48998, "definition": "A species of primrose. See Auricula.", "details": []}, {"x": -0.3802744474935611, "y": 0.3716783368708521, "z": 0.8469041022951679, "word": "Earth flax", "pos_group": "other", "row_number": 49087, "definition": "A variety of asbestus. See Amianthus.", "details": []}, {"x": -0.5330030606349521, "y": 0.4302679193030649, "z": 0.7285446142635225, "word": "Earthnut", "pos_group": "noun", "row_number": 49098, "definition": "A name given to various roots tubers or pods grown under or on the ground", "details": []}, {"x": -0.4813922000605347, "y": 0.2665180196942422, "z": 0.8350028113121162, "word": "Earthnut", "pos_group": "noun", "row_number": 49099, "definition": "The esculent tubers of the umbelliferous plants Bunium flexuosum and Carum Bulbocastanum.", "details": []}, {"x": -0.4046438590154965, "y": 0.4494744971879416, "z": 0.7963893669171469, "word": "Earthpea", "pos_group": "noun", "row_number": 49101, "definition": "A species of pea (Amphicarpaea monoica). It is a climbing leguminous plant with hairy underground pods.", "details": []}, {"x": -0.5695427538847146, "y": 0.3434342274609591, "z": 0.7467757246360581, "word": "Earth-tongue", "pos_group": "noun", "row_number": 49108, "definition": "A fungus of the genus Geoglossum.", "details": []}, {"x": -0.4030506270188488, "y": 0.3167402298970433, "z": 0.8586185525741223, "word": "Ebracteolate", "pos_group": "adjective", "row_number": 49243, "definition": "Without bracteoles or little bracts; -- said of a pedicel or flower stalk.", "details": []}, {"x": -0.4836288779842209, "y": 0.4622721928976636, "z": 0.7432412314002154, "word": "Ecballium", "pos_group": "noun", "row_number": 49267, "definition": "A genus of cucurbitaceous plants consisting of the single species Ecballium agreste (or Elaterium) the squirting cucumber. Its fruit when ripe bursts and violently ejects its seeds together with a mucilaginous juice from which elaterium a powerful cathartic medicine is prepared.", "details": []}, {"x": -0.5313920858077509, "y": 0.2742514981136343, "z": 0.801503940678594, "word": "Eddoes", "pos_group": "other", "row_number": 49513, "definition": "The tubers of Colocasia antiquorum. See Taro.", "details": []}, {"x": -0.3802429351647712, "y": 0.4059853516694566, "z": 0.8310181733795642, "word": "Edelweiss", "pos_group": "noun", "row_number": 49521, "definition": "A little perennial white woolly plant (Leontopodium alpinum) growing at high elevations in the Alps.", "details": []}, {"x": -0.555441821180829, "y": 0.3998210888643317, "z": 0.7291278901418217, "word": "Eelgrass", "pos_group": "noun", "row_number": 49641, "definition": "A plant (Zostera marina) with very long and narrow leaves growing abundantly in shallow bays along the North Atlantic coast.", "details": []}, {"x": -0.4482313956508564, "y": 0.2770358101739826, "z": 0.849905745264809, "word": "Efflorescence", "pos_group": "noun", "row_number": 49753, "definition": "Flowering or state of flowering; the blooming of flowers; blowth.", "details": []}, {"x": -0.4310280927188876, "y": 0.4643698879571859, "z": 0.7736765412275008, "word": "Effluvia", "pos_group": "other", "row_number": 49769, "definition": "of Effluvium", "details": []}, {"x": -0.5637245763040134, "y": 0.3108624427390245, "z": 0.765231431506304, "word": "Eggplant", "pos_group": "noun", "row_number": 49855, "definition": "A plant (Solanum Melongena) of East Indian origin allied to the tomato and bearing a large smooth edible fruit shaped somewhat like an egg; mad-apple.", "details": []}, {"x": -0.3851403043555784, "y": 0.3498255899120297, "z": 0.8539841934155415, "word": "Eglantine", "pos_group": "noun", "row_number": 49865, "definition": "A species of rose (Rosa Eglanteria) with fragrant foliage and flowers of various colors.", "details": []}, {"x": -0.5157972447590291, "y": 0.4459955530379099, "z": 0.7314650839031233, "word": "Egret", "pos_group": "noun", "row_number": 49905, "definition": "The flying feathery or hairy crown of seeds or achenes as the down of the thistle.", "details": []}, {"x": -0.501772679777878, "y": 0.2650837527277853, "z": 0.8233800956230856, "word": "Egrimony", "pos_group": "other", "row_number": 49908, "definition": "The herb agrimony.", "details": []}, {"x": -0.3916618909640386, "y": 0.4357421247493165, "z": 0.8103886498991855, "word": "Elaeis", "pos_group": "noun", "row_number": 50022, "definition": "A genus of palms.", "details": []}, {"x": -0.5681601561117449, "y": 0.3650272442097742, "z": 0.73752908281077, "word": "Elder", "pos_group": "noun", "row_number": 50114, "definition": "A genus of shrubs (Sambucus) having broad umbels of white flowers and small black or red berries.", "details": []}, {"x": -0.4179510409312858, "y": 0.2985228626473412, "z": 0.8580215777364176, "word": "Elecampane", "pos_group": "noun", "row_number": 50131, "definition": "A large coarse herb (Inula Helenium) with composite yellow flowers. The root which has a pungent taste is used as a tonic and was formerly of much repute as a stomachic.", "details": []}, {"x": -0.4628927394955056, "y": 0.4674312146145948, "z": 0.7531522895977085, "word": "Elecampane", "pos_group": "noun", "row_number": 50132, "definition": "A sweetmeat made from the root of the plant.", "details": []}, {"x": -0.5469363399928142, "y": 0.2847715939736269, "z": 0.7872520430338587, "word": "Eleuthero-petalous", "pos_group": "adjective", "row_number": 50396, "definition": "Having the petals free that is entirely separate from each other; -- said of both plant and flower.", "details": []}, {"x": -0.377930646712777, "y": 0.3851945197047253, "z": 0.8418988111790562, "word": "Emblossom", "pos_group": "other", "row_number": 50832, "definition": "To cover or adorn with blossoms.", "details": []}, {"x": -0.5431578719917005, "y": 0.4198616931686077, "z": 0.7271146296857445, "word": "Embryo", "pos_group": "noun", "row_number": 50966, "definition": "The germ of the plant which is inclosed in the seed and which is developed by germination.", "details": []}, {"x": -0.4685354529924582, "y": 0.2681748083711058, "z": 0.8417581609014982, "word": "Emetine", "pos_group": "noun", "row_number": 51040, "definition": "A white crystalline bitter alkaloid extracted from ipecacuanha root and regarded as its peculiar emetic principle.", "details": []}, {"x": -0.4132318688632347, "y": 0.4572780535140919, "z": 0.7874872724877282, "word": "Emphyteutic", "pos_group": "adjective", "row_number": 51173, "definition": "Of or pertaining to an emphyteusis; as emphyteutic lands.", "details": []}, {"x": -0.5695218515576648, "y": 0.3300920047884113, "z": 0.7527842512786096, "word": "Encarpus", "pos_group": "noun", "row_number": 51409, "definition": "An ornament on a frieze or capital consisting of festoons of fruit flowers leaves etc.", "details": []}, {"x": -0.3942662689353488, "y": 0.3284479749395504, "z": 0.8582983379559275, "word": "Endecagynous", "pos_group": "adjective", "row_number": 51633, "definition": "Having eleven pistils; as an endecagynous flower.", "details": []}, {"x": -0.4963938266928573, "y": 0.4581834048720687, "z": 0.7373338025081038, "word": "Endecaphyllous", "pos_group": "adjective", "row_number": 51635, "definition": "Composed of eleven leaflets; -- said of a leaf.", "details": []}, {"x": -0.5211310401963315, "y": 0.2683965177550487, "z": 0.8101763685771471, "word": "Endive", "pos_group": "noun", "row_number": 51659, "definition": "A composite herb (Cichorium Endivia). Its finely divided and much curled leaves when blanched are used for salad.", "details": []}, {"x": -0.382387875105604, "y": 0.4185494036363106, "z": 0.8237693303880096, "word": "Endochrome", "pos_group": "noun", "row_number": 51678, "definition": "The coloring matter within the cells of plants whether green red yellow or any other color.", "details": []}, {"x": -0.5623300208606445, "y": 0.38697378086117, "z": 0.730777832562591, "word": "Endogen", "pos_group": "noun", "row_number": 51688, "definition": "A plant which increases in size by internal growth and elongation at the summit having the wood in the form of bundles or threads irregularly distributed throughout the whole diameter not forming annual layers and with no distinct pith. The leaves of the endogens have usually parallel veins their flowers are mostly in three or some multiple of three parts and their embryos have but a single cotyledon with the first leaves alternate. The endogens constitute one of the great primary classes of plants", "details": []}, {"x": -0.435701643814748, "y": 0.2832478539079756, "z": 0.8543621777874139, "word": "Endorhiza", "pos_group": "noun", "row_number": 51721, "definition": "Any monocotyledonous plant; -- so named because many monocotyledons have an endorhizal embryo.", "details": []}, {"x": -0.4424035650952511, "y": 0.4678951992975314, "z": 0.7650837653913034, "word": "Endorhizous", "pos_group": "adjective", "row_number": 51723, "definition": "Having the radicle of the embryo sheathed by the cotyledon through which the embryo bursts in germination as in many monocotyledonous plants.", "details": []}, {"x": -0.5592631311939483, "y": 0.2992734184163756, "z": 0.7730848408270061, "word": "Endosporous", "pos_group": "adjective", "row_number": 51745, "definition": "Having the spores contained in a case; -- applied to fungi.", "details": []}, {"x": -0.3801182391951537, "y": 0.3632289113837859, "z": 0.8506320486356752, "word": "Enflower", "pos_group": "other", "row_number": 51866, "definition": "To cover or deck with flowers.", "details": []}, {"x": -0.5274555740815872, "y": 0.437649775297924, "z": 0.7281849295007002, "word": "Enneagynous", "pos_group": "adjective", "row_number": 52197, "definition": "Having or producing nine pistils or styles; -- said of a flower or plant.", "details": []}, {"x": -0.4893784936238039, "y": 0.2638131975845537, "z": 0.8312107354688759, "word": "Enneandria", "pos_group": "noun", "row_number": 52201, "definition": "A Linnaean class of plants having nine stamens.", "details": []}, {"x": -0.3980623135486572, "y": 0.4458026539211064, "z": 0.8017520740785077, "word": "Enneapetalous", "pos_group": "adjective", "row_number": 52204, "definition": "Having nine petals or flower leaves.", "details": []}, {"x": -0.5709042271226401, "y": 0.3512851227490237, "z": 0.7420694886523125, "word": "Eophyte", "pos_group": "noun", "row_number": 52806, "definition": "A fossil plant which is found in the lowest beds of the Silurian age.", "details": []}, {"x": -0.4072766689589757, "y": 0.3085613989704533, "z": 0.8596019881242003, "word": "E ": "noun", "row_number": 60359, "definition": "A flowering; florification.", "details": []}, {"x": -0.5099518734904763, "y": 0.2564188314871441, "z": 0.8210958954850041, "word": "Flourish", "pos_group": "other", "row_number": 60394, "definition": "To grow luxuriantly; to increase and enlarge as a healthy growing plant; a thrive.", "details": []}, {"x": -0.3806080284983422, "y": 0.436268231046065, "z": 0.8153573199662478, "word": "Flower", "pos_group": "noun", "row_number": 60442, "definition": "In the popular sense the bloom or blossom of a plant; the showy portion usually of a different color shape and texture from the foliage.", "details": []}, {"x": -0.5744297853243019, "y": 0.3714882842325845, "z": 0.729401724984392, "word": "Flower", "pos_group": "noun", "row_number": 60443, "definition": "That part of a plant destined to produce seed and hence including one or both of the sexual organs; an organ or combination of the organs of reproduction whether inclosed by a circle of foliar parts or not. A complete flower consists of two essential parts the stamens and the pistil and two floral envelopes the corolla and callyx. In mosses the flowers consist of a few special leaves surrounding or subtending organs called archegonia. See Blossom and Corolla.", "details": []}, {"x": -0.4179151606297319, "y": 0.2870483941111962, "z": 0.8619455539383034, "word": "Flower", "pos_group": "noun", "row_number": 60444, "definition": "The fairest freshest and choicest part of anything; as the flower of an army or of a family; the state or time of freshness and bloom; as the flower of life that is youth.", "details": []}, {"x": -0.4548322756514474, "y": 0.4764583820944629, "z": 0.7524061477404691, "word": "Flower", "pos_group": "other", "row_number": 60452, "definition": "To blossom; to bloom; to expand the petals as a plant; to produce flowers; as this plant flowers in June.", "details": []}, {"x": -0.5570067374706225, "y": 0.2815118997794643, "z": 0.7813415032461094, "word": "Flowerage", "pos_group": "noun", "row_number": 60457, "definition": "State of flowers; flowers collectively or in general.", "details": []}, {"x": -0.3693005227401725, "y": 0.379548823785108, "z": 0.8482687158366601, "word": "Flower-de-luce", "pos_group": "noun", "row_number": 60458, "definition": "A genus of perennial herbs (Iris) with swordlike leaves and large three-petaled flowers often of very gay colors but probably white in the plant first chosen for the royal French emblem.", "details": []}, {"x": -0.5439647629393918, "y": 0.4300158247308861, "z": 0.7205475190168287, "word": "Flowerer", "pos_group": "noun", "row_number": 60459, "definition": "A plant which flowers or blossoms.", "details": []}, {"x": -0.4741281901821912, "y": 0.2574271779014196, "z": 0.8419820112996895, "word": "Floweret", "pos_group": "noun", "row_number": 60460, "definition": "A small flower; a floret.", "details": []}, {"x": -0.4023367032769053, "y": 0.4615421352584101, "z": 0.7906352095482333, "word": "Flowerful", "pos_group": "adjective", "row_number": 60462, "definition": "Abounding with flowers.", "details": []}, {"x": -0.5781435653611134, "y": 0.3331260663941752, "z": 0.7448335664564827, "word": "Flower-gentle", "pos_group": "noun", "row_number": 60463, "definition": "A species of amaranth (Amarantus melancholicus).", "details": []}, {"x": -0.3906053418635443, "y": 0.3182877613493965, "z": 0.8637825929496687, "word": "Flowering", "pos_group": "adjective", "row_number": 60465, "definition": "Having conspicuous flowers; -- used as an epithet with many names of plants; as flowering ash; flowering dogwood; flowering almond etc.", "details": []}, {"x": -0.4913251004717259, "y": 0.4686997305678171, "z": 0.7341118499330357, "word": "Flowering", "pos_group": "noun", "row_number": 60466, "definition": "The act of blossoming or the season when plants blossom; florification.", "details": []}, {"x": -0.530416271530305, "y": 0.261628327233715, "z": 0.8063555030411698, "word": "Flowerlessness", "pos_grou
