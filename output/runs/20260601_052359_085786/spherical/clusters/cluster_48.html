nterpetalary", "pos_group": "adjective", "row_number": 81640, "definition": "Between the petals of a flower.", "details": []}, {"x": -0.5600146732615587, "y": 0.433774676143572, "z": 0.7058492020738487, "word": "Interrupted", "pos_group": "adjective", "row_number": 81740, "definition": "Irregular; -- said of any arrangement whose symmetry is destroyed by local causes as when leaflets are interposed among the leaves in a pinnate leaf.", "details": []}, {"x": -0.4657481856843815, "y": 0.2395560930044282, "z": 0.8518752877247705, "word": "Intextine", "pos_group": "noun", "row_number": 81897, "definition": "A thin membrane existing in the pollen grains of some plants and situated between the extine and the intine as in /nothera.", "details": []}, {"x": -0.3942001048823462, "y": 0.4806982442649963, "z": 0.7832850536498811, "word": "Intine", "pos_group": "noun", "row_number": 81932, "definition": "A transparent extensible membrane of extreme tenuity which forms the innermost coating of grains of pollen.", "details": []}, {"x": -0.5940632172964924, "y": 0.3192977929809955, "z": 0.7383344860243263, "word": "Intrafoliaceous", "pos_group": "adjective", "row_number": 82004, "definition": "Growing immediately above or in front of a leaf; as intrafoliaceous stipules.", "details": []}, {"x": -0.3708078338620168, "y": 0.3160944340213469, "z": 0.8732616212380361, "word": "Involucre", "pos_group": "noun", "row_number": 82488, "definition": "A whorl or set of bracts around a flower umbel or head.", "details": []}, {"x": -0.5001554697035688, "y": 0.4823136868242094, "z": 0.7191787077129307, "word": "Involucre", "pos_group": "noun", "row_number": 82489, "definition": "A continuous marginal covering of sporangia in certain ferns as in the common brake or the cup-shaped processes of the filmy ferns.", "details": []}, {"x": -0.5327268441532765, "y": 0.2403045803681084, "z": 0.8114529057022337, "word": "Involucre", "pos_group": "noun", "row_number": 82490, "definition": "The peridium or volva of certain fungi. Called also involucrum.", "details": []}, {"x": -0.3552387235373609, "y": 0.4309849726133161, "z": 0.8294922559500153, "word": "Involuted", "pos_group": "adjective", "row_number": 82503, "definition": "Rolled inward from the edges; -- said of leaves in vernation or of the petals of flowers in aestivation.", "details": []}, {"x": -0.5844669618488526, "y": 0.3918460261076833, "z": 0.7105315350713075, "word": "Ionidium", "pos_group": "noun", "row_number": 82599, "definition": "A genus of violaceous plants chiefly found in tropical America some species of which are used as substitutes for ipecacuanha.", "details": []}, {"x": -0.4238986004977664, "y": 0.2587762319154569, "z": 0.8679543987397452, "word": "Ipecacuanha", "pos_group": "noun", "row_number": 82607, "definition": "The root of a Brazilian rubiaceous herb (Cephaelis Ipecacuanha) largely employed as an emetic; also the plant itself; also a medicinal extract of the root. Many other plants are used as a substitutes; among them are the black or Peruvian ipecac (Psychotria emetica) the white ipecac (Ionidium Ipecacuanha) the bastard or wild ipecac (Asclepias Curassavica) and the undulated ipecac (Richardsonia scabra).", "details": []}, {"x": -0.4313870612655134, "y": 0.4942360070315023, "z": 0.7547423220717523, "word": "Ipomoea", "pos_group": "noun", "row_number": 82609, "definition": "A genus of twining plants with showy monopetalous flowers including the morning-glory the sweet potato and the cypress vine.", "details": []}, {"x": -0.5809984192868058, "y": 0.2800311731298478, "z": 0.7642142231480346, "word": "Irideous", "pos_group": "adjective", "row_number": 82633, "definition": "Pertaining to or resembling a large natural order of endogenous plants (Iridaceae) which includes the genera Iris Ixia Crocus Gladiolus and many others.", "details": []}, {"x": -0.3527887041750122, "y": 0.360411030869301, "z": 0.863506814700523, "word": "Iris", "pos_group": "noun", "row_number": 82658, "definition": "A genus of plants having showy flowers and bulbous or tuberous roots of which the flower-de-luce (fleur-de-lis) orris and other species of flag are examples. See Illust. of Flower-de-luce.", "details": []}, {"x": -0.5397281548269506, "y": 0.4561653207473649, "z": 0.7075356662632274, "word": "Ironheads", "pos_group": "noun", "row_number": 82702, "definition": "A European composite herb (Centaurea nigra); -- so called from the resemblance of its knobbed head to an iron ball fixed on a long handle.", "details": []}, {"x": -0.4922972628588678, "y": 0.2344710132979599, "z": 0.8382521988666028, "word": "Ironweed", "pos_group": "noun", "row_number": 82721, "definition": "A tall weed with purplish flowers (Vernonia Noveboracensis). The name is also applied to other plants of the same genus.", "details": []}, {"x": -0.3752010469207125, "y": 0.4656918780115309, "z": 0.8014706789045342, "word": "Ironwort", "pos_group": "noun", "row_number": 82725, "definition": "An herb of the Mint family (Sideritis) supposed to heal sword cuts; also a species of Galeopsis.", "details": []}, {"x": -0.5953910933561403, "y": 0.3464200070198324, "z": 0.7249155983206316, "word": "Isatis", "pos_group": "noun", "row_number": 82966, "definition": "A genus of herbs some species of which especially the Isatis tinctoria yield a blue dye similar to indigo; woad.", "details": []}, {"x": -0.3877263549693926, "y": 0.2909968333184886, "z": 0.8746365626137294, "word": "Isosporic", "pos_group": "adjective", "row_number": 83131, "definition": "Producing but one kind of spore as the ferns and Equiseta. Cf. Heterosporic.", "details": []}, {"x": -0.4737353606146274, "y": 0.492094917754792, "z": 0.730354297600304, "word": "Isostemonous", "pos_group": "adjective", "row_number": 83132, "definition": "Having exactly as many stamens as petals.", "details": []}, {"x": -0.5546386898665953, "y": 0.2508855881697101, "z": 0.7933677239160952, "word": "Ita palm", "pos_group": "other", "row_number": 83224, "definition": "A magnificent species of palm (Mauritia flexuosa) growing near the Orinoco. The natives eat its fruit and buds drink its sap and make thread and cord from its fiber.", "details": []}, {"x": -0.3492178354457216, "y": 0.4054856146948796, "z": 0.8447652453090863, "word": "Ivy", "pos_group": "noun", "row_number": 83292, "definition": "A plant of the genus Hedera (H. helix) common in Europe. Its leaves are evergreen dark smooth shining and mostly five-pointed; the flowers yellowish and small; the berries black or yellow. The stem clings to walls and trees by rootlike fibers.", "details": []}, {"x": -0.5712898577758867, "y": 0.4187714363042805, "z": 0.7058741973879319, "word": "Ixia", "pos_group": "noun", "row_number": 83295, "definition": "A South African bulbous plant of the Iris family remarkable for the brilliancy of its flowers.", "details": []}, {"x": -0.4492283114478402, "y": 0.2444684848004711, "z": 0.8593189653051327, "word": "Jaborandi", "pos_group": "noun", "row_number": 83320, "definition": "The native name of a South American rutaceous shrub (Pilocarpus pennatifolius). The leaves are used in medicine as an diaphoretic and sialogogue.", "details": []}, {"x": -0.4070729690919604, "y": 0.4882972236176225, "z": 0.7719180132902569, "word": "Jaborine", "pos_group": "noun", "row_number": 83321, "definition": "An alkaloid found in jaborandi leaves from which it is extracted as a white amorphous substance. In its action it resembles atropine.", "details": []}, {"x": -0.5913871103417782, "y": 0.3030054380540415, "z": 0.7472944468088065, "word": "Jacaranda", "pos_group": "noun", "row_number": 83327, "definition": "A genus of bignoniaceous Brazilian trees with showy trumpet-shaped flowers.", "details": []}, {"x": -0.3616591966363109, "y": 0.3323592147384912, "z": 0.8710568166697231, "word": "Jacchus", "pos_group": "noun", "row_number": 83329, "definition": "The common marmoset (Hapale vulgaris). Formerly the name was also applied to other species of the same genus.", "details": []}, {"x": -0.5161139534146492, "y": 0.474455116070679, "z": 0.713104992217177, "word": "Jacobaean lily", "pos_group": "other", "row_number": 83404, "definition": "A bulbous plant (Amaryllis / Sprekelia formosissima) from Mexico. It bears a single large deep red lilylike flower.", "details": []}, {"x": -0.5181229270600497, "y": 0.2354563739909412, "z": 0.8222584316392046, "word": "Jacqueminot", "pos_group": "noun", "row_number": 83428, "definition": "A half-hardy deep crimson rose of the remontant class; -- so named after General Jacqueminot of France.", "details": []}, {"x": -0.360598917826242, "y": 0.4458340445209754, "z": 0.8192682254357312, "word": "Jalap", "pos_group": "noun", "row_number": 83494, "definition": "The tubers of the Mexican plant Ipomoea purga (or Exogonium purga) a climber much like the morning-glory. The abstract extract and powder prepared from the tubers are well known purgative medicines. Other species of Ipomoea yield several inferior kinds of jalap as the I. Orizabensis and I. tuberosa.", "details": []}, {"x": -0.5909566818266109, "y": 0.3746247453979907, "z": 0.7144413904162976, "word": "Jalapin", "pos_group": "noun", "row_number": 83496, "definition": "A glucoside found in the stems of the jalap plant and scammony. It is a strong purgative.", "details": []}, {"x": -0.4087455632970842, "y": 0.2691568292003228, "z": 0.8720559992223995, "word": "Jamestown weed", "pos_group": "other", "row_number": 83526, "definition": "The poisonous thorn apple or stramonium (Datura stramonium) a rank weed early noticed at Jamestown Virginia. See Datura.", "details": []}, {"x": -0.4470319607203296, "y": 0.4959874998918447, "z": 0.7444184482168446, "word": "Japonica", "pos_group": "noun", "row_number": 83588, "definition": "A species of Camellia (Camellia Japonica) a native of Japan bearing beautiful red or white flowers. Many other genera have species of the same name.", "details": []}, {"x": -0.572865245980772, "y": 0.2668937159494349, "z": 0.7749794541367478, "word": "Jardiniere", "pos_group": "noun", "row_number": 83604, "definition": "An ornamental stand or receptacle for plants flowers etc. used as a piece of decorative furniture in room.", "details": []}, {"x": -0.3489168401333156, "y": 0.3778726938191084, "z": 0.8575950477569658, "word": "Jasmine", "pos_group": "noun", "row_number": 83629, "definition": "A shrubby plant of the genus Jasminum bearing flowers of a peculiarly fragrant odor. The J. officinale common in the south of Europe bears white flowers. The Arabian jasmine is J. Sambac and with J. angustifolia comes from the East Indies. The yellow false jasmine in the Gelseminum sempervirens (see Gelsemium). Several other plants are called jasmine in the West Indies as species of Calotropis and Faramea.", "details": []}, {"x": -0.5533625910564455, "y": 0.4433842461642961, "z": 0.70512428200468, "word": "Jaspery", "pos_group": "adjective", "row_number": 83635, "definition": "Of the nature of jasper; mixed with jasper.", "details": []}, {"x": -0.4758418846253859, "y": 0.2356870856158871, "z": 0.8473642065310822, "word": "Jatrophic", "pos_group": "adjective", "row_number": 83641, "definition": "Of or pertaining to physic nuts the seeds of plants of the genus Jatropha.", "details": []}, {"x": -0.3856180983960568, "y": 0.4765202442012308, "z": 0.7900804636591189, "word": "Jeffersonia", "pos_group": "noun", "row_number": 83718, "definition": "An American herb with a pretty white solitary blossom and deeply two-cleft leaves (Jeffersonia diphylla); twinleaf.", "details": []}, {"x": -0.5962733724379223, "y": 0.3290622469870073, "z": 0.732240467967572, "word": "Jeniquen", "pos_group": "noun", "row_number": 83748, "definition": "A Mexican name for the Sisal hemp (Agave rigida var. Sisalana); also its fiber.", "details": []}, {"x": -0.3757856999039874, "y": 0.305601970388126, "z": 0.8748671575974064, "word": "Jervine", "pos_group": "noun", "row_number": 83805, "definition": "A poisonous alkaloid resembling veratrine and found with it in white hellebore (Veratrum album); -- called also jervina.", "details": []}, {"x": -0.4902521464559297, "y": 0.4877507963464214, "z": 0.7223240225541341, "word": "Jessant", "pos_group": "adjective", "row_number": 83809, "definition": "Springing up or emerging; -- said of a plant or animal.", "details": []}, {"x": -0.5420049564911636, "y": 0.2425135055863859, "z": 0.8046227853766097, "word": "Jeterus", "pos_group": "noun", "row_number": 83855, "definition": "A yellowness of the parts of plants which are normally green; yellows.", "details": []}, {"x": -0.3511129778218076, "y": 0.4220165944745696, "z": 0.8358359114043794, "word": "Jewbush", "pos_group": "noun", "row_number": 83874, "definition": "A euphorbiaceous shrub of the genus Pedilanthus (P. tithymaloides) found in the West Indies and possessing powerful emetic and drastic qualities.", "details": []}, {"x": -0.580919941627803, "y": 0.4025950710482356, "z": 0.7074243635801754, "word": "Jimson weed", "pos_group": "other", "row_number": 83955, "definition": "See Jamestown weed.", "details": []}, {"x": -0.4329097962650218, "y": 0.2516246928386544, "z": 0.8656062166202539, "word": "Joe-Pye weed", "pos_group": "other", "row_number": 84035, "definition": "A tall composite plant of the genus Eupatorium (E. purpureum) with purplish flowers and whorled leaves.", "details": []}, {"x": -0.4212949500875305, "y": 0.4937598782269795, "z": 0.7607310613377264, "word": "Johnson grass", "pos_group": "other", "row_number": 84062, "definition": "A tall perennial grass (Sorghum Halepense) valuable in the Southern and Western States for pasture and hay. The rootstocks are large and juicy and are eagerly sought by swine. Called also Cuba grass Means grass Evergreen millet and Arabian millet.", "details": []}, {"x": -0.5865193056532766, "y": 0.2876196264834685, "z": 0.7571459928953652, "word": "Joint-fir", "pos_group": "noun", "row_number": 84110, "definition": "A genus (Ephedra) of leafless shrubs with the stems conspicuously jointed; -- called also shrubby horsetail. There are about thirty species of which two or three are found from Texas to California.", "details": []}, {"x": -0.354394048456571, "y": 0.3494242784610125, "z": 0.8673566348628241, "word": "Jointweed", "pos_group": "noun", "row_number": 84122, "definition": "A slender nearly leafless American herb (Polygonum articulatum) with jointed spikes of small flowers.", "details": []}, {"x": -0.5314868936730917, "y": 0.4645088959983038, "z": 0.7083453729588162, "word": "Jonquille", "pos_group": "noun", "row_number": 84165, "definition": "A bulbous plant of the genus Narcissus (N. Jonquilla) allied to the daffodil. It has long rushlike leaves and yellow or white fragrant flowers. The root has emetic properties. It is sometimes called the rush-leaved daffodil. See Illust. of Corona.", "details": []}, {"x": -0.5024983067192895, "y": 0.2328873008454901, "z": 0.8326217369545124, "word": "Joseph's flower", "pos_group": "other", "row_number": 84172, "definition": "A composite herb (Tragopogon pratensis) of the same genus as the salsify.", "details": []}, {"x": -0.3680508961591928, "y": 0.4594097638392923, "z": 0.8083818446288491, "word": "Juba", "pos_group": "noun", "row_number": 84265, "definition": "A loose panicle the axis of which falls to pieces as in certain grasses.", "details": []}, {"x": -0.595381872623364, "y": 0.3570015603155193, "z": 0.7197710133672937, "word": "Juglandine", "pos_group": "noun", "row_number": 84381, "definition": "An alkaloid found in the leaves of the walnut (Juglans regia).", "details": []}, {"x": -0.3945452949069235, "y": 0.2814045208317595, "z": 0.8747259604711962, "word": "Jugum", "pos_group": "noun", "row_number": 84396, "definition": "One of the ridges commonly found on the fruit of umbelliferous plants.", "details": []}, {"x": -0.4633371267485074, "y": 0.4953867519250962, "z": 0.7347861409917449, "word": "Jugum", "pos_group": "noun", "row_number": 84397, "definition": "A pair of the opposite leaflets of a pinnate plant.", "details": []}, {"x": -0.5628047540444763, "y": 0.2553582818879703, "z": 0.7861570814386653, "word": "Jujube", "pos_group": "noun", "row_number": 84404, "definition": "The sweet and edible drupes (fruits) of several Mediterranean and African species of small trees of the genus Zizyphus especially the Z. jujuba Z. vulgaris Z. mucronata and Z. Lotus. The last named is thought to have furnished the lotus of the ancient Libyan Lotophagi or lotus eaters.", "details": []}, {"x": -0.3472276963766055, "y": 0.3953246677487813, "z": 0.8503830513000078, "word": "Juncaceous", "pos_group": "adjective", "row_number": 84462, "definition": "Of. pertaining to or resembling a natural order of plants (Juncaceae) of which the common rush (Juncus) is the type.", "details": []}, {"x": -0.5657055022410961, "y": 0.4290145513484909, "z": 0.704218573644151, "word": "Juncous", "pos_group": "adjective", "row_number": 84466, "definition": "Full of rushes: resembling rushes; juncaceous.", "details": []}, {"x": -0.4591079030346323, "y": 0.2392565453295131, "z": 0.8555560992057325, "word": "Jungermannia", "pos_group": "noun", "row_number": 84477, "definition": "A genus of hepatic mosses now much circumscribed but formerly comprising most plants of the order which is sometimes therefore called Jungermanniaceae.", "details": []}, {"x": -0.3977385422499421, "y": 0.4854663876292817, "z": 0.7785412246574145, "word": "Juvia", "pos_group": "noun", "row_number": 84634, "definition": "A Brazilian name for the lofty myrtaceous tree (Bertholetia excelsa) which produces the large seeds known as Brazil nuts.", "details": []}, {"x": -0.5949215614922705, "y": 0.3121265279908135, "z": 0.7407059917376114, "word": "Kail", "pos_group": "noun", "row_number": 84665, "definition": "A kind of headless cabbage. Same as Kale 1.", "details": []}, {"x": -0.3654365826690447, "y": 0.3214678974737344, "z": 0.8735642477465451, "word": "Kale", "pos_group": "noun", "row_number": 84684, "definition": "A variety of cabbage in which the leaves do not form a head being nearly the original or wild form of the species.", "details": []}, {"x": -0.5066565084043424, "y": 0.4811244577827365, "z": 0.7154148716757209, "word": "Kalmia", "pos_group": "noun", "row_number": 84704, "definition": "A genus of North American shrubs with poisonous evergreen foliage and corymbs of showy flowers. Called also mountain laurel ivy bush lamb kill calico bush etc.", "details": []}, {"x": -0.5279446775565994, "y": 0.2362468066924752, "z": 0.815758459206686, "word": "Kamala", "pos_group": "noun", "row_number": 84714, "definition": "The red dusty hairs of the capsules of an East Indian tree (Mallotus Philippinensis) used for dyeing silk. It is violently emetic and is used in the treatment of tapeworm.", "details": []}, {"x": -0.3552252175370907, "y": 0.4377252315127725, "z": 0.8259610562991552, "word": "Karatas", "pos_group": "noun", "row_number": 84748, "definition": "A West Indian plant of the Pineapple family (Nidularium Karatas).", "details": []}, {"x": -0.5887067156176351, "y": 0.3855253034083393, "z": 0.7104890170992122, "word": "Kat", "pos_group": "noun", "row_number": 84764, "definition": "An Arabian shrub Catha edulis) the leaves of which are used as tea by the Arabs.", "details": []}, {"x": -0.4170923068667184, "y": 0.2609217952859154, "z": 0.870605435485774, "word": "Kecksy", "pos_group": "noun", "row_number": 84796, "definition": "The hollow stalk of an umbelliferous plant such as the cow parsnip or the hemlock.", "details": []}, {"x": -0.4366222785664458, "y": 0.496958163465082, "z": 0.7499290430599804, "word": "Keel", "pos_group": "noun", "row_number": 84811, "definition": "The two lowest petals of the corolla of a papilionaceous flower united and inclosing the stamens and pistil; a carina. See Carina.", "details": []}, {"x": -0.5795195926658001, "y": 0.2734322402183545, "z": 0.7677186019145539, "word": "Kemps", "pos_group": "other", "row_number": 84931, "definition": "The long flower stems of the ribwort plantain (Plantago Lanceolata).", "details": []}, {"x": -0.3491680917421913, "y": 0.3669871360817742, "z": 0.8622076812808003, "word": "Ketmie", "pos_group": "noun", "row_number": 85044, "definition": "The name of certain African species of Hibiscus cultivated for the acid of their mucilage.", "details": []}, {"x": -0.5459847626996145, "y": 0.4526292332524313, "z": 0.7050017135476777, "word": "Kind", "pos_group": "other", "row_number": 85243, "definition": "Characteristic of the species; belonging to one's nature; natural; native.", "details": []}, {"x": -0.4861243253875427, "y": 0.2326725250560249, "z": 0.8423459125267719, "word": "Kippernut", "pos_group": "noun", "row_number": 85371, "definition": "A name given to earthnuts of several kinds.", "details": []}, {"x": -0.3774840465270472, "y": 0.4714469481538839, "z": 0.7970216870913582, "word": "Kiwikiwi", "pos_group": "noun", "row_number": 85454, "definition": "Any species of Apteryx esp. A. australis; -- so called in imitation of its notes. Called also kiwi. See Apteryx.", "details": []}, {"x": -0.5976342205743603, "y": 0.3392924810583522, "z": 0.7264392271179638, "word": "Knapweed", "pos_group": "noun", "row_number": 85505, "definition": "The black centaury (Centaurea nigra); -- so called from the knoblike heads of flowers. Called also bullweed.", "details": []}, {"x": -0.3815682627358255, "y": 0.2953184380946416, "z": 0.8758953596144379, "word": "Knawel", "pos_group": "noun", "row_number": 85526, "definition": "A low spreading weed (Scleranthus annuus) common in sandy soil.", "details": []}, {"x": -0.4800119207855462, "y": 0.4924139096699402, "z": 0.7260283034891508, "word": "Knitback", "pos_group": "noun", "row_number": 85629, "definition": "The plant comfrey; -- so called from its use as a restorative.", "details": []}, {"x": -0.5509750938988073, "y": 0.2456551431590742, "z": 0.7975462347367048, "word": "Knopweed", "pos_group": "noun", "row_number": 85681, "definition": "Same as Knapweed.", "details": []}, {"x": -0.347778761364291, "y": 0.4124471026918878, "z": 0.8419841569916782, "word": "Knot", "pos_group": "noun", "row_number": 85693, "definition": "A protuberant joint in a plant.", "details": []}, {"x": -0.5765138368393521, "y": 0.4132976995349043, "z": 0.7048523302734586, "word": "Knotberry", "pos_group": "noun", "row_number": 85708, "definition": "The cloudberry (Rudus Chamaemorus); -- so called from its knotted stems.", "details": []}, {"x": -0.442396364435126, "y": 0.2451431996454751, "z": 0.8626646326366707, "word": "Knotgrass", "pos_group": "noun", "row_number": 85709, "definition": "a common weed with jointed stems (Polygonum aviculare); knotweed.", "details": []}, {"x": -0.4113614422932071, "y": 0.4923421022539475, "z": 0.7670599834058716, "word": "Knotwort", "pos_group": "noun", "row_number": 85723, "definition": "A small herbaceous trailing plant of the genus Illecebrum (I. verticillatum).", "details": []}, {"x": -0.5913308790690974, "y": 0.2959267185601359, "z": 0.7501700931799391, "word": "Knuckle", "pos_group": "noun", "row_number": 85762, "definition": "The joint of a plant.", "details": []}, {"x": -0.3568871072377906, "y": 0.3383198856716799, "z": 0.8707302955832783, "word": "Kohl-rabi", "pos_group": "noun", "row_number": 85794, "definition": "A variety of cabbage in which the edible part is a large turnip-shaped swelling of the stem above the surface of the ground.", "details": []}, {"x": -0.5226462205865917, "y": 0.4723071555504517, "z": 0.7097653689229935, "word": "Kousso", "pos_group": "noun", "row_number": 85823, "definition": "An Abyssinian rosaceous tree (Brayera anthelmintica) the flowers of which are used as a vermifuge.", "details": []}, {"x": -0.5126954964760746, "y": 0.2322257522201432, "z": 0.8265679209229815, "word": "Krameria", "pos_group": "noun", "row_number": 85831, "definition": "A genus of spreading shrubs with many stems from one species of which (K. triandra) found in Peru rhatany root used as a medicine is obtained.", "details": []}, {"x": -0.3615063629292871, "y": 0.4523132980019682, "z": 0.8153071997794581, "word": "Labellum", "pos_group": "noun", "row_number": 85960, "definition": "The lower or apparently anterior petal of an orchidaceous flower often of a very curious shape.", "details": []}, {"x": -0.5944834976242698, "y": 0.3678617601014754, "z": 0.7150294375111134, "word": "Labiate", "pos_group": "adjective", "row_number": 85978, "definition": "Belonging to a natural order of plants (Labiatae) of which the mint sage and catnip are examples. They are mostly aromatic herbs.", "details": []}, {"x": -0.4020699633343213, "y": 0.2722161580083188, "z": 0.8742071310070214, "word": "Labiate", "pos_group": "noun", "row_number": 85979, "definition": "A plant of the order Labiatae.", "details": []}, {"x": -0.4527878241664999, "y": 0.4978041824485352, "z": 0.7397122293319965, "word": "Labiatifloral", "pos_group": "adjective", "row_number": 85982, "definition": "Having labiate flowers as the snapdragon.", "details": []}, {"x": -0.5704877745328016, "y": 0.2607166660808353, "z": 0.7788263729075341, "word": "Lablab", "pos_group": "noun", "row_number": 86001, "definition": "an East Indian name for several twining leguminous plants related to the bean but commonly applied to the hyacinth bean (Dolichos Lablab).", "details": []}, {"x": -0.3461013710121383, "y": 0.3847324148054431, "z": 0.8556838259436078, "word": "Laburnine", "pos_group": "noun", "row_number": 86048, "definition": "A poisonous alkaloid found in the unripe seeds of the laburnum.", "details": []}, {"x": -0.5593306030144064, "y": 0.4390078465133359, "z": 0.703151041548872, "word": "Lacinia", "pos_group": "noun", "row_number": 86140, "definition": "One of the narrow jagged irregular pieces or divisions which form a sort of fringe on the borders of the petals of some flowers.", "details": []}, {"x": -0.4692894575378997, "y": 0.2348447605856077, "z": 0.8512434102354464, "word": "Lacinia", "pos_group": "noun", "row_number": 86141, "definition": "A narrow slender portion of the edge of a monophyllous calyx or of any irregularly incised leaf.", "details": []}, {"x": -0.3887499051263138, "y": 0.481705508839869, "z": 0.7853873655831274, "word": "Lactescence", "pos_group": "noun", "row_number": 86222, "definition": "The latex of certain plants. See Latex.", "details": []}, {"x": -0.5976441126040622, "y": 0.3218189702776154, "z": 0.7343392029839876, "word": "Lactiferous", "pos_group": "adjective", "row_number": 86227, "definition": "Bearing or containing milk or a milky fluid; as the lactiferous vessels cells or tissue of various vascular plants.", "details": []}, {"x": -0.3700657120153454, "y": 0.3106645612370484, "z": 0.8755220723556701, "word": "Lactuca", "pos_group": "noun", "row_number": 86246, "definition": "A genus of composite herbs several of which are cultivated foe salad; lettuce.", "details": []}, {"x": -0.4967553411267076, "y": 0.487092571294106, "z": 0.7183139689941888, "word": "Lacustrine", "pos_group": "adjective", "row_number": 86267, "definition": "Found in or pertaining to lakes or ponds or growing in them; as lacustrine flowers.", "details": []}, {"x": -0.5375689368741743, "y": 0.237983637447712, "z": 0.8089396926935444, "word": "Ladies' eardrops", "pos_group": "other", "row_number": 86290, "definition": "The small-flowered Fuchsia (F. coccinea) and other closely related species.", "details": []}, {"x": -0.3505869643041988, "y": 0.4289223109440522, "z": 0.8325349431912032, "word": "Lady's bedstraw", "pos_group": "other", "row_number": 86333, "definition": "The common bedstraw (Galium verum); also a slender-leaved East Indian shrub (Pharnaceum Mollugo) with white flowers in umbels.", "details": []}, {"x": -0.5855698401669607, "y": 0.3965029149950662, "z": 0.7070314000716342, "word": "Lady's bower", "pos_group": "other", "row_number": 86334, "definition": "A climbing plant with fragrant blossoms (Clematis vitalba).", "details": []}, {"x": -0.4260115761219112, "y": 0.253267737161135, "z": 0.868544524088088, "word": "Lady's comb", "pos_group": "other", "row_number": 86335, "definition": "An umbelliferous plant (Scandix Pecten-Veneris) its clusters of long slender fruits remotely resembling a comb.", "details": []}, {"x": -0.4262557412502602, "y": 0.4969950181011649, "z": 0.7558452189660354, "word": "Lady's cushion", "pos_group": "other", "row_number": 86336, "definition": "An herb growing in dense tufts; the thrift (Armeria vulgaris).", "details": []}, {"x": -0.5855377179440682, "y": 0.2807669606442074, "z": 0.7604705744967828, "word": "Lady's finger", "pos_group": "other", "row_number": 86339, "definition": "A long slender variety of the potato.", "details": []}, {"x": -0.3503147713347606, "y": 0.3558617003807189, "z": 0.8663959898261403, "word": "Lady's hair", "pos_group": "other", "row_number": 86342, "definition": "A plant of the genus Briza (B. media); a variety of quaking grass.", "details": []}, {"x": -0.5379230136998001, "y": 0.4614316016891727, "z": 0.7054925288723398, "word": "Lady's mantle", "pos_group": "other", "row_number": 86346, "definition": "A genus of rosaceous herbs (Alchemilla) esp. the European A. vulgaris which has leaves with rounded and finely serrated lobes.", "details": []}, {"x": -0.4965198421060935, "y": 0.2305509572506143, "z": 0.8368478371279726, "word": "Lady's slipper", "pos_group": "other", "row_number": 86349, "definition": "Any orchidaceous plant of the genus Cypripedium the labellum of which resembles a slipper. Less commonly in the United States the garden balsam (Impatiens Balsamina).", "details": []}, {"x": -0.3698676983449644, "y": 0.4654995738233546, "z": 0.8040572320993535, "word": "Lady's smock", "pos_group": "other", "row_number": 86350, "definition": "A plant of the genus Cardamine (C. pratensis); cuckoo flower.", "details": []}, {"x": -0.5981185909426945, "y": 0.3499186434907687, "z": 0.7209792605243968, "word": "Lady's thumb", "pos_group": "other", "row_number": 86352, "definition": "An annual weed (Polygonum Persicaria) having a lanceolate leaf with a dark spot in the middle.", "details": []}, {"x": -0.3881258181319146, "y": 0.2853256271169065, "z": 0.8763262154071257, "word": "Ladies' tresses", "pos_group": "other", "row_number": 86354, "definition": "A name given to several species of the orchidaceous genus Spiranthes in which the white flowers are set in spirals about a slender axis and remotely resemble braided hair.", "details": []}, {"x": -0.4695057803597237, "y": 0.4962522820970011, "z": 0.7302725482464238, "word": "Lakeweed", "pos_group": "noun", "row_number": 86435, "definition": "The water pepper (Polygonum Hydropiper) an aquatic plant of Europe and North America.", "details": []}, {"x": -0.5595622803168296, "y": 0.2497225098829305, "z": 0.7902712967737089, "word": "Lamb's-quarters", "pos_group": "noun", "row_number": 86487, "definition": "A name given to several plants of the Goosefoot family sometimes used as pot herbs as Chenopodium album and Atriplex patulsa.", "details": []}, {"x": -0.3452756330823354, "y": 0.4023375591756772, "z": 0.8478851488710905, "word": "Lamina", "pos_group": "noun", "row_number": 86542, "definition": "The blade of a leaf; the broad expanded portion of a petal or sepal of a flower.", "details": []}, {"x": -0.5712653103564461, "y": 0.4238708444140539, "z": 0.7028438321839853, "word": "Laminaria", "pos_group": "noun", "row_number": 86548, "definition": "A genus of great seaweeds with long and broad fronds; kelp or devil's apron. The fronds commonly grow in clusters and are sometimes from thirty to fifty feet in length. See Illust. of Kelp.", "details": []}, {"x": -0.4522941572194374, "y": 0.2393931733246156, "z": 0.8591396300431783, "word": "Laminarite", "pos_group": "noun", "row_number": 86550, "definition": "A broad-leafed fossil alga.", "details": []}, {"x": -0.4016644723859214, "y": 0.4899751943963056, "z": 0.7736859572845055, "word": "Larkspur", "pos_group": "noun", "row_number": 87024, "definition": "A genus of ranunculaceous plants (Delphinium) having showy flowers and a spurred calyx. They are natives of the North Temperate zone. The commonest larkspur of the gardens is D. Consolida. The flower of the bee larkspur (D. elatum) has two petals bearded with yellow hairs and looks not unlike a bee.", "details": []}, {"x": -0.5953823746315767, "y": 0.3049020438243754, "z": 0.743340145323649, "word": "Laserwort", "pos_group": "noun", "row_number": 87069, "definition": "Any plant of the umbelliferous genus Laserpitium of several species (as L. glabrum and L. siler) the root of which yields a resinous substance of a bitter taste. The genus is mostly European.", "details": []}, {"x": -0.3602647840168722, "y": 0.3271796768013459, "z": 0.8735918637930661, "word": "Laterifolious", "pos_group": "adjective", "row_number": 87174, "definition": "Growing from the stem by the side of a leaf; as a laterifolious flower.", "details": []}, {"x": -0.5132614856183999, "y": 0.4794898506107073, "z": 0.7117950059828422, "word": "Latex", "pos_group": "noun", "row_number": 87183, "definition": "A milky or colored juice in certain plants in cavities (called latex cells or latex tubes). It contains the peculiar principles of the plants whether aromatic bitter or acid and in many instances yields caoutchouc upon coagulation.", "details": []}, {"x": -0.5228103004445354, "y": 0.232508114195214, "z": 0.8201276526142014, "word": "Laticiferous", "pos_group": "adjective", "row_number": 87212, "definition": "Containing the latex; -- applied to the tissue or tubular vessels in which the latex of the plant is found.", "details": []}, {"x": -0.3556278934172031, "y": 0.4444406833385558, "z": 0.8221929703039303, "word": "Laurel", "pos_group": "noun", "row_number": 87373, "definition": "An evergreen shrub of the genus Laurus (L. nobilis) having aromatic leaves of a lanceolate shape with clusters of small yellowish white flowers in their axils; -- called also sweet bay.", "details": []}, {"x": -0.5926853839904584, "y": 0.3789225106393984, "z": 0.7107332597640396, "word": "Lauric", "pos_group": "adjective", "row_number": 87380, "definition": "Pertaining to or derived from the European bay or laurel (Laurus nobilis).", "details": []}, {"x": -0.4102555011393469, "y": 0.2635087017325707, "z": 0.8730713532673708, "word": "Lavender", "pos_group": "noun", "row_number": 87409, "definition": "An aromatic plant of the genus Lavandula (L. vera) common in the south of Europe. It yields and oil used in medicine and perfumery. The Spike lavender (L. Spica) yields a coarser oil (oil of spike) used in the arts.", "details": []}, {"x": -0.4421641982165727, "y": 0.4993118392350725, "z": 0.7451030190619179, "word": "Lavender", "pos_group": "noun", "row_number": 87410, "definition": "The pale purplish color of lavender flowers paler and more delicate than lilac.", "details": []}, {"x": -0.5776194442546818, "y": 0.2669359183914013, "z": 0.7714278923473353, "word": "Lawsonia", "pos_group": "noun", "row_number": 87471, "definition": "An Asiatic and North African shrub (Lawsonia inermis) with smooth oval leaves and fragrant white flowers. Henna is prepared from the leaves and twigs. In England the shrub is called Egyptian privet and in the West Indies Jamaica mignonette.", "details": []}, {"x": -0.3458628233781773, "y": 0.3737808463397248, "z": 0.8606200011122416, "word": "Lay", "pos_group": "noun", "row_number": 87497, "definition": "A meadow. See Lea.", "details": []}, {"x": -0.5521981504597976, "y": 0.4486699829921392, "z": 0.7026894399310496, "word": "Leadwort", "pos_group": "noun", "row_number": 87641, "definition": "A genus of maritime herbs (Plumbago). P. Europaea has lead-colored spots on the leaves and nearly lead-colored flowers.", "details": []}, {"x": -0.4797003483085446, "y": 0.2312810702445598, "z": 0.8464021753157254, "word": "Leaf", "pos_group": "noun", "row_number": 87645, "definition": "A special organ of vegetation in the form of a lateral outgrowth from the stem whether appearing as a part of the foliage or as a cotyledon a scale a bract a spine or a tendril.", "details": []}, {"x": -0.380181163334233, "y": 0.4770252553670771, "z": 0.7924072114688282, "word": "Leafcup", "pos_group": "noun", "row_number": 87651, "definition": "A coarse American composite weed (Polymnia Uvedalia).", "details": []}, {"x": -0.5995181273346761, "y": 0.3320190742361892, "z": 0.7282453908817185, "word": "Leaflet", "pos_group": "noun", "row_number": 87658, "definition": "One of the divisions of a compound leaf; a foliole.", "details": []}, {"x": -0.3755264820772955, "y": 0.3000324636027145, "z": 0.8769038613457784, "word": "Leafstalk", "pos_group": "noun", "row_number": 87661, "definition": "The stalk or petiole which supports a leaf.", "details": []}, {"x": -0.4864767481367537, "y": 0.4923003838784611, "z": 0.7217899317359651, "word": "Leek", "pos_group": "noun", "row_number": 87900, "definition": "A plant of the genus Allium (A. Porrum) having broadly linear succulent leaves rising from a loose oblong cylindrical bulb. The flavor is stronger than that of the common onion.", "details": []}, {"x": -0.546918041856309, "y": 0.2406706971549141, "z": 0.8018467877487746, "word": "Legume", "pos_group": "noun", "row_number": 88075, "definition": "A pod dehiscent into two pieces or valves and having the seed attached at one suture as that of the pea.", "details": []}, {"x": -0.3467323730850044, "y": 0.4194787274077137, "z": 0.8389363853757006, "word": "Legume", "pos_group": "noun", "row_number": 88076, "definition": "The fruit of leguminous plants as peas beans lupines; pulse.", "details": []}, {"x": -0.5815526404929812, "y": 0.4074749285474483, "z": 0.7041027687354262, "word": "Legumin", "pos_group": "noun", "row_number": 88080, "definition": "An albuminous substance resembling casein found as a characteristic ingredient of the seeds of leguminous and grain-bearing plants.", "details": []}, {"x": -0.4354454266197822, "y": 0.2462630834528406, "z": 0.8658763041937428, "word": "Leguminous", "pos_group": "adjective", "row_number": 88082, "definition": "Belonging to or resembling a very large natural order of plants (Leguminosae) which bear legumes including peas beans clover locust trees acacias and mimosas.", "details": []}, {"x": -0.4160112165245769, "y": 0.4960798283854827, "z": 0.7621282514083649, "word": "Lenticel", "pos_group": "noun", "row_number": 88194, "definition": "One of the small oval rounded spots upon the stem or branch of a plant from which the underlying tissues may protrude or roots may issue either in the air or more commonly when the stem or branch is covered with water or earth.", "details": []}, {"x": -0.5908612746142587, "y": 0.2888563164512949, "z": 0.7532894414548785, "word": "Lenticel", "pos_group": "noun", "row_number": 88195, "definition": "A small lens-shaped gland on the under side of some leaves.", "details": []}, {"x": -0.3523640312763924, "y": 0.3445759217828611, "z": 0.8701189709402624, "word": "Lentil", "pos_group": "noun", "row_number": 88209, "definition": "A leguminous plant of the genus Ervum (Ervum Lens) of small size common in the fields in Europe. Also its seed which is used for food on the continent.", "details": []}, {"x": -0.5292251643528476, "y": 0.469715630443807, "z": 0.7066031077857488, "word": "Leontodon", "pos_group": "noun", "row_number": 88230, "definition": "A genus of liguliflorous composite plants including the fall dandelion (L. autumnale) and formerly the true dandelion; -- called also lion's tooth.", "details": []}, {"x": -0.5069507549824107, "y": 0.2293544897105859, "z": 0.8309015886808503, "word": "Leopard's bane", "pos_group": "other", "row_number": 88232, "definition": "A name of several harmless plants as Arnica montana Senecio Doronicum and Paris quadrifolia.", "details": []}, {"x": -0.3628357765456532, "y": 0.458706518361842, "z": 0.8111341006707028, "word": "Lepidolite", "pos_group": "noun", "row_number": 88250, "definition": "A species of mica of a lilac or rose-violet color containing lithia. It usually occurs in masses consisting of small scales. See Mica.", "details": []}, {"x": -0.5977057902253642, "y": 0.3608667351039012, "z": 0.7159071083782613, "word": "Lettuce", "pos_group": "noun", "row_number": 88409, "definition": "A composite plant of the genus Lactuca (L. sativa) the leaves of which are used as salad. Plants of this genus yield a milky juice from which lactucarium is obtained. The commonest wild lettuce of the United States is L. Canadensis.", "details": []}, {"x": -0.3954221367230732, "y": 0.2757042624245386, "z": 0.8761441054246158, "word": "Leucophyll", "pos_group": "noun", "row_number": 88439, "definition": "A colorless substance isomeric with chlorophyll contained in parts of plants capable of becoming green.", "details": []}, {"x": -0.4588078563742976, "y": 0.4992208880359671, "z": 0.735033234539638, "word": "Ley", "pos_group": "noun", "row_number": 88618, "definition": "Grass or meadow land; a lea.", "details": []}, {"x": -0.5676934307390917, "y": 0.2547012538625178, "z": 0.7828482866919627, "word": "Lichen", "pos_group": "noun", "row_number": 88777, "definition": "One of a class of cellular flowerless plants (technically called Lichenes) having no distinction of leaf and stem usually of scaly expanded frond-like forms but sometimes erect or pendulous and variously branched. They derive their nourishment from the air and generate by means of spores. The species are very widely distributed and form irregular spots or patches usually of a greenish or yellowish color upon rocks", "details": []}, {"x": -0.3436372188197321, "y": 0.3917541718823731, "z": 0.853488213541696, "word": "Lichenography", "pos_group": "noun", "row_number": 88786, "definition": "A description of lichens; the science which illustrates the natural history of lichens.", "details": []}, {"x": -0.5651978830261634, "y": 0.4342312202349389, "z": 0.7014232676465896, "word": "Lichenology", "pos_group": "noun", "row_number": 88788, "definition": "The science which treats of lichens.", "details": []}, {"x": -0.4625348479615532, "y": 0.234431209420283, "z": 0.8550459183406036, "word": "Lichwort", "pos_group": "noun", "row_number": 88792, "definition": "An herb the wall pellitory. See Pellitory.", "details": []}, {"x": -0.3922812777170377, "y": 0.4866590043832978, "z": 0.7805628819034027, "word": "Licorice", "pos_group": "noun", "row_number": 88814, "definition": "A plant of the genus Glycyrrhiza (G. glabra) the root of which abounds with a sweet juice and is much used in demulcent compositions.", "details": []}, {"x": -0.5986282354717125, "y": 0.3144892073043425, "z": 0.7367094231683956, "word": "Lid", "pos_group": "noun", "row_number": 88821, "definition": "The cover of the spore cases of mosses.", "details": []}, {"x": -0.3645169993248127, "y": 0.3160869724540492, "z": 0.8759088896957649, "word": "Lid", "pos_group": "noun", "row_number": 88822, "definition": "A calyx which separates from the flower and falls off in a single piece as in the Australian Eucalypti.", "details": []}, {"x": -0.5033931272450464, "y": 0.4859905167600443, "z": 0.7144288467452569, "word": "Lienculi", "pos_group": "other", "row_number": 88870, "definition": "of Lienculus", "details": []}, {"x": -0.5327636677900636, "y": 0.2337490560289969, "z": 0.8133414123776262, "word": "Ligule", "pos_group": "noun", "row_number": 89134, "definition": "A strap-shaped corolla of flowers of Compositae.", "details": []}, {"x": -0.3504716096660742, "y": 0.4358367745711363, "z": 0.828984895368727, "word": "Liguliflorous", "pos_group": "adjective", "row_number": 89136, "definition": "Bearing only ligulate flowers; -- said of a large suborder of composite plants such as the dandelion lettuce hawkweed etc.", "details": []}, {"x": -0.589983843464052, "y": 0.3901029859770823, "z": 0.7069220075674184, "word": "Lilac", "pos_group": "noun", "row_number": 89186, "definition": "A shrub of the genus Syringa. There are six species natives of Europe and Asia. Syringa vulgaris the common lilac and S. Persica the Persian lilac are frequently cultivated for the fragrance and beauty of their purplish or white flowers. In the British colonies various other shrubs have this name.", "details": []}, {"x": -0.4190512047511396, "y": 0.2553564815478554, "z": 0.8713146131726004, "word": "Lilac", "pos_group": "noun", "row_number": 89187, "definition": "A light purplish color like that of the flower of the purplish lilac.", "details": []}, {"x": -0.4315447152021122, "y": 0.4998809576609454, "z": 0.7509248876879125, "word": "Liliaceous", "pos_group": "adjective", "row_number": 89189, "definition": "Of or pertaining to a natural order of which the lily tulip and hyacinth are well-known examples.", "details": []}, {"x": -0.5841347641995254, "y": 0.2739841033770481, "z": 0.7640152409148916, "word": "Liliaceous", "pos_group": "adjective", "row_number": 89190, "definition": "Like the blossom of a lily in general form.", "details": []}, {"x": -0.3465294176842029, "y": 0.3625458353510103, "z": 0.8651461610323918, "word": "Lilial", "pos_group": "adjective", "row_number": 89191, "definition": "Having a general resemblance to lilies or to liliaceous plants.", "details": []}, {"x": -0.5443475587968273, "y": 0.4579210113247948, "z": 0.7028471260659832, "word": "Lily", "pos_group": "noun", "row_number": 89205, "definition": "A plant and flower of the genus Lilium endogenous bulbous plants having a regular perianth of six colored pieces six stamens and a superior three-celled ovary.", "details": []}, {"x": -0.4902650769312287, "y": 0.2286074815811393, "z": 0.8410581274244638, "word": "Lily", "pos_group": "noun", "row_number": 89206, "definition": "A name given to handsome flowering plants of several genera having some resemblance in color or form to a true lily as Pancratium Crinum Amaryllis Nerine etc.", "details": []}, {"x": -0.3721042319796076, "y": 0.4714436541606135, "z": 0.7995494490615037, "word": "Lilywort", "pos_group": "noun", "row_number": 89210, "definition": "Any plant of the Lily family or order.", "details": []}, {"x": -0.6005130722004037, "y": 0.3426582310192022, "z": 0.7224744887061574, "word": "Limu", "pos_group": "noun", "row_number": 89354, "definition": "The Hawaiian name for seaweeds. Over sixty kinds are used as food and have species names as Limu Lipoa Limu palawai etc.", "details": []}, {"x": -0.3817919814164368, "y": 0.2896547542593971, "z": 0.8776873055143497, "word": "Linden", "pos_group": "noun", "row_number": 89377, "definition": "A handsome tree (Tilia Europaea) having cymes of light yellow flowers and large cordate leaves. The tree is common in Europe.", "details": []}, {"x": -0.4758909625840286, "y": 0.4966939013489118, "z": 0.7258257091710406, "word": "Ling-bird", "pos_group": "noun", "row_number": 89471, "definition": "The European meadow pipit; -- called also titling.", "details": []}, {"x": -0.5559153346314637, "y": 0.2443044352788579, "z": 0.7945272076050425, "word": "Linnaea borealis", "pos_group": "other", "row_number": 89539, "definition": "The twin flower which grows in cold northern climates.", "details": []}, {"x": -0.3437042387261895, "y": 0.4094537310824668, "z": 0.8451124412670171, "word": "Linnean", "pos_group": "adjective", "row_number": 89541, "definition": "Of or pertaining to Linnaeus the celebrated Swedish botanist.", "details": []}, {"x": -0.5766686891357029, "y": 0.4183575142689714, "z": 0.7017337196011014, "word": "Linum", "pos_group": "noun", "row_number": 89563, "definition": "A genus of herbaceous plants including the flax (Linum usitatissimum).", "details": []}, {"x": -0.4453310308941297, "y": 0.2399721931775488, "z": 0.8626086131174028, "word": "Lion's ear", "pos_group": "other", "row_number": 89582, "definition": "A name given in Western South America to certain plants with shaggy tomentose leaves as species of Culcitium and Espeletia.", "details": []}, {"x": -0.4059677838351425, "y": 0.4942015388718094, "z": 0.7687359738328358, "word": "Lion's foot", "pos_group": "other", "row_number": 89583, "definition": "A composite plant of the genus Prenanthes of which several species are found in the United States.", "details": []}, {"x": -0.5954364875779257, "y": 0.2976522291865017, "z": 0.7462295489466823, "word": "Lion's leaf", "pos_group": "other", "row_number": 89586, "definition": "A South European plant of the genus Leontice (L. leontopetalum) the tuberous roots of which contain so much alkali that they are sometimes used as a substitute for soap.", "details": []}, {"x": -0.3553160696773482, "y": 0.3332117651862503, "z": 0.873338657206072, "word": "Lion's tail", "pos_group": "other", "row_number": 89587, "definition": "A genus of labiate plants (Leonurus); -- so called from a fancied resemblance of its flower spikes to the tuft of a lion's tail. L. Cardiaca is the common motherwort.", "details": []}, {"x": -0.519944717151094, "y": 0.4774085345644562, "z": 0.7083350776515922, "word": "Lip", "pos_group": "noun", "row_number": 89594, "definition": "The odd and peculiar petal in the Orchis family. See Orchidaceous.", "details": []}, {"x": -0.517337960703496, "y": 0.2291084696322569, "z": 0.8245427481688947, "word": "Lirella", "pos_group": "noun", "row_number": 89681, "definition": "A linear apothecium furrowed along the middle; the fruit of certain lichens.", "details": []}, {"x": -0.3564514194220697, "y": 0.4511032115624662, "z": 0.818198189994344, "word": "Lithocarp", "pos_group": "noun", "row_number": 89823, "definition": "Fossil fruit; a fruit petrified; a carpolite.", "details": []}, {"x": -0.5963818349317213, "y": 0.3720591477017426, "z": 0.7112669664583939, "word": "Liverwort", "pos_group": "noun", "row_number": 90019, "definition": "A ranunculaceous plant (Anemone Hepatica) with pretty white or bluish flowers and a three-lobed leaf; -- called also squirrel cups.", "details": []}, {"x": -0.4034146794446338, "y": 0.2665333567630241, "z": 0.8753379725233094, "word": "Liverwort", "pos_group": "noun", "row_number": 90020, "definition": "A flowerless plant (Marchantia polymorpha) having an irregularly lobed spreading and forking frond.", "details": []}, {"x": -0.4479948734108279, "y": 0.50128083687642, "z": 0.7402824568893229, "word": "Lizard's tail", "pos_group": "other", "row_number": 90079, "definition": "A perennial plant of the genus Saururus (S. cernuus) growing in marshes and having white flowers crowded in a slender terminal spike somewhat resembling in form a lizard's tail; whence the name.", "details": []}, {"x": -0.5752979470078727, "y": 0.2605696885695353, "z": 0.7753294200320933, "word": "Lobated", "pos_group": "adjective", "row_number": 90164, "definition": "Consisting of or having lobes; lobed; as a lobate leaf.", "details": []}, {"x": -0.3428908829878055, "y": 0.3807678286329477, "z": 0.858744259393909, "word": "Lobelia", "pos_group": "noun", "row_number": 90189, "definition": "A genus of plants including a great number of species. Lobelia inflata or Indian tobacco is an annual plant of North America whose leaves contain a poisonous white viscid juice of an acrid taste. It has often been used in medicine as an emetic expectorant etc. L. cardinalis is the cardinal flower remarkable for the deep and vivid red color of its flowers.", "details": []}, {"x": -0.5583418219841776, "y": 0.4442959766524734, "z": 0.7006108013396694, "word": "Lobeliaceous", "pos_group": "adjective", "row_number": 90190, "definition": "Of or pertaining to a natural order of plants of which the genus Lobelia is the type.", "details": []}, {"x": -0.4730464242595057, "y": 0.2303085807432296, "z": 0.8504028681344712, "word": "Lobeline", "pos_group": "noun", "row_number": 90192, "definition": "A poisonous narcotic alkaloid extracted from the leaves of Indian tobacco (Lobelia inflata) as a yellow oil having a tobaccolike taste and odor.", "details": []}, {"x": -0.3832877829954896, "y": 0.4824007962035386, "z": 0.7876420171807714, "word": "Loco", "pos_group": "noun", "row_number": 90289, "definition": "A plant (Astragalus Hornii) growing in the Southwestern United States which is said to poison horses and cattle first making them insane. The name is also given vaguely to several other species of the same genus. Called also loco weed.", "details": []}, {"x": -0.6010285271890827, "y": 0.3246262042763599, "z": 0.7303304300123643, "word": "Loculament", "pos_group": "noun", "row_number": 90300, "definition": "The cell of a pericarp in which the seed is lodged.", "details": []}, {"x": -0.3696266951752188, "y": 0.305125949795435, "z": 0.8776526995203056, "word": "Loculous", "pos_group": "adjective", "row_number": 90306, "definition": "Divided by internal partitions into cells as the pith of the pokeweed.", "details": []}, {"x": -0.4931062512917952, "y": 0.4917470376119124, "z": 0.7176566560249136, "word": "Locusta", "pos_group": "noun", "row_number": 90317, "definition": "The spikelet or flower cluster of grasses.", "details": []}, {"x": -0.5424766450309756, "y": 0.2359559781143301, "z": 0.8062529789018126, "word": "Lodicule", "pos_group": "noun", "row_number": 90362, "definition": "One of the two or three delicate membranous scales which are next to the stamens in grasses.", "details": []}, {"x": -0.3460888215887012, "y": 0.4265527967187178, "z": 0.8356286490916789, "word": "Loggerheads", "pos_group": "noun", "row_number": 90411, "definition": "The knapweed.", "details": []}, {"x": -0.5863821869014626, "y": 0.4013202365850979, "z": 0.7036320050935282, "word": "Loment", "pos_group": "noun", "row_number": 90502, "definition": "An elongated pod consisting like the legume of two valves but divided transversely into small cells each containing a single seed.", "details": []}, {"x": -0.428400862323894, "y": 0.2478305867009718, "z": 0.8689376855998341, "word": "Longan", "pos_group": "noun", "row_number": 90548, "definition": "A pulpy fruit related to the litchi and produced by an evergreen East Indian tree (Nephelium Longan).", "details": []}, {"x": -0.4210089635949559, "y": 0.4994896757286645, "z": 0.7571403545005211, "word": "Loof", "pos_group": "noun", "row_number": 90639, "definition": "The spongelike fibers of the fruit of a cucurbitaceous plant (Luffa Aegyptiaca); called also vegetable sponge.", "details": []}, {"x": -0.5899725901946972, "y": 0.281822347366844, "z": 0.7566429193110855, "word": "Loosestrife", "pos_group": "noun", "row_number": 90734, "definition": "The name of several species of plants of the genus Lysimachia having small star-shaped flowers usually of a yellow color.", "details": []}, {"x": -0.3481117109120336, "y": 0.3511065822872806, "z": 0.8692194225858288, "word": "Loosestrife", "pos_group": "noun", "row_number": 90735, "definition": "Any species of the genus Lythrum having purple or in some species crimson flowers.", "details": []}, {"x": -0.5358244250890042, "y": 0.4666830150670569, "z": 0.7036328225189321, "word": "Lopseed", "pos_group": "noun", "row_number": 90782, "definition": "A perennial herb (Phryma Leptostachya) having slender seedlike fruits.", "details": []}, {"x": -0.5009058360907236, "y": 0.2268596754452625, "z": 0.835241301078391, "word": "Loquat", "pos_group": "noun", "row_number": 90791, "definition": "The fruit of the Japanese medlar (Photinia Japonica). It is as large as a small plum but grows in clusters and contains four or five large seeds. Also the tree itself.", "details": []}, {"x": -0.3645882466703384, "y": 0.4649860282683573, "z": 0.8067610575040586, "word": "Lotus", "pos_group": "noun", "row_number": 90934, "definition": "A name of several kinds of water lilies; as Nelumbium speciosum used in religious ceremonies anciently in Egypt and to this day in Asia; Nelumbium luteum the American lotus; and Nymphaea Lotus and N. caerulea the respectively white-flowered and blue-flowered lotus of modern Egypt which with Nelumbium speciosum are figured on its ancient monuments.", "details": []}, {"x": -0.6006048221748712, "y": 0.3536634002223243, "z": 0.7170746452939718, "word": "Lotus", "pos_group": "noun", "row_number": 90935, "definition": "The lotus of the lotuseaters probably a tree found in Northern Africa Sicily Portugal and Spain (Zizyphus Lotus) the fruit of which is mildly sweet. It was fabled by the ancients to make strangers who ate of it forget their native country or lose all desire to return to it.", "details": []}, {"x": -0.3888286281976637, "y": 0.2796138201578682, "z": 0.8778544352400609, "word": "Lotus", "pos_group": "noun", "row_number": 90937, "definition": "A genus (Lotus) of leguminous plants much resembling clover.", "details": []}, {"x": -0.4650716443946092, "y": 0.500224687050301, "z": 0.7303996358470632, "word": "Lousewort", "pos_group": "noun", "row_number": 90975, "definition": "Any species of Pedicularis a genus of perennial herbs. It was said to make sheep that fed on it lousy.", "details": []}, {"x": -0.5644857759620566, "y": 0.2488738684683006, "z": 0.7870308801629945, "word": "Lovage", "pos_group": "noun", "row_number": 90988, "definition": "An umbelliferous plant (Levisticum officinale) sometimes used in medicine as an aromatic stimulant.", "details": []}, {"x": -0.3415395413857731, "y": 0.3989119744210392, "z": 0.851011150534177, "word": "Lucern", "pos_group": "noun", "row_number": 91182, "definition": "A leguminous plant (Medicago sativa) having bluish purple cloverlike flowers cultivated for fodder; -- called also alfalfa.", "details": []}, {"x": -0.5709385145661278, "y": 0.429066310326757, "z": 0.6999509368002919, "word": "lucernarida", "pos_group": "other", "row_number": 91188, "definition": "A division of acalephs including Lucernaria and allied genera; -- called also Calycozoa.", "details": []}, {"x": -0.4556011196955443, "y": 0.2344548062665827, "z": 0.8587540762934787, "word": "lucernarida", "pos_group": "other", "row_number": 91189, "definition": "A more extensive group of acalephs including both the true lucernarida and the Discophora.", "details": []}, {"x": -0.396204115228123, "y": 0.4913564381088144, "z": 0.775623071991363, "word": "Lucerne", "pos_group": "noun", "row_number": 91190, "definition": "See Lucern the plant.", "details": []}, {"x": -0.59921462547846, "y": 0.3071004104133612, "z": 0.7393450957006842, "word": "Lunar", "pos_group": "adjective", "row_number": 91358, "definition": "Influenced by the moon as in growth character or properties; as lunar herbs.", "details": []}, {"x": -0.3591640540873618, "y": 0.321853007510505, "z": 0.8760204471403469, "word": "Lunary", "pos_group": "noun", "row_number": 91363, "definition": "The herb moonwort or \"\"\"\"honesty\"\"\"\".", "details": []}, {"x": -0.5101404975795129, "y": 0.4844410684969892, "z": 0.7106852495182538, "word": "Lunary", "pos_group": "noun", "row_number": 91364, "definition": "A low fleshy fern (Botrychium Lunaria) with lunate segments of the leaf or frond.", "details": []}, {"x": -0.5276015384741377, "y": 0.2298312121224663, "z": 0.8178106324413011, "word": "Lungwort", "pos_group": "noun", "row_number": 91403, "definition": "An herb of the genus Pulmonaria (P. officinalis) of Europe; -- so called because the spotted appearance of the leaves resembles that of a diseased lung.", "details": []}, {"x": -0.3507736464329634, "y": 0.4427319132052054, "z": 0.8251947055076037, "word": "Lungwort", "pos_group": "noun", "row_number": 91404, "definition": "Any plant of the genus Mertensia (esp. M. Virginica and M. Sibirica) plants nearly related to Pulmonaria. The American lungwort is Mertensia Virginica Virginia cowslip.", "details": []}, {"x": -0.5941396333652261, "y": 0.3834152347508699, "z": 0.7071003138350103, "word": "Lunulite", "pos_group": "noun", "row_number": 91422, "definition": "Any bryozoan of the genus Lunulites having a more or less circular form.", "details": []}, {"x": -0.4120548637273555, "y": 0.2578895717780533, "z": 0.8739014578582431, "word": "Lupine", "pos_group": "noun", "row_number": 91427, "definition": "A leguminous plant of the genus Lupinus especially L. albus the seeds of which have been used for food from ancient times. The common species of the Eastern United States is L. perennis. There are many species in California.", "details": []}, {"x": -0.4371455748866531, "y": 0.5023997443395497, "z": 0.7459880985944566, "word": "Lupinin", "pos_group": "noun", "row_number": 91429, "definition": "A glucoside found in the seeds of several species of lupine and extracted as a yellowish white crystalline substance.", "details": []}, {"x": -0.5823082988500137, "y": 0.2672988842183011, "z": 0.7677684231498807, "word": "Lupinine", "pos_group": "noun", "row_number": 91430, "definition": "An alkaloid found in several species of lupine (Lupinus luteus L. albus etc.) and extracted as a bitter crystalline substance.", "details": []}, {"x": -0.3430574463824399, "y": 0.3694535909403749, "z": 0.8636061791249653, "word": "Luteic", "pos_group": "adjective", "row_number": 91558, "definition": "Pertaining to or designating an acid resembling luteolin but obtained from the flowers of Euphorbia cyparissias.", "details": []}, {"x": -0.5507339756363704, "y": 0.4539833534777638, "z": 0.7004221604467132, "word": "Luteolin", "pos_group": "noun", "row_number": 91563, "definition": "A yellow dyestuff obtained from the foliage of the dyer's broom (Reseda luteola).", "details": []}, {"x": -0.4837537135536102, "y": 0.2270707776491865, "z": 0.8452344092385764, "word": "Luxuriant", "pos_group": "adjective", "row_number": 91593, "definition": "Exuberant in growth; rank; excessive; very abundant; as a luxuriant growth of grass; luxuriant foliage.", "details": []}, {"x": -0.3747579902624532, "y": 0.4772152708706783, "z": 0.7948723381664959, "word": "Lyceums", "pos_group": "other", "row_number": 91620, "definition": "of Lyceum", "details": []}, {"x": -0.6025493117557464, "y": 0.3352458465034033, "z": 0.7242544782774164, "word": "Lycea", "pos_group": "other", "row_number": 91621, "definition": "of Lyceum", "details": []}, {"x": -0.3755698938181204, "y": 0.2943809912152959, "z": 0.8787986611667918, "word": "Lychnis", "pos_group": "noun", "row_number": 91629, "definition": "A genus of Old World plants belonging to the Pink family (Caryophyllaceae). Most of the species have brilliantly colored flowers and cottony leaves which may have anciently answered as wicks for lamps. The botanical name is in common use for the garden species. The corn cockle (Lychnis Githago) is a common weed in wheat fields.", "details": []}, {"x": -0.4824701703130625, "y": 0.4967021790070863, "z": 0.7214634295151051, "word": "Lycoperdon", "pos_group": "noun", "row_number": 91633, "definition": "A genus of fungi remarkable for the great quantity of spores forming a fine dust which is thrown out like smoke when the plant is compressed or burst; puffball.", "details": []}, {"x": -0.5518709965419742, "y": 0.2391288756739607, "z": 0.7989091212363744, "word": "Lycopod", "pos_group": "noun", "row_number": 91634, "definition": "A plant of the genus Lycopodium.", "details": []}, {"x": -0.342525572630761, "y": 0.4166460118048757, "z": 0.8420702660354779, "word": "Lycopodiaceous", "pos_group": "adjective", "row_number": 91636, "definition": "Belonging or relating to the Lycopodiaceae an order of cryptogamous plants (called also club mosses) with branching stems and small crowded one-nerved and usually pointed leaves.", "details": []}, {"x": -0.5818907736525806, "y": 0.4124898171892686, "z": 0.7008960538148042, "word": "Lycopodite", "pos_group": "noun", "row_number": 91637, "definition": "An old name for a fossil club moss.", "details": []}, {"x": -0.4382431353431685, "y": 0.2409982736454187, "z": 0.865946179865999, "word": "Lycopodium", "pos_group": "noun", "row_number": 91638, "definition": "A genus of mosslike plants the type of the order Lycopodiaceae; club moss.", "details": []}, {"x": -0.4106370418973812, "y": 0.4981232798582343, "z": 0.7637083329943728, "word": "Lygodium", "pos_group": "noun", "row_number": 91649, "definition": "A genus of ferns with twining or climbing fronds bearing stalked and variously-lobed divisions in pairs.", "details": []}, {"x": -0.5950761539346658, "y": 0.2904050686091942, "z": 0.7493659100495667, "word": "Lyme grass", "pos_group": "other", "row_number": 91659, "definition": "A coarse perennial grass of several species of Elymus esp. E. Canadensis and the European E. arenarius.", "details": []}, {"x": -0.3506132967192791, "y": 0.3395450298105144, "z": 0.8727997988626117, "word": "Lyrated", "pos_group": "adjective", "row_number": 91698, "definition": "Lyre-shaped or spatulate and oblong with small lobes toward the base; as a lyrate leaf.", "details": []}, {"x": -0.5266802383063778, "y": 0.4748807436338351, "z": 0.7050504988320431, "word": "Macropetalous", "pos_group": "adjective", "row_number": 91885, "definition": "Having long or large petals.", "details": []}, {"x": -0.51154309474017, "y": 0.2260666583660392, "z": 0.8289858431836226, "word": "Macrosporangium", "pos_group": "noun", "row_number": 91899, "definition": "A sporangium or conceptacle containing only large spores; -- opposed to microsporangium. Both are found in the genera Selaginella Isoctes and Marsilia plants remotely allied to ferns.", "details": []}, {"x": -0.3576989915723509, "y": 0.4576848769064416, "z": 0.8139877056069449, "word": "Macrospore", "pos_group": "noun", "row_number": 91900, "definition": "One of the specially large spores of certain flowerless plants as Selaginella etc.", "details": []}, {"x": -0.5997759188440266, "y": 0.3649576347071415, "z": 0.7120918283787366, "word": "Madder", "pos_group": "noun", "row_number": 91956, "definition": "A plant of the Rubia (R. tinctorum). The root is much used in dyeing red and formerly was used in medicine. It is cultivated in France and Holland. See Rubiaceous.", "details": []}, {"x": -0.396596361547508, "y": 0.2699906315164983, "z": 0.8773918080883825, "word": "Madderwort", "pos_group": "noun", "row_number": 91957, "definition": "A name proposed for any plant of the same natural order (Rubiaceae) as the madder.", "details": []}, {"x": -0.4540953398722301, "y": 0.5028503013701661, "z": 0.7354855516719936, "word": "Madia", "pos_group": "noun", "row_number": 91980, "definition": "A genus of composite plants of which one species (Madia sativa) is cultivated for the oil yielded from its seeds by pressure. This oil is sometimes used instead of olive oil for the table.", "details": []}, {"x": -0.5725565507664014, "y": 0.2543605865380714, "z": 0.7794098332652015, "word": "Madnep", "pos_group": "noun", "row_number": 91987, "definition": "The masterwort (Peucedanum Ostruthium).", "details": []}, {"x": -0.3402690940829226, "y": 0.3879230637314761, "z": 0.8565819518511771, "word": "Madreporic", "pos_group": "adjective", "row_number": 91999, "definition": "Resembling or pertaining to the genus Madrepora.", "details": []}, {"x": -0.5643895152990497, "y": 0.4395170781441876, "z": 0.6987769408331244, "word": "Madwort", "pos_group": "noun", "row_number": 92014, "definition": "A genus of cruciferous plants (Alyssum) with white or yellow flowers and rounded pods. A. maritimum is the commonly cultivated sweet alyssum a fragrant white-flowered annual.", "details": []}, {"x": -0.4661844611673157, "y": 0.22976552572149, "z": 0.8543300599628147, "word": "Maghet", "pos_group": "noun", "row_number": 92053, "definition": "A name for daisies and camomiles of several kinds.", "details": []}, {"x": -0.3867978546209092, "y": 0.4875482668769665, "z": 0.7827414050156848, "word": "Maguey", "pos_group": "noun", "row_number": 92190, "definition": "The century plant a species of Agave (A. Americana). See Agave.", "details": []}, {"x": -0.6021524368122845, "y": 0.3171407200426078, "z": 0.7326897068554218, "word": "Mahonia", "pos_group": "noun", "row_number": 92217, "definition": "The Oregon grape a species of barberry (Berberis Aquifolium) often cultivated for its hollylike foliage.", "details": []}, {"x": -0.3638940992194884, "y": 0.3105846010143322, "z": 0.8781334125097422, "word": "Mahon stock", "pos_group": "other", "row_number": 92218, "definition": "An annual cruciferous plant with reddish purple or white flowers (Malcolmia maritima). It is called in England Virginia stock but the plant comes from the Mediterranean.", "details": []}, {"x": -0.4998762507693443, "y": 0.4907481065914293, "z": 0.7136455911681306, "word": "Maidenhair", "pos_group": "noun", "row_number": 92246, "definition": "A fern of the genus Adiantum (A. pedatum) having very slender graceful stalks. It is common in the United States and is sometimes used in medicine. The name is also applied to other species of the same genus as to the Venus-hair.", "details": []}, {"x": -0.5376613671060726, "y": 0.2315337809414208, "z": 0.8107480265807615, "word": "Maid's hair", "pos_group": "other", "row_number": 92262, "definition": "The yellow bedstraw (Galium verum).", "details": []}, {"x": -0.3458568516150449, "y": 0.4336414557722572, "z": 0.8320685825258913, "word": "Maize", "pos_group": "noun", "row_number": 92364, "definition": "A large species of American grass of the genus Zea (Z. Mays) widely cultivated as a forage and food plant; Indian corn. Also its seed growing on cobs and used as food for men animals.", "details": []}, {"x": -0.5909791154711882, "y": 0.3948519100941367, "z": 0.7034455587832679, "word": "Male", "pos_group": "other", "row_number": 92531, "definition": "Capable of producing fertilization but not of bearing fruit; -- said of stamens and antheridia and of the plants or parts of plants which bear them.", "details": []}, {"x": -0.421288378699919, "y": 0.2498465924352809, "z": 0.8718330013373388, "word": "Male", "pos_group": "noun", "row_number": 92536, "definition": "A plant bearing only staminate flowers.", "details": []}, {"x": -0.4263401283574102, "y": 0.5025520561812904, "z": 0.7521140377496913, "word": "Mallows", "pos_group": "noun", "row_number": 92663, "definition": "A genus of plants (Malva) having mucilaginous qualities. See Malvaceous.", "details": []}, {"x": -0.5886605856053508, "y": 0.2748528161079588, "z": 0.7602201289312787, "word": "Mallowwort", "pos_group": "noun", "row_number": 92664, "definition": "Any plant of the order Malvaceae.", "details": []}, {"x": -0.3441509526252035, "y": 0.3578901514851786, "z": 0.8680292398744877, "word": "Malpighia", "pos_group": "noun", "row_number": 92676, "definition": "A genus of tropical American shrubs with opposite leaves and small white or reddish flowers. The drupes of Malpighia urens are eaten under the name of Barbadoes cherries.", "details": []}, {"x": -0.5424175562463532, "y": 0.4632133323607922, "z": 0.700868463692685, "word": "Malvaceous", "pos_group": "adjective", "row_number": 92711, "definition": "Pertaining to or resembling a natural order of plants (Malvaceae) of which the mallow is the type. The cotton plant hollyhock and abutilon are of this order and the baobab and the silk-cotton trees are now referred to it.", "details": []}, {"x": -0.4945789373460099, "y": 0.2247570896425042, "z": 0.8395688925806641, "word": "Manchineel", "pos_group": "noun", "row_number": 92822, "definition": "A euphorbiaceous tree (Hippomane Mancinella) of tropical America having a poisonous and blistering milky juice and poisonous acrid fruit somewhat resembling an apple.", "details": []}, {"x": -0.3667633790462759, "y": 0.4711245316168043, "z": 0.8022009096849769, "word": "Mandarin", "pos_group": "noun", "row_number": 92834, "definition": "A small orange with easily separable rind. It is thought to be of Chinese origin and is counted a distinct species (Citrus nobilis)mandarin orange; tangerine --.", "details": []}, {"x": -0.6031629777717815, "y": 0.3462762320425139, "z": 0.718531275149465, "word": "Mandragora", "pos_group": "noun", "row_number": 92871, "definition": "A genus of plants; the mandrake. See Mandrake 1.", "details": []}, {"x": -0.3823158106793612, "y": 0.2839360263225469, "z": 0.8793264205406004, "word": "Mandrake", "pos_group": "noun", "row_number": 92873, "definition": "A low plant (Mandragora officinarum) of the Nightshade family having a fleshy root often forked and supposed to resemble a man. It was therefore supposed to have animal life and to cry out when pulled up. All parts of the plant are strongly narcotic. It is found in the Mediterranean region.", "details": []}, {"x": -0.4715579067216335, "y": 0.5008040894657455, "z": 0.7258294597098527, "word": "Mandrake", "pos_group": "noun", "row_number": 92874, "definition": "The May apple (Podophyllum peltatum). See May apple under May and Podophyllum.", "details": []}, {"x": -0.5608698243211203, "y": 0.2432602588847985, "z": 0.7913592651971014, "word": "Manioc", "pos_group": "noun", "row_number": 93022, "definition": "The tropical plants (Manihot utilissima and M. Aipi) from which cassava and tapioca are prepared; also cassava.", "details": []}, {"x": -0.3398222227765293, "y": 0.4061793360990233, "z": 0.8482565672208943, "word": "Manna", "pos_group": "noun", "row_number": 93059, "definition": "A name given to lichens of the genus Lecanora sometimes blown into heaps in the deserts of Arabia and Africa and gathered and used as food.", "details": []}, {"x": -0.5765270066080038, "y": 0.4235264311112041, "z": 0.6987431379282528, "word": "Manna", "pos_group": "noun", "row_number": 93060, "definition": "A sweetish exudation in the form of pale yellow friable flakes coming from several trees and shrubs and used in medicine as a gentle laxative as the secretion of Fraxinus Ornus and F. rotundifolia the manna ashes of Southern Europe.", "details": []}, {"x": -0.4485119830060224, "y": 0.2349223986742091, "z": 0.862350548037839, "word": "Manna croup", "pos_group": "other", "row_number": 93062, "definition": "The husked grains of manna grass.", "details": []}, {"x": -0.4005089377681227, "y": 0.4957743971089282, "z": 0.7705844132469388, "word": "Manubrial", "pos_group": "adjective", "row_number": 93181, "definition": "Of or pertaining to a manubrium; shaped like a manubrium; handlelike.", "details": []}, {"x": -0.5993935541128198, "y": 0.2996802612835764, "z": 0.7422392527244901, "word": "Manzanita", "pos_group": "noun", "row_number": 93246, "definition": "A name given to several species of Arctostaphylos but mostly to A. glauca and A. pungens shrubs of California Oregon etc. with reddish smooth bark ovate or oval coriaceous evergreen leaves and bearing clusters of red berries which are said to be a favorite food of the grizzly bear.", "details": []}, {"x": -0.3540307021696638, "y": 0.3279452517087793, "z": 0.8758505430739427, "word": "Marabou", "pos_group": "noun", "row_number": 93269, "definition": "A large stork of the genus Leptoptilos (formerly Ciconia) esp. the African species (L. crumenifer) which furnishes plumes worn as ornaments. The Asiatic species (L. dubius or L. argala) is the adjutant. See Adjutant.", "details": []}, {"x": -0.5169720403875397, "y": 0.482442229395732, "z": 0.707099289176011, "word": "Maranta", "pos_group": "noun", "row_number": 93275, "definition": "A genus of endogenous plants found in tropical America and some species also in India. They have tuberous roots containing a large amount of starch and from one species (Maranta arundinacea) arrowroot is obtained. Many kinds are cultivated for ornament.", "details": []}, {"x": -0.5220962012185271, "y": 0.2262504637355271, "z": 0.8223297904932316, "word": "Marechal Niel", "pos_group": "other", "row_number": 93352, "definition": "A kind of large yellow rose.", "details": []}, {"x": -0.3514983490040033, "y": 0.4495796989019541, "z": 0.821174162393513, "word": "Mare's-tail", "pos_group": "noun", "row_number": 93358, "definition": "An aquatic plant of the genus Hippuris (H. vulgaris) having narrow leaves in whorls.", "details": []}, {"x": -0.5980157788461741, "y": 0.3764606398429709, "z": 0.7075694417511434, "word": "Margarodite", "pos_group": "noun", "row_number": 93367, "definition": "A hidrous potash mica related to muscovite.", "details": []}, {"x": -0.4050488846841321, "y": 0.260864093705
