 seed; -- sometimes limited to the outer coat or testa.", "details": []}, {"x": -0.5154174149196581, "y": 0.1860299891737729, "z": 0.8365032764583431, "word": "Spermophyta", "pos_group": "other", "row_number": 146060, "definition": "Plants which produce seed; phaenogamia. These plants constitute the highest grand division of the vegetable kingdom.", "details": []}, {"x": -0.3256761411170789, "y": 0.4831143663738101, "z": 0.812733388086352, "word": "Spermophyte", "pos_group": "noun", "row_number": 146061, "definition": "Any plant which produces true seeds; -- a term recently proposed to replace ph/nogam.", "details": []}, {"x": -0.6316767386622546, "y": 0.3586417331784767, "z": 0.6872849518618577, "word": "Sphagnicolous", "pos_group": "adjective", "row_number": 146098, "definition": "Growing in moss of the genus Sphagnum.", "details": []}, {"x": -0.3701255244325375, "y": 0.24504631153216, "z": 0.8960800195116633, "word": "Sphagnous", "pos_group": "adjective", "row_number": 146099, "definition": "Pertaining to moss of the genus Sphagnum or bog moss; abounding in peat or bog moss.", "details": []}, {"x": -0.4497970025630899, "y": 0.5371033973567706, "z": 0.713584330708764, "word": "Sphagnum", "pos_group": "noun", "row_number": 146100, "definition": "A genus of mosses having white leaves slightly tinged with red or green and found growing in marshy places; bog moss; peat moss.", "details": []}, {"x": -0.5939105898185155, "y": 0.2199499069554601, "z": 0.7738812891727692, "word": "Sphrigosis", "pos_group": "noun", "row_number": 146176, "definition": "A condition of vegetation in which there is too abundant growth of the stem and leaves accompanied by deficiency of flowers and fruit.", "details": []}, {"x": -0.3016380220367292, "y": 0.3955840991477219, "z": 0.8674835584397291, "word": "Spicknel", "pos_group": "noun", "row_number": 146212, "definition": "An umbelliferous herb (Meum Athamanticum) having finely divided leaves common in Europe; -- called also baldmoney mew and bearwort.", "details": []}, {"x": -0.5885633405063612, "y": 0.4537773628193149, "z": 0.6690884091095441, "word": "Spiderwort", "pos_group": "noun", "row_number": 146243, "definition": "An American endogenous plant (Tradescantia Virginica) with long linear leaves and ephemeral blue flowers. The name is sometimes extended to other species of the same genus.", "details": []}, {"x": -0.4577129091307886, "y": 0.1922435959058418, "z": 0.8680675622601168, "word": "Spignet", "pos_group": "noun", "row_number": 146250, "definition": "An aromatic plant of America. See Spikenard.", "details": []}, {"x": -0.3636848893524405, "y": 0.5197806744452578, "z": 0.7730209258033939, "word": "Spike", "pos_group": "noun", "row_number": 146256, "definition": "A kind of flower cluster in which sessile flowers are arranged on an unbranched elongated axis.", "details": []}, {"x": -0.6332579126570411, "y": 0.2982820188669869, "z": 0.7141514218132466, "word": "Spike", "pos_group": "noun", "row_number": 146263, "definition": "Spike lavender. See Lavender.", "details": []}, {"x": -0.3296919249923187, "y": 0.297335553372664, "z": 0.8960439739741745, "word": "Spikelet", "pos_group": "noun", "row_number": 146268, "definition": "A small or secondary spike; especially one of the ultimate parts of the in florescence of grasses. See Illust. of Quaking grass.", "details": []}, {"x": -0.5077740434648678, "y": 0.5202954005922238, "z": 0.6866281503884878, "word": "Spikenard", "pos_group": "noun", "row_number": 146269, "definition": "An aromatic plant. In the United States it is the Aralia racemosa often called spignet and used as a medicine. The spikenard of the ancients is the Nardostachys Jatamansi a native of the Himalayan region. From its blackish roots a perfume for the hair is still prepared in India.", "details": []}, {"x": -0.5487622816521754, "y": 0.1923730516954869, "z": 0.8135432177931691, "word": "Spinaceous", "pos_group": "adjective", "row_number": 146323, "definition": "Of pertaining to or resembling the plant spinach or the family of plants to which it belongs.", "details": []}, {"x": -0.3101547315186023, "y": 0.4530111197422404, "z": 0.8358139553193075, "word": "Spinage", "pos_group": "noun", "row_number": 146325, "definition": "A common pot herb (Spinacia oleracea) belonging to the Goosefoot family.", "details": []}, {"x": -0.621084406436262, "y": 0.396597578160423, "z": 0.6759915096205005, "word": "Spine", "pos_group": "noun", "row_number": 146352, "definition": "A sharp appendage to any of a plant; a thorn.", "details": []}, {"x": -0.4011452965151593, "y": 0.219074954337751, "z": 0.8894316249525184, "word": "Spiraea", "pos_group": "noun", "row_number": 146419, "definition": "A genus of shrubs or perennial herbs including the meadowsweet and the hardhack.", "details": []}, {"x": -0.4145092302815978, "y": 0.5373416162644347, "z": 0.7344699350155065, "word": "Spiranthy", "pos_group": "noun", "row_number": 146430, "definition": "The occasional twisted growth of the parts of a flower.", "details": []}, {"x": -0.6147990360899729, "y": 0.2454778835604084, "z": 0.7495083414516097, "word": "Spleenwort", "pos_group": "noun", "row_number": 146635, "definition": "Any fern of the genus Asplenium some species of which were anciently used as remedies for disorders of the spleen.", "details": []}, {"x": -0.3059972795188054, "y": 0.3575921014964212, "z": 0.882322817269543, "word": "Spoonwood", "pos_group": "noun", "row_number": 146893, "definition": "The mountain laurel (Kalmia latifolia).", "details": []}, {"x": -0.5611080536398833, "y": 0.4841776995113496, "z": 0.6713640647490443, "word": "Sporadic", "pos_group": "adjective", "row_number": 146901, "definition": "Occuring singly or apart from other things of the same kind or in scattered instances; separate; single; as a sporadic fireball; a sporadic case of disease; a sporadic example of a flower.", "details": []}, {"x": -0.4937179204572168, "y": 0.1853077794432665, "z": 0.8496491286979626, "word": "Sporangium", "pos_group": "noun", "row_number": 146906, "definition": "A spore case in the cryptogamous plants as in ferns etc.", "details": []}, {"x": -0.3379125271705718, "y": 0.4994999524687774, "z": 0.7976935009543996, "word": "Spore", "pos_group": "noun", "row_number": 146907, "definition": "One of the minute grains in flowerless plants which are analogous to seeds as serving to reproduce the species.", "details": []}, {"x": -0.6351245032345904, "y": 0.3350331253825882, "z": 0.6959667163646475, "word": "Spore", "pos_group": "noun", "row_number": 146908, "definition": "An embryo sac or embryonal vesicle in the ovules of flowering plants.", "details": []}, {"x": -0.3525894122865606, "y": 0.263315417100112, "z": 0.8979675369749243, "word": "Sporidium", "pos_group": "noun", "row_number": 146914, "definition": "A secondary spore or a filament produced from a spore in certain kinds of minute fungi.", "details": []}, {"x": -0.4720034558586891, "y": 0.5336105350083775, "z": 0.701763873810506, "word": "Sporophore", "pos_group": "noun", "row_number": 146925, "definition": "That alternately produced form of certain cryptogamous plants as ferns mosses and the like which is nonsexual but produces spores in countless numbers. In ferns it is the leafy plant in mosses the capsule. Cf. Oophore.", "details": []}, {"x": -0.5784878435166682, "y": 0.2066643162946844, "z": 0.7890764698518677, "word": "Sport", "pos_group": "noun", "row_number": 146937, "definition": "A plant or an animal or part of a plant or animal which has some peculiarity not usually seen in the species; an abnormal variety or growth. See Sporting plant under Sporting.", "details": []}, {"x": -0.3019624392308603, "y": 0.4185118169147093, "z": 0.8565433698281119, "word": "Sport", "pos_group": "other", "row_number": 146944, "definition": "To assume suddenly a new and different character from the rest of the plant or from the type of the species; -- said of a bud shoot plant or animal. See Sport n. 6.", "details": []}, {"x": -0.603302367466435, "y": 0.4330866883656539, "z": 0.6696731842995253, "word": "Sprawl", "pos_group": "other", "row_number": 147034, "definition": "To spread irregularly as vines plants or tress; to spread ungracefully as chirography.", "details": []}, {"x": -0.4354381811375226, "y": 0.1996645106006496, "z": 0.8777970571916092, "word": "Spread", "pos_group": "other", "row_number": 147053, "definition": "To diffuse as emanations or effluvia; to emit; as odoriferous plants spread their fragrance.", "details": []}, {"x": -0.3815858112841443, "y": 0.52936992312242, "z": 0.7577332994662334, "word": "Spring", "pos_group": "other", "row_number": 147105, "definition": "To shoot up out or forth; to come to the light; to begin to appear; to emerge; as a plant from its seed as streams from their source and the like; -often followed by up forth or out.", "details": []}, {"x": -0.6289259769458296, "y": 0.2765521943695976, "z": 0.726616129267782, "word": "Spring", "pos_group": "other", "row_number": 147126, "definition": "The season of the year when plants begin to vegetate and grow; the vernal season usually comprehending the months of March April and May in the middle latitudes north of the equator.", "details": []}, {"x": -0.3179644580431507, "y": 0.3196320546984382, "z": 0.8925995479668247, "word": "Springer", "pos_group": "noun", "row_number": 147141, "definition": "A young plant.", "details": []}, {"x": -0.5291950640902283, "y": 0.5089827817422238, "z": 0.678888143976964, "word": "Springing", "pos_group": "noun", "row_number": 147152, "definition": "Growth; increase; also that which springs up; a shoot; a plant.", "details": []}, {"x": -0.5286875267783517, "y": 0.1865928579139436, "z": 0.828053503346551, "word": "Sprout", "pos_group": "other", "row_number": 147200, "definition": "To cause to sprout; as the rain will sprout the seed.", "details": []}, {"x": -0.3181265500743302, "y": 0.4726907693968772, "z": 0.8218022479068751, "word": "Spur", "pos_group": "noun", "row_number": 147263, "definition": "Any projecting appendage of a flower looking like a spur.", "details": []}, {"x": -0.6291971319378697, "y": 0.3731899523396394, "z": 0.6817919247350299, "word": "Spurge", "pos_group": "noun", "row_number": 147277, "definition": "Any plant of the genus Euphorbia. See Euphorbia.", "details": []}, {"x": -0.3809944440548287, "y": 0.2337525076982284, "z": 0.8945406635498141, "word": "Spurgewort", "pos_group": "noun", "row_number": 147278, "definition": "Any euphorbiaceous plant.", "details": []}, {"x": -0.4359059505534798, "y": 0.5389452389355806, "z": 0.720780154902129, "word": "Spurry", "pos_group": "noun", "row_number": 147302, "definition": "An annual herb (Spergula arvensis) with whorled filiform leaves sometimes grown in Europe for fodder.", "details": []}, {"x": -0.6031862844677878, "y": 0.2282678122904701, "z": 0.764238256110009, "word": "Squamella", "pos_group": "noun", "row_number": 147401, "definition": "A diminutive scale or bractlet such as those found on the receptacle in many composite plants; a palea.", "details": []}, {"x": -0.3015120526110554, "y": 0.3812102598240631, "z": 0.8739389108714284, "word": "Squamula", "pos_group": "noun", "row_number": 147417, "definition": "One of the little hypogynous scales found in the flowers of grasses; a lodicule.", "details": []}, {"x": -0.579130049778957, "y": 0.4663944406739308, "z": 0.6686438597276386, "word": "Squash", "pos_group": "noun", "row_number": 147484, "definition": "A plant and its fruit of the genus Cucurbita or gourd kind.", "details": []}, {"x": -0.4714121268912823, "y": 0.1877496660610318, "z": 0.8616963905656149, "word": "Squawberry", "pos_group": "noun", "row_number": 147512, "definition": "A local name for the partridge berry; also for the deerberry.", "details": []}, {"x": -0.3525752758641317, "y": 0.5135248728320998, "z": 0.7822933464066449, "word": "Squill", "pos_group": "noun", "row_number": 147578, "definition": "A European bulbous liliaceous plant (Urginea formerly Scilla maritima) of acrid expectorant diuretic and emetic properties used in medicine. Called also sea onion.", "details": []}, {"x": -0.6355999564524868, "y": 0.31174144180883, "z": 0.7062789596303637, "word": "Squill", "pos_group": "noun", "row_number": 147579, "definition": "Any bulbous plant of the genus Scilla; as the bluebell squill (S. mutans).", "details": []}, {"x": -0.3370103946672362, "y": 0.2834785545437169, "z": 0.8978106164442692, "word": "Squinancy", "pos_group": "noun", "row_number": 147588, "definition": "A European perennial herb (Asperula cynanchica) with narrowly linear whorled leaves; -- formerly thought to cure the quinsy. Also called quincewort.", "details": []}, {"x": -0.4942965499601972, "y": 0.5270070086195106, "z": 0.6913280940070073, "word": "Staggerbush", "pos_group": "noun", "row_number": 147786, "definition": "An American shrub (Andromeda Mariana) having clusters of nodding white flowers. It grows in low sandy places and is said to poison lambs and calves.", "details": []}, {"x": -0.560979653475736, "y": 0.1960723755653096, "z": 0.804274487924626, "word": "Stag-horn coral", "pos_group": "other", "row_number": 147789, "definition": "Alt. of Stag-horn fern", "details": []}, {"x": -0.3052763011750484, "y": 0.4405781340831269, "z": 0.8442140058709707, "word": "Stalk", "pos_group": "noun", "row_number": 147891, "definition": "The stem or main axis of a plant; as a stalk of wheat rye or oats; the stalks of maize or hemp.", "details": []}, {"x": -0.6157181616569626, "y": 0.410972119922024, "z": 0.672304292751852, "word": "Stalk", "pos_group": "noun", "row_number": 147892, "definition": "The petiole pedicel or peduncle of a plant.", "details": []}, {"x": -0.4135998911987111, "y": 0.2100474133814217, "z": 0.8858979704978382, "word": "Stalk", "pos_group": "noun", "row_number": 147893, "definition": "That which resembes the stalk of a plant as the stem of a quill.", "details": []}, {"x": -0.401167054093043, "y": 0.5360146549943856, "z": 0.7428009722271229, "word": "Stalk", "pos_group": "noun", "row_number": 147894, "definition": "An ornament in the Corinthian capital resembling the stalk of a plant from which the volutes and helices spring.", "details": []}, {"x": -0.6216790684044168, "y": 0.2562026496668623, "z": 0.740186015952406, "word": "Stalked", "pos_group": "adjective", "row_number": 147907, "definition": "Having a stalk or stem; borne upon a stem.", "details": []}, {"x": -0.3088557945195385, "y": 0.3428381759337822, "z": 0.8871697037850772, "word": "Stamen", "pos_group": "noun", "row_number": 147956, "definition": "The male organ of flowers for secreting and furnishing the pollen or fecundating dust. It consists of the anther and filament.", "details": []}, {"x": -0.5496693462055587, "y": 0.4949478089940206, "z": 0.6729712298560556, "word": "Staminate", "pos_group": "adjective", "row_number": 147963, "definition": "Furnished with stamens; producing stamens.", "details": []}, {"x": -0.5073896419430195, "y": 0.1839182862689521, "z": 0.8418609239208258, "word": "Standergrass", "pos_group": "noun", "row_number": 148097, "definition": "A plant (Orchis mascula); -- called also standerwort and long purple. See Long purple under Long.", "details": []}, {"x": -0.328849612301962, "y": 0.4905129227569695, "z": 0.8070037206216987, "word": "Stapelia", "pos_group": "noun", "row_number": 148150, "definition": "An extensive and curious genus of African plants of the natural order Asclepiadaceae (Milkweed family). They are succulent plants without leaves frequently covered with dark tubercles giving them a very grotesque appearance. The odor of the blossoms is like that of carrion.", "details": []}, {"x": -0.6344753790661039, "y": 0.3494155703002274, "z": 0.6894561281116375, "word": "Starlike", "pos_group": "adjective", "row_number": 148242, "definition": "Resembling a star; stellated; radiated like a star; as starlike flowers.", "details": []}, {"x": -0.3622723960049839, "y": 0.2508291865594093, "z": 0.8976878245040161, "word": "Starwort", "pos_group": "noun", "row_number": 148318, "definition": "Any plant of the genus Aster. See Aster.", "details": []}, {"x": -0.45803066026985, "y": 0.5373770887226083, "z": 0.7081198901095628, "word": "Starwort", "pos_group": "noun", "row_number": 148319, "definition": "A small plant of the genus Stellaria having star-shaped flowers; star flower; chickweed.", "details": []}, {"x": -0.5890705635840029, "y": 0.2133362683654498, "z": 0.7794122835308218, "word": "Statoblast", "pos_group": "noun", "row_number": 148431, "definition": "One of a peculiar kind of internal buds or germs produced in the interior of certain Bryozoa and sponges especially in the fresh-water species; -- also called winter buds.", "details": []}, {"x": -0.2999905621649912, "y": 0.4046404508664793, "z": 0.8638702264428986, "word": "Stellated", "pos_group": "adjective", "row_number": 148749, "definition": "Starlike; having similar parts radiating from a common center; as stellate flowers.", "details": []}, {"x": -0.5952843940174792, "y": 0.4466092332174475, "z": 0.6679645821779521, "word": "Stem", "pos_group": "noun", "row_number": 148777, "definition": "That part of a plant which bears leaves or rudiments of leaves whether rising above ground or wholly subterranean.", "details": []}, {"x": -0.4488965076050986, "y": 0.1933325173869297, "z": 0.8724187430246888, "word": "Stem-clasping", "pos_group": "adjective", "row_number": 148788, "definition": "Embracing the stem with its base; amplexicaul; as a leaf or petiole.", "details": []}, {"x": -0.3694158535607377, "y": 0.5249195288263602, "z": 0.7668059828892205, "word": "Stephanotis", "pos_group": "noun", "row_number": 148872, "definition": "A genus of climbing asclepiadaceous shrubs of Madagascar Malaya etc. They have fleshy or coriaceous opposite leaves and large white waxy flowers in cymes.", "details": []}, {"x": -0.6330730875877308, "y": 0.2891874819419711, "z": 0.7180453091972674, "word": "Stephanotis", "pos_group": "noun", "row_number": 148873, "definition": "A perfume said to be prepared from the flowers of Stephanotis floribunda.", "details": []}, {"x": -0.3236813506635969, "y": 0.3051847254947772, "z": 0.8955962631438716, "word": "Sterculiaceous", "pos_group": "adjective", "row_number": 148898, "definition": "Of or pertaining to a natural order (Sterculiaceae) of polypetalous exogenous plants mostly tropical. The cacao (Theobroma Cacao) is the most useful plant of the order.", "details": []}, {"x": -0.5162743058141823, "y": 0.5173896100452295, "z": 0.6824725874152964, "word": "Sterile", "pos_group": "adjective", "row_number": 148954, "definition": "Incapable of reproduction; unfitted for reproduction of offspring; not able to germinate or bear fruit; unfruitful; as a sterile flower which bears only stamens.", "details": []}, {"x": -0.5416859697522017, "y": 0.1883824263074087, "z": 0.8191998362012475, "word": "Stichwort", "pos_group": "noun", "row_number": 149090, "definition": "A kind of chickweed (Stellaria Holostea).", "details": []}, {"x": -0.3115392861771863, "y": 0.4613789222447919, "z": 0.8307061834827302, "word": "Stick-seed", "pos_group": "noun", "row_number": 149139, "definition": "A plant (Echinospermum Lappula) of the Borage family with small blue flowers and prickly nutlets.", "details": []}, {"x": -0.6255701521143927, "y": 0.3878213423759467, "z": 0.6769465201781409, "word": "Stigma", "pos_group": "other", "row_number": 149184, "definition": "That part of a pistil which has no epidermis and is fitted to receive the pollen. It is usually the terminal portion and is commonly somewhat glutinous or viscid. See Illust. of Stamen and of Flower.", "details": []}, {"x": -0.3925932180699242, "y": 0.2232247229480722, "z": 0.8922114593470862, "word": "Stigmaria", "pos_group": "noun", "row_number": 149192, "definition": "The fossil root stem of a coal plant of the genus Sigillaria.", "details": []}, {"x": -0.4220863733509059, "y": 0.5395742453707744, "z": 0.728493464050323, "word": "Stinkhorn", "pos_group": "noun", "row_number": 149343, "definition": "A kind of fungus of the genus Phallus which emits a fetid odor.", "details": []}, {"x": -0.6116266956900622, "y": 0.2376084420411603, "z": 0.7546224310143641, "word": "Stinkweed", "pos_group": "noun", "row_number": 149350, "definition": "Stramonium. See Jamestown weed and Datura.", "details": []}, {"x": -0.3025467616648526, "y": 0.3665413739133858, "z": 0.8798368474983291, "word": "Stipe", "pos_group": "noun", "row_number": 149367, "definition": "The stalk or petiole of a frond as of a fern.", "details": []}, {"x": -0.5688206245432695, "y": 0.4784238101308587, "z": 0.6689945851754533, "word": "Stipe", "pos_group": "noun", "row_number": 149368, "definition": "The stalk of a pistil.", "details": []}, {"x": -0.485242736605025, "y": 0.1844178508676076, "z": 0.8547102098684903, "word": "Stipe", "pos_group": "noun", "row_number": 149370, "definition": "The stem of a fungus or mushroom.", "details": []}, {"x": -0.3421484887254908, "y": 0.5061431188675877, "z": 0.7916776837108986, "word": "Stipitate", "pos_group": "adjective", "row_number": 149384, "definition": "Supported by a stipe; elevated on a stipe as the fronds of most ferns or the pod of certain cruciferous plants.", "details": []}, {"x": -0.6368036791345159, "y": 0.3256992286567679, "z": 0.6988569858655854, "word": "Stipitiform", "pos_group": "adjective", "row_number": 149385, "definition": "Having the shape of a stalk; stalklike.", "details": []}, {"x": -0.3453249548114687, "y": 0.2700129798906666, "z": 0.8988012384698963, "word": "Stipule", "pos_group": "noun", "row_number": 149410, "definition": "An appendage at the base of petioles or leaves usually somewhat resembling a small leaf in texture and appearance.", "details": []}, {"x": -0.480488803500633, "y": 0.532642952415774, "z": 0.6967223227027661, "word": "Stock", "pos_group": "noun", "row_number": 149504, "definition": "Any cruciferous plant of the genus Matthiola; as common stock (Matthiola incana) (see Gilly-flower); ten-weeks stock (M. annua).", "details": []}, {"x": -0.5726879340236648, "y": 0.2009668200425367, "z": 0.794758370491118, "word": "Stoma", "pos_group": "noun", "row_number": 149585, "definition": "The line of dehiscence of the sporangium of a fern. It is usually marked by two transversely elongated cells. See Illust. of Sporangium.", "details": []}, {"x": -0.3014792983004452, "y": 0.4274586206389651, "z": 0.8522847882824756, "word": "Stonecrop", "pos_group": "noun", "row_number": 149666, "definition": "Any low succulent plant of the genus Sedum esp. Sedum acre which is common on bare rocks in Europe and is spreading in parts of America. See Orpine.", "details": []}, {"x": -0.6092663774548013, "y": 0.4251639015407691, "z": 0.6693505345704407, "word": "Stoneroot", "pos_group": "noun", "row_number": 149678, "definition": "A North American plant (Collinsonia Canadensis) having a very hard root; horse balm. See Horse balm under Horse.", "details": []}, {"x": -0.4265740055234455, "y": 0.2019763285389683, "z": 0.8816122620072854, "word": "Stoneweed", "pos_group": "noun", "row_number": 149684, "definition": "Any plant of the genus Lithospermum herbs having a fruit composed of four stony nutlets.", "details": []}, {"x": -0.3881447221153348, "y": 0.5334599952747602, "z": 0.7515078896029386, "word": "Stonewort", "pos_group": "noun", "row_number": 149686, "definition": "Any plant of the genus Chara; -- so called because they are often incrusted with carbonate of lime. See Chara.", "details": []}, {"x": -0.6275678966124804, "y": 0.2677815672443792, "z": 0.7310619449715128, "word": "Stramonium", "pos_group": "noun", "row_number": 150047, "definition": "A poisonous plant (Datura Stramonium); stinkweed. See Datura and Jamestown weed.", "details": []}, {"x": -0.3128565100967668, "y": 0.3280526990901947, "z": 0.8913485461421419, "word": "Strap", "pos_group": "noun", "row_number": 150104, "definition": "The leaf exclusive of its sheath in some grasses.", "details": []}, {"x": -0.5375377250390876, "y": 0.50491020581223, "z": 0.6753657366393809, "word": "Straw", "pos_group": "noun", "row_number": 150165, "definition": "A stalk or stem of certain species of grain pulse etc. especially of wheat rye oats barley more rarely of buckwheat beans and pease.", "details": []}, {"x": -0.5209410072065785, "y": 0.1837518160454227, "z": 0.8335800724049276, "word": "Strawberry", "pos_group": "noun", "row_number": 150168, "definition": "A fragrant edible berry of a delicious taste and commonly of a red color the fruit of a plant of the genus Fragaria of which there are many varieties. Also the plant bearing the fruit. The common American strawberry is Fragaria virginiana; the European F. vesca. There are also other less common species.", "details": []}, {"x": -0.3206575498580197, "y": 0.4805301780454927, "z": 0.8162533207936237, "word": "Strelitzia", "pos_group": "noun", "row_number": 150238, "definition": "A genus of plants related to the banana found at the Cape of Good Hope. They have rigid glaucous distichous leaves and peculiar richly colored flowers.", "details": []}, {"x": -0.632662439118046, "y": 0.3640433657997501, "z": 0.6835281017971346, "word": "Strewment", "pos_group": "noun", "row_number": 150329, "definition": "Anything scattered as flowers for decoration.", "details": []}, {"x": -0.3728009891644313, "y": 0.2389772717154149, "z": 0.8966098851125155, "word": "Strict", "pos_group": "adjective", "row_number": 150360, "definition": "Upright or straight and narrow; -- said of the shape of the plants or their flower clusters.", "details": []}, {"x": -0.443975057859697, "y": 0.5399628282343358, "z": 0.7150708301445781, "word": "Strigose", "pos_group": "adjective", "row_number": 150400, "definition": "Set with stiff straight bristles; hispid; as a strigose leaf.", "details": []}, {"x": -0.5989297615123867, "y": 0.2211154613231604, "z": 0.7696694703173316, "word": "String", "pos_group": "noun", "row_number": 150464, "definition": "A fiber as of a plant; a little fibrous root.", "details": []}, {"x": -0.2991688547896547, "y": 0.3903173521326278, "z": 0.870718301718771, "word": "String", "pos_group": "noun", "row_number": 150467, "definition": "The tough fibrous substance that unites the valves of the pericap of leguminous plants and which is readily pulled off; as the strings of beans.", "details": []}, {"x": -0.5862939890615114, "y": 0.4596906258132702, "z": 0.6670411433560484, "word": "Strip-leaf", "pos_group": "noun", "row_number": 150529, "definition": "Tobacco which has been stripped of its stalks before packing.", "details": []}, {"x": -0.4626387682688266, "y": 0.1881032156767498, "z": 0.8663616740985077, "word": "Strophanthus", "pos_group": "noun", "row_number": 150661, "definition": "A genus of tropical apocynaceous shrubs having singularly twisted flowers. One species (Strophanthus hispidus) is used medicinally as a cardiac sedative and stimulant.", "details": []}, {"x": -0.3578000618826353, "y": 0.5192842241534156, "z": 0.7760947173265436, "word": "Strophiole", "pos_group": "noun", "row_number": 150667, "definition": "A crestlike excrescence about the hilum of certain seeds; a caruncle.", "details": []}, {"x": -0.6361190502878193, "y": 0.3024675334661941, "z": 0.7098351534404305, "word": "Stylopodium", "pos_group": "noun", "row_number": 151061, "definition": "An expansion at the base of the style as in umbelliferous plants.", "details": []}, {"x": -0.3304682069576079, "y": 0.2909718687165971, "z": 0.8978452738672712, "word": "Subgenera", "pos_group": "other", "row_number": 151294, "definition": "of Subgenus", "details": []}, {"x": -0.5028771526007826, "y": 0.5248058190584234, "z": 0.6867994042473731, "word": "Subgenus", "pos_group": "noun", "row_number": 151295, "definition": "A subdivision of a genus comprising one or more species which differ from other species of the genus in some important character or characters; as the azaleas now constitute a subgenus of Rhododendron.", "details": []}, {"x": -0.5543169724686465, "y": 0.1913986818782924, "z": 0.8099995300050773, "word": "Suborder", "pos_group": "noun", "row_number": 151523, "definition": "A division of an order; a group of genera of a little lower rank than an order and of greater importance than a tribe or family; as cichoraceous plants form a suborder of Compositae.", "details": []}, {"x": -0.3059707137408269, "y": 0.4492489174162958, "z": 0.8393791351547971, "word": "Subtypical", "pos_group": "adjective", "row_number": 151864, "definition": "Deviating somewhat from the type of a species genus or other group; slightly aberrant.", "details": []}, {"x": -0.6208084677506686, "y": 0.402432539084762, "z": 0.6727888954604248, "word": "Succory", "pos_group": "noun", "row_number": 151983, "definition": "A plant of the genus Cichorium. See Chicory.", "details": []}, {"x": -0.4048467818451436, "y": 0.2135452925682252, "z": 0.8890992583798403, "word": "Succubous", "pos_group": "adjective", "row_number": 151989, "definition": "Having the leaves so placed that the upper part of each one is covered by the base of the next higher leaf as in hepatic mosses of the genus Plagiochila.", "details": []}, {"x": -0.4084363083343635, "y": 0.5389723767066481, "z": 0.7366739843250769, "word": "Succus", "pos_group": "noun", "row_number": 152005, "definition": "The expressed juice of a plant for medicinal use.", "details": []}, {"x": -0.6191623176279185, "y": 0.2479160441124477, "z": 0.7451011068984259, "word": "Sucker", "pos_group": "noun", "row_number": 152038, "definition": "A shoot from the roots or lower part of the stem of a plant; -- so called perhaps from diverting nourishment from the body of the plant.", "details": []}, {"x": -0.3047465954942192, "y": 0.3516777126859383, "z": 0.8851284081615894, "word": "Suckling", "pos_group": "other", "row_number": 152062, "definition": "A small kind of yellow clover (Trifolium filiforme) common in Southern Europe.", "details": []}, {"x": -0.557698032196722, "y": 0.4897733527660142, "z": 0.6701454825664658, "word": "Sumach", "pos_group": "noun", "row_number": 152438, "definition": "Any plant of the genus Rhus shrubs or small trees with usually compound leaves and clusters of small flowers. Some of the species are used in tanning some in dyeing and some in medicine. One the Japanese Rhus vernicifera yields the celebrated Japan varnish or lacquer.", "details": []}, {"x": -0.4991074225165108, "y": 0.182283712504625, "z": 0.847150771081781, "word": "Sumach", "pos_group": "noun", "row_number": 152439, "definition": "The powdered leaves peduncles and young branches of certain species of the sumac plant used in tanning and dyeing.", "details": []}, {"x": -0.3324850696901565, "y": 0.4976751073506237, "z": 0.8011074621776263, "word": "Sumbul", "pos_group": "noun", "row_number": 152442, "definition": "The musky root of an Asiatic umbelliferous plant Ferula Sumbul. It is used in medicine as a stimulant.", "details": []}, {"x": -0.6368476357243421, "y": 0.3400612629235482, "z": 0.6919417795820376, "word": "Sundew", "pos_group": "noun", "row_number": 152535, "definition": "Any plant of the genus Drosera low bog plants whose leaves are beset with pediceled glands which secrete a viscid fluid that glitters like dewdrops and attracts and detains insects. After an insect is caught the glands curve inward like tentacles and the leaf digests it. Called also lustwort.", "details": []}, {"x": -0.3545866692742489, "y": 0.2570379318535757, "z": 0.8989993301229044, "word": "Sunflower", "pos_group": "noun", "row_number": 152553, "definition": "Any plant of the genus Helianthus; -- so called probably from the form and color of its flower which is large disk with yellow rays. The commonly cultivated sunflower is Helianthus annuus a native of America.", "details": []}, {"x": -0.4664444287188526, "y": 0.5371512124941884, "z": 0.7027788911408527, "word": "Sunn", "pos_group": "noun", "row_number": 152564, "definition": "An East Indian leguminous plant (Crotalaria juncea) and its fiber which is also called sunn hemp.", "details": []}, {"x": -0.5837979898009722, "y": 0.2070339762436279, "z": 0.7850584944990384, "word": "Superannuate", "pos_group": "other", "row_number": 152627, "definition": "To last beyond the year; -- said of annual plants.", "details": []}, {"x": -0.2988015312090674, "y": 0.4137376631631939, "z": 0.8599644126516958, "word": "Superior", "pos_group": "adjective", "row_number": 152751, "definition": "More comprehensive; as a term in classification; as a genus is superior to a species.", "details": []}, {"x": -0.6017624500465011, "y": 0.4390698514887882, "z": 0.6671578667958925, "word": "Superior", "pos_group": "adjective", "row_number": 152752, "definition": "Above the ovary; -- said of parts of the flower which although normally below the ovary adhere to it and so appear to originate from its upper part; also of an ovary when the other floral organs are plainly below it in position and free from it.", "details": []}, {"x": -0.4399805657217103, "y": 0.194928608073478, "z": 0.8765956533897145, "word": "Superior", "pos_group": "adjective", "row_number": 152753, "definition": "Belonging to the part of an axillary flower which is toward the main stem; posterior.", "details": []}, {"x": -0.3755372500780996, "y": 0.5296820569743145, "z": 0.7605318483293372, "word": "Superior", "pos_group": "adjective", "row_number": 152754, "definition": "Pointing toward the apex of the fruit; ascending; -- said of the radicle.", "details": []}, {"x": -0.6324124837743784, "y": 0.2801411905342475, "z": 0.7222017472509852, "word": "Superplant", "pos_group": "noun", "row_number": 152805, "definition": "A plant growing on another as the mistletoe; an epiphyte.", "details": []}, {"x": -0.3179826058057217, "y": 0.3133395717870684, "z": 0.8948214208194278, "word": "Supersemination", "pos_group": "noun", "row_number": 152847, "definition": "The sowing of seed over seed previously sown.", "details": []}, {"x": -0.5247910494019439, "y": 0.5139851170083342, "z": 0.6785378795332915, "word": "Supple-jack", "pos_group": "noun", "row_number": 152949, "definition": "A somewhat similar tropical American plant (Paullinia Curassavica); also a walking stick made from its stem.", "details": []}, {"x": -0.534274009767826, "y": 0.1848220926665884, "z": 0.8248588221925931, "word": "Suprafoliaceous", "pos_group": "adjective", "row_number": 153099, "definition": "Inserted into the stem above the leaf petiole or axil as a peduncle or flower.", "details": []}, {"x": -0.3134030043614728, "y": 0.4696112725248835, "z": 0.82537495090096, "word": "Suspensoria", "pos_group": "other", "row_number": 153529, "definition": "of Suspensorium", "details": []}, {"x": -0.6296853961905625, "y": 0.3788149499982591, "z": 0.6782297070183162, "word": "Sutor", "pos_group": "noun", "row_number": 153590, "definition": "A kind of sirup made by the Indians of Arizona from the fruit of some cactaceous plant (probably the Cereus giganteus).", "details": []}, {"x": -0.3841089320513423, "y": 0.2278498910317958, "z": 0.8947316667443799, "word": "Suwarrow", "pos_group": "noun", "row_number": 153613, "definition": "The giant cactus (Cereus giganteus); -- so named by the Indians of Arizona. Called also saguaro.", "details": []}, {"x": -0.4299346593796606, "y": 0.5413362840450949, "z": 0.7225726373454393, "word": "Swallowwort", "pos_group": "noun", "row_number": 153706, "definition": "A poisonous plant (Vincetoxicum officinale) of the Milkweed family at one time used in medicine; -- also called white swallowwort.", "details": []}, {"x": -0.6079871632385918, "y": 0.2299580644983026, "z": 0.7599150596673843, "word": "Sweepage", "pos_group": "noun", "row_number": 153925, "definition": "The crop of hay got in a meadow.", "details": []}, {"x": -0.299514722041924, "y": 0.3756386428189098, "z": 0.8770328051454611, "word": "Sweetbrier", "pos_group": "noun", "row_number": 153955, "definition": "A kind of rose (Rosa rubiginosa) with minutely glandular and fragrant foliage. The small-flowered sweetbrier is Rosa micrantha.", "details": []}, {"x": -0.5763837783766793, "y": 0.4722329423384535, "z": 0.6669166276189176, "word": "Sweetweed", "pos_group": "noun", "row_number": 153984, "definition": "A name for two tropical American weeds (Capraria biflora and Scoparia dulcis) of the Figwort family.", "details": []}, {"x": -0.476569937562105, "y": 0.1840248802427482, "z": 0.8596603620405524, "word": "Sweetwort", "pos_group": "noun", "row_number": 153987, "definition": "Any plant of a sweet taste.", "details": []}, {"x": -0.3468259448837468, "y": 0.5124907614956737, "z": 0.7855348390345782, "word": "Sword-shaped", "pos_group": "adjective", "row_number": 154276, "definition": "Shaped like a sword; ensiform as the long flat leaves of the Iris cattail and the like.", "details": []}, {"x": -0.6380298539382566, "y": 0.3163046046003494, "z": 0.7020465102770211, "word": "Sychnocarpous", "pos_group": "adjective", "row_number": 154305, "definition": "Having the capacity of bearing several successive crops of fruit without perishing; as sychnocarpous plants.", "details": []}, {"x": -0.3382876553387026, "y": 0.2770961348504803, "z": 0.8993215188665106, "word": "Sylvanium", "pos_group": "noun", "row_number": 154393, "definition": "An old name for tellurium.", "details": []}, {"x": -0.4890927425740276, "y": 0.5311677823772154, "z": 0.691844690755004, "word": "Symmetrical", "pos_group": "adjective", "row_number": 154446, "definition": "Having an equal number of parts in the successive circles of floral organs; -- said of flowers.", "details": []}, {"x": -0.5664864505528164, "y": 0.1956327854169623, "z": 0.8005129072101662, "word": "Symmetrical", "pos_group": "adjective", "row_number": 154447, "definition": "Having a likeness in the form and size of floral organs of the same kind; regular.", "details": []}, {"x": -0.3014704308165891, "y": 0.4363774353795175, "z": 0.8477560458261887, "word": "Symmetry", "pos_group": "noun", "row_number": 154457, "definition": "Equality in the number of parts of the successive circles in a flower.", "details": []}, {"x": -0.6149330389939683, "y": 0.4169192911238792, "z": 0.6693546610298642, "word": "Symmetry", "pos_group": "noun", "row_number": 154458, "definition": "Likeness in the form and size of floral organs of the same kind; regularity.", "details": []}, {"x": -0.4176746101033135, "y": 0.2047912706205704, "z": 0.885216615045525, "word": "Synantherous", "pos_group": "adjective", "row_number": 154543, "definition": "Having the stamens united by their anthers; as synantherous flowers.", "details": []}, {"x": -0.3950535527031975, "y": 0.5371302691867864, "z": 0.7452675790747322, "word": "Synanthesis", "pos_group": "noun", "row_number": 154544, "definition": "The simultaneous maturity of the anthers and stigmas of a blossom.", "details": []}, {"x": -0.6257294606356036, "y": 0.2591273531278112, "z": 0.7357415694071195, "word": "Synanthous", "pos_group": "adjective", "row_number": 154545, "definition": "Having flowers and leaves which appear at the same time; -- said of certain plants.", "details": []}, {"x": -0.3081076627853003, "y": 0.3367219497918956, "z": 0.8897685073440864, "word": "Synanthrose", "pos_group": "noun", "row_number": 154546, "definition": "A variety of sugar isomeric with sucrose found in the tubers of the Jerusalem artichoke (Helianthus tuberosus) in the dahlia and other Compositae.", "details": []}, {"x": -0.5458317189434153, "y": 0.5003549222166594, "z": 0.6720957419957642, "word": "Synedral", "pos_group": "adjective", "row_number": 154641, "definition": "Growing on the angles of a stem as the leaves in some species of Selaginella.", "details": []}, {"x": -0.5129076534782808, "y": 0.1813745521150545, "z": 0.8390643663322065, "word": "Syngenesia", "pos_group": "other", "row_number": 154654, "definition": "A Linnaean class of plants in which the stamens are united by the anthers.", "details": []}, {"x": -0.3236608725908985, "y": 0.4881687435596404, "z": 0.8105152172322865, "word": "Synthetical", "pos_group": "adjective", "row_number": 154734, "definition": "Comprising within itself structural or other characters which are usually found only in two or more diverse groups; -- said of species genera and higher groups. See the Note under Comprehensive 3.", "details": []}, {"x": -0.6357185107615914, "y": 0.3547295822350399, "z": 0.6855865361589436, "word": "Syringa", "pos_group": "noun", "row_number": 154762, "definition": "A genus of plants; the lilac.", "details": []}, {"x": -0.3647393014254273, "y": 0.2446499723525267, "z": 0.8983939186256769, "word": "Tabula", "pos_group": "noun", "row_number": 154979, "definition": "One of the transverse plants found in the calicles of certain corals and hydroids.", "details": []}, {"x": -0.4522596856021172, "y": 0.5404873630046907, "z": 0.7094607721441052, "word": "Taeniata", "pos_group": "other", "row_number": 155085, "definition": "A division of Ctenophora including those which have a long ribbonlike body. The Venus's girdle is the most familiar example.", "details": []}, {"x": -0.5942241029223071, "y": 0.2142427772029962, "z": 0.775240445231366, "word": "Tamarisk", "pos_group": "noun", "row_number": 155383, "definition": "Any shrub or tree of the genus Tamarix the species of which are European and Asiatic. They have minute scalelike leaves and small flowers in spikes. An Arabian species (T. mannifera) is the source of one kind of manna.", "details": []}, {"x": -0.2972731348119123, "y": 0.3995055189943593, "z": 0.8671931870189861, "word": "fibre", "pos_group": "other", "row_number": 155439, "definition": "A tough vegetable fiber used as a substitute for bristles in making brushes. The piassava and the ixtle are both used under this name.", "details": []}, {"x": -0.5932476760680839, "y": 0.4525879283570608, "z": 0.6657487228266247, "word": "Tangly", "pos_group": "adjective", "row_number": 155507, "definition": "Covered with tangle or seaweed.", "details": []}, {"x": -0.4537285216406436, "y": 0.1889644661533396, "z": 0.8708747666462607, "word": "Tanier", "pos_group": "noun", "row_number": 155512, "definition": "An aroid plant (Caladium sagittaefolium) the leaves of which are boiled and eaten in the West Indies.", "details": []}, {"x": -0.3634376157914259, "y": 0.5246941021577359, "z": 0.7698111447548232, "word": "Tansy", "pos_group": "noun", "row_number": 155535, "definition": "Any plant of the composite genus Tanacetum. The common tansy (T. vulgare) has finely divided leaves a strong aromatic odor and a very bitter taste. It is used for medicinal and culinary purposes.", "details": []}, {"x": -0.6361667758730482, "y": 0.2932017288935508, "z": 0.7136697972095524, "word": "Tare", "pos_group": "noun", "row_number": 155662, "definition": "A weed that grows among wheat and other grain; -- alleged by modern naturalists to be the Lolium temulentum or darnel.", "details": []}, {"x": -0.3242090010857396, "y": 0.2988032080229542, "z": 0.8975551049880882, "word": "Tare", "pos_group": "noun", "row_number": 155663, "definition": "A name of several climbing or diffuse leguminous herbs of the genus Vicia; especially the V. sativa sometimes grown for fodder.", "details": []}, {"x": -0.5115123760805309, "y": 0.5220983592263219, "z": 0.6824722649380209, "word": "Taro", "pos_group": "noun", "row_number": 155701, "definition": "A name for several aroid plants (Colocasia antiquorum var. esculenta Colocasia macrorhiza etc.) and their rootstocks. They have large ovate-sagittate leaves and large fleshy rootstocks which are cooked and used for food in tropical countries.", "details": []}, {"x": -0.5472912398916105, "y": 0.1871340830807477, "z": 0.815753108291615, "word": "Tarragon", "pos_group": "noun", "row_number": 155711, "definition": "A plant of the genus Artemisa (A. dracunculus) much used in France for flavoring vinegar.", "details": []}, {"x": -0.3071465614432097, "y": 0.4578230843082408, "z": 0.8343015122053311, "word": "Tarweed", "pos_group": "noun", "row_number": 155806, "definition": "A name given to several resinous-glandular composite plants of California esp. to the species of Grindelia Hemizonia and Madia.", "details": []}, {"x": -0.6255523314493153, "y": 0.3936267186598438, "z": 0.6736039540972204, "word": "Tassel", "pos_group": "noun", "row_number": 155829, "definition": "The flower or head of some plants esp. when pendent.", "details": []}, {"x": -0.3961237035244797, "y": 0.2175329493489327, "z": 0.8920568521420622, "word": "Tassel", "pos_group": "other", "row_number": 155836, "definition": "To put forth a tassel or flower; as maize tassels.", "details": []}, {"x": -0.4160083396251574, "y": 0.5414743913189459, "z": 0.7305768576324443, "word": "Taxine", "pos_group": "noun", "row_number": 156014, "definition": "A poisonous alkaloid of bitter taste extracted from the leaves and seeds of the European yew (Taxus baccata). Called also taxia.", "details": []}, {"x": -0.6161694833577293, "y": 0.2398121665591556, "z": 0.7502168303556465, "word": "Tear-thumb", "pos_group": "noun", "row_number": 156092, "definition": "A name given to several species of plants of the genus Polygonum having angular stems beset with minute reflexed prickles.", "details": []}, {"x": -0.3010373472415236, "y": 0.3607039558093592, "z": 0.8827622396938295, "word": "Teasel", "pos_group": "noun", "row_number": 156103, "definition": "A plant of the genus Dipsacus of which one species (D. fullonum) bears a large flower head covered with stiff prickly hooked bracts. This flower head when dried is used for raising a nap on woolen cloth.", "details": []}, {"x": -0.5656135232456252, "y": 0.4841411638664423, "z": 0.6675991879651418, "word": "Teasel", "pos_group": "noun", "row_number": 156104, "definition": "A bur of this plant.", "details": []}, {"x": -0.4905926899848041, "y": 0.1811379900375323, "z": 0.8523542931778058, "word": "Tendril", "pos_group": "adjective", "row_number": 156599, "definition": "A slender leafless portion of a plant by which it becomes attached to a supporting body after which the tendril usually contracts by coiling spirally.", "details": []}, {"x": -0.3365772659255764, "y": 0.504574485058593, "z": 0.7950599556573827, "word": "Ten-o'clock", "pos_group": "noun", "row_number": 156635, "definition": "A plant the star-of-Bethlehem. See under Star.", "details": []}, {"x": -0.6387793115235786, "y": 0.3306060773758858, "z": 0.694737801455767, "word": "Tentwort", "pos_group": "noun", "row_number": 156736, "definition": "A kind of small fern the wall rue. See under Wall.", "details": []}, {"x": -0.3470945313009005, "y": 0.2636587681736203, "z": 0.900005244599262, "word": "Teosinte", "pos_group": "noun", "row_number": 156761, "definition": "A large grass (Euchlaena luxurians) closely related to maize. It is native of Mexico and Central America but is now cultivated for fodder in the Southern United States and in many warm countries. Called also Guatemala grass.", "details": []}, {"x": -0.4750138809839857, "y": 0.5364188223216373, "z": 0.6975791424143926, "word": "Tephrosia", "pos_group": "noun", "row_number": 156771, "definition": "A genus of leguminous shrubby plants and herbs mostly found in tropical countries a few herbaceous species being North American. The foliage is often ashy-pubescent whence the name.", "details": []}, {"x": -0.5781027061176693, "y": 0.2010670561649092, "z": 0.7908029464440589, "word": "Terete", "pos_group": "adjective", "row_number": 156831, "definition": "Cylindrical and slightly tapering; columnar as some stems of plants.", "details": []}, {"x": -0.2980808477962584, "y": 0.4228472458492894, "z": 0.8557733431550287, "word": "Terrigenous", "pos_group": "adjective", "row_number": 156998, "definition": "Earthborn; produced by the earth.", "details": []}, {"x": -0.6079730394082168, "y": 0.4311772103375114, "z": 0.6666745807650809, "word": "Testa", "pos_group": "noun", "row_number": 157077, "definition": "The outer integument of a seed; the episperm or spermoderm.", "details": []}, {"x": -0.430991253694275, "y": 0.1970338222035782, "z": 0.8805817464306682, "word": "Tethyodea", "pos_group": "other", "row_number": 157189, "definition": "A division of Tunicata including the common attached ascidians both simple and compound. Called also Tethioidea.", "details": []}, {"x": -0.3820349500439952, "y": 0.5340473810512557, "z": 0.7542166079696049, "word": "Tetradynamia", "pos_group": "other", "row_number": 157221, "definition": "A Linnaean class of plants having six stamens four of which are longer than the others.", "details": []}, {"x": -0.6312707665520056, "y": 0.2711719832779601, "z": 0.7266106073970714, "word": "Tetradynamian", "pos_group": "noun", "row_number": 157222, "definition": "A plant of the order Tetradynamia.", "details": []}, {"x": -0.3126176882832706, "y": 0.3217784360665729, "z": 0.8937162967379381, "word": "Tetradynamous", "pos_group": "adjective", "row_number": 157224, "definition": "Belonging to the order Tetradynamia; having six stamens four of which are uniformly longer than the others.", "details": []}, {"x": -0.5332971627399569, "y": 0.510085020753753, "z": 0.6748388013564096, "word": "Tetragynia", "pos_group": "other", "row_number": 157231, "definition": "A Linnaean order of plants having four styles.", "details": []}, {"x": -0.5265443885997695, "y": 0.181709137357272, "z": 0.8305015329516081, "word": "Tetragynous", "pos_group": "adjective", "row_number": 157233, "definition": "Belonging to the order Tetragynia; having four styles.", "details": []}, {"x": -0.3157464698102117, "y": 0.4776798683389286, "z": 0.8198329770057392, "word": "Tetramerous", "pos_group": "adjective", "row_number": 157246, "definition": "Having the parts arranged in sets of four; as a tetramerous flower.", "details": []}, {"x": -0.6334112878326451, "y": 0.3696030562747533, "z": 0.6798409528989493, "word": "Tetrandria", "pos_group": "other", "row_number": 157252, "definition": "A Linnaean class of plants having four stamens.", "details": []}, {"x" ": "A plant (Campanula Trachelium) formerly considered a remedy for sore throats because of its throat-shaped corolla.", "details": []}, {"x": -0.5890771152514279, "y": 0.207675021616661, "z": 0.7809348485524098, "word": "Thrum", "pos_group": "noun", "row_number": 158450, "definition": "A threadlike part of a flower; a stamen.", "details": []}, {"x": -0.2958368153438113, "y": 0.4087466605837404, "z": 0.863369414647561, "word": "Thrumwort", "pos_group": "noun", "row_number": 158463, "definition": "A kind of amaranth (Amarantus caudatus).", "details": []}, {"x": -0.5999657170609796, "y": 0.4451025289496174, "z": 0.6647743053654824, "word": "Thyme", "pos_group": "noun", "row_number": 158616, "definition": "Any plant of the labiate genus Thymus. The garden thyme (Thymus vulgaris) is a warm pungent aromatic much used to give a relish to seasoning and soups.", "details": []}, {"x": -0.4447069166091374, "y": 0.190337654074282, "z": 0.8752184503091172, "word": "Thymy", "pos_group": "adjective", "row_number": 158624, "definition": "Abounding with thyme; fragrant; as a thymy vale.", "details": []}, {"x": -0.3694756783026204, "y": 0.5297320748919574, "z": 0.7634603146028484, "word": "Thyrsus", "pos_group": "noun", "row_number": 158638, "definition": "A species of inflorescence; a dense panicle as in the lilac and horse-chestnut.", "details": []}, {"x": -0.635735681652347, "y": 0.2839728763633884, "z": 0.7177740233276274, "word": "Tibiotarsi", "pos_group": "other", "row_number": 158666, "definition": "of Tibiotarsus", "details": []}, {"x": -0.3182560274698505, "y": 0.306952456392511, "z": 0.8969354996284368, "word": "Tickseed", "pos_group": "noun", "row_number": 158725, "definition": "A seed or fruit resembling in shape an insect as that of certain plants.", "details": []}, {"x": -0.5201753785970705, "y": 0.5188854471133304, "z": 0.6783623429078249, "word": "Tickseed", "pos_group": "noun", "row_number": 158727, "definition": "Any plant of the genus Corispermum plants of the Goosefoot family.", "details": []}, {"x": -0.5399187921390967, "y": 0.183297490289562, "z": 0.8215167240833304, "word": "Tidytips", "pos_group": "noun", "row_number": 158773, "definition": "A California composite plant (Layia platyglossa) the flower of which has yellow rays tipped with white.", "details": []}, {"x": -0.3088065927715849, "y": 0.4662719229545267, "z": 0.8289927515515997, "word": "Tiger's-foot", "pos_group": "noun", "row_number": 158836, "definition": "A name given to some species of morning-glory (Ipomoea) having the leaves lobed in pedate fashion.", "details": []}, {"x": -0.6299293596816097, "y": 0.3845780932087033, "z": 0.67475083700213, "word": "Tiliaceous", "pos_group": "adjective", "row_number": 158889, "definition": "Of pertaining to or resembling a natural order of plants (Tiliaceae) of which the linden (Tilia) is the type. The order includes many plants which furnish a valuable fiber as the jute.", "details": []}, {"x": -0.3874579853025136, "y": 0.2220045331856854, "z": 0.8947571161328213, "word": "Tillandsia", "pos_group": "noun", "row_number": 158908, "definition": "A genus of epiphytic endogenous plants found in the Southern United States and in tropical America. Tillandsia usneoides called long moss black moss Spanish moss and Florida moss has a very slender pendulous branching stem and forms great hanging tufts on the branches of trees. It is often used for stuffing mattresses.", "details": []}, {"x": -0.4238632333334596, "y": 0.5435058901580192, "z": 0.7245283340157541, "word": "Tiller", "pos_group": "noun", "row_number": 158910, "definition": "A shoot of a plant springing from the root or bottom of the original stalk; a sucker.", "details": []}, {"x": -0.6127026056279525, "y": 0.2319187095656816, "z": 0.755519178585234, "word": "Tiller", "pos_group": "other", "row_number": 158915, "definition": "To put forth new shoots from the root or round the bottom of the original stalk; as wheat or rye tillers; some spread plants by tillering.", "details": []}, {"x": -0.297744956752541, "y": 0.3698908697239433, "z": 0.8800731135668742, "word": "Tilley seed", "pos_group": "other", "row_number": 158921, "definition": "The seeds of a small tree (Croton Pavana) common in the Malay Archipelago. These seeds furnish croton oil like those of Croton Tiglium.", "details": []}, {"x": -0.5733888411418211, "y": 0.4780619471129915, "z": 0.6653435289957924, "word": "Timothy grass", "pos_group": "other", "row_number": 159052, "definition": "A kind of grass (Phleum pratense) with long cylindrical spikes; -- called also herd's grass in England cat's-tail grass and meadow cat's-tail grass. It is much prized for fodder. See Illustration in Appendix.", "details": []}, {"x": -0.4818683260736836, "y": 0.1804913675739868, "z": 0.8574530789251492, "word": "Tingid", "pos_group": "adjective", "row_number": 159107, "definition": "Of or pertaining to the genus Tingis.", "details": []}, {"x": -0.3411194318810815, "y": 0.511185232771507, "z": 0.7888771710408842, "word": "Toadflax", "pos_group": "noun", "row_number": 159412, "definition": "An herb (Linaria vulgaris) of the Figwort family having narrow leaves and showy orange and yellow flowers; -- called also butter and eggs flaxweed and ramsted.", "details": []}, {"x": -0.6402575053435516, "y": 0.3210778509156603, "z": 0.6978390505715719, "word": "Toadstool", "pos_group": "noun", "row_number": 159418, "definition": "A name given to many umbrella-shaped fungi mostly of the genus Agaricus. The species are almost numberless. They grow on decaying organic matter.", "details": []}, {"x": -0.3398217795748622, "y": 0.2706764622033162, "z": 0.9006971804861333, "word": "Tobacco", "pos_group": "noun", "row_number": 159439, "definition": "An American plant (Nicotiana Tabacum) of the Nightshade family much used for smoking and chewing and as snuff. As a medicine it is narcotic emetic and cathartic. Tobacco has a strong peculiar smell and an acrid taste.", "details": []}, {"x": -0.4837138686428542, "y": 0.5351745454764552, "z": 0.6925381571845938, "word": "Tobacco", "pos_group": "noun", "row_number": 159440, "definition": "The leaves of the plant prepared for smoking chewing etc. by being dried cured and manufactured in various ways.", "details": []}, {"x": -0.571996003897979, "y": 0.1954586669650979, "z": 0.7966281949774122, "word": "Tomato", "pos_group": "noun", "row_number": 159631, "definition": "The fruit of a plant of the Nightshade family (Lycopersicum esculentun); also the plant itself. The fruit which is called also love apple is usually of a rounded flattened form but often irregular in shape. It is of a bright red or yellow color and is eaten either cooked or uncooked.", "details": []}, {"x": -0.2978370080406431, "y": 0.4319404133603928, "z": 0.8513052307765125, "word": "Tomentum", "pos_group": "noun", "row_number": 159652, "definition": "The closely matted hair or downy nap covering the leaves or stems of some plants.", "details": []}, {"x": -0.6138923371537699, "y": 0.4229506049032663, "z": 0.6665200553590592, "word": "Tonga", "pos_group": "noun", "row_number": 159706, "definition": "A drug useful in neuralgia derived from a Fijian plant supposed to be of the aroid genus Epipremnum.", "details": []}, {"x": -0.4219552141638235, "y": 0.1996484884762822, "z": 0.8843609434439637, "word": "Tonka bean", "pos_group": "other", "row_number": 159766, "definition": "The seed of a leguminous tree (Dipteryx odorata) native of Guiana. It has a peculiarly agreeable smell and is employed in the scenting of snuff. Called also tonquin bean.", "details": []}, {"x": -0.3888934835524179, "y": 0.5379957181828321, "z": 0.7478786436765019, "word": "Toothwort", "pos_group": "noun", "row_number": 159859, "definition": "A plant whose roots are fancied to resemble teeth as certain plants of the genus Lathraea and various species of Dentaria. See Coralwort.", "details": []}, {"x": -0.6296441066819405, "y": 0.2623087095040621, "z": 0.7312608562195946, "word": "Top", "pos_group": "noun", "row_number": 159869, "definition": "The head or upper part of a plant.", "details": []}, {"x": -0.3076077167653112, "y": 0.33047855134744, "z": 0.8922787791300036, "word": "Topiary", "pos_group": "adjective", "row_number": 159929, "definition": "Of or pertaining to ornamental gardening; produced by cutting trimming etc.; topiarian.", "details": []}, {"x": -0.5417653255352626, "y": 0.5056940481570404, "z": 0.6713895007417199, "word": "Tormentil", "pos_group": "noun", "row_number": 160031, "definition": "A rosaceous herb (Potentilla Tormentilla) the root of which is used as a powerful astringent and for alleviating gripes or tormina in diarrhea.", "details": []}, {"x": -0.5185162803602873, "y": 0.1790593573150847, "z": 0.8361092115024453, "word": "Torula", "pos_group": "noun", "row_number": 160156, "definition": "A chain of special bacteria. (b) A genus of budding fungi. Same as Saccharomyces. Also used adjectively.", "details": []}, {"x": -0.318568724088641, "y": 0.4855566818223258, "z": 0.8140937763981665, "word": "Torus", "pos_group": "noun", "row_number": 160163, "definition": "The receptacle or part of the flower on which the carpels stand.", "details": []}, {"x": -0.6367300634492465, "y": 0.3602112015034636, "z": 0.6817790819696288, "word": "Touchwood", "pos_group": "noun", "row_number": 160304, "definition": "Dried fungi used as tinder; especially the Polyporus igniarius.", "details": []}, {"x": -0.367452553347256, "y": 0.2384926032843967, "z": 0.8989437686625417, "word": "Tragacanth", "pos_group": "noun", "row_number": 160696, "definition": "A kind of gum procured from a spiny leguminous shrub (Astragalus gummifer) of Western Asia and other species of Astragalus. It comes in hard whitish or yellowish flakes or filaments and is nearly insoluble in water but slowly swells into a mucilaginous mass which is used as a substitute for gum arabic in medicine and the arts. Called also gum tragacanth.", "details": []}, {"x": -0.4463584824715806, "y": 0.5433989563263484, "z": 0.7109723478371734, "word": "Trail", "pos_group": "other", "row_number": 160725, "definition": "To grow to great length especially when slender and creeping upon the ground as a plant; to run or climb.", "details": []}, {"x": -0.5993247983760719, "y": 0.21542153200796, "z": 0.770975583010788, "word": "Treasury", "pos_group": "noun", "row_number": 161514, "definition": "Hence a book or work containing much valuable knowledge wisdom wit or the like; a thesaurus; as \"\"\"\" Maunder's Treasury of Botany.", "details": []}, {"x": -0.2947653047173582, "y": 0.3941689413921569, "z": 0.8704850721159263, "word": "Trefoil", "pos_group": "noun", "row_number": 161588, "definition": "Any plant of the genus Trifolium which includes the white clover red clover etc.; -- less properly applied also to the nonesuch or black medic. See Clover and Medic.", "details": []}, {"x": -0.5909561954800462, "y": 0.4585928581140099, "z": 0.6636741410591294, "word": "Trefoil", "pos_group": "noun", "row_number": 161590, "definition": "A charge representing the clover leaf.", "details": []}, {"x": -0.4587280692713392, "y": 0.1847604880684505, "z": 0.8691559816921801, "word": "Tremella", "pos_group": "noun", "row_number": 161612, "definition": "A genus of gelatinous fungi found in moist grounds.", "details": []}, {"x": -0.3574685443958376, "y": 0.5242016355350932, "z": 0.7729352398939089, "word": "Tress", "pos_group": "noun", "row_number": 161701, "definition": "Fig.: A knot or festoon as of flowers.", "details": []}, {"x": -0.6390808835226881, "y": 0.297446802112188, "z": 0.7092961470564276, "word": "Triandria", "pos_group": "other", "row_number": 161756, "definition": "A Linnaean class of plants having three distinct and equal stamens.", "details": []}, {"x": -0.3249937425519429, "y": 0.2923494739507409, "z": 0.8993947144512283, "word": "Triandrous", "pos_group": "adjective", "row_number": 161758, "definition": "Of or pertaining to the Triandria; having three distinct and equal stamens in the same flower.", "details": []}, {"x": -0.5065523795486147, "y": 0.526683910638673, "z": 0.682648331901566, "word": "Triangular", "pos_group": "adjective", "row_number": 161767, "definition": "Oblong or elongated and having three lateral angles; as a triangular seed leaf or stem.", "details": []}, {"x": -0.5529329524545529, "y": 0.1861407375496925, "z": 0.8121679480959265, "word": "Tribe", "pos_group": "noun", "row_number": 161791, "definition": "A number of species or genera having certain structural characteristics in common; as a tribe of plants; a tribe of animals.", "details": []}, {"x": -0.3028996107865203, "y": 0.4540155557755378, "z": 0.8379270259988062, "word": "Trichogyne", "pos_group": "noun", "row_number": 161861, "definition": "The slender hairlike cell which receives the fertilizing particles or antherozoids in red seaweeds.", "details": []}, {"x": -0.6252845776965521, "y": 0.3995493695991153, "z": 0.6703577389333207, "word": "Trichomanes", "pos_group": "noun", "row_number": 161862, "definition": "Any fern of the genus Trichomanes. The fronds are very delicate and often translucent and the sporangia are borne on threadlike receptacles rising from the middle of cup-shaped marginal involucres. Several species are common in conservatories; two are native in the United States.", "details": []}, {"x": -0.3998784195542836, "y": 0.2119210476238563, "z": 0.8917324257582963, "word": "Trichome", "pos_group": "noun", "row_number": 161864, "definition": "A hair on the surface of leaf or stem or any modification of a hair as a minute scale or star or gland. The sporangia of ferns are believed to be of the nature of trichomes.", "details": []}, {"x": -0.4098510406144606, "y": 0.5431406216859488, "z": 0.7328167503420243, "word": "Tricuspidate", "pos_group": "adjective", "row_number": 161932, "definition": "Three-pointed; ending in three points; as a tricuspidate leaf.", "details": []}, {"x": -0.6206063932219011, "y": 0.2422820691851836, "z": 0.7457527094442561, "word": "Trifarious", "pos_group": "adjective", "row_number": 161981, "definition": "Facing three ways; arranged in three vertical ranks as the leaves of veratrum.", "details": []}, {"x": -0.2997647710608854, "y": 0.3547090709720096, "z": 0.8856198716159145, "word": "Triflorous", "pos_group": "adjective", "row_number": 161995, "definition": "Three-flowered; having or bearing three flowers; as a triflorous peduncle.", "details": []}, {"x": -0.5621645206929268, "y": 0.4898256751149392, "z": 0.6663646596813835, "word": "Trifoliated", "pos_group": "adjective", "row_number": 161998, "definition": "Having three leaves or leaflets as clover. See Illust. of Shamrock.", "details": []}, {"x": -0.4960639726034701, "y": 0.1780651381383533, "z": 0.849831360720839, "word": "Trifolium", "pos_group": "noun", "row_number": 162000, "definition": "A genus of leguminous herbs with densely spiked flowers and usually trifoliate leaves; trefoil. There are many species all of which are called clover. See Clover.", "details": []}, {"x": -0.3310704790328437, "y": 0.5027345728278241, "z": 0.7985300790806746, "word": "Trigamous", "pos_group": "adjective", "row_number": 162012, "definition": "Having three sorts of flowers in the same head -- male female and hermaphrodite or perfect flowers.", "details": []}, {"x": -0.6405400661280769, "y": 0.3357070690158061, "z": 0.6906585172843781, "word": "Trigynia", "pos_group": "other", "row_number": 162049, "definition": "A Linnaean order of plants having three pistils or styles.", "details": []}, {"x": -0.3491179800252026, "y": 0.2572906689689059, "z": 0.9010650074687482, "word": "Trijugate", "pos_group": "adjective", "row_number": 162055, "definition": "In three pairs; as a trijugate leaf or a pinnate leaf with three pairs of leaflets.", "details": []}, {"x": -0.4693809320255105, "y": 0.5400221656080919, "z": 0.6986111946589532, "word": "Trillium", "pos_group": "noun", "row_number": 162086, "definition": "A genus of liliaceous plants; the three-leaved nightshade; -- so called because all the parts of the plant are in threes.", "details": []}, {"x": -0.5834980971544326, "y": 0.2014367023723983, "z": 0.7867358041645812, "word": "Tri/cious", "pos_group": "adjective", "row_number": 162193, "definition": "Having three sorts of flowers on the same or on different plants some of the flowers being staminate others pistillate and others both staminate and pistillate; belonging to the order Tri/cia.", "details": []}, {"x": -0.2948704477409616, "y": 0.4180122535994177, "z": 0.85925384775966, "word": "Trionychoidea", "pos_group": "other", "row_number": 162197, "definition": "A division of chelonians which comprises Trionyx and allied genera; -- called also Trionychoides and Trionychina.", "details": []}, {"x": -0.6064232486332258, "y": 0.4372519867370041, "z": 0.6641246446350771, "word": "Tripetaloid", "pos_group": "adjective", "row_number": 162248, "definition": "Having the form or appearance of three petals; appearing as if furnished with three petals.", "details": []}, {"x": -0.4356000719962867, "y": 0.1922254064017749, "z": 0.8793758982428973, "word": "Tripetalous", "pos_group": "adjective", "row_number": 162249, "definition": "Having three petals or flower leaves; three-petaled.", "details": []}, {"x": -0.3759005907393868, "y": 0.5343767058192154, "z": 0.7570602896464612, "word": "Tripinnate", "pos_group": "adjective", "row_number": 162257, "definition": "Having bipinnate leaflets arranged on each side of a rhachis.", "details": []}, {"x": -0.6348197907479217, "y": 0.2748099657481455, "z": 0.7221380172794313, "word": "Tripinnatifid", "pos_group": "adjective", "row_number": 162258, "definition": "Thrice pinnately cleft; -- said of a pinnatifid leaf when its segments are pinnatifid and the subdivisions of these also are pinnatifid.", "details": []}, {"x": -0.3126317610297372, "y": 0.3153982934387982, "z": 0.8959828672978847, "word": "Triptych", "pos_group": "noun", "row_number": 162310, "definition": "Anything in three parts or leaves.", "details": []}, {"x": -0.5288389873510829, "y": 0.5151695353256197, "z": 0.6744847480335388, "word": "Triseralous", "pos_group": "adjective", "row_number": 162334, "definition": "Having three sepals or calyx leaves.", "details": []}, {"x": -0.5322172293327089, "y": 0.1799066081490985, "z": 0.8272716803721141, "word": "Triticum", "pos_group": "noun", "row_number": 162379, "definition": "A genus of grasses including the various species of wheat.", "details": []}, {"x": -0.3109520233875218, "y": 0.4745668662409977, "z": 0.8234653171915653, "word": "Triunguli", "pos_group": "other", "row_number": 162427, "definition": "of Triungulus", "details": []}, {"x": -0.6339201563129105, "y": 0.3753110904377479, "z": 0.6762298579733399, "word": "Truelove", "pos_group": "noun", "row_number": 162749, "definition": "A plant. See Paris.", "details": []}, {"x": -0.3788770188048225, "y": 0.2269525840727436, "z": 0.8971871205073523, "word": "Truffle", "pos_group": "noun", "row_number": 162753, "definition": "Any one of several kinds of roundish subterranean fungi usually of a blackish color. The French truffle (Tuber melanosporum) and the English truffle (T. aestivum) are much esteemed as articles of food.", "details": []}, {"x": -0.4319799855655951, "y": 0.5450534451198437, "z": 0.7185471689692596, "word": "Trumpets", "pos_group": "other", "row_number": 162799, "definition": "A plant (Sarracenia flava) with long hollow leaves.", "details": []}, {"x": -0.6087652684427436, "y": 0.2242629390823306, "z": 0.7609934179031966, "word": "Trumpetweed", "pos_group": "noun", "row_number": 162802, "definition": "An herbaceous composite plant (Eupatorium purpureum) often having hollow stems and bearing purplish flowers in small corymbed heads.", "details": []}, {"x": -0.2948851431768893, "y": 0.3792116673961383, "z": 0.8770640020227635, "word": "Truss", "pos_group": "noun", "row_number": 162870, "definition": "A tuft of flowers formed at the top of the main stalk or stem of certain plants.", "details": []}, {"x": -0.5809972155384319, "y": 0.4715479422637534, "z": 0.6633888555616598, "word": "Tub", "pos_group": "other", "row_number": 162986, "definition": "To plant or set in a tub; as to tub a plant.", "details": []}, {"x": -0.4729580938494805, "y": 0.180352581467593, "z": 0.8624288885584951, "word": "Tuber", "pos_group": "noun", "row_number": 163009, "definition": "A genus of fungi. See Truffle.", "details": []}, {"x": -0.3461032906830331, "y": 0.5174822228887223, "z": 0.782575658433434, "word": "Tuberose", "pos_group": "noun", "row_number": 163027, "definition": "A plant (Polianthes tuberosa) with a tuberous root and a liliaceous flower. It is much cultivated for its beautiful and fragrant white blossoms.", "details": []}, {"x": -0.6412706584181214, "y": 0.3115049074539509, "z": 0.7012393566280308, "word": "Tubipore", "pos_group": "noun", "row_number": 163051, "definition": "Any species of the genus Tubipora.", "details": []}, {"x": -0.3327937396134382, "y": 0.2780743673223448, "z": 0.9010676850894058, "word": "Tubularida", "pos_group": "other", "row_number": 163061, "definition": "An extensive division of Hydroidea; the tubularians; -- called also Athecata Gymnoblastea and Tubulariae.", "details": []}, {"x": -0.4925185969440814, "y": 0.533414607004004, "z": 0.6876730972627891, "word": "Tubulicole", "pos_group": "noun", "row_number": 163070, "definition": "Any hydroid which has tubular chitinous stems.", "details": []}, {"x": -0.5654905997678248, "y": 0.1902310243449545, "z": 0.802516379241505, "word": "Tubulous", "pos_group": "adjective", "row_number": 163075, "definition": "Resembling or in the form of a tube; longitudinally hollow; specifically (Bot.) having a hollow cylindrical corolla often expanded or toothed at the border; as a tubulose flower.", "details": []}, {"x": -0.2980770523356312, "y": 0.44098817327562, "z": 0.8465692540495037, "word": "Tubulous", "pos_group": "adjective", "row_number": 163076, "definition": "Containing or consist um (H. Androsoemum) from which a healing ointment is prepared in Spain; -- called also parkleaves.", "details": []}, {"x": -0.3634116294518398, "y": 0.5295180527669888, "z": 0.7665132871470756, "word": "Twayblade", "pos_group": "noun", "row_number": 163691, "definition": "Any one of several orchidaceous plants which have only two leaves as the species of Listera and of Liparis.", "details": []}, {"x": -0.6388881114181362, "y": 0.2880412488650034, "z": 0.7133401853539841, "word": "Twiner", "pos_group": "noun", "row_number": 163810, "definition": "Any plant which twines about a support.", "details": []}, {"x": -0.3187851870159476, "y": 0.3004814818523296, "z": 0.898936529240544, "word": "Tympanohyal", "pos_group": "adjective", "row_number": 163983, "definition": "Of or pertaining to the tympanum and the hyoidean arch.", "details": []}, {"x": -0.5153548215819153, "y": 0.5236738837607413, "z": 0.6783620503383234, "word": "Tympanums", "pos_group": "other", "row_number": 163985, "definition": "of Tympanum", "details": []}, {"x": -0.5456114224589105, "y": 0.1820228580853587, "z": 0.8180316954842286, "word": "Tympana", "pos_group": "other", "row_number": 163986, "definition": "of Tympanum", "details": []}, {"x": -0.3043459550248232, "y": 0.4626769899197016, "z": 0.8326485108729088, "word": "Ulmaceous", "pos_group": "adjective", "row_number": 164170, "definition": "Of or pertaining to a suborder of urticaceous plants of which the elm is the type.", "details": []}, {"x": -0.6299267274647427, "y": 0.3904692763150758, "z": 0.6713613500042588, "word": "Ulva", "pos_group": "noun", "row_number": 164236, "definition": "A genus of thin papery bright green seaweeds including the kinds called sea lettuce.", "details": []}, {"x": -0.3910363456566378, "y": 0.216227065190234, "z": 0.8946152428025808, "word": "Umbel", "pos_group": "noun", "row_number": 164239, "definition": "A kind of flower cluster in which the flower stalks radiate from a common point as in the carrot and milkweed. It i
