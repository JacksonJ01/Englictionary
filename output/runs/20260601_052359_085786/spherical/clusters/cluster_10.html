ition": "The solid formed by a circle revolving around a line which is the plane of the circle but does not cut it.", "details": []}, {"x": -0.9871026083822262, "y": 0.0468516120020956, "z": -0.153079609934865, "word": "Anomalistical", "pos_group": "adjective", "row_number": 6511, "definition": "Pertaining to the anomaly or angular distance of a planet from its perihelion.", "details": []}, {"x": -0.9739918807065816, "y": 0.0956304807253259, "z": -0.2054133089015887, "word": "Anomaly", "pos_group": "noun", "row_number": 6519, "definition": "The angular distance of a planet from its perihelion as seen from the sun. This is the true anomaly. The eccentric anomaly is a corresponding angle at the center of the elliptic orbit of the planet. The mean anomaly is what the anomaly would be if the planet's angular motion were uniform.", "details": []}, {"x": -0.9796004124199064, "y": 0.0230360419219025, "z": -0.1996305907402998, "word": "Anomaly", "pos_group": "noun", "row_number": 6520, "definition": "The angle measuring apparent irregularities in the motion of a planet.", "details": []}, {"x": -0.9844937746254276, "y": 0.0813514221489465, "z": -0.1554154234241954, "word": "Anorthic", "pos_group": "adjective", "row_number": 6552, "definition": "Having unequal oblique axes; as anorthic crystals.", "details": []}, {"x": -0.9715699054818684, "y": 0.0681935912244045, "z": -0.2267191056745588, "word": "Ansa", "pos_group": "noun", "row_number": 6566, "definition": "A name given to either of the projecting ends of Saturn's ring.", "details": []}, {"x": -0.9857518611946688, "y": 0.0288780017259536, "z": -0.1657085669709391, "word": "Antambulacral", "pos_group": "adjective", "row_number": 6635, "definition": "Away from the ambulacral region.", "details": []}, {"x": -0.977759695069517, "y": 0.1003598946500326, "z": -0.184157188953892, "word": "Antarctic", "pos_group": "adjective", "row_number": 6650, "definition": "Opposite to the northern or arctic pole; relating to the southern pole us state of refraction caused by the absence of the crystalline lens as after operations for cataract. The remedy is the use of powerful convex lenses.", "details": []}, {"x": -0.970278610601274, "y": 0.0727538904761377, "z": -0.2307949072883704, "word": "Aphelion", "pos_group": "noun", "row_number": 7359, "definition": "That point of a planet's or comet's orbit which is most distant from the sun the opposite point being the perihelion.", "details": []}, {"x": -0.985912284990292, "y": 0.0226375638441798, "z": -0.1657241895693617, "word": "Aplanatic", "pos_group": "adjective", "row_number": 7434, "definition": "Having two or more parts of different curvatures so combined as to remove spherical aberration; -- said of a lens.", "details": []}, {"x": -0.9780678068183338, "y": 0.1049281546923698, "z": -0.1799262282671107, "word": "Aplanatism", "pos_group": "noun", "row_number": 7435, "definition": "Freedom from spherical aberration.", "details": []}, {"x": -0.9739177300430394, "y": 0.0336201308085742, "z": -0.2243968402456409, "word": "Apogean", "pos_group": "adjective", "row_number": 7502, "definition": "Connected with the apogee; as apogean (neap) tides which occur when the moon has passed her apogee.", "details": []}, {"x": -0.987929502491045, "y": 0.0562993488666905, "z": -0.144311057874935, "word": "Apogee", "pos_group": "noun", "row_number": 7503, "definition": "That point in the orbit of the moon which is at the greatest distance from the earth.", "details": []}, {"x": -0.9713551958136892, "y": 0.0945041727264741, "z": -0.2180322107006994, "word": "Apogee", "pos_group": "noun", "row_number": 7504, "definition": "Fig.: The farthest or highest point; culmination.", "details": []}, {"x": -0.9817526993109302, "y": 0.015163966507485, "z": -0.1895565654770684, "word": "Apothem", "pos_group": "noun", "row_number": 7632, "definition": "The perpendicular from the center to one of the sides of a regular polygon.", "details": []}, {"x": -0.9830269649681144, "y": 0.0940886912 ; the other the lower apsis; and the line joining them the line of apsides.", "details": []}, {"x": -0.9846451643786744, "y": 0.0167181711930575, "z": -0.1737653677165075, "word": "Apsis", "pos_group": "noun", "row_number": 8146, "definition": "In a curve referred to polar coordinates any point for which the radius vector is a maximum or minimum.", "details": []}, {"x": -0.9799505200004804, "y": 0.1037845888561823, "z": -0.1700756815854078, "word": "Aquarius", "pos_group": "noun", "row_number": 8194, "definition": "The Water-bearer; the eleventh sign in the zodiac which the sun enters about the 20th of January; -- so called from the rains which prevail at that season in Italy and the East.", "details": []}, {"x": -0.9721245996022432, "y": 0.0412451101279513, "z": -0.2308085867958803, "word": "Aquarius", "pos_group": "noun", "row_number": 8195, "definition": "A constellation south of Pegasus.", "details": []}, {"x": -0.9883995611091518, "y": 0.0461660964571774, "z": -0.1446893193609756, "word": "Aquila", "pos_group": "noun", "row_number": 8213, "definition": "A northern constellation southerly from Lyra and Cygnus and preceding the Dolphin; the Eagle.", "details": []}, {"x": -0.9721781302097736, "y": 0.1017898636770366, "z": -0.2109703931703181, "word": "Ara", "pos_group": "noun", "row_number": 8223, "definition": "The Altar; a southern constellation south of the tail of the Scorpion.", "details": []}, {"x": -0.979778350811826, "y": 0.0145721221160624, "z": -0.1995545953805436, "word": "Arc", "pos_group": "noun", "row_number": 8362, "definition": "A portion of a curved line; as the arc of a circle or of an ellipse.", "details": []}, {"x": -0.9848306205393792, "y": 0.0876190342188672, "z": -0.1497716718561102, "word": "Arc", "pos_group": "noun", "row_number": 8363, "definition": "A curvature in the shape of a circular arc or an arch; as the colored arc (the rainbow); the arc of Hadley's quadrant.", "details": []}, {"x": -0.9696929469430108, "y": 0.0673020981115563, "z nt", "pos_group": "adverb", "row_number": 9640, "definition": "With the eye directed to one side; not in the straight line of vision; obliquely; awry so as to see distortedly; as to look asquint.", "details": []}, {"x": -0.9890210316229708, "y": 0.0407984340897933, "z": -0.1420312880433585, "word": "Assurgent", "pos_group": "adjective", "row_number": 9984, "definition": "rising obliquely; curving upward.", "details": []}, {"x": -0.971925684529894, "y": 0.107558221476623, "z": -0.2092646476208597, "word": "Astatic", "pos_group": "adjective", "row_number": 9998, "definition": "Having little or no tendency to take a fixed or definite position or direction: thus a suspended magnetic needle when rendered astatic loses its polarity or tendency to point in a given direction.", "details": []}, {"x": -0.9787840095468092, "y": 0.0114068093735879, "z": -0.2045769961539813, "word": "Asteriated", "pos_group": "adjective", "row_number": 10007, "definition": "Radiated with diverging rays; as asteriated sapphire.", "details": []}, {"x": -0.9858010849341154, "y": 0.0864627352133286, "z": -0.1439458799762978, "word": "Asterism", "pos_group": "noun", "row_number": 10015, "definition": "A constellation.", "details": []}, {"x": -0.968514959392156, "y": 0.0721208957878375, "z": -0.2382799820051404, "word": "Asterism", "pos_group": "noun", "row_number": 10016, "definition": "A small cluster of stars.", "details": []}, {"x": -0.9869955269491952, "y": 0.0179069699625363, "z": -0.1597472072026348, "word": "Asteroid", "pos_group": "noun", "row_number": 10023, "definition": "A starlike body; esp. one of the numerous small planets whose orbits lie between those of Mars and Jupiter; -- called also planetoids and minor planets.", "details": []}, {"x": -0.9770232065537, "y": 0.1124555975343191, "z": -0.1810508007127428, "word": "Astigmatism", "pos_group": "noun", "row_number": 10038, "definition": "A defect of the eye or of a lens in consequence of which the rays derived from one point are not bro ccordance with the methods or principles of astronomy.", "details": []}, {"x": -0.9764269176445192, "y": 0.0145613111534666, "z": -0.2153565478844677, "word": "Astronomy", "pos_group": "noun", "row_number": 10145, "definition": "Astrology.", "details": []}, {"x": -0.9874398684411964, "y": 0.0766648787132968, "z": -0.1381484802113597, "word": "Astronomy", "pos_group": "noun", "row_number": 10146, "definition": "The science which treats of the celestial bodies of their magnitudes motions distances periods of revolution eclipses constitution physical condition and of the causes of their various phenomena.", "details": []}, {"x": -0.9681763795357506, "y": 0.083407609727516, "z": -0.2359611594067727, "word": "Astrophotography", "pos_group": "noun", "row_number": 10149, "definition": "The application of photography to the delineation of the sun moon and stars.", "details": []}, {"x": -0.985564203569362, "y": 0.0110583797453842, "z": -0.1689405601982417, "word": "Astrophysical", "pos_group": "adjective", "row_number": 10150, "definition": "Pertaining to the physics of astronomical science.", "details": []}, {"x": -0.9791921416971467, "y": 0.1112177446064214, "z": -0.1697449938089945, "word": "Astroscope", "pos_group": "noun", "row_number": 10152, "definition": "An old astronomical instrument formed of two cones on whose surface the constellations were delineated.", "details": []}, {"x": -0.9711230691140657, "y": 0.0358509650636281, "z": -0.23587007639479, "word": "Astroscopy", "pos_group": "noun", "row_number": 10153, "definition": "Observation of the stars.", "details": []}, {"x": -0.9894273579784516, "y": 0.0466387051223068, "z": -0.137325651166471, "word": "Asymmetrical", "pos_group": "adjective", "row_number": 10181, "definition": "Not symmetrical; wanting proportion; esp. not bilaterally symmetrical.", "details": []}, {"x": -0.970456704299021, "y": 0.1063918806409576, "z": -0.2165515015296886, "word": "Asymptote", "pos_group": "noun", "row_number": 10185, "definition" ": 28583, "definition": "Adjoining; near; either in space; time or thought; -- often followed by to.", "details": []}, {"x": -0.9877048543352256, "y": -0.0130098863273795, "z": -0.1557878800817945, "word": "Cloud", "pos_group": "other", "row_number": 28671, "definition": "To overspread or hide with a cloud or clouds; as the sky is clouded.", "details": []}, {"x": -0.9769958091666572, "y": 0.1377136796017673, "z": -0.1628316041846005, "word": "Cloud-capped", "pos_group": "adjective", "row_number": 28680, "definition": "Having clouds resting on the top or head; reaching to the clouds; as cloud-capped mountains.", "details": []}, {"x": -0.9659402446817033, "y": 0.0204316722279365, "z": -0.2579573423537731, "word": "Cloudy", "pos_group": "noun", "row_number": 28689, "definition": "Overcast or obscured with clouds; clouded; as a cloudy sky.", "details": []}, {"x": -0.9929680109482976, "y": 0.0425424891711974, "z": -0.1104747294565609, "word": "Coast", "pos_group": "other", "row_number": 28975, "definition": "The exterior line limit or border of a country; frontier border.", "details": []}, {"x": -0.9641258101886326, "y": 0.1274104891753025, "z": -0.2328690391104472, "word": "Cognoscenti", "pos_group": "other", "row_number": 29460, "definition": "of Cognoscente", "details": []}, {"x": -0.9795997738049635, "y": -0.0200227880022248, "z": -0.1999584234831889, "word": "Coin", "pos_group": "noun", "row_number": 29535, "definition": "A quoin; a corner or external angle; a wedge. See Coigne and Quoin.", "details": []}, {"x": -0.9856336807068103, "y": 0.1125789081234115, "z": -0.1259056666798053, "word": "Coincide", "pos_group": "noun", "row_number": 29550, "definition": "To occupy the same place in space as two equal triangles when placed one on the other.", "details": []}, {"x": -0.9612012476636106, "y": 0.0645536297521889, "z": -0.2681883486949711, "word": "Coincidence", "pos_group": "noun", "row_number": 29553, "definition": "The condition of occupying the same place in space pass", "pos_group": "other", "row_number": 30695, "definition": "To curve; to bend into a circular form.", "details": []}, {"x": -0.9723996073080076, "y": -0.0096500623523137, "z": -0.2331220281394041, "word": "Compassless", "pos_group": "adjective", "row_number": 30711, "definition": "Having no compass.", "details": []}, {"x": -0.990702875032297, "y": 0.0820076659140806, "z": -0.1085474833152074, "word": "Complanar", "pos_group": "adjective", "row_number": 30823, "definition": "See Coplanar.", "details": []}, {"x": -0.9603660806361982, "y": 0.0992485746907551, "z": -0.2604740132629761, "word": "Concavities", "pos_group": "other", "row_number": 31152, "definition": "of Concavity", "details": []}, {"x": -0.986787208153738, "y": -0.0180266399953859, "z": -0.1610156702766166, "word": "Concavo-convex", "pos_group": "adjective", "row_number": 31155, "definition": "Concave on one side and convex on the other as an eggshell or a crescent.", "details": []}, {"x": -0.978157771552152, "y": 0.1378071508669957, "z": -0.1556167186456816, "word": "Concavo-convex", "pos_group": "adjective", "row_number": 31156, "definition": "Specifically having such a combination of concave and convex sides as makes the focal axis the shortest line between them. See Illust. under Lens.", "details": []}, {"x": -0.9644045504292073, "y": 0.0252715606947666, "z": -0.2632208413699211, "word": "Concentre", "pos_group": "other", "row_number": 31207, "definition": "To draw or direct to a common center; to bring together at a focus or point as two or more lines; to concentrate.", "details": []}, {"x": -0.9933286132792264, "y": 0.0352646154968415, "z": -0.1097937745713691, "word": "Concentric", "pos_group": "noun", "row_number": 31222, "definition": "That which has a common center with something else.", "details": []}, {"x": -0.9643909634126732, "y": 0.1332521173577773, "z": -0.228459937204853, "word": "Concentricity", "pos_group": "noun", "row_number": 31224, "definition": "The state of being concentric." om the line of a circle; as an eccentric or elliptical orbit; pertaining to deviation from the center or from true circular motion.", "details": []}, {"x": -0.9900956578367458, "y": 0.1041599144828343, "z": -0.0941344811838387, "word": "Eccentric", "pos_group": "adjective", "row_number": 49276, "definition": "Not having the same center; -- said of circles ellipses spheres etc. which though coinciding either in whole or in part as to area or volume have not the same center; -- opposed to concentric.", "details": []}, {"x": -0.954046193734746, "y": 0.0921543914387692, "z": -0.285137560413906, "word": "Eccentric", "pos_group": "noun", "row_number": 49280, "definition": "A circle not having the same center as another contained in some measure within the first.", "details": []}, {"x": -0.9900100998180978, "y": -0.0301194851268061, "z": -0.1377418559256999, "word": "Eccentric", "pos_group": "noun", "row_number": 49282, "definition": "In the Ptolemaic system the supposed circular orbit of a planet about the earth but with the earth not in its center.", "details": []}, {"x": -0.9730116292167454, "y": 0.1623247832072972, "z": -0.1640092502442425, "word": "Eccentric", "pos_group": "noun", "row_number": 49283, "definition": "A circle described about the center of an elliptical orbit with half the major axis for radius.", "details": []}, {"x": -0.9620672559968318, "y": 0.0007699054186774, "z": -0.2728112940924053, "word": "Eccentricities", "pos_group": "other", "row_number": 49287, "definition": "of Eccentricity", "details": []}, {"x": -0.995213092634576, "y": 0.0464906156404245, "z": -0.0859623342289927, "word": "Eccentricity", "pos_group": "noun", "row_number": 49288, "definition": "The state of being eccentric; deviation from the customary line of conduct; oddity.", "details": []}, {"x": -0.9572388458996371, "y": 0.1407655700870173, "z": -0.2527426481201927, "word": "Eccentricity", "pos_group": "noun", "row_number": 49289, "definition": "The ratio of the distance between the efinition": "A small eminence of a conical form of land or of ice; a knoll; a hillock. See Hummock.", "details": []}, {"x": -0.9666885911687376, "y": 0.1859505302668208, "z": -0.1758850988506121, "word": "Homography", "pos_group": "noun", "row_number": 73425, "definition": "A relation between two figures such that to any point of the one corresponds one and but one point in the other and vise versa. Thus a tangent line rolling on a circle cuts two fixed tangents of the circle in two sets of points that are homographic.", "details": []}, {"x": -0.9599163332292, "y": -0.0255852485705672, "z": -0.2791165137633198, "word": "Homotropous", "pos_group": "adjective", "row_number": 73501, "definition": "Having the radicle of the seed directed towards the hilum.", "details": []}, {"x": -0.9961256194582636, "y": 0.0612176451437511, "z": -0.0631359658352045, "word": "Hook", "pos_group": "noun", "row_number": 73655, "definition": "See Eccentric and V-hook.", "details": []}, {"x": -0.9494615795825544, "y": 0.1448562394487278, "z": -0.2784589355531144, "word": "Hope", "pos_group": "noun", "row_number": 73728, "definition": "A sloping plain between mountain ridges.", "details": []}, {"x": -0.98204660539102, "y": -0.0654092339800326, "z": -0.1769352902903188, "word": "Horizon", "pos_group": "noun", "row_number": 73787, "definition": "The circle which bounds that part of the earth's surface visible to a spectator from a given point; the apparent junction of the earth and sky.", "details": []}, {"x": -0.9806525128665664, "y": 0.1610930910061344, "z": -0.1112189958531301, "word": "Horizon", "pos_group": "noun", "row_number": 73788, "definition": "A plane passing through the eye of the spectator and at right angles to the vertical at a given place; a plane tangent to the earth's surface at that place; called distinctively the sensible horizon.", "details": []}, {"x": -0.9500772478558788, "y": 0.0373595768125808, "z": -0.3097700520175957, "word": "Horizon", "pos_group": "noun", "row_number": 73789, "definition": "A plane parallel to the sensible horizon of a place and passing through the earth's center; -- called also rational / celestial horizon.", "details": []}, {"x": -0.9965590467767408, "y": -0.0067753024486411, "z": -0.0826084836089055, "word": "Horizon", "pos_group": "noun", "row_number": 73790, "definition": "The unbroken line separating sky and water as seen by an eye at a given elevation no land being visible.", "details": []}, {"x": -0.9585614873508436, "y": 0.1821662325804787, "z": -0.2190327342548901, "word": "Horizon", "pos_group": "noun", "row_number": 73792, "definition": "The chief horizontal line in a picture of any sort which determines in the picture the height of the eye of the spectator; in an extended landscape the representation of the natural horizon corresponds with this line.", "details": []}, {"x": -0.9680802278754692, "y": -0.0524136289012046, "z": -0.2450989267662878, "word": "Horizontal", "pos_group": "adjective", "row_number": 73793, "definition": "Pertaining to or near the horizon.", "details": []}, {"x": -0.9920428027178756, "y": 0.104574775253928, "z": -0.0701084442578264, "word": "Horizontal", "pos_group": "adjective", "row_number": 73794, "definition": "Parallel to the horizon; on a level; as a horizontalline or surface.", "details": []}, {"x": -0.947142898461412, "y": 0.1077291482490764, "z": -0.3021833226894626, "word": "Horizontal", "pos_group": "adjective", "row_number": 73795, "definition": "Measured or contained in a plane of the horizon; as horizontal distance.", "details": []}, {"x": -0.989381528292179, "y": -0.0540364231013605, "z": -0.1349231501731372, "word": "Horizontality", "pos_group": "noun", "row_number": 73796, "definition": "The state or quality of being horizontal.", "details": []}, {"x": -0.9719797519015, "y": 0.1814599113573118, "z": -0.1494244373042612, "word": "Horn", "pos_group": "noun", "row_number": 73812, "definition": "A curved projection on the fore part of a plane.", "details": []}, efinition": "The planisphere invented by Jean Paduanus.", "details": []}, {"x": -0.9632811421579832, "y": 0.1871987979325226, "z": -0.1924735078275179, "word": "Horoscopist", "pos_group": "noun", "row_number": 73885, "definition": "One versed in horoscopy; an astrologer.", "details": []}, {"x": -0.9627264373012852, "y": -0.0379411124233299, "z": -0.2678026865235953, "word": "House", "pos_group": "noun", "row_number": 74160, "definition": "A twelfth part of the heavens as divided by six circles intersecting at the north and south points of the horizon used by astrologers in noting the positions of the heavenly bodies and casting horoscopes or nativities. The houses were regarded as fixed in respect to the horizon and numbered from the one at the eastern horizon called the ascendant first house or house of life downward or in the direction of the earth's revolution the stars and planets passing through them in the reverse order every twenty-four hours.", "details": []}, {"x": -0.9949385935312048, "y": 0.0781699382724244, "z": -0.0631399703249347, "word": "Huyghenian", "pos_group": "adjective", "row_number": 74818, "definition": "Pertaining to or invented by Christian Huyghens a Dutch astronomer of the seventeenth century; as the Huyghenian telescope.", "details": []}, {"x": -0.9479494673118232, "y": 0.1321827224875005, "z": -0.2896886868675111, "word": "Hyads", "pos_group": "other", "row_number": 74835, "definition": "A cluster of five stars in the face of the constellation Taurus supposed by the ancients to indicate the coming of rainy weather when they rose with the sun.", "details": []}, {"x": -0.985014335448812, "y": -0.0637044199686996, "z": -0.1602763420994712, "word": "Hydra", "pos_group": "noun", "row_number": 74881, "definition": "A southern constellation of great length lying southerly from Cancer Leo and Virgo.", "details": []}, {"x": -0.9773361590729884, "y": 0.1712331588050249, "z": -0.1244718341397417, "word": "Hydrus", "pos_group": "noun", "row_number": 75097, "definition": "A constellation of the southern hemisphere near the south pole.", "details": []}, {"x": -0.9515489643313838, "y": 0.0206651266259602, "z": -0.3068020877070491, "word": "Hyperbola", "pos_group": "noun", "row_number": 75239, "definition": "A curve formed by a section of a cone when the cutting plane makes a greater angle with the base than the side of the cone makes. It is a plane curve such that the difference of the distances from any point of it to two fixed points called foci is equal to a given distance. See Focus. If the cutting plane be produced so as to cut the opposite cone another curve will be formed which is also an hyperbola. Both curves are regarded as branches of the same hyperbola. See Illust. of Conic section and Focus.", "details": []}, {"x": -0.997255513001744, "y": 0.0076793466540353, "z": -0.0736374186307186, "word": "Hyperbolical", "pos_group": "adjective", "row_number": 75242, "definition": "Belonging to the hyperbola; having the nature of the hyperbola.", "details": []}, {"x": -0.9556099937542596, "y": 0.1775195922683064, "z": -0.2351517259087813, "word": "Hyperbolically", "pos_group": "adverb", "row_number": 75244, "definition": "In the form of an hyperbola.", "details": []}, {"x": -0.9712866741337424, "y": -0.0600518350563302, "z": -0.2302085440564278, "word": "Hyperboliform", "pos_group": "adjective", "row_number": 75246, "definition": "Having the form or nearly the form of an hyperbola.", "details": []}, {"x": -0.9898147870690795, "y": 0.1204661721047817, "z": -0.075859005251939, "word": "Hyperboloid", "pos_group": "noun", "row_number": 75253, "definition": "A surface of the second order which is cut by certain planes in hyperbolas; also the solid bounded in part by such a surface.", "details": []}, {"x": -0.9467700609622468, "y": 0.0918995895102536, "z": -0.3085140468656006, "word": "Hyperboloid", "pos_group": "adjective", "row_number": 75254, "definition": "Having some property that belongs to an hyperboloid or hyperbola.", "details": []}, {"x": -0.9917102545537644, "y": -0.0466135506106777, "z": -0.1197411704985946, "word": "Hyperborean", "pos_group": "adjective", "row_number": 75255, "definition": "Of or pertaining to the region beyond the North wind or to its inhabitants.", "details": []}, {"x": -0.968466092104623, "y": 0.186322155506817, "z": -0.1654009758462556, "word": "Hyperborean", "pos_group": "adjective", "row_number": 75256, "definition": "Northern; belonging to or inhabiting a region in very far north; most northern; hence very cold; fright as a hyperborean coast or atmosphere.", "details": []}, {"x": -0.9577622234652292, "y": -0.0187104576534019, "z": -0.2869519856654424, "word": "Hyperdicrotous", "pos_group": "adjective", "row_number": 75272, "definition": "Hyperdicrotic.", "details": []}, {"x": -0.996794077965714, "y": 0.0506593824420037, "z": -0.0619289359110647, "word": "Hyperopia", "pos_group": "noun", "row_number": 75289, "definition": "Hypermetropia.", "details": []}, {"x": -0.9499009449187514, "y": 0.1535057360405307, "z": -0.2722575689399981, "word": "Hyperorganic", "pos_group": "adjective", "row_number": 75290, "definition": "Higher than or beyond the sphere of the organic.", "details": []}, {"x": -0.979999284751016, "y": -0.0676474825094631, "z": -0.1871502604797253, "word": "Hyperspace", "pos_group": "noun", "row_number": 75306, "definition": "An imagined space having more than three dimensions.", "details": []}, {"x": -0.9825026052990858, "y": 0.1556936445895521, "z": -0.1022160438235166, "word": "Hypocycloid", "pos_group": "noun", "row_number": 75387, "definition": "A curve traced by a point in the circumference of a circle which rolls on the concave side in the fixed circle. Cf. Epicycloid and Trochoid.", "details": []}, {"x": -0.9486667440209092, "y": 0.0475189657255172, "z": -0.3126873145574405, "word": "Hyponasty", "pos_group": "noun", "row_number": 75415, "definition": "Downward convexity or convexity of the inferior surface.", "details": []}, { e or plane; -- said of a line or plane.", "details": []}, {"x": -0.9568509994209377, "y": 0.1828069553425983, "z": -0.2258711623592577, "word": "Inclined", "pos_group": "other", "row_number": 77916, "definition": "Bent out of a perpendicular position or into a curve with the convex side uppermost.", "details": []}, {"x": -0.9689507622069614, "y": -0.0576684280652172, "z": -0.2404345499778167, "word": "Inclining", "pos_group": "noun", "row_number": 77919, "definition": "Inclination; disposition.", "details": []}, {"x": -0.991288730276732, "y": 0.111613968534094, "z": -0.0699212074725194, "word": "Inclinnometer", "pos_group": "noun", "row_number": 77921, "definition": "An apparatus to determine the inclination of the earth's magnetic force to the plane of the horizon; -- called also inclination compass and dip circle.", "details": []}, {"x": -0.9462035606241246, "y": 0.1025271641574662, "z": -0.3068990102168084, "word": "Incoordinate", "pos_group": "adjective", "row_number": 78191, "definition": "Not coordinate.", "details": []}, {"x": -0.9903410498776636, "y": -0.0534770596059998, "z": -0.127925013281622, "word": "Increase", "pos_group": "other", "row_number": 78276, "definition": "The period of increasing light or luminous phase; the waxing; -- said of the moon.", "details": []}, {"x": -0.9703228844706916, "y": 0.1857661120409053, "z": -0.1548045590080691, "word": "Increscent", "pos_group": "adjective", "row_number": 78308, "definition": "Increasing; on the increase; -- said of the moon represented as the new moon with the points turned toward the dexter side.", "details": []}, {"x": -0.95566361852755, "y": -0.0110670583718205, "z": -0.2942525589384464, "word": "Incurvation", "pos_group": "noun", "row_number": 78411, "definition": "The state of being bent or curved; curvature.", "details": []}, {"x": -0.9973018119469952, "y": 0.0398957405705019, "z": -0.0616232567426592, "word": "Indentation", "pos_group": "noun", "row_number": 78543, "definition": "A recess or sharp depression in any surface.", "details": []}, {"x": -0.9505222947174972, "y": 0.1616891324950076, "z": -0.2652621188145704, "word": "India", "pos_group": "noun", "row_number": 78617, "definition": "A country in Southern Asia; the two peninsulas of Hither and Farther India; in a restricted sense Hither India or Hindostan.", "details": []}, {"x": -0.9778448485795624, "y": -0.0689927732484995, "z": -0.1976346359975746, "word": "Indicatrix", "pos_group": "noun", "row_number": 78656, "definition": "A certain conic section supposed to be drawn in the tangent plane to any surface and used to determine the accidents of curvature of the surface at the point of contact. The curve is similar to the intersection of the surface with a parallel to the tangent plane and indefinitely near it. It is an ellipse when the curvature is synclastic and an hyperbola when the curvature is anticlastic.", "details": []}, {"x": -0.984329066211076, "y": 0.1494435939877935, "z": -0.0936103713700727, "word": "Indistancy", "pos_group": "noun", "row_number": 78810, "definition": "Want of distance o/ separation; nearness.", "details": []}, {"x": -0.9473987417087322, "y": 0.0580394569136593, "z": -0.3147491789502852, "word": "Inequality", "pos_group": "noun", "row_number": 79123, "definition": "Unevenness; want of levelness; the alternate rising and falling of a surface; as the inequalities of the surface of the earth or of a marble slab etc.", "details": []}, {"x": -0.9953709667311116, "y": -0.0257129863352346, "z": -0.092603892588254, "word": "Inequality", "pos_group": "noun", "row_number": 79127, "definition": "An irregularity or a deviation in the motion of a planet or satellite from its uniform mean motion; the amount of such deviation.", "details": []}, {"x": -0.9615345462855472, "y": 0.1893160320277655, "z": -0.1990245118489402, "word": "Inequidistant", "pos_group": "adjective", "row_number": 79129, "definition": "Not equally distant; not equidistant.", "details": []}, {"x": -0.96342367962923 lly distant from the two edges and occupying one third of it.", "details": []}, {"x": -0.9898827042606566, "y": 0.1322230977805802, "z": -0.0514711979549408, "word": "Palearctic", "pos_group": "adjective", "row_number": 108458, "definition": "Belonging to a region of the earth's surface which includes all Europe to the Azores Iceland and all temperate Asia.", "details": []}, {"x": -0.9377118883446246, "y": 0.0989798776531864, "z": -0.3330156126624078, "word": "Palet", "pos_group": "noun", "row_number": 108594, "definition": "A perpendicular band upon an escutcheon one half the breadth of the pale.", "details": []}, {"x": -0.991981691538473, "y": -0.0696073739032729, "z": -0.1054852461283546, "word": "Pampero", "pos_group": "noun", "row_number": 108794, "definition": "A violent wind from the west or southwest which sweeps over the pampas of South America and the adjacent seas often doing great damage.", "details": []}, {"x": -0.9641038166692492, "y": 0.2123375840068071, "z": -0.159425785561618, "word": "Pan", "pos_group": "noun", "row_number": 108808, "definition": "The distance comprised between the angle of the epaule and the flanked angle.", "details": []}, {"x": -0.950907998930232, "y": -0.0348915435192773, "z": -0.3075005004245432, "word": "Panicle", "pos_group": "noun", "row_number": 108951, "definition": "A pyramidal form of inflorescence in which the cluster is loosely branched below and gradually simpler toward the end.", "details": []}, {"x": -0.9982443540536636, "y": 0.0477090537960343, "z": -0.0351006522143261, "word": "Panorama", "pos_group": "noun", "row_number": 108986, "definition": "A complete view in every direction.", "details": []}, {"x": -0.9415990891850976, "y": 0.1732183941517288, "z": -0.2887672820339781, "word": "Panorama", "pos_group": "noun", "row_number": 108987, "definition": "A picture presenting a view of objects in every direction as from a central point.", "details": []}, {"x": -0.9777755560971008, "y": -0.0945668161972701, "z": -0.18 er": 109232, "definition": "Having the form or nature of a parabola; pertaining to or resembling a parabola; as a parabolic curve.", "details": []}, {"x": -0.9379122747946014, "y": 0.1303765560352103, "z": -0.3214382031215546, "word": "Parabolical", "pos_group": "adjective", "row_number": 109233, "definition": "Generated by the revolution of a parabola or by a line that moves on a parabola as a directing curve; as a parabolic conoid.", "details": []}, {"x": -0.9872159164863374, "y": -0.0850799277640946, "z": -0.1347818241740978, "word": "Parabolically", "pos_group": "adverb", "row_number": 109234, "definition": "By way of parable; in a parabolic manner.", "details": []}, {"x": -0.9706574625607356, "y": 0.2037313406688433, "z": -0.1277404838116334, "word": "Parabolically", "pos_group": "adverb", "row_number": 109235, "definition": "In the form of a parabola.", "details": []}, {"x": -0.945733029543784, "y": -0.0067330655557202, "z": -0.3248749030906486, "word": "Paraboliform", "pos_group": "adjective", "row_number": 109236, "definition": "Resembling a parabola in form.", "details": []}, {"x": -0.9990451011247232, "y": 0.014765914663509, "z": -0.041119991279688, "word": "Paraboloid", "pos_group": "noun", "row_number": 109239, "definition": "The solid generated by the rotation of a parabola about its axis; any surface of the second order whose sections by planes parallel to a given line are parabolas.", "details": []}, {"x": -0.9453196566250232, "y": 0.1936229522536703, "z": -0.2624517082415751, "word": "Paracentrical", "pos_group": "adjective", "row_number": 109248, "definition": "Deviating from circularity; changing the distance from a center.", "details": []}, {"x": -0.9712103177807244, "y": -0.0917227727429678, "z": -0.2198577985803689, "word": "Paracorolla", "pos_group": "noun", "row_number": 109260, "definition": "A secondary or inner corolla; a corona as of the Narcissus.", "details": []}, {"x": -0.9867502661189016, "y": 0.1502450365891499, "z": -0.06124003016493 ty.", "details": []}, {"x": -0.975166386706808, "y": -0.1012799121568073, "z": -0.1969591268022326, "word": "Polaris", "pos_group": "noun", "row_number": 116609, "definition": "The polestar. See North star under North.", "details": []}, {"x": -0.9823634269630604, "y": 0.1728523415221144, "z": -0.0713033336928525, "word": "Polarity", "pos_group": "noun", "row_number": 116615, "definition": "A property of the conic sections by virtue of which a given point determines a corresponding right line and a given right line determines a corresponding point. See Polar n.", "details": []}, {"x": -0.9369205204347252, "y": 0.0547985949748707, "z": -0.3452202954304741, "word": "Polarizable", "pos_group": "adjective", "row_number": 116616, "definition": "Susceptible of polarization.", "details": []}, {"x": -0.9967310051934436, "y": -0.0453241878406423, "z": -0.0668806495382177, "word": "Polarization", "pos_group": "noun", "row_number": 116618, "definition": "A peculiar affection or condition of the rays of light or heat in consequence of which they exhibit different properties in different directions.", "details": []}, {"x": -0.953948614636331, "y": 0.2204728100818437, "z": -0.2034054587469087, "word": "Polarized", "pos_group": "other", "row_number": 116620, "definition": "of Polarize", "details": []}, {"x": -0.9571965735023592, "y": -0.0714313675108568, "z": -0.2804857918163973, "word": "Polarizing", "pos_group": "other", "row_number": 116621, "definition": "of Polarize", "details": []}, {"x": -0.9951867947927846, "y": 0.0932287905685201, "z": -0.0301933118288661, "word": "Polary", "pos_group": "adjective", "row_number": 116624, "definition": "Tending to a pole; having a direction toward a pole.", "details": []}, {"x": -0.9358774814672044, "y": 0.1423807238155604, "z": -0.3222748348356717, "word": "Pole", "pos_group": "noun", "row_number": 116637, "definition": "Either extremity of an axis of a sphere; especially one of the extremities of the earth's axis; as the north pole.", "de ht and plane of projection in each.", "details": []}, {"x": -0.934495042082088, "y": 0.1030570411980358, "z": -0.3407319512219283, "word": "Projection", "pos_group": "noun", "row_number": 120801, "definition": "Any method of representing the surface of the earth upon a plane.", "details": []}, {"x": -0.9916835678729016, "y": -0.0782839026044628, "z": -0.1021534718151423, "word": "Prolate", "pos_group": "adjective", "row_number": 120811, "definition": "Stretched out; extended; especially elongated in the direction of a line joining the poles; as a prolate spheroid; -- opposed to oblate.", "details": []}, {"x": -0.9628268856549138, "y": 0.2207478663103372, "z": -0.155675199628884, "word": "Prolatum", "pos_group": "noun", "row_number": 120817, "definition": "A prolate spheroid. See Ellipsoid of revolution under Ellipsoid.", "details": []}, {"x": -0.9481568621467816, "y": -0.0389237989438597, "z": -0.3154100547537235, "word": "Prominent", "pos_group": "adjective", "row_number": 120915, "definition": "Standing out or projecting beyond the line surface of something; jutting; protuberant; in high relief; as a prominent figure on a vase.", "details": []}, {"x": -0.9986449647359223, "y": 0.0449415994065896, "z": -0.0262390367652111, "word": "Promontory", "pos_group": "noun", "row_number": 120944, "definition": "A high point of land or rock projecting into the sea beyond the line of coast; a headland; a high cape.", "details": []}, {"x": -0.9388268576986204, "y": 0.1810227737468283, "z": -0.292975914792904, "word": "Prone", "pos_group": "adjective", "row_number": 121001, "definition": "Sloping with reference to a line or surface; declivous; inclined; not level.", "details": []}, {"x": -0.9765307314362508, "y": -0.1036119911549788, "z": -0.1888181290275948, "word": "Prong", "pos_group": "noun", "row_number": 121013, "definition": "A sharp projection as of an antler.", "details": []}, {"x": -0.9807389838011707, "y": 0.180100779411679, "z": -0.0755959979625411, "word": "Prospect
