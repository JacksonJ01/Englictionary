<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 16, "radius": 285.0, "nodes": [{"x": -0.5097844912385093, "y": 0.0464165969129286, "z": -0.859049050999835, "word": "Action plans, CompTIA troubleshooting process", "pos_group": "other", "row_number": 70, "definition": "Step 4 of the official CompTIA 6-step troubleshooting methodology. After identifying the root cause of a technical problem, the technician establishes a clear plan of action to resolve the issue and implement the solution safely, ensuring no secondary systems are broken in the process.", "details": [{"label": "TROUBLESHOOTING", "value": "Always document your plan before executing any changes; identify potential risks or side effects of your plan; schedule necessary downtime if the fix impacts production environments; make sure you have a working backup of critical data before proceeding with the fix."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5038155381863492, "y": 0.0295552662220032, "z": -0.8633055019635549, "word": "Administrative Tools: Event Viewer", "pos_group": "other", "row_number": 87, "definition": "A core system utility (\"eventvwr.msc\") that maintains detailed diagnostic logs regarding system software, security triggers, hardware events, and application operations. It categorizes logs into Critical, Error, Warning, Information, and Verbose levels to help track system stability.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch Event Viewer; expand the Windows Logs directory tree; select the System log to look for red \"Error\" or \"Critical\" flags timestamped at the exact moment of the system crash; isolate the specific Event ID and source file listed in the details panel to target the fix."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5238763067278343, "y": 0.0417054332131296, "z": -0.850772749968938, "word": "Analyzing: Detection/analysis phase, incident response", "pos_group": "other", "row_number": 110, "definition": "The critical second phase of the official security incident response lifecycle. Security teams analyze log files, alerts, and system anomalies to confirm that a security breach or incident is actually occurring, determine its scope, and identify the specific type of attack method used.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate and review system logs from firewalls, SIEM (Security Information and Event Management) platforms, and endpoint protection software; capture network traffic samples to verify attack patterns; document all findings carefully before moving to Step 3 (Containment) of the incident response plan."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4964554773026967, "y": 0.0497818175847352, "z": -0.8666335613707281, "word": "Application logs", "pos_group": "other", "row_number": 131, "definition": "Diagnostic data logging files maintained by the operating system (viewable via Event Viewer in Windows under \"Windows Logs > Application\"). These logs track operational events, software warning indicators, and structural crash dump errors generated by installed third-party programs.", "details": [{"label": "TROUBLESHOOTING", "value": "Open Event Viewer (\"eventvwr.msc\"); expand the Windows Logs hierarchy tree; click Application; filter the current view by selecting \"Error\" checkboxes; analyze the specific Event ID, faulting module path, and application return code to find the broken file."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5150707319997223, "y": 0.0183454571867868, "z": -0.8569513318957371, "word": "Applications: Crashes, troubleshooting", "pos_group": "other", "row_number": 133, "definition": "The diagnostic process of isolating, identifying, and fixing software code failure events where a running application suddenly terminates its process loop and closes down abnormally.", "details": [{"label": "TROUBLESHOOTING", "value": "Check active application or system logs for explicit error dump summaries; end hanging processes using Task Manager; verify that the application has the latest software updates and patches installed; execute an application repair configuration inside the Windows Apps and Features Control Panel menu."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5196105144160867, "y": 0.060121470744189, "z": -0.8522853524869507, "word": "Applications: Troubleshooting", "pos_group": "other", "row_number": 146, "definition": "A systematic methodology used to resolve software application issues, configuration bugs, registry errors, and framework conflicts that prevent software from working correctly.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate recent system configuration changes; check application error logs for explicit error details; reset application data back to default settings via the Windows Settings interface; reinstall the application package files to replace corrupted software binaries."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4892800256305657, "y": 0.0308960812453655, "z": -0.8715793071675306, "word": "Articles/KB", "pos_group": "other", "row_number": 158, "definition": "Articles / Knowledge Base (KB). A centralized repository of technical documentation, troubleshooting procedures, known software bug workarounds, and device deployment logs maintained by hardware vendors, software creators, or internal corporate Information Technology (IT) departments.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the exact error code or system behavior flag, navigate to the vendor's documentation portal (such as \u201cMicrosoft Learn\u201d), and input the explicit code to pull up the step-by-step resolution instruction document."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5322699016477815, "y": 0.028089544311753, "z": -0.8461085800889971, "word": "Asset management", "pos_group": "other", "row_number": 159, "definition": "The operational tracking process of registering, monitoring, lifecycle auditing, and securing all physical hardware devices (such as laptops, servers, and routers) and digital software licenses owned by an enterprise organization.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy automated asset discovery scans across all network zones; paste physical barcode asset tags onto all company computers; catalog every serial number, physical location, and assigned user into a centralized Configuration Management Database (CMDB)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4992953298431958, "y": 0.0662922479576476, "z": -0.8638920716487078, "word": "Audit logs", "pos_group": "other", "row_number": 178, "definition": "Automated, chronological security records maintained by operating systems or security software that log user account activity, access requests, file modifications, system events, and administrative configuration changes to provide an audit trail.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Local Security Policy tool by running \u201csecpol.msc\u201d, navigate to \u201cLocal Policies > Audit Policy\u201d, and enable tracking for specific system events (such as \u201cAudit account management\u201d or \u201cAudit object access\u201d) to begin capturing logs in Event Viewer."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5020904716696953, "y": 0.0096127958430358, "z": -0.8647616737660053, "word": "Audit success events", "pos_group": "other", "row_number": 179, "definition": "A specific classification of security log entries generated inside Event Viewer when an audited action completes successfully, such as a user entering the correct credentials to log into a corporate workstation domain profile.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch Event Viewer by running the instruction \u201ceventvwr.msc\u201d, open the \u201cSecurity\u201d log folder, select \u201cFilter Current Log\u201d from the actions menu, and adjust the filters to exclude success codes or limit tracking to critical security event groups."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(n)=>String(n.pos_group||'other');const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+'<br>subcluster: '+(info.pos_group||'other')+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
