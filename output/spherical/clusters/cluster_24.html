 {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.027885168654154437, "y": -0.017334434435997973, "z": 0.9994608220195095, "word": "ESD: CPU installation", "row_number": 873, "definition": "The specific procedure of safely handling the Central Processing Unit (CPU) during installation to ensure that the delicate pins or contacts are not damaged by an electrostatic shock.", "details": [{"label": "TROUBLESHOOTING", "value": "Discharge static by touching the metal chassis, pick up the CPU only by its edges (avoiding pins), and verify the \"socket alignment\" before lowering the chip to prevent bent pins or short circuits."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.0038187809248932756, "y": 0.013533301986963514, "z": 0.9999011284369955, "word": "ESD: Motherboards", "row_number": 875, "definition": "The extreme sensitivity of the motherboard's traces, integrated circuits, and chipsets to electrostatic discharges.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the board for physical signs of damage (burnt traces), ensure all \u201cstandoffs\u201d are installed correctly to prevent shorting the board to the case, and use an ESD mat during all installation procedures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.001129477770831017, "y": -0.03279830831263965, "z": 0.9994613525553623, "word": "ESD: Preventive measures", "row_number": 876, "definition": "The systematic application of tools (wrist straps, anti-static mats) and behaviors (touching the chassis) to keep the technician and the hardware at the same electrical potential.", "details": [{"label": "TROUBLESHOOTING", "value": "Consistently use an ESD strap connected to a verified ground, increase the room's humidity (if below 40%), and store all spare parts in \u201canti-static\u201d (shielded) bags."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02946045641327225, "y": 0.0048068200718572604, "z": 0.9995543887096482, "word": "Grounding equipment", "row_number": 1010, "definition": "The process of creating a safe physical electrical path to the earth to prevent the accumulation of electrostatic charge or to protect equipment from voltage surges.", "details": [{"label": "TROUBLESHOOTING", "value": "Always wear an ESD wrist strap connected to a grounded surface, use anti-static mats when handling sensitive electronics, and ensure that all power outlets are properly grounded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.020450501159140193, "y": -0.002579700192717026, "z": 0.9997875385046845, "word": "IP (Ingress Protection) ratings", "row_number": 1172, "definition": "An international standard (IEC 60529) that classifies the degree of protection provided by electrical enclosures against the intrusion of solid objects (dust) and liquids (water).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the device\u2019s IP rating documentation to determine its limits; if a device exceeds its specified rating, perform a physical inspection for corrosion and clean with appropriate electronics-safe solvents."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02293281231044542, "y": -0.03188981369625501, "z": 0.9992282651636473, "word": "Keyboards: ESD", "row_number": 1208, "definition": "Electrostatic Discharge (ESD)\u2014the sudden flow of electricity between two electrically charged objects\u2014which can damage the sensitive internal circuitry of a keyboard during maintenance or installation.", "details": [{"label": "TROUBLESHOOTING", "value": "Always wear an ESD wrist strap and work on an anti-static mat when disassembling keyboards or internal laptop components to prevent static build-up."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.010291677370013717, "y": 0.02080948336227703, "z": 0.9997304870709439, "word": "Physical safety: Cable management", "row_number": 1801, "definition": "The organized arrangement of electrical and data cabling to prevent safety hazards such as tripping, cable damage, or airflow restriction in server racks.", "de
