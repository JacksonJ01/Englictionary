<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 1, "radius": 285.0, "nodes": [{"x": 0.40759509381433, "y": -0.6328020068366275, "z": 0.6583523825748824, "word": "Accessories: Drawing pads", "row_number": 42, "definition": "External digitizer surfaces used with a stylus pen to capture handwriting or drawing input, translating physical pen strokes into digital coordinate inputs on a workstation screen.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect and reconnect the interface cable; completely remove generic operating system HID (Human Interface Device) pointer drivers and install the vendor's proprietary device driver pack; run the integrated calibration utility to map the pad area to your monitor coordinates."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4223682240120624, "y": -0.6289291996143428, "z": 0.6527274662654838, "word": "Acessories: Styluses", "row_number": 44, "definition": "An input accessory shaped like a pen that is used to navigate touchscreens or drawing pads. Passive styluses simply mimic a human finger touch, while Active styluses incorporate internal batteries and Bluetooth to track advanced metrics like tilt and pressure sensitivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Change the internal battery or charge the active stylus; inspect and replace the plastic pen tip nib if it is worn down or flat; re-pair the device via Bluetooth and verify app configuration support."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40672394265381756, "y": -0.6221509782756488, "z": 0.6689572443009996, "word": "Apple: iPadOS", "row_number": 128, "definition": "A specialized derivative variant of Apple's mobile operating system structured explicitly for iPad tablet hardware layouts. It includes enhanced multi-tasking interfaces, desktop-class browser engines, external display support, and stylus digitizer tracking logic.", "details": [{"label": "TROUBLESHOOTING", "value": "Close running processes via the application switcher; update the system software layer; navigate to accessibility configurations to verify touch gesture parameters are matching operational intents; execute an all-settings reset routine."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.40912531265231505, "y": -0.6421984026298191, "z": 0.6482265732032698, "word": "Drawing pads", "row_number": 769, "definition": "A peripheral input device (digitizer) that allows users to hand-draw images, animations, or graphics using a stylus.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the device drivers, recalibrate the stylus in the manufacturer's control panel, and check the USB connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.42734373871847425, "y": -0.617083473646444, "z": 0.6607460295231101, "word": "iPadOS", "row_number": 1176, "definition": "A derivative version of Apple\u2019s iOS, specifically optimized for the larger display and hardware multitasking capabilities of the iPad tablet.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the OS to the latest version, close background apps using the App Switcher gesture, or perform a reset of \u201cNetwork Settings\u201d if connectivity issues persist."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.39386904205473333, "y": -0.632716783959511, "z": 0.6667358165021736, "word": "Peripherals: Drawing pads", "row_number": 1772, "definition": "A graphics tablet that allows users to hand-draw images and graphics, typically using a stylus, as an input device for digital design.", "details": [{"label": "TROUBLESHOOTING", "value": "Reinstall the manufacturer's tablet drivers, check the USB connection, and recalibrate the stylus through the device's control software."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4257771689537699, "y": -0.6380801558468326, "z": 0.6415352812684543, "word": "Peripherals: Styluses", "row_number": 1780, "definition": "A pen-like input device used on touchscreen devices for precision drawing or note-taking.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the stylus battery (if active), replace the stylus tip if worn, ensure the screen is clean, and check the touch digitizer settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.414389743721795, "y": -0.6108883665407351, "z": 0.6746084374830912, "word": "Picture passwords", "row_number": 1823, "definition": "A Windows feature that allows users to sign in by drawing gestures (taps, circles, lines) on a chosen picture instead of typing a text password.", "details": [{"label": "TROUBLESHOOTING", "value": "If you forget the gesture, use the \"Switch sign-in options\" link to log in using the traditional password; ensure the feature is enabled in \"Settings > Accounts > Sign-in options\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3954442845935009, "y": -0.6475615907836767, "z": 0.6513737820361272, "word": "Smartphone OS: iPadOS", "row_number": 2392, "definition": "A specialized variation branch of Apple\u2019s mobile operating system platform framework optimized specifically for larger tablet screen fields, featuring advanced multitasking side-by-side display parameters and direct external stylus peripheral tracking control loops.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the device maintenance configuration path under \u201cSettings > General > Storage\u201d, verify the quantity of available free flash capacity space, offload non-essential data arrays, and force-close hanging applications by swiping up from the base interface line."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.43798598612840933, "y": -0.620857117939209, "z": 0.6501574540519734, "word": "Styluses", "row_number": 2517, "definition": "A pen-shaped input tool used on touchscreen devices for precision control, drawing, or handwriting.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the stylus battery (if active), verify the stylus is paired with the device, and clean the touchscreen surface to remove oils or dust."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39289762240857823, "y": -0.6213125715944705, "z": 0.6779396335105011, "word": "Tablet OS", "row_number": 2547, "definition": "A mobile-focused operating system specifically designed for touch-screen tablet devices, offering a simplified UI (User Interface) and specialized power management to support long battery life and mobile-specific apps.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a \"Force Restart\" by holding the power and volume buttons, clear the cache for problematic apps in the settings menu, or perform a \"Factory Reset\" to revert the OS to its original state."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.41560336313478424, "y": -0.6500446580070585, "z": 0.6361727651727501, "word": "Tablet OS: iPadOS", "row_number": 2550, "definition": "A derivative of iOS specifically tailored for the iPad, offering enhanced multitasking features, improved file management, and stylus support for professional workflows.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the OS is updated to the latest version, verify that \u201cMultitasking & Gestures\u201d are enabled in Settings, and sign out/back into the Apple ID account."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.42993999656611365, "y": -0.6051606274579241, "z": 0.670024040111593, "word": "Touchscreens", "row_number": 2641, "definition": "A display overlay that allows the user to interact with the GUI (Graphical User Interface) by touching the screen with a finger or a specialized stylus.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the screen with a soft microfiber cloth, recalibrate the touch interface in the OS (Operating System) calibration utility, or update the touchscreen controller driver in \u201cDevice Manager\u201d."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38317237007056565, "y": -0.6427715426107151, "z": 0.6633428064163709, "word": "Windows Ink Workspace", "row_number": 2937, "definition": "A specialized feature panel within modern Windows operating systems designed to centralize and optimize digital stylus input application features, including sticky notes, sketching canvas spaces, and full-screen snip markup capabilities.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to \"Settings > Bluetooth & devices > Pen & Windows Ink\". Ensure digitizer hardware drivers are updated, toggle the taskbar indicator option setting to \"Enabled\", and calibrate display alignment properties by launching Control Panel, opening \"Tablet PC Settings\", and stepping through the visual target calibration grid wizard."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
