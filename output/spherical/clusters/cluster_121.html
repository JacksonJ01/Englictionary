<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 121, "radius": 285.0, "nodes": [{"x": -0.3331500263813402, "y": -0.8941220092351693, "z": -0.2992605762932634, "word": "Drives: Dynamic drives", "row_number": 777, "definition": "An advanced operating system logical disk configuration architecture that enables the creation of volumes that span across multiple physical disks, support striping (RAID 0), mirroring (RAID 1), or software RAID 5 layouts.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the diskmgmt.msc utility, investigate the health status of all physical nodes within the dynamic array group, and click the option labeled Reactivate Disk after verifying data link continuity."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.32010875742662415, "y": -0.896707222675051, "z": -0.3056902684436969, "word": "Fault tolerance: RAID", "row_number": 916, "definition": "Redundant Array of Independent Disks (RAID) is a data storage technology that combines multiple physical disk drives into one or more logical units for data redundancy and performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the failed drive in the RAID controller interface, replace the drive with one of equal or greater capacity, and initiate the \u201cRebuild\u201d process to restore data redundancy."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3300903366973947, "y": -0.8992677094774829, "z": -0.2869807594772201, "word": "Hard drives: RAID", "row_number": 1038, "definition": "Redundant Array of Independent Disks (RAID) is a technology that uses multiple hard drives in combination to provide data redundancy, improve performance, or both (e.g., RAID 0, 1, 5, 10).", "details": [{"label": "TROUBLESHOOTING", "value": "Access the RAID controller\u2019s BIOS (Basic Input/Output System) or software management console, identify the failed drive, replace it with an identical component, and initiate a \"rebuild\" of the array."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.33517510014919255, "y": -0.8894207792179574, "z": -0.31078663056074424, "word": "Partitioning: Dynamic drives", "row_number": 1731, "definition": "A Windows-specific storage type that allows for advanced features like spanned volumes, striped volumes, and RAID (Redundant Array of Independent Disks) 5, offering more flexibility than basic disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \"Disk Management\" to import the foreign disk; ensure the OS is installed on a basic disk (standard requirement); backup all data before attempting to convert a basic disk to a dynamic disk as this can cause data loss."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3119962022309296, "y": -0.9026838092122187, "z": -0.29634491792436013, "word": "RAID (Redundant Array of Independent Disks)", "row_number": 2064, "definition": "A data storage virtualization technology that combines multiple physical disk drive components into one or more logical units for the purposes of data redundancy, performance improvement, or both.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the RAID controller BIOS or UEFI during boot to check the array status; if a drive has failed, replace the physical disk and trigger a rebuild process within the controller's management software."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.34389157340771015, "y": -0.893296148311325, "z": -0.28941419652691674, "word": "RAID: Striping", "row_number": 2065, "definition": "A RAID configuration that spreads data across multiple disks in an array, increasing performance by allowing simultaneous reading and writing, but providing no redundancy if a single drive fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Since striping does not offer redundancy, you must restore the data from a verified off-site or cloud backup; ensure the replacement drives are of identical capacity and speed before recreating the array."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.32053270928320565, "y": -0.8921346082515974, "z": -0.3183624083326058, "word": "RAID: Mirror", "row_number": 2066, "definition": "A RAID configuration that duplicates identical data across two or more disks, ensuring that the system continues to operate even if one drive fails, at the cost of having half (or less) of the total raw disk capacity available.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the faulty drive; the RAID controller will automatically (or with manual intervention) synchronize the data from the healthy 'mirror' drive to the new drive to restore the redundancy."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3200249351881152, "y": -0.905002173791508, "z": -0.28027683866221925, "word": "RAID: Parity", "row_number": 2067, "definition": "A checksum-based method of providing data redundancy in RAID configurations (like RAID 5 or 6), where calculated bits are spread across drives, allowing the system to reconstruct missing data if a single drive fails without needing a full mirror.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the failed drive using the controller\u2019s diagnostic logs, remove it, and insert a new drive to allow the controller to recalculate the missing data using the existing parity information."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.34778325349181216, "y": -0.8859006306728696, "z": -0.30696397372340234, "word": "RAID: RAID 0", "row_number": 2068, "definition": "A configuration that implements 'striping' across disks to improve performance by spreading data access, but it provides no fault tolerance; if one disk fails, all data is lost.", "details": [{"label": "TROUBLESHOOTING", "value": "RAID 0 is not fault-tolerant; you must rely on existing backups and re-initialize the array after replacing the failed physical hardware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3048264880605426, "y": -0.9011203700134622, "z": -0.30832270581888205, "word": "RAID: RAID 1", "row_number": 2069, "definition": "A configuration that implements 'mirroring' across two disks, providing high redundancy; if one disk fails, the data remains intact on the remaining operational disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the faulty drive and allow the array to rebuild the mirror from the surviving operational disk."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3406029464236499, "y": -0.8986853463904604, "z": -0.2763227842046078, "word": "RAID: RAID 4", "row_number": 2070, "definition": "A configuration that uses disk striping with a dedicated parity drive to hold checksum information, though it is rarely used in modern systems because the dedicated parity drive can become a performance bottleneck.", "details": [{"label": "TROUBLESHOOTING", "value": "Troubleshoot via the RAID management interface; if the parity drive is failing, replace it and initiate a rebuild."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3326732463609878, "y": -0.8855162369929022, "z": -0.32432931593917314, "word": "RAID: RAID 5", "row_number": 2071, "definition": "A configuration that uses block-level striping with distributed parity, requiring at least three disks; it offers a balance of performance and redundancy, allowing the array to survive the failure of one disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the single failed drive immediately; once the new drive is inserted, the controller will rebuild the missing data using parity from the surviving drives."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3056598713324837, "y": -0.9083770945684156, "z": -0.28534732716542677, "word": "RAID: RAID 6", "row_number": 2072, "definition": "An extension of RAID 5 that uses 'double distributed parity,' requiring at least four disks; it provides higher fault tolerance than RAID 5 by allowing the array to survive the simultaneous failure of two disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the two failed drives one at a time, allowing the array to rebuild data before replacing the second drive, if supported by the controller."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3557344352868267, "y": -0.8874729800947908, "z": -0.29299269812204104, "word": "RAID: RAID 10 (1 + 0)", "row_number": 2073, "definition": "A nested RAID configuration that combines mirroring (RAID 1) and striping (RAID 0) across at least four disks, providing the high speed of striping and the high redundancy of mirroring.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the failed physical drive; the controller will rebuild the mirror for that specific set of the stripe."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3081972147674048, "y": -0.8946808746542743, "z": -0.32335832962439165, "word": "RAID: Hardware based", "row_number": 2074, "definition": "A RAID implementation where a dedicated physical controller card handles all parity calculations and disk management, offloading the processing burden from the computer's CPU.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the card is seated correctly in the PCIe slot; if the card is dead, you may need to replace it with an identical model to retain access to the existing array configuration."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.3269669011453241, "y": -0.9060212586298958, "z": -0.2687343008737876, "word": "RAID: Software based", "row_number": 2075, "definition": "A RAID implementation where the Operating System (OS) manages the disk array through its own kernel, using the system's CPU for all RAID-related calculations.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the OS event logs for disk driver errors; use the built-in storage management tools (like 'Disk Management' in Windows) to view the status of the virtual volumes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.34914876270526796, "y": -0.8809288356076037, "z": -0.31946756970999707, "word": "RAID: Firmware based", "row_number": 2076, "definition": "A RAID implementation (often called 'FakeRAID') integrated into the motherboard's firmware/BIOS, which manages the drives before the OS loads but still relies on the system CPU for operations.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the BIOS/UEFI setting is set to 'RAID' mode rather than 'AHCI'; ensure the correct chipset drivers are loaded in the OS."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.29539649192213563, "y": -0.9069063079222383, "z": -0.3004361183528869, "word": "Storage drives: RAID (Redundant Array of Independent Disks)", "row_number": 2501, "definition": "A storage technology that uses multiple physical drives to provide redundancy, improved performance, or both by distributing data across the disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the RAID controller interface at boot, identify the failed drive, replace it, and trigger a \"RAID rebuild\" operation to re-sync the array."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.35342391599392226, "y": -0.893981517256531, "z": -0.2754788238816771, "word": "Troubleshooting: RAID (Redundant Array of Independent Disks)", "row_number": 2703, "definition": "Diagnosing failures within a storage subsystem that utilizes multiple drives to provide data redundancy, performance improvement, or both.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the RAID controller utility in the BIOS/UEFI (Unified Extensible Firmware Interface) to identify the failed disk, replace the drive with one of equal or greater capacity, and trigger the 'rebuild' process to restore data parity."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
