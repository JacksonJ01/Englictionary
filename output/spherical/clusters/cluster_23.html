<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 23, "radius": 285.0, "nodes": [{"x": 0.8358080455022372, "y": -0.3326995551347318, "z": -0.43673323332084707, "word": "Command line: Ping command", "row_number": 403, "definition": "A network utility used to test the reachability of a host on an IP (Internet Protocol) network by sending ICMP (Internet Control Message Protocol) echo requests.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical network connectivity, check local IP settings, and ensure that the firewall is not blocking ICMP traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8378464430865533, "y": -0.31915460959778175, "z": -0.44289239435747635, "word": "Loopback plugs", "row_number": 1344, "definition": "A specialized hardware diagnostic testing tool inserted directly into physical interface ports (such as RJ-45 Ethernet network adapters or serial pin interfaces) to redirect the transmitted signals straight back into the receive pins.", "details": [{"label": "TROUBLESHOOTING", "value": "Insert the specialized physical loopback plug tool into the suspected port interface receptacle, check if the adapter's hardware link status LED lights up instantly, and review system diagnostic tool errors to isolate hardware socket failures from transmission wire errors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8427829621883046, "y": -0.3303566299341777, "z": -0.42494867419917826, "word": "Network taps", "row_number": 1551, "definition": "A physical hardware device placed inline between two network devices to capture all traffic passing through the link for analysis by security or monitoring systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the tap is powered (if active), check the cabling to ensure the TX (Transmit) and RX (Receive) lines are properly connected between the tap and the monitoring interface, and verify that the tap is not configured with a \u201cfail-open\u201d mechanism that has been triggered."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8294101442840642, "y": -0.3340402880658357, "z": -0.44776768363469593, "word": "Networking commands: Pathping command", "row_number": 1561, "definition": "A networking utility that provides a combination of \u201cping\u201d and \u201ctracert\u201d functionality by tracking a path and computing packet loss at each hop over an extended period.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cpathping [hostname]\u201d and wait for the utility to complete the extended analysis; examine the packet loss statistics for each router hop to pinpoint the exact network segment where the data is being dropped."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8453769329097987, "y": -0.3115363134216352, "z": -0.433915852123057, "word": "Networking commands: Ping command", "row_number": 1562, "definition": "A basic networking utility used to test the reachability of a host on an IP network and measure the round-trip time for messages sent from the originating host.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cping [IP address]\u201d from the command line; if you receive \u201cRequest timed out\u201d, the destination is unreachable, but if you get a \u201cDestination host unreachable\u201d message, there is likely a local routing or physical layer issue."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8360747410233311, "y": -0.34412688916749756, "z": -0.4272653877564513, "word": "Networking commands: Tracert command", "row_number": 1563, "definition": "A diagnostic tool that displays the route (path) taken by packets across an IP network to reach a destination, listing every router hop along the way.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201ctracert [hostname]\u201d to see the list of hops; analyze the timing and success rate of each hop to determine if the packet is being blocked by a specific firewall or failing at a particular gateway."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8314579775462856, "y": -0.3188091905379397, "z": -0.4550146498775438, "word": "Networks: Network taps", "row_number": 1606, "definition": "A physical hardware device installed inline between two network devices to capture and copy traffic passing through the link for security analysis or monitoring.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the tap is receiving power; verify that the transmit (TX) and receive (RX) cables are connected properly; if the tap is active, bypass the tap temporarily to confirm if the issue is with the network link or the tap hardware itself."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8497495589096579, "y": -0.32060662705478943, "z": -0.41849382052951856, "word": "Networks: SDN (Software Defined Networking)", "row_number": 1624, "definition": "An architecture approach to networking that enables network control to be decoupled from the hardware (the data plane) and handled by a centralized software controller.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the status of the SDN controller software; ensure the communication channel between the controller and the network switches is active; review the software logic and policies for misconfigurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8260742882085463, "y": -0.3469848784400456, "z": -0.4440751788770572, "word": "Ping command", "row_number": 1828, "definition": "A utility that tests the reachability of a host on an IP (Internet Protocol) network by sending ICMP (Internet Control Message Protocol) echo requests.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cping 127.0.0.1\u201d (loopback) to test the local stack; if that fails, the NIC (Network Interface Card) is likely broken. If the loopback works, check the default gateway or the target host's firewall settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8423101332306153, "y": -0.303573816662081, "z": -0.44537240293291636, "word": "Probe kits", "row_number": 1961, "definition": "A set of tools used in network troubleshooting, such as a tone generator and probe, used to trace wire runs through walls or identify specific cables in a patch panel.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the tone generator to the known wall jack, then use the probe at the patch panel; when the probe emits a loud tone, you have identified the matching cable end."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8434126251010496, "y": -0.34159962932788435, "z": -0.41468643221500295, "word": "Routers", "row_number": 2196, "definition": "An essential Layer 3 networking hardware appliance that routes data packets across disparate local subnets and wide-area environments by evaluating destination IP routing table data.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the router management command interface via SSH or a console connection, execute the diagnostic command \u201cshow ip route\u201d or \u201croute print\u201d to inspect the system routing table architecture, verify the default gateway parameter pointing to the ISP gateway is online, and update out-of-date static routes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8236463829311307, "y": -0.3306882922353332, "z": -0.46070803038686453, "word": "SDN (Software-Defined Networking)", "row_number": 2244, "definition": "A networking architecture that separates the control plane (the 'brain' that makes routing decisions) from the data plane (the physical switches that move data), allowing network administrators to manage traffic programmatically.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the SDN (Software-Defined Networking) controller health dashboard, verify the management connectivity between the controller and the network switches, and ensure that the flow policies are not conflicting."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8528049834564786, "y": -0.3058056694619063, "z": -0.4233279493687498, "word": "Serial cabling", "row_number": 2318, "definition": "A legacy physical communication method using a serial interface (such as RS-232) to transmit data sequentially one bit at a time, often used for configuring networking hardware like routers and switches.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify cable integrity, ensure the baud rate settings in your terminal emulation software (e.g., PuTTY) match the device specifications (commonly 9600), and use a null-modem adapter if connecting two DTE (Data Terminal Equipment) devices directly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8294038055106265, "y": -0.3558478150613252, "z": -0.43065259771719916, "word": "Software: SDN", "row_number": 2433, "definition": "An architectural approach to networking that allows network control to be programmed centrally, separating the network's control logic (the \"brain\") from the hardware (the switches and routers).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the communication link between the SDN controller and the forwarding devices, verify the routing policies are correctly loaded in the controller, and reset the control connection if the SDN switch appears \"disconnected.\""}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8336360880177573, "y": -0.30605732091743537, "z": -0.4597605779830321, "word": "Tone generators", "row_number": 2628, "definition": "A handheld networking test tool used in conjunction with a tone probe (or inductive amplifier) to trace a specific wire or cable through a wall, ceiling, or patch panel by sending an audible signal along the cable.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the generator to one end of the target cable, select the desired tone pattern (e.g., continuous or warbling), and move the probe near the bundled cables at the termination point to listen for the amplified sound output, identifying the matching wire."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8522068199155087, "y": -0.3283018605606158, "z": -0.40738363300694064, "word": "Tools: Network taps", "row_number": 2633, "definition": "A hardware device placed between two points in a network to copy all traffic passing through so that the copied data can be sent to a monitoring or diagnostic tool.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the tap is set to the correct speed (e.g., 1 Gbps), check the physical cable connections to both the network link and the monitoring device, and verify the tap's power supply."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8192820396965514, "y": -0.3475965546999887, "z": -0.4560192699780964, "word": "Tracert command", "row_number": 2642, "definition": "A network diagnostic tool that shows the path (route) a packet takes to reach a destination by displaying each hop (router) along the way, along with the round-trip time for each.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the command prompt and run \u201ctracert [destination IP or URL]\u201d to identify which hop in the path is causing the packet loss or high latency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8494760133470579, "y": -0.2945342009729798, "z": -0.437767183792021, "word": "Video: Surveillance", "row_number": 2808, "definition": "The operational network of IP (Internet Protocol) digital cameras, digital video recorders (DVRs), or network video recorders (NVRs) engineered to continuously capture, encode, transmit, and archive visual optical data streams across physical environments for site monitoring.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the Power over Ethernet (PoE) budget metrics on the network switches to confirm the infrastructure has adequate electrical capacity to run all cameras simultaneously. Log into the camera management network console system, verify that video bandwidth encoding bitrates match network throughput limits, and perform routine firmware system updates across the centralized NVR platform."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
