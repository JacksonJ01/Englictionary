8790659803337253, "word": "BIOS firmware: Virtualization", "row_number": 246, "definition": "A hardware-level feature toggle that permits a single physical processor to act as multiple independent virtual processors for running virtual machines.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the motherboard configuration screen, browse to the \u201cAdvanced\u201d or \u201cCPU Configuration\u201d menu, locate settings named \u201cIntel Virtualization Technology\u201d or \u201cSVM Mode\u201d, flip the option to \u201cEnabled\u201d, and save settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9562163117276714, "y": -0.2198080136041662, "z": -0.1932221579977808, "word": "Cloud computing: Desktop virtualization", "row_number": 373, "definition": "A technology that separates the desktop environment from the physical device, allowing access via a Virtual Machine (VM).", "details": [{"label": "TROUBLESHOOTING", "value": "Check network bandwidth, ensure the thin-client software is updated, and verify the health of the host virtualization server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9605670834785405, "y": -0.2137951810648752, "z": -0.17777091632482553, "word": "Cloud computing: VDI (Virtual Desktop Infrastructure)", "row_number": 388, "definition": "A virtualization technique that hosts desktop Operating Systems (OS) on a centralized server in a data center.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the client device has enough processing power to handle the display stream, verify server-side resource availability, and check network latency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.958301453050258, "y": -0.20658046098682667, "z": -0.19744072077520985, "word": "Connectivity: VM", "row_number": 519, "definition": "A virtualized computer environment that runs on physical host hardware using a hypervisor.", "details": [{"label": "TROUBLESHOOTING", "value": "Check host resource allocation (CPU/RAM), verify the virtual network switch configuration, and update the hypervisor software."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9558981364825667, "y": -0.22769062470187454, "z": -0.18551477593988733, "word": "Containers (OS-level virtualization)", "row_number": 526, "definition": "A form of operating system (OS) virtualization where the kernel allows for multiple isolated user-space instances (containers) to run on a single host.", "details": [{"label": "TROUBLESHOOTING", "value": "Use commands such as \u201cdocker ps\u201d to check the status, inspect container logs with \u201cdocker logs [container_id]\u201d, and verify that host resources (CPU (Central Processing Unit) and RAM (Random Access Memory)) are not fully consumed."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9627539820715215, "y": -0.20193833924604923, "z": -0.17979342910122134, "word": "Desktops: Virtualization", "row_number": 625, "definition": "Running a virtual desktop (VDI (Virtual Desktop Infrastructure)) or local VM (Virtual Machine).", "details": [{"label": "TROUBLESHOOTING", "value": "Increase allocated RAM and CPU cores in the hypervisor settings, and check network latency for VDI solutions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9544959137686938, "y": -0.21780477403467338, "z": -0.20371212778470285, "word": "Emulation versus virtualization", "row_number": 839, "definition": "Emulation is the process of imitating another hardware/software system by mimicking its internal architecture, whereas virtualization involves running an operating system as a guest on top of a physical host machine's hardware using a hypervisor.", "details": [{"label": "TROUBLESHOOTING", "value": "To fix virtualization issues, enter the BIOS/UEFI and ensure Virtualization Technology (e.g., Intel VT-x or AMD-V) is set to Enabled. For emulation issues, check if the emulator requires specific hardware settings or increased memory allocations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9594909992260074, "y": -0.22294824501466418, "z": -0.17225301869389373, "word": "Hosted (type 2) hypervisors", "row_number": 1068, "definition": "A virtualization manager that runs as an application on top of an existing host operating system (e.g., \u201cVMware Workstation\u201d or \u201cVirtualBox\u201d), sharing hardware resources managed by that host OS.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the host has enough RAM and CPU cores to support the VM, verify that \u201cHardware Virtualization\u201d (VT-x or AMD-V) is enabled in the BIOS, and update the hypervisor software."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9610655984678852, "y": -0.1964657201639506, "z": -0.19430423629459523, "word": "Hypervisors", "row_number": 1088, "definition": "Software or hardware that creates and runs virtual machines by abstracting the physical hardware into independent virtual environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify BIOS/UEFI virtualization settings, allocate sufficient RAM and CPU to the VMs, and check for hypervisor software updates."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9528551729392554, "y": -0.23210716550082505, "z": -0.1954310188431575, "word": "Hyper-V hypervisors", "row_number": 1089, "definition": "A native hypervisor developed by Microsoft that allows for the creation of virtual machines on x86-64 systems running Windows.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \u201cHyper-V Manager\u201d for VM status, ensure the \u201cVirtual Switch\u201d is correctly configured, and check if the \u201cHyper-V\u201d feature is properly enabled in \u201cWindows Features.\u201d"}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9637983960884818, "y": -0.20623335622803451, "z": -0.16899838601652503, "word": "Hyper-V hypervisors: VirtualBox", "row_number": 1090, "definition": "A type 2 hypervisor developed by Oracle that allows users to run different operating systems as virtual machines on a single host.", "details": [{"label": "TROUBLESHOOTING", "value": "Reinstall \u201cGuest Additions\u201d within the VM, ensure the host meets memory requirements, and check \u201cSettings\u201d for the correct virtualization mode."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9558593317032573, "y": -0.20686323981175017, "z": -0.208663695956888, "word": "Hyper-V hypervisors: VMware Workstation", "row_number": 1091, "definition": "A powerful type 2 hypervisor that allows for the creation and management of complex virtual networking environments and VMs on Windows or Linux hosts.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the \u201cVirtual Network Editor\u201d settings, ensure the \u201cVMware Tools\u201d package is updated, and check for conflicts with other virtualization software installed on the same host."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9560334570143387, "y": -0.23422452331916, "z": -0.1764621821952931, "word": "Native (Type 1) hypervisors", "row_number": 1545, "definition": "A specialized virtualization software layer that runs directly on the host computer\u2019s hardware (the \u201cbare metal\u201d) rather than on top of an existing host OS, providing high performance for server virtualization.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the server hardware supports and has \u201cVirtualization Technology\u201d (like Intel VT-x or AMD-V) enabled in the BIOS (Basic Input/Output System) or UEFI (Unified Extensible Firmware Interface) settings, and verify that the hypervisor (e.g., VMware ESXi) is on the Hardware Compatibility List (HCL) for the specific server model."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9643235385833483, "y": -0.1914956549057523, "z": -0.182782731914989, "word": "Networks: VM connectivity", "row_number": 1650, "definition": "The ability of a virtualized OS instance to communicate with the host network, other virtual machines, or the physical Internet via a virtual switch.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the VM\u2019s virtual network adapter settings (e.g., NAT (Network Address Translation), Bridged, or Host-Only); verify that the virtual switch is correctly bridged to the physical NIC."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9513667601773317, "y": -0.227352938534638, "z": -0.20787479156779137, "word": "Oracle VirtualBox", "row_number": 1696, "definition": "A Type 2 hypervisor used to run multiple guest operating systems on a single physical host machine.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure VT-x (Virtualization Technology) or AMD-V (AMD Virtualization) is enabled in the BIOS; update \u201cVirtualBox Guest Additions\u201d; verify host system has enough RAM (Random Access Memory) allocated."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9621754421051578, "y": -0.2184749687837876, "z": -0.16274859945531703, "word": "PowerShell: Hyper-V hypervisors", "row_number": 1898, "definition": "Using PowerShell cmdlets to manage Microsoft Hyper-V (Hardware Virtualization) virtualization platform, allowing for the creation, configuration, and monitoring of virtual machines (VMs).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the \u201cHyper-V PowerShell Module\u201d is installed via \u201cPrograms and Features\u201d, run PowerShell as an administrator, and use \u201cGet-Command -Module Hyper-V\u201d to list all available virtualization cmdlets."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9594841278835364, "y": -0.1936512041221666, "z": -0.20466904866541144, "word": ".ps1 files: Hyper-V hypervisors", "row_number": 2017, "definition": "Using PowerShell to manage Microsoft\u2019s hardware-level virtualization platform, allowing administrators to automate VM (Virtual Machine) creation, snapshotting, and resource management.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the Hyper-V Management Tools are installed under 'Windows Features'; verify that the user is a member of the 'Hyper-V Administrators' group."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9519960564591832, "y": -0.2408354416679084, "z": -0.18894919561296666, "word": "RAM: VM (Virtual Machine)", "row_number": 2096, "definition": "The portion of a host computer's physical RAM that is allocated to run a virtual machine, which is isolated from the host's primary memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the memory allocation settings within the hypervisor software (like VMware or Hyper-V) to provide the VM with an appropriate amount of RAM."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9661439818394789, "y": -0.1955245815649691, "z": -0.16833283802990015, "word": "Revision control, virtualization", "row_number": 2174, "definition": "A systemic methodology within cloud and hypervisor environments that tracks, labels, and preserves distinct evolutionary versions of VM (Virtual Machine) configurations, baseline templates, and snapshot files to manage changes and simplify rollbacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement automated version tracking within your central hypervisor console (such as VMware vCenter or Microsoft System Center), systematically label new base images with sequential nomenclature (e.g., \u201cWin2022_Base_v2.1\u201d), and capture a descriptive baseline snapshot before executing a localized upgrade script."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.952544831695715, "y": -0.21429696999185566, "z": -0.21618314518503035, "word": "Security: Virtualization", "row_number": 2309, "definition": "The use of software to create virtual representations of servers, storage, or networks, requiring specific security considerations to prevent 'VM escape' attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep the hypervisor patched, implement strict network isolation (VLANs) between VMs, and use secure console access methods."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9581396558662735, "y": -0.23363202269897285, "z": -0.16548256048915164, "word": "Servers: Virtual servers", "row_number": 2332, "definition": "A physical server running software that allows it to host multiple virtual server instances (VMs), each with its own OS (Operating System) and resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the hypervisor management console for error alerts, verify hardware resource availability, and ensure the virtual network switch settings are correct."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9639069860803983, "y": -0.1846552895685805, "z": -0.1917961058513614, "word": "Storage drives: VM (Virtual Machine) connectivity", "row_number": 2508, "definition": "The configuration that allows a virtual machine to access physical storage or virtual disk files hosted on the host machine.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the VM configuration file points to the correct path for the virtual disk image, verify the host has enough free space to support the virtual disk, and check file permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9492589585472048, "y": -0.23830254154351047, "z": -0.20522994009593157, "word": "Type 1 (native) hypervisors", "row_number": 2731, "definition": "A VMM (Virtual Machine Monitor) that installs directly on the host hardware, also known as 'bare-metal' virtualization (e.g., VMware ESXi).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure virtualization extensions (VT-x or AMD-V) are enabled in the BIOS/UEFI (Unified Extensible Firmware Interface), and confirm the hardware is on the hypervisor's support list."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9652418209796039, "y": -0.2086334108603511, "z": -0.15741768294811823, "word": "Type 2 (hosted) hypervisors", "row_number": 2732, "definition": "A VMM (Virtual Machine Monitor) that runs on top of a host OS (Operating System) (e.g., Oracle VirtualBox).", "details": [{"label": "TROUBLESHOOTING", "value": "Allocate more RAM (Random Access Memory) and CPU (Central Processing Unit) cores to the virtual machine settings, and ensure the host OS (Operating System) has the latest updates for virtualization support."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9563867565618683, "y": -0.19728773060590765, "z": -0.21541105641410505, "word": "Updating: Virtualization", "row_number": 2751, "definition": "The process of applying software updates, hypervisor patches, and guest additions to virtual machines (VMs) and virtualization host software to maintain stability and security.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the underlying hypervisor software (such as VMware Workstation or Oracle VirtualBox) to its latest build. Once updated, boot the individual guest virtual machine, navigate to the hypervisor menu bar, and select \"Install/Update Guest Additions\" or \"Update VM Tools\" to refresh the internal integration drivers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9529811417036832, "y": -0.2452824610550159, "z": -0.17794228799231207, "word": "VDI (Virtual Desktop Infrastructures)", "row_number": 2799, "definition": "A centralized virtualization architecture that hosts desktop operating system sessions on a cluster of secure data center virtualization infrastructure servers, allowing clients to access their workspace over the network using a thin client terminal or remote software client.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the client workstation network link stability by executing the ping command \u201cping -t [VDI_Connection_Broker_IP]\u201d to identify local packet drop thresholds. Log into the centralized virtualization management dashboard, inspect host system Central Processing Unit (CPU) and Random Access Memory (RAM) quotas, and clear hung terminal sessions manually to recycle the user profile context."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9672473996873131, "y": -0.18488406933760373, "z": -0.17392627375787523, "word": "Virtual servers", "row_number": 2819, "definition": "Logical server instances running within a shared hardware host server environment through virtualization, each operating its own isolated server operating system stack and dedicated daemon configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the hypervisor host management portal and verify the network configuration type for the virtual instance (such as changing from Host-Only to Bridged or NAT mode to expose it to the network). Set up port forwarding rules within the local firewall or virtual switch to route incoming connection requests directly to the virtual machine's internal IP address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9492715598397747, "y": -0.22577086146501602, "z": -0.21888586933081208, "word": "VirtualBox", "row_number": 2820, "definition": "A free, open-source, hosted Type-2 hypervisor developed by Oracle that installs directly on top of an existing host operating system to allow the configuration, deployment, and management of multiple guest virtual machines.", "details": [{"label": "TROUBLESHOOTING", "value": "Reboot the physical host machine, press the manufacturer's specified hotkey to enter the motherboard UEFI/BIOS configuration screen, locate the CPU settings tab, change \"Intel Virtualization Technology\" (VT-x) or \"AMD-V\" to \"Enabled\", save changes, and boot back into the OS. Inside VirtualBox, install the Oracle VM VirtualBox Extension Pack to enable proper USB 3.0 controller drivers and enhanced integration."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9613936172355463, "y": -0.22702089549525475, "z": -0.15551149715466117, "word": "Virtualization", "row_number": 2821, "definition": "The technical practice of using software virtualization layers to create simulated, isolated abstract representations of physical computing hardware resources, including CPUs, storage drives, and network controllers.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows Task Manager console utility and click on the \"Performance\" tab to verify that the CPU status indicates hardware virtualization is active. If disabled, toggle the feature on within the system firmware settings; if host resource use is pegged at 100%, reallocate virtual allocations to ensure the host OS retains enough physical cores and RAM to manage the overhead."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.961755181859121, "y": -0.18275552249759838, "z": -0.20402791270745035, "word": "Virtualization: BIOS firmware", "row_number": 2822, "definition": "The motherboard low-level firmware setting controls that must be toggled on to unlock hardware-assisted virtualization extensions on the central processing unit, enabling hypervisors to interact directly with the CPU.", "details": [{"label": "TROUBLESHOOTING", "value": "Initiate a system reboot sequence, press the required key (such as \"F2\" or \"Delete\") to access the BIOS setup menu layout, and navigate to the \"Advanced CPU Configuration\" or \"Chipset\" sub-section panel. Locate the specific feature listed as \"Intel Virtualization Technology\", \"VT-x\", \"Vanderpool\", or \"SVM Mode\", change the setting value to \"Enabled\", save configurations, and reboot the system."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.9485931716666094, "y": -0.24784728695068975, "z": -0.19683169718992233, "word": "Virtualization: Containers", "row_number": 2823, "definition": "An isolated, lightweight application virtualization model that packages an application and its software dependencies together, running directly on the host operating system's shared kernel without the overhead of a guest OS.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a terminal shell and run the container status inspection command \u201cdocker ps -a\u201d to view the runtime state and exit codes of active environments. Check configuration manifests, update network port-binding variables using the relevant container file configuration templates, and execute the command \u201cdocker logs [container_id]\u201d to identify internal application errors."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9678799382679649, "y": -0.19600779381439293, "z": -0.15744640314219568, "word": "Virtualization: Emulation versus", "row_number": 2825, "definition": "The technical distinction between virtualization, which executes guest instructions directly on native matching hardware architectures at near-native speeds, and emulation, which uses software to mimic completely different hardware processing architectures (like running ARM instructions on an Intel x86 CPU) through translation at the cost of processing performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Determine if the target workflow can be migrated away from an emulator engine over onto a true hypervisor model by matching the guest OS to the native system architecture. If emulation is required for legacy components, optimize the software environment by assigning dedicated hardware rendering acceleration or upgrading host single-core clock speeds."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9525005208598274, "y": -0.2064461655316303, "z": -0.22388108115480418, "word": "Virtualization: Hypervisors", "row_number": 2826, "definition": "The specialized software or firmware layer responsible for creating, executing, and regulating virtual machines, categorized into Type-1 (Bare-Metal, running directly on physical hardware) and Type-2 (Hosted, running as an application within a standard host OS).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the hypervisor logs for hardware compatibility errors. Apply the newest stable vendor patch updates to resolve kernel bugs, and ensure the host platform's physical resource thresholds are not overallocated past safe boundaries (such as reserving at least 15-20% of raw processing power and RAM exclusively for the hyperviso
