763398688196335, "word": "Acknowledgement phase, DORA process", "row_number": 60, "definition": "The fourth and final stage of the DHCP (Dynamic Host Configuration Protocol) automated IP addressing assignment process Discover, Offer, Request, Acknowledge (DORA). The DHCP server sends a final DHCP-ACK packet to the client, officially confirming the lease configuration and authorizing the client to use the assigned IP address, subnet mask, and default gateway.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the DHCP server's address pool has not run out of assignable IPv4 scopes; check for severe local network latency or packet drops that might cause the client to drop the packet before completing the handshake; review the server logs for lease conflicts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8726988103708153, "y": 0.3257201008721212, "z": -0.3637350715358898, "word": "DHCPACK (DHCP (Dynamic Host Configuration Protocol) Acknowledgment)", "row_number": 64, "definition": "The fourth and final packet in the DHCP DORA process, sent by the DHCP server to the client to confirm the IP address lease, lease duration, subnet mask, default gateway, and DNS (Domain Name System) configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "- Check Server Lease Pool: Open the router or DHCP server management console to ensure the scope has available addresses and that the server is not crashing or locked up.\n- Run a Network Trace: Open Wireshark on the client machine and use the filter \"bootp\" (Bootstrap Protocol) or \"dhcp\" to see if the server's DHCP-ACK unicast or broadcast packet is actually reaching the client network card.\n- Verify UDP (User Datagram Protocol) Port Availability: Ensure network firewalls and endpoint security software are allowing inbound traffic on UDP port 68 (DHCP client port).\n- Reset the TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" followed by \"ipconfig /flushdns\" SHOOTING", "value": "- Perform Physical Loop Diagnostics: Unplug the physical RJ-45 Ethernet cable or disconnect from the Wi-Fi SSID for 10 seconds, then reconnect to force a hard hardware renegotiation.\n- Clear Stale Server Bindings: On the DHCP Server console, locate the client's MAC address under active leases, delete the expired or corrupted entry manually, and clear any bad reservations.\n- Reinitialize Network Stack: Execute \"netsh int ip reset\" and restart the workstation to fix deep OS-level registry corruption within the DHCP client service files."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8688706024559923, "y": 0.32229249311352015, "z": -0.375754474451646, "word": "APIPA (Automatic Private IP Addressing): IPv4 configurations", "row_number": 122, "definition": "Automatic Private Internet Protocol Addressing (APIPA). A built-in feature of Microsoft Windows operating systems that self-assigns a temporary link-local internet protocol version 4 (IPv4) address when a client is configured for dynamic host configuration protocol (DHCP) but cannot reach a DHCP server. It selects an address out of the reserved space 169.254.0.1 through 169.254.255.254 with a standard Class B subnet mask of 255.255.0.0.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical network cable connectivity or wireless radio associations; check that the local area network (LAN) dynamic host configuration protocol (DHCP) server daemon is running and has available address leases left in its scope allocation; run the command sequences \"ipconfig /release\" followed by \"ipconfig /renew\" in the command prompt."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8802204548084805, "y": 0.33148423907303576, "z": -0.339602930174229, "word": "Assigning, static IP addresses", "row_number": 160, "definition": "The manual network configuration process of inputting fixed Internet Protocol (IP) credentials into a device's network adapter interface parameters, ensuring the host retains the exact same address configuration permanently rather than requesting a dynamic lease from a server.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the host device's Network Interface Controller (NIC) configuration properties, select \u201cInternet Protocol Version 4 (TCP/IPv4)\u201d, change the configuration toggle to \u201cUse the following IP address\u201d, and manually type in the designated static IP address, subnet mask, default gateway, and Domain Name System (DNS) servers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8819132267573064, "y": 0.2984187260100939, "z": -0.3649319449390918, "word": "DHCP: DORA process", "row_number": 638, "definition": "The four-step \u201cDHCP\u201d handshake: \u201cDiscover\u201d, \u201cOffer\u201d, \u201cRequest\u201d, \u201cAcknowledge\u201d.", "details": [{"label": "TROUBLESHOOTING", "value": "Analyze packet captures (\u201cWireshark\u201d) to see which stage of the \u201cDORA\u201d process is failing, then check network connectivity to the server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8662824223732852, "y": 0.33976131443563007, "z": -0.36621989828523227, "word": "DHCP: Reservations", "row_number": 639, "definition": "A feature where a \u201cDHCP\u201d server permanently assigns a specific IP address to a client based on its MAC (Media Access Control) address.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the \u201cMAC\u201d address of the device matches the reservation on the \u201cDHCP\u201d server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8886179844666441, "y": 0.312356450999794, "z": -0.3358444955649153, "word": "DHCP: Scope", "row_number": 640, "definition": "The range of IP addresses that a \u201cDHCP\u201d server is configured to lease to clients.", "details": [{"label": "TROUBLESHOOTING", "value": "Increase the \u201cDHCP\u201d scope range or shorten the lease times on the server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.87122058703284, "y": 0.3
