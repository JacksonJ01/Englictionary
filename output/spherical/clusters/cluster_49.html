<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 49, "radius": 285.0, "nodes": [{"x": 0.46893774444963904, "y": -0.19212103294820781, "z": -0.8620828849532965, "word": "Cloud computing", "row_number": 369, "definition": "The on-demand delivery of IT (Information Technology) resources (servers, storage, databases, networking, software) over the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify local internet connectivity, check the cloud provider's status dashboard, and confirm authentication credentials."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.46822823362607724, "y": -0.1754646106300962, "z": -0.8660106764075326, "word": "Connectivity: Networks", "row_number": 488, "definition": "The infrastructure and protocols enabling computers to share resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the NIC is active, verify IP configuration, and check network switch/router port status."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4828212113127152, "y": -0.19181002868020047, "z": -0.854454557483441, "word": "File servers", "row_number": 925, "definition": "A computer connected to a network that provides a location for shared disk access, where files can be accessed by multiple workstations.", "details": [{"label": "TROUBLESHOOTING", "value": "Check network connectivity from the client workstation using the command \u201cping [server_ip]\u201d, verify user permissions in the file share settings, and check the server\u2019s disk space usage."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.45611369708233374, "y": -0.19144765908730316, "z": -0.8690846271588727, "word": "Networked hosts: Servers", "row_number": 1556, "definition": "Powerful computer systems designed to provide services, resources, or programs to other computers (clients) across a network infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Check server resource utilization (CPU, RAM, Disk) in the Performance Monitor, verify that required services are in a \u201cRunning\u201d state, and examine the Event Viewer for critical application or system errors that correlate with the access issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4813606337907213, "y": -0.16858624806041259, "z": -0.8601573211927617, "word": "Networks: SAN (Storage Area Network)", "row_number": 1620, "definition": "A high-speed specialized network that provides block-level network access to storage, making remote storage devices appear as locally attached drives to an OS.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical cabling (fiber/copper) to the storage array; verify the login status of the iSCSI initiator; check for fabric or switch zoning misconfigurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.47396909672260196, "y": -0.20703467607120893, "z": -0.8558562602774198, "word": "Networks: Workgroups", "row_number": 1658, "definition": "A peer-to-peer network arrangement in Windows where each computer maintains its own local security database and resources, intended for small environments without a domain controller.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all machines are in the same workgroup name; verify that \u201cFile and Printer Sharing\u201d is enabled; check that the same user account (with identical password) exists on both machines if simple sharing fails."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4548845566584222, "y": -0.17265728622063353, "z": -0.8736529640701718, "word": "Online resources: Active Directory", "row_number": 1680, "definition": "A database and set of services that connect users with the network resources they need to get their work done; technical documentation or forums helping manage identities and permissions.", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize official Microsoft Learn documentation; check community support forums like \u201cStack Overflow\u201d for specific GPO (Group Policy Object) configuration syntax; verify the integrity of the \u201cSYSVOL\u201d folder share."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.49406101725325474, "y": -0.1820026472831515, "z": -0.8501639533717035, "word": "SAN (Storage Area Network)", "row_number": 2210, "definition": "A specialized, high-speed network that provides block-level network access to storage, making remote storage devices (such as disk arrays) appear to an OS as locally attached disks.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical connectivity to the Fibre Channel or iSCSI (Internet Small Computer System Interface) switch, check that the storage array is powered on, and ensure the server's HBA (Host Bus Adapter) driver is current and correctly configured."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4541345797039282, "y": -0.20693498613757502, "z": -0.8665677671304064, "word": "Servers", "row_number": 2319, "definition": "Dedicated computers or software instances that provide centralized services, data, or resources to other computers (clients) on a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the server\u2019s physical connectivity, verify that critical services (e.g., DNS - Domain Name System, DHCP - Dynamic Host Configuration Protocol) are running in the \u201cServices\u201d console, and examine the server event logs for hardware or application-level errors."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4721673471214589, "y": -0.15723749628992603, "z": -0.8673721035822858, "word": "Servers: File servers", "row_number": 2324, "definition": "A centralized server that manages and provides access to files and folders for users across a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Check disk quota limits, verify NTFS (New Technology File System) and share-level permissions, and ensure the server has sufficient storage capacity."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4886769163996653, "y": -0.20667601823656165, "z": -0.8476319336032561, "word": "Windows networks: Workgroups", "row_number": 2951, "definition": "A basic, peer-to-peer logical networking structure where each individual Windows computer node retains its own independent local user account database, lacks centralized directory management, and relies on local configurations for network sharing authorization.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the advanced properties configuration page via the instruction command \u201csysdm.cpl\u201d. Click \"Change\", toggle the option selection from Domain to \"Workgroup\", type an identical capitalized text string (such as the default string \u201cWORKGROUP\u201d) across every separate local computer terminal, click \"OK\", and perform a full system reboot to establish the peer network relationship."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.44309782089993344, "y": -0.1850565107914192, "z": -0.8771649838698736, "word": "Workgroups", "row_number": 2984, "definition": "A peer-to-peer logical grouping configuration built into Windows operating systems that links local workstations together across a shared subnet without requiring centralized domain controllers, relying instead on decentralized local security configuration tables on each machine.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Advanced System Properties panel by running the command \u201csysdm.cpl\u201d inside the Run window. Click the \"Change\" option button, ensure the workgroup naming text string matches identically across all network machines, click \"OK\", and perform a full system reboot to join the peer-to-peer sharing framework."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
