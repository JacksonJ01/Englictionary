<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 161, "radius": 285.0, "nodes": [{"x": 0.519046216897071, "y": 0.48451337416271983, "z": -0.7041575214270561, "word": "A Records", "row_number": 24, "definition": "Address Mapping records. A core type of DNS (Domain Name System) record that maps a human-readable host or domain name to its corresponding 32-bit IPv4 address.", "details": [{"label": "TROUBLESHOOTING", "value": "Run nslookup or dig followed by the domain name to query the DNS server; log into the authoritative DNS zone management panel and verify that the host record is correctly spelled and pointing to the valid public IPv4 address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5060953748263008, "y": 0.49097181016889696, "z": -0.7090938958973647, "word": "AAAA Records (Quad-A Records)", "row_number": 26, "definition": "A fundamental DNS record that maps a domain name to its corresponding 128-bit IPv6 address, operating exactly like an A record but explicitly built for IPv6 networking infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cnslookup -type=aaaa [domain_name]\u201d to verify if the record exists; check the authoritative DNS host configuration to ensure the exact 8-part hexadecimal IPv6 address is entered correctly without typos."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5224950159305428, "y": 0.4944130800509426, "z": -0.6946615467997939, "word": "DNS: A records", "row_number": 708, "definition": "A resource record type in DNS that maps a hostname to its corresponding IPv4 address.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the record exists in the DNS zone file and that the IP address it points to is correct."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.515094171944501, "y": 0.4757411653386886, "z": -0.7129855101129302, "word": "DNS: AAAA records", "row_number": 709, "definition": "A resource record type in DNS that maps a hostname to its corresponding IPv6 address.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the DNS server is configured to return the correct AAAA record for the host."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5043080032901119, "y": 0.503082630719632, "z": -0.7018413670379903, "word": "DNS: Email authentication", "row_number": 711, "definition": "The use of DNS records (like SPF, DKIM, and DMARC) to verify that an email sender is authorized to send mail on behalf of a domain.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the domain\u2019s DNS TXT records to ensure that the SPF, DKIM, and DMARC entries are correctly formatted and reflect the current mail server\u2019s IP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5317765583700063, "y": 0.4817920009945028, "z": -0.6964841417762966, "word": "DNS: MX records", "row_number": 713, "definition": "A type of DNS record that directs email to a mail server responsible for receiving emails on behalf of a domain.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cnslookup -query=mx <domain>\u201d to verify the MX record points to the correct mail server address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5003572459665419, "y": 0.4827136468736479, "z": -0.7187698947025543, "word": "DNS: NS records", "row_number": 714, "definition": "A DNS record that specifies which authoritative name servers are responsible for a specific DNS zone.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the NS records match the servers provided by the domain registrar."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5179479267015215, "y": 0.5064035641269669, "z": -0.6894094396402621, "word": "DNS: PTR records", "row_number": 715, "definition": "The reverse of an A record; a DNS record that maps an IP address to a hostname, used for reverse lookups.", "details": [{"label": "TROUBLESHOOTING", "value": "Check with your ISP (Internet Service Provider) or network administrator to ensure a valid reverse DNS entry exists for your server\u2019s public IP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.526395805645595, "y": 0.467839822156887, "z": -0.7099530664790014, "word": "DNS: Record types", "row_number": 716, "definition": "The various classifications of information stored in DNS databases, such as A, AAAA, MX, NS, SOA, and TXT records.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cdig\u201d or \u201cnslookup\u201d to view all records for a domain and check for discrepancies."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.493134231631627, "y": 0.5013208407162931, "z": -0.710982450034172, "word": "DNS: SOA records", "row_number": 718, "definition": "A DNS record that contains administrative information about the zone, such as the primary name server and the email address of the administrator.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the SOA record values (serial number, refresh/retry times) to ensure they are properly configured and updating."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5353903890399019, "y": 0.49227483321867727, "z": -0.6863108770107218, "word": "DNS: TXT records", "row_number": 719, "definition": "A type of DNS record that contains text information for external sources, often used for email verification (SPF/DKIM) or domain ownership verification.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the TXT record is exactly as provided by the service provider, including any quotation marks or formatting requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5066797251952337, "y": 0.46919303724252465, "z": -0.7232797175914845, "word": "IANA (Internet Assigned Numbers Authority)", "row_number": 1093, "definition": "The standards organization that oversees global IP (Internet Protocol) address allocation, autonomous system number allocation, root zone management in the DNS (Domain Name System), and other IP-related symbols and numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "If network services are failing due to IP allocation issues, verify that local DHCP (Dynamic Host Configuration Protocol) servers are configured correctly and not conflicting with IANA-reserved private address ranges."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5045755663746345, "y": 0.5146232463917959, "z": -0.6932289752245542, "word": "MX (Mail Exchange) records", "row_number": 1540, "definition": "A type of DNS (Domain Name System) record that specifies the mail server responsible for receiving email messages on behalf of a domain name.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a DNS lookup tool like \u201cnslookup\u201d or \u201cdig\u201d to verify the domain's MX records by executing the command \u201cnslookup -q=mx example.com\u201d. Ensure the returned mail server address is correct, has the appropriate priority (lower numbers indicate higher priority), and is configured to accept traffic for that domain."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5389564492092819, "y": 0.4698750199696882, "z": -0.6991018605784195, "word": "NS records", "row_number": 1669, "definition": "Name Server (NS) records are entries in a DNS (Domain Name System) zone file that indicate which servers are authoritative for a specific domain.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cdig\u201d or \u201cnslookup\u201d to check the current NS records; verify that the DNS server being queried matches the authoritative NS records for that zone."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.48851661212281594, "y": 0.48925993855247263, "z": -0.7224792261426463, "word": "PTR (Pointer) records", "row_number": 2045, "definition": "A type of DNS record that maps an IP address to a domain name, acting as the reverse of an A record.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the 'nslookup -type=ptr [IP address]' command to check if a valid pointer record exists; coordinate with the ISP if reverse DNS needs updating for a public IP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5285509930083729, "y": 0.5076615448687024, "z": -0.6803775449347115, "word": "SOA records", "row_number": 2398, "definition": "A critical primary Domain Name System (DNS) zone file record that documents foundational administrative metadata regarding the hosting zone, including the primary authoritative name server, the zone administrator\u2019s email, and zone refresh timers.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the diagnostic console terminal line interface and execute the lookup lookup command string \u201cnslookup -type=soa example.com\u201d; examine the output serial number parameter to confirm it increments sequentially with every modification to verify that database synchronization is occurring correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5214074843880917, "y": 0.4588361730704566, "z": -0.7194467329178306, "word": "TXT records", "row_number": 2730, "definition": "A DNS (Domain Name System) record used to store arbitrary text, commonly utilized for SPF (Sender Policy Framework) or DKIM (DomainKeys Identified Mail) to prevent email spoofing.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cnslookup\u201d command to verify that the TXT (Text) record is published correctly in the DNS (Domain Name System) zone file."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
