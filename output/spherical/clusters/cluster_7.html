<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 7, "radius": 285.0, "nodes": [{"x": -0.17967781226282678, "y": 0.9438263776758412, "z": 0.277 pply strict encryption at rest and in transit, and strictly limit access based on the \u201cPrinciple of Least Privilege\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.20265406901176833, "y": 0.9382824479861478, "z": 0.280280887885877, "word": "Documentation: Compliance policies", "row_number": 744, "definition": "Formal documents detailing the legal and regulatory requirements (such as HIPAA or GDPR) that an organization must follow.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a gap analysis between current operations and the regulatory documentation; update internal processes to match the required compliance standards."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.16853911227824786, "y": 0.9428394841164373, "z": 0.2874861297932661, "word": "Documentation: Regulatory policies", "row_number": 756, "definition": "Rules established by government bodies (e.g., PCI-DSS, HIPAA) that the organization must comply with to operate legally.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct internal audits and implement the necessary technical controls to satisfy the regulatory requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.19209606493495407, "y": 0.9470495259307619, "z": 0.2572864109719462, "word": "Environmental controls", "row_number": 857, "definition": "The collective application of physical infrastructure systems, facility policies, and administrative standards designed to maintain optimal operating conditions for hardware while protecting personnel and ensuring regulatory compliance.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect room temperature and humidity levels, verify that air filtration systems are operational, maintain active Material Safety Data Sheets (MSDS) for all chemical agents, and conduct regular physical inspections of power distribution and waste management systems."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.19485106892784754, "y": 0.934794617891916, "z": 0.2969715193381045, "word": "PCI-DSS (Payment Card Industry-Data Security Standards)", "row_number": 1765, "definition": "A set of proprietary information security standards administered by the Payment Card Industry Security Standards Council for organizations that handle branded credit cards.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a vulnerability scan to identify non-compliant systems, implement strong access control measures, ensure encryption of transmitted data, and maintain a secure network architecture according to the official documentation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1632475726008039, "y": 0.9491679121730828, "z": 0.2691291595887308, "word": "Policies: AUP (Acceptable Use Policy)", "row_number": 1848, "definition": "A formal organizational compliance document defining the explicit parameters, behaviors, and ethical rules that employees must follow when interacting with corporate technology assets and network infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce user parameter tracking rules by using Active Directory (AD) Group Policy Objects (GPOs), push out explicit logon banner warnings that mandate acceptance before system entry, and audit access logs using a SIEM (Security Information and Event Management) system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2096145737120129, "y": 0.9404267668164363, "z": 0.2676924106931595, "word": "Policies: Compliance policies", "row_number": 1851, "definition": "Operational and technical directives that mandate alignment with internal rules, organizational baselines, and vendor contractual obligations to manage business risk.", "details": [{"label": "TROUBLESHOOTING", "value": "Run automated network vulnerability assessments using configuration managers, deploy endpoint agents to monitor configurations, and isolate non-compliant nodes into a quarantine VLAN until they match the corporate baseline."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.17276634747320277, "y": 0.9378331652244687, "z": 0.30103279453545106, "word": "Policies: Regulatory policies", "row_number": 1852, "definition": "The mandatory framework and control sets imposed on an enterprise by external legal bodies to safeguard private data assets, with notable mandates including HIPAA (Health Insurance Portability and Accountability Act) and PCI-DSS (Payment Card Industry Data Security Standard).", "details": [{"label": "TROUBLESHOOTING", "value": "Implement strict end-to-end data encryption algorithms (like AES-256) for information at rest and in transit, roll out RBAC (Role-Based Access Control) matrix parameters across all active database files, and ensure the integrity of audit logs."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.17852046840423036, "y": 0.9513922100832329, "z": 0.25096474842829114, "word": "Regulated data", "row_number": 2117, "definition": "Subset of structured personal, corporate, or financial information that is strictly monitored and protected by national or industry-specific legal frameworks.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy DLP software signatures, apply AES 256-bit encryption algorithms to data at-rest and in-transit, and enforce strict RBAC matrix parameters."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2099981087933079, "y": 0.9332093016453455, "z": 0.29158393924535775, "word": "Regulated data: PCI-DSS", "row_number": 2119, "definition": "An international corporate compliance framework required of any enterprise that processes, handles, transmits, or stores credit card numbers, debit details, and cardholder metadata.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the cardholder data environment using secure firewalls, deploy end-to-end point encryption tokenization, and implement mandatory multi-factor authentication."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.15536855154851884, "y": 0.9462745284307024, "z": 0.28359324750946935, "word": "Regulated data: PHI", "row_number": 2120, "definition": "Individually identifiable medical or health tracking data\u2014including patient clinical histories, laboratory results, and healthcare billing records\u2014regulated under frameworks like HIPAA.", "details": [{"label": "TROUBLESHOOTING", "value": "Configure workstation screensaver idle lockouts set to a tight threshold, implement full-disk encryption via BitLocker, and verify audit log tracking mechanisms capture file read actions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.20499513588729482, "y": 0.945788080706051, "z": 0.25191645570885957, "word": "Regulatory policies", "row_number": 2122, "definition": "The set of institutional and operational governance directives that translate national statutes, legal requirements, and security compliance rules into clear technology practices.", "details": [{"label": "TROUBLESHOOTING", "value": "Review statutory requirements, publish clear policy documentation on the intranet, and mandate yearly interactive security awareness training for all users."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.18786447604584777, "y": 0.9323751138174461, "z": 0.30884233157700935, "word": "Responsibilities (business practices), documenting", "row_number": 2166, "definition": "The process of clearly defining and recording the roles, duties, and accountability of employees and administrators within an organization to ensure operational order and compliance.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a 'Responsibility Matrix' or RACI (Responsible, Accountable, Consulted, Informed) chart, clearly documenting who owns which processes, and ensure these documents are signed and accessible to all relevant staff."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.16088881851125394, "y": 0.9532121903425196, "z": 0.2559322337269552, "word": "Security: PCI-DSS (Payment Card Industry Data Security Standard)", "row_number": 2290, "definition": "A set of security standards designed to ensure that all companies that accept, process, store, or transmit credit card information maintain a secure environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the internal network against PCI-DSS (Payment Card Industry Data Security Standard) requirements, ensure network segmentation is in place, and perform regular vulnerability scanning using authorized tools."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
