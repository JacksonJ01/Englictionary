<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 42, "radius": 285.0, "nodes": [{"x": -0.45896356625016943, "y": -0.8060734977985453, "z": 0.3 alling larger RAM sticks or replacing an old hard drive with a fast solid-state drive (SSD)) to meet or exceed the software manufacturer's recommended hardware levels."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46448658866849785, "y": -0.8083341702444404, "z": 0.3617292885050003, "word": "DIMM (Dual-Inline Memory Modules)", "row_number": 647, "definition": "The standard physical form factor for RAM used in desktop computers.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the locking clips on the \u201cDIMM\u201d slot click into place when installing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.4373173031179389, "y": -0.8166906462563303, "z": 0.37652352477776274, "word": "Impact of applications on devices/computers", "row_number": 1105, "definition": "The assessment of how resource-heavy applications (CPU, RAM, Disk, Network) affect the stability and performance of a workstation or mobile device.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cTask Manager\u201d (Windows) or \u201cActivity Monitor\u201d (macOS) to identify high resource-consuming processes, uninstall unnecessary background applications, or upgrade hardware components (like RAM) to meet application requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46644764413632306, "y": -0.7970378330953996, "z": 0.3836108547659519, "word": "Memory: Virtual memory", "row_number": 1444, "definition": "A memory management capability of the OS that uses a portion of the hard drive (known as a page file or swap file) to act as an extension of physical RAM, allowing the system to handle more data than can physically fit in RAM.", "details": [{"label": "TROUBLESHOOTING", "value": "Increase the size of the page file in the System Properties > Performance Options menu; ensure the storage drive (HDD or SSD) has enough free space; for better performance, move the page file to a faster physical drive (ideally an SSD) if the current one is a slow mechanical disk."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.45245517044725647, "y": -0.8185660809209636, "z": 0.35388400628064326, "word": "OS (Operating Systems): Application requirements", "row_number": 1698, "definition": "The minimum hardware and software conditions (CPU speed, RAM, disk space) required for an application to run on a specific OS.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the vendor\u2019s documentation for compatibility; update the OS to the required patch level; install necessary runtimes (like \u201cDirectX\u201d or \u201c.NET Framework\u201d)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4402337645428486, "y": -0.8073374977019082, "z": 0.3929381597158172, "word": "RAM: Virtual RAM", "row_number": 2095, "definition": "A section of the hard drive (often called a 'page file' or 'swap file') that the OS uses as an extension of physical RAM when the system runs out of physical memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Increase the physical RAM installed in the system to reduce reliance on the slower hard disk drive swap space."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4756540052951482, "y": -0.8000874883603752, "z": 0.3655315009898186, "word": "RAM: Windows 10 editions", "row_number": 2097, "definition": "Different versions of Windows 10 that have specific limits on how much physical RAM they can address (e.g., Home vs. Pro).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the OS edition and system type (32-bit vs 64-bit); upgrade to a 64-bit version of Windows to address more than 4GB of memory."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4339601860520293, "y": -0.8240752539896987, "z": 0.3641133514216444, "word": "Requirements, applications", "row_number": 2145, "definition": "The mandatory hardware and software technical specifications (CPU clock speed, RAM capacity, disk space, and OS version) that must be met for a specific software application to install and execute successfully.", "details": [{"label": "TROUBLESHOOTING", "value": "Compare the system's current hardware inventory against the software manufacturer's 'Readme' or 'System Requirements' documentation; upgrade components (such as increasing RAM or updating GPU drivers) if the minimum benchmarks are not met."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4591796491070381, "y": -0.79473662280253, "z": 0.3969228517260837, "word": "Settings: Virtual Memory section", "row_number": 2354, "definition": "A technique where the OS (Operating System) uses a portion of the hard disk as additional RAM (Random Access Memory), known as a paging file.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to \u201cSettings > System > About > Advanced system settings > Performance > Advanced > Virtual memory\u201d, and ensure \u201cAutomatically manage paging file size for all drives\u201d is enabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46617694302663476, "y": -0.8135257975102208, "z": 0.3476418193711756, "word": "System requirements, applications", "row_number": 2541, "definition": "The set of minimum hardware (CPU speed, RAM, disk space) and software (OS version, drivers) needed for an application to function correctly.", "details": [{"label": "TROUBLESHOOTING", "value": "Compare the manufacturer's provided specification sheet against the system information retrieved via \u201cmsinfo32\u201d and upgrade components (like RAM) if they do not meet the minimum requirement."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4276977620942866, "y": -0.8165961127603059, "z": 0.38761503186060386, "word": "Underclocking, RAM", "row_number": 2742, "definition": "The practice of manually setting the operational clock frequency or timings of RAM (Random Access Memory) below its factory-rated specifications to increase system stability, reduce power usage, or troubleshoot timing synchronization errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Boot the system into the UEFI/BIOS setup utility. Locate the memory frequency settings (often found under \"Overclocking\", \"AI Tweaker\", or \"MIT\"), change the memory multiplier or clock speed down to a lower stable threshold (e.g., from 3200MHz down to 2933MHz or 2666MHz), save settings, and run a memory diagnostic tool such as \"MemTest86\" to verify stability."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.479132929720406, "y": -0.7913433085058528, "z": 0.37974649931309584, "word": "Virtual memory", "row_number": 2816, "definition": "An operating system storage management technique that maps hardware random access memory addresses into temporary workspace blocks located on a physical hard disk or solid-state drive, extending system memory resources through paging.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the System Properties control panel, navigate through the options \"Advanced > Performance Settings > Advanced tab\", and click the \"Change\" button located under the Virtual Memory workspace section. Deselect the automated management check box, manually allocate a fixed custom paging file range size (typically equivalent to 1.5 times physical system RAM scale), and save configurations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.44187639067392825, "y": -0.8265874507531843, "z": 0.34856626575492633, "word": "Windows 10: RAM (Random Access Memory)", "row_number": 2915, "definition": "The physical volatile system memory requirements and architectural access limitations (such as a 4 GB boundary limit for 32-bit versions versus a 128 GB or higher limit for 64-bit builds) that govern how Windows 10 manages operational system memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Open System Properties by running the command \u201ccontrol system\u201d or opening the Settings app. Verify if the system architecture is running a \"32-bit operating system\"; if it is, back up all local data profiles and perform a clean installation using a 64-bit Windows 10 installation image to remove the 4 GB allocation barrier and harness all physical memory."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4434624461850735, "y": -0.7997808573594762, "z": 0.4045882339180069, "word": "X64 CPU", "row_number": 2993, "definition": "A processor architecture capable of handling 64-bit memory addresses, allowing the operating system (OS) to access significantly larger amounts of random access memory (RAM) than 32-bit architectures and supporting high-performance 64-bit software applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the processor type by opening the \u201cSystem Information\u201d tool or running the command \u201cmsinfo32\u201d in the Run dialog. If the hardware is 64-bit capable but currently running a 32-bit OS, the only solution is to perform a clean install of the 64-bit OS version after backing up all user data."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
