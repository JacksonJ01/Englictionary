<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 128, "radius": 285.0, "nodes": [{"x": -0.45766627333630655, "y": 0.8861468192816353, "z": -0.07270073539860394, "word": "Attacks: Zero-day attacks", "row_number": 169, "definition": "A highly dangerous cyberattack method that targets a software or hardware security vulnerability that is completely unknown to the vendor or the public. Because the vulnerability has \"zero days\" of public awareness, no security patches or antivirus definitions exist to block it.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement advanced heuristic or behavioral-based Endpoint Detection and Response (EDR) agents to detect abnormal program activity; use strict network segmentation controls to isolate critical data assets from standard user zones."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4694603823460813, "y": 0.8793520689549477, "z": -0.07966735989176676, "word": "CVE (Common Vulnerabilities and Exposures)", "row_number": 592, "definition": "A publicly accessible list of known cybersecurity vulnerabilities, providing a standardized identifier for each threat.", "details": [{"label": "TROUBLESHOOTING", "value": "Research the specific CVE ID in the database to understand the threat, then apply the recommended software patches or configuration changes to mitigate the vulnerability."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46233831371100176, "y": 0.8847099288985979, "z": -0.059427480033273375, "word": "Documentation: CVE (Common Vulnerabilities and Exposures)", "row_number": 746, "definition": "A list of publicly disclosed cybersecurity vulnerabilities, identified by a unique number (e.g., CVE-202X-XXXX), used to track and patch software security flaws.", "details": [{"label": "TROUBLESHOOTING", "value": "Cross-reference system versions against the CVE database and deploy the necessary security patches (patch management)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.45396861118458665, "y": 0.8869349517046219, "z": -0.08519912853930957, "word": "End-of-life/end-of-support, OS", "row_number": 851, "definition": "The date after which an operating system developer no longer provides security patches, technical support, or updates, leaving the OS vulnerable to new exploits.", "details": [{"label": "TROUBLESHOOTING", "value": "Plan for a migration to a supported version of the operating system. If migration is impossible, isolate the machine from the network (air-gap) to mitigate exposure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.47862159066210475, "y": 0.8752601137783554, "z": -0.06957805818487006, "word": "Exposures/vulnerabilities, CVE", "row_number": 903, "definition": "Common Vulnerabilities and Exposures (CVE) is a standardized list of publicly known cybersecurity vulnerabilities, providing a unique identifier for each flaw so organizations can track and remediate them.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the CVE ID associated with the vulnerability, check the vendor's security advisory, and apply the recommended software patches or firmware updates immediately."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4484310676926861, "y": 0.8916585390123241, "z": -0.06208564515574674, "word": "Life-cycle limitations, OS", "row_number": 1249, "definition": "The predefined time boundaries established by software vendors defining the sequential stages of an operating system's support life, migrating from active mainstream feature development, through extended security-only update patch intervals, up to the absolute EOL (End of Life) threshold where all public patch distributions terminate.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the command \"winver\" to determine the operating system's precise compilation build version number, evaluate the data parameters against the vendor's active support lifespan charts, and execute inline OS upgrade paths to migrate out-of-support platforms to current distributions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46710642557901927, "y": 0.87925188037866, "z": -0.09342225662754432, "word": "Linux: Patches", "row_number": 1289, "definition": "The code updates, bug fixes, and security mitigations compiled and distributed by distribution maintainers to repair vulnerabilities and optimize system stability across the operating system layer.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish automated patching workflows using scheduled package update utilities, and track patch application statuses across enterprise instances."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.47297469476888515, "y": 0.8795275416675337, "z": -0.052213423145247, "word": "Mobile devices: Updating", "row_number": 1474, "definition": "The process of installing OS or app updates to patch security vulnerabilities, fix bugs, or add new features.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device is connected to Wi-Fi and has sufficient battery; go to Settings > Software Update; if an update fails, try clearing the system cache."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4420566544863575, "y": 0.893313063235871, "z": -0.08110293013494674, "word": "Networks: Zero-day attacks", "row_number": 1661, "definition": "An attack that exploits a previously unknown vulnerability in software or hardware, for which no patch or remediation has been developed yet.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the affected machines from the network immediately; monitor logs for suspicious patterns; implement temporary firewall rules to block the malicious traffic until a patch is released."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.483780948304847, "y": 0.8712842736349152, "z": -0.08258152683101164, "word": "OS (Operating Systems): End-of-life/end-of-support", "row_number": 1703, "definition": "The date after which a software vendor stops providing updates, security patches, or technical support for an OS version.", "details": [{"label": "TROUBLESHOOTING", "value": "Plan an immediate migration to a supported OS version; isolate the machine from the network if it must be kept for legacy hardware compatibility."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.45335618225935637, "y": 0.8900382625013913, "z": -0.04795897508001593, "word": "Patches, Linux", "row_number": 1759, "definition": "Small, specialized software updates designed to fix security vulnerabilities or bugs in the Linux kernel or installed applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the distribution package manager (like \"apt update && apt upgrade\" for Debian/Ubuntu or \"dnf update\" for Fedora/RHEL) to pull and install the latest updates."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.45426277553501726, "y": 0.885246438530221, "z": -0.09992033743328775, "word": "Security: Threats/vulnerabilities", "row_number": 2303, "definition": "A threat is a potential for loss or damage to a system, while a vulnerability is a weakness in that system that can be exploited by a threat.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct regular vulnerability assessments using tools like \u201cNessus\u201d, prioritize patching critical flaws, and implement mitigation strategies (e.g., firewalls) where immediate patching is impossible."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.48613956355105986, "y": 0.8719714454083058, "z": -0.05774186646563485, "word": "Social engineering: Zero-day attacks", "row_number": 2420, "definition": "A sophisticated attack that exploits a software or hardware vulnerability that is unknown to the vendor and for which no patch or remediation exists yet.", "details": [{"label": "TROUBLESHOOTING", "value": "Employ behavior-based monitoring and Intrusion Prevention Systems (IPS) that look for anomalous activity rather than known signatures, maintain robust offline backups, and implement strict network segmentation to limit the blast radius if a system is compromised."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.43613153030646684, "y": 0.8974575917344635, "z": -0.06602392983393407, "word": "Threats/vulnerabilities", "row_number": 2598, "definition": "A threat is any potential event or adversary looking to exploit an information system, whereas a vulnerability represents an unpatched software code error, logical flaw, or physical design weakness that allows a threat to succeed.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute a comprehensive vulnerability assessment scan across all subnets using specialized network security auditing tools, isolate exposed endpoints immediately, prioritize critical code anomalies, and apply official vendor software patch installations to seal the flaws."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.478214447080566, "y": 0.8726574053594336, "z": -0.09889385964138403, "word": "Threats/vulnerabilities: Zero-day attacks", "row_number": 2612, "definition": "An exploitation event targeting a software or hardware security vulnerability that is completely unknown to the vendor and product engineers, leaving zero days of remediation or official software patches available to defend against the initial exploitation.", "details": [{"label": "TROUBLESHOOTING", "value": "Shift the network monitoring posture from old signature-based scanners to heuristic-based behavioral monitoring engines and EDM (Endpoint Detection and Response) tools, isolate critical servers behind internal firewalls, and perform real-time anomaly analysis within sandboxed gateway fabrics."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46760455623829805, "y": 0.8830418466592566, "z": -0.03978788802882583, "word": "Vulnerabilities/threats: Zero-day attacks", "row_number": 2870, "definition": "A cyberattack vector that exploits a newly discovered software program or operating system vulnerability before the product developer or security community is aware of the issue or has engineered a functional patch hotfix.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement a layered network defense strategy using application whitelisting models, behavior-based Endpoint Detection and Response (EDR) agents, and strict host-based isolation configurations. If an active exploitation wave occurs across the enterprise fleet, implement temporary workarounds (such as disabling the affected system service or blocking associated transport ports at the network edge) until the software vendor delivers a formal security patch bundle."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.43872225695364425, "y": 0.8936189255135704, "z": -0.09469951012266466, "word": "Zero-day attacks", "row_number": 2999, "definition": "A cyberattack that exploits a previously unknown software vulnerability (a vulnerability for which there is \u201czero days\u201d of warning or patch availability) before the software vendor has the opportunity to create and distribute a fix.", "details": [{"label": "TROUBLESHOOTING", "value": "Since no patch exists, employ defense-in-depth strategies: enable a host-based firewall, use an Intrusion Prevention System (IPS), implement the principle of least privilege, and use behavior-based analysis tools to detect anomalous activity that deviates from established baselines."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
