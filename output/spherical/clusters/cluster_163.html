<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 163, "radius": 285.0, "nodes": [{"x": -0.9830280774919721, "y": -0.170614646268277, "z": -0.06742730412220264, "word": "App History tab, Task Manager", "row_number": 125, "definition": "A dedicated analytical data presentation panel located inside the Windows Task Manager utility. It tracks and logs the cumulative system resources (CPU time, network data transmission capacity, metered network consumption) used by individual application modules over a rolling 30-day window.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch Task Manager (\"Ctrl + Shift + Esc\"), click the App History tab, click on individual column headers to sort by resource usage metrics (such as sorting by Network to find data-heavy applications), and clear history logs to start tracking fresh performance baselines."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9798486967766997, "y": -0.18511423256341586, "z": -0.07502834349404722, "word": "Notification area, Windows Desktop", "row_number": 1668, "definition": "The section of the Windows taskbar (system tray) that displays icons for background applications, system status (clock, volume, network), and notifications.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the taskbar settings to see if icons are hidden; restart the \u201cWindows Explorer\u201d process via the Task Manager to refresh the UI (User Interface)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9829776687915127, "y": -0.1759309476087518, "z": -0.05294529564267076, "word": "Pinned applications, Windows Desktop", "row_number": 1829, "definition": "Applications added to the Taskbar or Start menu for quick access.", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the application's executable in the File Explorer, right-click it, and select \"Pin to taskbar\" or \"Pin to start\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9827001478585096, "y": -0.16652058652484686, "z": -0.08106363958202546, "word": "Processes tab, Task Manager", "row_number": 1964, "definition": "A section in the Windows Task Manager that lists all currently running applications and background processes, along with their resource usage (CPU, Memory, Disk).", "details": [{"label": "TROUBLESHOOTING", "value": "Open Task Manager (press \u201cCtrl + Shift + Esc\u201d), identify the process with high usage, right-click, and select \u201cEnd Task\u201d to terminate the rogue application."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9785175106381173, "y": -0.1959716733413052, "z": -0.06402018917802946, "word": "Services tab, Task Manager", "row_number": 2335, "definition": "A section in the Windows Task Manager that provides a list of all currently running services, allowing users to start, stop, or view the status of background processes.", "details": [{"label": "TROUBLESHOOTING", "value": "Press \u201cCtrl + Shift + Esc\u201d to open Task Manager, navigate to the \u201cServices\u201d tab, look for the service status, right-click the service, and select \u201cStart\u201d or \u201cStop\u201d to troubleshoot the behavior."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.985667166040337, "y": -0.1591901384347449, "z": -0.05584565887459178, "word": "Task Manager: App History tab", "row_number": 2558, "definition": "A tab in Task Manager that provides a summary of resource usage (CPU time and network usage) by apps over a specific period.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the \u201cApp History\u201d tab, click \u201cOptions\u201d in the menu bar, and select \u201cShow history for all processes\u201d to view detailed usage logs for installed applications."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9790359352787734, "y": -0.18270835173004377, "z": -0.09003496898931874, "word": "Task Manager: Processes tab", "row_number": 2559, "definition": "A tab displaying all active applications and background processes running on the system, along with their real-time resource usage.", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the problematic process in the list, right-click it, and select \u201cEnd task\u201d to terminate it forcefully."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9810033622899567, "y": -0.1886813602644411, "z": -0.045074909479223955, "word": "Task Manager: Services tab", "row_number": 2560, "definition": "A tab that lists all Windows services (background programs that run independently of user interaction) and their current status (running or stopped).", "details": [{"label": "TROUBLESHOOTING", "value": "Go to the \u201cServices\u201d tab, right-click a service, and select \u201cStart\u201d, \u201cStop\u201d, or \u201cRestart\u201d to resolve service-level faults."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.985402847316483, "y": -0.15203482593089626, "z": -0.07659399587911805, "word": "Task Manager: Users tab", "row_number": 2562, "definition": "A tab that shows all users currently logged into the computer and the processes associated with each user session.", "details": [{"label": "TROUBLESHOOTING", "value": "Expand the user's name in the \u201cUsers\u201d tab, right-click the specific application or process, or right-click the user to \u201cDisconnect\u201d or \u201cSign off\u201d their session."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9761235077694237, "y": -0.20264883975915604, "z": -0.07820706697085386, "word": "Taskbar, Windows Desktop", "row_number": 2564, "definition": "The long horizontal or vertical bar usually located at the bottom of the Windows desktop that provides access to the Start menu, pinned apps, and system tray.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the \u201cWindows Explorer\u201d process via Task Manager, right-click the taskbar to check \u201cTaskbar settings\u201d, or unlock the taskbar to reposition it."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9854933389663494, "y": -0.1648271780874773, "z": -0.040433652032373896, "word": "Users tab, Task Manager", "row_number": 2785, "definition": "A tab in the Windows Task Manager utility that provides a list of all currently logged-in users, the resources they are consuming, and the ability to disconnect or sign them out.", "details": [{"label": "TROUBLESHOOTING", "value": "Open Task Manager (press \u201cCtrl + Shift + Esc\u201d), navigate to the \u201cUsers\u201d tab, identify the user consuming excessive CPU (Central Processing Unit) or RAM (Random Access Memory), right-click their entry, and select \u201cSign off\u201d or \u201cDisconnect\u201d to release resources."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9810952649247136, "y": -0.16738913085650142, "z": -0.09712342669722351, "word": "Windows Desktop: Notification area", "row_number": 2930, "definition": "The dedicated segment of the system taskbar interface (traditionally situated in the bottom-right corner) that aggregates active background process icons, network status links, system volume levels, power indicators, and current clock parameters.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the system settings interface by pressing the quick key shortcut command \u201cWin + I\u201d, navigate over to \"Personalization > Taskbar\", and select the \"Taskbar corner overflow\" (or \"Other system tray icons\") configurations toggle panel. Switch the explicit software application indicators to \"On\" to force them out into persistent visual spaces, allowing technicians to inspect background operations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.9774581036463434, "y": -0.20485051329548687, "z": -0.051106974266430245, "word": "Windows Desktop: Taskbar", "row_number": 2934, "definition": "The elongated interface strip pinned to a boundary edge of the screen layout that centralizes the Start icon, active application tracking buttons, pinned quick launch shortcuts, and the system notification area tray.", "details": [{"label": "TROUBLESHOOTING", "value": "Open an administrative Command Prompt terminal window, execute the task termination tool via the command statement \u201ctaskkill /f /im explorer.exe\u201d, and immediately follow up by entering the command line instruction \u201cstart explorer.exe\u201d to rebuild the desktop shell architecture and restore taskbar tracking mechanisms."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
