e\u201d rather than \u201cPublic\u201d; confirm \u201cFile and Printer Sharing\u201d is enabled."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.24130752830135097, "y": 0.1135529921461307, "z": -0.9637823378542238, "word": "Permissions: Share permissions", "row_number": 1792, "definition": "Access rights applied to network-shared folders to control access over the network.", "details": [{"label": "TROUBLESHOOTING", "value": "Note that local security is the most restrictive; check both the \"Share\" tab permissions and the \"Security\" (NTFS) tab permissions, ensuring the user has rights in both."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.22101812978173396, "y": 0.06370140112002526, "z": -0.9731870929082086, "word": "PowerShell: Mapping drives", "row_number": 1901, "definition": "Using PowerShell to connect a local drive letter to a shared network resource, usually facilitated by the \u201cNew-PSDrive\u201d or \u201cNew-SmbMapping\u201d cmdlets.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure network connectivity to the file server, verify the user has proper share and NTFS (New Technology File System) permissions, and use \u201cRemove-PSDrive\u201d to clear conflicting existing mappings before re-attempting."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.20223046345380843, "y": 0.11650945459216983, "z": -0.9723828395451521, "word": "Protocols: CIFS (Common Internet File System)", "row_number": 1987, "definition": "A dialect of the Server Message Block (SMB) protocol, used for sharing files, printers, and serial ports across network nodes.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the server is reachable via \u201cping\u201d, ensure port 445 is open on the firewall, and check if the user has correct permissions to the shared directory on the host server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2519403907489971, "y": 0.08909259292627235, "z": -0.9636329951775812, "word": "Protocols: FTP (File Transfer Protocol)", : "TROUBLESHOOTING", "value": "Right-click the distributed network directory block, select \u201cProperties\u201d, navigate to the \u201cSharing\u201d tab, click the \u201cAdvanced Sharing...\u201d button configuration, check the \u201cPermissions\u201d box layout, select the target user security group, check the appropriate access box (e.g., \u201cFull Control\u201d, \u201cChange\u201d, or \u201cRead\u201d), and click \u201cApply.\u201d"}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.20914889678633575, "y": 0.12684552714499023, "z": -0.9696220661764914, "word": "Shares, administrative", "row_number": 2365, "definition": "Invisible, hidden network storage shares automatically established by the Windows kernel for system account administration workflows, universally distinguished by a trailing currency symbol character (such as \u201cC$\u201d or \u201cADMIN$\u201d).", "details": [{"label": "TROUBLESHOOTING", "value": "Query active hidden system resource parameters by launching the Command Prompt interface and executing the instruction \u201cnet share\u201d; ensure that structural corporate firewall access policies only authorize connections to these segments via secure, restricted management workstations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.25355371508559005, "y": 0.07630065045187184, "z": -0.9643073806141467, "word": "Sharing: Access, Windows networks", "row_number": 2366, "definition": "The administrative orchestration of network directory authorization criteria across Windows systems, ensuring that distributed corporate devices can view and pull files from a centralized host.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cControl Panel\u201d, choose \u201cNetwork and Sharing Center\u201d, select the \u201cAdvanced sharing settings\u201d sidebar option link, toggle the setting configuration to \u201cTurn on network discovery\u201d and \u201cTurn on file and printer sharing\u201d, and ensure the machines share a synchronized workgroup identity name or domain tree."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.18687937642217442, "y": 0.08379051646913355, "z": -0.9788029669028876, "word": "Sharing: Data, Windows networks", "row_number": 2367, "definition": "The logical mechanism of enabling standard file system elements to accept parallel concurrent read and write operations from remote computer network terminals across the corporate enterprise domain.", "details": [{"label": "TROUBLESHOOTING", "value": "Choose the desired data folder path container, right-click and select \u201cGive access to > Specific people...\u201d, choose the designated user account from the management drop-down matrix list, click \u201cAdd\u201d, establish their specific role level to \"Read/Write\", and hit the final \u201cShare\u201d button validation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.240913455238377, "y": 0.12481097921058912, "z": -0.9624878838476879, "word": "SMB (Service Message Block) protocol", "row_number": 2393, "definition": "A application-layer network transport protocol utilized heavily by Windows computers to share directory files, printer queues, and hardware serial ports across an active network subnet link over standardized port 445.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify basic layer 3 network connectivity paths to the destination storage node using the command line tool \u201cping\u201d, check that network firewall rules do not filter or drop communication tracking parameters over Transmission Control Protocol (TCP) port \u201c445\u201d, and confirm the server's Workstation and Server background services are running."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.2287870879967958, "y": 0.05560127300798774, "z": -0.9718873220727995, "word": "Windows networks: Access", "row_number": 2939, "definition": "The security validation boundaries, network sharing discovery protocols, and privilege parameters that control whether an endpoint node can discover and c
