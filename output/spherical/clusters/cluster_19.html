olate the specific kernel driver source faulting execution."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6774835173160246, "y": -0.2787706439928037, "z": 0.6806636554223716, "word": "Intermittent shut downs/bootup failures, RAM, troubleshooting", "row_number": 1150, "definition": "The mechanical and logical diagnosis tracking method utilized to isolate faulty or degraded random access memory modules that crash the system under high workload tasks.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the machine workstation, press the required keys to boot into an external evaluation application tool environment like MemTest86, execute deep cycle checks on each memory stick individually by isolating trace ports, and replace defective blocks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6507481902177212, "y": -0.2731125984780727, "z": 0.7084746300898259, "word": "Memory: Testing programs", "row_number": 1442, "definition": "Software utilities designed to stress-test RAM modules by writing and reading data patterns to detect hardware faults, stuck bits, or addressing errors.", "details": [{"label": "TROUBLESHOOTING", "value": "Download a reliable memory testing program like \u201cMemTest86\u201d; create a bootable USB drive containing the tool; boot the computer from the USB drive; run a full \u201cpass\u201d of the test; if the software reports any red errors, the hardware RAM module is likely defective and should be replaced."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6800459643586242, "y": -0.25080337686978094, "z": 0.6889376985695177, "word": "Memory: Troubleshooting", "row_number": 1443, "definition": "The methodical process of identifying and resolving issues related to system memory, including physical module failure, incorrect configurations, and compatibility problems.", "details": [{"label": "TROUBLESHOOTING", "value": "Start with the simplest tasks: check for loose RAM sticks; ensure they are properly seated; test modules one by one; verify BIOS settings for correct voltage and timings; and use software diagnostic tools to rule out OS-level conflicts vs. actual physical hardware failure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6643965782584536, "y": -0.2921463600674854, "z": 0.687915467988457, "word": "Online resources: Dump files", "row_number": 1681, "definition": "Files created by the OS when a system crash (or \u201cBlue Screen of Death\u201d) occurs, containing the state of memory to help diagnose the cause of failure.", "details": [{"label": "TROUBLESHOOTING", "value": "Locate the files in \u201cC:\\Windows\\Minidump\u201d; use \u201cWinDbg\u201d (Windows Debugger) or \u201cBlueScreenView\u201d to analyze the memory dump to identify the offending driver or process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.655910057817257, "y": -0.2527162165702193, "z": 0.7112780820021074, "word": "POST (Power-On Self-Test), BIOS firmware", "row_number": 1864, "definition": "A built-in diagnostic program embedded within motherboard non-volatile memory that verifies the core hardware components (like RAM, CPU, and storage controllers) are operational before passing control to the bootstrap loader.", "details": [{"label": "TROUBLESHOOTING", "value": "Note the specific pattern of audio beeps or read the digital POST card diagnostic number, cross-reference the codes with the motherboard manual to identify the failing subsystem (such as a bad memory module), reseat the affected card or chip, and retest."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6862791019401014, "y": -0.26801687230249743, "z": 0.676156749874964, "word": "RAM: Testing", "row_number": 2092, "definition": "The process of using software tools (like 'Windows Memory Diagnostic') to identify faulty bits or modules in the system's memory.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the test tool; if it detects errors, replace the memory module that was identified as faulty."}, {"label": "CORE", "value k for drive errors, and use \u201cSystem Restore\u201d to revert the system to a previous stable state."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6892055620568833, "y": -0.25136893980364267, "z": 0.6795655592596261, "word": "Troubleshooting: Hibernate mode", "row_number": 2676, "definition": "Resolving issues where a computer fails to enter or wake up from hibernate, a power state that writes data from RAM (Random Access Memory) to the storage drive before powering down.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the \u201cHibernation\u201d file (\u201chiberfil.sys\u201d) is not corrupted, update power management drivers, and disable/re-enable hibernation in command prompt using \u201cpowercfg /hibernate on\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6551839723056911, "y": -0.2997717088707533, "z": 0.6934485453113617, "word": "Troubleshooting: Memory", "row_number": 2688, "definition": "Diagnosing issues related to RAM (Random Access Memory) modules that cause system instability.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cWindows Memory Diagnostic\u201d tool or \u201cMemTest86\u201d to test modules for errors, reseat RAM (Random Access Memory) sticks, and replace faulty modules if errors are detected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6601946882273725, "y": -0.24016284619121642, "z": 0.7116633901963038, "word": "Troubleshooting: RAM (Random Access Memory)", "row_number": 2704, "definition": "Resolving instability caused by physical memory modules failing to store temporary data correctly for the CPU (Central Processing Unit).", "details": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cWindows Memory Diagnostic\u201d tool or \u201cMemTest86\u201d, reseat the memory modules into their slots, ensure the RAM (Random Access Memory) speed and type match the motherboard requirements, and test each module individually to isolate a faulty stick."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6884931376463113, "y": -0.2793031808073251, "z": 0.6693033188359729, "word": "Troubleshooting: Sleep/suspend mode", "row_number": 2709, "definition": "Diagnosing failures related to the power-saving state where the computer stores the current session in RAM (Random Access Memory) and cuts power to non-essential components.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \u201cpowercfg -lastwake\u201d to identify the cause of the last wake, update NIC (Network Interface Card) or keyboard drivers to allow them to wake the system, and check BIOS/UEFI (Unified Extensible Firmware Interface) power settings."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6403099482601826, "y": -0.2828700785948542, "z": 0.7141342232345285, "word": "Windows 10: Dump files", "row_number": 2910, "definition": "System memory snapshot documents (such as MEMORY.DMP or minidump files) automatically generated by the Windows kernel when an unrecoverable system crash or Blue Screen of Death (BSOD) occurs, capturing the state of volatile memory to aid in diagnostics.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the system root path \u201cC:\\Windows\\Minidump\u201d to locate the raw debug data logs. Download and install the Microsoft WinDbg (Windows Debugger) utility tool, open the recent minidump log file within the editor console, and execute the analysis command string \u201c!analyze -v\u201d to read the call stack trace and isolate the exact system driver binary causing the crash."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.n Attribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);came
