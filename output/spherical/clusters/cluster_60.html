<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 60, "radius": 285.0, "nodes": [{"x": 0.37165932732132656, "y": 0.8208986485310189, "z": -0.4335836173738645, "word": "Authentication: Email", "row_number": 183, "definition": "Cryptographic validation protocols\u2014including Sender Policy Framework (SPF), DomainKeys Identified Mail (DKIM), and Domain-based Message Authentication, Reporting, and Conformance (DMARC)\u2014used by mail servers to verify that an email message actually originated from the domain it claims to be from.", "details": [{"label": "TROUBLESHOOTING", "value": "Access your public Domain Name System (DNS) management zone file layout and add explicit \u201cSPF text strings\u201d, configure \u201cDKIM public key entries\u201d, and deploy a restrictive \u201cDMARC rule line\u201d to validate outbound email traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.35798821000921616, "y": 0.823628169107397, "z": -0.4398648434999034, "word": "Browsers: File signatures", "row_number": 275, "definition": "Cryptographic hashes or digital marks embedded within downloadable items to verify the authentic author and ensure the code hasn't been altered.", "details": [{"label": "TROUBLESHOOTING", "value": "Download the file from the developer's official repository, check file properties to view certificate validity details, and update root validation authority listings."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.36958690258604027, "y": 0.8280630960771209, "z": -0.4215649776155863, "word": "Browsers: Hashing", "row_number": 276, "definition": "The conversion of variable-length web data or files into a fixed-length alphanumeric string to verify data integrity.", "details": [{"label": "TROUBLESHOOTING", "value": "Re-upload clean production script copies to the web server, re-calculate file hash strings using terminal utilities like \u201ccertutil -hashfile\u201d, and update corresponding HTML (Hypertext Markup Language) tags."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.37273733830026856, "y": 0.8143631339374341, "z": -0.44483655731114546, "word": "DKIM", "row_number": 701, "definition": "An email authentication method that uses a digital signature to verify that an email was not tampered with in transit and originated from the claimed domain.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the public key is correctly published in the domain's DNS TXT (Text) records and that the mail server is signing outgoing mail correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.35058059210069864, "y": 0.8316142879849674, "z": -0.43070979146239446, "word": "DNSSEC", "row_number": 710, "definition": "A suite of extensions that adds security to the DNS protocol by providing origin authentication and data integrity through digital signatures.", "details": [{"label": "TROUBLESHOOTING", "value": "Use online DNSSEC validation tools to verify that the cryptographic keys are valid and that the chain of trust is intact."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3832788622252639, "y": 0.8205991592772537, "z": -0.42392727391000895, "word": "DNSSEC (Domain Name System Security Extensions)", "row_number": 734, "definition": "A suite of extension protocols used to secure information provided by the Domain Name System (DNS) by adding cryptographic signatures to DNS records, ensuring data integrity and origin authentication.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the DNS server configuration in the network settings, use the command nslookup or dig to check if records are properly signed, and clear the local DNS cache using ipconfig /flushdns."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.35735298460573345, "y": 0.817184043518703, "z": -0.45222680527783493, "word": "Email: Authentication", "row_number": 823, "definition": "The application of cryptographic validation layers and server verification policies (such as Sender Policy Framework (SPF), DomainKeys Identified Mail (DKIM), and Domain-based Message Authentication, Reporting, and Conformance (DMARC)) to confirm email origin authenticity and stop spoofing attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the public Domain Name System (DNS) zone file management portal for your organization, append a missing or malformed SPF text record entry containing authorized source IP addresses, and insert proper DKIM cryptographic public key strings to satisfy receiving validation layers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3599879381020529, "y": 0.8355830613574642, "z": -0.4149814839164764, "word": "Invalid email certificates, troubleshooting", "row_number": 1167, "definition": "An error occurring when an email client (such as Microsoft Outlook) cannot verify the digital identity (S/MIME\u2014Secure/Multipurpose Internet Mail Extensions) of the sender or server, preventing encrypted or signed email communication.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the email client\u2019s \u201cTrust Center\u201d or \u201cSecurity Settings,\u201d ensure the sender\u2019s public key is correctly imported into your local certificate store, and verify that your own digital ID certificate has not expired."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.38573888787422256, "y": 0.8103472802416531, "z": -0.4410700576852998, "word": "Logical security: Email", "row_number": 1325, "definition": "The implementation of security controls (such as S/MIME digital certificates, spam filtering rules, and phishing detection engines) to protect corporate messaging systems from unauthorized modification, data interception, and social engineering attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Configure advanced email filtering rules, activate SPF (Sender Policy Framework) and DKIM (DomainKeys Identified Mail) records within the corporate public DNS lookup zones, and train staff to identify common social engineering indicators."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.34235389711600756, "y": 0.828904317659642, "z": -0.44239285854846877, "word": "Security: DNSSEC (Domain Name System Security Extensions)", "row_number": 2267, "definition": "A suite of extensions that adds security to DNS (Domain Name System) by providing origin authentication and data integrity through digital signatures.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cnslookup -debug\u201d or \u201cdig +dnssec\u201d to diagnose resolution issues and check the chain of trust in the DNS (Domain Name System) records."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38103411225743766, "y": 0.8281372068256911, "z": -0.4110982509901119, "word": "Security: Email", "row_number": 2268, "definition": "The implementation of security controls for email, including encryption (S/MIME - Secure/Multipurpose Internet Mail Extensions), spam filtering, and phishing awareness.", "details": [{"label": "TROUBLESHOOTING", "value": "Update email client filtering rules, ensure TLS (Transport Layer Security) is configured for outgoing/incoming mail, and educate users on identifying phishing attempts."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.36907411507172566, "y": 0.8086969409387768, "z": -0.45803226447520834, "word": "Security: Websites", "row_number": 2310, "definition": "The practice of verifying the security and authenticity of websites before entering sensitive information, typically checked via HTTPS (Hypertext Protocol Secure) and domain validation.", "details": [{"label": "TROUBLESHOOTING", "value": "Train users to inspect the URL for spelling errors, check the padlock icon for a valid certificate, and use bookmark-only access for sensitive sites."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3450846406516435, "y": 0.8393994531284246, "z": -0.41991088206192967, "word": "Signatures", "row_number": 2378, "definition": "Cryptographic hash patterns or specific structural definitions used by web browsers and email tracking applications to validate the authenticity, data origin integrity, and safety parameters of third-party files, encryption keys, and security packages.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the browser's configuration panel utility via \u201cinetcpl.cpl\u201d, click the \u201cContent\u201d tab panel layout, choose \u201cCertificates\u201d, evaluate the validity expiration dates of root Certificate Authority (CA) entities, and update the local client clock via Network Time Protocol (NTP) to clear false timestamp validation conflicts."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.39488846347072254, "y": 0.8132704979993828, "z": -0.4273806248551374, "word": "SPF (Sender Policy Framework)", "row_number": 2458, "definition": "A DNS-based email authentication method that specifies which mail servers are authorized to send email on behalf of a specific domain, helping to prevent email spoofing.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the domain\u2019s DNS records, verify that the TXT (Text) record containing the \u201cv=spf1\u201d entry includes all authorized mail server IP addresses, and use an online validator tool to ensure the record is formatted correctly."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.34449165535624093, "y": 0.8200101270396359, "z": -0.4570655214981296, "word": "Troubleshooting: Invalid email certificates", "row_number": 2679, "definition": "Resolving issues where an email client (like Outlook) rejects a digital signature or encryption certificate used for secure email messaging.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the sender's certificate is installed in the local store, check if the certificate has been revoked, and ensure the client settings are configured to trust the specific issuing authority."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.367911747635792, "y": 0.8376798395693604, "z": -0.4036501360468345, "word": "Web browsers: File signatures", "row_number": 2882, "definition": "The embedded cryptographic digital signature used to confirm the identity, origin, and binary integrity of a downloadable installer, ensuring the web asset has not been modified by an attacker.", "details": [{"label": "TROUBLESHOOTING", "value": "Right-click the downloaded executable file icon, select \"Properties\", and navigate over to the \"Digital Signatures\" tab. Inspect the certificate path chain list to ensure it traces back to a trusted Root Certification Authority (CA); if the signature is missing or corrupted, discard the file immediately and fetch a fresh copy from a verified source."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3860568635811028, "y": 0.8034455745042104, "z": -0.4532497180269626, "word": "Web browsers: Hashing", "row_number": 2883, "definition": "The mathematical application of algorithmic functions (such as Secure Hash Algorithm 256-bit [SHA-256]) to a browser file down-stream to produce a unique, fixed-length alphanumeric digest value that serves as a baseline check for structural authenticity.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a PowerShell console interface and execute the file check command \u201cGet-FileHash -Algorithm SHA256 C:\\Users\\Username\\Downloads\\installer.exe\u201d. Compare the resulting text string digest against the official hash values published on the software developer's website; if the alphanumeric strings are completely identical, the download file integrity is validated."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
