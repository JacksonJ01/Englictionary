<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 92, "radius": 285.0, "nodes": [{"x": 0.8264882528005504, "y": -0.5584867948380287, "z": 0.070 atus lights, and verify the cabling from the wall jack."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8251173514954153, "y": -0.5619490346393595, "z": 0.0582635282924308, "word": "Connectivity: Dial-up Internet connectivity", "row_number": 474, "definition": "A legacy connection method that uses the public switched telephone network to establish an internet connection via a modem.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the telephone line connection, verify the modem is configured correctly in Device Manager, and ensure the ISP phone number is accurate."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8392902065330947, "y": -0.5386403729412325, "z": 0.07388164762215997, "word": "Connectivity: DSL", "row_number": 476, "definition": "A technology that provides high-speed internet access over existing copper telephone lines.", "details": [{"label": "TROUBLESHOOTING", "value": "Check all microfilters in the home to ensure they are on the correct devices (e.g., phones), and verify the DSL modem status lights."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8197553776331353, "y": -0.5669039130928376, "z": 0.08136998317306054, "word": "Connectivity: SDSL", "row_number": 501, "definition": "A DSL technology that provides equal bandwidth for both uploading and downloading data.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the line condition and modem settings, ensuring that the service plan supports symmetric speeds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8339509967540433, "y": -0.5495665049024, "z": 0.050023911305476995, "word": "Dial-up Internet connectivity", "row_number": 642, "definition": "A legacy connection that uses a modem and an analog phone line to connect to the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the phone line connection and that the modem is correctly configured in \u201cDevice Manager\u201d."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.834301969109406, "y": -0.5437064478739966, "z": 0.09123334302988587, "word": "DSL (Digital Subscriber Line)", "row_number": 794, "definition": "A high-speed internet access technology that transmits digital data over conventional copper telephone lines while running concurrently with voice signals on distinct frequency channels.", "details": [{"label": "TROUBLESHOOTING", "value": "Install dedicated inline DSL micro-filters on all standard analog voice telephone hardware connections to separate high-frequency data signals from low-frequency voice feeds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8172305627228226, "y": -0.5729298303724577, "z": 0.062334716018647485, "word": "DSL: Connectivity", "row_number": 795, "definition": "The operational state of the wide area data loop linking a home or office workstation to an Internet Service Provider (ISP) across standard telephone lines via Asymmetric Digital Subscriber Line (ADSL) or Symmetric Digital Subscriber Line (SDSL) signaling protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the localized management gateway console of the DSL hardware modem using a standard web browser interface, check line error counts and attenuation metrics, and contact the telecom ISP to check for external copper line damage."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8434707920813216, "y": -0.5337173437460787, "z": 0.06085080024402304, "word": "DSL: Modems", "row_number": 796, "definition": "A peripheral transceiver hardware device that modulates digital signals from a local router into analog frequency waves for transmission over telephone lines, and demodulates incoming analog signals back into digital data.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the power supply block from the back of the modem device for thirty seconds to cycle the unit, verify that the RJ-11 (Registered Jack 11) telephone cable is firmly seated, and call the ISP support center to verify line signal provisioning states."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8216123503498197, "y": -0.5619947016032845, "z": 0.095473038720262, "word": "Microphones", "row_number": 1451, "definition": "An input device that converts sound waves into electrical signals for use in communication, recording, or voice commands.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical connection (3.5mm jack or USB port); in Sound Settings, verify the microphone is set as the default recording device; ensure the privacy settings in the OS allow applications to access the microphone; check the physical mute switch on the microphone or headset."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8263305884988928, "y": -0.561502951249528, "z": 0.043499359180840594, "word": "Networks: Cable modems", "row_number": 1569, "definition": "A hardware peripheral that connects a computer or local network to the ISP (Internet Service Provider) via a coaxial cable line, converting radio frequency signals into digital data.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the modem by unplugging it for 30 seconds, inspect the coaxial cable for damage or loose fittings, and check the status page of the modem (typically by navigating to \u201c192.168.100.1\u201d) to view signal levels."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8428983238926631, "y": -0.5312076797096253, "z": 0.08567856556021128, "word": "Networks: DSL modems", "row_number": 1586, "definition": "A Digital Subscriber Line (DSL) modem uses existing telephone wires to transmit digital data, offering higher speeds than dial-up connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure a DSL filter is installed on all connected telephone handsets, inspect the copper phone lines for interference, and contact the ISP to confirm the signal attenuation (distance from the exchange) is within acceptable limits."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8122133875594487, "y": -0.578204257600661, "z": 0.07739024203136599, "word": "Peripherals: Microphones", "row_number": 1775, "definition": "An input device that converts sound into an electrical signal for recording or voice communication.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the privacy settings in the OS (e.g., \"Allow apps to access your microphone\"), ensure the device is set as the \"Default Input Device\" in the sound settings, and test with a different audio jack or USB port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8411970848026555, "y": -0.5388935582509273, "z": 0.0445106436166472, "word": "RJ11 plugs, UTP cabling", "row_number": 2180, "definition": "A small, clear plastic modular connector piece featuring up to six pin positions but typically utilizing four copper contacts (a 6P4C configuration), crimped onto the ends of thin telephone lines to transmit analog voice or DSL (Digital Subscriber Line) broadband signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the translucent connector clip housing to see if the plastic locking tab has broken off; cut back the degraded wire tip, insert the inner colored conductors cleanly into a new RJ11 plug casing following the standard wiring pattern, secure the plug with a professional crimper tool, and snap it firmly into the wall plate port until you hear an audible click."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8297883379557303, "y": -0.5483742081193559, "z": 0.10361969919921603, "word": "SDSL (Symmetric DSL) connectivity", "row_number": 2245, "definition": "A type of DSL (Digital Subscriber Line) internet service that provides equal bandwidth for both upload and download speeds, unlike standard asymmetric lines.", "details": [{"label": "TROUBLESHOOTING", "value": "Power-cycle the DSL (Digital Subscriber Line) modem, check for faulty phone line filters, and contact the ISP (Internet Service Provider) to verify the line quality."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8160803187864772, "y": -0.5758833873501283, "z": 0.04869535361308547, "word": "Sound cards", "row_number": 2449, "definition": "An internal or external hardware component responsible for converting digital audio signals into analog signals for speakers (Digital-to-Analog Converter, or DAC) and vice-versa for microphones.", "details": [{"label": "TROUBLESHOOTING", "value": "Reseat the sound card in its PCIe (Peripheral Component Interconnect Express) slot, update the device drivers via the manufacturer's website, or test the sound card in a different motherboard slot to rule out a faulty bus port."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
