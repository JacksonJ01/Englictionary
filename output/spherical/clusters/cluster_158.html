<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 158, "radius": 285.0, "nodes": [{"x": 0.49566027723113687, "y": 0.055055069187856416, "z": 0.8667697669692183, "word": "3D printers: Maintenance", "row_number": 4, "definition": "Preventative maintenance tasks required to ensure consistent 3D print quality and component longevity. This includes cleaning the heated print bed, clearing out plastic residue, lubricating the metal X/Y/Z axis rails, checking drive belt tension, and replacing worn extruder nozzles.", "details": [{"label": "TROUBLESHOOTING", "value": "Pre-heat the extruder nozzle to printing temperature and perform a \"cold pull\" or use a specialized acupuncture needle to clear internal filament clogs; apply a thin layer of lithium grease to the guide rails; tighten loose axis drive belts until they are taut."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.49999079095803933, "y": 0.06929202800858693, "z": 0.8632542057885448, "word": "Impact printers: Maintenance", "row_number": 1110, "definition": "Periodic procedures required to keep impact printers functional, including ribbon replacement, paper alignment, and cleaning of the print head and feed path.", "details": [{"label": "TROUBLESHOOTING", "value": "Vacuum out paper dust regularly, keep the carriage rods lightly lubricated, and replace the ribbon cartridge as soon as print quality begins to fade."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.48359280870166227, "y": 0.05840969092636244, "z": 0.8733420311527003, "word": "Inkjet printers: Maintenance", "row_number": 1132, "definition": "The proactive and reactive physical operations required to maintain output quality on an inkjet unit, such as nozzle head cleanings, mechanical alignments, and internal debris removal.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the device settings menu from the operational panel console, run a \u201cprint head alignment\u201d pass, deploy the automated \u201cnozzle clean cycle\u201d script to dissolve dry blockages, and manually replace old cartridges."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.506839927093166, "y": 0.05276404764235609, "z": 0.8604238743669248, "word": "Laser printers", "row_number": 1225, "definition": "An electrophotographic physical output device that utilizes high-precision laser beam optics, static high-voltage charge assemblies, dry powder toner reservoirs, and heated mechanical compression rollers to seal text images onto physical paper print mediums.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the physical print quality defect pattern to isolate damaged core subcomponents, swap out depleted multi-part developer toner cartridges, adjust internal software settings for medium weight properties, and execute routine diagnostic check prints."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4900172994012415, "y": 0.07815272168190289, "z": 0.8682022796452594, "word": "Laser printers: Advantages of", "row_number": 1226, "definition": "The structural performance benefits attributed to electrophotographic print units over fluid-ink printers, consisting of ultra-low per-page operational printing costs, lightning-fast high-speed text page output volume velocities, smudge-free text outputs, and high print resolution detail accuracy.", "details": [{"label": "TROUBLESHOOTING", "value": "Evaluate the operational cost-per-page ratio metrics against inkjet alternatives, ensure high-capacity dual-sided duplexing accessories are provisioned inside the driver property windows, and adjust resolution settings to match production demands."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.48774023930738925, "y": 0.04325955211434061, "z": 0.8719163205900193, "word": "Laser printers: Components of", "row_number": 1227, "definition": "The collective mechanical, optical, and high-voltage electrical hardware pieces that form a laser printer, including the primary EP (Electro-Photographic) drum, laser scanning assembly, primary charge roller, developer roller, transfer roller, fuser unit, and pickup rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Power down the system, wait for safe handling temperatures to avoid internal burns, replace defective transfer arrays, and clean embedded glass laser scanning mirror ports with lint-free swabs to remove structural dust blankets."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5120274645081118, "y": 0.06872124194159104, "z": 0.8562156658782877, "word": "Laser printers: Electrical safety", "row_number": 1228, "definition": "The precautionary handling protocols mandated when performing technical service operations inside a laser printer, focusing on mitigating exposures to high-voltage power components (often converting standard power up to 6,000+ volts DC) and high-temperature thermal fusers.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the AC (Alternating Current) mains cord entirely before exposing inner system blocks, never touch the primary charging wire assemblies with uninsulated tools, and allow the thermal fuser block assembly to cool down completely for at least thirty minutes before mechanical handling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.475846895658804, "y": 0.0693713472034706, "z": 0.8767880861867677, "word": "Laser printers: Maintenance", "row_number": 1229, "definition": "The scheduled proactive routines required to secure optimal electrophotographic text rendering outputs, involving the periodic deployment of systematic manufacturer maintenance kits containing replacements for high-wear pickup rollers, separation pads, and fuser heating assemblies.", "details": [{"label": "TROUBLESHOOTING", "value": "Extract the worn fuser tool module using protective thermal gear, clear away residual stray toner powders utilizing a specialized ESD-safe (Electrostatic Discharge) service vacuum cleaner tool, install replacement friction pickup pads, and execute the internal system reset menu command to update maintenance logging tracking counters."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5048819819654822, "y": 0.038909117974110605, "z": 0.8623110023797003, "word": "Laser printers: Printing process", "row_number": 1230, "definition": "The 7-step electrophotographic imaging process cycle comprised of Processing (parsing raw print data stream), Charging (applying high uniform negative voltage to the EP drum via the primary charge roller), Exposing (writing the latent image with a laser beam to discharge targeted areas), Developing (attracting toner to the exposed areas), Transferring (pulling toner onto the paper via a high positive charge on the transfer roller), Fusing (melting toner into the paper fibers using heat and pressure), and Cleaning (scraping away residual toner and discharging the drum).", "details": [{"label": "TROUBLESHOOTING", "value": "Step through the imaging process to isolate structural failure mechanics; inspect the primary charge roller contacts if fields fail to clear, replace the structural blade cleaning modules if residual toner shadows remain, and check the fuser temperature profile settings if toner does not bond."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.50037201884515, "y": 0.08589247389881798, "z": 0.8615395090675584, "word": "Maintenance: inkjet printers", "row_number": 1390, "definition": "The periodic servicing tasks required for liquid ink print systems, which include running integrated printhead nozzle cleaning routines, aligning ink cartridges, and clearing out old ink from waste pads.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the inkjet utility interface via the connected PC or integrated LCD screen and select the option to execute a \"Nozzle Clean\" or \"Deep Clean\" cycle to flush dried ink clogs out of the microscopic jets. If text alignments look jagged, execute the \"Printhead Alignment\" option and select the best calibration block patterns."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.47485262775591336, "y": 0.04682474161352192, "z": 0.8788187671449278, "word": "Maintenance: laser printers", "row_number": 1391, "definition": "The thorough servicing required for electrophotographic print units, including replacing toner cartridges, cleaning transfer rollers, replacing ozone air filters, and deploying maintenance kits containing new fuser assemblies and pickup rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Unplug the unit and let the fuser assembly cool down completely. If toner rubs off the paper easily, replace the worn-out fuser assembly using a manufacturer-certified maintenance kit. Clean up loose internal toner powder using a specialized electrostatic toner vacuum cleaner rather than a standard vacuum."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5192869126525017, "y": 0.05534995229413047, "z": 0.8528056549583092, "word": "Maintenance: thermal printers", "row_number": 1394, "definition": "Servicing specialized heat-sensitive print systems (commonly used for retail receipts) by cleaning the thermal print heating element, clearing out paper dust from the cutting mechanism, and adjusting spring tension rollers.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the printer access cover and remove the special thermal paper roll. Use a specialized thermal cleaning pen or a lint-free swab dipped in 99% isopropyl alcohol to gently wipe away accumulated paper dust and adhesive residue directly off the narrow thermal printhead line element."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.47868359637100677, "y": 0.08500363994014547, "z": 0.8738629158868371, "word": "Multifunction device/printers: toner cartridges", "row_number": 1530, "definition": "The consumable unit in a laser printer that contains fine, plastic-based powder (toner) and, in some designs, the imaging drum; it is responsible for the actual text and image formation.", "details": [{"label": "TROUBLESHOOTING", "value": "Remove the cartridge and gently rock it side-to-side to redistribute the toner powder. If spilling, clean the printer interior with a specialized vacuum designed for toner (do not use a standard vacuum, as toner particles can pass through the filters and damage the motor) and replace the cartridge."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4926754622956407, "y": 0.03017890465398786, "z": 0.8696896702650104, "word": "Printers/multifunction devices: Laser printers", "row_number": 1935, "definition": "High-volume printers that use a laser beam and an electrostatic process to fuse toner powder onto the paper.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean the corona wire, inspect the drum unit for physical damage, ensure the fuser unit is operating at the correct temperature, and replace the toner cartridge if necessary."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5150463135032327, "y": 0.08209062743214324, "z": 0.8532223765434933, "word": "Thermal printers: Components of", "row_number": 2595, "definition": "The collective electromechanical sub-assemblies inside a thermal printing device, specifically the thermal print head (heating nodes), the rubber platen roller (media advancement), paper feed sensors, and tension spring mechanisms.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the internal printer compartment assembly structure panel, inspect the rubber platen roller element for flat spots or deep pitting distortions, use compressed air to blow paper dust off the tracking sensor eyes, and substitute the print head array block if tracking elements are defective."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.4657870670678081, "y": 0.06169568402133835, "z": 0.882743479571222, "word": "Thermal printers: Maintenance", "row_number": 2596, "definition": "The routine cleaning and operational tuning of a thermal printer to maximize service lifespan, involving residue removal from the print head and platen roller, as well as checking the paper cutting blade.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the main service latch door of the printer assembly, pull loose the spent media wheel casing core, use a specialized electronic cleaning pad saturated with 99% isopropyl alcohol to wipe residue off the print head, spin and clean the rubber platen roller surface area, and carefully trim any structural adhesive debris off the cutter teeth blocks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5168652191521927, "y": 0.03726685925682522, "z": 0.8552552405170563, "word": "Toner cartridges, printers/multifunction devices", "row_number": 2629, "definition": "Consumable containers holding finely powdered plastic and carbon (toner) used in laser printing, which are transferred to paper via an electrostatic charge and fused by heat.", "details": [{"label": "TROUBLESHOOTING", "value": "Gently shake the cartridge horizontally to redistribute remaining toner, inspect the internal drum for physical scratches or debris, and replace the cartridge unit if the print quality does not improve."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
