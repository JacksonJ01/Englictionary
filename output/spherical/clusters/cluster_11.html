<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 11, "radius": 285.0, "nodes": [{"x": -0.26042270999596095, "y": -0.8463421585547929, "z": 0.46463422470925814, "word": "Bus speeds", "row_number": 291, "definition": "The operational data transfer frequency of internal motherboard pathways that connect core components like the CPU with system memory and peripheral slots.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the motherboard configuration interface, verify the system clock multipliers match the factory ratings of installed hardware components, or update motherboard chipset drivers to the latest release."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.24782579641931138, "y": -0.8536140108192778, "z": 0.45817627084143064, "word": "Clock rates", "row_number": 365, "definition": "The frequency (measured in Megahertz [MHz] or Gigahertz [GHz]) at which a processor or component executes internal operations.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the BIOS (Basic Input/Output System) or UEFI (Unified Extensible Firmware Interface) and reset the frequency to factory defaults; ensure adequate cooling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.25376397992414196, "y": -0.8415518444189894, "z": 0.4768588215059638, "word": "Clock rates: Internal clock speeds", "row_number": 366, "definition": "The frequency at which the CPU's (Central Processing Unit) internal components operate, independent of the external system bus.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the CPU multiplier in the BIOS/UEFI to lower the internal clock speed to stable levels."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2657654489635954, "y": -0.8509630048326091, "z": 0.4530239403645631, "word": "Clock rates: Motherboard bus speeds", "row_number": 367, "definition": "The speed at which the motherboard transfers data between the CPU (Central Processing Unit), RAM (Random Access Memory), and other components.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify RAM compatibility with the motherboard bus speed; update BIOS to resolve synchronization issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2364089843694913, "y": -0.8518287196188377, "z": 0.4674383644309878, "word": "CPU (Central Processing Units)", "row_number": 557, "definition": "The primary component of a computer that performs most of the processing inside the computer, acting as the \"brain.\"", "details": [{"label": "TROUBLESHOOTING", "value": "Verify proper seating in the socket, check for bent pins, ensure sufficient cooling is applied, and check BIOS settings to confirm the CPU is correctly detected."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.26960102516205786, "y": -0.8380426748536796, "z": 0.47434139852605844, "word": "CPU (Central Processing Units): Clock rates", "row_number": 563, "definition": "The speed at which a processor executes instructions, measured in GHz.", "details": [{"label": "TROUBLESHOOTING", "value": "Check BIOS for \u201cpower-saving\u201d features that may be downclocking the CPU or for \u201cthermal throttling\u201d caused by insufficient cooling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2517272872185432, "y": -0.8592344777714567, "z": 0.44536444074308973, "word": "CPU (Central Processing Units): Overclocking", "row_number": 572, "definition": "Increasing the CPU's clock rate beyond the manufacturer's rated speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Revert BIOS settings to \u201cLoad Optimized Defaults\u201d to restore factory clock speeds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.24092182767364403, "y": -0.8415811395579935, "z": 0.4834230636726593, "word": "CPU (Central Processing Units): Voltage", "row_number": 577, "definition": "The electrical potential supplied to the CPU for operation.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the motherboard is automatically setting the CPU voltage correctly or adjust manually in BIOS if overclocking."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.27861634247417044, "y": -0.844861647699647, "z": 0.45670748839115133, "word": "Fan settings, BIOS firmware", "row_number": 913, "definition": "BIOS/UEFI settings that control the rotation speed (RPM\u2014Revolutions Per Minute) of internal cooling fans, often based on temperature sensors on the CPU or motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the BIOS/UEFI setup, locate \u201cHardware Monitor\u201d or \u201cFan Control\u201d settings, and adjust the \u201cFan Profile\u201d to \u201cAuto\u201d or \u201cPerformance\u201d mode, ensuring the firmware is updated to the latest version."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.23177858780968144, "y": -0.8596287388539597, "z": 0.4553208951599964, "word": "Internal clock speeds", "row_number": 1151, "definition": "The inner operational frequency metric at which a central processing unit executes internal processing instructions and logic operations, measured in Gigahertz (GHz).", "details": [{"label": "TROUBLESHOOTING", "value": "Check configuration profiles inside system diagnostic apps, check internal airflow channels to remove thermal blocks, replace old thermal compound material, and clear out excessive background app cycles."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2624866585749038, "y": -0.8328541975521101, "z": 0.4872931763220295, "word": "Overclocking", "row_number": 1718, "definition": "The process of increasing the clock rate of a component (like a CPU or GPU) beyond the manufacturer\u2019s rated specifications to improve performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Enter BIOS and reset frequency/voltage to \u201cAuto\u201d or \u201cDefault\u201d; update the BIOS firmware; ensure proper cooling (e.g., improve airflow or upgrade the CPU heatsink)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2666996534597166, "y": -0.8578596456410403, "z": 0.4392586063187558, "word": "Speeds", "row_number": 2452, "definition": "A broad measurement of performance metrics for system components, encompassing data throughput, clock cycles, and communication frequencies between hardware subsystems.", "details": [{"label": "TROUBLESHOOTING", "value": "Check task manager for high I/O (Input/Output) wait times, compare current hardware speeds against the manufacturer's specification sheets, and use benchmarking tools to isolate whether the slowdown is caused by the bus, the CPU, or the storage medium."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2265247007727569, "y": -0.8485276664621245, "z": 0.47821267150521485, "word": "Speeds: Bus speeds", "row_number": 2453, "definition": "The rate at which data is transferred over the computer's internal buses (such as the front-side bus or local buses), which dictates the communication speed between the CPU and other components like RAM (Random Access Memory).", "details": [{"label": "TROUBLESHOOTING", "value": "Enter the BIOS/UEFI (Unified Extensible Firmware Interface) and ensure that the bus speed is set to \u201cAuto\u201d or that it matches the RAM\u2019s rated XMP (Extreme Memory Profile) frequency to ensure optimal, stable synchronization."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2836169503384503, "y": -0.8355561453173085, "z": 0.4705394282131919, "word": "Speeds: Internal clock speeds", "row_number": 2454, "definition": "The frequency at which a processor or component executes internal operations, usually measured in GHz (Gigahertz), representing how many cycles occur per second.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean dust from the heatsink/fan assembly, reapply thermal paste to ensure effective heat dissipation, and use a tool like \u201cCPU-Z\u201d to verify the current frequency is not stuck in a low-power state."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.23955485839171034, "y": -0.8653812184855071, "z": 0.4401463580599827, "word": "Speeds: Motherboard bus speeds", "row_number": 2455, "definition": "The operational frequency of the pathways on the motherboard that connect the CPU, memory, and peripheral expansion slots, determining the maximum throughput for data traveling through the system board.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify motherboard firmware updates, ensure all memory modules are seated in the correct channels to support dual-channel or quad-channel bus configurations, and confirm that all expansion cards are seated in slots that match their rated speed."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
