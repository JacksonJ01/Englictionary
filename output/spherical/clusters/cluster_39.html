<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 39, "radius": 285.0, "nodes": [{"x": -0.8655228830242295, "y": 0.2876006397477777, "z": -0.4100683003818935, "word": "Constructs, scripting: For loops", "row_number": 523, "definition": "A control flow statement for code iteration that allows code to be executed repeatedly based on a boolean condition or a specific sequence.", "details": [{"label": "TROUBLESHOOTING", "value": "Add debugging statements (e.g., \u201cecho\u201d commands) within the loop to track variable values and ensure the loop condition eventually evaluates to false."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8671717238577495, "y": 0.2716427494371835, "z": -0.4174007882357036, "word": "Constructs, scripting: If statements", "row_number": 524, "definition": "A conditional statement that performs different actions depending on whether a programmer-specified boolean condition evaluates to true or false.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the syntax of the conditional expression and use a debugger or print statements to confirm the variables being compared hold the expected values before the statement is evaluated."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.873135614213384, "y": 0.28423970865705156, "z": -0.3960328107805856, "word": "If statements", "row_number": 1100, "definition": "A fundamental programming or scripting construct that executes a specific block of code only if a specified condition is evaluated as \u201cTrue.\u201d", "details": [{"label": "TROUBLESHOOTING", "value": "Use a debugger or add \u201cprint\u201d statements to output the values of variables before they are evaluated by the \u201cif\u201d statement to ensure the logic matches the intended workflow."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8584620788130122, "y": 0.2897281998832612, "z": -0.42320258675065603, "word": "Loops", "row_number": 1345, "definition": "An automated programming and scripting structure that repeats a block of text code instructions continuously as long as a user-defined conditional evaluation parameter remains true.", "details": [{"label": "TROUBLESHOOTING", "value": "Interrupted stuck executing script files by passing the termination hotkey sequence \"Ctrl + C\" into the terminal shell window, open the script text code using code editor utilities, check for the presence of an infinite loop condition, and insert proper exit logic markers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8751567825185327, "y": 0.26208728290309136, "z": -0.4067073421420919, "word": "PowerShell: For loops", "row_number": 1897, "definition": "A control flow statement that allows code to be executed repeatedly based on a defined condition, such as iterating through a list of files or numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the loop termination condition (e.g., \u201c$i -lt 10\u201d) is reachable, and use the \u201cWrite-Host\u201d or \u201cWrite-Output\u201d cmdlets inside the loop to print the variable state for real-time debugging."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8662837883110893, "y": 0.3008674224899794, "z": -0.39878715149014554, "word": "PowerShell: If statements", "row_number": 1899, "definition": "A conditional statement that allows the script to execute specific code blocks only if a certain logical condition evaluates to True.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201c-eq\u201d (equals), \u201c-ne\u201d (not equals), \u201c-gt\u201d (greater than), and \u201c-lt\u201d (less than) operators for comparisons, and verify the logic by using \u201cif-elseif-else\u201d blocks to cover all scenarios."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8600291637718339, "y": 0.271801385549341, "z": -0.4318261736803119, "word": "Programming: For loops", "row_number": 1973, "definition": "A control flow statement that allows code to be executed repeatedly based on a specific condition, typically used to iterate over a range of numbers or a list of items.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the start, stop, and increment logic within the loop structure; insert print statements to debug the loop index value as it progresses through each iteration."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8803824651431281, "y": 0.2722471316390881, "z": -0.38834033319087263, "word": "Programming: If statements", "row_number": 1974, "definition": "A conditional control flow statement that performs different actions depending on whether a boolean constraint evaluates to true or false.", "details": [{"label": "TROUBLESHOOTING", "value": "Validate the logic operators (e.g., \u201c==\u201d, \u201c!=\u201d, \u201c>\u201d) used in the comparison; ensure all necessary conditions are covered (using \u201celse\u201d or \u201celif/else if\u201d blocks)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8552964623088338, "y": 0.30508471097529716, "z": -0.41879742202061476, "word": ".ps1 files: If statements", "row_number": 2018, "definition": "A conditional logic structure ('If', 'ElseIf', 'Else') in PowerShell that executes code blocks only when specific conditions are met.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the '-eq' (equal), '-ne' (not equal), '-gt' (greater than), or '-lt' (less than) operators properly; ensure the variables being compared contain the expected data types."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8713580247090893, "y": 0.2530795533286427, "z": -0.4203402579602017, "word": "Scripting: For loops", "row_number": 2233, "definition": "A programming control structure that repeats a specific block of code a set number of times or for each item in a list (iteration).", "details": [{"label": "TROUBLESHOOTING", "value": "Add \u201cecho\u201d statements inside the loop to monitor the current iteration variable, and verify the loop logic to ensure it has a proper termination condition."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.8742639244272308, "y": 0.2972500321197405, "z": -0.38380334658508464, "word": "Scripting: If statements", "row_number": 2234, "definition": "A conditional control structure that executes a block of code only if a specific condition (a test) evaluates to true.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the condition syntax to ensure operators (e.g., \u201c-eq\u201d for equals, \u201c-gt\u201d for greater than) are correct for the specific shell being used."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
