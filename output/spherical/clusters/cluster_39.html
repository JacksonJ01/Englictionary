hich being accurately determined in length and position serves as the origin from which to compute the distances and positions of any points or objects connected with it by a system of triangles.", "details": []}, {"x": -0.7811515205158899, "y": 0.0388313446227364, "z": -0.6231327536492552, "word": "Bath", "pos_group": "noun", "row_number": 13281, "definition": "A Hebrew measure containing the tenth of a homer or five gallons and three pints as a measure for liquids; and two pecks and five quarts as a dry measure.", "details": []}, {"x": -0.8224676611276382, "y": 0.0817803007497723, "z": -0.5629022373454463, "word": "Bathometer", "pos_group": "noun", "row_number": 13298, "definition": "An instrument for measuring depths esp. one for taking soundings without a sounding line.", "details": []}, {"x": -0.7713887591944886, "y": 0.0993220218353605, "z": -0.6285654446172839, "word": "Bathymetrical", "pos_group": "adjective", "row_number": 13303, "definition": "Pertaining to bathymetry; relating to the measurement of depths especially of depths in the sea.", "details": []}, {"x": -0.8053550928435586, "y": 0.0301214621608685, "z": -0.5920269182632109, "word": "Bathymetry", "pos_group": "noun", "row_number": 13304, "definition": "The art or science of sounding or measuring depths in the sea.", "details": []}, {"x": -0.8064997112559932, "y": 0.114855792388133, "z": -0.5799710016017127, "word": "Battery", "pos_group": "other", "row_number": 13375, "definition": "An apparatus for generating voltaic electricity.", "details": []}, {"x": -0.770591831400011, "y": 0.0591403711862724, "z": -0.6345791092334564, "word": "Battery", "pos_group": "other", "row_number": 13376, "definition": "A number of similar machines or devices in position; an apparatus consisting of a set of similar parts; as a battery of boilers of retorts condensers etc.", "details": []}, {"x": -0.8225507063026002, "y": 0.0562774260130907, "z": -0.5659003329937479, "word": "Bead proof", "pos_group": "other", "row_number": 13569, "definition": "Among distillers a certain degree of strength in alcoholic liquor as formerly ascertained by the floating or sinking of glass globules of different specific gravities thrown into it; now ascertained by more accurate meters.", "details": []}, {"x": -0.7817982568031399, "y": 0.1165964670901004, "z": -0.6125330599418115, "word": "Bell jar", "pos_group": "other", "row_number": 14497, "definition": "A glass vessel varying in size open at the bottom and closed at the top like a bell and having a knob or handle at the top for lifting it. It is used for a great variety of purposes; as with the air pump and for holding gases also for keeping the dust from articles exposed to view.", "details": []}, {"x": -0.7897738753869876, "y": 0.030229815478704, "z": -0.6126527434137078, "word": "Bevel", "pos_group": "noun", "row_number": 15318, "definition": "An instrument consisting of two rules or arms jointed together at one end and opening to any angle for adjusting the surfaces of work to the same or a given inclination; -- called also a bevel square.", "details": []}, {"x": -0.818973067790309, "y": 0.0972975615814214, "z": -0.5655230311352841, "word": "Binocle", "pos_group": "noun", "row_number": 15942, "definition": "A dioptric telescope fitted with two tubes joining so as to enable a person to view an object with both eyes at once; a double-barreled field glass or an opera glass.", "details": []}, {"x": -0.7677253818842501, "y": 0.0849961904124608, "z": -0.635116828328498, "word": "Binocular", "pos_group": "adjective", "row_number": 15945, "definition": "Adapted to the use of both eyes; as a binocular microscope or telescope.", "details": []}, {"x": -0.8141380311569875, "y": 0.035693120875063, "z": -0.579573349409738, "word": "Binocular", "pos_group": "noun", "row_number": 15946, "definition": "A binocular glass whether opera glass telescope or microscope.", "details": []}, {"x": -0.7970296512545934, "y": 0.121013114001102, "z": -0.5916921169499707, "wo ow_number": 21975, "definition": "The process of estimating the caliber a tube as of a thermometer tube in order to graduate it to a scale of degrees; also more generally the determination of the true value of the spaces in any graduated instrument.", "details": []}, {"x": -0.7864588566840127, "y": 0.0270599051826972, "z": -0.6170496157318139, "word": "Caliculate", "pos_group": "adjective", "row_number": 21985, "definition": "Relating to or resembling a cup; also improperly used for calycular calyculate.", "details": []}, {"x": -0.8225869496087272, "y": 0.0958774815870048, "z": -0.560498188095147, "word": "Calipers", "pos_group": "other", "row_number": 22002, "definition": "An instrument usually resembling a pair of dividers or compasses with curved legs for measuring the diameter or thickness of bodies as of work shaped in a lathe or planer timber masts shot etc.; or the bore of firearms tubes etc.; -- called also caliper compasses or caliber compasses.", "details": []}, {"x": -0.7650603726339527, "y": 0.0901881327094764, "z": -0.6376117368301617, "word": "Calorie", "pos_group": "noun", "row_number": 22120, "definition": "The unit of heat according to the French standard; the amount of heat required to raise the temperature of one kilogram (sometimes one gram) of water one degree centigrade or from 0\ufffd to 1\ufffd. Compare the English standard unit Foot pound.", "details": []}, {"x": -0.8137818940895842, "y": 0.0294170428498019, "z": -0.5804254185008971, "word": "Calorimeter", "pos_group": "noun", "row_number": 22127, "definition": "An apparatus for measuring the amount of heat contained in bodies or developed by some mechanical or chemical process as friction chemical combination combustion etc.", "details": []}, {"x": -0.7995516549136558, "y": 0.1249910470173025, "z": -0.5874473502283867, "word": "Calorimetric", "pos_group": "adjective", "row_number": 22129, "definition": "Of or pertaining to the process of using the calorimeter.", "details": []}, {"x": -0.771 asuring or recording intervals of time upon a revolving drum or strip of paper moved by clockwork. The action of the stylus or pen is controlled by electricity.", "details": []}, {"x": -0.8293341391737552, "y": 0.0819054519632159, "z": -0.5527172717942037, "word": "Chronograph", "pos_group": "noun", "row_number": 27063, "definition": "A chronoscope.", "details": []}, {"x": -0.7649112454631816, "y": 0.1073967141014619, "z": -0.635119463065157, "word": "Chronology", "pos_group": "noun", "row_number": 27073, "definition": "The science which treats of measuring time by regular divisions or periods and which assigns to events or transactions their proper dates.", "details": []}, {"x": -0.8063110396784761, "y": 0.017965306110847, "z": -0.591218872389032, "word": "Chronometer", "pos_group": "noun", "row_number": 27074, "definition": "An instrument for measuring time; a timekeeper.", "details": []}, {"x": -0.8098036762442643, "y": 0.1245298920535764, "z": -0.5733326363694982, "word": "Chronometer", "pos_group": "noun", "row_number": 27075, "definition": "A portable timekeeper with a heavy compensation balance and usually beating half seconds; -- intended to keep time with great accuracy for use an astronomical observations in determining longitude etc.", "details": []}, {"x": -0.7630490774951754, "y": 0.0568509920964158, "z": -0.6438354370733371, "word": "Chronometrical", "pos_group": "adjective", "row_number": 27078, "definition": "Pertaining to a chronometer; measured by a chronometer.", "details": []}, {"x": -0.8286167657485504, "y": 0.0498559387898281, "z": -0.5575918228308201, "word": "Chronometry", "pos_group": "noun", "row_number": 27079, "definition": "The art of measuring time; the measuring of time by periods or divisions.", "details": []}, {"x": -0.7786504999164701, "y": 0.1281519168659342, "z": -0.6142316217709881, "word": "Chronopher", "pos_group": "noun", "row_number": 27080, "definition": "An instrument signaling the correct time to distant points by electricity.", "details": []}, {"x": -0.7866309899505518, "y": 0.019469422845901, "z": -0.617116380615085, "word": "Chronoscope", "pos_group": "noun", "row_number": 27081, "definition": "An instrument for measuring minute intervals of time; used in determining the velocity of projectiles the duration of short-lived luminous phenomena etc.", "details": []}, {"x": -0.8249905234854384, "y": 0.1014566165620853, "z": -0.5559650988281513, "word": "Chyometer", "pos_group": "noun", "row_number": 27245, "definition": "An instrument for measuring liquids. It consists of a piston moving in a tube in which is contained the liquid the quantity expelled being indicated by the graduation upon the piston rod.", "details": []}, {"x": -0.7602714506879662, "y": 0.0894264505964458, "z": -0.6434207264321977, "word": "Circle", "pos_group": "noun", "row_number": 27425, "definition": "An instrument of observation the graduated limb of which consists of an entire circle.", "details": []}, {"x": -0.8173738680212856, "y": 0.0248794437476944, "z": -0.5755701287894699, "word": "Circumferential", "pos_group": "adjective", "row_number": 27522, "definition": "Pertaining to the circumference; encompassing; encircling; circuitous.", "details": []}, {"x": -0.7979548525163471, "y": 0.132340257130595, "z": -0.5880085966108173, "word": "Circumferentor", "pos_group": "noun", "row_number": 27524, "definition": "A surveying instrument for taking horizontal angles and bearings; a surveyor's compass. It consists of a compass whose needle plays over a circle graduated to 360\ufffd and of a horizontal brass bar at the ends of which are standards with narrow slits for sighting supported on a tripod by a ball and socket joint.", "details": []}, {"x": -0.7692970235785841, "y": 0.0383500296836157, "z": -0.6377392607770022, "word": "Circumferentor", "pos_group": "noun", "row_number": 27525, "definition": "A graduated wheel for measuring tires; a tire circle.", "details": []}, {"x": -0.8311229884187792, "y": 0.0693434266602 nds moving on a dial plate. Its works are moved by a weight or a spring and it is often so constructed as to tell the hour by the stroke of a hammer on a bell. It is not adapted like the watch to be carried on the person.", "details": []}, {"x": -0.7789800572285059, "y": 0.0237113686570958, "z": -0.6266002245743939, "word": "Coal-meter", "pos_group": "noun", "row_number": 28948, "definition": "A licensed or official coal measurer in London. See Meter.", "details": []}, {"x": -0.829269192478601, "y": 0.0900884325003497, "z": -0.5515402802475257, "word": "Co-assessor", "pos_group": "noun", "row_number": 28973, "definition": "A joint assessor.", "details": []}, {"x": -0.7613784009632344, "y": 0.1019345182586691, "z": -0.6402439258080012, "word": "Cock", "pos_group": "noun", "row_number": 29119, "definition": "The indicator of a balance.", "details": []}, {"x": -0.8111894981083491, "y": 0.0177940598989992, "z": -0.5845125914734733, "word": "Cocket", "pos_group": "noun", "row_number": 29166, "definition": "A measure for bread.", "details": []}, {"x": -0.805723314537504, "y": 0.13022495124652, "z": -0.5777987560418766, "word": "Collationer", "pos_group": "noun", "row_number": 29726, "definition": "One who examines the sheets of a book that has just been printed to ascertain whether they are correctly printed paged etc.", "details": []}, {"x": -0.7637773584300525, "y": 0.0485629758703793, "z": -0.6436503585986916, "word": "Collimation", "pos_group": "noun", "row_number": 29818, "definition": "The act of collimating; the adjustment of the line of the sights as the axial line of the telescope of an instrument into its proper position relative to the other parts of the instrument.", "details": []}, {"x": -0.8312227458709691, "y": 0.0563592670899131, "z": -0.5530753834332298, "word": "Collimator", "pos_group": "noun", "row_number": 29819, "definition": "A telescope arranged and used to determine errors of collimation both vertical and horizontal.", "details": []}, {"x": -0.773 ing offsets.", "details": []}, {"x": -0.8044810894387684, "y": 0.1370153716307705, "z": -0.5779593105680486, "word": "Crotcheted", "pos_group": "adjective", "row_number": 36647, "definition": "Marked or measured by crotchets; having musical notation.", "details": []}, {"x": -0.7614212381311212, "y": 0.0429158799271849, "z": -0.6468353154961052, "word": "Cryophorus", "pos_group": "noun", "row_number": 36994, "definition": "An instrument used to illustrate the freezing of water by its own evaporation. The ordinary form consists of two glass bulbs connected by a tube of the same material and containing only a quantity of water and its vapor devoid of air. The water is in one of the bulbs and freezes when the other is cooled below 32\ufffd Fahr.", "details": []}, {"x": -0.8348658445859027, "y": 0.0578128433203096, "z": -0.5474090761862546, "word": "Crystal", "pos_group": "noun", "row_number": 37028, "definition": "The glass over the dial of a watch case.", "details": []}, {"x": -0.7695599300880102, "y": 0.1302037208086145, "z": -0.6251595836988579, "word": "Crystallometry", "pos_group": "noun", "row_number": 37060, "definition": "The art of measuring crystals.", "details": []}, {"x": -0.7923250720764027, "y": 0.008332919089514, "z": -0.6100422465850794, "word": "Cubit", "pos_group": "noun", "row_number": 37111, "definition": "A measure of length being the distance from the elbow to the extremity of the middle finger.", "details": []}, {"x": -0.8241910705201783, "y": 0.1157219670401386, "z": -0.5543622512573915, "word": "Cubited", "pos_group": "adjective", "row_number": 37115, "definition": "Having the measure of a cubit.", "details": []}, {"x": -0.7542679462794516, "y": 0.0793541200315379, "z": -0.6517536258812824, "word": "Cup", "pos_group": "noun", "row_number": 37394, "definition": "A cupping glass or other vessel or instrument used to produce the vacuum in cupping.", "details": []}, {"x": -0.825561764006701, "y": 0.0253450905713288, "z": -0.5637423171929489, "word":  39985, "definition": "Distinctness or clearness as of an image formed by an optical instrument; precision in detail.", "details": []}, {"x": -0.7746868292858325, "y": 0.0167419751695204, "z": -0.632123423706547, "word": "Degree", "pos_group": "noun", "row_number": 40155, "definition": "A division space or interval marked on a mathematical or other instrument as on a thermometer.", "details": []}, {"x": -0.8346597028554508, "y": 0.090427214065445, "z": -0.5432919099210046, "word": "Delineator", "pos_group": "noun", "row_number": 40424, "definition": "A perambulator which records distances and delineates a profile as of a road.", "details": []}, {"x": -0.7559933225603569, "y": 0.1082217619012663, "z": -0.645571178488583, "word": "Demicircle", "pos_group": "noun", "row_number": 40635, "definition": "An instrument for measuring angles in surveying etc. It resembles a protractor but has an alidade sights and a compass.", "details": []}, {"x": -0.8120072755156341, "y": 0.0080424483496553, "z": -0.5835918981053625, "word": "Dendrometer", "pos_group": "noun", "row_number": 40861, "definition": "An instrument to measure the height and diameter of trees.", "details": []}, {"x": -0.808155749650463, "y": 0.1381449809323435, "z": -0.5725384253917815, "word": "Densimeter", "pos_group": "noun", "row_number": 40938, "definition": "An instrument for ascertaining the specific gravity or density of a substance.", "details": []}, {"x": -0.7576499944416305, "y": 0.0464679629525518, "z": -0.6510047729023477, "word": "Density", "pos_group": "noun", "row_number": 40940, "definition": "The ratio of mass or quantity of matter to bulk or volume esp. as compared with the mass and volume of a portion of some substance used as a standard.", "details": []}, {"x": -0.8360819104863488, "y": 0.0513843851738453, "z": -0.5461928999152248, "word": "Dephlegmator", "pos_group": "noun", "row_number": 41146, "definition": "An instrument or apparatus in which water is separated by evaporation or distillation; the part of a distilling apparatus in which the separation of the vapors is effected.", "details": []}, {"x": -0.7708810532551965, "y": 0.1360598539726783, "z": -0.6222781675979739, "word": "Depth", "pos_group": "noun", "row_number": 41383, "definition": "The quality of being deep; deepness; perpendicular measurement downward from the surface or horizontal measurement backward from the front; as the depth of a river; the depth of a body of troops.", "details": []}, {"x": -0.7884973941247261, "y": 0.0060765739904571, "z": -0.6150080769445674, "word": "Determination", "pos_group": "noun", "row_number": 42069, "definition": "The act process or result of any accurate measurement as of length volume weight intensity etc.; as the determination of the ohm or of the wave length of light; the determination of the salt in sea water or the oxygen in the air.", "details": []}, {"x": -0.827847117282283, "y": 0.1131217112681967, "z": -0.549429366567868, "word": "Determine", "pos_group": "other", "row_number": 42086, "definition": "To ascertain the presence quantity or amount of; as to determine the parallax; to determine the salt in sea water.", "details": []}, {"x": -0.7520492475304499, "y": 0.0853841281375871, "z": -0.6535529664465369, "word": "Diagometer", "pos_group": "noun", "row_number": 42538, "definition": "A sort of electroscope invented by Rousseau in which the dry pile is employed to measure the amount of electricity transmitted by different bodies or to determine their conducting power.", "details": []}, {"x": -0.8245082996496922, "y": 0.0189990020503925, "z": -0.5655308141294008, "word": "Diagraph", "pos_group": "noun", "row_number": 42549, "definition": "A drawing instrument combining a protractor and scale.", "details": []}, {"x": -0.7934915853530706, "y": 0.1448504344586434, "z": -0.5910917488943765, "word": "Diagraphics", "pos_group": "noun", "row_number": 42552, "definition": "The art or science of descriptive drawing; especially the art or science of drawing by mechanical appliances and mathematical rule.", "details": []}, {"x": -0.766615653362172, "y": 0.0255623680828551, "z": -0.6415972298553718, "word": "Dial", "pos_group": "noun", "row_number": 42555, "definition": "An instrument formerly much used for showing the time of day from the shadow of a style or gnomon on a graduated arc or surface; esp. a sundial; but there are lunar and astral dials. The style or gnomon is usually parallel to the earth's axis but the dial plate may be either horizontal or vertical.", "details": []}, {"x": -0.8373895961314815, "y": 0.075521580027681, "z": -0.5413641613931208, "word": "Dial", "pos_group": "other", "row_number": 42562, "definition": "To measure with a dial.", "details": []}, {"x": -0.7598028059464822, "y": 0.121360713333266, "z": -0.6387262898418173, "word": "Dial", "pos_group": "other", "row_number": 42563, "definition": "To survey with a dial.", "details": []}, {"x": -0.803391628350717, "y": 0.0035666716456083, "z": -0.595440316362065, "word": "Dialing", "pos_group": "noun", "row_number": 42576, "definition": "The art of constructing dials; the science which treats of measuring time by dials.", "details": []}, {"x": -0.8168027423226407, "y": 0.1315541722016039, "z": -0.5617177048220611, "word": "Dialing", "pos_group": "noun", "row_number": 42577, "definition": "A method of surveying especially in mines in which the bearings of the courses or the angles which they make with each other are determined by means of the circumferentor.", "details": []}, {"x": -0.7532689933757135, "y": 0.0606634380870546, "z": -0.6549089790941924, "word": "Diameter", "pos_group": "noun", "row_number": 42622, "definition": "The distance through the lower part of the shaft of a column used as a standard measure for all parts of the order. See Module.", "details": []}, {"x": -0.8336258097706043, "y": 0.0370107524819435, "z": -0.5510882084430991, "word": "Diaphanometer", "pos_group": "noun", "row_number": 42678, "definition": "An instrument for measuring the transparency of the air.", "details": []}, {"x": -0.7786468281434045, "y": 0.1430235205118497, "z": -0.6109446698373037, "word": "Diaphemetric", "pos_group": "adjective", "row_number": 42683, "definition": "Relating to the measurement of the tactile sensibility of parts; as diaphemetric compasses.", "details": []}, {"x": -0.7792409373616143, "y": 0.0101844776281713, "z": -0.6266417141838183, "word": "Diaphote", "pos_group": "noun", "row_number": 42691, "definition": "An instrument designed for transmitting pictures by telegraph.", "details": []}, {"x": -0.8334731223654055, "y": 0.1000502166051558, "z": -0.5434266357584282, "word": "Diaphragm", "pos_group": "noun", "row_number": 42695, "definition": "A plate with an opening which is generally circular used in instruments to cut off marginal portions of a beam of light as at the focus of a telescope.", "details": []}, {"x": -0.7527709674112365, "y": 0.1005405260919058, "z": -0.6505593541222153, "word": "Diathermometer", "pos_group": "noun", "row_number": 42741, "definition": "An instrument for examining the thermal resistance or heat-conducting power of liquids.", "details": []}, {"x": -0.8175478605788467, "y": 0.009704976343425, "z": -0.5757788717008676, "word": "Dichroscope", "pos_group": "noun", "row_number": 42824, "definition": "An instrument for examining the dichroism of crystals.", "details": []}, {"x": -0.8027909444160923, "y": 0.1433511590129935, "z": -0.5787721008939096, "word": "Dichroscopic", "pos_group": "adjective", "row_number": 42825, "definition": "Pertaining to the dichroscope or to observations with it.", "details": []}, {"x": -0.7596115897232004, "y": 0.0370714101400641, "z": -0.6493196002804932, "word": "Digit", "pos_group": "noun", "row_number": 43155, "definition": "A finger's breadth commonly estimated to be three fourths of an inch.", "details": []}, {"x": -0.8381525430421035, "y": 0.0600090132044963, "z": -0.5421247392678898, "word": "Digital", "pos_group": "adjective", "row_number": 43159, "definition": "Of or performance to the fingers or to digits; done with the fingers; as digital compression; digital examination.", "details": []}, {"x": -0.7654457664168617, "y": 0.1327000010672644, "z": -0.6296693484609611, "word": "Dilatometer", "pos_group": "noun", "row_number": 43279, "definition": "An instrument for measuring the dilatation or expansion of a substance especially of a fluid.", "details": []}, {"x": -0.7940417679405684, "y": 0.0023557096724268, "z": -0.6078586360312371, "word": "Dimension", "pos_group": "noun", "row_number": 43350, "definition": "Measure in a single line as length breadth height thickness or circumference; extension; measurement; -- usually in the plural measure in length and breadth or in length breadth and thickness; extent; size; as the dimensions of a room", "details": []}, {"x": -0.8246953775582309, "y": 0.1219486964118636, "z": -0.5522735279528925, "word": "Dimension", "pos_group": "noun", "row_number": 43354, "definition": "The manifoldness with which the fundamental units of time length and mass are involved in determining the units of other physical quantities.", "details": []}, {"x": -0.7507375772229926, "y": 0.0760355138879456, "z": -0.6562100965187501, "word": "Dimeter", "pos_group": "adjective", "row_number": 43364, "definition": "Having two poetical measures or meters.", "details": []}, {"x": -0.8291960365697525, "y": 0.0239227423480699, "z": -0.5584457317730718, "word": "Dioptra", "pos_group": "noun", "row_number": 43528, "definition": "An optical instrument invented by Hipparchus for taking altitudes leveling etc.", "details": []}, {"x": -0.7874715806217633, "y": 0.1469100326736679, "z": -0.5985866286619538, "word": "Dioptre", "pos_group": "noun", "row_number": 43529, "definition": "A unit employed by oculists in numbering glasses according to the metric system; a refractive power equal to that of a glass whose principal focal distance is one meter.", "details": []}, {"x": -0.7704001314933931, "y": 0. e and examine minutely.", "details": []}, {"x": -0.8368389215687673, "y": 0.0446379855329582, "z": -0.5456263094785494, "word": "Diurnal", "pos_group": "adjective", "row_number": 46048, "definition": "A small volume containing the daily service for the \"\"\"\"little hours \" viz. prime tierce sext nones vespers and compline.", "details": []}, {"x": -0.7727019795590395, "y": 0.1416145258414034, "z": -0.6187705365127338, "word": "Divider", "pos_group": "noun", "row_number": 46199, "definition": "An instrument for dividing lines describing circles etc. compasses. See Compasses.", "details": []}, {"x": -0.7843925196126533, "y": 0.0045818118074375, "z": -0.6202478393160867, "word": "Docimacy", "pos_group": "noun", "row_number": 46369, "definition": "The art or practice of applying tests to ascertain the nature quality etc. of objects as of metals or ores of medicines or of facts pertaining to physiology.", "details": []}, {"x": -0.8314127472462182, "y": 0.1097008724257418, "z": -0.544718791951891, "word": "Docimastic", "pos_group": "adjective", "row_number": 46370, "definition": "Proving by experiments or tests.", "details": []}, {"x": -0.7502410425598607, "y": 0.0918621707617182, "z": -0.6547516472996753, "word": "Docimology", "pos_group": "noun", "row_number": 46371, "definition": "A treatise on the art of testing as in assaying metals etc.", "details": []}, {"x": -0.8229410094254087, "y": 0.0128126142639357, "z": -0.5679823341633197, "word": "Dot", "pos_group": "noun", "row_number": 46973, "definition": "A small point or spot made with a pen or other pointed instrument; a speck or small mark.", "details": []}, {"x": -0.7969506000876022, "y": 0.1474215159744105, "z": -0.58577865926288, "word": "Doubler", "pos_group": "noun", "row_number": 47083, "definition": "An instrument for augmenting a very small quantity of electricity so as to render it manifest by sparks or the electroscope.", "details": []}, {"x": -0.7624234168512479, "y": 0.0279051988683597, "z": -0.6464764754521122, "word": "Doublet", "pos_group": "adjective", "row_number": 47090, "definition": "An arrangement of two lenses for a microscope designed to correct spherical aberration and chromatic dispersion thus rendering the image of an object more clear and distinct.", "details": []}, {"x": -0.8394438065311267, "y": 0.0694309981931808, "z": -0.5389929797005066, "word": "Draught", "pos_group": "adjective", "row_number": 47568, "definition": "Relating to or characterized by a draft or current of air.", "details": []}, {"x": -0.7603102752577038, "y": 0.1279317527888817, "z": -0.6368373041569715, "word": "Draught", "pos_group": "adjective", "row_number": 47569, "definition": "Used in making drawings; as draught compasses.", "details": []}, {"x": -0.7999240831536925, "y": -8.348546909045923e-05, "z": -0.6001012033156582, "word": "Drift", "pos_group": "other", "row_number": 47875, "definition": "to make a drift; to examine a vein or ledge for the purpose of ascertaining the presence of metals or ores; to follow a vein; to prospect.", "details": []}, {"x": -0.8207444181795227, "y": 0.1302932058274937, "z": -0.5562394093754514, "word": "Droplight", "pos_group": "noun", "row_number": 48113, "definition": "An apparatus for bringing artificial light down from a chandelier nearer to a table or desk; a pendant.", "details": []}, {"x": -0.7502680878186108, "y": 0.0661159034026464, "z": -0.6578194917439413, "word": "Drosometer", "pos_group": "noun", "row_number": 48136, "definition": "An instrument for measuring the quantity of dew on the surface of a body in the open air. It consists of a balance having a plate at one end to receive the dew and at the other a weight protected from the deposit of dew.", "details": []}, {"x": -0.8334404924656313, "y": 0.0301730840775395, "z": -0.5517848589041707, "word": "Ductilimeter", "pos_group": "noun", "row_number": 48425, "definition": "An instrument for accurately determining the ductility of metals.", "details": []}, {"x": -0.7812630117286969 .", "details": []}, {"x": -0.8460596569108138, "y": 0.051460397653869, "z": -0.5305986095168945, "word": "Graduate", "pos_group": "noun", "row_number": 67472, "definition": "A graduated cup tube or flask; a measuring glass used by apothecaries and chemists. See under Graduated.", "details": []}, {"x": -0.7607779901339641, "y": 0.1482368680046437, "z": -0.631856534896886, "word": "Graduation", "pos_group": "noun", "row_number": 67478, "definition": "The marks on an instrument or vessel to indicate degrees or quantity; a scale.", "details": []}, {"x": -0.7895664494319087, "y": -0.0123125515470329, "z": -0.6135415413856597, "word": "Graduator", "pos_group": "noun", "row_number": 67480, "definition": "One who determines or indicates graduation; as a graduator of instruments.", "details": []}, {"x": -0.8324887624455101, "y": 0.1277161781188084, "z": -0.539120615677668, "word": "Graduator", "pos_group": "noun", "row_number": 67481, "definition": "An instrument for dividing any line right or curve into small regular intervals.", "details": []}, {"x": -0.7402730514722539, "y": 0.0818614050756095, "z": -0.6673039184831788, "word": "Grain", "pos_group": "noun", "row_number": 67517, "definition": "The unit of the English system of weights; -- so called because considered equal to the average of grains taken from the middle of the ears of wheat. 7 000 grains constitute the pound avoirdupois and 5 760 grains the pound troy. A grain is equal to .0648 gram. See Gram.", "details": []}, {"x": -0.8333702154041517, "y": 0.0092638114306465, "z": -0.5526375538044941, "word": "Gramme", "pos_group": "noun", "row_number": 67572, "definition": "The unit of weight in the metric system. It was intended to be exactly and is very nearly equivalent to the weight in a vacuum of one cubic centimeter of pure water at its maximum density. It is equal to 15.432 grains. See Grain n. 4.", "details": []}, {"x": -0.7883149825184786, "y": 0.1623572408171073, "z": -0.5934640803714635, "word": "Gramme machi tails": []}, {"x": -0.8043884561376581, "y": 0.1618908399391952, "z": -0.5716209999433689, "word": "Hektometer", "pos_group": "noun", "row_number": 71390, "definition": "Same as Hectare Hectogram Hectoliter and Hectometer.", "details": []}, {"x": -0.7483096328053576, "y": 0.0276967443836908, "z": -0.6627711398373165, "word": "Helicograph", "pos_group": "noun", "row_number": 71410, "definition": "An instrument for drawing spiral lines on a plane.", "details": []}, {"x": -0.8486847895613354, "y": 0.0548953708128494, "z": -0.526042418660845, "word": "Heliograph", "pos_group": "noun", "row_number": 71427, "definition": "An instrument for taking photographs of the sun.", "details": []}, {"x": -0.7566878338185132, "y": 0.1491643636169074, "z": -0.6365324145538931, "word": "Heliographic", "pos_group": "adjective", "row_number": 71429, "definition": "Of or pertaining to heliography or a heliograph; made by heliography.", "details": []}, {"x": -0.7919111901271283, "y": -0.0172166322408172, "z": -0.6103935243150274, "word": "Heliometer", "pos_group": "noun", "row_number": 71435, "definition": "An instrument devised originally for measuring the diameter of the sun; now employed for delicate measurements of the distance and relative direction of two stars too far apart to be easily measured in the field of view of an ordinary telescope.", "details": []}, {"x": -0.8320516892058013, "y": 0.1339272367470504, "z": -0.5382875455990713, "word": "Heliometrical", "pos_group": "adjective", "row_number": 71437, "definition": "Of or pertaining to the heliometer or to heliometry.", "details": []}, {"x": -0.7375063090606201, "y": 0.0774988200297223, "z": -0.6708788094654518, "word": "Heliometry", "pos_group": "noun", "row_number": 71438, "definition": "The apart or practice of measuring the diameters of heavenly bodies their relative distances etc. See Heliometer.", "details": []}, {"x": -0.8368242163204019, "y": 0.0093914278389754, "z": -0.5473911143441136, "word": "Helioscope", "pos_group ce", "pos_group": "noun", "row_number": 86611, "definition": "An instrument which conveys the charge of a piece of ordnance and forces it home.", "details": []}, {"x": -0.8535263411790924, "y": 0.0766042869569091, "z": -0.5153877842297534, "word": "Larungoscope", "pos_group": "noun", "row_number": 87052, "definition": "An instrument consisting of an arrangement of two mirrors for reflecting light upon the larynx and for examining its image.", "details": []}, {"x": -0.7425156596406762, "y": 0.1407171805190689, "z": -0.6548810352232954, "word": "Latitude", "pos_group": "noun", "row_number": 87253, "definition": "Extent; size; amplitude; scope.", "details": []}, {"x": -0.8054489012242575, "y": -0.0267156077515983, "z": -0.5920627870581794, "word": "Lay", "pos_group": "other", "row_number": 87530, "definition": "A measure of yarn; a lea. See 1st Lea (a).", "details": []}, {"x": -0.8237170772843275, "y": 0.1561687618799054, "z": -0.5450701738336657, "word": "League", "pos_group": "noun", "row_number": 87664, "definition": "A measure of length or distance varying in different countries from about 2.4 to 4.6 English statute miles of 5.280 feet each and used (as a land measure) chiefly on the continent of Europe and in the Spanish parts of America. The marine league of England and the United States is equal to three marine or geographical miles of 6080 feet each.", "details": []}, {"x": -0.7337212181843635, "y": 0.0539371155655986, "z": -0.677306401527785, "word": "Lenticula", "pos_group": "noun", "row_number": 88201, "definition": "A lens of small size.", "details": []}, {"x": -0.8482183723016853, "y": 0.0216716710475983, "z": -0.5292031099340633, "word": "Leucoscope", "pos_group": "noun", "row_number": 88446, "definition": "An instrument devised by Professor Helmholtz for testing the color perception of the eye or for comparing different lights as to their constituent colors or their relative whiteness.", "details": []}, {"x": -0.7693491583058755, "y": 0.1716532000563416, ope to throw down light on opaque objects; a reflector.", "details": []}, {"x": -0.8541870884702037, "y": 0.0546228532256137, "z": -0.5170887368685274, "word": "Limb", "pos_group": "noun", "row_number": 89231, "definition": "The graduated margin of an arc or circle in an instrument for measuring angles.", "details": []}, {"x": -0.7508998412999236, "y": 0.1562756370585807, "z": -0.6416598425939433, "word": "Line", "pos_group": "noun", "row_number": 89406, "definition": "A long tape or a narrow ribbon of steel etc. marked with subdivisions as feet and inches for measuring; a tapeline.", "details": []}, {"x": -0.7921638555448284, "y": -0.0276872045720373, "z": -0.6096801166770478, "word": "Line", "pos_group": "noun", "row_number": 89407, "definition": "A measuring line or cord.", "details": []}, {"x": -0.8346743891119844, "y": 0.1419998958813993, "z": -0.5321228182762016, "word": "Line", "pos_group": "noun", "row_number": 89422, "definition": "A measure of length; one twelfth of an inch.", "details": []}, {"x": -0.7306034562872907, "y": 0.0757946576511108, "z": -0.6785821685931748, "word": "Lineman", "pos_group": "noun", "row_number": 89447, "definition": "One who carries the line in surveying etc.", "details": []}, {"x": -0.8415959131965242, "y": 0.0035819258368938, "z": -0.5400958143683467, "word": "Lineman", "pos_group": "noun", "row_number": 89448, "definition": "A man employed to examine the rails of a railroad to see if they are in good condition; also a man employed to repair telegraph lines.", "details": []}, {"x": -0.7819920566618948, "y": 0.1764372084955917, "z": -0.5977945590050003, "word": "Litre", "pos_group": "noun", "row_number": 89759, "definition": "A measure of capacity in the metric system being a cubic decimeter equal to 61.022 cubic inches or 2.113 American pints or 1.76 English pints.", "details": []}, {"x": -0.7587922494584572, "y": -0.0063404938233414, "z": -0.6513018657272915, "word": "Litraneter", "pos_group": "noun", "row_number": 89919, "definition": "An instrument for ascertaining the specific gravity of liquids.", "details": []}, {"x": -0.8526909830099921, "y": 0.0903015243102788, "z": -0.5145519625856007, "word": "Little", "pos_group": "noun", "row_number": 89942, "definition": "A small degree or scale; miniature.", "details": []}, {"x": -0.7373352302243271, "y": 0.1307018972743888, "z": -0.6627622290979724, "word": "Load", "pos_group": "verb", "row_number": 90092, "definition": "A particular measure for certain articles being as much as may be carried at one time by the conveyance commonly used for the article measured; as a load of wood; a load of hay; specifically five quarters.", "details": []}, {"x": -0.8135250066699701, "y": -0.025687205443941, "z": -0.5809623318246252, "word": "Longimetry", "pos_group": "noun", "row_number": 90573, "definition": "The art or practice of measuring distances or lengths.", "details": []}, {"x": -0.8165788339627422, "y": 0.1646412618207463, "z": -0.5532560553939928, "word": "Longitude", "pos_group": "noun", "row_number": 90587, "definition": "Length; measure or distance along the longest line; -- distinguished from breadth or thickness; as the longitude of a room; rare now except in a humorous sense.", "details": []}, {"x": -0.7357638213691664, "y": 0.0403650493652848, "z": -0.6760342165556263, "word": "Lucimeter", "pos_group": "noun", "row_number": 91210, "definition": "an instrument for measuring the intensity of light; a photometer.", "details": []}, {"x": -0.8519452023482836, "y": 0.0331809519443865, "z": -0.5225786032969648, "word": "Lug", "pos_group": "noun", "row_number": 91271, "definition": "A measure of length being 16/ feet; a rod pole or perch.", "details": []}, {"x": -0.7613975875962136, "y": 0.1682185712115971, "z": -0.6260800475196403, "word": "Lysimeter", "pos_group": "noun", "row_number": 91717, "definition": "An instrument for measuring the water that percolates through a certain depth of soil.", "details": []}, {"x": -0.7786666030173203, "y": -0 ometric instruments; magnetometric measurements.", "details": []}, {"x": -0.7443779882101854, "y": 0.1484237475146369, "z": -0.6510543770238155, "word": "Magnetomotor", "pos_group": "noun", "row_number": 92150, "definition": "A voltaic series of two or more large plates producing a great quantity of electricity of low tension and hence adapted to the exhibition of electro-magnetic phenomena.", "details": []}, {"x": -0.8004291159844149, "y": -0.0296138516936737, "z": -0.598695456866238, "word": "Magnifiable", "pos_group": "adjective", "row_number": 92152, "definition": "Such as can be magnified or extolled.", "details": []}, {"x": -0.8286002959783171, "y": 0.1526672961924942, "z": -0.5386225451816128, "word": "Magnify", "pos_group": "other", "row_number": 92168, "definition": "To make great or greater; to increase the dimensions of; to amplify; to enlarge either in fact or in appearance; as the microscope magnifies the object by a thousand diameters.", "details": []}, {"x": -0.730886263471117, "y": 0.0619422639437423, "z": -0.6796825919550631, "word": "Magnify", "pos_group": "other", "row_number": 92172, "definition": "To have the power of causing objects to appear larger than they really are; to increase the apparent dimensions of objects; as some lenses magnify but little.", "details": []}, {"x": -0.8468544514344781, "y": 0.0133071334402612, "z": -0.5316582156660538, "word": "Magnitude", "pos_group": "noun", "row_number": 92177, "definition": "Extent of dimensions; size; -- applied to things that have length breath and thickness.", "details": []}, {"x": -0.7735421813470158, "y": 0.1759162655798361, "z": -0.6088398485491443, "word": "Make", "pos_group": "other", "row_number": 92414, "definition": "To find as the result of calculation or computation; to ascertain by enumeration; to find the number or amount of by reckoning weighing measurement and the like; as he made the distance of; to travel over; as the ship makes ten knots an hour; he made the distance in one day.", "details": []}, {"x": -0.7655919266980867, "y": -0.0153471408377751, "z": -0.6431434264942905, "word": "Mammetry", "pos_group": "noun", "row_number": 92736, "definition": "See Mawmetry.", "details": []}, {"x": -0.8507103929751528, "y": 0.1040776337450428, "z": -0.5152277879133595, "word": "Manner", "pos_group": "noun", "row_number": 93068, "definition": "Certain degree or measure; as it is in a manner done already.", "details": []}, {"x": -0.7330441484230305, "y": 0.119350551321292, "z": -0.6696280477713411, "word": "Manometer", "pos_group": "noun", "row_number": 93092, "definition": "An instrument for measuring the tension or elastic force of gases steam etc. constructed usually on the principle of allowing the gas to exert its elastic force in raising a column of mercury in an open tube or in compressing a portion of air or other gas in a closed tube with mercury or other liquid intervening or in bending a metallic or other spring so as to set in motion an index; a pressure gauge. See Pressure and Illust. of Air pump.", "details": []}, {"x": -0.8214352258772392, "y": -0.0227658176307909, "z": -0.569847249037504, "word": "Manometrical", "pos_group": "adjective", "row_number": 93094, "definition": "Of or pertaining to the manometer; made by the manometer.", "details": []}, {"x": -0.8087952380898271, "y": 0.1716574679720234, "z": -0.5624802010139145, "word": "Manoscope", "pos_group": "noun", "row_number": 93098, "definition": "Same as Manometer.", "details": []}, {"x": -0.738925171523151, "y": 0.0270472241512116, "z": -0.673244412197529, "word": "Manoscopy", "pos_group": "noun", "row_number": 93099, "definition": "The science of the determination of the density of vapors and gases.", "details": []}, {"x": -0.8546671195585215, "y": 0.0457729705329967, "z": -0.5171546673038206, "word": "Mask", "pos_group": "noun", "row_number": 93752, "definition": "A screen for a battery.", "details": []}, {"x": -0.7538093414283402, "y": 0.1629313925770943, "z": -0.63657272804312 row_number": 94426, "definition": "The dimensions or capacity of anything reckoned according to some standard; size or extent determined and stated; estimated extent; as to take one's measure for a coat.", "details": []}, {"x": -0.8549514122400087, "y": 0.0820231623815468, "z": -0.512181885214369, "word": "Measure", "pos_group": "noun", "row_number": 94427, "definition": "The contents of a vessel by which quantity is measured; a quantity determined by a standard; a stated or limited quantity or amount.", "details": []}, {"x": -0.7385771674135837, "y": 0.1389702507555044, "z": -0.6596901069292151, "word": "Measure", "pos_group": "noun", "row_number": 94430, "definition": "The quantity determined by measuring especially in buying and selling; as to give good or full measure.", "details": []}, {"x": -0.8087732330074178, "y": -0.0296578964835225, "z": -0.5873723408085383, "word": "Measure", "pos_group": "adjective", "row_number": 94439, "definition": "The act of measuring; measurement.", "details": []}, {"x": -0.8216881486500299, "y": 0.1621595935236722, "z": -0.5463815997966293, "word": "Measure", "pos_group": "adjective", "row_number": 94440, "definition": "Beds or strata; as coal measures; lead measures.", "details": []}, {"x": -0.732327190453384, "y": 0.0479394924294219, "z": -0.6792633445051062, "word": "Measure", "pos_group": "noun", "row_number": 94443, "definition": "To ascertain by use of a measuring instrument; to compute or ascertain the extent quantity dimensions or capacity of by a certain rule or standard; to take the dimensions of; hence to estimate; to judge of; to value; to appraise.", "details": []}, {"x": -0.8512429002414201, "y": 0.0244307315301269, "z": -0.5242028845260951, "word": "Measure", "pos_group": "noun", "row_number": 94444, "definition": "To serve as the measure of; as the thermometer measures changes of temperature.", "details": []}, {"x": -0.765217222355911, "y": 0.1734820035210008, "z": -0.6199569316204504, "word": "Measure", "pos_group": "other", "row_number": 94448, "definition": "To make a measurement or measurements.", "details": []}, {"x": -0.7730784903181868, "y": -0.0229298755803525, "z": -0.6338957868713302, "word": "Measure", "pos_group": "other", "row_number": 94449, "definition": "To result or turn out on measuring; as the grain measures well; the pieces measure unequally.", "details": []}, {"x": -0.847591152251553, "y": 0.117667688491454, "z": -0.5174394203285664, "word": "Measure", "pos_group": "other", "row_number": 94450, "definition": "To be of a certain size or quantity or to have a certain length breadth or thickness or a certain capacity according to a standard measure; as cloth measures three fourths of a yard; a tree measures three feet in diameter.", "details": []}, {"x": -0.7297461145303235, "y": 0.1068483040718508, "z": -0.6753177387310846, "word": "Measureless", "pos_group": "adjective", "row_number": 94452, "definition": "Without measure; unlimited; immeasurable.", "details": []}, {"x": -0.8290199232334398, "y": -0.0179595421481497, "z": -0.5589306054671281, "word": "Measurement", "pos_group": "noun", "row_number": 94453, "definition": "The act or result of measuring; mensuration; as measurement is required.", "details": []}, {"x": -0.8004980927674462, "y": 0.1770439959587682, "z": -0.5725890559298464, "word": "Measuring", "pos_group": "adjective", "row_number": 94456, "definition": "Used in or adapted for ascertaining measurements or dividing by measure.", "details": []}, {"x": -0.7431705304609694, "y": 0.0142476376493232, "z": -0.668950347541411, "word": "Mechanical", "pos_group": "adjective", "row_number": 94491, "definition": "Obtained by trial by measurements etc.; approximate; empirical. See the 2d Note under Geometric.", "details": []}, {"x": -0.8563034656576967, "y": 0.0592316490062296, "z": -0.5130652847919269, "word": "Mechanographic", "pos_group": "adjective", "row_number": 94509, "definition": "Written copied or recorded by machinery; produced by mechanography efinition": "The millionth part of a meter.", "details": []}, {"x": -0.7617348017388607, "y": -0.0185001917490545, "z": -0.647624763829416, "word": "Micron", "pos_group": "noun", "row_number": 96124, "definition": "A measure of length; the thousandth part of one millimeter; the millionth part of a meter.", "details": []}, {"x": -0.8541973340176748, "y": 0.1023450435650718, "z": -0.509776820397672, "word": "Micronometer", "pos_group": "noun", "row_number": 96127, "definition": "An instrument for noting minute portions of time.", "details": []}, {"x": -0.7300446849186624, "y": 0.1248942573409677, "z": -0.6718900077432759, "word": "Micropantograph", "pos_group": "noun", "row_number": 96129, "definition": "A kind of pantograph which produces copies microscopically minute.", "details": []}, {"x": -0.8206543546008385, "y": -0.0293636697509702, "z": -0.5706699616883977, "word": "Microphotograph", "pos_group": "noun", "row_number": 96135, "definition": "An enlarged representation of a microscopic object produced by throwing upon a sensitive plate the magnified image of an object formed by a microscope or other suitable combination of lenses.", "details": []}, {"x": -0.8112275634142524, "y": 0.1756790633447184, "z": -0.5577156148605644, "word": "Microphotography", "pos_group": "noun", "row_number": 96136, "definition": "The art of making microphotographs.", "details": []}, {"x": -0.7344054982972028, "y": 0.0275545278679085, "z": -0.6781513931747202, "word": "Microscopal", "pos_group": "adjective", "row_number": 96144, "definition": "Pertaining to microscopy or to the use of the microscope.", "details": []}, {"x": -0.8571804276768665, "y": 0.0408458975114741, "z": -0.5133939297110808, "word": "Microscope", "pos_group": "noun", "row_number": 96145, "definition": "An optical instrument consisting of a lens or combination of lenses for making an enlarged image of an object which is too minute to be viewed by the naked eye.", "details": []}, {"x": -0.7529068990254894, "y": 0.1695 e pelvis.", "details": []}, {"x": -0.8601513983037263, "y": 0.0910814243758527, "z": -0.5018403592077967, "word": "Pentapody", "pos_group": "noun", "row_number": 111674, "definition": "A measure or series consisting of five feet.", "details": []}, {"x": -0.728638526631063, "y": 0.1397761525298346, "z": -0.6704837989786702, "word": "Perambulator", "pos_group": "noun", "row_number": 111824, "definition": "A surveyor's instrument for measuring distances. It consists of a wheel arranged to roll along over the ground with an apparatus of clockwork and a dial plate upon which the distance traveled is shown by an index. See Odometer.", "details": []}, {"x": -0.8144028789952498, "y": -0.0402586733112753, "z": -0.5789017100574712, "word": "Perch", "pos_group": "noun", "row_number": 111864, "definition": "A measure of length containing five and a half yards; a rod or pole.", "details": []}, {"x": -0.819484598368898, "y": 0.1766325660842978, "z": -0.5452026500620131, "word": "Perch", "pos_group": "noun", "row_number": 111865, "definition": "In land or square measure: A square rod; the 160th part of an acre.", "details": []}, {"x": -0.7261177871108766, "y": 0.0368279829606053, "z": -0.686583322628985, "word": "Perch", "pos_group": "noun", "row_number": 111866, "definition": "In solid measure: A mass 16/ feet long 1 foot in height and 1/ feet in breadth or 24/ cubic feet (in local use from 22 to 25 cubic feet); -- used in measuring stonework.", "details": []}, {"x": -0.8587717120254054, "y": 0.0259969130201226, "z": -0.5116984533281087, "word": "Perimeter", "pos_group": "noun", "row_number": 112147, "definition": "An instrument for determining the extent and shape of the field of vision.", "details": []}, {"x": -0.7564851818306594, "y": 0.1819193707365828, "z": -0.6282002166677754, "word": "Perimetry", "pos_group": "noun", "row_number": 112150, "definition": "The art of using the perimeter; measurement of the field of vision.", "details": []}, {"x": -0.7746010449014598, "y": -0. d": "Phantascope", "pos_group": "noun", "row_number": 113074, "definition": "An optical instrument or toy resembling the phenakistoscope and illustrating the same principle; -- called also phantasmascope.", "details": []}, {"x": -0.7993990465273418, "y": -0.0442022495560782, "z": -0.5991722002441028, "word": "Phantasmagoria", "pos_group": "noun", "row_number": 113078, "definition": "An optical effect produced by a magic lantern. The figures are painted in transparent colors and all the rest of the glass is opaque black. The screen is between the spectators and the instrument and the figures are often made to appear as in motion or to merge into one another.", "details": []}, {"x": -0.8330470796621958, "y": 0.1625337356230636, "z": -0.528786675182629, "word": "Pharology", "pos_group": "noun", "row_number": 113130, "definition": "The art or science which treats of lighthouses and signal lights.", "details": []}, {"x": -0.7208760323405483, "y": 0.061553822436687, "z": -0.6903251936155752, "word": "Phial", "pos_group": "noun", "row_number": 113211, "definition": "A glass vessel or bottle especially a small bottle for medicines; a vial.", "details": []}, {"x": -0.8526797140714929, "y": 0.0036051869885038, "z": -0.5224215805628011, "word": "Phlebogram", "pos_group": "noun", "row_number": 113334, "definition": "A tracing (with the sphygmograph) of the movements of a vein or of the venous pulse.", "details": []}, {"x": -0.7704704008132259, "y": 0.1901830897287637, "z": -0.6084453581480654, "word": "Phonautograph", "pos_group": "noun", "row_number": 113407, "definition": "An instrument by means of which a sound can be made to produce a visible trace or record of itself. It consists essentially of a resonant vessel usually of paraboloidal form closed at one end by a flexible membrane. A stylus attached to some point of the membrane records the movements of the latter as it vibrates upon a moving cylinder or plate.", "details": []}, {"x": -0.759814979403098, "y": -0.0271013943218533, "z": -0.6495742540314242, "word": "Phoneidoscope", "pos_group": "noun", "row_number": 113408, "definition": "An instrument for studying the motions of sounding bodies by optical means. It consists of a tube across the end of which is stretched a film of soap solution thin enough to give colored bands the form and position of which are affected by sonorous vibrations.", "details": []}, {"x": -0.8578070625910543, "y": 0.1067306810542739, "z": -0.5027679435789415, "word": "Phonometer", "pos_group": "noun", "row_number": 113445, "definition": "An instrument for measuring sounds as to their intensity or the frequency of the vibrations.", "details": []}, {"x": -0.7238705156778819, "y": 0.1267620329780796, "z": -0.6781908754381037, "word": "Phonoscope", "pos_group": "noun", "row_number": 113448, "definition": "An instrument for observing or exhibiting the motions or properties of sounding bodies; especially an apparatus invented by Konig for testing the quality of musical strings.", "details": []}, {"x": -0.82338118645323, "y": -0.0367578014386726, "z": -0.566296994366266, "word": "Phonoscope", "pos_group": "noun", "row_number": 113449, "definition": "An instrument for producing luminous figures by the vibrations of sounding bodies.", "details": []}, {"x": -0.8106054315072084, "y": 0.1844558495825032, "z": -0.5557831177409128, "word": "Phosphoroscope", "pos_group": "noun", "row_number": 113496, "definition": "An apparatus for observing the phosphorescence produced in different bodies by the action of light and for measuring its duration.", "details": []}, {"x": -0.7298287033068586, "y": 0.0217422464203536, "z": -0.6832842296950997, "word": "Photo-", "pos_group": "other", "row_number": 113509, "definition": "A combining form from Gr. fw^s fwto`s light; as photography phototype photometer.", "details": []}, {"x": -0.8617800559425286, "y": 0.0403881576494324, "z": -0.505671763005783, "word": "Photo-electric", "pos_group": "adjective", "row_number": 113517, "definition": "Acting by the operation of both light and electricity; -- said of apparatus for producing pictures by electric light.", "details": []}, {"x": -0.7479279207297844, "y": 0.1757468930481195, "z": -0.6400912864402657, "word": "Photo-engraving", "pos_group": "noun", "row_number": 113519, "definition": "The process of obtaining an etched or engraved plate from the photographic image to be used in printing; also a picture produced by such a process.", "details": []}, {"x": -0.7838127466809302, "y": -0.0426343880284827, "z": -0.6195319903749383, "word": "Photographometer", "pos_group": "noun", "row_number": 113540, "definition": "An instrument for determining the sensibility of the plates employed in photographic processes to luminous rays.", "details": []}, {"x": -0.8448097175938002, "y": 0.1440850049813559, "z": -0.5153019041286441, "word": "Photometer", "pos_group": "noun", "row_number": 113557, "definition": "An instrument for measuring the intensity of light or more especially for comparing the relative intensities of different lights or their relative illuminating power.", "details": []}, {"x": -0.7188728192317341, "y": 0.0871806084989507, "z": -0.6896531093757, "word": "Photometrical", "pos_group": "adjective", "row_number": 113559, "definition": "Of or pertaining to photometry or to a photometer.", "details": []}, {"x": -0.8436113164033207, "y": -0.0157616472761426, "z": -0.5367229427846354, "word": "Photometrician", "pos_group": "noun", "row_number": 113560, "definition": "One engaged in the scientific measurement of light.", "details": []}, {"x": -0.7856053070297476, "y": 0.1930821545953174, "z": -0.5878295527987052, "word": "Photometry", "pos_group": "noun", "row_number": 113561, "definition": "That branch of science which treats of the measurement of the intensity of light.", "details": []}, {"x": -0.7463120457411978, "y": -0.0120164556056599, "z": -0.6654877423185686, "word": "Photomicrograph", "pos_group": "noun", "row_number": 113563, "definition": "A microscopically small photograph of an object.", "details": []}, {"x": -0.8623300080037031, "y": 0.0815489361982652, "z": -0.4997366589527577, "word": "Photomicrography", "pos_group": "noun", "row_number": 113564, "definition": "The art of producing photomicrographs.", "details": []}, {"x": -0.7304634373979391, "y": 0.1487925779514837, "z": -0.6665462739910402, "word": "Photoscope", "pos_group": "noun", "row_number": 113572, "definition": "Anything employed for the observation of light or luminous effects.", "details": []}, {"x": -0.8088767250644917, "y": -0.0440791804590157, "z": -0.5863236900373413, "word": "Photoscopic", "pos_group": "adjective", "row_number": 113573, "definition": "Of or pertaining to the photoscope or its uses.", "details": []}, {"x": -0.8251563130140288, "y": 0.1731827008876393, "z": -0.5377032743124746, "word": "Photozincograph", "pos_group": "noun", "row_number": 113584, "definition": "A print made by photozincography.", "details": []}, {"x": -0.7226287870230415, "y": 0.0456798493623486, "z": -0.6897252985992619, "word": "Phrenism", "pos_group": "noun", "row_number": 113615, "definition": "See Vital force under Vital.", "details": []}, {"x": -0.8575881145465819, "y": 0.0163310508533214, "z": -0.514077739808353, "word": "Phrenograph", "pos_group": "noun", "row_number": 113618, "definition": "An instrument for registering the movements of the diaphragm or midriff in respiration.", "details": []}, {"x": -0.7610697509285081, "y": 0.1872569409360622, "z": -0.6210536790752366, "word": "Physiognomer", "pos_group": "noun", "row_number": 113769, "definition": "Physiognomist.", "details": []}, {"x": -0.7683693142902701, "y": -0.0355595082674666, "z": -0.6390180891249294, "word": "Physiognomize", "pos_group": "other", "row_number": 113775, "definition": "To observe and study the physiognomy of.", "details": []}, {"x": -0.8541907724417455, "y": 0.1221022026116963, "z": -0.5054198021375363, "word": "Physiognommonic", "pos_group": "adjective", "row_number": 113776, "definition": "Physiognomic.", "details": []}, {"x": -0.7202403772249563, "y": 0.1125091562737171, "z": -0.684540348532816, "word": "Piezometer", "pos_group": "noun", "row_number": 114154, "definition": "An instrument for measuring the compressibility of liquids.", "details": []}, {"x": -0.8319537294903045, "y": -0.0311510099790578, "z": -0.5539698607004334, "word": "Pilot", "pos_group": "noun", "row_number": 114377, "definition": "An instrument for detecting the compass error.", "details": []}, {"x": -0.8011862864780502, "y": 0.190411526227497, "z": -0.5673129515877692, "word": "Pint", "pos_group": "noun", "row_number": 114632, "definition": "A measure of capacity equal to half a quart or four gills -- used in liquid and dry measures. See Quart.", "details": []}, {"x": -0.7347427223736985, "y": 0.0073045465193853, "z": -0.6783065498128646, "word": "Pipette", "pos_group": "noun", "row_number": 114720, "definition": "A small glass tube often with an enlargement or bulb in the middle and usually graduated -- used for transferring or delivering measured quantities.", "details": []}, {"x": -0.8635537432805663, "y": 0.0556924708960187, "z": -0.5011719077837643, "word": "Pitch", "pos_group": "noun", "row_number": 114900, "definition": "The distance from center to center of any two adjacent teeth of gearing measured on the pitch line; -- called also circular pitch.", "details": []}, {"x": -0.739988507713341, "y": 0.1675784847275051, "z": -0.6514095945782622, "word": "Pitch", "pos_group": "noun", "row_number": 114901, "definition": "The length measured along the axis of a complete turn of the thread of a screw or of the helical lines of the blades of a screw propeller.", "details": []}, {"x": -0.7933487009736607, "y": -0.0459381706050516, "z": -0.6070317315798791, "word": "Pitot's tube", "pos_group": "other", "row_number": 114957, "definition": "A bent tube used to determine the velocity of running water by placing the curved end under water and observing the height to which the fluid rises in the tube; a kind of current meter.", "details": []}, {"x": -0.8382824496568936, "y": 0.1570982807090241, "z": -0.522113651225005, "word": "Planchette", "pos_group": "noun", "row_number": 115211, "definition": "A small tablet of wood supported on casters and having a pencil attached. The characters produced by the pencil on paper while the hand rests on the instrument and it is allowed to move are sometimes translated as of oracular or supernatural import.", "details": []}, {"x": -0.7185554891027456, "y": 0.0712482435759338, "z": -0.6918104486545851, "word": "Planimeter", "pos_group": "noun", "row_number": 115252, "definition": "An instrument for measuring the area of any plane figure however irregular by passing a tracer around the bounding line; a platometer.", "details": []}, {"x": -0.8502094471047512, "y": -0.0053162148459715, "z": -0.5264177370810605, "word": "Planimetrical", "pos_group": "adjective", "row_number": 115254, "definition": "Of or pertaining to planimetry.", "details": []}, {"x": -0.7757836351186119, "y": 0.1935792710357234, "z": -0.6005720750313239, "word": "Planometer", "pos_group": "noun", "row_number": 115287, "definition": "An instrument for gauging or testing a plane surface. See Surface gauge under Surface.", "details": []}, {"x": -0.7537963507844567, "y": -0.0232429942961574, "z": -0.6566969047895576, "word": "Platometer", "pos_group": "noun", "row_number": 115509, "definition": "See Planimeter.", "details": []}, {"x": -0.8607140976610853, "y": 0.097578740707508, "z": -0.4996495086051825, "word": "Platymeter", "pos_group": "noun", "row_number": 115541, "definition": "An apparatus for measuring the capacity of condensers or the inductive capacity of dielectrics.", "details": []}, {"x": -0.724952888955305, "y": 0.136339502597607, "z": -0.6751702369230995, "word": "Plessimeter", "pos_group": "noun", "row_number": 115805, "definition": "See Pleximeter.", "details": []}, {"x": -0.8182216345130358, "y": -0.0417869204897986, "z": -0.5733822547749409, "word": "Plethysmograph", "pos_group": "noun", "row_number": 115816, "definition": "An instrument for determining and registering the variations in the size or volume of a limb as the arm or leg and hence the variations in the amount of blood in the limb.", "details": []}, {"x": -0.81647986419976, "y": 0.1822274753114166, "z": -0.5478629195318556, "word": "Plumb", "pos_group": "noun", "row_number": 116040, "definition": "A little mass or weight of lead or the like attached to a line and used by builders etc. to indicate a vertical direction; a plummet; a plumb bob. See Plumb line below.", "details": []}, {"x": -0.7256739526710232, "y": 0.0300018891270947, "z": -0.6873843183137213, "word": "Plumb", "pos_group": "other", "row_number": 116046, "definition": "To sound with a plumb or plummet as the depth of water; hence to examine by test; to ascertain the depth quality dimension etc.; to sound; to fathom; to test.", "details": []}, {"x": -0.8613760092367465, "y": 0.0303733226002357, "z": -0.5070590024697309, "word": "Plumming", "pos_group": "noun", "row_number": 116092, "definition": "The operation of finding by means of a mine dial the place where to sink an air shaft or to bring an adit to the work or to find which way the lode inclines.", "details": []}, {"x": -0.7520291185388287, "y": 0.1821921438906806, "z": -0.6334494672617773, "word": "Pluviameter", "pos_group": "noun", "row_number": 116216, "definition": "See Pluviometer.", "details": []}, {"x": -0.7775140957618648, "y": -0.0421794254087255, "z": -0.6274493819933202, "word": "Pluviometer", "pos_group": "noun", "row_number": 116219, "definition": "An instrument for ascertaining the amount of rainfall at any place in a given time; a rain gauge.", "details": []}, {"x": -0.8493430659109757, "y": 0.1369018778200567, "z": -0.5097786110050971, "word": "Pluviometrical", "pos_group": "adjective", "row_number": 116220, "definition": "Of or pertaining to a pluviometer; determined by a pluviometer.", "details": []}, {"x": -0.7178365044139181, "y": 0.0972602691995271, "z": -0.6893846480492893, "word": "Pneometer", "pos_group": "noun", "row_number": 116239, "definition": "A spirometer.", "details": []}, {"x": -0.8399495039609057, "y": -0.0235021480220136, "z": -0.5421554019228986, "word": "Pneumatical", "pos_group": "adjective", "row_number": 116243, "definition": "Moved or worked by pressure or flow of air; as a pneumatic instrument; a pneumatic engine.", "details": []}, {"x": -0.7913910327621334, "y": 0.1943508690875193, "z": -0.5795929372832366, "word": "Pneumatics", "pos_group": "noun", "row_number": 116246, "definition": "That branch of science which treats of the mechanical properties of air and other elastic fluids as of their weight pressure elasticity etc. See Mechanics.", "details": []}, {"x": -0.7407891802565382, "y": -0.0062017544539201, "z": -0.6717089612745535, "word": "Pneumatograph", "pos_group": "noun", "row_number": 116252, "definition": "An instrument for recording the movements of the thorax or chest wall during respiration; -- also called stethograph.", "details": []}, {"x": -0.864033044211372, "y": 0.0716405700253061, "z": -0.4983116768020582, "word": "Pneumatometer", "pos_group": "noun", "row_number": 116257, "definition": "An instrument for measuring the amount of force exerted by the lungs in respiration.", "details": []}, {"x": -0.7328258009777198, "y": 0.1575279086781107, "z": -0.6619299837663076, "word": "Pneumatometry", "pos_group": "noun", "row_number": 116258, "definition": "See Spirometry.", "details": []}, {"x": -0.803034274586365, "y": -0.04710900313226, "z": -0.5940679217593179, "word": "Pneumometer", "pos_group": "noun", "row_number": 116268, "definition": "A spirometer.", "details": []}, {"x": -0.8307571894864768, "y": 0.1688480708106349, "z": -0.5304081646242417, "word": "Pneumometry", "pos_group": "noun", "row_number": 116269, "definition": "Measurement of the capacity of the lungs for air.", "details": []}, {"x": - rawing or in plotting. It is of various forms semicircular rectangular or circular.", "details": []}, {"x": -0.7169505039065032, "y": 0.0648575455394919, "z": -0.694100478126045, "word": "Prove", "pos_group": "other", "row_number": 121747, "definition": "To try or to ascertain by an experiment or by a test or standard; to test; as to prove the strength of gunpowder or of ordnance; to prove the contents of a vessel by a standard measure.", "details": []}, {"x": -0.8535696246418162, "y": -0.0025327323409047, "z": -0.5209726299487509, "word": "Pseudoscope", "pos_group": "noun", "row_number": 122063, "definition": "An instrument which exhibits objects with their proper relief reversed; -- an effect opposite to that produced by the stereoscope.", "details": []}, {"x": -0.7713750856410444, "y": 0.1957672921395782, "z": -0.6055209695630768, "word": "Pseudoscopic", "pos_group": "adjective", "row_number": 122064, "definition": "Of pertaining to or formed by a pseudoscope; having its parts appearing with the relief reversed; as a pseudoscopic image.", "details": []}, {"x": -0.7558838784142458, "y": -0.0293554791558289, "z": -0.65404725991091, "word": "Psychrometer", "pos_group": "noun", "row_number": 122141, "definition": "An instrument for measuring the tension of the aqueous vapor in the atmosphere being essentially a wet and dry bulb hygrometer.", "details": []}, {"x": -0.8609886842060279, "y": 0.1043106948553247, "z": -0.4978129815583078, "word": "Psychrometry", "pos_group": "noun", "row_number": 122143, "definition": "Hygrometry.", "details": []}, {"x": -0.7214031315680888, "y": 0.1324226090140597, "z": -0.6797365477783758, "word": "Pulmometer", "pos_group": "noun", "row_number": 122469, "definition": "A spirometer.", "details": []}, {"x": -0.8221292239829326, "y": -0.0428413155966222, "z": -0.5676866748050122, "word": "Pulsometer", "pos_group": "noun", "row_number": 122534, "definition": "A pulsimeter.", "details": []}, {"x": -0.8132094887314458, "y": 0.1876037175032736  123487, "definition": "An instrument for measuring altitudes variously constructed and mounted for different specific uses in astronomy surveying gunnery etc. consisting commonly of a graduated arc of 90\ufffd with an index or vernier and either plain or telescopic sights and usually having a plumb line or spirit level for fixing the vertical or horizontal direction.", "details": []}, {"x": -0.7872586179842458, "y": 0.1978851808907073, "z": -0.5840079824740304, "word": "Quadrantal", "pos_group": "noun", "row_number": 123489, "definition": "A cubical vessel containing a Roman cubic foot each side being a Roman square foot; -- used as a measure.", "details": []}, {"x": -0.7421008865733094, "y": -0.0129084526833582, "z": -0.6701638948767904, "word": "Quadrat", "pos_group": "noun", "row_number": 123492, "definition": "An old instrument used for taking altitudes; -- called also geometrical square and line of shadows.", "details": []}, {"x": -0.8651764905526113, "y": 0.0779023098206483, "z": -0.4953795214980885, "word": "Quantitively", "pos_group": "adverb", "row_number": 123710, "definition": "So as to be measurable by quantity; quantitatively.", "details": []}, {"x": -0.7287704574257267, "y": 0.1548995147080188, "z": -0.6670080664630056, "word": "Quart", "pos_group": "noun", "row_number": 123776, "definition": "A vessel or measure containing a quart.", "details": []}, {"x": -0.8068188477873246, "y": -0.0495942999367696, "z": -0.5887136419932154, "word": "Quartan", "pos_group": "noun", "row_number": 123780, "definition": "A measure the fourth part of some other measure.", "details": []}, {"x": -0.8281745333735256, "y": 0.1750466202722356, "z": -0.5324336794407456, "word": "Quintal", "pos_group": "noun", "row_number": 124310, "definition": "A hundredweight either 112 or 100 pounds according to the scale used. Cf. Cental.", "details": []}, {"x": -0.7185300845020003, "y": 0.0482865865923759, "z": -0.6938176440685302, "word": "Quintal", "pos_group": "noun", "row_number": 12
