<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 20, "radius": 285.0, "nodes": [{"x": -0.6275838458183297, "y": 0.12616085971694993, "z": -0.7 urce Unix-based operating system developed by Apple Inc. designed specifically for Macintosh desktop and laptop computers.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the computer and immediately hold down \"Command (\u2318) + R\" to boot into macOS Recovery. From there, open \"Disk Utility\" to run First Aid on the startup disk, or select \"Reinstall macOS\" to rewrite system files without deleting user data."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6350512528756349, "y": 0.10065558281322934, "z": -0.765884038134766, "word": "macOS (OS X): Screen Sharing", "row_number": 1375, "definition": "A native VNC-based (Virtual Network Computing) remote desktop protocol tool integrated into macOS that enables authorized users to remotely view and fully control another Mac across a network interface.", "details": [{"label": "TROUBLESHOOTING", "value": "On the target Mac, navigate to \u201cSystem Preferences > Sharing\u201d, look for the \u201cScreen Sharing\u201d checkbox, and make sure it is toggled on. Next, verify that the local firewall settings are not blocking the incoming transmission port TCP (Transmission Control Protocol) 5900."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6341828986176532, "y": 0.1396593947309339, "z": -0.760465189580891, "word": "Online resources: macOS (OS X)", "row_number": 1684, "definition": "Apple-provided support documentation and community resources for managing macOS environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Reference Apple\u2019s official support site for specific \u201cError Codes\u201d; utilize \u201cRecovery Mode\u201d by holding \u201cCommand + R\u201d during boot to access diagnostic and re-installation tools."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6122570142061103, "y": 0.11006288996816894, "z": -0.7829607326087774, "word": "Remote access: Remote Desktop", "row_number": 2124, "definition": "A Microsoft tool that uses RDP to stream an interactive graphical user interface session from a host computer over a network link onto a client computer.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to System Properties, enable 'Allow remote connections', ensure Windows Firewall allows port 3389, and check that the user account belongs to the Remote Desktop Users group."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.6482177743161024, "y": 0.11112137586340519, "z": -0.7533032303706804, "word": "Remote access: Third-party tools", "row_number": 2127, "definition": "Independent remote control software (TeamViewer, AnyDesk) utilized by helpdesk personnel to access, view, and manipulate a customer's desktop interface.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the application has elevated privileges, check that the connection PIN is correct, and verify outbound web access is functional."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6166300219409331, "y": 0.14363381120509353, "z": -0.774039239522018, "word": "Screens: Screen Sharing, macOS (OS X)", "row_number": 2226, "definition": "A remote administration feature in Apple macOS that allows one user to view and control the desktop of another Mac over a network, effectively acting as a VNC (Virtual Network Computing) client.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to \u201cSystem Settings > General > Sharing\u201d and ensure the \u201cScreen Sharing\u201d toggle is \u201cOn\u201d; if issues persist, use the command \u201cping\u201d to verify connectivity to the host IP address and ensure the local firewall permits traffic on port 5900."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.625219859743108, "y": 0.09147232485540312, "z": -0.7750696360768855, "word": "Sharing: Screen Sharing, macOS (OS X)", "row_number": 2369, "definition": "A native, built-in remote desktop assistance utility found inside the Apple desktop operating system environment that relies on Virtual Network Computing (VNC) protocols to stream live interactive graphical user sessions over local subnets.", "details": [{"label": "TROUBLESHOOTING", "value": "Instruct the client user to select the Apple icon menu, choose \u201cSystem Settings > General > Sharing\u201d, toggle the control parameter switch for \u201cScreen Sharing\u201d to the enabled on position, and verify that local system firewall access lists do not drop network traffic tracking over port \u201c5900\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6470752323876334, "y": 0.13627912460640995, "z": -0.7501477479983532, "word": "Troubleshooting: Remote-controlled computers", "row_number": 2705, "definition": "Diagnosing issues with applications that allow a user to control a host machine from a client system, such as RDP (Remote Desktop Protocol) or SSH (Secure Shell).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the host is enabled for remote connections in \u201cSystem Properties\u201d, ensure the host firewall is allowing the correct port (e.g., 3389 for RDP), and verify both machines are on the same network or have a valid VPN (Virtual Private Network) tunnel between them."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6036356190411364, "y": 0.12456634229894153, "z": -0.787468898300807, "word": "Workstations: MacOS (OS X)", "row_number": 2986, "definition": "Desktop and laptop workstation computers designed by Apple that operate on a Unix-based operating system core, utilizing the proprietary graphical user interface shell workspace to run line-of-business software applications.", "details": [{"label": "TROUBLESHOOTING", "value": "Restart the system node, hold down the key combination shortcut \u201cCommand + R\u201d on the keyboard during startup to boot into macOS Recovery, launch the \"Disk Utility\" application tool, select the primary system boot partition volume, and click on \"First Aid\" to inspect, verify, and repair file system structure errors and storage descriptor flags."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
