ear by year.", "details": []}, {"x": -0.6474571134651831, "y": -0.7202104626172815, "z": -0.24919104269602924, "word": "Development", "pos_group": "noun", "row_number": 42240, "definition": "The act of developing or disclosing that which is unknown; a gradual unfolding process by which anything is developed as a plan or method or an image upon a photographic plate; gradual advancement or growth through a series of progressive changes; also the result of developing or a developed state.", "details": []}, {"x": -0.56447038075645, "y": -0.7241391973768683, "z": -0.3962267180176689, "word": "Development", "pos_group": "noun", "row_number": 42241, "definition": "The series of changes which animal and vegetable organisms undergo in their passage from the embryonic state to maturity from a lower to a higher state of organization.", "details": []}, {"x": -0.552273924978206, "y": -0.7970799886697132, "z": -0.2442478320302079, "word": "Development", "pos_group": "noun", "row_number": 42244, "definition": "The elaboration of a theme or subject; the unfolding of a musical idea; the evolution of a whole piece or movement from a leading theme or motive.", "details": []}, {"x": -0.653378862199422, "y": -0.6854749847225775, "z": -0.32127886290661983, "word": "Developmental", "pos_group": "adjective", "row_number": 42245, "definition": "Pertaining to or characteristic of the process of development; as the developmental power of a germ.", "details": []}, {"x": -0.5163608028146213, "y": -0.7771200210905055, "z": -0.35979993626588097, "word": "Device", "pos_group": "noun", "row_number": 42272, "definition": "Anything fancifully conceived.", "details": []}, {"x": -0.6173080442149093, "y": -0.7536249914282233, "z": -0.22578784476223318, "word": "Diagnosis", "pos_group": "noun", "row_number": 42532, "definition": "Scientific determination of any kind; the concise description of characterization of a species.", "details": []}, {"x": -0.6055403584667242, "y": -0.6964955264351201, "z": -0.38  medium that transmits the electric force by a process different from conduction as in the phenomena of induction; a nonconductor. separating a body electrified by induction from the electrifying body.", "details": []}, {"x": -0.5383910356514713, "y": -0.8025020224819316, "z": -0.257148977525763, "word": "Differentia", "pos_group": "noun", "row_number": 43010, "definition": "The formal or distinguishing part of the essence of a species; the characteristic attribute of a species; specific difference.", "details": []}, {"x": -0.658162529296859, "y": -0.6894100190252119, "z": -0.30254902197366024, "word": "Differentiate", "pos_group": "other", "row_number": 43019, "definition": "To distinguish or mark by a specific difference; to effect a difference in as regards classification; to develop differential characteristics in; to specialize; to desynonymize.", "details": []}, {"x": -0.5230330731415722, "y": -0.7656629427881787, "z": -0.37442844769198413, "word": "Differentiate", "pos_group": "other", "row_number": 43020, "definition": "To express the specific difference of; to describe the properties of (a thing) whereby it is differenced from another of the same class; to discriminate.", "details": []}, {"x": -0.602497715663137, "y": -0.7663725707769681, "z": -0.22286674355184272, "word": "Differentiation", "pos_group": "noun", "row_number": 43024, "definition": "The act of distinguishing or describing a thing by giving its different or specific difference; exact definition or determination.", "details": []}, {"x": -0.6205420435782175, "y": -0.6889383197973021, "z": -0.3745551543720094, "word": "Differentiation", "pos_group": "noun", "row_number": 43025, "definition": "The gradual formation or production of organs or parts by a process of evolution or development as when the seed develops the root and the stem the initial stem develops the leaf branches and flower buds; or in animal life when the germ evolves the digestive and other organs and members or when the animals as they advance in organization acquire special organs for specific purposes.", "details": []}, {"x": -0.5143112180163152, "y": -0.8024934367231491, "z": -0.3024702548001095, "word": "Differentiation", "pos_group": "noun", "row_number": 43026, "definition": "The supposed act or tendency in being of every kind whether organic or inorganic to assume or produce a more complex structure or functions.", "details": []}, {"x": -0.6530084476490438, "y": -0.7124372641880751, "z": -0.2569301692974124, "word": "Difformity", "pos_group": "noun", "row_number": 43059, "definition": "Irregularity of form; diversity of form; want of uniformity.", "details": []}, {"x": -0.5546901591043413, "y": -0.731602330359555, "z": -0.3963292288051306, "word": "Digenesis", "pos_group": "noun", "row_number": 43108, "definition": "The faculty of multiplying in two ways; -- by ova fecundated by spermatic fluid and asexually as by buds. See Parthenogenesis.", "details": []}, {"x": -0.5608721990051012, "y": -0.7934941063176286, "z": -0.23619796701574303, "word": "Digenous", "pos_group": "adjective", "row_number": 43109, "definition": "Sexually reproductive.", "details": []}, {"x": -0.6502032515274271, "y": -0.6829393167031209, "z": -0.3329108310107018, "word": "Digestive", "pos_group": "adjective", "row_number": 43136, "definition": "Pertaining to digestion; having the power to cause or promote digestion; as the digestive ferments.", "details": []}, {"x": -0.5121585066136244, "y": -0.7840997519079816, "z": -0.3505442099951784, "word": "Digitation", "pos_group": "noun", "row_number": 43167, "definition": "A division into fingers or fingerlike processes; also a fingerlike process.", "details": []}, {"x": -0.6264127830058899, "y": -0.7455072996858666, "z": -0.2276530065733892, "word": "Digressive", "pos_group": "adjective", "row_number": 43211, "definition": "Departing from the main subject; partaking of the nature of digression.", "details": []}, {"x": -0.5960308996669539, "y": -0.7011333978765645, "z": -0.39135549698996774, "word": "Dilogies", "pos_group": "other", "row_number": 43315, "definition": "of Dilogy", "details": []}, {"x": -0.5264295017865244, "y": -0.8052568286153943, "z": -0.27282488819216816, "word": "Dimidiation", "pos_group": "noun", "row_number": 43376, "definition": "The act of dimidiating or halving; the state of being dimidiate.", "details": []}, {"x": -0.6595654396044185, "y": -0.6960101955531889, "z": -0.2838014069123729, "word": "Diminish", "pos_group": "other", "row_number": 43383, "definition": "To become or appear less or smaller; to lessen; as the apparent size of an object diminishes as we recede from it.", "details": []}, {"x": -0.5327699656826067, "y": -0.7529443298353465, "z": -0.3863042839981911, "word": "Dimorphic", "pos_group": "adjective", "row_number": 43417, "definition": "Having the property of dimorphism; dimorphous.", "details": []}, {"x": -0.5865509426455806, "y": -0.7783126553506581, "z": -0.22402544989931072, "word": "Dimorphous", "pos_group": "adjective", "row_number": 43420, "definition": "Characterized by dimorphism; occurring under two distinct forms not dependent on sex; dimorphic.", "details": []}, {"x": -0.6341515600724744, "y": -0.6838361684572388, "z": -0.3608599362181532, "word": "Diphygenic", "pos_group": "adjective", "row_number": 43587, "definition": "Having two modes of embryonic development.", "details": []}, {"x": -0.5100253308863254, "y": -0.797845511085884, "z": -0.3214291559494862, "word": "Diplococcus", "pos_group": "noun", "row_number": 43597, "definition": "A form of micrococcus in which cocci are united in a binary manner. See Micrococcus.", "details": []}, {"x": -0.6455308999809863, "y": -0.7241869793445911, "z": -0.24257591825549107, "word": "Diplogenic", "pos_group": "adjective", "row_number": 43600, "definition": "Partaking of the nature of two bodies; producing two substances.", "details": []}, {"x": -0.5698450985065581, "y": -0.71869825116456, "z": -0.3984336676048524, "word": "Direptitious", "pos_group": "adjective", "row_number": 43733, "definition": "Characterized by direption.", "details": []}, {"x": -0.5458236482778004, "y": -0.8005506198597336, "z": -0.24737673702858215, "word": "Disassimilation", "pos_group": "noun", "row_number": 43916, "definition": "The decomposition of complex substances within the organism into simpler ones suitable only for excretion with evolution of energy -- a normal nutritional process the reverse of assimilation; downward metabolism.", "details": []}, {"x": -0.6570610518938662, "y": -0.6852298022251367, "z": -0.31421472312198584, "word": "Discoverable", "pos_group": "adjective", "row_number": 44328, "definition": "Capable of being discovered found out or perceived; as many minute animals are discoverable only by the help of the microscope; truths discoverable by human industry.", "details": []}, {"x": -0.516936819230618, "y": -0.7734331660427736, "z": -0.3668480102014762, "word": "Discoverment", "pos_group": "noun", "row_number": 44331, "definition": "Discovery.", "details": []}, {"x": -0.6123207305614404, "y": -0.7587352670220262, "z": -0.22222537546760635, "word": "Discoverture", "pos_group": "noun", "row_number": 44334, "definition": "Discovery.", "details": []}, {"x": -0.6118693386971126, "y": -0.6920755012144414, "z": -0.3829457050041661, "word": "Discovery", "pos_group": "noun", "row_number": 44340, "definition": "That which is discovered; a thing found out or for the first time ascertained or recognized; as the properties of the magnet were an important discovery.", "details": []}, {"x": -0.5169966944145655, "y": -0.805156966239375, "z": -0.29057989896174563, "word": "Discussive", "pos_group": "adjective", "row_number": 44438, "definition": "Able or tending to discuss or disperse tumors or coagulated matter.", "details": []}, {"x": -0.6574514104464924, "y": -0.7050096674560343, "z": -0.26593046402292786, "word": "Disparate", "pos_group": "adjective", "row_number": 45055, "definition": "Pertaining to two coordinate species or divisions.", "details": []}, {"x": -0.5451641808742537, "y": -0.739544152465386, "z": -0.39480433438091567, "word": "Dispersion", "pos_group": "noun", "row_number": 45147, "definition": "The act or process of scattering or dispersing or the state of being scattered or separated; as the Jews in their dispersion retained their rites and ceremonies; a great dispersion of the human family took place at the building of Babel.", "details": []}, {"x": -0.5702050792830449, "y": -0.78885571614872, "z": -0.22928765047273414, "word": "Disposition", "pos_group": "noun", "row_number": 45262, "definition": "Tendency to any action or state resulting from natural constitution; nature; quality; as a disposition in plants to grow in a direction upward; a disposition in bodies to putrefaction.", "details": []}, {"x": -0.6456888108404802, "y": -0.681478134379428, "z": -0.34449022035195853, "word": "Dissemination", "pos_group": "noun", "row_number": 45477, "definition": "The act of disseminating or the state of being disseminated; diffusion for propagation and permanence; a scattering or spreading abroad as of ideas beliefs etc.", "details": []}, {"x": -0.5091970682592447, "y": -0.7905473990440193, "z": -0.34022515418605664, "word": "Dissimilar", "pos_group": "adjective", "row_number": 45537, "definition": "Not similar; unlike; heterogeneous; as the tempers of men are as dissimilar as their features.", "details": []}, {"x": -0.6350265087600374, "y": -0.7370993210809759, "z": -0.2311404854931358, "word": "Distillatory", "pos_group": "noun", "row_number": 45759, "definition": "A distillatory apparatus; a still.", "details": []}, {"x": -0.5860039134964369, "y": -0.706732676503242, "z": -0.3963941691415559, "word": "Distinguisher", "pos_group": "noun", "row_number": 45802, "definition": "One who or that which distinguishes or separates one thing from another by marks of diversity.", "details": []}, {"x": -0.5323250501513397, "y": -0.8050579804767245, "z": -0.26174737639967227, adual unfolding of successive phases of growth or development.", "details": []}, {"x": -0.5339157070622192, "y": -0.7429906921101889, "z": -0.40360729575897497, "word": "Evolution", "pos_group": "noun", "row_number": 54721, "definition": "That theory of generation which supposes the germ to preexist in the parent and its parts to be developed but not actually formed by the procreative act; -- opposed to epigenesis.", "details": []}, {"x": -0.5734712369651773, "y": -0.79049316245851, "z": -0.21506115520933422, "word": "Evolution", "pos_group": "noun", "row_number": 54722, "definition": "That series of changes under natural law which involves continuous progress from the homogeneous to the heterogeneous in structure and from the single and simple to the diverse and manifold in quality or function. The pocess is by some limited to organic beings; by others it is applied to the inorganic and the psychical. It is also applied to explain the existence and growth of institutions manners language civilization and every product of human activity. The agencies and laws of the process are variously explained by different philosophrs.", "details": []}, {"x": -0.6494806085259242, "y": -0.6722721191271378, "z": -0.3552817712648687, "word": "Evolutional", "pos_group": "adjective", "row_number": 54723, "definition": "Relating to evolution.", "details": []}, {"x": -0.4977095716186075, "y": -0.7991428252274916, "z": -0.33712894744688565, "word": "Evolutionary", "pos_group": "adjective", "row_number": 54724, "definition": "Relating to evolution; as evolutionary discussions.", "details": []}, {"x": -0.6455500713775107, "y": -0.730274074975247, "z": -0.2235282549556953, "word": "Evolutionism", "pos_group": "noun", "row_number": 54725, "definition": "The theory of or belief in evolution. See Evolution 6 and 7.", "details": []}, {"x": -0.5793304113256795, "y": -0.7048637632806373, "z": -0.4093205952881883, "word": "Evolutionist", "pos_group": "noun", "row_number": 54727, "definition": "on cence.", "details": []}, {"x": -0.5238155992776441, "y": -0.8147908491585315, "z": -0.24846144586418642, "word": "Fluxional", "pos_group": "adjective", "row_number": 60690, "definition": "Pertaining to or having the nature of fluxion or fluxions; variable; inconstant.", "details": []}, {"x": -0.6737414283589541, "y": -0.677270998241841, "z": -0.29559513300008317, "word": "Force", "pos_group": "noun", "row_number": 61270, "definition": "Any action between two bodies which changes or tends to change their relative condition as to rest or motion; or more generally which changes or tends to change any physical relation between them whether mechanical thermal chemical electrical magnetic", "details": []}, {"x": -0.5103835193268415, "y": -0.765866618372859, "z": -0.3910971568059133, "word": "Force", "pos_group": "other", "row_number": 61285, "definition": "To be of force importance or weight; to matter.", "details": []}, {"x": -0.6013244048176386, "y": -0.7727881929666387, "z": -0.20299598267470625, "word": "Foreign", "pos_group": "adjective", "row_number": 61426, "definition": "Remote; distant; strange; not belonging; not connected; not pertaining or pertient; not appropriate; not harmonious; not agreeable; not congenial; -- with to or from; as foreign to the purpose; foreign to one's nature.", "details": []}, {"x": -0.6306535009134467, "y": -0.6738726751220705, "z": -0.38493087627447786, "word": "Foreknowledge", "pos_group": "noun", "row_number": 61443, "definition": "Knowledge of a thing before it happens or of whatever is to happen; prescience.", "details": []}, {"x": -0.49633195935545343, "y": -0.8128760449213538, "z": -0.3047738862097502, "word": "Form", "pos_group": "noun", "row_number": 61753, "definition": "The shape and structure of anything as distinguished from the material of which it is composed; particular disposition or arrangement of matter giving it individuality or distinctive character; configuration; figure; external appearance.", "details": []}, {"x": -0.6651496755631993, "y": -0.7067776949996183, "z": -0.2409174110544885, "word": "Form", "pos_group": "noun", "row_number": 61766, "definition": "That assemblage or disposition of qualities which makes a conception or that internal constitution which makes an existing thing to be what it is; -- called essential or substantial form and contradistinguished from matter; hence active or formative nature; law of being or activity; subjectively viewed an idea; objectively a law.", "details": []}, {"x": -0.5505062649138849, "y": -0.7241629300035523, "z": -0.4153683944394827, "word": "Form", "pos_group": "noun", "row_number": 61767, "definition": "Mode of acting or manifestation to the senses or the intellect; as water assumes the form of ice or snow. In modern usage the elements of a conception furnished by the mind's own activity as contrasted with its object or condition which is called the matter; subjectively a mode of apprehension or belief conceived as dependent on the constitution of the mind; objectively universal and necessary accompaniments or elements of every object known or thought of.", "details": []}, {"x": -0.5506586261072318, "y": -0.8047006638430945, "z": -0.22188266967967374, "word": "Form", "pos_group": "noun", "row_number": 61768, "definition": "The peculiar characteristics of an organism as a type of others; also the structure of the parts of an animal or plant.", "details": []}, {"x": -0.6651804462224851, "y": -0.6684487202290558, "z": -0.33273304973716267, "word": "Formal", "pos_group": "adjective", "row_number": 61780, "definition": "Belonging to the constitution of a thing as distinguished from the matter composing it; having the power of making a thing what it is; constituent; essential; pertaining to or depending on the forms so called of the human intellect.", "details": []}, {"x": -0.49603950553848714, "y": -0.7888502625647181, "z": -0.36284993068306975, "word": "Formality", "pos_group": "noun", "row_number": 61791, "definition": "Form without substance.", "details": []}, {"x": -0.6309532965765909, "y": -0.7475728924040552, "z": -0.2074432647298227, "word": "Formality", "pos_group": "noun", "row_number": 61797, "definition": "The manner in which a thing is conceived or constituted by an act of human thinking; the result of such an act; as animality and rationality are formalities.", "details": []}, {"x": -0.6011891609329403, "y": -0.6879368113223432, "z": -0.40658890344473747, "word": "Formation", "pos_group": "noun", "row_number": 61805, "definition": "The act of giving form or shape to anything; a forming; a shaping.", "details": []}, {"x": -0.5100422581010211, "y": -0.8172311679829186, "z": -0.2683097333838007, "word": "Formation", "pos_group": "noun", "row_number": 61806, "definition": "The manner in which a thing is formed; structure; construction; conformation; form; as the peculiar formation of the heart.", "details": []}, {"x": -0.674308900293294, "y": -0.686139215226154, "z": -0.27298440306011246, "word": "Formation", "pos_group": "noun", "row_number": 61809, "definition": "A group of beds of the same age or period; as the Eocene formation.", "details": []}, {"x": -0.5231622316507089, "y": -0.7501213684617893, "z": -0.404498716872208, "word": "Formative", "pos_group": "adjective", "row_number": 61813, "definition": "Capable of growth and development; germinal; as living or formative matter.", "details": []}, {"x": -0.5817308120322864, "y": -0.7869242694878843, "z": -0.20576553750134272, "word": "Formed", "pos_group": "adjective", "row_number": 61819, "definition": "Having structure; capable of growth and development; organized; as the formed or organized ferments. See Ferment n.", "details": []}, {"x": -0.6465997365492334, "y": -0.6685589969773131, "z": -0.3673386016404355, "word": "Fortuitous", "pos_group": "adjective", "row_number": 61982, "definition": "Happening by chance; coming or occuring unexpectedly or without any known cause; chance; as the fortuitous concourse of atoms.", "details": []}, {"x": -0.492246333316605, "y": -0.8063477918129137, "z": -0.3278670248359781, "word": "Fossilification", "pos_group": "noun", "row_number": 62060, "definition": "The process of becoming fossil.", "details": []}, {"x": -0.6550441400515509, "y": -0.7215108703818942, "z": -0.22436407578952086, "word": "Fossilism", "pos_group": "noun", "row_number": 62061, "definition": "The science or state of fossils.", "details": []}, {"x": -0.5693348068467361, "y": -0.7087419737655927, "z": -0.41658455604551825, "word": "Fossilization", "pos_group": "noun", "row_number": 62064, "definition": "The process of converting or of being converted into a fossil.", "details": []}, {"x": -0.5328227064794253, "y": -0.8124874150348511, "z": -0.23656746156207908, "word": "Fossilize", "pos_group": "other", "row_number": 62068, "definition": "To cause to become antiquated rigid or fixed as by fossilization; to mummify; to deaden.", "details": []}, {"x": -0.6724774472561869, "y": -0.6721784390230866, "z": -0.3097583397493747, "word": "Fossilize", "pos_group": "other", "row_number": 62069, "definition": "To become fossil.", "details": []}, {"x": -0.5029558035517498, "y": -0.7753348372529376, "z": -0.3819572617657299, "word": "Fountain", "pos_group": "noun", "row_number": 62166, "definition": "The source from which anything proceeds or from which anything is supplied continuously; origin; source.", "details": []}, {"x": -0.6132731348550126, "y": -0.7635626863369172, "z": -0.20215856672190793, "word": "Frame", "pos_group": "noun", "row_number": 62374, "definition": "The bodily structure; physical constitution; make or build of a person.", "details": []}, {"x": -0.6201805745431118, "y": -0.6776560136907793, "z": -0.3951688019923864, "word": "Framing", "pos_group": "noun", "row_number": 62390, "definition": "A framework or a sy/ of frames.", "details": []}, {"x": -0.49954827552606296, "y": -0.8161761215581943, "z": -0.2903585008522405, "word": "Froth", "pos_group": "noun", "row_number": 63114, "definition": "Light unsubstantial matter.", "details": []}, {"x": -0.6706103804760881, "y": -0.6977690842329375, "z": -0.2517936112899694, "word": "Fugato", "pos_group": "noun", "row_number": 63324, "definition": "A composition resembling a fugue.", "details": []}, {"x": -0.538952354840595, "y": -0.7338005139892362, "z": -0.4136026654663989, "word": "Full", "pos_group": "adverb", "row_number": 63392, "definition": "Quite; to the same degree; without abatement or diminution; with the whole force or effect; thoroughly; completely; exactly; entirely.", "details": []}, {"x": -0.5619645037829641, "y": -0.7991452386253208, "z": -0.2134544074748656, "word": "Fullness", "pos_group": "noun", "row_number": 63421, "definition": "The state of being full or of abounding; abundance; completeness.", "details": []}, {"x": -0.6597864305601664, "y": -0.6666470767590504, "z": -0.3467903417012756, "word": "Function", "pos_group": "noun", "row_number": 63533, "definition": "The appropriate action of any special organ or part of an animal or vegetable organism; as the function of the heart or the limbs; the function of leaves sap roots etc.; life is the sum of the functions of the various organs and parts of the body.", "details": []}, {"x": -0.4924050293786635, "y": -0.7967176958100749, "z": -0.35039720350722364, "word": "Function", "pos_group": "noun", "row_number": 63534, "definition": "The natural or assigned action of any power or faculty as of the soul or of the intellect; the exertion of an energy of some determinate kind.", "details": []}, {"x": -0.6414389149573033, "y": -0.7374153816845277, "z": -0.2116002675647162, "word": "Functional", "pos_group": "adjective", "row_number": 63540, "definition": "Pertaining to the function of an organ or part or to the functions in general.", "details": []}, {"x": -0.5890782518724073, "y": -0.6946978203030838, "z": -0.41277324481740946, "word": "Functionless", "pos_group": "adjective", "row_number": 63545, "definition": "Destitute of function or ion of the male and female elements.", "details": []}, {"x": -0.5570446656896749, "y": -0.7176647703008212, "z": -0.41792166478390164, "word": "Gamogenesis", "pos_group": "noun", "row_number": 64363, "definition": "The production of offspring by the union of parents of different sexes; sexual reproduction; -- the opposite of agamogenesis.", "details": []}, {"x": -0.5429548564288463, "y": -0.8088458021163791, "z": -0.22576202576837923, "word": "Gamogenetic", "pos_group": "adjective", "row_number": 64364, "definition": "Relating to gamogenesis.", "details": []}, {"x": -0.6695523568070474, "y": -0.6682684755485738, "z": -0.32421734389466805, "word": "Gamomorphism", "pos_group": "noun", "row_number": 64365, "definition": "That stage of growth or development in an organism in which the reproductive elements are generated and matured in preparation for propagating the species.", "details": []}, {"x": -0.49685329642341763, "y": -0.7843975467798697, "z": -0.37129138212313223, "word": "Gastrurous", "pos_group": "adjective", "row_number": 64737, "definition": "Pertaining to the Gastrura.", "details": []}, {"x": -0.6249291108643906, "y": -0.7537520137164494, "z": -0.20327692493896, "word": "Gelidity", "pos_group": "noun", "row_number": 65006, "definition": "The state of being gelid.", "details": []}, {"x": -0.6088133222845856, "y": -0.6827088674804644, "z": -0.4040481912746881, "word": "Gemmation", "pos_group": "noun", "row_number": 65052, "definition": "The formation of a new individual either animal or vegetable by a process of budding; an asexual method of reproduction; gemmulation; gemmiparity. See Budding.", "details": []}, {"x": -0.5043774200053494, "y": -0.8181887195657195, "z": -0.2759902849090087, "word": "Gemmule", "pos_group": "noun", "row_number": 65071, "definition": "One of the imaginary granules or atoms which according to Darwin's hypothesis of pangenesis are continually being thrown off from every cell or unit and circulate freely throughout the system and when supplied with proper nutriment multiply by self-division and ultimately develop into cells like those from which they were derived. They are supposed to be transmitted from the parent to the offspring but are often transmitted in a dormant state during many generations and are then developed. See Pangenesis.", "details": []}, {"x": -0.6745864208538519, "y": -0.6893897651937904, "z": -0.2639600584286196, "word": "Gender", "pos_group": "noun", "row_number": 65092, "definition": "A classification of nouns primarily according to sex; and secondarily according to some fancied or imputed quality associated with sex.", "details": []}, {"x": -0.5279750477730812, "y": -0.7437983107829365, "z": -0.40988586436404845, "word": "Geneagenesis", "pos_group": "noun", "row_number": 65098, "definition": "Alternate generation. See under Generation.", "details": []}, {"x": -0.5739056794666205, "y": -0.7924285471312844, "z": -0.20661381552877417, "word": "Generable", "pos_group": "adjective", "row_number": 65109, "definition": "Capable of being generated or produced.", "details": []}, {"x": -0.6528779341850047, "y": -0.6661986226187403, "z": -0.3604577621236836, "word": "General", "pos_group": "adjective", "row_number": 65110, "definition": "Relating to a genus or kind; pertaining to a whole class or order; as a general law of animal or vegetable economy.", "details": []}, {"x": -0.4903695831318356, "y": -0.803750813609711, "z": -0.33693070735811187, "word": "General", "pos_group": "adjective", "row_number": 65111, "definition": "Comprehending many species or individuals; not special or particular; including all particulars; as a general inference or conclusion.", "details": []}, {"x": -0.6510809594896344, "y": -0.7271347136900715, "z": -0.21764349826474258, "word": "Generalities", "pos_group": "other", "row_number": 65124, "definition": "of Generality", "details": []}, {"x": -0.5766117504080263, "y": -0.7024757885026476, "z": -0.4171889929743778, "word": "Generality", "pos_group": "no ": 69142, "definition": "A school for the higher branches of literature and science; a preparatory school for the university; -- used esp. of German schools of this kind.", "details": []}, {"x": -0.6642080055591941, "y": -0.7122174140775487, "z": -0.2270992744060775, "word": "Gymnosophy", "pos_group": "noun", "row_number": 69174, "definition": "The doctrines of the Gymnosophists.", "details": []}, {"x": -0.5585147414602308, "y": -0.71383572051083, "z": -0.4224924232390396, "word": "Gynecology", "pos_group": "noun", "row_number": 69197, "definition": "The science which treats of the structure and diseases of women.", "details": []}, {"x": -0.5381731475421503, "y": -0.8124278399199507, "z": -0.22434497584652463, "word": "Habit", "pos_group": "noun", "row_number": 69294, "definition": "The general appearance and manner of life of a living organism.", "details": []}, {"x": -0.6739603796235861, "y": -0.6653284506971486, "z": -0.3211159594142955, "word": "Habitual", "pos_group": "noun", "row_number": 69318, "definition": "Formed or acquired by habit or use.", "details": []}, {"x": -0.4939665905918615, "y": -0.7836614587402041, "z": -0.37665863253644927, "word": "Haecceity", "pos_group": "other", "row_number": 69402, "definition": "Literally this-ness. A scholastic term to express individuality or singleness; as this book.", "details": []}, {"x": -0.6236070342235371, "y": -0.756287763395267, "z": -0.19784611647820868, "word": "Haematogenic", "pos_group": "adjective", "row_number": 69442, "definition": "Relating to haematogenesis.", "details": []}, {"x": -0.612477803203632, "y": -0.6782189729979845, "z": -0.40606645422690624, "word": "Haematology", "pos_group": "noun", "row_number": 69449, "definition": "The science which treats of the blood. Same as Hematology.", "details": []}, {"x": -0.4991280396384919, "y": -0.8207830631732352, "z": -0.2778243388448841, "word": "Hallucinatory", "pos_group": "adjective", "row_number": 69755, "definition": "Partaking of or tending to produce hallucination.", "details": []}, {"x": -0.6774900943895916, "y": -0.6885663036842238, "z": -0.25861867185999454, "word": "Harbinger", "pos_group": "noun", "row_number": 70155, "definition": "A forerunner; a precursor; a messenger.", "details": []}, {"x": -0.5277732596252656, "y": -0.7409301617469212, "z": -0.41530456515454217, "word": "Harmony", "pos_group": "noun", "row_number": 70356, "definition": "The just adaptation of parts to each other in any system or combination of things or in things or things intended to form a connected whole; such an agreement between the different parts of a design or composition as to produce unity of effect; as the harmony of the universe.", "details": []}, {"x": -0.5701303140381859, "y": -0.7959909482945137, "z": -0.20334658897537553, "word": "Harmony", "pos_group": "noun", "row_number": 70360, "definition": "The science which treats of their construction and progression.", "details": []}, {"x": -0.6574743052655501, "y": -0.6623271306564751, "z": -0.35923573028297584, "word": "Hatch", "pos_group": "other", "row_number": 70533, "definition": "To contrive or plot; to form by meditation and bring into being; to originate and produce; to concoct; as to hatch mischief; to hatch heresy.", "details": []}, {"x": -0.48619938056510836, "y": -0.8044074762391256, "z": -0.3413777592472975, "word": "Hatch", "pos_group": "noun", "row_number": 70535, "definition": "The act of hatching.", "details": []}, {"x": -0.6514625121666434, "y": -0.728549138493128, "z": -0.21169021716283176, "word": "Have", "pos_group": "other", "row_number": 70664, "definition": "To possess as something which appertains to is connected with or affects one.", "details": []}, {"x": -0.5790485876294548, "y": -0.6982464680225541, "z": -0.4208973782982761, "word": "Headed", "pos_group": "adjective", "row_number": 70851, "definition": "Furnished with a head (commonly as denoting intellectual faculties); -- used in composition; as clear-headed long-headed thick-headed; a many-headed monster.", "details": []}, {"x": -0.520464280432421, "y": -0.8188639652386518, "z": -0.2420304510337374, "word": "Heat", "pos_group": "noun", "row_number": 71076, "definition": "A force in nature which is recognized in various effects but especially in the phenomena of fusion and evaporation and which as manifested in fire the sun's rays mechanical action chemical combination etc. becomes directly known to us through the sense of feeling. In its nature heat is a mode if motion being in general a form of molecular disturbance or vibration. It was formerly supposed to be a subtile imponderable fluid to which was given the name caloric.", "details": []}, {"x": -0.67936432782276, "y": -0.6712186449098154, "z": -0.296529325375013, "word": "Hebraistically", "pos_group": "adverb", "row_number": 71214, "definition": "In a Hebraistic sense or form.", "details": []}, {"x": -0.5035476057359647, "y": -0.7683120720473001, "z": -0.39514094789576254, "word": "Hegelism", "pos_group": "noun", "row_number": 71357, "definition": "The system of logic and philosophy set forth by Hegel a German writer (1770-1831).", "details": []}, {"x": -0.6038919481008843, "y": -0.7728208619671155, "z": -0.19509595159132218, "word": "Heliotypic", "pos_group": "adjective", "row_number": 71450, "definition": "Relating to or obtained by heliotypy.", "details": []}, {"x": -0.631804261645701, "y": -0.668972395307565, "z": -0.39153455694585826, "word": "Hemadynamics", "pos_group": "noun", "row_number": 71607, "definition": "The principles of dynamics in their application to the blood; that part of science which treats of the motion of the blood.", "details": []}, {"x": -0.49017631654935934, "y": -0.8176599514186806, "z": -0.30192612099668237, "word": "Hematology", "pos_group": "noun", "row_number": 71636, "definition": "The science which treats of the blood.", "details": []}, {"x": -0.6711826191197399, "y": -0.702211474880981, "z": -0.23751407608191094, "word": "Hendiadys", "pos_group": "noun", "row_number": 71774, "definition": "A figure in which the idea is expressed by two nouns connected by and instead of by a noun and limiting adjective; as we drink from cups and gold for golden cups.", "details": []}, {"x": -0.5458678707975587, "y": -0.723707186666074, "z": -0.4222276348118584, "word": "Henogenesis", "pos_group": "noun", "row_number": 71791, "definition": "Same as Ontogeny.", "details": []}, {"x": -0.5495764973018922, "y": -0.8075264100114025, "z": -0.21416528838138038, "word": "Hepatology", "pos_group": "noun", "row_number": 71829, "definition": "The science which treats of the liver; a treatise on the liver.", "details": []}, {"x": -0.6695170536896047, "y": -0.6623291092014161, "z": -0.336254466027218, "word": "Heptavalent", "pos_group": "adjective", "row_number": 71862, "definition": "Having seven units of attractive force or affinity; -- said of heptad elements or radicals.", "details": []}, {"x": -0.4888331959419688, "y": -0.7926415630342261, "z": -0.36436445915569143, "word": "Herald", "pos_group": "noun", "row_number": 71879, "definition": "A forerunner; a a precursor; a harbinger.", "details": []}, {"x": -0.6353524561229726, "y": -0.7456887654815919, "z": -0.20068762177335583, "word": "Hereafter", "pos_group": "noun", "row_number": 71975, "definition": "A future existence or state.", "details": []}, {"x": -0.6000096858289212, "y": -0.6845184103769828, "z": -0.41403251414164083, "word": "Heredity", "pos_group": "noun", "row_number": 71988, "definition": "Hereditary transmission of the physical and psychical qualities of parents to their offspring; the biological law by which living beings tend to repeat their characteristics in their descendants. See Pangenesis.", "details": []}, {"x": -0.5054926512816866, "y": -0.8217456690498615, "z": -0.26308028222960106, "word": "Hermaphrodite", "pos_group": "noun", "row_number": 72041, "definition": "An individual which has the attributes of both male and female or which unites in itself the two sexes; an animal or plant having the parts of generation of both sexes as when a flower contains both the stamens and pistil within the same calyx or on the same receptacle. In some cases reproduction may take place without the union of the distinct individuals. In the animal kingdom true hermaphrodites are found only among the invertebrates. See Illust. in Appendix under Helminths.", "details": []}, {"x": -0.6803023848830612, "y": -0.6804899741770161, "z": -0.27225366878516666, "word": "Hermetical", "pos_group": "adjective", "row_number": 72053, "definition": "Of pertaining to or taught by Hermes Trismegistus; as hermetic philosophy. Hence: Alchemical; chemic.", "details": []}, {"x": -0.5169776401987713, "y": -0.7515320303768264, "z": -0.4097971777015975, "word": "Heroic", "pos_group": "adjective", "row_number": 72085, "definition": "Larger than life size but smaller than colossal; -- said of the representation of a human figure.", "details": []}, {"x": -0.5829681858138049, "y": -0.7880805821427279, "z": -0.1976792613769583, "word": "Heterocarpous", "pos_group": "adjective", "row_number": 72179, "definition": "Characterized by heterocarpism.", "details": []}, {"x": -0.6490615468360643, "y": -0.6630364251035725, "z": -0.37296354701853934, "word": "Heterochrony", "pos_group": "noun", "row_number": 72186, "definition": "In evolution a deviation from the typical sequence in the formation of organs or parts.", "details": []}, {"x": -0.4854870655973901, "y": -0.8109271864776902, "z": -0.32664875228448786, "word": "Heterogamy", "pos_group": "noun", "row_number": 72209, "definition": "The process of fertilization in plants by an indirect or circuitous method; -- opposed to orthogamy.", "details": []}, {"x": -0.6606576679905687, "y": -0.7178685808958665, "z": -0.2195362072365703, "word": "Heterogamy", "pos_group": "noun", "row_number": 72210, "definition": "That form of alternate generation in which two kinds of sexual generation or a sexual and a parthenogenetic generation alternate; -- in distinction from metagenesis where sexual and asexual generations alternate.", "details": []}, {"x": -0.5659184394990705, "y": -0.707128837228865, "z": -0.4239164155753939, "word": "Heterogene", "pos_group": "adjective", "row_number": 72212, "definition": "Heterogenous.", "details": []}, {"x": -0.5303582316099678, "y": -0.8160972027204986, "z": -0.22957678862490663, "word": "Heterogeneal", "pos_group": "adjective", "row_number": 72213, "definition": "Heterogeneous.", "details": []}, {"x": -0.6776318149397946, "y": -0.6660597821662407, "z": -0.3117362506383554, "word": "Heterogeneous", "pos_group": "adjective", "row_number": 72215, "definition": "Differing in kind; having unlike qualities; possessed of different characteristics; dissimilar; -- opposed to homogeneous and said of two or more connected objects or of a conglomerate mass considered in respect to the parts of which it is made up.", "details": []}, {"x": -0.4959253639698492, "y": -0.7783419568480252, "z": -0.38502185857605475, "word": "Heterogenesis", "pos_group": "noun", "row_number": 72216, "definition": "Spontaneous generation so called.", "details": []}, {"x": -0.6165963768205522, "y": -0.7628344977402584, "z": -0.1946597984924855, "word": "Heterogenesis", "pos_group": "noun", "row_number": 72217, "definition": "That method of reproduction in which the successive generations differ from each other the parent organism producing offspring different in habit and structure from itself the original form however reappearing after one or more generations; -- opposed to homogenesis or gamogenesis.", "details": []}, {"x": -0.6204123073144208, "y": -0.6733173034408659, "z": -0.4021596422068199, "word": "Heterogenetic", "pos_group": "adjective", "row_number": 72218, "definition": "Relating to heterogenesis; as heterogenetic transformations.", "details": []}, {"x": -0.49399332409827557, "y": -0.8208932665364977, "z": -0.2865394225955215, "word": "Heterogenist", "pos_group": "noun", "row_number": 72219, "definition": "One who believes in the theory of spontaneous generation or heterogenesis.", "details": []}, {"x": -0.6766767072370728, "y": -0.6927411923648429, "z": -0.24943591217731415, "word": "Heterogenous", "pos_group": "adjective", "row_number": 72220, "definition": "Of or pertaining to heterogenesis; heterogenetic.", "details": []}, {"x": -0.5336653416664913, "y": -0.7340931234192605, "z": -0.4198911635799704, "word": "Heterogeny", "pos_group": "noun", "row_number": 72221, "definition": "Heterogenesis.", "details": []}, {"x": -0.5618060843589254, "y": -0.8013299119294426, "z": -0.20553417191416984, "word": "Heterogonous", "pos_group": "adjective", "row_number": 72222, "definition": "Characterized by heterogony.", "details": []}, {"x": -0.6634100044622135, "y": -0.6607259045874001, "z": -0.35118149863938986, "word": "Heterologous", "pos_group": "adjective", "row_number": 72227, "definition": "Characterized by heterology; consisting of different elements or of like elements in different proportions; different; -- opposed to homologous; as heterologous organs.", "details": []}, {"x": -0.4853278368358576, "y": -0.8008579356130714, "z": -0.3508325209523727, "word": "Heterology", "pos_group": "noun", "row_number": 72228, "definition": "The absence of correspondence or relation in type of structure; lack of analogy between parts owing to their being composed of different elements or of like elements in different proportions; variation in structure from the normal form; -- opposed to homology.", "details": []}, {"x": -0.646360907500411, "y": -0.7348195112334889, "z": -0.20556717433924537, "word": "Heterology", "pos_group": "noun", "row_number": 72229, "definition": "The connection or relation of bodies which have partial identity of composition but different characteristics and properties; the relation existing between derivatives of the same substance or of the analogous members of different series; as ethane ethyl alcohol acetic aldehyde and acetic acid are in heterology with each other though each in at the same time a member of a distinct homologous series. Cf. Homology.", "details": []}, {"x": -0.586999704336362, "y": -0.6919811227471085, "z": -0.42023026172644307, "word": "Heteromorphy", "pos_group": "noun", "row_number": 72237, "definition": "The state or quality of being heteromorphic.", "details": []}, {"x": -0.5133944835356593, "y": -0.8212624731165794, "z": -0.2489057141280476, "word": "Heteroousian", "pos_group": "adjective", "row_number": 72246, "definition": "Having different essential qualities; of a different nature.", "details": []}, {"x": -0.6813889155766697, "y": -0.6733828456943809, "z": -0.2868182156938219, "word": "Heteroousious", "pos_group": "adjective", "row_number": 72248, "definition": "See Heteroousian.", "details": []}, {"x": -0.5071900165466213, "y": -0.7621509747495678, "z": -0.4023483301863219, "word": "Heteroplasm", "pos_group": "noun", "row_number": 72257, "definition": "An abnormal formation foreign to the economy and composed of elements different from those are found in it in its normal condition.", "details": []}, {"x": -0.5960460498857832, "y": -0.7791751616525829, "z": -0.19394631700351017, "word": "Heterotaxy", "pos_group": "noun", "row_number": 72274, "definition": "Variation in arrangement from that existing in a normal form; heterogenous arrangement or structure as in botany the deviation in position of the organs of a plant from the ordinary or typical arrangement.", "details": []}, {"x": -0.6392859620378355, "y": -0.6651969839787978, "z": -0.38578028882625715, "word": "Heterotopy", "pos_group": "noun", "row_number": 72276, "definition": "A deviation from the natural position; -- a term applied in the case of organs or growths which are abnormal in situation.", "details": []}, {"x": -0.48654553350308044, "y": -0.816301564107338, "z": -0.3113281231500234, "word": "Heterotopy", "pos_group": "noun", "row_number": 72277, "definition": "A deviation from the natural position of parts supposed to be effected in thousands of years by the gradual displacement of germ cells.", "details": []}, {"x": -0.6686040847111843, "y": -0.7074256513174522, "z": -0.229167025912538, "word": "Hexahemeron", "pos_group": "noun", "row_number": 72329, "definition": "The history of the six day's work of creation as contained in the first chapter of Genesis.", "details": []}, {"x": -0.5528586839614789, "y": -0.7168070046477032, "z": -0.42489409698931974, "word": "Hexicology", "pos_group": "noun", "row_number": 72361, "definition": "The science which treats of the complex relations of living creatures to other organisms and to their surrounding conditions generally.", "details": []}, {"x": -0.5413981981624826, "y": -0.8119185553970362, "z": -0.21834891899985875, "word": "Hierarchies", "pos_group": "other", "row_number": 72449, "definition": "of Hierarchy", "details": []}, {"x": -0.6741380133767829, "y": -0.662187852152084, "z": -0.32717760831483306, "word": "Hierological", "pos_group": "adjective", "row_number": 72472, "definition": "Pertaining to hierology.", "details": []}, {"x": -0.48975506537325963, "y": -0.7878861564444213, "z": -0.37333012257849146, "word": "Hierology", "pos_group": "noun", "row_number": 72474, "definition": "A treatise on sacred things; especially the science which treats of the ancient writings and inscriptions of the Egyptians or a treatise on that science.", "details": []}, {"x": -0.6289213072292499, "y": -0.7522769168992287, "z": -0.19630952502016427, "word": "High", "pos_group": "other", "row_number": 72501, "definition": "Very abstract; difficult to comprehend or surmount; grand; noble.", "details": []}, {"x": -0.6081272813077402, "y": -0.6789912701293831, "z": -0.4112810046882107, "word": "Hippocratism", "pos_group": "noun", "row_number": 72724, "definition": "The medical philosophy or system of Hippocrates.", "details": []}, {"x": -0.49950798243968175, "y": -0.8227373821917937, "z": -0.27128393874911433, "word": "Histogeny", "pos_group": "noun", "row_nu all axes are equal. See under Promorphology.", "details": []}, {"x": -0.6806971181990168, "y": -0.66739264358296, "z": -0.3020571015005304, "word": "Homiform", "pos_group": "adjective", "row_number": 73359, "definition": "In human form.", "details": []}, {"x": -0.4986090689251019, "y": -0.7725878082020404, "z": -0.3930611593673562, "word": "Homocategoric", "pos_group": "adjective", "row_number": 73376, "definition": "Belonging to the same category of individuality; -- a morphological term applied to organisms so related.", "details": []}, {"x": -0.609123358124377, "y": -0.7694207533593242, "z": -0.19225097889803244, "word": "Homodemic", "pos_group": "adjective", "row_number": 73382, "definition": "A morphological term signifying development in the case of multicellular organisms from the same unit deme or unit of the inferior orders of individuality.", "details": []}, {"x": -0.6283036536218342, "y": -0.668792620161381, "z": -0.3974304342436913, "word": "Homodermic", "pos_group": "adjective", "row_number": 73383, "definition": "Relating to homodermy; originating from the same germ layer.", "details": []}, {"x": -0.48938518113931, "y": -0.8204083171262083, "z": -0.2956895968264485, "word": "Homoeomeria", "pos_group": "noun", "row_number": 73392, "definition": "The state or quality of being homogeneous in elements or first principles; likeness or identity of parts.", "details": []}, {"x": -0.6751302016357587, "y": -0.6974169924486676, "z": -0.24043450144086048, "word": "Homoeomerical", "pos_group": "adjective", "row_number": 73394, "definition": "Pertaining to or characterized by sameness of parts; receiving or advocating the doctrine of homogeneity of elements or first principles.", "details": []}, {"x": -0.5401120563077152, "y": -0.7271132050729348, "z": -0.4237751215439808, "word": "Homoeomorphous", "pos_group": "adjective", "row_number": 73398, "definition": "Manifesting homoeomorphism.", "details": []}, {"x": -0.5533977104105254, "y": -0.8063787726970584, "z": -0. 32759, "z": -0.40906404779924843, "word": "Homographic", "pos_group": "adjective", "row_number": 73423, "definition": "Possessing the property of homography.", "details": []}, {"x": -0.5878716075497495, "y": -0.7854367683535532, "z": -0.19363898356271161, "word": "Homological", "pos_group": "adjective", "row_number": 73434, "definition": "Pertaining to homology; having a structural affinity proceeding from or base upon that kind of relation termed homology.", "details": []}, {"x": -0.6465652784218755, "y": -0.6618936053598512, "z": -0.37927588365592124, "word": "Homologinic", "pos_group": "adjective", "row_number": 73435, "definition": "Pertaining to or characterized by homology; as homologinic qualities or differences.", "details": []}, {"x": -0.4835422582704835, "y": -0.8143401358756466, "z": -0.3209938123526913, "word": "Homologize", "pos_group": "other", "row_number": 73436, "definition": "To determine the homologies or structural relations of.", "details": []}, {"x": -0.6653028853434493, "y": -0.7130572752072922, "z": -0.22118180989320277, "word": "Homologous", "pos_group": "adjective", "row_number": 73442, "definition": "Characterized by homology; belonging to the same type or series; corresponding in composition and properties. See Homology 3.", "details": []}, {"x": -0.5602877239539893, "y": -0.7098949259608988, "z": -0.42676323703129393, "word": "Homologous", "pos_group": "adjective", "row_number": 73443, "definition": "Being of the same typical structure; having like relations to a fundamental type to structure; as those bones in the hand of man and the fore foot of a horse are homologous that correspond in their structural relations that is in their relations to the type structure of the fore limb in vertebrates.", "details": []}, {"x": -0.5332969687947837, "y": -0.8159109342000708, "z": -0.22334657043944828, "word": "Homologue", "pos_group": "noun", "row_number": 73445, "definition": "That which is homologous to something else; as the corresponding sides etc. of similar polygons are the homologues of each other; the members or terms of an homologous series in chemistry are the homologues of each other; one of the bones in the hand of man is the homologue of that in the paddle of a whale.", "details": []}, {"x": -0.6782071254239745, "y": -0.6626484577580765, "z": -0.3176981530556829, "word": "Homology", "pos_group": "noun", "row_number": 73447, "definition": "Correspondence or relation in type of structure in contradistinction to similarity of function; as the relation in structure between the leg and arm of a man; or that between the arm of a man the fore leg of a horse the wing of a bird and the fin of a fish all these organs being modifications of one type of structure.", "details": []}, {"x": -0.49141399205706415, "y": -0.7826434820080961, "z": -0.38207521312011683, "word": "Homology", "pos_group": "noun", "row_number": 73448, "definition": "The correspondence or resemblance of substances belonging to the same type or series; a similarity of composition varying by a small regular difference and usually attended by a regular variation in physical properties; as there is an homology between methane CH4 ethane C2H6 propane C3H8 etc. all members of the paraffin series. In an extended sense the term is applied to the relation between chemical elements of the same group; as", "details": []}, {"x": -0.6219555905155856, "y": -0.7589818680817905, "z": -0.19265971906313212, "word": "Homomorphous", "pos_group": "adjective", "row_number": 73451, "definition": "Characterized by homomorphism.", "details": []}, {"x": -0.6162960832961574, "y": -0.6737797940903755, "z": -0.40767625242261396, "word": "Homomorphy", "pos_group": "noun", "row_number": 73455, "definition": "Similarity of form; resemblance in external characters while widely different in fundamental structure; resemblance in geometric ground form. See Homophyly Promorphology.", "details": []}, {"x": -0.4939829629340775, "y": -0.8231470553279606, "z": -0.28001742380747 lozoist", "pos_group": "noun", "row_number": 75156, "definition": "A believer in hylozoism.", "details": []}, {"x": -0.4812053528705625, "y": -0.8117760098172183, "z": -0.33084908682653635, "word": "Hyperphysical", "pos_group": "adjective", "row_number": 75298, "definition": "Above or transcending physical laws; supernatural.", "details": []}, {"x": -0.661287849777762, "y": -0.7190685046490741, "z": -0.21363254751570243, "word": "Hypnology", "pos_group": "noun", "row_number": 75329, "definition": "A treatise on sleep; the doctrine of sleep.", "details": []}, {"x": -0.5681030970371417, "y": -0.7030264097315484, "z": -0.42779988120238777, "word": "Hypnotism", "pos_group": "noun", "row_number": 75335, "definition": "A form of sleep or somnambulism brought on by artificial means in which there is an unusual suspension of some powers and an unusual activity of others. It is induced by an action upon the nerves through the medium of the senses as in persons of very feeble organization by gazing steadly at a very bright object held before the eyes or by pressure upon certain points of the surface of the body.", "details": []}, {"x": -0.5253405013298114, "y": -0.8194596182243069, "z": -0.22913596784925624, "word": "Hypostasis", "pos_group": "noun", "row_number": 75439, "definition": "That which forms the basis of anything; underlying principle; a concept or mental entity conceived or treated as an existing being or thing.", "details": []}, {"x": -0.6816764788348156, "y": -0.6637202267676852, "z": -0.307884132073772, "word": "Hypostasize", "pos_group": "other", "row_number": 75443, "definition": "To make into a distinct substance; to conceive or treat as an existing being; to hypostatize.", "details": []}, {"x": -0.49381291311703357, "y": -0.7769437662385328, "z": -0.39052169074451354, "word": "Hypostatical", "pos_group": "adjective", "row_number": 75445, "definition": "Relating to hypostasis or substance; hence constitutive or elementary.", "details": []}, {"x": -0.61449890  75714, "definition": "Hence: Any object apprehended conceived or thought of by the mind; a notion conception or thought; the real object that is conceived or thought of.", "details": []}, {"x": -0.669819963028256, "y": -0.7081549510417477, "z": -0.2232885631730505, "word": "Idea", "pos_group": "noun", "row_number": 75717, "definition": "A rational conception; the complete conception of an object when thought of in all its essential elements or constituents; the necessary metaphysical or constituent attributes and relations when conceived in the abstract.", "details": []}, {"x": -0.5545001303993459, "y": -0.7129384516650092, "z": -0.42924162137962324, "word": "Idea", "pos_group": "noun", "row_number": 75718, "definition": "A fiction object or picture created by the imagination; the same when proposed as a pattern to be copied or a standard to be reached; one of the archetypes or patterns of created things conceived by the Platonists to have excited objectively from eternity in the mind of the Deity.", "details": []}, {"x": -0.5365959910362187, "y": -0.8154074342198685, "z": -0.21719912205814526, "word": "Idealism", "pos_group": "noun", "row_number": 75728, "definition": "The system or theory that denies the existence of material bodies and teaches that we have no rational grounds to believe in the reality of anything but ideas and their relations.", "details": []}, {"x": -0.6784086439054078, "y": -0.6594286329307477, "z": -0.3239067611914126, "word": "Idealization", "pos_group": "noun", "row_number": 75737, "definition": "The representation of natural objects scenes etc. in such a way as to show their most important characteristics; the study of the ideal.", "details": []}, {"x": -0.48709450053493003, "y": -0.7869807115577959, "z": -0.37868233017215425, "word": "Ideate", "pos_group": "noun", "row_number": 75748, "definition": "The actual existence supposed to correspond with an idea; the correlate in real existence to the idea as a thought or existence.", "details": []}, {"x": -0.6274062893952678, "y": -0.7548860845138001, "z": -0.19107157673156241, "word": "Ideational", "pos_group": "adjective", "row_number": 75752, "definition": "Pertaining to or characterized by ideation.", "details": []}, {"x": -0.6118538383051569, "y": -0.6745662168966632, "z": -0.4130318384494962, "word": "Identical", "pos_group": "adjective", "row_number": 75755, "definition": "The same; the selfsame; the very same; not different; as the identical person or thing.", "details": []}, {"x": -0.4943627800719318, "y": -0.8251671450492801, "z": -0.2733214671605047, "word": "Identism", "pos_group": "noun", "row_number": 75766, "definition": "The doctrine taught by Schelling that matter and mind and subject and object are identical in the Absolute; -- called also the system / doctrine of identity.", "details": []}, {"x": -0.6832513788279283, "y": -0.6833492117701968, "z": -0.2572963429642669, "word": "Ideogeny", "pos_group": "noun", "row_number": 75773, "definition": "The science which treats of the origin of ideas.", "details": []}, {"x": -0.5221510201929878, "y": -0.741839473848573, "z": -0.42075231092828774, "word": "Ideology", "pos_group": "noun", "row_number": 75784, "definition": "The science of ideas.", "details": []}, {"x": -0.5707747252582527, "y": -0.7974608468718596, "z": -0.1956333578733002, "word": "Ideology", "pos_group": "noun", "row_number": 75785, "definition": "A theory of the origin of ideas which derives them exclusively from sensation.", "details": []}, {"x": -0.6602535524108244, "y": -0.6568485153072692, "z": -0.36416380169852536, "word": "Idioblast", "pos_group": "noun", "row_number": 75790, "definition": "An individual cell differing greatly from its neighbours in regard to size structure or contents.", "details": []}, {"x": -0.47956865276238836, "y": -0.8086146203714134, "z": -0.3408171107929633, "word": "Idiomorphous", "pos_group": "adjective", "row_number": 75810, "definition": "Having a form of its own.", "details": []}, {"x": -0.656 taining to impetigo.", "details": []}, {"x": -0.47919835535267274, "y": -0.8152897858990554, "z": -0.32507153249087456, "word": "Imponderable", "pos_group": "noun", "row_number": 77054, "definition": "An imponderable substance or body; specifically in the plural a name formerly applied to heat light electricity and magnetism regarded as subtile fluids destitute of weight but in modern science little used.", "details": []}, {"x": -0.6660627454231024, "y": -0.7141480839090034, "z": -0.2152973139835673, "word": "Impotent", "pos_group": "adjective", "row_number": 77165, "definition": "Wanting the power of procreation; unable to copulate; also sometimes sterile; barren.", "details": []}, {"x": -0.5623447750636903, "y": -0.7058539713363882, "z": -0.43074183115552755, "word": "Impregnable", "pos_group": "adjective", "row_number": 77202, "definition": "Capable of being impregnated as the egg of an animal or the ovule of a plant.", "details": []}, {"x": -0.5283387476162622, "y": -0.8192935480558844, "z": -0.22274705358607993, "word": "Impregnant", "pos_group": "noun", "row_number": 77203, "definition": "That which impregnates.", "details": []}, {"x": -0.6822930473472538, "y": -0.6602192054313561, "z": -0.31398534730332045, "word": "Impregnate", "pos_group": "other", "row_number": 77209, "definition": "To infuse an active principle into; to render fruitful or fertile in any way; to fertilize; to imbue.", "details": []}, {"x": -0.48918243677353096, "y": -0.7813588401876495, "z": -0.3875292329785225, "word": "Impregnation", "pos_group": "noun", "row_number": 77214, "definition": "The fusion of a female germ cell (ovum) with a male germ cell (in animals a spermatozoon) to form a single new cell endowed with the power of developing into a new individual; fertilization; fecundation.", "details": []}, {"x": -0.6199935833052341, "y": -0.7618211386953201, "z": -0.18771390278107158, "word": "Imputable", "pos_group": "adjective", "row_number": 77443, "definition": "That may be imputed;
