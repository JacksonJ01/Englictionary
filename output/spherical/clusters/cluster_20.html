use and effect.", "details": []}, {"x": -0.4600871040913138, "y": -0.7845786310565898, "z": -0.41563954135553105, "word": "Schesis", "pos_group": "noun", "row_number": 135497, "definition": "General state or disposition of the body or mind or of one thing with regard to other things; habitude.", "details": []}, {"x": -0.6218875708326729, "y": -0.7690265150680843, "z": -0.1478312158039518, "word": "Schizocoelous", "pos_group": "adjective", "row_number": 135525, "definition": "Pertaining to or of the nature of a schizocoele.", "details": []}, {"x": -0.6344494973504259, "y": -0.6401767569641654, "z": -0.4331830504009084, "word": "Schizogenesis", "pos_group": "noun", "row_number": 135526, "definition": "Reproduction by fission.", "details": []}, {"x": -0.4540353877715864, "y": -0.8457807277526537, "z": -0.2801906979421278, "word": "Sciagraphical", "pos_group": "adjective", "row_number": 135633, "definition": "Pertaining to sciagraphy.", "details": []}, {"x": -0.7075770403262106, "y": -0.671392198854753, "z": -0.2203797797443765, "word": "Science", "pos_group": "noun", "row_number": 135646, "definition": "Accumulated and established knowledge which has been systematized and formulated with reference to the discovery of general truths or the operation of general laws; knowledge classified and made available in work life or the search for truth; comprehensive profound or philosophical knowledge.", "details": []}, {"x": -0.5140679874399897, "y": -0.7229153594891348, "z": -0.46165732670899273, "word": "Science", "pos_group": "noun", "row_number": 135647, "definition": "Especially such knowledge when it relates to the physical world and its phenomena the nature constitution and forces of matter the qualities and functions of living tissues etc.; -- called also natural science and physical science.", "details": []}, {"x": -0.5458398771776325, "y": -0.8213642844593122, "z": -0.16558846788755957, "word": "Science", "pos_group": "noun", "row_number": 135648, "definition": "Any branch or department of systematized knowledge considered as a distinct field of investigation or object of study; as the science of astronomy of chemistry or of mind.", "details": []}, {"x": -0.692555528026875, "y": -0.6245839392087502, "z": -0.36091791792857364, "word": "Sciential", "pos_group": "adjective", "row_number": 135653, "definition": "Pertaining to or producing science.", "details": []}, {"x": -0.4443422696261498, "y": -0.8163385109164218, "z": -0.3689869686293016, "word": "Scientific", "pos_group": "adjective", "row_number": 135655, "definition": "Agreeing with or depending on the rules or principles of science; as a scientific classification; a scientific arrangement of fossils.", "details": []}, {"x": -0.6636791244121171, "y": -0.7303390958582338, "z": -0.1616626885850392, "word": "Scientific", "pos_group": "adjective", "row_number": 135656, "definition": "Having a knowledge of science or of a science; evincing science or systematic knowledge; as a scientific chemist; a scientific reasoner; a scientific argument.", "details": []}, {"x": -0.5884531096076746, "y": -0.6653384798597632, "z": -0.4593992218223245, "word": "Scientifical", "pos_group": "adjective", "row_number": 135657, "definition": "Scientific.", "details": []}, {"x": -0.4799702302369068, "y": -0.8472390753593849, "z": -0.22762804587858954, "word": "Scientifically", "pos_group": "adverb", "row_number": 135658, "definition": "In a scientific manner; according to the rules or principles of science.", "details": []}, {"x": -0.7152351532599778, "y": -0.6439373954788267, "z": -0.27163082712593806, "word": "Scintillation", "pos_group": "noun", "row_number": 135679, "definition": "The act of scintillating.", "details": []}, {"x": -0.47672267504498816, "y": -0.7618230818148891, "z": -0.43858988031190976, "word": "Scintillation", "pos_group": "noun", "row_number": 135680, "definition": "A spark or flash emitted in scintillating.", "details": []}, {"x": -0.5931622406891153, "y": -0.7913088614628285, "z": -0.1482863513310321, "word": "Sciolism", "pos_group": "noun", "row_number": 135684, "definition": "The knowledge of a sciolist; superficial knowledge.", "details": []}, {"x": -0.6600108088162581, "y": -0.6298619592325735, "z": -0.40946262901199265, "word": "Sciolistic", "pos_group": "adjective", "row_number": 135686, "definition": "Of or pertaining to sciolism or a sciolist; partaking of sciolism; resembling a sciolist.", "details": []}, {"x": -0.44490183125935073, "y": -0.8384908016150862, "z": -0.3146355608461421, "word": "Scioptric", "pos_group": "adjective", "row_number": 135696, "definition": "Scioptic.", "details": []}, {"x": -0.6953098139459493, "y": -0.6922518575757917, "z": -0.19321394440701006, "word": "Scissiparity", "pos_group": "noun", "row_number": 135717, "definition": "Reproduction by fission.", "details": []}, {"x": -0.5411331524579015, "y": -0.6992267143958183, "z": -0.4671797439810531, "word": "Sclavism", "pos_group": "noun", "row_number": 135734, "definition": "Same as Slavism.", "details": []}, {"x": -0.5180227555583364, "y": -0.8352248119669172, "z": -0.18453167261631734, "word": "Scoundreldom", "pos_group": "noun", "row_number": 136008, "definition": "The domain or sphere of scoundrels; scoundrels collectively; the state ideas or practices of scoundrels.", "details": []}, {"x": -0.7063430413578462, "y": -0.6276252793400351, "z": -0.3273622101872646, "word": "Scrappy", "pos_group": "adjective", "row_number": 136128, "definition": "Consisting of scraps; fragmentary; lacking unity or consistency; as a scrappy lecture.", "details": []}, {"x": -0.4516670752644148, "y": -0.7977731256753938, "z": -0.3994432288476074, "word": "Second", "pos_group": "adjective", "row_number": 137114, "definition": "Being of the same kind as another that has preceded; another like a protype; as a second Cato; a second Troy; a second deluge.", "details": []}, {"x": -0.6389139417108609, "y": -0.7544686701639569, "z": -0.15021984166055052, "word": "Secret", "pos_group": "adjective", "row_number": 137165, "definition": "A thing not discovered; what is unknown or unexplained; a mystery.", "details": []}, {"x": -0.6174878517255041, "y": -0.6481069527086513, "z": -0.44571978957875313, "word": "Secular", "pos_group": "adjective", "row_number": 137238, "definition": "Of or pertaining to this present world or to things not spiritual or holy; relating to temporal as distinguished from eternal interests; not immediately or primarily respecting the soul but the body; worldly.", "details": []}, {"x": -0.46175131678665726, "y": -0.8483037035271309, "z": -0.25916509801271764, "word": "Secularize", "pos_group": "other", "row_number": 137253, "definition": "To make worldly or unspiritual.", "details": []}, {"x": -0.7128944045765546, "y": -0.6593934138619546, "z": -0.23870880519770638, "word": "Seizin", "pos_group": "noun", "row_number": 137542, "definition": "The thing possessed; property.", "details": []}, {"x": -0.49823509485526984, "y": -0.7377469287093734, "z": -0.45551208483908195, "word": "Self-action", "pos_group": "noun", "row_number": 137624, "definition": "Action by or originating in one's self or itself.", "details": []}, {"x": -0.5636049324956306, "y": -0.8111470189673025, "z": -0.15617296080645507, "word": "Self-bern", "pos_group": "adjective", "row_number": 137644, "definition": "Born or produced by one's self.", "details": []}, {"x": -0.6819203888395553, "y": -0.6244736782657652, "z": -0.3808112504090908, "word": "Self-conscious", "pos_group": "adjective", "row_number": 137666, "definition": "Conscious of one's acts or state as belonging to or originating in one's self.", "details": []}, {"x": -0.44198711772617555, "y": -0.826379359781609, "z": -0.3489191045085463, "word": "Self-created", "pos_group": "adjective", "row_number": 137680, "definition": "Created by one's self; not formed or constituted by another.", "details": []}, {"x": -0.6775228931859586, "y": -0.715294846919333, "z": -0.17121919045357095, "word": "Self-existence", "pos_group": "noun", "row_number": 137720, "definition": "Inherent existence; existence possessed by virtue of a being's own nature and independent of any other being or cause; -- an attribute peculiar to God.", "details": []}, {"x": -0.5701185911626999, "y": -0.6771412329307861, "z": -0.46523600750117466, "word": "Self-existent", "pos_group": "adjective", "row_number": 137721, "definition": "Existing of or by himself independent of any other being or cause; -- as God is the only self-existent being.", "details": []}, {"x": -0.492895288431438, "y": -0.8445363766219277, "z": -0.20931446009388555, "word": "Self-luminous", "pos_group": "adjective", "row_number": 137763, "definition": "Possessing in itself the property of emitting light.", "details": []}, {"x": -0.714242132557106, "y": -0.6357727238541573, "z": -0.29266229631324725, "word": "Self-propagating", "pos_group": "adjective", "row_number": 137785, "definition": "Propagating by one's self or by itself.", "details": []}, {"x": -0.4649867690700129, "y": -0.7762270159400916, "z": -0.42574514009507053, "word": "Self-repelling", "pos_group": "adjective", "row_number": 137793, "definition": "Made up of parts as molecules or atoms which mutually repel each other; as gases are self-repelling.", "details": []}, {"x": -0.6111970712441648, "y": -0.7778866666166856, "z": -0.1460495600901854, "word": "Semiglutin", "pos_group": "noun", "row_number": 137986, "definition": "A peptonelike body insoluble in alcohol formed by boiling collagen or gelatin for a long time in water. Hemicollin a like body is also formed at the same time and differs from semiglutin by being partly soluble in alcohol.", "details": []}, {"x": -0.6448790047664363, "y": -0.6349071058829526, "z": -0.42546919525481974, "word": "Seminal", "pos_group": "adjective", "row_number": 138011, "definition": "Contained in seed; holding the relation of seed source or first principle; holding the first place in a series of developed results or consequents; germinal; radical; primary; original; as seminal principles of generation; seminal virtue.", "details": []}, {"x": -0.44890977781584185, "y": -0.8441333746560159, "z": -0.2931191859520248, "word": "Seminary", "pos_group": "noun", "row_number": 138020, "definition": "Seminal state.", "details": []}, {"x": -0.7042661489191623, "y": -0.6785378338738184, "z": -0.20879559259811678, "word": "Seminist", "pos_group": "noun", "row_number": 138034, "definition": "A believer in the old theory that the newly created being is formed by the admixture of the seed of the male with the supposed seed of the female.", "details": []}, {"x": -0.5236421816637399, "y": -0.7134675123715148, "z": -0.46557810770357444, "word": "Sensationalism", "pos_group": "noun", "row_number": 138208, "definition": "The doctrine held by Condillac and by some ascribed to Locke that our ideas originate solely in sensation and consist of sensations transformed; sensualism; -- opposed to intuitionalism and rationalism.", "details": []}, {"x": -0.5345931058327437, "y": -0.8275950492006725, "z": -0.1711626294920637, "word": "Sense", "pos_group": "other", "row_number": 138212, "definition": "A faculty possessed by animals of perceiving external objects by means of impressions made upon certain organs (sensory or sense organs) of the body or of perceiving changes in the condition of the body; as the senses of sight smell hearing taste and touch. See Muscular sense under Muscular and Temperature sense under Temperature.", "details": []}, {"x": -0.6991290467048272, "y": -0.624289379355282, "z": -0.34854174337917726, "word": "Sensual", "pos_group": "adjective", "row_number": 138270, "definition": "Pertaining to consisting in or affecting the sense or bodily organs of perception; relating to or concerning the body in distinction from the spirit.", "details": []}, {"x": -0.4454607814966119, "y": -0.8099834800823529, "z": -0.3814334203266784, "word": "Sensualism", "pos_group": "noun", "row_number": 138275, "definition": "The doctrine that all our ideas or the operations of the understanding not only originate in sensation but are transformed sensations copies or relics of sensations; sensationalism; sensism.", "details": []}, {"x": -0.6550158544982093, "y": -0.739451373994527, "z": -0.15545383833661697, "word": "Sequence", "pos_group": "noun", "row_number": 138522, "definition": "Simple succession or the coming after in time without asserting or implying causative energy; as the reactions of chemical agents may be conceived as merely invariable sequences.", "details": []}, {"x": -0.5996752944464974, "y": -0.6576995841598658, "z": -0.45587366476519137, "word": "Series", "pos_group": "noun", "row_number": 138641, "definition": "A number of things or events standing or succeeding in order and connected by a like relation; sequence; order; course; a succession of things; as a continuous series of calamitous events.", "details": []}, {"x": -0.4716473856255205, "y": -0.8488342135172251, "z": -0.23880791778164595, "word": "Set", "pos_group": "noun", "row_number": 138932, "definition": "A number of things of the same kind ordinarily used or classed together; a collection of articles which naturally complement each other and usually go together; an assortment; a suit; as a set of chairs of china of surgical or mathematical instruments of books etc.", "details": []}, {"x": -0.7158472386680063, "y": -0.6486706968278196, "z": -0.25843579080363754, "word": "Sex", "pos_group": "noun", "row_number": 139146, "definition": "The distinguishing peculiarity of male or female in both animals and plants; the physical difference between male and female; the assemblage of properties or qualities by which male is distinguished from female.", "details": []}, {"x": -0.48370914519792385, "y": -0.752689633495766, "z": -0.4466360693897248, "word": "Sex", "pos_group": "noun", "row_number": 139147, "definition": "One of the two divisions of organic beings formed on the distinction of male and female.", "details": []}, {"x": -0.5818077738747582, "y": -0.7994893415839455, "z": -0.1493871043717215, "word": "Shadow", "pos_group": "noun", "row_number": 139297, "definition": "An imperfect and faint representation; adumbration; indistinct image; dim bodying forth; hence mystical representation; type.", "details": []}, {"x": -0.6693320796187079, "y": -0.6263771173889797, "z": -0.39955759785638917, "word": "Shape", "pos_group": "noun", "row_number": 139533, "definition": "That which has form or figure; a figure; an appearance; a being.", "details": []}, {"x": -0.4420752128587731, "y": -0.8348909759813796, "z": -0.32791243404410547, "word": "Shape", "pos_group": "noun", "row_number": 139535, "definition": "Form of embodiment as in words; form as of thought or conception; concrete embodiment or example as of some quality.", "details": []}, {"x": -0.689716754705939, "y": -0.7004919382275223, "z": -0.18330805425882596, "word": "Shoeing-horn", "pos_group": "noun", "row_number": 140326, "definition": "Anything which draws on or allures; an inducement.", "details": []}, {"x": -0.5517736593194414, "y": -0.6901180110969626, "z": -0.46827658455319476, "word": "Simple", "pos_group": "adjective", "row_number": 141473, "definition": "Artless in manner; unaffected; unconstrained; natural; inartificial;; straightforward.", "details": []}, {"x": -0.5074864285257638, "y": -0.8398605745801513, "z": -0.1925921600898203, "word": "Simple", "pos_group": "adjective", "row_number": 141479, "definition": "Not capable of being decomposed into anything more simple or ultimate by any means at present known; elementary; thus atoms are regarded as simple bodies. Cf. Ultimate a.", "details": []}, {"x": -0.7108020101464639, "y": -0.6293441776435503, "z": -0.31414392949396525, "word": "Simple", "pos_group": "adjective", "row_number": 141481, "definition": "Consisting of a single individual or zooid; as a simple ascidian; -- opposed to compound.", "details": []}, {"x": -0.4551938842298236, "y": -0.7900440854793297, "z": -0.41064445784509923, "word": "Singularity", "pos_group": "noun", "row_number": 141679, "definition": "Anything singular rare or curious.", "details": []}, {"x": -0.6288140176365327, "y": -0.7635934240564932, "z": -0.14669019722354734, "word": "Skeleton", "pos_group": "noun", "row_number": 142132, "definition": "The framework of anything; the principal parts that support the rest but without the appendages.", "details": []}, {"x": -0.6284198776599494, "y": -0.6418243829842084, "z": -0.43948824645124984, "word": "Skeleton", "pos_group": "adjective", "row_number": 142134, "definition": "Consisting of or resembling a skeleton; consisting merely of the framework or outlines; having only certain leading features of anything; as a skeleton sermon; a skeleton crystal.", "details": []}, {"x": -0.4552938214233877, "y": -0.8478859371259008, "z": -0.27165598428494286, "word": "Skill", "pos_group": "other", "row_number": 142216, "definition": "To make a difference; to signify; to matter; -- used impersonally.", "details": []}, {"x": -0.7110455158475343, "y": -0.6657389624293961, "z": -0.22628722521730063, "word": "Sleep", "pos_group": "other", "row_number": 142719, "definition": "A natural and healthy but temporary and periodical suspension of the functions of the organs of sense as well as of those of the voluntary and rational soul; that state of the animal in which there is a lessened acuteness of sensory perception a confusion of ideas and a loss of mental control followed by a more or less unconscious state.", "details": []}, {"x": -0.5069854413305731, "y": -0.7282493293769589, "z": -0.4611059276791545, "word": "Sleepwaker", "pos_group": "noun", "row_number": 142741, "definition": "On in a state of magnetic or mesmeric sleep.", "details": []}, {"x": -0.552110892257849, "y": -0.8182518291172498, "z": -0.16011716583963392, "word": "Sloughy", "pos_group": "adjective", "row_number": 143125, "definition": "Resembling or of the nature of a slough or the dead matter which separates from living flesh.", "details": []}, {"x": -0.6896830185976319, "y": -0.6229398772852588, "z": -0.36916560395828496, "word": "Slow", "pos_group": "other", "row_number": 143139, "definition": "Not advancing or improving rapidly; as the slow growth of arts and sciences.", "details": []}, {"x": -0.44159921379981903, "y": -0.8209780376630994, "z": -0.3619187699556742, "word": "Smattering", "pos_group": "noun", "row_number": 143368, "definition": "A slight superficial knowledge of something; sciolism.", "details": []}, {"x": -0.6698921703654359, "y": -0.7242403863070399, "z": -0.16346358287066687, "word": "Smelling", "pos_group": "noun", "row_number": 143408, "definition": "The sense by which odors are perceived; the sense of smell.", "details": []}, {"x": -0.5813249917954988, "y": -0.668794380452969, "z": -0.46343859419398, "word": "Socialism", "pos_group": "noun", "row_number": 144184, "definition": "A theory or system of social reform which contemplates a complete reconstruction of society with a more just and equitable distribution of property and labor. In popular usage the term is often employed to indicate any lawless revolutionary social scheme. See Communism Fourierism Saint-Simonianism forms of socialism.", "details": []}, {"x": -0.48356290495717624, "y": -0.847342803628717, "z": -0.21949280190476128, "word": "Sociology", "pos_group": "noun", "row_number": 144213, "definition": "That branch of philosophy which treats of the constitution phenomena and development of human society; social science.", "details": []}, {"x": -0.7163592795108392, "y": -0.6394278333366966, "z": -0.2792157384766288, "word": "Soever", "pos_group": "other", "row_number": 144266, "definition": "A word compounded of so and ever used in composition with who what where when how etc. and indicating any out of all possible or supposable persons things places times ways", "details": []}, {"x": -0.47076339094184183, "y": -0.7674723346542541, "z": -0.4351643888110411, "word": "Solar", "pos_group": "adjective", "row_number": 144386, "definition": "Produced by the action of the sun or peculiarly affected by its influence.", "details": []}, {"x": -0.6001216196223695, "y": -0.7865873408633883, "z": -0.14537674110836224, "word": "Solid", "pos_group": "adjective", "row_number": 144536, "definition": "Impenetrable; resisting or excluding any other material particle or atom from any given portion of space; -- applied to the supposed ultimate particles of matter.", "details": []}, {"x": -0.6549992716878199, "y": -0.630276257204591, "z": -0.4168066622459358, "word": "Soliform", "pos_group": "adjective", "row_number": 144567, "definition": "Like the sun in form appearance or nature; resembling the sun.", "details": []}, {"x": -0.4446256604144382, "y": -0.8417037401740683, "z": -0.30633778068989287, "word": "Somatics", "pos_group": "noun", "row_number": 144671, "definition": "The science which treats of the general properties of matter; somatology.", "details": []}, {"x": -0.7000237682142005, "y": -0.686198583060578, "z": -0.19773271995511063, "word": "Somatotropism", "pos_group": "noun", "row_number": 144679, "definition": "A directive influence exercised by a mass of matter upon growing organs.", "details": []}, {"x": -0.5337487133440355, "y": -0.7040428612469166, "z": -0.4684399220079791, "word": "Somite", "pos_group": "noun", "row_number": 144725, "definition": "One of the actual or ideal serial segments of which an animal esp. an articulate or vertebrate is is composed; somatome; metamere.", "details": []}, {"x": -0.5234933159717001, "y": -0.8332766489792899, "z": -0.17777731688491402, "word": "Somnambulism", "pos_group": "noun", "row_number": 144734, "definition": "A condition of the nervous system in which an individual during sleep performs actions approppriate to the waking state; a state of sleep in which some of the senses and voluntary powers are partially awake; noctambulism.", "details": []}, {"x": -0.7049535191401771, "y": -0.6247819518538618, "z": -0.33569 it is applied.", "details": []}, {"x": -0.6182147768984104, "y": -0.772661455932118, "z": -0.1442385667611417, "word": "Specimen", "pos_group": "noun", "row_number": 145787, "definition": "A part or small portion of anything or one of a number of things intended to exhibit the kind and quality of the whole or of what is not exhibited; a sample; as a specimen of a man's handwriting; a specimen of painting; aspecimen of one's art.", "details": []}, {"x": -0.6391641866733424, "y": -0.6361166724315437, "z": -0.4322322541514281, "word": "Speciocities", "pos_group": "other", "row_number": 145788, "definition": "of Speciosity", "details": []}, {"x": -0.44961298842053904, "y": -0.8466774049874304, "z": -0.28457957152139857, "word": "Spectrally", "pos_group": "adverb", "row_number": 145834, "definition": "In the form or manner of a specter.", "details": []}, {"x": -0.7082391858098515, "y": -0.6726761082670721, "z": -0.21425244234329024, "word": "Spectrological", "pos_group": "adjective", "row_number": 145836, "definition": "Of or pertaining to spectrology; as spectrological studies or experiments.", "details": []}, {"x": -0.5163712596748862, "y": -0.7186706047668533, "z": -0.4656965578848704, "word": "Speculate", "pos_group": "other", "row_number": 145858, "definition": "To consider attentively; as to speculate the nature of a thing.", "details": []}, {"x": -0.5406376776928403, "y": -0.8248848285317332, "z": -0.1651542343298097, "word": "Speculatist", "pos_group": "noun", "row_number": 145868, "definition": "One who speculates or forms theories; a speculator; a theorist.", "details": []}, {"x": -0.6967794991005547, "y": -0.6221834785269023, "z": -0.3569118219971762, "word": "Spermatogenetic", "pos_group": "adjective", "row_number": 146033, "definition": "Relating to or connected with spermatogenesis; as spermatogenetic function.", "details": []}, {"x": -0.4421732781961772, "y": -0.8149024640067565, "z": -0.37472225208140886, "word": "Spermatogonium", "pos_group": "noun", "row_number": 146035, "definition": "A primitive seminal cell occuring in masses in the seminal tubules. It divides into a mass (spermosphere) of small cells (spermoblast) which in turn give rise to spermatozoids.", "details": []}, {"x": -0.6615093117586834, "y": -0.7334030526826142, "z": -0.15660585165432322, "word": "Spermist", "pos_group": "noun", "row_number": 146052, "definition": "A believer in the doctrine formerly current of encasement in the male (see Encasement) in which the seminal thread or spermatozoid was considered as the real animal germ the head being the true animal head and the tail the body.", "details": []}, {"x": -0.5926786777616656, "y": -0.6608021569358917, "z": -0.46051329439610855, "word": "Spermoblast", "pos_group": "noun", "row_number": 146053, "definition": "One of the cells formed by the division of the spermospore each of which is destined to become a spermatozoid; a spermatocyte; a spermatoblast.", "details": []}, {"x": -0.4747659981539847, "y": -0.8494093321746033, "z": -0.23043661473720872, "word": "Spermosphere", "pos_group": "noun", "row_number": 146064, "definition": "A mass or ball of cells formed by the repeated division of a male germinal cell (spermospore) each constituent cell (spermoblast) of which is converted into a spermatozoid; a spermatogemma.", "details": []}, {"x": -0.7175395831798986, "y": -0.6438198305613113, "z": -0.2657686443996394, "word": "Spermospore", "pos_group": "noun", "row_number": 146065, "definition": "The male germinal or seminal cell from the breaking up of which the spermoblasts are formed and ultimately the spermatozoids; a spermatospore.", "details": []}, {"x": -0.47738638366064373, "y": -0.7583713483549933, "z": -0.4438188129063954, "word": "Sphere", "pos_group": "noun", "row_number": 146129, "definition": "The extension of a general conception or the totality of the individuals or species to which it may be applied.", "details": []}, {"x": -0.5887353273709819, "y": -0.79506197750286, "z": -0.1458326 e nature of a sporophore.", "details": []}, {"x": -0.6864057623225464, "y": -0.6216113686504043, "z": -0.3774207675989428, "word": "Spring", "pos_group": "other", "row_number": 147120, "definition": "Any active power; that by which action or motion is produced or propagated; cause; origin; motive.", "details": []}, {"x": -0.4392176594085008, "y": -0.8254734176646857, "z": -0.35451584505167294, "word": "Spring", "pos_group": "other", "row_number": 147121, "definition": "That which springs or is originated from a source;", "details": []}, {"x": -0.6759775438467532, "y": -0.718039635860476, "z": -0.1657511434297393, "word": "Sprite", "pos_group": "noun", "row_number": 147184, "definition": "A spirit; a soul; a shade; also an apparition. See Spright.", "details": []}, {"x": -0.5740243719541761, "y": -0.6725459236185267, "z": -0.46709528045861953, "word": "Stahlian", "pos_group": "adjective", "row_number": 147808, "definition": "Pertaining to or taught by Stahl a German physician and chemist of the 17th century; as the Stahlian theory of phlogiston.", "details": []}, {"x": -0.48753847831354546, "y": -0.8471134422499796, "z": -0.21143568318309655, "word": "Stahlianism", "pos_group": "noun", "row_number": 147811, "definition": "The Stahlian theoru that every vital action is function or operation of the soul.", "details": []}, {"x": -0.717091878660015, "y": -0.6351148521224085, "z": -0.28706856702429423, "word": "Stand", "pos_group": "noun", "row_number": 148049, "definition": "To be in some particular state; to have essence or being; to be; to consist.", "details": []}, {"x": -0.4649994116437742, "y": -0.7731657180757113, "z": -0.43126594992349415, "word": "Standpoint", "pos_group": "noun", "row_number": 148111, "definition": "A fixed point or station; a basis or fundamental principle; a position from which objects or principles are viewed and according to which they are compared and judged.", "details": []}, {"x": -0.6071852582745579, "y": -0.7816050501735806, "z": -0.142 ": "A particular proposition as opposed to a universal one. See Subaltern 2.", "details": []}, {"x": -0.6679058261690108, "y": -0.7272272915812397, "z": -0.1582475078758132, "word": "Subalternation", "pos_group": "noun", "row_number": 151133, "definition": "The state of being subalternate; succession of turns; subordination.", "details": []}, {"x": -0.5854800476815651, "y": -0.6642138213830633, "z": -0.46479362436515886, "word": "Subatom", "pos_group": "noun", "row_number": 151150, "definition": "A hypothetical component of a chemical atom on the theory that the elements themselves are complex substances; -- called also atomicule.", "details": []}, {"x": -0.4782803041176164, "y": -0.8496569266854647, "z": -0.22210596036255134, "word": "Subcelestial", "pos_group": "adjective", "row_number": 151171, "definition": "Being beneath the heavens; as subcelestial glories.", "details": []}, {"x": -0.7188510451415622, "y": -0.6391438813105144, "z": -0.27340130556055314, "word": "Subclass", "pos_group": "noun", "row_number": 151176, "definition": "One of the natural groups more important than an order into which some classes are divided; as the angiospermous subclass of exogens.", "details": []}, {"x": -0.47123042532637005, "y": -0.7641235833642352, "z": -0.440519052474838, "word": "Subderivative", "pos_group": "noun", "row_number": 151226, "definition": "A word derived from a derivative and not directly from the root; as \"\"\"\"friendliness\"\"\"\" is a subderivative being derived from \"\"\"\"friendly\"\"\"\" which is in turn a derivative from \"\"\"\"friend.", "details": []}, {"x": -0.5957985365501395, "y": -0.7903565835841385, "z": -0.14269048542184162, "word": "Subject", "pos_group": "adjective", "row_number": 151340, "definition": "That in which any quality attribute or relation whether spiritual or material inheres or to which any of these appertain; substance; substratum.", "details": []}, {"x": -0.6597649056090453, "y": -0.6266146048156532, "z": -0.4148064685590259, "word": "Subject", "pos_group": "adjective", "row_number": 151341, "definition": "Hence that substance or being which is conscious of its own operations; the mind; the thinking agent or principal; the ego. Cf. Object n. 2.", "details": []}, {"x": -0.44077997841803634, "y": -0.8418804859614502, "z": -0.31136836381223437, "word": "Subject", "pos_group": "noun", "row_number": 151342, "definition": "The principal theme or leading thought or phrase on which a composition or a movement is based.", "details": []}, {"x": -0.6997860501349369, "y": -0.6881474979566454, "z": -0.19170942880451192, "word": "Subjective", "pos_group": "adjective", "row_number": 151358, "definition": "Especially pertaining to or derived from one's own consciousness in distinction from external observation; ralating to the mind or intellectual world in distinction from the outward or material excessively occupied with or brooding over one's own internal states.", "details": []}, {"x": -0.5368036046927528, "y": -0.6995394093072367, "z": -0.471684751518373, "word": "Sublimity", "pos_group": "noun", "row_number": 151432, "definition": "That which is sublime; as the sublimities of nature.", "details": []}, {"x": -0.5180842460909315, "y": -0.8365154837898672, "z": -0.1784112085385766, "word": "Subsistence", "pos_group": "noun", "row_number": 151679, "definition": "Real being; existence.", "details": []}, {"x": -0.708732332479507, "y": -0.6230575029531991, "z": -0.3309045616365567, "word": "Subsistent", "pos_group": "adjective", "row_number": 151685, "definition": "Inherent; as qualities subsistent in matter.", "details": []}, {"x": -0.44623312175720276, "y": -0.8008679953951181, "z": -0.3993575528253178, "word": "Subsolary", "pos_group": "adjective", "row_number": 151689, "definition": "Being under the sun; hence terrestrial; earthly; mundane.", "details": []}, {"x": -0.6426908801783461, "y": -0.7521194886994265, "z": -0.14582423411112527, "word": "Substance", "pos_group": "noun", "row_number": 151695, "definition": "That which underlies all outward manifestations; substratum; the permanent subject or cause of phenomena whether material or spiritual; that in which properties inhere; that which is real in distinction from that which is apparent; the abiding part of any existence in distinction from any accident; that which constitutes anything what it is; real or existing essence.", "details": []}, {"x": -0.6155016701308103, "y": -0.6461259856147641, "z": -0.4513079932590746, "word": "Substance", "pos_group": "noun", "row_number": 151696, "definition": "The most important element in any existence; the characteristic and essential components of anything; the main part; essential import; purport.", "details": []}, {"x": -0.45905600060759727, "y": -0.8512226198410083, "z": -0.2543376491539701, "word": "Substantiate", "pos_group": "other", "row_number": 151717, "definition": "To make to exist; to make real.", "details": []}, {"x": -0.7170069007258567, "y": -0.6547176110375665, "z": -0.23926126746459234, "word": "Substantively", "pos_group": "adverb", "row_number": 151727, "definition": "In a substantive manner; in substance; essentially.", "details": []}, {"x": -0.49301606103077716, "y": -0.7393734452892786, "z": -0.45854342429780737, "word": "Substantivize", "pos_group": "other", "row_number": 151730, "definition": "To convert into a substantive; as to substantivize an adjective.", "details": []}, {"x": -0.5653422286470541, "y": -0.8110716804554603, "z": -0.15016954974806895, "word": "Substitution", "pos_group": "noun", "row_number": 151745, "definition": "The act or process of substituting an atom or radical for another atom or radical; metethesis; also the state of being so substituted. See Metathesis.", "details": []}, {"x": -0.6827276949489658, "y": -0.6206073832660367, "z": -0.38565447020014515, "word": "Substratum", "pos_group": "noun", "row_number": 151759, "definition": "The permanent subject of qualities or cause of phenomena; substance.", "details": []}, {"x":  "pos_group": "adjective", "row_number": 154702, "definition": "Affording a general view of the whole or of the principal parts of a thing; as a synoptic table; a synoptical statement of an argument.", "details": []}, {"x": -0.7152697985754536, "y": -0.6611611951285843, "z": -0.22639564770987144, "word": "Synthesis", "pos_group": "noun", "row_number": 154727, "definition": "The combination of separate elements of thought into a whole as of simple into complex conceptions species into genera individual propositions into systems; -- the opposite of analysis.", "details": []}, {"x": -0.5019291805730874, "y": -0.7296047145504316, "z": -0.46448257038882784, "word": "Synthesist", "pos_group": "noun", "row_number": 154728, "definition": "One who employs synthesis or who follows synthetic methods.", "details": []}, {"x": -0.5534975398595333, "y": -0.8184799104569668, "z": -0.15404904916227208, "word": "Synthetical", "pos_group": "adjective", "row_number": 154732, "definition": "Of or pertaining to synthesis; consisting in synthesis or composition; as the synthetic method of reasoning as opposed to analytical.", "details": []}, {"x": -0.6908459751856716, "y": -0.6188986661998519, "z": -0.3737596547860706, "word": "System", "pos_group": "noun", "row_number": 154790, "definition": "An assemblage of objects arranged in regular subordination or after some distinct method usually logical or scientific; a complete whole of objects related by some common law principle or end; a complete exhibition of essential principles or facts arranged in a rational dependence or connection; a regular union of principles or parts forming one entire thing; as a system of philosophy; a system of government; a system of divinity; a system of botany or chemistry; a military system; the solar system.", "details": []}, {"x": -0.43665051046496944, "y": -0.8243605620310388, "z": -0.36023047549943865, "word": "System", "pos_group": "noun", "row_number": 154791, "definition": "Hence the whole scheme of created things regarded as forming one complete plan of whole; the universe.", "details": []}, {"x": -0.6741809995371871, "y": -0.7209424070300099, "z": -0.16038087669299855, "word": "System", "pos_group": "noun", "row_number": 154794, "definition": "An assemblage of parts or organs either in animal or plant essential to the performance of some particular function or functions which as a rule are of greater complexity than those manifested by a single organ; as the capillary system the muscular system the digestive system etc.; hence the whole body as a functional unity.", "details": []}, {"x": -0.5781002051409059, "y": -0.6679270225143764, "z": -0.4686935517063597, "word": "Systematical", "pos_group": "adjective", "row_number": 154797, "definition": "Of or pertaining to system; consisting in system; methodical; formed with regular connection and adaptation or subordination of parts to each other and to the design of the whole; as a systematic arrangement of plants or animals; a systematic course of study.", "details": []}, {"x": -0.4821840217581579, "y": -0.8495698211759162, "z": -0.21384500954721863, "word": "Systematism", "pos_group": "noun", "row_number": 154802, "definition": "The reduction of facts or principles to a system.", "details": []}, {"x": -0.7197700863854039, "y": -0.6346609867006565, "z": -0.28131202374747066, "word": "Systematized", "pos_group": "other", "row_number": 154806, "definition": "of Systematize", "details": []}, {"x": -0.46526456895705465, "y": -0.7699267613946917, "z": -0.43673981151423247, "word": "Systematizing", "pos_group": "other", "row_number": 154807, "definition": "of Systematize", "details": []}, {"x": -0.6029745748468791, "y": -0.7853838944821354, "z": -0.13997785673562504, "word": "Systematology", "pos_group": "noun", "row_number": 154810, "definition": "The doctrine of or a treatise upon systems.", "details": []}, {"x": -0.6544423891760465, "y": -0.6272478856116883, "z": -0.42221469567651776, "word": "Systemization", "pos_group": "noun", "row_number": 154813, "definition": "The act or process of systematizing; systematization.", "details": []}, {"x": -0.44074774589155064, "y": -0.8450240686896803, "z": -0.30278003208047866, "word": "Systemless", "pos_group": "adjective", "row_number": 154819, "definition": "Not agreeing with some artificial system of classification.", "details": []}, {"x": -0.7044531108009917, "y": -0.6819800593318495, "z": -0.19659352318052783, "word": "Systemless", "pos_group": "adjective", "row_number": 154820, "definition": "Not having any of the distinct systems or types of structure as the radiate articulate etc. characteristic of organic nature; as all unicellular organisms are systemless.", "details": []}, {"x": -0.5292464002939529, "y": -0.7045957176961611, "z": -0.47269770718729387, "word": "Tactile", "pos_group": "adjective", "row_number": 155069, "definition": "Of or pertaining to the organs or the sense of touch; perceiving or perceptible by the touch; capable of being touched; as tactile corpuscles; tactile sensations.", "details": []}, {"x": -0.5238583993240927, "y": -0.834329771638123, "z": -0.17165724457731668, "word": "Talismanical", "pos_group": "adjective", "row_number": 155294, "definition": "Of or pertaining to a talisman; having the properties of a talisman or preservative against evils by occult influence; magical.", "details": []}, {"x": -0.707069775914647, "y": -0.6203268645834369, "z": -0.3394803574053928, "word": "Tautoousious", "pos_group": "adjective", "row_number": 155955, "definition": "Having the same essence; being identically of the same nature.", "details": []}, {"x": -0.44220444619256, "y": -0.8061858763839749, "z": -0.39308976136060036, "word": "Taxonomic", "pos_group": "adjective", "row_number": 156018, "definition": "Pertaining to or involving taxonomy or the laws and principles of classification; classificatory.", "details": []}, {"x": -0.6495919710534408, "y": -0.7461099205250534, "z": -0.1461172735750441, "word": "Taxonomy", "pos_group": "noun", "row_number": 156020, "definition": "That division of the natural sciences which treats of the classification of animals and plants; the laws or principles of classification.", "details": []}, {"x": -0.6086469613212826, "y": -0.6487744053224193, "z": -0.4567719863048855, "word": "Technic", "pos_group": "adjective", "row_number": 156133, "definition": "Technical terms or objects; things pertaining to the practice of an art or science.", "details": []}, {"x": -0.461559101715453, "y": -0.8524310081705332, "z": -0.2456106103835755, "word": "Technicalities", "pos_group": "other", "row_number": 156135, "definition": "of Technicality", "details": []}, {"x": -0.7194668772384077, "y": -0.6493890986586855, "z": -0.24629496767102996, "word": "Technicals", "pos_group": "other", "row_number": 156140, "definition": "Those things which pertain to the practical part of an art science or profession; technical terms; technics.", "details": []}, {"x": -0.48617844226140056, "y": -0.7451282631909524, "z": -0.4565242531063523, "word": "Technology", "pos_group": "noun", "row_number": 156150, "definition": "Industrial science; the science of systematic knowledge of the industrial arts especially of the more important manufactures as spinning weaving metallurgy etc.", "details": []}, {"x": -0.5722628926291843, "y": -0.8070164856887827, "z": -0.14573803054180948, "word": "Tectology", "pos_group": "noun", "row_number": 156158, "definition": "A division of morphology created by Haeckel; the science of organic individuality constituting the purely structural portion of morphology in which the organism is regarded as composed of organic individuals of different orders each organ being considered an individual. See Promorphology and Morphon.", "details": []}, {"x": -0.6786541519399826, "y": -0.6199358432760417, "z": -0.3938376471037858, "word": "Teleological", "pos_group": "adjective", "row_number": 156274, "definition": "Of or pertaining to teleology or the doctrine of design.", "details": []}, {"x": -0.4355922086346091, "y": -0.8339564749180234, "z": -0.33878610614830046, "word": "Teleologist", "pos_group": "noun", "row_number": 156275, "definition": "One versed in teleology.", "details": []}, {"x": -0.6876697267955197, "y": -0.7054081786403154, "z": -0.17178372552814292, "word": "Teleology", "pos_group": "noun", "row_number": 156276, "definition": "The doctrine of the final causes of things", "details": []}, {"x": -0.5589933889457861, "y": -0.6808988573660827, "z": -0.4731840415234521, "word": "Teleology", "pos_group": "noun", "row_number": 156277, "definition": "the doctrine of design which assumes that the phenomena of organic life particularly those of evolution are explicable only by purposive causes and that they in no way admit of a mechanical explanation or one based entirely on biological science; the doctrine of adaptation to purpose.", "details": []}, {"x": -0.49660442327924115, "y": -0.845633964576822, "z": -0.19567126701071486, "word": "Teleorganic", "pos_group": "adjective", "row_number": 156279, "definition": "Vital; as teleorganic functions.", "details": []}, {"x": -0.7173447199536693, "y": -0.6271473981971385, "z": -0.30348425608118706, "word": "Tellurism", "pos_group": "noun", "row_number": 156362, "definition": "An hypothesis of animal magnetism propounded by Dr. Keiser in Germany in which the phenomena are ascribed to the agency of a telluric spirit or influence.", "details": []}, {"x": -0.45414697797684384, "y": -0.7846049325980288, "z": -0.4220730056961031, "word": "Temperament", "pos_group": "other", "row_number": 156407, "definition": "Internal constitution; state with respect to the relative proportion of different qualities or constituent parts.", "details": []}, {"x": -0.6215309180555668, "y": -0.7709072944835359, "z": -0.13928841018935872, "word": "Temperament", "pos_group": "other", "row_number": 156411, "definition": "A system of compromises in the tuning of organs pianofortes and the like whereby the tones generated with the vibrations of a ground tone are mutually modified and in part canceled until their number reduced to the actual practicable scale of twelve tones to the octave. This scale although in so far artificial is yet closely suggestive of its origin in nature and this system of tuning although not mathematically true yet satisfies the ear while it has the convenience that the same twelve fixed tones answer for every key or scale C/ becoming identical with D/", "details": []}, {"x": -0.6379239162572702, "y": -0.6335754176037272, "z": -0.4377616557845718, "word": "Temporal", "pos_group": "noun", "row_number": 156461, "definition": "Anything temporal or secular; a temporality; -- used chiefly in the plural.", "details": []}, {"x": -0.4462806085742086, "y": -0.8498308620527412, "z": -0.2803945868117446, "word": "Tenacity", "pos_group": "noun", "row_number": 156525, "definition": "That quality of bodies which keeps them from parting without considerable force; cohesiveness; the effect of attraction; -- as distinguished from brittleness fragility mobility etc.", "details": []}, {"x": -0.7125479433248777, "y": -0.6682176221000987, "z": -0.21391736249864454, "word": "Tension", "pos_group": "adjective", "row_number": 156667, "definition": "The quality in consequence of which an electric charge tends to discharge itself as into the air by a spark or to pass from a body of greater to one of less electrical potential. It varies as the quantity of electricity upon a given area.", "details": []}, {"x": -0.5115021121350386, "y": -0.7197451449065352, "z": -0.4693959050363189, "word": "Teratogeny", "pos_group": "noun", "row_number": 156784, "definition": "The formation of monsters.", "details": []}, {"x": -0.541665080847687, "y": -0.8254094127320704, "z": -0.15905420951225177, "word": "Teratological", "pos_group": "adjective", "row_number": 156786, "definition": "Of or pertaining to teratology; as teratological changes.", "details": []}, {"x": -0.6982864464636818, "y": -0.6179872658284935, "z": -0.3612309205466038, "word": "Teratology", "pos_group": "noun", "row_number": 156787, "definition": "That branch of biological science which treats of monstrosities malformations or deviations from the normal type of structure either in plants or animals.", "details": []}, {"x": -0.4370775902936327, "y": -0.8182186831832502, "z": -0.3734720425319405, "word": "Term", "pos_group": "noun", "row_number": 156859, "definition": "A word or expression; specifically one that has a precisely limited meaning in certain relations and uses or is peculiar to a science art profession or the like; as a technical term.", "details": []}, {"x": -0.6656722034468882, "y": -0.7303593768795239, "z": -0.15315253234053328, "word": "Terrestre", "pos_group": "adjective", "row_number": 156971, "definition": "Terrestrial; earthly.", "details": []}, {"x": -0.5897878072804836, "y": -0.6596275341364086, "z": -0.46587751458124727, "word": "Terrestrial", "pos_group": "adjective", "row_number": 156972, "definition": "Of or pertaining to the earth; existing on the earth; earthly; as terrestrial animals.", "details": []}, {"x": -0.4730217201462012, "y": -0.851836819586487, "z": -0.22499885570088485, "word": "Terrestrious", "pos_group": "adjective", "row_number": 156979, "definition": "Terrestrial.", "details": []}, {"x": -0.7211566723228081, "y": -0.6390660431259436, "z": -0.2674465301469499, "word": "Tetricity", "pos_group": "noun", "row_number": 157298, "definition": "Crabbedness; perverseness.", "details": []}, {"x": -0.47194984165344944, "y": -0.7606076036340171, "z": -0.4458019966951718, "word": "Texture", "pos_group": "noun", "row_number": 157376, "definition": "The disposition of the several parts of any body in connection with each other or the manner in which the constituent parts are united; structure; as the texture of earthy substances or minerals; the texture of a plant or a bone; the texture of paper; a loose or compact texture.", "details": []}, {"x": -0.591291373 : "That which is considered and established as a principle; hence sometimes a rule.", "details": []}, {"x": -0.6201911123912542, "y": -0.6417872723949996, "z": -0.4510787969996872, "word": "Theoretical", "pos_group": "adjective", "row_number": 157641, "definition": "Pertaining to theory; depending on or confined to theory or speculation; speculative; terminating in theory or speculation: not practical; as theoretical learning; theoretic sciences.", "details": []}, {"x": -0.4542310542840217, "y": -0.8526187737699726, "z": -0.2582931976243551, "word": "Theoretics", "pos_group": "noun", "row_number": 157642, "definition": "The speculative part of a science; speculation.", "details": []}, {"x": -0.7182916065063888, "y": -0.6555482363566791, "z": -0.23305295070459656, "word": "Theorist", "pos_group": "noun", "row_number": 157649, "definition": "One who forms theories; one given to theory and speculation; a speculatist.", "details": []}, {"x": -0.4948075219293094, "y": -0.7353020631252141, "z": -0.46313755214404667, "word": "Theorization", "pos_group": "noun", "row_number": 157650, "definition": "The act or product of theorizing; the formation of a theory or theories; speculation.", "details": []}, {"x": -0.560275590624866, "y": -0.8147946379593342, "z": -0.1489998674585815, "word": "Theory", "pos_group": "noun", "row_number": 157657, "definition": "An exposition of the general or abstract principles of any science; as the theory of music.", "details": []}, {"x": -0.6872674208509837, "y": -0.6177395209515208, "z": -0.3821797698615432, "word": "Theory", "pos_group": "noun", "row_number": 157658, "definition": "The science as distinguished from the art; as the theory and practice of medicine.", "details": []}, {"x": -0.4344444879711793, "y": -0.8288610935293012, "z": -0.3524872685713217, "word": "Theory", "pos_group": "noun", "row_number": 157659, "definition": "The philosophical explanation of phenomena either physical or moral; as Lavoisier's theory of combustion; Adam Smith's theory of moral sentiments.", "details": []}, {"x": -0.6803106753248445, "y": -0.714567218726009, "z": -0.16300636478748334, "word": "Theosophistical", "pos_group": "adjective", "row_number": 157666, "definition": "Of or pertaining to theosophy; theosophical.", "details": []}, {"x": -0.5705607179485706, "y": -0.6719331236226952, "z": -0.47219312205141195, "word": "Theosophy", "pos_group": "noun", "row_number": 157670, "definition": "Any system of philosophy or mysticism which proposes to attain intercourse with God and superior spirits and consequent superhuman knowledge by physical processes as by the theurgic operations of some ancient Platonists or by the chemical processes of the German fire philosophers; also a direct as distinguished from a revealed knowledge of God supposed to be attained by extraordinary illumination; especially a direct insight into the processes of the divine mind and the interior relations of the divine nature.", "details": []}, {"x": -0.48646949664633665, "y": -0.849141931756005, "z": -0.20568278626647346, "word": "Thermochemistry", "pos_group": "noun", "row_number": 157746, "definition": "That branch of chemical science which includes the investigation of the various relations existing between chemical action and that manifestation of force termed heat or the determination of the heat evolved by or employed in chemical actions.", "details": []}, {"x": -0.7202864263058283, "y": -0.6303887556281592, "z": -0.2894779453726301, "word": "Thermochrosy", "pos_group": "noun", "row_number": 157747, "definition": "The property possessed by heat of being composed like light of rays of different degrees of refrangibility which are unequal in rate or degree of transmission through diathermic substances.", "details": []}, {"x": -0.45951163134705403, "y": -0.7757609930829057, "z": -0.43248577117379616, "word": "Thermocurrent", "pos_group": "noun", "row_number": 157748, "definition": "A current as of electricity developed or set in motion by the action of heat.", "details": []}, {"x": -0.6102400689093107, "y": -0.7801556341002904, "z": -0.13771072899064002, "word": "Thermodynamics", "pos_group": "noun", "row_number": 157750, "definition": "The science which treats of the mechanical action or relations of heat.", "details": []}, {"x": -0.6487756965906037, "y": -0.6282280359123993, "z": -0.42944106744351557, "word": "Thermoelectric", "pos_group": "adjective", "row_number": 157751, "definition": "Pertaining to thermoelectricity; as thermoelectric currents.", "details": []}, {"x": -0.441134465652386, "y": -0.8479125605666195, "z": -0.29401474936972577, "word": "Thermogenic", "pos_group": "adjective", "row_number": 157755, "definition": "Relating to heat or to the production of heat; producing heat; thermogenous; as the thermogenic tissues.", "details": []}, {"x": -0.7088471749318119, "y": -0.6758428993799409, "z": -0.20192092003778137, "word": "Thermomagnetism", "pos_group": "noun", "row_number": 157761, "definition": "Magnetism as affected or caused by the action of heat; the relation of heat to magnetism.", "details": []}, {"x": -0.5216735871998583, "y": -0.70986344987807, "z": -0.4732341396658071, "word": "Theurgy", "pos_group": "noun", "row_number": 157814, "definition": "In later or modern magic that species of magic in which effects are claimed to be produced by supernatural agency in distinction from natural magic.", "details": []}, {"x": -0.5299293714422041, "y": -0.8318028513022793, "z": -0.16516318551138667, "word": "Thing", "pos_group": "noun", "row_number": 157923, "definition": "Whatever exists or is conceived to exist as a separate entity whether animate or inanimate; any separable or distinguishable object of thought.", "details": []}, {"x": -0.7049857423933952, "y": -0.6178890083122909, "z": -0.34814979021807113, "word": "Thing", "pos_group": "noun", "row_number": 157924, "definition": "An inanimate object in distinction from a living being; any lifeless material.", "details": []}, {"x": -0.43850 erse; the universe.", "details": []}, {"x": -0.4494926032220029, "y": -0.8538468163745325, "z": -0.26249193095366313, "word": "Universal", "pos_group": "noun", "row_number": 165872, "definition": "A general abstract conception so called from being universally applicable to or predicable of each individual or species contained under it.", "details": []}, {"x": -0.719355424330734, "y": -0.6565823071000361, "z": -0.2267762057384844, "word": "Universal", "pos_group": "noun", "row_number": 165873, "definition": "A universal proposition. See Universal a. 4.", "details": []}, {"x": -0.496840131092359, "y": -0.7311012538555309, "z": -0.4675904626347699, "word": "Universalian", "pos_group": "adjective", "row_number": 165874, "definition": "Of or pertaining to Universalism; Universalist.", "details": []}, {"x": -0.555076173864843, "y": -0.8185074873522128, "z": -0.14810784704374644, "word": "Universalties", "pos_group": "other", "row_number": 165880, "definition": "of Universality", "details": []}, {"x": -0.6917637574897961, "y": -0.615018430016343, "z": -0.3784378873260854, "word": "Universality", "pos_group": "noun", "row_number": 165881, "definition": "The quality or state of being universal; unlimited extension or application; generality; -- distinguished from particularity; as the unversality of a proposition; the unversality of sin; the unversality of the Deluge.", "details": []}, {"x": -0.43187645073888187, "y": -0.8277126212313918, "z": -0.35829394071271214, "word": "Universalized", "pos_group": "other", "row_number": 165882, "definition": "of Universalize", "details": []}, {"x": -0.6784624733171529, "y": -0.7175349256041861, "z": -0.1575826857194869, "word": "Universalizing", "pos_group": "other", "row_number": 165883, "definition": "of Universalize", "details": []}, {"x": -0.574716806119395, "y": -0.6672579974926456, "z": -0.47377986190426696, "word": "Universalize", "pos_group": "other", "row_number": 165884, "definition": "To make universal; to generalize.", "deta  to alter in form appearance substance position or the like; to make different by a partial change; to modify; as to vary the properties proportions or nature of a thing; to vary a posture or an attitude; to vary one's dress or opinions.", "details": []}, {"x": -0.7167371388531323, "y": -0.6637409806736617, "z": -0.21385926298150276, "word": "Vary", "pos_group": "other", "row_number": 167984, "definition": "To make of different kinds; to make different from one another; to diversity; to variegate.", "details": []}, {"x": -0.5065800715876345, "y": -0.7209712973981949, "z": -0.472839316679811, "word": "Vary", "pos_group": "other", "row_number": 167986, "definition": "To alter or be altered in any manner; to suffer a partial change; to become different; to be modified; as colors vary in different lights.", "details": []}, {"x": -0.5428950217227039, "y": -0.825735090106303, "z": -0.15305736295860034, "word": "Vase", "pos_group": "noun", "row_number": 168006, "definition": "A vessel adapted for various domestic purposes and anciently for sacrificial uses; especially a vessel of antique or elegant pattern used for ornament; as a porcelain vase; a gold vase; a Grecian vase. See Illust. of Portland vase under Portland.", "details": []}, {"x": -0.6995527489737676, "y": -0.613939215058708, "z": -0.3656563846240649, "word": "Vedanta", "pos_group": "noun", "row_number": 168120, "definition": "A system of philosophy among the Hindus founded on scattered texts of the Vedas and thence termed the \"\"\"\"Anta \" or end or substance.", "details": []}, {"x": -0.43213931935079086, "y": -0.8215217228621878, "z": -0.3719646052201443, "word": "Vegetal", "pos_group": "adjective", "row_number": 168140, "definition": "Of pertaining to or designating that class of vital phenomena such as digestion absorption assimilation secretion excretion circulation generation etc.", "details": []}, {"x": -0.6698486039299707, "y": -0.7271935128524586, "z": -0.1499748068122452, "word": "Venom", "pos_group"
