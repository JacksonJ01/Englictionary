table substances etc.", "details": []}, {"x": -0.6909423080262754, "y": -0.6779846938952242, "z": -0.2508694517535416, "word": "Map", "pos_group": "noun", "row_number": 93251, "definition": "Anything which represents graphically a succession of events states or acts; as an historical map.", "details": []}, {"x": -0.5170740991898971, "y": -0.7396898938118882, "z": -0.4306892579801757, "word": "Mappery", "pos_group": "noun", "row_number": 93258, "definition": "The making or study of maps.", "details": []}, {"x": -0.5675286769365797, "y": -0.8021172168887122, "z": -0.18579335624645427, "word": "Mare's-nest", "pos_group": "noun", "row_number": 93356, "definition": "A supposed discovery which turns out to be a hoax; something grosaly absurd.", "details": []}, {"x": -0.6670671228298597, "y": -0.6482601231397506, "z": -0.3671243200692758, "word": "Mark", "pos_group": "noun", "row_number": 93452, "definition": "A characteristic or essential attribute; a differential.", "details": []}, {"x": -0.46972441433918244, "y": -0.812748821220166, "z": -0.3446713335613259, "word": "Mass", "pos_group": "noun", "row_number": 93806, "definition": "A quantity of matter cohering together so as to make one body or an aggregation of particles or things which collectively make one body or quantity usually of considerable size; as a mass of ore metal sand or water.", "details": []}, {"x": -0.6612320470648176, "y": -0.7240332051038514, "z": -0.1963366950967521, "word": "Mass", "pos_group": "noun", "row_number": 93811, "definition": "The quantity of matter which a body contains irrespective of its bulk or volume.", "details": []}, {"x": -0.576175321296547, "y": -0.6902946605130167, "z": -0.43762458888417116, "word": "Masturbation", "pos_group": "noun", "row_number": 93932, "definition": "Onanism; self-pollution.", "details": []}, {"x": -0.510005899115531, "y": -0.8288242339136308, "z": -0.2300964409651787, "word": "Mateotechny", "pos_group": "noun", "row_number": 94004, "definition": "Any unprofitable science.", "details": []}, {"x": -0.6927204869587206, "y": -0.6582062503923938, "z": -0.2947929084833259, "word": "Material", "pos_group": "adjective", "row_number": 94006, "definition": "Consisting of matter; not spiritual; corporeal; physical; as material substance or bodies.", "details": []}, {"x": -0.48937556169262686, "y": -0.7712684397050451, "z": -0.4070092794187513, "word": "Material", "pos_group": "adjective", "row_number": 94009, "definition": "Pertaining to the matter as opposed to the form of a thing. See Matter.", "details": []}, {"x": -0.606506719939183, "y": -0.7751902998155706, "z": -0.17671897957055702, "word": "Material", "pos_group": "noun", "row_number": 94010, "definition": "The substance or matter of which anything is made or may be made.", "details": []}, {"x": -0.6371779571852618, "y": -0.656251400202159, "z": -0.4041513956550469, "word": "Materialism", "pos_group": "noun", "row_number": 94012, "definition": "The doctrine of materialists; materialistic views and tenets.", "details": []}, {"x": -0.47470971195588696, "y": -0.8277717760366914, "z": -0.2990728609750811, "word": "Materialist", "pos_group": "noun", "row_number": 94015, "definition": "One who denies the existence of spiritual substances or agents and maintains that spiritual phenomena so called are the result of some peculiar organization of matter.", "details": []}, {"x": -0.6836821022397863, "y": -0.6937415828473555, "z": -0.2264981220792616, "word": "Materiality", "pos_group": "noun", "row_number": 94020, "definition": "Importance; as the materiality of facts.", "details": []}, {"x": -0.5379633781151529, "y": -0.7198161781115682, "z": -0.43870271658127236, "word": "Materialize", "pos_group": "other", "row_number": 94025, "definition": "To regard as matter; to consider or explain by the laws or principles which are appropriate to matter.", "details": []}, {"x": -0.5438081097717163, "y": -0.8154520319707416, "z": -0.19826932012114565, "word": "Materially", "pos_group": "adverb", "row_number": 94029, "definition": "In the state of matter.", "details": []}, {"x": -0.6809872024055624, "y": -0.6482596296275481, "z": -0.34061104320764435, "word": "Materialness", "pos_group": "noun", "row_number": 94032, "definition": "The state of being material.", "details": []}, {"x": -0.4727560542306434, "y": -0.7991902436191776, "z": -0.37120973544910263, "word": "Materiated", "pos_group": "adjective", "row_number": 94037, "definition": "Consisting of matter.", "details": []}, {"x": -0.6426609475135244, "y": -0.743819665490832, "z": -0.18362791664157624, "word": "Materiation", "pos_group": "noun", "row_number": 94038, "definition": "Act of forming matter.", "details": []}, {"x": -0.600368281018827, "y": -0.6744573813009227, "z": -0.4297268527276376, "word": "Mathematics", "pos_group": "noun", "row_number": 94049, "definition": "That science or class of sciences which treats of the exact relations existing between quantities or magnitudes and of the methods by which in accordance with these relations quantities sought are deducible from other quantities known or supposed; the science of spatial and quantitative relations.", "details": []}, {"x": -0.49273008688523184, "y": -0.8321722896125348, "z": -0.25437441278380035, "word": "Matriculation", "pos_group": "noun", "row_number": 94078, "definition": "The act or process of matriculating; the state of being matriculated.", "details": []}, {"x": -0.6938274186909202, "y": -0.6688991696747153, "z": -0.2667909553961132, "word": "Matrix", "pos_group": "noun", "row_number": 94087, "definition": "Hence that which gives form or origin to anything", "details": []}, {"x": -0.5048601996676867, "y": -0.7519282680973098, "z": -0.42393402603198, "word": "Matronage", "pos_group": "noun", "row_number": 94096, "definition": "The collective body of matrons.", "details": []}, {"x": -0.5823865228752096, "y": -0.7928053607271477, "z": -0.17968193558513312, "word": "Matter", "pos_group": "noun", "row_number": 94116, "definition": "That of which anything is composed; constituent substance; material; the material or substantial part of anything; the constituent elements of conception; that into which a notion may be analyzed; the essence; the pith; the embodiment.", "details": []}, {"x": -0.6570957974423958, "y": -0.6494027783657288, "z": -0.38275467918029976, "word": "Matter", "pos_group": "noun", "row_number": 94117, "definition": "That of which the sensible universe and all existent bodies are composed; anything which has extension occupies space or is perceptible by the senses; body; substance.", "details": []}, {"x": -0.4692933087039449, "y": -0.8200326061563835, "z": -0.32758253196114323, "word": "Matter", "pos_group": "noun", "row_number": 94124, "definition": "That which is permanent or is supposed to be given and in or upon which changes are effected by psychological or physical processes and relations; -- opposed to form.", "details": []}, {"x": -0.6715719712907209, "y": -0.7117958513247534, "z": -0.20576139923116013, "word": "Matterless", "pos_group": "adjective", "row_number": 94131, "definition": "Not being or having matter; as matterless spirits.", "details": []}, {"x": -0.5610786653677013, "y": -0.700711051943048, "z": -0.44067533735627445, "word": "Mattery", "pos_group": "adjective", "row_number": 94135, "definition": "Full of substance or matter; important.", "details": []}, {"x": -0.5216569101786259, "y": -0.8253542096231188, "z": -0.21601966743860604, "word": "Maturation", "pos_group": "noun", "row_number": 94151, "definition": "The process of bringing or of coming to maturity; hence specifically the process of suppurating perfectly; the formation of pus or matter.", "details": []}, {"x": -0.6903647577736511, "y": -0.652553867457522, "z": -0.3123618915462624, "word": "May", "pos_group": "noun", "row_number": 94273, "definition": "The early part or springtime of life.", "details": []}, {"x": -0.4809183983663028, "y": -0.7827310846318554, "z": -0.39503106620091244, "word": "Maze", "pos_group": "noun", "row_number": 94310, "definition": "A wild fancy; a confused notion.", "details": []}, {"x": -0.6210666528174789, "y": -0.7635875341921251, "z": -0.17666434384018653, "word": "Mechanical", "pos_group": "adjective", "row_number": 94487, "definition": "Pertaining to governed by or in accordance with mechanics or the laws of motion; pertaining to the quantitative relations of force and matter as distinguished from mental vital chemical etc.; as mechanical principles; a mechanical theory; mechanical deposits.", "details": []}, {"x": -0.623886998309802, "y": -0.6615500547330466, "z": -0.4160727561649385, "word": "Mechanico-chemical", "pos_group": "adjective", "row_number": 94497, "definition": "Pertaining to connected with or dependent upon both mechanics and chemistry; -- said especially of those sciences which treat of such phenomena as seem to depend on the laws both of mechanics and chemistry as electricity and magnetism.", "details": []}, {"x": -0.4794741122086808, "y": -0.8312167900483839, "z": -0.2813951379525922, "word": "Mechanics", "pos_group": "noun", "row_number": 94498, "definition": "That science or branch of applied mathematics which treats of the action of forces on bodies.", "details": []}, {"x": -0.6896790836624495, "y": -0.6830088091015127, "z": -0.2405030732615644, "word": "Mechanist", "pos_group": "noun", "row_number": 94503, "definition": "One who regards the phenomena of nature as the effects of forces merely mechanical.", "details": []}, {"x": -0.5240748994400675, "y": -0.7318542237157578, "z": -0.4355856919209909, "word": "Medium", "pos_group": "noun", "row_number": 94658, "definition": "A substance through which an effect is transmitted from one thing to another; as air is the common medium of sound. Hence: The condition upon which any event or action occurs; necessary means of motion or action; that through or by which anything is accomplished conveyed or carried on; specifically in animal magnetism spiritualism etc. a person through whom the action of another being is said to be manifested and transmitted.", "details": []}, {"x": -0.5580225350282441, "y": -0.8080841296971482, "z": -0.1887084781673956, "word": "Medusoid", "pos_group": "adjective", "row_number": 94693, "definition": "Like a medusa; having the fundamental structure of a medusa but without a locomotive disk; -- said of the sessile gonophores of hydroids.", "details": []}, {"x": -0.6736408306325341, "y": -0.6467350135491512, "z": -0.35768960504086306, "word": "Meiosis", "pos_group": "noun", "row_number": 94805, "definition": "Diminution; a species of hyperbole representing a thing as being less than it really is.", "details": []}, {"x": -0.46909639672648473, "y": -0.8084637801776413, "z": -0.35543619219081646, "word": "Meliorism", "pos_group": "noun", "row_number": 94898, "definition": "The doctrine that there is a tendency throughout nature toward improvement.", "details": []}, {"x": -0.6551371875911943, "y": -0.7313160377120811, "z": -0.18966317096421886, "word": "Member", "pos_group": "noun", "row_number": 95002, "definition": "Hence a part of a whole; an independent constituent of a body", "details": []}, {"x": -0.5853507611870961, "y": -0.6832756263894042, "z": -0.4364618021772976, "word": "Membership", "pos_group": "noun", "row_number": 95011, "definition": "The collective body of members as of a society.", "details": []}, {"x": -0.5021267075730381, "y": -0.8313264651780701, "z": -0.23825422941974395, "word": "Meroblast", "pos_group": "noun", "row_number": 95377, "definition": "An ovum as that of a mammal only partially composed of germinal matter that is consisting of both a germinal portion and an albuminous or nutritive one; -- opposed to holoblast.", "details": []}, {"x": -0.6947183571168205, "y": -0.6609747182934077, "z": -0.2836879025652243, "word": "Metabasis", "pos_group": "noun", "row_number": 95608, "definition": "A transition from one subject to another.", "details": []}, {"x": -0.49386932774104286, "y": -0.7641169511907828, "z": -0.41499201440450995, "word": "Metabolic", "pos_group": "adjective", "row_number": 95615, "definition": "Of or pertaining to metamorphosis; pertaining to or involving change.", "details": []}, {"x": -0.5974355853661344, "y": -0.7824051486071204, "z": -0.17582066082031975, "word": "Metabolic", "pos_group": "adjective", "row_number": 95616, "definition": "Of or pertaining to metabolism; as metabolic activity; metabolic force.", "details": []}, {"x": -0.645618682267125, "y": -0.6522009443359007, "z": -0.3972536284478979, "word": "Metabolism", "pos_group": "noun", "row_number": 95618, "definition": "The act or process by which living tissues or cells take up and convert into their own proper substance the nutritive material brought to them by the blood or by which they transform their cell protoplasm into simpler substances which are fitted either for excretion or for some special purpose as in the manufacture of the digestive ferments. Hence metabolism may be either constructive (anabolism) or destructive (katabolism).", "details": []}, {"x": -0.4708924612709146, "y": -0.8259632089763176, "z": -0.30991138626349957, "word": "Metabolize", "pos_group": "other", "row_number": 95620, "definition": "To change by a metabolic process. See Metabolism.", "details": []}, {"x": -0.6804235176563481, "y": -0.6998984261797405, "z": -0.21717741515011108, "word": "Metagenesis", "pos_group": "noun", "row_number": 95639, "definition": "The change of form which one animal species undergoes in a series of successively produced individuals extending from the one developed from the ovum to the final perfected individual. Hence metagenesis involves the production of sexual individuals by nonsexual means either directly or through intervening sexless generations. Opposed to monogenesis. See Alternate generation under Generation.", "details": []}, {"x": -0.5461463776466698, "y": -0.7119801255180795, "z": -0.44137108542662895, "word": "Metagenetic", "pos_group": "adjective", "row_number": 95641, "definition": "Of or pertaining to metagenesis.", "details": []}, {"x": -0.5345548568385858, "y": -0.8202862274229388, "z": -0.20342470383540326, "word": "Metagenic", "pos_group": "adjective", "row_number": 95642, "definition": "Metagenetic.", "details": []}, {"x": -0.6860050723640253, "y": -0.648405863694939, "z": -0.33010131265544645, "word": "Metal", "pos_group": "noun", "row_number": 95650, "definition": "The substance of which anything is made; material; hence constitutional disposition; character; temper.", "details": []}, {"x": -0.474170048502049, "y": -0.7935734346609796, "z": -0.38131872351609014, "word": "Metameric", "pos_group": "adjective", "row_number": 95712, "definition": "Of or pertaining to a metamere or its formation; as metameric segmentation.", "details": []}, {"x": -0.6351109137721482, "y": -0.7513947012657054, "z": -0.17899757014364326, "word": "Metamorphic", "pos_group": "adjective", "row_number": 95717, "definition": "Causing a change of structure.", "details": []}, {"x": -0.6096470299663247, "y": -0.6683400572218663, "z": -0.42620660103512203, "word": "Metamorphosis", "pos_group": "noun", "row_number": 95729, "definition": "Change of form or structure; transformation.", "details": []}, {"x": -0.4861546853634711, "y": -0.8330522102637679, "z": -0.2639652190607611, "word": "Metamorphosis", "pos_group": "noun", "row_number": 95730, "definition": "A change in the form or function of a living organism by a natural process of growth or development; as the metamorphosis of the yolk into the embryo of a tadpole into a frog or of a bud into a blossom. Especially that form of sexual reproduction in which an embryo undergoes a series of marked changes of external form as the chrysalis stage pupa stage etc. in insects. In these intermediate stages sexual reproduction is usually impossible but they ultimately pass into final and sexually developed forms from the union of which organisms are produced which pass through the same cycle of changes. See Transformation.", "details": []}, {"x": -0.6937988683255554, "y": -0.6731585125186272, "z": -0.25593113787479566, "word": "Metamorphosis", "pos_group": "noun", "row_number": 95731, "definition": "The change of material of one kind into another through the agency of the living organism; metabolism.", "details": []}, {"x": -0.5110385683501777, "y": -0.7442011038725053, "z": -0.43012126040634774, "word": "Metaphor", "pos_group": "noun", "row_number": 95742, "definition": "The transference of the relation between one set of objects to another set for the purpose of brief explanation; a compressed simile; e. g. the ship plows the sea.", "details": []}, {"x": -0.572858279954443, "y": -0.7993777178716638, "z": -0.18118679658829334, "word": "Metaphysic", "pos_group": "noun", "row_number": 95755, "definition": "See Metaphysics.", "details": []}, {"x": -0.6645252618974954, "y": -0.6468762008077233, "z": -0.37410875040371744, "word": "Metaphysic", "pos_group": "adjective", "row_number": 95756, "definition": "Metaphysical.", "details": []}, {"x": -0.4674252197705015, "y": -0.8166192634598741, "z": -0.3385951010702183, "word": "Metaphysical", "pos_group": "adjective", "row_number": 95758, "definition": "According to rules or principles of metaphysics; as metaphysical reasoning.", "details": []}, {"x": -0.6664502589581487, "y": -0.7187951577398805, "z": -0.19793325527641123, "word": "Metaphysical", "pos_group": "adjective", "row_number": 95759, "definition": "Preternatural or supernatural.", "details": []}, {"x": -0.5700596383919028, "y": -0.6932382174136767, "z": -0.4409680063151987, "word": "Metaphysically", "pos_group": "adverb", "row_number": 95760, "definition": "In the manner of metaphysical science or of a metaphysician.", "details": []}, {"x": -0.5130909784375346, "y": -0.8288098048973975, "z": -0.22318592059525463, "word": "Metaphysics", "pos_group": "noun", "row_number": 95762, "definition": "The science of real as distinguished from phenomenal being; ontology; also the science of being with reference to its abstract and universal conditions as distinguished from the science of determined or concrete being; the science of the conceptions and relations which are necessarily implied as true of every kind of being; phylosophy in general; first principles or the science of first principles.", "details": []}, {"x": -0.6935704450791775, "y": -0.6543703119045118, "z": -0.30126322810901324, "word": "Metaphysics", "pos_group": "noun", "row_number": 95763, "definition": "Hence: The scientific knowledge of mental phenomena; mental philosophy; psychology.", "details": []}, {"x": -0.48431782926885886, "y": -0.7760302084692428, "z": -0.4039967274564039, "word": "Metastasis", "pos_group": "noun", "row_number": 95785, "definition": "The act or process by which matter is taken up by cells or tissues and is transformed into other matter; in plants the act or process by which are produced all of those chemical changes in the constituents of the plant which are not accompanied by a production of organic matter; metabolism.", "details": []}, {"x": -0.6124013920749931, "y": -0.7710905417645993, "z": -0.17430981437023924, "word": "Metatheses", "pos_group": "other", "row_number": 95797, "definition": "of Metathesis", "details": []}, {"x": -0.6328242337410772, "y": -0.6566238437976811, "z": -0.41033963608988216, "word": "Metempiricism", "pos_group": "noun", "row_number": 95832, "definition": "The science that is concerned with metempirics.", "details": []}, {"x": -0.4745184767195744, "y": -0.8304119704166509, "z": -0.29197290052412395, "word": "Metempsychose", "pos_group": "other", "row_number": 95836, "definition": "To translate or transfer as the soul from one body to another.", "details": []}, {"x": -0.6876031263094735, "y": -0.6885615373265569, "z": -0.23040171441186522, "word": "Metensomatosis", "pos_group": "noun", "row_number": 95840, "definition": "The assimilation by one body or organism of the elements of another.", "details": []}, {"x": -0.5316526627755659, "y": -0.7239051528500405, "z": -0.4396666644638982, "word": "Method", "pos_group": "noun", "row_number": 95891, "definition": "Classification; a mode or system of classifying natural objects according to certain common characteristics; as the method of Theophrastus; the method of Ray; the Linnaean method.", "details": []}, {"x": -0.54847887204289, "y": -0.8136897829730255, "z": -0.1925613253170782, "word": "Methodology", "pos_group": "noun", "row_number": 95911, "definition": "The science of method or arrangement; a treatise on method.", "details": []}, {"x": -0.6796929094346743, "y": -0.6458565571546466, "z": -0.347687872156298, "word": "Micella", "pos_group": "noun", "row_number": 96056, "definition": "A theoretical aggregation of molecules constituting a structural particle of protoplasm capable of increase or diminution without change in chemical nature.", "details": []}, {"x": -0.46927556371325363, "y": -0.8035868045655107, "z": -0.3660992936756365, "word": "Microcosm", "pos_group": "noun", "row_number": 96089, "definition": "A little world; a miniature universe. Hence (so called by Paracelsus) a man as a supposed epitome of the exterior universe or great world. Opposed to macrocosm.", "details": []}, {"x": -0.6483739977744406, "y": -0.7388253014548618, "z": -0.1837071934904083, "word": "Microcosmography", "pos_group": "noun", "row_number": 96092, "definition": "Description of man as a microcosm.", "details": []}, {"x": -0.5947046154054335, "y": -0.6765152384387337, "z": -0.4343426672290654, "word": "Microform", "pos_group": "noun", "row_number": 96101, "definition": "A microscopic form of life; an animal or vegetable organism microscopic size.", "details": []}, {"x": -0.4946533380216911, "y": -0.8332210413217092, "z": -0.24710477834870992, "word": "Micrography", "pos_group": "noun", "row_number": 96106, "definition": "The description of microscopic objects.", "details": []}, {"x": -0.6959394641216926, "y": -0.6643810108815934, "z": -0.2725181363835505, "word": "Micrology", "pos_group": "noun", "row_number": 96116, "definition": "That part of science which treats of microscopic objects or depends on microscopic observation.", "details": []}, {"x": -0.4991030058879175, "y": -0.7566330709156446, "z": -0.4223773023144196, "word": "Microorganism", "pos_group": "noun", "row_number": 96128, "definition": "Any microscopic form of life; -- particularly applied to bacteria and similar organisms esp. such are supposed to cause infectious diseases.", "details": []}, {"x": -0.5880506053487418, "y": -0.7894724616205786, "z": -0.17586846758791702, "word": "Microphytal", "pos_group": "adjective", "row_number": 96140, "definition": "Pertaining to or of the nature of microphytes.", "details": []}, {"x": -0.6537822984604045, "y": -0.6487010231491351, "z": -0.3895583252673414, "word": "Microscopial", "pos_group": "adjective", "row_number": 96146, "definition": "Microscopic.", "details": []}, {"x": -0.46779821802664234, "y": -0.8234906382022508, "z": -0.3209797439159486, "word": "Microzyme", "pos_group": "noun", "row_number": 96169, "definition": "A microorganism which is supposed to act like a ferment in causing or propagating certain infectious or contagious diseases; a pathogenic bacterial organism.", "details": []}, {"x": -0.6763761087342917, "y": -0.7064841650585852, "z": -0.20831582766302617, "word": "Mimic", "pos_group": "other", "row_number": 96497, "definition": "To assume a resemblance to (some other organism of a totally different nature or some surrounding object) as a means of protection or advantage.", "details": []}, {"x": -0.5547697307931787, "y": -0.7041762083185813, "z": -0.4431325009900875, "word": "Mineralogy", "pos_group": "noun", "row_number": 96591, "definition": "A treatise or book on this science.", "details": []}, {"x": -0.5254416449499553, "y": -0.8246442813091273, "z": -0.2094585568947666, "word": "Miniature", "pos_group": "verb", "row_number": 96623, "definition": "A particular feature or trait.", "details": []}, {"x": -0.690376106984353, "y": -0.6492225802663685, "z": -0.319203496499346, "word": "Minim", "pos_group": "noun", "row_number": 96637, "definition": "Anything very minute; as the minims of existence; -- applied to animalcula; and the like.", "details": []}, {"x": -0.47639824214410986, "y": -0.7874444841859111, "z": -0.3911213356583689, "word": "Miracle", "pos_group": "noun", "row_number": 96794, "definition": "Specifically: An event or effect contrary to the established constitution and course of things or a deviation from the known laws of nature; a supernatural event or one transcending the ordinary laws by which the universe is governed.", "details": []}, {"x": -0.6270074715816476, "y": -0.7590546417152281, "z": -0.17520753828347663, "word": "Mirror", "pos_group": "noun", "row_number": 96821, "definition": "That which gives a true representation or in which a true image may be seen; hence a pattern; an exemplar.", "details": []}, {"x": -0.618927678750118, "y": -0.6626102815637307, "z": -0.4217536523173503, "word": "Miscellanea", "pos_group": "other", "row_number": 96924, "definition": "A collection of miscellaneous matters; matters of various kinds.", "details": []}, {"x": -0.48013046521866176, "y": -0.8332759561955345, "z": -0.27409107463638627, "word": "Miscreated", "pos_group": "adjective", "row_number": 97008, "definition": "Formed unnaturally or illegitimately; deformed.", "details": []}, {"x": -0.6929557681126259, "y": -0.6779982749136274, "z": -0.24521550247401988, "word": "Mite", "pos_group": "noun", "row_number": 97548, "definition": "Anything very small; a minute object; a very little quantity or particle.", "details": []}, {"x": -0.5178671490626022, "y": -0.7362747569642792, "z": -0.43556067106542573, "word": "Mode", "pos_group": "noun", "row_number": 97727, "definition": "Any combination of qualities or relations considered apart from the substance to which they belong and treated as entities; more generally condition or state of being; manner or form of arrangement or manifestation; form as opposed to matter.", "details": []}, {"x": -0.5631862937276114, "y": -0.8056635047925624, "z": -0.18365052573494434, "word": "Model", "pos_group": "noun", "row_number": 97733, "definition": "Something intended to serve or that may serve as a pattern of something to be made; a material representation or embodiment of an ideal; sometimes a drawing; a plan; as the clay model of a sculpture; the inventor's model of a machine.", "details": []}, {"x": -0.6715164809179351, "y": -0.6449719426348841, "z": -0.36479694224236087, "word": "Modification", "pos_group": "noun", "row_number": 97811, "definition": "The act of modifying or the state of being modified; a modified form or condition; state as modified; a change; as the modification of an opinion or of a machine; the various modifications of light.", "details": []}, {"x": -0.4663476098648446, "y": -0.8125751456557966, "z": -0.3496305756592342, "word": "Molar", "pos_group": "adjective", "row_number": 97918, "definition": "Of or pertaining to a mass of matter; -- said of the properties or motions of masses as distinguished from those of molecules or atoms.", "details": []}, {"x": -0.6606014251897824, "y": -0.72610253131628, "z": -0.1907377022335091, "word": "Mould", "pos_group": "noun", "row_number": 97935, "definition": "A growth of minute fungi of various kinds esp. those of the great groups Hyphomycetes and Physomycetes forming on damp or decaying organic matter.", "details": []}, {"x": -0.5793224556864218, "y": -0.6859424808498629, "z": -0.440304900384937, "word": "Mouldable", "pos_group": "adjective", "row_number": 97952, "definition": "Capable of being molded or formed.", "details": []}, {"x": -0.5048371370813634, "y": -0.8316963433793738, "z": -0.2311290925713845, "word": "Molecular", "pos_group": "adjective", "row_number": 97991, "definition": "Pertaining to connected with produced by or consisting of molecules; as molecular forces; molecular groups of atoms etc.", "details": []}, {"x": -0.6960341314576012, "y": -0.6568492440633062, "z": -0.28997509965430823, "word": "Molecularity", "pos_group": "noun", "row_number": 97992, "definition": "The state of consisting of molecules; the state or quality of being molecular.", "details": []}, {"x": -0.4884996837867143, "y": -0.7689219428042982, "z": -0.41246467098933925, "word": "Molecule", "pos_group": "noun", "row_number": 97994, "definition": "One of the very small invisible particles of which all matter is supposed to consist.", "details": []}, {"x": -0.6033248005163038, "y": -0.7785319556261017, "z": -0.17287908824076936, "word": "Momentum", "pos_group": "noun", "row_number": 98099, "definition": "The quantity of motion in a moving body being always proportioned to the quantity of matter multiplied into the velocity; impetus.", "details": []}, {"x": -0.6415856123430548, "y": -0.6521964457418121, "z": -0.403742118432218, "word": "Momentum", "pos_group": "noun", "row_number": 98100, "definition": "Essential element or constituent element.", "details": []}, {"x": -0.4702340455358, "y": -0.8289334440052218, "z": -0.3029014490369385, "word": "Monad", "pos_group": "noun", "row_number": 98110, "definition": "An ultimate atom or simple unextended point; something ultimate and indivisible.", "details": []}, {"x": -0.6847134429144265, "y": -0.6946092237372605, "z": -0.2206479716457706, "word": "Monad", "pos_group": "noun", "row_number": 98111, "definition": "The elementary and indestructible units which were conceived of as endowed with the power to produce all the changes they undergo and thus determine all physical and spiritual phenomena.", "details": []}, {"x": -0.5397593413112833, "y": -0.7159004853272911, "z": -0.44288412544971467, "word": "Monerula", "pos_group": "noun", "row_number": 98186, "definition": "A germ in that stage of development in which its form is simply that of a non-nucleated mass of protoplasm. It precedes the one-celled germ. So called from its likeness to a moner.", "details": []}, {"x": -0.5389695401000751, "y": -0.818882596417765, "z": -0.19734013309110096, "word": "Monesin", "pos_group": "noun", "row_number": 98188, "definition": "The acrid principle of Monesia sometimes used as a medicine.", "details": []}, {"x": -0.6851654599367235, "y": -0.6456429966724738, "z": -0.3371845390249769, "word": "Monism", "pos_group": "noun", "row_number": 98239, "definition": "That doctrine which refers all phenomena to a single ultimate constituent or agent; -- the opposite of dualism.", "details": []}, {"x": -0.47027542394324345, "y": -0.7981425896360402, "z": -0.3765759315783182, "word": "Monism", "pos_group": "noun", "row_number": 98240, "definition": "See Monogenesis 1.", "details": []}, {"x": -0.6409804758919788, "y": -0.7465063269530533, "z": -0.17852824242778387, "word": "Monochromatic", "pos_group": "adjective", "row_number": 98308, "definition": "Consisting of one color or presenting rays of light of one color only.", "details": []}, {"x": -0.6041673317061638, "y": -0.6700694160968493, "z": -0.4312642031408142, "word": "Monocrotic", "pos_group": "adjective", "row_number": 98326, "definition": "Of pertaining to or showing monocrotism; as a monocrotic pulse; a pulse of the monocrotic type.", "details": []}, {"x": -0.4876503507278798, "y": -0.8344801837020194, "z": -0.2565929820622921, "word": "Monodynamism", "pos_group": "noun", "row_number": 98351, "definition": "The theory that the various forms of activity in nature are manifestations of the same force.", "details": []}, {"x": -0.6963581745969206, "y": -0.6684101545714553, "z": -0.2613678594200285, "word": "Monogenesis", "pos_group": "noun", "row_number": 98370, "definition": "Oneness of origin; esp. (Biol.) development of all beings in the universe from a single cell; -- opposed to polygenesis. Called also monism.", "details": []}, {"x": -0.5050498148780475, "y": -0.7488666697797027, "z": -0.4290960211709119, "word": "Monogenesis", "pos_group": "noun", "row_number": 98371, "definition": "That form of reproduction which requires but one parent as in reproduction by fission or in the formation of buds etc. which drop off and form new individuals; asexual reproduction.", "details": []}, {"x": -0.5784169183050338, "y": -0.7963336699215083, "z": -0.17688005757532405, "word": "Monogenesis", "pos_group": "noun", "row_number": 98372, "definition": "The direct development of an embryo without metamorphosis into an organism similar to the parent organism; -- opposed to metagenesis.", "details": []}, {"x": -0.6615995329874743, "y": -0.6457881221394205, "z": -0.38110859246991147, "word": "Monogenetic", "pos_group": "adjective", "row_number": 98373, "definition": "One in genesis; resulting from one process of formation; -- used of a mountain range.", "details": []}, {"x": -0.4654639802925708, "y": -0.8203588464120961, "z": -0.33219669800227153, "word": "Monogenetic", "pos_group": "adjective", "row_number": 98374, "definition": "Relating to or involving monogenesis; as the monogenetic school of physiologists who admit but one cell as the source of all beings.", "details": []}, {"x": -0.6715546101114367, "y": -0.7134552468197377, "z": -0.19999004081069527, "word": "Monogenic", "pos_group": "adjective", "row_number": 98375, "definition": "Of or pertaining to monogenesis.", "details": []}, {"x": -0.5637746954796052, "y": -0.6964638714288334, "z": -0.44395514247639917, "word": "Monogenic", "pos_group": "adjective", "row_number": 98376, "definition": "Producing only one kind of germs or young; developing only in one way.", "details": []}, {"x": -0.5165403642735685, "y": -0.8284820948447247, "z": -0.21634109780119384, "word": "Monogenism", "pos_group": "noun", "row_number": 98377, "definition": "The theory or doctrine that the human races have a common origin or constitute a single species.", "details": []}, {"x": -0.694053048776181, "y": -0.6507153473407737, "z": -0.3079933476873556, "word": "Monogenous", "pos_group": "ad d plants; exhibiting characters peculiar to living organisms; as organic bodies organic life organic remains. Cf. Inorganic.", "details": []}, {"x": -0.47731585232030765, "y": -0.776397908105323, "z": -0.41155299222993946, "word": "Organic", "pos_group": "adjective", "row_number": 105816, "definition": "Forming a whole composed of organs. Hence: Of or pertaining to a system of organs; inherent in or resulting from a certain organization; as an organic government; his love of truth was not inculcated but organic.", "details": []}, {"x": -0.6123134263241037, "y": -0.7733636301839316, "z": -0.16425883066662655, "word": "Organic", "pos_group": "adjective", "row_number": 105817, "definition": "Pertaining to or denoting any one of the large series of substances which in nature or origin are connected with vital processes and include many substances of artificial production which may or may not occur in animals or plants; -- contrasted with inorganic.", "details": []}, {"x": -0.6369244221921005, "y": -0.6490546823738081, "z": -0.41599915829709816, "word": "Organically", "pos_group": "adverb", "row_number": 105819, "definition": "In an organic manner; by means of organs or with reference to organic functions; hence fundamentally.", "details": []}, {"x": -0.46553492806888436, "y": -0.835447599375934, "z": -0.29206940860844577, "word": "Organific", "pos_group": "adjective", "row_number": 105822, "definition": "Making an organic or organized structure; producing an organism; acting through or resulting from organs.", "details": []}, {"x": -0.6937214081611616, "y": -0.6848521851990205, "z": -0.2229979647598198, "word": "Organism", "pos_group": "noun", "row_number": 105823, "definition": "Organic structure; organization.", "details": []}, {"x": -0.5285844635368652, "y": -0.7204901191224788, "z": -0.44887910750481613, "word": "Organism", "pos_group": "noun", "row_number": 105824, "definition": "An organized being; a living body either vegetable or animal compozed of different organs or parts with functions which are separate but mutually dependent and essential to the life of the individual.", "details": []}, {"x": -0.5438602781866314, "y": -0.8185806545165506, "z": -0.1847747543957654, "word": "Organizable", "pos_group": "adjective", "row_number": 105830, "definition": "Capable of being organized; esp. (Biol.) capable of being formed into living tissue; as organizable matter.", "details": []}, {"x": -0.6865408275230224, "y": -0.6382092029527987, "z": -0.3483542814583407, "word": "Organization", "pos_group": "noun", "row_number": 105832, "definition": "The state of being organized; also the relations included in such a state or condition.", "details": []}, {"x": -0.46076962552851614, "y": -0.8061218711474069, "z": -0.3712935241128164, "word": "Organization", "pos_group": "noun", "row_number": 105833, "definition": "That which is organized; an organized existence; an organism", "details": []}, {"x": -0.651042429414796, "y": -0.7388806791630689, "z": -0.1737788740359497, "word": "Organization", "pos_group": "noun", "row_number": 105834, "definition": "an arrangement of parts for the performance of the functions necessary to life.", "details": []}, {"x": -0.5962449952760445, "y": -0.6700498406616483, "z": -0.44218222107810884, "word": "Organize", "pos_group": "other", "row_number": 105837, "definition": "To furnish with organs; to give an organic structure to; to endow with capacity for the functions of life; as an organized being; organized matter; -- in this sense used chiefly in the past participle.", "details": []}, {"x": -0.4866890524589929, "y": -0.8388465299828486, "z": -0.24386526065083827, "word": "Organogenic", "pos_group": "adjective", "row_number": 105846, "definition": "Of or pertaining to organogenesis.", "details": []}, {"x": -0.7031139367148327, "y": -0.6586996163136835, "z": -0.26785370534225705, "word": "Organoleptic", "pos_group": "adjective", "row_number": 105852, "definition": "Making an impression upon an organ; plastic;  -0.7054983478606027, "y": -0.6583994037002089, "z": -0.26226381064334703, "word": "Phantasm", "pos_group": "noun", "row_number": 113075, "definition": "An image formed by the mind and supposed to be real or material; a shadowy or airy appearance; sometimes an optical illusion; a phantom; a dream.", "details": []}, {"x": -0.4938840363038491, "y": -0.752304180501231, "z": -0.43602405746081224, "word": "Phantasm", "pos_group": "noun", "row_number": 113076, "definition": "A mental image or representation of a real object; a fancy; a notion.", "details": []}, {"x": -0.5820097962960957, "y": -0.7965167908886521, "z": -0.16378522170153326, "word": "Phantasma", "pos_group": "noun", "row_number": 113077, "definition": "A phantasm.", "details": []}, {"x": -0.6637249617764709, "y": -0.6373278269519453, "z": -0.3915129833192423, "word": "Phantasmagorial", "pos_group": "adjective", "row_number": 113081, "definition": "Of relating to or resembling phantasmagoria; phantasmagoric.", "details": []}, {"x": -0.4550007858323917, "y": -0.827898695842886, "z": -0.3279604157723225, "word": "Phantasmagoric", "pos_group": "adjective", "row_number": 113082, "definition": "Of or pertaining to phantasmagoria; phantasmagorial.", "details": []}, {"x": -0.6811235358554875, "y": -0.7060388467248125, "z": -0.19385529608245247, "word": "Phantasmal", "pos_group": "adjective", "row_number": 113084, "definition": "Pertaining to of the nature of or resembling a phantasm; spectral; illusive.", "details": []}, {"x": -0.5563848132618983, "y": -0.6951105820198444, "z": -0.455255113464479, "word": "Phantom", "pos_group": "noun", "row_number": 113091, "definition": "That which has only an apparent existence; an apparition; a specter; a phantasm; a sprite; an airy spirit; an ideal image.", "details": []}, {"x": -0.5141364725927068, "y": -0.8331376326490716, "z": -0.20382682015335893, "word": "Pharmacodynamics", "pos_group": "noun", "row_number": 113112, "definition": "That branch of pharmacology which considers the mode of action and the effects of medicines.", "details": []}, {"x": -0.7012482332215687, "y": -0.6404486775600701, "z": -0.3131715293815613, "word": "Pharmacognosis", "pos_group": "noun", "row_number": 113113, "definition": "That branch of pharmacology which treats of unprepared medicines or simples; -- called also pharmacography and pharmacomathy.", "details": []}, {"x": -0.46749330870331857, "y": -0.7865729161565049, "z": -0.40342664003096707, "word": "Phase", "pos_group": "noun", "row_number": 113149, "definition": "That which is exhibited to the eye; the appearance which anything manifests especially any one among different and varying appearances of the same object.", "details": []}, {"x": -0.6250881574895123, "y": -0.7637944497526875, "z": -0.16088142805605593, "word": "Phase", "pos_group": "noun", "row_number": 113152, "definition": "Any one point or portion in a recurring series of changes as in the changes of motion of one of the particles constituting a wave or vibration; one portion of a series of such changes in distinction from a contrasted portion as the portion on one side of a position of equilibrium in contrast with that on the opposite side.", "details": []}, {"x": -0.626479883786581, "y": -0.6511791146364162, "z": -0.4283558285725607, "word": "Phenomenalism", "pos_group": "noun", "row_number": 113199, "definition": "That theory which limits positive or scientific knowledge to phenomena only whether material or spiritual.", "details": []}, {"x": -0.466737660360038, "y": -0.840073892823036, "z": -0.2764630373102125, "word": "Phenomenist", "pos_group": "noun", "row_number": 113200, "definition": "One who believes in the theory of phenomenalism.", "details": []}, {"x": -0.70097100016195, "y": -0.6740887443785597, "z": -0.2329034599015052, "word": "Phenomenology", "pos_group": "noun", "row_number": 113201, "definition": "A description history or explanation of phenomena.", "details": []}, {"x": -0.5152608580151398, "y": -0.7299277066638751, "z": -0.4491233586019743, "word": "Phenomena", "pos_group": "other", "row_number": 113202, "definition": "of Phenomenon", "details": []}, {"x": -0.5548380962299988, "y": -0.8136129888220317, "z": -0.17374864428809544, "word": "Phenomenon", "pos_group": "noun", "row_number": 113203, "definition": "An appearance; anything visible; whatever in matter or spirit is apparent to or is apprehended by observation; as the phenomena of heat light or electricity; phenomena of imagination or memory.", "details": []}, {"x": -0.6822499954121395, "y": -0.6342830930437348, "z": -0.36362054622780676, "word": "Philanthropinism", "pos_group": "noun", "row_number": 113228, "definition": "A system of education on so-called natural principles attempted in Germany in the last century by Basedow of Dessau.", "details": []}, {"x": -0.4546918507516664, "y": -0.815070923906281, "z": -0.359046946599725, "word": "Philosophized", "pos_group": "other", "row_number": 113310, "definition": "of Philosophize", "details": []}, {"x": -0.662876379304182, "y": -0.7277934520299097, "z": -0.17581694156982125, "word": "Philosophizing", "pos_group": "other", "row_number": 113311, "definition": "of Philosophize", "details": []}, {"x": -0.5834421571292109, "y": -0.675640569145582, "z": -0.45067179921651107, "word": "Philosophize", "pos_group": "other", "row_number": 113312, "definition": "To reason like a philosopher; to search into the reason and nature of things; to investigate phenomena and assign rational causes for their existence.", "details": []}, {"x": -0.4923123160701004, "y": -0.8398781159301618, "z": -0.2285461306329542, "word": "Philosophy", "pos_group": "noun", "row_number": 113315, "definition": "Literally the love of including the search after wisdom; in actual usage the knowledge of phenomena as explained by and resolved into causes and reasons powers and laws.", "details": []}, {"x": -0.7062016370470402, "y": -0.6497717732815638, "z": -0.2812043571472754, "word": "Philosophy", "pos_group": "noun", "row_number": 113316, "definition": "A particular philosophical system or theory; the hypothesis by which particular phenomena are explained.", "details": []}, {"x": -0.4818536684889714, "y": -0.7658623739919086, "z": -0.4257603390021182, "word": "Philosophy", "pos_group": "noun", "row_number": 113319, "definition": "The course of sciences read in the schools.", "details": []}, {"x": -0.5987808968464412, "y": -0.7848027804025695, "z": -0.15983126554015603, "word": "Philosophy", "pos_group": "noun", "row_number": 113320, "definition": "A treatise on philosophy.", "details": []}, {"x": -0.6507498848053275, "y": -0.6406967899476637, "z": -0.4074705029528055, "word": "Phlogistian", "pos_group": "noun", "row_number": 113361, "definition": "A believer in the existence of phlogiston.", "details": []}, {"x": -0.45708939970962, "y": -0.8343032752126504, "z": -0.3082325836808037, "word": "Phlogistic", "pos_group": "adjective", "row_number": 113362, "definition": "Of or pertaining to phlogiston or to belief in its existence.", "details": []}, {"x": -0.6907524801436417, "y": -0.692874724679123, "z": -0.20684686866432694, "word": "Phoronomia", "pos_group": "noun", "row_number": 113459, "definition": "See Phoronomics.", "details": []}, {"x": -0.5398192406710282, "y": -0.7077759842055557, "z": -0.45568447810213103, "word": "Photic", "pos_group": "adjective", "row_number": 113505, "definition": "Relating to the production of light by the lower animals.", "details": []}, {"x": -0.528667435511509, "y": -0.8272794783430475, "z": -0.1900510650907793, "word": "Photics", "pos_group": "noun", "row_number": 113506, "definition": "The science of light; -- a general term sometimes employed when optics is restricted to light as a producing vision.", "details": []}, {"x": -0.6961152472341189, "y": -0.6360726886738374, "z": -0.3329190551641902, "word": "Photogenic", "pos_group": "adjective", "row_number": 113525, "definition": "Of or pertaining to photogeny; producing or generating light.", "details": []}, {"x": -0.4602550202226474, "y": -0.7985435858182727, "z": -0.38793486297102153, "word": "Photography", "pos_group": "noun", "row_number": 113541, "definition": "The science which relates to the action of light on sensitive bodies in the production of pictures the fixation of images and the like.", "details": []}, {"x": -0.6406295346822825, "y": -0.7501685057844176, "z": -0.1638322685612835, "word": "Photological", "pos_group": "adjective", "row_number": 113551, "definition": "Pertaining to photology or the doctrine of light.", "details": []}, {"x": -0.6105243388995585, "y": -0.6589568553707278, "z": -0.439358503242146, "word": "Photologist", "pos_group": "noun", "row_number": 113552, "definition": "One who studies or expounds the laws of light.", "details": []}, {"x": -0.4744533033797143, "y": -0.8418878344819444, "z": -0.25713602832621313, "word": "Photology", "pos_group": "noun", "row_number": 113553, "definition": "The doctrine or science of light explaining its nature and phenomena; optics.", "details": []}, {"x": -0.705281275355274, "y": -0.6632855140711749, "z": -0.25026116250144687, "word": "Photomagnetism", "pos_group": "noun", "row_number": 113555, "definition": "The branch of science which treats of the relation of magnetism to light.", "details": []}, {"x": -0.5009112455295526, "y": -0.7437034828483189, "z": -0.4427110273093637, "word": "Photosculpture", "pos_group": "noun", "row_number": 113574, "definition": "A process in which by means of a number of photographs simultaneously taken from different points of view on the same level rough models of the figure or bust of a person or animal may be made with great expedition.", "details": []}, {"x": -0.5714216203871606, "y": -0.803754822487476, "z": -0.16569706419317629, "word": "Phrenics", "pos_group": "noun", "row_number": 113614, "definition": "That branch of science which relates to the mind; mental philosophy.", "details": []}, {"x": -0.6718721270181774, "y": -0.634696825550707, "z": -0.38 ": -0.15850240740538357, "word": "Physical", "pos_group": "adjective", "row_number": 113746, "definition": "Of or pertaining to physics or natural philosophy; treating of or relating to the causes and connections of natural phenomena; as physical science; physical laws.", "details": []}, {"x": -0.6363595313896935, "y": -0.6458573587225485, "z": -0.42179950094022534, "word": "Physical", "pos_group": "adjective", "row_number": 113747, "definition": "Perceptible through a bodily or material organization; cognizable by the senses; external; as the physical opposed to chemical characters of a mineral.", "details": []}, {"x": -0.4614209264809855, "y": -0.8390381088094158, "z": -0.2882807322228591, "word": "Physicism", "pos_group": "noun", "row_number": 113754, "definition": "The tendency of the mind toward or its preoccupation with physical phenomena; materialism in philosophy and religion.", "details": []}, {"x": -0.6984888531683059, "y": -0.6803813885060929, "z": -0.22179830516517882, "word": "Physicist", "pos_group": "noun", "row_number": 113755, "definition": "One versed in physics.", "details": []}, {"x": -0.5238015948584018, "y": -0.7211225901709819, "z": -0.4534469088756572, "word": "Physicist", "pos_group": "noun", "row_number": 113756, "definition": "A believer in the theory that the fundamental phenomena of life are to be explained upon purely chemical and physical principles; -- opposed to vitalist.", "details": []}, {"x": -0.5442837468737253, "y": -0.8197454529624225, "z": -0.17824868929821455, "word": "Physico-", "pos_group": "other", "row_number": 113758, "definition": "A combining form denoting relation to or dependence upon natural causes or the science of physics.", "details": []}, {"x": -0.6888331012148127, "y": -0.6334874806800481, "z": -0.3524238506293655, "word": "Physicochemical", "pos_group": "adjective", "row_number": 113759, "definition": "Involving the principles of both physics and chemistry; dependent on or produced by the joint action of physical and chemical agencies.", "details": []}, {"x": -0.455101314459777, "y": -0.8095494094469909, "z": -0.37082684266515975, "word": "Physicologic", "pos_group": "noun", "row_number": 113760, "definition": "Logic illustrated by physics.", "details": []}, {"x": -0.6552461560392789, "y": -0.7361743299921121, "z": -0.16941024424872836, "word": "Physico-philosophy", "pos_group": "noun", "row_number": 113764, "definition": "The philosophy of nature.", "details": []}, {"x": -0.5938474438939869, "y": -0.6682432676650775, "z": -0.44810283261867206, "word": "Physics", "pos_group": "noun", "row_number": 113766, "definition": "The science of nature or of natural objects; that branch of science which treats of the laws and properties of matter and the forces acting upon it; especially that department of natural science which treats of the causes (as gravitation heat light magnetism electricity etc.) that modify the general properties of bodies; natural philosophy.", "details": []}, {"x": -0.48415838492041113, "y": -0.841844793807119, "z": -0.23851205724472, "word": "Physiogeny", "pos_group": "noun", "row_number": 113768, "definition": "The germ history of the functions or the history of the development of vital activities in the individual being one of the branches of ontogeny. See Morphogeny.", "details": []}, {"x": -0.7073786235159176, "y": -0.6537123503814624, "z": -0.2688413025401226, "word": "Physiognomical", "pos_group": "adjective", "row_number": 113771, "definition": "Of or pertaining to physiognomy; according with the principles of physiognomy.", "details": []}, {"x": -0.4878357389854377, "y": -0.7575227602241277, "z": -0.43379206944220494, "word": "Physiognomies", "pos_group": "other", "row_number": 113777, "definition": "of Physiognomy", "details": []}, {"x": -0.5883397731011617, "y": -0.792601943017179, "z": -0.16012017771869314, "word": "Physiognomy", "pos_group": "noun", "row_number": 113781, "definition": "The general appearance or aspect of a thing without reference to its scientific characteristics; as the physiognomy of a plant or of a meteor.", "details": []}, {"x": -0.6597259942292859, "y": -0.6369770880083659, "z": -0.39877537773859967, "word": "Physiogony", "pos_group": "noun", "row_number": 113782, "definition": "The birth of nature.", "details": []}, {"x": -0.4538558831624761, "y": -0.831427450652852, "z": -0.32053585075574353, "word": "Physiography", "pos_group": "noun", "row_number": 113785, "definition": "The science which treats of the earth's exterior physical features climate life etc. and of the physical movements or changes on the earth's surface as the currents of the atmosphere and ocean the secular variations in heat moisture magnetism etc.; physical geography.", "details": []}, {"x": -0.6861016492511703, "y": -0.700278754556087, "z": -0.1971653945605046, "word": "Physiologic", "pos_group": "adjective", "row_number": 113788, "definition": "Physiological.", "details": []}, {"x": -0.5494746876360704, "y": -0.6991726416475482, "z": -0.4574223265417114, "word": "Physiological", "pos_group": "adjective", "row_number": 113789, "definition": "Of or pertaining to physiology; relating to the science of the functions of living organism; as physiological botany or chemistry.", "details": []}, {"x": -0.5186387309379134, "y": -0.8320025318493677, "z": -0.19694073668835674, "word": "Physiologist", "pos_group": "noun", "row_number": 113791, "definition": "One who is versed in the science of physiology; a student of the properties and functions of animal and vegetable organs and tissues.", "details": []}, {"x": -0.7008078725896885, "y": -0.6371542443291045, "z": -0.32078465463566497, "word": "Physiologize", "pos_group": "other", "row_number": 113792, "definition": "To speculate in physiology; to make physiological investigations.", "details": []}, {"x": -0.46292717711426107, "y": -0.7916634634330225, "z": -0.39870714735787305, "word": "Physiologies", "pos_group": "other", "row_number": 113793, "definition": "of Physiology", "details": []}, {"x": -0.6315533238531157, "y": -0.758675401777037, "z": -0.15985003555999988, "word": "Physiology", "pos_group": "noun", "row_number": 113794, "definition": "The science which treats of the phenomena of living organisms; the study of the processes incidental to and characteristic of life.", "details": []}, {"x": -0.6207987862775406, "y": -0.6527330889038125, "z": -0.4342215812306198, "word": "Physiology", "pos_group": "noun", "row_number": 113795, "definition": "A treatise on physiology.", "details": []}, {"x": -0.4679391676762749, "y": -0.8419975920834031, "z": -0.26846413220425935, "word": "Physique", "pos_group": "noun", "row_number": 113797, "definition": "The natural constitution or physical structure of a person.", "details": []}, {"x": -0.7041705542289611, "y": -0.6687911051209059, "z": -0.23845814783318894, "word": "Phytolithology", "pos_group": "noun", "row_number": 113827, "definition": "The branch of science which treats of fossil plants; -- usually called paleobotany sometimes paleophytology.", "details": []}, {"x": -0.5086272289148055, "y": -0.7349134203541803, "z": -0.44855390600212797, "word": "Pial", "pos_group": "adjective", "row_number": 113859, "definition": "Pertaining to the pia mater.", "details": []}, {"x": -0.560711887319707, "y": -0.8106527641529709, "z": -0.16865430735537085, "word": "Picture", "pos_group": "noun", "row_number": 114045, "definition": "A representation of anything (as a person a landscape a building) upon canvas paper or other surface produced by means of painting drawing engraving photography etc.; a representation in colors. By extension a figure; a model.", "details": []}, {"x": -0.6795097888281298, "y": -0.6327572455759373, "z": -0.371328311683749, "word": "Piece", "pos_group": "noun", "row_number": 114081, "definition": "Any one thing conceived of as apart from other things of the same kind; an individual article; a distinct single effort of a series; a definite performance", "details": []}, {"x": -0.45214653313834474, "y": -0.8193784280070765, "z": -0.3523953806275386, "word": "Pietism", "pos_group": "noun", "row_number": 114145, "definition": "The principle or practice of the Pietists.", "details": []}, {"x": -0.6686613012755802, "y": -0.7220603764550984, "z": -0.17754119783861297, "word": "Pilular", "pos_group": "adjective", "row_number": 114391, "definition": "Of or pertaining to pills; resembling a pill or pills; as a pilular mass.", "details": []}, {"x": -0.576743013192658, "y": -0.6788838990721866, "z": -0.4544052688008787, "word": "Pistillaceous", "pos_group": "adjective", "row_number": 114837, "definition": "Growing on or having nature of the pistil; of or pertaining to a pistil.", "details": []}, {"x": -0.49569633055905293, "y": -0.8399240413294562, "z": -0.22093608276396173, "word": "Pith", "pos_group": "noun", "row_number": 114934, "definition": "Hence: The which contains the strength of life; the vital or essential part; concentrated force; vigor; strength; importance; as the speech lacked pith.", "details": []}, {"x": -0.7072000632615869, "y": -0.6455543598520639, "z": -0.2883186414347833, "word": "Placental", "pos_group": "adjective", "row_number": 115047, "definition": "Of or pertaining to the placenta; having or characterized by having a placenta; as a placental mammal.", "details": []}, {"x": -0.47628389693309053, "y": -0.7711332133480368, "z": -0.42250114413307854, "word": "Placentary", "pos_group": "adjective", "row_number": 115051, "definition": "Having reference to the placenta; as the placentary system of classification.", "details": []}, {"x": -0.6052874232118249, "y": -0.7803413790008962, "z": -0.1571447343074806, "word": "Plain", "pos_group": "verb", "row_number": 115156, "definition": "To make plain or manifest; to explain.", "details": []}, {"x": -0.646012040284943, "y": -0.6411004273112743, "z": -0.4143171320476463, "word": "Planeted", "pos_group": "adjective", "row_number": 115237, "definition": "Belonging to planets.", "details": []}, {"x": -0.45685817688365266, "y": -0.8372662880388029, "z": -0.3004426220233567, "word": "Plank", "pos_group": "noun", "row_number": 115269, "definition": "One of the separate articles in a declaration of the principles of a party or cause; as a plank in the national platform.", "details": []}, {"x": -0.6951221636328128, "y": -0.6871949232668972, "z": -0.21111209122795557, "word": "Plant", "pos_group": "noun", "row_number": 115292, "definition": "A vegetable; an organized living being generally without feeling and voluntary motion and having when complete a root stem and leaves though consisting sometimes only of a single leafy expansion or a series of cellules or even a single cellule.", "details": []}, {"x": -0.5328929357063872, "y": -0.712285926875378, "z": -0.4568083596537085, "word": "Plantation", "pos_group": "noun", "row_number": 115317, "definition": "The act or practice of planting or setting in the earth for growth.", "details": []}, {"x": -0.5338025184982719, "y": -0.8254036923297375, "z": -0.18374878484860252, "word": "Plantule", "pos_group": "noun", "row_number": 115338, "definition": "The embryo which has begun its development in the act of germination.", "details": []}, {"x": -0.6947578006048644, "y": -0.6334232403430181, "z": -0.34071483250959683, "word": "Plasmic", "pos_group": "adjective", "row_number": 115371, "definition": "Of pertaining to or connected with plasma; plasmatic.", "details": []}, {"x": -0.4564090118946111, "y": -0.8034239766353352, "z": -0.3823620373792999, "word": "Plasmid", "pos_group": "noun", "row_number": 115372, "definition": "A piece of DNA usually circular functioning as part of the genetic material of a cell not integrated with the chromosome and replicating independently of the chromosome but transferred like the chromosome to subsequent generations. In bacteria plasmids often carry the genes for antibiotic resistance; they are exploited in genetic engineering as the vehicles for introduction of extraneous DNA into cells to alter the genetic makeup of the cell. The cells thus altered may produce desirable proteins which are extracted and used; in the case of genetically altered plant cells the altered cells may grow into complete plants with changed properties as for example increased resistance to disease.", "details": []}, {"x": -0.6469500904256341, "y": -0.7447146137265527, "z": -0.1638771631447629, "word": "Plasmodial", "pos_group": "adjective", "row_number": 115374, "definition": "Of or pertaining to or like a plasmodium; as the plasmodial form of a life cycle.", "details": []}, {"x": -0.6043364563710841, "y": -0.6612154047258487, "z": -0.4444903104164056, "word": "Plasmodium", "pos_group": "noun", "row_number": 115376, "definition": "A jellylike mass of free protoplasm without any union of amoeboid cells and endowed with life and power of motion.", "details": []}, {"x": -0.4765473874255314, "y": -0.8431074682768189, "z": -0.24914330108143262, "word": "Plasmogen", "pos_group": "noun", "row_number": 115378, "definition": "The important living portion of protoplasm considered a chemical substance of the highest elaboration. Germ plasm and idioplasm are forms of plasmogen.", "details": []}, {"x": -0.7076713495834455, "y": -0.6583220438797361, "z": -0.25654112247503685, "word": "Plastic", "pos_group": "adjective", "row_number": 115397, "definition": "Having the power to give form or fashion to a mass of matter; as the plastic hand of the Creator.", "details": []}, {"x": -0.49457914165431466, "y": -0.7489009294372737, "z": -0.44106560796379124, "word": "Plastic", "pos_group": "adjective", "row_number": 115398, "definition": "Capable of being molded formed or modeled as clay or plaster; -- used also figuratively; as the plastic mind of a child.", "details": []}, {"x": -0.5776606788208222, "y": -0.8001483100609236, "z": -0.16146461547631732, "word": "Plastide", "pos_group": "noun", "row_number": 115406, "definition": "A formative particle of albuminous matter; a monad; a cytode. See the Note under Morphon.", "details": []}, {"x": -0.6682917134972618, "y": -0.6339129470341393, "z": -0.3892821101121737, "word": "Platonism", "pos_group": "noun", "row_number": 115516, "definition": "An elevated rational and ethical conception of the laws and forces of the universe; sometimes imaginative or fantastic philosophical notions.", "details": []}, {"x": -0.45146602333472385, "y": -0.8278379961652457, "z": -0.33296048095748776, "word": "Platonize", "pos_group": "other", "row_number": 115521, "definition": "To explain by or accomodate to the Platonic philosophy.", "details": []}, {"x": -0.6806173469158976, "y": -0.708079851627988, "z": -0.1881035640163453, "word": "Plebeiance", "pos_group": "noun", "row_number": 115684, "definition": "Plebeianism.", "details": []}, {"x": -0.559515702528034, "y": -0.6906979639233332, "z": -0.4581249843183873, "word": "Plenum", "pos_group": "noun", "row_number": 115775, "definition": "That state in which every part of space is supposed to be full of matter; -- opposed to vacuum.", "details": []}, {"x": -0.5088754673582995, "y": -0.8361389393384767, "z": -0.20473747298137515, "word": "Pleochroic", "pos_group": "adjective", "row_number": 115776, "definition": "Having the property of pleochroism.", "details": []}, {"x": -0.7047235436381941, "y": -0.6389727027861251, "z": -0.30834819950215486, "word": "Pleomorphic", "pos_group": "adjective", "row_number": 115781, "definition": "Pertaining to pleomorphism; as the pleomorphic character of bacteria.", "details": []}, {"x": -0.4664800127242845, "y": -0.7842837344158348, "z": -0.40901763001061897, "word": "Pleomorphism", "pos_group": "noun", "row_number": 115783, "definition": "The theory that the various genera of bacteria are phases or variations of growth of a number of Protean species each of which may exhibit according to undetermined conditions all or some of the forms characteristic of the different genera and species.", "details": []}, {"x": -0.6219557610891566, "y": -0.7671823200368646, "z": -0.15685126416724246, "word": "Pleomorphous", "pos_group": "adjective", "row_number": 115784, "definition": "Having the property of pleomorphism.", "details": []}, {"x": -0.6309614116431463, "y": -0.6470094806344754, "z": -0.42809628471454214, "word": "Plutocratic", "pos_group": "adjective", "row_number": 116204, "definition": "Of or pertaining to plutocracy; as plutocratic ideas.", "details": []}, {"x": -0.4621118284080106, "y": -0.8413699981247942, "z": -0.28026627392693765, "word": "Plutonic", "pos_group": "adjective", "row_number": 116209, "definition": "Of pertaining to or designating the system of the Plutonists; igneous; as the Plutonic theory.", "details": []}, {"x": -0.7021590192941609, "y": -0.6748842224779892, "z": -0.22694492255642645, "word": "Plutonism", "pos_group": "noun", "row_number": 116210, "definition": "The theory early advanced in geology that the successive rocks of the earth's crust were formed by igneous fusion; -- opposed to the Neptunian theory.", "details": []}, {"x": -0.5169850349971781, "y": -0.7259948409631714, "z": -0.45349527504024356, "word": "Plutonist", "pos_group": "noun", "row_number": 116211, "definition": "One who adopts the geological theory of igneous fusion; a Plutonian. See Plutonism.", "details": []}, {"x": -0.5499570095819009, "y": -0.8171528413644683, "z": -0.17265144500324683, "word": "Pneumatology", "pos_group": "noun", "row_number": 116256, "definition": "The science of spiritual being or phenomena of any description.", "details": []}, {"x": -0.6865722202696201, "y": -0.6315334241214129, "z": -0.36025563225510826, "word": "Pneumology", "pos_group": "noun", "row_number": 116267, "definition": "The science which treats of the lungs.", "details": []}, {"x": -0.452049968287184, "y": -0.8141214152239596, "z": -0.3644957440702056, "word": "Polaristic", "pos_group": "adjective", "row_number": 116613, "definition": "Pertaining to or exhibiting poles; having a polar arrangement or disposition; arising from or dependent upon the possession of poles or polar characteristics; as polaristic antagonism.", "details": []}, {"x": -0.6612984845544289, "y": -0.730480076104665, "z": -0.17053789238799263, "word": "Polarity", "pos_group": "noun", "row_number": 116614, "definition": "That quality or condition of a body in virtue of which it exhibits opposite or contrasted properties or powers in opposite or contrasted parts or directions; or a condition giving rise to a contrast of properties corresponding to a contrast of positions as for example attraction and repulsion in the opposite parts of a magnet the dissimilar phenomena corresponding to the different sides of a polarized ray of light etc.", "details": []}, {"x": -0.5872605706280453, "y": -0.6711652744327296, "z": -0.45239606163323454, "word": "Polarization", "pos_group": "noun", "row_number": 116617, "definition": "The act of polarizing; the state of being polarized or of having polarity.", "details": []}, {"x": -0.4871096870751534, "y": -0.8423265034194024, "z": -0.2306733933395651, "word": "Polarization", "pos_group": "noun", "row_number": 116619, "definition": "An effect produced upon the plates of a voltaic battery or the electrodes in an electrolytic cell by the deposition upon them of the gases liberated by the action of the current. It is chiefly due to the hydrogen and results in an increase of the resistance and the setting up of an opposing electro-motive force both of which tend materially to weaken the current of the battery or that passing through the cell.", "details": []}, {"x": -0.7089035467783755, "y": -0.6491741295202745, "z": -0.2757330428632624, "word": "Polity", "pos_group": "noun", "row_number": 116750, "definition": "Hence: The form or constitution by which any institution is organized; the recognized principles which lie at the foundation of any human institution.", "details": []}, {"x": -0.48192265727083505, "y": -0.7628314482975461, "z": -0.4310901691030377, "word": "Pollution", "pos_group": "noun", "row_number": 116829, "definition": "The emission of semen or sperm at other times than in sexual intercourse.", "details": []}, {"x": -0.594826457674387, "y": -0.7884062754979922, "z": -0.15683440313249022, "word": "Polyconic", "pos_group": "adjective", "row_number": 116906, "definition": "Pertaining to or based upon many cones.", "details": []}, {"x": -0.6553613799442752, "y": -0.6369514226178684, "z": -0.40594869984101295, "word": "Polycrotic", "pos_group": "adjective", "row_number": 116910, "definition": "Of or pertaining to polycrotism; manifesting polycrotism; as a polycrotic pulse; a polycrotic pulse curve.", "details": []}, {"x": -0.45309436763911987, "y": -0.8347585115673513, "z": -0.3128637425135204, "word": "Polyembryonate", "pos_group": "adjective", "row_number": 116926, "definition": "Consisting of or having several embryos; polyembryonic.", "details": []}, {"x": -0.6908806865935395, "y": -0.6944861111498528, "z": -0.20093013291190018, "word": "Polyembryony", "pos_group": "noun", "row_number": 116928, "definition": "The production of two or more embryos in one seed due either to the existence and fertilization of more than one embryonic sac or to the origination of embryos outside of the embryonic sac.", "details": []}, {"x": -0.542475521205542, "y": -0.7034814029840085, "z": -0.4591668809359257, "word": "Polygeny", "pos_group": "noun", "row_number": 116950, "definition": "The theory that living organisms originate in cells or embryos of different kinds instead of coming from a single cell; -- opposed to monogenesis.", "details": []}, {"x": -0.5234721968447259, "y": -0.8305370335210109, "z": -0.19022380261333138, "word": "Polygenetic", "pos_group": "adjective", "row_number": 116951, "definition": "Having many distinct sources; originating at various places or times.", "details": []}, {"x": -0.6999687535130183, "y": -0.6341013970808803, "z": -0.32857139608539715, "word": "Polygenetic", "pos_group": "adjective", "row_number": 116952, "definition": "Of or pertaining to polygenesis; polyphyletic.", "details": []}, {"x": -0.4586187461554478, "y": -0.796729056511167, "z": -0.3935627728655631, "word": "Polygenist", "pos_group": "noun", "row_number": 116955, "definition": "One who maintains that animals of the same species have sprung from more than one original pair; -- opposed to monogenist.", "details": []}, {"x": -0.6380379330131177, "y": -0.7533524941474004, "z": -0.1592721431959753, "word": "Polymathic", "pos_group": "adjective", "row_number": 117002, "definition": "Pertaining to polymathy; acquainted with many branches of learning.", "details": []}, {"x": -0.6148320164976305, "y": -0.654613694150394, "z": -0.4398437255665145, "word": "Polymathist", "pos_group": "noun", "row_number": 117003, "definition": "One versed in many sciences; a person of various learning.", "details": []}, {"x": -0.46954337907628885, "y": -0.8436443271134211, "z": -0.26037139722896513, "word": "Polymorphism", "pos_group": "noun", "row_number": 117019, "definition": "Same as Pleomorphism.", "details": []}, {"x": -0.7070625498748331, "y": -0.6635762885762133, "z": -0.24439529415256203, "word": "Polymorphism", "pos_group": "noun", "row_number": 117021, "definition": "Existence in many forms; the coexistence in the same locality of two or more distinct forms independent of sex not connected by intermediate gradations but produced from common parents.", "details": []}, {"x": -0.5020452613014412, "y": -0.740054930565535, "z": -0.44751453088185694, "word": "Polymorphosis", "pos_group": "noun", "row_number": 117022, "definition": "The assumption of several structural forms without a corresponding difference in function; -- said of sponges etc.", "details": []}, {"x": -0.5668178358294875, "y": -0.8073808430960702, "z": -0.1638710321779148, "word": "Polymorphy", "pos_group": "noun", "row_number": 117025, "definition": "Existence in many forms; polymorphism.", "details": []}, {"x": -0.6763762070675562, "y": -0.6315363180265386, "z": -0.379047629 n", "row_number": 125898, "definition": "One who believes in realism; esp. one who maintains that generals or the terms used to denote the genera and species of things represent real existences and are not mere names as maintained by the nominalists.", "details": []}, {"x": -0.6788135866605205, "y": -0.7127151605573401, "z": -0.17677447348756226, "word": "Realize", "pos_group": "other", "row_number": 125911, "definition": "To make real; to convert from the imaginary or fictitious into the actual; to bring into concrete existence; to effectuate; to accomplish; as to realize a scheme or project.", "details": []}, {"x": -0.5663922339448514, "y": -0.681704249815875, "z": -0.46311894056487896, "word": "Reason", "pos_group": "other", "row_number": 126013, "definition": "To find by logical processes; to explain or justify by reason or argument; -- usually with out; as to reason out the causes of the librations of the moon.", "details": []}, {"x": -0.49824409653284923, "y": -0.841844345090391, "z": -0.20748715360112205, "word": "Recess", "pos_group": "noun", "row_number": 126263, "definition": "Secret or abstruse part; as the difficulties and recesses of science.", "details": []}, {"x": -0.7112267579567257, "y": -0.6366348698269858, "z": -0.2980814339853149, "word": "Recognitory", "pos_group": "adjective", "row_number": 126419, "definition": "Pertaining to or connected with recognition.", "details": []}, {"x": -0.46522828327436955, "y": -0.7791045476962873, "z": -0.42018894345347374, "word": "Re-creation", "pos_group": "noun", "row_number": 126648, "definition": "A forming anew; a new creation or formation.", "details": []}, {"x": -0.6150016893335746, "y": -0.7742374903013336, "z": -0.14942968489808747, "word": "Redintegration", "pos_group": "noun", "row_number": 126919, "definition": "Restoration of a mixed body or matter to its former nature and state.", "details": []}, {"x": -0.6401720170594603, "y": -0.6388663520918524, "z": -0.4266492385307528, "word": "Redintegration" es.", "details": []}, {"x": -0.6502651765512871, "y": -0.6340378928380809, "z": -0.4185106338077557, "word": "Resolve", "pos_group": "other", "row_number": 129437, "definition": "To be separated into its component parts or distinct principles; to undergo resolution.", "details": []}, {"x": -0.4486195822816836, "y": -0.8413303788962243, "z": -0.30150234483291033, "word": "Result", "pos_group": "noun", "row_number": 129743, "definition": "That which results; the conclusion or end to which any course or condition of things leads or which is obtained by any process or operation; consequence or effect; as the result of a course of action; the result of a mathematical operation.", "details": []}, {"x": -0.7000133357330901, "y": -0.684442082770743, "z": -0.2037654659854791, "word": "Reticulated", "pos_group": "adjective", "row_number": 129892, "definition": "Resembling network; having the form or appearance of a net; netted; as a reticulated structure.", "details": []}, {"x": -0.5309134457774355, "y": -0.7084616600423049, "z": -0.4649870851355244, "word": "Reticulation", "pos_group": "noun", "row_number": 129894, "definition": "The quality or state of being reticulated or netlike; that which is reticulated; network; an organization resembling a net.", "details": []}, {"x": -0.528828607296241, "y": -0.8299727394172197, "z": -0.17744169726812706, "word": "Retrieve", "pos_group": "noun", "row_number": 130042, "definition": "A seeking again; a discovery.", "details": []}, {"x": -0.7010658642971692, "y": -0.6266894605068583, "z": -0.3402454614052714, "word": "Retrogression", "pos_group": "noun", "row_number": 130083, "definition": "Backward development; a passing from a higher to a lower state of organization or structure as when an animal approaching maturity becomes less highly organized than would be expected from its earlier stages or known relationship. Called also retrograde development and regressive metamorphism.", "details": []}, {"x": -0.44907771383001027, "y": -0.8049640995032427, "z": -0.3877654000193221, "word": "Rhabdology", "pos_group": "noun", "row_number": 130537, "definition": "Same as Rabdology.", "details": []}, {"x": -0.6484500185890842, "y": -0.7453544976759523, "z": -0.1547877455939101, "word": "Root", "pos_group": "noun", "row_number": 132045, "definition": "That which resembles a root in position or function esp. as a source of nourishment or support; that from which anything proceeds as if by growth or development; as the root of a tooth a nail a cancer and the like.", "details": []}, {"x": -0.6064499258268599, "y": -0.6549125556875661, "z": -0.4508969193367559, "word": "Rotation", "pos_group": "adjective", "row_number": 132263, "definition": "Pertaining to or resulting from rotation; of the nature of or characterized by rotation; as rotational velocity.", "details": []}, {"x": -0.46892935960646104, "y": -0.8479398138547862, "z": -0.24719087317088573, "word": "Rudiment", "pos_group": "noun", "row_number": 132804, "definition": "That which is unformed or undeveloped; the principle which lies at the bottom of any development; an unfinished beginning.", "details": []}, {"x": -0.7137867687889569, "y": -0.6536778708500823, "z": -0.25142332800025463, "word": "Rudiment", "pos_group": "noun", "row_number": 132805, "definition": "Hence an element or first principle of any art or science; a beginning of any knowledge; a first step.", "details": []}, {"x": -0.49017500207945613, "y": -0.7470976441893624, "z": -0.448969461526182, "word": "Rudiment", "pos_group": "noun", "row_number": 132806, "definition": "An imperfect organ or part or one which is never developed.", "details": []}, {"x": -0.5750380869148427, "y": -0.8036289610617823, "z": -0.15333522602480582, "word": "Rudimentary", "pos_group": "adjective", "row_number": 132809, "definition": "Of or pertaining to rudiments; consisting in first principles; elementary; initial; as rudimental essays.", "details": []}, {"x": -0.6735573217954284, "y": -0.626764291076136, "z": -0
