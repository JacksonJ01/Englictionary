<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 88, "radius": 285.0, "nodes": [{"x": -0.5262927982047779, "y": 0.4600753707351591, "z": 0.7150849906134868, "word": "Action plans, CompTIA troubleshooting process", "row_number": 70, "definition": "Step 4 of the official CompTIA 6-step troubleshooting methodology. After identifying the root cause of a technical problem, the technician establishes a clear plan of action to resolve the issue and implement the solution safely, ensuring no secondary systems are broken in the process.", "details": [{"label": "TROUBLESHOOTING", "value": "Always document your plan before executing any changes; identify potential risks or side effects of your plan; schedule necessary downtime if the fix impacts production environments; make sure you have a working backup of critical data before proceeding with the fix."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5389273626819231, "y": 0.4529998958818254, "z": 0.7101749024597831, "word": "Checklists, user", "row_number": 345, "definition": "Standardized lists of tasks and verification steps that end-users follow to complete processes or troubleshoot minor issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Develop clear, visual checklists for common tasks; distribute them via email, internal intranet pages, or physical laminated cards near the hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5221709969472937, "y": 0.45019854775408946, "z": 0.7243332917567562, "word": "CompTIA troubleshooting process: Documentation", "row_number": 444, "definition": "The practice of recording symptoms, diagnostic steps, theories, and resolutions to create a knowledge base for future reference.", "details": [{"label": "TROUBLESHOOTING", "value": "Maintain detailed logs in a ticketing system or personal logbook, noting the initial 'symptoms', 'steps taken', 'theories tested', and the 'final resolution' used to fix the issue."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.530664407729532, "y": 0.4686319321674283, "z": 0.7062431582125862, "word": "CompTIA troubleshooting process: Probable cause, theories of", "row_number": 447, "definition": "The process of creating a logical hypothesis for why a failure has occurred based on observed evidence and technical knowledge.", "details": [{"label": "TROUBLESHOOTING", "value": "Question the user, check system logs (such as the 'Event Viewer' in Windows), and perform visual inspections to narrow down the list of possibilities, starting with the simplest cause (the OSI (Open Systems Interconnection) model approach)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5399140671637904, "y": 0.4406451295355934, "z": 0.7171643255873886, "word": "Documentation: Articles/KB", "row_number": 737, "definition": "Centralized repositories or documents (Knowledge Base) containing technical information, troubleshooting steps, and known solutions to common issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the organization's intranet or service management portal; update the articles with verified resolutions if a new fix is discovered."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5134343282473871, "y": 0.4631850074106189, "z": 0.7223882885866708, "word": "Documentation: CompTIA troubleshooting process", "row_number": 745, "definition": "A standardized methodology (6 steps) recommended by CompTIA to resolve IT issues consistently: 1. Identify, 2. Establish theory, 3. Test theory, 4. Plan/Implement, 5. Verify, 6. Document findings.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply the 6-step framework to all support tickets to ensure root cause analysis and future prevention."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5449916677150001, "y": 0.4608980456550227, "z": 0.7003977967074165, "word": "Identifying problems, CompTIA troubleshooting process", "row_number": 1097, "definition": "The initial phase of the standardized troubleshooting methodology where a technician gathers information, observes symptoms, and questions the user to pinpoint the cause of a system issue.", "details": [{"label": "TROUBLESHOOTING", "value": "Question the user about recent changes (software/hardware), identify the scope of the problem (is it one user or many?), and review system logs to verify the reported symptoms before attempting any physical or software-based repairs."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5258677412589259, "y": 0.4377822734163179, "z": 0.7292529052295064, "word": "KB (Knowledge Bases)", "row_number": 1203, "definition": "Centralized online or local repositories containing technical documentation, FAQs (Frequently Asked Questions), troubleshooting guides, and instructional articles designed to assist technicians and end-users in resolving common system issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize the search functionality within the corporate or vendor KB by using specific error codes or symptoms; if an issue is resolved and not listed, document the fix clearly and submit it to the KB administrator for internal publication."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5195439010723054, "y": 0.47689094876839383, "z": 0.7089775439612678, "word": "Planning: Action plans, CompTIA troubleshooting process", "row_number": 1832, "definition": "A formal step in the troubleshooting process where a technician documents the steps to resolve a problem after testing a theory.", "details": [{"label": "TROUBLESHOOTING", "value": "Draft an action plan that includes the proposed fix, potential impact to the user, and a fallback plan in case the fix fails."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5510791175612473, "y": 0.44178012897909325, "z": 0.707913924024053, "word": "Preventive measures: CompTIA troubleshooting process", "row_number": 1914, "definition": "The proactive steps taken\u2014following the CompTIA seven-step troubleshooting methodology\u2014to maintain hardware and software to prevent future issues from occurring.", "details": [{"label": "TROUBLESHOOTING", "value": "Once a problem is resolved, ensure you fully document the findings, perform preventative maintenance (like cleaning dust or updating drivers), and educate the user to prevent the same error from happening again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5089975355652434, "y": 0.4526297698266847, "z": 0.7321528530676849, "word": "Probable cause, theories of", "row_number": 1960, "definition": "An initial assessment during the CompTIA troubleshooting process where the technician predicts the likely cause of a problem based on symptoms.", "details": [{"label": "TROUBLESHOOTING", "value": "Gather as much information as possible from the user, avoid making assumptions, and use a systematic process to test each theory starting from the simplest and most likely causes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.539210850746446, "y": 0.4745982994378256, "z": 0.6957069157396798, "word": "Problems, CompTIA troubleshooting process: Identifying problems", "row_number": 1962, "definition": "The first step in the troubleshooting process where the technician gathers information, identifies symptoms, and questions the user to define the exact issue.", "details": [{"label": "TROUBLESHOOTING", "value": "Ask open-ended questions, identify changes made to the system recently, use diagnostic software, and review logs before attempting any physical repair."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5386718267715179, "y": 0.42878576241250993, "z": 0.7252416376594484, "word": "Problems, CompTIA troubleshooting process: Resolving problems", "row_number": 1963, "definition": "The final stages of the troubleshooting process where a technician implements a fix, verifies it works, and documents the solution for future reference.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform the fix, verify functionality with the user, implement preventative measures, and ensure all steps taken are logged in the organization\u2019s ticketing system."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5065821985699062, "y": 0.47520971547239726, "z": 0.7194096207396196, "word": "Resolving problems, CompTIA troubleshooting process", "row_number": 2154, "definition": "The final stage of the systematic 6-step CompTIA (Computing Technology Industry Association) troubleshooting methodology, where the technician verifies the system works properly, implements preventative measures, and documents the findings.", "details": [{"label": "TROUBLESHOOTING", "value": "After applying a fix, test the system with the user to ensure the problem is fully resolved, explain what was done, and document the incident (including the symptom, cause, and solution) in the corporate ticketing system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.556234212436133, "y": 0.45355028873619657, "z": 0.6963444812037125, "word": "Testing: Theories of probable cause, CompTIA troubleshooting process", "row_number": 2586, "definition": "A core step in the CompTIA troubleshooting methodology, where the technician hypothesizes potential causes based on gathered information.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the symptoms, consider the most likely causes first (Occam's Razor), document each theory, and prioritize them from simplest to most complex."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.514807623871851, "y": 0.4367011173971743, "z": 0.737743345932363, "word": "Theories of probable cause, CompTIA troubleshooting process", "row_number": 2591, "definition": "The second step of the systematic 6-step CompTIA (Computing Technology Industry Association) core troubleshooting methodology, wherein a technician analyzes gathered data to brainstorm potential failure origins, prioritizing the simplest possibilities first.", "details": [{"label": "TROUBLESHOOTING", "value": "Question the user regarding system modifications, analyze system logs, isolate the failing subsystem, apply logical deduction starting with the easiest variables (such as checking loose power plugs), and document the prioritized list of potential causes before proceeding to actual testing phase verification blocks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.5247809697942991, "y": 0.48547176438925504, "z": 0.6992296473423724, "word": "Verifying functionality, CompTIA troubleshooting process", "row_number": 2800, "definition": "The official fifth step of the CompTIA core troubleshooting methodology where a technician validates that the corrective actions implemented have successfully resolved the hardware or software problem, and ensures that any applicable preventative measures are implemented to avert a future recurrence.", "details": [{"label": "TROUBLESHOOTING", "value": "Run complete diagnostic tests on the repaired subsystem (such as a full print test cycle, network performance scan, or storage read/write integrity check). Interview the computer user to confirm their problem is fully cleared, implement relevant security configurations or preventive configurations, and then advance directly to step six of the methodology to record the final troubleshooting case file documentation."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
