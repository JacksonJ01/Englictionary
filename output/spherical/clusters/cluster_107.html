<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 107, "radius": 285.0, "nodes": [{"x": 0.6096298972144805, "y": 0.2234103204089629, "z": 0.7605519161484156, "word": "Multifunction device/printers: configuring", "row_number": 1506, "definition": "The systematic process of setting up a printer's functional parameters\u2014including network IP addressing, default paper tray source, default quality settings, and output orientation\u2014to ensure it behaves correctly within the computing environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the \u201cDevices and Printers\u201d folder in the Control Panel, right-click the installed printer, select \u201cPrinting Preferences\u201d to adjust tray sources, orientation, and color modes, and ensure the correct driver is installed by checking the \u201cAdvanced\u201d tab to confirm that the \u201cDriver\u201d version matches the OEM (Original Equipment Manufacturer) specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6097840956785492, "y": 0.23828666487425376, "z": 0.7558986850104971, "word": "Multifunction device/printers: managing", "row_number": 1517, "definition": "The administrative oversight of printer status, job queues, toner levels, and hardware health to ensure high availability and consistent document output.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a centralized print server dashboard or individual web-based administration interfaces to monitor toner levels and queue status. Clear stalled jobs in the Windows Print Spooler queue by stopping the \u201cPrint Spooler\u201d service, clearing the \u201cC:\\Windows\\System32\\spool\\PRINTERS\u201d folder of any pending job files, and restarting the service."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5982051117791236, "y": 0.22433694078516977, "z": 0.7693007092421517, "word": "Multifunction device/printers: orientation", "row_number": 1520, "definition": "The configuration setting that determines if a document is printed in \u201cPortrait\u201d (vertical) or \u201cLandscape\u201d (horizontal) format.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the application\u2019s \u201cPrint\u201d or \u201cPage Setup\u201d dialog, check the \u201cOrientation\u201d setting, and toggle it to match the document\u2019s layout requirements. Confirm that the default orientation in the \u201cPrinter Properties\u201d also aligns with the standard office paper stock."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.619969056502794, "y": 0.22334273212670297, "z": 0.7521677957644926, "word": "Multifunction device/printers: permissions", "row_number": 1522, "definition": "Security settings that determine which users have the rights to print, manage their own print jobs, or manage the printer settings and queues of others.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to \u201cPrinter Properties > Security\u201d, verify the user\u2019s assigned permissions, and grant \u201cPrint\u201d rights only to general users while restricting \u201cManage Printer\u201d rights to administrative accounts to prevent unauthorized configuration changes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.598780938492198, "y": 0.24504721408233832, "z": 0.762504590523157, "word": "Multifunction device/printers: tray settings", "row_number": 1531, "definition": "Configuration parameters that define which paper trays are assigned to specific paper sizes or types, ensuring the printer pulls from the correct source.", "details": [{"label": "TROUBLESHOOTING", "value": "In the printer's \u201cPrinting Preferences\u201d or the physical device\u2019s \u201cTray Management\u201d menu, assign the correct paper size (e.g., 8.5x14) to the specific tray that contains that paper stock. Ensure the \u201cPaper Type\u201d setting (e.g., Cardstock, Letterhead) also matches the physical paper loaded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.605668435863718, "y": 0.21021653800591833, "z": 0.7674469056209712, "word": "Orientation, page", "row_number": 1697, "definition": "A print setting that determines whether a document is printed in \u201cPortrait\u201d (vertical) or \u201cLandscape\u201d (horizontal) mode.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \u201cPrint Preview\u201d dialog; adjust the setting in the application\u2019s \u201cPage Setup\u201d menu; verify the driver defaults are not overriding application settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6204194462727273, "y": 0.2400766942793566, "z": 0.7466209825276403, "word": "Page orientation", "row_number": 1723, "definition": "A setting in print configuration that defines whether a document is printed vertically (\"Portrait\") or horizontally (\"Landscape\") on the output paper.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the print dialog, access \"Printer Properties\" or \"Page Setup\", and toggle the orientation to match the document layout; verify that the application document-level settings are not overriding the global printer driver defaults."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5886001373662192, "y": 0.23359986741703, "z": 0.7739386152888442, "word": "Permissions: Printers/multifunction devices", "row_number": 1791, "definition": "Controls that limit who can print, manage the printer queue, or change printer settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \"Print Management\", right-click the printer, select \"Properties > Security\", and ensure the user or group has the \"Print\" permission."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6217469152137376, "y": 0.20929226559013614, "z": 0.7547367229612917, "word": "Printers/multifunction devices: Access", "row_number": 1923, "definition": "The administrative control defining which users or groups can utilize or manage specific printing resources within an enterprise environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Printer Properties\" dialog, navigate to the \"Security\" tab, and verify the user or security group has the \"Print\" permission enabled."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6058286169761224, "y": 0.25469473303061446, "z": 0.753725599816845, "word": "Printers/multifunction devices: Configuring", "row_number": 1926, "definition": "The process of setting up printer-specific parameters, such as paper size, tray selection, default quality, and network settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \"Devices and Printers\" Control Panel applet, right-click the target printer, select \"Printing Preferences,\" and adjust the layout, paper quality, and finishing settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5934499493930178, "y": 0.21118083896456247, "z": 0.7766722673172051, "word": "Printers/multifunction devices: Orientation", "row_number": 1940, "definition": "The configuration that dictates whether a document is printed in \"Portrait\" (vertical) or \"Landscape\" (horizontal) orientation.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the application\u2019s Page Setup or Print Properties and manually adjust the \"Orientation\" setting to match the intended document layout."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6301362726871319, "y": 0.22831517832853568, "z": 0.7421593206237981, "word": "Printers/multifunction devices: Permissions", "row_number": 1942, "definition": "Access rules that determine whether a user can perform tasks such as printing, managing the printer, or managing print jobs.", "details": [{"label": "TROUBLESHOOTING", "value": "In \"Printer Properties,\" check the \"Security\" tab and ensure the appropriate users are assigned \"Print,\" \"Manage this printer,\" or \"Manage documents\" permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5870620247594467, "y": 0.2495455062713427, "z": 0.7701202629363275, "word": "Printers/multifunction devices: Testing", "row_number": 1948, "definition": "Validating that a printer is functioning correctly by printing a test page, often from the printer\u2019s physical control panel.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the Windows \"Print Test Page\" button in the printer properties; if this succeeds, the issue lies with the application or the driver, not the printer hardware itself."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6132555370196723, "y": 0.19827605431343967, "z": 0.7645941751024575, "word": "Printers/multifunction devices: Tray settings", "row_number": 1951, "definition": "Configuration options that specify which paper tray the printer should pull from for different document sizes or types.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the \"Paper Source\" setting in \"Printing Preferences\" and ensure the tray is set to match the actual paper size (e.g., Letter vs. Legal) loaded in the physical tray."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6195938331734616, "y": 0.253819789004776, "z": 0.7427509654002392, "word": "Testing: Printers/multifunction devices", "row_number": 2582, "definition": "The process of printing a test page to verify that a printer is correctly configured, has sufficient ink/toner, and is communicating with the print server.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the printer's on-device menu to print a \u201cTest Page\u201d or \u201cConfiguration Page\u201d; if that fails, check the printer's network connectivity or paper tray."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5816952788818466, "y": 0.22403601755889005, "z": 0.781945308421838, "word": "Tray settings, printers/multifunction devices", "row_number": 2648, "definition": "Configuration options that allow the user to specify which physical paper tray a printer should pull from, as well as the size and type of media loaded in that tray.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the physical paper size in the tray matches the tray settings defined in the printer's \u201cPrinting Preferences\u201d menu, ensure the paper guides are snug against the stack, and clear any sensor debris inside the tray feed mechanism."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
