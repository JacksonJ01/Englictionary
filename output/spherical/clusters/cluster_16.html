<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 16, "radius": 285.0, "nodes": [{"x": 0.9990725773284631, "y": -0.015049765503635246, "z": -0.040342158947530904, "word": "802.11 wireless protocol: Coverage/distance", "row_number": 15, "definition": "The effective physical radius within which a wireless access point can successfully transmit and receive data from client devices. Higher frequencies (5 GHz / 6 GHz) cover less distance and degrade faster through walls than lower frequencies (2.4 GHz).", "details": [{"label": "TROUBLESHOOTING", "value": "Move the wireless access point to a central, elevated location away from thick concrete walls and metal surfaces; install a wireless range extender or transition to a mesh network to fill dead zones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9989558176833441, "y": -0.005218121641723972, "z": -0.04538772436610382, "word": "802.11 wireless protocol: Frequencies", "row_number": 16, "definition": "The specific radio frequency bands allocated for Wi-Fi communications, primarily consisting of 2.4 GHz (long range, slow speed, high congestion), 5 GHz (shorter range, fast speed, low congestion), and 6 GHz utilized by Wi-Fi 6E/7 (shortest range, extreme speed, zero legacy interference).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify client hardware specifications; implement a \"Band Steering\" configuration on the router to automatically push dual-band client devices onto the faster, less congested 5 GHz or 6 GHz frequencies."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9994605299526704, "y": -0.011580834643285052, "z": -0.030733261065043864, "word": "802.11 wireless protocol: Licensing", "row_number": 17, "definition": "The regulatory framework dictating that Wi-Fi consumer frequencies (2.4 GHz, 5 GHz, 6 GHz) operate within the \"ISM\" (Industrial, Scientific, and Medical) bands. These bands are completely unlicensed, meaning anyone can use them without a radio permit, but devices must accept interference from other devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify and move non-Wi-Fi interferers away from the access point and client hardware; migrate high-priority corporate traffic over to the cleaner 5 GHz or 6 GHz bands where consumer appliance overlap is non-existent."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9986228436075362, "y": -0.017676954521605295, "z": -0.049395764029313456, "word": "802.11 wireless protocol: Standards", "row_number": 21, "definition": "The official iterations of the Wi-Fi specification defined by the IEEE. Key exam standards include:\n\n- 802.11b (2.4 GHz, 11 Mbps)\n- 802.11g (2.4 GHz, 54 Mbps)\n- 802.11a (5 GHz, 54 Mbps)\n- 802.11n / Wi-Fi 4 (2.4/5 GHz, 600 Mbps)\n- 802.11ac / Wi-Fi 5 (5 GHz, 6.9 Gbps)\n- 802.11ax / Wi-Fi 6 (2.4/5/6 GHz, 9.6 Gbps).", "details": [{"label": "TROUBLESHOOTING", "value": "Review the router's allowed standard modes (e.g., ensure it is set to \"Mixed Mode\" or \"Compatibility Mode\" if legacy clients must connect); upgrade the network interface card or install a modern USB Wi-Fi dongle on older client devices."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9992724498266161, "y": 0.002017145579479079, "z": -0.038085458395878485, "word": "Antennas: SOHO networks", "row_number": 113, "definition": "Physical hardware elements attached to SOHO (Small Office / Home Office) wireless routers or APs (Access Points) that radiate and capture radio frequency signals. They can be omnidirectional (broadcasting signals equally in all horizontal directions) or directional (focusing signal power in one explicit path to span longer distances).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all external omnidirectional antennas are physically securely screwed into their reverse polarity subminiature version A (RP-SMA) connectors; orient external antennas perpendicularly (one vertical, one horizontal) to maximize wave polarization alignment; swap low-gain factory antennas with aftermarket high-gain antennas to expand the wireless coverage radius."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9992060779613758, "y": -0.022813845099290294, "z": -0.03266102014374821, "word": "Antennas: Wi-Fi", "row_number": 114, "definition": "The internal or external radio frequency transducers integrated into client devices (such as laptops, smartphones, and desktop computers) or networking hardware to facilitate Wi-Fi network communications. In laptops, these antennas are typically run as thin wires threaded up through the physical display bezel for elevated spatial clearance.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the laptop chassis or display bezel; check the delicate main and auxiliary micro-coaxial cable connections mating to the internal wireless network interface card (NIC); re-seat the tiny gold connectors if they have vibrated loose."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9984443878011744, "y": -0.0066856925835435095, "z": -0.055354367334624587, "word": "AP (Access Points), SOHO networks", "row_number": 121, "definition": "Access Points (APs). Network hardware components that connect wireless Wi-Fi clients to a wired Ethernet backbone infrastructure. In small office/home office (SOHO) topologies, this capability is typically integrated into a single physical unit alongside the router and local network switch.", "details": [{"label": "TROUBLESHOOTING", "value": "Power-cycle the integrated network hardware assembly; access the web configuration interface using the default gateway internet protocol (IP) address; navigate to wireless configurations to verify that the wireless radio broadcast flag is enabled; update the system firmware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9996698625225827, "y": -0.003033985041253484, "z": -0.025513935385391172, "word": "Bluetooth networks: Connectivity", "row_number": 250, "definition": "Short-range wireless radio communication protocols facilitating data exchanges between enabled devices over short distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the radio switch is explicitly enabled on both devices, clear existing old pairing profiles out of the system cache, ensure the peripheral is explicitly placed into discovery mode, and keep them within close range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9985442120929936, "y": -0.02744398580890583, "z": -0.04643580664210849, "word": "Cellular networks/connectivity", "row_number": 336, "definition": "A wireless network where the land area is divided into cells, each served by at least one fixed-location transceiver, known as a cell site or base station.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for \"Airplane Mode\" status; update the PRL (Preferred Roaming List); toggle cellular radio off and on; ensure the SIM (Subscriber Identity Module) card is seated correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9988486602221456, "y": 0.006660453086828626, "z": -0.04750781343213785, "word": "Communications: Bluetooth networks", "row_number": 414, "definition": "A short-range wireless technology standard used for exchanging data between fixed and mobile devices over short distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Turn Bluetooth off and on, clear pairing history on both devices, and ensure both are within the effective range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9995654153462786, "y": -0.019121430707411798, "z": -0.022435492669494187, "word": "Communications: Wireless networks", "row_number": 418, "definition": "Networks that use radio waves (typically 2.4GHz or 5GHz) to transmit data without physical cables.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for signal interference, update wireless drivers, and verify the correct SSID (Service Set Identifier) and security credentials."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9980509750358512, "y": -0.0169167741018539, "z": -0.06006724551678462, "word": "Connectivity: Bluetooth networks", "row_number": 468, "definition": "Wireless personal area network connectivity between devices using the 2.4 GHz frequency band.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep devices within range, move away from sources of interference (like 2.4 GHz cordless phones), and restart the Bluetooth radio."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.99953264135453, "y": 0.007933680399671838, "z": -0.02952212021776435, "word": "Connectivity: Cellular networks", "row_number": 471, "definition": "Wireless connectivity for mobile devices utilizing cellular towers (e.g., 4G/LTE (Long-Term Evolution), 5G) to provide data access.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle 'Airplane Mode' on and off, ensure the SIM card is seated correctly, and verify that cellular data is enabled in the device settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9988359718106253, "y": -0.032633488142922294, "z": -0.035521217163118485, "word": "Connectivity: Wireless networks", "row_number": 521, "definition": "Networks that use radio frequency to connect devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Move closer to the access point, remove physical obstructions, and ensure the correct security key is used."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.998235031342977, "y": 0.002643198028110794, "z": -0.05932820327525709, "word": "Coverage/distance, 802.11 wireless protocol", "row_number": 555, "definition": "The effective range and signal strength of a Wi-Fi (Wireless Fidelity) signal based on the frequency band (2.4 GHz vs 5 GHz/6 GHz) and the environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Install additional wireless access points, use signal extenders, or switch to a frequency with better range (2.4 GHz) if the signal is being blocked by walls."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9998342208287296, "y": -0.007652929519273308, "z": -0.01652160795987338, "word": "Distance/Coverage, 802.11 wireless", "row_number": 698, "definition": "The operational range of a Wi-Fi network, which depends on the frequency band (2.4 GHz vs 5 GHz/6 GHz), signal obstacles (walls), and environmental interference.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a site survey, relocate the access point to a more central location, or install additional APs (Access Points) or range extenders to cover the area."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9979730880228573, "y": -0.029678031598298234, "z": -0.056293250239906695, "word": "GPS (Global Positioning System)", "row_number": 1004, "definition": "A satellite-based navigation system that provides precise location and time information to a receiver, enabling features like mapping, asset tracking, and geo-tagging on mobile devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure \u201cLocation Services\u201d are enabled in \u201cSettings\u201d, check for physical obstacles (e.g., being inside a building), and perform a clear-sky test to see if the device can lock onto satellite signals."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9990340550774509, "y": 0.014777448117086369, "z": -0.04138337616303992, "word": "GSM (Global System for Mobile Communications)", "row_number": 1014, "definition": "An older but influential standard for mobile network communication that uses TDMA (Time Division Multiple Access) technology and requires a Subscriber Identity Module (SIM) card.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the SIM card is seated properly, verify that the device supports the frequency bands used by the local carrier, and check if the device is locked to a different provider."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9993310451019477, "y": -0.029342643176423527, "z": -0.021828229128127926, "word": "Hotspots", "row_number": 1078, "definition": "Physical locations or devices (like a smartphone) that provide internet access to mobile devices over a wireless local area network (WLAN) using a router connected to an internet service provider (ISP).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the hotspot\u2019s cellular signal strength, restart the hotspot device, ensure the security password is correct, and check if any bandwidth limits (data caps) have been reached."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9976928187357774, "y": -0.009473083375094997, "z": -0.06722574011811064, "word": "ISP (Internet Service Provider), WISP", "row_number": 1196, "definition": "An organization that provides services for accessing and using the internet; a WISP (Wireless Internet Service Provider) provides internet access via wireless technologies like microwave or radio links.", "details": [{"label": "TROUBLESHOOTING", "value": "Contact the ISP to verify local service outages, or check the external wireless receiver/antenna for obstructions and physical damage."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9997927497192086, "y": 0.006963547176383897, "z": -0.019130254039763872, "word": "LAN: WLAN", "row_number": 1223, "definition": "A Wireless Local Area Network (WLAN) is a local area network variant that leverages high-frequency radio frequency signals (such as 2.4 GHz, 5 GHz, or 6 GHz spectrum distributions) to bind portable computing devices to the local physical infrastructure without wired network cable interconnects.", "details": [{"label": "TROUBLESHOOTING", "value": "Relocate the client device closer to the wireless access point to mitigate RF (Radio Frequency) environmental attenuation, load a wireless site survey mapping tool to analyze local channel overlaps, and shift the active access point configuration profile to a non-overlapping channel scheme."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9982747509184784, "y": -0.03876885156491653, "z": -0.044096460481396614, "word": "Licensing: Wireless protocols", "row_number": 1248, "definition": "The regulatory frequency allocations and standard licensing rules managed by governmental bodies (such as the FCC\u2014Federal Communications Commission) that define which wireless bands require exclusive licensing models (e.g., cellular radio networks) versus unlicensed public spectrum allocations (e.g., standard consumer Wi-Fi bands).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that internal enterprise long-range communication arrays operate strictly within unlicensed industrial bands, or register specialized microwave link assets with regional telecommunications agencies to obtain clear operating clearances."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9982979450615602, "y": 0.013037287501602983, "z": -0.05684401481657105, "word": "\u201cLong-range fixed wireless\u201d", "row_number": 1342, "definition": "A point-to-point high-bandwidth telecommunications transport method that utilizes directional microwave or radio frequency dish antennas mounted on elevated structural towers to bridge internet connectivity over miles without physical wires.", "details": [{"label": "TROUBLESHOOTING", "value": "Clean external structural antenna dishes to clear out debris blocks, use specialized alignment equipment to optimize physical line-of-sight path angles, and check interface cabling leading down to the indoor router equipment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9997854927270877, "y": -0.017233380034167255, "z": -0.011488217662135834, "word": "MU-MIMO (Multiuser-Multiple Input, Multiple Output) technologies", "row_number": 1538, "definition": "An advanced Wi-Fi antenna technology that allows an access point to communicate with multiple client devices simultaneously, rather than sequentially, significantly increasing network capacity and overall speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both the wireless access point and the client devices support MU-MIMO. Update the wireless adapter drivers on client machines and verify the router's firmware is up to date, as the MU-MIMO scheduling logic is managed by the AP\u2019s firmware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9974539450766724, "y": -0.025732961321962025, "z": -0.06650896294925188, "word": "Networks: Bluetooth networks", "row_number": 1567, "definition": "Short-range wireless personal area networks (WPAN) used to exchange data between fixed and mobile devices, typically operating in the 2.4 GHz (Gigahertz) ISM (Industrial, Scientific, and Medical) band.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle Bluetooth off and on, move devices closer to eliminate interference, remove the existing \"paired\" profile from the host OS, and perform a fresh discovery and re-pairing process."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9993469650888825, "y": 0.01862166911636857, "z": -0.030965736015157157, "word": "Networks: Cellular networks", "row_number": 1571, "definition": "Wireless mobile networks distributed over land areas called \u201ccells,\u201d each served by at least one fixed-location transceiver, known as a cell site or base station.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device has the correct APN (Access Point Name) settings, verify that the SIM (Subscriber Identity Module) card is seated correctly, and toggle \u201cAirplane Mode\u201d to force the device to re-authenticate with the nearest cellular tower."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9988603899918764, "y": -0.03924692376347242, "z": -0.02715879747670726, "word": "Networks: Wireless networks", "row_number": 1655, "definition": "Networks that use radio waves instead of cables to connect devices, providing mobility and flexibility but introducing security and interference challenges.", "details": [{"label": "TROUBLESHOOTING", "value": "Check signal strength; use a Wi-Fi analyzer to identify overlapping channels; ensure encryption settings (e.g., WPA3 (Wi-Fi Protected Access 3)) match on the client and WAP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9975586178038212, "y": 0.0016372962735326096, "z": -0.0698149218021657, "word": "Networks: WWAN (Wireless Wide Area Network)", "row_number": 1660, "definition": "A wireless network that covers a wide area, typically utilizing cellular technology (4G, 5G) to provide Internet access via a service provider.", "details": [{"label": "TROUBLESHOOTING", "value": "Check cellular coverage; verify SIM card installation; ensure APN (Access Point Name) settings are correct for the provider."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9999529649199267, "y": 0.00028306331855473333, "z": -0.009694731713958269, "word": "NFC (Near-Field Communication)", "row_number": 1663, "definition": "A short-range wireless communication standard that allows devices to share data by bringing them into very close proximity (typically less than 4 cm).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure NFC is enabled in system settings; remove thick cases that may block the signal; verify the NFC chip is functional."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9976423995937291, "y": -0.040053974160381145, "z": -0.0557254132943439, "word": "Physical security: NFC (Near Field Communication)", "row_number": 1820, "definition": "A short-range wireless technology that allows for secure, contactless exchange of data, often used in mobile device-based badge access.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NFC antenna is enabled on the mobile device, move the device within 4cm of the reader, and confirm the app is updated."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.998564416966526, "y": 0.02185762944226267, "z": -0.04890142332761737, "word": "Power: Radio power levels, SOHO networks", "row_number": 1877, "definition": "An administrative configuration option inside wireless routers and access points that controls the transmit power and coverage area of the Wi-Fi radio antenna.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the Small Office/Home Office (SOHO) router portal through an administrative browser connection, locate the advanced wireless radio settings submenu, locate the parameter named \"Transmit Power Level,\" and lower the value step-by-step from 100% until wireless signals drop off right at the physical perimeter of the office structure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9995052674134308, "y": -0.029258577694844475, "z": -0.011539325980349156, "word": "Protocols: 802.11 wireless protocol", "row_number": 1986, "definition": "A set of IEEE (Institute of Electrical and Electronics Engineers) standards that define communication for Wireless Local Area Networks (WLANs), determining frequency bands (2.4 GHz, 5 GHz, 6 GHz) and maximum data transfer rates.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the network adapter compatibility, ensure firmware on the Wireless Access Point (WAP) is updated, move to a less crowded frequency channel, or relocate the device closer to the signal source."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9970775840543364, "y": -0.016602918459436195, "z": -0.07456966189407796, "word": "Protocols: Wireless protocols", "row_number": 2006, "definition": "A collective term for various standards (e.g., 802.11, Bluetooth, Zigbee) that allow devices to communicate wirelessly.", "details": [{"label": "TROUBLESHOOTING", "value": "Check hardware documentation to ensure both ends of the connection support the same protocol standard, update device firmware, and minimize physical obstacles or electromagnetic interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9996772622207521, "y": 0.01718113840533461, "z": -0.01871309386280951, "word": "Radio power levels, SOHO networks", "row_number": 2062, "definition": "A configurable transmission intensity setting for wireless access points that dictates the effective coverage radius of a Wi-Fi signal, used to prevent signal bleeding into unauthorized areas and to minimize interference between overlapping wireless networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Access th
