<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 55, "radius": 285.0, "nodes": [{"x": 0.823739382696846, "y": -0.5477043621693268, "z": 0.1465 to carry both electrical power and data concurrently over standard twisted-pair infrastructure to connected hardware devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable run length is under 100 meters, inspect the copper pairs for physical damage using a wire mapper, and check the network switch configuration interface to verify that the power allocation budget has not been exceeded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8391946253914001, "y": -0.5300304021374604, "z": 0.12173805290125839, "word": "RJ45 plugs, UTP cabling", "row_number": 2182, "definition": "An eight-position, eight-contact (8P8C) modular clear plastic connector shell crimped onto the tips of four-pair UTP networking cables (such as Category 5e or Category 6 lines), serving as the universal standard interface for Ethernet network ports.", "details": [{"label": "TROUBLESHOOTING", "value": "Snip away the degraded plug capsule from the line; strip back roughly one inch of the outer protective PVC (Polyvinyl Chloride) jacket, untwist the wire strands and line them up straight in strict compliance with the T568B standard sequence (Orange-White, Orange, Green-White, Blue, Blue-White, Green, Brown-White, Brown), feed them securely into a fresh RJ45 plug, and use a crimping tool to lock the terminal pins."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8248468915984168, "y": -0.5367803953865964, "z": 0.1774666519350576, "word": "Straight-through cabling", "row_number": 2512, "definition": "A network cable (like an Ethernet patch cable) that has the same pin-out configuration on both ends (standard T568B).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable type; ensure you are not accidentally using a crossover cable for modern equipment that expects a straight-through pin-out."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.815320025038781, "y": -0.5652062481554181, "z": 0.1256787723397919, "word": "UTP: 568A wiring standard", "row_number": 2788, "definition": "A wiring standard for RJ45 connectors where the green pair is on pins 1 and 2, and the orange pair is on pins 3 and 6, commonly used in residential and federal government installations.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the wire colors at the clear plastic end of the RJ45 plug. Ensure both ends of the cable follow the same standard (either both 568A or both 568B for a straight-through cable). If they differ, the cable is a \u201ccrossover\u201d cable and may not be compatible with modern auto-MDIX (Medium Dependent Interface Crossover) equipment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8449862951575493, "y": -0.5147313718409805, "z": 0.14508540877228504, "word": "UTP: 568B wiring standard", "row_number": 2789, "definition": "A wiring standard for RJ45 connectors where the orange pair is on pins 1 and 2, and the green pair is on pins 3 and 6, the most common standard used in commercial cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Using a crimping tool, strip the cable and re-terminate the RJ45 plug ensuring the wires are ordered: White-Orange, Orange, White-Green, Blue, White-Blue, Green, White-Brown, Brown. Use a continuity tester to verify the connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8099635713080237, "y": -0.5611375310629809, "z": 0.17053939247720404, "word": "UTP: RJ11 plugs", "row_number": 2795, "definition": "A smaller, 4 or 6-position connector primarily used for telephone connections (POTS [Plain Old Telephone Service]) rather than computer data networks, which use 8-position RJ45 connectors.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the connector size. If the plug has fewer than 8 metal contacts, it is likely an RJ11 or RJ12 plug and is incorrect for Ethernet data networking. Replace the plug with an 8-position \u201cRJ45\u201d (Registered Jack 45) connector."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8315849353637621, "y": -0.54410478223414 ).crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
