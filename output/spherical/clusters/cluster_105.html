<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 105, "radius": 285.0, "nodes": [{"x": -0.10552688192265935, "y": -0.8073527633765669, "z": 0.580556278632746, "word": "CPU (Central Processing Units): Installing", "row_number": 568, "definition": "The physical process of placing the processor into the motherboard socket.", "details": [{"label": "TROUBLESHOOTING", "value": "Remove the CPU, inspect the pins on the socket or CPU, align the \u201cgolden triangle\u201d on the CPU with the socket, and lock the retention arm."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.09001495255425276, "y": -0.8140720783629009, "z": 0.57374555296452, "word": "CPU (Central Processing Units): Sockets", "row_number": 574, "definition": "The physical interface on the motherboard where the CPU is mounted.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the motherboard and CPU socket types match exactly before attempting installation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.09871825473963024, "y": -0.798825491049964, "z": 0.5934075673851364, "word": "Installing: CPU", "row_number": 1140, "definition": "The delicate physical installation of a Central Processing Unit (CPU) into its corresponding motherboard slot socket interface, requiring zero-force locking mechanisms and static discharge safety procedures.", "details": [{"label": "TROUBLESHOOTING", "value": "Securely attach an anti-static wrist grounding strap, lift the socket retention lever handle, line up the indicator notch corners of the processor with the motherboard socket socket pattern layout, lower the piece into place without pressure, lock down the latch bracket arm, and apply thermal paste compound."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1108686281381289, "y": -0.8153182844089948, "z": 0.5682994302329918, "word": "Intel CPU", "row_number": 1149, "definition": "A line of central processing unit architectures developed by Intel Corporation that utilize land grid array (LGA) motherboard socket designs, where the connection pins reside inside the board socket rather than on the bottom of the processor chip.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the pin matrix bed layout using specialized lighting tools, check if structural pins require mechanical alignment tools, check configuration parameters, and run official processor health evaluation tool applications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.07730707748388466, "y": -0.8084491459470838, "z": 0.5834668749709204, "word": "LGA (Land Grid Array) sockets", "row_number": 1240, "definition": "A physical motherboard CPU (Central Processing Unit) socket architecture design where the delicate electrical interface connection pins are integrated directly inside the motherboard socket grid bed itself, rather than residing on the bottom of the processor chip.", "details": [{"label": "TROUBLESHOOTING", "value": "Carefully unlatch the processor retention load bracket plate frame, extract the CPU chip vertical to the plane, use an illuminated magnifying tool to inspect the inner socket matrix for bent or broken pins, and replace the motherboard if pin structural damage is uncorrectable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.11731642187976594, "y": -0.7982988137642468, "z": 0.590724860743075, "word": "Memory modules/DIMM", "row_number": 1445, "definition": "The physical circuit boards that house RAM chips, designed to be installed into slots on a motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the DIMM slots for dust or debris; ensure the notches on the DIMM line up with the keys in the motherboard slot; press down firmly until both side clips snap into place; if the system still won't boot, try using a different slot to rule out a damaged motherboard memory channel."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.09355739969173595, "y": -0.8230547773078701, "z": 0.560203397449188, "word": "PGA (Pin Grid Array) sockets", "row_number": 1796, "definition": "A type of integrated circuit packaging where pins are arranged in a square array on the underside of the processor and inserted into a socket on the motherboard.", "details": [{"label": "TROUBLESHOOTING", "value": "Carefully inspect the CPU pins for bending; use a mechanical pencil or thin tool to gently straighten any slightly bent pins. Never force the CPU into the socket; it should drop in with zero insertion force."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.08409762379026374, "y": -0.795366867968092, "z": 0.6002658869296663, "word": "Sockets", "row_number": 2422, "definition": "Physical mounting slots on a motherboard that hold the CPU (Central Processing Unit) in place, providing the electrical interface for communication between the processor and the rest of the system.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the socket for bent or broken pins (especially on LGA - Land Grid Array sockets), ensure the CPU is seated perfectly, and verify that the thermal interface material is applied evenly to ensure efficient heat transfer."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.12648478131851423, "y": -0.8103538444328322, "z": 0.5721260760599333, "word": "Sockets: LGA sockets", "row_number": 2423, "definition": "A CPU socket type where the pins are located on the motherboard socket rather than on the CPU package itself, requiring extreme caution during installation to avoid damaging the delicate motherboard pins.", "details": [{"label": "TROUBLESHOOTING", "value": "Carefully remove the CPU and inspect the motherboard socket with a magnifying glass for any misaligned pins; if pins are bent, use a fine needle to gently realign them, or replace the motherboard if the pins are broken."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.0707862365680367, "y": -0.818132836874867, "z": 0.5706557367972532, "word": "Sockets: PGA sockets", "row_number": 2424, "definition": "A CPU socket type where the pins are located on the underside of the CPU itself, which slide into corresponding holes on the motherboard socket; this design is generally more robust regarding pin alignment than LGA models.", "details": [{"label": "TROUBLESHOOTING", "value": "Carefully inspect the CPU pins for any bending, use a small tool or mechanical pencil to straighten bent pins, and ensure the retention lever is fully locked to ensure complete contact."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
