<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 166, "radius": 285.0, "nodes": [{"x": 0.7118071760112221, "y": -0.6280622942402718, "z": 0.3144332977478297, "word": "Cabling: Multimode cabling", "row_number": 308, "definition": "A type of fiber optic cable designed to carry multiple light rays (modes) simultaneously, typically used for short-distance communication within a building.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable type (e.g., OM3 or OM4) matches the transceivers being used; if the distance is too long, convert to \"Single-mode\" cabling or use a signal repeater."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.725396646546019, "y": -0.6166417994828324, "z": 0.3058636891008217, "word": "Cabling: Single-mode cabling", "row_number": 317, "definition": "Fiber optic cable with a small core designed to carry a single ray of light (mode), allowing for extremely high speeds over very long distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the fiber type is compatible with the transceiver; check for signal loss using a power meter; re-terminate the fiber if light intensity is too low."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7117106553422833, "y": -0.6197757224107294, "z": 0.33067506253498435, "word": "Connectivity: Multimode cabling", "row_number": 487, "definition": "Fiber optic cabling designed to carry multiple light rays (modes) simultaneously over shorter distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable length does not exceed the manufacturer\u2019s specification (usually shorter than single-mode), and inspect connectors for cleanliness."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.712441743981692, "y": -0.6348273166011023, "z": 0.2990335090409924, "word": "Connectivity: Single-mode cabling", "row_number": 504, "definition": "Fiber optic cabling designed to carry a single ray of light (mode) over very long distances.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the cable is not bent, check for connector cleanliness, and verify the transceiver type matches the cable type."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.730635945835401, "y": -0.6040980063301383, "z": 0.31817717297311093, "word": "Multimode cabling", "row_number": 1534, "definition": "A type of optical fiber cabling with a relatively large core diameter (typically 50 or 62.5 microns) that allows multiple modes of light to propagate, making it ideal for short-range data transmission within buildings or campus environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the cable type (e.g., OM3 or OM4) matches the application requirements and the connected transceivers. Use a Fiber Optic Power Meter to test signal strength and ensure that the connections are free of dust or oils by cleaning the fiber tips with an approved fiber cleaning kit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6992682066901482, "y": -0.635505867462346, "z": 0.32734731942277295, "word": "Networks: Multimode cabling", "row_number": 1605, "definition": "A type of fiber optic cabling with a larger core diameter designed to carry multiple light rays (modes) simultaneously over shorter distances, commonly used for LAN (Local Area Network) backbones.", "details": [{"label": "TROUBLESHOOTING", "value": "Use an OTDR (Optical Time-Domain Reflectometer) to identify the location of signal attenuation; ensure the connectors are cleaned with fiber-optic cleaning supplies; verify the cable length is within the specifications (e.g., typically under 500 meters for 10 Gbps (Gigabits per second) speeds)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7276861026222813, "y": -0.6221099289993067, "z": 0.28888089637577624, "word": "Networks: Single-mode cabling", "row_number": 1628, "definition": "Fiber optic cabling with a tiny core diameter that carries a single ray of light (mode) over very long distances with minimal signal degradation.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for breaks in the fiber using an OTDR; verify that the correct laser/transceiver is being used; ensure the connectors are clean and undamaged."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7192814793808469, "y": -0.6061618010172583, "z": 0.3394142371899184, "word": "Single-mode cabling", "row_number": 2381, "definition": "A premium class of fiber-optic cabling engineered with a micro-thin glass core diameter (roughly 8 to 10 microns) that funnels a single, concentrated laser light ray across massive geographical distances with minimal signal loss or wave distortion.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the fiber optic line paths use a bright yellow outer shielding color indicating true single-mode parameters, clear connection tip nodes using specialized optical isopropyl swabs, and check that both termination switches are using matching single-mode laser transceiver modules."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
