<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 15, "radius": 285.0, "nodes": [{"x": -0.10703675650015439, "y": 0.8634606875777178, "z": -0.49292877149314573, "word": "Browsers: Malicious code", "row_number": 278, "definition": "Hostile programming scripts embedded within web content that exploit web browser software vulnerabilities to run unauthorized code on a user's system.", "details": [{"label": "TROUBLESHOOTING", "value": "Close out active application instances immediately, clear localized app-data cache directories, run a full system anti-malware scan, and apply the latest security patches to the browser."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1212487695627129, "y": 0.8577643607252857, "z": -0.49953882466638166, "word": "Browsers: Redirection", "row_number": 283, "definition": "An unauthorized modification of web browser behavior where a user is forced away from their intended website destination to a different, often malicious web page.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the system's local hosts file for unauthorized entries, check for rogue DNS (Domain Name System) configurations on the network adapter, and clear out malicious extensions from the browser."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1131562223720976, "y": 0.8697949175089749, "z": -0.48026291842493113, "word": "Cross-Site Scripting (XSS)", "row_number": 584, "definition": "A web security vulnerability where an attacker injects malicious client-side scripts into a web page viewed by other users.", "details": [{"label": "TROUBLESHOOTING", "value": "Developers must implement input sanitization and output encoding to ensure user-supplied data cannot be executed as scripts by the browser."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1022059208573071, "y": 0.8571850350747466, "z": -0.5047650595926935, "word": "Malicious code, browser security", "row_number": 1395, "definition": "Code created with intent to breach security or damage a system, often targeting web browsers via insecure extensions, cross-site scripting (XSS), or malicious scripts embedded within malicious web pages.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the browser, navigate to settings, open the extension manager, remove any unvetted or unrecognized third-party add-ons, reset the browser settings to factory defaults, configure default security settings to block third-party cookies, and clear the browser cache by selecting the option to wipe temporary internet data files."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.13277128155993936, "y": 0.8616179668766705, "z": -0.4898839310982183, "word": "Redirection: Browsers", "row_number": 2112, "definition": "A security symptom or network exploit where a web browser is forcibly forced to load a malicious, un-requested destination URL instead of the user\u2019s intended webpage.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the hosts file for malicious static IP modifications; check proxy configurations via 'inetcpl.cpl' > 'Connections' > 'LAN Settings' and uncheck unauthorized manual proxy servers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.0961467689620675, "y": 0.8704716264780572, "z": -0.4827369328265659, "word": "Security: Browsers", "row_number": 2262, "definition": "The configuration and security management of web browsers to prevent malicious web-based attacks like cross-site scripting (XSS) and drive-by downloads.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear the browser cache and cookies, disable suspicious extensions in the browser settings, and reset the browser to default configuration if issues persist."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.11805211270781103, "y": 0.8505135851785448, "z": -0.5125332575667263, "word": "Social engineering: XSS", "row_number": 2419, "definition": "An attack where the perpetrator injects malicious client-side scripts into a trusted website, which then execute in the browsers of other users, allowing the attacker to steal cookies, session tokens, or capture keystrokes.", "details": [{"label": "TROUBLESHOOTING", "value": "Sanitize all user-supplied data in web applications, implement Content Security Policy (CSP) headers to restrict which scripts can execute, and use secure cookies (HttpOnly) to prevent script access to sensitive session data."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.12642666843482725, "y": 0.8717776707017831, "z": -0.4733075008641248, "word": "Threats/vulnerabilities: XSS", "row_number": 2611, "definition": "A software injection attack vector where an adversary injects malicious client-side script code (typically JavaScript) into a vulnerable, trusted website application, which then executes automatically inside the web browsers of unsuspecting visitors.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply rigorous output encoding and context-aware escaping across web development frameworks, enforce a strict CSP (Content Security Policy) header matrix rule set to block the execution of unverified script blocks, and configure browser session tracking cookies with the \"HttpOnly\" attribute to hide them from scripts."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.0878594514682064, "y": 0.8611067586945138, "z": -0.500775265881148, "word": "Troubleshooting: Browser redirection", "row_number": 2661, "definition": "A malicious event where a web browser is forcibly sent to an unintended, often harmful, website instead of the user-requested URL (Uniform Resource Locator), typically caused by browser hijackers or compromised DNS (Domain Name System) settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Scan the system for malware using updated antivirus software, clear the browser cache and cookies, check the browser for unauthorized extensions or add-ons, and verify the \u201cHosts\u201d file for malicious entries."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.13876817759797982, "y": 0.8535661500681376, "z": -0.50216353944108, "word": "Vulnerabilities/threats: XSS (Cross-Site Scripting)", "row_number": 2869, "definition": "A web application vulnerability where a malicious actor injects client-side executable script code (such as JavaScript) into a legitimate public web page layout, which then executes automatically inside the web browser environment of unsuspecting visitors.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement strict contextual output encoding and input validation filters across the application development lifecycle. Configure a robust Content Security Policy (CSP) header response on the host web server system to explicitly restrict browser clients from loading or running executable scripts originating from unverified external web domains."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.10264585669904527, "y": 0.8771035272517238, "z": -0.46920489190235787, "word": "Web browsers: Malicious code", "row_number": 2885, "definition": "Rogue script elements\u2014such as drive-by downloads, malicious JavaScript macros, or cross-site scripting strings\u2014embedded within compromised web domains that target web browser vulnerabilities to hijack systems or infect host operating spaces.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the computer terminal from active network lines. Launch browser settings, disable unverified script additions, clear out the local cache profile folders, and use an advanced anti-malware software scanner to locate and delete active malicious payloads hiding inside local application directories."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.10226069252314451, "y": 0.8488658443676923, "z": -0.5186227232108249, "word": "Web browsers: Redirection", "row_number": 2890, "definition": "A security condition or structural web routing mechanism where a browser application is forced to divert from its intended destination URL to an alternate web domain, often caused by malicious malware modifications or dynamic DNS attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Open an administrative command prompt terminal and review the local computer name resolution database file by executing the instruction \u201cnotepad C:\\Windows\\System32\\drivers\\etc\\hosts\u201d. Inspect the document file entries to ensure no rogue IP mappings are hijacking web traffic; clear the local DNS name cache by executing the command \u201cipconfig /flushdns\u201d, and scan the system for active browser helper object hijackers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.14241322821128047, "y": 0.8664752891894498, "z": -0.47847575242064355, "word": "XSS (Cross-Site Scripting)", "row_number": 2997, "definition": "A web security vulnerability where an attacker injects malicious client-side scripts into web pages viewed by other users, effectively bypassing the same-origin policy to steal session cookies, hijack user sessions, or deface websites.", "details": [{"label": "TROUBLESHOOTING", "value": "For developers, implement strict input validation and output encoding to ensure user-supplied data cannot be interpreted as executable code. For end-users experiencing symptoms, clear browser cache and cookies, run a full system scan with an anti-malware utility, and disable active scripting in the browser if necessary to prevent malicious payloads from executing."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
