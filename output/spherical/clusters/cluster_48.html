<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 48, "radius": 285.0, "nodes": [{"x": -0.27417188685489163, "y": -0.8249561916217937, "z": -0.494243925975115, "word": "Drives: Clearing", "row_number": 774, "definition": "A logical data sanitization methodology that overwrites user-addressable storage spaces with a new pattern of data to prevent standard software-based data recovery tools from restoring deleted information.", "details": [{"label": "TROUBLESHOOTING", "value": "Attach the drive to an administrative workstation and perform a full format using standard OS management tools or use built-in disk utilities to execute standard multi-pass data clearing scripts before redeploying the drive."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.26016004141699095, "y": -0.8258424926866464, "z": -0.5003008396185399, "word": "Drives: Destroying", "row_number": 776, "definition": "A physical data destruction security process that renders a storage drive entirely unusable and unrecoverable by mechanically shattering, incinerating, shredding, or melting its internal components.", "details": [{"label": "TROUBLESHOOTING", "value": "Send End-Of-Life (EOL) storage media to a certified destruction vendor equipped with an industrial mechanical shredder or a high-powered physical disintegrator to completely compromise the physical magnetic platters or flash memory integrated circuits."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.27161328481002456, "y": -0.8326350348033131, "z": -0.4826438876985744, "word": "Drives: Overwriting", "row_number": 787, "definition": "A software-driven data clearing standard that replaces pre-existing binary data fields across the user-accessible sectors of a disk with random text characters or static uniform zeros.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a command terminal window and execute a utility like diskpart, select the specific target storage drive index layer, and invoke the command clean all to write uniform zeros completely across every block sector."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.27569195145580466, "y": -0.8178485739817047, "z": - 7026, "y": -0.8185762002816201, "z": -0.5122131256609045, "word": "Hard drives: Destroying", "row_number": 1026, "definition": "The final stage of the data sanitization process, where physical media is rendered impossible to reconstruct through mechanical shredding, pulverizing, or incineration.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive is logged for disposal, use an industrial-grade shredder or drill holes through the platters/flash chips, and document the destruction process to comply with organization security policies (such as HIPAA\u2014Health Insurance Portability and Accountability Act)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.26141920301473615, "y": -0.8395345143026516, "z": -0.47627911941397466, "word": "Hard drives: Overwriting", "row_number": 1036, "definition": "A data sanitization method where new, random, or fixed data (like zeros) is written over existing data on every addressable sector of a storage device.", "details": [{"label": "TROUBLESHOOTING", "value": "To ensure data is unrecoverable, use a software tool that performs multiple passes of data overwriting, or verify the drive\u2019s security documentation to see if it supports a \"Secure Erase\" feature at the controller level."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.28911996603928813, "y": -0.8154526247129371, "z": -0.5014445752884588, "word": "Hard drives: Purging", "row_number": 1037, "definition": "A robust sanitization process that makes data recovery infeasible using state-of-the-art laboratory techniques, often achieved through cryptographic erasure (if the drive was encrypted) or multiple overwrite passes.", "details": [{"label": "TROUBLESHOOTING", "value": "If using cryptographic erasure, delete the encryption keys; if using overwriting, use software that satisfies NIST 800-88 standards for purging, which ensures that even specialized recovery equipment cannot restore the original data."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.24400827213758458, "y": -0.8292976397635883, "z": -0.5027180002854202, "word": "Hard drives: Sanitizing", "row_number": 1040, "definition": "A process meant to render access to target data on the media infeasible for a given level of effort; this encompasses clearing, purging, or destroying the drive.", "details": [{"label": "TROUBLESHOOTING", "value": "Choose the sanitization method appropriate for the data sensitivity level (e.g., clearing is sufficient for low-sensitivity data; destruction is required for top-secret data) and maintain a certification log for compliance."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2832081504551452, "y": -0.8345738366290484, "z": -0.4725247662610353, "word": "Hard drives: Zeroing out", "row_number": 1043, "definition": "A basic sanitization method that writes a zero value to every block on a hard drive, effectively erasing all previous data.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a disk-wiping tool (like \u201cdiskpart\u201d with the \u201cclean all\u201d command) to write zeros across the entire disk; for high-security environments, verify that this is the approved method for the data\u2019s classification level."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2723657107391424, "y": -0.8109869544037799, "z": -0.5178002311707124, "word": "Overwriting drives", "row_number": 1720, "definition": "The process of replacing existing data on a disk with random data (or zeros) to prevent forensic data recovery.", "details": [{"label": "TROUBLESHOOTING", "value": "Use dedicated shredding software (like \u201cDBAN\u201d (Darik\u2019s Boot and Nuke)) for secure erasure; re-partition and format the drive after the process to make it usable again."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.24609673452486425, "y": -0.8414601147075953, "z": -0.48102107294013524, "word": "Purging drives", "row_number": 2049, "definition": "A method of data sanitization that renders data recovery impossible using state-of-the-art laboratory techniques (e.g., degaussing or physical destruction of the platters).", "details": [{"label": "TROUBLESHOOTING", "value": "For sensitive information, use disk wiping software that overwrites the entire drive with random data multiple times, or physically shred/incinerate the drive if the hardware is to be disposed of."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2981994212322989, "y": -0.8201913611783673, "z": -0.4882245756054265, "word": "RAM: ECC (Error Correction Code) RAM", "row_number": 2088, "definition": "A type of computer data storage that can detect and correct the most common kinds of internal data corruption; it is typically used in servers and workstations.", "details": [{"label": "TROUBLESHOOTING", "value": "If errors are uncorrectable, the ECC RAM module is failing and must be replaced to prevent data integrity issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2467573256339077, "y": -0.819735996053261, "z": -0.5168594770540342, "word": "Sanitizing drives", "row_number": 2212, "definition": "The process of removing data from a storage drive to ensure it cannot be recovered, which is necessary before repurposing or disposing of the hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "For magnetic HDDs (Hard Disk Drives), perform a 'low-level format' or use a data-wiping tool that overwrites the entire drive with zeros or random data multiple times; for SSDs (Solid State Drives), use the drive manufacturer\u2019s firmware tool to execute a 'Secure Erase' command."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.26931685633335894, "y": -0.8431727253752161, "z": -0.4653258923357344, "word": "Storage drives: Destroying", "row_number": 2491, "definition": "The physical or logical destruction of storage media to ensure that sensitive data cannot be recovered after the device is decommissioned.", "details": [{"label": "TROUBLESHOOTING", "value": "For SSDs, use the manufacturer's \u201cSecure Erase\u201d utility; for magnetic HDDs, use a degausser or physical destruction methods (shredding, drilling, or crushing the platters)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.28990322054288215, "y": -0.8078426285157914, "z": -0.5131728853627812, "word": "Zeroing out drives", "row_number": 3000, "definition": "A data sanitization method that involves overwriting every sector of a storage drive with binary zeros (0s), effectively destroying all existing data and preventing simple file recovery attempts.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a drive-wiping utility such as \u201cDBAN\u201d (Darik's Boot and Nuke) or manufacturer-specific disk management tools to perform a full overwrite. If the drive is destined for decommissioning, verify the overwrite process completed successfully to ensure compliance with data disposal standards."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
