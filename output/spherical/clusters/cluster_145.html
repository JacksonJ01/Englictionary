<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 145, "radius": 285.0, "nodes": [{"x": -0.755841570686349, "y": 0.654582747489404, "z": -0.014998223615341023, "word": "CompTIA A+ certification exams", "row_number": 429, "definition": "A series of exams (Core 1 and Core 2) that validate foundational knowledge in hardware, networking, security, and OS support.", "details": [{"label": "TROUBLESHOOTING", "value": "Use official exam objectives, practice exams, and hands-on labs to bridge knowledge gaps before sitting for the exam."}, {"label": "CORE", "value": "CORE 1 & 2"}]}, {"x": -0.7662329179104919, "y": 0.6421394314730001, "z": -0.02332522364106886, "word": "Questions: Exam preparation", "row_number": 2059, "definition": "The structured method of reviewing training objective lists, taking mock practice tests, analyzing vendor blueprint breakdowns, and configuring hands-on lab sandboxes to establish a technically sound competency across all functional system support requirements.", "details": [{"label": "TROUBLESHOOTING", "value": "Download the official CompTIA A+ core exam objectives blueprint document directly from their portal, set up a dedicated desktop virtualization playground utilizing \u201cOracle VM VirtualBox\u201d to practice operating system administrative tasks, build custom flashcards for standardized protocol port assignments, and review detailed practice question explanations to identify specific conceptual weaknesses before scheduling an official test attempt."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7596639717184653, "y": 0.6503152425614811, "z": 0.0008575343307601113, "word": "Sandboxes", "row_number": 2211, "definition": "An isolated virtualized environment where software can be executed, tested, or analyzed without affecting the underlying host system, commonly used for testing untrusted applications or malware.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a virtualization tool (like VirtualBox or Windows Sandbox) to create an isolated environment, take a snapshot of the clean state, run the untrusted application, analyze its behavior, and then revert the snapshot to completely erase any changes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7527381828778389, "y": 0.6576388455059762, "z": -0.02993955442781171, "word": "Testing: Sandbox testing", "row_number": 2585, "definition": "The practice of running new or untrusted software in a secure, isolated environment (a sandbox) to ensure it does not compromise the host system.", "details": [{"label": "TROUBLESHOOTING", "value": "Use virtual machine software or a built-in \u201cWindows Sandbox\u201d to run the application, monitor the host's behavior, and delete the sandbox environment once the test is complete."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.774003427356605, "y": 0.6330809888006955, "z": -0.011276349558344752, "word": "Testing: VM", "row_number": 2588, "definition": "Validating the configuration and performance of a virtual machine before deploying it into a production environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the VM's virtual resource allocation (CPU/RAM), verify the virtual network switch settings, and ensure the hypervisor is running the latest updates."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.7474843241018047, "y": 0.6642753746623358, "z": -0.0023263360208035135, "word": "Virtualization: Sandboxes", "row_number": 2829, "definition": "An isolated, tightly restricted testing environment created through virtualization or containerization software where untrusted applications or malware samples can be safely executed without risking damage to the host system or production network.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the sandbox configuration management panel and explicitly confirm that host network isolation features are active (such as disabling all bridging and setting the network interface to an isolated host-only virtual switch layout). Ensure that file system directory sharing and clipboard synchronization integrations between the sandbox and host are disabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7642748401891983, "y": 0.643663122742871, "z": -0.03977125940514082, "word": "Virtualization: Security", "row_number": 2830, "definition": "The defensive infrastructure strategies and configurations designed to protect virtual environments from threats, including securing hypervisor access, isolating virtual switch traffic, preventing VM sprawl, and mitigating VM escape vulnerabilities.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce Multi-Factor Authentication (MFA) and Role-Based Access Control (RBAC) protocols on the hypervisor administrative console. Segregate guest instance data traffic networks into dedicated Virtual Local Area Networks (VLANs), disable unused virtual physical device pathways (like serial ports or clipboard links), and implement automated file integrity monitoring across the host platform."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7687208876087803, "y": 0.6395143670868394, "z": 0.009464208550534777, "word": "Virtualization: Updating", "row_number": 2831, "definition": "The patch management maintenance protocol of applying software updates and hotfixes to hypervisors, virtual appliance templates, and machine integration driver utilities to clear bugs, optimize performance, and patch security exploits.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a cluster migration tool (such as vMotion or Live Migration) to move active guest virtual machines off onto an alternate hardware host node without downtime. Apply the newest hypervisor update patch bundle via the system administrative terminal, reboot the host server platform, migrate the workloads back, and run the integration upgrade tool inside each client OS environment."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7421470323539572, "y": 0.6697686033010859, "z": -0.025055945408761618, "word": "VM (Virtual Machines): Purpose of", "row_number": 2839, "definition": "The operational objective of running simulated computer frameworks, which includes hardware resource consolidation, legacy system software isolation, secure sandbox threat testing environments, and cross-platform software application validation without buying separate physical hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "Inventory all physical server devices using automated asset scanning software tools. Deploy an enterprise bare-metal hypervisor architecture onto target hardware clusters, and convert physical configurations over into virtual system templates to maximize hardware core processing density workloads."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7785964338787215, "y": 0.6269513746387295, "z": -0.026824745850520883, "word": "VM (Virtual Machines): Testing", "row_number": 2843, "definition": "The evaluation protocol of executing quality assurance scripts, diagnostic processing benchmarks, and simulated network interactions within an isolated guest environment to confirm system modifications are safe before production deployment.", "details": [{"label": "TROUBLESHOOTING", "value": "Clone the target production system configuration profile template into an isolated host-only virtual network segment. Launch the virtual server instance, apply the operational software patches or configurations, execute regression diagnostics to verify application behavior, and confirm stability baseline metrics before replicating the hotfix rollout out to the live hardware enterprise fleet."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
