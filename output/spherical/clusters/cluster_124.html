ition": "The structural section within Internet Properties used to manage complex low-level engine variables, including security protocols like Transport Layer Security (TLS) versions and graphic acceleration settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the \u201cInternet Options\u201d system panel console window tool, navigate directly to the \u201cAdvanced\u201d tab option pane, scroll down to the bottom security list matrix, check the box fields for \u201cUse TLS 1.2\u201d and \u201cUse TLS 1.3\u201d, uncheck insecure options, and click \u201cApply\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5542682047515198, "y": 0.6924044060699224, "z": -0.46191221639667107, "word": "Invalid certificate issue/certificate warnings, troubleshooting", "row_number": 1166, "definition": "A security mechanism error in a web browser or operating system (OS) indicating that an SSL/TLS (Secure Sockets Layer/Transport Layer Security) certificate presented by a server is untrusted, expired, revoked, or does not match the server's domain name.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the local system time and date, as incorrect settings often cause certificate validation to fail; if the date is correct, verify that the site\u2019s certificate is not expired by viewing certificate details, and ensure the local workstation has the correct Root CA (Certificate Authority) certificates installed."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5712526572271087, "y": 0.6607847058343554, "z": -0.48686135002315806, "word": "Protocols: HTTPS (HyperText Transfer Protocol Secure)", "row_number": 1992, "definition": "An extension of HTTP that uses TLS (Transport Layer Security) for secure communication over a computer network, providing encryption and authentication.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the system date and time (incorrect time causes certificate errors), view the certificate details to check for expirati r Security)", "row_number": 2304, "definition": "A cryptographic protocol designed to provide communication security over a computer network, commonly used in web browsing and email.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the server configuration to support TLS 1.2 or 1.3, and ensure clients have the latest root CA (Certificate Authority) certificates installed."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5811176651484249, "y": 0.6617049540954849, "z": -0.4737602906301197, "word": "Servers: Web servers", "row_number": 2333, "definition": "A server that uses HTTP (Hypertext Transfer Protocol) or HTTPS (Hypertext Transfer Protocol Secure) to serve web pages to clients.", "details": [{"label": "TROUBLESHOOTING", "value": "Check that the web server service (e.g., Apache, IIS - Internet Information Services) is running, ensure port 80/443 is open on the firewall, and inspect the web server error logs."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.534197449431699, "y": 0.6800583224993042, "z": -0.5021491441993103, "word": "TLS", "row_number": 2621, "definition": "The definitive cryptographic network protocol designed to provide end-to-end data encryption, origin identity validation, and message integrity verification parameter controls across unsafe computer networks, universally underpinning secure HTTPS (HyperText Transfer Protocol Secure) web traffic.", "details": [{"label": "TROUBLESHOOTING", "value": "Upgrade backend server software configuration scripts to explicitly block ancient versions (such as TLS 1.0 and 1.1), enable full support parameters restricting connections to modern secure versions (such as TLS 1.2 and 1.3), and ensure that all root Certificate Authority (CA) validation data lists on the client workstations are refreshed via system update channels."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5626829656388735, "y": 0.6927711241477573, "z": -0.45106102661047404, "word": "Troubleshooting: Certificates", "row_number": 2663, "definition": "Resolving issues related to digital identity credentials used to secure communications via SSL/TLS (Secure Sockets Layer/Transport Layer Security) protocols, often involving trust, expiration, or revocation issues.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the system date and time are correct, ensure the certificate has not expired, confirm that the root certificate authority is trusted by the local machine, and update the certificate if necessary."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5693712950919098, "y": 0.6536954421883314, "z": -0.49849633618268757, "word": "Web browsers: Secure connections", "row_number": 2891, "definition": "The data transmission link established when a web browser communicates with a web host using Transport Layer Security (TLS) or HyperText Transfer Protocol Secure (HTTPS) over port 443, encrypting all data packets to prevent eavesdropping.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the local computer configuration's current system date and clock time settings, as a mismatch with the target web host will break certificate validation loops. If the system clock is wrong, adjust it to synchronize with an internet time server; if time is correct, inspect the certificate details to determine if the site's digital certificate has expired or is self-signed."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5288066364051982, "y": 0.6994988041935052, "z": -0.48069217200374365, "word": "Websites: Secure sites", "row_number": 2898, "definition": "Internet web domains that leverage cryptographic certificates to establish secure, encrypted communication paths with web browsers, encrypting all data packets sent between the client and host via HTTPS.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the browser's address bar to confirm the presence of a closed padlock icon and that the URL prefix reads \"https://\". Click the lock icon to view the site's digital certificate path chain, confirm that the identity matches the destination domain string, and ensure the root certificate was generated by a trusted Public Certificate Authority (CA)."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
