<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 54, "radius": 285.0, "nodes": [{"x": 0.9180691930698179, "y": 0.1306925191550865, "z": -0.37425716048331137, "word": "ACK packets, three-way handshakes", "row_number": 59, "definition": "Acknowledgment packets. The final data packet sent during the standard TCP (Transmission Control Protocol) connection establishment phase. The client sends a Synchronize Packet (SYN packet), the server responds with a Synchronize-Acknowledgment Packet (SYN-ACK), and the client returns an Acknowledgment Packet (ACK packet) to confirm a reliable connection has been successfully established.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect firewall filtering rules to ensure stateful packet inspection is not dropping legitimate incoming TCP ACK frames; check for asymmetric routing loops where outbound and inbound traffic are traversing different physical or logical paths."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9134462865068141, "y": 0.1437545454994735, "z": -0.3807236692341985, "word": "SYN packet (Synchronize Packet)", "row_number": 61, "definition": "The initial data packet sent by a client host to a server to initiate a TCP (Transmission Control Protocol) three-way handshake, used to establish a reliable, connection-oriented communication channel by synchronizing sequence numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "- Analyze Traffic with Wireshark: Capture packets on the network interface to verify if outbound SYN packets are actually being generated and transmitted.\n- Inspect Firewall and ACL (Allow Client List) Rules: Check local, network, and cloud firewalls to ensure that the required inbound/outbound (Transmission Control Protocol) TCP port is open and not dropping traffic.\n- Verify Service Status: Check the target server to confirm that the listening application or service is active and bound to the correct port.\n- Mitigate SYN Flood Attacks: Enable TCP SYN cookies on the server operating system or implement rate-limiting on network firewalls to protect against Denial of Service (DoS) attacks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9222205352088645, "y": 0.13616897228402602, "z": -0.36189403894812566, "word": "SYN-ACK (Synchronize-Acknowledgment Packet)", "row_number": 62, "definition": "The second packet in the TCP (Transmission Control Protocol) three-way handshake, sent by a server back to a client host to acknowledge the receipt of the initial SYN packet and synchronize its own sequence numbers for bidirectional communication.", "details": [{"label": "TROUBLESHOOTING", "value": "- Trace the Handshake Sequence: Use network sniffing tools (e.g., \"tcpdump\" or Wireshark) to verify if the server is generating the SYN-ACK packet and if it reaches the client.\n- Fix Asymmetric Routing: Check router and gateway configurations to ensure that the return path from the server back to the client is not taking a different, blocked route.\n- Adjust MTU Settings: Reduce the Maximum Transmission Unit (MTU) size on the network interfaces if large packets containing handshake headers are being silently dropped by intermediate routers.\n- Clear TCP/IP (Transmission Control Protocol/ Internet Protocol) Stack: Run \"netsh int ip reset\" and \"netsh winsock reset\" in an elevated Windows Command Prompt to clear local network corruption preventing proper handshake negotiation."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.913865571537073, "y": 0.12638530959705618, "z": -0.3858451382060876, "word": "ACK packet (Acknowledgment Packet)", "row_number": 63, "definition": "The final packet in the TCP (Transmission Control Protocol) three-way handshake\u2014and the baseline packet used during an active session\u2014sent to confirm the successful receipt of data or to complete the connection setup before data transmission begins.", "details": [{"label": "TROUBLESHOOTING", "value": "- Verify Three-Way Handshake Completion: Run a packet capture in Wireshark and filter for \"tcp.flags.ack == 1\" to verify if the client's final ACK packet is reaching the server interface.\n- Check Stateful Firewall Tables: Inspect intermediate firewalls to ensure they aren't prematurely dropping the ACK packet due to exhausted state table limits or overly aggressive timeout rules.\n- Disable TCP Offloading: Open Device Manager, navigate to your Network Adapter properties, click the Advanced tab, and temporarily disable Large Send Offload (LSO) and TCP Checksum Offload to resolve hardware-level packet formatting bugs.\n- Isolate Bad Network Hardware: Run a continuous ping test (\"ping -t\") alongside your data transfer to pinpoint faulty switches, damaged cables, or failing access points that are causing packet corruption and dropping small ACK frames."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9156149189212363, "y": 0.15420182935209936, "z": -0.3713099999640787, "word": "Connection-oriented sessions, TCP", "row_number": 464, "definition": "A communication process where a reliable connection is established before data is exchanged, using a three-way handshake (SYN, SYN-ACK, ACK).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure both the sender and receiver are reachable, check for firewall rules blocking the specific port, and verify that the path between them is not experiencing high packet loss."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9234226234177654, "y": 0.12063294211790412, "z": -0.3643327487836227, "word": "Files: FTP", "row_number": 943, "definition": "File Transfer Protocol (FTP) is a legacy network protocol based on a client-server architecture model that utilizes separate control and data connections across ports \u201c20\u201d and \u201c21\u201d to transmit unencrypted raw data files.", "details": [{"label": "TROUBLESHOOTING", "value": "Terminate standard insecure connections, update active endpoints to enforce Secure File Transfer Protocol (SFTP) over Port \u201c22\u201d, or File Transfer Protocol Secure (FTPS) over Port \u201c990\u201d, and adjust network firewalls to allow matching secure state connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9084729162211982, "y": 0.14095288825331603, "z": -0.3934580584834936, "word": "Flow control", "row_number": 990, "definition": "A mechanism used in data transmission to manage the rate of data flow between two devices to prevent the sender from overwhelming the receiver\u2019s buffer.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the flow control setting (e.g., \u201cXON/XOFF\u201d or \u201cHardware Flow Control\u201d) matches on both the sending and receiving devices, or check the switch configuration to ensure buffer management is optimized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9229876354634154, "y": 0.1482402976918886, "z": -0.35513186131615043, "word": "Managing: flow control, TCP", "row_number": 1419, "definition": "An integrated layer-4 transmission control protocol (TCP) connection management technique that controls data flow velocity between sending and receiving nodes, ensuring a fast sender doesn't overwhelm a slower receiver's memory buffer.", "details": [{"label": "TROUBLESHOOTING", "value": "Capture network streams using a protocol analyzer like Wireshark, check the sliding window size value parameters within the TCP header files, check for network interface card (NIC) buffer overruns, and update network card driver stacks to enable hardware-offloaded flow-control configurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9172079798355144, "y": 0.11322257542547517, "z": -0.38198189766018653, "word": "Protocols: TCP (Transmission Control Protocol)", "row_number": 2003, "definition": "A connection-oriented protocol that ensures the reliable delivery of data packets by using acknowledgments and retransmissions.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network diagnostic tools like \u201cnetstat\u201d to check for active connections, or \u201cWireshark\u201d to analyze packet retransmissions, which often indicate network congestion or packet loss."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.909675180708698, "y": 0.1598033410790704, "z": -0.3833457418343969, "word": "Protocols: UDP (User Datagram Protocol)", "row_number": 2005, "definition": "A connectionless protocol that sends data packets without requiring a connection handshake or acknowledgment of receipt, making it faster but less reliable than TCP.", "details": [{"label": "TROUBLESHOOTING", "value": "Since UDP does not have error recovery, ensure the network infrastructure is not experiencing heavy load, and check for QoS (Quality of Service) settings on routers to prioritize UDP traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9277442445769392, "y": 0.12644744980327427, "z": -0.3511433597444396, "word": "Sockets: TCP connections", "row_number": 2425, "definition": "A fundamental networking communication concept where a source and destination port act as \"sockets\" that allow processes to communicate over the network reliably using a persistent, three-way handshake connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cnetstat -an\u201d to view the status of all active connections, verify that the application is listening on the correct port, and ensure no local or network firewall rules are blocking the communication socket."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9079785098600358, "y": 0.12656439651436022, "z": -0.3994452142250607, "word": "SYN packets, three-way handshakes", "row_number": 2526, "definition": "The initial packets sent in a TCP (Transmission Control Protocol) handshake (SYN - Synchronize) to establish a reliable connection between a client and a server.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a packet analyzer like \u201cWireshark\u201d to verify that the SYN packet is leaving the client and that the server is responding with a SYN-ACK (Synchronize-Acknowledgment) packet."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9185330593805635, "y": 0.16291222383924572, "z": -0.36021747063230275, "word": "TCP", "row_number": 2565, "definition": "A connection-oriented transport layer protocol that ensures reliable, ordered, and error-checked delivery of data between applications over an IP (Internet Protocol) network.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network diagnostic tools like \u201cping\u201d or \u201cnetstat\u201d to check connectivity, and examine firewall logs to ensure that the required TCP ports are not being blocked."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9236930179043962, "y": 0.1069373627559857, "z": -0.3679070658759677, "word": "TCP: Flow control", "row_number": 2566, "definition": "A mechanism within TCP that prevents a sender from overwhelming a receiver with more data than it can process at one time.", "details": [{"label": "TROUBLESHOOTING", "value": "Monitor the network traffic with a packet analyzer to check for \u201cTCP ZeroWindow\u201d messages, which indicate that the receiver's buffer is full."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9042726342603981, "y": 0.15336947189791908, "z": -0.39845803796323875, "word": "TCP: Three-way handshakes", "row_number": 2568, "definition": "The method used by TCP to establish a connection between a client and server, consisting of three steps: SYN, SYN-ACK, and ACK.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a packet capture tool like \u201cWireshark\u201d to see if the SYN packet is being sent, and determine if the server is responding with a SYN-ACK or if the packet is dropped by a firewall."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9282713813497881, "y": 0.14256893632489628, "z": -0.34349139867272377, "word": "Three-way handshakes", "row_number": 2614, "definition": "The connection-oriented verification process utilized by the transport layer TCP (Transmission Control Protocol) to establish a reliable, synchronized communication link between two network hosts before exchanging data payloads.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a packet capturing utility (such as Wireshark) to verify the sequence: the client must send a SYN (Synchronize) packet, the server must answer with a matching SYN-ACK (Synchronize-Acknowledgment) frame, and the client must return an ACK (Acknowledgment) packet; ensure local firewall rules do not filter these flags."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9123482984268312, "y": 0.1093692971273339, "z": -0.39453635979911755, "word": "UDP (User Datagram Protocol)", "row_number": 2735, "definition": "A lightweight, connectionless Transport Layer protocol within the IP (Internet Protocol) suite that transmits data packets (datagrams) without establishing a formal connection, acknowledging delivery, or guaranteeing packet ordering, maximizing transmission speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a network protocol analyzer like \"Wireshark\" to capture packets and inspect for UDP packet loss. Verify that network firewalls or Access Control Lists (ACLs) are not blocking the specific UDP ports needed for the service (such as port 53 for DNS or ports 5004/5005 for RTP [Real-time Transport Protocol])."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
