8442975893441, "word": "AAA (Authentication, Authorization, Accounting) Servers", "row_number": 25, "definition": "A security architecture framework used to manage enterprise network access. Authentication verifies who the user is; Authorization determines what permissions and files they can access; Accounting tracks and logs what the user did while connected. Typically deployed via RADIUS or TACACS+ protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Check physical network path and port connectivity (UDP 1812/1813 for RADIUS; TCP 49 for TACACS+) between the access device and the server; verify that the shared secret key matches identically on both sides; audit the server's authentication logs."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5926426901103256, "y": 0.7297020135101828, "z": -0.3410419524603701, "word": "Access: Controlling", "row_number": 32, "definition": "The overarching administrative, logical, and physical methods used to limit resource interaction exclusively to authorized entities. This combines physical locks, security permissions, group policy objects, and network firewall policies.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement the security model of \"Least Privilege\" across the infrastructure; perform regular group policy audits; move users out of local Administrator groups into standard unprivileged containers."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.60142477982503, "y": 0.7294276316432862, "z": -0.3259195673899939, "word": "Access: Remote access", "row_number": 35, "definition": "Technologies that allow a user or administrator to connect securely to a corporate desktop, internal network, or remote server over an internet connection using protocols like RDP (Remote Desktop), SSH, or VPN client software.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the remote host machine is powered on and has active remote connections enabled within its system properties; verify that local and network firewalls aren't blocking the appropriate port traffic (TCP 3389 for RDP; TCP 22 for SSH)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6022079574792155, "y": 0.7198668812853066, "z": -0.3451626416304023, "word": "Accounts: Guest accounts, disabling", "row_number": 55, "definition": "The administrative security practice of turning off the built-in, unauthenticated \"Guest\" profile container within an operating system to prevent anonymous local or remote network access to machine resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Command Prompt as an Administrator and execute the command \"net user guest /active:no\" to strictly disable the account; alternatively, open \"lusrmgr.msc\", double-click the Guest user profile, check the box for Account is disabled, and click Apply."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5881930357148453, "y": 0.7367588164651292, "z": -0.33348972862362175, "word": "AUP (Acceptable Use Policies)", "row_number": 180, "definition": "Acceptable Use Policies (AUP). A formal, legally binding document provided to employees that defines the explicit rules, safety boundaries, and constraints regarding how they may utilize company-owned computers, networks, and internet resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Require every employee to review and physically or digitally sign the formal AUP document during onboarding; deploy content-filtering firewalls to block web traffic categories that violate company compliance rules."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6104261680762705, "y": 0.7210196916239773, "z": -0.327887934541949, "word": "Best practices: Guest accounts", "row_number": 228, "definition": "An operational security rule dictating that built-in, unauthenticated user profiles intended for temporary public use must remain completely disabled across all network computers to eliminate unauthorized access paths.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows Computer Management interface by executing the command \u201ccompmgmt.msc\u201d, navigate to \u201cLocal Users and Groups\u201d, double-click the profile labeled `Guest`, check the box option for `Account is disabled`, and click `Apply` to block unauthenticated access."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5914906165335839, "y": 0.7257653143293001, "z": -0.35128842717802816, "word": "Connectivity: Access control", "row_number": 466, "definition": "The process of limiting access to network resources based on user identity or device status, often managed via ACLs (Access Control Lists).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the permissions on the target resource, verify that the user is in the correct security group, and ensure the account is not locked out or disabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5953541552522646, "y": 0.7367709651900569, "z": -0.3205026905920984, "word": "Documentation: AUP (Acceptable Use Policy)", "row_number": 739, "definition": "A document that outlines the rules and constraints under which a user must agree to follow to access corporate networks and computing resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all users have signed the AUP during onboarding, conduct security awareness training, and enforce policies through Group Policy Objects (GPO)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6110842415293457, "y": 0.713834826732388, "z": -0.3420758540125947, "word": "Filtering: MAC filtering, SOHO networks", "row_number": 968, "definition": "A security access control method where a router or access point only allows network communication from devices whose MAC (Media Access Control) address is included in an authorized \"allow list.\"", "details": [{"label": "TROUBLESHOOTING", "value": "Find the device\u2019s MAC address in its network settings, log into the wireless access point or router, locate the \u201cMAC Filtering\u201d or \u201cAccess Control\u201d menu, and add the device\u2019s MAC address to the whitelist."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5820047810429315, "y": 0.7372255212014335, "z": -0.3431748326035054, "word": "Firewalls: Screened subnets", "row_number": 980, "definition": "Also known as a DMZ (Demilitarized Zone), this is a subnetwork that exposes an organization's external-facing services (like web or email servers) to an untrusted network while protecting the internal private network.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the firewall rules governing the traffic between the \u201cScreened Subnet\u201d and the internal network; ensure the rules are restrictive and allow only necessary ports (e.g., \u201c80\u201d for HTTP or \u201c443\u201d for HTTPS)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6096251398116284, "y": 0.7264111415410415, "z": -0.3173074886520861, "word": "Hosts, networked: Security", "row_number": 1074, "definition": "The practice of protecting networked devices and the data they transmit from unauthorized access or malicious attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Update OS and application security patches, enable and configure a host-based firewall, use strong authentication (MFA\u2014Multi-Factor Authentication), and perform regular malware/vulnerability scans."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5989689089553721, "y": 0.7172293343882448, "z": -0.3561156104382488, "word": "LDAP (Lightweight Directory Access Protocol)", "row_number": 1234, "definition": "An open, cross-platform network protocol running over TCP/IP (Transmission Control Protocol/Internet Protocol) ports 389 and 636 (for encrypted LDAPS) used to query, manage, and authenticate user accounts, computer assets, and permissions within a centralized directory services database (such as Active Directory).", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the target directory server is reachable using the testing command tool \"ping\", use port-scanning tools to verify that firewall access control lists permit communication over port \"389\" or port \"636\", and check the structural string parameters of the user's distinguished name configuration fields."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5850854578633683, "y": 0.7431739520771444, "z": -0.32460357969506554, "word": "Logical security", "row_number": 1320, "definition": "The collective implementation of software-based security control mechanisms, encryption layers, access control lists, policy frameworks, and authentication protocols deployed to protect digital data assets and system resources from unauthorized exploitation.", "details": [{"label": "TROUBLESHOOTING", "value": "Audit security event logs, enforce strict multi-factor authentication requirements across all corporate directory domains, and apply timely security patch updates across the infrastructure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6179484984700478, "y": 0.7132469653965241, "z": -0.3307845516212367, "word": "Logical security: ACL", "row_number": 1321, "definition": "An Access Control List (ACL) is a sequential table of rules that defines which specific users, service accounts, or network IP addresses are granted or denied permission clearances to interact with a system resource or traverse a network interface.", "details": [{"label": "TROUBLESHOOTING", "value": "Review security rule assignments within file properties permissions tabs or network routing tables, identify explicit deny rules that override standard allow attributes, and adjust target group properties to resolve access anomalies."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5825747365724099, "y": 0.7309891561458518, "z": -0.3553329845437412, "word": "MAC filtering, SOHO networks", "row_number": 1351, "definition": "A hardware-based security control implemented on a wireless access point (WAP) or SOHO (Small Office/Home Office) router that permits or denies network access y": 0.7444771221596513, "z": -0.3368040945792274, "word": "Networks: Guest networks, security", "row_number": 1591, "definition": "A segregated network segment that allows visitors to access the Internet while keeping them logically separated from the internal, trusted network resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that VLAN (Virtual Local Area Network) tagging is correctly configured on the switch, confirm that firewall rules specifically block traffic between the guest subnet and internal subnets, and consider implementing client isolation to prevent guest devices from seeing each other."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6182956665920757, "y": 0.7193449622734884, "z": -0.3166280055920739, "word": "Networks: Security", "row_number": 1625, "definition": "The broad category of measures taken to protect the integrity, confidentiality, and availability of network resources, including physical and logical controls.", "details": [{"label": "TROUBLESHOOTING", "value": "Run regular security audits; update firmware and patches; enforce the principle of least privilege; use firewalls, VPNs (Virtual Private Networks), and IDS (Intrusion Detection System) to monitor and secure traffic."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5909028045491759, "y": 0.7202373675146568, "z": -0.3634446450444353, "word": "Networks: VPN (Virtual Private Network)", "row_number": 1651, "definition": "A secure, encrypted tunnel established over a public network (like the Internet) to allow remote users to access internal network resources as if they were locally connected.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for Internet connectivity; verify the VPN client credentials; ensure that necessary ports (e.g., 500/4500 for IPsec (Internet Protocol security)) are not blocked by the local firewall."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5882232567819318, "y": 0.7453206404571363, "z": -0.31383203005656063, "word": "Protocols: SSH (Secure Shell)", "row_number": 2002, "definition": "A network protocol that gives users, particularly system administrators, a secure way to access a computer over an unsecured network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the SSH service is running on the host, verify port 22 is open, and check that SSH keys are correctly placed in the \u201c.ssh\u201d directory with proper permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6210242486845329, "y": 0.7064116022079726, "z": -0.3395755156246936, "word": "RADIUS (Remote Authentication Dial-In User Service) servers", "row_number": 2063, "definition": "A centralized network protocol and server used to manage user authentication, authorization, and accounting (AAA) for network access, often utilized by WAPs and VPN gateways to verify credentials against a backend database like AD.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the server service is active, ensure the shared secret between the network appliance (the RADIUS client) and the RADIUS server is synchronized, and use a tool like 'radtest' to manually verify that the server is responding correctly to authentication requests."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5742661486484534, "y": 0.7387891587495026, "z": -0.3527165567855791, "word": "Remote access: VPN", "row_number": 2128, "definition": "Networking technology that creates a secure, encrypted tunnel over a public internet transport framework, allowing devices to connect to private corporate subnets.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm stable internet connection, verify MFA token is accurate, and check that ISP filters are not dropping tunnel protocols."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6104099911039691, "y": 0.7306205195583674, "z": -0.30593021943036874, "word": "Restricting: Logons", "row_number": 2171, "definition": "A security management control that regulates user access to an enterprise network by specifying valid operational parameters, such as allowed hours of the day or authorized workstation names, configured on a directory account.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cActive Directory Users and Computers\u201d console on a Domain Controller, search for and double-click the targeted user account object, navigate to the \u201cAccount\u201d tab, click the \u201cLogon Hours\u201d or \u201cLogon To\u201d button, adjust the operational grid matrix to authorize the requested access schedule or specific computer names, and click \u201cApply.\u201d"}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6047412091685371, "y": 0.7090540043394371, "z": -0.36267132346462855, "word": "Screened subnets", "row_number": 2224, "definition": "A network architecture (also known as a DMZ or DeMilitarized Zone) that uses a firewall to isolate a public-facing subnet from the internal, secure network, providing an added layer of defense.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the firewall access control lists (ACLs), ensure the DMZ is properly configured with correct IP subnets, and check routing table entries to ensure traffic is correctly routed between the subnets and the internet gateway."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5755457417171899, "y": 0.7499782037786775, "z": -0.32600581750655633, "word": "Security: Connectivity", "row_number": 2265, "definition": "The management of network-based security, ensuring that remote or local connections are authenticated, encrypted, and isolated according to organizational security policy.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the VPN (Virtual Private Network) configuration, check that firewall ports are open, and ensure root certificates are correctly installed on the client machine."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6253126546763623, "y": 0.710811669218558, "z": -0.3220727476895989, "word": "Security: Logical security", "row_number": 2284, "definition": "A set of software-based controls (e.g., firewalls, ACLs, encryption) designed to limit access to computer resources, networks, and data, ensuring that only authenticated users can perform authorized tasks.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the \u201cLocal Group Policy\u201d and \u201cActive Directory\u201d permission sets, ensure MFA (Multi-Factor Authentication) is enforced, and run the command \u201cgpresult /r\u201d to verify effective security policies on a workstation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5808053534468087, "y": 0.7270933788833621, "z": -0.36606059579187594, "word": "Security: SOHO (Small Office/Home Office) networks", "row_number": 2300, "definition": "A networking environment designed for small businesses or home use, which requires tailored security configurations to protect against external internet threats.", "details": [{"label": "TROUBLESHOOTING", "value": "Change default router login credentials, update firmware to the latest version, disable WPS (Wi-Fi Protected Setup), and configure a strong WPA3 (Wi-Fi Protected Access 3) password."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.5959623300279984, "y": 0.7432254222208863, "z": -0.30404748469965126, "word": "Servers: AAA (Authentication, Authorization, and Accounting) servers", "row_number": 2320, "definition": "A framework that manages network access by verifying user identities (Authentication), determining permitted actions (Authorization), and logging user activity (Accounting).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify network connectivity between the client and the AAA (Authentication, Authorization, and Accounting) server, check the shared secret keys, and review the server logs to identify which phase (Authentication, Authorization, or Accounting) is failing."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6192896143600953, "y": 0.7020806467730958, "z": -0.3515154889509079, "word": "Servers: RADIUS (Remote Authentication Dial-In User Service) servers", "row_number": 2328, "definition": "A networking protocol providing centralized AAA (Authentication, Authorization, and Accounting) management for computers to connect and use a network service, commonly used with Wi-Fi.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the shared secret key on both the client (AP) and the RADIUS (Remote Authentication Dial-In User Service) server, and check the logs for failed authentication requests."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.5685611474075568, "y": 0.7470462872581998, "z": -0.34447070463588303, "word": "Servers: TACACS+ (Terminal Access Controller Access-Control System Plus) servers", "row_number": 2331, "definition": "A protocol developed by Cisco that handles AAA (Authentication, Authorization, and Accounting) for remote administrative access to network devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the connection between the networking device and the TACACS+ (Terminal Access Controller Access-Control System Plus) server, verify the shared secret, and check if the device is correctly configured to use TACACS+ (Terminal Access Controller Access-Control System Plus) as the primary authentication method."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6204506897340313, "y": 0.7221133408710536, "z": -0.30593016285520214, "word": "SSH (Secure Shell)", "row_number": 2468, "definition": "A cryptographic network protocol used to operate network services securely over an unsecured network, most commonly used for remote command-line login and remote command execution.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the SSH service is active on the target device by using the command \u201csystemctl status sshd\u201d, and ensure that port 22 is open on both the local and remote firewalls."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.595040187396789, "y": 0.712978154085339, "z": -0.3709303535434338,
