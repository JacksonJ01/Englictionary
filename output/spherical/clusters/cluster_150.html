<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 150, "radius": 285.0, "nodes": [{"x": 0.1400860632647735, "y": 0.987737993904956, "z": -0.06891698103944434, "word": "Dumpster diving", "row_number": 800, "definition": "A physical social engineering attack technique where unauthorized individuals rummage through corporate trash receptacles or recycling bins to find discarded paperwork, passwords, or hardware items containing sensitive credentials.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy locked security bins throughout the facility for all paper materials destined for disposal, implement strict organizational shredding mandates, and position physical security cameras around waste areas."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.12653954931853728, "y": 0.9890546574414525, "z": -0.07588561821341672, "word": "Impersonation", "row_number": 1111, "definition": "A form of social engineering where an attacker pretends to be someone else\u2014such as a technician, executive, or customer\u2014to gain unauthorized access to information or systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Always verify the identity of the requester through official channels, check the employee directory, and never provide credentials or sensitive data over the phone without following established verification policies."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.13543827222057683, "y": 0.9892222288199248, "z": -0.05564042079680443, "word": "Phishing", "row_number": 1798, "definition": "A form of social engineering where attackers deceive users into revealing sensitive information (like passwords or credit card numbers) by masquerading as a trustworthy entity in an electronic communication.", "details": [{"label": "TROUBLESHOOTING", "value": "Educate users on identifying suspicious emails, use anti-phishing filters, implement MFA (Multi-Factor Authentication), and report the phishing attempt to the IT security department for blocking."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.14356339497627715, "y": 0.986286202817491, "z": -0.08141914857538426, "word": "Physical security: Dumpster diving", "row_number": 1813, "definition": "A social engineering and physical security threat where an attacker scavenges through trash for discarded documents, passwords, or hardware with residual data.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce a strict \"shred-all\" policy for physical paper and ensure all decommissioned storage media is physically destroyed or sanitized before being sent to the bin."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.116696009863017, "y": 0.9909859687090146, "z": -0.06579400507574058, "word": "Piggybacking", "row_number": 1825, "definition": "A social engineering technique where an unauthorized person gains entry into a secure area by closely following an authorized person through a secure door (often called tailgating).", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy mantraps, use turnstiles, and conduct security awareness training to encourage employees to challenge unauthorized individuals entering secure spaces."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.15080154886053393, "y": 0.986843471272754, "z": -0.05829970898388, "word": "Pretexting", "row_number": 1913, "definition": "A form of social engineering where an attacker creates a fabricated scenario (a pretext) to gain a victim's trust and induce them to divulge sensitive information or provide unauthorized access.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement a strict security policy requiring identity verification for all IT requests, train employees to never divulge credentials or sensitive information over the phone, and report suspected attempts immediately to the security team."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.12840763064871036, "y": 0.9876615171535491, "z": -0.08964489904692825, "word": "Screens: Shoulder surfing", "row_number": 2227, "definition": "A form of social engineering where an attacker observes a user's screen or keyboard input\u2014such as passwords or sensitive data\u2014from a close proximity, usually in a public place.", "details": [{"label": "TROUBLESHOOTING", "value": "Install a physical privacy screen filter over the monitor, position workstations away from high-traffic foot areas, and enforce \u201cClean Desk\u201d policies to ensure no physical paperwork contains credentials."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.12376208637064576, "y": 0.9911296362398284, "z": -0.04842509828890508, "word": "Security: Social engineering", "row_number": 2299, "definition": "The psychological manipulation of people into performing actions or divulging confidential information, rather than using technical hacking techniques.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct security awareness training, implement strict verification policies for help-desk requests, and mandate reporting procedures for suspicious contacts."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.15696617521230308, "y": 0.9845724183833167, "z": -0.07732252451936641, "word": "Shoulder surfing", "row_number": 2371, "definition": "A physical social engineering observation methodology where an un-authorized threat actor looks over a user's physical shoulder space to secretly capture private PII (Personally Identifiable Information), access credentials, or building pin numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "Anchor a specialized physical micro-louver \"Privacy Screen Filter\" directly onto the face of the monitor screen panel to dramatically narrow the effective horizontal viewing angles, reposition office display terminals away from glass windows or public walkways, and instruct personnel to cover keypads with their hands when typing."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.11019403577049759, "y": 0.9907812945483663, "z": -0.07880165514551955, "word": "Social engineering", "row_number": 2399, "definition": "A deceptive manipulation technique where an attacker exploits human psychology, trust, or social norms to coerce individuals into divulging confidential information, bypassing traditional network security barriers, or performing unauthorized actions.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement mandatory, recurring security awareness training, establish strict verification protocols for any request involving sensitive data or physical access, and utilize multi-factor authentication (MFA) to ensure that even compromised credentials cannot grant total system access."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.14584080315718428, "y": 0.9883215464265656, "z": -0.044169910611971036, "word": "Social engineering: Best practices", "row_number": 2400, "definition": "A set of standardized defensive protocols and behavioral guidelines designed to harden human assets against social engineering attacks, emphasizing skepticism, verification, and procedural adherence.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce strict \u201cclean desk\u201d policies, utilize automated phishing simulation tests to measure personnel awareness, and standardize a \"verify-before-trust\" procedure for all incoming requests, particularly those demanding urgency or secrecy."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.1423532717948054, "y": 0.9851353239301086, "z": -0.09614540838976336, "word": "Social engineering: Dumpster diving", "row_number": 2406, "definition": "A physical reconnaissance technique where an attacker sifts through physical trash, discarded hard drives, or recycled paper documents to find discarded account numbers, passwords, project plans, or sensitive corporate PII (Personally Identifiable Information).", "details": [{"label": "TROUBLESHOOTING", "value": "Mandate the use of high-security shredders for all paper documentation, perform physical destruction (degaussing or physical crushing) of old hard drives and storage media before disposal, and secure trash collection areas."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.10865642191458702, "y": 0.9926140052717873, "z": -0.05395570882695676, "word": "Social engineering: Impersonation", "row_number": 2408, "definition": "The act of pretending to be someone else\u2014usually a person of authority, an IT technician, or a vendor\u2014to manipulate a target into providing information or performing an action they wouldn't normally authorize.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish a policy that IT staff never request passwords over the phone or email, implement badge-based access control, and confirm identities by calling back the person at a verified, official contact number."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.16418907500417723, "y": 0.9844633628184095, "z": -0.062240139118910486, "word": "Social engineering: Piggybacking", "row_number": 2413, "definition": "A physical security breach where an unauthorized individual follows an authorized person into a restricted area (often by catching a closing door) without the authorized person's direct knowledge or consent.", "details": [{"label": "TROUBLESHOOTING", "value": "Install mantraps (two-door entry systems where the first must close before the second opens), use turnstiles that allow only one person per entry, and train employees to never hold secure doors open for others."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.11553567148467508, "y": 0.9887385260726687, "z": -0.09511906052012842, "word": "Social engineering: Pretexting", "row_number": 2414, "definition": "The act of creating a fabricated scenario (the \"pretext\") to engage a victim and increase the likelihood that they will share information or perform an action, such as pretending to be a bank auditor needing account confirmation.", "details": [{"label": "TROUBLESHOOTING", "value": "Require personnel to verify any request for sensitive information through a secondary communication channel, establish strict corporate procedures for identity confirmation, and train staff to recognize common high-pressure social engineering tactics."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.13016892241193942, "y": 0.990838153315711, "z": -0.03599729951018799, "word": "Social engineering: Tailgating", "row_number": 2418, "definition": "A physical security vulnerability where an unauthorized person tags along with an authorized person through a secure entrance, often with the authorized person's knowledge and permission (e.g., holding the door).", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize mantraps, enforce \"no-tailgating\" policies, and promote a culture where employees feel empowered to challenge anyone who does not have visible identification."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.15986863129509246, "y": 0.9829419483847787, "z": -0.0909238518397069, "word": "Tailgating", "row_number": 2552, "definition": "A physical security breach where an unauthorized person follows an authorized individual into a restricted area without presenting credentials.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement physical deterrents like mantraps (a two-door security vestibule), install turnstiles, and conduct mandatory employee training on security awareness and physical access protocols."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
