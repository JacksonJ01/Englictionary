<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Subcluster legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 5, "radius": 285.0, "nodes": [{"x": -0.7410146121383878, "y": 0.5571941747307627, "z": -0.3747425732999908, "word": "32-bit CPU", "pos_group": "other", "row_number": 9, "definition": "An older processor architecture capable of handling binary data blocks that are up to 32 bits wide. This structural limitation constraints the maximum addressable system memory space to exactly 4 Gigabytes (GB) of physical RAM, regardless of how much is physically installed on the motherboard.", "details": []}, {"x": -0.7471642912438428, "y": 0.5443149544571346, "z": -0.3814010385990232, "word": "64-bit CPU", "pos_group": "other", "row_number": 10, "definition": "The current industry-standard processor architecture capable of handling data blocks that are up to 64 bits wide. This removes the 4GB barrier, allowing the processor to theoretically address up to 16 Exabytes of physical system RAM and handle complex computations much faster.", "details": []}, {"x": -0.7480307715686261, "y": 0.5562357000343734, "z": -0.3620107882283568, "word": "About section, Settings", "pos_group": "other", "row_number": 27, "definition": "A system information panel located within modern Windows Settings (Settings > System > About). It provides a quick overview of the physical device hardware specs (CPU, installed RAM, Device ID) and Windows operating system details (Edition, Version, OS build).", "details": []}, {"x": -0.7348087143500939, "y": 0.5572606217034972, "z": -0.3866739619030401, "word": "AMD CPU", "pos_group": "other", "row_number": 107, "definition": "Advanced Micro Devices Central Processing Unit. A major brand of computer processors that implements the x86-64 computing architecture. They feature a distinct physical layout compared to Intel processors, using a PGA (Pin Grid Array) layout where the delicate interface pins are located directly on the underside of the CPU chip itself, mating with sockets like AM4 or AM5.", "details": []}, {"x": -0.7563573103714973, "y": 0.5382919807160181, "z": -0.3717060162876305, "word": "Applications: Impact on devices/computers", "pos_group": "other", "row_number": 136, "definition": "The consumption footprint a running application places on system hardware resources (including processor cycles, volatile RAM allocation, storage drive operations, and battery life).", "details": []}, {"x": -0.7375812211180568, "y": 0.5684175553955064, "z": -0.3645208155540541, "word": "ARM (Advanced RISC  (Reduced Instruction Set Computer) Machine) CPU", "pos_group": "other", "row_number": 156, "definition": "Advanced RISC (Reduced Instruction Set Computer) Machine Central Processing Unit (ARM CPU). A processor architecture built on Reduced Instruction Set Computer (RISC) principles. It values power efficiency, low thermal output, and minimal transit layout overhead, making it the standard choice for mobile devices, tablets, and modern energy-conscious laptops.", "details": []}, {"x": -0.7414930397593422, "y": 0.5427231509388378, "z": -0.3945119179739317, "word": "ATX: Motherboards", "pos_group": "other", "row_number": 173, "definition": "Advanced Technology eXtended (ATX) motherboards. A standard computer motherboard form factor specification created by Intel. A standard full-size ATX board measures 12 inches by 9.6 inches, contains multiple expansion slots, and implements a uniform 24-pin primary power connection interface layout.", "details": []}, {"x": -0.7573841888180357, "y": 0.548007201093334, "z": -0.3550454873368989, "word": "BIOS firmware: Fan settings", "pos_group": "other", "row_number": 238, "definition": "Configurable profiles within the system firmware that regulate the rotational speeds of internal cooling fans based on real-time temperature thresholds.", "details": []}, {"x": -0.7276477577348357, "y": 0.5692753182980603, "z": -0.3826935492533261, "word": "BIOS firmware: \u201cflashing the BIOS\u201d", "pos_group": "other", "row_number": 239, "definition": "The process of overwriting and updating the existing firmware code on the motherboard's EEPROM (Electrically Erasable Programmable Read-Only Memory) chip to add features or resolve hardware bugs.", "details": []}, {"x": -0.7561061772644216, "y": 0.5298797622247196, "z": -0.3840974958096679, "word": "Bottlenecks, storage drives", "pos_group": "other", "row_number": 268, "definition": "Performance performance drops occurring when the data transfer capacity of a storage unit limits the processing speeds of other hardware components.", "details": []}, {"x": -0.7449655018635548, "y": 0.5673354043587753, "z": -0.3509372308465533, "word": "Bus speeds", "pos_group": "other", "row_number": 291, "definition": "The operational data transfer frequency of internal motherboard pathways that connect core components like the CPU with system memory and peripheral slots.", "details": []}, {"x": -0.7306418542487856, "y": 0.5528311436395557, "z": -0.4006746902938558, "word": "Cache memory", "pos_group": "other", "row_number": 328, "definition": "A small, extremely fast type of volatile memory (SRAM) located on or near the CPU that stores frequently accessed data to minimize the time the processor spends waiting for data from slower main RAM.", "details": []}, {"x": -0.7648265309189974, "y": 0.5340772071354873, "z": -0.3602803275517129, "word": "Case fans", "pos_group": "other", "row_number": 332, "definition": "Cooling fans mounted in the computer chassis to promote airflow and prevent heat buildup around internal components.", "details": []}, {"x": -0.7277903550948714, "y": 0.5785770149255617, "z": -0.3681980945506202, "word": "Chipsets", "pos_group": "other", "row_number": 346, "definition": "A set of electronic components on the motherboard that manages data flow between the CPU, RAM, storage, and other peripherals.", "details": []}, {"x": -0.7474747981454598, "y": 0.5306184533429578, "z": -0.3996567065736935, "word": "Clock rates: Motherboard bus speeds", "pos_group": "other", "row_number": 367, "definition": "The speed at which the motherboard transfers data between the CPU (Central Processing Unit), RAM (Random Access Memory), and other components.", "details": []}, {"x": -0.7570957799471649, "y": 0.5559843508241363, "z": -0.3430559453279564, "word": "Compatibility: RAM", "pos_group": "other", "row_number": 425, "definition": "Matching memory modules to the motherboard's supported speed, capacity, and form factor (e.g., DIMM or SODIMM).", "details": []}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(n)=>String(n.pos_group||'other');const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+'<br>subcluster: '+(info.pos_group||'other')+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
