 1"}]}, {"x": 0.8197400268998121, "y": -0.4584158130177969, "z": 0.3433383617854659, "word": "Cabling: Twisted pair cabling", "row_number": 324, "definition": "A type of copper cabling where pairs of insulated wires are twisted together to cancel out EMI from external sources and crosstalk from neighboring pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the cable category (Cat5e, Cat6, etc.) meets the network speed requirements; ensure the twists are maintained as close to the termination point as possible."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8128911507567254, "y": -0.485726317622278, "z": 0.3213688245466705, "word": "Cabling: UTP cabling", "row_number": 325, "definition": "Unshielded Twisted Pair is the most common copper network cable, containing no shielding, making it flexible but susceptible to EMI.", "details": [{"label": "TROUBLESHOOTING", "value": "If EMI is present, replace with shielded cable (STP) or reroute the cable away from the source of the interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8319923038348837, "y": -0.45303219381635146, "z": 0.3202352849475932, "word": "Coaxial cabling", "row_number": 390, "definition": "A type of copper transmission cable featuring a central conductor shielded by an insulator, a metallic shield, and an outer jacket, primarily used for cable internet and television signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the F-connector for physical damage, ensure the connector is fully tightened, and test the cable with a continuity tester to check for breaks in the center conductor."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8098518246097216, "y": -0.47333592218247605, "z": 0.34654455261621087, "word": "Connectivity: Coaxial cabling", "row_number": 472, "definition": "A type of copper cable with a central conductor used primarily for cable internet and television signals.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect for kinks or dama NG", "value": "Re-terminate the connection, ensuring the wire is seated correctly in the slot; use the correct blade type (110 or 66) for the jack; ensure the wire is not damaged by the blade."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8330512342990621, "y": -0.4383409159123076, "z": 0.33746537966133394, "word": "RG-6 cabling", "row_number": 2177, "definition": "A heavy-duty, heavily shielded coaxial copper cable standard featuring a 75-ohm impedance rating and a thick core conductor, optimized for delivering high-bandwidth digital television signals, satellite feeds, and high-speed cable internet connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Trace the cabling line back to the external service junction splitter box; inspect the compression F-type connector terminations for a loose, frayed copper grounding mesh, use a cable tester tool to verify line continuity and ensure no short circuits exist between the copper core and the outer aluminum shielding, and swap out damaged links with pre-terminated RG-6 cables."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7999640294514607, "y": -0.4934243192668646, "z": 0.3414527679486782, "word": "SOHO (Small Office/Home Office) networks: EMI", "row_number": 2446, "definition": "A disturbance generated by external electromagnetic sources\u2014such as microwave ovens, fluorescent lights, or high-voltage power lines\u2014that disrupts the transmission of data over copper-based network cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace unshielded UTP (Unshielded Twisted Pair) cabling with STP (Shielded Twisted Pair) or fiber optic cables, route network cables away from high-voltage electrical conduits, and use high-quality, grounded network hardware."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8359384394195501, "y": -0.4617272285982373, "z": 0.29667303866680944, "word": "STP (Shielded Twisted-Pair) cabling", "row_number": 2511, "definition": "A type of copper cabling that features a protective foil or mesh shield around the twisted pairs to reduce EMI (Electromagnetic Interference).", "details": [{"label": "TROUBLESHOOTING", "value": "Install STP cabling and ensure the shielding is properly grounded to the patch panel or switch to dissipate electrical interference."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.816174918229847, "y": -0.4521359302049202, "z": 0.359766039906818, "word": "Strippers, cable", "row_number": 2515, "definition": "A hand tool designed to remove the outer jacket of cables (like UTP or STP) without damaging the internal copper conductors.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the depth of the stripper blade to match the cable jacket thickness, and replace the blade if it is dull and tearing the insulation instead of cutting it."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.808491384490181, "y": -0.4993434148374336, "z": 0.3114447547537782, "word": "Twisted pair cabling", "row_number": 2725, "definition": "A type of copper cabling where pairs of wires are twisted to reduce crosstalk and EMI (Electromagnetic Interference).", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the cable for physical damage, verify it is within the 100-meter length limit, and test the pinout using a cable tester."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8404073646165563, "y": -0.43841790601013064, "z": 0.3185988091439558, "word": "Twisted pair cabling: Direct burial cabling", "row_number": 2726, "definition": "A specialized twisted pair cable with a protective outer jacket that allows it to be placed directly into the ground without conduit.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a continuity test; if damaged, excavate the cable to splice it properly or replace it entirely with new direct-burial-rated cable."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8004350750599607, "y": -0.4809152705812957, "z": 0.35780468573716867, "word": "Twisted pair cabling: STP (Shie
