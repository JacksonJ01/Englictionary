19827353303635, "word": "Communications", "row_number": 413, "definition": "The exchange of information between devices or individuals, including network protocols, physical medium usage, and professional conduct.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow established protocols for networking issues, and adhere to professional standards when interacting with end-users."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9097453483153716, "y": -0.34890372737587305, "z": -0.22501020030604355, "word": "Communications: NFC", "row_number": 415, "definition": "A set of communication protocols that enables two electronic devices to establish communication by bringing them within 4 cm of each other.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NFC antenna is positioned correctly over the reader, verify NFC is enabled in device settings, and check for protective cases that might block the signal."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9104547234318985, "y": -0.3563655685255714, "z": -0.20994232100744173, "word": "Connectivity: Remote Desktop", "row_number": 494, "definition": "A technology that allows a user to connect to and control a computer in a different location as if they were sitting in front of it.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure Remote Desktop is enabled on the target machine, verify network connectivity, and ensure the port is open on the host firewall."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.9040714382549061, "y": -0.360773637114293, "z": -0.22912271230724773, "word": "Desktops: RDP", "row_number": 620, "definition": "A protocol that allows a user to connect to another computer over a network and view its graphical desktop.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the host computer has \u201cRemote Desktop\u201d enabled in settings and that the firewall allows traffic on port \u201c3389\u201d."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.9140355302751472, "y": -0.3423975142237444, "z": -0.21749250940671758, "word": "Documentation: Network topology diagrams", "row_number": 753, "definition": "Visual representations of a network's structure, showing how devices are connected, their IP schemes, and physical layout.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network mapping software to update the diagram whenever a physical change is made to the network topology."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9056804103293694, "y": -0.36720021317587637, "z": -0.2119127126654179, "word": "Ethernet", "row_number": 877, "definition": "A family of computer networking technologies for Local Area Networks (LANs) and Metropolitan Area Networks (MANs) that provides a physical and link-layer protocol for connecting devices to share data.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical cable integrity by checking for kinks or breaks, test the port using a cable tester, and ensure the Network Interface Card (NIC) drivers are correctly installed and updated within the Device Manager."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9069361257444307, "y": -0.3494719834208238, "z": -0.2352364695866641, "word": "Guest networks, security", "row_number": 1016, "definition": "A segregated network segment (VLAN\u2014Virtual Local Area Network) on a router that allows visitors to access the internet while preventing them from accessing the private local network resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s web interface, enable the \u201cGuest Network\u201d feature, and ensure \u201cAP Isolation\u201d (or client isolation) is enabled to prevent guests from communicating with each other or the primary network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.91475924779957, "y": -0.3483839440281364, "z": -0.2045584173495799, "word": "Hosts, networked", "row_number": 1070, "definition": "Any device connected to a network that provides or consumes services, ranging from personal computers to internet-enabled appliances.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cipconfig\u201d (Windows) or \u201cifconfig\u201d (Linux) command to verify local IP settings, check the status of the local firewall, and use the \u201cping\u201d command to test connectivity to other network hosts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9008759945132316, "y": -0.370565528742638, "z": -0.2260611231890282, "word": "Hub-and-spoke (star) topologies", "row_number": 1082, "definition": "A network layout where all nodes are connected to a central hub, switch, or concentrator.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the status lights on the central hub/switch; if off or blinking red, replace the unit; if the unit is functional, check the individual cabling running to the \"spoke\" nodes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9136835993102453, "y": -0.3370177029910104, "z": -0.22715930142113538, "word": "Hubs", "row_number": 1083, "definition": "A legacy networking device that connects multiple devices in a network segment and broadcasts all incoming data to every other port, causing high traffic and collisions.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the hub with a network switch, which intelligently routes traffic to the destination rather than broadcasting it to every node."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9092073499852137, "y": -0.36439947262097244, "z": -0.20138276760046406, "word": "LAN (Local Area Networks)", "row_number": 1221, "definition": "A private data network that interconnects computers, servers, printers, and peripheral devices within a localized, contiguous geographic footprint, such as an individual residence, single corporate office suite, or unified academic campus building.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical layer infrastructure by testing twisted-pair copper drops with a network cable tester, check link-status LED (Light Emitting Diode) illuminating indicators on local access switch ports, and execute the command \"ipconfig /all\" to validate that the host NIC (Network Interface Card) successfully holds a correct local network address profile."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9019061044852441, "y": -0.3590760490707837, "z": -0.2400620121467949, "word": "LAN: VLAN", "row_number": 1222, "definition": "A Virtual Local Area Network (VLAN) is a logical network grouping created by configuring physical managed switches to segment broadcast domains irrespective of the physical physical placement of the infrastructure assets.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the managed switch CLI (Command Line Interface) console, run the diagnostic status command \"show vlan\", verify that the explicit destination physical port configuration matches the correct numeric VLAN ID (Identifier) tag assignment, and confirm that trunk ports linking adjacent switches carry all required tags."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9179979748467839, "y": -0.33725475666152693, "z": -0.20865988422880408, "word": "MAN (Metropolitan Area Networks)", "row_number": 1409, "definition": "A high-speed network infrastructure topology traversing a geographic scale larger than a local area network (LAN) but smaller than a wide area network (WAN), typically linking multiple regional buildings or organization properties across a single metropolitan zone.", "details": [{"label": "TROUBLESHOOTING", "value": "Coordinate with regional infrastructure provider tier-groups to validate physical point-to-point fiber connections, run a diagnostic trace utility route to isolate which regional router link is dropping packets, and ensure dark-fiber optoelectronic multiplexers are operating within acceptable optical decibel power metrics."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9011510494295927, "y": -0.37653413262798796, "z": -0.21482279459599418, "word": "Networks", "row_number": 1564, "definition": "A collection of interconnected computing devices (such as servers, workstations, and mobile devices) that share resources, exchange data, and communicate via established communication protocols and physical or wireless media.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical layer connectivity (cables and switches), confirm correct TCP/IP (Transmission Control Protocol/Internet Protocol) settings on client devices, and check if the gateway or router is active and routing traffic correctly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.909497895769267, "y": -0.3399315187884853, "z": -0.2392909110798597, "word": "Networks: Connectivity", "row_number": 1573, "definition": "The ability of a device to establish and maintain a functional communication link with other devices or the Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cipconfig /all\u201d (on Windows) or \u201cifconfig\u201d (on Linux) to verify the IP configuration, run a \u201cping\u201d test to the gateway, and check the physical link status on the network interface card (NIC)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9147804899997295, "y": -0.3536105038153167, "z": -0.19528509084754153, "word": "Networks: Hubs", "row_number": 1593, "definition": "A basic networking device that connects multiple Ethernet devices together, making them act as a single network segment; hubs broadcast all incoming data to every port.", "details": [{"label": "TROUBLESHOOTING", "value": "Replace the hub with a network switch, which intelligently routes traffic only to the destination port, eliminating collisions and increasing overall network efficiency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8977401348308497, "y": -0.3718728324561209, "z": -0.23616360175723444, "word": "Networks: LAN (Local Area Network)", "row_number": 1597, "definition": "A network that connects computers within a limited area such as a residence, school, laboratory, or office building.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the central switch or router for link lights, ensure DHCP is providing correct IP addresses to local hosts, and verify that the internal cabling path is clear of defects."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9179619025677836, "y": -0.32951245609437246, "z": -0.22083361771430773, "word": "Networks: MAN (Metropolitan Area Network)", "row_number": 1602, "definition": "A network that spans a larger geographical area than a LAN\u2014such as a city or a large campus\u2014often connecting multiple LANs together.", "details": [{"label": "TROUBLESHOOTING", "value": "Since MANs often rely on service provider infrastructure, check with the ISP or network provider for outage reports, and verify the health of the border routers and long-haul fiber connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9052730382857503, "y": -0.37441782022966474, "z": -0.20072872750892645, "word": "Networks: PAN (Personal Area Network)", "row_number": 1610, "definition": "A computer network organized around an individual person within a single room or short range, typically used for connecting devices like smartphones, tablets, and wearable technology (often via Bluetooth).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure Bluetooth or the relevant wireless radio is enabled on all devices; remove and re-pair the devices; check for interference from other 2.4 GHz sources like microwaves or cordless phones."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9030584747090548, "y": -0.35111767724195336, "z": -0.24738991083787293, "word": "Networks: Routers", "row_number": 1619, "definition": "A networking device that forwards data packets between computer networks, acting as a gateway between internal networks and the Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the router; check the WAN (Wide Area Network) and LAN indicator lights; review the router\u2019s routing table and firewall settings for misconfigurations; update the firmware if there is a known bug."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9197184705854113, "y": -0.3390199547713104, "z": -0.1979479859227939, "word": "Networks: SOHO networks", "row_number": 1630, "definition": "Small Office/Home Office networks represent a class of network typically used by small businesses or home users, characterized by a few devices and a single integrated router/switch/access point.", "details": [{"label": "TROUBLESHOOTING", "value": "Power cycle the SOHO router; check for Wi-Fi interference; update the router firmware; verify IP address conflicts in the local network range."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.896798418905629, "y": -0.38177524767652243, "z": -0.22360737042837844, "word": "Networks: Star (hub-and-spoke) topologies", "row_number": 1633, "definition": "A network setup where all peripheral devices connect to a central node (a hub or switch), which acts as a conduit to pass messages.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify power to the central switch; check for individual port failures on the switch; swap the cable from the malfunctioning node to a known-working port on the switch."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9138620358231636, "y": -0.3298878530412783, "z": -0.23670695785497844, "word": "Networks: Switches", "row_number": 1636, "definition": "A networking device that operates at the Data Link layer (Layer 2) of the OSI (Open Systems Interconnection) model to connect devices on a single LAN (Local Area Network), using MAC (Media Access Control) addresses to intelligently forward data to the specific destination port.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify power to the switch; check for link lights on individual ports; use the command \u201cping\u201d to verify connectivity between devices; check the switch\u2019s management interface for error logs or port status."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9120472781438014, "y": -0.3633714121443495, "z": -0.1900815069034988, "word": "Networks: Topology diagrams", "row_number": 1639, "definition": "A visual representation of a network's structure, showing the arrangement of nodes, devices, and the physical or logical connections between them.", "details": [{"label": "TROUBLESHOOTING", "value": "Use network discovery tools to map the current network state; update the existing diagram to reflect current cabling, IP schemes, and device locations to ensure efficient future maintenance."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8968929029115992, "y": -0.3670895983986845, "z": -0.24663403547421736, "word": "Networks: VLAN (Virtual Local Area Network)", "row_number": 1649, "definition": "A logical grouping of network devices within a physical network, allowing segmentation of traffic for security and performance management, independent of the physical location of the devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the switch port configuration to ensure it is assigned to the correct VLAN ID; verify the trunk port settings if connectivity issues span multiple switches."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9215312765324808, "y": -0.32655801296835335, "z": -0.21009514639462107, "word": "Networks: WAN (Wide Area Network)", "row_number": 1652, "definition": "A network that spans a large geographical distance, connecting LANs across cities, states, or countries, typically managed by ISPs.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify connectivity with the service provider; check router configurations at the edge of the network; use \u201ctracert\u201d to identify where the path fails along the wide area connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9001780646690969, "y": -0.3836274046532866, "z": -0.2061782391223252, "word": "Networks: WLAN (Wireless Local Area Network)", "row_number": 1656, "definition": "A wireless network that links two or more devices within a limited area (like a home or office), essentially extending a LAN without the use of permanent cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the WAP is broadcasting; check for Wi-Fi interference; ensure the client is within range; restart the WAP."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9066014342715211, "y": -0.33994624058106726, "z": -0.2500207849192143, "word": "Networks: WMN (Wireless Mesh Network)", "row_number": 1657, "definition": "A communications network made up of radio nodes organized in a mesh topology, where each node communicates with one or more neighbors to relay data across the network.", "details": [{"label": "TROUBLESHOOTING", "value": "Relocate nodes to improve signal relay; ensure the firmware is updated on all nodes; check the mesh controller for node-specific health alerts."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9190461461200534, "y": -0.34630566188624834, "z": -0.18821947255107452, "word": "Networks: WPAN (Wireless Personal Area Network)", "row_number": 1659, "definition": "A small, short-range wireless network used to connect personal devices like smartwatches, headsets, and phones to each other (e.g., Bluetooth, Zigbee).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device is in \u201cpairing mode\u201d; turn Bluetooth off and on; remove and re-add the device profile."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8936436016083551, "y": -0.3820032216377256, "z": -0.23553057543097491, "word": "PAN (Personal Area Networks), WPAN", "row_number": 1726, "definition": "A computer network for interconnecting electronic devices within an individual person's workspace, usually involving short-range wireless technologies (WPAN - Wireless Personal Area Network) like Bluetooth or Zigbee.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for signal interference from other devices on the 2.4 GHz (Gigahertz) frequency; keep devices within the specified operating range; re-pair devices if authentication keys become desynchronized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9188022334149383, "y": -0.3218454937288807, "z": -0.22851243738171967, "word": "Protocols: RDP (Remote Desktop Protocol)", "row_number": 1997, "definition": "A proprietary protocol developed by Microsoft that provides a user with a graphical interface to connect to another computer over a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the target machine has \u201cRemote Desktop\u201d enabled in System Properties, verify that port 3389 is open through any firewalls, and check that the user account has Remote Desktop permissions."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9072802834573522, "y": -0.37510371225657924, "z": -0.1901044247272526, "word": "RDP (Remote Desktop Protocol)", "row_number": 2101, "definition": "A proprietary protocol developed by Microsoft that provides a user with a graphical interface to connect to another computer over a network connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure RDP is enabled on the target host, check firewall rules to allow traffic on port 3389, and ensure the user account has permissions to remote in."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.898496269381875, "y": -0.357401788055471, "z": -0.2548890264440685, "word": "Security: Guest networks", "row_number": 2278, "definition": "An isolated network segment, typically provided via a Wi-Fi access point, that provides internet access to visitors without allowing access to the internal corporate network.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the guest network is on a separate VLAN (Virtual Local Area Network) and verify that the firewall is correctly blocking access from the guest VLAN to the internal network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9234734915617132, "y": -0.328940679506707, "z": -0.19747085797272543, "word": "Security: NFC (Near Field Communication)", "row_number": 2287, "definition": "A set of communication protocols that enables two electronic devices to establish communication by bringing them within close proximity (typically 4 cm or less), often used for contactless payments and authentication.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the NFC (Near Field Communication) feature is enabled in the device \u201cSettings\u201d, remove any thick metal cases that may block the signal, and restart the device to reset the radio hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8950702196613751, "y": -0.38976768451462945, "z": -0.21663437858161422, "word": "SOHO (Small Office/Home Office) networks: Guest networks", "row_number": 2437, "definition": "A separate, isolated wireless network broadcasted by a SOHO router specifically for guests, which provides internet access while preventing users from seeing or accessing the internal corporate or home network.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s wireless security settings, ensure the \u201cGuest Network\u201d option is toggled to \u201cEnabled seasonings\u201d, and verify that the \u201cEnable isolation\u201d or \u201cAP isolation\u201d checkbox is selected to segregate guest traffic from the primary network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9117835158980286, "y": -0.32803280794248374, "z": -0.24707346488443255, "word": "SOHO (Small Office/Home Office) networks: Routers", "row_number": 2443, "definition": "The central networking device in a SOHO environment that connects the internal local network to the internet, performing routing, firewalling, and wireless access functionality.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a hard reset by holding the physical reset button for 10-15 seconds (after backing up settings), check cable connections to the ISP modem, and verify that the WAN (Wide Area Network) port has an active internet connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9159444748937027, "y": -0.3577580350966366, "z": -0.18181008562643883, "word": "Star (hub-and-spoke) topologies", "row_number": 2477, "definition": "A network layout where all nodes are connected individually to a central connection point, such as a switch or a hub, meaning that if one cable fails, only that node is disconnected from the network.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the lights on the central switch, verify that the uplink to the rest of the network is intact, and swap out the suspected faulty cables or switch ports to isolate the break."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8924736004373257, "y": -0.37676043662772724, "z": -0.24807749981512073, "word": "Switches", "row_number": 2525, "definition": "A network device that connects devices on a LAN and uses MAC (Media Access Control) addresses to forward data frames only to the intended destination port.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the switch port status lights, reset the switch, or check for port-level configuration errors (e.g., VLAN - Virtual Local Area Network mismatches)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9232124896185241, "y": -0.3177949037608674, "z": -0.21606734634365155, "word": "Tethering, USB devices", "row_number": 2589, "definition": "The process of sharing a mobile device's cellular data connection with a workstation or laptop using a physical USB (Universal Serial Bus) cable, allowing the host computer to access the internet through the mobile device's network.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the mobile device via a verified data-sync USB (Universal Serial Bus) cable, navigate to \u201cSettings > Network & Internet > Hotspot & tethering\u201d on the device, toggle the \u201cUSB tethering\u201d switch to \u201cOn\u201d, and open the host computer's Device Manager to confirm the mobile broadband network adapter driver is initialized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9013161559791327, "y": -0.3863599672745294, "z": -0.19584474120747875, "word": "Topology diagrams, networks", "row_number": 2636, "definition": "Visual representations (diagrams) showing the physical or logical layout of a network, including the connections between devices like routers, switches, servers, and workstations.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the latest version of the network topology diagram to verify current device placement and connection paths, use the diagram to trace the route from a client to a server, and update the documentation if infrastructure changes have occurred."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9024179910346667, "y": -0.34442163358740036, "z": -0.258873536256495, "word": "USB (Universal Serial Buses): Tethering Devices", "row_number": 2765, "definition": "The network deployment method of using a physical USB data cable link to share a mobile smartphone's cellular data connection directly with a computer workstation or laptop.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the mobile device to the PC (Personal Computer) with a data-capable USB cable. On the mobile phone, navigate to settings, locate \"Tethering & portable hotspot\" (or \"Personal Hotspot\"), toggle \"USB tethering\" to \"Enabled\", and verify that the computer recognizes a new virtual network adapter within its network connections manager."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.9231568846021065, "y": -0.3367160227791428, "z": -0.1854823075539243, "word": "VLAN (Virtual Local Area Network)", "row_number": 2836, "definition": "A logical subnetwork that groups together a collection of network host devices from multiple physical local area network segments into a single isolated broadcast domain via software running on managed network switches.", "details": [{"label": "TROUBLESHOOTING", "value": "Log i
