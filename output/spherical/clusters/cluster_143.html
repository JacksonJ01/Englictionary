<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 143, "radius": 285.0, "nodes": [{"x": -0.1662232891991061, "y": 0.20948263481153157, "z": 0.9635802217979824, "word": "Destruction/disposal: Environmental controls", "row_number": 629, "definition": "Ensuring that chemicals, batteries, and hardware are disposed of according to local environmental regulations (like \u201cWEEE\u201d (Waste Electrical and Electronic Equipment) directives).", "details": [{"label": "TROUBLESHOOTING", "value": "Use certified e-waste recycling centers and follow manufacturer guidelines for battery disposal."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.1518432113669249, "y": 0.20202160530613997, "z": 0.9675385832881859, "word": "Disposal/Destruction: Environmental controls", "row_number": 697, "definition": "Protocols for the safe disposal of electronic equipment containing hazardous materials (e.g., lead, mercury in backlights, lithium batteries) according to local/regional regulations.", "details": [{"label": "TROUBLESHOOTING", "value": "Contact local electronic waste (e-waste) recycling centers and follow hazardous material handling documentation (MSDS - Material Safety Data Sheet) to ensure components are disposed of according to EPA (Environmental Protection Agency) guidelines."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.16054256302065176, "y": 0.22365222449348188, "z": 0.9613562128253383, "word": "Electrical safety: Fire safety", "row_number": 816, "definition": "The deployment of specific fire suppression equipment and operational strategies optimized to extinguish active electrical blazes within IT server infrastructures without escalating physical safety risks.", "details": [{"label": "TROUBLESHOOTING", "value": "Immediately disconnect the primary electrical power source via an Emergency Power Off (EPO) mechanism, activate a specialized Class C rated carbon dioxide or clean-agent fire extinguisher cylinder to suppress the blaze, and avoid using standard water-based fire systems that carry high electrical conductivity risks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1705886847042665, "y": 0.19608338122150498, "z": 0.9656349249377896, "word": "Electrical safety: Laser printers", "row_number": 817, "definition": "Standard protective operational procedures designed to shield users and technicians from severe thermal burns and high-voltage electrical currents produced inside a laser print engine.", "details": [{"label": "TROUBLESHOOTING", "value": "Power down the printing unit completely, disconnect the main AC electrical line, wait a minimum of thirty minutes for the high-temperature fuser component assembly to cool down to safe ambient operational margins, and never touch the highly charged corona wire components with bare hands."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.14067090940687343, "y": 0.2127749870731577, "z": 0.9669221789382333, "word": "Electrical safety: UPS", "row_number": 820, "definition": "Protective guidelines optimized for deploying and managing Uninterruptible Power Supply (UPS) battery systems, which contain severe chemical corrosion risks, high weight loads, and dangerous stored electrical potential.", "details": [{"label": "TROUBLESHOOTING", "value": "Use proper ergonomics when lifting the heavy physical chassis unit, disconnect all attached systems, remove the interior lead-acid battery packs using insulated hand tools, and route the old cells to an approved hazardous recycling facility."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.17734651559444448, "y": 0.2207746817147511, "z": 0.9590655625765425, "word": "Environmental controls: Recycling", "row_number": 864, "definition": "The process of collecting and reprocessing electronic components and materials into raw resources, reducing the environmental impact of decommissioned IT equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Categorize waste into plastics, metals, and circuit boards; verify that the recycling partner is certified (e.g., R2 or e-Stewards certified) to handle toxic materials like lead or cadmium."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.15451834761027847, "y": 0.18725604209576824, "z": 0.9700820867073142, "word": "Fire safety, electrical", "row_number": 973, "definition": "The protocols and equipment, such as CO2 (Carbon Dioxide) or Halon-alternative fire extinguishers, required to suppress fires involving electrical equipment without damaging the hardware or causing electrical shorts.", "details": [{"label": "TROUBLESHOOTING", "value": "Immediately cut power to the affected equipment at the main breaker, use a Class C fire extinguisher (specifically rated for electrical fires), and contact emergency services; do not use water-based extinguishers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.14751411047625398, "y": 0.23130709712344882, "z": 0.9616322654896324, "word": "Heavy objects, lifting", "row_number": 1059, "definition": "Proper physical safety protocol for lifting heavy equipment, such as servers or UPS (Uninterruptible Power Supply) units, to prevent musculoskeletal injuries.", "details": [{"label": "TROUBLESHOOTING", "value": "Always lift with your legs, keeping the back straight and the object close to your body; if an object is too heavy for one person, seek assistance or use a mechanical lifting aid (like a dolly or server lift) to move the item."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.18493927382956518, "y": 0.20040539141711444, "z": 0.9620993421088834, "word": "Lifting heavy objects", "row_number": 1250, "definition": "The physical ergonomics and material safety mechanics mandated when lifting dense, heavy enterprise computer hardware components (such as large multi-battery UPS\u2014Uninterruptible Power Supply units or multi-node server chassis rails) to prevent physical workplace injury.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement corporate safety guidelines requiring the use of hydraulic server lift machinery tools for equipment exceeding fifty pounds, require two-person lift configurations for heavy desktop components, and emphasize proper lifting ergonomics (bending at the knees and maintaining a straight back spine position)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.13422239139027262, "y": 0.1988128332090282, "z": 0.9708026612040553, "word": "Physical safety: Lifting heavy objects", "row_number": 1804, "definition": "Proper physical techniques for moving heavy hardware (like servers or UPS - Uninterruptible Power Supply units) to prevent musculoskeletal injuries.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a team lift for items over 50 pounds, keep the back straight, bend at the knees, hold the weight close to the body, and do not twist the torso while lifting."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.17128084978637292, "y": 0.23582068038841503, "z": 0.9565832306692412, "word": "Physical safety: Safety equipment", "row_number": 1805, "definition": "Protective gear and tools required to perform maintenance safely, including ESD mats, fire extinguishers (Class C for electrical fires), and eye protection.", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly inspect fire extinguishers for valid tags, ensure ESD mats are grounded properly, and verify that all technicians have access to and are trained in the use of necessary PPE (Personal Protective Equipment)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16996213915540398, "y": 0.1802506517140511, "z": 0.9688253577453362, "word": "Recycling, environmental controls", "row_number": 2111, "definition": "The mandatory operational procedure of safely sorting, handling, and dropping off end-of-life technological hardware components to specialized recycling entities in compliance with regulations.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish compliance guidelines; store exhausted batteries in non-conductive safety bins, aggregate monitors for toxic lead removal, and ship to certified processors while cross-referencing SDS sheets."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.13136847248162578, "y": 0.2253370234249085, "z": 0.9653836285704488, "word": "Safety procedures: Fire safety", "row_number": 2205, "definition": "Protocols and equipment required to detect, contain, and extinguish fires in a technical environment, specifically focusing on the use of correct fire extinguisher classes for electrical equipment.", "details": [{"label": "TROUBLESHOOTING", "value": "Never use water on an electrical fire; ensure a Class C or CO2 (Carbon Dioxide) fire extinguisher is readily accessible, and if the fire is uncontrollable, follow the building's emergency evacuation plan immediately."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
