<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 9, "radius": 285.0, "nodes": [{"x": 0.657619645308705, "y": 0.15185694237799313, "z": -0.7378860827767791, "word": "Browsers: Proxies", "row_number": 282, "definition": "Intermediary application settings that route outbound web browser traffic through an internal or external gateway server for filtering, caching, or anonymity.", "details": [{"label": "TROUBLESHOOTING", "value": "Access network settings within browser preferences, verify the proxy IP address configuration and port entries match corporate network specifications, or temporarily toggle off the proxy for direct internet access testing."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6492431883605108, "y": 0.1641029526784537, "z": -0.7426664818676629, "word": "Configuring: Proxy settings", "row_number": 462, "definition": "Setting up a computer to route its internet traffic through an intermediary proxy server, often for security or content filtering.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to 'Settings > Network & Internet > Proxy', disable the proxy if not needed, or update the proxy server address and port to match the network requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6661557928949798, "y": 0.15894759811026596, "z": -0.7286783382586844, "word": "Connectivity: Satellite connectivity", "row_number": 498, "definition": "Internet access provided via a satellite in orbit, used in remote areas where cable or DSL are unavailable.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the satellite dish is clear of obstructions, check alignment, and restart the satellite modem."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6492431540939805, "y": 0.14602536634044944, "z": -0.746431456496333, "word": "Hosts, networked: Load balancing", "row_number": 1073, "definition": "The distribution of network or application traffic across a number of servers to ensure no single server becomes overwhelmed, improving reliability and responsiveness.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the health check configuration in the load balancer settings, ensure all back-end servers are reachable, and check logs to see if traffic is correctly routing to active nodes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6541768776982416, "y": 0.17578859511646738, "z": -0.735629650375757, "word": "Load balancing", "row_number": 1305, "definition": "A network infrastructure architecture technique that distributes incoming network traffic uniformly across an array of backend redundant application servers to prevent any single server node from becoming overloaded.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the load balancer appliance management dashboard interface, verify the status of backend health check parameters, and adjust distribution algorithm rules (such as shifting from round-robin to least-connections) to balances traffic flows."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6678321564485431, "y": 0.1430533851654035, "z": -0.730435445337921, "word": "Networked hosts: Load balancing", "row_number": 1554, "definition": "A method of distributing incoming network traffic across multiple servers to ensure high availability, prevent any single server from becoming overwhelmed, and optimize resource utilization.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the load balancer's health checks are correctly configured to identify non-responsive servers, check the distribution algorithm (e.g., Round Robin or Least Connections) to ensure it aligns with the server cluster\u2019s capacity, and confirm all servers are properly registered in the load balancer pool."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6395110127231683, "y": 0.15962556461951027, "z": -0.7520274886769036, "word": "Networks: Proxy settings, configuring", "row_number": 1616, "definition": "Setting up a middle-man server that processes client requests for Internet resources, providing features like caching, content filtering, and anonymity.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the proxy address and port in the browser or OS settings; ensure the proxy server is reachable; if the proxy is unnecessary, disable the \u201cUse a proxy server\u201d option in the \u201cInternet Properties\u201d menu."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6684964084274911, "y": 0.17191042849009427, "z": -0.7235740159070785, "word": "Proxies, browser security", "row_number": 2007, "definition": "A configuration setting within a web browser that routes internet traffic through a proxy server to act as an intermediary, providing anonymity, content filtering, or improved security by hiding the client's actual IP address.", "details": [{"label": "TROUBLESHOOTING", "value": "Navigate to the browser's 'Settings' or 'Internet Options' (accessed via 'inetcpl.cpl'), check the 'Connections > LAN Settings' for proxy configuration, and disable 'Use a proxy server for your LAN' if not specifically required by the network environment."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6553360883383018, "y": 0.13332385569307956, "z": -0.7434778818664239, "word": "Proxy servers", "row_number": 2008, "definition": "A dedicated server application or appliance that acts as a gateway between a local network and the internet, performing functions such as caching, filtering requests, and providing an additional layer of security.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the proxy server service is running, check the network gateway settings on client devices to ensure they are pointing to the correct proxy IP address, and examine proxy logs to identify blocked requests or authentication failures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6429810675647823, "y": 0.17982292731617555, "z": -0.7444723376759504, "word": "Proxy settings, configuring", "row_number": 2009, "definition": "The administrative task of entering the IP address, port, and authentication credentials required for a network client to connect to a designated proxy server.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the correct protocol (HTTP/HTTPS) and port are configured; if using an automated script, verify the 'Automatic configuration script' URL is accessible and valid."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6768416710309121, "y": 0.15058218378916244, "z": -0.7205625290572426, "word": "Reverse proxies", "row_number": 2173, "definition": "An edge network computing server appliance positioned ahead of internal web servers that intercepts inbound public internet client traffic, providing server-side caching, load balancing, SSL (Secure Sockets Layer) decryption, and an added layer of obfuscation for internal network architectures.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the reverse proxy terminal interface, check the service daemon state using the instruction \u201csystemctl status nginx\u201d or an equivalent process command, inspect the configuration files to ensure the backend web server IP (Internet Protocol) pool addresses are typed accurately, and test target availability using the command \u201cping\u201d against the internal hosting cluster."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6379891741151283, "y": 0.144414527404682, "z": -0.7563823490711419, "word": "Satellite connectivity", "row_number": 2220, "definition": "A method of providing internet access using an orbital satellite, useful for remote or rural locations where cable or fiber infrastructure is unavailable.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the satellite dish is clear of debris (snow, leaves), verify the alignment of the dish with the provider's satellite coordinates, and power-cycle the satellite modem."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6606962966953384, "y": 0.18593823971658255, "z": -0.7272601835273014, "word": "Servers: Proxy servers", "row_number": 2327, "definition": "A server that acts as an intermediary for requests from clients seeking resources from other servers, often used for caching and content filtering.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify browser proxy settings in \u201cInternet Options > Connections > LAN settings\u201d, and ensure the proxy server is reachable via the network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6679721568874617, "y": 0.1288426550583825, "z": -0.7329479980603119, "word": "Servers: Reverse proxies", "row_number": 2329, "definition": "A type of proxy server that sits in front of web servers and forwards client requests to those web servers, often used for load balancing and SSL (Secure Sockets Layer) termination.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the connectivity between the reverse proxy and the backend web servers, verify that the backend services are running, and inspect the proxy\u2019s error logs for misconfigured forwarding rules."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6322148385637589, "y": 0.17139636523429028, "z": -0.7555975674155352, "word": "Web browsers: Proxies", "row_number": 2889, "definition": "A network intermediary configuration rule applied to a web browser that routes all outbound HTTP (HyperText Transfer Protocol) and HTTPS (HyperText Transfer Protocol Secure) web requests through a designated intermediary proxy server to filter content, trace data, or mask internal IP layouts.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Windows Control Panel, select \"Internet Options\", navigate over to the \"Connections\" tab, and click the \"LAN settings\" button. Inspect the checkbox setting under \"Proxy server\"; if it is checked erroneously for a basic home network connection, uncheck \"Use a proxy server for your LAN\", toggle on \"Automatically detect settings\", click \"OK\", and refresh the web browser application."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6789209894626695, "y": 0.1677193434100256, "z": -0.7147982316102492, "word": "Web servers", "row_number": 2896, "definition": "A dedicated physical computer system or specialized software daemon (such as Apache HTTP Server, Microsoft Internet Information Services [IIS], or Nginx) running over port 80 or 443 that hosts web assets and delivers web pages to client devices upon request.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect to the web host administrative console terminal. Verify that the core web daemon service is active; if it is stopped, execute the command \u201cnet start w3svc\u201d (for IIS environments) or \u201csudo systemctl restart apache2\u201d (for Linux hosts). Review the site binding port configurations, confirm the firewall allows port 80 and 443 connections, and check the index file permissions."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
