<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 109, "radius": 285.0, "nodes": [{"x": -0.6076506351503544, "y": 0.6971287000976094, "z": 0.3804895282416955, "word": "Analyzing: Risk, change management", "row_number": 111, "definition": "A crucial evaluation phase within the formal IT change management workflow. Before any major network configuration or hardware modification is approved, the change advisory board (CAB) analyzes potential risks, maps out dependencies, and reviews a detailed rollback plan to ensure business continuity if the modification fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Complete a formal Change Request form detailing the scope of the change; perform a thorough risk assessment to identify potential side effects; create a detailed, step-by-step fallback or rollback procedure; schedule the change execution during a designated off-peak maintenance window."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6198138813101866, "y": 0.6899556099816742, "z": 0.3738876954247331, "word": "Backout plans", "row_number": 200, "definition": "A mandatory step in the organizational change management workflow process that details explicit technical operations required to revert a system to its original state if a newly deployed modification fails or causes a critical infrastructure breakdown.", "details": [{"label": "TROUBLESHOOTING", "value": "Before deploying any production modification, document a step-by-step reversal sequence, preserve recent system configuration snapshots, and maintain verified system backups to allow the engineering team to run the reversal procedures immediately if an update fails."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6078604844680577, "y": 0.6899668153999198, "z": 0.39300308531759776, "word": "Best practices: Change management", "row_number": 227, "definition": "A formal corporate governance process framework used to evaluate, authorize, test, document, and execute major infrastructure modifications across an enterprise environment to reduce risk and prevent service outages.", "details": [{"label": "TROUBLESHOOTING", "value": "Mandate that all infrastructure modifications be submitted as a formal Change Request (CR) to a Change Advisory Board (CAB); ensure each request includes a defined scope of work, risk analysis, testing log, and an actionable backout plan before execution."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6080206821914483, "y": 0.7031543037016368, "z": 0.3686256572911227, "word": "Change management", "row_number": 340, "definition": "A structured approach to transitioning individuals, teams, and organizations from a current state to a desired future state to ensure changes are implemented safely.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the formal change process: document the requested change, perform risk analysis, create a \"Rollback plan\", obtain approval from the change board, and communicate with stakeholders."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6248011456292483, "y": 0.680181669894903, "z": 0.3833750439965547, "word": "Documentation: Business practices", "row_number": 740, "definition": "Standardized methodologies and workflows used by an organization to ensure operational efficiency, consistency, and alignment with corporate goals.", "details": [{"label": "TROUBLESHOOTING", "value": "Review existing documentation against current organizational goals, audit performance metrics, and implement refined procedural updates."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5966027433723513, "y": 0.7011570435272825, "z": 0.39044073418723185, "word": "Documentation: Change control forms", "row_number": 741, "definition": "Standardized documents used to formally request, review, and approve modifications to a production environment to prevent unauthorized or disruptive changes.", "details": [{"label": "TROUBLESHOOTING", "value": "Halt the unauthorized change, review the change management board logs, and retroactively complete the formal documentation process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6216877455829981, "y": 0.695216124771023, "z": 0.3608031136926216, "word": "Documentation: Change management", "row_number": 742, "definition": "A systematic approach to managing all changes made to an IT infrastructure, ensuring that changes are implemented with minimal disruption to services.", "details": [{"label": "TROUBLESHOOTING", "value": "Establish a Change Advisory Board (CAB), implement standardized request procedures, and document all outcomes of the change."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.614929117125795, "y": 0.6797577706952759, "z": 0.399739357694835, "word": "Documentation: Change request forms", "row_number": 743, "definition": "A specific subset of change management documentation where an engineer formally details the scope, risk, and impact of a proposed change.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure all fields are filled, including backout plan (rollback plan) and justification, before submitting to the manager or CAB for approval."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5965325537418489, "y": 0.7109543058780515, "z": 0.37241493965694505, "word": "DRP (Disaster Recovery Plans)", "row_number": 793, "definition": "A comprehensive, documented operational roadmap specifying exact policy steps, backup restorative strategies, and personnel responsibilities required to recover an enterprise's IT infrastructure following a major catastrophic event.", "details": [{"label": "TROUBLESHOOTING", "value": "Activate the documented emergency chain of command, spin up backup computer operations at predefined alternate target sites, restore verified data from off-site secure storage backups, and continually execute plan tests to maintain readiness."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6329406599191105, "y": 0.6795178829977534, "z": 0.3710007651035404, "word": "End-user acceptance, change management", "row_number": 852, "definition": "The process of verifying that the users affected by a change (e.g., a software update or process migration) have tested and approved the change before it is finalized in production.", "details": [{"label": "TROUBLESHOOTING", "value": "Involve key end-users in the User Acceptance Testing (UAT) phase of the change management process. Collect feedback, address concerns, and document acceptance before deploying to the full organization."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5967632608116578, "y": 0.693462982495691, "z": 0.4037111621612886, "word": "Managing: change", "row_number": 1414, "definition": "A structured management framework used to evaluate, authorize, coordinate, document, and review modifications within an information technology infrastructure to minimize service disruptions.", "details": [{"label": "TROUBLESHOOTING", "value": "Document the proposed change, outline a comprehensive risk assessment map alongside a step-by-step fallback recovery script, submit the documentation to the Change Advisory Board (CAB) for review, execute the modification within an authorized maintenance window, and record the final implementation results in the team's historical tracking logs."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.612432845826505, "y": 0.7065410650145028, "z": 0.35457824637309693, "word": "Purpose of change, change management", "row_number": 2050, "definition": "A documented requirement in a formal Change Management process that explains why a change is necessary, what its goals are, and the business justification.", "details": [{"label": "TROUBLESHOOTING", "value": "Clearly articulate the business need, the expected benefit, and any risks involved; provide a rollback plan in case the change causes unforeseen issues."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6278315253134494, "y": 0.671008147633564, "z": 0.3944307818007628, "word": "Risk analysis, change management", "row_number": 2179, "definition": "A structured administrative step within a formal corporate Change Management protocol that systematically calculates the prospective liabilities, operational downtime risks, and dependencies associated with executing a technical system modification.", "details": [{"label": "TROUBLESHOOTING", "value": "Prior to executing any system adjustments, present a comprehensive risk ledger report to the CAB (Change Advisory Board); identify impacted dependencies, assign a numeric threat tier score (e.g., Low, Medium, High) to the task, document an explicit fallback recovery scenario, and schedule implementation hours strictly inside non-peak maintenance windows."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.5870605825017287, "y": 0.711274495286896, "z": 0.3865856500532611, "word": "Rollback plans", "row_number": 2186, "definition": "A primary component of a comprehensive Change Management policy that details an explicit, step-by-step technical recovery procedure to reverse a system modification and restore the environment to its last-known stable configuration if an upgrade fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Before starting any maintenance window operations, document your rollback procedures; confirm that a valid bare-metal backup or VM configuration snapshot is saved to secure media, document instructions to restore configuration files to their original paths, and verify that the restoration media is functional and ready for deployment."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6327763922553076, "y": 0.6879058678194853, "z": 0.35549902169187153, "word": "Scope of change, change management", "row_number": 2223, "definition": "A documented description of the extent, boundaries, and impact of a proposed technical change, intended to prevent 'scope creep' and ensure all stakeholders understand what is being modified.", "details": [{"label": "TROUBLESHOOTING", "value": "Create a clear 'Change Request' form that details the specific systems affected, the potential risks, the required downtime, and the exact steps to be performed, and have it approved by the CAB (Change Advisory Board)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6066733126107651, "y": 0.6802477778606727, "z": 0.41135198125388683, "word": "Staff member responsibilities, change management", "row_number": 2474, "definition": "Defined roles in a change management process, such as the change requester, the change advisory board, and the implementer, all of which are necessary to manage, approve, and track modifications to the environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the organization\u2019s change management policy, ensure that every staff member clearly understands their assigned role, and document all changes in a central database or ticket management system."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
