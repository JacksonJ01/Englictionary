<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 113, "radius": 285.0, "nodes": [{"x": -0.31974846250365496, "y": -0.9208466258943725, "z": -0 fragmented; they use the \u201cTRIM\u201d command instead."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.2966647852821466, "y": -0.9293039236187624, "z": -0.21996413962341987, "word": "Disk Management: Optimizing drives", "row_number": 727, "definition": "A maintenance process that runs either \u201cdefrag\u201d on HDDs or the \u201cTRIM\u201d command on SSDs to maintain peak storage performance and drive longevity.", "details": [{"label": "TROUBLESHOOTING", "value": "Search for \u201cDefragment and Optimize Drives\u201d, verify the status of your drives, and click \u201cOptimize\u201d. Windows typically schedules this task automatically, but it can be triggered manually."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.33106388809496606, "y": -0.9194073193098874, "z": -0.2123367212680144, "word": "Drives: Defragmenting", "row_number": 775, "definition": "A file system maintenance process that reorganizes fragmented clusters of data on a mechanical hard drive into contiguous sectors, thereby accelerating drive head movement and boosting system read performance.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the optimization terminal interface by executing the command dfrgui.exe, choose the appropriate target hard drive partition, and click the option labeled Optimize to consolidate scattered storage fragments."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.30672798055144773, "y": -0.9199352732795398, "z": -0.2442069592024948, "word": "Drives: Optimizing", "row_number": 786, "definition": "Administrative storage maintenance tasks that include running standard defragmentation loops on spinning hard disk platters or issuing the TRIM command set to Solid-State Drives (SSDs) to wipe unlinked blocks and sustain write efficiency.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command dfrgui.exe to open Optimize Drives, choose the target solid-state drive instance, and click Optimize to send the TRIM instruction block down to clear residual stale garbage data blocks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3048103255195623, "y": -0.9306838333319897, "z": -0.20228264342531174, "word": "File system commands: Defrag command", "row_number": 927, "definition": "The \u201cdefrag\u201d command optimizes a mechanical hard drive by rearranging fragmented data into contiguous blocks, improving read/write speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \u201cdefrag [drive_letter]: /O\u201d to optimize the drive. Note: Do not run this on SSDs (Solid-State Drives), as it causes unnecessary wear."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.33592079039568273, "y": -0.9129563222921092, "z": -0.23166349770044983, "word": "Hard drives: Defragmenting", "row_number": 1025, "definition": "An optimization process that rearranges fragmented data blocks on magnetic hard drives to be contiguous, thereby reducing the physical movement required by the read/write head and improving retrieval speeds.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the \u201cDefragment and Optimize Drives\u201d utility, analyze the volume to check for fragmentation levels, and click \u201cOptimize\u201d to consolidate the files; note: never defragment an SSD, as it provides no performance benefit and causes unnecessary wear."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.28930707830148905, "y": -0.9284056832943551, "z": -0.23316153557436828, "word": "Hard drives: Optimizing", "row_number": 1035, "definition": "A maintenance task that helps a drive perform more efficiently; for HDDs, this means defragmentation; for SSDs, this means the \u201cTRIM\u201d command, which helps the drive manage free space.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDefragment and Optimize Drives\u201d, verify the system correctly identifies the drive type (HDD vs SSD), and run the optimization tool to ensure the operating system is performing the correct housekeeping tasks (Defrag for HDD, TRIM for SSD)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.32702190802283987, "y": -0.924054934413971, "z": -0.19793723716949482, "word": "Maintenance: storage drives", "row_number": 1393, "definition": "Performing preventative operations on storage drives\u2014such as running optimization passes (TRIM commands) on Solid-State Drives (SSDs) or defragmenting Hard Disk Drives (HDDs)\u2014to maintain quick file access and long-term hardware reliability.", "details": [{"label": "TROUBLESHOOTING", "value": "For traditional mechanical hard drives, open a command prompt with administrative privileges and execute the command \u201cchkdsk C: /f /r\u201d to identify, isolate, and repair soft logical drive errors and mark bad physical sectors. For solid-state drives, run the Windows \"Optimize\" command to issue TRIM instructions, which clears out deleted file blocks and keeps write speeds fast."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.32013028420863215, "y": -0.9135768563311346, "z": -0.25078661987558587, "word": "Optimizing drives", "row_number": 1695, "definition": "A maintenance task for HDDs to rearrange fragmented data to improve access times, or for SSDs (Solid State Drives) to send a TRIM command to manage data blocks.", "details": [{"label": "TROUBLESHOOTING", "value": "Open \u201cDefragment and Optimize Drives\u201d; select the target drive and click \u201cOptimize\u201d; ensure the OS is correctly identifying the drive type (do not defrag an SSD)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.28938882332320426, "y": -0.9343668608705171, "z": -0.20787659378243334, "word": "Partitioning commands: Defrag command", "row_number": 1740, "definition": "A command-line utility (\"defrag\") that reorganizes fragmented files on a mechanical HDD (Hard Disk Drive) to improve access speed.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a Command Prompt as Administrator; run \"defrag c: /u /v\" to defragment the drive and see verbose output. Note: Do not run this on an SSD (Solid State Drive)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.3440563288762728, "y": -0.9136966934424172, "z": -0.21629515702524524, "word": "Preventive measures: Storage drives", "row_number": 1917, "definition": "Regular maintenance routines to prolong the life and health of storage devices, such as HDDs (Hard Disk Drives) and SSDs (Solid State Drives).", "details": [{"label": "TROUBLESHOOTING", "value": "Schedule regular disk checks using \u201cchkdsk\u201d for HDDs, monitor drive health with manufacturer-provided utilities, ensure adequate cooling, and perform regular backups to protect data."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2935088517532193, "y": -0.9227623313552324, "z": -0.249724315544888, "word": "Storage drives: Maintenance", "row_number": 2497, "definition": "Routine operations such as disk cleanup, defragmentation, and firmware updates performed to ensure the longevity and performance of storage hardware.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the \u201cDisk Cleanup\u201d utility to remove temporary files, use the \u201cDefragment and Optimize Drives\u201d tool to reorganize files (for HDD only, never defrag an SSD), and verify that the OS has enough free space for system operations."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
