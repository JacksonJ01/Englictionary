<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 147, "radius": 285.0, "nodes": [{"x": -0.16374953565264028, "y": 0.5156529732143306, "z": -0. E 2"}]}, {"x": -0.18656192659317064, "y": 0.5107711868434069, "z": -0.8392302677075116, "word": "Chrome OS: Downloading", "row_number": 353, "definition": "The process of retrieving files or applications from the internet onto a Chrome OS device, often managed through the Chrome Web Store or Google Play Store.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear the browser cache, ensure adequate local storage space, or check for restricted network settings or firewall rules preventing external downloads."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.15645122265762917, "y": 0.5272057370386425, "z": -0.8352108271343677, "word": "Chromium: Downloading", "row_number": 355, "definition": "The process of downloading the open-source browser project that serves as the foundation for Google Chrome and other web browsers.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the source URL is legitimate, ensure the local system meets all dependencies, and use the 'sudo apt install' command on Linux-based distributions to resolve package requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.16912477845684296, "y": 0.49568004442252783, "z": -0.8518791597833607, "word": "Downloading browsers", "row_number": 767, "definition": "The process of obtaining web browser installers (e.g., Chrome, Firefox, Edge) from official manufacturer websites.", "details": [{"label": "TROUBLESHOOTING", "value": "Always navigate directly to the manufacturer's verified domain (e.g., google.com/chrome) and verify digital signatures of the installer file before running."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.18453008152790715, "y": 0.5265182583195739, "z": -0.8298958806184222, "word": "Edge (MS)", "row_number": 809, "definition": "Microsoft Edge is a cross-platform proprietary web browser built on the open-source Chromium rendering engine, deeply integrated into the Windows ecosystem to handle web applications and hypermedia files.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Run diagnostic prompt, execute the instruction msedge.exe to attempt initialization, navigate into system settings to trigger a browser repair operation, or reinstall the foundational package dependencies to re-establish workspace standard performance."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.14551845939971683, "y": 0.5141586745067381, "z": -0.8452604541816724, "word": "Firefox: Downloading", "row_number": 974, "definition": "The process of retrieving the Mozilla Firefox web browser installation binary from the official website and executing it to install the application.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure you are downloading the file directly from \u201cmozilla.org\u201d, clear the browser cache or try a different network connection if the download hangs, and check that the OS has sufficient disk space for the installation."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.18914341177733585, "y": 0.4984713917190508, "z": -0.8460207098049679, "word": "HTTP (Hypertext Transfer Protocol)", "row_number": 1080, "definition": "An application-layer protocol used for transmitting hypermedia documents, such as HTML (HyperText Markup Language), over the web; it is the foundation of data communication for the World Wide Web.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the web server is running, check the network connection, and ensure that the URL is typed correctly; if testing locally, use a browser tool to inspect the server response headers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.16485180180451986, "y": 0.5366476519780071, "z": -0.8275464827236566, "word": "Installing: Browsers", "row_number": 1139, "definition": "The tactical download and system implementation of internet navigation clients (such as Google Chrome, Mozilla Firefox, or Microsoft Edge) to coordinate web content queries.", "details": [{"label": "TROUBLESHOOTING", "value": "Clear out conflicting outdated software files, confirm the installation binary matches the destination architecture (e.g., x64), and run the configuration script file container."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.15419961810248975, "y": 0.4948223190842977, "z": -0.855203689370599, "word": "Microsoft Edge: Downloading", "row_number": 1452, "definition": "The process of retrieving and installing the Microsoft Edge web browser from official Microsoft servers.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure an active internet connection; check that browser security settings aren't blocking the download; if the download is blocked by corporate policy, contact the IT department; use the official Microsoft website to avoid malicious mirrors."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.19721442851726725, "y": 0.5174080243231501, "z": -0.8327036721130886, "word": "Opera, downloading", "row_number": 1691, "definition": "A web browser that can be installed on various platforms; downloading involves fetching the installer from the official website.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the download URL is from \u201copera.com\u201d; check browser \u201cDownloads\u201d history for partial files; if blocked, check \u201cGroup Policy\u201d settings for software installation restrictions."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.14270423619813088, "y": 0.5281267454812038, "z": -0.8370887896027158, "word": "Plug-ins, browsers", "row_number": 1838, "definition": "Software components that add specific features to a web browser, such as PDF viewers or legacy media players (like Flash).", "details": [{"label": "TROUBLESHOOTING", "value": "Disable or uninstall unused or outdated plug-ins, clear the browser cache, or switch to a browser that natively supports the required functionality without third-party plug-ins."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.179688377507993, "y": 0.48725241526639756, "z": -0.854574262896799, "word": "Protocols: HTTP (HyperText Transfer Protocol)", "row_number": 1991, "definition": "The foundational protocol of the World Wide Web, used for transmitting hypermedia documents like HTML.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the web server service is running, check if the website is accessible via a different device to rule out local network issues, and clear the browser cache."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.18174030682061204, "y": 0.5380990057735299, "z": -0.823055235608333, "word": "Web browsers", "row_number": 2877, "definition": "A client-side software application framework\u2014such as Google Chrome, Microsoft Edge, or Mozilla Firefox\u2014engineered to locate, retrieve, interpret, and render HyperText Markup Language (HTML) documents, cascading style sheets, and web assets hosted on internet-facing web servers.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the system's physical network adapter link is active. If pages refuse to display but the network connection is functional, launch the software configurations, verify that the application has not been constrained by local software firewalls, or run a browser repair loop to resolve corrupted core binaries."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.1390540725411124, "y": 0.5042569430508168, "z": -0.8522845183944011, "word": "Web browsers: Extensions", "row_number": 2881, "definition": "Modular software components or mini-programs installed into a web browser to expand its functional utility, add features, or customize user interfaces (such as deploying an ad blocker or specialized developer tool).", "details": [{"label": "TROUBLESHOOTING", "value": "Access the application's add-on workspace panel by entering the internal control string command \u201cchrome://extensions\u201d or \u201cedge://extensions\u201d into the primary address path bar. Toggle individual extensions to \"Disabled\" one by one to find the faulty add-on, click the \"Remove\" option to erase unstable or unverified software components from the profile context, and verify that browser performance returns to baseline levels."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.20176005428790264, "y": 0.5015251182665091, "z": -0.8412879627342272, "word": "Web browsers: Plug-ins", "row_number": 2887, "definition": "Secondary software executables (such as legacy Adobe Flash or Java applets) designed to integrate into web browsers to let the application engine process specific interactive multimedia files or legacy container workflows.", "details": [{"label": "TROUBLESHOOTING", "value": "Open browser settings and look at the permissions list or plug-in panel. Update out-of-date components to their newest architecture builds, or transition to modern browser software environments that leverage native HTML5 (HyperText Markup Language version 5) rendering capabilities instead of vulnerable external plug-ins."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
