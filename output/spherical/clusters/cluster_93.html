<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 93, "radius": 285.0, "nodes": [{"x": -0.4612149972502652, "y": 0.8467690657825635, "z": 0.26507145365950446, "word": "Analyzing: Detection/analysis phase, incident response", "row_number": 110, "definition": "The critical second phase of the official security incident response lifecycle. Security teams analyze log files, alerts, and system anomalies to confirm that a security breach or incident is actually occurring, determine its scope, and identify the specific type of attack method used.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate and review system logs from firewalls, SIEM (Security Information and Event Management) platforms, and endpoint protection software; capture network traffic samples to verify attack patterns; document all findings carefully before moving to Step 3 (Containment) of the incident response plan."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.47552719167292046, "y": 0.841166643579359, "z": 0.2575122671041155, "word": "Containment/eradication/recovery phase, incident response", "row_number": 527, "definition": "Stages of an IR (Incident Response) plan: Containment stops the spread of an attack, Eradication removes the threat, and Recovery restores the system to a clean state.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established IR policy: physically disconnect infected machines, change compromised credentials, re-image systems from known-good backups, and run anti-malware scans to ensure the threat is gone."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46396869310134903, "y": 0.840630478771044, "z": 0.27941626649676593, "word": "Documentation: DRP (Disaster Recovery Plan)", "row_number": 747, "definition": "A detailed document outlining the steps to be taken in the event of a catastrophic failure (fire, flood, cyber-attack) to restore business operations.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct regular DRP testing and drills, ensure backups are verified, and keep contact lists updated."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.45938804036658243, "y": 0.851888567536375, "z": 0.2514925383962206, "word": "Documentation: Incident response", "row_number": 750, "definition": "The organized approach to addressing and managing the aftermath of a security breach or cyberattack.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the documented plan: Identify, Contain, Eradicate, Recover, Lessons Learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.48382330001816654, "y": 0.8329942774138335, "z": 0.26839438920241343, "word": "Incident response", "row_number": 1115, "definition": "The organized approach to addressing and managing the aftermath of a security breach or cyberattack to limit damage and reduce recovery time.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established incident response plan (IRP), starting with identification, followed by containment, eradication, and finally, recovery and lessons learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.44905896081420305, "y": 0.8496455119500067, "z": 0.27649331589692927, "word": "Incident response: Containment/eradication/recovery phase", "row_number": 1117, "definition": "The stages of an incident where the threat is isolated (containment), the root cause is removed (eradication), and systems are restored to a known good state (recovery).", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect affected systems from the network, wipe and re-image the hardware, change all compromised credentials, and monitor traffic closely to ensure the attacker is gone."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4754102414895691, "y": 0.845669838594367, "z": 0.24254407100279152, "word": "Incident response: Lifecycle of", "row_number": 1121, "definition": "The systematic, repeatable phases of an incident response process: Preparation, Detection/Analysis, Containment/Eradication/Recovery, and Post-Incident Activity.", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly review and update the incident response lifecycle documentation, conduct tabletop exercises, and ensure all staff are trained on their roles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.47441491081077, "y": 0.832149554211295, "z": 0.2871543345073375, "word": "Planning: DRP (Disaster Recovery Plan)", "row_number": 1834, "definition": "A formal, documented set of procedures that explains how an organization will quickly resume work after an unplanned incident (e.g., fire, flood, cyber-attack).", "details": [{"label": "TROUBLESHOOTING", "value": "Regularly test the DRP with mock disaster simulations, ensure backups are off-site, and confirm that all staff know their roles in the event of a declared disaster."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.44545520112868275, "y": 0.8579671363741632, "z": 0.25585553871144295, "word": "Preparation phase, incident response", "row_number": 1908, "definition": "The initial stage of the incident response lifecycle where organizations establish tools, policies, and procedures to effectively identify and manage potential security threats.", "details": [{"label": "TROUBLESHOOTING", "value": "Develop a clear Incident Response Plan (IRP), conduct regular team training and tabletop exercises, and ensure all critical systems have centralized logging enabled and monitored by a SIEM (Security Information and Event Management) system."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4918814906776234, "y": 0.8327152614763076, "z": 0.25423983250703236, "word": "Recovery: Containment/eradication/recovery phase, incident response", "row_number": 2105, "definition": "The combined core middle-to-late timeline steps of a formal Incident Response (IR) plan where security administrators limit the blast radius of a threat, remove malicious elements, and safely restore production systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the affected subnet via VLAN assignment, use enterprise anti-malware tools to eliminate malicious files or rebuild systems from pristine images, and implement continuous behavioral monitoring."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.4519316543660788, "y": 0.8430060037338512, "z": 0.29171674180722135, "word": "Responding to incidents", "row_number": 2158, "definition": "A structured organizational approach to handling cybersecurity breaches, natural disasters, or critical system outages, ensuring that actions taken during the crisis are consistent, legal, and effective.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the established IR (Incident Response) plan: preparation, identification, containment, eradication, recovery, and lessons learned."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.46237065054492726, "y": 0.854858808743905, "z": 0.23543533852761472, "word": "Responding to incidents: Containment/eradication/recovery phase", "row_number": 2160, "definition": "The tactical middle phase of incident response focused on stopping the spread of an attack (containment), removing the malicious components (eradication), and returning the affected systems to service (recovery).", "details": [{"label": "TROUBLESHOOTING", "value": "Sever network connectivity to infected hosts, run deep anti-malware scans to delete malicious files, and restore systems from clean backups once the root cause is verified to be gone."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
