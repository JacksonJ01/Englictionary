1464563435364, "word": "Backlights", "row_number": 199, "definition": "A physical hardware illumination component located behind or along the edges of a Liquid Crystal Display (LCD) screen panel that provides the structural light source necessary to make visual images visible to the human eye.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect an external monitor to the video port to verify whether the graphics processing hardware is functional; if external video works, inspect the internal display panel assembly to replace a faulty high-voltage inverter board or a blown Light-Emitting Diode (LED) backlight harness strip."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.39203833217896833, "y": -0.5048753456790918, "z": 0.7690297987904958, "word": "CRT (Cathode-Ray Tube) monitors, electrical safety", "row_number": 585, "definition": "Legacy display technology that uses electron guns to illuminate a phosphor-coated screen; these units contain high-voltage capacitors that can hold a charge long after the power is unplugged.", "details": [{"label": "TROUBLESHOOTING", "value": "Never open a CRT monitor casing unless you have been trained in high-voltage safety; if the monitor is faulty, it is recommended to recycle the entire unit safely."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.37679591018811487, "y": -0.4982294020160784, "z": 0.7808919931925355, "word": "Displays: Backlights", "row_number": 681, "definition": "The light source located behind or at the side of an LCD (Liquid Crystal Display) panel that illuminates the pixels to make the image visible.", "details": [{"label": "TROUBLESHOOTING", "value": "If the backlight has failed, the entire panel or the inverter board usually requires replacement. For modern LED (Light Emitting Diode) displays, this typically requires a full display assembly replacement."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3817272088452206, "y": -0.5176299632336018, "z": 0.7657307354351248, "word": "Displays: Inver g properties of liquid crystals packed between polarized glass layers, requiring a dedicated external illumination background source (such as CCFL\u2014Cold Cathode Fluorescent Lamps or modern LED arrays) to emit visible output colors.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical monitor line configurations, check that the resolution properties match the panel's native pixel layout parameters inside the OS display panel, and replace defective backing hardware elements if backlight components fail."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.409813337267145, "y": -0.4860408166198792, "z": 0.7718920605741753, "word": "LED (Light-Emitting-Diode): Displays", "row_number": 1236, "definition": "An advanced flat-panel display variant that utilizes a standard LCD matrix panel layout but substitutes legacy CCFL backlights with highly efficient, long-lasting LED semiconductor light sources arranged in edge-lit or direct-lit backlight configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for hardware graphics driver updates, adjust the operating system refresh rate variables within advanced system display properties, and replace internal backlight strips if individual controller components fail."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.35321887324829526, "y": -0.5047017224061374, "z": 0.7877262208289646, "word": "Memory: SODIMM", "row_number": 1441, "definition": "A smaller version of the standard DIMM used primarily in laptops, mini-PCs, and printers due to their compact size.", "details": [{"label": "TROUBLESHOOTING", "value": "Power off the device and remove the battery/unplug the power source; open the chassis carefully; remove the SODIMM module and clean the gold contacts with a lint-free cloth or contact cleaner; reinstall the module ensuring the locking clips click into place; and check the system BIOS to confirm the memory is recognized."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.40054317098536923, "y": -0.5251033085955561, "z": 0.7508872641608628, "word": "Replacing: Backlights", "row_number": 2138, "definition": "The physical hardware repair process of exchanging a defective CCFL or LED assembly within a laptop display panel to restore visibility.", "details": [{"label": "TROUBLESHOOTING", "value": "Remove battery, pry off bezel, locate low-voltage backlight line, swap out the bulb or LED ribbon, and reconnect display lines."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.38853542800478585, "y": -0.474502514759742, "z": 0.7898655484775992, "word": "TN displays", "row_number": 2622, "definition": "A legacy Liquid Crystal Display (LCD) panel hardware manufacturing standard characterized by fast pixel response times and low production costs, but severely restricted by poor color replication accuracy and very narrow optimal horizontal/vertical viewing angles.", "details": [{"label": "TROUBLESHOOTING", "value": "Adjust the physical articulation neck tilt mount parameters of the monitor stand frame to orient the screen face directly perpendicular to the user's line of sight; replace the hardware panel with an IPS (In-Plane Switching) display if color precision or wide angle visibility matrices are core operational workplace requirements."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3568916570534067, "y": -0.5294817516148425, "z": 0.7695956209806237, "word": "VA (Vertical Alignment) displays", "row_number": 2797, "definition": "A liquid crystal display (LCD) panel technology designed to provide superior native contrast ratios and deep black levels compared to In-Plane Switching (IPS) or Twisted Nematic (TN) panels by aligning the liquid crystals vertically to block background illumination when uncharged.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the monitor's built-in On-Screen Display (OSD) settings menu, locate the overdrive or response time calibration toggle, adjust it to a moderate performance tier to minimize trailing without causing overshoot artifacts, and ensure the operating system refresh rate matches the panel hardware specification under \"Display settings\"."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
