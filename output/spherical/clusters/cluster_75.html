11465073290998, "word": "Airplane mode", "row_number": 103, "definition": "A mobile operating system toggle setting that instantly disables all wireless transmission radios built into a device, including cellular voice/data connections, Wi-Fi network cards, Bluetooth transmitters, and GPS (Global Positioning System) location tracking chips.", "details": [{"label": "TROUBLESHOOTING", "value": "Swipe down to open the mobile device notification pane or quick settings menu; look for the illuminated airplane icon and tap it once to turn off Airplane Mode; wait a few seconds for the device radios to reconnect to local cellular towers and Wi-Fi networks."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.35783349155125593, "y": 0.9273586606908418, "z": -0.10936684491163329, "word": "Applications: MAM", "row_number": 139, "definition": "Mobile Application Management (MAM). A security management strategy where corporate IT administrators secure and manage specific enterprise software applications and data containers on mobile devices, rather than managing the user's entire physical phone. This approach is highly useful for Bring Your Own Device (BYOD) deployment models.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the organization's Mobile Device Management (MDM) portal (such as Microsoft Intune); adjust the MAM security policy definitions to configure application sandboxing rules; issue a selective remote wipe command to delete only the corporate data container while leaving the user's personal photos and apps intact."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3658779148526535, "y": 0.9261835243854296, "z": -0.09119994835557045, "word": "Automobile synchronization", "row_number": 196, "definition": "The mobile device integration process where a smartphone links its data profiles (including contact lists, text messages, map navigation data, and music libraries) to a vehicle's dashboard media center via wireless Bluetooth connections or wired protocol t policies out from the master controller dashboard portal."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3438907709780694, "y": 0.9323090319756072, "z": -0.11197770551683592, "word": "Managing: EMM (Enterprise Mobility Management)", "row_number": 1418, "definition": "An all-inclusive smartphone security platform combining mobile device management (MDM), application controls, and content integration matrices to secure corporate assets across mobile devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the centralized enterprise management dashboard interface, run a compliance validation check on the problematic user account node, push an updated cryptographic certificate payload to the client, and ensure firewall rules allow traffic over outbound push notification ports."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.37491771970251636, "y": 0.9235214645663017, "z": -0.08089998725820924, "word": "Managing: MDM", "row_number": 1422, "definition": "A centralized server technology platform used by administrators to remotely deploy, lock down, secure, monitor, and wipe the entire configuration space of smartphone hardware endpoints across an enterprise network.", "details": [{"label": "TROUBLESHOOTING", "value": "Validate endpoint configuration rules via the master software platform panel, confirm the target device is connected to an active cellular or wireless data network link, check the enrollment token validity window, and re-enroll the device using a clean quick-response (QR) registration code sequence if necessary."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3706002686162081, "y": 0.9199940287303884, "z": -0.12753990748790725, "word": "Managing: mobile devices, MDM", "row_number": 1424, "definition": "The systematic process of managing enterprise mobile devices through a dedicated mobile device management (MDM) server to enforce corporate security baselines, application allowances, and remote data-wipe protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect the host device profile to the central corporate cloud enrollment server, push an updated global device profile containing mandatory screen-lock configuration thresholds, and use the administrative platform panel to monitor compliance states across all active hardware profiles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3432231400070527, "y": 0.9349628038342142, "z": -0.08967960531895777, "word": "MDM (Mobile Device Management)", "row_number": 1434, "definition": "A centralized software platform that allows administrators to remotely monitor, manage, secure, and configure mobile devices (smartphones, tablets, laptops) across an organization.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the mobile device has an active internet connection (Wi-Fi or Cellular); ensure the device enrollment profile is installed and trusted; check the MDM server dashboard to see if the device is showing as \u201cCompliant\u201d; and if errors persist, unenroll the device from the console and re-register it using the company\u2019s enrollment portal."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.38993060668248314, "y": 0.9157091196291747, "z": -0.09711297647684568, "word": "Mobile devices: BYOD policies", "row_number": 1460, "definition": "An organizational policy that allows employees to use their personal mobile devices for work-related tasks, requiring a balance between employee privacy and corporate security.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement strict MDM/EMM policies that containerize work data; educate employees on the security risks of BYOD; ensure there is a clear process for wiping work data from a device when an employee leaves the company."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.34794356654367975, "y": 0.9289259358256953, "z": -0.12661706145389826, "word": "Mobile devices: OS", "row_number": 1467, "definition": "The underlying software that manages the mobile device\u2019s hardware and software resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Keep the OS updated; clear the system cache; if issues persist, perform a factory reset after ensuring all data is backed up."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3618550530667596, "y": 0.9293275222508321, "z": -0.07356138224083116, "word": "Mobile devices: Security", "row_number": 1471, "definition": "The collection of technologies, policies, and practices used to protect mobile devices and the data they contain.", "details": [{"label": "TROUBLESHOOTING", "value": "Enable screen locks; enable full-disk encryption; ensure all software is patched; enable remote location features; avoid public Wi-Fi or use a VPN."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.38550756609416387, "y": 0.9144897632940417, "z": -0.12285108593155046, "word": "Networks: MAM (Mobile Application Management)", "row_number": 1601, "definition": "A set of software tools and services responsible for provisioning and controlling access to mobile apps used in a business environment.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device is properly enrolled in the organization's MDM/MAM solution, verify that the application has the necessary security tokens, and check if the MAM policy has restricted access to the app based on the device's current security posture."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3346919890003409, "y": 0.9365298245758398, "z": -0.10437030314673948, "word": "Networks: MDM (Mobile Device Management)", "row_number": 1603, "definition": "A type of security software used by an IT department to monitor, manage, and secure employees' mobile devices (laptops, smartphones, tablets) across multiple mobile service providers and operating systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the device has a stable Internet connection and is communicating with the MDM server, check the device\u2019s \u201cenrollment status\u201d in the MDM portal, and re-apply the management profile if the configuration settings appear corrupted."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3867032221867042, "y": 0.918716139646177, "z": -0.08013284410306695, "word": "Policies: BYOD (Bring Your Own Device)", "row_number": 1850, "definition": "An internal corporate security strategy that defines the baseline controls, mobile management registration rules, and inspection mandates for employees connecting their personal mobile devices to private enterprise networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Force personal endpoints to register through an MDM (Mobile Device Management) suite, create a separate sandboxed workspace partition on the host OS, and route unmanaged personal device traffic through an isolated wireless VLAN (Virtual Local Area Network)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.361560807043669, "y": 0.922318094514896, "z": -0.13639323788348906, "word": "PRL (Preferred Roaming Lists)", "row_number": 1959, "definition": "A database stored on mobile devices that identifies which cell towers or network carriers the device should connect to when outside its home service area.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the device\u2019s system profile (often by dialing a specific carrier code) to download the latest PRL update, ensuring the device has the most current list of roaming partners."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.3447501379870924, "y": 0.9355486703107744, "z": -0.07678559655054196, "word": "Profiles: Security profiles, mobile devices", "row_number": 1966, "definition": "A configuration set applied to mobile devices through a Mobile Device Management (MDM) solution that enforces security policies such as passcode requirements, encryption, VPN (Virtual Private Network) settings, and restriction of specific hardware features.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the device has checked in with the MDM server, ensure the network connection is active, review the MDM dashboard for policy errors, or manually trigger a policy synchronization (\u201csync\u201d) on the mobile device."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3965537972675377, "y": 0.9116690959756393, "z": -0.10772439517424526, "word": "Security: BYOD (Bring Your Own Device) policies", "row_number": 2263, "definition": "An administrative set of rules governing the use of personal mobile devices (e.g., smartphones, laptops) for corporate work, focusing on MDM (Mobile Device Management) and data containerization.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce device enrollment in the company MDM (Mobile Device Management) solution, ensure full-disk encryption is active, and configure remote wipe capabilities."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.33593764031528306, "y": 0.9337497904797936, "z": -0.1235201627198614, "word": "Security: Mobile devices", "row_number": 2286, "definition": "Security protocols and configurations applied to portable devices (e.g., smartphones, tablets) to protect corporate data, often managed through MDM (Mobile Device Management) platforms.", "details": [{"label": "TROUBLESHOOTING", "value": "Enroll the device in the organization\u2019s MDM (Mobile Device Management) solution, verify that full-disk encryption is active, and enforce biometric or strong passcode requirements."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3731049465026526, "y": 0.925344315564776, "z": -0.06730970618869808, "word": "Tracking: Cellular networks", "row_number": 2643, "definition": "The mechanism by which service providers monitor the location of a mobile device as it moves between towers (handover) to maintain connectivity.", "details": [{"label": "TROUBLESHOOTING", "value": "Toggle the \u201cAirplane Mode\u201d on and off to force the device to re-register with the nearest tower, check for carrier profile updates in the device settings, and verify that the SIM (Subscriber Identity Module) card is seated correctly."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(
