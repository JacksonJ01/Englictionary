<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 3, "radius": 285.0, "nodes": [{"x": 0.7190313385742725, "y": 0.46448948879735996, "z": -0.516 tore, and receive digital text documents and binary files across local networks or public internet infrastructures.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify client workstation internet access layer functionality, use the command ping to check the accessibility of the remote mail server address host, and check that local firewall profiles permit communications over standard email messaging ports."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7077344156267725, "y": 0.48435537212388846, "z": -0.5143071751707927, "word": "Email: Configuring", "row_number": 824, "definition": "The setup process of provisioning an electronic mail application with appropriate account identifiers, username credentials, incoming and outgoing host names, security transport protocols, and communication port numbers.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the account setup wizard within the email client, input the correct user credential string, explicitly select the desired protocol (such as Internet Message Access Protocol (IMAP) or Post Office Protocol 3 (POP3)), check the checkbox to enforce Secure Sockets Layer / Transport Layer Security (SSL/TLS) encryption, and assign the proper port numbers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7290376189921639, "y": 0.4586476174332401, "z": -0.5080812072071244, "word": "Email: IMAP", "row_number": 825, "definition": "Internet Message Access Protocol (IMAP) is a secure, modern network protocol used to retrieve electronic mail messages from a remote mail server, allowing real-time multi-device synchronization by caching message headers and leaving the original files persistently on the host server.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the advanced account configuration tab inside the application, verify that the mail server port is assigned to port 993 to facilitate secure IMAP over SSL/TLS (IMAPS), and use the command test-netconnection to check host port availability."}, {" alue": "Inspect the outbound configuration fields inside the mail app, ensure the destination port is switched from unencrypted port 25 to secure port 587 to enforce authenticated SMTP over Transport Layer Security (STARTTLS), and verify that outbound relay authentication requirements are enabled."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6987683010353352, "y": 0.4858867107043551, "z": -0.5250113959040259, "word": "IMAP (Internet Message Access Protocol)", "row_number": 1103, "definition": "An email protocol that allows users to access and manage email messages on a server, synchronizing the folder state across multiple devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the server settings (port 143 for non-SSL, 993 for SSL/TLS), check the network connection, and ensure the username and password are correctly entered."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7321195905171339, "y": 0.46657462475248795, "z": -0.4962952999153824, "word": "Mail servers", "row_number": 1386, "definition": "A dedicated computer server software infrastructure application that routes, processes, transfers, and stores electronic mail messages across network nodes using dedicated communication protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the remote host is running and responding over default communication protocol ports: port 25 for SMTP (Simple Mail Transfer Protocol), port 110 for POP3 (Post Office Protocol 3), and port 143 for IMAP (Internet Message Access Protocol). Test connectivity by running the network utility command \u201ctelnet mail.example.com 25\u201d via a command prompt window to check mail protocol handshake responses."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7087362065453108, "y": 0.4547410635061922, "z": -0.5393547577365196, "word": "Networks: Email", "row_number": 1588, "definition": "A method of exchanging messages between people using electronic devices; it relies on protocols like SMTP (Simple Mail Transfer Protocol), POP3 (Post Office Protocol version 3), and IMAP (Internet Message Access Protocol).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify server settings (ports and encryption types), check if the account credentials have expired, and use a \u201ctelnet\u201d test to the mail server on the specific port (e.g., \u201ctelnet mail.example.com 25\u201d) to confirm the server is accepting incoming connections."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7081561751251124, "y": 0.4940858173189259, "z": -0.5043748970324157, "word": "POP3 (Post Office Protocol 3)", "row_number": 1853, "definition": "An application layer internet protocol running over TCP (Transmission Control Protocol) port 110 that allows mail clients to download messages from a remote mail server onto a local drive, typically erasing them from the server cache afterward.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm the incoming server field parameters match the provider configuration exactly, verify that TCP port 110 is open through the local client firewall, or switch configurations to port 995 if the mail vendor mandates POP3S (POP3 Secure) encrypted over SSL/TLS (Secure Sockets Layer / Transport Layer Security)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7343843592669668, "y": 0.446461792616361, "z": -0.5112254694338225, "word": "Protocols: IMAP (Internet Message Access Protocol)", "row_number": 1993, "definition": "An email retrieval protocol that allows users to access email on a remote server while keeping the messages synced across multiple devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the IMAP server settings (typically port 993 for IMAP over SSL/TLS), check network connectivity to the mail server, and ensure credentials are correct."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6947623911654662, "y": 0.47683041473171983, "z": -0.5384588892467277, "word": "Protocols: POP3 (Post Office Protocol version 3)", "row_number": 1995, "definition": "An email retrieval protocol designed to download emails from a mail server to a local client, often deleting them from the server afterward.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify port settings (typically 110 or 995 for SSL), check the mail client configuration to see if it is set to \"leave a copy of messages on the server,\" and confirm credentials."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7270136178355733, "y": 0.48155332509554, "z": -0.48944621213271267, "word": "Protocols: SMTP (Simple Mail Transfer Protocol)", "row_number": 2000, "definition": "A communication protocol for electronic mail transmission across the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify outgoing SMTP server settings (usually port 25, 465, or 587), ensure the sender is authenticated, and check that the ISP (Internet Service Provider) is not blocking port 25."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7201449414923721, "y": 0.4418345149384265, "z": -0.5349518900350514, "word": "Servers: Mail servers", "row_number": 2325, "definition": "A server that handles the sending, receiving, and storage of email messages using protocols like SMTP (Simple Mail Transfer Protocol), IMAP (Internet Message Access Protocol), and POP3 (Post Office Protocol version 3).", "details": [{"label": "TROUBLESHOOTING", "value": "Check for correct port configurations (e.g., 25, 465, 587, 993), ensure the mail server service is active, and check for blocklists that might be preventing email delivery."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6961701503582002, "y": 0.4971495558707085, "z": -0.5178701003608898, "word": "SMTP (Simple Mail Transfer Protocol)", "row_number": 2395, "definition": "A foundation connection-oriented network communication protocol used to route outbound electronic mail traffic across distinct mail server nodes across the internet over standardized TCP ports 25, 465, or 587.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the mail program account configuration wizard panel, verify that the outbound mail server hostname address is spelled accurately, update the target communication port setting to secure port \u201c587\u201d or \u201c465\u201d to enforce Transport Layer Security (TLS) configurations, and ensure client authentication attributes are checked."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7397631276630374, "y": 0.4552558688410152, "z": -0.49547210702118544, "word": "Troubleshooting: Email, connectivity", "row_number": 2671, "definition": "Addressing failures in sending or receiving emails, usually related to SMTP (Simple Mail Transfer Protocol), POP3 (Post Office Protocol version 3), or IMAP (Internet Message Access Protocol) configurations.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify internet connectivity, check email server settings (ports, encryption types like SSL/TLS), ensure the username/password are correct, and test the email service via a web interface to see if the issue is account-based or client-based."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
