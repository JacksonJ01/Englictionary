ocedure of acquiring the formal Microsoft Edge standalone platform installer binary package securely via an authenticated remote server connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch an active PowerShell administrative terminal session and execute a secure web download script targeting the verified Microsoft content distribution network web address, ensuring the output installer package matches standard validation hashes before deploying globally."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7158257357907449, "y": -0.5497699645496882, "z": -0.43051887538024775, "word": "External drives, local OS installations", "row_number": 907, "definition": "Using a USB or eSATA external drive to boot and install an operating system on a local machine, often for diagnostic, recovery, or deployment purposes.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the drive is formatted correctly (e.g., FAT32 or NTFS), enter the BIOS/UEFI boot menu to select the external drive as the primary boot device, and load any necessary mass storage drivers during the installation process."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6964451152844195, "y": -0.5381689449505423, "z": -0.4746982073773732, "word": "Installing: OS", "row_number": 1142, "definition": "The operational deployment workflow that prepares storage spaces, maps boot sectors, and installs systematic code files from installation media to run a computer workstation.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the basic firmware tool structure, adjust the system target initialization paths to boot from the installation flash media device tool first, run clean partition tools via the \u201cdiskpart\u201d command utility if required, and proceed with system configurations."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6904544215264026, "y": -0.5750781049677313, "z": -0.4388141576810896, "word": "Internet: OS installations", "row_number": 1156, "definition": "Deploying a clean operating system installation over an active internet connection by streaming image components down from cloud data servers directly to local storage targets.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure a stable wired Ethernet cable configuration link is attached to the target device, verify local internet gateway access paths are uninterrupted by proxy filters, and restart cloud deployment loaders."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.720645870285469, "y": -0.5309343897202176, "z": -0.4458454928031894, "word": "Local OS installations: External drives", "row_number": 1308, "definition": "Deploying a clean operating system installation straight to local storage arrays by reading installation image binaries from a connected external USB flash drive or external hard disk.", "details": [{"label": "TROUBLESHOOTING", "value": "Power on the computer and press the required function key string (e.g., \u201cF12\u201d or \u201cDelete\u201d) to access the system BIOS/UEFI firmware configuration settings, navigate to the \u201cBoot\u201d options tab, change the system startup list to prioritize external USB storage devices over the internal hard drive, save changes, and restart the host."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6808040770379592, "y": -0.5585967653521147, "z": -0.47378841525162607, "word": "Network boot (PXE) OS installations", "row_number": 1549, "definition": "A process where a computer boots from the network interface card (NIC) using PXE (Preboot eXecution Environment) to download an OS image from a central deployment server, bypassing the need for local boot media.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the BIOS/UEFI boot order is set to prioritize \u201cNetwork Boot\u201d or \u201cPXE\u201d, check that the network cable is connected to a port with network access, and verify that the DHCP server is properly configured to provide the client with the IP address of the PXE boot server (TFTP (Trivial File Transfer Protocol) server)."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7091379779411663, "y": -0.5637063054794198, "z": -0.4235074136355314, "word": "Networks: Remote networks, OS installations", "row_number": 1617, "definition": "Deploying an Operating System (OS) to a computer over the network, typically using PXE (Preboot eXecution Environment) to download images from a deployment server.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the network cable is connected; verify that the BIOS/UEFI boot order includes \u201cNetwork Boot\u201d as the primary option; check that the DHCP (Dynamic Host Configuration Protocol) server is configured with the correct scope options to point to the PXE server."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.708477680539633, "y": -0.5262836608944486, "z": -0.47019664445072223, "word": "OS (Operating Systems): Local OS installations", "row_number": 1709, "definition": "An installation performed directly from physical media or a local image file rather than over a network deployment.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the source media integrity; perform the installation offline; update drivers manually after the desktop environment loads by moving drivers via a separate USB drive."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6792367144514709, "y": -0.5776876396498398, "z": -0.45267480241003877, "word": "PXE (Preboot eXecution Environment) network boot OS installations", "row_number": 2052, "definition": "A mechanism that allows a workstation to boot from a network interface card, fetching the OS installation image from a central server rather than local media.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure PXE boot is enabled in the BIOS/UEFI; verify the DHCP server is correctly configured to provide the TFTP server address and boot filename."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.7242429769384402, "y": -0.5392875433498199, "z": -0.42969879676706385, "word": "Remote networks, OS installations", "row_number": 2129, "definition": "The method of executing automated bare-metal installations on client systems across a network using boot storage distribution services.", "details": [{"label": "TROUBLESHOOTING", "value": "Confirm PXE boot is enabled in UEFI/BIOS, ensure the LAN is connected to a switch port with access to the WDS server, and verify DHCP options point to the boot loader."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.6868656661325167, "y": -0.5430784861028016, "z": -0.48299204405520296, "word": "Web browsers: Downloading", "row_number": 2880, "definition": "The automated data transmission process of fetching browser installation packages or platform upgrades from a trusted internet repository down onto a local storage workspace.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the host workstation has a stable connection to the network. Use a native secondary browser (such as Microsoft Edge on a clean Windows setup) to access the official vendor website via an encrypted channel, ensure the web link is validated as secure, click download, and monitor the workspace directory until the full executable file successfully downloads to disk."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
