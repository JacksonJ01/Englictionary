<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 132, "radius": 285.0, "nodes": [{"x": 0.060078960517761085, "y": 0.8983698717783629, "z": -0.43511158566973734, "word": "Attacks: DDoS attacks", "row_number": 163, "definition": "Distributed Denial of Service (DDoS) attacks. A large-scale cyberattack method where an attacker utilizes thousands of internet-connected hosts compromised by malware (botnets) to flood a target web server with network traffic, overwhelming its bandwidth and forcing it offline.", "details": [{"label": "TROUBLESHOOTING", "value": "Coordinate with your Internet Service Provider (ISP) to reroute or block malicious connection traffic; configure an external cloud-based DDoS mitigation and scrubbing service (such as \u201cCloudflare\u201d) to filter out malicious web payloads before they reach local firewalls."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.045757574394515055, "y": 0.8960232966010436, "z": -0.4416429511876402, "word": "Attacks: DoS attacks", "row_number": 165, "definition": "Denial of Service (DoS) attacks. A localized network assault where a single malicious computer sends malformed or high-volume data payloads to a target host or networking port to crash the system or saturate its processing capabilities.", "details": [{"label": "TROUBLESHOOTING", "value": "Isolate the source IP address by reviewing active firewall connection tables; create a temporary packet filter rule line inside your network security equipment to explicitly set an instruction to \u201cdeny\u201d or drop all incoming traffic packets from that specific host."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.055443039143916274, "y": 0.9046134988601513, "z": -0.42261150846904477, "word": "Attacks: Zombies", "row_number": 170, "definition": "A term used to describe an individual internet-connected computer that has been silently infected by malware, allowing a remote attacker to gain administrative control over the machine and use it to perform malicious tasks, such as sending spam or participating in Distributed Denial of Service (DDoS) attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect the suspicious computer from the Local Area Network (LAN); run an advanced offline malware scanner to locate and delete any Remote Access Trojans (RATs); patch the operating system vulnerabilities to prevent future automated network reinfections."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.06351556989633995, "y": 0.892370479316002, "z": -0.44681170533690395, "word": "DDoS (Distributed Denial of Service) attacks", "row_number": 610, "definition": "An attack where multiple compromised systems flood a target server with traffic, making it unavailable.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a cloud-based \u201cDDoS\u201d protection service to filter malicious traffic and block the source IP addresses."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.035621755966515116, "y": 0.901112265921625, "z": -0.43212009292262327, "word": "DoS (Denial of Service) attacks", "row_number": 764, "definition": "A malicious attempt to disrupt the normal traffic of a targeted server, service, or network by overwhelming the target with a flood of Internet traffic.", "details": [{"label": "TROUBLESHOOTING", "value": "Use firewalls to block malicious IP ranges, employ traffic filtering, and work with the ISP (Internet Service Provider) to mitigate upstream traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07151282665743502, "y": 0.9023329588553427, "z": -0.42506605014612275, "word": "Networks: DDoS attacks", "row_number": 1577, "definition": "A Distributed Denial of Service (DDoS) attack involves multiple compromised systems flooding a targeted server, service, or network with overwhelming amounts of traffic, rendering it unavailable to legitimate users.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement DDoS mitigation services (such as those provided by cloud-based traffic scrubbers), use hardware-based firewalls to filter traffic based on source reputation, and block traffic from known malicious IP addresses at the edge router."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.04749101601539606, "y": 0.8894825238346064, "z": -0.45449471195014407, "word": "Networks: DoS attacks", "row_number": 1584, "definition": "A Denial of Service (DoS) attack is an attempt to make a machine or network resource unavailable to its intended users by temporarily or indefinitely disrupting services of a host connected to the Internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement ingress filtering to block suspicious traffic patterns, harden the OS against resource-exhaustion attacks, and monitor system logs for high frequency of connection requests from single or suspicious IP addresses."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.04334148339015957, "y": 0.9084402520051466, "z": -0.4157617398876021, "word": "Social engineering: DDoS (Distributed Denial of Service) attacks", "row_number": 2403, "definition": "A malicious campaign where an attacker uses an array of compromised systems (a botnet) to flood a target server, service, or network infrastructure with an overwhelming volume of traffic, rendering it unavailable to legitimate users.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy traffic-filtering services (such as an upstream scrubbing service), utilize a Content Delivery Network (CDN) to distribute load, and configure firewall rules to rate-limit traffic from high-risk origin subnets or countries."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.07765312036179721, "y": 0.8932063137114256, "z": -0.4428910408262088, "word": "Social engineering: DoS (Denial of Service) attacks", "row_number": 2405, "definition": "A singular-source attack designed to consume a target system's resources (CPU, RAM, or bandwidth), causing the service or device to crash or become so slow that it can no longer process legitimate user requests.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the source IP address of the traffic stream, block the originating address via firewall rules, and investigate the host to identify if a specific process is being targeted by a malformed request."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02859303683324579, "y": 0.8954385837379906, "z": -0.44426588997801136, "word": "Social engineering: Zombies", "row_number": 2421, "definition": "A computer or device that has been compromised by malware, allowing an attacker to control it remotely (often as part of a botnet) without the owner's knowledge, usually to perform DDoS attacks or send spam.", "details": [{"label": "TROUBLESHOOTING", "value": "Perform a full system scan using updated antivirus/antimalware tools, disconnect the device from the network to stop the C2 (Command and Control) traffic, and re-image the system to ensure no rootkits remain."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.06657221514156693, "y": 0.9088748751441954, "z": -0.4117215096430695, "word": "Threats/vulnerabilities: DDoS attacks", "row_number": 2603, "definition": "A large-scale network security attack where an adversary synchronizes thousands of geographically decentralized internet-connected computing nodes (zombies or a botnet) to flood a target web service with data traffic, overwhelming its capacity and causing a crash.", "details": [{"label": "TROUBLESHOOTING", "value": "Engage with an upstream cloud-based traffic-scrubbing provider to divert incoming data streams, configure edge firewall network access control lists to filter out malicious traffic signatures, rate-limit ingress connection queues at the peripheral boundary, and sinkhole target routes if necessary to protect underlying network nodes."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.06201320805407512, "y": 0.8854763610462395, "z": -0.46052793189463753, "word": "Threats/vulnerabilities: DoS attacks", "row_number": 2605, "definition": "An attack originating from a singular source system designed to disrupt or disable a target network computer server's operational services by consuming its local resource bounds (such as CPU cycles, memory frames, or storage queues).", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the attacking network interface trace layout using tools like Wireshark, launch the peripheral network firewall management panel console layer, inject an immediate inbound block rule targeting that specific source address node, and power-cycle internal state connections to drop hanging session queues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.02742271029238665, "y": 0.9066996391975135, "z": -0.42088449631617275, "word": "Vulnerabilities/threats: DDoS (Distributed Denial of Service) attacks", "row_number": 2861, "definition": "A large-scale malicious network disruption method where an attacker leverages an automated network of thousands of geographically dispersed, compromised internet-connected host bots (zombie nodes) to flood a target server infrastructure with an overwhelming volume of traffic, rendering it unavailable to legitimate users.", "details": [{"label": "TROUBLESHOOTING", "value": "Contact the upstream Internet Service Provider (ISP) or cloud infrastructure network security vendor to activate traffic filtering services. Deploy localized boundary rate-limiting rules on external hardware firewalls to drop traffic originating from unverified geographical network ranges, and migrate public web nodes over behind an automated content delivery network scrubbing proxy framework."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0855025536678669, "y": 0.8994148691647651, "z": -0.42865161429954074, "word": "Vulnerabilities/threats: DoS (Denial of Service) attacks", "row_number": 2863, "definition": "A cyberattack vector where a single network host machine deliberately targets a specific server node or network link with malicious packets (such as an ICMP [Internet Control Message Protocol] flood or malformed data frames) to exhaust its operating resources and crash the host daemon.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the edge firewall traffic capture tables to isolate the specific malicious IP address string driving the packet blast. Configure an immediate inbound hardware security rule block using an Access Control List (ACL) template to drop all incoming communications from that rogue terminal address, and ensure the server's OS patch levels are fully up to date to protect against known kernel memory exhaustion attacks."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.03392382636275424, "y": 0.8875192120961974, "z": -0.4595202086579592, "word": "Zombies", "row_number": 3001, "definition": "Compromised computers (often infected with botnet malware) that are controlled remotely by an attacker (the \u201cbotmaster\u201d) to perform malicious tasks, such as Distributed Denial-of-Service (DDoS) attacks or spam distribution, without the owner's knowledge.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cnetstat -an\u201d command to check for suspicious active network connections. If infection is confirmed, isolate the machine from the network, perform a clean reinstall of the OS to ensure all malicious roots are removed, and update all system passwords as they may have been harvested by the botnet controller."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
