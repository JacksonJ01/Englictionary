REE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});re
