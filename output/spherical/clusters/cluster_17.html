<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 17, "radius": 285.0, "nodes": [{"x": 0.8681988956237479, "y": -0.02840106461795441, "z": -0.4954029240590645, "word": "Addressing: IPv4 (Internet Protocol version 4), loopback addresses", "row_number": 81, "definition": "A special reserved IPv4 address range (127.0.0.1 through 127.255.255.254, with \"127.0.0.1\" used as the standard default) that routes network traffic back to the local host machine. This allows a technician to test if a computer's local TCP/IP network stack is functioning correctly without needing a physical network connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the Command Prompt and type ping \"127.0.0.1\"; if the ping fails, reset the network configurations by running the command \"netsh int ip reset\" followed by a complete reboot of the operating system."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8657178256316422, "y": -0.01749664727751982, "z": -0.5002264624324344, "word": "APIPA (Automatic Private IP Addressing): Messages, troubleshooting", "row_number": 123, "definition": "Automatic Private Internet Protocol Addressing (APIPA) notification messages. Diagnostic alert conditions within the operating system interface\u2014such as \"Limited or no connectivity\" or a yellow warning symbol on the taskbar network icon\u2014indicating the device failed to pull an IP configuration from the network backbone.", "details": [{"label": "TROUBLESHOOTING", "value": "Check if other local area network (LAN) client endpoints are also experiencing identical \"169.254.x.x\" configurations to isolate a server failure; check for local network switch connection or virtual local area network (VLAN) assignment mistakes; configure a temporary static IP address profile to bypass automated dynamic allocation bugs."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8735113208805078, "y": -0.024717027161906917, "z": -0.4861759361197015, "word": "Arp command", "row_number": 157, "definition": "Address Resolution Protocol (arp) command. A diagnostic command-line utility used to view and manipulate the local Address Resolution Protocol (ARP) cache table, which maps known Internet Protocol (IP) addresses to physical Media Access Control (MAC) addresses.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a command window or terminal session and input the command \u201carp -a\u201d to view the complete local map of IP-to-MAC associations, allowing you to check for duplicate hardware addresses on the Local Area Network (LAN)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8631147216960082, "y": -0.03116402596781713, "z": -0.5040454152922129, "word": "Configuring: IPv4", "row_number": 457, "definition": "Assigning settings such as IP address, subnet mask, and default gateway to a network interface using the IPv4 (Internet Protocol version 4) standard.", "details": [{"label": "TROUBLESHOOTING", "value": "Access 'Network Connections' in the Control Panel, right-click the adapter, select 'Properties', choose 'Internet Protocol Version 4 (TCP/IPv4)', and configure either a static IP or 'Obtain an IP address automatically' (DHCP (Dynamic Host Configuration Protocol))."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8698632693057367, "y": -0.00962992931875997, "z": -0.49319890224335566, "word": "Configuring: Networks", "row_number": 460, "definition": "The process of setting up network parameters (IPs, DNS, SSIDs) to ensure devices can communicate effectively over a LAN (Local Area Network) or WAN (Wide Area Network).", "details": [{"label": "TROUBLESHOOTING", "value": "Check physical connections, verify IP/DNS configurations, run the command 'ipconfig /all' to check settings, and reset the network adapter."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8720611286634896, "y": -0.03706339967862515, "z": -0.4879914879159503, "word": "Connectivity: TCP socket connections", "row_number": 509, "definition": "An endpoint for communication between two devices, defined by an IP address and a port number.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the 'netstat' command to check the status of socket connections and ensure the target service is listening on the expected port."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8601297284718559, "y": -0.018968445003477587, "z": -0.5097225208808038, "word": "DHCP (Dynamic Host Configuration Protocol)", "row_number": 637, "definition": "A network protocol that automatically assigns IP (Internet Protocol) addresses and other network parameters to clients.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cipconfig /renew\u201d on the client, or check the \u201cDHCP\u201d server scope to ensure addresses are available."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8765181073814063, "y": -0.015374748104589605, "z": -0.4811232945443795, "word": "DHCP: Servers", "row_number": 641, "definition": "A network device or server service that manages the IP address pool.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the \u201cDHCP\u201d server service is running and that the server has a static IP address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8643382395618883, "y": -0.041964811752664394, "z": -0.5011570235022347, "word": "Firewalls: NAT", "row_number": 978, "definition": "Network Address Translation (NAT) is a method used by firewalls and routers to map multiple private IP addresses on a local network to a single public IP address when communicating with the internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Enable \u201cUPnP\u201d (Universal Plug and Play) on the router for automatic port management, or manually configure \u201cPort Forwarding\u201d rules to direct traffic to the local IP address of the device requiring the connection."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8647557848051589, "y": -0.00437761498063107, "z": -0.5021735448359413, "word": "ip command", "row_number": 1173, "definition": "A modern Linux command-line utility used to manage network interfaces, routing tables, and IP addresses, replacing the older \u201cifconfig\u201d (Interface Configuration) tool.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cip addr show\u201d to list network interfaces, \u201cip link set [interface] up\u201d to enable an interface, and \u201cip route\u201d to view or modify routing tables."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8776566532910848, "y": -0.03314094949525832, "z": -0.4781427364296621, "word": "ipconfig command", "row_number": 1177, "definition": "A Windows command-line utility used to display current TCP/IP (Transmission Control Protocol/Internet Protocol) network configuration values and refresh DHCP and DNS (Domain Name System) settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cipconfig /all\u201d to see comprehensive details, \u201cipconfig /flushdns\u201d to clear the local DNS resolver cache, and \u201cipconfig /renew\u201d to request a new IP address from the DHCP server."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8571485492335961, "y": -0.030170112381920623, "z": -0.5141849169954364, "word": "IPv4: Configuring", "row_number": 1183, "definition": "The process of manually or automatically assigning an IPv4 address, subnet mask, and gateway to a network interface.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to \u201cNetwork Connections\u201d > \u201cProperties\u201d > \u201cInternet Protocol Version 4 (TCP/IPv4)\u201d, select \u201cObtain an IP address automatically\u201d for DHCP, or enter the static IP details if required."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8745574566443678, "y": -0.003233135801612721, "z": -0.4849111277962415, "word": "IPv4: Loopback addresses", "row_number": 1186, "definition": "A special IP address (127.0.0.1) used by a device to communicate with itself, primarily for testing the local TCP/IP stack functionality.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cping 127.0.0.1\u201d to confirm the network interface card drivers and TCP/IP stack are correctly installed and functioning."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.870043778505972, "y": -0.04783689246717179, "z": -0.49064799520851543, "word": "IPv4: Public IP addresses", "row_number": 1188, "definition": "Globally unique IP addresses assigned to devices (usually routers) so they can be identified and reached over the public internet.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the router\u2019s WAN port to verify it has a valid public IP assigned by the ISP (Internet Service Provider), and ensure port forwarding or firewall rules are correctly allowing external traffic."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8580789569172937, "y": -0.008631762672976192, "z": -0.5134452223644568, "word": "IPv4: SOHO networks", "row_number": 1189, "definition": "The configuration of network addressing in home and small office environments, typically using a single router to handle DHCP and NAT for multiple devices.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the router\u2019s DHCP range settings, ensure the router is assigned a unique IP, and reboot the router to clear internal state issues."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8811303109725696, "y": -0.020590221306286148, "z": -0.47242503942100816, "word": "IPv4: Static IP addresses, assigning", "row_number": 1190, "definition": "Manually configuring an IP address, subnet mask, and gateway on a device so that it remains constant, which is necessary for servers and printers.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the DHCP server\u2019s reservation table to avoid conflicts, and ensure the static IP is outside the dynamic address pool managed by the router."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8587269844239898, "y": -0.04428080761498365, "z": -0.5105165778885598, "word": "Link-local addresses, troubleshooting", "row_number": 1252, "definition": "The process of diagnosing self-assigned network addresses that interface cards automatically establish when dynamic IP services fail, such as the APIPA (Automatic Private IP Addressing) block \"169.254.0.0/16\" in IPv4 or the \"fe80::/10\" scope block in modern IPv6 environments.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a command terminal and execute \"ipconfig\", check for the presence of a \"169.254.x.x\" address layout value, inspect upstream physical cable connections to verify connectivity to the switch network layer, and test if the DHCP server has run out of address pool allocations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8681840244453183, "y": 0.004478063456168117, "z": -0.49622217468147645, "word": "Linux: Ip command", "row_number": 1282, "definition": "The modern network configuration interface utility in Linux used to assign addresses, toggle link states, manage routing tables, and query network interface statistics, replacing the legacy \u201cifconfig\u201d utility.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the command \"ip addr show\" to inspect current network adapter IP allocations, and activate disabled interface hardware ports by entering the command string \"sudo ip link set dev eth0 up\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.877521011457562, "y": -0.04440664273081144, "z": -0.47747766914472084, "word": "Loopback addresses", "row_number": 1343, "definition": "A dedicated, non-routable IP address reservation block (127.0.0.1 through 127.255.255.255 in IPv4 and ::1 in modern IPv6) used to route data traffic straight back to the local device's software interface layer to test the network stack.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch an elevated command execution prompt window, input the loopback verification testing string \"ping 127.0.0.1\" or \"ping ::1\", and verify if the host network driver layers answer the ping requests to confirm the local TCP/IP stack is intact."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.853302030582476, "y": -0.021864195988577178, "z": -0.5209583491389655, "word": "NAT (Network Address Translation)", "row_number": 1544, "definition": "A networking method that maps a range of private IP (Internet Protocol) addresses used within a local network to a single, public IP address assigned to the gateway router, enabling multiple devices to share one internet connection.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s NAT configuration panel, check the port mapping or \u201cPort Forwarding\u201d section, and ensure that the traffic destined for specific ports is being forwarded to the correct static internal IP address of the intended local host."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8800435250987265, "y": -0.004449480390387154, "z": -0.47487218917942803, "word": "Networking commands: Arp command", "row_number": 1557, "definition": "A command-line tool (Address Resolution Protocol) used to view and modify the mapping between a device's IP address and its physical MAC (Media Access Control) address.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201carp -a\u201d to view the current cache table; if an incorrect entry exists for a device, use \u201carp -d *\u201d to clear the cache and force the host to re-broadcast ARP requests to resolve the correct MAC address."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.865015768688545, "y": -0.05446881739467328, "z": -0.4987793779335624, "word": "Networking commands: Ipconfig command", "row_number": 1559, "definition": "A Windows command-line utility used to display current TCP/IP network configuration values and refresh DHCP and DNS (Domain Name System) settings.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cipconfig /release\u201d to drop the current lease, then \u201cipconfig /renew\u201d to request a new IP from the DHCP server; use \u201cipconfig /flushdns\u201d if there are issues resolving website hostnames."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8595875108136461, "y": 0.002784719438851827, "z": -0.5109809747836477, "word": "Networks: DHCP (Dynamic Host Configuration Protocol)", "row_number": 1578, "definition": "A network management protocol used to automatically assign IP addresses and other network parameters (like default gateway and DNS servers) to devices on a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cipconfig /renew\u201d on the client, verify that the DHCP scope on the server is not exhausted (i.e., all addresses are taken), and ensure that the DHCP server is reachable from the client's network segment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8834312281918874, "y": -0.031213943751315983, "z": -0.4675200046745198, "word": "Networks: SNMP (Simple Network Management Protocol)", "row_number": 1629, "definition": "An Internet-standard protocol for collecting and organizing information about managed devices on IP networks and for modifying that information to change device behavior.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the SNMP community strings (credentials) match between the device and the manager; ensure UDP (User Datagram Protocol) port 161 is open on firewalls; check that the SNMP service is enabled on the target device."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8531058492852678, "y": -0.039784646255903305, "z": -0.5202187922764369, "word": "Ports/connectors: Forwarding", "row_number": 1858, "definition": "A network address translation (NAT) rule configured on a gateway router that redirects inbound traffic from an external internet WAN (Wide Area Network) port to a specific internal IP address and local area network port.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the gateway router administrative console via its default gateway IP address, navigate to the \u201cPort Forwarding\u201d submenu, create a new rule mapping the external port target (e.g., TCP port 80) to the static internal IP address of the destination server, and click \u201cApply.\u201d"}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8738287300931145, "y": 0.008564549868653681, "z": -0.4861584093167596, "word": "Ports/connectors: Protocol/port listings", "row_number": 1861, "definition": "The standard logical assignments designated by IANA (Internet Assigned Numbers Authority) that bind application layer protocols to specific numeric endpoints within transport data packets.", "details": [{"label": "TROUBLESHOOTING", "value": "Cross-reference system port listings to ensure proper service routing, verifying that critical traffic is mapped correctly: HTTP uses port 80, HTTPS uses port 443, SSH (Secure Shell) uses port 22, RDP (Remote Desktop Protocol) uses port 3389, and SMB (Server Message Block) operates over port 445."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8741519620601554, "y": -0.055237020404774136, "z": -0.48250100394007805, "word": "PowerShell: IPv4 configurations", "row_number": 1900, "definition": "The use of cmdlets like \u201cGet-NetIPAddress\u201d and \u201cNew-NetIPAddress\u201d to view, configure, and modify IPv4 (Internet Protocol version 4) network settings on a host.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cipconfig /all\u201d to verify current settings, ensure the interface alias name is correct (e.g., \u201cEthernet\u201d), and re-verify network masks and gateway information after applying new configurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8520613857409763, "y": -0.00958544314720995, "z": -0.5233541002121213, "word": "Protocols: DHCP (Dynamic Host Configuration Protocol)", "row_number": 1988, "definition": "A network protocol used to automatically assign IP (Internet Protocol) addresses and other network configuration parameters to devices on a network.", "details": [{"label": "TROUBLESHOOTING", "value": "Run \u201cipconfig /release\u201d followed by \u201cipconfig /renew\u201d on the host; verify the DHCP server is operational, has available IP scopes, and that there is no IP address conflict on the local subnet."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8848357145650629, "y": -0.01194234846724258, "z": -0.46575008163522774, "word": "Protocols: Port listings", "row_number": 1996, "definition": "The documented reference of standard communication ports (0\u201365535) and their associated services (e.g., Port 80 for HTTP, Port 22 for SSH).", "details": [{"label": "TROUBLESHOOTING", "value": "Consult official IANA (Internet Assigned Numbers Authority) documentation for standard port numbers, and use the \u201cnetstat -a\u201d command to see which ports are currently listening on the local machine."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8584658581647422, "y": -0.05571349364231302, "z": -0.5098356372318834, "word": "Protocols: SNMP (Simple Network Management Protocol)", "row_number": 2001, "definition": "An internet-standard protocol used for collecting and organizing information about managed devices on IP networks and for modifying that information to change device behavior.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the correct SNMP community string (or version 3 user credentials) is configured on both the device and the management console, and ensure UDP (User Datagram Protocol) ports 161 and 162 are open."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8640299456651275, "y": 0.012388319320217568, "z": -0.5032879717799115, "word": ".ps1 files: IPv4 configurations", "row_number": 2019, "definition": "PowerShell cmdlets (such as 'New-NetIPAddress') used to modify network interface settings, such as IP addresses, subnet masks, and default gateways.", "details": [{"label": "TROUBLESHOOTING", "value": "Run 'Get-NetIPConfiguration' to verify the current adapter index; ensure no IP conflicts exist; check that the interface name matches the one specified in the script exactly."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8828818518075804, "y": -0.044456837018462675, "z":
