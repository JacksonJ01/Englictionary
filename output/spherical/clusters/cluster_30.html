<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 30, "radius": 285.0, "nodes": [{"x": 0.08914747964930637, "y": 0.9956761991237271, "z": 0.026108109290122236, "word": "Best practices: Account management", "row_number": 223, "definition": "Operational security guidelines that direct how administrative teams provision, audit, update, suspend, and delete corporate user network identities to enforce organizational data boundaries.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement an automated offboarding checklist procedure to disable user profiles immediately upon separation; run quarterly profile access audits across Active Directory (AD) containers, and configure strict profile tracking parameters to maintain regulatory compliance."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07397782470947438, "y": 0.9970922924484227, "z": 0.018282280798722718, "word": "BYOD (Bring Your Own Device), policies", "row_number": 293, "definition": "A corporate security and administrative framework that defines the rules, support structures, and security controls for employees who use their personal devices to access company resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy an MDM (Mobile Device Management) agent onto all participating personal endpoints to enforce data isolation containers, mandate storage encryption, and manage selective corporate data wipes."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.08374372271893538, "y": 0.995643409986252, "z": 0.041002305497642506, "word": "Documentation: Offboarding processes", "row_number": 754, "definition": "The structured procedure for removing an employee's access to all company systems and reclaiming hardware upon their departure.", "details": [{"label": "TROUBLESHOOTING", "value": "Follow the checklist to disable accounts, wipe devices, and revoke physical security access immediately upon departure."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.09323098117453021, "y": 0.9955714206099575, "z": 0.012063607002275724, "word": "Insider threats", "row_number": 1136, "definition": "A security threat vector originating from individuals inside the corporate organization network boundary\u2014such as rogue employees, contractors, or business partners\u2014who misuse their authorized data credentials to steal or sabotage corporate data systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce strict Least Privilege (LP) access models via Active Directory (AD), implement user behavior analytics monitoring profiles to detect out-of-norm tasks, and systematically strip account access rights upon employee termination."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.06276406429012926, "y": 0.997589419671544, "z": 0.029597668711853837, "word": "Offboarding processes", "row_number": 1675, "definition": "A formal procedure in corporate IT (Information Technology) management used to revoke a departing employee's access to all company digital resources, such as domain accounts, email, VPN (Virtual Private Network) access, and physical tokens.", "details": [{"label": "TROUBLESHOOTING", "value": "Consult the organizational checklist; disable the user account in \u201cActive Directory\u201d; revoke permissions in cloud identity providers (like Microsoft Entra ID, formerly Azure AD); collect all company-owned hardware; change shared administrative passwords if the employee had knowledge of them."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.10109035365135756, "y": 0.9941510626783878, "z": 0.03800532823270586, "word": "Physical security", "row_number": 1806, "definition": "The protection of personnel, hardware, networks, and data from physical actions and events that could cause serious loss or damage to an enterprise.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement a layered defense strategy including locks, guards, surveillance, and restricted access protocols to harden the facility against physical threats."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07626858835637644, "y": 0.9970833223798108, "z": 0.0028196918562495904, "word": "Security", "row_number": 2251, "definition": "A comprehensive practice encompassing technical, physical, and administrative measures designed to protect information systems, hardware, and data from unauthorized access, modification, or destruction.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a thorough system audit, review logs using \u201cEvent Viewer\u201d (Windows) or \u201cjournalctl\u201d (Linux), identify the breach entry point, isolate affected devices from the network, and implement hardened security policies."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.07050600525399758, "y": 0.9963031780481081, "z": 0.04908034875959429, "word": "Security: Physical security", "row_number": 2292, "definition": "The protection of personnel, hardware, networks, and data from physical actions and events that could cause serious loss or damage, such as theft, fire, or vandalism.", "details": [{"label": "TROUBLESHOOTING", "value": "Install CCTV (Closed-Circuit Television) cameras, use badge-access readers for restricted areas, and ensure all hardware is secured in locked racks or enclosures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.1082845980355542, "y": 0.9939806191526831, "z": 0.016642553203377142, "word": "Social engineering: Insider threats", "row_number": 2410, "definition": "Malicious activity carried out by individuals who have authorized access to a company's systems\u2014such as current or former employees, contractors, or business associates\u2014who exploit that access to steal data or sabotage infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Apply the \"Principle of Least Privilege\" (PoLP) to ensure users have access only to what they need, implement robust logging and auditing of all administrative actions, and perform thorough offboarding processes for terminated personnel to revoke all access immediately."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.055616803594331105, "y": 0.9983398283373537, "z": 0.014978595170869653, "word": "Theft/loss, mobile devices", "row_number": 2590, "definition": "Physical security events involving the unauthorized removal or misplacement of corporate mobile assets, requiring logical mitigations to prevent unauthorized data exfiltration or access to enterprise infrastructure.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the enterprise MDM (Mobile Device Management) control panel utility, track the coordinates of the device via GPS (Global Positioning System), send a remote lock instruction command, and execute a remote wipe script to sanitize all internal flash storage partitions if recovery is impossible."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.09532792440952982, "y": 0.9939886495897688, "z": 0.05384376764750517, "word": "Threats/vulnerabilities: Insider threats", "row_number": 2607, "definition": "Security risk liabilities originating from individuals who hold authorized credential access parameters inside an organization's network perimeter boundary (such as current employees, rogue contractors, or former staff) who abuse their privileges to compromise data assets or disrupt architecture states.", "details": [{"label": "TROUBLESHOOTING", "value": "Enforce the technical framework Principal of Least Privilege (PoLP), disable inheritance parameters across secure directory trees, implement continuous activity log monitoring via a SIEM (Security Information and Event Management) platform tool, and execute immediate account suspension routines during employee offboarding cycles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.0920706181802899, "y": 0.9957423357836354, "z": -0.0044946630628915135, "word": "Vulnerabilities/threats: Insider threats", "row_number": 2865, "definition": "A critical security risk vector originating from individuals who possess legitimate, authorized access rights and network credentials within an enterprise (such as employees, former contractors, or trusted partners) who intentionally or unintentionally compromise company asset data.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement a comprehensive Data Loss Prevention (DLP) software suite across every endpoint terminal to block the transfer of corporate files to untrusted USB flash devices. Configure strict user permission models based on Role-Based Access Control (RBAC) to ensure accounts can only view resources required for their explicit duties, and monitor network logs using automated user behavior analysis tools."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
