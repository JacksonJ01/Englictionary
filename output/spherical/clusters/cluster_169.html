ured line failures."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7767699135597569, "y": -0.6295898756597622, "z": -0.015655345895028355, "word": "PoE (Power over Ethernet): PSE (Power Sourcing Equipment)", "row_number": 1845, "definition": "The upstream network hardware component, typically an active network switch or an inline injector midspan, tasked with injecting operating voltage into the twisted copper cabling pairs.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the network switch management console using a secure browser interface, issue the command \u201cshow power inline\u201d to audit consumption across the backplane, and disable non-essential ports or install an external secondary power supply module to clear the bottleneck."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.767859080791843, "y": -0.6354615573020579, "z": -0.08112361700978071, "word": "PSE (Power Sourcing Equipment)", "row_number": 2027, "definition": "A network device, such as a PoE switch or injector, that supplies power to PDs (Powered Devices) over Ethernet cabling.", "details": [{"label": "TROUBLESHOOTING", "value": "Check the switch port status via the management interface; ensure the PSE supports the correct IEEE 802.3af/at/bt standard required by the PD; verify the total power budget of the switch has not been exceeded."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8024349259678968, "y": -0.5954748964437923, "z": -0.038830880651245105, "word": "RJ45 crimpers", "row_number": 2181, "definition": "A heavy-duty, handheld mechanical tool engineered to compress the internal copper contact pins of an RJ45 modular plug into individual copper wires of a twisted-pair networking line while simultaneously securing the outer plastic strain-relief jacket.", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure the inner conductors are pushed completely to the very front edge of the plastic RJ45 plug before applying force; insert the plug housing completely into th
