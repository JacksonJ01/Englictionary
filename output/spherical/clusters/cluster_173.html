<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 173, "radius": 285.0, "nodes": [{"x": -0.08132819612310266, "y": -0.14465872761790755, "z": 0.9861336506981853, "word": "AC adapters, troubleshooting", "row_number": 28, "definition": "The external power bricks responsible for converting alternating current (AC) high-voltage wall power into lower direct current (DC) power that a portable device or laptop can safely use to run and charge.", "details": [{"label": "TROUBLESHOOTING", "value": "Inspect the physical cabling for frayed wires or deep cuts; use a digital multimeter to test the DC barrel connector tip for appropriate voltage output against the printed specs on the brick label; swap with a known-good adapter matching identical voltage and equal/higher amperage specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.06742227956325664, "y": -0.15170197781420164, "z": 0.9861241028114837, "word": "Blackouts", "row_number": 248, "definition": "A complete and sudden loss of electrical power grid delivery to a facility or localized equipment setup.", "details": [{"label": "TROUBLESHOOTING", "value": "Install an inline UPS (Uninterruptible Power Supply) system between the wall outlet and critical equipment to provide sufficient battery runtime to execute orderly operating system shutdowns."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.07658742537683924, "y": -0.1312287993418672, "z": 0.9883892798373722, "word": "Brownouts", "row_number": 269, "definition": "Temporary reductions in electrical power grid delivery voltages that can cause erratic behavior in electronic components without fully shutting them off.", "details": [{"label": "TROUBLESHOOTING", "value": "Place specialized line-interactive power regulation equipment or full uninterruptible backup units between facility outlets and sensitive production hardware."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": -0.08488015947776553, "y": -0.15729125159452564, "z": 0.9838977694348416, "word": "Environmental controls: Power", "row_number": 863, "definition": "The management of electrical input stability using tools like Uninterruptible Power Supplies (UPS) and Surge Protectors to ensure hardware remains powered safely during utility fluctuations.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect sensitive IT hardware to an online UPS, test battery runtime status, and use a multimeter to check that the wall outlet provides the correct voltage (e.g., 120V or 240V)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.057348426573723264, "y": -0.1414895317601441, "z": 0.9882772234407781, "word": "Power: AC adapters, troubleshooting", "row_number": 1867, "definition": "The external electrical component that steps down high-voltage Alternating Current (AC) from a wall socket to the low-voltage Direct Current (DC) required by portable hardware like laptops.", "details": [{"label": "TROUBLESHOOTING", "value": "Test the DC barrel connector tip output using a digital multimeter set to VDC mode to verify it matches the rated voltage stamped on the adapter casing; check the cord for fraying and replace the unit if the brick exhibits physical swelling."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.09234885428961703, "y": -0.13390907148362058, "z": 0.9866813313759359, "word": "Power: Blackouts", "row_number": 1869, "definition": "A catastrophic total loss of public utility electrical infrastructure power across an area or building facility.", "details": [{"label": "TROUBLESHOOTING", "value": "Integrate a dedicated online or line-interactive UPS (Uninterruptible Power Supply) into corporate server frames, adjust the server configurations to run clean automated shutdown sequences via USB/Network signaling cables when power failure thresholds are breached, and check the main facility circuit breakers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.0693256169429485, "y": -0.16559973249855325, "z": 0.9837533671768991, "word": "Power: Brownouts", "row_number": 1870, "definition": "A prolonged drop in incoming utility AC voltage levels below standard operational baselines, causing electronics to draw vers instantaneous backup electrical energy to connected systems when incoming utility power fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Open the vendor's local management dashboard interface via a connected data line to look up the integrated battery health statistics, execute a manual battery calibration self-test routine, and swap out the aging lead-acid or lithium battery blocks if the system indicates a \"Replace Battery\" condition."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.08729480714533643, "y": -0.11960803332952728, "z": 0.9889760032521018, "word": "PSU (Power Supply Units)", "row_number": 2029, "definition": "A hardware component that converts AC from a wall outlet into low-voltage DC power required by internal computer components.", "details": [{"label": "TROUBLESHOOTING", "value": "Use a multimeter or a dedicated PSU tester to check voltages on the 24-pin and CPU power connectors; ensure all cables are firmly seated."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.08363040767069964, "y": -0.17215791560759622, "z": 0.9815129173915544, "word": "Quick deaths, PSU (Power Supply Unit), troubleshooting", "row_number": 2060, "definition": "A critical electrical failure state where a power supply unit instantly and permanently stops converting AC (Alternating Current) voltage into direct low-voltage DC (Direct Current) lines, completely rendering a computer non-functional without any preliminary warnings or graceful component shutdowns.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the main wall outlet is active by plugging in a known functional appliance, ensure the physical toggle switch located on the back of the PSU (Power Supply Unit) enclosure is turned to the on (\u201cI\u201d) position, pull the internal 24-pin main ATX (Advanced Technology eXtended) power lead from the motherboard socket, use a dedicated hardware \u201cPSU Tester\u201d or bridge the green pin to a black ground wire using a paperclip to test for automated fan spin, and replace the dead unit with an appropriate wattage-rated component if it fails to activate."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.04913888461535181, "y": -0.12949681835787313, "z": 0.9903615218969015, "word": "Sags", "row_number": 2208, "definition": "A short-term decrease in voltage in an electrical power line, often called a 'brownout,' which can cause computer components to reset or lose data.", "details": [{"label": "TROUBLESHOOTING", "value": "Install a high-quality UPS (Uninterruptible Power Supply) that features automatic voltage regulation, which can stabilize input voltage and compensate for sags without switching to battery power."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.10609158867838699, "y": -0.13787037746138833, "z": 0.9847519148650336, "word": "Slow deaths of PSU, troubleshooting", "row_number": 2385, "definition": "The diagnostic track of a progressive, deteriorating electrical failure within a power supply unit, where aging internal components or failing capacitors gradually lose the ability to maintain clean, stable voltage outputs.", "details": [{"label": "TROUBLESHOOTING", "value": "Pull all internal power connection cables loose from the motherboard and storage devices, link the main 24-pin ATX lead to a professional diagnostic multimeter or dedicated digital \u201cPSU Tester\u201d, monitor the active readout fluctuations across the +12V, +5V, and +3.3V power rails over an extended period, and replace the power supply unit if output values drop below the standardized +/- 5 percent electrical tolerance threshold."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.05612932717121382, "y": -0.17111143886776475, "z": 0.9836515511703879, "word": "Surges", "row_number": 2522, "definition": "A sudden, short-lived increase in voltage that can damage sensitive electronic components.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect all sensitive equipment to a high-quality UPS (Uninterruptible Power Supply) that includes surge suppression and voltage regulation features."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.07124329670484564, "y": -0.11133051512626653, "z": 0.9912264670983849, "word": "UPS (Uninterruptible Power Supplies)", "row_number": 2759, "definition": "An electrical apparatus containing an internal storage battery bank that provides emergency instantaneous backup power to connected electronic components when the primary utility mains power grid fails.", "details": [{"label": "TROUBLESHOOTING", "value": "Disconnect low-priority peripheral equipment from the battery-backed outlets to prevent overloading the circuit capacity. Connect the UPS data management cable (typically USB or serial) to the host machine, install the vendor monitoring software, and initiate a self-test diagnostic run to verify runtime health capacity and battery cell integrity."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
