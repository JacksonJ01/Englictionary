<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 52, "radius": 285.0, "nodes": [{"x": 0.1704701445861576, "y": 0.9112903690641131, "z": -0.374819680720966, "word": "Attacks: Spoofing attacks", "row_number": 168, "definition": "An exploitation technique where an attacker alters header fields inside a network data packet to impersonate another device. Examples include masquerading as a trusted internal Internet Protocol (IP) address, Media Access Control (MAC) address, or Domain Name System (DNS) server to bypass authentication checks.", "details": [{"label": "TROUBLESHOOTING", "value": "Turn on security verification protocols like \u201cDynamic ARP Inspection (DAI)\u201d and \u201cIP Source Guard\u201d on all network switches to block modified packets from moving across local network segments."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.15448596852187346, "y": 0.9110432631784495, "z": -0.38227510793539926, "word": "Email: Security", "row_number": 830, "definition": "The umbrella of protective technical controls, anti-malware filtering systems, administrative spam barriers, and end-user verification training strategies configured to defend corporate messaging channels from malicious content injections.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy a robust Secure Email Gateway (SEG) at the network perimeter, enforce mandatory Multi-Factor Authentication (MFA) across all webmail portals, and configure rigorous attachment sandboxing policies within the mail system administrative console."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.16601406035007177, "y": 0.917844331974487, "z": -0.36055667242250644, "word": "Networks: Spoofing attacks", "row_number": 1631, "definition": "A technique where an attacker disguises their identity by falsifying data (such as an IP address, email sender, or MAC (Media Access Control) address) to gain unauthorized access or mislead users.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement anti-spoofing filters (like ingress filtering) on routers; configure SPF (Sender Policy Framework), DKIM (DomainKeys Identified Mail), and DMARC (Domain-based Message Authentication, Reporting, and Conformance) for email domains; use strong authentication protocols."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.17362339169458954, "y": 0.9050822347653594, "z": -0.3881765914743055, "word": "Removing malware: Educating end users", "row_number": 2132, "definition": "The final phase where a technician trains the client on safe internet use, email scanning tactics, and device security to prevent reinfection.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct a training session; demonstrate how to inspect email headers, review web filtering policies, and show how to use reporting tools."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.14386476549435695, "y": 0.917254928793312, "z": -0.3714112610754147, "word": "Security: Spam gateways", "row_number": 2301, "definition": "A dedicated security appliance or cloud service that filters incoming and outgoing email to block spam, phishing attempts, and malware before it reaches the user\u2019s inbox.", "details": [{"label": "TROUBLESHOOTING", "value": "Update the spam filter\u2019s \u201cAllow/Block\u201d lists, adjust the heuristic scanning sensitivity, and verify the gateway\u2019s DNS (Domain Name System) reputation configuration."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.18343493177620143, "y": 0.9134108462610765, "z": -0.36336242477295866, "word": "Social engineering: Phishing", "row_number": 2412, "definition": "A fraudulent communication method (usually email) where an attacker poses as a reputable entity (like a bank or IT department) to trick the recipient into clicking a malicious link, downloading a file, or entering credentials on a fake website.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy email filtering solutions that automatically identify and quarantine suspicious links and attachments, enable DMARC (Domain-based Message Authentication, Reporting, and Conformance) to prevent domain spoofing, and educate users on identifying phishing red flags."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.15570829617352855, "y": 0.9045368400976789, "z": -0.3969483989246497, "word": "Social engineering: Spoofing attacks", "row_number": 2416, "definition": "The act of falsifying data\u2014such as an IP address, email sender address, or Caller ID\u2014to disguise the origin of a communication and gain the victim's trust.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement email authentication protocols (SPF, DKIM, DMARC), use network ingress/egress filtering to block spoofed IP addresses, and configure firewalls to prevent internal source addresses from appearing on external interfaces."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.15309857185852974, "y": 0.9231089779652768, "z": -0.35274727794099375, "word": "Spam gateways", "row_number": 2450, "definition": "A security appliance or cloud-based service that sits in front of an email server to inspect incoming mail traffic for signatures, heuristics, and IP reputation associated with unsolicited or malicious spam emails.", "details": [{"label": "TROUBLESHOOTING", "value": "Review the gateway's quarantine logs for blocked messages, update the spam filtering rules or \u201callow lists\u201d for specific domains, and verify the DNS (Domain Name System) SPF (Sender Policy Framework) records are correctly configured."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.1892370196280022, "y": 0.9038567145191952, "z": -0.38370873070713024, "word": "Spoofing attacks", "row_number": 2462, "definition": "A deceptive attack where a perpetrator masquerades as a trusted entity (such as an IP address, email sender, or MAC address) to gain unauthorized access or trick a user into performing a malicious action.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement security protocols such as SPF, DKIM (DomainKeys Identified Mail), and DMARC (Domain-based Message Authentication, Reporting, and Conformance) for email, and use ingress/egress filtering on routers to prevent spoofed packets from entering or leaving the network."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.13554710546240625, "y": 0.9127908134226049, "z": -0.38527900686653366, "word": "Threats/vulnerabilities: Spoofing attacks", "row_number": 2609, "definition": "A deceptive network security exploitation vector where a malicious actor falsifies protocol tracking attributes (such as constructing fake source IP addresses, forging email sender addresses, or spoofing hardware MAC addresses) to impersonate a trusted entity.", "details": [{"label": "TROUBLESHOOTING", "value": "Enable security mechanisms such as MAC (Media Access Control) address binding and port security on local hardware switches, configure robust protocol verification records including SPF (Sender Policy Framework), DKIM (DomainKeys Identified Mail), and DMARC (Domain-based Message Authentication, Reporting, and Conformance) inside public DNS (Domain Name System) record files, and activate reverse-path forwarding checks on internal routers."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.17866857200140923, "y": 0.9202581617575981, "z": -0.3481414326067833, "word": "Vulnerabilities/threats: Spoofing attacks", "row_number": 2867, "definition": "A deceptive attack technique where a malicious actor alters identity fields (such as masquerading a false source IP address, MAC [Media Access Control] address, email header, or DNS response) to appear as a trusted network host entity to bypass access controls.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the localized enterprise network switch management interface and configure advanced security filters like DHCP Snooping and Dynamic ARP (Address Resolution Protocol) Inspection (DAI) across all access ports to block unauthorized host devices from broadcasting fraudulent mapping configurations. Turn on source validation filters (such as unicast Reverse Path Forwarding [uRPF]) on edge router lines to drop spoofed IP structures."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
