: "Verify that the local workstation time is synchronized with the NTP (Network Time Protocol) server, ensure the user account is not locked, and run \u201cklist\u201d from the command line to view the currently cached Kerberos tickets."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3373634249525108, "y": 0.6679293043228964, "z": -0.6633674426221439, "word": "Logical security: Active Directory", "row_number": 1322, "definition": "A centralized directory service developed by Microsoft for Windows domain networks, storing information about user accounts, computer objects, printers, and security groups while handling network authentication and authorization policies.", "details": [{"label": "TROUBLESHOOTING", "value": "Check system network DNS IP allocations to verify hosts target the correct Active Directory domain controllers, run the command tool connection test \"nltest /sc_verify:domain_name\", and rejoin degraded endpoints to the domain framework."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.37930398903979995, "y": 0.6393248387742106, "z": -0.6688738553904053, "word": "Logical security: Group policies", "row_number": 1326, "definition": "An infrastructure management framework within Active Directory that enables administrators to configure and enforce baseline operating system configurations, security controls, and desktop policies globally across all domain-joined computers and users.", "details": [{"label": "TROUBLESHOOTING", "value": "Open an elevated command shell prompt on the target host and execute the forcing update command tool \"gpresult /h report.html\" to generate a comprehensive Group Policy configuration diagnostic report, and run \"gpupdate /force\" to refresh policies."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.33117549235856875, "y": 0.6427633916288539, "z": -0.6907807290615685, "word": "Networks: Domain controllers", "row_number": 1582, "definition": "A server on a Windows network that manages security authentication requests\u main or Workgroup).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify DNS (Domain Name System) settings, check the computer\u2019s trust relationship with the domain, and review event logs for Kerberos or authentication-related errors."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.38114387752304885, "y": 0.6512835386570479, "z": -0.6561700213367331, "word": "Servers: Authentication servers", "row_number": 2321, "definition": "A server responsible for verifying the credentials (e.g., username/password, tokens) provided by a client to grant access to network resources.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cping\u201d to check connectivity to the server, ensure the clock is synced via NTP (Network Time Protocol), and check that the \u201cKerberos\u201d or \u201cLDAP\u201d (Lightweight Directory Access Protocol) services are functioning correctly."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.34120564772262835, "y": 0.6296282300339516, "z": -0.697959166360393, "word": "Slow profile loads, troubleshooting", "row_number": 2387, "definition": "Isolating and fixing network connectivity issues, Group Policy blockages, or directory structural faults that prolong the synchronization and construction of a user workspace environment during system login.", "details": [{"label": "TROUBLESHOOTING", "value": "Launch the Command Prompt window interface and execute the tracking instruction line \u201cgpresult /h gpreport.html\u201d to generate a comprehensive web-page report highlighting the exact runtime execution duration of every active Group Policy Object (GPO); check the physical health and size metrics of roaming profile network directories, and verify that Domain Name System (DNS) server configuration assignments match internal addresses perfectly."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.3425100377845988, "y": 0.6748561250332993, "z": -0.6536482880891165, "word": "Windows 10: Computer Name/Domain Changes dialog
