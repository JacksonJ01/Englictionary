<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 170, "radius": 285.0, "nodes": [{"x": 0.8339070822744052, "y": 0.18025831686098287, "z": -0.5216377261424197, "word": "Addressing: IPv6 (Internet Protocol version 6)", "row_number": 82, "definition": "The current standard internet protocol addressing system designed to replace IPv4. IPv6 uses a 128-bit address format written as eight groups of four hexadecimal digits separated by colons (e.g., 2001:db8:0000:0000:0000:ff00:42:8329), providing a massive pool of unique addresses to accommodate global internet growth.", "details": [{"label": "TROUBLESHOOTING", "value": "Check your network adapter properties to ensure the Internet Protocol Version 6 (TCP/IPv6) checkbox is enabled; run \"ipconfig /all\" to review active configurations; verify that your internet service provider (ISP) and local edge router have IPv6 routing protocols turned on."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8272237830357744, "y": 0.19297105829780703, "z": -0.5276959194833767, "word": "CIDR (Classless Inter-Domain Routing)", "row_number": 357, "definition": "An IP (Internet Protocol) addressing scheme that improves the efficiency of address distribution by replacing fixed-length classful network architecture with Variable-Length Subnet Masks (VLSM).", "details": [{"label": "TROUBLESHOOTING", "value": "Audit the network configuration to ensure the correct subnet mask is applied, and verify that the router is correctly configured to interpret CIDR notation (e.g., '/24')."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8396801882956177, "y": 0.18656904026851337, "z": -0.5100286017441782, "word": "Classful IP addresses", "row_number": 359, "definition": "A historical method of IP (Internet Protocol) addressing that divides the IP address space into five distinct classes (A, B, C, D, and E) based on the first octet.", "details": [{"label": "TROUBLESHOOTING", "value": "Transition the network to CIDR (Classless Inter-Domain Routing)-based addressing to improve scalability and IP allocation efficiency."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8281170872233993, "y": 0.1751600013400296, "z": -0.5324857404468158, "word": "Classless IP addresses", "row_number": 360, "definition": "IP (Internet Protocol) addresses that do not follow traditional classful boundaries, allowing for flexible subnet masking.", "details": [{"label": "TROUBLESHOOTING", "value": "Standardize the subnet mask across all devices in the network segment and confirm the router configuration matches the intended network topology."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8301490614869643, "y": 0.20408589138307437, "z": -0.5188463015679, "word": "Configuring: IPv6", "row_number": 458, "definition": "Setting up a network interface to support the 128-bit addressing scheme of IPv6 (Internet Protocol version 6), designed to replace IPv4.", "details": [{"label": "TROUBLESHOOTING", "value": "Go to the adapter\u2019s 'Properties', enable 'Internet Protocol Version 6 (TCP/IPv6)', and ensure the address is either set to automatic (via SLAAC (Stateless Address Autoconfiguration)) or manually configured if required."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8416587386105433, "y": 0.17077441567965532, "z": -0.5122954876531525, "word": "IPv4 (Internet Protocol version 4)", "row_number": 1180, "definition": "The primary protocol used for communicating across the internet, using 32-bit addresses formatted as four decimal octets (e.g., 192.168.1.1).", "details": [{"label": "TROUBLESHOOTING", "value": "Verify IP settings via \u201cipconfig\u201d, check subnet mask configurations, and ensure the default gateway is set correctly for the local network segment."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8203591100065009, "y": 0.18930634686593079, "z": -0.5396054462898032, "word": "IPv4: Classful IP addresses", "row_number": 1181, "definition": "A legacy addressing scheme that divided IPv4 addresses into classes (A, B, and C) based on the first octet, dictating the default subnet mask.", "details": [{"label": "TROUBLESHOOTING", "value": "Avoid using classful assumptions in modern network design; instead, utilize CIDR (Classless Inter-Domain Routing) to define subnets specifically suited to the network size."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8406415670436944, "y": 0.1991383151942525, "z": -0.5036523475373827, "word": "IPv4: Classless IP addresses", "row_number": 1182, "definition": "A method of allocating IP addresses that allows for subnets of varying sizes using CIDR notation (e.g., /24), ignoring traditional classful boundaries.", "details": [{"label": "TROUBLESHOOTING", "value": "Calculate the subnet mask correctly based on the desired number of hosts, and apply the correct CIDR prefix in the interface settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8330937507496118, "y": 0.16215879134362107, "z": -0.5288282602621759, "word": "IPv4: IPv6 versus IPv4", "row_number": 1184, "definition": "A comparison between the older 32-bit IPv4 protocol and the newer 128-bit IPv6 (Internet Protocol version 6) protocol designed to solve address exhaustion.", "details": [{"label": "TROUBLESHOOTING", "value": "Implement dual-stack networking (where both IPv4 and IPv6 are active) or use transition mechanisms like tunneling to allow communication across different protocol environments."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8217945349082267, "y": 0.20891890047954131, "z": -0.5301005899047754, "word": "IPv6 (Internet Protocol version 6)", "row_number": 1191, "definition": "The current-generation internet protocol providing a massive address space (128-bit) and built-in security features, replacing IPv4.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201cipconfig /all\u201d (Windows) or \u201cip addr\u201d (Linux) to verify that an IPv6 address is assigned; check if the ISP supports IPv6 and that the router has IPv6 routing enabled."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8477104482586304, "y": 0.1774705751478935, "z": -0.4998911790278239, "word": "IPv6: IPv4 versus IPv6", "row_number": 1193, "definition": "The key differences between the protocols, primarily address size (32-bit vs 128-bit) and the removal of broadcast traffic in IPv6 in favor of multicast.", "details": [{"label": "TROUBLESHOOTING", "value": "Utilize transition technologies like 6to4 or ISATAP (Intra-Site Automatic Tunnel Addressing Protocol) to allow IPv6 packets to traverse IPv4-only infrastructure."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8199672534512028, "y": 0.17442839342704108, "z": -0.5451866091845549, "word": "IPv6: Loopback addresses", "row_number": 1194, "definition": "The IPv6 loopback address is \u201c::1\u201d, used for testing the local TCP/IP stack, serving the same purpose as 127.0.0.1 in IPv4.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cping ::1\u201d to verify that the local IPv6 stack is responding."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8342291926763676, "y": 0.21354880396985898, "z": -0.5083882005019179, "word": "IPv6: Truncated addresses", "row_number": 1195, "definition": "A feature of IPv6 that allows for shorthand representation of long addresses (e.g., replacing a string of zeros with \u201c::\u201d).", "details": [{"label": "TROUBLESHOOTING", "value": "Ensure only one double-colon \u201c::\u201d is used per address and that all necessary segments are accounted for; verify the address format against the network's planned schema."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8423746877428419, "y": 0.1567427289406854, "z": -0.5155934467915358, "word": "SOHO (Small Office/Home Office) networks: IPv4", "row_number": 2439, "definition": "The most widely used version of the Internet Protocol, utilizing 32-bit addresses to identify devices on a network, usually represented in decimal format (e.g., 192.168.1.1).", "details": [{"label": "TROUBLESHOOTING", "value": "Use the command \u201cipconfig /release\u201d and \u201cipconfig /renew\u201d to refresh the local IP, and ensure the router\u2019s DHCP scope has sufficient addresses available for all connected clients."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8143846410108345, "y": 0.20144537174501453, "z": -0.5442402214906271, "word": "SOHO (Small Office/Home Office) networks: IPv6", "row_number": 2440, "definition": "The newer generation of the Internet Protocol, utilizing 128-bit addresses to provide a virtually infinite supply of unique IP addresses, intended to replace the exhausted IPv4 address space.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the router has IPv6 enabled and that the ISP provides an IPv6 prefix delegation, and check client settings to ensure they are configured to obtain an IPv6 address automatically."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.848270721669315, "y": 0.1941716586666298, "z": -0.4926805757580356, "word": "Truncated addresses, IPv6", "row_number": 2722, "definition": "A simplified representation of 128-bit IPv6 (Internet Protocol version 6) addresses, created by omitting leading zeros and replacing consecutive blocks of zeros with a double colon (\u201c::\u201d).", "details": [{"label": "TROUBLESHOOTING", "value": "Manually expand the truncated address to ensure the full 128-bit structure is correct during static configuration to verify connectivity."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
