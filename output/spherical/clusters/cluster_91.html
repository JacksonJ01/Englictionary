<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 91, "radius": 285.0, "nodes": [{"x": 0.7103189089552775, "y": 0.6838367184466533, "z": -0.1667764674188086, "word": "802.1X wireless protocol", "row_number": 23, "definition": "An enterprise-grade authentication standard used to secure networks. Instead of relying on a single shared Wi-Fi password (WPA-Personal), it forces each user to authenticate uniquely via a central authentication server\u2014typically a RADIUS or TACACS+ server\u2014using corporate username/password credentials, digital certificates, or smart cards.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify physical network connectivity between the wireless access point and the backend RADIUS server; ensure the client device has the correct security certificates installed; check the server's Active Directory logs to see if the user account is locked or disabled."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7003235564433399, "y": 0.6924381302985079, "z": -0.1734253499326398, "word": "Access: WPA2 (Wi-Fi Protected Access 2)", "row_number": 38, "definition": "A widely adopted wireless security protocol introduced to replace WEP (Wired Equivalent Privacy) and WPA (Wi-Fi Protected Access). It secures network communication traffic using robust CCMP (Counter Mode Cipher Block Chaining Message Authentication Code Protocol) combined with AES (Advanced Encryption Standard) encryption.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless controller; verify the passphrase strength; upgrade routers to support longer keys; migrate highly sensitive enterprise traffic over to WPA2-Enterprise (Wi-Fi Protected Access) mode to replace shared passwords with unique per-user 802.1X network authentication tokens."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7085686949193404, "y": 0.6886106695074393, "z": -0.15409656200194333, "word": "Access: WPA3 (Wi-Fi Protected Access 3)", "row_number": 39, "definition": "The latest wireless security standard that builds upon WPA2 (Wi-Fi Protected Access 2). It introduces GCMP (Galois/Counter Mode Protocol) encryption and mandates SAE (Si e wireless radio is turned on, update the wireless network adapter driver, and confirm compatibility between the client and the access point\u2019s security settings."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.718664926496585, "y": 0.677487427241845, "z": -0.15662537901912252, "word": "Disabling: WPS", "row_number": 671, "definition": "Disabling the feature that allows devices to connect to a router via a PIN or push-button method, as WPS is notoriously vulnerable to brute-force attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s web interface, navigate to the \u201cWireless Security\u201d or \u201cWPS\u201d section, and set the \u201cWPS\u201d status to \u201cDisabled\u201d."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6999868935066204, "y": 0.6893618387219805, "z": -0.1865438399754908, "word": "Encryption protocols: AES", "row_number": 846, "definition": "Advanced Encryption Standard (AES) is a symmetric-key block cipher chosen by the U.S. government to protect classified information; it is the industry standard for Wi-Fi (WPA2/3) and hard drive encryption.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify that the network adapter and router settings are configured to use AES rather than older protocols like TKIP."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7013141688178619, "y": 0.6974903113161524, "z": -0.1471927383922468, "word": "Encryption protocols: WPA2", "row_number": 848, "definition": "Wi-Fi Protected Access 2 (WPA2) is a security protocol for wireless networks that uses the Counter Mode Cipher Block Chaining Message Authentication Code Protocol (CCMP) based on AES encryption.", "details": [{"label": "TROUBLESHOOTING", "value": "Check for firmware updates on the wireless access point, ensure the client device supports WPA2-AES, and verify that the authentication type (Personal vs. Enterprise) is correctly selected."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7207160027496704, "y": 0.6708369733921674, "z": -0.17477470786865454, "word": "Encryption protocols: WPA3", "row_number": 849, "definition": "Wi-Fi Protected Access 3 (WPA3) is the successor to WPA2, providing enhanced security features such as individualized data encryption for public Wi-Fi networks and better protection against brute-force attacks.", "details": [{"label": "TROUBLESHOOTING", "value": "Enable WPA3/WPA2 Mixed Mode on the access point to maintain compatibility with older devices, or update the wireless adapter drivers on client machines to support WPA3 protocols."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.6887238784204953, "y": 0.7032914015722959, "z": -0.17618349459556715, "word": "Security: wireless networks", "row_number": 2314, "definition": "Security measures applied to Wi-Fi networks to prevent unauthorized access and eavesdropping, including encryption and authentication protocols.", "details": [{"label": "TROUBLESHOOTING", "value": "Upgrade to WPA3 (Wi-Fi Protected Access 3), use a hidden SSID (Service Set Identifier) if necessary (though limited effectiveness), and implement MAC (Media Access Control) address filtering."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7167337878466552, "y": 0.6825020531532302, "z": -0.1431210145317977, "word": "Setting up: WPS (Wi-Fi Protected Setup), disabling", "row_number": 2337, "definition": "A network security feature that simplifies the process of connecting wireless devices but is highly susceptible to brute-force attacks; disabling it is a security best practice.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless router\u2019s web-based management interface, navigate to the \u201cWireless\u201d or \u201cSecurity\u201d settings, and toggle the \u201cWPS\u201d (Wi-Fi Protected Setup) setting to \u201cDisabled.\u201d"}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.7086580399327393, "y": 0.6787176152316609, "z": -0.1927334460153075, "word": "SOHO (Small Office/Home Office) networks: MAC filtering", "row_number": 2441, "definition": "A security feature that allows the router to restrict network access to devices based on their unique physical hardware address (MAC - Media Access Control address).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the router's \"Allowed\" or \"Blocked\" MAC address list, add the device's MAC address if it\u2019s currently blocked, and remember that MAC addresses can be spoofed, so do not rely on this as a primary security method."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6903333663329351, "y": 0.7072460702412661, "z": -0.15245602466194608, "word": "SOHO (Small Office/Home Office) networks: Security", "row_number": 2444, "definition": "The overall practice of hardening the SOHO network by implementing strong encryption (WPA3), changing default management credentials, disabling unused ports, and segmenting guest traffic.", "details": [{"label": "TROUBLESHOOTING", "value": "Change the default administrator password immediately, disable WPS (Wi-Fi Protected Setup), enable WPA3 (Wi-Fi Protected Access 3) encryption, and keep the router firmware updated to prevent exploitation of known vulnerabilities."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.727175296017837, "y": 0.6674581618663997, "z": -0.1603611268958215, "word": "TKIP", "row_number": 2620, "definition": "An obsolete, deprecated wireless security protocol standard designed to wrap around old WEP (Wired Equivalent Privacy) hardware platforms to dynamically mix encryption keys on a per-packet basis via RC4 ciphers, now thoroughly compromised and banned from modern secure networking deployments.", "details": [{"label": "TROUBLESHOOTING", "value": "Connect a management workstation to the wireless access point administration control portal using a web browser interface, locate the wireless radio security configuration field tier, click the dropdown options matrix to completely deselect any references to \u201cWPA-TKIP\u201d or hybrid mixed-modes, select pure \u201cWPA2-AES\u201d or advanced \u201cWPA3\u201d encryption settings instead, and save configurations."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.6904698363687675, "y": 0.6974851514728829, "z": -0.19174427902739877, "word": "Wireless networks: Backups", "row_number": 2970, "definition": "The administrative procedure of exporting, copying, and archiving wireless configuration profiles, network keys, service set identifier (SSID) access rules, and encryption settings over to secure backup locations to prevent data loss.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the centralized wireless access point controller administrative system dashboard via a browser. Navigate over to \"System Tools > Administration > Backup & Restore\", click the option parameter labeled \"Backup\" to download the current secure router configuration file to a secure backup directory, and archive it according to corporate safety rules."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7068664566515954, "y": 0.6942858790090892, "z": -0.1353031066509349, "word": "Wireless networks: Security", "row_number": 2975, "definition": "The deployment of cryptographic encryption mechanisms, authentication protocols (such as WPA3 Enterprise), and boundary restrictions (like media access control [MAC] filtering) to safeguard over-the-air wireless transmissions from interception and unauthorized access.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the wireless access point web console tool layout page. Navigate to wireless security parameters, disable weak old protection rules like legacy wired equivalent privacy (WEP) or Wi-Fi protected setup (WPS), change the mode rule to \"WPA3 Enterprise\" or \"WPA2 Advanced Encryption Standard (AES)\", select a strong pre-shared key or point authentication paths to a RADIUS (Remote Authentication Dial-In User Service) server, and disable network SSID broadcasting if required by corporate security profiles."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7210390597485488, "y": 0.6669774458191464, "z": -0.18773321785314415, "word": "WPA2 (Wi-Fi Protected Access version 2)", "row_number": 2988, "definition": "A widespread wireless security standard that secures over-the-air network data transmissions by enforcing Advanced Encryption Standard (AES) block ciphers and Counter Mode Cipher Block Chaining Message Authentication Code Protocol (CCMP) mechanisms to handle data confidentiality.", "details": [{"label": "TROUBLESHOOTING", "value": "Log into the wireless access point web configuration interface panel. Access the wireless security properties layout, ensure the authentication type selector is explicitly set to \"WPA2-AES\" (avoiding weak hybrid WPA/WPA2 or TKIP [Temporal Key Integrity Protocol] selections), change the pre-shared key (PSK) to a complex passphrase string of at least 16 characters, and save changes to protect wireless data."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.681947429137604, "y": 0.7118283453214218, "z": -0.16807174268620836, "word": "WPA3 (Wi-Fi Protected Access version 3)", "row_number": 2989, "definition": "The modern wireless security encryption standard that replaces legacy WPA2 by introducing Simultaneous Authentication of Equals (SAE) handshake protocols to protect against offline dictionary cracking attacks, mandating Protected Management Frames (PMF), and providing individual data encryption across open networks.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless router's web management interface by entering its local gateway IP address into a browser. Navigate to the wireless security control pane, and toggle the authentication configuration setting to \"WPA3/WPA2 Transition Mode\" to maintain strong modern security encryption while providing backwards-compatible fallback connectivity paths for older client devices."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.7261706774455045, "y": 0.6726296304285584, "z": -0.14228677903402798, "word": "WPS (Wi-Fi Protected Setup), disabling", "row_number": 2991, "definition": "The proactive security configuration practice of turning off the Wi-Fi Protected Setup protocol feature on wireless access points to eliminate a major logical vulnerability that allows malicious attackers to crack the router's 8-digit numeric PIN via automated brute-force tools and steal the wireless password.", "details": [{"label": "TROUBLESHOOTING", "value": "Open a web browser window, input the local wireless router's internal gateway IP address string into the address bar, and supply administrative login credentials. Navigate down to the \"Advanced Wireless Settings\" or \"Security\" configuration sub-menu option tab, find the configuration row checkbox labeled \"WPS\" (or \"Wi-Fi Protected Setup\"), toggle the parameter setting to \"Disabled\", click \"Save\", and restart the access point to secure the wireless perimeter."}, {"label": "CORE", "value": "CORE 2"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
