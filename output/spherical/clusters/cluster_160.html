<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 160, "radius": 285.0, "nodes": [{"x": 0.860218905562256, "y": 0.4980308281846293, "z": -0.10949305316323381, "word": "802.11 wireless protocol: Wi-Fi analyzers", "row_number": 22, "definition": "A diagnostic software tool or specialized physical hardware appliance used to scan the local airwaves. It visualizes nearby wireless networks, their respective SSID names, security protocols, signal strengths (RSSI), and specific channel usage.", "details": [{"label": "TROUBLESHOOTING", "value": "Deploy a Wi-Fi analyzer application on a mobile device or laptop; walk through the physical space to map out signal drops; identify overlapping channels from rogue access points and reconfigure your own channels based on the collected visual data graph."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8514624600702975, "y": 0.5110825371020102, "z": -0.11750029515030834, "word": "Changing: SSID", "row_number": 342, "definition": "Modifying the Service Set Identifier (the broadcasted name of a wireless network) to something other than the manufacturer default (e.g., \"Linksys\" or \"Netgear\").", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless router's administrative page; find the Wireless/WLAN (Wireless Local Area Network) settings; update the SSID to a unique, non-identifying name."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8587753065756051, "y": 0.5036128770915534, "z": -0.09422867314964867, "word": "Disabling: SSID", "row_number": 668, "definition": "The act of configuring a wireless router to stop broadcasting the network name (SSID). While not a true security measure, it hides the network from casual Wi-Fi scanners.", "details": [{"label": "TROUBLESHOOTING", "value": "Log in to the wireless router\u2019s web-based administration interface, navigate to the \u201cWireless\u201d settings, and uncheck the \u201cEnable SSID Broadcast\u201d or \u201cVisible\u201d box."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8608612094739284, "y": 0.4935360491892512, "z": -0.12385534374321623, "word": "Evil twins", "row_number": 889, "definition": "A fraudulent wireless access point that appears to be a legitimate one (often mimicking a public network or a corporate Wi-Fi name) used by attackers to intercept and steal user data.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the Service Set Identifier (SSID) and the Media Access Control (MAC) address of the access point, use a VPN (Virtual Private Network) to encrypt traffic, and inform users to avoid connecting to unencrypted Wi-Fi networks in public areas."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.846584232783977, "y": 0.5216143725644871, "z": -0.10589420728123629, "word": "iwconfig command", "row_number": 1198, "definition": "A Linux command-line utility used to configure wireless network interfaces, such as setting the SSID (Service Set Identifier) or encryption keys.", "details": [{"label": "TROUBLESHOOTING", "value": "Use \u201ciwconfig\u201d to list interfaces and current wireless settings; use \u201ciwconfig [interface] essid [name]\u201d to connect to a specific wireless network."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.8674533342173507, "y": 0.48791557513324885, "z": -0.09727848938790352, "word": "Linux: Iwconfig command", "row_number": 1283, "definition": "A dedicated wireless network interface configuration utility used in Linux to inspect and modify wireless parameters, such as the SSID (Service Set Identifier), radio frequency channel selection, and encryption variables.", "details": [{"label": "TROUBLESHOOTING", "value": "Run the command \"iwconfig\" to review wireless link metrics, and manually map access vectors by executing the connection script \"sudo iwconfig wlan0 essid \"Corporate_Net\"\"."}, {"label": "CORE", "value": "CORE 2"}]}, {"x": 0.85094892117651, "y": 0.5080517643428492, "z": -0.13330168152222255, "word": "Naming SSID", "row_number": 1541, "definition": "The unique, user-defined character string assigned to a wireless network, acting as the name used to identify the network (the Service Set Identifier (SSID)) when devices scan for available connections.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the wireless router's administrative web interface, navigate to the \u201cWireless\u201d or \u201cWLAN\u201d settings, change the SSID to a unique, non-identifying name, and ensure \u201cSSID Broadcast\u201d is set to \u201cEnabled\u201d to allow client devices to discover the network."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8524410480662695, "y": 0.5157141910898738, "z": -0.08592515743481233, "word": "Social engineering: Evil twins", "row_number": 2407, "definition": "A rogue wireless Access Point (AP) configured to masquerade as a legitimate network (using the same SSID - Service Set Identifier), designed to trick unsuspecting users into connecting so the attacker can intercept their traffic.", "details": [{"label": "TROUBLESHOOTING", "value": "Conduct periodic wireless site surveys to locate unauthorized APs, implement 802.1X certificate-based authentication to prevent clients from connecting to rogue APs, and educate users to only connect to known, secured wireless segments."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8690057020275324, "y": 0.48024584468902964, "z": -0.1191344555641057, "word": "SSID (Service Set Identifiers): Changing", "row_number": 2469, "definition": "The user-defined name of a wireless network, which is broadcasted by an AP to identify the network; changing this from the default factory name is a critical first step in securing a SOHO network.", "details": [{"label": "TROUBLESHOOTING", "value": "Access the router\u2019s web interface, navigate to the \u201cWireless\u201d settings, update the SSID to a unique, non-identifying name, and save the configuration; all client devices will need to be reconnected to the new SSID."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8412088864920011, "y": 0.5270363006776014, "z": -0.12083189585104007, "word": "SSID (Service Set Identifiers): Disabling", "row_number": 2470, "definition": "An optional security practice where the AP is configured to stop broadcasting its SSID, requiring users to manually enter the exact network name on their devices to connect.", "details": [{"label": "TROUBLESHOOTING", "value": "If you need to reconnect, manually add the network profile in the OS by typing the SSID name, encryption type, and password; remember that this is \"security through obscurity\" and should not replace robust WPA3 (Wi-Fi Protected Access 3) encryption."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": 0.8657989132942282, "y": 0.49378802345833145, "z": -0.08102857290886815, "word": "SSID (Service Set Identifiers): Naming", "row_number": 2471, "definition": "The process of assigning a unique name to a wireless network, which should be done without including any sensitive information, such as the company name, address, or router model.", "details": [{"label": "TROUBLESHOOTING", "value": "Rename the SSID to something generic and non-identifiable, such as \u201cGuest_Net\u201d or a project-specific name that does not disclose sensitive internal information."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
