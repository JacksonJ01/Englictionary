<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cluster Drilldown</title><style>body{margin:0;overflow:hidden;background:#f5f7fb;}#canvas{width:100vw;height:100vh;display:block;}#hud{position:fixed;left:16px;top:16px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid rgba(0,0,0,0.1);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,0.16);padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;width:330px;max-height:calc(100vh - 32px);overflow:auto;}#legend{margin-top:8px;}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 5px;border-radius:6px;cursor:pointer;}.row:hover{background:rgba(15,23,42,0.08);}.row.active{background:rgba(30,64,175,0.14);outline:1px solid rgba(30,64,175,0.3);}.sw{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,0.25);margin-right:6px;display:inline-block;}#tip{position:fixed;right:16px;top:240px;z-index:1001;display:none;max-width:400px;max-height:calc(100vh - 250px);overflow:auto;padding:8px 10px;background:rgba(17,24,39,0.92);color:#fff;border-radius:8px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;line-height:1.35;}</style></head><body><div id="hud"><div style="font-weight:700;">Cluster Drilldown Sphere</div><div style="margin-top:4px;">Cluster: <b id="clusterId"></b></div><div>Nodes: <b id="nodeCount"></b></div><div style="margin-top:8px;">Layout mode</div><select id="layoutMode" style="width:100%;margin-top:4px;padding:4px;border-radius:6px;border:1px solid rgba(0,0,0,0.2)"><option value="sparse">Sparse (current distribution)</option><option value="even">Even spacing</option></select><div style="margin-top:8px;">Node legend</div><div id="legend"></div></div><div id="tip"></div><canvas id="canvas"></canvas><script>(async function(){const payload={"cluster": 127, "radius": 285.0, "nodes": [{"x": -0.2608725551804762, "y": -0.9590467197961159, "z": 0.11033992569292254, "word": "Bottlenecks, storage drives", "row_number": 268, "definition": "Performance performance drops occurring when the data transfer capacity of a storage unit limits the processing speeds of other hardware components.", "details": [{"label": "TROUBLESHOOTING", "value": "Move core software applications onto faster solid-state technologies, replace legacy mechanical connections with NVMe configurations, and verify interface ports align with full structural link speeds."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.24542217764284824, "y": -0.964029266406147, "z": 0.10205649530269144, "word": "DISKSPD utility", "row_number": 678, "definition": "A storage testing tool used to measure disk performance, including input/output operations per second (IOPS) and throughput, useful for benchmarking storage systems.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute \u201cdiskspd.exe\u201d via the command line with specific parameters (e.g., \u201c-b4k -d60 -h -L -t2\u201d) to perform read/write tests and analyze the results to determine if the hardware is performing within expected specifications."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.25486242552216154, "y": -0.958721531496832, "z": 0.12608794193470438, "word": "Hard drives: Bottlenecks", "row_number": 1024, "definition": "A performance constraint where the speed of the hard drive is significantly slower than the processor or RAM, causing the system to wait for data read/write operations to finish.", "details": [{"label": "TROUBLESHOOTING", "value": "Use the \u201cPerformance Monitor\u201d tool to identify high disk queue lengths, upgrade to a faster drive (e.g., NVMe\u2014Non-Volatile Memory Express), increase RAM to reduce swapping, or spread data across multiple drives to distribute the input/output (I/O) load."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2654505678241751, "y": -0.9593860758610884, "z": 0.0954691232058041, "word": "HDD: Latency", "row_number": 1054, "definition": "The time delay that occurs while the mechanical head of a hard drive seeks the correct track and rotates to the specific sector where the data is stored.", "details": [{"label": "TROUBLESHOOTING", "value": "Latency is an inherent physical property of HDDs; to improve performance, upgrade to an SSD, as mechanical drives cannot be \"fixed\" to lower latency beyond their rotational speed limit."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.23350550886081306, "y": -0.9656479487707071, "z": 0.11401410599824317, "word": "HDD: Rotational speed", "row_number": 1055, "definition": "The speed at which the internal platters of an HDD spin, typically measured in RPM (Revolutions Per Minute), which directly impacts read/write latency and data transfer rates.", "details": [{"label": "TROUBLESHOOTING", "value": "Verify the RPM rating on the drive label; for high-performance requirements, ensure the drive is rated at 7200 RPM or higher, or migrate the high-demand data to an SSD."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.27282389914096933, "y": -0.9541811652739685, "z": 0.1229041248043762, "word": "Latency: Magnetic disk drives/HDD", "row_number": 1231, "definition": "The rotational delay component of access time on a Hard Disk Drive (HDD), defining the precise measurement of time required for the physical mechanical magnetic platters to spin and position the targeted target storage disk sector directly beneath the read/write drive head assembly.", "details": [{"label": "TROUBLESHOOTING", "value": "Execute the built-in system optimization command tool utility \"defrag\" to clean fragmented file data blocks and store them sequentially, which reduces the structural read head tracking sweeps across the rotating platters."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.24817124159598192, "y": -0.964919909000278, "z": 0.08567732523605123, "word": "Magnetic disk drives/HDD: latency", "row_number": 1383, "definition": "The measurable delay time\u2014primarily consisting of rotational delay\u2014required for the physical platter of a mechanical hard disk drive to spin around and line up the targeted data sector directly underneath the read/write head.", "details": [{"label": "TROUBLESHOOTING", "value": "Defragment the mechanical drive volume using the native \"Defragment and Optimize Drives\" tool in Windows to organize scattered file segments into clean sequential blocks, reducing overall read/write head movement delays."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2409284523435403, "y": -0.9611624612993804, "z": 0.13461130650975647, "word": "Magnetic disk drives/HDD: rotational speed", "row_number": 1384, "definition": "The design specification performance rating of an internal hard disk drive platter's spinning speed, measured in RPM (Rotations Per Minute), with standard values being 5400 RPM, 7200 RPM, 10000 RPM, or 15000 RPM.", "details": [{"label": "TROUBLESHOOTING", "value": "This is an unchangeable physical hardware performance specification. To resolve operational bottlenecks, upgrade the physical storage system by replacing the low-RPM mechanical unit with a high-performance 7200 RPM drive or a solid-state drive (SSD)."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.2808158583756897, "y": -0.9545072128884647, "z": 0.10029174556572301, "word": "Rotational speed, magnetic disk drives/HDD", "row_number": 2195, "definition": "The operational speed parameter that dictates how fast the internal circular magnetic storage platters of a mechanical hard drive rotate past the internal read/write head assemblies, measured carefully in RPM (Rotations Per Minute).", "details": [{"label": "TROUBLESHOOTING", "value": "Check the hard drive's hardware label specifications to identify its rated performance capability (standard rates include 5,400 RPM for power-efficient models, 7,200 RPM for mainstream desktops, and up to 10,000 or 15,000 RPM for enterprise server storage systems); resolve performance bottlenecks by replacing slower legacy disks with solid-state alternatives."}, {"label": "CORE", "value": "CORE 1"}]}, {"x": -0.22648960562181067, "y": -0.9690174650910228, "z": 0.09852720890111911, "word": "Storage drives: Bottlenecks", "row_number": 2488, "definition": "A performance restriction where the storage drive's read/write speed is significantly slower than the rest of the system components (like the CPU or RAM), causing overall system lag.", "details": [{"label": "TROUBLESHOOTING", "value": "Identify the active processes consuming disk I/O (Input/Output), replace a mechanical HDD (Hard Disk Drive) with an SSD (Solid-State Drive), or move the OS to a faster partition."}, {"label": "CORE", "value": "CORE 1"}]}]};document.getElementById('clusterId').textContent=payload.cluster;document.getElementById('nodeCount').textContent=payload.nodes.length;const legend=document.getElementById('legend');const layoutMode=document.getElementById('layoutMode');const tip=document.getElementById('tip');async function ensureThree(){if(window.THREE)return true;const urls=['https://unpkg.com/three@0.160.0/build/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'];for(const url of urls){const ok=await new Promise((resolve)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});if(ok&&window.THREE)return true;}return false;}if(!(await ensureThree()))return;const subclusterKey=(_n)=>'cluster nodes';const groups=new Map();for(let i=0;i<payload.nodes.length;i+=1){const k=subclusterKey(payload.nodes[i]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);}const groupEntries=Array.from(groups.entries()).sort((a,b)=>b[1].length-a[1].length);const palette=['#1d4ed8','#0f766e','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c','#4f46e5','#0369a1'];const colorByGroup=new Map(groupEntries.map((g,i)=>[g[0],palette[i%palette.length]]));let activeGroup=groupEntries.length?groupEntries[0][0]:null;legend.innerHTML=groupEntries.map(([n,idxs])=>'<div class="row" data-group="'+n+'"><span><span class="sw" style="background:'+colorByGroup.get(n)+'"></span>'+n+'</span><span>'+idxs.length+'</span></div>').join('');const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f7fb);const camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,20000);let yaw=0,pitch=0,distance=payload.radius*2.6;let dragging=false,lastX=0,lastY=0;scene.add(new THREE.AmbientLight(0xffffff,0.78));const dir=new THREE.DirectionalLight(0xffffff,0.7);dir.position.set(payload.radius*1.6,payload.radius*2.0,payload.radius*1.2);scene.add(dir);const globe=new THREE.Mesh(new THREE.SphereGeometry(payload.radius,64,64),new THREE.MeshPhongMaterial({color:0x4f7ea8,emissive:0x0d2238,shininess:16,transparent:true,opacity:0.55}));scene.add(globe);const axisHelper=new THREE.AxesHelper(payload.radius*1.3);const ac=axisHelper.geometry.getAttribute('color');ac.setXYZ(0,0.50,0.10,0.10);ac.setXYZ(1,0.50,0.10,0.10);ac.setXYZ(2,0.07,0.38,0.16);ac.setXYZ(3,0.07,0.38,0.16);ac.setXYZ(4,0.12,0.25,0.60);ac.setXYZ(5,0.12,0.25,0.60);ac.needsUpdate=true;scene.add(axisHelper);const sparse=new Float32Array(payload.nodes.length*3);const even=new Float32Array(payload.nodes.length*3);const cols=new Float32Array(payload.nodes.length*3);for(let i=0;i<payload.nodes.length;i+=1){const n=payload.nodes[i];const norm=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;const r=payload.radius*1.012;sparse[i*3]=(n.x/norm)*r;sparse[i*3+1]=(n.y/norm)*r;sparse[i*3+2]=(n.z/norm)*r;const c=new THREE.Color(colorByGroup.get(subclusterKey(n))||'#0f172a');cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}function basis(v){let ref={x:0,y:0,z:1};if(Math.abs(v.x*ref.x+v.y*ref.y+v.z*ref.z)>0.95)ref={x:0,y:1,z:0};const b1=new THREE.Vector3(v.y*ref.z-v.z*ref.y,v.z*ref.x-v.x*ref.z,v.x*ref.y-v.y*ref.x).normalize();const b2=new THREE.Vector3().crossVectors(new THREE.Vector3(v.x,v.y,v.z),b1).normalize();return[b1,b2];}for(const [name,idxs] of groupEntries){let cx=0,cy=0,cz=0;for(const idx of idxs){cx+=sparse[idx*3];cy+=sparse[idx*3+1];cz+=sparse[idx*3+2];}const v=new THREE.Vector3(cx,cy,cz).normalize();const bb=basis(v);const b1=bb[0],b2=bb[1];const golden=Math.PI*(3-Math.sqrt(5));const maxRadius=Math.min(0.45,0.02+0.0035*Math.sqrt(idxs.length));for(let i=0;i<idxs.length;i+=1){const idx=idxs[i];const radial=maxRadius*Math.sqrt((i+0.5)/idxs.length);const theta=i*golden;const ox=b1.x*radial*Math.cos(theta)+b2.x*radial*Math.sin(theta);const oy=b1.y*radial*Math.cos(theta)+b2.y*radial*Math.sin(theta);const oz=b1.z*radial*Math.cos(theta)+b2.z*radial*Math.sin(theta);const p=new THREE.Vector3(v.x+ox,v.y+oy,v.z+oz).normalize().multiplyScalar(payload.radius*1.012);even[idx*3]=p.x;even[idx*3+1]=p.y;even[idx*3+2]=p.z;}}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(sparse,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));const pointCloud=new THREE.Points(geom,new THREE.PointsMaterial({size:3,vertexColors:true,transparent:true,opacity:0.97,depthWrite:false,sizeAttenuation:false}));scene.add(pointCloud);let lineOverlay=null;function clearLines(){if(!lineOverlay)return;scene.remove(lineOverlay);lineOverlay.geometry.dispose();lineOverlay.material.dispose();lineOverlay=null;}function rebuildLines(name){clearLines();const idxs=groups.get(name)||[];if(idxs.length<2)return;const maxNodes=400;const stride=Math.max(1,Math.ceil(idxs.length/maxNodes));const sampled=[];for(let i=0;i<idxs.length;i+=stride)sampled.push(idxs[i]);const pos=geom.getAttribute('position').array;const vecs=sampled.map((idx)=>{const x=pos[idx*3],y=pos[idx*3+1],z=pos[idx*3+2];const n=Math.sqrt(x*x+y*y+z*z)||1;return{idx,x:x/n,y:y/n,z:z/n};});const edges=new Set();for(let i=0;i<vecs.length;i++){let best=-1,bestSim=-Infinity;for(let j=0;j<vecs.length;j++){if(i===j)continue;const sim=vecs[i].x*vecs[j].x+vecs[i].y*vecs[j].y+vecs[i].z*vecs[j].z;if(sim>bestSim){bestSim=sim;best=j;}}if(best>=0){const a=Math.min(i,best),b=Math.max(i,best);edges.add(a+'-'+b);}}const lv=[];for(const key of edges){const ab=key.split('-').map(Number);const pa=vecs[ab[0]].idx,pb=vecs[ab[1]].idx;lv.push(pos[pa*3],pos[pa*3+1],pos[pa*3+2],pos[pb*3],pos[pb*3+1],pos[pb*3+2]);}const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));const lm=new THREE.LineBasicMaterial({color:new THREE.Color(colorByGroup.get(name)||'#0f172a'),transparent:true,opacity:0.35,depthWrite:false});lineOverlay=new THREE.LineSegments(lg,lm);scene.add(lineOverlay);}function applyLayout(mode){const src=mode==='even'?even:sparse;geom.setAttribute('position',new THREE.Float32BufferAttribute(src,3));geom.attributes.position.needsUpdate=true;rebuildLines(activeGroup);}legend.addEventListener('click',(evt)=>{const row=evt.target.closest('.row');if(!row)return;activeGroup=row.dataset.group;legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));rebuildLines(activeGroup);});legend.querySelectorAll('.row').forEach((r)=>r.classList.toggle('active',r.dataset.group===activeGroup));layoutMode.addEventListener('change',()=>applyLayout(layoutMode.value));applyLayout('sparse');const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=4.0;const mouse=new THREE.Vector2();function setMouse(evt){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((evt.clientX-rect.left)/rect.width)*2-1;mouse.y=-((evt.clientY-rect.top)/rect.height)*2+1;}renderer.domElement.addEventListener('mousemove',(evt)=>{setMouse(evt);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(pointCloud);if(!hits.length){tip.style.display='none';return;}const idx=hits[0].index;const info=payload.nodes[idx];tip.innerHTML='<b>'+info.word+'</b><br>row: '+info.row_number+(info.definition?'<br>'+String(info.definition).slice(0,220):'');tip.style.display='block';});renderer.domElement.addEventListener('mousedown',(evt)=>{dragging=true;lastX=evt.clientX;lastY=evt.clientY;});window.addEventListener('mouseup',()=>{dragging=false;});window.addEventListener('mousemove',(evt)=>{if(!dragging)return;const dx=evt.clientX-lastX,dy=evt.clientY-lastY;lastX=evt.clientX;lastY=evt.clientY;yaw-=dx*0.0038;pitch-=dy*0.0038;pitch=Math.max(-1.35,Math.min(1.35,pitch));});renderer.domElement.addEventListener('wheel',(evt)=>{evt.preventDefault();distance*=evt.deltaY>0?0.94:1.06;distance=Math.max(payload.radius*1.1,Math.min(payload.radius*8.0,distance));},{passive:false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});(function animate(){requestAnimationFrame(animate);camera.position.x=distance*Math.cos(pitch)*Math.sin(yaw);camera.position.y=distance*Math.sin(pitch);camera.position.z=distance*Math.cos(pitch)*Math.cos(yaw);camera.lookAt(0,0,0);renderer.render(scene,camera);})();})();<\/script></body></html>
