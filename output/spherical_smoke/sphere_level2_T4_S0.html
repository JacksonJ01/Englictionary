            const node = hits[0].object.userData;
            const clickable = node.next_page && node.next_page.length > 0;
            tooltip.innerHTML = `<b>${node.label}</b><br>type: ${node.node_type}<br>size: ${node.size}<br>depth: ${node.depth}${clickable ? '<br><i>click to zoom in</i>' : ''}`;
            tooltip.style.display = 'block';
            tooltip.style.left = (evt.clientX + 14) + 'px';
            tooltip.style.top = (evt.clientY + 14) + 'px';
            renderer.domElement.style.cursor = clickable ? 'pointer' : 'default';
        }

        function clickNode(evt) {
            setMouseFromEvent(evt);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (!hits.length) return;
            const node = hits[0].object.userData;
            if (node.next_page && node.next_page.length > 0) {
                window.location.href = node.next_page;
            }
        }

        renderer.domElement.addEventListener('mousemove', hoverNode);
        renderer.domElement.addEventListener('click', clickNode);
        renderer.domElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            renderer.domElement.style.cursor = 'grab';
        });

        renderer.domElement.addEventListener('mousedown', (evt) => {
            dragging = true;
            lastX = evt.clientX;
            lastY = evt.clientY;
            renderer.domElement.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            dragging = false;
            renderer.domElement.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', (evt) => {
            if (!dragging) return;
            const dx = evt.clientX - lastX;
            const dy = evt.clientY - lastY;
            lastX = evt.clientX;
            lastY = evt.clientY;
            yaw -= dx * 0.004;
            pitch -= dy * 0.004;
            pitch = Math.max(-1.3, Math.min(1.3, pitch));
        });

        renderer.domElement.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            cameraDistance *= evt.deltaY > 0 ? 1.06 : 0.94;
            cameraDistance = Math.max(8, Math.min(140, cameraDistance));
        }, { passive: false });

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        renderer.domElement.style.cursor = 'grab';
        (function animate() {
            requestAnimationFrame(animate);
            camera.position.x = cameraDistance * Math.cos(pitch) * Math.sin(yaw);
            camera.position.y = cameraDistance * Math.sin(pitch);
            camera.position.z = cameraDistance * Math.cos(pitch) * Math.cos(yaw);
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        })();
        } catch (error) {
            showStatus('Renderer error: ' + (error && error.message ? error.message : error));
            console.error(error);
        }
    })();
    </script>
</body>
</html>
