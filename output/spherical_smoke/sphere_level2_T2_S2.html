<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spherical Semantic Globe - Level 2 (Subcluster 2.2: Abiogeny)</title>
  <style>
        body { margin: 0; background: #f5f7fb; overflow: hidden; }
        #viewport { width: 100vw; height: 100vh; display: block; }
        #tooltip {
            position: fixed;
            display: none;
            pointer-events: none;
            z-index: 10001;
            max-width: 320px;
            padding: 8px 10px;
            background: rgba(17, 24, 39, 0.92);
            color: #ffffff;
            border-radius: 8px;
            font-family: Segoe UI, Arial, sans-serif;
            font-size: 12px;
            line-height: 1.35;
            box-shadow: 0 8px 20px rgba(0,0,0,0.28);
        }
  </style>
</head>
<body>
  <aside style="position:fixed;top:18px;left:18px;z-index:9999;max-width:360px;padding:14px 16px;background:rgba(255,255,255,0.95);border:1px solid rgba(0,0,0,0.08);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,0.12);font-family:Segoe UI,Arial,sans-serif;"><div style="font-weight:700;margin-bottom:6px;">Spherical Semantic Globe - Level 2 (Subcluster 2.2: Abiogeny)</div><div style="font-size:13px;line-height:1.45;">Click a cluster to open its child level. Hover to inspect nodes.</div><div style="margin-top:10px;font-size:12px;"><a href="sphere_level0.html" style="margin-right:8px;color:#1d4ed8;text-decoration:none;">Level 0</a><a href="sphere_level1_T2.html" style="margin-right:8px;color:#1d4ed8;text-decoration:none;">Level 1 Cluster 2: Abdomen</a></div><a href="sphere_level1_T2.html" style="display:inline-block;margin-top:8px;color:#0f766e;text-decoration:none;">Zoom out</a></aside>
    <div id="tooltip"></div>
    <canvas id="viewport"></canvas>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script>
    (function() {
        const nodes = [{"node_id": "T2", "parent_id": "ROOT", "label": "Cluster 2: Abdomen", "node_type": "cluster", "size": 214, "depth": 0, "next_page": "", "color": "#1d4ed8", "x": 4.078820534283824, "y": 5.910746129406007, "z": 6.958901008263915, "r": 0.45999999999999996}, {"node_id": "T2_S2", "parent_id": "T2", "label": "Subcluster 2.2: Abiogeny", "node_type": "subcluster", "size": 1, "depth": 1, "next_page": "", "color": "#1d4ed8", "x": 5.550227446961612, "y": 5.452103175175373, "z": 7.25804011109312, "r": 0.15503737094330292}, {"node_id": "W307", "parent_id": "T2_S2", "label": "Abiogeny", "node_type": "word", "size": 1, "depth": 2, "next_page": "", "color": "#1d4ed8", "x": 5.884075714448024, "y": 5.7800492308250195, "z": 7.694613952361878, "r": 0.15503737094330292}];
        const edges = [{"sx": 4.078820534283824, "sy": 5.910746129406007, "sz": 6.958901008263915, "tx": 5.550227446961612, "ty": 5.452103175175373, "tz": 7.25804011109312, "secondary": false}, {"sx": 5.550227446961612, "sy": 5.452103175175373, "sz": 7.25804011109312, "tx": 5.884075714448024, "ty": 5.7800492308250195, "tz": 7.694613952361878, "secondary": false}];

        const canvas = document.getElementById('viewport');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f7fb);

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(0, 0, 32);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 6;
        controls.maxDistance = 120;

        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const directional = new THREE.DirectionalLight(0xffffff, 0.78);
        directional.position.set(18, 24, 20);
        scene.add(directional);

        // Earth-like globe surface
        const globe = new THREE.Mesh(
            new THREE.SphereGeometry(10, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x5b84b1,
                emissive: 0x0b2440,
                shininess: 18,
                transparent: true,
                opacity: 0.88,
            })
        );
        scene.add(globe);

        const wire = new THREE.Mesh(
            new THREE.SphereGeometry(10.01, 32, 24),
            new THREE.MeshBasicMaterial({ color: 0xd8e5f3, wireframe: true, transparent: true, opacity: 0.16 })
        );
        scene.add(wire);

        const nodeMeshes = [];
        for (const node of nodes) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(node.r, 14, 12),
                new THREE.MeshStandardMaterial({ color: node.color, roughness: 0.42, metalness: 0.12 })
            );
            mesh.position.set(node.x, node.y, node.z);
            mesh.userData = node;
            scene.add(mesh);
            nodeMeshes.push(mesh);
        }

        for (const edge of edges) {
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(edge.sx, edge.sy, edge.sz),
                new THREE.Vector3(edge.tx, edge.ty, edge.tz),
            ]);
            const material = new THREE.LineBasicMaterial({
                color: edge.secondary ? 0xb08fd3 : 0x8ea4bf,
                transparent: true,
                opacity: edge.secondary ? 0.18 : 0.34,
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        const tooltip = document.getElementById('tooltip');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function setMouseFromEvent(evt) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function hoverNode(evt) {
            setMouseFromEvent(evt);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (!hits.length) {
                tooltip.style.display = 'none';
                renderer.domElement.style.cursor = 'grab';
                return;
            }

            const node = hits[0].object.userData;
            const clickable = node.next_page && node.next_page.length > 0;
            tooltip.innerHTML = `<b>${node.label}</b><br>type: ${node.node_type}<br>size: ${node.size}<br>depth: ${node.depth}${clickable ? '<br><i>click to zoom in</i>' : ''}`;
            tooltip.style.display = 'block';
            tooltip.style.left = (evt.clientX + 14) + 'px';
            tooltip.style.top = (evt.clientY + 14) + 'px';
            renderer.domElement.style.cursor = clickable ? 'pointer' : 'default';
        }

        function clickNode(evt) {
            setMouseFromEvent(evt);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (!hits.length) return;
            const node = hits[0].object.userData;
            if (node.next_page && node.next_page.length > 0) {
                window.location.href = node.next_page;
            }
        }

        renderer.domElement.addEventListener('mousemove', hoverNode);
        renderer.domElement.addEventListener('click', clickNode);
        renderer.domElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            renderer.domElement.style.cursor = 'grab';
        });

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        renderer.domElement.style.cursor = 'grab';
        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    })();
    </script>
</body>
</html>
