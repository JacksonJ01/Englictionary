        camera.position.set(0, 0, 32);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 6;
        controls.maxDistance = 120;

        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const directional = new THREE.DirectionalLight(0xffffff, 0.78);
        directional.position.set(18, 24, 20);
        scene.add(directional);

        // Earth-like globe surface
        const globe = new THREE.Mesh(
            new THREE.SphereGeometry(10, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x5b84b1,
                emissive: 0x0b2440,
                shininess: 18,
                transparent: true,
                opacity: 0.88,
            })
        );
        scene.add(globe);

        const wire = new THREE.Mesh(
            new THREE.SphereGeometry(10.01, 32, 24),
            new THREE.MeshBasicMaterial({ color: 0xd8e5f3, wireframe: true, transparent: true, opacity: 0.16 })
        );
        scene.add(wire);

        const nodeMeshes = [];
        for (const node of nodes) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(node.r, 14, 12),
                new THREE.MeshStandardMaterial({ color: node.color, roughness: 0.42, metalness: 0.12 })
            );
            mesh.position.set(node.x, node.y, node.z);
            mesh.userData = node;
            scene.add(mesh);
            nodeMeshes.push(mesh);
        }

        for (const edge of edges) {
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(edge.sx, edge.sy, edge.sz),
                new THREE.Vector3(edge.tx, edge.ty, edge.tz),
            ]);
            const material = new THREE.LineBasicMaterial({
                color: edge.secondary ? 0xb08fd3 : 0x8ea4bf,
                transparent: true,
                opacity: edge.secondary ? 0.18 : 0.34,
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        const tooltip = document.getElementById('tooltip');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function setMouseFromEvent(evt) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function hoverNode(evt) {
            setMouseFromEvent(evt);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (!hits.length) {
                tooltip.style.display = 'none';
                renderer.domElement.style.cursor = 'grab';
                return;
            }

            const node = hits[0].object.userData;
            const clickable = node.next_page && node.next_page.length > 0;
            tooltip.innerHTML = `<b>${node.label}</b><br>type: ${node.node_type}<br>size: ${node.size}<br>depth: ${node.depth}${clickable ? '<br><i>click to zoom in</i>' : ''}`;
            tooltip.style.display = 'block';
            tooltip.style.left = (evt.clientX + 14) + 'px';
            tooltip.style.top = (evt.clientY + 14) + 'px';
            renderer.domElement.style.cursor = clickable ? 'pointer' : 'default';
        }

        function clickNode(evt) {
            setMouseFromEvent(evt);
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (!hits.length) return;
            const node = hits[0].object.userData;
            if (node.next_page && node.next_page.length > 0) {
                window.location.href = node.next_page;
            }
        }

        renderer.domElement.addEventListener('mousemove', hoverNode);
        renderer.domElement.addEventListener('click', clickNode);
        renderer.domElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            renderer.domElement.style.cursor = 'grab';
        });

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        renderer.domElement.style.cursor = 'grab';
        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    })();
    </script>
</body>
</html>
